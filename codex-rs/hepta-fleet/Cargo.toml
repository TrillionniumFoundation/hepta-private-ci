[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-fleet"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_fleet"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
qualification = []

[dependencies]
codex-hepta-contracts = { workspace = true }
codex-hepta-paths = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
trnm-release-bundle = { git = "https://github.com/TrillionniumFoundation/Trillionnium-Chain.git", rev = "62cb191a9aad3d7effad9336fac2a72c4c255029" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
