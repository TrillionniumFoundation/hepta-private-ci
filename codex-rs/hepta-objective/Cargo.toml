[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-objective"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_objective"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = []
# Explicitly opt-in compatibility surface for qualification fixtures only.
# Production consumers must enter through authenticated admission.
qualification-legacy-compiler = []

[dependencies]
codex-hepta-types = { path = "../hepta-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
