[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-objective"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_objective"
path = "src/lib.rs"
doctest = false

[features]
default = []
# Qualification-only compatibility surface. Production callers must use authenticated admission.
qualification-legacy-objective-compile = []

[lints]
workspace = true

[dependencies]
codex-hepta-types = { path = "../hepta-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
