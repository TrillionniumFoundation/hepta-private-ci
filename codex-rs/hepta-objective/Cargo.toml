[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-objective"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_objective"
path = "src/lib.rs"
doctest = false

[features]
default = []
# Raw-profile admission/convenience compatibility is unavailable to ordinary
# product builds. Product code uses a generation-frozen
# ValidatedAdmissionProfileV1 and compile_authoritative_objective_v1.
objective-compatibility-api = []
# Explicitly qualification-only legacy compile surface. Enabling it also enables
# the raw compatibility API required by historical parity fixtures.
qualification-legacy-compile = ["objective-compatibility-api"]

[lints]
workspace = true

[dependencies]
codex-hepta-types = { path = "../hepta-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
