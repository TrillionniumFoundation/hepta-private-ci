[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-objective"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_objective"
path = "src/lib.rs"
doctest = false

[features]
default = []
# Explicitly qualification-only compatibility surface. Product code must use
# ValidatedAdmissionProfileV1 + compile_authoritative_objective_v1; diagnostics
# must use preflight_validate_objective_v1 and must not publish its result.
qualification-legacy-compile = []

[lints]
workspace = true

[dependencies]
codex-hepta-types = { path = "../hepta-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
