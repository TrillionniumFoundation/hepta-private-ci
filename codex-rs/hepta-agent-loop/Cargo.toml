[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-agent-loop"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_agent_loop"
path = "src/lib.rs"
doctest = false

[features]
automation-effects = ["taskflow-owner", "dep:codex-hepta-contracts"]
taskflow-owner = ["dep:codex-hepta-automation", "dep:serde", "dep:serde_json"]
managed-responses = ["responses-api", "dep:codex-extension-api", "dep:codex-http-client", "dep:codex-login", "dep:codex-model-provider", "dep:tracing", "tokio/rt"]
responses-api = ["dep:codex-api", "dep:codex-protocol", "dep:futures", "dep:serde_json"]
context-v2 = ["dep:codex-hepta-context-compiler"]

[lints]
workspace = true

[dependencies]
codex-hepta-contracts = { workspace = true, optional = true }
codex-hepta-automation = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
tracing = { workspace = true, optional = true }
codex-model-provider = { workspace = true, optional = true }
codex-login = { workspace = true, optional = true }
codex-http-client = { workspace = true, optional = true }
codex-extension-api = { workspace = true, optional = true }
codex-api = { workspace = true, optional = true }
codex-protocol = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
codex-hepta-context-compiler = { path = "../hepta-context-compiler", optional = true }
codex-hepta-types = { path = "../hepta-types" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
tempfile = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-hepta-fleet = { workspace = true }
codex-hepta-contracts = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }
