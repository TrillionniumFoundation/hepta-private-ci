[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-learning-ledger"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_learning_ledger"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = []
qualification-legacy-write = []
qualification-ack-only-recovery = ["dep:rustix"]

[dependencies]
codex-hepta-intuition = { path = "../hepta-intuition" }
codex-hepta-memory-retrieval = { path = "../hepta-memory-retrieval" }
codex-hepta-types = { path = "../hepta-types" }

ed25519-dalek = { workspace = true }
rustix = { workspace = true, optional = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
