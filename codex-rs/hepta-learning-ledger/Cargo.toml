[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-learning-ledger"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_learning_ledger"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = []
qualification-legacy-write = []
# Opt-in Linux calibration controllers. They never grant activation authority.
review-host = []

[dependencies]
codex-hepta-intuition = { path = "../hepta-intuition" }
codex-hepta-memory-retrieval = { path = "../hepta-memory-retrieval" }
codex-hepta-types = { path = "../hepta-types" }

ed25519-dalek = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[[bin]]
name = "hepta-evolution-review"
path = "src/bin/hepta-evolution-review.rs"
required-features = ["review-host"]
test = false

[[bin]]
name = "hepta-native-generator"
path = "src/bin/hepta-native-generator.rs"
required-features = ["review-host"]
test = false

[[bin]]
name = "hepta-custody-evaluator"
path = "src/bin/hepta-custody-evaluator.rs"
required-features = ["review-host"]
test = false
