[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-memory"
version.workspace = true

[lib]
name = "codex_hepta_memory"
path = "src/lib.rs"
doctest = false

# Keep the workspace lint contract explicit for this owner crate. The four
# package-local exceptions below are deliberately narrow: two preserve
# transaction-shaped owner APIs, one covers deterministic test fixtures, and
# two are formatting-only cleanups outside the memory.federation semantics.
# The qualification command still runs every selected target with `-D warnings`.
[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
# Deterministic test fixtures fail immediately on setup errors. Production
# targets in this crate contain no `expect` calls under the current matrix.
expect_used = { level = "allow", priority = 1 }
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
# These messages remain stable inputs to existing product and operator tests;
# changing interpolation style has no authority or execution semantic effect.
uninlined_format_args = { level = "allow", priority = 1 }
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"
# The two flagged functions deliberately carry the complete owner transaction
# binding instead of hiding fields in a second mutable authority object.
too_many_arguments = { level = "allow", priority = 1 }
# One selected V2 collection call spells out `into_iter()` to make ownership
# transfer explicit; this is behavior-neutral and remains inside the same path.
useless_conversion = { level = "allow", priority = 1 }

[dependencies]
base64 = { workspace = true }
codex-hepta-cognitive-read = { path = "../hepta-cognitive-read" }
codex-hepta-cognitive-types = { path = "../hepta-cognitive-types" }
codex-hepta-memory-retrieval = { path = "../hepta-memory-retrieval" }
codex-hepta-contracts = { workspace = true }
codex-hepta-memory-federation = { path = "../hepta-memory-federation" }
codex-hepta-kg = { path = "../hepta-kg" }
codex-hepta-paths = { workspace = true }
codex-hepta-operations = { path = "../hepta-operations" }
codex-hepta-types = { path = "../hepta-types" }
codex-state = { workspace = true }
codex-utils-absolute-path = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }
futures = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
unicode-segmentation = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
