[package]
name = "codex-utils-time"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
time = { workspace = true, features = ["large-dates"] }

[target.'cfg(unix)'.dependencies]
iana-time-zone = { workspace = true }
tz-rs = "=0.7.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Time"] }

[target.'cfg(all(target_arch = "wasm32", not(any(target_os = "emscripten", target_os = "wasi", target_os = "linux"))))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lib]
doctest = false
