[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-evidence"
version.workspace = true

[lib]
name = "codex_hepta_evidence"
path = "src/lib.rs"
doctest = false

[features]
default = ["runtime"]
runtime = ["dep:codex-hepta-authbus", "dep:codex-state", "dep:sqlx", "dep:tokio"]

[lints]
workspace = true

[dependencies]
codex-hepta-authbus = { optional = true, path = "../hepta-authbus" }
codex-hepta-contracts = { workspace = true }
codex-hepta-types = { workspace = true }
codex-state = { optional = true, workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { optional = true, workspace = true }
thiserror = { workspace = true }
tokio = { optional = true, workspace = true, features = ["sync"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
codex-utils-absolute-path = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
