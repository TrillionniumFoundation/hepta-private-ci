[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-evidence"
version.workspace = true

[lib]
name = "codex_hepta_evidence"
path = "src/lib.rs"
doctest = true

[features]
default = []
# Enables raw issuer/binding adapters only for downstream integration tests.
# Product and release builds never enable this non-default feature.
test-support = []

[lints]
workspace = true

[dependencies]
codex-hepta-authbus = { path = "../hepta-authbus" }
codex-hepta-contracts = { workspace = true }
codex-hepta-types = { workspace = true }
codex-state = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
codex-utils-absolute-path = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
