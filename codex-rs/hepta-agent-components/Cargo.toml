[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-agent-components"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_agent_components"
path = "src/lib.rs"
doctest = false
test = false

[features]
default = []
fixed-eval-host = ["codex-hepta-intelligence-eval/fixed-eval-host", "dep:serde", "dep:serde_json"]
qualification-legacy-learning-write = ["codex-hepta-learning-ledger/qualification-legacy-write"]
qualification-unverified-operator-input = ["codex-hepta-bellman-operator/qualification-unverified-input"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
codex-hepta-infer-core = { path = "../hepta-infer-core" }
codex-hepta-automation = { workspace = true }
codex-hepta-bellman-operator = { path = "../hepta-bellman-operator" }
codex-hepta-learning-artifacts = { path = "../hepta-learning-artifacts" }
codex-hepta-intelligence = { path = "../hepta-intelligence" }
codex-hepta-intuition = { path = "../hepta-intuition" }
codex-hepta-learning-ledger = { path = "../hepta-learning-ledger" }
codex-hepta-authbus = { path = "../hepta-authbus" }
codex-hepta-evidence = { workspace = true }
codex-hepta-contracts = { workspace = true }
codex-hepta-codex-adapter = { workspace = true }
codex-hepta-prompt-registry = { path = "../hepta-prompt-registry" }
codex-hepta-prompt-optimizer = { path = "../hepta-prompt-optimizer" }
codex-hepta-cognitive-read = { path = "../hepta-cognitive-read" }
codex-hepta-cognitive-store = { path = "../hepta-cognitive-store" }
codex-hepta-control-plane = { path = "../hepta-control-plane" }
codex-hepta-types = { path = "../hepta-types" }
codex-hepta-fleet = { workspace = true }
codex-hepta-intelligence-eval = { path = "../hepta-intelligence-eval" }
codex-hepta-ndu = { path = "../hepta-ndu" }
codex-hepta-neuron = { path = "../hepta-neuron" }
codex-hepta-objective = { path = "../hepta-objective" }
codex-hepta-context-compiler = { path = "../hepta-context-compiler" }
codex-hepta-memory = { workspace = true }
codex-hepta-memory-retrieval = { path = "../hepta-memory-retrieval" }
codex-hepta-memory-extension = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-hepta-plasticity = { path = "../hepta-plasticity" }
codex-hepta-cognitive-types = { path = "../hepta-cognitive-types" }

[[test]]
name = "frozen_generator_wire"
path = "tests/frozen_generator_wire.rs"
required-features = ["fixed-eval-host"]
