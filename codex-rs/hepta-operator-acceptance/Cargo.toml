[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-operator-acceptance"
version.workspace = true
publish = false

# cargo-shear's static source parser misses winapi-util behind the nested
# #[cfg(windows)] mod durable::windows (#[path = "durable_windows.rs"]).
# This is NOT an unused dependency: FileSnapshot::capture must call
# winapi_util::file::information on the same already-open OS handle to
# reject reparse points and hard links. Removing it weakens the native
# Windows acceptance boundary or makes the Windows build fail.
# This exception affects only unused-dependency static analysis in this
# single package. cargo-deny and RustSec advisories remain unwaived.
[package.metadata.cargo-shear]
ignored = ["winapi-util"]

[lib]
name = "codex_hepta_operator_acceptance"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hepta-operator-acceptance"
path = "src/main.rs"
test = false

[[bin]]
name = "hepta-g5-trust-assessor"
path = "src/g5_main.rs"
test = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi-util = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
