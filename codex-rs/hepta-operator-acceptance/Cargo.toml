[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-operator-acceptance"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_operator_acceptance"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hepta-operator-acceptance"
path = "src/main.rs"
test = false

[[bin]]
name = "hepta-g5-trust-assessor"
path = "src/g5_main.rs"
test = false

# cargo-shear 1.11.2 does not descend into #[cfg(windows)] modules
# declared with #[path = "durable_windows.rs"]. This is not an unused
# dependency: durable_windows.rs calls winapi_util::file::information on
# the *actual opened handle* to reject symlink/reparse/hard-link substitution.
# Keep this package-local analyzer exception without changing Cargo's
# platform dependency, cargo-deny advisories, or Windows tests.
[package.metadata.cargo-shear]
ignored = ["winapi-util"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi-util = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
