[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-automation"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_automation"
path = "src/lib.rs"
test = true
doctest = false

[features]
default = ["runtime"]
runtime = ["dep:codex-hepta-operations", "dep:codex-hepta-paths", "dep:codex-hepta-types", "dep:codex-state", "dep:codex-utils-absolute-path", "dep:sha2", "dep:sqlx", "dep:tokio"]
# Opt-in structural TaskFlow replay/frontier qualification for the separate
# taskflow_kernel helpers. The durable production step outbox is default code
# and remains authority-free by itself.
taskflow-structural-qualification = ["runtime"]

[lints]
workspace = true

[dependencies]
codex-hepta-contracts = { workspace = true }
codex-hepta-operations = { optional = true, workspace = true }
codex-hepta-paths = { optional = true, workspace = true }
codex-hepta-types = { optional = true, workspace = true }
codex-state = { optional = true, workspace = true }
codex-utils-absolute-path = { optional = true, workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { optional = true, workspace = true }
sqlx = { optional = true, workspace = true }
thiserror = { workspace = true }
tokio = { optional = true, workspace = true, features = ["sync", "time"] }
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
codex-hepta-fleet = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
