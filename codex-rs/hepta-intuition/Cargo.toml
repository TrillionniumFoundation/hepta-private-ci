[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-intuition"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_intuition"
path = "src/lib.rs"
doctest = false

[features]
# Historical V1/V2 decision functions remain available for replay, shadow
# qualification and downstream migration. Product serving paths must use the
# production contract and authenticated V3 admission.
default = ["legacy-intuition-api"]
legacy-intuition-api = []

[lints]
workspace = true

[dependencies]
codex-hepta-types = { path = "../hepta-types" }
