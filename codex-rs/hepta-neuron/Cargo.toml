[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-neuron"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_neuron"
path = "src/lib.rs"
doctest = false

[features]
qualification-file-observation = ["codex-hepta-infer-core/qualification-file-observation"]

[lints]
workspace = true

[dependencies]
codex-hepta-infer-core = { path = "../hepta-infer-core" }
codex-hepta-types = { path = "../hepta-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
codex-hepta-infer-core = { path = "../hepta-infer-core", features = ["qualification-file-observation"] }
pretty_assertions = { workspace = true }
