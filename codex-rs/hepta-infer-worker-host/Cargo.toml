[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-infer-worker-host"
version.workspace = true
publish = false

[package.metadata.cargo-shear]
# smollm_neural_study_tests includes hepta-agentd/cognitive_process_materials.rs
# by #[path]; its TabularPayloadPinV1 conversions use this dev-dependency.
ignored = ["codex-hepta-bellman-operator"]

[lib]
name = "codex_hepta_infer_worker_host"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-hepta-types = { path = "../hepta-types" }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-hepta-agentd = { workspace = true }
codex-hepta-learning-artifacts = { path = "../hepta-learning-artifacts" }
codex-hepta-authbus = { path = "../hepta-authbus" }
codex-hepta-codex-adapter = { path = "../hepta-codex-adapter" }
codex-hepta-contracts = { workspace = true }
codex-hepta-memory = { workspace = true }
codex-hepta-operations = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { workspace = true }
codex-hepta-infer-core = { path = "../hepta-infer-core" }
sha2 = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
codex-hepta-bellman-operator = { path = "../hepta-bellman-operator" }
codex-hepta-intelligence-eval = { path = "../hepta-intelligence-eval" }
codex-hepta-learning-ledger = { path = "../hepta-learning-ledger" }
codex-hepta-fleet = { workspace = true }
core_test_support = { workspace = true }

ed25519-dalek = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
codex-state = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
codex-app-server-client = { workspace = true, features = ["test-support"] }
