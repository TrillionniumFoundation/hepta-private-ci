[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-infer-worker-host"
version.workspace = true
publish = false

[features]
default = []
local-model-experimental = []
legacy-local-model-boundary = []
composition-model-driver-qualification = ["legacy-local-model-boundary"]

[lib]
name = "codex_hepta_infer_worker_host"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
ed25519-dalek = { workspace = true }
codex-hepta-types = { path = "../hepta-types" }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-hepta-agentd = { workspace = true }
codex-hepta-codex-adapter = { path = "../hepta-codex-adapter" }
codex-hepta-contracts = { workspace = true }
codex-utils-absolute-path = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
codex-hepta-infer-core = { path = "../hepta-infer-core" }
codex-hepta-neuron = { path = "../hepta-neuron" }
sha2 = { workspace = true }

[dev-dependencies]
codex-hepta-infer-core = { path = "../hepta-infer-core", features = ["qualification-owned-file-read"] }
codex-utils-cargo-bin = { workspace = true }
core_test_support = { workspace = true }

tempfile = { workspace = true }
codex-app-server-client = { workspace = true, features = ["test-support"] }

[[test]]
name = "generation_owner_execution"
path = "tests/generation_owner_execution.rs"
required-features = ["composition-model-driver-qualification"]
