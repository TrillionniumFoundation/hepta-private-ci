[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-infer-worker-host"
version.workspace = true

[[bin]]
name = "hepta-infer-worker"
path = "src/bin/hepta-infer-worker.rs"

[lib]
name = "codex_hepta_infer_worker_host"
path = "src/lib.rs"

[features]
default = []
# The local-model surface is deliberately opt-in until real weights, device,
# memory, crash-recovery and target-host evidence are independently qualified.
local-model-experimental = []

[lints]
workspace = true

[dependencies]
base64 = "0.22"
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-hepta-agentd = { workspace = true }
codex-hepta-cognitive-read = { workspace = true }
codex-hepta-codex-adapter = { workspace = true }
codex-hepta-contracts = { workspace = true }
codex-hepta-infer-core = { workspace = true }
codex-hepta-types = { workspace = true }
codex-utils-absolute-path = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "time"] }
tokio-util = { workspace = true }
