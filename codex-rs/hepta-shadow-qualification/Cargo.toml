[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-shadow-qualification"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_shadow_qualification"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hepta-shadow-live-trial"
path = "src/bin/hepta-shadow-live-trial.rs"
test = false

[lints]
workspace = true

[dependencies]
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = { workspace = true }

[dev-dependencies]
codex-hepta-bellman-operator = { path = "../hepta-bellman-operator" }
codex-hepta-intelligence-eval = { path = "../hepta-intelligence-eval" }
codex-hepta-learning-artifacts = { path = "../hepta-learning-artifacts" }
codex-hepta-learning-ledger = { path = "../hepta-learning-ledger" }
codex-hepta-ndu = { path = "../hepta-ndu" }
codex-hepta-objective = { path = "../hepta-objective" }
codex-hepta-types = { path = "../hepta-types" }
codex-hepta-wire = { path = "../hepta-wire" }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
