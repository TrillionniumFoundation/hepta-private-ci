[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-matrixd"
version.workspace = true
publish = false

[features]
default = []
real-synapse-e2e = ["codex-hepta-matrix-sdk/qualification-failpoints"]

[lib]
name = "codex_hepta_matrixd"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-hepta-matrixd"
path = "src/main.rs"
test = false

[[test]]
name = "real_synapse_e2e"
path = "tests/real_synapse_e2e.rs"
required-features = ["real-synapse-e2e"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-hepta-agentd = { workspace = true }
codex-hepta-contracts = { workspace = true }
codex-hepta-fleet = { workspace = true }
codex-hepta-matrix-protocol = { workspace = true }
codex-hepta-matrix-sdk = { workspace = true }
codex-hepta-matrix-store = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-protocol = { workspace = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
anyhow = { workspace = true }
app_test_support = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-hepta-supervisor = { workspace = true }
core_test_support = { workspace = true }
matrix-sdk = { workspace = true }
pretty_assertions = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
url = { workspace = true }
wiremock = { workspace = true }
