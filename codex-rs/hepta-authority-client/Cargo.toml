[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-authority-client"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_authority_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-hepta-authority-types = { workspace = true }
codex-hepta-contracts = { workspace = true }
codex-hepta-types = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
