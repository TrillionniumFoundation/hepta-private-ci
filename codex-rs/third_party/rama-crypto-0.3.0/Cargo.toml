    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]

[features]
aws-lc = [
    "dep:aws-lc-rs",
    "rcgen/aws_lc_rs",
    "x509-parser/verify-aws",
]
boring = ["dep:rama-boring"]
default = []
