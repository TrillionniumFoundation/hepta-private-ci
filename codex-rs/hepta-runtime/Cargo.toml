[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-runtime"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_runtime"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-hepta-control-plane = { path = "../hepta-control-plane" }
codex-hepta-types = { path = "../hepta-types" }
hmac = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
sqlx = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
