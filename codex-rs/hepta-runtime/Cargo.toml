[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-runtime"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_runtime"
path = "src/lib.rs"
doctest = false

[features]
default = []
# Explicit opt-in; default HeptaRuntime never opens a CellSplit effect port.
cell-split-cns-port = ["dep:codex-hepta-operator-acceptance", "dep:ed25519-dalek"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-hepta-control-plane = { path = "../hepta-control-plane" }
codex-hepta-operator-acceptance = { path = "../hepta-operator-acceptance", optional = true }
ed25519-dalek = { workspace = true, optional = true }
codex-hepta-contracts = { workspace = true }
codex-hepta-plasticity = { path = "../hepta-plasticity" }
codex-hepta-types = { path = "../hepta-types" }
codex-hepta-wire = { path = "../hepta-wire" }
hmac = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
sqlx = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
codex-hepta-intelligence = { path = "../hepta-intelligence" }
codex-hepta-learning-ledger = { path = "../hepta-learning-ledger" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
