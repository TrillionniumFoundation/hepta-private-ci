[package]
name = "codex-keyring-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The required security-backport lane supplies an isolated native Secret Service.
secret-service-qualification = []

[dependencies]
keyring = { workspace = true, features = ["crypto-rust-sync"] }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# keyring 3.x sync Secret Service avoids the unmaintained zbus 4 family.
# This still requires independent Linux/BSD native libdbus qualification.
keyring = { workspace = true, features = ["linux-native-sync-persistent"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

[lib]
test = false
doctest = false

[[test]]
name = "secret_service"
path = "tests/qualification/secret_service.rs"
required-features = ["secret-service-qualification"]
