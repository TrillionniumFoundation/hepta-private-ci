[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-learning-artifacts"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_learning_artifacts"
path = "src/lib.rs"
doctest = false

[features]
default = ["product-api", "operator-api", "native-host"]
product-api = []
operator-api = ["native-host"]
native-host = []
production = ["product-api", "operator-api", "native-host"]
test-fixtures = []
fault-injection = []

[lints]
workspace = true

[dependencies]
codex-hepta-types = { path = "../hepta-types" }
ed25519-dalek = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
