[profile.default]
# Retry once so one transient failure does not fail full-CI outright.
# Fanout keeps the full-CI shards moving without treating every >30s test as
# stuck. Keep this aligned with the broader timeout budget we give sharded CI.
slow-timeout = { period = "30s", terminate-after = 2 }
retries = 1

[profile.default.junit]
path = "junit.xml"

[profile.local]
inherits = "default"

[test-groups.app_server_protocol_codegen]
max-threads = 1

[test-groups.app_server_integration]
max-threads = 1

# Higher concurrency causes integration test timeouts under resource contention
# on common developer machines.
[test-groups.app_server_integration_local]
max-threads = 4

[test-groups.core_apply_patch_cli_integration]
max-threads = 1

[test-groups.windows_sandbox_legacy_sessions]
max-threads = 1

[test-groups.windows_process_heavy]
max-threads = 2

[[profile.default.overrides]]
# Do not add new tests here
filter = 'test(rmcp_client) | test(humanlike_typing_1000_chars_appears_live_no_placeholder)'
slow-timeout = { period = "1m", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(approval_matrix_covers_all_modes)'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(codex-app-server-protocol) & (test(typescript_schema_fixtures_match_generated) | test(json_schema_fixtures_match_generated) | test(generate_ts_with_experimental_api_retains_experimental_entries) | test(generated_ts_optional_nullable_fields_only_in_params) | test(generate_json_filters_experimental_fields_and_methods))'
test-group = 'app_server_protocol_codegen'

[[profile.default.overrides]]
# These integration tests spawn a fresh app-server subprocess per case.
# Keep the library unit tests parallel.
filter = 'package(codex-app-server) & kind(test)'
test-group = 'app_server_integration'

[[profile.local.overrides]]
# Use up to four app-server subprocesses locally. The global nextest pool still
# limits this to the machine's logical CPU count.
filter = 'package(codex-app-server) & kind(test)'
test-group = 'app_server_integration_local'

[[profile.default.overrides]]
# These tests exercise full Codex turns and apply_patch execution, and they are
# sensitive to Windows runner process-startup stalls when many cases launch at once.
filter = 'package(codex-core) & kind(test) & test(apply_patch_cli)'
test-group = 'core_apply_patch_cli_integration'

[[profile.default.overrides]]
# These tests create restricted-token Windows child processes and private desktops.
# Serialize them to avoid exhausting Windows session/global desktop resources in CI.
filter = 'package(codex-windows-sandbox) & test(legacy_)'
test-group = 'windows_sandbox_legacy_sessions'

[[profile.default.overrides]]
# This Codex-home startup path still exceeded the broader Windows-heavy ceiling
# in both Windows full-CI lanes after contention was reduced.
platform = 'cfg(windows)'
filter = 'test(start_thread_uses_all_default_environments_from_codex_home)'
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default.overrides]]
# These Windows-heavy tests spawn subprocesses, session files, or JSON-RPC
# clients and have been the dominant source of 30s full-CI timeouts.
platform = 'cfg(windows)'
filter = 'test(suite::resume::) | test(suite::cli_stream::) | test(suite::auth_env::) | test(start_thread_uses_all_default_environments_from_codex_home) | test(connect_stdio_command_initializes_json_rpc_client_on_windows)'
test-group = 'windows_process_heavy'
slow-timeout = { period = "45s", terminate-after = 2 }

# These correctness/measurement cases deliberately retain thousands of real
# fsyncs plus acknowledged recovery. Their workload is not a 60-second product
# latency SLO. Keep all records and durability checks, serialize the heavy disk
# cases, and retain bounded watchdogs rather than skipping them. The explicit
# signed growth measurement also creates thousands of independent signatures;
# its 10-minute harness budget is not a runtime latency acceptance threshold.
[test-groups.hepta_durable_capacity]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(codex-hepta-learning-ledger) & test(history_exceeds_v1_record_capacity_without_resetting_chain_or_limits)'
test-group = 'hepta_durable_capacity'
slow-timeout = { period = "30s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(codex-hepta-learning-ledger) & test(signed_product_history_curve_append_lookup_reopen_and_exact_retry)'
test-group = 'hepta_durable_capacity'
slow-timeout = { period = "30s", terminate-after = 20 }
retries = 0

# Measure all four growth/reopen points and 256 real atomic domain commits.
# This full storage experiment preserves operation leases, child deadlines and
# the product latency acceptance threshold.
[[profile.default.overrides]]
filter = 'package(codex-hepta-operations) & test(growing_history_keeps_early_identity_and_domain_count_after_restart)'
test-group = 'hepta_durable_capacity'
slow-timeout = { period = "30s", terminate-after = 20 }
retries = 0

# Narrow original-owner fixture qualification; ordinary local/default unchanged.
[profile.native-fixtures]
inherits = "local"

[profile.native-fixtures.junit]
path = "junit.xml"
report-name = "native-fixtures"
store-success-output = true
store-failure-output = true
report-skipped = "none"

# Report even an ignored/filtered selected test, so absence cannot look green.
[[profile.native-fixtures.overrides]]
filter = 'test(=real_agentd_remember_recall_correct_and_forget_revalidate_physical_sends) | test(=agentd_product_host_commits_through_canonical_cognitive_store)'
junit.report-skipped = "all"

# Isolated recovery qualification; existing fixture/default/local profiles unchanged.
[profile.native-recovery]
inherits = "local"
retries = 0

[profile.native-recovery.junit]
path = "junit.xml"
report-name = "native-recovery"
store-success-output = true
store-failure-output = true
report-skipped = "none"

[[profile.native-recovery.overrides]]
filter = 'test(=cognitive_store::lifecycle_tests::close_marks_clone_pool_immediately_and_retains_recovery_guard_until_drop) | test(=cognitive_store::lifecycle_tests::close_waits_for_checked_out_transaction_commit_and_preserves_all_source_fields) | test(=cognitive_store::lifecycle_tests::close_cancelled_before_pool_drain_can_be_retried_and_is_idempotent) | test(=cognitive_store::lifecycle_tests::close_does_not_close_independently_opened_pool_for_same_database) | test(=cognitive_store::lifecycle_tests::close_preserves_unresolved_queued_lease_and_release_still_fails_closed) | test(=real_agentd_remember_recall_correct_and_forget_revalidate_physical_sends) | test(=agentd_product_host_commits_through_canonical_cognitive_store) | test(=agentd_product_host_recovers_exact_cut_into_fenced_writer_generation) | test(=agentd_product_host_recovers_existing_active_lease_without_advancing_cut)'
junit.report-skipped = "all"

# Isolated bootstrap validation; prior profiles remain byte-identical.
[profile.native-bootstrap-owning]
retries = 0
slow-timeout = { period = "30s", terminate-after = 8 }

[profile.native-bootstrap-owning.junit]
path = "junit.xml"
report-name = "native-bootstrap"
store-success-output = true
store-failure-output = true
report-skipped = "none"

[[profile.native-bootstrap-owning.overrides]]
filter = 'test(=cognitive_store::lifecycle_tests::close_cancelled_before_pool_drain_can_be_retried_and_is_idempotent) | test(=cognitive_store::lifecycle_tests::close_does_not_close_independently_opened_pool_for_same_database) | test(=cognitive_store::lifecycle_tests::close_marks_clone_pool_immediately_and_retains_recovery_guard_until_drop) | test(=cognitive_store::lifecycle_tests::close_preserves_unresolved_queued_lease_and_release_still_fails_closed) | test(=cognitive_store::lifecycle_tests::close_waits_for_checked_out_transaction_commit_and_preserves_all_source_fields)'
junit.report-skipped = "all"
retries = 0

[profile.native-bootstrap-integration]
retries = 0
slow-timeout = { period = "30s", terminate-after = 8 }

[profile.native-bootstrap-integration.junit]
path = "junit.xml"
report-name = "native-bootstrap"
store-success-output = true
store-failure-output = true
report-skipped = "none"

[[profile.native-bootstrap-integration.overrides]]
filter = 'test(=real_agentd_remember_recall_correct_and_forget_revalidate_physical_sends) | test(=agentd_product_host_commits_through_canonical_cognitive_store) | test(=agentd_product_host_recovers_exact_cut_into_fenced_writer_generation) | test(=agentd_product_host_recovers_existing_active_lease_without_advancing_cut)'
junit.report-skipped = "all"
retries = 0

[profile.native-bootstrap-bootstrap]
retries = 0
slow-timeout = { period = "30s", terminate-after = 8 }

[profile.native-bootstrap-bootstrap.junit]
path = "junit.xml"
report-name = "native-bootstrap"
store-success-output = true
store-failure-output = true
report-skipped = "none"

[[profile.native-bootstrap-bootstrap.overrides]]
filter = 'test(=cognitive_store::database_init_tests::abrupt_child_keeps_private_sidecars_and_public_exact_cut_recovery) | test(=cognitive_store::database_init_tests::crash_tests::abrupt_bootstrap_fresh_process_recovery_new_write_survives_third_process) | test(=cognitive_store::database_init_tests::existing_fifo_is_rejected_without_waiting_for_a_peer) | test(=cognitive_store::database_init_tests::existing_links_and_restrictive_permissions_are_rejected_without_repair) | test(=cognitive_store::database_init_tests::existing_private_bytes_are_neither_truncated_nor_rewritten) | test(=cognitive_store::database_init_tests::lock_tests::competing_first_opens_keep_private_consistent_state_or_fail_closed) | test(=cognitive_store::database_init_tests::lock_tests::existing_main_validation_preserves_live_sqlite_posix_locks) | test(=cognitive_store::database_init_tests::open_rejects_existing_nonprivate_main_without_repair) | test(=cognitive_store::database_init_tests::recovery_does_not_repair_an_unsafe_existing_sidecar) | test(=lane_c_snapshot_tests::retained_cut_detects_old_valid_backup_after_ordinary_reopen)'
