[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-native-gateway"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_native_gateway"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arboard = { workspace = true }
codex-hepta-agentd = { workspace = true }
codex-hepta-authbus = { path = "../hepta-authbus" }
codex-hepta-contracts = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-hepta-runtime = { workspace = true }
codex-hepta-types = { workspace = true }
codex-keyring-store = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
