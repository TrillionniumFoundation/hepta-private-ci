[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-codex-adapter"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_codex_adapter"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-extension-api = { workspace = true }
codex-hepta-types = { path = "../hepta-types" }
codex-hepta-wire = { path = "../hepta-wire" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }


[dev-dependencies]
codex-app-server-client = { workspace = true, features = ["test-support"] }
codex-protocol = { workspace = true }
