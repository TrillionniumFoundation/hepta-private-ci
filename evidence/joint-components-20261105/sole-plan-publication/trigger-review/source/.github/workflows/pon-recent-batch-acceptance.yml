      - name: Recheck unchanged exact source and hash all native logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="${OUT:-$RUNNER_TEMP/recent-exact}"
          mkdir -p "$out"
          args=(--kind "$SOURCE_KIND" --expected-head "$EXPECTED_HEAD")
          if test "$SOURCE_KIND" = prospective-merge; then
            args+=(--expected-base "$EXPECTED_BASE" --expected-merge "$EXPECTED_MERGE")
          fi
          source_status=0
          python3 scripts/ci/verify_ci_source.py "${args[@]}" --output "$out/source-after.json" || source_status=$?
          shopt -s nullglob
          logs=("$out"/*.log)
          log_status=no-logs-retained
          if ((${#logs[@]})); then
            sha256sum "${logs[@]}" > "$out/logs.sha256"
            log_status=logs-retained
          else
            : > "$out/logs.sha256"
          fi
          printf '{"schema":"trnm-recent-log-inventory-v1","status":"%s","retained_log_files":%s,"source_identity_exit_code":%s,"native_execution_established_by_inventory":false,"qualification":"unknown"}\n' "$log_status" "${#logs[@]}" "$source_status" > "$out/log-inventory.json"
