[package]
name = "argument_comment_lint"
version = "0.1.0"
description = "Dylint lints for Rust /*param*/ argument comments"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
bazel_native = []

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "b147b68c9bbc5ad44aea4220e6f68fd281f19c64" }
dylint_linting = "=6.3.2"

[dev-dependencies]
dylint_testing = "=6.3.2"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
