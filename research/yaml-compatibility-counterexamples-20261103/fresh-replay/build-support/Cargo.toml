[package]
name = "yaml-replay-dependencies"
version = "0.0.0"
edition = "2024"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
serde_yaml = "=0.9.34"
serde-saphyr = { version = "=2.1.0", default-features = false, features = ["deserialize", "comments"] }
granit-parser = { version = "=2.1.0", default-features = false, features = ["std", "error_messages", "comments"] }
pretty_assertions = "=1.4.1"
ryu = "=1.0.23"

[profile.dev]
debug = 0
incremental = false
