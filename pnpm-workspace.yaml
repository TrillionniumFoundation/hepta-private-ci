packages:
  - codex-cli
  - codex-rs/responses-api-proxy/npm
  - sdk/typescript
  - third_party/mcp-conformance

ignoredBuiltDependencies:
  - esbuild

minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude: []
# Workspace preparation is trusted repository code, checked before installation
# by .pnpmfile.cjs. No third-party dependency receives build permission here.
allowBuilds:
  # This reviewed version installs shared Git hooks outside CI.
  # The conformance CLI's own prepare/build/test scripts still run normally.
  "lefthook@2.2.2": false
