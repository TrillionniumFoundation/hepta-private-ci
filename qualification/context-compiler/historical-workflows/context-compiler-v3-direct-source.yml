name: context-compiler-v3-direct-source

on:
  push:
    branches:
      - codex/context-compiler-full-closure-review-20260927

permissions:
  contents: write

concurrency:
  group: context-compiler-v3-direct-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    if: ${{ contains(github.event.head_commit.message, '[materialize-v3]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.95.0 --component rustfmt --component clippy
          rustup default 1.95.0
          rustc -Vv
          cargo -V

      - name: Materialize registry-owned V3 into the exact provider spine
        run: |
          set -euo pipefail
          python3 scripts/apply_context_compiler_v3_source.py
          python3 scripts/apply_context_compiler_full_closure.py
          python3 scripts/apply_context_compiler_hardening.py

      - name: Format workspace
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Refresh lockfile without unconstrained dependency upgrades
        working-directory: codex-rs
        run: cargo metadata --format-version 1 > /dev/null

      - name: Run default-off product tests
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-prompt-registry
          -p codex-hepta-context-compiler
          -p codex-hepta-intelligence
          -p codex-extension-api
          -p codex-core
          -p codex-hepta-agentd
          -p codex-hepta-prompt-extension

      - name: Run legacy compatibility tests explicitly
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-intelligence --features legacy-prompt-context-v1
          cargo test --locked -p codex-hepta-agentd --features legacy-prompt-context-v1

      - name: Strict Clippy across product and compatibility profiles
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-prompt-registry
          -p codex-hepta-context-compiler
          -p codex-hepta-intelligence
          -p codex-extension-api
          -p codex-core
          -p codex-hepta-agentd
          -p codex-hepta-prompt-extension
          --all-targets --all-features -- -D warnings

      - name: Commit direct source and remove migration machinery
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f scripts/apply_context_compiler_v3_source.py
          rm -f scripts/apply_context_compiler_v3_core.py
          rm -f scripts/apply_context_compiler_full_closure.py
          rm -f scripts/apply_context_compiler_hardening.py
          rm -f .github/workflows/context-compiler-v3-direct-source.yml
          rm -f .github/workflows/context-compiler-property-fix.yml
          rm -f .github/workflows/context-compiler-one-shot-remediation.yml
          rm -f .github/context-compiler-materialize-v3.trigger
          git config user.name "hepta-closure-bot"
          git config user.email "hepta-closure-bot@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat(context.compiler): materialize V3 exact provider proof chain [context-source-fixed] [v3-materialized]"
          git push origin "HEAD:${BRANCH}"