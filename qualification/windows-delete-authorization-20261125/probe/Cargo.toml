[package]
name = "codex-windows-delete-boundary-probe"
version = "0.0.0"
edition = "2024"

[workspace]

[lib]
path = "lib.rs"

[dev-dependencies]
anyhow = "=1.0.103"
pretty_assertions = "=1.4.1"
tempfile = "=3.27.0"
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }

[profile.dev]
debug = 0
incremental = false

[lints.clippy]
correctness = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
