[package]
name = "codex-windows-delete-boundary-probe"
version = "0.0.0"
edition = "2024"

[workspace]

[lib]
path = "lib.rs"

[[test]]
name = "list_factor"
path = "list_factor.rs"

[dependencies]
anyhow = "=1.0.103"
windows-sys = { version = "=0.52.0", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
pretty_assertions = "=1.4.1"
tempfile = "=3.27.0"

[profile.dev]
debug = 0
incremental = false

[lints.clippy]
correctness = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
