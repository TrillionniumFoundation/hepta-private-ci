# Isolated historical fixture producer only. Never a production workspace member.
[package]
name = "hepta-matrix-018-fixture"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
blake3 = "=1.8.7"
matrix-sdk-crypto = "=0.18.0"
matrix-sdk-sqlite = { path = "../../../codex-rs/third_party/matrix-sdk-sqlite-0.18.0", default-features = false, features = ["crypto-store", "bundled"] }
ruma = { version = "=0.16.0", features = ["client-api-c", "events"] }
rusqlite = { version = "=0.39.0", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
