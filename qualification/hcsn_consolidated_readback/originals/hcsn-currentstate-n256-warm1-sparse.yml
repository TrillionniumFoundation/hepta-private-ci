name: hcsn-currentstate-n256-warm1-sparse

on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/hcsn-currentstate-n256-warm1-sparse.yml"
      - "qualification/hcsn_currentstate_n256_warm1_sparse/**"

permissions:
  contents: read

concurrency:
  group: hcsn-n256-independent-warm1-sparse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  one-shot-warm1-sparse:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UNIQUE_EXECUTION_KEY: hcsn-n256-independent-warm1-sparse-20261119-001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.3"
      - name: Install identical binary numerical runtime
        run: >-
          python -m pip install --only-binary=:all:
          -r qualification/hcsn_currentstate_n256_warm1_sparse/requirements.txt
      - name: Run tiny independent controls
        run: python -m unittest qualification.hcsn_currentstate_n256_warm1_sparse.test_candidate qualification.hcsn_currentstate_n256_warm1_sparse.test_runner
      - name: Verify optimized fail-closed controls
        run: python -O -m unittest qualification.hcsn_currentstate_n256_warm1_sparse.test_runner
      - name: Execute new admitted warm1 attempt once
        run: python -m qualification.hcsn_currentstate_n256_warm1_sparse.runner
      - name: Preserve comparison and negative originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-independent-warm1-sparse-001
          path: qualification/hcsn_currentstate_n256_warm1_sparse/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 30
