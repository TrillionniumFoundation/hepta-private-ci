[package]
name = "hepta-sqlite-owner-vfs-native-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "probe.rs"
doctest = false

[dependencies]
libsqlite3-sys = { path = "../../../../codex-rs/third_party/libsqlite3-sys-0.39.1", default-features = false, features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
