name: hcsn-currentstate-n256-firststep-dense-oracle-hosted

on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/hcsn-currentstate-n256-firststep-dense-oracle-hosted.yml"
      - "qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/**"

permissions:
  contents: read

concurrency:
  group: hcsn-n256-firststep-dense-oracle-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  one-shot-n256:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UNIQUE_EXECUTION_KEY: hcsn-n256-firststep-dense-oracle-hosted-20261118-c06d-001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0, matching the admitted observation
        with:
          python-version: "3.12.3"
      - name: Install exact binary numerical runtime
        run: >-
          python -m pip install --only-binary=:all:
          -r qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/requirements.txt
      - name: Verify frozen one-shot source
        run: python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.verify_source
      - name: Run normal source controls
        run: python -m unittest qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.test_launcher
      - name: Run optimized source controls
        run: python -O -m unittest qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.test_launcher
      - name: Execute the unique admitted attempt once
        run: python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.launcher
      - name: Preserve success or RED originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-firststep-dense-oracle-hosted-001
          path: qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 30
