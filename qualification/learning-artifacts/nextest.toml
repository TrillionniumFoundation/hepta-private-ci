# Routine test execution still uses the repository's `just test` recipe.
# The explicit --profile argument overrides that recipe's NEXTEST_PROFILE=local.
[profile.artifact-qualification]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.artifact-qualification.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
