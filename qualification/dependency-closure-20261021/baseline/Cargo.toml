[package]
name = "credential-probe-baseline"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "credential-probe-baseline"
path = "../probe.rs"

[dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
keyring-core = "=1.0.0"
pretty_assertions = "1.4"
secret-service = "=5.2.0"
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"
zbus = "=5.19.0"
zbus-secret-service-keyring-store = "=1.0.1"
