[package]
name = "sqlx-temporal-default-contract-v1"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
codex-state = { path = "../../codex-rs/state" }
codex-hepta-operations = { path = "../../codex-rs/hepta-operations" }
sqlx = { version = "=0.9.1", default-features = false, features = ["sqlite-bundled"] }

[[bin]]
name = "scalar_public"
path = "scalar_public.rs"

[[bin]]
name = "chrono_default_refusal"
path = "chrono_default_refusal.rs"

# Preserve the accepted workspace patches in this independent fixture root.
[patch.crates-io]
# Preserve Starlark 0.14.2 API while accepting Matrix-compatible BLAKE3.
starlark = { path = "../../codex-rs/third_party/starlark-0.14.2-blake3-backport" }
# Backport Rama upstream time#783 resolution without changing its 0.3.0 API.
rama-crypto = { path = "../../codex-rs/third_party/rama-crypto-0.3.0-time-backport" }
# Preserve AWS credentials-login while using the fixed RustCrypto P-256 stack.
# The audited upstream 1.12.0 package and compatibility patch are recorded beside it.
aws-config = { path = "../../codex-rs/third_party/aws-config-1.12.0" }
# Retain the existing encrypted Secret Service backend with maintained zbus 6
# and replace the archived i18n parser without changing its 0.4 public variants.
i18n-config = { path = "../../codex-rs/third_party/i18n-config-0.4.8" }
secret-service = { path = "../../codex-rs/third_party/secret-service-6.0.0" }
zbus-secret-service-keyring-store = { path = "../../codex-rs/third_party/zbus-secret-service-keyring-store-1.0.1" }
# Matrix SDK exposes anymap2 in its event handler API. Keep that
# API stable while replacing the unmaintained implementation with anymap3.
anymap2 = { path = "../../codex-rs/third_party/anymap2-compat" }
# Matrix SDK 0.19.1 uses a manifest-only rusqlite 0.41 compatibility patch.
# Share the patched libsqlite3-sys 0.39 line with SQLx 0.9.1 while preserving
# the upstream Rust implementation and SQL migrations.
matrix-sdk-sqlite = { path = "../../codex-rs/third_party/matrix-sdk-sqlite-0.19.1" }
# Uncomment to debug local changes.
# ratatui = { path = "../../ratatui" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# Uncomment to debug local changes.
# rmcp = { path = "../../rust-sdk/crates/rmcp" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
