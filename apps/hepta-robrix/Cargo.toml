[package]
name = "hepta-robrix"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
build = false

[workspace]
resolver = "3"

[lib]
name = "robrix"
path = "src/hepta_lib.rs"

[[bin]]
name = "hepta-robrix"
path = "src/hepta_main.rs"

[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "493d23a7630f487d29912dd73f2cbb5b639b74ca", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hepta-native = { path = "../hepta-native", default-features = false }

[dev-dependencies]
insta = "=1.46.3"

[profile.dev-small]
inherits = "dev"
debug = 0
incremental = false
