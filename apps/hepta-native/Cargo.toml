[package]
name = "hepta-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "hepta_native"
path = "src/lib.rs"

[[bin]]
name = "hepta-native"
path = "src/main.rs"

[[bin]]
name = "hepta-native-updater"
path = "src/bin/hepta-native-updater.rs"

[dependencies]
atomic-write-file = "0.3.1"
arboard = "3"
base64 = "0.22.1"
codex-keyring-store = { path = "../../codex-rs/keyring-store" }
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3.23"
