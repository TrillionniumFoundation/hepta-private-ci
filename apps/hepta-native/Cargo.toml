[package]
name = "hepta-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "hepta-native"

[lib]
name = "hepta_native"
path = "src/lib.rs"

[[bin]]
name = "hepta-native"
path = "src/main.rs"

[[bin]]
name = "hepta-native-updater"
path = "src/bin/hepta-native-updater.rs"

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
codex-keyring-store = { path = "../../codex-rs/keyring-store" }
dirs-next = "2.0.0"
ed25519-dalek = "2.2.0"
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
fs2 = "0.4.3"
hex = "0.4.3"
notify-rust = "4.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"

[dev-dependencies]
pretty_assertions = "1"
