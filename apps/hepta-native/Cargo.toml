[package]
name = "hepta-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["platform-adapters"]
resolver = "3"

[lib]
name = "hepta_native"
path = "src/lib.rs"

[[bin]]
name = "hepta-native"
path = "src/main.rs"

[[bin]]
name = "hepta-native-updater"
path = "src/bin/hepta-native-updater.rs"

[[bin]]
name = "hepta-native-credential"
path = "src/bin/hepta-native-credential.rs"

[dependencies]
atomic-write-file = "0.3.1"
arboard = "3"
base64 = "0.22.1"
codex-hepta-contracts = { path = "../../codex-rs/hepta-contracts" }
codex-keyring-store = { path = "../../codex-rs/keyring-store" }
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }
getrandom = "0.4.3"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
futures-lite = "2"
zbus = "=5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
codex-utils-private-state = { path = "../../codex-rs/utils/private-state" }
hepta-native-platform = { path = "platform-adapters" }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(windows)'.dependencies]
codex-hepta-private-state = { path = "../../codex-rs/hepta-private-state" }
hepta-native-platform = { path = "platform-adapters" }
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications"] }

[dev-dependencies]
insta = "=1.46.3"
tempfile = "3.23"

[target.'cfg(target_os = "linux")'.dev-dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
zbus = { version = "=5.19.0", features = ["p2p"] }

[build-dependencies]
embed-manifest = "1.5.0"

# Restart fixtures hash their actual executable, including full debug symbols.
# Keep production deadlines meaningful without changing the bytes under test.
[profile.test.package.sha2]
opt-level = 3
