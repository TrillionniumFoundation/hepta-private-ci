[package]
name = "hepta-native-platform"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "hepta_native_platform"
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSPanel", "NSRunningApplication", "NSSavePanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
tempfile = "3.23"
