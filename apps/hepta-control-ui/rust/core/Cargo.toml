# Agentd consumes this package outside the UI Cargo workspace. Explicit values
# preserve the same contract for Bazel; keep them aligned with ../Cargo.toml.
[package]
name = "hepta-control-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
ui-fixtures = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.26"
