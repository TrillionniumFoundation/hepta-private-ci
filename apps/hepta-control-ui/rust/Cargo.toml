[workspace]
members = ["core", "web"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = "=0.3.105"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
