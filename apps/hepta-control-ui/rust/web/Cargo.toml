[package]
name = "hepta-control-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hepta-control-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "AbortController", "AbortSignal", "AddEventListenerOptions", "Crypto",
  "CustomEvent", "CustomEventInit", "Document", "DomException", "Element",
  "Event", "EventTarget", "Headers", "HtmlButtonElement", "HtmlDialogElement", "HtmlElement",
  "HtmlInputElement", "HtmlMetaElement", "HtmlSelectElement", "HtmlTextAreaElement",
  "KeyboardEvent", "Location", "Navigator", "Node", "NodeList", "PageTransitionEvent",
  "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestCache",
  "ReferrerPolicy", "SubtleCrypto", "RequestCredentials", "RequestInit", "RequestMode", "RequestRedirect", "Response",
  "Storage", "Text", "Url", "UrlSearchParams", "Window", "console"
] }
