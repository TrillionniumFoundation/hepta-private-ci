[package]
name = "hepta-servo-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[dependencies]
dpi = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
servo = { git = "https://github.com/servo/servo.git", rev = "84bcc9ac701874fa9819e5cdee06356b961d736c", package = "servo", default-features = false, features = ["background_hang_monitor", "bundled"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
