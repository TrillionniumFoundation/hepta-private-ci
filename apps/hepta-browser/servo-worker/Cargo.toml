[package]
name = "hepta-servo-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[dependencies]
dpi = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
servo = { git = "https://github.com/servo/servo.git", rev = "b5a1f5e6ec6f8685d40cd389802ced7abe4980f6", package = "servo", default-features = false, features = ["background_hang_monitor", "bundled"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
