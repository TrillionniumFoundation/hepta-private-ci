name: Final single-main source convergence V5

on:
  push:
    branches:
      - ops/final-main-convergence-v3-20260908
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: hepta-final-source-v5
  cancel-in-progress: true

jobs:
  materialize-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out V5 controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ops/final-main-convergence-v3-20260908
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Configure repository CI prerequisites
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Directly materialize, validate, and publish V5 ready point
        env:
          GH_TOKEN: ${{ github.token }}
          HEPTA_ADMIN_TOKEN: ${{ secrets.HEPTA_ADMIN_TOKEN || secrets.GH_ADMIN_TOKEN || secrets.REPO_ADMIN_TOKEN || secrets.ADMIN_TOKEN || secrets.GH_PAT || secrets.GITHUB_PAT || secrets.REPO_TOKEN || secrets.BOT_TOKEN || secrets.HEPTA_BOT_TOKEN || secrets.PERSONAL_ACCESS_TOKEN }}
        run: bash .github/scripts/source_convergence_v5.sh

      - name: Upload V5 source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-source-convergence-v5-${{ github.sha }}
          path: |
            convergence/
            ${{ runner.temp }}/hepta-source-convergence-v5/
          if-no-files-found: warn
          retention-days: 90
