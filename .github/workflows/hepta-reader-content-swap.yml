name: Hepta saved Reader nonempty content controls
on:
  push:
    branches: ["research/five-causal-experiments-20261013"]
    paths:
      - "scripts/memory_cell/reader_content_swap*.py"
      - "scripts/memory_cell/test_reader_content_swap.py"
      - ".github/workflows/hepta-reader-content-swap.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: saved-reader-content-${{ github.ref }}
  cancel-in-progress: false
jobs:
  saved-candidates-no-refitting:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the existing pinned official model environment
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-content-swap/source
          python3 -m venv /tmp/hepta-content-env
          /tmp/hepta-content-env/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu > /tmp/hepta-content-swap/install-torch.log 2>&1
          /tmp/hepta-content-env/bin/pip install -r scripts/memory_cell/requirements.txt packaging==25.0 cryptography==46.0.4 psutil==7.0.0 regex==2024.11.6 Jinja2==3.1.6 > /tmp/hepta-content-swap/install-worker.log 2>&1
          /tmp/hepta-content-env/bin/pip check
          /tmp/hepta-content-env/bin/pip freeze > /tmp/hepta-content-swap/environment.txt
      - name: Require inherited contracts and new content-control tests
        run: |
          set -euo pipefail
          failed=0
          for pattern in test_full_cell_matrix.py test_five_causal_experiments.py test_five_causal_native.py 'test_five_group*.py' test_five_reader_response.py 'test_five_reader_adapter*.py' test_five_encoder_snapshot.py test_five_reader_evidence_pairs.py 'test_source_time_evidence*.py' test_reader_fit_audit.py 'test_assistant_projection*.py' test_reader_content_swap.py; do
            name=$(printf '%s' "$pattern" | tr '*' '_')
            if /tmp/hepta-content-env/bin/python -m unittest discover -s scripts/memory_cell -p "$pattern" -v 2>&1 | tee "/tmp/hepta-content-swap/$name.log"; then
              printf '%s\tpassed\n' "$pattern" >> /tmp/hepta-content-swap/suites.tsv
            else
              failed=1
              printf '%s\tfailed\n' "$pattern" >> /tmp/hepta-content-swap/suites.tsv
            fi
          done
          /tmp/hepta-content-env/bin/python -m py_compile scripts/memory_cell/reader_content_swap.py scripts/memory_cell/reader_content_swap_trial.py scripts/memory_cell/test_reader_content_swap.py
          test "$failed" -eq 0
      - name: Retrieve the original model and two immutable result artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip > /tmp/content-original.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11838105827/zip > /tmp/content-budget.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11837123194/zip > /tmp/content-projection.zip
          printf '%s  %s\n' 07b357cbb3362f4afa4dc1872ab7e28e8a46daaf338f2636fed8d40fbcee76af /tmp/content-original.zip | sha256sum -c -
          printf '%s  %s\n' ce5178bf4bea0d45d65f22765e29a835b7a99a4b3a4fd1dc4fa0d248a6d5c151 /tmp/content-budget.zip | sha256sum -c -
          printf '%s  %s\n' 4259beaea0c23cbd80d945b464b83ff23af5c1185d7c2fe469409c0043c6c38d /tmp/content-projection.zip | sha256sum -c -
      - name: Replay frozen saved candidates with nonempty evidence substitutions
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/hepta-content-swap/process-resources.txt /tmp/hepta-content-env/bin/python scripts/memory_cell/reader_content_swap_trial.py --original-archive /tmp/content-original.zip --budget-archive /tmp/content-budget.zip --projection-archive /tmp/content-projection.zip --work /tmp/hepta-content-materials --output /tmp/hepta-content-swap/study 2>&1 | tee /tmp/hepta-content-swap/execution.log
          /tmp/hepta-content-env/bin/python - <<'PY'
          import json
          from pathlib import Path
          print('SAVED_PROJECTION_DRIFT', json.dumps(json.loads(Path('/tmp/hepta-content-swap/study/projection-drift.json').read_bytes()), sort_keys=True))
          PY
      - name: Retain exact source and failures without original model bytes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-content-swap/source/memory_cell
          git rev-parse HEAD > /tmp/hepta-content-swap/source/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/hepta-content-swap/source/tested-tree.txt
          cp scripts/memory_cell/*.py scripts/memory_cell/requirements.txt /tmp/hepta-content-swap/source/memory_cell/
          cp experiments/shared_stem_cell/execution.py .github/workflows/hepta-reader-content-swap.yml /tmp/hepta-content-swap/source/
          (cd /tmp/hepta-content-swap && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-saved-reader-content-not-confirmation
          path: /tmp/hepta-content-swap
          if-no-files-found: error
