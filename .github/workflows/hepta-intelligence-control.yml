name: intelligence.control independent qualification

on:
  push:
    paths:
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-operations/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/intelligence.control/**"
      - "qualification/module-execution-dossiers/detail/intelligence.control.md"
      - "scripts/hepta-intelligence-control-status.py"
      - "scripts/hepta_ci_v8.py"
      - "scripts/hepta_ci_exec.py"
      - ".github/workflows/hepta-intelligence-control.yml"
      - ".github/actions/hepta-synthetic-merge/**"
  pull_request:
    paths:
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-operations/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/intelligence.control/**"
      - "qualification/module-execution-dossiers/detail/intelligence.control.md"
      - "scripts/hepta-intelligence-control-status.py"
      - ".github/workflows/hepta-intelligence-control.yml"
      - ".github/actions/hepta-synthetic-merge/**"

permissions:
  contents: read

concurrency:
  group: intelligence-control-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  qualification:
    name: intelligence.control (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - name: Check out source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current pull-request base
        id: current-base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_REF"
          test -n "$EVENT_BASE_SHA"
          CURRENT_BASE="$(git rev-parse "refs/remotes/origin/${BASE_REF}^{commit}")"
          [[ "$CURRENT_BASE" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CURRENT_BASE^{commit}"
          printf 'sha=%s\n' "$CURRENT_BASE" >> "$GITHUB_OUTPUT"
          printf 'BASE_SHA=%s\n' "$CURRENT_BASE" >> "$GITHUB_ENV"

      - name: Construct deterministic merge candidate
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.current-base.outputs.sha || env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Intelligence CI
          author-email: hepta-intelligence-ci@users.noreply.github.com
          message: intelligence.control synthetic merge

      - name: Bind exact candidate identity
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          MERGE_SHA: ${{ steps.synthetic.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.lane }}" = base-merge ]; then
            test -n "$MERGE_SHA"
            test "$TESTED_SHA" = "$MERGE_SHA"
          else
            test -z "$MERGE_SHA"
            test "$TESTED_SHA" = "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA" >> "$GITHUB_ENV"

      - name: Prepare native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Expose DotSlash for integration tests
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash

      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Verify generated stable truth
        run: |
          set -euo pipefail
          python3 scripts/hepta-intelligence-control-status.py --check-tracked
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Check formatting
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/fmt.json"
          -- cargo fmt --all -- --check

      - name: Test canonical intelligence package
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/intelligence-tests.json"
          -- cargo test --locked -p codex-hepta-intelligence --lib

      - name: Test Agentd default product profile
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-default-tests.json"
          -- cargo test --locked -p codex-hepta-agentd --lib

      - name: Test explicitly classified qualification-only learning surface
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-qualification-tests.json"
          -- cargo test --locked -p codex-hepta-agentd --lib
          --features qualification-legacy-learning-write

      - name: Compile all Agentd targets
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-all-targets.json"
          -- cargo check --locked -p codex-hepta-agentd --all-targets

      - name: Strict lint intelligence product packages
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/clippy.json"
          -- cargo clippy --locked -p codex-hepta-intelligence
          -p codex-hepta-agentd --all-targets -- -D warnings

      - name: Generate exact executed truth
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intelligence-exact-status/${{ matrix.lane }}"
          python3 scripts/hepta-intelligence-control-status.py \
            --source-head "$TESTED_SHA" \
            --execution-status passed \
            --lane "${{ matrix.lane }}" \
            --output-dir "$output"
          python3 - "$output" "$TESTED_SHA" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          for name in ("IMPLEMENTATION_MAP.json", "TEST_TRACEABILITY.json"):
              value = json.loads((root / name).read_text())
              assert value["sourceIdentity"]["commit"] == expected
              assert value["sourceIdentity"]["executionStatus"] == "passed"
          PY
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Retain exact status and command records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/intelligence-command-records/*
            ${{ runner.temp }}/intelligence-exact-status/${{ matrix.lane }}/*
          if-no-files-found: error
          retention-days: 30
