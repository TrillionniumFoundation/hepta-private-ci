name: intelligence.control independent qualification

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/workflows/hepta-intelligence-control.yml
      - .github/workflows/hepta-intelligence-source-finalizer.yml
      - scripts/finalize-intelligence-control-product.py
      - scripts/finalize-intelligence-control-boundaries.py

permissions:
  contents: write

concurrency:
  group: intelligence-control-materializer
  cancel-in-progress: true

jobs:
  materialize:
    name: materialize and verify product closure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source event
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Bind exact branch and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "codex/intelligence-control-product-closure-20260926"
          git cat-file -e "$GITHUB_SHA^\{commit\}"
          git merge-base --is-ancestor a126987b84737dbc2ee2592442a314117bddb4a2 "$GITHUB_SHA"
          test -f scripts/finalize-intelligence-control-product.py
          test -f scripts/finalize-intelligence-control-boundaries.py
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Materialize existing architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize-intelligence-control-product.py
          python3 scripts/finalize-intelligence-control-boundaries.py
          git diff --check

      - name: Format and lock exact dependencies
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Verify source mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-intelligence-control-status.py --check-tracked
          python3 scripts/hepta-intelligence-control-status-tests.py
          git diff --check

      - name: Test and lint current materialized candidate
        working-directory: codex-rs
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-intelligence
          cargo test --locked -p codex-hepta-operations
          cargo test --locked -p codex-hepta-agentd --lib
          cargo test --locked -p codex-hepta-agentd --lib --features qualification-legacy-learning-write
          cargo test --locked -p codex-hepta-infer-worker-host --lib
          cargo check --locked -p codex-hepta-agentd -p codex-hepta-infer-worker-host --all-targets
          cargo clippy --locked -p codex-hepta-intelligence -p codex-hepta-operations -p codex-hepta-agentd -p codex-hepta-infer-worker-host --all-targets -- -D warnings

      - name: Restore qualification workflow and remove materializers
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA^:.github/workflows/hepta-intelligence-control.yml" > .github/workflows/hepta-intelligence-control.yml
          git rm -f .github/workflows/hepta-intelligence-source-finalizer.yml
          git rm -f scripts/finalize-intelligence-control-product.py
          git rm -f scripts/finalize-intelligence-control-boundaries.py
          allowed='^(\.github/workflows/hepta-intelligence-(control|source-finalizer)\.yml|scripts/finalize-intelligence-control-(product|boundaries)\.py|scripts/hepta-intelligence-control-status\.py|docs/modules/intelligence\.control/(IMPLEMENTATION_MAP\.json|TEST_TRACEABILITY\.json|PRODUCT_CLOSURE\.md|TECHNICAL\.md)|codex-rs/Cargo\.lock|codex-rs/hepta-agentd/src/(config|state|lib|intelligence_.*)\.rs|codex-rs/hepta-intelligence/(src|tests)/.*\.rs|codex-rs/hepta-operations/src/.*\.rs|codex-rs/hepta-infer-worker-host/src/(lib|native_intelligence_product|native_run_control|native_run_control_tests)\.rs|codex-rs/hepta-infer-worker-host/src/bin/hepta-infer-worker\.rs)$'
          unexpected="$(git status --short | cut -c4- | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git status --short)"
          git diff --check

      - name: Commit and fast-forward verified source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "Hepta Intelligence Materializer"
          git config user.email "hepta-intelligence-materializer@users.noreply.github.com"
          git add -A
          git commit -m "feat(intelligence): close product and recovery boundaries"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
