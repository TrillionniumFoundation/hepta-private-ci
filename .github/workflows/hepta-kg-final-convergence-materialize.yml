name: Materialize knowledge.graph final convergence

on:
  push:
    branches: [work/knowledge-graph-final-convergence-20260927]
    paths:
      - ".github/workflows/hepta-kg-final-convergence-materialize.yml"
      - "scripts/hepta-kg-query-closure-apply.py"

permissions:
  contents: write

concurrency:
  group: hepta-kg-final-convergence-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref == 'refs/heads/work/knowledge-graph-final-convergence-20260927'
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      source-sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact scoped query and qualification closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "$(git ls-remote origin refs/heads/work/knowledge-graph-final-convergence-20260927 | cut -f1)" = '${{ github.sha }}'
          git config user.name 'Hepta KG source integration'
          git config user.email 'hepta-kg-ci@users.noreply.github.com'
          python3 scripts/test_hepta_knowledge_graph_budget.py -v
          python3 scripts/hepta-knowledge-graph-target-measure.py --self-test
          python3 scripts/hepta-kg-query-closure-apply.py
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, observed {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          script = 'scripts/hepta-knowledge-graph-target-measure.py'
          replace(
              script,
              '    parser.add_argument("--host-profile-id")\n',
              '    parser.add_argument("--host-profile-id")\n    parser.add_argument("--storage-identity")\n',
          )
          replace(
              script,
              '    if not args.host_profile_id:\n        parser.error("--host-profile-id is required")\n',
              '    if not args.host_profile_id:\n        parser.error("--host-profile-id is required")\n    if not args.storage_identity:\n        parser.error("--storage-identity is required")\n',
          )
          replace(
              script,
              '        "cargo": command("cargo", "--version").strip(),\n    }\n',
              '        "cargo": command("cargo", "--version").strip(),\n        "storageIdentity": args.storage_identity,\n    }\n',
          )
          guide = 'qualification/knowledge-graph/TARGET_HOST.md'
          replace(
              guide,
              "  --host-profile-id '<stable-host-profile-id>' \\\n  --target-dir",
              "  --host-profile-id '<stable-host-profile-id>' \\\n  --storage-identity '<stable-storage-profile-id>' \\\n  --target-dir",
          )
          with Path(guide).open('a', encoding='utf-8') as output:
              output.write('''\n\n## Budget enforcement and trusted dispatch\n\nTarget-host evidence is accepted only with a committed `hepta.knowledge-graph-budget.v1`\nprofile that binds CPU, logical CPU count, architecture and storage identity, supplies\nall workload minima and all latency/memory/storage limits, and matches the exact\nsource commit. Use the default-branch-only\n`.github/workflows/hepta-knowledge-graph-target-host.yml`; candidate branches cannot\ndispatch the trusted self-hosted runner. A passing budget evaluation remains\nmeasurement evidence and does not grant independent acceptance, activation or release.\n''')
          PY
          cd codex-rs
          cargo fmt --package codex-hepta-kg --package codex-hepta-memory

      - name: Commit focused source and remove one-shot writers
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/hepta-kg-query-closure-apply.py
          rm .github/workflows/hepta-kg-final-convergence-materialize.yml
          rm .github/workflows/hepta-kg-finalize-query-cache.yml
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/hepta-knowledge-graph-qualification.yml',
              '.github/workflows/hepta-knowledge-graph-target-host.yml',
              '.github/workflows/hepta-kg-final-convergence-materialize.yml',
              '.github/workflows/hepta-kg-finalize-query-cache.yml',
              'scripts/hepta-kg-query-closure-apply.py',
              'scripts/hepta-knowledge-graph-target-measure.py',
              'scripts/hepta-knowledge-graph-budget-check.py',
              'scripts/test_hepta_knowledge_graph_budget.py',
              'qualification/knowledge-graph/TARGET_HOST.md',
              'qualification/knowledge-graph/QUERY_CLOSURE_20260927.md',
              'docs/modules/knowledge.graph/TECHNICAL.md',
              'codex-rs/hepta-kg/src/generation.rs',
              'codex-rs/hepta-kg/src/generation_tests.rs',
              'codex-rs/hepta-kg/src/lib.rs',
              'codex-rs/hepta-kg/src/indexed_query.rs',
              'codex-rs/hepta-kg/src/query_closure_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_kg_benchmark_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_store_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_kg_history_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_retrieval.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected materialized paths: {unexpected}')
          PY
          git add -A
          git commit -s -m 'feat(knowledge.graph): close verified query and history qualification'

      - name: Bind exact committed source inventory
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          env = {key: value for key, value in os.environ.items() if not key.startswith('GIT_')}
          env.update(
              GIT_CONFIG_NOSYSTEM='1',
              GIT_CONFIG_GLOBAL=os.devnull,
              GIT_NO_REPLACE_OBJECTS='1',
              GIT_NO_LAZY_FETCH='1',
              GIT_TERMINAL_PROMPT='0',
          )

          def git(*args: str) -> str:
              return subprocess.check_output(
                  ['git', '--literal-pathspecs', *args], env=env, text=True
              ).strip()

          path = Path('docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text(encoding='utf-8'))
          identity = {
              'commit': git('rev-parse', 'HEAD'),
              'tree': git('rev-parse', 'HEAD^{tree}'),
          }
          row['sourceBase'] = identity
          row['observedAtHead'] = identity
          additions = {
              '.github/workflows/hepta-knowledge-graph-target-host.yml',
              'codex-rs/hepta-kg/src/indexed_query.rs',
              'codex-rs/hepta-kg/src/query_closure_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_kg_history_tests.rs',
              'qualification/knowledge-graph/QUERY_CLOSURE_20260927.md',
              'qualification/knowledge-graph/TARGET_HOST.md',
              'scripts/hepta-knowledge-graph-target-measure.py',
              'scripts/hepta-knowledge-graph-budget-check.py',
              'scripts/test_hepta_knowledge_graph_budget.py',
          }
          row['compositionRoots'] = sorted(set(row.get('compositionRoots', [])) | additions)
          for operation in row['operations']:
              if operation['operation'] == 'query_relations':
                  operation['state'] = 'product_composed_transaction_local_verified_index_with_full_scan_oracle'
                  if 'codex-rs/hepta-kg/src/query_closure_tests.rs' not in operation['tests']:
                      operation['tests'].append('codex-rs/hepta-kg/src/query_closure_tests.rs')
              if operation['operation'] == 'publish_generation':
                  history = {
                      'path': 'codex-rs/hepta-memory/src/cognitive_kg_history_tests.rs',
                      'symbol': 'qualification_kg_history_reopen_no_resurrection',
                  }
                  if history not in operation['tests']:
                      operation['tests'].append(history)

          paths = set(row.get('observedSourcePaths', []))
          paths.update(row.get('compositionRoots', []))
          paths.update(row.get('declaredRoots', []))
          paths.update(row.get('resolvedRoots', []))
          paths.add(row['technicalGuide'])
          paths.update(item['path'] for item in row.get('sourceObjects', []))
          for operation in row['operations']:
              paths.add(operation['sourcePath'])
              for key in ('tests', 'delegatedCallees'):
                  for item in operation.get(key, []):
                      source = item if isinstance(item, str) else item.get('path', item.get('sourcePath'))
                      if not source:
                          raise ValueError('mapped evidence lacks a source path')
                      if '.rs::' in source:
                          source = source.split('.rs::', 1)[0] + '.rs'
                      paths.add(source)
          if str(path) in paths:
              raise ValueError('implementation map cannot source-bind itself')

          objects = []
          for source in sorted(paths):
              candidate = Path(source)
              if source.startswith('/') or '..' in candidate.parts:
                  raise ValueError(f'invalid source path: {source}')
              kind = git('cat-file', '-t', f"{identity['commit']}:{source}")
              if kind not in ('tree', 'blob'):
                  raise ValueError(f'invalid source object: {source} ({kind})')
              object_id = git('rev-parse', f"{identity['commit']}:{source}")
              if re.fullmatch('[0-9a-f]{40}', object_id) is None:
                  raise ValueError(f'invalid object id: {source}')
              objects.append({'path': source, 'object': object_id})
          row['observedSourcePaths'] = sorted(paths)
          row['sourceObjects'] = objects
          path.write_text(json.dumps(row, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'source': identity, 'sourceObjectCount': len(objects)}))
          PY
          git add docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json
          git commit -s -m 'docs(knowledge.graph): bind exact final convergence source objects'
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          test "$(git ls-remote origin refs/heads/work/knowledge-graph-final-convergence-20260927 | cut -f1)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/work/knowledge-graph-final-convergence-20260927
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD HEAD^{tree}

      - name: Export focused source for inspection
        if: always()
        shell: bash
        run: |
          git diff --binary a126987b84737dbc2ee2592442a314117bddb4a2 > "$RUNNER_TEMP/kg-final-source.patch"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/kg-final-source-identity.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: knowledge-graph-final-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kg-final-source.patch
            ${{ runner.temp }}/kg-final-source-identity.txt
          if-no-files-found: error
          retention-days: 14

  kernel:
    needs: materialize
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.materialize.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and evidence parsers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.materialize.outputs.source-sha }}'
          git diff --exit-code
          python3 scripts/test_hepta_knowledge_graph_budget.py -v
          python3 scripts/hepta-knowledge-graph-target-measure.py --self-test
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
      - name: Check focused formatting
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-kg --package codex-hepta-memory -- --check
      - name: Test exact KG kernel
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-kg -- --nocapture
      - name: Strict KG kernel lint
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-kg --all-targets --no-deps -- -D warnings
      - name: Preserve exact source
        if: always()
        run: git diff --exit-code

  memory:
    needs: materialize
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.materialize.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test transaction-local query cache
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-memory --lib \
            cognitive_retrieval_observation_tests::typed_kg_relations_feed_only_their_declared_retrieval_channels \
            -- --exact --nocapture --test-threads=1
      - name: Exercise correction, reopen and non-resurrection
        working-directory: codex-rs
        env:
          HEPTA_KG_HISTORY_CORRECTIONS: "16"
        run: |
          cargo test --locked -p codex-hepta-memory --lib \
            cognitive_kg_benchmark_tests::history::qualification_kg_history_reopen_no_resurrection \
            -- --ignored --exact --nocapture --test-threads=1
      - name: Strict memory lint
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-memory --lib --no-deps -- -D warnings
      - name: Preserve exact source
        if: always()
        run: git diff --exit-code
