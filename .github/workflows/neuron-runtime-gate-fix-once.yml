name: Neuron runtime exact gate repair one shot

on:
  push:
    branches:
      - codex/neuron-runtime-five-phase-closure-v2
    paths:
      - .github/workflows/neuron-runtime-gate-fix-once.yml
      - scripts/neuron_runtime_apply_gate_repair.sh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: neuron-runtime-exact-gate-repair-${{ github.sha }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
      - name: Apply verify and commit bounded repairs
        shell: bash
        run: bash scripts/neuron_runtime_apply_gate_repair.sh
