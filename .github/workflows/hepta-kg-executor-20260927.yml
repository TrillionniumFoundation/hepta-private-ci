name: Execute exact knowledge.graph convergence

on:
  push:
    branches: [ops/kg-convergence-execute-20260927]
    paths:
      - ".github/workflows/hepta-kg-executor-20260927.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-kg-executor-20260927
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  CANDIDATE_BRANCH: ops/kg-convergence-execute-20260927
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact isolated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain)"

      - name: Apply all existing knowledge.graph transformations
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set +e
          scripts=(
            scripts/hepta-kg-convergence-apply-phase1.py
            scripts/hepta-kg-convergence-finalize.py
            scripts/hepta-kg-durable-writer-finalize.py
            scripts/hepta-kg-retrieval-finalize.py
            scripts/hepta-kg-scale-benchmark-finalize.py
          )
          python3 -m py_compile "${scripts[@]}" \
            >"$RUNNER_TEMP/kg-transform-compile.log" 2>&1
          status=$?
          if [ "$status" = 0 ]; then
            index=0
            names=(phase1 finalize durable retrieval scale)
            for script in "${scripts[@]}"; do
              python3 "$script" 2>&1 \
                | tee "$RUNNER_TEMP/kg-transform-${names[$index]}.log"
              status=${PIPESTATUS[0]}
              if [ "$status" != 0 ]; then
                break
              fi
              index=$((index + 1))
            done
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain transformation diagnostics and source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-graph-isolated-transform-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kg-transform-*.log
            codex-rs/hepta-kg/src/generation.rs
            codex-rs/hepta-kg/src/generation_convergence_tests.rs
            codex-rs/hepta-memory/src/cognitive_kg_store.rs
            codex-rs/hepta-memory/src/cognitive_retrieval.rs
            scripts/hepta-knowledge-graph-target-measure.py
            scripts/test_hepta_knowledge_graph_target_measure.py
            docs/modules/knowledge.graph/TECHNICAL.md
            qualification/module-execution-dossiers/detail/knowledge.graph.md
          if-no-files-found: error
          retention-days: 90

      - name: Enforce transformations
        env:
          STATUS: ${{ steps.transform.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STATUS" = 0

      - name: Qualify transformed kernel and durable owner
        id: qualify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=0
          (
            cd codex-rs
            cargo check --locked -p codex-hepta-kg -p codex-hepta-memory
          ) 2>&1 | tee "$RUNNER_TEMP/kg-cargo-check.log"
          check_status=${PIPESTATUS[0]}
          if [ "$check_status" != 0 ]; then status=$check_status; fi

          if [ "$status" = 0 ]; then
            (
              cd codex-rs
              cargo fmt --package codex-hepta-kg --package codex-hepta-memory
              cargo fmt --package codex-hepta-kg --package codex-hepta-memory -- --check
            ) 2>&1 | tee "$RUNNER_TEMP/kg-format.log"
            format_status=${PIPESTATUS[0]}
            if [ "$format_status" != 0 ]; then status=$format_status; fi
          fi

          if [ "$status" = 0 ]; then
            (
              cd codex-rs
              cargo test --locked -p codex-hepta-kg -- --nocapture
              cargo test --locked -p codex-hepta-memory --lib cognitive_kg -- --nocapture
              cargo test --locked -p codex-hepta-memory --lib cognitive_retrieval -- --nocapture
            ) 2>&1 | tee "$RUNNER_TEMP/kg-owner-tests.log"
            test_status=${PIPESTATUS[0]}
            if [ "$test_status" != 0 ]; then status=$test_status; fi
          fi

          if [ "$status" = 0 ]; then
            (
              cd codex-rs
              cargo clippy --locked \
                -p codex-hepta-kg -p codex-hepta-memory \
                --all-targets --no-deps -- -D warnings
            ) 2>&1 | tee "$RUNNER_TEMP/kg-owner-clippy.log"
            lint_status=${PIPESTATUS[0]}
            if [ "$lint_status" != 0 ]; then status=$lint_status; fi
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain build, test and lint logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-graph-isolated-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kg-cargo-check.log
            ${{ runner.temp }}/kg-format.log
            ${{ runner.temp }}/kg-owner-tests.log
            ${{ runner.temp }}/kg-owner-clippy.log
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce transformed qualification
        env:
          STATUS: ${{ steps.qualify.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STATUS" = 0

      - name: Refresh governed documents and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-indexes
          python3 scripts/hepta-module-docs.py verify
          rm -f scripts/hepta-kg-convergence-apply-phase1.py
          rm -f scripts/hepta-kg-convergence-finalize.py
          rm -f scripts/hepta-kg-durable-writer-finalize.py
          rm -f scripts/hepta-kg-retrieval-finalize.py
          rm -f scripts/hepta-kg-scale-benchmark-finalize.py
          rm -f .github/workflows/hepta-kg-convergence-apply.yml
          rm -f .github/workflows/hepta-kg-source-diagnostic.yml
          rm -f .github/workflows/hepta-kg-executor-20260927.yml
          git diff --check

      - name: Commit and publish tested source candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta KG Convergence Bot"
          git config user.email "hepta-kg-convergence@users.noreply.github.com"
          git add -A
          git commit -s -m "knowledge.graph: bound indexed queries and incremental writer"
          test -z "$(git status --porcelain)"
          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > "$RUNNER_TEMP/kg-source-sha.txt"
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Run canonical-cardinality high-fanout benchmark
        id: kernel_benchmark
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 15m \
            cargo test --locked --release -p codex-hepta-kg \
              canonical_cardinality_high_fanout_benchmark_receipt \
              -- --ignored --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/kg-kernel-benchmark-raw.log"
          status=${PIPESTATUS[0]}
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Parse canonical benchmark JSON
        if: steps.kernel_benchmark.outputs.status == '0'
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.sha }}
          CANDIDATE_TREE: ${{ steps.source.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/kg-kernel-benchmark-raw.log" \
            "$RUNNER_TEMP/kg-kernel-benchmark.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          prefix = "HEPTA_KNOWLEDGE_GRAPH_KERNEL_BENCHMARK="
          raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          payloads = [line.split(prefix, 1)[1].strip() for line in raw.splitlines() if prefix in line]
          if len(payloads) != 1:
              raise SystemExit(f"expected one kernel benchmark receipt, observed {len(payloads)}")
          receipt = json.loads(payloads[0])
          expected = {
              "schema": "hepta.knowledge-graph.kernel-benchmark.v1",
              "hostClass": "shared-runner-nonqualifying",
              "nodes": 4096,
              "edges": 32768,
              "totalSupports": 36864,
              "seedCount": 1,
              "returnedEdges": 128,
              "omittedEdges": 32640,
              "relationEdgesScanned": 32768,
              "selectedEdgesCloned": 128,
              "selectedSupportsCloned": 128,
          }
          for key, value in expected.items():
              if receipt.get(key) != value:
                  raise SystemExit(f"invalid benchmark {key}: {receipt.get(key)!r}")
          for key in ("buildNs", "validationNs", "queryNs"):
              value = receipt.get(key)
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  raise SystemExit(f"invalid benchmark {key}: {value!r}")
          receipt["sourceSha"] = os.environ["CANDIDATE_SHA"]
          receipt["sourceTree"] = os.environ["CANDIDATE_TREE"]
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain canonical benchmark JSON and raw log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-graph-isolated-kernel-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kg-source-sha.txt
            ${{ runner.temp }}/kg-kernel-benchmark.json
            ${{ runner.temp }}/kg-kernel-benchmark-raw.log
          if-no-files-found: error
          retention-days: 90

      - name: Enforce canonical benchmark
        env:
          STATUS: ${{ steps.kernel_benchmark.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STATUS" = 0
          test -s "$RUNNER_TEMP/kg-kernel-benchmark.json"

      - name: Measure exact source candidate
        id: measure
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 25m \
            python3 scripts/hepta-knowledge-graph-target-measure.py \
              --expected-sha "$CANDIDATE_SHA" \
              --host-profile-id github-hosted-debug-nonqualifying \
              --writes 32 \
              --query-samples 10 \
              --reopen-samples 3 \
              --contention-readers 2 \
              --contention-rounds 3 \
              --target-dir "$RUNNER_TEMP/kg-target" \
              --output "$RUNNER_TEMP/kg-benchmark.json" \
              --raw-output "$RUNNER_TEMP/kg-benchmark-raw.log" 2>&1 \
            | tee "$RUNNER_TEMP/kg-benchmark-driver.log"
          status=${PIPESTATUS[0]}
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain exact-source benchmark JSON and raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-graph-isolated-exact-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kg-source-sha.txt
            ${{ runner.temp }}/kg-benchmark.json
            ${{ runner.temp }}/kg-benchmark-raw.log
            ${{ runner.temp }}/kg-benchmark-driver.log
          if-no-files-found: error
          retention-days: 90

      - name: Enforce exact-source measurement
        env:
          STATUS: ${{ steps.measure.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STATUS" = 0

      - name: Rebind exact source map and commit evidence boundary
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.sha }}
          CANDIDATE_TREE: ${{ steps.source.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          python3 scripts/hepta-implementation-maps.py migrate --module knowledge.graph
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$CANDIDATE_SHA" --expected-tree "$CANDIDATE_TREE"
          git diff --check
          git add docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json
          git commit -s -m "docs(knowledge.graph): bind exact measured source identity"
          test -z "$(git status --porcelain)"

      - name: Verify final committed candidate
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$SHA" --expected-tree "$TREE"
          python3 scripts/hepta-technical-closure.py verify
          python3 scripts/test_hepta_knowledge_graph_target_measure.py
          python3 scripts/hepta-knowledge-graph-production-gate.py --self-test
          python3 scripts/hepta-knowledge-graph-production-gate.py verify-state \
            --policy qualification/knowledge-graph/PRODUCTION_QUALIFICATION.json \
            --state qualification/knowledge-graph/ACCEPTANCE_STATE.json \
            --require-inactive
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-kg
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-memory --lib cognitive_kg
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-memory --lib cognitive_retrieval
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-kg -p codex-hepta-memory \
            --all-targets --no-deps -- -D warnings
          git diff --check
          test -z "$(git status --porcelain)"
          git push origin "HEAD:$CANDIDATE_BRANCH"
