name: Hepta Lane E final remediation materializer

on:
  push:
    branches:
      - codex/lane-e-gap-closure-r23-20260911
    paths:
      - .github/workflows/hepta-lane-e-final-remediation.yml

permissions:
  contents: write

concurrency:
  group: hepta-lane-e-final-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Materialize closed-world and traceability repairs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "codex/lane-e-gap-closure-r23-20260911"
          python3 - <<'PY'
          from pathlib import Path

          matrix = Path("docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json")
          text = matrix.read_text(encoding="utf-8")
          old = '{"operation": "estimate_cluster_intervals", "nativeSymbol": "codex_hepta_intelligence_eval::estimate_cluster_intervals", "source": "codex-rs/hepta-intelligence-eval/src/ope.rs", "status": "implemented_existing"}'
          new = '{"operation": "estimate_cluster_intervals", "nativeSymbol": "codex_hepta_intelligence_eval::estimate_cluster_intervals", "source": "codex-rs/hepta-intelligence-eval/src/ope_confidence.rs", "status": "implemented_existing"}'
          if old not in text:
              if new not in text:
                  raise SystemExit("estimate_cluster_intervals mapping is neither old nor repaired")
          else:
              if text.count(old) != 1:
                  raise SystemExit("estimate_cluster_intervals mapping is ambiguous")
              text = text.replace(old, new, 1)
          matrix.write_text(text, encoding="utf-8")

          trace = Path("qualification/lane-e/TEST_TRACEABILITY.json")
          text = trace.read_text(encoding="utf-8")

          insertions = [
              (
                  '{"source": "codex-rs/hepta-learning-ledger/src/durable_tests.rs", "function": "failed_write_poisons_memory_and_requires_recovery"}',
                  '{"source": "codex-rs/hepta-learning-ledger/src/durable_tests.rs", "function": "unacknowledged_partial_tail_recovers_exact_predecessor_at_every_cut"}',
              ),
              (
                  '{"source": "codex-rs/hepta-learning-ledger/src/shadow_tests.rs", "function": "shadow_bridge_does_not_weaken_independent_terminal_outcome_rules"}',
                  '{"source": "codex-rs/hepta-learning-ledger/src/causal_v2_tests.rs", "function": "ledger_candidate_receipt_binds_generator_relative_completeness"}',
              ),
              (
                  '{"source": "codex-rs/hepta-learning-ledger/src/causal_v2_tests.rs", "function": "ledger_dataset_freeze_is_order_independent_and_rejects_duplicates"}',
                  '{"source": "codex-rs/hepta-learning-ledger/src/causal_v2_tests.rs", "function": "ledger_credit_batch_enforces_conservation"}',
              ),
              (
                  '{"source": "codex-rs/hepta-intelligence-eval/src/closure_tests.rs", "function": "eval_03_intersects_superiority_safety_retention_and_unlearning"}',
                  '{"source": "codex-rs/hepta-intelligence-eval/src/closure_tests.rs", "function": "evaluation_fails_candidate_when_interval_or_floor_does_not_pass"}',
              ),
              (
                  '{"source": "codex-rs/hepta-learning-artifacts/src/registry_tests.rs", "function": "event_identity_reuse_with_drift_fails"}',
                  '{"source": "codex-rs/hepta-learning-artifacts/src/closure_v2_tests.rs", "function": "art_01_manifest_v2_normalizes_complete_lineage"}',
              ),
              (
                  '{"source": "codex-rs/hepta-learning-artifacts/src/pinned_tests.rs", "function": "objective_and_compatibility_drift_are_pin_mismatches"}',
                  '{"source": "codex-rs/hepta-learning-artifacts/src/closure_v2_tests.rs", "function": "artifact_manifest_rejects_duplicate_lineage_and_missing_rollback_parent"}',
              ),
              (
                  '{"source": "codex-rs/hepta-learning-artifacts/src/closure_v2_tests.rs", "function": "art_03_registry_head_witness_rejects_rollback"}',
                  '{"source": "codex-rs/hepta-learning-artifacts/src/closure_v2_tests.rs", "function": "art_04_lifecycle_forbids_self_selection_and_state_skips"}',
              ),
          ]

          for anchor, addition in insertions:
              if addition in text:
                  continue
              needle = f"        {anchor}"
              if needle not in text or text.count(needle) != 1:
                  raise SystemExit(f"traceability anchor is missing or ambiguous: {anchor}")
              text = text.replace(needle, f"{needle},\n        {addition}", 1)

          if '"id": "ART-06"' not in text:
              raise SystemExit("ART-06 must already be registered before final materialization")
          trace.write_text(text, encoding="utf-8")
          PY

      - name: Materialize pinned rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification

      - name: Verify repaired source before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification \
            -- --check
          git diff --check

      - name: Publish one self-cleaning remediation commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-lane-e-final-remediation.yml

          mapfile -t changed < <(git diff --name-only | sort)
          allowed=(
            .github/workflows/hepta-lane-e-final-remediation.yml
            codex-rs/hepta-bellman-operator/src/learned_strict.rs
            codex-rs/hepta-intelligence-eval/src/holdout_journal.rs
            codex-rs/hepta-learning-artifacts/src/admission_v3.rs
            codex-rs/hepta-learning-artifacts/src/lifecycle_journal.rs
            docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json
            qualification/lane-e/TEST_TRACEABILITY.json
          )
          printf '%s\n' "${allowed[@]}" | sort > "${RUNNER_TEMP}/allowed"
          printf '%s\n' "${changed[@]}" > "${RUNNER_TEMP}/changed"
          comm -23 "${RUNNER_TEMP}/changed" "${RUNNER_TEMP}/allowed" > "${RUNNER_TEMP}/unexpected"
          test ! -s "${RUNNER_TEMP}/unexpected"
          grep -Fxq docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json "${RUNNER_TEMP}/changed"
          grep -Fxq qualification/lane-e/TEST_TRACEABILITY.json "${RUNNER_TEMP}/changed"
          grep -Fxq .github/workflows/hepta-lane-e-final-remediation.yml "${RUNNER_TEMP}/changed"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(lane-e): close verifier traceability and format blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
