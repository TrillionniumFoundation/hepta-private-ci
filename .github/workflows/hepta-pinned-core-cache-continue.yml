            p, binding = paths(), pins()
            expected = binding['consumer']['head'] if os.environ['SOURCE_KIND'] == 'head' else binding['consumer']['merge']
            actual = git('rev-parse', 'HEAD').decode().strip()
            tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
            status = git('status', '--porcelain', '--untracked-files=normal').decode()
            record = {'tested_commit': actual, 'tested_tree': tree, 'source_kind': os.environ['SOURCE_KIND'],
