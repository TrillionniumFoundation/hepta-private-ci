        from pathlib import PurePosixPath
        from core_cache_common import (
            DISK_RESERVE_BYTES, MAX_ARCHIVE_BYTES, MAX_CACHE_FILES, MAX_CACHE_INPUT_BYTES,
            PACK_MAX_SECONDS, TRANSFER_RESERVE_SECONDS,
            file_identity, output, paths, read_json, seconds_left, sha256_file, write_json,
        )

        def fingerprint(info):
            return (info.st_dev, info.st_ino, info.st_mode, info.st_size, info.st_mtime_ns, info.st_ctime_ns, info.st_nlink)

        def safe_name(name):
            path = PurePosixPath(name)
            return (not path.is_absolute() and len(path.parts) >= 2 and path.parts[0] in ('ac', 'cas')
                    and all(part not in ('', '.', '..') for part in path.parts)
                    and '\\' not in name and len(name) <= 1024
                    and all(32 <= ord(c) < 127 for c in name))

        def scan(cache, guard):
            assert cache.is_dir() and not cache.is_symlink()
            files, directories, total = {}, {}, 0
            for kind in ('ac', 'cas'):
                base = cache / kind
                if not base.exists():
                    continue
                assert base.is_dir() and not base.is_symlink(), 'cache roots must be actual directories'
                for current, dirs, names in os.walk(base, followlinks=False):
                    guard()
                    current = type(cache)(current)
                    info = current.lstat()
                    assert stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode)
                    directories[str(current.relative_to(cache))] = fingerprint(info)
                    dirs.sort()
                    names.sort()
                    for name in dirs:
                        child = current / name
                        child_info = child.lstat()
                        assert stat.S_ISDIR(child_info.st_mode) and not stat.S_ISLNK(child_info.st_mode), 'no linked cache directory'
                    for name in names:
                        path = current / name
                        info = path.lstat()
                        relative = path.relative_to(cache).as_posix()
                        assert safe_name(relative), 'noncanonical cache member name'
                        assert stat.S_ISREG(info.st_mode) and not stat.S_ISLNK(info.st_mode), 'only regular files are transferable'
                        assert relative not in files
                        files[relative] = fingerprint(info)
                        total += info.st_size
                        assert len(files) <= MAX_CACHE_FILES, 'cache member count exceeds the explicit packaging bound'
                        assert total <= MAX_CACHE_INPUT_BYTES, 'cache input bytes exceed the explicit packaging bound'
            assert files, 'empty cache is not transferable compiled work'
            assert any(n.startswith('ac/') for n in files) and any(n.startswith('cas/') for n in files), 'both action records and content blobs are required'
            return files, directories, total

        class LimitedWriter:
            def __init__(self, stream, directory, byte_limit, guard):
                self.stream, self.directory, self.byte_limit, self.guard = stream, directory, byte_limit, guard
                self.written, self.next_space_check = 0, 0

            def write(self, data):
                self.guard()
                assert self.written + len(data) <= self.byte_limit, 'compressed archive exceeds available-space/size bound'
                if self.written >= self.next_space_check:
                    assert shutil.disk_usage(self.directory).free >= DISK_RESERVE_BYTES + len(data), 'preserve disk reserve while packing'
                    self.next_space_check = self.written + 4 * 1024**2
                count = self.stream.write(data)
                assert count == len(data)
                self.written += count
                return count

            def flush(self):
                self.stream.flush()

            def tell(self):
                return self.written

        class HashingReader:
            def __init__(self, stream, guard):
                self.stream, self.guard, self.hasher, self.bytes = stream, guard, hashlib.sha256(), 0

            def read(self, size=-1):
                self.guard()
                assert size >= 0, 'unbounded file reads are not used by this packer'
                data = self.stream.read(size)
                self.hasher.update(data)
                self.bytes += len(data)
                return data

