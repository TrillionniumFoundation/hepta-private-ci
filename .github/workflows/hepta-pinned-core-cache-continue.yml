name: Hepta original Core verified-cache build continuation
'on':
  push:
    branches:
    - test/hepta-normal-core-cache-continue-20261104
permissions:
  contents: read
  actions: read
concurrency:
  group: hepta-pinned-core-cache-continue-20261104
  cancel-in-progress: false
jobs:
  core-build-cache:
    name: Core original target build continuation only (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
        - gnu
        - musl
    env:
      EXPECTED_HEAD: 103e4bcb3a6fbce57943a0c7c339d1d48808ce69
      EXPECTED_BASE: 3a81000aae08c658276958d678874aca4db5eedd
      EXPECTED_MERGE: 68c36639d609033334785b347273899f5abab500
      EXPECTED_TREE: 73d6f50dd52b5e30b536758335dbc82385f63ab3
      SOURCE_KIND: head
      BAZEL_PLATFORM: ${{ matrix.platform == 'gnu' && '//:local_linux' || '@rules_rs//rs/platforms:x86_64-unknown-linux-musl'
        }}
      CACHE_PLATFORM: ${{ matrix.platform }}
    steps:
    - name: Reserve the original 60-minute job for build and evidence handoff
      id: clock
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/normal-bazel"
        python3 - <<'PYCLOCK'
        import json, os, time
        from pathlib import Path
        started = time.time()
        deadline = started + 59 * 60
        record = {'job_started_epoch': started, 'internal_deadline_epoch': deadline,
            'job_timeout_minutes': 60, 'maximum_build_phase_seconds': 48 * 60,
            'post_build_reserve_seconds': 10 * 60, 'native_tests_requested': 0}
        (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/job-clock.json').write_text(json.dumps(record, indent=2) + '\n')
        with Path(os.environ['GITHUB_ENV']).open('a') as stream:
            stream.write('CORE_JOB_DEADLINE_EPOCH=' + str(deadline) + '\n')
        PYCLOCK
    - name: Fetch the exact harness and its bounded ancestry
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        fetch-depth: 32
        persist-credentials: false
    - name: Check out the exact tested source with bounded history
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ env.EXPECTED_HEAD }}
        fetch-depth: 32
        persist-credentials: false
    - name: Bind the harness and the exact tested source before execution
      id: source
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/normal-bazel"
        python3 - <<'PYSOURCE'
        import hashlib, json, os, re, subprocess
        from pathlib import Path
        def git(*args):
            return subprocess.check_output(['git', '--no-replace-objects', *args]).decode().strip()
        for key in ['EXPECTED_HEAD', 'EXPECTED_BASE', 'EXPECTED_MERGE', 'EXPECTED_TREE']:
            assert re.fullmatch(r'[0-9a-f]{40}', os.environ[key]), 'bind every immutable source identity before publication'
        assert os.environ['SOURCE_KIND'] == 'head'
        assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
        tested = git('rev-parse', 'HEAD')
        expected = os.environ['EXPECTED_HEAD'] if os.environ['SOURCE_KIND'] == 'head' else os.environ['EXPECTED_MERGE']
        assert tested == expected
        assert git('rev-parse', 'HEAD^{tree}') == os.environ['EXPECTED_TREE']
        if os.environ['SOURCE_KIND'] == 'prospective-merge':
            assert git('show', '-s', '--format=%P', 'HEAD').split() == [os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD']]
            assert git('merge-tree', '--write-tree', os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD']) == os.environ['EXPECTED_TREE']
        harness = os.environ['GITHUB_SHA']
        required_objects = {'harness': harness, 'candidate': os.environ['EXPECTED_HEAD'],
            'base': os.environ['EXPECTED_BASE'], 'tested': tested,
            'dependency_declaration': 'dc69725d957c79d8737eb5fbedfe6f213252317a',
            'cache_producer_source': '32401b2aff9b3cd976ccb10d928595c3b9d3568d'}
        for label, revision in required_objects.items():
            assert git('cat-file', '-t', revision) == 'commit', 'bounded checkout omitted required object: ' + label
        merge_base = git('merge-base', os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD'])
        assert merge_base == os.environ['EXPECTED_BASE'], 'expected base must remain the common ancestor in each bounded checkout'
        workflow = '.github/workflows/hepta-pinned-core-cache-continue.yml'
        assert os.environ['GITHUB_EVENT_NAME'] == 'push'
        assert os.environ['GITHUB_REF'] == 'refs/heads/test/hepta-normal-core-cache-continue-20261104'
        assert os.environ['GITHUB_REPOSITORY'] == 'TrillionniumFoundation/hepta-private-ci'
        assert git('show', '-s', '--format=%P', harness) == os.environ['EXPECTED_HEAD']
        assert git('diff-tree', '--no-commit-id', '--name-status', '-r', harness) == 'A\t' + workflow
        source = subprocess.check_output(['git', 'show', harness + ':' + workflow])
        assert git('status', '--porcelain', '--untracked-files=normal') == ''
        subprocess.run(['git', 'diff', '--exit-code', 'dc69725d957c79d8737eb5fbedfe6f213252317a', tested,
            '--', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion'], check=True)
        record = {'schema': 'hepta-core-build-only-cache-source-v1', 'tested_commit': tested,
            'tested_tree': os.environ['EXPECTED_TREE'], 'source_kind': os.environ['SOURCE_KIND'],
            'candidate': os.environ['EXPECTED_HEAD'], 'base': os.environ['EXPECTED_BASE'],
            'prospective_merge': os.environ['EXPECTED_MERGE'], 'harness_commit': harness,
            'workflow_sha256': hashlib.sha256(source).hexdigest(), 'bazel_platform': os.environ['BAZEL_PLATFORM'],
            'checkout_fetch_depth': 32, 'required_git_objects': required_objects,
            'observed_merge_base': merge_base, 'is_shallow_repository': git('rev-parse', '--is-shallow-repository'),
            'build_only': True, 'native_tests_requested': 0,
            'scope': 'Continue only the original //codex-rs/core:core-responses_headers-test from verified pinned compile data; preserve all declared runfiles; no native execution'}
        (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/source-before.json').write_text(json.dumps(record, indent=2) + '\n')
        print(json.dumps(record))
        PYSOURCE
    - name: Prepare the existing Bazel toolchain and repository cache
      id: prepare
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ matrix.platform == 'gnu' && 'x86_64-unknown-linux-gnu' || 'x86_64-unknown-linux-musl' }}
        cache-scope: bazel-core-build-cache
    - name: Import the already verified fixed dependency artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: '13245890316'
        run-id: '41664243615'
        repository: TrillionniumFoundation/hepta-private-ci
        github-token: ${{ github.token }}
        merge-multiple: true
        digest-mismatch: error
        path: ${{ runner.temp }}/normal-bazel-distdir
    - name: Recheck the fixed metadata and complete dependency bytes
      id: dependency
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYDEPENDENCY'
        import base64, hashlib, json, os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'
        assert sorted(path.name for path in root.iterdir()) == ['source.json', 'transfer.json', 'v5.1.0.tar.gz']
        metadata = (root / 'source.json').read_bytes()
        assert hashlib.sha256(metadata).hexdigest() == '7d88fc6db323947a11d1638fe95185e9c733c337a1d1e7b50cdcf487e29ce56e'
        source = json.loads(metadata)
        assert 'https://github.com/aws/aws-lc/archive/refs/tags/v5.1.0.tar.gz' in [source.get('url')] + source.get('urls', [])
        expected = 'a6bf6adfc5f9bba559d28554b7d3581b15f2813f03bc9f2ae19f0d915e97dadf'
        assert source['integrity'].startswith('sha256-')
        assert base64.b64decode(source['integrity'][7:], validate=True).hex() == expected
        archive = root / 'v5.1.0.tar.gz'
        assert archive.stat().st_size == 145542555
        with archive.open('rb') as stream:
            actual = hashlib.file_digest(stream, 'sha256').hexdigest()
        assert actual == expected
        transfer = json.loads((root / 'transfer.json').read_text())
        assert transfer['workflow_commit'] == '4a78bf9314197ef5a8ea97f67134fdac6795589f'
        assert transfer['workflow_run_id'] == '41664243615'
        assert transfer['declaration_source_commit'] == 'dc69725d957c79d8737eb5fbedfe6f213252317a'
        assert transfer['verified'] is True and transfer['source_sha256'] == expected and transfer['source_bytes'] == 145542555
        report = {'artifact_id': 13245890316, 'sha256': actual, 'bytes': archive.stat().st_size,
            'fixed_metadata_sha256': hashlib.sha256(metadata).hexdigest(), 'verified': True}
        (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/dependency-import.json').write_text(json.dumps(report, indent=2) + '\n')
        print(json.dumps(report))
        PYDEPENDENCY
        test "$(cat .bazelversion)" = '9.3.0'
        bazel --version | tee "$RUNNER_TEMP/normal-bazel/bazel-version.txt"
        test "$(cat "$RUNNER_TEMP/normal-bazel/bazel-version.txt")" = 'bazel 9.3.0'
    - name: Write the original producer and unchanged cache import validators outside the source
      id: scripts
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/normal-bazel/core_cache_common.py" <<'PYCORE0'
        """Helpers for the bounded Core compile-cache producer; no native runner."""
        import hashlib
        import json
        import os
        import signal
        import stat
        import subprocess
        import time
        from pathlib import Path

        TARGET = '//codex-rs/core:core-responses_headers-test'
        BUILD_PHASE_MAX_SECONDS = 48 * 60
        BUILD_STOP_RESERVE_SECONDS = 50
        POST_BUILD_RESERVE_SECONDS = 10 * 60
        PACK_MAX_SECONDS = 6 * 60
        TRANSFER_RESERVE_SECONDS = 4 * 60
        MAX_CACHE_FILES = 200000
        MAX_CACHE_INPUT_BYTES = 32 * 1024**3
        MAX_ARCHIVE_BYTES = 8 * 1024**3
        DISK_RESERVE_BYTES = 512 * 1024**2
        INPUT_FILES = (
            '.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'defs.bzl',
            'codex-rs/Cargo.toml', 'codex-rs/Cargo.lock', 'codex-rs/core/BUILD.bazel',
            'codex-rs/code-mode-host/BUILD.bazel',
        )

        def paths():
            temporary = Path(os.environ['RUNNER_TEMP']).resolve()
            root = temporary / 'normal-bazel'
            return {
                'root': root, 'evidence': root / 'core_build',
                'output_base': temporary / 'normal-core-output-base',
                'cache': temporary / 'normal-core-consumer-cache',
                'transfer': temporary / 'normal-core-cache-transfer',
            }

        def sha256_file(path):
            with Path(path).open('rb') as stream:
                return hashlib.file_digest(stream, 'sha256').hexdigest()

        def file_identity(path):
            path = Path(path)
            info = path.lstat()
            assert stat.S_ISREG(info.st_mode), 'expected a regular evidence file: ' + str(path)
            return {'path': str(path), 'bytes': info.st_size, 'sha256': sha256_file(path)}

        def read_json(path):
            return json.loads(Path(path).read_text())

        def write_json(path, value):
            path = Path(path)
            temporary = path.with_name(path.name + '.tmp')
            with temporary.open('x') as stream:
                json.dump(value, stream, indent=2)
                stream.write('\n')
            os.replace(temporary, path)

        def output(key, value):
            assert key.replace('_', '').isalnum()
            value = str(value)
            assert '\n' not in value and '\r' not in value
            with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
                stream.write(key + '=' + value + '\n')

        def seconds_left():
            return float(os.environ['CORE_JOB_DEADLINE_EPOCH']) - time.time()

        def stop_group(process, deadline):
            """Only signal this invocation's new process group; never other jobs."""
            for signum, grace in ((signal.SIGINT, 30), (signal.SIGTERM, 10), (signal.SIGKILL, 5)):
                if process.poll() is not None:
                    break
                try:
                    os.killpg(process.pid, signum)
                except ProcessLookupError:
                    pass
                wait = max(0.01, min(grace, deadline - time.monotonic()))
                try:
                    process.wait(timeout=wait)
                except subprocess.TimeoutExpired:
                    pass
            return process.poll()

        def configured_bazel_options():
            p = paths()
            # Bazel 9.3 BuildCommand admits TestOptions; cquery inherits TestCommand.
            # Keep the exact test configuration for build, cquery and test.
            return ['--jobs=2', '--cache_test_results=no', '--test_output=all', '--flaky_test_attempts=1',
                '--disk_cache=' + str(p['cache']),
                '--distdir=' + str(Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'),
                '--platforms=' + os.environ['BAZEL_PLATFORM'], '--test_arg=--nocapture']

        def producer_binding():
            p = paths()
            source = read_json(p['root'] / 'source-before.json')
            assert source['source_kind'] == 'head'
            assert source['tested_commit'] == os.environ['EXPECTED_HEAD']
            assert source['tested_tree'] == os.environ['EXPECTED_TREE']
            assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
            pins_path = p['root'] / 'consumer-pins.json'
            assert sha256_file(pins_path) == '24aa28718e88ea3af2e5b7c67cacc07405918c1f3537ba6dd6a80bee3e1a0bdb'
            upstream = read_json(pins_path)
            lane = upstream['platforms'][os.environ['CACHE_PLATFORM']]
            assert upstream['producer']['harness'] == '5449c700023295a45e8d04dbecdbe911d8df0a70'
            assert upstream['producer']['run_id'] == 41737096331
            assert upstream['consumer']['head'] == os.environ['EXPECTED_HEAD']
            assert upstream['consumer']['tree'] == os.environ['EXPECTED_TREE']
            assert lane['bazel_platform'] == os.environ['BAZEL_PLATFORM']
            restored = read_json(p['root'] / 'cache_consumer/cache-install.json')
            assert restored['result'] == 'PASS_VERIFIED_COMPILE_DATA_INSTALLED'
            assert restored['producer_grants_native_admission'] is False
            assert restored['consumer_build_required'] is True
            assert restored['producer_cache_kind'] == 'partial_build_only'
            assert restored['producer_build_result'] == 'FAIL'
            assert restored['producer_source']['tested_commit'] == upstream['producer']['head']
            assert restored['producer_source']['tested_tree'] == upstream['producer']['tree']
            assert restored['installed_directory'] == str(p['cache'])
            assert restored['consumer_source']['tested_commit'] == source['tested_commit']
            assert restored['consumer_source']['tested_tree'] == source['tested_tree']
            assert restored['consumer_source']['status'] == ''
            downloaded = read_json(p['root'] / 'cache_consumer/producer-download.json')
            assert downloaded['result'] == 'PASS_PINNED_ARTIFACT_BYTES'
            assert downloaded['producer_run']['id'] == upstream['producer']['run_id']
            assert downloaded['producer_run']['head_sha'] == upstream['producer']['harness']
            assert downloaded['artifacts']['cache']['id'] == lane['cache']['id']
            assert downloaded['downloads']['cache']['bytes'] == lane['cache']['bytes']
            assert downloaded['downloads']['cache']['sha256'] == lane['cache']['sha256']
            inputs = []
            for name in INPUT_FILES:
                row = file_identity(Path.cwd() / name)
                row['path'] = name
                inputs.append(row)
            assert inputs == restored['consumer_source']['inputs']
            assert inputs == restored['producer_input_files']
            scripts = []
            for name in ('core_cache_common.py', 'core_build.py', 'core_shutdown.py', 'core_pack.py',
                         'core_transfer_receipt.py', 'consumer_common.py', 'fetch_producer.py', 'verify_install_cache.py'):
                row = file_identity(p['root'] / name)
                row['path'] = name
                scripts.append(row)
            evidence = []
            for name in ('consumer-pins.json', 'cache_consumer/producer-download.json',
                         'cache_consumer/cache-install.json', 'cache_consumer/producer-cache-manifest.json',
                         'cache_consumer/producer-cache-pack.json', 'cache_consumer/source-before-cache-install.json',
                         'cache_consumer/source-after-cache-install.json'):
                row = file_identity(p['root'] / name)
                row['path'] = name
                evidence.append(row)
            return {
                'repository': os.environ['GITHUB_REPOSITORY'],
                'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                'job': os.environ['GITHUB_JOB'], 'harness_commit': os.environ['GITHUB_SHA'],
                'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
                'source': source, 'source_before': file_identity(p['root'] / 'source-before.json'),
                'source_inputs': inputs, 'producer_scripts': scripts,
                'platform': os.environ['BAZEL_PLATFORM'], 'target': TARGET,
                'original_profile': 'Same original Core target and configured options as the verified consumer; no timeout, feature, profile or runfile override.',
                'prior_compile_cache': {'producer': upstream['producer'], 'cache_artifact': lane['cache'],
                    'final_evidence_artifact': lane['final_evidence'], 'inner_members': lane['inner_members'],
                    'import_evidence': evidence, 'imported_file_count': restored['verified_file_count'],
                    'imported_raw_bytes': restored['input_bytes'], 'prior_build_result': 'FAIL',
                    'cache_kind': 'VERIFIED_PARTIAL_COMPILE_DATA', 'native_admission': False},
                'native_tests_requested': 0, 'native_admission': False,
            }
        PYCORE0
        cat > "$RUNNER_TEMP/normal-bazel/core_build.py" <<'PYCORE1'
        """One bounded bazel build of the original Core target; never bazel test."""
        import json
        import os
        import subprocess
        import sys
        import time
        from pathlib import Path
        from core_cache_common import (
            BUILD_PHASE_MAX_SECONDS, BUILD_STOP_RESERVE_SECONDS, POST_BUILD_RESERVE_SECONDS,
            TARGET, file_identity, output, paths, producer_binding, seconds_left,
            sha256_file, stop_group, write_json, read_json, configured_bazel_options,
        )

        def main():
            p = paths()
            p['evidence'].mkdir(mode=0o700)
            record = {
                'schema': 'hepta-core-build-only-result-v2', 'result': 'FAIL',
                'build_complete': False, 'build_only': True, 'native_tests_requested': 0,
                'native_admission': False, 'target': TARGET, 'cache_kind': 'partial_build_only',
                'build_exit': None, 'build_deadline_expired': False,
                'original_job_timeout_minutes': 60, 'maximum_build_phase_seconds': BUILD_PHASE_MAX_SECONDS,
                'post_build_reserve_seconds': POST_BUILD_RESERVE_SECONDS,
                'test_execution_observed': False, 'build_started': False,
            }
            started = time.monotonic()
            process = None
            try:
                record['producer'] = producer_binding()
                restored = read_json(p['root'] / 'cache_consumer/cache-install.json')
                assert restored['result'] == 'PASS_VERIFIED_COMPILE_DATA_INSTALLED'
                assert restored['producer_grants_native_admission'] is False
                assert restored['installed_directory'] == str(p['cache'])
                assert p['cache'].is_dir() and not p['cache'].is_symlink()
                assert set(child.name for child in p['cache'].iterdir()) == {'ac', 'cas'}
                assert all((p['cache'] / name).is_dir() and not (p['cache'] / name).is_symlink() for name in ('ac', 'cas'))
                p['output_base'].mkdir(mode=0o700)
                assert not p['output_base'].is_symlink()
                limit = min(BUILD_PHASE_MAX_SECONDS, int(seconds_left()) - POST_BUILD_RESERVE_SECONDS)
                assert limit > BUILD_STOP_RESERVE_SECONDS, 'insufficient job time for a bounded build and evidence transfer'
                command = ['bazel', '--output_base=' + str(p['output_base']), 'build',
                    *configured_bazel_options(),
                    '--build_event_json_file=' + str(p['evidence'] / 'build-events.jsonl'), TARGET]
                record.update({'command': command, 'cwd': os.getcwd(),
                    'isolated_output_base': str(p['output_base']), 'fresh_disk_cache': str(p['cache']),
                    'cache_origin': 'verified_pinned_partial_import',
                    'actual_build_phase_limit_seconds': limit, 'client_stop_reserve_seconds': BUILD_STOP_RESERVE_SECONDS,
                    'sandbox_env_present': {key: key in os.environ for key in ('CODEX_SANDBOX', 'CODEX_SANDBOX_NETWORK_DISABLED')}})
                write_json(p['evidence'] / 'command.json', record)
                build_started = time.monotonic()
                phase_deadline = build_started + limit
                with (p['evidence'] / 'bazel.log').open('xb') as log:
                    process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                    record['build_started'] = True
                    record['client_pid'] = process.pid
                    try:
                        record['build_exit'] = process.wait(timeout=limit - BUILD_STOP_RESERVE_SECONDS)
                    except subprocess.TimeoutExpired:
                        record['build_deadline_expired'] = True
                        record['build_exit'] = stop_group(process, phase_deadline)
                record['build_phase_wall_seconds'] = time.monotonic() - build_started
                assert process.poll() is not None, 'build client did not terminate; cache is not quiescent'
                (p['evidence'] / 'build.exit').write_text(str(record['build_exit']) + '\n')
                record['build_client_stopped'] = True

                event_path = p['evidence'] / 'build-events.jsonl'
                assert event_path.is_file(), 'missing original build BEP'
                completed, finished, configurations, options, starts, test_events = [], [], [], [], [], []
                malformed = []
                line_count = 0
                with event_path.open('rb') as stream:
                    for line_count, raw in enumerate(stream, 1):
                        if not raw.strip():
                            continue
                        try:
                            event = json.loads(raw)
                        except (json.JSONDecodeError, UnicodeDecodeError) as error:
                            malformed.append({'line': line_count, 'error': str(error)})
                            continue
                        eid = event.get('id', {})
                        if any(k in eid for k in ('testResult', 'testSummary')) or event.get('action', {}).get('type') == 'TestRunner':
                            test_events.append(event)
                        if eid.get('targetCompleted', {}).get('label') == TARGET:
                            completed.append(event)
                        if 'buildFinished' in eid:
                            finished.append(event)
                        if 'configuration' in eid:
                            configurations.append(event)
                        if 'optionsParsed' in event:
                            options.append(event)
                        if 'started' in event:
                            starts.append(event)
                record.update({'original_bep': file_identity(event_path), 'bep_line_count': line_count,
                    'bep_malformed_lines': malformed, 'target_completion': completed, 'build_finished': finished,
                    'configurations': configurations, 'parsed_options': options, 'build_starts': starts,
                    'test_execution_observed': bool(test_events), 'unexpected_test_events': test_events})
                assert not test_events, 'a build-only producer must not contain any observed TestRunner/native result'
                assert not malformed, 'an interrupted/malformed BEP cannot qualify a complete build'
                assert not record['build_deadline_expired'] and record['build_exit'] == 0
                assert len(completed) == 1 and completed[0].get('completed', {}).get('success') is True
                configuration_id = completed[0]['id']['targetCompleted']['configuration']['id']
                matching_configuration = [event for event in configurations if event['id']['configuration'].get('id') == configuration_id]
                assert len(matching_configuration) == 1, 'one exact configured target identity is required'
                record['configured_target_id'] = configuration_id
                assert len(finished) == 1
                terminal = finished[0]['finished']
                assert terminal.get('overallSuccess') is True
                assert terminal.get('exitCode', {}).get('name') == 'SUCCESS'
                assert terminal.get('exitCode', {}).get('code', 0) == 0
                assert len(starts) == 1 and starts[0]['started']['command'] == 'build'
                assert starts[0]['started']['buildToolVersion'] == Path('.bazelversion').read_text().strip()
                assert len(options) == 1
                record['build_complete'] = True
