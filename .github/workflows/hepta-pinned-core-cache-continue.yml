                    kind = 'complete_target_build' if complete else 'partial_build_only'
                    assert bindings['cache_kind'] == pack['cache_kind'] == kind
                    assert bindings['build_complete'] == pack['build_complete'] == build['build_complete']
                    assert bindings['producer_build_result'] == pack['producer_build_result'] == build['result']
                    assert pack['result'] == ('VERIFIED_COMPLETE_BUILD_CACHE_BYTES' if complete else 'VERIFIED_PARTIAL_COMPILE_DATA')
                    full_pack = obj('core_build/pack-result.json')
                    assert all(full_pack.get(key) == value for key, value in pack.items())
                    upload = obj('cache-upload-outcome.json')
                    assert upload['result'] == 'UPLOADED_CACHE_DATA_ONLY'
                    assert str(upload['run_id']) == str(producer['run_id']) and str(upload['run_attempt']) == '1'
                    assert upload['harness_commit'] == producer['harness'] and upload['source_head'] == producer['head'] and upload['source_tree'] == producer['tree']
                    assert upload['platform'] == lane['bazel_platform'] and upload['native_admission'] is False and upload['core_native_pass'] is False
                    assert upload['archive'] == pack['archive'] and upload['manifest'] == pack['manifest']
                    assert upload['cache_kind'] == kind and upload['build_complete'] == build['build_complete']
                    assert int(upload['cache_artifact_id']) == lane['cache']['id'] and upload['cache_artifact_digest'] == lane['cache']['sha256']
                    assert upload['pack_receipt_sha256'] == evidence_hashes['core_build/pack-result.json']['sha256']
                    assert all(upload['outcomes'][key] == 'success' for key in ('SHUTDOWN_OUTCOME', 'SOURCE_AFTER_OUTCOME', 'PACK_OUTCOME', 'CACHE_UPLOAD_OUTCOME'))
                    if complete:
                        assert upload['outcomes']['BUILD_OUTCOME'] == 'success'
                    else:
                        assert upload['outcomes']['BUILD_OUTCOME'] == 'failure', 'partial producer failure must remain visible'
                    rows = manifest['files']
                    assert 0 < len(rows) == manifest['file_count'] <= MAX_FILES
                    expected = {}
                    for row in rows:
                        assert safe_path(row['path'], cache=True) and row['path'] not in expected
                        assert isinstance(row['bytes'], int) and row['bytes'] >= 0 and row['archive_mode'] == '0600'
                        assert len(row['sha256']) == 64 and all(c in '0123456789abcdef' for c in row['sha256'])
                        expected[row['path']] = row
                    total = sum(row['bytes'] for row in rows)
                    assert total == manifest['input_bytes'] == pack['input_bytes'] and total <= MAX_RAW_BYTES
                    assert manifest['ac_file_count'] == sum(name.startswith('ac/') for name in expected) > 0
                    assert manifest['cas_file_count'] == sum(name.startswith('cas/') for name in expected) > 0
                    assert pack['file_count'] == len(rows)
                    build_headroom = max(4 * 1024**3, total // 2)
                    free = shutil.disk_usage(p['quarantine']).free
                    assert free >= total + RESERVE_BYTES
                    assert free + lane['cache']['bytes'] >= total + build_headroom + RESERVE_BYTES
                    validated = tar_members(cache, expected, guard)
                    assert not p['cache'].exists() and not p['pending_cache'].exists()
                    p['pending_cache'].mkdir(mode=0o700)
                    installed = tar_members(cache, expected, guard, p['pending_cache'])
                    assert installed == validated == len(rows)
                    actual_paths = set()
                    for current, dirs, files in os.walk(p['pending_cache'], followlinks=False):
                        for name in dirs:
                            child = Path(current) / name
                            assert child.is_dir() and not child.is_symlink()
                        for name in files:
                            child = Path(current) / name
                            actual_paths.add(child.relative_to(p['pending_cache']).as_posix())
                            assert child.is_file() and not child.is_symlink()
                    assert actual_paths == set(expected)
                    (p['evidence'] / 'producer-cache-manifest.json').write_bytes(cache.read('core-cache-manifest.json'))
                    (p['evidence'] / 'producer-cache-pack.json').write_bytes(cache.read('cache-pack.json'))
                    assert not p['cache'].exists()
                    os.rename(p['pending_cache'], p['cache'])
                    after_consumer = source_snapshot('after-cache-install')
                    assert after_consumer == before
                    record.update({'result': 'PASS_VERIFIED_COMPILE_DATA_INSTALLED', 'producer_cache_kind': kind,
                        'producer_build_result': build['result'], 'producer_job_conclusion': downloaded['producer_job']['conclusion'],
                        'producer_source': source, 'consumer_source': before, 'producer_input_files': inputs,
                        'input_changes': [row['path'] for row in before['inputs'] if next(old for old in inputs if old['path'] == row['path'])['sha256'] != row['sha256']],
                        'verified_file_count': installed, 'input_bytes': total, 'build_output_headroom_reserved': build_headroom,
                        'archive_pin': lane['inner_members']['core-action-cache.tar.gz'],
                        'manifest_pin': lane['inner_members']['core-cache-manifest.json'],
                        'installed_directory': str(p['cache']), 'evidence_members': evidence_hashes,
                        'only_ac_cas_installed': True, 'all_members_rehashed_before_install': True,
                        'all_members_rehashed_while_installing': True, 'gzip_crc_and_zip_crc_validated': True})
                # Only this invocation's verified transport copy is released, after the ZIP is closed.
                # Producer service artifacts, final evidence ZIP, manifest and installed ac/cas remain.
                if record['result'] == 'PASS_VERIFIED_COMPILE_DATA_INSTALLED':
                    (p['quarantine'] / 'cache.zip').unlink()
                    record['verified_cache_transport_copy_removed'] = True
                    assert shutil.disk_usage(p['quarantine']).free >= build_headroom + RESERVE_BYTES
            except Exception as error:
                record['result'] = 'FAIL'
                record['error'] = type(error).__name__ + ': ' + str(error)
            finally:
                if alarm_enabled:
                    signal.setitimer(signal.ITIMER_REAL, 0)
                write_json(p['evidence'] / 'cache-install.json', record)
                print(json.dumps({k: record.get(k) for k in ('result', 'producer_cache_kind', 'verified_file_count', 'error')}))
            return 0 if record['result'] == 'PASS_VERIFIED_COMPILE_DATA_INSTALLED' else 1

        if __name__ == '__main__':
            sys.exit(main())
