            assert value['schema'] == 'hepta-core-cache-consumer-pins-v1'
            assert 'UNBOUND' not in json.dumps(value), 'every source and artifact pin must be reviewed and bound before publication'
            assert value['original_target'] == TARGET and value['original_timeout_seconds'] == 900
            assert len(value['original_names']) == len(set(value['original_names'])) == 4
            return value

        def read_json(path):
            return json.loads(Path(path).read_text())

        def write_json(path, value):
            path = Path(path)
            temporary = path.with_name(path.name + '.tmp')
            with temporary.open('x') as stream:
                json.dump(value, stream, indent=2)
                stream.write('\n')
            os.replace(temporary, path)

        def sha256_file(path):
            with Path(path).open('rb') as stream:
