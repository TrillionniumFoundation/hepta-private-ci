        python3 "$RUNNER_TEMP/normal-bazel/fetch_producer.py"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Verify producer evidence and every member before installing ac/cas only
      id: restore
      if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
      timeout-minutes: 11
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/verify_install_cache.py"
    - name: Continue only the original Core target within the original maximum 48-minute build phase
      id: build
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome
        == 'success' && steps.scripts.outcome == 'success' && steps.restore.outcome == 'success' }}
      timeout-minutes: 49
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/core_build.py"
    - name: Stop only the isolated producer Bazel server before any cache snapshot
      id: shutdown
      if: ${{ always() && steps.scripts.outcome == 'success' }}
      timeout-minutes: 2
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/core_shutdown.py"
    - name: Retain the exact source state after every outcome
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/normal-bazel"
        git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/normal-bazel/source-after.txt"
        git status --porcelain --untracked-files=normal > "$RUNNER_TEMP/normal-bazel/source-after-status.txt"
        expected="$EXPECTED_HEAD"
        if [ "$SOURCE_KIND" = prospective-merge ]; then expected="$EXPECTED_MERGE"; fi
        test "$(git rev-parse HEAD)" = "$expected"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        test ! -s "$RUNNER_TEMP/normal-bazel/source-after-status.txt"
      id: source_after
      timeout-minutes: 1
    - name: Upload original build, shutdown, and source evidence before packaging
      id: small_evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      timeout-minutes: 2
      with:
        name: core-continue-evidence-before-pack-${{ matrix.platform }}-${{ env.EXPECTED_HEAD }}
        path: ${{ runner.temp }}/normal-bazel/
        if-no-files-found: error
        retention-days: 30
    - name: Pack only stopped ac/cas regular files and fully rehash the archive members
      id: pack
      shell: bash
      timeout-minutes: 7
      if: ${{ !cancelled() && steps.scripts.outcome == 'success' && steps.shutdown.outcome == 'success' && steps.source_after.outcome
        == 'success' && steps.small_evidence.outcome == 'success' }}
      env:
        SMALL_EVIDENCE_OUTCOME: ${{ steps.small_evidence.outcome }}
        SMALL_EVIDENCE_ARTIFACT_ID: ${{ steps.small_evidence.outputs.artifact-id }}
        SMALL_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.small_evidence.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/core_pack.py"
    - name: Upload verified cache data separately without changing the build verdict
      id: cache_upload
      if: ${{ !cancelled() && steps.pack.outcome == 'success' && steps.pack.outputs.archive_verified == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      timeout-minutes: 2
      with:
        name: core-continue-cache-${{ matrix.platform }}-${{ env.EXPECTED_HEAD }}
        path: |
          ${{ runner.temp }}/normal-core-cache-transfer/core-action-cache.tar.gz
          ${{ runner.temp }}/normal-core-cache-transfer/core-cache-manifest.json
          ${{ runner.temp }}/normal-core-cache-transfer/cache-pack.json
        compression-level: 0
        if-no-files-found: error
        retention-days: 30
    - name: Record the actual upload outcome without granting native admission
      id: transfer
      if: ${{ always() && steps.scripts.outcome == 'success' }}
      shell: bash
      timeout-minutes: 1
      env:
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        SHUTDOWN_OUTCOME: ${{ steps.shutdown.outcome }}
        SOURCE_AFTER_OUTCOME: ${{ steps.source_after.outcome }}
        PACK_OUTCOME: ${{ steps.pack.outcome }}
        CACHE_UPLOAD_OUTCOME: ${{ steps.cache_upload.outcome }}
        CACHE_ARTIFACT_ID: ${{ steps.cache_upload.outputs.artifact-id }}
        CACHE_ARTIFACT_DIGEST: ${{ steps.cache_upload.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/core_transfer_receipt.py"
    - name: Retain packaging and transfer receipts after every outcome
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      timeout-minutes: 1
      with:
        name: core-continue-evidence-after-pack-${{ matrix.platform }}-${{ env.EXPECTED_HEAD }}
        path: ${{ runner.temp }}/normal-bazel/
        if-no-files-found: error
        retention-days: 30
