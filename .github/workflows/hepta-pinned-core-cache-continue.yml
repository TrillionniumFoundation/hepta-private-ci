            for name in INPUT_FILES:
                row = identity(name); row['path'] = name; record['inputs'].append(row)
            for name, expected_file in binding['core_invariants'].items():
                data = Path(name).read_bytes()
                check_bytes(data, expected_file)
                record['core_invariants'].append({'path': name, **expected_file})
            write_json(p['evidence'] / ('source-' + label + '.json'), record)
            assert actual == expected and tree == binding['consumer']['tree'] and status == ''
            assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
            assert os.environ['BAZEL_PLATFORM'] == binding['platforms'][os.environ['CACHE_PLATFORM']]['bazel_platform']
            return record

        def common_bazel_options():
            p = paths()
            # Bazel 9.3 BuildCommand admits TestOptions; cquery inherits TestCommand.
            # Keep the exact test configuration for build, cquery and test.
            return ['--jobs=2', '--cache_test_results=no', '--test_output=all', '--flaky_test_attempts=1',
                '--disk_cache=' + str(p['cache']),
                '--distdir=' + str(Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'),
                '--platforms=' + os.environ['BAZEL_PLATFORM'], '--test_arg=--nocapture']

        def bazel(command):
            return ['bazel', '--output_base=' + str(paths()['output_base']), command, *common_bazel_options()]

        def read_events(path):
            with Path(path).open('rb') as stream:
                return [json.loads(line) for line in stream if line.strip()]

        def check_build_finished(events, command):
            starts = [e for e in events if 'started' in e]
            finished = [e for e in events if 'buildFinished' in e.get('id', {})]
            assert len(starts) == len(finished) == 1
            assert starts[0]['started']['command'] == command
            assert starts[0]['started']['buildToolVersion'] == '9.3.0'
            end = finished[0]['finished']
            assert end.get('overallSuccess') is True
            assert end['exitCode']['name'] == 'SUCCESS' and end['exitCode'].get('code', 0) == 0
            completions = [e for e in events if e.get('id', {}).get('targetCompleted', {}).get('label') == TARGET]
            assert len(completions) == 1
            completed = completions[0]
            assert completed['completed'].get('success') is True
            cfg = completed['id']['targetCompleted']['configuration']
            configs = [e for e in events if e.get('id', {}).get('configuration') == cfg]
            assert len(configs) == 1
            options = [e for e in events if 'optionsParsed' in e]
            assert len(options) == 1
            return {'start': starts[0], 'finished': finished[0], 'completion': completed,
                'configuration': configs[0], 'options': options[0]}

        def query_elf(directory, prefix):
            cmd = [*bazel('cquery'), '--output=files', TARGET]
            result = run_logged(cmd, directory / prefix, min(105, int(seconds_left()) - 150))
            assert result['exit_code'] == 0 and not result['deadline_expired']
            found = []
            # cquery stdout shares this log with stderr; only existing regular ELF paths count.
            for line in (directory / (prefix + '.log')).read_text().splitlines():
                candidate = Path(line)
                if len(line) > 4096:
                    continue
                try:
                    exists = candidate.is_file()
                except OSError:
                    continue
                if exists:
                    with candidate.open('rb') as stream:
                        is_elf = stream.read(4) == b'\x7fELF'
                    if is_elf:
                        assert candidate.resolve().is_relative_to(paths()['output_base'].resolve())
                        found.append(identity(candidate.resolve()))
            assert len(found) == 1, 'one original Core test ELF is required'
            write_json(directory / (prefix + '-identity.json'), found[0])
            return found[0]
