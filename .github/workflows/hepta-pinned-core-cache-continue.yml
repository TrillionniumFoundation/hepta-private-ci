            return float(os.environ['CORE_JOB_DEADLINE_EPOCH']) - time.time()

        def stop_group(process, deadline):
            for sig, grace in ((signal.SIGINT, 30), (signal.SIGTERM, 10), (signal.SIGKILL, 5)):
                if process.poll() is not None:
                    break
                try:
                    os.killpg(process.pid, sig)
                except ProcessLookupError:
                    pass
                try:
                    process.wait(timeout=max(0.01, min(grace, deadline - time.monotonic())))
                except subprocess.TimeoutExpired:
                    pass
            return process.poll()

