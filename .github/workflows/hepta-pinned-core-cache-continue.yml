    - name: Bind the exact producer run and download exact artifact bytes
      id: fetch
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome
        == 'success' && steps.scripts.outcome == 'success' }}
      timeout-minutes: 9
