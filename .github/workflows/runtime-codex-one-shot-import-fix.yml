name: runtime.codex one-shot import fix

on:
  push:
    branches:
      - runtime-codex/closure-20260927

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: runtime-codex/closure-20260927
          persist-credentials: true
      - name: Apply focused import fix and remove this workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('codex-rs/hepta-infer-worker-host/src/native_execution.rs')
          text = path.read_text()
          needle = 'use super::*;\n'
          addition = needle + 'use codex_app_server_protocol::TurnStartParams;\n'
          if 'use codex_app_server_protocol::TurnStartParams;\n' not in text:
              if needle not in text:
                  raise SystemExit('expected execution import anchor missing')
              path.write_text(text.replace(needle, addition, 1))
          Path('.github/workflows/runtime-codex-one-shot-import-fix.yml').unlink(missing_ok=True)
      - name: Commit focused repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'runtime.codex: import turn start params in execution state machine' || true
          git push origin HEAD:runtime-codex/closure-20260927
