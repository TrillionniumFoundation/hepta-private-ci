name: tmp-parent-final-cleanup-v2-20260910

on:
  push:
    branches:
      - codex/hepta-all-gap-closure-20260908
    paths:
      - .github/workflows/tmp-parent-final-cleanup-v2-20260910.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tmp-parent-final-cleanup-v2-20260910
  cancel-in-progress: false

jobs:
  cleanup-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out latest carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Commit clean workflow set
        shell: bash
        run: |
          set -euo pipefail
          carrier="$(git rev-parse HEAD)"
          find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -delete
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): finalize clean parent workflow set'
          test "$(git rev-parse HEAD^)" = "$carrier"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify parent repository invariants
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -quit)"
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          git show --check --oneline --no-renames HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish clean parent
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/hepta-all-gap-closure-20260908
