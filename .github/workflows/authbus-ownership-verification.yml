name: AuthBus immutable ownership verification

on:
  push:
    branches: [work/authbus-ownership-transactions-20260928]
  pull_request:
    paths:
      - 'codex-rs/hepta-authbus/**'
      - 'codex-rs/hepta-authbus-p1-3-qualification/**'
      - 'codex-rs/hepta-evidence/**'
      - 'codex-rs/hepta-bao-adapter/**'
      - 'codex-rs/hepta-agentd/tests/kernel_evidence_product.rs'
      - 'codex-rs/hepta-agentd/src/objective_runtime.rs'
      - 'codex-rs/Cargo.lock'
      - 'docs/modules/auth.authbus/**'
      - 'scripts/check-authbus-closed-world.py'
      - 'scripts/authbus_verification_evidence.py'
      - 'scripts/test_authbus_verification_evidence.py'
      - '.github/workflows/authbus-ownership-verification.yml'

permissions:
  contents: read

concurrency:
  group: authbus-ownership-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-source:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Retain exact input identity and sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authbus-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/authbus-evidence/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/authbus-evidence/source-tree.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/authbus-evidence/authbus-inputs.tar.gz" HEAD codex-rs/hepta-authbus codex-rs/hepta-evidence codex-rs/hepta-bao-adapter codex-rs/hepta-agentd codex-rs/hepta-authbus-p1-3-qualification codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/rust-toolchain.toml docs/modules/auth.authbus docs/lane-a-foundation/auth.authbus scripts .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: authbus-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/authbus-evidence/
          retention-days: 14
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          save-if: true
      - name: Exact-source format and public-boundary inventory
        id: format
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.95.0 --version --verbose > "$RUNNER_TEMP/authbus-evidence/toolchain.txt"
          {
            result=0
            if ! python3 scripts/check-authbus-closed-world.py --check; then result=1; fi
            while IFS= read -r path; do
              [ -f "$path" ] || continue
              if ! rustfmt +1.95.0 --edition 2024 --config skip_children=true --check "$path"; then result=1; fi
            done < <(git diff --name-only f998dc1bc952f09ca38cfce13448eca36043c429 HEAD -- '*.rs')
            echo "format and public-boundary check exit status: $result"
            exit "$result"
          } 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/format.log"
      - name: Verification receipt regression tests
        id: receipt_tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/test_authbus_verification_evidence.py -v 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/receipt-tests.log"
      - name: AuthBus and qualification tests
        id: authbus
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus -p codex-hepta-authbus-p1-3-qualification --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/authbus-tests.log"
      - name: Strict AuthBus lint
        id: clippy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/authbus-clippy.log"
      - name: Full-owner-operation diagnostic workload
        id: latency
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/codex-rs/target
        run: |
          set -euo pipefail
          cargo +1.95.0 build --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --example owner_latency
          /usr/bin/time -l "$CARGO_TARGET_DIR/debug/examples/owner_latency" 64 > "$RUNNER_TEMP/authbus-evidence/owner-latency.json" 2> "$RUNNER_TEMP/authbus-evidence/owner-peak-rss.txt"
      - name: Retain core evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authbus-core-${{ github.sha }}
          path: ${{ runner.temp }}/authbus-evidence/
          retention-days: 14
      - name: Evidence regression tests
        id: evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-evidence --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/evidence-tests.log"
      - name: Retain Evidence suite result immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authbus-evidence-suite-${{ github.sha }}
          path: ${{ runner.temp }}/authbus-evidence/
          retention-days: 14
      - name: Bao integration tests
        id: bao
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/bao-tests.log"
      - name: Retain Bao suite result immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authbus-bao-suite-${{ github.sha }}
          path: ${{ runner.temp }}/authbus-evidence/
          retention-days: 14
      - name: Agentd signed-ingress integration
        id: agentd
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --test kernel_evidence_product 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/agentd-tests.log"
      - name: Check unchanged tracked source
        id: clean
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --check
            git diff --exit-code
            git diff --cached --exit-code
            test -z "$(git status --porcelain --untracked-files=all)"
            echo 'Working tree and index unchanged; no untracked files.'
          } 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/unchanged-source.log"
      - name: Bind observed results to exact-source receipt
        if: always()
        shell: bash
        env:
          AUTHBUS_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 -B scripts/authbus_verification_evidence.py --directory "$RUNNER_TEMP/authbus-evidence"
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authbus-execution-${{ github.sha }}
          path: ${{ runner.temp }}/authbus-evidence/
          retention-days: 14
