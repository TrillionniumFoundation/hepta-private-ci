name: hcsn-currentstate-n256-runtime-discovery-systempy

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_runtime_discovery_systempy/**"
      - ".github/workflows/hcsn-currentstate-n256-runtime-discovery-systempy.yml"

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen discovery source
        run: python3 qualification/hcsn_currentstate_n256_runtime_discovery_systempy/verify_source.py
      - name: Verify preserved real failure evidence
        run: python3 qualification/hcsn_currentstate_n256_runtime_discovery_systempy/verify_evidence.py
      - name: Run five stdlib controls
        run: python3 -m unittest qualification.hcsn_currentstate_n256_runtime_discovery_systempy.test_source -v
      - name: Run optimized controls
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_runtime_discovery_systempy.test_source -v
      - name: Compile without executing discovery
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_runtime_discovery_systempy/*.py
