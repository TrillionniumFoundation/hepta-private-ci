name: Materialize learning.artifacts static candidate

on:
  push:
    branches:
      - codex/learning-artifacts-convergence-20260929

permissions:
  contents: write

jobs:
  materialize-static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: codex/learning-artifacts-convergence-20260929
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Execute the reviewed exact patch
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/materialize-learning-artifacts-final-fixes.yml')
          text = source.read_text(encoding='utf-8')
          marker = '      - name: Apply exact source fixes and refresh source seal\n'
          start = text.index(marker) + len(marker)
          run_marker = '        run: |\n'
          start = text.index(run_marker, start) + len(run_marker)
          end = text.index('      - name: Commit the static candidate', start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/materialize-learning-artifacts.sh').write_text(script + '\n', encoding='utf-8')
          PY
          bash /tmp/materialize-learning-artifacts.sh
      - name: Commit one static exact-source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'learning.artifacts static candidate'
          git config user.email 'artifact-candidate@users.noreply.github.com'
          rm .github/workflows/materialize-learning-artifacts-final-fixes.yml
          rm .github/workflows/materialize-learning-artifacts-static-racer.yml
          git add -A
          git diff --cached --check
          git commit -m 'learning.artifacts: seal preflight-safe convergence candidate'
          git push origin HEAD:codex/learning-artifacts-convergence-20260929
