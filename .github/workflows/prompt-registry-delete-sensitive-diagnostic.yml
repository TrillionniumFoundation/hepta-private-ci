name: Remove transient prompt.registry diagnostic

on:
  push:
    branches: [ops/prompt-registry-full-closeout-author-20260929]
    paths:
      - .github/workflows/prompt-registry-delete-sensitive-diagnostic.yml

permissions:
  actions: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Delete diagnostic artifact that captured shell trace
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/11022426146"
