name: MemoryCell strict completed native evidence audit
on:
  push:
    branches: ["codex/memory-cell-evidence-20261008"]
    paths:
      - "scripts/memory_cell/stem_strict_success_audit.py"
      - "scripts/memory_cell/test_stem_strict_success_audit.py"
      - ".github/workflows/hepta-memory-stem-strict-success-audit.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: stem-strict-evidence-${{ github.sha }}
  cancel-in-progress: false
jobs:
  immutable-strict-success:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
      HEPTA_STEM_STRICT_ARCHIVE: /tmp/strict-675970bb.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve auditor exact source identifiers and compile
        run: |
          set -euo pipefail
          mkdir -p /tmp/stem-strict-audit
          git rev-parse HEAD > /tmp/stem-strict-audit/auditor-commit.txt
          git rev-parse HEAD^{tree} > /tmp/stem-strict-audit/auditor-tree.txt
          python3 -m compileall -q \
            scripts/memory_cell/stem_strict_success_audit.py \
            scripts/memory_cell/test_stem_strict_success_audit.py
      - name: Fetch exact previous successful matrix and verify external transport SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11693693993/zip > "$HEPTA_STEM_STRICT_ARCHIVE"
          printf '%s  %s\n' \
            1db7f8f7c13a1f718d5065956f14d554d3fe328c415fac4bb145d1eaf9d913c8 \
            "$HEPTA_STEM_STRICT_ARCHIVE" | sha256sum -c -
      - name: Reconcile original 576 records and reject synthetic tampering
        run: |
          set -euo pipefail
          python3 -m unittest -v test_stem_strict_success_audit \
            2>&1 | tee /tmp/stem-strict-audit/negative-tests.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("/tmp/stem-strict-audit/negative-tests.log").read_text()
          count = re.search(r"Ran (\d+) tests?", log)
          if not count or int(count.group(1)) != 6 or re.search(r"skipped=\d+", log):
              raise SystemExit("External immutable audit must run all six real-data tests without skips")
          PY
          python3 scripts/memory_cell/stem_strict_success_audit.py \
            --archive "$HEPTA_STEM_STRICT_ARCHIVE" \
            --output /tmp/stem-strict-audit/strict-576-evidence.json \
            2>&1 | tee /tmp/stem-strict-audit/reconciliation.log
      - name: Retain both identities, receipt, exact auditor source and failed tests
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/stem-strict-audit/source
          cp scripts/memory_cell/stem_strict_success_audit.py /tmp/stem-strict-audit/source/
          cp scripts/memory_cell/test_stem_strict_success_audit.py /tmp/stem-strict-audit/source/
          cp scripts/memory_cell/stem_audit_archive.py /tmp/stem-strict-audit/source/
          cp .github/workflows/hepta-memory-stem-strict-success-audit.yml /tmp/stem-strict-audit/source/
          (cd /tmp/stem-strict-audit && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-stem-strict-immutable-audit
          path: /tmp/stem-strict-audit
          if-no-files-found: error
