name: Hepta full shared Stem and Cell matrix

on:
  push:
    branches: ["codex/system2-fbsde-ablation-20261011"]
    paths:
      - "scripts/memory_cell/full_cell_matrix.py"
      - "scripts/memory_cell/test_full_cell_matrix.py"
      - ".github/workflows/hepta-full-cell-matrix.yml"

permissions:
  contents: read

concurrency:
  group: full-cell-matrix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  matrix-plan-and-gate:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run hermetic matrix and reader-gate tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/memory_cell -p 'test_full_cell_matrix.py' -v
          python3 scripts/memory_cell/full_cell_matrix.py /tmp/full-cell-matrix
      - name: Retain source identity and matrix plan
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/full-cell-matrix/source
          git rev-parse HEAD > /tmp/full-cell-matrix/source/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/full-cell-matrix/source/tested-tree.txt
          cp scripts/memory_cell/full_cell_matrix.py scripts/memory_cell/test_full_cell_matrix.py .github/workflows/hepta-full-cell-matrix.yml /tmp/full-cell-matrix/source/
          (cd /tmp/full-cell-matrix && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-full-cell-matrix
          path: /tmp/full-cell-matrix
          if-no-files-found: error
