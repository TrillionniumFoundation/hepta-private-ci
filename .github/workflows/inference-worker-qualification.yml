name: Inference worker qualification

on:
  pull_request:
    paths:
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - codex-rs/hepta-agentd/**
      - docs/modules/inference.worker/**
      - docs/readiness/LANE_B_NATIVE_HOST.md
      - qualification/module-execution-dossiers/detail/inference.worker.md
      - scripts/hepta-inference-worker-status.py
      - .github/workflows/inference-worker-qualification.yml
      - .github/actions/hepta-synthetic-merge/action.yml
  push:
    branches:
      - main
    paths:
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - codex-rs/hepta-agentd/**
      - docs/modules/inference.worker/**
      - docs/readiness/LANE_B_NATIVE_HOST.md
      - qualification/module-execution-dossiers/detail/inference.worker.md
      - scripts/hepta-inference-worker-status.py
      - .github/workflows/inference-worker-qualification.yml
      - .github/actions/hepta-synthetic-merge/action.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-worker-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  RUST_BACKTRACE: "1"
  CARGO_BUILD_JOBS: "2"
  TMPDIR: /tmp

jobs:
  linux-package-tests:
    name: ${{ matrix.lane }} / ubuntu-24.04 / ${{ matrix.package }} library
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
        package:
          - codex-hepta-infer-core
          - codex-hepta-infer-worker-host
          - codex-hepta-agentd
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct deterministic synthetic merge
        if: matrix.lane == 'merge-candidate'
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta inference worker CI
          author-email: hepta-inference-worker-ci@users.noreply.github.com
          message: Synthetic inference.worker merge
      - name: Bind exact candidate
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$LANE" = source-head ]; then
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          else
            test -n "$MERGE_SHA"
            test "$(git rev-parse HEAD)" = "$MERGE_SHA"
            expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          fi
          git diff --check
      - name: Verify workspace manifest graph
        run: python3 scripts/hepta_workspace.py
      - name: Install focused test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Run isolated library suite
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -o pipefail
          rm -f junit.xml nextest-output.log
          set +e
          cargo nextest run --locked -p "$PACKAGE" --lib --no-fail-fast --test-threads=2 2>&1 | tee nextest-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ -e junit.xml ]; then test -s junit.xml; fi
          exit "$status"
      - name: Upload Linux test diagnostics and JUnit receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-${{ matrix.lane }}-ubuntu-24.04-${{ matrix.package }}
          path: |
            codex-rs/nextest-output.log
            codex-rs/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Require unchanged exact candidate
        if: always()
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          expected="$SOURCE_SHA"
          if [ "$LANE" = merge-candidate ]; then expected="$MERGE_SHA"; fi
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  macos-package-tests:
    name: ${{ matrix.lane }} / macos-15 / ${{ matrix.package }} library
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
        package:
          - codex-hepta-infer-core
          - codex-hepta-infer-worker-host
          - codex-hepta-agentd
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct deterministic synthetic merge
        if: matrix.lane == 'merge-candidate'
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta inference worker CI
          author-email: hepta-inference-worker-ci@users.noreply.github.com
          message: Synthetic inference.worker merge
      - name: Bind exact candidate
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$LANE" = source-head ]; then
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          else
            test -n "$MERGE_SHA"
            test "$(git rev-parse HEAD)" = "$MERGE_SHA"
            expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          fi
          git diff --check
      - name: Verify workspace manifest graph
        run: python3 scripts/hepta_workspace.py
      - name: Install focused test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Run isolated library suite serially
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -o pipefail
          rm -f junit.xml nextest-output.log
          set +e
          cargo nextest run --locked -p "$PACKAGE" --lib --no-fail-fast --test-threads=1 2>&1 | tee nextest-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ -e junit.xml ]; then test -s junit.xml; fi
          exit "$status"
      - name: Upload macOS test diagnostics and JUnit receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-${{ matrix.lane }}-macos-15-${{ matrix.package }}
          path: |
            codex-rs/nextest-output.log
            codex-rs/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Require unchanged exact candidate
        if: always()
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          expected="$SOURCE_SHA"
          if [ "$LANE" = merge-candidate ]; then expected="$MERGE_SHA"; fi
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  worker-static:
    name: ${{ matrix.lane }} / worker binary, all-targets and strict lint
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct deterministic synthetic merge
        if: matrix.lane == 'merge-candidate'
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta inference worker CI
          author-email: hepta-inference-worker-ci@users.noreply.github.com
          message: Synthetic inference.worker merge
      - name: Bind exact candidate
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$LANE" = source-head ]; then
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          else
            test -n "$MERGE_SHA"
            test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          fi
      - name: Install focused test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Verify formatting
        working-directory: codex-rs
        run: cargo fmt --manifest-path Cargo.toml --package codex-hepta-infer-core --package codex-hepta-infer-worker-host --package codex-hepta-agentd -- --check
      - name: Exercise production binary target
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-worker-host --bin hepta-infer-worker
      - name: Check default product targets
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-infer-worker-host --all-targets
      - name: Check experimental local-model targets explicitly
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-infer-worker-host --all-targets --features experimental-local-model
      - name: Strict worker lint across all features
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-infer-worker-host --all-targets --all-features -- -D warnings
      - name: Require unchanged exact candidate
        if: always()
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          expected="$SOURCE_SHA"
          if [ "$LANE" = merge-candidate ]; then expected="$MERGE_SHA"; fi
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  derived-projections:
    name: Source ownership and generated projections
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify generated module truth
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta-inference-worker-status.py verify
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  current-status:
    name: Exact-candidate CURRENT_STATUS receipt
    if: ${{ always() }}
    needs: [linux-package-tests, macos-package-tests, worker-static, derived-projections]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate source-bound status receipt
        env:
          LINUX_RESULT: ${{ needs.linux-package-tests.result }}
          MACOS_RESULT: ${{ needs.macos-package-tests.result }}
          STATIC_RESULT: ${{ needs.worker-static.result }}
          PROJECTION_RESULT: ${{ needs.derived-projections.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          merge_run=not-applicable
          if [ "$EVENT_NAME" = pull_request ]; then merge_run="$RUN_URL"; fi
          python3 scripts/hepta-inference-worker-status.py generate \
            --output receipts/inference-worker-current-status.json \
            --exact-head-run "$RUN_URL" \
            --merge-candidate-run "$merge_run" \
            --linux-result "$LINUX_RESULT" \
            --macos-result "$MACOS_RESULT" \
            --lib-test-result "linux=$LINUX_RESULT;macos=$MACOS_RESULT" \
            --binary-test-result "$STATIC_RESULT" \
            --clippy-result "$STATIC_RESULT" \
            --real-hardware-result not-run \
            --composition-result "repository-projections=$PROJECTION_RESULT;production-not-qualified" \
            --independent-acceptance-result not-run
          python3 -m json.tool receipts/inference-worker-current-status.json >/dev/null
      - name: Upload exact status receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-current-status
          path: receipts/inference-worker-current-status.json
          if-no-files-found: error
          retention-days: 30

  qualification-result:
    name: Inference worker qualification result
    if: ${{ always() }}
    needs: [linux-package-tests, macos-package-tests, worker-static, derived-projections, current-status]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require every applicable receipt
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_NEEDS: '["linux-package-tests","macos-package-tests","worker-static","derived-projections","current-status"]'
        run: python3 .github/scripts/check_ci_results.py
