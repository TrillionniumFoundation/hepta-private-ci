name: Inference worker qualification

on:
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-agentd/**"
      - "docs/modules/inference.worker/**"
      - "qualification/module-execution-dossiers/detail/inference.worker.md"
      - "scripts/inference_worker_current_status.py"
      - "scripts/tests/test_inference_worker_current_status.py"
      - ".github/workflows/inference-worker-qualification.yml"
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-agentd/**"
      - "docs/modules/inference.worker/**"
      - "qualification/module-execution-dossiers/detail/inference.worker.md"
      - "scripts/inference_worker_current_status.py"
      - "scripts/tests/test_inference_worker_current_status.py"
      - ".github/workflows/inference-worker-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-worker-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  derived-projections:
    name: Derived projections and status generator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{tree}"
      - name: Test exact-status generator
        run: python3 -m unittest discover -v -s scripts/tests -p 'test_inference_worker_current_status.py'
      - name: Verify source ownership and generated projections
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify
      - name: Assert tracked tree remains clean
        if: always()
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  linux-source-head:
    name: Linux source head / ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package:
          - codex-hepta-infer-core
          - codex-hepta-infer-worker-host
          - codex-hepta-agentd
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/inference-worker-${{ matrix.package }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
      - name: Verify workspace graph
        run: python3 scripts/hepta_workspace.py
      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Run isolated library tests with JUnit
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo nextest run --locked --package "$PACKAGE" "${features[@]}" --lib
      - name: Exercise package binaries
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo test --locked --package "$PACKAGE" "${features[@]}" --bins
      - name: Check all targets
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo check --locked --package "$PACKAGE" "${features[@]}" --all-targets
      - name: Strict package lint
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo clippy --locked --package "$PACKAGE" "${features[@]}" --all-targets --no-deps -- -D warnings
      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-linux-${{ matrix.package }}-junit
          path: ${{ env.CARGO_TARGET_DIR }}/nextest/default/junit.xml
          if-no-files-found: warn
      - name: Assert exact unchanged candidate
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  macos-source-head:
    name: macOS source head / ${{ matrix.package }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package:
          - codex-hepta-infer-core
          - codex-hepta-infer-worker-host
          - codex-hepta-agentd
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/inference-worker-${{ matrix.package }}
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
      - name: Verify workspace graph
        run: python3 scripts/hepta_workspace.py
      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Run isolated library tests with JUnit
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo nextest run --locked --package "$PACKAGE" "${features[@]}" --lib
      - name: Exercise package binaries
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo test --locked --package "$PACKAGE" "${features[@]}" --bins
      - name: Check all targets
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo check --locked --package "$PACKAGE" "${features[@]}" --all-targets
      - name: Strict package lint
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo clippy --locked --package "$PACKAGE" "${features[@]}" --all-targets --no-deps -- -D warnings
      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-macos-${{ matrix.package }}-junit
          path: ${{ env.CARGO_TARGET_DIR }}/nextest/default/junit.xml
          if-no-files-found: warn
      - name: Assert exact unchanged candidate
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  merge-candidate:
    name: Synthetic merge / ${{ matrix.package }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package:
          - codex-hepta-infer-core
          - codex-hepta-infer-worker-host
          - codex-hepta-agentd
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/inference-worker-merge-${{ matrix.package }}
    outputs:
      merge_sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve current pull-request base
        id: current-base
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_REF"
          current_base="$(git rev-parse "refs/remotes/origin/${BASE_REF}^{commit}")"
          git cat-file -e "$current_base^{commit}"
          printf 'sha=%s\n' "$current_base" >> "$GITHUB_OUTPUT"
      - name: Construct deterministic synthetic merge
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.current-base.outputs.sha }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta inference worker CI
          author-email: hepta-inference-worker-ci@users.noreply.github.com
          message: Synthetic inference.worker merge
      - name: Bind exact merge candidate
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
      - name: Verify workspace graph
        run: python3 scripts/hepta_workspace.py
      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Run isolated merge-candidate tests
        working-directory: codex-rs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$PACKAGE" == "codex-hepta-infer-worker-host" ]]; then
            features=(--features experimental-local-model)
          fi
          cargo nextest run --locked --package "$PACKAGE" "${features[@]}" --lib
          cargo test --locked --package "$PACKAGE" "${features[@]}" --bins
          cargo check --locked --package "$PACKAGE" "${features[@]}" --all-targets
          cargo clippy --locked --package "$PACKAGE" "${features[@]}" --all-targets --no-deps -- -D warnings
      - name: Upload merge-candidate JUnit
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-merge-${{ matrix.package }}-junit
          path: ${{ env.CARGO_TARGET_DIR }}/nextest/default/junit.xml
          if-no-files-found: warn
      - name: Assert exact unchanged merge candidate
        if: always()
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  qualification-result:
    name: Bind qualification result to exact source
    if: always()
    needs:
      - derived-projections
      - linux-source-head
      - macos-source-head
      - merge-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate exact-candidate status
        id: status
        env:
          DERIVED_RESULT: ${{ needs.derived-projections.result }}
          LINUX_RESULT: ${{ needs.linux-source-head.result }}
          MACOS_RESULT: ${{ needs.macos-source-head.result }}
          MERGE_RESULT_RAW: ${{ needs.merge-candidate.result }}
          MERGE_SHA: ${{ needs.merge-candidate.outputs.merge_sha }}
          STATUS_PATH: ${{ runner.temp }}/inference-worker-current-status.json
        shell: bash
        run: |
          set -euo pipefail
          exact_result=success
          if [[ "$DERIVED_RESULT" != success || "$LINUX_RESULT" != success || "$MACOS_RESULT" != success ]]; then
            exact_result=failed_or_incomplete
          fi
          merge_result="$MERGE_RESULT_RAW"
          if [[ "${{ github.event_name }}" != pull_request && "$merge_result" == skipped ]]; then
            merge_result=not_applicable
          fi
          args=(
            --repository "$GITHUB_REPOSITORY"
            --repo-root "$GITHUB_WORKSPACE"
            --source-head "$SOURCE_SHA"
            --exact-head-run-id "$GITHUB_RUN_ID"
            --exact-head-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            --exact-head-result "$exact_result"
            --merge-candidate-result "$merge_result"
            --linux-result "$LINUX_RESULT"
            --macos-result "$MACOS_RESULT"
            --derived-projections-result "$DERIVED_RESULT"
            --output "$STATUS_PATH"
          )
          if [[ -n "$MERGE_SHA" ]]; then
            args+=(--merge-candidate-commit "$MERGE_SHA")
          fi
          python3 scripts/inference_worker_current_status.py "${args[@]}"
          cat "$STATUS_PATH"
          printf 'exact_result=%s\n' "$exact_result" >> "$GITHUB_OUTPUT"
          printf 'merge_result=%s\n' "$merge_result" >> "$GITHUB_OUTPUT"
      - name: Upload exact-candidate status
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-current-status
          path: ${{ runner.temp }}/inference-worker-current-status.json
          if-no-files-found: error
      - name: Require all applicable qualification lanes
        env:
          EXACT_RESULT: ${{ steps.status.outputs.exact_result }}
          MERGE_RESULT: ${{ steps.status.outputs.merge_result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXACT_RESULT" = success
          [[ "$MERGE_RESULT" == success || "$MERGE_RESULT" == not_applicable ]]
