name: Memory retrieval native hardening

on:
  pull_request:
  push:
    branches: [main, work/memory-retrieval-semantic-product-convergence-20260926]
    paths: ['codex-rs/**', 'scripts/**', '.github/workflows/**', 'docs/**', 'qualification/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-native-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      base: ${{ steps.resolve.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze immutable source and current main identities, without writes
        id: resolve
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          BASE=$(git rev-parse refs/remotes/origin/main)
          git cat-file -e "$BASE^{commit}"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

  native:
    needs: resolve-source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [exact-head, exact-main, synthetic-merge]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      SOURCE: ${{ needs.resolve-source.outputs.source }}
      BASE: ${{ needs.resolve-source.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.resolve-source.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact checkout and deterministic ordered-parent merge
        id: source
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retrieval-native/$MODE" "$RUNNER_TEMP/retrieval-native-tools"
          cp scripts/*memory_retrieval*.py "$RUNNER_TEMP/retrieval-native-tools/"
          if [ "$MODE" = exact-main ]; then
            git checkout --detach "$BASE"
          elif [ "$MODE" = synthetic-merge ]; then
            if [ "$BASE" = "$SOURCE" ]; then
              # A main push has no distinct merge candidate. Record the identity
              # case explicitly; this is not a two-parent qualification claim.
              printf 'mode=identity-no-distinct-parent\nsource=%s\n' "$SOURCE" > "$RUNNER_TEMP/retrieval-native/$MODE/merge.txt"
            else
              python "$RUNNER_TEMP/retrieval-native-tools/memory_retrieval_synthetic_merge.py" --base "$BASE" --source "$SOURCE" > "$RUNNER_TEMP/retrieval-native/$MODE/merge.txt"
              CANDIDATE=$(sed -n 's/^candidate=//p' "$RUNNER_TEMP/retrieval-native/$MODE/merge.txt")
              git checkout --detach "$CANDIDATE"
            fi
          fi
          SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          python "$RUNNER_TEMP/retrieval-native-tools/capture_memory_retrieval_source.py" --root "$PWD" --source-sha "$SHA" --source-tree "$TREE" --output "$RUNNER_TEMP/retrieval-native/$MODE/source.json"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
      - name: Run all 44 strict qualification-validator regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/retrieval-native-tools" && python -m unittest -v test_verify_memory_retrieval_slo test_verify_memory_retrieval_promotion test_memory_retrieval_source) 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/python-tests.log"
      - name: Install exact repository compiler
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Retrieval package tests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-memory-retrieval --all-targets 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/retrieval-tests.log"
      - name: Strict all-target retrieval lint and formatting
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cargo +1.95.0 clippy --locked -p codex-hepta-memory-retrieval --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/retrieval-clippy.log"
          cargo +1.95.0 fmt -p codex-hepta-memory-retrieval -- --check 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/retrieval-fmt.log"
      - name: Agentd actual context and product lifecycle tests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-agentd cognitive_context 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/agentd-context-tests.log"
          cargo +1.95.0 test --locked -p codex-hepta-agentd cognitive_retrieval_context 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/provider-tests.log"
      - name: Owner and durable learning regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-memory cognitive_retrieval 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/owner-tests.log"
          cargo +1.95.0 test --locked -p codex-hepta-learning-ledger retrieval_assignment 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/ledger-tests.log"
      - name: Verify source stayed exact and clean
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        env:
          MODE: ${{ matrix.mode }}
          SHA: ${{ steps.source.outputs.sha }}
          TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/retrieval-native-tools/capture_memory_retrieval_source.py" --root "$PWD" --source-sha "$SHA" --source-tree "$TREE" --verify "$RUNNER_TEMP/retrieval-native/$MODE/source.json"
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retrieval-native/${{ matrix.mode }}/
          retention-days: 90
          if-no-files-found: error

  result:
    name: memory.retrieval native required
    if: always()
    needs: [resolve-source, native]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Failed, cancelled or skipped qualification cannot pass
        env:
          RESOLVE: ${{ needs.resolve-source.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$RESOLVE" = success && test "$NATIVE" = success
