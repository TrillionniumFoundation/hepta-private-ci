name: Memory retrieval native hardening

on:
  push:
    branches: [work/memory-retrieval-semantic-product-convergence-20260926]
    paths:
      - .github/workflows/hepta-memory-retrieval-native-hardening.yml
      - scripts/apply_memory_retrieval_lifecycle_binding.py
      - codex-rs/hepta-agentd/src/product_retrieval_context*.rs
      - codex-rs/hepta-agentd/src/cognitive_retrieval*.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-native-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bind-source:
    if: github.ref == 'refs/heads/work/memory-retrieval-semantic-product-convergence-20260926'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source: ${{ steps.bind.outputs.source }}
      base: ${{ steps.bind.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact-object native migration and publish only allowed source paths
        id: bind
        shell: bash
        env:
          BRANCH: work/memory-retrieval-semantic-product-convergence-20260926
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          BASE=$(git ls-remote origin refs/heads/main | cut -f1)
          python scripts/apply_memory_retrieval_lifecycle_binding.py
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup run 1.95.0 rustfmt --edition 2024 --config skip_children=true \
            codex-rs/hepta-agentd/src/cognitive_retrieval_context.rs \
            codex-rs/hepta-agentd/src/product_retrieval_context.rs \
            codex-rs/hepta-agentd/src/product_retrieval_context_tests.rs \
            codex-rs/hepta-agentd/src/cognitive_retrieval_lease.rs \
            codex-rs/hepta-agentd/src/cognitive_context.rs \
            codex-rs/hepta-agentd/src/cognitive_context_hnmf_tests.rs \
            codex-rs/hepta-agentd/src/lib.rs
          python - <<'PY'
          import subprocess
          allowed = {'codex-rs/hepta-agentd/src/' + name for name in (
              'cognitive_retrieval_context.rs', 'product_retrieval_context.rs',
              'product_retrieval_context_tests.rs', 'cognitive_retrieval_lease.rs',
              'cognitive_context.rs', 'cognitive_context_hnmf_tests.rs', 'lib.rs')}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not changed <= allowed:
              raise SystemExit('refusing out-of-scope source mutation: ' + repr(changed - allowed))
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'Hepta retrieval source qualification'
            git config user.email 'qualification@example.invalid'
            git add -- codex-rs/hepta-agentd/src/cognitive_retrieval_context.rs codex-rs/hepta-agentd/src/product_retrieval_context.rs codex-rs/hepta-agentd/src/product_retrieval_context_tests.rs codex-rs/hepta-agentd/src/cognitive_retrieval_lease.rs codex-rs/hepta-agentd/src/cognitive_context.rs codex-rs/hepta-agentd/src/cognitive_context_hnmf_tests.rs codex-rs/hepta-agentd/src/lib.rs
            git commit -m 'fix(memory.retrieval): bind real Agentd reads to provider lifecycle observations'
            test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Retain source migration diagnostic even on failure
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/retrieval-native-migration.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-migration-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-native-migration.patch
          retention-days: 90

  native:
    needs: bind-source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [exact-head, exact-main, synthetic-merge]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      SOURCE: ${{ needs.bind-source.outputs.source }}
      BASE: ${{ needs.bind-source.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.bind-source.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze exact source and ordered-parent merge identity
        id: source
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retrieval-native/$MODE" "$RUNNER_TEMP/retrieval-native-tools"
          cp scripts/*memory_retrieval*.py "$RUNNER_TEMP/retrieval-native-tools/"
          if [ "$MODE" = exact-main ]; then
            git checkout --detach "$BASE"
          elif [ "$MODE" = synthetic-merge ]; then
            python "$RUNNER_TEMP/retrieval-native-tools/memory_retrieval_synthetic_merge.py" --base "$BASE" --source "$SOURCE" > "$RUNNER_TEMP/retrieval-native/$MODE/merge.txt"
            CANDIDATE=$(sed -n 's/^candidate=//p' "$RUNNER_TEMP/retrieval-native/$MODE/merge.txt")
            git checkout --detach "$CANDIDATE"
          fi
          SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          python "$RUNNER_TEMP/retrieval-native-tools/capture_memory_retrieval_source.py" --root "$PWD" --source-sha "$SHA" --source-tree "$TREE" --output "$RUNNER_TEMP/retrieval-native/$MODE/source.json"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
      - name: Run source, approval and SLO validator regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/retrieval-native-tools" && python -m unittest -v test_verify_memory_retrieval_slo test_verify_memory_retrieval_promotion test_memory_retrieval_source) 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/python-tests.log"
      - name: Install repository compiler
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Retrieval package tests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-memory-retrieval --all-targets 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/retrieval-tests.log"
      - name: Agentd actual context and product lifecycle tests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-agentd cognitive_context 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/agentd-context-tests.log"
          cargo +1.95.0 test --locked -p codex-hepta-agentd cognitive_retrieval_context 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/provider-tests.log"
      - name: Owner and durable learning regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-memory cognitive_retrieval 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/owner-tests.log"
          cargo +1.95.0 test --locked -p codex-hepta-learning-ledger retrieval_assignment 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/ledger-tests.log"
      - name: Verify source remained exact and clean
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        env:
          MODE: ${{ matrix.mode }}
          SHA: ${{ steps.source.outputs.sha }}
          TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/retrieval-native-tools/capture_memory_retrieval_source.py" --root "$PWD" --source-sha "$SHA" --source-tree "$TREE" --verify "$RUNNER_TEMP/retrieval-native/$MODE/source.json"
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-native/${{ matrix.mode }}/
          retention-days: 90
          if-no-files-found: error

  result:
    name: memory.retrieval native required
    if: always()
    needs: [bind-source, native]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Failed, cancelled or skipped qualification cannot pass
        env:
          BIND: ${{ needs.bind-source.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$BIND" = success && test "$NATIVE" = success
