name: Memory retrieval native hardening

on:
  workflow_call:
  push:
    branches: [main, work/memory-retrieval-semantic-product-convergence-20260926]
    paths: ['codex-rs/**', 'scripts/**', '.github/workflows/**', 'docs/**', 'qualification/**', 'justfile', 'rust-toolchain*', '.cargo/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-native-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      base: ${{ steps.resolve.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze source and observed main without writing a repository ref
        id: resolve
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"
          BASE=$(git rev-parse refs/remotes/origin/main)
          git cat-file -e "$BASE^{commit}"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

  native:
    needs: resolve-source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [exact-head, exact-main, synthetic-merge]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      RUSTUP_TOOLCHAIN: 1.95.0
      SOURCE: ${{ needs.resolve-source.outputs.source }}
      BASE: ${{ needs.resolve-source.outputs.base }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.resolve-source.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Record exact checkout and deterministic ordered-parent merge
        id: source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retrieval-native/$MODE" "$RUNNER_TEMP/retrieval-native-tools"
          cp scripts/*memory_retrieval*.py "$RUNNER_TEMP/retrieval-native-tools/"
          if test "$MODE" = exact-main; then
            git checkout --detach "$BASE"
          elif test "$MODE" = synthetic-merge; then
            if test "$BASE" = "$SOURCE"; then
              printf 'mode=identity-no-distinct-parent\nsource=%s\n' "$SOURCE" > "$RUNNER_TEMP/retrieval-native/$MODE/merge.txt"
            else
              python3 "$RUNNER_TEMP/retrieval-native-tools/memory_retrieval_synthetic_merge.py" --base "$BASE" --source "$SOURCE" > "$RUNNER_TEMP/retrieval-native/$MODE/merge.txt"
              CANDIDATE=$(sed -n 's/^candidate=//p' "$RUNNER_TEMP/retrieval-native/$MODE/merge.txt")
              git checkout --detach "$CANDIDATE"
              test "$(git show -s --format=%P HEAD)" = "$BASE $SOURCE"
            fi
          fi
          SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          python3 "$RUNNER_TEMP/retrieval-native-tools/capture_memory_retrieval_source.py" --root "$PWD" --source-sha "$SHA" --source-tree "$TREE" --output "$RUNNER_TEMP/retrieval-native/$MODE/source.json"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
      - name: Strict qualification verifier regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/retrieval-native-tools" && python3 -m unittest -v test_verify_memory_retrieval_slo test_verify_memory_retrieval_promotion test_memory_retrieval_source) 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/python-tests.log"
      - name: Install exact compiler
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Real retrieval owner Agentd and assignment regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-learning-ledger --lib -E 'package(codex-hepta-memory-retrieval) | (package(codex-hepta-memory) & test(cognitive_retrieval)) | (package(codex-hepta-agentd) & (test(cognitive_context) | test(cognitive_retrieval) | test(retrieval_mode))) | (package(codex-hepta-learning-ledger) & test(retrieval_assignment))' 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/native-tests.log"
      - name: Strict all-target lint and formatting
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          (cd codex-rs && cargo clippy --locked -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-learning-ledger --all-targets -- -D warnings) 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/clippy.log"
          (cd codex-rs && cargo fmt -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-learning-ledger -- --check) 2>&1 | tee "$RUNNER_TEMP/retrieval-native/$MODE/fmt.log"
      - name: Verify exact clean source after all execution
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        env:
          SHA: ${{ steps.source.outputs.sha }}
          TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/retrieval-native-tools/capture_memory_retrieval_source.py" --root "$PWD" --source-sha "$SHA" --source-tree "$TREE" --verify "$RUNNER_TEMP/retrieval-native/$MODE/source.json"
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retrieval-native/${{ matrix.mode }}/
          retention-days: 90
          if-no-files-found: error

  result:
    name: memory.retrieval native required
    if: always()
    needs: [resolve-source, native]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Failed cancelled or skipped qualification cannot pass
        env:
          RESOLVE: ${{ needs.resolve-source.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$RESOLVE" = success && test "$NATIVE" = success
