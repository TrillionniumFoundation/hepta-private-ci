name: Expose verified V14 archived reports

on:
  push:
    branches: [research/memory-cell-v14-20261031]
    paths: ['.github/workflows/memory-cell-v14-reports.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: qualification/memory-cell-v14
      - name: Verify packed bytes and expose existing measurements without rerunning experiments
        run: |
          python3 - <<'PY'
          import hashlib, io, json, tarfile
          from pathlib import Path
          wanted = {'RESULTS.json', 'SELECTION.json', 'SUMMARY.json', 'encoder_manifest.json', 'FREEZE.json', 'process.json', 'language_failure.json', 'language_run.json', 'INPUT_IDENTITIES.json'}
          root = Path('qualification/memory-cell-v14/evidence')
          for path in root.glob('*/INDEX.json'):
              index = json.loads(path.read_text())
              for archive in index['archives']:
                  parts = []
                  for part in archive['parts']:
                      block = (path.parent / part['name']).read_bytes()
                      assert len(block) == part['bytes'] and hashlib.sha256(block).hexdigest() == part['sha256']
                      parts.append(block)
                  payload = b''.join(parts)
                  assert len(payload) == archive['bytes'] and hashlib.sha256(payload).hexdigest() == archive['sha256']
                  with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as packed:
                      for member in packed:
                          relative = Path(member.name)
                          selected_centroid = relative.parent.name == 'centroid' and relative.name in ('arrays.npz', 'metadata.json')
                          source_features = relative.name in ('train_features.npz', 'train_rows.json', 'calibration_features.npz', 'calibration_rows.json')
                          frozen_runtime = 'EXECUTED_SOURCE' in relative.parts and relative.parts[0] == 'routing'
                          if relative.name not in wanted and not selected_centroid and not source_features and not frozen_runtime:
                              continue
                          assert not relative.is_absolute() and '..' not in relative.parts and member.isfile()
                          data = packed.extractfile(member).read()
                          identity = archive['files'][member.name]
                          assert len(data) == identity['bytes'] and hashlib.sha256(data).hexdigest() == identity['sha256']
                          if relative.suffix == '.json':
                              json.loads(data)
                          destination = path.parent / 'readable' / archive['name'] / relative
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          if destination.exists():
                              assert destination.read_bytes() == data
                          else:
                              destination.write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/memory-cell-v14/evidence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(memory): expose hash-verified V14 archived reports'
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            git fetch origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
          done
          exit 1
