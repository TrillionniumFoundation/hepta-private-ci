name: PoN executable boundary delivery
on:
  push:
    branches: [fix/agentd-pon-executable-object-20261008]
    paths: [.github/workflows/pon-executable-boundary-delivery.yml]
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/fix/agentd-pon-executable-object-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
      - name: Apply exact owner call-site changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('codex-rs/hepta-agentd/src/automation_effect_host.rs')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '0151125d688a34cd87fc4e23469c7450dc774930'
          s=p.read_text()
          changes=[
            ('#[path = "automation_effect_host_pon_process.rs"]\nmod pon_process;', '#[path = "automation_effect_host_pon_process.rs"]\nmod pon_process;\n#[path = "automation_effect_host_pon_executable.rs"]\nmod pon_executable;'),
            ('        verify_pinned_binary(&self.binary, &self.binary_sha256).map_err(|_| ())?;\n', ''),
            ('    fn command(&self, operation: &str) -> Command {\n        let mut command = Command::new(&self.binary);', '    fn command(&self, operation: &str, executable: &Path) -> Command {\n        let mut command = Command::new(executable);'),
            ('        let Ok(runtime) = tokio::runtime::Handle::try_current() else {', '        let Ok(executable) = pon_executable::PinnedExecutable::prepare(\n            &self.binary, self.binary_sha256.as_str(), deadline,\n        ) else {\n            return PonInvocation::BeforeStart;\n        };\n        let Ok(runtime) = tokio::runtime::Handle::try_current() else {'),
            ('            self.command(operation),', '            self.command(operation, executable.path()),'),
          ]
          for old,new in changes:
            assert s.count(old)==1,repr(old)
            s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('codex-rs/hepta-agentd/src/automation_effect_host_pon_tests.rs')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '87a0f475aa84ae7783915c3e5c271e8b93f423e3'
          s=p.read_text().replace('adapter.invoke(', 'invoke_pipe_fixture(&adapter, ')
          marker='#[tokio::test]\nasync fn pon_blocked_stdin'
          helper='''// Script fixtures exercise the pipe boundary directly; production accepts only
          // a sealed native ELF. They are not evidence that a script is deployable.
          fn invoke_pipe_fixture(adapter: &PonLocalProviderEffectAdapter, operation: &str, payload: &[u8]) -> PonInvocation {
              let deadline = Instant::now() + adapter.timeout;
              let runtime = tokio::runtime::Handle::current();
              match runtime.block_on(pon_process::run(adapter.command(operation, &adapter.binary), payload, deadline, MAX_PON_PROCESS_OUTPUT_BYTES)) {
                  pon_process::Outcome::BeforeStart => PonInvocation::BeforeStart,
                  pon_process::Outcome::Unknown => PonInvocation::Unknown,
                  pon_process::Outcome::Complete(bytes) => match serde_json::from_slice(&bytes) {
                      Ok(value) => PonInvocation::Value(value),
                      Err(_) => PonInvocation::Unknown,
                  },
              }
          }

          #[tokio::test]
          async fn pon_script_cannot_cross_production_executable_boundary() {
              let (_directory, adapter) = fixture("#!/bin/sh\\nexit 0\\n", Duration::from_secs(2));
              let outcome = tokio::task::spawn_blocking(move || adapter.invoke("submit", b"packet")).await.unwrap();
              assert!(matches!(outcome, PonInvocation::BeforeStart));
          }

          '''
          assert s.count(marker)==1
          s=s.replace(marker,helper+marker,1)
          p.write_text(s)
          Path('.github/workflows/pon-executable-boundary-delivery.yml').unlink()
          PY
      - name: Format only changed owners and publish without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          rustfmt --edition 2024 --config skip_children=true hepta-agentd/src/automation_effect_host.rs hepta-agentd/src/automation_effect_host_pon_tests.rs hepta-agentd/src/automation_effect_host_pon_executable.rs hepta-agentd/src/automation_effect_host_pon_executable_tests.rs
          cd ..
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex-rs/hepta-agentd/src/automation_effect_host*.rs .github/workflows/pon-executable-boundary-delivery.yml
          git commit -s -m 'fix(agentd): execute exact sealed PoN object through existing bounded exchange'
          git push origin HEAD:refs/heads/fix/agentd-pon-executable-object-20261008
          mkdir -p "$RUNNER_TEMP/pon-check"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/pon-check/source.txt"
      - name: Execute exact native object tests in an isolated dependency harness
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          TOOLCHAIN="$(cd codex-rs && rustup show active-toolchain | cut -d ' ' -f1)"
          export ROOT
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          root=Path(os.environ['ROOT'])
          out=Path(os.environ['RUNNER_TEMP'])/'pon-check'
          lock=tomllib.loads((root/'codex-rs/Cargo.lock').read_text())
          versions={name:next(p['version'] for p in lock['package'] if p['name']==name) for name in ['sha2','tempfile']}
          (out/'Cargo.toml').write_text('[package]\nname="pon-executable-boundary-native-tests"\nversion="0.0.0"\nedition="2024"\n[lib]\npath="lib.rs"\n[dependencies]\nsha2="='+versions['sha2']+'"\n[dev-dependencies]\ntempfile="='+versions['tempfile']+'"\n')
          source=root/'codex-rs/hepta-agentd/src/automation_effect_host_pon_executable.rs'
          (out/'lib.rs').write_text('#[path = '+repr(str(source)).replace("'",'"')+']\nmod executable;\n')
          PY
          cargo +"$TOOLCHAIN" test --manifest-path "$RUNNER_TEMP/pon-check/Cargo.toml" -- --nocapture 2>&1 | tee "$RUNNER_TEMP/pon-check/native-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pon-executable-boundary-check
          path: |
            ${{ runner.temp }}/pon-check/source.txt
            ${{ runner.temp }}/pon-check/native-tests.log
            ${{ runner.temp }}/pon-check/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
