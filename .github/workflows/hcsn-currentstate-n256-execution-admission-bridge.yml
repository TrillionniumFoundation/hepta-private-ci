name: hcsn-currentstate-n256-execution-admission-bridge

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_execution_admission_bridge/**"
      - ".github/workflows/hcsn-currentstate-n256-execution-admission-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled admission bridge fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_execution_admission_bridge.test_admission_bridge -v
      - name: Optimized admission bridge fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_execution_admission_bridge.test_admission_bridge -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_execution_admission_bridge/*.py
      - name: Verify exact frozen source and inherited originals
        run: python3 -m qualification.hcsn_currentstate_n256_execution_admission_bridge.verify_source
