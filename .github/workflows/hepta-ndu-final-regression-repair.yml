name: Hepta NDU exact regression repair

on:
  push:
    branches:
      - codex/utility-ndu-production-hardening-20260926
    paths:
      - .github/workflows/hepta-ndu-final-regression-repair.yml

permissions:
  contents: write

concurrency:
  group: hepta-ndu-exact-regression-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out exact repair request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Format repaired source and refresh the exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-intelligence
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          root = Path.cwd()
          lifecycle = (root / "codex-rs/hepta-intelligence/src/ndu_stochastic_lifecycle.rs").read_text(encoding="utf-8")
          if "struct TransitionSpec" not in lifecycle:
              raise SystemExit("typed lifecycle transition fixture is missing")
          if "fn append_transition(\n        journal" not in lifecycle:
              raise SystemExit("lifecycle fixture shape drifted")

          mounted = (root / "scripts/hepta-ndu-mounted-filesystem.py").read_text(encoding="utf-8")
          required_remounts = (
              'command(privilege + ["mount", "-o", "remount,ro", str(mount)])',
              'command(privilege + ["mount", "-o", "remount,rw", str(mount)])',
          )
          if any(command not in mounted for command in required_remounts):
              raise SystemExit("mountpoint-only remount qualification is missing")
          if '"remount,ro", "ndu-qualification"' in mounted or '"remount,rw", "ndu-qualification"' in mounted:
              raise SystemExit("obsolete pseudo-source remount remains")

          map_path = root / "docs/modules/utility.ndu/IMPLEMENTATION_MAP.json"
          mapping = json.loads(map_path.read_text(encoding="utf-8"))
          manifest = mapping.get("sourceObjects")
          if not isinstance(manifest, list) or not manifest:
              raise SystemExit("utility.ndu sourceObjects manifest missing")

          required = {
              "codex-rs/hepta-agent-protocol/src/ndu.rs",
              "codex-rs/hepta-intelligence/src/ndu_stochastic_lifecycle.rs",
              "scripts/hepta-ndu-mounted-filesystem.py",
          }
          paths = {entry.get("path") for entry in manifest if isinstance(entry, dict)}
          if not required.issubset(paths):
              raise SystemExit("sourceObjects omits a repaired evidence path")

          changed = []
          for entry in manifest:
              if not isinstance(entry, dict):
                  raise SystemExit("invalid sourceObjects entry")
              path = entry.get("path")
              local = root / path if isinstance(path, str) else None
              if local is None or not local.exists():
                  raise SystemExit(f"invalid sourceObjects path: {path!r}")
              if local.is_file():
                  actual = subprocess.check_output(
                      ["git", "hash-object", path], cwd=root, text=True
                  ).strip()
              elif local.is_dir():
                  actual = subprocess.check_output(
                      ["git", "rev-parse", f"HEAD:{path}"], cwd=root, text=True
                  ).strip()
              else:
                  raise SystemExit(f"unsupported sourceObjects path type: {path}")
              if entry.get("object") != actual:
                  changed.append(path)
                  entry["object"] = actual

          map_path.write_text(json.dumps(mapping, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"refreshedSourceObjects": changed}, indent=2))
          PY

          rm .github/workflows/hepta-ndu-final-regression-repair.yml
          git config user.name hepta-qualification-repair
          git config user.email qualification@invalid
          git add \
            codex-rs/hepta-intelligence/src/ndu_stochastic_lifecycle.rs \
            scripts/hepta-ndu-mounted-filesystem.py \
            docs/modules/utility.ndu/IMPLEMENTATION_MAP.json \
            .github/workflows/hepta-ndu-final-regression-repair.yml
          git diff --cached --check
          git commit -s -m "fix(ndu): close exact map lint and mounted-host regressions"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree}

      - name: Reproduce the exact failing suites on the clean repair commit
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          for suite in source lint host; do
            python3 scripts/hepta-ndu-qualification.py \
              --suite "$suite" \
              --lane source-head \
              --output "${RUNNER_TEMP}/ndu-repair-${suite}"
          done
          test "$(git rev-parse HEAD)" = "$SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Retain repair qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-exact-regression-repair-${{ github.sha }}
          path: ${{ runner.temp }}/ndu-repair-*
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the validated fast-forward repair
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
