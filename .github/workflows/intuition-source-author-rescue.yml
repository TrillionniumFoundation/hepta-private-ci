name: intuition.policy Reviewed Source Rescue

on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths:
      - ".github/workflows/intuition-source-author-rescue.yml"
      - ".github/intuition-authoring-patch/READY"

permissions:
  contents: write

concurrency:
  group: intuition-reviewed-source-rescue-${{ github.ref }}-${{ matrix.runner }}
  cancel-in-progress: false

jobs:
  author:
    name: Recover, verify, and publish on ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: rog
            os: linux
            arch: x64
          - runner: pocket4
            os: linux
            arch: x64
          - runner: macbook
            os: macOS
            arch: ARM64
    runs-on:
      - self-hosted
      - ${{ matrix.os }}
      - ${{ matrix.arch }}
      - ${{ matrix.runner }}
    steps:
      - name: Check out immutable authoring head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Recover exact reviewed patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'AUTHORING_HEAD=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          ready=.github/intuition-authoring-patch/READY
          base="$(sed -n 's/^base=//p' "$ready" | tr -d '\r')"
          part_000="$(sed -n 's/^part-000=//p' "$ready" | tr -d '\r')"
          part_001="$(sed -n 's/^part-001=//p' "$ready" | tr -d '\r')"
          part_002="$(sed -n 's/^part-002=//p' "$ready" | tr -d '\r')"
          test "$base" = "696447e733e22e425cd05691d98f4fe0ef63f759"
          test "$part_000" = "ff90ec4b0bb594c6659c0805f7683e625f423d46"
          test "$part_001" = "8ef03a50ccef25591918ed67fb42506bcfdd21f1"
          test "$part_002" = "627e323cc4086e712a04ffa58b02e7723415e64c"
          test "$(git cat-file -t "$base")" = commit

          for spec in \
            "part-000:$part_000" \
            "part-001:$part_001" \
            "part-002:$part_002"
          do
            name="${spec%%:*}"
            blob="${spec#*:}"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$blob" \
              | python3 -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
              > ".git/$name.b64"
          done

          python3 - <<'PY'
          import base64
          import binascii
          import hashlib
          from pathlib import Path

          expected = "d9988033416a6bf64588b593c34496abba4d3f66a20df57d749a6308500ca3dc"
          parts = [b"".join(Path(f".git/part-{i:03d}.b64").read_bytes().split()) for i in range(3)]
          encoded = b"".join(parts)
          candidates = [("direct", None, encoded)]
          if len(encoded) % 4 == 1:
              start = len(parts[0])
              stop = start + len(parts[1])
              candidates.extend(
                  ("part-001-single-byte-removal", index - start, encoded[:index] + encoded[index + 1:])
                  for index in range(start, stop)
              )
          selected = None
          for method, index, candidate in candidates:
              try:
                  patch = base64.b64decode(candidate, validate=True)
              except (ValueError, binascii.Error):
                  continue
              if hashlib.sha256(patch).hexdigest() == expected:
                  selected = method, index, patch
                  break
          if selected is None:
              raise SystemExit("exact reviewed patch reconstruction failed")
          method, index, patch = selected
          if not patch.startswith(b"diff --git a/"):
              raise SystemExit("reviewed object is not a Git patch")
          target = Path(".git/intuition-source.patch")
          target.write_bytes(patch)
          Path(".git/intuition-source.patch.sha256").write_text(
              f"{expected}  {target.name}\n", encoding="utf-8"
          )
          Path(".git/intuition-source.patch.recovery").write_text(
              f"method={method}\nindex={index}\nsha256={expected}\nbytes={len(patch)}\n",
              encoding="utf-8",
          )
          print(f"selected method={method} index={index} sha256={expected} bytes={len(patch)} tail={patch[-80:]!r}")
          PY

          git apply --check .git/intuition-source.patch
          git apply --index .git/intuition-source.patch
          rm -rf .github/intuition-authoring-patch
          rm -f .github/workflows/intuition-source-export.yml
          rm -f .github/workflows/intuition-source-author-v2.yml
          rm -f .github/workflows/intuition-source-author-rescue.yml
          rm -f .github/workflows/intuition-source-author-self-hosted.yml
          rm -f .github/workflows/intuition-source-author-pocket4.yml
          rm -f .github/workflows/intuition-source-author-macbook.yml

      - name: Set up repository CI dependencies
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Verify final-use source and regressions
        shell: bash
        run: |
          set -euo pipefail
          (cd codex-rs && cargo fmt --all)
          python3 scripts/intuition_legacy_consumers.py
          python3 -m unittest discover -s scripts/tests -p 'test_intuition*.py' -v
          cd codex-rs
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence intuition
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_final_use_v4
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_commit_boundary
          cargo test --locked -p codex-hepta-agentd --lib intuition_policy
          cargo clippy --locked -p codex-hepta-agentd --lib --tests -- -D warnings
          cargo fmt --all -- --check

      - name: Publish one clean source commit with exact lease
        shell: bash
        env:
          TARGET_BRANCH: codex/intuition-policy-production-closure-20260927
          CLEAN_PARENT: 696447e733e22e425cd05691d98f4fe0ef63f759
        run: |
          set -euo pipefail
          git diff --check
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "OpenAI source authoring"
          git config user.email "assistant@openai.invalid"
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^\.github/(intuition-authoring-patch|workflows/intuition-source-(export|author-v2|author-rescue|author-self-hosted|author-pocket4|author-macbook)\.yml)' || true)"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(intuition): revalidate authority at final use' \
            'Preserve the sole ledger owner while moving fresh time, generation, and three-party qualification checks under its serialization boundary. Add typed boundary domains, stage telemetry, legacy-consumer drift checks, and separate safety/effectiveness/operator acceptance states.' \
            | git commit-tree "$tree" -p "$CLEAN_PARENT")"
          if ! git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORING_HEAD" \
            origin "$commit:refs/heads/$TARGET_BRANCH"; then
            git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            remote="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
            test "$(git rev-parse "$remote^{tree}")" = "$tree"
          fi
          printf 'published_tree=%s\npublished_commit=%s\n' "$tree" "$commit"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-reviewed-source-rescue-${{ matrix.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .git/intuition-source.patch
            .git/intuition-source.patch.sha256
            .git/intuition-source.patch.recovery
          if-no-files-found: warn
          retention-days: 3
