name: Temporary utility.ndu controlled closure

on:
  push:
    branches:
      - codex/utility-ndu-deterministic-closure
    paths:
      - "scripts/.utility_ndu_closure/**"
      - ".github/workflows/utility-ndu-closure-apply.yml"

permissions:
  contents: write

concurrency:
  group: utility-ndu-controlled-closure
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out canonical candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/utility-ndu-deterministic-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main with only the known map identity resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-qualification
          git config user.email qualification@invalid
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
            git checkout --ours docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
            git add docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
            git commit --no-edit
          fi

      - name: Assemble and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.utility_ndu_closure/*.py.part > scripts/utility_ndu_closure_apply.py
          python3 -m py_compile scripts/utility_ndu_closure_apply.py
          python3 scripts/utility_ndu_closure_apply.py
          git diff --check

      - name: Format changed Rust sources
        working-directory: codex-rs
        run: |
          cargo fmt \
            --package codex-hepta-contracts \
            --package codex-hepta-ndu \
            --package codex-hepta-agentd \
            --package codex-hepta-intelligence

      - name: Product owner regression tests
        working-directory: codex-rs
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/utility-ndu-closure"
          cargo test --locked -p codex-hepta-contracts --lib final_use 2>&1 | tee "${RUNNER_TEMP}/utility-ndu-closure/contracts-final-use.log"
          cargo test --locked -p codex-hepta-ndu 2>&1 | tee "${RUNNER_TEMP}/utility-ndu-closure/ndu.log"
          cargo test --locked -p codex-hepta-agentd --lib ndu_owner 2>&1 | tee "${RUNNER_TEMP}/utility-ndu-closure/agentd-owner.log"

      - name: Current exact strict lint gate
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-ndu \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-intelligence \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-shadow-qualification \
            -- -D warnings 2>&1 | tee "${RUNNER_TEMP}/utility-ndu-closure/strict-six-package-clippy.log"
          cargo clippy --locked -p codex-hepta-agentd --lib -- -D warnings 2>&1 | tee "${RUNNER_TEMP}/utility-ndu-closure/agentd-lib-clippy.log"

      - name: Final source checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-contracts \
            --package codex-hepta-ndu \
            --package codex-hepta-agentd \
            --package codex-hepta-intelligence \
            -- --check
          python3 scripts/verify_cargo_lock.py
          python3 scripts/hepta-ndu-source-policy.py
          git diff --check

      - name: Retain controlled execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: utility-ndu-controlled-closure-${{ github.sha }}
          path: ${{ runner.temp }}/utility-ndu-closure
          if-no-files-found: ignore

      - name: Commit only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/utility_ndu_closure_apply.py
          rm -rf scripts/.utility_ndu_closure
          rm -f .github/workflows/utility-ndu-closure-apply.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(ndu): compose authenticated Agentd owner"
          git push origin HEAD:codex/utility-ndu-deterministic-closure
