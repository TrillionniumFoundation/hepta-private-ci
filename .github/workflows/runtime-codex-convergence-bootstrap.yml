name: runtime.codex convergence bootstrap

on:
  push:
    branches:
      - review/runtime-codex-convergence-20260927

permissions:
  contents: write

concurrency:
  group: runtime-codex-convergence-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact bootstrap candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure repository CI environment
        uses: ./.github/actions/setup-ci

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcap-dev pkg-config

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Resolve verified sandboxed V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Apply closed-world runtime.codex convergence patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/runtime_codex_convergence.py
          python3 scripts/runtime_codex_convergence.py
          test ! -e scripts/runtime_codex_convergence.py
          test ! -e .github/workflows/runtime-codex-convergence-bootstrap.yml
          git diff --check

      - name: Format owned Rust packages
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-agent-protocol \
            --package codex-hepta-agentd \
            --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host \
            --package codex-hepta-codex-adapter
          git diff --check

      - name: Compile runtime.codex owners and reverse consumers
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-agent-protocol \
            -p codex-hepta-agentd \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-worker-host \
            -p codex-hepta-codex-adapter

      - name: Run focused owner and state-machine tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked \
            -p codex-hepta-agent-protocol \
            -p codex-hepta-agentd \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-worker-host \
            -p codex-hepta-codex-adapter \
            --lib -- --test-threads=1

      - name: Run runtime.codex product E2E
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd \
            --test runtime_codex_product_e2e -- --test-threads=1

      - name: Run strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-agent-protocol \
            -p codex-hepta-agentd \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-worker-host \
            -p codex-hepta-codex-adapter \
            -- -D warnings

      - name: Verify generated source is stable
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-agent-protocol \
            --package codex-hepta-agentd \
            --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host \
            --package codex-hepta-codex-adapter -- --check
          git diff --check
          python3 -m py_compile scripts/hepta-runtime-codex-evidence.py
          python3 scripts/hepta-runtime-codex-evidence.py emit \
            --mode bootstrap \
            --source-sha "$(git rev-parse HEAD)" \
            --candidate-sha "$(git rev-parse HEAD)" \
            --candidate-tree "$(git write-tree)" \
            --output .hepta-evidence/runtime-codex/bootstrap.json
          python3 scripts/hepta-runtime-codex-evidence.py verify \
            .hepta-evidence/runtime-codex/bootstrap.json
          rm -rf .hepta-evidence

      - name: Commit verified implementation
        shell: bash
        env:
          TARGET_BRANCH: review/runtime-codex-convergence-20260927
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "runtime.codex: close correctness and qualification gaps"
          git push origin "HEAD:${TARGET_BRANCH}"
