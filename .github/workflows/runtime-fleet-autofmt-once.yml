name: runtime.fleet one-shot autofmt

on:
  push:
    branches:
      - codex/runtime-fleet-durable-owner-v1-2026-09-27

permissions:
  contents: write

concurrency:
  group: runtime-fleet-autofmt-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/runtime-fleet-durable-owner-v1-2026-09-27
          persist-credentials: true
          fetch-depth: 0

      - name: Format runtime.fleet and supervisor
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-fleet -p codex-hepta-supervisor

      - name: Commit formatting and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-fleet-autofmt-once.yml
          git diff --check
          git config user.name "runtime.fleet automation"
          git config user.email "runtime-fleet-automation@users.noreply.github.com"
          git add codex-rs/hepta-fleet codex-rs/hepta-supervisor .github/workflows/runtime-fleet-autofmt-once.yml
          git commit -m "runtime.fleet: apply canonical Rust formatting" -m "Format the durable Fleet owner and its supervisor composition with the pinned workspace toolchain, then retire the one-shot formatter."
          git push origin HEAD:codex/runtime-fleet-durable-owner-v1-2026-09-27
