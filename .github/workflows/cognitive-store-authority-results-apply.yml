name: Cognitive store authority and result convergence apply

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/cognitive-store-authority-results-apply.yml

permissions:
  contents: write

concurrency:
  group: cognitive-store-authority-results-apply
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind the reviewed applicator
        shell: bash
        env:
          STAGING_COMMIT: 810d31e18c032fe796adb2a6fe9ea239de4a438e
          PAYLOAD_PATH: scripts/.hepta_cognitive_authority_results.py.gz.b64
          PAYLOAD_GIT_BLOB: f5f72375eb0195dee8fe43c2133a5ccfefbbfb93
          PAYLOAD_SHA256: a828b4cc834a0e930f7cd9ab87ae7b7b320665639b62fd710b8200d90690728d
          SOURCE_SHA256: de6f04e5fbee3359927c86de4086ea347bc188cc2698f3ba2d2eaaea6934eba1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$STAGING_COMMIT^{commit}"
          git merge-base --is-ancestor "$STAGING_COMMIT" "$GITHUB_SHA"
          test -f "$PAYLOAD_PATH"
          test "$(git hash-object "$PAYLOAD_PATH")" = "$PAYLOAD_GIT_BLOB"
          test "$(sha256sum "$PAYLOAD_PATH" | awk '{print $1}')" = "$PAYLOAD_SHA256"
          base64 -d "$PAYLOAD_PATH" | gzip -dc > /tmp/hepta_apply_cognitive_authority_results.py
          test "$(sha256sum /tmp/hepta_apply_cognitive_authority_results.py | awk '{print $1}')" = "$SOURCE_SHA256"
          python3 -m py_compile /tmp/hepta_apply_cognitive_authority_results.py
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Apply authority linearization and durable result lookup
        run: python3 /tmp/hepta_apply_cognitive_authority_results.py

      - name: Prepare native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev libssl-dev

      - name: Format changed Rust packages
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-memory --package codex-hepta-cognitive-store
          git diff --check

      - name: Test revocation while waiting for the SQLite writer
        working-directory: codex-rs
        run: >-
          cargo test --locked -p codex-hepta-memory --lib
          production_writer::tests::revocation_while_waiting_for_sqlite_writer_lock_blocks_semantic_commit
          -- --exact --nocapture

      - name: Test response-loss result recovery
        working-directory: codex-rs
        run: >-
          cargo test --locked -p codex-hepta-memory --lib
          production_writer::tests::semantic_response_loss_restart_rejects_duplicate_and_preserves_committed_cut
          -- --exact --nocapture

      - name: Test writable recovery and canonical facade
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-memory --lib cognitive_store_recovery_tests -- --nocapture
          cargo test --locked -p codex-hepta-cognitive-store --lib -- --nocapture

      - name: Check affected product hosts
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-memory
          -p codex-hepta-cognitive-store
          -p codex-hepta-agentd
          -p codex-hepta-supervisor
          --all-targets

      - name: Strict changed-package lint
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-memory --no-deps --lib --tests -- -D warnings
          cargo clippy --locked -p codex-hepta-cognitive-store --no-deps --lib --tests -- -D warnings

      - name: Commit validated convergence
        shell: bash
        run: |
          set -euo pipefail
          source_paths=(
            codex-rs/hepta-memory/src/production_writer.rs
            codex-rs/hepta-memory/src/cognitive_store_recovery.rs
            codex-rs/hepta-memory/src/lib.rs
            codex-rs/hepta-cognitive-store/src/durable.rs
            codex-rs/hepta-cognitive-store/src/lib.rs
          )
          carrier_paths=(
            scripts/.hepta_cognitive_authority_results.py.gz.b64
            .github/workflows/cognitive-store-authority-results-apply.yml
          )
          mapfile -t unstaged < <(git diff --name-only | sort)
          mapfile -t expected_sources < <(printf '%s\n' "${source_paths[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sources[@]}") <(printf '%s\n' "${unstaged[@]}")
          git add -- "${source_paths[@]}"
          git rm -- "${carrier_paths[@]}"
          git diff --check
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected_staged < <(printf '%s\n' "${source_paths[@]}" "${carrier_paths[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_staged[@]}") <(printf '%s\n' "${staged[@]}")
          test -z "$(git status --porcelain --untracked-files=normal | awk '$1 == "??" { print }')"
          git config user.name "Hepta convergence bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "feat(cognitive.store): linearize authority and recover results"

      - name: Rebase, revalidate and fast-forward push
        env:
          BRANCH: work/product-convergence-20260923
        shell: bash
        run: |
          set -euo pipefail
          validate_rebased_head() {
            git diff --check
            (
              cd codex-rs
              cargo fmt --package codex-hepta-memory --package codex-hepta-cognitive-store -- --check
              cargo test --locked -p codex-hepta-memory --lib \
                production_writer::tests::revocation_while_waiting_for_sqlite_writer_lock_blocks_semantic_commit \
                -- --exact
              cargo test --locked -p codex-hepta-memory --lib \
                production_writer::tests::semantic_response_loss_restart_rejects_duplicate_and_preserves_committed_cut \
                -- --exact
              cargo test --locked -p codex-hepta-memory --lib cognitive_store_recovery_tests
              cargo test --locked -p codex-hepta-cognitive-store --lib
              cargo check --locked \
                -p codex-hepta-memory \
                -p codex-hepta-cognitive-store \
                -p codex-hepta-agentd \
                -p codex-hepta-supervisor \
                --all-targets
              cargo clippy --locked -p codex-hepta-memory --no-deps --lib --tests -- -D warnings
              cargo clippy --locked -p codex-hepta-cognitive-store --no-deps --lib --tests -- -D warnings
            )
          }
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            remote_head="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$remote_head" HEAD; then
              git rebase "$remote_head"
              validate_rebased_head
            fi
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
          done
          echo "branch advanced during all fast-forward attempts" >&2
          exit 1
