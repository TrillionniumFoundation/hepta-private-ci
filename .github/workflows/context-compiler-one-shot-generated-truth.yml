name: context-compiler-one-shot-generated-truth

on:
  push:
    branches:
      - codex/context-compiler-v3-closure-20260928
    paths:
      - .github/workflows/context-compiler-one-shot-generated-truth.yml

permissions:
  contents: write

concurrency:
  group: context-compiler-one-shot-generated-truth
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind generated truth to source parent
        env:
          SOURCE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          if not source_sha or set(source_sha) == {"0"}:
              raise SystemExit("push event did not provide a source parent")
          state_path = Path("docs/modules/context.compiler/CURRENT_STATE.json")
          state = json.loads(state_path.read_text())
          state["runtimeSourceAnchor"] = source_sha
          state["runtimeSourceTree"] = subprocess.check_output(
              ["git", "rev-parse", f"{source_sha}^{{tree}}"], text=True
          ).strip()
          for item in state["runtimeSourceFiles"]:
              item["blobSha"] = subprocess.check_output(
                  ["git", "rev-parse", f"{source_sha}:{item['path']}"], text=True
              ).strip()
          state_path.write_text(json.dumps(state, indent=2) + "\n")
          PY
          python3 -B scripts/generate_context_compiler_module_docs.py --write
          python3 -B scripts/generate_context_compiler_module_docs.py --check
          python3 -B -m unittest discover -s scripts -p 'test_context_compiler_*.py' -q
      - name: Commit exact generated projections and remove one-shot workflow
        env:
          SOURCE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/context-compiler-one-shot-generated-truth.yml
          git add \
            docs/modules/context.compiler/CURRENT_STATE.json \
            docs/modules/context.compiler/CURRENT_PRODUCT_PATH.md \
            docs/modules/context.compiler/IMPLEMENTATION_MAP.json \
            docs/modules/context.compiler/MODULE_MANIFEST.json \
            docs/modules/context.compiler/TECHNICAL.md \
            qualification/module-execution-dossiers/detail/context.compiler.md
          git diff --cached --check
          git commit -m "docs(context.compiler): bind generated truth to ${SOURCE_SHA:0:12}" \
            -m "Refresh registered runtime blob identities and regenerate all six projections. The generated state remains fail-closed for authenticated ingress, external security consumption, independent provider evidence, selected-host qualification, acceptance, activation, and release."
          git push origin "HEAD:${GITHUB_REF_NAME}"
