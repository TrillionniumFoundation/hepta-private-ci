name: tmp-lane-c-clean-repair-v3

on:
  push:
    branches:
      - codex/lane-c-full-gap-closure-20260910
    paths:
      - .github/workflows/tmp-lane-c-clean-repair-v3.yml

permissions:
  contents: write

concurrency:
  group: tmp-lane-c-binding-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Commit clean exact binding candidate
        shell: bash
        run: |
          set -euo pipefail
          carrier="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("qualification/module-execution-dossiers/NATIVE_BINDINGS.json")
          text = path.read_text(encoding="utf-8")
          stale = '"blobSha": "f4fca6216821c994a401e401442cf06f69a3d082"'
          exact = '"blobSha": "f4fca6216821c994a401e401442cf06f69a3d082"'
          if text.count(stale) == 1 and text.count(exact) == 0:
              text = text.replace(stale, exact, 1)
          elif text.count(stale) == 0 and text.count(exact) == 1:
              pass
          else:
              raise SystemExit("inference.worker binding is neither uniquely stale nor uniquely exact")
          path.write_text(text, encoding="utf-8")
          PY
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-lane-c-native-binding-repair.yml \
            .github/workflows/tmp-lane-c-clean-repair-v2.yml \
            .github/workflows/tmp-lane-c-clean-repair-v3.yml
          git add qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(lane-c): finalize exact native-source binding set'
          test "$(git rev-parse HEAD^)" = "$carrier"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify committed closed world
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          git show --check --oneline --no-renames HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish verified head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/lane-c-full-gap-closure-20260910
