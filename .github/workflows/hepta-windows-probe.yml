name: Windows OpenSSH observation (independent diagnostic)

on:
  push:
    branches: ["codex/cell-windows-probe-20261108-898e"]

permissions:
  contents: read

concurrency:
  group: hepta-windows-probe-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  original-operator-and-controls:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Enable the existing Windows checkout convention
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: git config --global core.longpaths true
      - name: Checkout this exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the original compiler and runners
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
      - name: Install the original test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Check observation rejection and original receipt controls
        shell: pwsh
        run: |
          python -m unittest discover -s .github/scripts -p test_windows_current_ci.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s .github/scripts -p test_windows_native_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe the original verifier and independent fixture contrasts
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "hepta-windows-probe-target"
          python .github/scripts/windows_native_probe.py --expected-head "${{ github.sha }}" --output "$env:RUNNER_TEMP/hepta-windows-probe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original failures and all diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-windows-probe/
          if-no-files-found: error
          retention-days: 14
