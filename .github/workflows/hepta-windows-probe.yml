name: Windows original operator scope (frozen common source)

on:
  push:
    branches: ["codex/cell-windows-probe-20261108-898e"]

permissions:
  contents: read

concurrency:
  group: hepta-windows-probe-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ba4e1e42b6a8cbab724e1755bddfb9b5b8f298a1
  TESTED_SHA: ba4e1e42b6a8cbab724e1755bddfb9b5b8f298a1
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  original-operator-same-source:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Enable the existing Windows checkout convention
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: git config --global core.longpaths true
      - name: Checkout the independent observer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: observer
          persist-credentials: false
      - name: Checkout the exact frozen common source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Install the original compiler and owning-package lint component
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Install the original test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Check observer and tested-source receipt rejection controls
        shell: pwsh
        run: |
          python -m unittest discover -s source/.github/scripts -p test_windows_current_ci.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s observer/.github/scripts -p test_windows_native_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the original 33 cases and owning-package strict lint
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "hepta-windows-common-operator-target"
          python observer/.github/scripts/windows_native_probe.py --original-only --source-root "$env:GITHUB_WORKSPACE/source" --expected-head "$env:SOURCE_SHA" --expected-observer-head "${{ github.sha }}" --output "$env:RUNNER_TEMP/hepta-windows-common-operator"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original results, strict lint, and both source bindings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-common-operator-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-windows-common-operator/
          if-no-files-found: error
          retention-days: 14
