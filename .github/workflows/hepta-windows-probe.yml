name: Windows OpenSSH environment observation (no native tests)

on:
  push:
    branches: ["codex/cell-windows-probe-20261108-898e"]

permissions:
  contents: read

concurrency:
  group: hepta-windows-probe-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  fixture-environment-only:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Enable the existing Windows checkout convention
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: git config --global core.longpaths true
      - name: Checkout this exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check pure Python observation rejection controls
        shell: pwsh
        run: |
          python -m unittest discover -s .github/scripts -p test_windows_environment_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe only disposable fixture environments
        shell: pwsh
        run: |
          python .github/scripts/windows_environment_probe.py --env-narrowing --expected-head "${{ github.sha }}" --output "$env:RUNNER_TEMP/hepta-windows-env-narrowing"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve environment observations without native acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-env-narrowing-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-windows-env-narrowing/
          if-no-files-found: error
          retention-days: 14
