name: Hepta single-main convergence r3

on:
  push:
    branches:
      - ops/hepta-single-main-convergence-20260910-r3
    paths:
      - .github/workflows/hepta-single-main-convergence-r2.yml
      - scripts/hepta-single-main-convergence-r1.py
      - scripts/hepta-single-main-convergence-r2.py
      - scripts/hepta-single-main-convergence-r3.py
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: hepta-single-main-convergence-r3
  cancel-in-progress: true

env:
  HEPTA_BASE_BRANCH: integration/hepta-all-gap-closure-20260910-r12
  HEPTA_OLD_DEFAULT_BRANCH: integration/vnext-main-20260811
  HEPTA_LANE_F_BRANCH: codex/lane-f-gap-closure-20260910
  HEPTA_LANE_G_BRANCH: codex/lane-g-real-full-closure-v2-20260910
  HEPTA_SINGLE_MAIN_OUT: qualification/single-main-closure-r3
  HEPTA_ARCHIVE_PREFIX: archive/final-branch-tip/20260910-r3-${{ github.run_id }}-r${{ github.run_attempt }}
  HEPTA_PACKAGE_SHARDS: '8'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  freeze:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      branch_count: ${{ steps.freeze.outputs.branch_count }}
      snapshot_digest: ${{ steps.freeze.outputs.snapshot_digest }}
      archive_prefix: ${{ steps.freeze.outputs.archive_prefix }}
      base_sha: ${{ steps.freeze.outputs.base_sha }}
      old_default_sha: ${{ steps.freeze.outputs.old_default_sha }}
      old_main_sha: ${{ steps.freeze.outputs.old_main_sha }}
      lane_f_sha: ${{ steps.freeze.outputs.lane_f_sha }}
      lane_g_sha: ${{ steps.freeze.outputs.lane_g_sha }}
    steps:
      - name: Check out exact R3 controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure write-capable GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.HEPTA_ADMIN_TOKEN || secrets.REPO_ADMIN_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'Hepta single-main convergence controller'
          git config user.email 'hepta-single-main@users.noreply.github.com'

      - name: Compile convergence executors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-single-main-convergence-r1.py \
            scripts/hepta-single-main-convergence-r2.py \
            scripts/hepta-single-main-convergence-r3.py

      - name: Freeze authoritative sources and archive every observed branch tip
        id: freeze
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.HEPTA_ADMIN_TOKEN || secrets.REPO_ADMIN_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/hepta-single-main-r3-bundle"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"
          cp scripts/hepta-single-main-convergence-r1.py "$BUNDLE/"
          cp scripts/hepta-single-main-convergence-r2.py "$BUNDLE/"
          cp scripts/hepta-single-main-convergence-r3.py "$BUNDLE/"
          python3 scripts/hepta-single-main-convergence-r3.py freeze --out "$BUNDLE"

      - name: Upload immutable R3 freeze and executor bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-single-main-r3-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-single-main-r3-bundle
          if-no-files-found: error
          retention-days: 30

  prepare:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      candidate_branch: ${{ steps.prepare.outputs.candidate_branch }}
      product_sha: ${{ steps.prepare.outputs.product_sha }}
      final_sha: ${{ steps.prepare.outputs.final_sha }}
      tree_sha: ${{ steps.prepare.outputs.tree_sha }}
      package_count: ${{ steps.prepare.outputs.package_count }}
      packages_json: ${{ steps.prepare.outputs.packages_json }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Check out exact R3 controller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure write-capable GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.HEPTA_ADMIN_TOKEN || secrets.REPO_ADMIN_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'Hepta single-main convergence controller'
          git config user.email 'hepta-single-main@users.noreply.github.com'

      - name: Download immutable R3 freeze and executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-single-main-r3-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-single-main-r3-bundle

      - name: Assemble exact product tree and absorb frozen history
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.HEPTA_ADMIN_TOKEN || secrets.REPO_ADMIN_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/hepta-single-main-r3-prepare"
          rm -rf "$EVIDENCE"
          python3 "${RUNNER_TEMP}/hepta-single-main-r3-bundle/hepta-single-main-convergence-r3.py" prepare \
            --manifest "${RUNNER_TEMP}/hepta-single-main-r3-bundle/freeze.json" \
            --evidence "$EVIDENCE"

      - name: Upload candidate preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-single-main-r3-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-single-main-r3-prepare
          if-no-files-found: error
          retention-days: 30

  repository-gate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact qualified history head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable R3 executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-single-main-r3-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-single-main-r3-bundle

      - name: Run repository, documentation, Lane and standalone gates
        env:
          HEPTA_FINAL_SHA: ${{ needs.prepare.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/hepta-single-main-r3-bundle/hepta-single-main-convergence-r3.py" repo-gate

  package-gates:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out exact qualified history head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.final_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download immutable R3 executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-single-main-r3-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-single-main-r3-bundle

      - name: Test and lint canonical package shard ${{ matrix.shard }}
        env:
          HEPTA_FINAL_SHA: ${{ needs.prepare.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/hepta-single-main-r3-bundle/hepta-single-main-convergence-r3.py" package-gate \
            --packages-json '${{ matrix.packages_json }}'

  windows-gate:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 330
    steps:
      - name: Check out exact qualified history head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.final_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download immutable R3 executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-single-main-r3-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-single-main-r3-bundle

      - name: Check every canonical package under MSVC
        env:
          HEPTA_FINAL_SHA: ${{ needs.prepare.outputs.final_sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python "$env:RUNNER_TEMP/hepta-single-main-r3-bundle/hepta-single-main-convergence-r3.py" package-gate `
            --check-only `
            --packages-json '${{ needs.prepare.outputs.packages_json }}'

  finalize:
    needs:
      - freeze
      - prepare
      - repository-gate
      - package-gates
      - windows-gate
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact qualified history head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure administrator GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.HEPTA_ADMIN_TOKEN || secrets.REPO_ADMIN_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'Hepta single-main convergence controller'
          git config user.email 'hepta-single-main@users.noreply.github.com'

      - name: Download immutable R3 freeze and executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-single-main-r3-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-single-main-r3-bundle

      - name: Reconcile late history, publish main and delete every non-main branch
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.HEPTA_ADMIN_TOKEN || secrets.REPO_ADMIN_TOKEN || github.token }}
          HEPTA_FINAL_SHA: ${{ needs.prepare.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/hepta-single-main-r3-final"
          rm -rf "$EVIDENCE"
          python3 "${RUNNER_TEMP}/hepta-single-main-r3-bundle/hepta-single-main-convergence-r3.py" finalize \
            --manifest "${RUNNER_TEMP}/hepta-single-main-r3-bundle/freeze.json" \
            --final-sha '${{ needs.prepare.outputs.final_sha }}' \
            --tree-sha '${{ needs.prepare.outputs.tree_sha }}' \
            --candidate-branch '${{ needs.prepare.outputs.candidate_branch }}' \
            --evidence "$EVIDENCE"

      - name: Upload final single-main receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-single-main-r3-final-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-single-main-r3-final
          if-no-files-found: warn
          retention-days: 90
