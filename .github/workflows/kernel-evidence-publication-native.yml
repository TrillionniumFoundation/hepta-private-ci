name: Kernel evidence publication native diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: kernel-evidence-publication-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/kernel-evidence-production-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      LANE: ${{ matrix.lane }}
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Initialize negative diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence-publication-native"
          echo "RECORDS=$RUNNER_TEMP/evidence-publication-native" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_SHA" "$BASE_SHA" "$LANE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/evidence-publication-native/request.txt"
          printf '%s\n' 'Native diagnostics only. No independent acceptance, activation or release.' > "$RUNNER_TEMP/evidence-publication-native/SCOPE.txt"
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          if [ "$LANE" = base-merge ]; then
            test "$SOURCE_SHA" != "$BASE_SHA"
            git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA" > "$RECORDS/merge-tree.txt"
            TREE=$(head -n 1 "$RECORDS/merge-tree.txt")
            export GIT_AUTHOR_NAME='Kernel evidence native diagnostic'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_AUTHOR_EMAIL='noreply@github.com'
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            CANDIDATE=$(printf '%s\n' 'kernel.evidence publication deterministic merge' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$CANDIDATE"
            test "$(git show -s --format=%P HEAD)" = "$BASE_SHA $SOURCE_SHA"
          fi
          git rev-parse HEAD HEAD^{tree} > "$RECORDS/candidate-before.txt"
          test -z "$(git status --porcelain)"
      - uses: ./.github/actions/setup-ci
        id: setup
      - name: Install pinned repository Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy
      - name: Install pinned nextest
        id: nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103
      - name: Record native tool identities
        if: always() && steps.rust.outcome == 'success' && steps.nextest.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          { rustc --version; cargo --version; rustfmt --version; cargo clippy --version; cargo nextest --version; just --version; } | tee "$RECORDS/tools.txt"
      - name: Check repository formatting on unmodified source
        id: formatting
        if: always() && steps.candidate.outcome == 'success' && steps.setup.outcome == 'success' && steps.rust.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          just fmt-check 2>&1 | tee "$RECORDS/formatting.log"
      - name: Test the complete evidence package
        id: evidence
        if: always() && steps.candidate.outcome == 'success' && steps.nextest.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-evidence 2>&1 | tee "$RECORDS/evidence-tests.log"
      - name: Test Agentd library and evidence product targets
        id: agentd
        if: always() && steps.candidate.outcome == 'success' && steps.nextest.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd --lib \
            --test kernel_evidence_product --test kernel_evidence_profile \
            --test kernel_evidence_paging_product --test kernel_evidence_publication_cli \
            2>&1 | tee "$RECORDS/agentd-tests.log"
      - name: Strict evidence and Agentd lint
        id: lint
        if: always() && steps.candidate.outcome == 'success' && steps.rust.outcome == 'success'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-evidence -p codex-hepta-agentd --all-targets -- -D warnings \
            2>&1 | tee "$RECORDS/clippy.log"
      - name: Compile the actual Agentd binary
        id: build
        if: always() && steps.candidate.outcome == 'success' && steps.rust.outcome == 'success'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p codex-hepta-agentd --bin hepta-agentd \
            2>&1 | tee "$RECORDS/build.log"
      - name: Preserve final candidate and individual outcomes
        if: always()
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          FORMATTING_OUTCOME: ${{ steps.formatting.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          AGENTD_OUTCOME: ${{ steps.agentd.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECORDS"
          git rev-parse HEAD HEAD^{tree} > "$RECORDS/candidate-after.txt" || true
          git status --porcelain > "$RECORDS/source-after.txt" || true
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          records = Path(os.environ['RECORDS'])
          outcomes = {name: os.environ.get(name.upper() + '_OUTCOME', '') for name in ['candidate', 'formatting', 'evidence', 'agentd', 'lint', 'build']}
          before, after, status = [records / name for name in ['candidate-before.txt', 'candidate-after.txt', 'source-after.txt']]
          unchanged = before.is_file() and after.is_file() and status.is_file() and before.read_bytes() == after.read_bytes() and not status.read_bytes()
          passed = all(value == 'success' for value in outcomes.values()) and unchanged
          payload = {'schemaVersion': 1, 'source': os.environ['SOURCE_SHA'], 'base': os.environ['BASE_SHA'], 'lane': os.environ['LANE'], 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'outcomes': outcomes, 'sourceUnchanged': unchanged, 'allNativeDiagnosticStepsPassed': passed, 'independentAcceptance': False, 'activation': False, 'release': False}
          (records / 'RESULT.json').write_text(json.dumps(payload, indent=2) + '\n')
          lines = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(records.iterdir()) if path.is_file() and path.name != 'SHA256SUMS']
          (records / 'SHA256SUMS').write_text(''.join(lines))
          if not passed:
              raise SystemExit('required native diagnostics failed, were skipped, or changed source')
          PY
      - name: Retain all native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-evidence-publication-native-${{ matrix.lane }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-publication-native/
          if-no-files-found: error
          retention-days: 14
      - name: Generate formatting suggestions only in a separate worktree
        if: always() && steps.candidate.outcome == 'success' && steps.rust.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          diagnostic="$RUNNER_TEMP/evidence-publication-format-tree"
          output="$RUNNER_TEMP/evidence-publication-format"
          mkdir -p "$output"
          git worktree add --detach "$diagnostic" HEAD
          git rev-parse HEAD HEAD^{tree} > "$output/source.txt"
          set +e
          cargo fmt --manifest-path "$diagnostic/codex-rs/Cargo.toml" \
            --package codex-hepta-evidence --package codex-hepta-agentd --package codex-hepta-agent-protocol \
            > "$output/rustfmt.log" 2>&1
          format_exit=$?
          set -e
          printf '%s\n' "$format_exit" > "$output/formatter-exit.txt"
          git -C "$diagnostic" diff --binary > "$output/formatting-only.patch"
          git -C "$diagnostic" diff --name-only -z > "$output/changed-paths.nul"
          python3 - "$diagnostic" "$output" <<'PY'
          import hashlib, shutil, sys
          from pathlib import Path
          tree, output = map(Path, sys.argv[1:])
          for name in (output / 'changed-paths.nul').read_bytes().split(b'\0'):
              if not name:
                  continue
              relative = Path(name.decode())
              if relative.is_absolute() or '..' in relative.parts:
                  raise RuntimeError('noncanonical formatting path')
              source, target = tree / relative, output / 'files' / relative
              if source.is_symlink() or not source.is_file():
                  raise RuntimeError('invalid formatted source')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          sums = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(output)}\n' for path in sorted(output.rglob('*')) if path.is_file() and path.name != 'SHA256SUMS']
          (output / 'SHA256SUMS').write_text(''.join(sums))
          PY
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain non-qualifying formatting suggestions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-evidence-publication-format-${{ matrix.lane }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-publication-format/
          if-no-files-found: error
          retention-days: 7
