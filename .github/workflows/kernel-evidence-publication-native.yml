name: Kernel evidence publication native diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: kernel-evidence-publication-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native:
    if: contains(fromJSON('["fix/kernel-evidence-production-closure","codex/kernel-evidence-protocol-closure-20260929"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      LANE: ${{ matrix.lane }}
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Initialize negative diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence-publication-native"
          echo "RECORDS=$RUNNER_TEMP/evidence-publication-native" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_SHA" "$BASE_SHA" "$LANE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/evidence-publication-native/request.txt"
          printf '%s\n' 'Scoped native diagnostics only. No independent acceptance, activation or release.' > "$RUNNER_TEMP/evidence-publication-native/SCOPE.txt"
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          if [ "$LANE" = base-merge ]; then
            test "$SOURCE_SHA" != "$BASE_SHA"
            git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA" > "$RECORDS/merge-tree.txt"
            TREE=$(head -n 1 "$RECORDS/merge-tree.txt")
            export GIT_AUTHOR_NAME='Kernel evidence native diagnostic'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_AUTHOR_EMAIL='noreply@github.com'
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            CANDIDATE=$(printf '%s\n' 'kernel.evidence publication deterministic merge' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$CANDIDATE"
            test "$(git show -s --format=%P HEAD)" = "$BASE_SHA $SOURCE_SHA"
          fi
          git rev-parse HEAD HEAD^{tree} > "$RECORDS/candidate-before.txt"
          test -z "$(git status --porcelain)"
      - uses: ./.github/actions/setup-ci
        id: setup
      - name: Install pinned repository Python tooling
        id: uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Install pinned repository Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install pinned nextest
        id: nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103
      - name: Execute all scoped checks and retain each command result
        id: execution
        if: always() && steps.candidate.outcome == 'success' && steps.setup.outcome == 'success' && steps.uv.outcome == 'success' && steps.rust.outcome == 'success' && steps.nextest.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          { rustc --version; cargo --version; rustfmt --version; cargo clippy --version; cargo nextest --version; just --version; uv --version; } > "$RECORDS/tools.txt"
          python3 - <<'PY'
          import datetime, hashlib, json, os, signal, subprocess
          from pathlib import Path
          records = Path(os.environ['RECORDS'])
          commands = {
              'formatting': ['just', 'fmt-check'],
              'evidence-tests': ['just', 'test', '--locked', '-p', 'codex-hepta-evidence'],
              'agentd-tests': ['just', 'test', '--locked', '-p', 'codex-hepta-agentd', '--lib', '--test', 'kernel_evidence_product', '--test', 'kernel_evidence_profile', '--test', 'kernel_evidence_paging_product', '--test', 'kernel_evidence_publication_cli'],
              # nextest does not execute Rust documentation/compile-fail tests.
              'evidence-doctests': ['cargo', 'test', '--manifest-path', 'codex-rs/Cargo.toml', '--locked', '-p', 'codex-hepta-evidence', '--doc'],
              'clippy': ['cargo', 'clippy', '--manifest-path', 'codex-rs/Cargo.toml', '--locked', '-p', 'codex-hepta-evidence', '-p', 'codex-hepta-agentd', '--all-targets', '--', '-D', 'warnings'],
              'build': ['cargo', 'build', '--manifest-path', 'codex-rs/Cargo.toml', '--locked', '-p', 'codex-hepta-agentd', '--bin', 'codex-hepta-agentd'],
          }
          outcomes = {}
          for name, command in commands.items():
              started = datetime.datetime.now(datetime.timezone.utc).isoformat()
              path = records / f'{name}.log'
              timed_out = False
              print(f'::group::{name}', flush=True)
              with path.open('wb') as log:
                  with subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True) as process:
                      try:
                          code = process.wait(timeout=1200)
                      except subprocess.TimeoutExpired:
                          timed_out = True
                          try:
                              os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          process.wait()
                          code = 124
              payload = {'command': command, 'exitCode': code, 'timedOut': timed_out, 'startedAt': started, 'finishedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'logSha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'source': os.environ['SOURCE_SHA'], 'base': os.environ['BASE_SHA'], 'lane': os.environ['LANE'], 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT']}
              (records / f'{name}.json').write_text(json.dumps(payload, indent=2) + '\n')
              outcomes[name] = code
              print(path.read_text(errors='replace')[-16000:], flush=True)
              print('::endgroup::', flush=True)
          (records / 'outcomes.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          if any(code != 0 for code in outcomes.values()):
              raise SystemExit('one or more scoped native checks failed')
          PY
      - name: Finalize observed results without treating skips as success
        if: always()
        env:
          EXECUTION_OUTCOME: ${{ steps.execution.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECORDS"
          git rev-parse HEAD HEAD^{tree} > "$RECORDS/candidate-after.txt" || true
          git status --porcelain > "$RECORDS/source-after.txt" || true
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          records = Path(os.environ['RECORDS'])
          before, after, status = [records / name for name in ['candidate-before.txt', 'candidate-after.txt', 'source-after.txt']]
          unchanged = before.is_file() and after.is_file() and status.is_file() and before.read_bytes() == after.read_bytes() and not status.read_bytes()
          outcome_path = records / 'outcomes.json'
          outcomes = json.loads(outcome_path.read_text()) if outcome_path.is_file() else {}
          required = {'formatting', 'evidence-tests', 'agentd-tests', 'evidence-doctests', 'clippy', 'build'}
          passed = set(outcomes) == required and all(type(code) is int and code == 0 for code in outcomes.values()) and unchanged and os.environ.get('EXECUTION_OUTCOME') == 'success'
          result = {'schemaVersion': 1, 'source': os.environ['SOURCE_SHA'], 'base': os.environ['BASE_SHA'], 'lane': os.environ['LANE'], 'outcomes': outcomes, 'sourceUnchanged': unchanged, 'allNativeDiagnosticStepsPassed': passed, 'independentAcceptance': False, 'activation': False, 'release': False}
          (records / 'RESULT.json').write_text(json.dumps(result, indent=2) + '\n')
          sums = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(records.iterdir()) if path.is_file() and path.name != 'SHA256SUMS']
          (records / 'SHA256SUMS').write_text(''.join(sums))
          if not passed:
              raise SystemExit('native diagnostics failed, were skipped, or changed source')
          PY
      - name: Retain all native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-evidence-publication-native-${{ matrix.lane }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-publication-native/
          if-no-files-found: error
          retention-days: 14
