name: MemoryCell hosted BF16 hardware scouting (no model)

on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - .github/workflows/hepta-memory-bf16-host-scout.yml
      - scripts/memory_cell/strong_rag_cpu_scout.py
      - scripts/memory_cell/test_strong_rag_cpu_scout.py
      - scripts/memory_cell/strong_rag_host_gate.py
      - codex-rs/hepta-intelligence-eval/MEMORY_CELL_BF16_SCOUT.md

permissions:
  contents: read
concurrency:
  group: memorycell-bf16-scout-${{ github.sha }}
  cancel-in-progress: false

jobs:
  hosted-cpu-readonly:
    # Do not use self-hosted, personal desktop, ROG, Pocket4 or a GPU device.
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the read-only CPU scout and existing fail-closed gate
        shell: bash
        env:
          PYTHONPATH: scripts/memory_cell
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/memory_cell -p 'test_strong_rag_cpu_scout.py' -v
          python3 -m unittest discover -s scripts/memory_cell -p 'test_strong_rag_host_gate.py' -v
      - name: Observe the actual allocated CPU, without model execution
        shell: bash
        env:
          PYTHONPATH: scripts/memory_cell
          SCOUT_SHA: ${{ github.sha }}
          SCOUT_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          python3 scripts/memory_cell/strong_rag_cpu_scout.py \
            --source-commit "$SCOUT_SHA" \
            --runner-image "$SCOUT_IMAGE" \
            --output "$RUNNER_TEMP/memorycell-bf16-scout/$SCOUT_IMAGE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memorycell-bf16-cpu-${{ matrix.image }}
          path: ${{ runner.temp }}/memorycell-bf16-scout
          if-no-files-found: warn
