name: Hepta single-main final convergence

on:
  push:
    branches:
      - ops/hepta-single-main-finalize-20260911-gpt56
    paths:
      - .hepta-final-convergence-trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: hepta-single-main-final-convergence
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: candidate/hepta-main-final-r2-20260911
  CONTROL_BRANCH: ops/hepta-single-main-finalize-20260911-gpt56
  EXPECTED_CANDIDATE_BASE: a6aae8add8eac6d238511b46c72bf09e360ddfbb
  EXPECTED_MAIN_BASE: 04f60466394a024c218ce66b1b32d1c42c462985
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  converge-history:
    name: Freeze and absorb every branch head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      merged_sha: ${{ steps.merge.outputs.merged_sha }}
      merged_tree: ${{ steps.merge.outputs.merged_tree }}
      parent_count: ${{ steps.merge.outputs.parent_count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create exact-tree all-head ancestry merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          candidate="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          test "$candidate" = "$EXPECTED_CANDIDATE_BASE"
          tree="$(git rev-parse "${candidate}^{tree}")"
          test "$tree" = "389b62adbda417685f7af1142288e58396a30162"

          refs_file="$RUNNER_TEMP/frozen-heads.tsv"
          : > "$refs_file"
          while read -r ref sha; do
            case "$ref" in
              refs/remotes/origin/HEAD) continue ;;
            esac
            printf '%s\t%s\n' "$sha" "$ref" >> "$refs_file"
          done < <(git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin | LC_ALL=C sort)

          declare -A seen=()
          seen["$candidate"]=1
          parent_args=(-p "$candidate")
          additional=0
          while IFS=$'\t' read -r sha ref; do
            if [[ -n "${seen[$sha]+x}" ]]; then
              continue
            fi
            seen["$sha"]=1
            if git merge-base --is-ancestor "$sha" "$candidate"; then
              continue
            fi
            parent_args+=(-p "$sha")
            additional=$((additional + 1))
            printf 'absorbing %s %s\n' "$ref" "$sha"
          done < "$refs_file"

          git config user.name 'Hepta Final Convergence CI'
          git config user.email 'hepta-final-convergence-ci@users.noreply.github.com'
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          merged="$(printf 'Converge every repository branch into one main tree\n\nKeep the reviewed candidate tree byte-for-byte unchanged while recording every frozen branch head in ancestry.\n' | git commit-tree "$tree" "${parent_args[@]}")"
          test "$(git rev-parse "${merged}^{tree}")" = "$tree"

          while IFS=$'\t' read -r sha ref; do
            if ! git merge-base --is-ancestor "$sha" "$merged"; then
              echo "unabsorbed frozen ref: $ref $sha" >&2
              exit 1
            fi
          done < "$refs_file"

          remote_candidate="$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}" | awk '{print $1}')"
          test "$remote_candidate" = "$EXPECTED_CANDIDATE_BASE"
          git push origin "$merged:refs/heads/${CANDIDATE_BRANCH}"
          test "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}" | awk '{print $1}')" = "$merged"
          printf 'merged_sha=%s\n' "$merged" >> "$GITHUB_OUTPUT"
          printf 'merged_tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          printf 'parent_count=%s\n' "$((additional + 1))" >> "$GITHUB_OUTPUT"
          printf 'Merged SHA: %s\nTree: %s\nParents: %s\n' "$merged" "$tree" "$((additional + 1))" >> "$GITHUB_STEP_SUMMARY"

  repository-semantics:
    name: Repository and A-F semantic closure
    needs: converge-history
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.converge-history.outputs.merged_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Bind exact converged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.converge-history.outputs.merged_sha }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ needs.converge-history.outputs.merged_tree }}'
          test -z "$(git status --porcelain)"
          git diff --check
      - name: Repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-repository-integrity.py self-test
          python3 scripts/hepta-repository-integrity.py verify --base "$EXPECTED_MAIN_BASE" --head '${{ needs.converge-history.outputs.merged_sha }}'
      - name: Lane A foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lane_a_foundation.py self-test
          python3 scripts/verify_lane_a_foundation.py verify
          python3 -m unittest qualification/module-execution-dossiers/test_lane_a_foundation.py
          (cd qualification/module-execution-dossiers && python3 -m unittest test_implementation_contracts.py)
          scripts/run_lane_a_native_qualification.sh
      - name: Lane B source truth and runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-b-truth.py self-test
          python3 -m unittest scripts/test_hepta_lane_b_truth.py
          python3 scripts/hepta-lane-b-truth.py verify
          node --test apps/hepta-browser/test/runtime.test.js
          node --test apps/hepta-control-ui/test/runtime-client.test.js
          node --test apps/hepta-native/test/shell-runtime.test.js
      - name: Lane D semantic conformance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-lane-d-semantic-conformance.py
          python3 scripts/hepta-lane-d-semantic-conformance.py self-test
          python3 scripts/hepta-lane-d-semantic-conformance.py verify
      - name: Lane E closed world
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
      - name: Lane F standalone shadow vertical
        shell: bash
        run: |
          set -euo pipefail
          cp codex-rs/Cargo.lock qualification/lane-f-shadow/Cargo.lock
          cp qualification/lane-f-shadow/Cargo.lock "$RUNNER_TEMP/lane-f-seed.lock"
          trap 'rm -f qualification/lane-f-shadow/Cargo.lock' EXIT
          cargo metadata --format-version 1 --manifest-path qualification/lane-f-shadow/Cargo.toml >/dev/null
          python3 qualification/lane-f-shadow/verify_lock.py "$RUNNER_TEMP/lane-f-seed.lock" qualification/lane-f-shadow/Cargo.lock
          cargo test --locked --manifest-path qualification/lane-f-shadow/Cargo.toml
          cargo clippy --locked --manifest-path qualification/lane-f-shadow/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path qualification/lane-f-shadow/Cargo.toml -- --check
          rm -f qualification/lane-f-shadow/Cargo.lock
          trap - EXIT
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Bazel wrapper regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_run_bazel_ci.py
          python3 .github/scripts/test_run_bazel_native_msvc_toolchain.py
          test -z "$(git status --porcelain --untracked-files=no)"

  workspace-rust:
    name: Exact-head full Rust workspace
    needs: converge-history
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.converge-history.outputs.merged_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Bind exact converged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.converge-history.outputs.merged_sha }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ needs.converge-history.outputs.merged_tree }}'
      - name: Formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Compile entire workspace
        working-directory: codex-rs
        run: cargo check --locked --workspace --all-targets
      - name: Strict workspace lint
        working-directory: codex-rs
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test entire workspace
        working-directory: codex-rs
        run: cargo test --locked --workspace --all-targets
      - name: Explicit HTTP client regression
        working-directory: codex-rs
        run: cargo test --locked -p codex-http-client --all-targets
      - name: Clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  lane-d-platform:
    name: Lane D strict gate (${{ matrix.os }})
    needs: converge-history
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.converge-history.outputs.merged_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.converge-history.outputs.merged_sha }}'
      - name: Lane D format compile test lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p codex-hepta-objective -p codex-hepta-ndu -p codex-hepta-control-plane --all-targets
          cargo test --locked -p codex-hepta-objective
          cargo test --locked -p codex-hepta-ndu
          cargo test --locked -p codex-hepta-control-plane
          cargo clippy --locked -p codex-hepta-objective -p codex-hepta-ndu -p codex-hepta-control-plane --all-targets -- -D warnings
      - name: Clean tracked source
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"

  publish-main:
    name: Fast-forward qualified SHA to main
    needs: [converge-history, repository-semantics, workspace-rust, lane-d-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.converge-history.outputs.merged_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact qualified commit
        shell: bash
        run: |
          set -euo pipefail
          qualified='${{ needs.converge-history.outputs.merged_sha }}'
          test "$(git rev-parse HEAD)" = "$qualified"
          test "$(git rev-parse HEAD^{tree})" = '${{ needs.converge-history.outputs.merged_tree }}'
          remote_candidate="$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}" | awk '{print $1}')"
          remote_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          test "$remote_candidate" = "$qualified"
          test "$remote_main" = "$EXPECTED_MAIN_BASE"
          git merge-base --is-ancestor "$remote_main" "$qualified"
          git push origin "$qualified:refs/heads/main"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$qualified"

  verify-main:
    name: Verify main is the exact qualified object
    needs: [converge-history, publish-main]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Exact-main identity and integrity
        shell: bash
        run: |
          set -euo pipefail
          qualified='${{ needs.converge-history.outputs.merged_sha }}'
          test "$(git rev-parse HEAD)" = "$qualified"
          test "$(git rev-parse HEAD^{tree})" = '${{ needs.converge-history.outputs.merged_tree }}'
          python3 scripts/hepta-repository-integrity.py self-test
          python3 scripts/hepta-repository-integrity.py verify --base "$EXPECTED_MAIN_BASE" --head "$qualified"
          git diff --check
          test -z "$(git status --porcelain)"

  retire-branches:
    name: Switch default and retain only main
    needs: [converge-history, verify-main]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Revalidate every live branch is merged
        shell: bash
        run: |
          set -euo pipefail
          qualified='${{ needs.converge-history.outputs.merged_sha }}'
          test "$(git rev-parse HEAD)" = "$qualified"
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while read -r ref sha; do
            case "$ref" in
              refs/remotes/origin/HEAD|refs/remotes/origin/main) continue ;;
            esac
            if ! git merge-base --is-ancestor "$sha" "$qualified"; then
              echo "branch advanced after qualification and is not merged: $ref $sha" >&2
              exit 1
            fi
          done < <(git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin | LC_ALL=C sort)
      - name: Switch repository default branch to main
        shell: bash
        run: |
          set -euo pipefail
          gh api -X PATCH "/repos/${GITHUB_REPOSITORY}" -f default_branch=main >/dev/null
          test "$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .default_branch)" = main
      - name: Delete every non-main branch head
        shell: bash
        run: |
          set -euo pipefail
          qualified='${{ needs.converge-history.outputs.merged_sha }}'
          mapfile -t branches < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "$branch" == main ]]; then
              continue
            fi
            current="$(git ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}')"
            if [[ -z "$current" ]]; then
              continue
            fi
            git fetch --no-tags origin "refs/heads/${branch}:refs/tmp/hepta-retire"
            if ! git merge-base --is-ancestor "$current" "$qualified"; then
              echo "ref drifted outside qualified ancestry: $branch $current" >&2
              exit 1
            fi
            encoded="$(python3 -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=""))' "$branch")"
            echo "deleting merged branch $branch ($current)"
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" >/dev/null
            git update-ref -d refs/tmp/hepta-retire || true
          done
          mapfile -t remaining < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = main
          test "$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .default_branch)" = main
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$qualified"
          printf 'FINAL_MAIN_SHA=%s\nONLY_BRANCH=%s\n' "$qualified" "${remaining[0]}" >> "$GITHUB_STEP_SUMMARY"
