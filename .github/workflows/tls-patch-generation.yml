name: Independent tls-patch lock generation (review only)

on:
  push:
    branches:
      - research/dot-tls-patch-lock-generation-e4ee-20261025

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout isolated control branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: control
          persist-credentials: false

      - name: Checkout exact immutable source (not PR merge)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e4ee552d37040a62e8cee6ef4172aae8b6680204
          path: source
          persist-credentials: false

      - name: Set up pinned TOML-capable Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.14"

      - name: Offline adversarial validator tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s control/.github/scripts -p 'test_dependency_patch_generator.py' -v
          python3 -O -m unittest discover -s control/.github/scripts -p 'test_dependency_patch_generator.py' -v

      - name: Source, legal/configuration, and 20 GiB resource gate before tool downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 control/.github/scripts/dependency_patch_generator.py --preflight \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/tls-patch-generation" "$GITHUB_WORKSPACE/control"

      - name: Set up existing pinned official Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"

      - name: Set up existing pinned Bazelisk (no repository setup-ci action)
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: "1.28.1"
          module-root: source
          token: ""
          cache-save: false
          output-base: ${{ runner.temp }}/tls-patch-generation/bazel-output
          bazelisk-cache: false
          repository-cache: false
          disk-cache: false

      - name: Generate both locks and qualify locked cross-platform metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 control/.github/scripts/dependency_patch_generator.py \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/tls-patch-generation" "$GITHUB_WORKSPACE/control"

      - name: Upload only gated artifacts even on failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: tls-patch-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tls-patch-generation/public/
          if-no-files-found: error
          retention-days: 7
