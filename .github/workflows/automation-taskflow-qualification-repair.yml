name: Automation TaskFlow qualification repair

on:
  workflow_dispatch:
  push:
    branches:
      - work/automation-taskflow-full-closure-2026-09-27
    paths:
      - .github/workflows/automation-taskflow-qualification-repair.yml

permissions:
  contents: write

concurrency:
  group: automation-taskflow-qualification-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: [self-hosted, hepta-automation-selected-host]
    timeout-minutes: 120
    steps:
      - name: Check out exact work branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-full-closure-2026-09-27
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt

      - name: Synchronize facts and apply qualification repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/automation_taskflow_fact_sync.py source
          python3 scripts/automation_taskflow_qualification_repair.py
          git diff --check

      - name: Format repaired Rust owners
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd

      - name: Check repaired owners and tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd --all-targets
          cargo clippy -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd --all-targets --all-features -- -D warnings
          cargo test -p codex-hepta-operations
          cargo test -p codex-hepta-automation
          cargo test -p codex-hepta-automation --features taskflow-structural-qualification
          cargo test -p codex-hepta-agentd --lib

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/automation_taskflow_contract.py self-test
          python3 -m unittest -v \
            scripts/test_automation_taskflow_contract.py \
            scripts/test_verify_automation_taskflow_acceptance.py
          python3 scripts/hepta-gap-closure.py verify
          git diff --check

      - name: Commit repaired source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-automation-ci"
          git config user.email "hepta-automation-ci@users.noreply.github.com"
          git rm \
            .github/workflows/automation-taskflow-qualification-repair.yml \
            scripts/automation_taskflow_qualification_repair.py
          git add -A
          git commit -m "fix(automation): close qualification regressions"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Rebind exact implementation truth
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module automation.taskflow
          python3 scripts/automation_taskflow_fact_sync.py map
          python3 scripts/hepta-implementation-maps.py migrate --module automation.taskflow
          python3 scripts/automation_taskflow_contract.py verify
          python3 -m unittest -v \
            scripts/test_automation_taskflow_contract.py \
            scripts/test_verify_automation_taskflow_acceptance.py
          python3 scripts/hepta-gap-closure.py verify
          git rm \
            .github/workflows/automation-taskflow-fact-sync.yml \
            scripts/automation_taskflow_fact_sync.py
          git diff --check
          git add -A
          git commit -m "docs(automation): rebind repaired schema truth"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$SOURCE_SHA" \
            --expected-tree "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push repaired branch
        env:
          TARGET_BRANCH: work/automation-taskflow-full-closure-2026-09-27
        run: git push origin "HEAD:${TARGET_BRANCH}"
