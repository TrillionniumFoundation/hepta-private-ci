name: Automation TaskFlow qualification repair

on:
  push:
    branches:
      - work/automation-taskflow-full-closure-2026-09-27
    paths:
      - .github/workflows/automation-taskflow-qualification-repair.yml

permissions:
  contents: write

concurrency:
  group: automation-taskflow-qualification-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact work branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-full-closure-2026-09-27
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt

      - name: Apply qualification repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              body = path.read_text(encoding="utf-8")
              count = body.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one repair anchor, found {count}")
              path.write_text(body.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "codex-rs/hepta-agentd/src/automation_service_tests.rs",
              "use codex_hepta_automation::AutomationQueueReceipt;\n",
              "use codex_hepta_automation::AutomationQueueReceipt;\nuse codex_hepta_automation::AutomationRuntimePolicyV1;\n",
          )
          replace_once(
              "codex-rs/hepta-agentd/src/automation_service_tests.rs",
              """    let mut task = tokio::spawn(run_scheduler_loop(
                  scheduler,
                  Arc::clone(&fixture.state),
                  stop.clone(),
                  Duration::from_millis(1),
              ));""",
              """    let mut task = tokio::spawn(run_scheduler_loop(
                  scheduler,
                  Arc::clone(&fixture.state),
                  stop.clone(),
                  Duration::from_millis(1),
                  AutomationRuntimePolicyV1::default(),
              ));""",
          )

          replace_once(
              "codex-rs/hepta-operations/Cargo.toml",
              """codex-hepta-contracts = { workspace = true }
codex-hepta-types = { workspace = true }
sqlx = { workspace = true }
""",
              """codex-hepta-contracts = { workspace = true }
codex-hepta-types = { workspace = true }
codex-state = { workspace = true }
codex-utils-absolute-path = { workspace = true }
sqlx = { workspace = true }
""",
          )

          for source, label in (
              ("codex-rs/hepta-operations/src/destination_dedupe.rs", "destination dedupe path"),
              ("codex-rs/hepta-operations/src/durable_store.rs", "operation store path"),
          ):
              replace_once(source, "use std::time::Duration;\n", "")
              replace_once(
                  source,
                  """use sqlx::sqlite::SqliteConnectOptions;
use sqlx::sqlite::SqliteJournalMode;
use sqlx::sqlite::SqlitePoolOptions;
use sqlx::sqlite::SqliteSynchronous;
""",
                  """use codex_state::SqliteConfig;
use codex_utils_absolute_path::AbsolutePathBuf;
""",
              )
              old = """        let options = SqliteConnectOptions::new()
              .filename(path)
              .create_if_missing(true)
              .journal_mode(SqliteJournalMode::Wal)
              .synchronous(SqliteSynchronous::Full)
              .foreign_keys(true)
              .busy_timeout(Duration::from_secs(5));
          let pool = SqlitePoolOptions::new()
              .max_connections(4)
              .connect_with(options)
              .await
              .map_err(sqlx_error)?;"""
              new = f"""        let parent = path
              .parent()
              .ok_or(DurableOperationError::Invalid(\"{label}\"))?;
          let sqlite_home = parent
              .canonicalize()
              .map_err(|error| DurableOperationError::Unavailable(error.to_string()))?;
          let sqlite_home = AbsolutePathBuf::try_from(sqlite_home)
              .map_err(|_| DurableOperationError::Invalid(\"{label}\"))?;
          let pool = SqliteConfig::from_sqlite_home(sqlite_home)
              .open_durable_evidence_pool(path)
              .await
              .map_err(sqlx_error)?;"""
              replace_once(source, old, new)

          replace_once(
              "codex-rs/hepta-operations/src/durable_store.rs",
              """        if let Some(status) = load_outbox_tx(
              &mut tx,
              &operation.intent.destination,
              scope_id,
              operation_id,
          )
          .await?
          {
              if status.state != DurableOutboxState::Acknowledged {
                  let fence = status
                      .fence
                      .checked_add(1)
                      .ok_or(DurableOperationError::Capacity)?;
                  sqlx::query(
                      \"UPDATE cross_owner_outbox SET state = 'acked', fence = ?, worker_id = NULL,
                       lease_until_ms = NULL, acknowledgement_digest = ?, updated_at_ms = ?,
                       terminal_at_ms = COALESCE(terminal_at_ms, ?)
                       WHERE destination = ? AND scope_id = ? AND operation_id = ?\",
                  )
                  .bind(to_i64(fence)?)
                  .bind(receipt.evidence_digest.as_array().as_slice())
                  .bind(now)
                  .bind(now)
                  .bind(operation.intent.destination.as_str())
                  .bind(scope_id.as_str())
                  .bind(operation_id.as_str())
                  .execute(&mut *tx)
                  .await
                  .map_err(sqlx_error)?;
              }
          }
""",
              """        if let Some(status) = load_outbox_tx(
              &mut tx,
              &operation.intent.destination,
              scope_id,
              operation_id,
          )
          .await?
              && status.state != DurableOutboxState::Acknowledged
          {
              let fence = status
                  .fence
                  .checked_add(1)
                  .ok_or(DurableOperationError::Capacity)?;
              sqlx::query(
                  \"UPDATE cross_owner_outbox SET state = 'acked', fence = ?, worker_id = NULL,
                   lease_until_ms = NULL, acknowledgement_digest = ?, updated_at_ms = ?,
                   terminal_at_ms = COALESCE(terminal_at_ms, ?)
                   WHERE destination = ? AND scope_id = ? AND operation_id = ?\",
              )
              .bind(to_i64(fence)?)
              .bind(receipt.evidence_digest.as_array().as_slice())
              .bind(now)
              .bind(now)
              .bind(operation.intent.destination.as_str())
              .bind(scope_id.as_str())
              .bind(operation_id.as_str())
              .execute(&mut *tx)
              .await
              .map_err(sqlx_error)?;
          }
""",
          )

          replace_once(
              "docs/modules/automation.taskflow/TECHNICAL.md",
              "### 4.4 External-effect product path\n",
              """### 4.4 Durable choice, checkpoint and effect ordering

A DecisionCell choice and its exact runtime profile are recorded before an organ,
wait boundary or external-effect intent may advance. Checkpoint publication
precedes provider contact. A wait resumes from the recorded choice rather than
re-evaluating a changed policy, and an effect crosses only the existing
final-use-authorized seam. An unknown provider outcome remains reconciliation
work; neither lease expiry nor host replacement authorizes blind redispatch.

### 4.5 External-effect product path
""",
          )
          replace_once(
              "docs/modules/automation.taskflow/TECHNICAL.md",
              "### 4.5 Design records and failure semantics\n",
              "### 4.6 Design records and failure semantics\n",
          )
          PY

      - name: Format repaired Rust owners
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd

      - name: Check repaired owners and tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd --all-targets
          cargo clippy -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd --all-targets --all-features -- -D warnings
          cargo test -p codex-hepta-operations
          cargo test -p codex-hepta-automation
          cargo test -p codex-hepta-agentd --lib

      - name: Commit repaired source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "hepta-automation-ci"
          git config user.email "hepta-automation-ci@users.noreply.github.com"
          git add \
            codex-rs/hepta-agentd/src/automation_service_tests.rs \
            codex-rs/hepta-operations/Cargo.toml \
            codex-rs/hepta-operations/src/destination_dedupe.rs \
            codex-rs/hepta-operations/src/durable_store.rs \
            docs/modules/automation.taskflow/TECHNICAL.md
          git commit -m "fix(automation): close qualification regressions"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Rebind implementation truth and verify contracts
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module automation.taskflow
          python3 scripts/automation_taskflow_fact_sync.py map
          python3 scripts/hepta-implementation-maps.py migrate --module automation.taskflow
          python3 scripts/automation_taskflow_contract.py verify
          python3 -m unittest -v \
            scripts/test_automation_taskflow_contract.py \
            scripts/test_verify_automation_taskflow_acceptance.py
          python3 scripts/hepta-gap-closure.py verify
          git diff --check
          git add docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(automation): rebind repaired source truth"
          fi
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$SOURCE_SHA" \
            --expected-tree "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push repaired branch
        env:
          TARGET_BRANCH: work/automation-taskflow-full-closure-2026-09-27
        run: git push origin "HEAD:${TARGET_BRANCH}"
