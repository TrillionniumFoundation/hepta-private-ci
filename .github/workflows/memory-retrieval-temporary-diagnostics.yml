name: Memory retrieval temporary diagnostics

on:
  push:
    branches:
      - work/memory-retrieval-production-convergence-20260926
    paths:
      - .github/workflows/memory-retrieval-temporary-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: memory-retrieval-temporary-diagnostics
  cancel-in-progress: true

jobs:
  core-diagnostics:
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Capture focused test diagnostics
        working-directory: codex-rs
        run: |
          set +e
          cargo test --locked -p codex-hepta-memory-retrieval --lib -- --nocapture > "$RUNNER_TEMP/core.log" 2>&1
          status=$?
          set -e
          mkdir -p ../qualification/memory-retrieval/diagnostics
          report="../qualification/memory-retrieval/diagnostics/core-${GITHUB_SHA}.txt"
          {
            printf 'source_sha=%s\nexit_status=%s\n\n' "$GITHUB_SHA" "$status"
            printf '%s\n' '=== matched diagnostics ==='
            grep -nE '(^error(\[|:)|FAILED|panicked at|failures:|test result:)' "$RUNNER_TEMP/core.log" || true
            printf '\n%s\n' '=== final 500 lines ==='
            tail -n 500 "$RUNNER_TEMP/core.log"
          } > "$report"
          test -s "$report"

      - name: Commit diagnostic receipt
        run: |
          set -euo pipefail
          git config user.name "hepta-convergence-bot"
          git config user.email "hepta-convergence-bot@users.noreply.github.com"
          git add qualification/memory-retrieval/diagnostics
          git commit -m "chore(memory.retrieval): capture temporary core diagnostics"
          git push origin HEAD:work/memory-retrieval-production-convergence-20260926
