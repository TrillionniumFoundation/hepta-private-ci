name: hepta maintained lint lock qualification

on:
  pull_request:
    paths:
      - .github/workflows/hepta-dylint-lock-qualification.yml
      - .github/workflows/rust-ci.yml
      - .github/workflows/rust-ci-full.yml
      - .github/workflows/rust-release-argument-comment-lint.yml
      - tools/argument-comment-lint/**
      - qualification/dylint-20261103/**
      - MODULE.bazel
      - MODULE.bazel.lock

permissions:
  contents: read

concurrency:
  group: dylint-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  original-lock:
    if: github.head_ref == 'fix/private-ci-maintained-dylint-20261103-gpt6'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: maintained-lint-lock
      - name: Check the committed lock and require identical original regeneration
        run: python3 qualification/dylint-20261103/run_lock.py --require-committed --output "$RUNNER_TEMP/dylint-lock"
      - name: Retain complete original commands and generated lock bytes
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dylint-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dylint-lock
          if-no-files-found: error
          retention-days: 7
