# Codespell configuration is within .codespellrc
---
name: Codespell

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codespell:
    timeout-minutes: 30
    name: Check for spelling errors
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@b80729f885d32f78a716c2f107b4db1025001c42 # v1.1.0
      - name: Codespell
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          ignore_words_file: .codespellignore
          # This action passes --skip explicitly, overriding .codespellrc's
          # skip setting. Keep the immutable upstream COCO caption sample
          # byte-identical and exclude only that sample, not product sources.
          skip: ./.git,./qa/stem-bakeoff/coco_caption_sample_v1.json

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
