name: Hepta verified blocker plan aggregator R5

on:
  push:
    branches:
      - codex/hepta-v8-windows-bazel-diagnostics-r3-20260907

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: hepta-exact-head-blocker-autofix-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate:
    if: ${{ !contains(github.event.head_commit.message, '[hepta-r5]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize to current authoritative branch head
        env:
          HEAD_BRANCH: codex/hepta-v8-windows-bazel-diagnostics-r3-20260907
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-plan-aggregator"
          git config user.email "hepta-plan-aggregator@users.noreply.github.com"
          git fetch origin "${HEAD_BRANCH}" --no-tags
          git checkout -B "${HEAD_BRANCH}" "origin/${HEAD_BRANCH}"

      - name: Import verified non-duplicate blocker commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          import_commit() {
            local commit="$1"
            git fetch origin "${commit}" --no-tags
            if git merge-base --is-ancestor "${commit}" HEAD; then
              echo "Already present: ${commit}"
              return 0
            fi
            if git cherry-pick "${commit}"; then
              echo "Imported: ${commit}"
            else
              git cherry-pick --abort
              echo "Verified commit conflicts with current exact head: ${commit}" >&2
              return 1
            fi
          }

          # The prior R2 change is the reviewed MSRV-safe argument-comment fix.
          import_commit 07ead9f7c3b3f1fc7682355dfd315def810df44b

          # Import only patch-unique commits from the two previously reviewed
          # blocker PRs. Patch-equivalent commits are deliberately skipped.
          for pr in 445 446; do
            mapfile -t commits < <(gh pr view "${pr}" --json commits --jq '.commits[].oid')
            for commit in "${commits[@]}"; do
              if git merge-base --is-ancestor "${commit}" HEAD; then
                continue
              fi
              git fetch origin "${commit}" --no-tags
              patch_state="$(git cherry HEAD "${commit}^..${commit}" 2>/dev/null | awk '{print $1}' | head -n1 || true)"
              if [[ "${patch_state}" == "-" ]]; then
                echo "Patch-equivalent commit already present: ${commit}"
                continue
              fi
              import_commit "${commit}"
            done
          done

      - name: Apply exact-target emitted source patches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hepta-diagnostics-r5
          mkdir -p .hepta-diagnostics-r5
          gh run download 34069442891 --dir .hepta-diagnostics-r5 || true
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import subprocess

          root = pathlib.Path('.hepta-diagnostics-r5')
          candidates = sorted(root.rglob('final-worktree.diff'))
          if not candidates:
              candidates = sorted(root.rglob('*.git-diff.patch'))
          forbidden_prefixes = ('.github/', '.git/', 'third_party/', 'vendor/')
          forbidden_exact = {'MODULE.bazel.lock', 'pnpm-lock.yaml', 'Cargo.lock'}
          seen: set[bytes] = set()

          for patch in candidates:
              data = patch.read_bytes()
              if not data.strip() or data in seen:
                  continue
              seen.add(data)
              check = subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', str(patch)])
              if check.returncode != 0:
                  continue
              numstat = subprocess.run(
                  ['git', 'apply', '--numstat', str(patch)],
                  check=True, capture_output=True, text=True,
              ).stdout.splitlines()
              paths = [line.split('\t', 2)[2] for line in numstat if len(line.split('\t', 2)) == 3]
              if not paths:
                  continue
              if any(path in forbidden_exact or path.startswith(forbidden_prefixes) for path in paths):
                  raise SystemExit(f'Refusing unsafe emitted patch {patch}: {paths}')
              subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', str(patch)], check=True)
              print(f'Applied {patch}: {paths}')
          PY
          rm -rf .hepta-diagnostics-r5

      - name: Run deterministic machine-safe source fixes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f codex-rs/Cargo.toml ]]; then
            cargo fmt --manifest-path codex-rs/Cargo.toml --all
            (
              cd codex-rs
              cargo clippy --fix \
                --workspace --all-targets --all-features \
                --allow-dirty --allow-staged --ignore-rust-version \
                -- -D warnings
            ) || echo "Host-only Clippy fix stopped after retaining emitted fixes" >&2
            cargo fmt --manifest-path codex-rs/Cargo.toml --all
          fi

          if [[ -f tools/argument-comment-lint/run-prebuilt-linter.py ]]; then
            help_text="$(python tools/argument-comment-lint/run-prebuilt-linter.py --help 2>&1 || true)"
            if grep -q -- '--fix' <<<"${help_text}"; then
              python tools/argument-comment-lint/run-prebuilt-linter.py --fix
            fi
          fi

      - name: Remove all one-shot machinery and enforce a clean net diff
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hepta-diagnostics-r4 .hepta-diagnostics-r5
          git rm -f --ignore-unmatch \
            .github/workflows/hepta-windows-bazel-target-diagnostics-r3.yml \
            .github/workflows/hepta-blocker-autofix-r4.yml \
            .github/workflows/hepta-blocker-autofix-cleanup-r4.yml \
            .github/workflows/hepta-blocker-finalize-r4.yml \
            .github/workflows/hepta-plan-aggregator-r5.yml
          git add -A
          git diff --cached --check

          changed="$(git diff --cached --name-only)"
          if grep -Eq '(^|/)(CODEOWNERS|branch-protection|ruleset)|^\.github/workflows/bazel\.yml$' <<<"${changed}"; then
            echo "Refusing policy or canonical test-matrix weakening" >&2
            exit 1
          fi
          if git diff --cached | grep -Eq -- 'test_tag_filters=.*-[^ ]+|^[+].*(allow\(warnings\)|-A warnings)'; then
            echo "Refusing a test exclusion or warning downgrade" >&2
            exit 1
          fi

          if ! git diff --cached --quiet; then
            git commit -m "fix: aggregate verified exact-head blocker corrections [hepta-r5]"
          elif git log -1 --pretty=%s | grep -q '\[hepta-r5\]'; then
            echo "Clean head already finalized"
          else
            git commit --allow-empty -m "chore: finalize verified exact-head blocker set [hepta-r5]"
          fi
          git push origin HEAD:codex/hepta-v8-windows-bazel-diagnostics-r3-20260907

          git fetch origin "${BASE_BRANCH}" --no-tags
          if git diff --quiet "origin/${BASE_BRANCH}...HEAD"; then
            echo "No net source delta remains; nothing to merge."
            exit 0
          fi
          if git diff --name-only "origin/${BASE_BRANCH}...HEAD" | grep -F 'hepta-plan-aggregator-r5.yml'; then
            echo "One-shot workflow leaked into final diff" >&2
            exit 1
          fi

      - name: Create or update clean closure PR and enable protected auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_BRANCH: codex/hepta-v8-windows-bazel-diagnostics-r3-20260907
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --state open --head "${HEAD_BRANCH}" --json url --jq '.[0].url // empty')"
          if [[ -z "${pr_url}" ]]; then
            pr_url="$(gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${HEAD_BRANCH}" \
              --title "fix: close remaining exact-head CI blockers" \
              --body $'## Scope\n\nAggregates the previously reviewed blocker commits and deterministic source fixes from exact-target diagnostics.\n\n## Merge invariant\n\nAuto-merge remains subject to every configured required check on the latest PR head. No protection, lint level, or test target is weakened.\n')"
          fi
          gh pr merge "${pr_url}" --auto --squash --delete-branch
          echo "Protected auto-merge armed for ${pr_url}"
