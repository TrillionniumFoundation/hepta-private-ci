name: Lane F verified-only finalization

on:
  push:
    branches: [codex/lane-f-gap-closure-20260910]
    paths: [.github/workflows/lane-f-finalize-20260910.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: lane-f-finalize-${{ github.ref }}
  cancel-in-progress: false

env:
  VERIFIED_BRANCH: codex/lane-f-gap-closure-verified-20260910
  BASE_BRANCH: integration/vnext-main-20260811

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize immutable bootstrap payload when present
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.lane-f-bootstrap/part-*' >/dev/null; then
            cat .lane-f-bootstrap/part-* > /tmp/lane-f-overlay.tar.gz
            echo 'a5743f201c82118e390fff7128f9304ccae82f1c33fdc2d41c7349d7a266d2bc  /tmp/lane-f-overlay.tar.gz' | sha256sum -c -
            tar -xzf /tmp/lane-f-overlay.tar.gz -C .
          fi

      - name: Normalize explicit Prompt Optimizer profile boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/hepta-prompt-optimizer/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'pub mod local_shadow;\n'
          addition = '''pub mod local_shadow;
pub use local_shadow::calculate_local_shadow as calculate_shadow_portfolio_v2;

/// Stable identity for the compatibility-only original portfolio API.
pub const PROMPT_PORTFOLIO_LEGACY_V1_PROFILE: &str =
    "hepta.prompt-portfolio.legacy-v1";
/// Stable identity for the bounded interaction-aware shadow API.
pub const PROMPT_PORTFOLIO_SHADOW_V2_PROFILE: &str =
    "hepta.prompt-portfolio.shadow-v2";
'''
          if 'PROMPT_PORTFOLIO_SHADOW_V2_PROFILE' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('unexpected prompt optimizer module marker')
              text = text.replace(marker, addition, 1)
          legacy = 'pub fn optimize(mut request: OptimizationRequest)'
          if 'Compatibility-only legacy V1 optimizer' not in text:
              if text.count(legacy) != 1:
                  raise SystemExit('unexpected legacy optimizer marker')
              text = text.replace(
                  legacy,
                  '/// Compatibility-only legacy V1 optimizer. New shadow composition uses '
                  '[`calculate_shadow_portfolio_v2`].\n' + legacy,
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Generate canonical Lane F truth and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/hepta-lane-f.py
          test -f scripts/test_hepta_lane_f.py
          python3 scripts/hepta-lane-f.py generate
          python3 scripts/hepta_module_doc_metadata.py --write
          python3 scripts/hepta-docs.py generate-status
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-intelligence
          (cd codex-rs && cargo test -p codex-hepta-intelligence --all-targets --no-run)

      - name: Build ordinary candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lane-f-bootstrap
          rm -f \
            .github/workflows/lane-f-bootstrap.yml \
            .github/workflows/lane-f-resume.yml \
            .github/workflows/lane-f-resume-20260910.yml \
            .github/workflows/lane-f-finalize-20260910.yml
          git config user.name hepta-lane-f-bot
          git config user.email hepta-lane-f-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat(lane-f): close adaptive-policy source and documentation gaps'
          fi
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate generated Lane F closed world
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.candidate.outputs.sha }}'
          python3 scripts/hepta-lane-f.py self-test
          python3 -m unittest scripts/test_hepta_lane_f.py
          python3 scripts/hepta-lane-f.py generate --check
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-lane-f.py verify
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Validate canonical document and registry systems
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Validate all Lane F native crates
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-neuron --all-targets
          cargo test --locked -p codex-hepta-intuition --all-targets
          cargo test --locked -p codex-hepta-prompt-optimizer --all-targets
          cargo test --locked -p codex-hepta-plasticity --all-targets
          cargo test --locked -p codex-hepta-intelligence --all-targets
          cargo clippy --locked \
            -p codex-hepta-neuron \
            -p codex-hepta-intuition \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-plasticity \
            -p codex-hepta-intelligence \
            --all-targets -- -D warnings
          cargo fmt \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-intelligence \
            -- --check

      - name: Validate deterministic synthetic merge against current base
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          BASE_SHA="$(git rev-parse "origin/$BASE_BRANCH")"
          SOURCE_SHA="$(git rev-parse HEAD)"
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME='Hepta Lane F CI'
          export GIT_AUTHOR_EMAIL='hepta-lane-f-ci@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          MERGE_SHA="$(printf 'Synthetic Lane F verification merge\n' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          printf 'base_sha=%s\nsource_sha=%s\nmerge_sha=%s\ntree=%s\n' "$BASE_SHA" "$SOURCE_SHA" "$MERGE_SHA" "$TREE" >> "$GITHUB_OUTPUT"
          git checkout --detach "$MERGE_SHA"
          python3 scripts/hepta-lane-f.py generate --check
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-lane-f.py verify
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          (cd codex-rs && cargo test --locked -p codex-hepta-neuron --all-targets && cargo test --locked -p codex-hepta-intuition --all-targets && cargo test --locked -p codex-hepta-prompt-optimizer --all-targets && cargo test --locked -p codex-hepta-plasticity --all-targets && cargo test --locked -p codex-hepta-intelligence --all-targets && cargo clippy --locked -p codex-hepta-neuron -p codex-hepta-intuition -p codex-hepta-prompt-optimizer -p codex-hepta-plasticity -p codex-hepta-intelligence --all-targets -- -D warnings)
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Write immutable verification receipt and revalidate receipt commit
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          git checkout '${{ steps.candidate.outputs.sha }}'
          mkdir -p qualification/lane-f
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'schema': 'hepta.lane-f-verification-receipt.v1',
              'sourceSha': os.environ['SOURCE_SHA'],
              'baseSha': os.environ['BASE_SHA'],
              'syntheticMergeSha': os.environ['MERGE_SHA'],
              'syntheticMergeTree': os.environ['MERGE_TREE'],
              'checks': {
                  'generatedTruthParity': 'pass',
                  'moduleDocumentation': 'pass',
                  'readiness': 'pass',
                  'implementationDossiers': 'pass',
                  'technicalClosure': 'pass',
                  'algorithmDocumentation': 'pass',
                  'cns': 'pass',
                  'hnmf': 'pass',
                  'neuron': 'pass',
                  'intuition': 'pass',
                  'promptOptimizer': 'pass',
                  'plasticity': 'pass',
                  'intelligenceControl': 'pass',
                  'strictClippy': 'pass',
                  'format': 'pass',
                  'syntheticMerge': 'pass'
              },
              'capabilityBoundary': {
                  'productionAuthorityGranted': False,
                  'independentAcceptance': False,
                  'operatorAcceptance': False,
                  'productionCanary': False,
                  'selection': False,
                  'promotion': False,
                  'release': False
              }
          }
          Path('qualification/lane-f/VERIFICATION_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git add qualification/lane-f/VERIFICATION_RECEIPT.json
          git commit -m 'test(lane-f): bind exact closure verification receipt'
          python3 scripts/hepta-lane-f.py generate --check
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-lane-f.py verify
          python3 scripts/hepta-module-docs.py verify
          git diff --check
          test -z "$(git status --porcelain)"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_SHA: ${{ steps.merge.outputs.source_sha }}
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          MERGE_TREE: ${{ steps.merge.outputs.tree }}

      - name: Publish verified branch and open/update PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.receipt.outputs.sha }}'
          test -z "$(git status --porcelain)"
          git push --force-with-lease origin "HEAD:$VERIFIED_BRANCH"
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$VERIFIED_BRANCH" --json number --jq 'length' | grep -qx 0; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$VERIFIED_BRANCH" \
              --title 'feat(lane-f): close adaptive-policy source and documentation gaps' \
              --body $'## Scope\n\nCloses the repository-internal Lane F adaptive-policy gaps in dependency order: generated documentation truth, maturity and native bindings, explicit profile boundaries, durable proposal semantics, intelligence composition, cross-module shadow vertical, exact-head tests and synthetic-merge qualification.\n\n## Capability boundary\n\nThis PR grants no production/model/provider/tool/effect authority and does not self-certify independent evaluation, operator acceptance, canary, selection, promotion or release. Those remain separate external gates.\n\n## Merge rule\n\nRequire all checks plus one independent approving reviewer; the generating workflow must not self-merge.'
          fi
