name: Hepta Merton separate news replication (DENY_ALL)
on:
  pull_request:
    paths:
      - 'experiments/ndu_tree_fbsde_gates/merton/real_head/replication_news/**'
      - '.github/workflows/hepta-ndu-merton-news.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archival-replication:
    strategy:
      fail-fast: false
      matrix:
        candidate: [source, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate == 'source' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numeric dependency and record exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.5
          mkdir -p "$RUNNER_TEMP/news-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/news-evidence/source.txt"
          python --version >> "$RUNNER_TEMP/news-evidence/source.txt"
          python -m pip freeze >> "$RUNNER_TEMP/news-evidence/source.txt"
          D=experiments/ndu_tree_fbsde_gates/merton/real_head/replication_news
          echo "5578624257ef38a25c12a1dffa24d861a92de5cdd8fef193029c689f20e67a2c  $D/protocol.json" | sha256sum -c -
      - name: Acquire exact original frozen features, not a new model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'news-original.zip'
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/11870475540/zip"
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=120) as response:
              data=response.read(2000000)
          if hashlib.sha256(data).hexdigest()!='195dfb9e5bedaf5cee7fe8b2994a10f7ebaaf9ecca2a3a94bb77b0185a4337a7':
              raise ValueError('missing, expired, oversized or changed original archive')
          with out.open('xb') as f:f.write(data)
          PY
      - name: Original-source tests, physical training and independent scoring
        shell: bash
        run: |
          set -euo pipefail
          D=experiments/ndu_tree_fbsde_gates/merton/real_head/replication_news
          E="$RUNNER_TEMP/news-evidence"
          export NEWS_ARCHIVE="$RUNNER_TEMP/news-original.zip"
          python "$D/material_news.py" --archive "$NEWS_ARCHIVE" --output "$RUNNER_TEMP/news-material"
          for mode in normal optimized; do
            FLAGS=(); if test "$mode" = optimized; then FLAGS=(-O); fi
            python "${FLAGS[@]}" -W error::ResourceWarning -m unittest discover -s "$D" -p test_news.py -v 2>&1 | tee "$E/tests-$mode.log"
            grep -F 'Ran 41 tests' "$E/tests-$mode.log"
            python "${FLAGS[@]}" "$D/trial_news.py" --material "$RUNNER_TEMP/news-material" --output "$E/run-$mode"
            python "${FLAGS[@]}" "$D/audit_news.py" --archive "$NEWS_ARCHIVE" --material "$RUNNER_TEMP/news-material" --run "$E/run-$mode" --output "$E/audit-$mode.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'news-evidence'
          records=[json.loads((root/f'run-{mode}/sealed.json').read_text()) for mode in ('normal','optimized')]
          keys=('repeat','arm','selected_steps','actual_steps','weights','checkpoints','losses','calibration_blocks','preference_trace','selection_values','holdout_ids','probabilities')
          def semantic(r):
              if len(r['rows'])!=27:raise ValueError('incomplete experiment')
              return [{k:row[k] for k in keys} for row in r['rows']]
          if semantic(records[0])!=semantic(records[1]):raise ValueError('interpreter semantic drift')
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merton-news-${{ matrix.candidate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/news-evidence/
          retention-days: 14
          if-no-files-found: error
