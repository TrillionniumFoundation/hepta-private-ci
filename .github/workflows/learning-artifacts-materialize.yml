name: Materialize learning.artifacts candidate

on:
  push:
    branches:
      - scratch/learning-artifacts-materialize-20260930-r5

permissions:
  contents: read

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Generate lock, format package, and compile
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/learning-artifacts-materialized"
          mkdir -p "$out/source"
          set +e
          cargo check --manifest-path codex-rs/Cargo.toml -p codex-hepta-learning-artifacts --all-targets >"$out/check.stdout" 2>"$out/check.stderr"
          check_status=$?
          set -e
          printf '%s\n' "$check_status" >"$out/check.exit"
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-learning-artifacts
          cp codex-rs/Cargo.lock "$out/Cargo.lock"
          cp -R codex-rs/hepta-learning-artifacts/src "$out/source/"
          git diff --binary -- codex-rs/Cargo.lock codex-rs/hepta-learning-artifacts/src >"$out/materialized.patch"
          shasum -a 256 "$out/Cargo.lock" "$out/materialized.patch" >"$out/SHA256SUMS"
      - name: Upload materialized candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-artifacts-materialized-${{ github.sha }}
          path: ${{ runner.temp }}/learning-artifacts-materialized
          if-no-files-found: error
          retention-days: 7
