name: Lane F overlay object provenance

on:
  push:
    branches:
      - codex/lane-f-gap-closure-20260910
    paths:
      - .github/workflows/lane-f-object-provenance-20260910.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Export every reachable candidate blob for Lane F overlay paths
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lane-f-provenance"
          mkdir -p "$out/blobs"
          OUT="$out" python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          OUT = Path(os.environ["OUT"])
          PATHS = (
              ".github/workflows/hepta-lane-f-gap-closure.yml",
              ".github/workflows/hepta-lane-f-shadow-qualification.yml",
              "codex-rs/hepta-intelligence/Cargo.toml",
              "codex-rs/hepta-intelligence/src/lib.rs",
              "codex-rs/hepta-intelligence/src/pipeline.rs",
              "codex-rs/hepta-intelligence/src/pipeline_tests.rs",
              "codex-rs/hepta-intelligence/tests/lane_f_shadow_vertical.rs",
              "codex-rs/hepta-intuition/src/calibrated.rs",
              "codex-rs/hepta-intuition/src/calibrated_tests.rs",
              "codex-rs/hepta-intuition/src/lib.rs",
              "codex-rs/hepta-plasticity/src/durable_registry.rs",
              "codex-rs/hepta-plasticity/src/durable_registry_tests.rs",
              "codex-rs/hepta-plasticity/src/lib.rs",
              "codex-rs/hepta-prompt-optimizer/src/lib.rs",
              "docs/lanes/LANE_F_ADAPTIVE_POLICY.json",
              "docs/lanes/LANE_F_ADAPTIVE_POLICY.md",
              "docs/lanes/LANE_F_STATUS.md",
              "docs/lanes/README.md",
              "docs/modules/MODULE_DOCS.json",
              "docs/modules/intelligence.control/TECHNICAL.md",
              "docs/modules/intuition.policy/TECHNICAL.md",
              "docs/modules/learning.plasticity/TECHNICAL.md",
              "docs/modules/neuron.runtime/TECHNICAL.md",
              "docs/modules/prompt.optimizer/TECHNICAL.md",
              "docs/security/THREAT_MODEL.json",
              "qualification/lane-f-shadow/README.md",
              "qualification/lane-f-shadow/src/lib.rs",
              "qualification/module-execution-dossiers/DETAILS.json",
              "qualification/module-execution-dossiers/detail/intelligence.control.md",
              "qualification/module-execution-dossiers/detail/intuition.policy.md",
              "qualification/module-execution-dossiers/detail/learning.plasticity.md",
              "qualification/module-execution-dossiers/detail/neuron.runtime.md",
              "qualification/module-execution-dossiers/detail/prompt.optimizer.md",
              "scripts/hepta-lane-f.py",
              "scripts/hepta_module_doc_metadata.py",
              "scripts/test_hepta_lane_f.py",
          )

          def run(*args: str, check: bool = True) -> bytes:
              completed = subprocess.run(
                  args,
                  check=check,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              return completed.stdout

          report: dict[str, object] = {
              "schema": "hepta.lane-f-object-provenance.v2",
              "head": run("git", "rev-parse", "HEAD").decode().strip(),
              "paths": {},
          }
          for path in PATHS:
              commits = run(
                  "git", "log", "--all", "--format=%H", "--", path,
                  check=False,
              ).decode().splitlines()
              commits.extend(("HEAD", "origin/integration/vnext-main-20260811"))
              seen_commits: set[str] = set()
              blobs: dict[str, dict[str, object]] = {}
              for commit in commits:
                  try:
                      resolved = run("git", "rev-parse", commit).decode().strip()
                  except subprocess.CalledProcessError:
                      continue
                  if resolved in seen_commits:
                      continue
                  seen_commits.add(resolved)
                  row = run("git", "ls-tree", resolved, "--", path, check=False).decode().strip()
                  if not row:
                      continue
                  fields = row.split(None, 3)
                  if len(fields) != 4 or fields[1] != "blob":
                      continue
                  blob = fields[2]
                  blobs.setdefault(blob, {"commits": []})["commits"].append(resolved)

              for blob, entry in blobs.items():
                  payload = run("git", "cat-file", "blob", blob)
                  destination = OUT / "blobs" / blob
                  destination.write_bytes(payload)
                  entry.update(
                      size=len(payload),
                      sha256=hashlib.sha256(payload).hexdigest(),
                      artifact=f"blobs/{blob}",
                  )
              report["paths"][path] = {
                  "historyCommitCount": len(seen_commits),
                  "blobs": blobs,
              }
              print(f"PROVENANCE path={path} commits={len(seen_commits)} blobs={len(blobs)}")
              for blob, entry in blobs.items():
                  preview=','.join(entry['commits'][:3])
                  print(
                      f"BLOB path={path} blob={blob} size={entry['size']} "
                      f"sha256={entry['sha256']} commits={preview}"
                  )

          (OUT / "PROVENANCE.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload provenance map and candidate blobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-f-object-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/lane-f-provenance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
