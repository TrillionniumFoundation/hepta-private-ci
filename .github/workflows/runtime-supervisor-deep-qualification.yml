name: runtime.supervisor deep qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-supervisor/**"
      - "docs/modules/runtime.supervisor/**"
      - "qualification/runtime-supervisor/**"
      - ".github/workflows/runtime-supervisor-deep-qualification.yml"
  push:
    branches:
      - codex/runtime-supervisor-full-qualification-20260930
    paths:
      - "codex-rs/hepta-supervisor/**"
      - "docs/modules/runtime.supervisor/**"
      - "qualification/runtime-supervisor/**"
      - ".github/workflows/runtime-supervisor-deep-qualification.yml"

permissions:
  contents: read

concurrency:
  group: runtime-supervisor-deep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  deep-qualification:
    name: deep-qualification (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct exact prospective merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Supervisor CI
          author-email: hepta-supervisor-ci@users.noreply.github.com
          message: Synthetic runtime.supervisor qualification merge
      - name: Bind exact tested candidate
        env:
          CANDIDATE: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          printf 'TESTED_SHA=%s\n' "$CANDIDATE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/runtime-supervisor"
          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'base_sha=%s\n' "$BASE_SHA"
            printf 'tested_sha=%s\n' "$CANDIDATE"
            printf 'tested_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'parents=%s\n' "$(git show -s --format=%P HEAD)"
            printf 'lane=%s\n' "${{ matrix.lane }}"
          } > "$RUNNER_TEMP/runtime-supervisor/identity.txt"
          git diff --check
      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Check formatting and clean diff
        run: |
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-supervisor -- --check
          git diff --check
      - name: Default library regression
        run: cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-supervisor --lib
      - name: Qualification library durability matrix
        run: >-
          cargo test --manifest-path codex-rs/Cargo.toml --locked
          -p codex-hepta-supervisor --features qualification --lib
      - name: Offline authority build and distribution tests
        run: >-
          cargo test --manifest-path codex-rs/Cargo.toml --locked
          -p codex-hepta-supervisor --features offline-authority-tools
          --test authority_distribution -- --nocapture
      - name: 256-Agent HOL and fault qualification
        run: |
          set -o pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-supervisor --features qualification \
            --test supervisor_hol_qualification -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/runtime-supervisor/hol-256.log"
      - name: Actual SIGKILL crash qualification
        run: |
          set -o pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-supervisor --features qualification \
            --test sigkill_crash_matrix -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/runtime-supervisor/sigkill.log"
      - name: Strict supervisor lint
        run: |
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-supervisor --all-targets --features qualification,offline-authority-tools \
            -- -D warnings
      - name: Assert exact candidate stayed clean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload exact-candidate qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-supervisor-deep-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/runtime-supervisor/
          if-no-files-found: error
          retention-days: 30
