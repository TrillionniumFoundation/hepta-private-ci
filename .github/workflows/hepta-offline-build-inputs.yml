name: Hepta offline native build inputs

on:
  push:
    branches: [ops/kg-offline-inputs-20260927]
    paths: [.github/workflows/hepta-offline-build-inputs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-offline-build-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inputs:
    if: github.ref == 'refs/heads/ops/kg-offline-inputs-20260927'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      SOURCE_SHA: 259dbfa5f6701e23b5f2515ee2c6c2da018c2c75
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Export exact input source and credential-free Git objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-source-inputs"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git archive --format=tar.gz --output="$RUNNER_TEMP/kg-source-inputs/source.tar.gz" HEAD
          git bundle create "$RUNNER_TEMP/kg-source-inputs/source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/kg-source-inputs/source.bundle"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/kg-source-inputs/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/kg-source-inputs/source-tree.txt"
          cd "$RUNNER_TEMP/kg-source-inputs"
          sha256sum source.tar.gz source.bundle > SHA256SUMS

      - name: Preserve source before compiler or dependency resolution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-offline-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/kg-source-inputs
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Export pinned x86 compiler for offline verification
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0-x86_64-unknown-linux-gnu --force-non-host \
            --profile minimal --component rustfmt --component clippy
          mkdir -p "$RUNNER_TEMP/kg-compiler-inputs"
          tar -C "$HOME/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu" \
            -czf "$RUNNER_TEMP/kg-compiler-inputs/compiler.tar.gz" .
          cd "$RUNNER_TEMP/kg-compiler-inputs"
          sha256sum compiler.tar.gz > SHA256SUMS

      - name: Preserve pinned compiler independently
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-offline-compiler-1.95.0-${{ github.run_id }}
          path: ${{ runner.temp }}/kg-compiler-inputs
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Resolve and retain exact locked dependency source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          mkdir -p "$RUNNER_TEMP/kg-dependency-inputs"
          cargo vendor --locked --versioned-dirs "$RUNNER_TEMP/kg-dependency-inputs/vendor" \
            > "$RUNNER_TEMP/kg-dependency-inputs/offline-config.toml" \
            2> "$RUNNER_TEMP/kg-dependency-inputs/vendor.log"
          sha256sum Cargo.lock > "$RUNNER_TEMP/kg-dependency-inputs/lock.sha256"
          git diff --exit-code -- Cargo.lock
          cd "$RUNNER_TEMP/kg-dependency-inputs"
          tar -czf dependencies.tar.gz vendor offline-config.toml lock.sha256
          sha256sum dependencies.tar.gz > SHA256SUMS

      - name: Preserve dependency inputs and diagnostic log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-offline-dependencies-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/kg-dependency-inputs/dependencies.tar.gz
            ${{ runner.temp }}/kg-dependency-inputs/offline-config.toml
            ${{ runner.temp }}/kg-dependency-inputs/lock.sha256
            ${{ runner.temp }}/kg-dependency-inputs/SHA256SUMS
            ${{ runner.temp }}/kg-dependency-inputs/vendor.log
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
