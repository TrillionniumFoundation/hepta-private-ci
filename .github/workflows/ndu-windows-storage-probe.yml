              "GIT_CONFIG_NOSYSTEM": "1",
              "GIT_CONFIG_GLOBAL": os.devnull,
          })
          for key in list(ENV):
              if key == "GIT_CONFIG_COUNT" or key.startswith(("GIT_CONFIG_KEY_", "GIT_CONFIG_VALUE_")):
                  del ENV[key]


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def write_json(path, value):
              path.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")


          def git(*args, allowed=(0,)):
              empty_hooks = OUT / "empty-hooks"
              empty_hooks.mkdir(exist_ok=True)
              cmd = ["git", "--no-pager", "-c", "core.hooksPath=" + str(empty_hooks),
                     "-c", "core.fsmonitor=false", *args]
              result = subprocess.run(cmd, cwd=ROOT, env=ENV, capture_output=True, check=False)
              require(result.returncode in allowed,
                      "Git source check failed: " + repr(args) + "\n" +
                      result.stderr.decode("utf-8", errors="replace"))
              return result


          def raw_identity(path, cap):
              target = ROOT / path
              require(not target.is_symlink(), "Source is a symlink: " + path)
              with target.open("rb") as stream:
                  before = os.fstat(stream.fileno())
                  require(stat.S_ISREG(before.st_mode) and before.st_size <= cap,
                          "Source must be a bounded regular file: " + path)
                  data = stream.read(cap + 1)
                  after = os.fstat(stream.fileno())
              require(len(data) <= cap and
                      (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) ==
                      (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns),
                      "Source changed during its read: " + path)
              return data, {
                  "bytes": len(data),
                  "oid": hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest(),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }


          def source_snapshot():
              require(sys.platform == "win32" and os.environ.get("RUNNER_OS") == "Windows",
                      "A native Windows runner is required")
              require(re.fullmatch(r"[0-9a-f]{40}", HEAD) is not None, "Exact PR commit required")
              actual_head = git("rev-parse", "HEAD").stdout.decode().strip()
              require(actual_head == HEAD, "Checkout is not the exact PR head")
              # Status may invoke repository-local clean/process filters. Reject them first.
              filters = git("config", "--null", "--get-regexp",
                            r"^filter\..*\.(clean|process)$", allowed=(0, 1))
              require(filters.returncode == 1 and not filters.stdout,
                      "Clean/process filters are not permitted in this source gate")
              status = git("status", "--porcelain=v1", "--untracked-files=all").stdout
              require(not status, "Checkout index/worktree is not clean: " + repr(status))
              paths = sorted(set(PINS) | {WORKFLOW, "codex-rs/Cargo.lock"})
              records = git("ls-tree", "-r", "-z", HEAD, "--", *paths).stdout
              entries = {}
              for row in records.split(b"\0"):
                  if not row:
                      continue
                  header, path_bytes = row.split(b"\t", 1)
                  mode, kind, oid = header.decode("ascii").split()
                  name = path_bytes.decode("utf-8")
                  require(kind == "blob" and name not in entries, "Non-blob/duplicate source: " + name)
                  entries[name] = {"mode": mode, "oid": oid}
              require(set(entries) == set(paths), "Required source inventory differs")
              identities = {}
              for name in paths:
                  data, observed = raw_identity(name, 1024 * 1024)
                  observed["mode"] = entries[name]["mode"]
                  require(observed["oid"] == entries[name]["oid"], "Raw bytes differ from HEAD: " + name)
                  if name in PINS:
                      require(observed == PINS[name], "Reviewed mode/OID/SHA/size differs: " + name)
                  else:
                      require(observed["mode"] == "100644", "Unexpected dynamic file mode: " + name)
                  identities[name] = observed
                  if name == "codex-rs/Cargo.lock":
                      parsed = tomllib.loads(data.decode("utf-8"))
                      anyhow = [p for p in parsed["package"] if p["name"] == "anyhow"]
                      require(anyhow == [ANYHOW_RECORD], "Normal resolver must select exact anyhow 1.0.104")
                      # The reviewed ordinary-history union has a canonical lock.
                      # Keep the separately asserted Matrix edge and anyhow record;
                      # the complete remaining dependency graph stays exactly bound.
                      matrix_sdk = [p for p in parsed["package"] if p["name"] == "codex-hepta-matrix-sdk"]
                      require(len(matrix_sdk) == 1, "Normal lock must contain exactly one Matrix SDK record")
                      dependencies = matrix_sdk[0].get("dependencies")
                      require(isinstance(dependencies, list) and
                              dependencies.count("codex-utils-path") == 1,
                              "Normal lock must contain the exact reviewed Matrix path-utils dependency")
                      original_matrix_sdk = dict(matrix_sdk[0])
                      original_matrix_sdk["dependencies"] = [
                          dependency for dependency in dependencies if dependency != "codex-utils-path"
                      ]
                      remainder = dict(parsed)
                      remainder["package"] = [
                          original_matrix_sdk if package is matrix_sdk[0] else package
                          for package in parsed["package"] if package["name"] != "anyhow"
                      ]
                      canonical = json.dumps(remainder, sort_keys=True, separators=(",", ":"),
                                             ensure_ascii=False).encode("utf-8")
                      require(hashlib.sha256(canonical).hexdigest() == OTHER_LOCK_TOML_SHA256,
                              "Normal lock differs from the reviewed ordinary-union dependency fingerprint")
              # The workflow cannot contain its own digest. Its raw HEAD identity and the
              # normally generated lock identity are recorded and compared before/after.
              # The reviewed outer source manifest binds both at publication.
              return {"head": actual_head, "sources": identities, "index_worktree_clean": True}


          def command(name, argv, cwd=ROOT, require_success=True):
              started = time.monotonic()
              with (OUT / (name + ".stdout")).open("wb") as stdout, \
                      (OUT / (name + ".stderr")).open("wb") as stderr:
                  result = subprocess.run(argv, cwd=cwd, env=ENV, stdout=stdout, stderr=stderr,
                                          check=False)
              record = {"name": name, "argv": argv, "cwd": str(cwd),
                        "exit_code": result.returncode, "seconds": time.monotonic() - started}
              write_json(OUT / (name + ".command.json"), record)
              if require_success:
                  require(result.returncode == 0, "Normal command failed: " + name)
              return record


          def verify_acl_results():
              # Nextest 0.9.103 stores reports relative to the Cargo workspace root.
              report = ROOT / "codex-rs" / "target" / "nextest" / "local" / "junit.xml"
              raw = report.read_bytes()
              (OUT / "acl.junit.xml").write_bytes(raw)
              # A regression PASS must retain the original hypothesis FAIL and
              # ten real public refusals. It cannot certify sandbox permissions.
              command("mic-observation-verify",
                      [sys.executable, "-B", ".github/scripts/windows_mic_observation.py",
                       "--stdout", str(OUT / "windows-seventeen.stdout"),
                       "--stderr", str(OUT / "windows-seventeen.stderr"),
                       "--expected-head", HEAD,
                       "--output", str(OUT / "mic-counterexample-observation.json")])
              root = ET.fromstring(raw)
              cases = list(root.iter("testcase"))
              names = [case.attrib.get("name") for case in cases]
              require(collections.Counter(names) == collections.Counter(WINDOWS_METHODS),
                      "JUnit must contain each reviewed Windows method exactly once")
              forbidden = {"failure", "error", "skipped", "flakyFailure", "flakyError",
                           "rerunFailure", "rerunError"}
              require(not any(node.tag in forbidden for node in root.iter()),
                      "A test failed, skipped, or retried")
              for case in cases:
                  require(case.attrib.get("status", "run") != "notrun", "Unexecuted Windows method")
              text = (OUT / "windows-seventeen.stderr").read_text(encoding="utf-8")
              passes = re.findall(r"(?m)^\s*PASS\s+\[[^\]]+\].*?\s+((?:acl::tests|token::tests)::\S+)\s*$", text)
              require(collections.Counter(passes) == collections.Counter(WINDOWS_METHODS),
                      "Normal Nextest log must show seventeen distinct reviewed PASS results")
              write_json(OUT / "windows-exact-seventeen.json",
                         {"expected": WINDOWS_METHODS, "junit_actual": names, "log_passes": passes,
                          "passed": 17, "failed": 0, "skipped": 0, "retries": 0,
                          "original_mic_isolation_hypothesis": "FAIL",
                          "permission_qualification": False})


          def verify_mic_collector_results():
              text = (OUT / "mic-collector-seven.stderr").read_text(encoding="utf-8")
              passed = re.findall(r"(?m)^(test_\w+) \([^\n]+\) \.\.\. ok$", text)
              require(collections.Counter(passed) == collections.Counter(MIC_COLLECTOR_METHODS),
                      "All seven MIC collector methods must pass exactly once")
              require(re.search(r"(?m)^Ran 7 tests in .+$", text) is not None and
                      re.search(r"(?m)^OK$", text) is not None,
                      "MIC collector tests must report seven passes without skips")
              write_json(OUT / "mic-collector-exact-seven.json",
                         {"expected": MIC_COLLECTOR_METHODS, "actual": passed})


          def verify_elevated_refusal_results():
              report = ROOT / "codex-rs" / "target" / "nextest" / "local" / "junit.xml"
              raw = report.read_bytes()
              (OUT / "elevated-refusal.junit.xml").write_bytes(raw)
              root = ET.fromstring(raw)
              names = [case.attrib.get("name") for case in root.iter("testcase")]
              require(collections.Counter(names) == collections.Counter(ELEVATED_REFUSAL_METHODS),
                      "JUnit must contain each elevated admission method exactly once")
              forbidden = {"failure", "error", "skipped", "flakyFailure", "flakyError",
                           "rerunFailure", "rerunError"}
              require(not any(node.tag in forbidden for node in root.iter()),
                      "An elevated refusal test failed, skipped, or retried")
              for case in root.iter("testcase"):
                  require(case.attrib.get("status", "run") != "notrun", "Unexecuted refusal method")
              text = (OUT / "elevated-refusal-three.stderr").read_text(encoding="utf-8")
              passes = re.findall(r"(?m)^\s*PASS\s+\[[^\]]+\].*?\s+(elevated_admission_tests::\S+)\s*$", text)
              require(collections.Counter(passes) == collections.Counter(ELEVATED_REFUSAL_METHODS),
                      "Normal Nextest log must show three distinct admission PASS results")
              write_json(OUT / "elevated-refusal-exact-three.json",
                         {"expected": ELEVATED_REFUSAL_METHODS, "junit_actual": names,
                          "log_passes": passes, "passed": 3, "failed": 0, "skipped": 0,
                          "retries": 0, "permission_qualification": False})


          def verify_probe_python_results():
              text = (OUT / "probe-six.stderr").read_text(encoding="utf-8")
              passed = re.findall(r"(?m)^(test_\w+) \([^\n]+\) \.\.\. ok$", text)
              require(collections.Counter(passed) == collections.Counter(PROBE_METHODS),
                      "All six original probe Python methods must pass exactly once")
              require(re.search(r"(?m)^Ran 6 tests in .+$", text) is not None and
                      re.search(r"(?m)^OK$", text) is not None,
                      "Normal unittest summary must report six tests, without skips")
              write_json(OUT / "probe-exact-six.json", {"expected": PROBE_METHODS, "actual": passed})


          def verify_native_refusal():
              raw = (PROBE_OUT / "OBSERVATION.json").read_bytes()
              require(len(raw) <= 1024 * 1024, "Unexpected observation report size")
              report = json.loads(raw)
              require(report.get("schema") == "hepta.windows-acl-native-observation.v2" and
                      report.get("observation_mode") == "production_legacy_admission" and
                      report.get("expected_head") == HEAD and
                      report.get("status") == "legacy_backend_refused" and
                      report.get("qualification") is False and
                      type(report.get("native_exit_code")) is int and report["native_exit_code"] == 0 and
                      type(report.get("completed_permission_cases")) is int and
                      report["completed_permission_cases"] == 0 and
                      report.get("original_permission_invariants_observed") is False and
                      report.get("all_observed_invariants_held") is None,
                      "The native report must preserve the reviewed refusal-only meaning")
              rows = report.get("observations")
              expected = [
                  {"kind": "ADMISSION", "name": "partial",
                   "error_type": "LegacyWindowsSandboxIsolationUnavailable"},
                  {"kind": "ADMISSION", "name": "broad",
                   "error_type": "LegacyWindowsSandboxIsolationUnavailable"},
              ]
              require(isinstance(rows, list) and len(rows) == 4 and
                      sorted(rows[:2], key=lambda row: row["name"]) == sorted(expected, key=lambda row: row["name"]) and
                      rows[2:] == [{"kind": "FIXTURE", "unchanged": True},
                                   {"kind": "DONE", "completed_permission_cases": 0}],
                      "Exact two production refusals and unchanged fixture are required")
              write_json(OUT / "native-refusal-result.json",
                         {"status": "legacy_backend_refused", "qualification": False,
                          "completed_permission_cases": 0,
                          "original_permission_invariants_observed": False,
                          "report_sha256": hashlib.sha256(raw).hexdigest()})


          def main():
              phase = sys.argv[1]
              require(phase in {"preflight", "run", "postflight"}, "Invalid validation phase")
              if phase == "preflight":
                  OUT.mkdir(exist_ok=False)
                  before = source_snapshot()
                  write_json(OUT / "preflight.json", before)
                  return
              require(OUT.is_dir(), "Missing preflight directory")
              before = json.loads((OUT / "preflight.json").read_text(encoding="utf-8"))
              if phase == "postflight":
                  after = source_snapshot()
                  write_json(OUT / "postflight.json", after)
                  require(after == before, "Source drift after native validation")
                  return
              state = {"head": HEAD, "commands": [], "status": "RUNNING",
                       "windows_method_count": 17, "probe_python_method_count": 6,
                       "mic_collector_method_count": 7,
                       "elevated_refusal_method_count": 3,
                       "permission_qualification": False}
              error = None
              try:
                  require(source_snapshot() == before, "Source drift after tool installation")
                  state["commands"].append(command("just-version", ["just", "--version"]))
                  require((OUT / "just-version.stdout").read_text().strip() == "just 1.51.0",
                          "Reviewed just version required")
                  state["commands"].append(command("nextest-version", ["cargo", "+1.96.0", "nextest", "--version"],
                                                   ROOT / "codex-rs"))
                  require(re.match(r"^cargo-nextest 0\.9\.103(?:\s|$)",
                                   (OUT / "nextest-version.stdout").read_text()) is not None,
                          "Reviewed Nextest version required")
                  state["commands"].append(command("format-check",
                                                   ["cargo", "+1.96.0", "fmt", "--package",
                                                    "codex-windows-sandbox", "--", "--check"],
                                                   ROOT / "codex-rs"))
                  method_failures = []
                  state["method_failures"] = method_failures

                  def observe_methods(name, argv, verify):
                      require(source_snapshot() == before, "Source drift before " + name)
                      record = command(name, argv, require_success=False)
                      state["commands"].append(record)
                      if record["exit_code"] != 0:
                          method_failures.append("Normal command failed: " + name)
                      try:
                          verify()
                      except Exception as exc:
                          method_failures.append(name + ": " + type(exc).__name__ + ": " + str(exc))
                      require(source_snapshot() == before, "Source drift after " + name)

                  # Retain every independent observation, then fail the job if any
                  # command or exact result check failed. MIC is explicitly a
                  # counterexample/admission regression, with its original failed
                  # isolation observation retained separately. No test is skipped.
                  observe_methods("mic-collector-seven",
                                  [sys.executable, "-B", ".github/scripts/test_windows_mic_observation.py", "-v"],
                                  verify_mic_collector_results)
                  observe_methods("windows-seventeen",
                                  ["just", "test", "--locked", "-p", "codex-windows-sandbox",
                                   "--lib", "-E", " | ".join("test(=" + name + ")" for name in WINDOWS_METHODS), "--test-threads", "1",
                                   "--no-tests", "fail", "--retries", "0",
                                   "--status-level", "pass", "--final-status-level", "fail",
                                   "--success-output", "immediate"],
                                  verify_acl_results)
                  observe_methods("elevated-refusal-three",
                                  ["just", "test", "--locked", "-p", "codex-windows-sandbox",
                                   "--lib", "-E", "test(/^elevated_admission_tests::/)",
                                   "--test-threads", "1", "--no-tests", "fail",
                                   "--retries", "0", "--status-level", "pass",
                                   "--final-status-level", "fail"],
                                  verify_elevated_refusal_results)
                  observe_methods("probe-six",
                                  [sys.executable, "-B", "-m", "unittest",
                                   "experiments.multimodal_output_portfolio.closure_20261028.ops_windows_acl_probe_tests",
                                   "-v"],
                                  verify_probe_python_results)
                  observe_methods("native-probe",
                                  [sys.executable, "-B",
                                   "experiments/multimodal_output_portfolio/closure_20261028/ops_windows_acl_probe.py",
                                   "--expected-head", HEAD, "--output-dir", str(PROBE_OUT)],
                                  verify_native_refusal)
                  require(not method_failures, "; ".join(method_failures))
                  state["status"] = "PASS"
              except Exception as exc:
                  state["status"] = "FAIL"
                  state["error"] = type(exc).__name__ + ": " + str(exc)
                  error = exc
              finally:
                  try:
                      after = source_snapshot()
                      write_json(OUT / "source-after.json", after)
                      require(after == before, "Source drift during native validation")
                      state["source_unchanged"] = True
                  except Exception as exc:
                      state["status"] = "FAIL"
                      state["source_error"] = type(exc).__name__ + ": " + str(exc)
                      error = error or exc
                  write_json(OUT / "state.json", state)
              if error is not None:
                  raise error


          if __name__ == "__main__":
              main()
          '@ | Set-Content -Encoding utf8 -NoNewline "$env:RUNNER_TEMP/hepta-windows-acl-validation.py"
          python -B "$env:RUNNER_TEMP/hepta-windows-acl-validation.py" preflight
          exit $LASTEXITCODE
      - name: Install the committed Rust release and formatter
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          exit $LASTEXITCODE
      - name: Install the reviewed standard test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Run the reviewed Windows methods and the production refusal probe
        shell: pwsh
        run: |
          python -B "$env:RUNNER_TEMP/hepta-windows-acl-validation.py" run
          exit $LASTEXITCODE
      - name: Verify unchanged source and index after validation
        if: always()
        shell: pwsh
        run: |
          python -B "$env:RUNNER_TEMP/hepta-windows-acl-validation.py" postflight
          exit $LASTEXITCODE
      - name: Preserve complete native ACL method logs and identities
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-windows-acl-tests-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-windows-acl-tests
          if-no-files-found: error
      - name: Preserve native production refusal observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-windows-acl-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-windows-acl
          if-no-files-found: error

  appcontainer-mechanism:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Preserve committed source bytes and enable long paths
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.longpaths true
          exit $LASTEXITCODE
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up reviewed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Run exact AppContainer and LPAC mechanism experiment
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys
          import traceback
          from datetime import datetime, timezone

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          OUT = Path(os.environ["RUNNER_TEMP"]) / "hepta-appcontainer-mechanism"
          HEAD = os.environ["EXPECTED_HEAD"]
          PINS = {
              ".github/scripts/windows-appcontainer-probe/probe.py": "d73d8d51a6121efe0463304ece9832d9ba121a8cb5b4dc1fd71f706cdb5bd192",
              ".github/scripts/windows-appcontainer-probe/win32_api.py": "74da42fd9a09ff09e9b5e16f15a5d8176582fc7cc85da383dbcfce11b3bc6208",
          }

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def source_snapshot():
              require(re.fullmatch(r"[0-9a-f]{40}", HEAD) is not None, "Invalid PR head SHA")
              actual = subprocess.check_output(
                  ["git", "-C", str(ROOT), "rev-parse", "HEAD"], text=True
              ).strip()
              require(actual == HEAD, "Checkout must equal PR head, not the merge SHA")
              sources = {
                  path: hashlib.sha256((ROOT / path).read_bytes()).hexdigest()
                  for path in PINS
              }
              require(sources == PINS, "Reviewed experiment source bytes differ")
              return {"head": actual, "sha256": sources}

          OUT.mkdir(exist_ok=False)
          stdout_path = OUT / "probe.stdout"
          stderr_path = OUT / "probe.stderr"
          stdout_path.touch(exist_ok=False)
          stderr_path.touch(exist_ok=False)
          state = {
              "status": "RUNNING", "expected_head": HEAD,
              "started_at": datetime.now(timezone.utc).isoformat(),
              "windows": platform.win32_ver(), "python": sys.version,
              "scope": "owned mechanism only; original positive tests remain required",
              "production_qualification": False,
              "argv": [sys.executable, "-B", next(iter(PINS)), "--repo", str(ROOT),
                       "--source-head", HEAD, "--output", str(OUT / "observation.json")],
          }
          try:
              require(os.name == "nt", "Native Windows is required")
              state["before"] = source_snapshot()
              with stdout_path.open("wb") as stdout, stderr_path.open("wb") as stderr:
                  completed = subprocess.run(
                      state["argv"], cwd=ROOT, stdout=stdout, stderr=stderr, check=False
                  )
              state["exit_code"] = completed.returncode
              state["native_observation_present"] = (OUT / "observation.json").is_file()
              require(completed.returncode == 0, "Native mechanism experiment failed")
              observation = json.loads((OUT / "observation.json").read_text(encoding="utf-8"))
              require(observation.get("source_head") == HEAD, "Native report head differs")
              require(observation.get("all_bounded_hypotheses_passed") is True,
                      "Native report did not pass the bounded hypotheses")
              state["status"] = "PASS"
          except Exception as error:
              state["status"] = "FAIL"
              state["error"] = {"type": type(error).__name__, "message": str(error)}
              state["error_traceback"] = traceback.format_exc()
          finally:
              try:
                  state["after"] = source_snapshot()
                  require(state.get("before") == state["after"], "Source changed during probe")
                  state["source_unchanged"] = True
              except Exception as error:
                  state["status"] = "FAIL"
                  state["source_unchanged"] = False
                  state["source_error"] = {"type": type(error).__name__, "message": str(error)}
              state["finished_at"] = datetime.now(timezone.utc).isoformat()
              with (OUT / "invocation-result.json").open("x", encoding="utf-8") as output:
                  json.dump(state, output, indent=2)
                  output.write("\n")
              print(json.dumps(state, indent=2))
          raise SystemExit(0 if state["status"] == "PASS" else 1)
          '@ | python -B -
          exit $LASTEXITCODE
      - name: Observe fixed LPAC cmd entry paths and native image identity
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'hepta-lpac-cmd-entry'
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          $pins = [ordered]@{
            '.github/scripts/windows-appcontainer-probe/probe.py' = 'd73d8d51a6121efe0463304ece9832d9ba121a8cb5b4dc1fd71f706cdb5bd192'
            '.github/scripts/windows-appcontainer-probe/win32_api.py' = '74da42fd9a09ff09e9b5e16f15a5d8176582fc7cc85da383dbcfce11b3bc6208'
            '.github/scripts/windows-appcontainer-probe/cmd_entry_probe.py' = 'c3b5d892a4305d2d8709ab6b42350f0d5bf6346f12220366de057670a6ff5fe5'
          }
          $actual = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $observed = [ordered]@{}
          foreach ($path in $pins.Keys) {
            $observed[$path] = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $path)).Hash.ToLowerInvariant()
          }
          [ordered]@{ head = $actual; sha256 = $observed } | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8NoBOM -LiteralPath (Join-Path $out 'source-before.json')
          if ($actual -ne $env:EXPECTED_HEAD) { throw 'diagnostic checkout differs from the exact PR head' }
          foreach ($path in $pins.Keys) {
            if ($observed[$path] -ne $pins[$path]) { throw "reviewed source bytes differ: $path" }
          }
          function Get-NativeIdentity {
            $cmdPath = Join-Path ([Environment]::SystemDirectory) 'cmd.exe'
            $file = Get-Item -LiteralPath $cmdPath
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($cmdPath)
            $versionKey = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
            return [ordered]@{
              cmd = [ordered]@{
                path = $cmdPath
                bytes = $file.Length
                sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $cmdPath).Hash.ToLowerInvariant()
                file_version = $version.FileVersion
                product_version = $version.ProductVersion
                file_version_parts = @($version.FileMajorPart, $version.FileMinorPart, $version.FileBuildPart, $version.FilePrivatePart)
              }
              os = [ordered]@{
                environment_version = [Environment]::OSVersion.Version.ToString()
                build_number = Get-ItemPropertyValue -LiteralPath $versionKey -Name CurrentBuildNumber
                update_build_revision = Get-ItemPropertyValue -LiteralPath $versionKey -Name UBR
              }
            }
          }
          $nativeBefore = Get-NativeIdentity
          $nativeBefore | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8NoBOM -LiteralPath (Join-Path $out 'native-identity-before.json')
          if (-not $nativeBefore.cmd.file_version) { throw 'native cmd file version is unavailable' }
          python -B .github/scripts/windows-appcontainer-probe/cmd_entry_probe.py --repo "$env:GITHUB_WORKSPACE" --source-head "$env:EXPECTED_HEAD" --output (Join-Path $out 'observation.json') 1> (Join-Path $out 'probe.stdout') 2> (Join-Path $out 'probe.stderr')
          $probeExit = $LASTEXITCODE
          $nativeAfter = Get-NativeIdentity
          $nativeAfter | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8NoBOM -LiteralPath (Join-Path $out 'native-identity-after.json')
          [ordered]@{ expected_head = $env:EXPECTED_HEAD; exit_code = $probeExit } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM -LiteralPath (Join-Path $out 'invocation-result.json')
          $observation = Get-Content -Raw -LiteralPath (Join-Path $out 'observation.json') | ConvertFrom-Json
          if ($nativeBefore.cmd.sha256 -ne $nativeAfter.cmd.sha256 -or
              $nativeBefore.cmd.sha256 -ne $observation.cmd_image_before.sha256 -or
              $nativeAfter.cmd.sha256 -ne $observation.cmd_image_after.sha256) {
            throw 'native cmd image identity changed or differs between observers'
          }
          exit $probeExit
      - name: Preserve LPAC cmd entry observations and native identity
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-lpac-cmd-entry-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-lpac-cmd-entry
          if-no-files-found: error
      - name: Trace actual primary-token Win32 errors in separate owned fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'hepta-appcontainer-child-trace'
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          @'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          expected = os.environ['EXPECTED_HEAD']
          actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              raise RuntimeError('diagnostic checkout differs from original PR head')
          pins = {
              '.github/scripts/windows-appcontainer-probe/probe.py': 'd73d8d51a6121efe0463304ece9832d9ba121a8cb5b4dc1fd71f706cdb5bd192',
              '.github/scripts/windows-appcontainer-probe/win32_api.py': '74da42fd9a09ff09e9b5e16f15a5d8176582fc7cc85da383dbcfce11b3bc6208',
              '.github/scripts/windows-appcontainer-probe/child_trace.c': 'c59a908daa1df6c827d5d3245de563c3952f9e28fb044555ea3417581e07d697',
              '.github/scripts/windows-appcontainer-probe/child_trace.py': 'f370bf331f1277afa1168ff27c2fe852e5ff11188d3b206ce884585f1ca2cbe8',
          }
          observed = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in pins}
          if observed != pins:
              raise RuntimeError('reviewed native trace source bytes differ')
          out = Path(os.environ['RUNNER_TEMP']) / 'hepta-appcontainer-child-trace'
          (out / 'source-before.json').write_text(json.dumps({'head': actual, 'sha256': observed}, indent=2))
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $install) { throw 'MSVC x64 installation missing' }
          $devcmd = Join-Path $install 'Common7/Tools/VsDevCmd.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/windows-appcontainer-probe/child_trace.c'
          $exe = Join-Path $out 'child-trace.exe'
          $obj = Join-Path $out 'child-trace.obj'
          $build = Join-Path $out 'build.cmd'
          @"
          @echo off
          call "$devcmd" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /std:c17 /O2 /Oi /GS- /Zl /W4 /WX /Fo"$obj" /Fe"$exe" "$source" /link /NODEFAULTLIB /ENTRY:entry /SUBSYSTEM:CONSOLE kernel32.lib advapi32.lib
          exit /b %errorlevel%
          "@ | Set-Content -Encoding ascii -Path $build
          & $env:ComSpec /d /c "`"$build`"" 1> (Join-Path $out 'compile.stdout') 2> (Join-Path $out 'compile.stderr')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .github/scripts/windows-appcontainer-probe/child_trace.py --repo "$env:GITHUB_WORKSPACE" --source-head "$env:EXPECTED_HEAD" --executable "$exe" --output (Join-Path $out 'observation.json') 1> (Join-Path $out 'trace.stdout') 2> (Join-Path $out 'trace.stderr')
          exit $LASTEXITCODE
      - name: Preserve independent native child diagnostic logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-appcontainer-child-trace-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-appcontainer-child-trace
          if-no-files-found: error
      - name: Preserve native mechanism observations and complete process logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-appcontainer-mechanism-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-appcontainer-mechanism
          if-no-files-found: error

  cmd-path-observation:
    needs: appcontainer-mechanism
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Preserve exact committed source and enable long paths
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.longpaths true
          exit $LASTEXITCODE
      - name: Checkout exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up original Python version
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Observe original and long cwd with unchanged command predicates
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hepta-cmd-path-observation'
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          python -B .github/scripts/windows-appcontainer-probe/cmd_path_probe.py --repo "$env:GITHUB_WORKSPACE" --source-head "$env:EXPECTED_HEAD" --output (Join-Path $out 'observation.json') 1> (Join-Path $out 'probe.stdout') 2> (Join-Path $out 'probe.stderr')
          $code = $LASTEXITCODE
          @{ expected_head = $env:EXPECTED_HEAD; exit_code = $code; observation_present = (Test-Path (Join-Path $out 'observation.json')); diagnostic_only = $true; production_qualification = $false } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out 'invocation-result.json')
          exit $code
      - name: Repeat the same predicates in a fresh runner-temp fixture location
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hepta-cmd-path-observation/runner-temp'
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          $originalTemp = $env:TEMP
          $originalTmp = $env:TMP
          $caseRoot = Join-Path $env:RUNNER_TEMP ('hepta-cmd-fixtures-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $caseRoot -ErrorAction Stop | Out-Null
          $env:TEMP = $caseRoot
          $env:TMP = $caseRoot
          python -B .github/scripts/windows-appcontainer-probe/cmd_path_probe.py --repo "$env:GITHUB_WORKSPACE" --source-head "$env:EXPECTED_HEAD" --output (Join-Path $out 'observation.json') 1> (Join-Path $out 'probe.stdout') 2> (Join-Path $out 'probe.stderr')
          $code = $LASTEXITCODE
          $env:TEMP = $originalTemp
          $env:TMP = $originalTmp
          $roots = @()
          if (Test-Path (Join-Path $out 'observation.json')) {
            $observation = Get-Content -Raw (Join-Path $out 'observation.json') | ConvertFrom-Json
            $roots = @($observation.cases | ForEach-Object { $_.result.owned_fixture })
          }
          $prefix = [IO.Path]::GetFullPath($caseRoot).TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          $insideOwned = $roots.Count -eq 6
          foreach ($fixture in $roots) {
            if ([string]::IsNullOrWhiteSpace($fixture) -or -not ([IO.Path]::GetFullPath([string]$fixture).StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase))) {
              $insideOwned = $false
            }
          }
          @{ expected_head = $env:EXPECTED_HEAD; exit_code = $code; original_temp = $originalTemp; original_tmp = $originalTmp; requested_fixture_root = $caseRoot; actual_fixture_roots = $roots; all_fixtures_inside_owned_root = $insideOwned; comparison = 'same runner and probe; fresh fixture location changes path and ancestor chain'; diagnostic_only = $true; production_qualification = $false } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $out 'invocation-result.json')
          if (-not $insideOwned) { exit 1 }
          exit $code
      - name: Retain exact failures and path observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-cmd-path-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-cmd-path-observation
          if-no-files-found: error
          retention-days: 14
