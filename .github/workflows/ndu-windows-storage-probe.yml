name: NDU native Windows storage observation

on:
  pull_request:
    paths:
      - ".github/workflows/ndu-windows-storage-probe.yml"
      - "experiments/multimodal_output_portfolio/closure_20261028/ops_windows_storage_probe.py"
      - "experiments/multimodal_output_portfolio/closure_20261028/ops_windows_acl_probe*"
      - "codex-rs/windows-sandbox-rs/src/token.rs"
      - "codex-rs/windows-sandbox-rs/src/acl.rs"
      - "codex-rs/windows-sandbox-rs/src/winutil.rs"
      - "codex-rs/windows-sandbox-rs/src/acl_deny.rs"
      - "codex-rs/windows-sandbox-rs/src/acl_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/legacy_admission.rs"
      - "codex-rs/windows-sandbox-rs/src/legacy_admission_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/token_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/token_access_request_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/token_descriptor_access_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/token_mic_probe_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/token_native_access_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/token_probe_support.rs"
      - "codex-rs/windows-sandbox-rs/src/token_read_authority_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/token_delete_diagnostics_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/token_access_check_diagnostics_tests.rs"
      - "codex-rs/windows-sandbox-rs/src/lib.rs"
      - "codex-rs/windows-sandbox-rs/Cargo.toml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "justfile"
      - "scripts/just-shell.py"
      - "scripts/run-nextest.py"
      - "codex-rs/.config/nextest.toml"

permissions:
  contents: read

concurrency:
  group: ndu-windows-storage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Observe native file and directory flush results
        shell: pwsh
        run: |
          python experiments/multimodal_output_portfolio/closure_20261028/ops_windows_storage_probe.py --output "$env:RUNNER_TEMP/hepta-windows-storage.json"
          exit $LASTEXITCODE
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-windows-storage-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-windows-storage.json
          if-no-files-found: error

  acl-observe:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Preserve committed source bytes on checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python with tomllib
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Freeze reviewed source identities before tool installation
