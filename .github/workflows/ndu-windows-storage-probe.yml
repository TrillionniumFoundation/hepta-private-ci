name: NDU native Windows storage observation

on:
  push:
    branches: ["research/ndu-native-diagnostic-20261028"]

permissions:
  contents: read

concurrency:
  group: ndu-windows-storage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe native file and directory flush results
        shell: pwsh
        run: |
          python experiments/multimodal_output_portfolio/closure_20261028/ops_windows_storage_probe.py --output "$env:RUNNER_TEMP/hepta-windows-storage.json"
          exit $LASTEXITCODE
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-windows-storage-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-windows-storage.json
          if-no-files-found: error

  acl-observe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Preserve committed source bytes on checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python with tomllib
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Install the committed Rust release
        shell: pwsh
        run: |
          $toolchain = python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("codex-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($toolchain -notmatch '^\d+\.\d+\.\d+$') { throw "Expected an exact committed Rust release" }
          rustup toolchain install $toolchain --profile minimal
          exit $LASTEXITCODE
      - name: Observe production restricted-token and ACL behavior
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python -m unittest experiments.multimodal_output_portfolio.closure_20261028.ops_windows_acl_probe_tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python experiments/multimodal_output_portfolio/closure_20261028/ops_windows_acl_probe.py --expected-head "$env:EXPECTED_HEAD" --output-dir "$env:RUNNER_TEMP/hepta-windows-acl"
          exit $LASTEXITCODE
      - name: Preserve native ACL observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-windows-acl-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-windows-acl
          if-no-files-found: error
