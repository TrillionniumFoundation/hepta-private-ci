          ANYHOW_RECORD = {
              "name": "anyhow",
              "version": "1.0.104",
              "source": "registry+https://github.com/rust-lang/crates.io-index",
              "checksum": "330a5ed07fa54e4702c9d6c4174f74427fc0ef6e214bbd677ae50a5099946470",
          }
          WORKFLOW = ".github/workflows/ndu-windows-storage-probe.yml"
          ROOT = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          OUT = Path(os.environ["RUNNER_TEMP"]) / "hepta-windows-acl-tests"
          PROBE_OUT = Path(os.environ["RUNNER_TEMP"]) / "hepta-windows-acl"
          HEAD = os.environ["EXPECTED_HEAD"]
          ENV = dict(os.environ)
          ENV.update({
              "PYTHONDONTWRITEBYTECODE": "1",
              "CARGO_TERM_COLOR": "never",
              "NEXTEST_PROFILE": "local",
              "NO_COLOR": "1",
              "CARGO_TARGET_DIR": str(Path(os.environ["RUNNER_TEMP"]) / "hepta-windows-acl-target"),
