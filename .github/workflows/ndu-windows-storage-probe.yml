                  "bytes": 2030,
                  "mode": "100644",
                  "oid": "bb2db6ebc4312a301ee39d2793fde16289d046d8",
                  "sha256": "444d6b328d44abf6453b77b6acce2a0c881fc162ff30b20f352c85067797fbe9"
              },
