name: Prompt registry phase 4 measurement baseline

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - ops/prompt-registry-phase4-observability-executor-20260930
    paths:
      - ops/trigger-prompt-registry-phase4-observability

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prompt-registry-phase4-measurement-baseline
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: codex/prompt-registry-full-closeout-20260929
      PHASE1_ANCESTOR: 8825996f927ca1cb3e1271ffcce0261ce25b398e
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout reviewed authoring scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: authoring
          persist-credentials: false

      - name: Checkout delivery candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Bind durable-intent predecessor
        id: predecessor
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          tested=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$PHASE1_ANCESTOR" "$tested"
          test -f codex-rs/hepta-agentd/src/prompt_pipeline_intent_store.rs
          grep -q 'PromptPipelineIntentPhase::Ready' codex-rs/hepta-agentd/src/prompt_runtime.rs
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/modules/prompt.registry/IMPLEMENTATION_MAP.json').read_text())
          assert data['closedWorldPublicFunctions'] is True
          assert data['claimBoundary']['nativeSourceMappingComplete'] is True
          PY
          echo "sha=$tested" >> "$GITHUB_OUTPUT"

      - name: Apply versioned GC age and full-operation metrics
        shell: bash
        run: |
          set -euo pipefail
          cp authoring/scripts/author_prompt_registry_gc_age.py "$RUNNER_TEMP/gc-age.py"
          cp authoring/scripts/author_prompt_registry_metrics.py "$RUNNER_TEMP/metrics.py"
          python3 "$RUNNER_TEMP/gc-age.py" target
          python3 "$RUNNER_TEMP/metrics.py" target
          cd target
          git diff --check

      - name: Update exact developer and operator contracts
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def append_once(path: str, marker: str, text: str) -> None:
              p = Path(path)
              value = p.read_text(encoding='utf-8')
              if marker in value:
                  return
              p.write_text(value.rstrip() + '\n\n' + text.strip() + '\n', encoding='utf-8')

          append_once(
              'docs/modules/prompt.registry/API_CONTRACT.md',
              '## Versioned payload-reclaim policy',
              '''## Versioned payload-reclaim policy

`PromptRegistryGcPolicyV1` binds minimum revision retention, optional trusted
wall-clock age, trusted-time epoch, clock authority and clock version. Missing
or mismatched time authority never shortens retention. A newly discovered
inactive payload starts conservatively at the current revision/time. GC policy
is deletion eligibility only; it grants no prompt-use authority and never
prunes factor, realization, relation, supersession or lifecycle audit facts.
''')
          append_once(
              'docs/modules/prompt.registry/OPERATIONS.md',
              '## Versioned reclaim-age operation',
              '''## Versioned reclaim-age operation

Operators must supply an explicit `PromptRegistryGcPolicyV1`. Revision age is
always durable; millisecond age is reported only when the persisted fact and
current policy share the exact trusted-time epoch, authority and version.
Unknown or changed clock provenance remains ineligible rather than being
coerced to zero. The sidecar is synchronized independently and an uncertain
post-rename directory sync poisons the owner until reopen and reconciliation.
''')
          append_once(
              'docs/modules/prompt.registry/PERFORMANCE.md',
              '## Full mutation cost decomposition',
              '''## Full mutation cost decomposition

Process-generation I/O metrics now distinguish full mutation latency, registry
clone time, mutation-apply time, metadata-encode time and durable publication.
Counters classify changed, unchanged and failed mutations. These measurements
make the current full-image O(N) costs explicit; they do not claim that a
journal, incremental digest or segmented lifecycle history is already active.
Any replacement must preserve the single-writer, unknown-commit poisoning,
revocation and strict-reopen invariants and must beat this baseline at
1k/8k/16k plus long-running churn.
''')
          PY

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format, compile, test and strict-lint registry
        working-directory: target/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-prompt-registry
          cargo fmt -p codex-hepta-prompt-registry -- --check
          cargo check --locked -p codex-hepta-prompt-registry --all-targets
          cargo test --locked -p codex-hepta-prompt-registry -- --test-threads=1
          cargo clippy --locked -p codex-hepta-prompt-registry --all-targets --no-deps -- -D warnings

      - name: Execute operational scale and writer profiles
        working-directory: target/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-prompt-registry operational_scale_profile_1k_8k_16k -- --ignored --nocapture --test-threads=1
          cargo test --locked -p codex-hepta-prompt-registry operational_writer_latency_profile -- --ignored --nocapture --test-threads=1
          cargo test --locked -p codex-hepta-prompt-registry operational_fsync_profile -- --ignored --nocapture --test-threads=1

      - name: Commit conventional source and exact truth
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          changed=$(git diff --name-only)
          test -n "$changed"
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(codex-rs/hepta-prompt-registry/src/[^/]+\.rs|docs/modules/prompt\.registry/(API_CONTRACT|OPERATIONS|PERFORMANCE)\.md)$' || true)
          test -z "$unexpected"
          git add codex-rs/hepta-prompt-registry/src docs/modules/prompt.registry/
          git commit -m 'feat(prompt.registry): persist reclaim age and measure full mutation cost'

          python3 scripts/hepta-prompt-registry-map.py --write
          git add docs/modules/prompt.registry/IMPLEMENTATION_MAP.json \
                  docs/modules/prompt.registry/QUALIFICATION_STATUS.md
          if test -n "$(git diff --cached --name-only)"; then
            git commit -m 'docs(prompt.registry): bind measurement baseline source truth'
          fi
          python3 scripts/hepta-prompt-registry-map.py --check
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Publish only over the exact captured predecessor
        working-directory: target
        shell: bash
        env:
          EXPECTED: ${{ steps.predecessor.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
