name: MemoryCell pinned LoCoMo source-byte frontier
on:
  push:
    branches:
      - "codex/memory-cell-evidence-20261008"
    paths:
      - "scripts/memory_cell/locomo_budget_frontier.py"
      - "scripts/memory_cell/test_locomo_budget_frontier.py"
      - "scripts/memory_cell/data/locomo-ninearm-offline-20261012.json"
      - ".github/workflows/hepta-memory-locomo-budget-frontier.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-locomo-bytes-${{ github.sha }}
  cancel-in-progress: false
jobs:
  postpolicy-budget-audit:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck original published result and cost-bound invariants
        run: |
          set -euo pipefail
          mkdir -p /tmp/locomo-source-byte-frontier/source
          git rev-parse HEAD > /tmp/locomo-source-byte-frontier/auditing-commit.txt
          git rev-parse HEAD^{tree} > /tmp/locomo-source-byte-frontier/auditing-tree.txt
          python3 -m py_compile scripts/memory_cell/locomo_budget_frontier.py scripts/memory_cell/test_locomo_budget_frontier.py
          python3 -m unittest discover -s scripts/memory_cell -p 'test_locomo_budget_frontier.py' -v 2>&1 | tee /tmp/locomo-source-byte-frontier/tests.log
          python3 scripts/memory_cell/locomo_budget_frontier.py \
            --source scripts/memory_cell/data/locomo-ninearm-offline-20261012.json \
            --output /tmp/locomo-source-byte-frontier/cost-frontier.json \
            2>&1 | tee /tmp/locomo-source-byte-frontier/summary.log
      - name: Retain exact tested source and independently checkable file manifest
        if: always()
        run: |
          set -euo pipefail
          cp scripts/memory_cell/locomo_budget_frontier.py /tmp/locomo-source-byte-frontier/source/
          cp scripts/memory_cell/test_locomo_budget_frontier.py /tmp/locomo-source-byte-frontier/source/
          cp scripts/memory_cell/data/locomo-ninearm-offline-20261012.json /tmp/locomo-source-byte-frontier/source/
          cp .github/workflows/hepta-memory-locomo-budget-frontier.yml /tmp/locomo-source-byte-frontier/source/
          (cd /tmp/locomo-source-byte-frontier && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-locomo-source-byte-frontier
          path: /tmp/locomo-source-byte-frontier
          if-no-files-found: error
