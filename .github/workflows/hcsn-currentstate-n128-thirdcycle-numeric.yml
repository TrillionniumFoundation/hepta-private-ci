name: HCSN current-state N128 third-cycle numeric
on:
  push:
    branches:
      - research/hcsn-n128-thirdcycle-numeric-20261113-c06d
permissions:
  contents: read
concurrency:
  group: hcsn-n128-thirdcycle-numeric-20261113-c06d-001
  cancel-in-progress: false
jobs:
  bounded-thirdcycle-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_COMMIT: ${{ github.sha }}
      EXPECTED_BRANCH: research/hcsn-n128-thirdcycle-numeric-20261113-c06d
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-ci-tools
      - name: Bind exact source before numerical imports
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          git merge-base --is-ancestor 49d392fef517120195f5d52f51de199b3f86843d HEAD
          root="$RUNNER_TEMP/hcsn-n128-thirdcycle-numeric"
          mkdir "$root"
          python -B qualification/hcsn_currentstate_n128_thirdcycle_numeric/static_inspector.py --root . --output "$root/STATIC-ADMISSION.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          package = Path('qualification/hcsn_currentstate_n128_thirdcycle_numeric')
          request = json.loads((package / 'REQUEST.json').read_text())
          root = Path(os.environ['RUNNER_TEMP']) / 'hcsn-n128-thirdcycle-numeric'
          pre = {
              'source_commit': os.environ['CANDIDATE_COMMIT'],
              'unique_execution_key': request['unique_execution_key'],
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'candidate_dynamic_segments': request['candidate_dynamic_segments'],
              'candidate_matrix_exponentials': request['candidate_matrix_exponentials'],
              'oracle_dynamic_segments': request['oracle_dynamic_segments'],
              'oracle_matrix_exponentials': request['oracle_matrix_exponentials'],
              'comparison_coordinates_per_pair': request['comparison_coordinates_per_pair'],
              'comparison_pairs': request['comparison_pairs'],
              'fresh_processes': request['fresh_processes'],
              'address_space_limit_bytes': 1073741824,
              'cpu_limit_seconds_per_process': 120,
              'status': 'STARTING_UNIQUE_ATTEMPT',
          }
          (root / 'PRE-EXECUTION.json').write_text(json.dumps(pre, indent=2, sort_keys=True) + '\n')
          PY
      - name: Apply exact repository format gate
        run: |
          cd codex-rs
          just fmt --base 49d392fef517120195f5d52f51de199b3f86843d
          cd ..
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
      - name: Install exact numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Execute sole bounded third-cycle numerical attempt
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hcsn-n128-thirdcycle-numeric"
          package="qualification/hcsn_currentstate_n128_thirdcycle_numeric"
          inputs="qualification/hcsn_source_migration_vjp_n128/inputs"
          /usr/bin/time -v -o "$root/candidate.time" prlimit --as=1073741824 --cpu=120 -- python -B -m qualification.hcsn_currentstate_n128_thirdcycle_numeric.run_candidate --start "$package/START.bin" --law "$inputs/SELECTED_ORIGINAL_LAW.json" --metadata "$inputs/seed37-c0_b1-step24-pos1-n128.json" --npz "$inputs/seed37-c0_b1-step24-pos1-n128.npz" --output "$root/candidate"
          /usr/bin/time -v -o "$root/oracle.time" prlimit --as=1073741824 --cpu=120 -- python -B -m qualification.hcsn_currentstate_n128_thirdcycle_numeric.run_oracle --start "$package/START.bin" --law "$inputs/SELECTED_ORIGINAL_LAW.json" --metadata "$inputs/seed37-c0_b1-step24-pos1-n128.json" --npz "$inputs/seed37-c0_b1-step24-pos1-n128.npz" --output "$root/oracle"
          /usr/bin/time -v -o "$root/restore.time" prlimit --as=1073741824 --cpu=120 -- python -B -m qualification.hcsn_currentstate_n128_thirdcycle_numeric.restore --capsule "$root/candidate/CAPSULE.bin" --output "$root/restore"
          cmp "$root/candidate/COORDINATES.f64le" "$root/oracle/COORDINATES.f64le"
          cmp "$root/candidate/COORDINATES.f64le" "$root/restore/COORDINATES.f64le"
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          package = Path('qualification/hcsn_currentstate_n128_thirdcycle_numeric')
          request = json.loads((package / 'REQUEST.json').read_text())
          root = Path(os.environ['RUNNER_TEMP']) / 'hcsn-n128-thirdcycle-numeric'
          candidate = json.loads((root / 'candidate/RESULT.json').read_text())
          oracle = json.loads((root / 'oracle/RESULT.json').read_text())
          restore = json.loads((root / 'restore/RESULT.json').read_text())
          if candidate['status'] != 'PASS_CANDIDATE_THIRDCYCLE_NUMERIC_ONLY':
              raise SystemExit(1)
          if oracle['status'] != 'PASS_INDEPENDENT_DENSE_ORACLE_THIRDCYCLE_ONLY':
              raise SystemExit(1)
          if restore['status'] != 'PASS_FRESH_RESTORE_THIRDCYCLE_NUMERIC_ONLY':
              raise SystemExit(1)
          if [candidate['coordinate_count'], oracle['coordinate_count'], restore['coordinate_count']] != [request['comparison_coordinates_per_pair']] * 3:
              raise SystemExit(1)
          if len({candidate['coordinate_sha256'], oracle['coordinate_sha256'], restore['coordinate_sha256']}) != 1:
              raise SystemExit(1)
          if candidate['coordinate_sha256'] != request['expected_coordinate_sha256']:
              raise SystemExit(1)
          if candidate['capsule_sha256'] != request['expected_capsule_sha256'] or restore['capsule_sha256'] != candidate['capsule_sha256']:
              raise SystemExit(1)
          if [candidate['dynamic_segments'], oracle['dynamic_segments'], restore['dynamic_segments']] != [3, 3, 0]:
              raise SystemExit(1)
          if [candidate['matrix_exponentials'], oracle['matrix_exponentials'], restore['matrix_exponentials']] != [14, 14, 0]:
              raise SystemExit(1)
          if [candidate['packets'], oracle['packets']] != [25, 25] or [candidate['target4_packets'], oracle['target4_packets']] != [1, 1]:
              raise SystemExit(1)
          if any(row[name] for row in (candidate, oracle, restore) for name in ('torch_operations', 'optimizer_updates')):
              raise SystemExit(1)

          def time_cost(path):
              text = path.read_text()
              def value(label, cast=float):
                  match = re.search(rf'^\s*{re.escape(label)}:\s*(.+)$', text, re.MULTILINE)
                  if not match:
                      raise ValueError(label)
                  return cast(match.group(1).strip())
              return {
                  'user_seconds': value('User time (seconds)'),
                  'system_seconds': value('System time (seconds)'),
                  'maximum_rss_kib': value('Maximum resident set size (kbytes)', int),
              }

          result = {
              'all_closed': False,
              'candidate_cost': time_cost(root / 'candidate.time'),
              'candidate_dynamic_segments': candidate['dynamic_segments'],
              'candidate_matrix_exponentials': candidate['matrix_exponentials'],
              'capsule_bytes': candidate['capsule_bytes'],
              'capsule_sha256': candidate['capsule_sha256'],
              'comparison_coordinates_per_pair': request['comparison_coordinates_per_pair'],
              'comparison_operations': request['comparison_coordinates_per_pair'] * request['comparison_pairs'],
              'comparison_pairs': request['comparison_pairs'],
              'coordinate_sha256': candidate['coordinate_sha256'],
              'dynamic_segments': candidate['dynamic_segments'] + oracle['dynamic_segments'],
              'fresh_processes': request['fresh_processes'],
              'identity': request['identity'],
              'matrix_exponentials': candidate['matrix_exponentials'] + oracle['matrix_exponentials'],
              'optimizer_updates': 0,
              'oracle_cost': time_cost(root / 'oracle.time'),
              'oracle_dynamic_segments': oracle['dynamic_segments'],
              'oracle_matrix_exponentials': oracle['matrix_exponentials'],
              'packets': candidate['packets'],
              'parent_static_omitted_pending_packets': request['parent_static_omitted_pending_packets'],
              'parent_static_prospective_coordinates': request['parent_static_prospective_coordinates'],
              'qualification': False,
              'restore_cost': time_cost(root / 'restore.time'),
              'state_scalars': request['state_scalars'],
              'status': 'PASS_BOUNDED_THIRDCYCLE_NUMERIC_ONLY',
              'target4_packets': candidate['target4_packets'],
              'torch_operations': 0,
              'unique_execution_key': request['unique_execution_key'],
          }
          (root / 'RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Confirm checkout remained immutable
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hcsn-n128-thirdcycle-numeric-attempt001-originals
          path: ${{ runner.temp }}/hcsn-n128-thirdcycle-numeric
          if-no-files-found: error
