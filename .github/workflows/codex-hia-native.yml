        working-directory: codex/codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -p codex-apply-patch -p codex-utils-string \
            --features codex-apply-patch/hia-native,codex-utils-string/hia-native \
            --message-format=json-render-diagnostics -- -D warnings \
            > "$RUNNER_TEMP/unified-owner-clippy.jsonl" 2> "$RUNNER_TEMP/unified-owner-clippy.stderr"
          cat "$RUNNER_TEMP/unified-owner-clippy.stderr" | tee "$RUNNER_TEMP/hia-native-owner-clippy.log"
          python3 -B ../hia/similar_policy.py --verify-cargo-log "$RUNNER_TEMP/unified-owner-clippy.jsonl" \
            > "$RUNNER_TEMP/unified-owner-clippy-admission.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["consumer_artifacts"] and all(x["policy_mode"]==0 for x in v["consumer_artifacts"])' "$RUNNER_TEMP/unified-owner-clippy-admission.json"
