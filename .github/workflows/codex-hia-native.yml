            --report "$RUNNER_TEMP/hia-truncate-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-truncate-abi.log"

      - name: Test consumers of native truncation and token budgets
        if: ${{ always() && steps.build.outcome == 'success' && steps.unified_policy_config.outcome == 'success' }}
        working-directory: codex/codex-rs
        run: |
          set -euo pipefail
          just test -p codex-utils-output-truncation -p codex-protocol -p codex-context-fragments \
            --features codex-utils-string/hia-native --locked \
            2>&1 | tee "$RUNNER_TEMP/hia-truncate-consumers.log"

      - name: Verify native scalar token arithmetic and invalid-mode traps
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_token_budget_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-token-budget-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-token-budget-abi.log"

      - name: Verify installed HIA apply_patch executable
        if: ${{ always() && steps.build.outcome == 'success' && steps.unified_policy_config.outcome == 'success' }}
        working-directory: codex/codex-rs
        run: |
          set -euo pipefail
          cargo build --locked -p codex-apply-patch --features hia-native --bin apply_patch \
            2>&1 | tee "$RUNNER_TEMP/hia-installed-patch-build.log"
          cp "$CARGO_TARGET_DIR/debug/apply_patch" "$RUNNER_TEMP/hia-apply_patch"
          cargo build --locked -p codex-apply-patch --bin apply_patch \
            2>&1 | tee "$RUNNER_TEMP/hia-original-patch-build.log"
          python3 -B ../hia/tests/test_installed_patch.py \
            --binary "$RUNNER_TEMP/hia-apply_patch" \
            --reference-binary "$CARGO_TARGET_DIR/debug/apply_patch" \
            --report "$RUNNER_TEMP/hia-installed-patch.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-installed-patch.log"

      - name: Provision system bubblewrap for real sandbox owner tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor apparmor-profiles
          command -v bwrap
          bwrap --version
          # Ubuntu 24.04 restricts unprivileged namespaces by default. Load its
          # distribution-maintained, executable-scoped bwrap profile, never
          # disable the host-wide AppArmor restriction or change Codex's sandbox.
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          sudo apparmor_parser -Q -T "$profile"
          sudo apparmor_parser -r "$profile"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          # Fail before the owner suite if user or network namespaces cannot
          # actually start. Mere bwrap presence/version is not qualification.
          bwrap --unshare-user --unshare-net --ro-bind / / --dev /dev --proc /proc -- /bin/true

      - name: Test full Codex owners with HIA enabled
        if: ${{ always() && steps.build.outcome == 'success' && steps.unified_policy_config.outcome == 'success' }}
