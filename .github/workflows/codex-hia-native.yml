name: Codex HIA native components

on:
  push:
    paths:
      - hia/**
      - codex-rs/apply-patch/**
      - codex-rs/arg0/**
      - codex-rs/cli/**
      - codex-rs/tui/**
      - codex-rs/utils/string/**
      - codex-rs/utils/output-truncation/**
      - codex-rs/protocol/**
      - codex-rs/context-fragments/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - justfile
      - scripts/run-nextest.py
      - scripts/just-shell.py
      - .github/workflows/codex-hia-native.yml
  pull_request:
    paths:
      - hia/**
      - codex-rs/apply-patch/**
      - codex-rs/arg0/**
      - codex-rs/cli/**
      - codex-rs/tui/**
      - codex-rs/utils/string/**
      - codex-rs/utils/output-truncation/**
      - codex-rs/protocol/**
      - codex-rs/context-fragments/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - justfile
      - scripts/run-nextest.py
      - scripts/just-shell.py
      - .github/workflows/codex-hia-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HEPTA_SOURCE: ${{ github.workspace }}/Hepta
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Codex
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: codex
          persist-credentials: false

      - name: Check out pinned HIA compiler
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 0de5657a80f96b138525ac7ee9ce11712a83a10d
          path: Hepta
          persist-credentials: false

      - name: Prepare Rust oracle and production caller compiler
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.1 clippy
          rustc_path="$(rustup which --toolchain 1.96.1 rustc)"
          test -x "$rustc_path"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=1.96.1" >> "$GITHUB_ENV"
          echo "CODEX_HIA_NATIVE_LIB_DIR=$RUNNER_TEMP/hia-native" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hia-cargo-target" >> "$GITHUB_ENV"
          {
            "$rustc_path" --version
            cargo +1.96.1 clippy --version
            python3 --version
            ld --version
            git -C codex rev-parse HEAD
            git -C Hepta rev-parse HEAD
          } > "$RUNNER_TEMP/hia-toolchain.log"
          cat "$RUNNER_TEMP/hia-toolchain.log"

      - name: Rebuild compiler generations and native components
        id: build
        run: |
          set -euo pipefail
          python3 -B codex/hia/build.py \
            --hepta-root "$HEPTA_SOURCE" \
            --output "$RUNNER_TEMP/hia-native" \
            2>&1 | tee "$RUNNER_TEMP/hia-build.log"

      - name: Configure exact unified formatter compiler receipts
        id: unified_policy_config
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/prepare_unified_diff_policy.py \
            --repo "$GITHUB_WORKSPACE/codex" --rustc "$RUSTC" \
            --config "$RUNNER_TEMP/unified-policy/config.json" \
            --receipt-root "$RUNNER_TEMP/unified-policy/receipts" \
            --bind-input "$RUNNER_TEMP/hia-native/build.json" \
            --report "$RUNNER_TEMP/unified-policy/configuration-report.json" \
            --github-env "$GITHUB_ENV" \
            2>&1 | tee "$RUNNER_TEMP/unified-policy-configuration.log"

      - name: Verify complete unified formatter ABI and original components
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_unified_diff_abi.py \
            --repo "$GITHUB_WORKSPACE/codex" \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --output-dir "$RUNNER_TEMP/unified-component-gate" \
            --report "$RUNNER_TEMP/unified-component-report.json" \
            2>&1 | tee "$RUNNER_TEMP/unified-component-gate.log"

      - name: Verify unified formatter source and archive receipts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module unified_diff \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/unified-component-receipts.json" \
            2>&1 | tee "$RUNNER_TEMP/unified-component-receipts.log"

      - name: Verify UUID byte matching and atomic no-write contracts
        id: uuid_abi
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_uuid_find_abi.py \
            --producer "$GITHUB_WORKSPACE/codex" \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-uuid-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-uuid-abi.log"

      - name: Verify UUID source and archive receipts
        id: uuid_receipt
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module uuid_find \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-uuid-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-uuid-receipt.log"

      - name: Verify standalone continuation and no-write contracts
        id: standalone_abi
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_patch_standalone_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-patch-standalone-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-patch-standalone-abi.log"

      - name: Verify standalone source and archive receipts
        id: standalone_receipts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module patch_standalone \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-patch-standalone-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-patch-standalone-receipt.log"

      - name: Verify application continuation and no-write contracts
        id: application_abi
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_patch_application_abi.py \
            --producer "$GITHUB_WORKSPACE/codex" \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-patch-application-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-patch-application-abi.log"

      - name: Verify application source and archive receipts
        id: application_receipts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module patch_application \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-patch-application-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-patch-application-receipt.log"

      - name: Verify summary continuation and no-write contracts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_patch_summary_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-patch-summary-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-patch-summary-abi.log"

      - name: Verify summary source and archive receipts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module patch_summary \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-patch-summary-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-patch-summary-receipt.log"

      - name: Verify patch-effect frames and committed-state contracts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_patch_effects_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-patch-effects-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-patch-effects-abi.log"

      - name: Verify patch-effect source and archive receipts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module patch_effects \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-patch-effects-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-patch-effects-receipt.log"

      - name: Verify file-update frame and no-write contracts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_file_update_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-file-update-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-file-update-abi.log"

      - name: Verify file-update source and archive receipts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module file_update \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-file-update-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-file-update-receipt.log"

      - name: Verify pinned word-memory language contracts
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: Hepta
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_hia_word_memory \
            2>&1 | tee "$RUNNER_TEMP/hia-word-memory.log"

      - name: Verify Cargo build receipts and reject stale artifacts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -x "$RUSTC"
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-build-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-build-receipt.log"

      - name: Compare HIA search with original Rust implementation
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -x "$RUSTC"
          python3 -B codex/hia/tests/test_seek_sequence.py \
            --library "$RUNNER_TEMP/hia-native/seek_sequence.so" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-seek-sequence.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-seek-sequence.log"

      - name: Verify typed scalar admission and unchanged Cargo receipt checks
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_scalar_build_admission.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-scalar-admission.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-scalar-admission.log"
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module token_budget \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-scalar-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-scalar-receipt.log"

      - name: Compare HIA UTF-8 boundaries with Rust and Core VM
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          CODEX_HIA_UTF8_SHARED: ${{ runner.temp }}/hia-native/utf8_boundaries.so
        run: |
          set -euo pipefail
          test -x "$RUSTC"
          status=0
          python3 -B codex/hia/tests/test_utf8_boundaries.py \
            > "$RUNNER_TEMP/hia-utf8-boundaries.json" \
            2> "$RUNNER_TEMP/hia-utf8-boundaries.log" || status=$?
          cat "$RUNNER_TEMP/hia-utf8-boundaries.log"
          cat "$RUNNER_TEMP/hia-utf8-boundaries.json"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          python3 -B - "$RUNNER_TEMP/hia-utf8-boundaries.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text())
          for field in ("rust_oracle_calls", "native_calls", "vm_calls"):
              if report.get(field, 0) <= 0:
                  raise SystemExit(f"required verification was skipped: {field}")
          PY

      - name: Test statically linked native patch caller and large inputs
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          libdir="$RUNNER_TEMP/hia-native"
          test -f "$libdir/libcodex_hia_seek_sequence.a"
          {
            "$RUSTC" --edition=2024 --test --cfg 'feature="hia-native"' \
              codex/hia/tests/native_patch_caller.rs \
              -L "native=$libdir" -l static=codex_hia_seek_sequence \
              -o "$RUNNER_TEMP/hia-patch-caller-tests"
            "$RUNNER_TEMP/hia-patch-caller-tests" --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/hia-patch-caller.log"

      - name: Compare native SourceFile with the complete original Rust owner
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_native_source_file_caller.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-source-file-caller.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-source-file-caller.log"

      - name: Verify SourceFile frame and no-write contracts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_source_file_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-source-file-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-source-file-abi.log"

      - name: Verify SourceFile archive and source admission
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module source_file \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-source-file-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-source-file-receipt.log"

      - name: Compare native batch and streaming parsers with the complete original Rust owner
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_native_parser_caller.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-parser-caller.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-parser-caller.log"

      - name: Verify actual parser host dependencies and reject incomplete receipts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_parser_host_receipt.py \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-parser-host-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-parser-host-receipt.log"

      - name: Verify parser framing and committed-error-state contracts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_parser_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-parser-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-parser-abi.log"

      - name: Verify parser archive and source admission
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_build_receipt.py \
            --artifacts "$RUNNER_TEMP/hia-native" \
            --mutation-module parser \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-parser-receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-parser-receipt.log"

      - name: Test statically linked native string caller and allocation behavior
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -x "$RUSTC"
          python3 -B codex/hia/tests/test_native_string_caller.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-string-caller.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-string-caller.log"

      - name: Compare native metric sanitizer with the original Rust caller
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -x "$RUSTC"
          python3 -B codex/hia/tests/test_native_metric_caller.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-metric-caller.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-metric-caller.log"

      - name: Verify metric sanitizer streaming state and buffer contract
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_metric_tag_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-metric-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-metric-abi.log"

      - name: Compare native markdown location formatting with original Rust
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -x "$RUSTC"
          python3 -B codex/hia/tests/test_native_markdown_caller.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-markdown-caller.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-markdown-caller.log"

      - name: Verify markdown location streaming and error contracts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_markdown_location_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-markdown-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-markdown-abi.log"

      - name: Install pinned repository test runners
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Test both production crates with HIA enabled
        if: ${{ always() && steps.build.outcome == 'success' && steps.unified_policy_config.outcome == 'success' }}
        working-directory: codex/codex-rs
        run: |
          set -euo pipefail
          cargo build --locked -p codex-apply-patch -p codex-utils-string --features hia-native --all-targets \
            --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/unified-all-targets.jsonl" 2> "$RUNNER_TEMP/unified-all-targets.stderr"
          python3 -B ../hia/similar_policy.py --verify-cargo-log "$RUNNER_TEMP/unified-all-targets.jsonl" \
            > "$RUNNER_TEMP/unified-all-targets-admission.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["consumer_artifacts"] and all(x["policy_mode"]==0 for x in v["consumer_artifacts"])' "$RUNNER_TEMP/unified-all-targets-admission.json"
          just test -p codex-apply-patch -p codex-utils-string --features hia-native --locked \
            2>&1 | tee "$RUNNER_TEMP/hia-native-crates.log"
          cargo build --locked -p codex-apply-patch -p codex-utils-string --features hia-native --all-targets \
            --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/unified-all-targets-cached.jsonl" 2> "$RUNNER_TEMP/unified-all-targets-cached.stderr"
          python3 -B ../hia/similar_policy.py --verify-cargo-log "$RUNNER_TEMP/unified-all-targets-cached.jsonl" \
            > "$RUNNER_TEMP/unified-all-targets-cached-admission.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["consumer_artifacts"] and all(x["policy_mode"]==0 and x["cargo_fresh"] for x in v["consumer_artifacts"])' "$RUNNER_TEMP/unified-all-targets-cached-admission.json"

      - name: Compare actual native and original ASCII JSON callers
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_native_ascii_json_caller.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-ascii-json-caller.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-ascii-json-caller.log"

      - name: Verify ASCII JSON window and error contracts
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_ascii_json_abi.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --report "$RUNNER_TEMP/hia-ascii-json-abi.json" \
            2>&1 | tee "$RUNNER_TEMP/hia-ascii-json-abi.log"

      - name: Compare native truncation APIs with the original Rust source
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_native_truncate_caller.py \
            --library-dir "$RUNNER_TEMP/hia-native" \
            --rustc "$RUSTC" \
            --report "$RUNNER_TEMP/hia-truncate-caller.json" \
