          # disable the host-wide AppArmor restriction or change Codex's sandbox.
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          sudo apparmor_parser -Q -T "$profile"
          sudo apparmor_parser -r "$profile"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          # Fail before the owner suite if user or network namespaces cannot
