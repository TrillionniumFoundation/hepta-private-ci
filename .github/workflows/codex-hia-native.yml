          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["consumer_artifacts"] and all(x["policy_mode"]==0 for x in v["consumer_artifacts"])' "$RUNNER_TEMP/unified-owner-clippy-admission.json"
          env -u CODEX_HIA_NATIVE_LIB_DIR cargo clippy --locked --all-targets \
            -p codex-apply-patch -p codex-utils-string -p codex-utils-template -p codex-execpolicy -p codex-utils-output-truncation -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/hia-default-owner-clippy.log"

      - name: Run scoped native owner fixes without source drift
        if: ${{ always() && steps.build.outcome == 'success' && steps.unified_policy_config.outcome == 'success' }}
        working-directory: codex/codex-rs
        run: |
          set -euo pipefail
          CODEX_HIA_POLICY_FIX_REQUIRE_NATIVE=1 \
          CODEX_HIA_POLICY_FIX_REPORT="$RUNNER_TEMP/unified-policy/fix.json" \
            just fix --locked -p codex-apply-patch --features hia-native \
            2>&1 | tee "$RUNNER_TEMP/hia-native-owner-fix.log"
          python3 - "$RUNNER_TEMP/unified-policy/fix.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          assert value["passed"] and value["require_native"]
          assert value["all_subcompilers_succeeded"] and value["source_inputs_unchanged"]
          assert value["actual_native_helper_calls"] > 0
          assert value["consumer_artifacts"]
          assert all(row["policy_mode"] == 0 for row in value["consumer_artifacts"])
          PY
          git diff --exit-code
          cargo clippy --locked --all-targets -p codex-apply-patch --features hia-native \
            --message-format=json-render-diagnostics -- -D warnings \
            > "$RUNNER_TEMP/unified-after-fix.jsonl" 2> "$RUNNER_TEMP/unified-after-fix.stderr"
          python3 -B ../hia/similar_policy.py --verify-cargo-log "$RUNNER_TEMP/unified-after-fix.jsonl" \
            > "$RUNNER_TEMP/unified-after-fix-admission.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["consumer_artifacts"] and all(x["policy_mode"]==0 for x in v["consumer_artifacts"])' "$RUNNER_TEMP/unified-after-fix-admission.json"

      - name: Fix native string and template owners with actual compiler evidence
        if: ${{ always() && steps.build.outcome == 'success' && steps.unified_policy_config.outcome == 'success' }}
        working-directory: codex/codex-rs
        run: |
          set -euo pipefail
          export GIT_OPTIONAL_LOCKS=0
          python3 -B ../hia/tests/verify_scoped_owner_fix.py snapshot \
            --producer "$GITHUB_WORKSPACE/codex" \
            --report "$RUNNER_TEMP/hia-string-template-source-before.json"
          cargo metadata --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/hia-string-template-metadata.json" 2> "$RUNNER_TEMP/hia-string-template-metadata.stderr"
          CODEX_HIA_POLICY_FIX_REQUIRE_NATIVE=0 \
          CODEX_HIA_POLICY_FIX_REPORT="$RUNNER_TEMP/hia-string-template-fix.json" \
            just fix --locked --all-targets -p codex-utils-string -p codex-utils-template \
              --features codex-utils-string/hia-native,codex-utils-template/hia-native \
            2>&1 | tee "$RUNNER_TEMP/hia-string-template-fix.log"
          python3 -B ../hia/tests/verify_scoped_owner_fix.py verify \
            --producer "$GITHUB_WORKSPACE/codex" \
            --before "$RUNNER_TEMP/hia-string-template-source-before.json" \
            --fix-report "$RUNNER_TEMP/hia-string-template-fix.json" \
            --metadata "$RUNNER_TEMP/hia-string-template-metadata.json" \
            --report "$RUNNER_TEMP/hia-string-template-fix-validation.json"
          just fmt 2>&1 | tee "$RUNNER_TEMP/hia-string-template-format.log"
          python3 -B ../hia/tests/verify_scoped_owner_fix.py unchanged \
            --producer "$GITHUB_WORKSPACE/codex" \
            --before "$RUNNER_TEMP/hia-string-template-source-before.json" \
            --report "$RUNNER_TEMP/hia-string-template-source-after.json"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload original build and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-hia-current37-results
