name: Learning operator optimization materializer

on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths:
      - '.github/workflows/learning-operator-materialize.yml'
      - '.github/learning-operator-materialize/**'

permissions:
  contents: write

concurrency:
  group: learning-operator-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: codex/learning-operator-full-convergence-20260926
      PAYLOAD_SHA256: b24f94f4c6432844cdfc0d6840d876b25d7e49bd39d6f4b4ff8256d44d2ca179
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Materialize, verify, and publish the optimization commits
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cat .github/learning-operator-materialize/chunk-* > "$work/payload.b64"
          base64 --decode "$work/payload.b64" > "$work/payload.tar.gz"
          echo "$PAYLOAD_SHA256  $work/payload.tar.gz" | sha256sum --check --status
          tar -xzf "$work/payload.tar.gz" -C "$work"

          cp -a "$work/payload/source/." .
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-bellman-operator
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-bellman-operator -- --check
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --no-deps \
            -p codex-hepta-bellman-operator --all-targets -- -D warnings
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator
          git diff --check

          git config user.name learning-operator-materializer
          git config user.email learning-operator-materializer@users.noreply.github.com
          git add \
            codex-rs/hepta-bellman-operator/src/admission.rs \
            codex-rs/hepta-bellman-operator/src/dataset_bound.rs \
            codex-rs/hepta-bellman-operator/src/row_commitment.rs \
            codex-rs/hepta-bellman-operator/NATIVE_MAPPING.md
          git commit -m 'perf(learning.operator): reuse verified row commitments'

          python3 scripts/hepta-implementation-maps.py migrate \
            --module learning.operator --module learning.eval
          cp -a "$work/payload/docs/." .
          rm -rf .github/learning-operator-materialize
          rm -f .github/workflows/learning-operator-materialize.yml

          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          git diff --check
          git add -A -- \
            docs/modules/learning.operator/IMPLEMENTATION_MAP.json \
            docs/modules/learning.eval/IMPLEMENTATION_MAP.json \
            docs/modules/learning.operator/ADMISSION_CONTRACT.md \
            docs/modules/learning.operator/DEVELOPER_GUIDE.md \
            docs/modules/learning.operator/OPERATIONS_RUNBOOK.md \
            qualification/module-execution-dossiers/detail/learning.operator.md \
            .github/workflows/learning-operator-materialize.yml \
            .github/learning-operator-materialize
          git commit -m 'docs(learning.operator): align V3 admission and recovery'

          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
