name: Hepta shared Stem temporal video execution (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/shared_stem_cell/public_video.py"
      - "experiments/shared_stem_cell/video_temporal.py"
      - "experiments/shared_stem_cell/video_anytime.py"
      - "experiments/shared_stem_cell/video_value.py"
      - "experiments/shared_stem_cell/audit_video_value.py"
      - "experiments/shared_stem_cell/test_video_value.py"
      - "experiments/shared_stem_cell/video_cpu_proxy.py"
      - "experiments/shared_stem_cell/audit_video_cpu_proxy.py"
      - "experiments/shared_stem_cell/test_video_cpu_proxy.py"
      - "experiments/shared_stem_cell/VIDEO_CPU_PROXY.md"
      - "experiments/shared_stem_cell/VIDEO_CPU_TUNE.md"
      - "experiments/shared_stem_cell/video_cpu_tune.py"
      - "experiments/shared_stem_cell/audit_video_cpu_tune.py"
      - "experiments/shared_stem_cell/test_video_cpu_tune.py"
      - "experiments/shared_stem_cell/video_batch.py"
      - "experiments/shared_stem_cell/video_batch_calibration.py"
      - "experiments/shared_stem_cell/audit_video_batch_calibration.py"
      - "experiments/shared_stem_cell/test_video_batch_calibration.py"
      - "experiments/shared_stem_cell/test_video_batch.py"
      - "experiments/shared_stem_cell/audit_video_batch.py"
      - "experiments/shared_stem_cell/audit_video_anytime.py"
      - "experiments/shared_stem_cell/test_video_anytime.py"
      - "experiments/shared_stem_cell/test_public_video.py"
      - "experiments/shared_stem_cell/test_video_temporal.py"
      - "experiments/shared_stem_cell/media_execution.py"
      - "experiments/shared_stem_cell/execution.py"
      - ".github/workflows/hepta-shared-stem-video.yml"
permissions:
  contents: read
concurrency:
  group: shared-stem-video-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  public-temporal-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact research source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolated video runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hepta-video-env"
          PY="$RUNNER_TEMP/hepta-video-env/bin/python"
          "$PY" -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          "$PY" -m pip install transformers==4.57.1 numpy==2.2.6 safetensors==0.7.0 psutil==7.1.0 pillow==12.3.0 packaging==24.2 av==14.4.0 ruff==0.14.0
      - name: Actual frozen CLIP temporal-order study
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          USE_TF: "0"
          TOKENIZERS_PARALLELISM: "false"
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-video-env/bin/python"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-video-source.txt"
          "$PY" -m pip freeze >> "$RUNNER_TEMP/hepta-video-source.txt"
          "$PY" -m ruff check --select F,E9 experiments/shared_stem_cell/{public_video,video_temporal,video_anytime,video_value,video_batch,video_cpu_proxy,audit_video_cpu_proxy,test_video_cpu_proxy,video_cpu_tune,audit_video_cpu_tune,test_video_cpu_tune,video_batch_calibration,audit_video_anytime,audit_video_value,audit_video_batch,audit_video_batch_calibration,test_video_batch,test_video_batch_calibration,test_public_video,test_video_temporal,test_video_anytime,test_video_value}.py
          "$PY" -m unittest -v experiments.shared_stem_cell.test_public_video experiments.shared_stem_cell.test_video_temporal experiments.shared_stem_cell.test_video_anytime experiments.shared_stem_cell.test_video_value experiments.shared_stem_cell.test_video_batch experiments.shared_stem_cell.test_video_batch_calibration experiments.shared_stem_cell.test_video_cpu_proxy experiments.shared_stem_cell.test_video_cpu_tune experiments.shared_stem_cell.test_media_execution experiments.shared_stem_cell.hf_integration_checks 2>&1 | tee "$RUNNER_TEMP/hepta-video-tests.log"
          "$PY" -m experiments.shared_stem_cell.public_video --output "$RUNNER_TEMP/hepta-video-study" 2>&1 | tee "$RUNNER_TEMP/hepta-video-execution.log"
          "$PY" -m experiments.shared_stem_cell.video_anytime --manifest "$RUNNER_TEMP/hepta-video-study/manifest.json" --output "$RUNNER_TEMP/hepta-video-study/anytime" 2>&1 | tee "$RUNNER_TEMP/hepta-video-anytime.log"
          "$PY" -m experiments.shared_stem_cell.audit_video_anytime --root "$RUNNER_TEMP/hepta-video-study" | tee "$RUNNER_TEMP/hepta-video-anytime-audit.log"
          "$PY" -m experiments.shared_stem_cell.video_value --manifest "$RUNNER_TEMP/hepta-video-study/manifest.json" --output "$RUNNER_TEMP/hepta-video-study/value" --microbatch-shadow 2>&1 | tee "$RUNNER_TEMP/hepta-video-value.log"
          "$PY" -m experiments.shared_stem_cell.audit_video_value --root "$RUNNER_TEMP/hepta-video-study" | tee "$RUNNER_TEMP/hepta-video-value-audit.log"
          "$PY" -m experiments.shared_stem_cell.audit_video_batch --root "$RUNNER_TEMP/hepta-video-study" | tee "$RUNNER_TEMP/hepta-video-batch-audit.log"
          "$PY" -m experiments.shared_stem_cell.audit_video_batch_calibration --root "$RUNNER_TEMP/hepta-video-study" | tee "$RUNNER_TEMP/hepta-video-batch-calibration-audit.log"
          # CPU Conv2d is a deliberately UNTRAINED physical-compute proxy, not CLIP.
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 "$PY" -m experiments.shared_stem_cell.video_cpu_proxy --root "$RUNNER_TEMP/hepta-video-study" --output "$RUNNER_TEMP/hepta-video-study/cpu-proxy" --rounds 5 2>&1 | tee "$RUNNER_TEMP/hepta-video-cpu-proxy.log"
          "$PY" -m experiments.shared_stem_cell.audit_video_cpu_proxy --root "$RUNNER_TEMP/hepta-video-study" --output "$RUNNER_TEMP/hepta-video-study/cpu-proxy" | tee "$RUNNER_TEMP/hepta-video-cpu-proxy-audit.log"
          # Label-blind calibration of microbatch size on different source videos.
          # Whole study trains its own frozen-proxy Reader and charges all arms.
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 "$PY" -m experiments.shared_stem_cell.video_cpu_tune --root "$RUNNER_TEMP/hepta-video-study" --output "$RUNNER_TEMP/hepta-video-study/cpu-tune" --calibration-rounds 3 --evaluation-rounds 5 2>&1 | tee "$RUNNER_TEMP/hepta-video-cpu-tune.log"
          "$PY" -m experiments.shared_stem_cell.audit_video_cpu_tune --root "$RUNNER_TEMP/hepta-video-study" --output "$RUNNER_TEMP/hepta-video-study/cpu-tune" | tee "$RUNNER_TEMP/hepta-video-cpu-tune-audit.log"
          git diff --exit-code
      - name: Retain reports and failures, never source/derived media or weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-video-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-video-source.txt
            ${{ runner.temp }}/hepta-video-tests.log
            ${{ runner.temp }}/hepta-video-execution.log
            ${{ runner.temp }}/hepta-video-anytime.log
            ${{ runner.temp }}/hepta-video-anytime-audit.log
            ${{ runner.temp }}/hepta-video-value.log
            ${{ runner.temp }}/hepta-video-value-audit.log
            ${{ runner.temp }}/hepta-video-batch-audit.log
            ${{ runner.temp }}/hepta-video-batch-calibration-audit.log
            ${{ runner.temp }}/hepta-video-cpu-proxy.log
            ${{ runner.temp }}/hepta-video-cpu-proxy-audit.log
            ${{ runner.temp }}/hepta-video-cpu-tune.log
            ${{ runner.temp }}/hepta-video-cpu-tune-audit.log
            ${{ runner.temp }}/hepta-video-study/*.json
            ${{ runner.temp }}/hepta-video-study/*.jsonl
            ${{ runner.temp }}/hepta-video-study/SOURCE-README.txt
            ${{ runner.temp }}/hepta-video-study/execution
            ${{ runner.temp }}/hepta-video-study/anytime
            ${{ runner.temp }}/hepta-video-study/value
            ${{ runner.temp }}/hepta-video-study/cpu-proxy
            ${{ runner.temp }}/hepta-video-study/cpu-tune
            ${{ runner.temp }}/hepta-video-study/vision/model-source.json
            ${{ runner.temp }}/hepta-video-study/vision/verified-publisher-files.json
          if-no-files-found: warn
