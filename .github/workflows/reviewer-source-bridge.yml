name: Reviewer source bridge

# Exact reviewer workspace export refresh: 2026-09-25 shared learning continuation
on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/reviewer-source-bridge.yml

permissions:
  contents: read

jobs:
  export:
    name: Export exact reviewer workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Export exact workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          archive="$RUNNER_TEMP/reviewer-source-${GITHUB_SHA}.tar.gz"
          tar --exclude=.git -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Upload exact workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewer-source-${{ github.sha }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  ledger-source-verification:
    name: Ledger continuation (${{ matrix.source }})
    if: contains(github.event.head_commit.message, '[ledger-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        source: [source-head, synthetic-merge]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind source identity and ordered-parent merge
        shell: bash
        env:
          SOURCE_MODE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ledger-verification"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$SOURCE_MODE" == synthetic-merge ]]; then
            git fetch --no-tags origin main
            base=$(git rev-parse FETCH_HEAD)
            git checkout --detach "$base"
            git -c user.name=ledger-review -c user.email=ledger-review@invalid merge --no-ff --no-commit "$GITHUB_SHA"
            tree=$(git write-tree)
            merge=$(GIT_AUTHOR_NAME=ledger-review GIT_AUTHOR_EMAIL=ledger-review@invalid GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_NAME=ledger-review GIT_COMMITTER_EMAIL=ledger-review@invalid GIT_COMMITTER_DATE=2000-01-01T00:00:00Z git commit-tree "$tree" -p "$base" -p "$GITHUB_SHA" -m 'deterministic ledger verification merge')
            git checkout --detach "$merge"
            printf 'base=%s\n' "$base" > "$out/base.txt"
          fi
          { printf 'candidate=%s\n' "$GITHUB_SHA"; git rev-parse HEAD HEAD^{tree}; git rev-list --parents -n 1 HEAD; } > "$out/source.txt"
      - name: Install pinned repository tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Existing package regressions including new trust cases
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-learning-ledger --retries 0 --test-threads 2 2>&1 | tee "$RUNNER_TEMP/ledger-verification/tests.log"
      - name: Strict all-target ledger lint
        if: always()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-learning-ledger --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/ledger-verification/clippy.log"
      - name: Formatting without mutation
        if: always()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-learning-ledger -- --check 2>&1 | tee "$RUNNER_TEMP/ledger-verification/fmt.log"
          git diff --exit-code
      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledger-verification-${{ github.sha }}-${{ matrix.source }}
          path: ${{ runner.temp }}/ledger-verification/
          retention-days: 7
          if-no-files-found: error
