name: tmp-global-gap-convergence-r2

on:
  push:
    branches:
      - ops/lane-f-final-source-export-20260910
    paths:
      - .github/workflows/tmp-global-gap-convergence-r2.yml

permissions:
  contents: write

env:
  FOUNDATION_BRANCH: codex/hepta-all-gap-closure-20260908
  CANDIDATE_BRANCH: integration/hepta-seven-lane-gap-closure-20260910-r2

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Allow branch seals to settle
        shell: bash
        run: sleep 180

      - name: Check out carrier and all refs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Build exact current-head candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          foundation="refs/remotes/origin/${FOUNDATION_BRANCH}"
          git rev-parse --verify "${foundation}^{commit}"
          git switch --detach "${foundation}"
          git switch -C "${CANDIDATE_BRANCH}"

          mkdir -p qualification/convergence
          receipt=qualification/convergence/SEVEN_LANE_SOURCE_HEADS.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("qualification/convergence/SEVEN_LANE_SOURCE_HEADS.json").write_text(
              json.dumps({"schema": "hepta.seven-lane-source-heads.v1", "sources": []}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          add_receipt() {
            local role="$1" branch="$2" sha="$3"
            python3 - "${receipt}" "${role}" "${branch}" "${sha}" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["sources"].append({"role": sys.argv[2], "branch": sys.argv[3], "sha": sys.argv[4]})
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          }

          add_receipt foundation "${FOUNDATION_BRANCH}" "$(git rev-parse HEAD)"

          latest_matching() {
            local pattern="$1"
            git for-each-ref --sort=-committerdate --format='%(refname:strip=3)' refs/remotes/origin/codex |
              grep -Ei "${pattern}" | head -n 1 || true
          }

          declare -a selected=(
            'codex/hepta-native-source-closed-world-20260909'
          )

          choose_lane() {
            local lane="$1" preferred="$2" fallback_pattern="$3" branch=''
            if [[ -n "${preferred}" ]] && git show-ref --verify --quiet "refs/remotes/origin/${preferred}"; then
              branch="${preferred}"
            else
              branch="$(latest_matching "${fallback_pattern}")"
            fi
            if [[ -n "${branch}" ]]; then
              selected+=("${branch}")
              add_receipt "lane-${lane}" "${branch}" "$(git rev-parse "refs/remotes/origin/${branch}")"
            else
              add_receipt "lane-${lane}" 'FOUNDATION_OR_MISSING' '0000000000000000000000000000000000000000'
            fi
          }

          choose_lane a 'codex/lane-a-gap-closure-20260910' 'lane-a.*20260910|20260910.*lane-a'
          choose_lane b 'codex/hepta-lane-b-gap-closure-20260910' 'lane-b.*20260910|20260910.*lane-b'
          choose_lane c 'codex/lane-c-full-gap-closure-20260910' 'lane-c.*20260910|20260910.*lane-c'
          choose_lane d '' 'lane-d.*20260910|20260910.*lane-d'
          choose_lane e 'codex/hepta-lane-e-gap-closure-20260910' 'lane-e.*20260910|20260910.*lane-e'
          choose_lane f 'codex/lane-f-gap-closure-20260910' 'lane-f.*20260910|20260910.*lane-f'
          choose_lane g '' 'lane-g.*20260910|20260910.*lane-g'

          declare -A seen=()
          for branch in "${selected[@]}"; do
            [[ -n "${seen[${branch}]:-}" ]] && continue
            seen["${branch}"]=1
            ref="refs/remotes/origin/${branch}"
            git rev-parse --verify "${ref}^{commit}"
            add_receipt merge "${branch}" "$(git rev-parse "${ref}")"
            if git merge --no-ff --no-edit "${ref}"; then
              continue
            fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            safe=1
            for file in "${conflicts[@]}"; do
              case "${file}" in
                docs/STATUS.md|qualification/module-execution-dossiers/NATIVE_BINDINGS.json|qualification/convergence/SEVEN_LANE_SOURCE_HEADS.json)
                  git checkout --ours -- "${file}"
                  git add "${file}"
                  ;;
                *)
                  echo "UNRESOLVED_SOURCE_CONFLICT ${branch} ${file}" >&2
                  safe=0
                  ;;
              esac
            done
            if [[ "${safe}" != 1 ]]; then
              git merge --abort || true
              exit 51
            fi
            git commit --no-edit
          done

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          bindings = root / "qualification/module-execution-dossiers/NATIVE_BINDINGS.json"
          data = json.loads(bindings.read_text(encoding="utf-8"))
          rows = data.get("observations")
          if not isinstance(rows, list) or len(rows) != 40:
              raise SystemExit("native source closed world is not exactly 40 modules")
          modules: set[str] = set()
          for row in rows:
              module = row.get("module")
              source_path = row.get("path")
              if not isinstance(module, str) or module in modules:
                  raise SystemExit(f"duplicate or invalid module {module!r}")
              modules.add(module)
              if not isinstance(source_path, str):
                  raise SystemExit(f"missing source path for {module}")
              source = root / source_path
              if not source.is_file():
                  raise SystemExit(f"missing source file {source_path}")
              payload = source.read_bytes()
              row["blobSha"] = hashlib.sha1(
                  f"blob {len(payload)}\0".encode("ascii") + payload,
                  usedforsecurity=False,
              ).hexdigest()
          bindings.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          readme = root / "qualification/lane-b/README.md"
          if readme.is_file():
              text = readme.read_text(encoding="utf-8").replace(
                  "python3 scripts/hepta-lane-b-docs.py\n",
                  "python3 scripts/hepta-lane-b-docs.py verify\n",
              )
              readme.write_text(text, encoding="utf-8")

          composition = root / "docs/readiness/LANE_B_RUNTIME_COMPOSITION.md"
          if composition.is_file():
              text = composition.read_text(encoding="utf-8")
              sentence = "Production activation remains unproved and false at this repository-controlled boundary.\n\n"
              if sentence not in text:
                  anchor = "The following claims remain false until exact evidence is committed and independently issued where required:\n\n"
                  if text.count(anchor) != 1:
                      raise SystemExit("Lane B claim-boundary anchor drifted")
                  text = text.replace(anchor, sentence + anchor, 1)
              composition.write_text(text, encoding="utf-8")
          PY

          find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -delete
          find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yaml' -delete

          python3 scripts/hepta-readiness.py generate-status || true
          python3 scripts/hepta-implementation-dossiers.py generate-status || true
          python3 scripts/hepta-algorithm-docs.py generate-status || true
          python3 scripts/hepta-cns.py generate-status || true
          python3 scripts/hepta-docs.py generate-status || true

          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'chore(convergence): bind sealed seven-lane source heads'
          fi
          test -z "$(git status --porcelain)"

          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          if [[ -f scripts/hepta-lane-b-truth.py ]]; then
            python3 scripts/hepta-lane-b-truth.py self-test
            python3 -m unittest scripts/test_hepta_lane_b_truth.py
            python3 scripts/hepta-lane-b-truth.py verify
            python3 scripts/hepta-lane-b-docs.py verify
          fi
          git diff --check
          test -z "$(git status --porcelain)"

          git push --force-with-lease origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
