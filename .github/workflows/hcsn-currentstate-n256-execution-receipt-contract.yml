name: hcsn-currentstate-n256-execution-receipt-contract

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_execution_receipt_contract/**"
      - ".github/workflows/hcsn-currentstate-n256-execution-receipt-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled receipt fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_execution_receipt_contract.test_receipt_contract -v
      - name: Optimized receipt fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_execution_receipt_contract.test_receipt_contract -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_execution_receipt_contract/*.py
      - name: Verify exact frozen source and inherited originals
        run: python3 -m qualification.hcsn_currentstate_n256_execution_receipt_contract.verify_source
