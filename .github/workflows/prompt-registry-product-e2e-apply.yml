name: Prompt registry product E2E apply

on:
  push:
    branches: [codex/prompt-registry-remediation-20260927]
    paths:
      - "scripts/apply-prompt-registry-product-e2e-closure.py"
      - ".github/workflows/prompt-registry-product-e2e-apply.yml"

permissions:
  contents: write

concurrency:
  group: prompt-registry-product-e2e-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt

      - name: Apply product revocation closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-prompt-registry-product-e2e-closure.py
          python3 scripts/apply-prompt-registry-product-e2e-closure.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-agentd \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer
          git diff --check

      - name: Validate machine-readable claim boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/modules/prompt.registry/IMPLEMENTATION_MAP.json').read_text())
          assert data['productionImplementation'] is True
          assert data['claimBoundary']['activation'] is True
          assert data['claimBoundary']['independentAcceptance'] is False
          assert data['claimBoundary']['release'] is False
          assert any(op['nativeSymbol'] == 'AgentdPromptPipelineOwner::revoke_factor' for op in data['operations'])
          PY

      - name: Commit exact source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex-rs/hepta-agentd/src/prompt_runtime.rs \
            codex-rs/hepta-agentd/src/prompt_runtime_tests.rs \
            docs/modules/prompt.registry/IMPLEMENTATION_MAP.json \
            docs/modules/prompt.registry/QUALIFICATION_STATUS.md \
            qualification/module-execution-dossiers/detail/prompt.registry.md \
            .github/workflows/hepta-prompt-registry-qualification.yml \
            .github/workflows/prompt-registry-map-refresh.yml
          git commit -m "prompt.registry: close revoke-before-send restart E2E [prompt-registry-product-e2e]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
