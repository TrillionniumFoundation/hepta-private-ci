name: tmp-all-lanes-convergence-r2-20260910

on:
  push:
    branches:
      - codex/hepta-all-gap-closure-20260908
    paths:
      - .github/workflows/tmp-all-lanes-convergence-r2-20260910.yml

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: tmp-all-lanes-convergence-r2-20260910
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/all-lanes-gap-closure-20260910-r2

jobs:
  construct-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out controller carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Construct ordered candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          carrier="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^)"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git switch --detach "$base"
          git switch -c "$TARGET_BRANCH"

          merge_if_present() {
            branch="$1"
            if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              echo "SKIP $branch"
              return 0
            fi
            echo "MERGE $branch $(git rev-parse "refs/remotes/origin/${branch}")"
            if git merge --no-ff --no-edit "refs/remotes/origin/${branch}"; then
              return 0
            fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/tmp-*.yml)
                  git rm -f -- "$path"
                  ;;
                qualification/module-execution-dossiers/NATIVE_BINDINGS.json|docs/STATUS.md)
                  git checkout --ours -- "$path" && git add -- "$path"
                  ;;
                qualification/*/STATUS.json|qualification/*/*_STATUS.json|docs/generated/*)
                  git checkout --ours -- "$path" && git add -- "$path"
                  ;;
                *)
                  echo "CODE_CONFLICT $branch $path" >&2
                  git merge --abort || true
                  exit 1
                  ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit
          }

          choose_lane() {
            lane="$1"; shift
            chosen=""
            for branch in "$@"; do
              if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
                if test -n "$chosen"; then
                  echo "MULTIPLE_${lane}_CANDIDATES $chosen $branch" >&2
                  exit 1
                fi
                chosen="$branch"
              fi
            done
            if test -n "$chosen"; then
              merge_if_present "$chosen"
            else
              echo "NO_DEDICATED_${lane}_BRANCH"
            fi
          }

          merge_if_present codex/hepta-native-source-closed-world-20260909
          choose_lane A codex/lane-a-gap-closure-20260910 codex/hepta-lane-a-gap-closure-20260910
          choose_lane B codex/hepta-lane-b-gap-closure-20260910 codex/lane-b-gap-closure-20260910
          choose_lane C codex/lane-c-full-gap-closure-20260910 codex/hepta-lane-c-gap-closure-20260910
          choose_lane D codex/lane-d-gap-closure-20260910 codex/hepta-lane-d-gap-closure-20260910
          choose_lane E codex/hepta-lane-e-gap-closure-20260910 codex/lane-e-gap-closure-20260910
          choose_lane F codex/lane-f-gap-closure-20260910 codex/hepta-lane-f-gap-closure-20260910
          choose_lane G codex/lane-g-gap-closure-20260910 codex/hepta-lane-g-gap-closure-20260910

          find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -delete

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          readme = Path("qualification/lane-b/README.md")
          if readme.is_file():
              text = readme.read_text(encoding="utf-8")
              text = text.replace(
                  "python3 scripts/hepta-lane-b-docs.py\n",
                  "python3 scripts/hepta-lane-b-docs.py verify\n",
              )
              readme.write_text(text, encoding="utf-8")

          composition = Path("docs/readiness/LANE_B_RUNTIME_COMPOSITION.md")
          if composition.is_file():
              text = composition.read_text(encoding="utf-8")
              statement = "- production activation passed;\n"
              anchor = (
                  "The following claims remain false until exact evidence is committed "
                  "and independently issued where required:\n\n"
              )
              if statement not in text:
                  if text.count(anchor) != 1:
                      raise SystemExit("Lane B production-boundary anchor drifted")
                  text = text.replace(anchor, anchor + statement, 1)
              composition.write_text(text, encoding="utf-8")

          bindings = Path("qualification/module-execution-dossiers/NATIVE_BINDINGS.json")
          if bindings.is_file():
              doc = json.loads(bindings.read_text(encoding="utf-8"))
              for row in doc.get("observations", []):
                  source = Path(row["path"])
                  if not source.is_file():
                      raise SystemExit(f"missing native binding source: {source}")
                  row["blobSha"] = subprocess.check_output(
                      ["git", "hash-object", "--", str(source)], text=True
                  ).strip()
              bindings.write_text(
                  json.dumps(doc, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
              )
          PY

          python3 scripts/hepta-readiness.py generate-status || true
          python3 scripts/hepta-implementation-dossiers.py generate-status || true
          python3 scripts/hepta-algorithm-docs.py generate-status || true
          python3 scripts/hepta-cns.py generate-status || true
          python3 scripts/hepta-docs.py generate-status || true

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: normalize converged repository truth'
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          {
            echo "carrier=$carrier"
            echo "base=$base"
            echo "candidate=$(git rev-parse HEAD)"
            git log --oneline --decorate -25
          } | tee /tmp/convergence-r2.txt

      - name: Verify committed repository truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          if test -f scripts/hepta-lane-b-truth.py; then
            python3 scripts/hepta-lane-b-truth.py self-test
            python3 -m unittest scripts/test_hepta_lane_b_truth.py
            python3 scripts/hepta-lane-b-truth.py verify
            python3 scripts/hepta-lane-b-docs.py verify
          fi
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload diagnostic identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-lanes-convergence-r2-${{ github.run_id }}
          path: /tmp/convergence-r2.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish verified branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "refusing to overwrite existing target branch" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
