name: Hepta typed memory system shadow checks

on:
  push:
    branches:
      - codex/memory-system-final-20261023
    paths:
      - scripts/memory_cell_service/**
      - scripts/memory_cell_network/**
      - scripts/memory_cell_domain/**
      - scripts/memory_cell_system/**
      - .github/workflows/hepta-memory-system-shadow.yml
  pull_request:
    paths:
      - scripts/memory_cell_service/**
      - scripts/memory_cell_network/**
      - scripts/memory_cell_domain/**
      - scripts/memory_cell_system/**
      - .github/workflows/hepta-memory-system-shadow.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-memory-system-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  typed-memory-mechanisms:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/memory-system-final-20261023') ||
      (github.event_name == 'pull_request' && github.head_ref == 'codex/memory-system-final-20261023')
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Record source and install pinned CPU runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          mkdir -p "$RUNNER_TEMP/memory-system-checks"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/memory-system-checks/source.txt"
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --only-binary=:all: -r scripts/memory_cell/requirements.txt
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/memory-system-checks/runtime.txt"
      - name: Run typed source, queue, domain and physical TCP behavior tests
        run: |
          set -euo pipefail
          bash scripts/memory_cell_system/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/memory-system-checks/tests.log"
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-system-checks-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/memory-system-checks/
          if-no-files-found: error
          retention-days: 14
      - name: Confirm source unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff --exit-code
