name: tmp-v5-final-closure-controller

on:
  push:
    branches:
      - ops/lane-f-final-source-export-20260910
    paths:
      - .github/workflows/tmp-v5-final-closure-controller.yml

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

env:
  BASE_BRANCH: codex/hepta-all-gap-closure-20260908
  HEAD_BRANCH: integration/hepta-seven-lane-gap-closure-20260910-v5

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Wait for exact v5 PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            number="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${HEAD_BRANCH}" --base "${BASE_BRANCH}" --json number --jq '.[0].number // empty')"
            if [[ -n "${number}" ]]; then
              printf 'PR_NUMBER=%s\n' "${number}" >>"${GITHUB_ENV}"
              exit 0
            fi
            sleep 30
          done
          echo 'v5 candidate PR did not materialize' >&2
          exit 151

      - name: Check out exact v5 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recompute exact closure ledger
        id: gaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v5-final"
          python3 - <<'PY'
          from __future__ import annotations
          import json,os
          from collections import Counter
          from pathlib import Path
          from typing import Any
          root=Path.cwd(); statuses={'planned','source_implemented_execution_pending','source_implemented_semantic_review_pending','blocked_external'}
          ignored={'.git','node_modules','target','bazel-bin','bazel-out','bazel-testlogs'}; entries=[]
          def walk(x:Any,file:Path,pointer=''):
              if isinstance(x,dict):
                  for key,value in x.items():
                      child=f"{pointer}/{key.replace('~','~0').replace('/','~1')}"
                      if isinstance(value,str) and value in statuses:
                          identity=next((x.get(k) for k in ('id','workPackageId','packageId','module','name') if isinstance(x.get(k),str)),None)
                          entries.append({'status':value,'file':file.as_posix(),'pointer':child,'identity':identity})
                      walk(value,file,child)
              elif isinstance(x,list):
                  for index,value in enumerate(x): walk(value,file,f'{pointer}/{index}')
          for path in sorted(root.rglob('*.json')):
              if any(part in ignored for part in path.parts): continue
              try: walk(json.loads(path.read_text(encoding='utf-8')),path.relative_to(root))
              except Exception: pass
          counts=Counter(row['status'] for row in entries)
          temp=sorted(p.relative_to(root).as_posix() for p in (root/'.github/workflows').glob('tmp-*.y*ml'))
          report={
              'candidateSha':os.popen('git rev-parse HEAD').read().strip(),
              'counts':dict(sorted(counts.items())),
              'repositoryControlledOpen':counts['planned']+counts['source_implemented_execution_pending'],
              'semanticReviewOpen':counts['source_implemented_semantic_review_pending'],
              'externalOpen':counts['blocked_external'],
              'temporaryWorkflows':temp,
              'entries':entries,
              'claimBoundary':{
                  'productionActivationProved':False,
                  'independentAcceptanceProved':False,
                  'hardwareSafetyProved':False,
                  'longitudinalEfficacyProved':False,
                  'promotionOrReleaseProved':False,
              },
          }
          out=Path(os.environ['RUNNER_TEMP'])/'v5-final'/'closure.json'
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"repository={report['repositoryControlledOpen']}\n")
              handle.write(f"review={report['semanticReviewOpen']}\n")
              handle.write(f"external={report['externalOpen']}\n")
              handle.write(f"temp={len(temp)}\n")
          PY

      - name: Verify exact repository-controlled suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          if [[ -f scripts/hepta-lane-b-truth.py ]]; then
            python3 scripts/hepta-lane-b-truth.py verify
            python3 scripts/hepta-lane-b-docs.py verify
          fi
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Wait for all exact-head PR checks
        id: checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          settled=0
          for attempt in $(seq 1 360); do
            gh pr checks "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json name,state,bucket,link >"${RUNNER_TEMP}/v5-final/checks.json" 2>/dev/null || true
            read -r total pending failed <<<"$(python3 - "${RUNNER_TEMP}/v5-final/checks.json" <<'PY'
          import json,sys
          try: rows=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: rows=[]
          pending=sum(1 for r in rows if str(r.get('bucket','')).lower() in {'pending','skipping'} or str(r.get('state','')).upper() in {'QUEUED','IN_PROGRESS','PENDING','WAITING','REQUESTED'})
          failed=sum(1 for r in rows if str(r.get('bucket','')).lower() in {'fail','cancel'} or str(r.get('state','')).upper() in {'FAILURE','ERROR','TIMED_OUT','CANCELLED','ACTION_REQUIRED'})
          print(len(rows),pending,failed)
          PY
            )"
            if [[ "${total}" -gt 0 && "${pending}" -eq 0 ]]; then settled=1; break; fi
            sleep 30
          done
          test "${settled}" = 1
          printf 'total=%s\nfailed=%s\n' "${total}" "${failed}" >>"${GITHUB_OUTPUT}"

      - name: Publish decision and enable governed integration only on full closure
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OPEN: ${{ steps.gaps.outputs.repository }}
          REVIEW_OPEN: ${{ steps.gaps.outputs.review }}
          EXTERNAL_OPEN: ${{ steps.gaps.outputs.external }}
          TEMP_OPEN: ${{ steps.gaps.outputs.temp }}
          TOTAL_CHECKS: ${{ steps.checks.outputs.total }}
          FAILED_CHECKS: ${{ steps.checks.outputs.failed }}
        run: |
          set -euo pipefail
          closed=false
          if [[ "${REPOSITORY_OPEN:-1}" == 0 && "${REVIEW_OPEN:-1}" == 0 && "${EXTERNAL_OPEN:-1}" == 0 && "${TEMP_OPEN:-1}" == 0 && "${TOTAL_CHECKS:-0}" -gt 0 && "${FAILED_CHECKS:-1}" == 0 ]]; then closed=true; fi
          marker='<!-- hepta-v5-final-closure -->'
          body="${RUNNER_TEMP}/v5-final/decision.md"
          {
            echo "${marker}"
            echo '## v5 final all-gap closure decision'
            echo
            printf -- '- candidate: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- PR checks: `%s` total / `%s` failed\n' "${TOTAL_CHECKS:-unknown}" "${FAILED_CHECKS:-unknown}"
            printf -- '- repository-controlled gaps: `%s`\n' "${REPOSITORY_OPEN:-unknown}"
            printf -- '- semantic-review gaps: `%s`\n' "${REVIEW_OPEN:-unknown}"
            printf -- '- external gaps: `%s`\n' "${EXTERNAL_OPEN:-unknown}"
            printf -- '- temporary candidate workflows: `%s`\n' "${TEMP_OPEN:-unknown}"
            printf -- '- all gaps closed: **%s**\n' "${closed}"
            echo
            echo 'The controller never converts repository or CI evidence into missing independent, external, hardware, longitudinal, promotion or release authority.'
          } >"${body}"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)"
          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F "body=@${body}"
          else
            gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
          fi
          if [[ "${closed}" == true ]]; then
            gh pr ready "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
            gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --auto --merge
          else
            exit 152
          fi

      - name: Retain exact final evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-final-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/v5-final
          if-no-files-found: warn
          retention-days: 30
