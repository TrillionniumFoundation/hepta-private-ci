name: NDU four-modal portfolio research (shadow)
on:
  pull_request:
    paths:
      - 'experiments/multimodal_output_portfolio/v4/**'
      - '.github/workflows/ndu-modality-portfolio-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-portfolio:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact Git source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "verified-source-head=$EXPECTED_SOURCE_SHA"
      - name: Run bounded finite risk and resource regressions (no GPU/downloads)
        working-directory: experiments/multimodal_output_portfolio/v4
        run: |
          python3 -m unittest discover -v -p "test_*.py"
          python3 -m compileall -q portfolio.py counterfactual_audit.py information_acquisition.py snapshot_policy.py benchmark_snapshot.py factorial_admission.py registered_factorial.py registered_tail.py test_*.py
          python3 benchmark_snapshot.py
