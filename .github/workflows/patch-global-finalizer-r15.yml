name: patch-global-finalizer-r15

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/patch-global-finalizer-r15.yml

permissions:
  contents: write

concurrency:
  group: patch-global-finalizer-r15
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 88c254422aef54b78a4f3a465a24c1c47563b259
      TARGET_BRANCH: ops/hepta-global-gap-closure-controller-20260910-r1
      FINALIZER: scripts/hepta-global-finalizer-r7.py
      PATCH_SCRIPT: scripts/patch-global-finalizer-r15.py
    steps:
      - name: Check out exact one-shot source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable patch tuple
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:.github/workflows/patch-global-finalizer-r15.yml)" = "$(git hash-object .github/workflows/patch-global-finalizer-r15.yml)"
          test "$(git rev-parse HEAD:${PATCH_SCRIPT})" = "$(git hash-object "${PATCH_SCRIPT}")"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"

      - name: Apply and validate exact-source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "${PATCH_SCRIPT}"
          python3 -m py_compile "${FINALIZER}" "${PATCH_SCRIPT}"
          grep -Fq 'repair_lane_g_shared_artifacts(selected["G"])' "${FINALIZER}"
          grep -Fq 'git_text("show", f"origin/{lane_g_branch}:{relative_path}")' "${FINALIZER}"
          grep -Fq 'cumulative split implementation-contract harness was flattened' "${FINALIZER}"
          grep -Fq 'class NativeBindingCoverageTests' "${FINALIZER}"
          ! grep -Fq 'control_engineering_v2' "${FINALIZER}"
          ! grep -Fq 'implementation_contract_tests_native.py' "${FINALIZER}"
          git diff --check

      - name: Publish repaired controller and retire the writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-global-finalizer-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/patch-global-finalizer-r15.yml \
            scripts/patch-global-finalizer-r15.py \
            .github/workflows/patch-global-finalizer-r14.yml \
            scripts/patch-global-finalizer-r14.py \
            .github/workflows/patch-global-finalizer-r13.yml \
            scripts/patch-global-finalizer-r13.py
          git add "${FINALIZER}"
          git diff --cached --check
          git diff --cached --name-only | grep -Fxq "${FINALIZER}"
          git commit --signoff -m 'fix(hepta): derive Lane G shared dossiers from exact source'
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
