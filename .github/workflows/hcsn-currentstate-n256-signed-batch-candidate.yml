name: hcsn-currentstate-n256-signed-batch-candidate

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/README.md"
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/REQUEST.json"
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/REVIEW.json"
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/SOURCE_FREEZE.json"
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/__init__.py"
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/batch_candidate.py"
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/test_batch_candidate.py"
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/verify_source.py"
      - ".github/workflows/hcsn-currentstate-n256-signed-batch-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assertions-enabled shared-parse batch fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_signed_batch_candidate.test_batch_candidate
      - name: Optimized-mode shared-parse batch fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_signed_batch_candidate.test_batch_candidate
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_signed_batch_candidate/*.py
      - name: Verify frozen source and fail-closed scope
        run: python3 -m qualification.hcsn_currentstate_n256_signed_batch_candidate.verify_source
      - name: Verify frozen source in optimized mode
        run: python3 -O -m qualification.hcsn_currentstate_n256_signed_batch_candidate.verify_source
