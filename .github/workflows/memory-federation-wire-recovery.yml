name: memory federation durable host recovery

on:
  push:
    branches:
      - feat/memory-federation-wire-recovery-host-20260930
    paths:
      - codex-rs/hepta-memory-federation-wire/**
      - docs/modules/memory.federation/WIRE_RECOVERY_LAYER.md
      - .github/workflows/memory-federation-wire-recovery.yml
  pull_request:
    paths:
      - codex-rs/hepta-memory-federation-wire/**
      - docs/modules/memory.federation/WIRE_RECOVERY_LAYER.md
      - .github/workflows/memory-federation-wire-recovery.yml

permissions:
  contents: read

jobs:
  durable-host-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify durable host and client layer
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/hepta-memory-federation-wire/Cargo.toml -- --check
          cargo test --manifest-path codex-rs/hepta-memory-federation-wire/Cargo.toml --lib
          cargo test --manifest-path codex-rs/hepta-memory-federation-wire/Cargo.toml --doc
          cargo clippy --manifest-path codex-rs/hepta-memory-federation-wire/Cargo.toml --all-targets -- -D warnings
