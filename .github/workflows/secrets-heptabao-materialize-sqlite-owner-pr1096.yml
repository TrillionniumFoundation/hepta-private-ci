name: Materialize and qualify secrets.heptabao SQLite owner on PR 1096

on:
  push:
    branches:
      - codex/secrets-heptabao-full-remediation-20260927
    paths:
      - ".github/workflows/secrets-heptabao-materialize-sqlite-owner-pr1096.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-materialize-pr1096-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-qualify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify strong saga foundation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q 'seal_unreserved_operation' codex-rs/hepta-authbus/src/operation_lookup.rs
          grep -q 'registered_saga_sigkill_matrix' codex-rs/hepta-bao-adapter/src/saga_crash_tests.rs
          grep -q 'pub(crate) const CUTS: \[&str; 26\]' codex-rs/hepta-bao-adapter/src/saga_crash.rs
          grep -q 'CREATE TABLE operation_closures' codex-rs/hepta-authbus/migrations/0005_operation_closure.sql

      - name: Reconstruct and apply reviewed phase-three patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/secrets-heptabao-full-remediation-20260927
          carrier=96ff7270d83f235bb013b26bf6c324f5dfd758cd
          git fetch --no-tags origin "$carrier"
          expected_blobs=(
            1452eca6d7a5aaba7eab8b953d98366d4eb679bd
            14bd209bb861e97c97fbad14690cdea56981d2ca
            9e2c95c337a1b1d7efda694efa998bd23fffa63c
            cc21465f89217222185e4d3b72d11efd9bf23500
          )
          bundle="$RUNNER_TEMP/secrets-phase3.patch.gz.b64"
          patch="$RUNNER_TEMP/secrets-phase3.patch"
          : > "$bundle"
          for index in 0 1 2 3; do
            part=$(printf '%02d' "$index")
            path=".hepta-bootstrap/secrets-phase3/part-$part"
            actual=$(git rev-parse "$carrier:$path")
            test "$actual" = "${expected_blobs[$index]}"
            git show "$carrier:$path" >> "$bundle"
          done
          test "$(wc -c < "$bundle")" -eq 28000
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          sha256sum "$bundle" "$patch"
          git apply --check --3way "$patch"
          git apply --3way --index "$patch"

          while IFS= read -r path; do
            case "$path" in
              codex-rs/hepta-bao-adapter/*|codex-rs/hepta-authbus/*|codex-rs/state/sqlite/*|codex-rs/Cargo.toml|codex-rs/Cargo.lock|docs/modules/secrets.heptabao/*|docs/lane-a-foundation/secrets.heptabao/*|docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json|qualification/module-execution-dossiers/*|scripts/*|.github/workflows/lane-a-foundation.yml)
                ;;
              *)
                echo "phase-three patch touches unapproved path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --check
          git diff --cached --stat

      - name: Regenerate canonical module outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py --write
          python3 scripts/generate_secrets_heptabao_module.py
          git add docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/modules/secrets.heptabao/IMPLEMENTATION_MAP.json \
            docs/lane-a-foundation/secrets.heptabao/CURRENT_IMPLEMENTATION.md \
            qualification/module-execution-dossiers/detail/secrets.heptabao.md
          git diff --cached --check

      - name: Format and qualify production owner
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
          cd ..
          git add codex-rs
          git diff --cached --check
          cd codex-rs
          cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- --test-threads=1
          cargo test --locked -p codex-hepta-bao-adapter registered_saga_sigkill_matrix -- --exact --nocapture --test-threads=1
          cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=1
          cd ..
          python3 -m unittest codex-rs/hepta-bao-adapter/qa/test_qualification.py
          python3 scripts/generate_secrets_heptabao_module.py
          git diff --cached --check

      - name: Commit exact qualified owner
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/secrets-heptabao-materialize-sqlite-owner-pr1096.yml \
            .github/workflows/secrets-heptabao-apply-sqlite-owner.yml \
            .github/workflows/secrets-heptabao-full-closure-source-export.yml \
            .github/workflows/secrets-heptabao-source-export.yml \
            .github/workflows/hepta-bootstrap-apply-secrets-phase1.yml \
            .github/workflows/hepta-bootstrap-apply-secrets-remediation.yml
          rm -rf .hepta-bootstrap/secrets-phase3
          rm -f \
            .hepta-bootstrap/secrets-phase1.patch \
            .hepta-bootstrap/secrets-phase1.ready \
            .hepta-bootstrap/secrets-phase12-clippy.patch \
            .hepta-bootstrap/secrets-phase12.ready \
            .hepta-bootstrap/secrets-phase12.part-* \
            .hepta-bootstrap/run-secrets-native-remediation
          git add -A
          git diff --cached --check
          test -z "$(git status --porcelain --untracked-files=no | grep -E 'secrets-phase(1|12|3)|secrets-heptabao-(apply|materialize|source-export)' || true)"
          git config user.name "Hepta secrets owner bot"
          git config user.email "hepta-secrets-owner@users.noreply.github.com"
          git commit -m "secrets: add qualified SQLite production owner"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
