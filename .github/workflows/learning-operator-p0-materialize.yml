name: Materialize learning.operator P0 remediation

on:
  push:
    branches:
      - codex/learning-operator-full-convergence-20260926
    paths:
      - .github/workflows/learning-operator-p0-materialize.yml

permissions:
  contents: write

concurrency:
  group: learning-operator-p0-materialize
  cancel-in-progress: true

env:
  HEPTA_P0_MATERIALIZER_REVISION: "3"

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/learning-operator-full-convergence-20260926
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Apply and verify P0 remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/learning-operator-p0-materialize.py
          python3 -m py_compile scripts/hepta-lane-e-closure.py scripts/hepta-learning-eval-evidence.py
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-agentd
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-intelligence-eval \
            --features qualification-test-support \
            selector_and_rollback_are_opaque_independent_admissions \
            -- --test-threads=1
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-agentd \
            signed_runtime_consumer_e2e \
            -- --test-threads=1
          rm scripts/learning-operator-p0-materialize.py
          rm .github/workflows/learning-operator-p0-materialize.yml
          git diff --check
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add \
            scripts/hepta-lane-e-closure.py \
            scripts/hepta-learning-eval-evidence.py \
            scripts/learning-operator-p0-materialize.py \
            .github/workflows/hepta-lane-e-gap-closure.yml \
            .github/workflows/learning-operator-p0-materialize.yml \
            codex-rs/hepta-intelligence-eval/Cargo.toml \
            codex-rs/hepta-intelligence-eval/src/lib.rs \
            codex-rs/hepta-intelligence-eval/src/self_evolution_selection.rs \
            codex-rs/hepta-agentd/Cargo.toml \
            codex-rs/hepta-agentd/src/cognitive_ranker_tests.rs
          git commit -m "fix(learning.operator): close verifier and evaluated runtime admission"
          git push origin HEAD:codex/learning-operator-full-convergence-20260926
