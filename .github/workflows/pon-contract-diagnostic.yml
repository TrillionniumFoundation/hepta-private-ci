name: PoN exact baseline contract diagnostic
on:
  push:
    branches: [diagnostic/pon-baseline-contract-readback-20261012]
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 961b879f7e9f38fc40b901ac32065abbb6d68990
          fetch-depth: 1
          persist-credentials: false
      - name: Read original compiler annotations without relabeling failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pon-diagnostic"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'TrillionniumFoundation/hepta-private-ci'
          head = '961b879f7e9f38fc40b901ac32065abbb6d68990'
          parent = '3ab51bb08d6c971fa6293da8b1b67a71246428bb'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == head
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pon-diagnostic'
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(4 * 1024 * 1024 + 1)
              if len(raw) > 4 * 1024 * 1024:
                  raise RuntimeError('diagnostic response exceeds explicit bound')
              return json.loads(raw)
          report = {'source': head, 'failed_parent': parent, 'jobs': [], 'source_matches': []}
          for job in [114643596649, 114643596633, 114643596369, 114643596094]:
              metadata = get('/actions/jobs/' + str(job))
              assert metadata['head_sha'] == parent
              observations = get('/check-runs/' + str(job) + '/annotations?per_page=100')
              row = {'job': job, 'name': metadata['name'], 'conclusion': metadata['conclusion'], 'annotations': observations}
              report['jobs'].append(row)
              print(json.dumps(row, ensure_ascii=True)[:30000])
          for path in sorted(pathlib.Path('codex-rs/hepta-control-plane').rglob('*.rs')):
              lines = path.read_text().splitlines()
              for index, line in enumerate(lines):
                  if 'dependency_contracts' in line:
                      match = {'path': str(path), 'line': index + 1, 'context': lines[max(0,index-8):index+9]}
                      report['source_matches'].append(match)
                      print(json.dumps(match, ensure_ascii=True))
          (out / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          subprocess.run(['git', 'archive', '--format=tar', '-o', str(out / 'control-plane-source.tar'), head,
                          'AGENTS.md', 'codex-rs/hepta-control-plane', 'codex-rs/hepta-types',
                          'codex-rs/rustfmt.toml', 'codex-rs/rust-toolchain.toml'], check=True)
          print('SOURCE_UNCHANGED', subprocess.check_output(['git','status','--porcelain'],text=True) == '')
          print('REPORT_SHA256', hashlib.sha256((out / 'report.json').read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pon-exact-contract-diagnostic
          path: ${{ runner.temp }}/pon-diagnostic
          if-no-files-found: error
          retention-days: 14
