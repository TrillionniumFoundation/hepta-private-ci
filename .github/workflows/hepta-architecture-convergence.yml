name: Hepta architecture convergence

on:
  # Always report a terminal identity check; select expensive boundaries below.
  # Workflow-level path skipping can leave a required check permanently pending.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-architecture-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  qualification:
    name: Architecture convergence (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact qualification history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--full-history --commit "$SOURCE_SHA")
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--commit "$BASE_SHA")
          fi
          python3 scripts/hepta_ci_history.py "${args[@]}"
      - name: Verify GitHub prospective merge ref matches this exact candidate
        if: matrix.lane == 'base-merge'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          # Record the frozen candidate before querying a dynamic GitHub
          # merge ref. A conflict or missing ref must remain an actionable
          # failed gate, never a successful skip or a missing CI artifact.
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          printf 'schema=hepta.ci.prospective-merge-candidate.v1\nexpected_base=%s\nexpected_head=%s\npr_number=%s\n' \
            "$BASE_SHA" "$SOURCE_SHA" "$PR_NUMBER" \
            > "$RUNNER_TEMP/hepta-command-records/prospective-merge-candidate.txt"
          if ! ref_json="$(gh api "repos/$REPO/git/ref/pull/$PR_NUMBER/merge" 2>/dev/null)"; then
            # Inspect only this frozen base/head pair. Never replace either
            # with a newer mutable branch tip or silently choose a side.
            if git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA" \
              > "$RUNNER_TEMP/hepta-command-records/prospective-merge-tree.txt" 2>&1; then
              printf '::error title=Prospective merge ref unavailable::GitHub has no merge ref for frozen base=%s head=%s; no qualification permitted\n' \
                "$BASE_SHA" "$SOURCE_SHA"
            else
              printf '::error title=Prospective merge conflict::frozen base=%s head=%s has unresolved merge conflicts; inspect retained merge-tree diagnostic\n' \
                "$BASE_SHA" "$SOURCE_SHA"
            fi
            exit 1
          fi
          actual_sha="$(jq -er '.object.sha' <<<"$ref_json")"
          if ! commit_json="$(gh api "repos/$REPO/git/commits/$actual_sha" 2>/dev/null)"; then
            printf '::error title=Prospective merge commit unavailable::GitHub merge commit cannot be authenticated for frozen candidate\n'
            exit 1
          fi
          mapfile -t parents < <(jq -r '.parents[].sha' <<<"$commit_json")
          # Record the precise mismatch before failing. An asynchronously
          # advanced base branch must invalidate this frozen CI candidate;
          # it is never permission to silently adopt GitHub's newer ref.
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          jq -cn --arg expected_base "$BASE_SHA" --arg expected_head "$SOURCE_SHA" --arg merge_sha "$actual_sha" \
            --arg actual_base "${parents[0]:-}" --arg actual_head "${parents[1]:-}" \
            '{schema:"hepta.ci.prospective-merge-ref.v1",expected_base:$expected_base,expected_head:$expected_head,merge_sha:$merge_sha,actual_base:$actual_base,actual_head:$actual_head}' \
            > "$RUNNER_TEMP/hepta-command-records/prospective-merge-ref.json"
          if [[ "${#parents[@]}" -ne 2 || "${parents[0]:-}" != "$BASE_SHA" || "${parents[1]:-}" != "$SOURCE_SHA" ]]; then
            printf '::error title=Frozen prospective merge changed::expected base=%s head=%s; GitHub ref base=%s head=%s; fresh exact-PR CI required\n' \
              "$BASE_SHA" "$SOURCE_SHA" "${parents[0]:-missing}" "${parents[1]:-missing}"
            exit 1
          fi
          actual_tree="$(jq -er '.tree.sha' <<<"$commit_json")"
          expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          if [[ "$actual_tree" != "$expected_tree" ]]; then
            printf '::error title=Prospective merge tree mismatch::actual=%s expected=%s\n' "$actual_tree" "$expected_tree"
            exit 1
          fi
          printf 'GITHUB_PROSPECTIVE_MERGE_SHA=%s\n' "$actual_sha" >> "$GITHUB_ENV"
          printf 'GITHUB_PROSPECTIVE_MERGE_TREE=%s\n' "$actual_tree" >> "$GITHUB_ENV"
      - name: Construct the canonical prospective merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Bind tested identity
        env:
          CANDIDATE: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --check
          printf 'TESTED_SHA=%s\n' "$CANDIDATE" >> "$GITHUB_ENV"
          printf 'HEPTA_CI_LANE=%s\n' "$LANE" >> "$GITHUB_ENV"
      - name: Select exact-tree native execution
        id: execution
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          python3 -m unittest -v scripts.tests.test_hepta_ci_candidate
          python3 -m unittest -v scripts.test_hepta_exact_pr_ci
          python3 scripts/hepta_ci_candidate.py --source "$SOURCE_SHA" --tested "$TESTED_SHA" --base "$BASE_SHA" --lane "$LANE" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/hepta-command-records/candidate-tree.json"
      - name: Select affected architecture boundaries
        id: scope
        env:
          FULL_SCOPE: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/scope-tests.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_ci_scope
          args=(--head "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$FULL_SCOPE" = "true" ]; then
            args+=(--full)
          else
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/hepta_ci_scope.py "${args[@]}" | tee "$RUNNER_TEMP/hepta-command-records/scope.json"
      - name: Test execution-record rejection and retained diagnostics
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runner-tests.json" -- python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_exec*.py'
      - name: Repository-control rejection regressions
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/repository-controls.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_repository_controls scripts.test_hepta_control_hardening scripts.test_hepta_candidate_transport_workflow
      - name: Prepare native prerequisites
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
      - name: Expose DotSlash for existing integration tests
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified V8 artifacts
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Verify Cargo lock resolution and print exact resolver drift
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo metadata --locked --format-version=1 >/dev/null
          locked_status=$?
          set -e
          if [ "$locked_status" -eq 0 ]; then
            exit 0
          fi
          echo "::error::Cargo.lock differs from the exact candidate manifests"
          set +e
          cargo metadata --offline --format-version=1 >/dev/null
          offline_status=$?
          set -e
          git diff -- Cargo.lock
          git checkout -- Cargo.lock
          if [ "$offline_status" -ne 0 ]; then
            echo "::warning::offline resolver could not fully materialize cached dependencies; source checkout restored"
          fi
          exit "$locked_status"
      - name: Early CellSplit canary and evaluator compile regression
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.learning == 'true'
        run: |
          set -euo pipefail
          # The 2026-10-12 source-head lane failed deep into qualification
          # because sibling test modules could not call canary digest/passes.
          # Compile and execute the same negative canary cases before the
          # heavyweight learning/effect suites, retaining a separate receipt.
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-canary-preflight.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence-eval --lib canary_ -- --nocapture
      - name: Inference owner regressions and streaming digest
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.inference == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/inference.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-types
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/inference-scale.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core bounded_single_writer_history_emits_append_update_recovery_memory_and_disk_curve -- --ignored --nocapture --test-threads=1
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/inference-microbatch-4096.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core workload_64_256_1024_4096_scope_cells -- --ignored --nocapture --test-threads=1
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/inference-durable-4096.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core durable_writer_reopen_64_256_1024_4096_scope_history -- --ignored --nocapture --test-threads=1
      - name: Four-mode CellSplit comparative performance analyzer
        run: python3 -m unittest discover -s .github/scripts -p 'test_hepta_cell_split_perf_gate.py' -v
      - name: Frozen-source CellSplit measurement matrix capture regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_hepta_cell_split_matrix_capture.py' -v
      - name: Signed serving owners and durable metrics regression
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.inference == 'true' || steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-contracts -p codex-hepta-neuron -p codex-hepta-agentd -p codex-hepta-infer-core -p codex-hepta-infer-worker-host -p codex-hepta-cell-roles -p codex-hepta-evidence -p codex-hepta-operator-acceptance -p codex-hepta-supervisor -p codex-hepta-intelligence-eval -- --check
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/signed-neuron-mechanism.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-neuron --lib runtime::tests -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/role-control-durable-cas.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-cell-roles --lib control_owner -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/signed-final-use-library.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-contracts --lib final_use::tests -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/signed-batch-worker.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-worker-host --lib batched_neuron -- --nocapture
          # Test the signed Worker against the ACTUAL original Evidence
          # WAL actor and fsynced marker, including cold restart readback.
          # These tests must run; unrelated fixture-only tests cannot pass
          # the physical persistence boundary by themselves.
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/signed-worker-original-evidence-wal.json" --minimum-tests 2 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-worker-host --lib original_evidence_wal_ -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/model-worker-index.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-worker-host --lib model_worker -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/signed-ndu-reader.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib neuron_ndu_read -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/signed-agentd-neuron.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib neuron_runtime -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/metrics-group-commit.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-evidence --lib metrics_ -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-durable-execution-owner.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_execution_owner -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-online-minimum-lock.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_observer_minimum -- --nocapture
      - name: Durable operation and external-effect recovery
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/operations.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operations
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/retirement.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-automation --test retirement_recovery
      - name: Module lifecycle generations and migration rollback
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.lifecycle == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/stateless-lifecycle.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane repeated_read_only_add_replace_retire_preserves_dispatch_and_generation_fences
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/migration.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane migration_callback_runs_before_successor_publication
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/migration-rollback.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane migration_failure_rolls_back_and_preserves_predecessor
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/full-lifecycle.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane stateful_feature_history_replace_failure_retire_preserves_effect_idempotency
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-catalog.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-fleet module_catalog
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-abi.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane module_runtime
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-supervisor.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor module_runtime
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/writer-handoff-generations.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor writer_handoff
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/topology-contract.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-types topology
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/topology-proposal.json" --minimum-tests 1 -- just test --locked -p codex-hepta-plasticity --lib
      - name: Objective and prompt policy convergence
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.objective == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/objective-contract.json" --minimum-tests 1 -- python3 -m unittest -v scripts.test_hepta_objective_contracts
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/objective.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-objective
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/prompt.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-prompt-optimizer
      - name: Converged authority and browser semantics
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/final-use.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-contracts --test final_use_linearization
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/browser.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd browser_servo
      - name: Selected-artifact adoption and explicit rollback
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.learning == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/selected-ranker.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd new_generation_candidate_changes_behavior_and_explicit_predecessor_reload_restores_it
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/eval.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence-eval closure
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/self-evolution-selection.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence-eval self_evolution_selection
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/agentd-selected-cell-split.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --features cell-split-operator-bridge --lib cell_split_execution -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-execution-cli.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_execution_cli -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-operator-binary.json" --minimum-tests 0 -- cargo check --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --bin hepta-operator-acceptance
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-execution-owner.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_execution_owner -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-signed-rpc-port.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_effect_rpc -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-effect-service.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_effect_service -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-artifact-cas.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_artifact_cas -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-child-state-cas.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_child_state_cas -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-cns-cutover.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_cns_cutover -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-supervisor-fence.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_supervisor_fence -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-observer-join.json" --minimum-tests 2 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib observer_join -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-observer-deep.json" --minimum-tests 2 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib deep_observer -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-independent-minimum.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_observer_minimum -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-monotonic-frontier.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib monotonic_frontier -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-monotonic-rpc.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_monotonic_rpc -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-independent-high-water-join.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib production_deep_join_requires_fresh_independent_minimum_store -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-online-minimum-join.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib production_deep_join_requires_fresh_independent_minimum_store -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-target-host-evidence.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_target_host_evidence -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-target-host-runtime.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operator-acceptance --lib cell_split_target_host_runtime -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/live-cns-split-kernel.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-runtime --features cell-split-cns-port --lib cell_split_cns_runtime_port -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/supervisor-cell-split-journal-finalization.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --lib cell_split_finalization -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/supervisor-real-journal-effect-port.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --features cell-split-supervisor-port --lib real_journal_port -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/cell-split-automation.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence-eval --lib cell_split_automation -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/selector-role.json" --minimum-tests 1 -- just test --locked -p codex-hepta-intelligence-eval -E 'test(selector_and_rollback_are_opaque_independent_admissions)'
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/ledger.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-learning-ledger
      - name: Compiled service lifecycle and actual process restart
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.lifecycle == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-tasks.json" --minimum-tests 1 -- just test --locked -p codex-hepta-agentd --lib -E 'test(runtime_tasks::tests)'
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/operation-timer-fence.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-automation --test operation_timer_fence
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/optional-process-restart.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --test optional_module_restart forty_first_service -- --nocapture
      - name: Derived-view drift
        if: steps.scope.outputs.derived == 'true'
        run: |
          set -euo pipefail
          # Independent owner lanes remain in force; do not repeat their gates.
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/derived.json" -- python3 scripts/hepta-module-docs.py refresh-derived --check
      - name: Retain advisory candidate Git transport observation
        # Network ambiguity is retained as unknown and never claims write denial.
        # Live branch protection and independent authority remain separate gates.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.scope.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -euo pipefail
          # GET of receive-pack advertisement performs no ref, PR or settings
          # write. Do not test a credential by attempting same-value PATCHes:
          # concurrent owner changes can make a supposed no-op destructive.
          # This bounded observation is NOT proof of admin/PR-write denial or
          # independent credential custody. The strict activation observer
          # remains a separate gate; no missing protection is waived here.
          python3 - <<'PYCODE' | tee "$RUNNER_TEMP/hepta-command-records/candidate-transport.json"
          import json
          import os
          from hepta_repository_controls import observe_write_transport_denial
          observation = observe_write_transport_denial(os.environ["REPO"], os.environ["GH_TOKEN"])
          observation.update(admin_denial_proven=False, pull_request_write_denial_proven=False)
          print(json.dumps(observation, sort_keys=True))
          PYCODE
      - name: Verify unchanged reviewed source
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain exact source input on failure for reproducible diagnosis
        if: failure() && matrix.lane == 'source-head'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          git archive --format=tar "$SOURCE_SHA" | gzip -1 > "$RUNNER_TEMP/hepta-command-records/source-input.tar.gz"
      - name: Retain command records and bounded stdout stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-architecture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-command-records/*
          if-no-files-found: error
          retention-days: 30

  required:
    name: Architecture required
    if: ${{ always() }}
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both exact-candidate lanes
        env:
          RESULT: ${{ needs.qualification.result }}
        run: |
          test "$RESULT" = success
          echo "All applicable exact-candidate lanes succeeded; identical-tree reuse includes source-head success."
