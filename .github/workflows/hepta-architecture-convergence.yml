name: Hepta architecture convergence

on:
  # Always report a terminal identity check; select expensive boundaries below.
  # Workflow-level path skipping can leave a required check permanently pending.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-architecture-convergence-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  qualification:
    name: Architecture convergence (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact qualification history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--full-history --commit "$SOURCE_SHA")
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--commit "$BASE_SHA")
          fi
          python3 scripts/hepta_ci_history.py "${args[@]}"
      - name: Verify GitHub prospective merge ref matches this exact candidate
        if: matrix.lane == 'base-merge'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          identity="$RUNNER_TEMP/hepta-command-records/merge-identity"
          mkdir -p "$identity"
          jq -n --arg source "$SOURCE_SHA" --arg base "$BASE_SHA" \
            --arg pr "$PR_NUMBER" --arg repository "$REPO" \
            '{schema:"hepta-prospective-merge-observation-v1", expected_source:$source,
              expected_base:$base, pull_request:$pr, repository:$repository,
              current_ref_is_not_historical_run_evidence:true}' > "$identity/expected.json"
          gh api "repos/$REPO/git/ref/pull/$PR_NUMBER/merge" \
            > "$identity/ref.json" 2> "$identity/ref.stderr"
          actual_sha="$(jq -er '.object.sha' "$identity/ref.json")"
          gh api "repos/$REPO/git/commits/$actual_sha" \
            > "$identity/commit.json" 2> "$identity/commit.stderr"
          commit_json="$(cat "$identity/commit.json")"
          mapfile -t parents < <(jq -r '.parents[].sha' <<<"$commit_json")
          jq -n --arg source "$SOURCE_SHA" --arg base "$BASE_SHA" \
            --arg actual "$actual_sha" --argjson parents "$(jq '.parents | map(.sha)' <<<"$commit_json")" \
            '{schema:"hepta-prospective-merge-parents-v1", expected_source:$source,
              expected_base:$base, actual_commit:$actual, actual_parents:$parents,
              two_parents:($parents|length==2), base_matches:($parents[0]==$base),
              source_matches:($parents[1]==$source)}' > "$identity/parents.json"
          cat "$identity/parents.json"
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_SHA"
          test "${parents[1]}" = "$SOURCE_SHA"
          actual_tree="$(jq -er '.tree.sha' <<<"$commit_json")"
          merge_status=0
          git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA" \
            > "$identity/merge-tree.stdout" 2> "$identity/merge-tree.stderr" || merge_status=$?
          expected_tree="$(cat "$identity/merge-tree.stdout")"
          jq -n --arg actual "$actual_tree" --arg expected "$expected_tree" \
            --argjson command_exit "$merge_status" \
            '{schema:"hepta-prospective-merge-tree-v1", actual_tree:$actual,
              expected_tree:$expected, merge_tree_exit:$command_exit,
              matches:($command_exit==0 and $actual==$expected)}' > "$identity/tree.json"
          cat "$identity/tree.json"
          test "$merge_status" -eq 0
          test "$actual_tree" = "$expected_tree"
          printf 'GITHUB_PROSPECTIVE_MERGE_SHA=%s\n' "$actual_sha" >> "$GITHUB_ENV"
          printf 'GITHUB_PROSPECTIVE_MERGE_TREE=%s\n' "$actual_tree" >> "$GITHUB_ENV"
      - name: Construct the canonical prospective merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Bind tested identity
        env:
          CANDIDATE: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --check
          printf 'TESTED_SHA=%s\n' "$CANDIDATE" >> "$GITHUB_ENV"
          printf 'HEPTA_CI_LANE=%s\n' "$LANE" >> "$GITHUB_ENV"
      - name: Select exact-tree native execution
        id: execution
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          python3 -m unittest -v scripts.tests.test_hepta_ci_candidate
          python3 scripts/hepta_ci_candidate.py --source "$SOURCE_SHA" --tested "$TESTED_SHA" --base "$BASE_SHA" --lane "$LANE" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/hepta-command-records/candidate-tree.json"
      - name: Select affected architecture boundaries
        id: scope
        env:
          FULL_SCOPE: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/scope-tests.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_ci_scope
          args=(--head "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$FULL_SCOPE" = "true" ]; then
            args+=(--full)
          else
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/hepta_ci_scope.py "${args[@]}" | tee "$RUNNER_TEMP/hepta-command-records/scope.json"
      - name: Test execution-record rejection and retained diagnostics
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runner-tests.json" -- python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_exec*.py'
      - name: Repository-control rejection regressions
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/repository-controls.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_repository_controls scripts.test_hepta_control_hardening scripts.test_hepta_candidate_transport_workflow scripts.test_hepta_merge_identity_records
      - name: Prepare native prerequisites
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
      - name: Expose DotSlash for existing integration tests
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified V8 artifacts
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Verify Cargo lock resolution and print exact resolver drift
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo metadata --locked --format-version=1 >/dev/null
          locked_status=$?
          set -e
          if [ "$locked_status" -eq 0 ]; then
            exit 0
          fi
          echo "::error::Cargo.lock differs from the exact candidate manifests"
          set +e
          cargo metadata --offline --format-version=1 >/dev/null
          offline_status=$?
          set -e
          git diff -- Cargo.lock
          git checkout -- Cargo.lock
          if [ "$offline_status" -ne 0 ]; then
            echo "::warning::offline resolver could not fully materialize cached dependencies; source checkout restored"
          fi
          exit "$locked_status"
      - name: Original paired turn owner and admission controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-original-turn.json" --minimum-tests 15 -- just test --locked -p codex-hepta-agentd --lib -E 'test(paired_original_turn::tests) | test(notes_thread_tool::human::tests) | test(notes_thread_tool::items::tests)'
      - name: Original paired consent notification and material consumer controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-original-consumer.json" --minimum-tests 8 -- just test --locked -p codex-hepta-agentd --lib -E 'test(notes_thread_tool::training_trigger::tests) | test(paired_preparation::training::consumer::tests)'
      - name: Original AuthBus Ack readiness and pending-owner controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-original-ack.json" --minimum-tests 10 -- just test --locked -p codex-hepta-agentd --lib -E 'test(authbus_dispatch::tests) | test(paired_preparation::training::tests::readiness)'
      - name: Original paired sealed purpose and startup binding controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-original-handoff.json" --minimum-tests 5 -- just test --locked -p codex-hepta-agentd --lib --retries 0 --test-threads 1 -E 'test(root_production_handoff::paired_training::tests) | test(root_production_paired_inputs::tests)'
      - name: Root CLI original descriptor ownership and login controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/root-cli-original-login.json" --minimum-tests 5 -- just test --locked -p codex-hepta-agentd --bin hepta-authority-host -E 'test(descriptor_tests) | test(login_tests)'
      - name: Paired preparation on the original durable journal
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-preparation.json" --minimum-tests 12 -- just test --locked -p codex-hepta-agentd --lib -E 'test(paired_preparation::tests)'
      - name: Original paired Root registration, fixed read and response boundaries
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-root-registration.json" --minimum-tests 33 -- just test --locked -p codex-hepta-contracts -p codex-hepta-agentd --lib --retries 0 --test-threads 1 -E 'test(=authority_lease::pair_boundary::tests::pinned_issuer::paired::paired_four_records_hold_enrollment_revocation_until_actual_boundary_returns) | test(=authority_lease::pair_boundary::tests::pinned_issuer::paired::paired_four_records_reject_foreign_tokens_role_aliases_and_stale_enrollment) | test(=authority_lease::pair_boundary::tests::pinned_issuer::paired::paired_four_records_revalidate_each_role_after_tokens_were_issued) | test(=deployment_issuer::paired::tests::paired_root_open_and_reopen_only_observe_original_records_and_counter) | test(=deployment_issuer::paired::tests::paired_root_changed_purpose_material_route_or_principal_cannot_open_another_slot) | test(=deployment_issuer::paired::tests::paired_root_independent_enrollment_revocation_survives_reopen_without_replacement) | test(=deployment_issuer::paired::tests::paired_root_conflicting_effect_cas_never_rebinds_retained_owner) | test(=deployment_issuer::paired::tests::paired_root_equal_foreign_registry_is_refused_without_mutation) | test(=deployment_issuer::paired::tests::paired_root_missing_policy_or_expired_records_are_not_created_or_renewed) | test(=deployment_issuer::paired::tests::live::paired_root_live_original_signature_and_four_records_are_read_only) | test(=deployment_issuer::paired::tests::live::paired_root_live_changed_delivery_or_principal_has_no_new_effect) | test(=deployment_issuer::paired::tests::live::paired_root_live_same_locked_state_rechecks_current_text_policy) | test(=deployment_issuer::paired::tests::live::paired_root_live_retained_signature_expiry_survives_reopen) | test(=deployment_issuer::paired::tests::live::paired_root_live_revoked_enrollment_refuses_retained_human_signature) | test(=authority_host_service::logind::paired_human_tests::paired_root_live_human_requires_both_original_descriptors_and_exact_binding) | test(=authority_host_service::logind::paired_human_tests::paired_root_live_human_keeps_the_original_absolute_deadline) | test(=deployment_issuer::paired::tests::materials::paired_material_original_fds_read_once_and_reopen_is_retained) | test(=deployment_issuer::paired::tests::materials::paired_material_bad_content_consumes_entry_without_response_or_replay) | test(=deployment_issuer::paired::tests::materials::paired_material_wrong_binding_or_closed_peer_cannot_enter) | test(=deployment_issuer::paired::tests::materials::paired_material_original_registry_lock_covers_the_blocked_response) | test(=deployment_issuer::paired::tests::materials::paired_material_expiry_during_blocked_send_cannot_release_a_prefix) | test(=deployment_issuer::paired::tests::materials::paired_material_entry_conflict_and_unknown_version_never_reopen_fresh) | test(=deployment_issuer::paired::tests::materials::paired_material_nonempty_version_is_not_decodable_by_the_old_strict_shape) | test(=deployment_issuer::paired::tests::materials::paired_material_every_pread_refusal_precedes_actual_content_access) | test(=authority_host_issuer_transport::peer::tests::original_response::original_response_refusal_after_prefix_never_writes_body_or_retries) | test(=authority_host_issuer_transport::peer::tests::original_response::original_response_missing_or_reused_writer_cannot_report_success) | test(=authority_host_issuer_transport::peer::tests::original_response::original_response_private_fence_cannot_extend_the_frame_deadline) | test(=authority_host_issuer_transport::peer::tests::original_response::original_response_current_peer_rejects_eof_and_pipelined_data) | test(=paired_preparation::material_client::tests::paired_material_cancel_closes_only_the_consumed_original_socket) | test(=paired_preparation::material_client::tests::paired_material_complete_commitment_is_checked_before_bytes_escape) | test(=paired_preparation::material_client::tests::paired_material_partial_response_stays_unknown_and_cannot_reconnect) | test(=paired_preparation::training::tests::paired_training_required_owner_cancel_drops_read_and_returns_unknown) | test(=paired_preparation::training::tests::paired_training_caller_abort_drops_the_active_read_without_retry)'
      - name: Late original paired training admission controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-late-admission.json" --minimum-tests 5 -- just test --locked -p codex-hepta-agentd --lib --retries 0 --test-threads 1 -E 'test(deployment_issuer::paired::tests::materials::admission)'
      - name: Original paired Root CLI descriptor controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-root-cli.json" --minimum-tests 4 -- just test --locked -p codex-hepta-agentd --bin hepta-authority-host --retries 0 --test-threads 1 -E 'test(paired_tests)'
      - name: Original paired training startup metadata controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-training-bootstrap.json" --minimum-tests 2 -- just test --locked -p codex-hepta-agentd --lib --retries 0 --test-threads 1 -E 'test(paired_training_bootstrap::tests)'
      - name: Original paired session exit and peer controls
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-session-lifecycle.json" --minimum-tests 2 -- just test --locked -p codex-hepta-agentd --lib --retries 0 --test-threads 1 -E 'test(authority_host_runtime::session::paired::tests)'
      - name: Isolated paired Root gate rejection controls
        if: matrix.lane == 'source-head' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-root-gate-controls.json" --minimum-tests 8 --timeout-seconds 30 -- python3 -m unittest -v scripts.test_hepta_ci_paired_root
      - name: Bind the isolated paired Root test build without Root
        if: matrix.lane == 'source-head' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-root-build.json" --timeout-seconds 300 -- python3 scripts/hepta_ci_paired_root.py prepare --output "$RUNNER_TEMP/hepta-command-records/paired-root"
      - name: One actual paired Root service refusal in private temporary state
        if: matrix.lane == 'source-head' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        timeout-minutes: 1
        run: |
          set -euo pipefail
          root_bundle="$RUNNER_TEMP/hepta-command-records/paired-root"
          manifest_sha256="$(sha256sum "$root_bundle/BUILD.json" | cut -d ' ' -f 1)"
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -B "$PWD/scripts/hepta_ci_paired_root.py" run-root --output "$root_bundle" --manifest-sha256 "$manifest_sha256" --source "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/paired-root-collection.json" --minimum-tests 0 --timeout-seconds 15 -- python3 scripts/hepta_ci_paired_root.py collect --output "$root_bundle"
      - name: Inference owner regressions and streaming digest
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.inference == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/inference.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-types
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/inference-scale.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core bounded_single_writer_history_emits_append_update_recovery_memory_and_disk_curve -- --ignored --nocapture --test-threads=1
      - name: Durable operation and external-effect recovery
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/operations.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-operations
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/retirement.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-automation --test retirement_recovery
      - name: Module lifecycle generations and migration rollback
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.lifecycle == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/stateless-lifecycle.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane repeated_read_only_add_replace_retire_preserves_dispatch_and_generation_fences
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/migration.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane migration_callback_runs_before_successor_publication
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/migration-rollback.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane migration_failure_rolls_back_and_preserves_predecessor
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/full-lifecycle.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane stateful_feature_history_replace_failure_retire_preserves_effect_idempotency
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-catalog.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-fleet module_catalog
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-abi.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-control-plane module_runtime
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-supervisor.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor module_runtime
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/writer-handoff-generations.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor writer_handoff
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/topology-contract.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-types topology
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/topology-proposal.json" --minimum-tests 1 -- just test --locked -p codex-hepta-plasticity --lib
      - name: Objective and prompt policy convergence
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.objective == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/objective-contract.json" --minimum-tests 1 -- python3 -m unittest -v scripts.test_hepta_objective_contracts
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/objective.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-objective
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/prompt.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-prompt-optimizer
      - name: Converged authority and browser semantics
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/final-use.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-contracts --test final_use_linearization
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/browser.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd browser_servo
      - name: Selected-artifact adoption and explicit rollback
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.learning == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/selected-ranker.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd new_generation_candidate_changes_behavior_and_explicit_predecessor_reload_restores_it
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/eval.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence-eval closure
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/self-evolution-selection.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence-eval self_evolution_selection
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/selector-role.json" --minimum-tests 1 -- just test --locked -p codex-hepta-intelligence-eval -E 'test(selector_and_rollback_are_opaque_independent_admissions)'
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/ledger.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-learning-ledger
      - name: Compiled service lifecycle and actual process restart
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.lifecycle == 'true'
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-tasks.json" --minimum-tests 1 -- just test --locked -p codex-hepta-agentd --lib -E 'test(runtime_tasks::tests)'
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/operation-timer-fence.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-automation --test operation_timer_fence
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/optional-process-restart.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --test optional_module_restart forty_first_service -- --nocapture
      - name: Derived-view drift
        if: steps.scope.outputs.derived == 'true'
        run: |
          set -euo pipefail
          # Independent owner lanes remain in force; do not repeat their gates.
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/derived.json" -- python3 scripts/hepta-module-docs.py refresh-derived --check
      - name: Retain advisory candidate Git transport observation
        # Network ambiguity is retained as unknown and never claims write denial.
        # Live branch protection and independent authority remain separate gates.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.scope.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -euo pipefail
          # GET of receive-pack advertisement performs no ref, PR or settings
          # write. Do not test a credential by attempting same-value PATCHes:
          # concurrent owner changes can make a supposed no-op destructive.
          # This bounded observation is NOT proof of admin/PR-write denial or
          # independent credential custody. The strict activation observer
          # remains a separate gate; no missing protection is waived here.
          python3 - <<'PYCODE' | tee "$RUNNER_TEMP/hepta-command-records/candidate-transport.json"
          import json
          import os
          from hepta_repository_controls import observe_write_transport_denial
          observation = observe_write_transport_denial(os.environ["REPO"], os.environ["GH_TOKEN"])
          observation.update(admin_denial_proven=False, pull_request_write_denial_proven=False)
          print(json.dumps(observation, sort_keys=True))
          PYCODE
      - name: Verify unchanged reviewed source
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain exact source input on failure for reproducible diagnosis
        if: failure() && matrix.lane == 'source-head'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          git archive --format=tar "$SOURCE_SHA" | gzip -1 > "$RUNNER_TEMP/hepta-command-records/source-input.tar.gz"
      - name: Retain command records and bounded stdout stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-architecture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-command-records/*
          if-no-files-found: error
          retention-days: 30

  required:
    name: Architecture required
    if: ${{ always() }}
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both exact-candidate lanes
        env:
          RESULT: ${{ needs.qualification.result }}
        run: |
          test "$RESULT" = success
          echo "All applicable exact-candidate lanes succeeded; identical-tree reuse includes source-head success."
