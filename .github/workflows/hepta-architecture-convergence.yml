name: Hepta architecture convergence

on:
  # Always report a terminal identity check; select expensive boundaries below.
  # Workflow-level path skipping can leave a required check permanently pending.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-architecture-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  qualification:
    name: Architecture convergence (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GitHub prospective merge ref matches this exact candidate
        if: matrix.lane == 'base-merge'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          ref_json="$(gh api "repos/$REPO/git/ref/pull/$PR_NUMBER/merge")"
          actual_sha="$(jq -er '.object.sha' <<<"$ref_json")"
          commit_json="$(gh api "repos/$REPO/git/commits/$actual_sha")"
          mapfile -t parents < <(jq -r '.parents[].sha' <<<"$commit_json")
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_SHA"
          test "${parents[1]}" = "$SOURCE_SHA"
          actual_tree="$(jq -er '.tree.sha' <<<"$commit_json")"
          expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          test "$actual_tree" = "$expected_tree"
          printf 'GITHUB_PROSPECTIVE_MERGE_SHA=%s\n' "$actual_sha" >> "$GITHUB_ENV"
          printf 'GITHUB_PROSPECTIVE_MERGE_TREE=%s\n' "$actual_tree" >> "$GITHUB_ENV"
      - name: Construct the canonical prospective merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Bind tested identity
        env:
          CANDIDATE: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --check
          printf 'TESTED_SHA=%s\n' "$CANDIDATE" >> "$GITHUB_ENV"
          printf 'HEPTA_CI_LANE=%s\n' "$LANE" >> "$GITHUB_ENV"
      - name: Select exact-tree native execution
        id: execution
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          python3 -m unittest -v scripts.tests.test_hepta_ci_candidate
          python3 scripts/hepta_ci_candidate.py --source "$SOURCE_SHA" --tested "$TESTED_SHA" --base "$BASE_SHA" --lane "$LANE" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/hepta-command-records/candidate-tree.json"
      - name: Select affected architecture boundaries
        id: scope
        env:
          FULL_SCOPE: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/scope-tests.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_ci_scope
          args=(--head "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$FULL_SCOPE" = "true" ]; then
            args+=(--full)
          else
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/hepta_ci_scope.py "${args[@]}" | tee "$RUNNER_TEMP/hepta-command-records/scope.json"
      - name: Test execution-record rejection and retained diagnostics
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runner-tests.json" -- python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_exec*.py'
      - name: Repository-control rejection regressions
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/repository-controls.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_repository_controls
      - name: Prepare native prerequisites
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
      - name: Expose DotSlash for existing integration tests
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified V8 artifacts
        if: steps.execution.outputs.run_native == 'true' && (steps.scope.outputs.effects == 'true' || steps.scope.outputs.learning == 'true')
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Verify Cargo lock resolution and print exact resolver drift
        id: native_resolver
        if: steps.execution.outputs.run_native == 'true' && steps.scope.outputs.native == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          # One graph for this immutable candidate, target and toolchain. Tests
          # still compile and execute; only repeated metadata resolution is reused.
          set +e
          cargo metadata --locked --all-features --filter-platform "$host" --format-version=1 > "$RUNNER_TEMP/hepta-nextest-metadata.json"
          locked_status=$?
          set -e
          if [ "$locked_status" -eq 0 ]; then
            exit 0
          fi
          echo "::error::Cargo.lock differs from the exact candidate manifests"
          set +e
          cargo metadata --offline --format-version=1 >/dev/null
          offline_status=$?
          set -e
          git diff -- Cargo.lock
          git checkout -- Cargo.lock
          if [ "$offline_status" -ne 0 ]; then
            echo "::warning::offline resolver could not fully materialize cached dependencies; source checkout restored"
          fi
          exit "$locked_status"
      - name: Inference owner regressions and streaming digest
        if: ${{ !cancelled() && steps.native_resolver.outcome == 'success' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.inference == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/inference.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-infer-core -p codex-hepta-types
          python3 scripts/hepta_inference_owner_checks.py --output-dir "$RUNNER_TEMP/hepta-command-records"
      - name: Durable operation and external-effect recovery
        if: ${{ !cancelled() && steps.native_resolver.outcome == 'success' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/operations.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-operations
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/retirement.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-automation --test retirement_recovery
      - name: Module lifecycle generations and migration rollback
        if: ${{ !cancelled() && steps.native_resolver.outcome == 'success' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.lifecycle == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/stateless-lifecycle.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-control-plane repeated_read_only_add_replace_retire_preserves_dispatch_and_generation_fences
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/migration.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-control-plane migration_callback_runs_before_successor_publication
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/migration-rollback.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-control-plane migration_failure_rolls_back_and_preserves_predecessor
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/full-lifecycle.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-control-plane stateful_feature_history_replace_failure_retire_preserves_effect_idempotency
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-catalog.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-fleet module_catalog
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-abi.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-control-plane module_runtime
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-module-supervisor.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-supervisor module_runtime
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/writer-handoff-generations.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-supervisor writer_handoff
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/topology-contract.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-types topology
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/topology-proposal.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-plasticity --lib
      - name: Objective and prompt policy convergence
        if: ${{ !cancelled() && steps.native_resolver.outcome == 'success' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.objective == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/objective-contract.json" --minimum-tests 1 -- python3 -m unittest -v scripts.test_hepta_objective_contracts
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/objective.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-objective
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/prompt.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-prompt-optimizer
      - name: Converged authority and browser semantics
        if: ${{ !cancelled() && steps.native_resolver.outcome == 'success' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.effects == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/final-use.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-contracts --test final_use_linearization
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/browser.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd browser_servo
      - name: Shared Replay live-owner selection and process restore
        if: ${{ !cancelled() && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.learning == 'true' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/shared-replay-restore.json" --minimum-tests 2 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd --test terminal_cell_owner
      - name: Selected-artifact adoption and explicit rollback
        if: ${{ !cancelled() && steps.native_resolver.outcome == 'success' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.learning == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/selected-ranker.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd new_generation_candidate_changes_behavior_and_explicit_predecessor_reload_restores_it
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/eval.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-intelligence-eval closure
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/self-evolution-selection.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-intelligence-eval self_evolution_selection
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/selector-role.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-intelligence-eval selector_and_rollback_are_opaque_independent_admissions
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/ledger.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-learning-ledger
      - name: Optional service process lifecycle and executable identity
        if: ${{ !cancelled() && steps.native_resolver.outcome == 'success' && steps.execution.outputs.run_native == 'true' && steps.scope.outputs.lifecycle == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/runtime-image.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd process_observation_caches_actual_executable_bytes
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/operation-timer-fence.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-automation --test operation_timer_fence
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/optional-process-restart.json" --minimum-tests 1 -- just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd --test optional_module_restart forty_first_service --no-capture
      - name: Derived-view drift
        if: steps.scope.outputs.derived == 'true'
        run: |
          set -euo pipefail
          # Independent owner lanes remain in force; do not repeat their gates.
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-command-records/derived.json" -- python3 scripts/hepta-module-docs.py refresh-derived --check
      # Live credential and branch-protection observations belong to the
      # separate manual self-iteration activation gate. They are not a
      # property of this immutable source candidate.
      - name: Verify unchanged reviewed source
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain exact source input on failure for reproducible diagnosis
        if: failure() && matrix.lane == 'source-head'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-command-records"
          git archive --format=tar "$SOURCE_SHA" | gzip -1 > "$RUNNER_TEMP/hepta-command-records/source-input.tar.gz"
      - name: Retain command records and bounded stdout stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-architecture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-command-records/*
          if-no-files-found: error
          retention-days: 30

  required:
    name: Architecture required
    if: ${{ always() }}
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both exact-candidate lanes
        env:
          RESULT: ${{ needs.qualification.result }}
        run: |
          test "$RESULT" = success
          echo "All applicable exact-candidate lanes succeeded; identical-tree reuse includes source-head success."
