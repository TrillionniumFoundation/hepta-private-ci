name: ui.native verified closure materialization

on:
  push:
    branches: [work/ui-native-verified-closure-20260927]
    paths:
      - .github/ui-native-verified-bootstrap/**
      - .github/workflows/hepta-ui-native-verified-materialize.yml

permissions:
  contents: read

concurrency:
  group: ui-native-verified-materialization
  cancel-in-progress: true

jobs:
  materialize:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/work/ui-native-verified-closure-20260927'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      BRANCH: work/ui-native-verified-closure-20260927
      SOURCE_PARENT: bcc7233ac50c1d37001843392d32f7150a658bc2
      PINNED_MAIN: a126987b84737dbc2ee2592442a314117bddb4a2
      PATCH_SHA256: a2d38ea3adb7ab90ee8755fbf36d1a599939c9eb29f3b9685191d979b0f19a03
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply exact reviewed scope
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-verified-evidence"
          cp .github/ui-native-verified-bootstrap/changes.patch.gz.b64 "$RUNNER_TEMP/native-verified-evidence/transport.b64"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor "$SOURCE_PARENT" HEAD
          git cat-file -e "$PINNED_MAIN^{commit}"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          allowed = {'.github/workflows/hepta-ui-native-verified-materialize.yml', '.github/workflows/hepta-ui-native-verified-export.yml'}
          changed = subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_PARENT'],'HEAD'],text=True).splitlines()
          assert changed and all(p.startswith('.github/ui-native-verified-bootstrap/') or p in allowed for p in changed), changed
          text = Path('.github/ui-native-verified-bootstrap/changes.patch.gz.b64').read_text(encoding='ascii').strip()
          repairs = {'HFYKuUGUGXBT42':'HFYKuUGUZDHXBT42','8XRwOF6Mi0OMS2':'8XRwOF6MrwiC0OMS2','Me9Xn/qzKchkd':'Me9Xn/qzKf9Kchkd','8O9xsDGenQ':'8O9xsHGenQ','NeOSJJ635':'NeOSJ635'}
          for old,new in repairs.items():
              assert text.count(old) <= 1
              text = text.replace(old,new)
          patch = gzip.decompress(base64.b64decode(text,validate=True))
          actual = hashlib.sha256(patch).hexdigest()
          print('reviewed_patch_sha256',actual,flush=True)
          assert actual == os.environ['PATCH_SHA256']
          Path(os.environ['RUNNER_TEMP'],'native-verified.patch').write_bytes(patch)
          PY
          git switch -C "$BRANCH"
          exclude=(--exclude=.github/workflows/hepta-ui-native-remediation.yml --exclude=apps/hepta-native/tools/prepare_current_source.py --exclude=docs/modules/ui.native/TECHNICAL.md)
          git apply --index --check "${exclude[@]}" "$RUNNER_TEMP/native-verified.patch"
          git apply --index "${exclude[@]}" "$RUNNER_TEMP/native-verified.patch"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths) == 11, paths
          assert all(p.startswith(('apps/hepta-native/','docs/modules/ui.native/')) for p in paths), paths
          def replace_once(path, old, new):
              text = path.read_text()
              assert text.count(old) == 1, (str(path),old)
              path.write_text(text.replace(old,new))
          branch = os.environ['BRANCH']
          path = Path('apps/hepta-native/tools/prepare_current_source.py')
          replace_once(path,'BRANCH = "work/ui-native-operational-closure-20260927"','BRANCH = "'+branch+'"')
          path = Path('docs/modules/ui.native/TECHNICAL.md')
          replace_once(path,'**Canonical candidate:** `work/ui-native-operational-closure-20260927`','**Canonical candidate:** `'+branch+'`')
          replace_once(path,'**Current protocol/evidence ledger:** [Operational closure](OPERATIONAL-CLOSURE-20260927.md).\nRequest binding v2 and journal v5 are the current candidate protocols.','**Current protocol/evidence ledger:** [Verified closure](VERIFIED-CLOSURE-20260927.md).\nRequest binding v2 and journal v6 with segmented retirement are the current candidate protocols.\nThe [operational closure](OPERATIONAL-CLOSURE-20260927.md) is inherited history, not a current pass.')
          path = Path('.github/workflows/hepta-ui-native-remediation.yml')
          replace_once(path,'branches: [main, work/ui-native-remediation-20260927, work/ui-native-closure-20260927]','branches: [main, work/ui-native-remediation-20260927, work/ui-native-closure-20260927, '+branch+']')
          replace_once(path,'base=$(git rev-parse refs/remotes/origin/main)','base='+os.environ['PINNED_MAIN'])
          PY
          git add -- apps/hepta-native/tools/prepare_current_source.py docs/modules/ui.native/TECHNICAL.md .github/workflows/hepta-ui-native-remediation.yml
          git rm -- .github/ui-native-verified-bootstrap/changes.patch.gz.b64 .github/workflows/hepta-ui-native-verified-materialize.yml .github/workflows/hepta-ui-native-verified-export.yml
      - name: Install pinned native toolchain
        id: toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Format and commit source, then bind committed identities
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-native-gateway -p codex-hepta-contracts -p codex-hepta-private-state
          git add -- apps/hepta-native codex-rs/hepta-native-gateway codex-rs/hepta-contracts codex-rs/hepta-private-state
          git diff --cached --check
          git config user.name 'ui.native candidate maintenance'
          git config user.email 'ui-native-candidate@users.noreply.github.com'
          git commit -m 'fix(ui.native): segment durable retirement and reject inconsistent resource snapshots' -m "Reviewed implementation patch SHA256: $PATCH_SHA256; three metadata hunks explicitly rebased. Rust 1.95.0 formatting; no qualification promotion."
          git rev-parse HEAD > "$RUNNER_TEMP/native-verified-evidence/source-commit.txt"
          HEPTA_UI_NATIVE_WRITE_BRANCH="$BRANCH" python3 apps/hepta-native/tools/prepare_current_source.py --write-fingerprints
          HEPTA_UI_NATIVE_WRITE_BRANCH="$BRANCH" python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          git add -- apps/hepta-native/CURRENT_SOURCE.json docs/modules/ui.native/IMPLEMENTATION_MAP.json qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          git commit -m 'chore(ui.native): bind verified-closure source and current guide without promoting claims'
          python3 apps/hepta-native/tools/prepare_current_source.py
          test -z "$(git status --porcelain)"
      - name: Fast-forward only isolated branch and record actual tested commit
        id: published
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED"
          git push origin "HEAD:refs/heads/$BRANCH"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/native-verified-evidence/identity.txt"
          git archive HEAD | gzip -n > "$RUNNER_TEMP/native-verified-evidence/source.tar.gz"
          rustc +1.95.0 -Vv > "$RUNNER_TEMP/native-verified-evidence/rustc.txt"
      - name: Python infrastructure regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_hepta_ui_native_*.py' -v 2>&1 | tee "$RUNNER_TEMP/native-verified-evidence/python-tests.log"
      - name: Native regression tests
        if: ${{ !cancelled() && steps.published.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/native-verified-evidence/native-tests.log"
      - name: Strict formatting and Clippy
        if: ${{ !cancelled() && steps.published.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
          cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/native-verified-evidence/clippy.log"
      - name: Build and execute unsigned installed artifacts
        if: ${{ !cancelled() && steps.published.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.95.0 build --manifest-path apps/hepta-native/Cargo.toml --locked --release --bins 2>&1 | tee "$RUNNER_TEMP/native-verified-evidence/build.log"
          architecture=$(uname -m)
          python3 apps/hepta-native/tools/package_unsigned.py --platform macos --architecture "$architecture" --release-dir apps/hepta-native/target/release --out-dir "$RUNNER_TEMP/native-verified-package" 2>&1 | tee "$RUNNER_TEMP/native-verified-evidence/package.log"
          binary="$RUNNER_TEMP/native-verified-package/extracted/Hepta Native.app/Contents/MacOS/hepta-native"
          "$binary" --self-test 2>&1 | tee "$RUNNER_TEMP/native-verified-evidence/packaged-self-test.log"
          "$binary" --qualification-e2e 2>&1 | tee "$RUNNER_TEMP/native-verified-evidence/packaged-crash-test.log"
          cp "$RUNNER_TEMP/native-verified-package/package-receipt.json" "$RUNNER_TEMP/native-verified-evidence/"
      - name: Retain actual outcomes without release promotion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-verified-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/native-verified-evidence
          if-no-files-found: error
          retention-days: 14
