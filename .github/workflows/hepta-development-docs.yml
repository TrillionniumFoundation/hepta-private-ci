name: Hepta development documents

on:
  # Automatic fan-out belongs to the existing aggregate checks.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: hepta-development-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-head:
    name: Verify exact source head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source once and retain execution record
        env:
          TESTED_SHA: ${{ env.SOURCE_SHA }}
          HEPTA_CI_LANE: source-head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --check
          python3 scripts/hepta_workspace.py
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-docs.py self-test
          python3 -m unittest discover -v -s scripts -p 'test_hepta_*.py'
          # The global verifier owns source locks, status and subordinate checks.
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-document-records/source-head.json" -- python3 scripts/hepta-docs.py verify

      - name: Retain source execution and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-v8-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/hepta-document-records/*
          if-no-files-found: error
          retention-days: 30

  merge-candidate:
    name: Verify exact merge candidate
    needs: source-head
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source for merge construction
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Construct deterministic synthetic merge
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge

      - name: Bind merge identity and select content verification
        id: candidate
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha }}
          SOURCE_HEAD_RESULT: ${{ needs.source-head.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-document-records"
          python3 scripts/hepta_ci_candidate.py --source "$SOURCE_SHA" --tested "$TESTED_SHA" --base "$BASE_SHA" --lane base-merge --source-head-result "$SOURCE_HEAD_RESULT" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/hepta-document-records/candidate-tree.json"
          # Same-tree reuse is a dependency on source-head success, not another
          # execution receipt or independent acceptance. Changed trees run below.

      - name: Verify merged inputs once and retain execution record
        if: steps.candidate.outputs.run_tree_checks == 'true'
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha }}
          HEPTA_CI_LANE: base-merge
        shell: bash
        run: |
          set -euo pipefail
          # Source-head owns self-tests. The shared recorder checks ordered
          # parents and recomputes the merge tree before this verifier executes.
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-document-records/base-merge.json" -- python3 scripts/hepta-docs.py verify

      - name: Retain merge execution and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-v8-merge-${{ steps.synthetic.outputs.sha }}
          path: ${{ runner.temp }}/hepta-document-records/*
          if-no-files-found: error
          retention-days: 30
