name: channel.matrix hardening apply

on:
  push:
    branches:
      - codex/channel-matrix-full-closure-20260927
    paths:
      - '.github/workflows/channel-matrix-hardening-apply.yml'

permissions:
  contents: write

concurrency:
  group: channel-matrix-hardening-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/channel-matrix-full-closure-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: 91f93d60fade0a88c3f735e62cf93c25b5835cfb
      STAGING_SHA: ${{ github.sha }}
      BRANCH: codex/channel-matrix-full-closure-20260927
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify isolated staging change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STAGING_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/channel-matrix-hardening-apply.yml"

      - name: Apply exact-candidate qualification repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(before) != 1:
                  raise SystemExit(f"expected one replacement in {path}: {before[:80]!r}")
              target.write_text(text.replace(before, after, 1), encoding="utf-8")

          replace_once(
              "codex-rs/hepta-operations/Cargo.toml",
              "codex-hepta-types = { workspace = true }\nsqlx = { workspace = true }\n",
              "codex-hepta-types = { workspace = true }\ncodex-state = { workspace = true }\ncodex-utils-absolute-path = { workspace = true }\nsqlx = { workspace = true }\n",
          )
          replace_once(
              "codex-rs/hepta-operations/src/lib.rs",
              "mod outbox;\n",
              "mod outbox;\nmod sqlite;\n",
          )

          Path("codex-rs/hepta-operations/src/sqlite.rs").write_text(r'''use std::path::Path;

use codex_state::SqliteConfig;
use codex_utils_absolute_path::AbsolutePathBuf;
use sqlx::SqlitePool;

use crate::DurableOperationError;

/// Open an authoritative durable SQLite pool through the repository's single
/// connection-policy shim. Relative owner paths are resolved once so the shim
/// and the stored owner path cannot disagree about the database being opened.
pub(crate) async fn open_durable_evidence_pool(
    path: &Path,
) -> Result<SqlitePool, DurableOperationError> {
    let absolute_path = if path.is_absolute() {
        path.to_path_buf()
    } else {
        std::env::current_dir()
            .map_err(|error| DurableOperationError::Unavailable(error.to_string()))?
            .join(path)
    };
    let parent = absolute_path.parent().ok_or_else(|| {
        DurableOperationError::Unavailable("durable SQLite path has no parent".to_owned())
    })?;
    std::fs::create_dir_all(parent)
        .map_err(|error| DurableOperationError::Unavailable(error.to_string()))?;
    let sqlite_home = AbsolutePathBuf::try_from(parent)
        .map_err(|error| DurableOperationError::Unavailable(error.to_string()))?;
    SqliteConfig::from_sqlite_home(sqlite_home)
        .open_durable_evidence_pool(&absolute_path)
        .await
        .map_err(|error| DurableOperationError::Unavailable(error.to_string()))
}
''', encoding="utf-8")

          replace_once("codex-rs/hepta-operations/src/destination_dedupe.rs", "use std::time::Duration;\n", "")
          for line in (
              "use sqlx::sqlite::SqliteConnectOptions;\n",
              "use sqlx::sqlite::SqliteJournalMode;\n",
              "use sqlx::sqlite::SqlitePoolOptions;\n",
              "use sqlx::sqlite::SqliteSynchronous;\n",
          ):
              replace_once("codex-rs/hepta-operations/src/destination_dedupe.rs", line, "")
          replace_once(
              "codex-rs/hepta-operations/src/destination_dedupe.rs",
              '''        if let Some(parent) = path.parent() {
            std::fs::create_dir_all(parent)
                .map_err(|error| DurableOperationError::Unavailable(error.to_string()))?;
        }
        let options = SqliteConnectOptions::new()
            .filename(path)
            .create_if_missing(true)
            .journal_mode(SqliteJournalMode::Wal)
            .synchronous(SqliteSynchronous::Full)
            .foreign_keys(true)
            .busy_timeout(Duration::from_secs(5));
        let pool = SqlitePoolOptions::new()
            .max_connections(4)
            .connect_with(options)
            .await
            .map_err(sqlx_error)?;
''',
              '''        let pool = crate::sqlite::open_durable_evidence_pool(path).await?;
''',
          )

          for line in (
              "use sqlx::sqlite::SqliteConnectOptions;\n",
              "use sqlx::sqlite::SqliteJournalMode;\n",
              "use sqlx::sqlite::SqlitePoolOptions;\n",
              "use sqlx::sqlite::SqliteSynchronous;\n",
          ):
              replace_once("codex-rs/hepta-operations/src/durable_store.rs", line, "")
          replace_once(
              "codex-rs/hepta-operations/src/durable_store.rs",
              '''        if let Some(parent) = path.parent() {
            std::fs::create_dir_all(parent)
                .map_err(|error| DurableOperationError::Unavailable(error.to_string()))?;
        }
        let options = SqliteConnectOptions::new()
            .filename(path)
            .create_if_missing(true)
            .journal_mode(SqliteJournalMode::Wal)
            .synchronous(SqliteSynchronous::Full)
            .foreign_keys(true)
            .busy_timeout(Duration::from_secs(5));
        let pool = SqlitePoolOptions::new()
            .max_connections(4)
            .connect_with(options)
            .await
            .map_err(sqlx_error)?;
''',
              '''        let pool = crate::sqlite::open_durable_evidence_pool(path).await?;
''',
          )

          replace_once(
              "codex-rs/.config/nextest.toml",
              '''[profile.local]
inherits = "default"
''',
              '''[profile.local]
inherits = "default"

[profile.local.junit]
# Exact-candidate qualification consumes this machine result. Keep it explicit:
# nested output configuration must not depend on profile-table inheritance.
path = "junit.xml"
''',
          )

          replace_once(
              "scripts/channel_matrix_evidence.py",
              '''    "codex-rs/hepta-matrix-sdk", "codex-rs/hepta-matrixd",
    "docs/modules/channel.matrix", "scripts/verify_channel_matrix_candidate.py",
''',
              '''    "codex-rs/hepta-matrix-sdk", "codex-rs/hepta-matrixd",
    "codex-rs/hepta-operations", "codex-rs/state",
    "docs/modules/channel.matrix", "scripts/verify_channel_matrix_candidate.py",
''',
          )
          replace_once(
              ".github/workflows/channel-matrix-preserve-unknown.yml",
              "      - 'codex-rs/hepta-contracts/**'\n",
              "      - 'codex-rs/hepta-contracts/**'\n      - 'codex-rs/hepta-operations/**'\n",
          )
          PY

          cd codex-rs
          cargo fmt --package codex-hepta-operations -- --check || cargo fmt --package codex-hepta-operations
          cargo clippy --fix --allow-dirty --allow-staged -p codex-hepta-operations --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-operations --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-operations
          cd ..
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' -v

      - name: Commit verified repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/channel-matrix-hardening-apply.yml
          git add \
            .github/workflows/channel-matrix-preserve-unknown.yml \
            codex-rs/.config/nextest.toml \
            codex-rs/hepta-operations/Cargo.toml \
            codex-rs/hepta-operations/src/lib.rs \
            codex-rs/hepta-operations/src/sqlite.rs \
            codex-rs/hepta-operations/src/destination_dedupe.rs \
            codex-rs/hepta-operations/src/durable_store.rs \
            scripts/channel_matrix_evidence.py
          git diff --cached --check
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/workflows/channel-matrix-hardening-apply.yml
          .github/workflows/channel-matrix-preserve-unknown.yml
          codex-rs/.config/nextest.toml
          codex-rs/hepta-operations/Cargo.toml
          codex-rs/hepta-operations/src/destination_dedupe.rs
          codex-rs/hepta-operations/src/durable_store.rs
          codex-rs/hepta-operations/src/lib.rs
          codex-rs/hepta-operations/src/sqlite.rs
          scripts/channel_matrix_evidence.py
          EOF
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'channel.matrix: close exact-candidate evidence gaps' \
            -m 'Route operation stores through the repository SQLite shim, apply strict clippy fixes, bind operation/state dependencies into the candidate snapshot, and make the local nextest JUnit output explicit for per-scenario qualification.'
          final="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote" = "$STAGING_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
          echo "FINAL_COMMIT=$final"
