name: Hepta Lane E one-shot autofix

on:
  push:
    branches:
      - codex/hepta-lane-e-gap-closure-20260910
    paths:
      - .github/workflows/hepta-lane-e-autofix.yml

permissions:
  contents: write

concurrency:
  group: hepta-lane-e-one-shot-autofix
  cancel-in-progress: false

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Apply machine-applicable strict lint repairs
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --fix --locked --allow-dirty --allow-staged \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets -- -D warnings
          cargo fmt \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification
          git diff --check

      - name: Verify repaired source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets
          cargo test --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -- --nocapture

      - name: Commit exact generated repair
        shell: bash
        run: |
          set -euo pipefail
          git add codex-rs/Cargo.lock \
            codex-rs/hepta-learning-ledger \
            codex-rs/hepta-learning-artifacts \
            codex-rs/hepta-bellman-operator \
            codex-rs/hepta-intelligence-eval \
            codex-rs/hepta-shadow-qualification
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name hepta-lane-e-bot
          git config user.email hepta-lane-e-bot@users.noreply.github.com
          git commit -m 'chore(lane-e): apply strict lint and formatting repairs'
          git push origin HEAD:codex/hepta-lane-e-gap-closure-20260910
