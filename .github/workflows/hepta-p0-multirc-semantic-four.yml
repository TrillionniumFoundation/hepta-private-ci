          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent replay only - no foundation weights, no held labels
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'numpy==2.2.6' 'safetensors==0.8.0'
          python -m pip check
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-fit-${{ github.run_id }}
          path: ${{ runner.temp }}/replay-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-blind-${{ github.run_id }}
          path: ${{ runner.temp }}/replay-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-four-original-predictions-${{ github.run_id }}
          path: ${{ runner.temp }}/replay-only
      - name: Independently replay all frozen/learned Head logits before any label opening
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/replay-only"
          python experiments/shared_stem_cell/p0_physical_replay_v5.py \
            --fit "$ROOT/fit.json" --blind "$ROOT/blind.json" \
            --granite-97m-r2 "$ROOT/granite_97m_r2.json" \
            --mmbert-small "$ROOT/mmbert_small.json" \
            --embeddinggemma-2-text "$ROOT/embeddinggemma_2_text.json" \
            --replay-root "$ROOT" --output "$ROOT/head-replay-review.json"
          python -m json.tool "$ROOT/head-replay-review.json" >/dev/null
          echo 'Replay verifies numeric Head-feature consistency, NOT checkpoint source, held labels or production acceptance.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-human-independent-head-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/replay-only/head-replay-review.json
          if-no-files-found: warn
          retention-days: 7

  independent-cold-pretrained-encoder:
    # Another hosted Runner, with a SECOND cold load of the ORIGINAL pinned
    # pretrained weights; independent of the worker that produced V5 features.
    needs: [original-human-materials, physical-four-models, independent-pretrained-replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      USE_TF: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout independently reviewed compact model loader
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: pinned-compact
          ref: e05f939f65fb76f6bdbf7470eef7e63b77284dcd
      - name: Checkout independently reviewed Gemma loader
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: pinned-gemma
          ref: f8d168a7689eb3624d97c44751791badd069e521
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-fit-${{ github.run_id }}
          path: ${{ runner.temp }}/cold-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-blind-${{ github.run_id }}
          path: ${{ runner.temp }}/cold-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-four-original-predictions-${{ github.run_id }}
          path: ${{ runner.temp }}/cold-only
      - name: Verify original independent loader source Git SHA
        run: |
          set -euo pipefail
          test "$(git -C pinned-compact rev-parse HEAD)" = e05f939f65fb76f6bdbf7470eef7e63b77284dcd
          test "$(git -C pinned-gemma rev-parse HEAD)" = f8d168a7689eb3624d97c44751791badd069e521
      - name: Install pinned safe CPU inference stack and numerical auditor
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hepta-cold-p0-venv"
          PY="$RUNNER_TEMP/hepta-cold-p0-venv/bin/python"
          "$PY" -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.10.0' 'torchvision==0.25.0' 'torchcodec==0.10.0'
          "$PY" -m pip install --only-binary=:all: \
            'transformers==5.19.0' 'sentence-transformers==6.1.0' \
            'huggingface-hub==1.33.0' 'safetensors==0.8.0' \
            'numpy==2.2.6' 'packaging==25.0' 'psutil==7.2.2' \
            'pillow==11.3.0'
          "$PY" -m pip check
          "$PY" -m pip freeze > "$RUNNER_TEMP/cold-only/cold-runtime-lock.txt"
      - name: Reacquire exact reviewed Granite and mmBERT weight bytes
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hepta-cold-p0-venv/bin/python" - <<'PYCODE'
          from pathlib import Path
          import hashlib
          from huggingface_hub import HfApi, snapshot_download
          models=(('ibm-granite/granite-embedding-97m-multilingual-r2',
                   '835ad14087e140460703cf0fae09f97d469d65c2'),
                  ('jhu-clsp/mmBERT-small',
                   '0eb3d056ec1d6333cf4e19b0966dfde342a41a3a'))
          for name,revision in models:
              info=HfApi().model_info(repo_id=name,revision=revision,files_metadata=True)
              if info.sha!=revision:raise ValueError('unpinned cold real model revision')
              root=Path(snapshot_download(repo_id=name,revision=revision,
                    allow_patterns=['*.json','*.safetensors','*.txt','*.model']))
              found={p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}
              if not {'model.safetensors','tokenizer.json','config.json'}<=set(found):
                  raise ValueError('incomplete original cold pretrained model files')
              if any(f.endswith(('.bin','.pkl','.pickle','.pt','.py')) for f in found):
                  raise ValueError('insecure pretrained serialization found')
              for sibling in info.siblings:
                  if sibling.rfilename not in found:continue
                  lfs=sibling.lfs
                  expected=lfs.get('sha256') if isinstance(lfs,dict) else getattr(lfs,'sha256',None)
                  if expected and hashlib.sha256(found[sibling.rfilename].read_bytes()).hexdigest()!=expected:
                      raise ValueError('cold original safetensors or tokenizer bytes changed')
          PYCODE
      - name: Prepare newly loaded original Gemma text-only checkpoint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cold-work"
          "$RUNNER_TEMP/hepta-cold-p0-venv/bin/python" \
            pinned-gemma/qualification/neuron-dynamic-learning/prepare_gemma2_snapshot.py \
            --revision 914f7f89142e33e77833254d9c9b90c3cef7303b \
            --destination "$RUNNER_TEMP/cold-work/gemma-snapshot" \
            --profile text --dimension 256 --precision float32 \
            > "$RUNNER_TEMP/cold-only/gemma-cold-source-receipt.json"
      - name: Re-forward 2 source-disjoint pairs per train/cal/test split per model
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cold-only"
          PY="$RUNNER_TEMP/hepta-cold-p0-venv/bin/python"
          if ! timeout --signal=TERM --kill-after=30s 8500s "$PY" \
            experiments/shared_stem_cell/p0_cold_encoder_replay_v6.py \
            --fit "$ROOT/fit.json" --blind "$ROOT/blind.json" \
            --granite-97m-r2 "$ROOT/granite_97m_r2.json" \
            --mmbert-small "$ROOT/mmbert_small.json" \
            --embeddinggemma-2-text "$ROOT/embeddinggemma_2_text.json" \
            --replay-root "$ROOT" --compact-checkout pinned-compact \
            --gemma-checkout pinned-gemma \
            --gemma-manifest "$RUNNER_TEMP/cold-work/gemma-snapshot/manifest.json" \
            --output "$ROOT/independent-cold-encoder.json"; then
            printf '%s\n' 'cold re-forward did not establish physical Encoder feature parity' > "$ROOT/cold-failed.txt"
            exit 1
          fi
          "$PY" -m json.tool "$ROOT/independent-cold-encoder.json" >/dev/null
          echo 'Q24 tolerance 2 units was fixed before model execution. No held label or release permission.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-p0-independent-cold-encoder-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cold-only/independent-cold-encoder.json
            ${{ runner.temp }}/cold-only/gemma-cold-source-receipt.json
            ${{ runner.temp }}/cold-only/cold-runtime-lock.txt
            ${{ runner.temp }}/cold-only/cold-failed.txt
          if-no-files-found: warn
          retention-days: 7

  independent-original-head-training:
    # Replay the ENTIRE original 40-step SGD trajectory on BOTH frozen-Encoder
    # views in another CPU process. This job never downloads held labels,
    # original giant foundation checkpoints or any effect-grant material.
    needs: [original-human-materials, physical-four-models, independent-pretrained-replay, independent-cold-pretrained-encoder]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU optimizer and bounded safetensors reader; no pretrained weights
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/independent-v7-venv"
          PY="$RUNNER_TEMP/independent-v7-venv/bin/python"
          "$PY" -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          "$PY" -m pip install --only-binary=:all: 'numpy==2.2.6' 'safetensors==0.8.0'
          "$PY" -m pip check
          mkdir -p "$RUNNER_TEMP/training-only"
          "$PY" -m pip freeze > "$RUNNER_TEMP/training-only/cpu-runtime.txt"
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-fit-${{ github.run_id }}
          path: ${{ runner.temp }}/training-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-blind-${{ github.run_id }}
          path: ${{ runner.temp }}/training-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-four-original-predictions-${{ github.run_id }}
          path: ${{ runner.temp }}/training-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-independent-head-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/training-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-p0-independent-cold-encoder-${{ github.run_id }}
          path: ${{ runner.temp }}/training-only
      - name: Refit two Heads per model from exact original human TRAIN labels and archived Q24 features
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/training-only"
          PY="$RUNNER_TEMP/independent-v7-venv/bin/python"
          if ! timeout --signal=TERM --kill-after=15s 1100s "$PY" \
            experiments/shared_stem_cell/p0_independent_training_replay_v7.py \
            --fit "$ROOT/fit.json" --blind "$ROOT/blind.json" \
            --granite-97m-r2 "$ROOT/granite_97m_r2.json" \
            --mmbert-small "$ROOT/mmbert_small.json" \
            --embeddinggemma-2-text "$ROOT/embeddinggemma_2_text.json" \
            --head-replay "$ROOT/head-replay-review.json" \
            --cold-replay "$ROOT/independent-cold-encoder.json" \
            --replay-root "$ROOT" --output "$ROOT/independent-v7-train.json"; then
            echo 'Independent original 40-step two-Head SGD replay rejected' > "$ROOT/train-replay-failed.txt"
            exit 1
          fi
          "$PY" -m json.tool "$ROOT/independent-v7-train.json" >/dev/null
          echo 'Recomputed original-target SGD; NO held label, no pretrained model selection or authority.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-p0-original-training-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/training-only/independent-v7-train.json
            ${{ runner.temp }}/training-only/train-replay-failed.txt
            ${{ runner.temp }}/training-only/cpu-runtime.txt
          if-no-files-found: warn
          retention-days: 7

  independent-human-score:
    needs: [original-human-materials, physical-four-models, independent-pretrained-replay, independent-cold-pretrained-encoder, independent-original-head-training]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-fit-${{ github.run_id }}
          path: ${{ runner.temp }}/score-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-blind-${{ github.run_id }}
          path: ${{ runner.temp }}/score-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-owner-labels-${{ github.run_id }}
          path: ${{ runner.temp }}/score-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-four-original-predictions-${{ github.run_id }}
          path: ${{ runner.temp }}/score-only
      - name: Independently re-fetch exact original human dataset source
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'huggingface-hub==1.33.0' 'pyarrow==21.0.0'
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import json,hashlib,os,shutil
          root=Path(os.environ['RUNNER_TEMP'])/'score-only'
          meta=json.loads((root/'fit.json').read_text())['metadata']
          repo,revision=meta['repo'],meta['revision']
          for split,relative,expected in [('train','multirc/train-00000-of-00001.parquet',meta['train_sha256']),
                                          ('validation','multirc/validation-00000-of-00001.parquet',meta['validation_sha256'])]:
              original=Path(hf_hub_download(repo_id=repo,repo_type='dataset',revision=revision,filename=relative))
              if hashlib.sha256(original.read_bytes()).hexdigest()!=expected:raise RuntimeError('original human source drift')
              shutil.copyfile(original,root/f'{split}.parquet')
          PY
      - name: Independent original human-label scoring and lexical relation challenge
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/score-only"
          python experiments/shared_stem_cell/p0_multirc_semantic_review.py \
            --fit "$ROOT/fit.json" --blind "$ROOT/blind.json" \
            --labels "$ROOT/owner-only-human-labels.json" \
            --train-parquet "$ROOT/train.parquet" --validation-parquet "$ROOT/validation.parquet" \
            --granite-97m-r2 "$ROOT/granite_97m_r2.json" \
            --mmbert-small "$ROOT/mmbert_small.json" \
            --embeddinggemma-2-text "$ROOT/embeddinggemma_2_text.json" \
            --laya421-nochange "$ROOT/laya421_nochange.json" \
            --output "$ROOT/independent-human-semantic-score.json"
          python -m json.tool "$ROOT/independent-human-semantic-score.json" >/dev/null
          echo 'No generated counterfactual truth, no Stem selection, no final-use.'
      - name: Independent source-replayed TRAINED question-only Head comparison
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/score-only"
          python experiments/shared_stem_cell/p0_question_only_review.py \
            --fit "$ROOT/fit.json" --blind "$ROOT/blind.json" \
            --labels "$ROOT/owner-only-human-labels.json" \
            --train-parquet "$ROOT/train.parquet" --validation-parquet "$ROOT/validation.parquet" \
            --granite-97m-r2 "$ROOT/granite_97m_r2.json" \
            --mmbert-small "$ROOT/mmbert_small.json" \
            --embeddinggemma-2-text "$ROOT/embeddinggemma_2_text.json" \
            --laya421-nochange "$ROOT/laya421_nochange.json" \
            --output "$ROOT/matched-question-only-score.json"
          python -m json.tool "$ROOT/matched-question-only-score.json" >/dev/null
          echo 'Original human target only; eight independent source groups; DENY_ALL.'
      - name: Independently charge real Encoder input lengths and whole trial cost
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/score-only"
          python experiments/shared_stem_cell/p0_encoding_cost_frontier.py \
            --fit "$ROOT/fit.json" --blind "$ROOT/blind.json" \
            --labels "$ROOT/owner-only-human-labels.json" \
            --train-parquet "$ROOT/train.parquet" --validation-parquet "$ROOT/validation.parquet" \
            --matched-score "$ROOT/matched-question-only-score.json" \
            --granite-97m-r2 "$ROOT/granite_97m_r2.json" \
            --mmbert-small "$ROOT/mmbert_small.json" \
            --embeddinggemma-2-text "$ROOT/embeddinggemma_2_text.json" \
            --laya421-nochange "$ROOT/laya421_nochange.json" \
            --output "$ROOT/encoding-inclusive-cost-frontier.json"
          python -m json.tool "$ROOT/encoding-inclusive-cost-frontier.json" >/dev/null
          echo 'Source-bound cost lower bounds only; no model selection, authority or false equal-FLOP claim.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-human-independent-semantic-score-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/score-only/independent-human-semantic-score.json
            ${{ runner.temp }}/score-only/matched-question-only-score.json
            ${{ runner.temp }}/score-only/encoding-inclusive-cost-frontier.json
          if-no-files-found: warn
          retention-days: 7
