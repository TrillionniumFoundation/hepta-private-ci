name: Hepta P0 original-human MultiRC semantic four-Stem (DENY_ALL)
'on':
  pull_request:
    paths:
      - 'experiments/shared_stem_cell/p0_multirc_semantic_material.py'
      - 'experiments/shared_stem_cell/p0_multirc_semantic_execute.py'
      - 'experiments/shared_stem_cell/p0_multirc_semantic_review.py'
      - 'experiments/shared_stem_cell/p0_question_only_head.py'
      - 'experiments/shared_stem_cell/p0_question_only_review.py'
      - 'experiments/shared_stem_cell/p0_encoding_cost_frontier.py'
      - 'experiments/shared_stem_cell/p0_physical_replay_v5.py'
      - 'experiments/shared_stem_cell/p0_cold_encoder_replay_v6.py'
      - 'experiments/shared_stem_cell/p0_independent_training_replay_v7.py'
      - 'experiments/shared_stem_cell/p0_partial_pretrained_diagnostic_v8.py'
      - 'experiments/shared_stem_cell/test_p0_partial_pretrained_diagnostic_v8.py'
      - 'experiments/shared_stem_cell/P0_PARTIAL_REAL_MODEL_DIAGNOSTIC_V8.md'
      - 'experiments/shared_stem_cell/test_p0_independent_training_replay_v7.py'
      - 'experiments/shared_stem_cell/P0_INDEPENDENT_TRAINING_REPLAY_V7.md'
      - 'experiments/shared_stem_cell/test_p0_cold_encoder_replay_v6.py'
      - 'experiments/shared_stem_cell/P0_COLD_PRETRAINED_ENCODER_V6.md'
      - 'experiments/shared_stem_cell/test_p0_physical_replay_v5.py'
      - 'experiments/shared_stem_cell/P0_INDEPENDENT_HEAD_REPLAY_V5.md'
      - 'experiments/shared_stem_cell/test_p0_encoding_cost_frontier.py'
      - 'experiments/shared_stem_cell/P0_ENCODING_INCLUSIVE_FRONTIER_V4.md'
      - 'experiments/shared_stem_cell/test_p0_question_only_matched.py'
      - 'experiments/shared_stem_cell/test_p0_multirc_semantic.py'
      - 'experiments/shared_stem_cell/P0_MULTIRC_HUMAN_SEMANTIC.md'
      - 'experiments/shared_stem_cell/P0_MATCHED_QUESTION_ONLY_CONTROL.md'
      - 'experiments/shared_stem_cell/p0_parallel_model_collector_v10.py'
      - 'experiments/shared_stem_cell/test_p0_parallel_model_collector_v10.py'
      - 'experiments/shared_stem_cell/P0_PARALLEL_PHYSICAL_MODEL_V10.md'
      - '.github/workflows/hepta-p0-multirc-semantic-four.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned real CPU optimizer and explicit NumPy dependency
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --only-binary=:all: 'numpy==2.2.6' 'packaging==25.0' 'safetensors==0.8.0'
          python -m pip check
          python - <<'PY'
          import torch,numpy
          assert torch.tensor([1.0],dtype=torch.float32).numpy()[0]==1.0
          PY
      - name: Complete original-source, artifact and genuine-SGD fault regression
        run: |
          set -euo pipefail
          python -m py_compile experiments/shared_stem_cell/p0_multirc_semantic_material.py \
            experiments/shared_stem_cell/p0_multirc_semantic_execute.py \
            experiments/shared_stem_cell/p0_multirc_semantic_review.py \
            experiments/shared_stem_cell/p0_question_only_head.py \
            experiments/shared_stem_cell/p0_question_only_review.py \
            experiments/shared_stem_cell/p0_encoding_cost_frontier.py \
            experiments/shared_stem_cell/p0_physical_replay_v5.py \
            experiments/shared_stem_cell/p0_cold_encoder_replay_v6.py \
            experiments/shared_stem_cell/p0_independent_training_replay_v7.py \
            experiments/shared_stem_cell/p0_partial_pretrained_diagnostic_v8.py \
            experiments/shared_stem_cell/p0_pretrained_checkpoint_preflight_v9.py \
            experiments/shared_stem_cell/test_p0_real_preflight_v9.py \
            experiments/shared_stem_cell/p0_parallel_model_collector_v10.py \
            experiments/shared_stem_cell/test_p0_parallel_model_collector_v10.py \
            experiments/shared_stem_cell/test_p0_partial_pretrained_diagnostic_v8.py \
            experiments/shared_stem_cell/test_p0_cold_encoder_replay_v6.py \
            experiments/shared_stem_cell/test_p0_independent_training_replay_v7.py \
            experiments/shared_stem_cell/test_p0_physical_replay_v5.py \
            experiments/shared_stem_cell/test_p0_encoding_cost_frontier.py \
            experiments/shared_stem_cell/test_p0_question_only_matched.py \
            experiments/shared_stem_cell/test_p0_squad_causal.py \
            experiments/shared_stem_cell/test_p0_multirc_semantic.py
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_multirc_semantic.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_multirc_semantic.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_question_only_matched.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_question_only_matched.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_encoding_cost_frontier.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_encoding_cost_frontier.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_physical_replay_v5.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_physical_replay_v5.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_squad_causal.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_squad_causal.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_cold_encoder_replay_v6.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_cold_encoder_replay_v6.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_independent_training_replay_v7.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_independent_training_replay_v7.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_partial_pretrained_diagnostic_v8.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_partial_pretrained_diagnostic_v8.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_real_preflight_v9.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_real_preflight_v9.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_parallel_model_collector_v10.py' -v
          PYTHONPATH=experiments/shared_stem_cell python -O -m unittest discover \
            -s experiments/shared_stem_cell -p 'test_p0_parallel_model_collector_v10.py' -v

  original-human-materials:
    needs: semantic-source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire original fixed-revision MultiRC train and validation source
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'huggingface-hub==1.33.0' 'pyarrow==21.0.0'
          mkdir -p "$RUNNER_TEMP/human-source"
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          rev='4e14482c58d790d467ecfb29b6790e1917bf8756'
          repo='aps/super_glue'
          info=HfApi().dataset_info(repo_id=repo,revision=rev,files_metadata=True)
          assert info.sha==rev
          original={'train':'multirc/train-00000-of-00001.parquet',
                    'validation':'multirc/validation-00000-of-00001.parquet'}
          out={'repository':repo,'revision':rev,'original_file_sha256':{}}
          for split,name in original.items():
              p=Path(hf_hub_download(repo_id=repo,repo_type='dataset',revision=rev,filename=name))
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              sister=next((s for s in info.siblings if s.rfilename==name),None)
              assert sister is not None
              lfs=sister.lfs
              expected=lfs.get('sha256') if isinstance(lfs,dict) else getattr(lfs,'sha256',None)
              if expected: assert sha==expected
              target=Path(os.environ['RUNNER_TEMP'])/'human-source'/f'{split}.parquet'
              shutil.copyfile(p,target)
              out['original_file_sha256'][split]=sha
          (Path(os.environ['RUNNER_TEMP'])/'human-source/source-lock.json').write_text(
              json.dumps(out,sort_keys=True),encoding='utf-8')
          PY
      - name: Construct real human labels separately from model blind material
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/human-source"
          TRAIN_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/human-source/source-lock.json"))["original_file_sha256"]["train"])')
          VAL_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/human-source/source-lock.json"))["original_file_sha256"]["validation"])')
          python experiments/shared_stem_cell/p0_multirc_semantic_material.py \
            --train-parquet "$ROOT/train.parquet" --validation-parquet "$ROOT/validation.parquet" \
            --train-sha256 "$TRAIN_SHA" --validation-sha256 "$VAL_SHA" \
            --output "$ROOT/materials" > "$ROOT/preparation-summary.json"
          python -m json.tool "$ROOT/preparation-summary.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-human-original-fit-${{ github.run_id }}
          path: ${{ runner.temp }}/human-source/materials/fit.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-human-original-blind-${{ github.run_id }}
          path: ${{ runner.temp }}/human-source/materials/blind.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-human-owner-labels-${{ github.run_id }}
          path: ${{ runner.temp }}/human-source/materials/owner-only-human-labels.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-human-original-source-lock-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/human-source/source-lock.json
            ${{ runner.temp }}/human-source/preparation-summary.json
          if-no-files-found: warn
          retention-days: 7

  physical-single-model:
    # Four independent physical CPU Runners. Failure in one source/model must
    # not erase valid results produced by a different model. A successful
    # ATTEMPT job is never equal to four-model scientific success.
    needs: original-human-materials
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        model: [granite_97m_r2, mmbert_small, embeddinggemma_2_text, laya421_nochange]
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      USE_TF: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned compact source for Encoder arms only
        if: ${{ matrix.model != 'laya421_nochange' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: pinned-compact
          ref: e05f939f65fb76f6bdbf7470eef7e63b77284dcd
      - name: Checkout pinned Gemma implementation for Gemma only
        if: ${{ matrix.model == 'embeddinggemma_2_text' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: pinned-gemma
          ref: f8d168a7689eb3624d97c44751791badd069e521
      - name: Verify immutable original research implementation identities
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'
          if [ "$MODEL" != 'laya421_nochange' ]; then
            test "$(git -C pinned-compact rev-parse HEAD)" = e05f939f65fb76f6bdbf7470eef7e63b77284dcd
          fi
          if [ "$MODEL" = embeddinggemma_2_text ]; then
            test "$(git -C pinned-gemma rev-parse HEAD)" = f8d168a7689eb3624d97c44751791badd069e521
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-fit-${{ github.run_id }}
          path: ${{ runner.temp }}/blind-model
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-blind-${{ github.run_id }}
          path: ${{ runner.temp }}/blind-model
      - name: Pin original CPU runtime without shared mutable model state
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'
          ROOT="$RUNNER_TEMP/physical"
          mkdir -p "$ROOT"
          python -m venv "$RUNNER_TEMP/human-p0-venv"
          PY="$RUNNER_TEMP/human-p0-venv/bin/python"
          "$PY" -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.10.0' 'torchvision==0.25.0' 'torchcodec==0.10.0'
          "$PY" -m pip install --only-binary=:all: \
            'transformers==5.19.0' 'sentence-transformers==6.1.0' \
            'huggingface-hub==1.33.0' 'safetensors==0.8.0' \
            'numpy==2.2.6' 'packaging==25.0' 'psutil==7.2.2' \
            'pyarrow==21.0.0' 'pillow==11.3.0'
          if [ "$MODEL" = laya421_nochange ]; then
            "$PY" -m pip install --only-binary=:all: 'laya==0.3.20'
          fi
          "$PY" -m pip check
          "$PY" -m pip freeze > "$ROOT/$MODEL.runtime.txt"
      - name: Source-preflight ONLY this pinned model, never other arms
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'
          ROOT="$RUNNER_TEMP/physical"
          PY="$RUNNER_TEMP/human-p0-venv/bin/python"
          mkdir -p "$ROOT"
          if [ "$MODEL" = granite_97m_r2 ] || [ "$MODEL" = mmbert_small ]; then
            "$PY" experiments/shared_stem_cell/p0_pretrained_checkpoint_preflight_v9.py \
              --model "$MODEL" --output-root "$ROOT"
          fi
          if [ "$MODEL" = embeddinggemma_2_text ]; then
            if timeout --signal=TERM --kill-after=30s 1200s "$PY" \
              pinned-gemma/qualification/neuron-dynamic-learning/prepare_gemma2_snapshot.py \
              --revision 914f7f89142e33e77833254d9c9b90c3cef7303b \
              --destination "$ROOT/gemma-snapshot" \
              --profile text --dimension 256 --precision float32 \
              > "$ROOT/gemma-source-receipt.json"; then
              test -s "$ROOT/gemma-snapshot/manifest.json" || \
                printf '%s\n' 'Gemma original pinned source manifest missing' > "$ROOT/$MODEL.failed.txt"
            else
              printf '%s\n' 'Gemma pinned checkpoint preparation failed' > "$ROOT/$MODEL.failed.txt"
            fi
          fi
      - name: Attempt ONE actual pretrained model; preserve its negative outcome
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'
          ROOT="$RUNNER_TEMP/physical"
          PY="$RUNNER_TEMP/human-p0-venv/bin/python"
          mkdir -p "$ROOT"
          if [ -s "$ROOT/$MODEL.failed.txt" ]; then
            echo "Pinned $MODEL source failed; no synthetic or alternate checkpoint"
          else
            REPLAY_ARGS=()
            if [ "$MODEL" != laya421_nochange ]; then
              REPLAY_ARGS=(--replay-dir "$ROOT/$MODEL.replay")
            fi
            if timeout --signal=TERM --kill-after=30s 3200s "$PY" \
              experiments/shared_stem_cell/p0_multirc_semantic_execute.py \
              --fit "$RUNNER_TEMP/blind-model/fit.json" \
              --blind "$RUNNER_TEMP/blind-model/blind.json" \
              --model "$MODEL" \
              --compact-checkout pinned-compact --gemma-checkout pinned-gemma \
              --gemma-manifest "$ROOT/gemma-snapshot/manifest.json" \
              --output "$ROOT/$MODEL.json" "${REPLAY_ARGS[@]}"; then
              echo "Original pretrained $MODEL candidate physically completed"
            else
              printf '%s\n' "$MODEL original pinned pretrained inference failed or timed out" \
                > "$ROOT/$MODEL.failed.txt"
            fi
          fi
      - name: Retain model-only original material and sanitized failure slots
        if: always()
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'
          ROOT="$RUNNER_TEMP/physical"
          OUT="$RUNNER_TEMP/physical-public"
          mkdir -p "$ROOT" "$OUT"
          # Failed setup, checkout, venv, source or physical execution must all
          # yield an explicit failed slot, never an unobserved success.
          if [ ! -f "$ROOT/$MODEL.json" ] && [ ! -f "$ROOT/$MODEL.failed.txt" ]; then
            printf '%s\n' "$MODEL runner bootstrap or model attempt incomplete" \
              > "$ROOT/$MODEL.failed.txt"
          fi
          for f in "$MODEL.json" "$MODEL.failed.txt" "$MODEL.runtime.txt"; do
            if [ -f "$ROOT/$f" ]; then cp "$ROOT/$f" "$OUT/$f"; fi
          done
          if [ -d "$ROOT/$MODEL.replay" ]; then
            cp -R "$ROOT/$MODEL.replay" "$OUT/$MODEL.replay"
          fi
          if [ -f "$ROOT/compact-preflight-v9.json" ]; then
            cp "$ROOT/compact-preflight-v9.json" "$OUT/$MODEL.preflight-v9.json"
          fi
          if [ "$MODEL" = embeddinggemma_2_text ] && \
             [ -f "$ROOT/gemma-source-receipt.json" ]; then
            cp "$ROOT/gemma-source-receipt.json" "$OUT/gemma-source-receipt.json"
          fi
          test ! -e "$OUT/gemma-snapshot"
          MODEL="$MODEL" OUT="$OUT" python - <<'PYCODE'
          import json,os
          from pathlib import Path
          model=os.environ['MODEL'];out=Path(os.environ['OUT'])
          passed=(out/f'{model}.json').is_file() and not (out/f'{model}.failed.txt').exists()
          result={'schema':'hepta.p0.single-original-model-attempt.v10',
                  'model':model,'outcome':'model_report_written' if passed else 'failed_or_incomplete',
                  'authority':'DENY_ALL','production_promotion_permitted':False,
                  'held_test_labels_accessed':False}
          with (out/f'attempt-{model}.json').open('x',encoding='utf8') as h:
              json.dump(result,h,sort_keys=True,allow_nan=False);h.write('\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-human-original-arm-${{ matrix.model }}-${{ github.run_id }}
          path: ${{ runner.temp }}/physical-public/
          if-no-files-found: error
          retention-days: 7

  physical-four-models:
    # IMPORTANT: only THIS collector is an all-four gate. Four matrix attempt
    # jobs are separate, never allowed to present partial source as accepted.
    if: ${{ always() && needs['original-human-materials'].result == 'success' }}
    needs: [original-human-materials, physical-single-model]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent bounded NumPy and safetensors, no pretrained weights
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'numpy==2.2.6' 'safetensors==0.8.0'
          python -m pip check
      - uses: actions/download-artifact@v4
        with:
          pattern: hepta-human-original-arm-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/physical-collected
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-fit-${{ github.run_id }}
          path: ${{ runner.temp }}/physical-collected
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-blind-${{ github.run_id }}
          path: ${{ runner.temp }}/physical-collected
      - name: Join all original attempted outcomes, DENY missing source and labels
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/physical-collected"
          python experiments/shared_stem_cell/p0_parallel_model_collector_v10.py \
            --fit "$ROOT/fit.json" --blind "$ROOT/blind.json" \
            --artifacts-root "$ROOT" --output "$ROOT/all-four-original-census-v10.json"
          python -m json.tool "$ROOT/all-four-original-census-v10.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-human-four-original-predictions-${{ github.run_id }}
          path: ${{ runner.temp }}/physical-collected/
          if-no-files-found: error
          retention-days: 7

  partial-original-model-diagnostic:
    # This diagnostic MUST run even when physical-four-models fails after
    # successfully uploading a subset of its original producer artifacts.
    # Source material still has to be valid and complete; it never opens labels.
    if: ${{ always() && needs['original-human-materials'].result == 'success' }}
    needs: [original-human-materials, physical-four-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded numerical audit dependencies, no pretrained model weights
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'numpy==2.2.6' 'safetensors==0.8.0'
          python -m pip check
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-fit-${{ github.run_id }}
          path: ${{ runner.temp }}/partial-model-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-original-blind-${{ github.run_id }}
          path: ${{ runner.temp }}/partial-model-only
      - uses: actions/download-artifact@v4
        with:
          name: hepta-human-four-original-predictions-${{ github.run_id }}
          path: ${{ runner.temp }}/partial-model-only
      - name: Audit each original model, retain failures, never open held labels
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/partial-model-only"
          python experiments/shared_stem_cell/p0_partial_pretrained_diagnostic_v8.py \
            --fit "$ROOT/fit.json" --blind "$ROOT/blind.json" \
            --artifacts-root "$ROOT" --output "$ROOT/partial-diagnostic-v8.json"
          python -m json.tool "$ROOT/partial-diagnostic-v8.json" >/dev/null
          echo 'DIAGNOSTIC ONLY: partial numeric consistency, never model quality, Stem selection or FinalUse.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-p0-partial-model-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/partial-model-only/partial-diagnostic-v8.json
          if-no-files-found: warn
          retention-days: 7

  independent-pretrained-replay:
    needs: [original-human-materials, physical-four-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
