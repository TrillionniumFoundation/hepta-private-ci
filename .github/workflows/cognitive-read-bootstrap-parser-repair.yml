name: Cognitive read bootstrap parser repair

on:
  push:
    branches:
      - work/cognitive-read-full-convergence-20260926

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(cognitive.read): repair bootstrap parser' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Repair parser and relaunch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/cognitive-read-full-convergence-bootstrap.yml')
          text = path.read_text(encoding='utf-8')
          old = "    if: github.event.head_commit.message == 'chore(cognitive.read): launch full convergence'\n"
          new = "    if: \"${{ github.event.head_commit.message == 'chore(cognitive.read): launch full convergence' }}\"\n"
          if text.count(old) != 1:
              raise SystemExit('bootstrap if-expression anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/cognitive-read-bootstrap-parser-repair.yml
          git config user.name 'hepta-ci-convergence'
          git config user.email 'hepta-ci-convergence@users.noreply.github.com'
          git add -A
          git commit -m 'chore(cognitive.read): launch full convergence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
