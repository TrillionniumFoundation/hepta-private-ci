name: Hepta objective product composition

on:
  pull_request:
    paths:
      - "codex-rs/hepta-objective/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.lock"
      - "scripts/test_hepta_objective_contracts.py"
      - ".github/workflows/hepta-objective-product-composition.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source or deterministic merge candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ] && [ "$SOURCE_SHA" != "$BASE_SHA" ]; then
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only, no selection' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}
      - name: Prepare native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
      - name: Contract authority drift guard
        run: python3 -m unittest -v scripts.test_hepta_objective_contracts
      - name: Verify lock and formatting
        working-directory: codex-rs
        run: |
          python3 ../scripts/verify_cargo_lock.py
          cargo fmt --package codex-hepta-objective --package codex-hepta-learning-ledger --package codex-hepta-intelligence --package codex-hepta-agentd -- --check
      - name: Compile product objective chain
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-objective -p codex-hepta-learning-ledger -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets
      - name: Test product objective chain
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-objective
          cargo test --locked -p codex-hepta-learning-ledger
          cargo test --locked -p codex-hepta-intelligence product_objective -- --nocapture
          cargo test --locked -p codex-hepta-agentd objective -- --nocapture
      - name: Strict lint
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-objective -p codex-hepta-learning-ledger -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Exact tracked-source cleanliness
        if: always()
        run: |
          git diff --check
          git diff --exit-code
