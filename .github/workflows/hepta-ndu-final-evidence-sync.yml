name: NDU one-shot read-only qualification convergence

on:
  push:
    branches:
      - work/utility-ndu-abcd-convergence-20260928
    paths:
      - .github/workflows/hepta-ndu-final-evidence-sync.yml

permissions:
  contents: read

concurrency:
  group: ndu-one-shot-read-only-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the exact convergence request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Replace branch-mutating qualification with a read-only chain
        shell: bash
        env:
          REQUEST_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: work/utility-ndu-abcd-convergence-20260928
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          git fetch --no-tags origin "$EXPECTED_BRANCH" main
          test "$(git rev-parse origin/$EXPECTED_BRANCH)" = "$REQUEST_SHA"
          BASE_SHA=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$BASE_SHA" HEAD

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path.cwd()
          status_path = root / "docs/modules/utility.ndu/STATUS.md"
          status = status_path.read_text(encoding="utf-8")
          start_marker = "## Exact A–D engineering qualification binding (2026-09-28)\n"
          end_marker = "# utility.ndu status and claim boundary\n"
          start = status.index(start_marker)
          end = status.index(end_marker, start)
          replacement = "\n".join([
              "## Exact A–D engineering qualification protocol (2026-09-29)",
              "",
              "The convergence branch is `work/utility-ndu-abcd-convergence-20260928`. Its",
              "qualification path is the read-only workflow",
              "`.github/workflows/hepta-ndu-recursion.yml`. The workflow resolves the exact PR",
              "head at run start, executes source-head and deterministic synthetic-merge lanes",
              "for source, core, callers, product, strict lint and host suites, and independently",
              "reopens every retained receipt and checksum before publishing one aggregate.",
              "",
              "Qualification jobs have `contents: read` and never normalize source, merge a base,",
              "rewrite evidence prose, or push a descendant commit. A new commit therefore",
              "invalidates the previous required check instead of inheriting its result. The",
              "concrete source SHA, source tree, baseline SHA and synthetic-merge identity live in",
              "the immutable aggregate artifact and PR metadata. They are intentionally not",
              "embedded into the commit that contains this document because that would create an",
              "unstable self-reference. Historical runs remain evidence for their own exact",
              "commits only.",
              "",
              "A successful `ndu-qualified-evidence-<exact-source-sha>` aggregate establishes the",
              "engineering qualification fields for that exact source only. It does not select",
              "or activate a production writer, enroll a production clock/frontier, prove",
              "physical power-loss durability, or grant release authority.",
              "",
              "",
          ])
          status = status[:start] + replacement + status[end:]
          old = "`exactHeadSourceQualification` for this revision is bound to workflow run `36393371823` and is established only when that run finishes with a successful aggregate for its emitted exact source SHA. An older source result, an unchanged code subtree, or a workflow definition is never substituted for that receipt.\n"
          new = "`exactHeadSourceQualification` is derived only from the successful required check and sealed aggregate for the current PR head. The source tree does not pre-claim its own result. An older run, an unchanged code subtree, a materializer output, or a workflow definition is never substituted for the current receipt.\n"
          if old not in status:
              raise SystemExit("STATUS exact-head paragraph drifted")
          status_path.write_text(status.replace(old, new), encoding="utf-8")

          map_path = root / "docs/modules/utility.ndu/IMPLEMENTATION_MAP.json"
          mapping = json.loads(map_path.read_text(encoding="utf-8"))
          completion = mapping.setdefault("completion", {})
          completion["exactHeadQualification"] = "derived_only_from_current_read_only_dual_lane_required_check_and_sealed_aggregate"
          completion["namedHostQualification"] = "ci_host_receipts_are_exact_head_scoped; named_production_target_pending"
          completion["localDeterministicProcess"] = "implemented_and_exact_head_qualified_only_when_current_aggregate_passes; production_trust_pending"
          mapping.setdefault("sourceBase", {})["role"] = "historical_materialized_source_baseline_not_current_head_identity"
          mapping["qualificationGovernance"] = {
              "workflow": ".github/workflows/hepta-ndu-recursion.yml",
              "mode": "read_only_exact_pr_head_dual_lane",
              "branchMutationByQualification": False,
              "sourceSelfReferenceProhibited": True,
              "concreteIdentityLocation": "sealed aggregate artifact and pull-request metadata",
              "invalidatedByAnyNewCommit": True,
              "productionActivation": False,
          }
          map_path.write_text(json.dumps(mapping, indent=2) + "\n", encoding="utf-8")

          workflow_path = root / ".github/workflows/hepta-ndu-recursion.yml"
          workflow = workflow_path.read_text(encoding="utf-8")
          needle = "          tool: just@1.51.0,nextest@0.9.103\n      - name: Execute independent suite"
          replacement = "          tool: just@1.51.0,nextest@0.9.103\n          checksum: true\n      - name: Execute independent suite"
          if workflow.count(needle) != 1:
              raise SystemExit("read-only qualification tool installation drifted")
          workflow_path.write_text(workflow.replace(needle, replacement), encoding="utf-8")

          publication_path = root / ".github/workflows/hepta-ndu-evidence-publication.yml"
          publication = publication_path.read_text(encoding="utf-8")
          old_allowlist = "assert run['path'] in ['.github/workflows/hepta-ndu-recursion.yml', '.github/workflows/hepta-ndu-abcd-materialize.yml', '.github/workflows/hepta-ndu-runtime-acceptance.yml']"
          new_allowlist = "assert run['path'] == '.github/workflows/hepta-ndu-recursion.yml'"
          if publication.count(old_allowlist) != 1:
              raise SystemExit("evidence publication provenance allowlist drifted")
          publication_path.write_text(publication.replace(old_allowlist, new_allowlist), encoding="utf-8")
          PY

          rm -f \
            .github/workflows/hepta-ndu-abcd-materialize.yml \
            .github/workflows/hepta-ndu-final-regression-repair.yml \
            .github/workflows/hepta-ndu-runtime-acceptance.yml \
            .github/workflows/ndu-sync-main-and-retrigger-once.yml \
            .github/workflows/hepta-ndu-final-evidence-sync.yml

          git add -A
          python3 scripts/hepta_ndu_map_integrity.py \
            --rebind-index \
            --candidate-branch "$EXPECTED_BRANCH" \
            --baseline-main "$BASE_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path("docs/modules/utility.ndu/IMPLEMENTATION_MAP.json")
          mapping = json.loads(path.read_text(encoding="utf-8"))
          evidence = mapping.setdefault("currentSourceEvidence", {})
          evidence.update({
              "qualificationWorkflow": ".github/workflows/hepta-ndu-recursion.yml",
              "qualificationMode": "read_only_exact_pr_head_dual_lane",
              "concreteIdentityLocation": "sealed aggregate artifact and pull-request metadata",
              "sourceSelfReferenceProhibited": True,
              "invalidatedByAnyNewCommit": True,
              "productionActivation": False,
          })
          path.write_text(json.dumps(mapping, indent=2) + "\n", encoding="utf-8")
          PY

          git add docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
          git diff --cached --check
          python3 scripts/test_hepta_ndu_source_policy.py
          python3 scripts/test_hepta_ndu_map_integrity.py
          python3 scripts/test_hepta_ndu_qualification.py
          python3 scripts/test_hepta_ndu_evidence.py

          git config user.name hepta-ndu-convergence
          git config user.email qualification@invalid
          git commit -s -m "ci(ndu): make exact-head qualification read-only"
          FINAL_SHA=$(git rev-parse HEAD)
          FINAL_TREE=$(git rev-parse HEAD^{tree})
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/hepta-ndu-implementation-map-closed-world.py \
            --expected-sha "$FINAL_SHA" \
            --expected-tree "$FINAL_TREE"
          python3 scripts/hepta-ndu-qualification.py \
            --suite source \
            --lane source-head \
            --output "$RUNNER_TEMP/ndu-final-source"

          git fetch --no-tags origin "$EXPECTED_BRANCH"
          test "$(git rev-parse origin/$EXPECTED_BRANCH)" = "$REQUEST_SHA"
          git push origin "HEAD:$EXPECTED_BRANCH"

      - name: Retain the one-shot convergence source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-read-only-convergence-${{ github.sha }}
          path: ${{ runner.temp }}/ndu-final-source
          if-no-files-found: warn
          retention-days: 30
