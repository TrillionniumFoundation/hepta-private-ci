name: hepta-stem-v18-original-physical
on:
  push:
    branches:
      - research/stem-learning-investment-v18-20261016
    paths:
      - qualification/stem-cell-v1/v18_original_feature_paired.py
      - qualification/stem-cell-v1/v18_original_independent_review.py
      - qualification/stem-cell-v1/test_v18_original_feature_paired.py
      - qualification/stem-cell-v1/test_v18_original_independent_review.py
      - qualification/stem-cell-v1/STEM_V18_ORIGINAL_PHYSICAL_20261016.md
      - .github/workflows/hepta-stem-v18-original-physical.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-physical-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU research dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'safetensors==0.7.0'
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Source-only zero-delta and negative conformance
        run: |
          set -euo pipefail
          cd qualification/stem-cell-v1
          python -m unittest -q test_v18_original_feature_paired
          python -O -m unittest -q test_v18_original_feature_paired
      - name: Acquire exact original public pretrained archive and run physical A/B
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --silent --show-error --retry 2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11890616195/zip' \
            --output "$work/original.zip"
          echo '0f3c8c2ceb22b61cabb8a08ca06d2fb0a9a7f4681e9f1af45138cf7979a0e1c7'"  $work/original.zip" | sha256sum -c -
          python qualification/stem-cell-v1/stem_counterfactual_split_v14.py prepare \
            --archive "$work/original.zip" --out "$work/inputs" --labels-out "$work/held-gold.json"
          rm -- "$work/held-gold.json"
          cd qualification/stem-cell-v1
          python v18_original_feature_paired.py --inputs "$work/inputs" \
            --output "$work/physical-A.json" --private-logits "$work/private-A.json"
          python v18_original_independent_review.py --archive "$work/original.zip" \
            --report "$work/physical-A.json" --private-logits "$work/private-A.json" \
            --output "$work/review-A.json"
          HEPTA_V18_ORIGINAL_ZIP="$work/original.zip" \
            HEPTA_V18_ORIGINAL_REPORT="$work/physical-A.json" \
            HEPTA_V18_ORIGINAL_PRIVATE_LOGITS="$work/private-A.json" \
            python -m unittest -q test_v18_original_independent_review
          python -O v18_original_feature_paired.py --inputs "$work/inputs" \
            --output "$work/physical-B.json" --private-logits "$work/private-B.json"
          python -O v18_original_independent_review.py --archive "$work/original.zip" \
            --report "$work/physical-B.json" --private-logits "$work/private-B.json" \
            --output "$work/review-B.json"
          HEPTA_V18_ORIGINAL_ZIP="$work/original.zip" \
            HEPTA_V18_ORIGINAL_REPORT="$work/physical-B.json" \
            HEPTA_V18_ORIGINAL_PRIVATE_LOGITS="$work/private-B.json" \
            python -O -m unittest -q test_v18_original_independent_review
          python - "$work/physical-A.json" "$work/physical-B.json" <<'PY'
          import json, sys
          a, b = [json.load(open(path, encoding='utf-8')) for path in sys.argv[1:]]
          assert len(a['seeds']) == len(b['seeds']) == 3
          for old, new in zip(a['seeds'], b['seeds']):
              assert old['seed'] == new['seed']
              assert set(old['arms']) == set(new['arms'])
              for arm in old['arms']:
                  assert old['arms'][arm]['logit_sha256'] == new['arms'][arm]['logit_sha256']
                  assert old['arms'][arm]['metrics'] == new['arms'][arm]['metrics']
          assert a['decision'] == b['decision'] == 'DENY_ALL_HISTORICAL_CALIBRATION_ONLY'
          print('15/15 original-feature raw output SHA and metric panels matched; NO MODEL PROMOTION')
          PY
          # Never publish private logits, original text, source labels or learned weights.
