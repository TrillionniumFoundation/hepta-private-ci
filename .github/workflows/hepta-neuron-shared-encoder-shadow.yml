name: Hepta neuron shared-encoder shadow (no promotion)

on:
  pull_request:
    paths:
      - qualification/neuron-shared-encoder/**
      - .github/workflows/hepta-neuron-shared-encoder-shadow.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: neuron-shared-encoder-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shadow-smoke:
    name: Shadow-only Python contracts and synthetic matrices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        working-directory: qualification/neuron-shared-encoder
    steps:
      - name: Check out exact PR source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install CPU-only test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/neuron-shadow-venv"
          "$RUNNER_TEMP/neuron-shadow-venv/bin/python" -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          "$RUNNER_TEMP/neuron-shadow-venv/bin/python" -m pip install --disable-pip-version-check 'pytest==9.0.2' 'cryptography==46.0.4' 'safetensors==0.7.0' 'numpy==2.2.6'
          echo "$RUNNER_TEMP/neuron-shadow-venv/bin" >> "$GITHUB_PATH"

      - name: Run fail-closed regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/
          python3 -m compileall -q neuron_shared_encoder tests

      - name: Execute isolated synthetic grids, never production
        shell: bash
        run: |
          set -euo pipefail
          python3 -m neuron_shared_encoder.experiment synth-data --allow-synthetic --output smoke_dataset.jsonl --data-count 32
          python3 -m neuron_shared_encoder.experiment validate --dataset smoke_dataset.jsonl --output validated.json
          python3 -m neuron_shared_encoder.experiment head --allow-synthetic --dataset smoke_dataset.jsonl --output head_results.json --steps 16
          python3 -m neuron_shared_encoder.experiment stress --allow-synthetic --output stress_results.json --rounds 2
          python3 -m neuron_shared_encoder.experiment gate --output gate.json
          python3 - <<'PY'
          import json
          head = json.load(open('head_results.json'))
          stress = json.load(open('stress_results.json'))
          gate = json.load(open('gate.json'))
          assert head['production_admission'] == 'BLOCKED'
          assert stress['production_admission'] == 'BLOCKED'
          assert gate['status'] == 'BLOCKED'
          assert len(head['head_candidates']) == 24
          assert len(stress['results']) == 36
          assert max(x['cells'] for x in stress['results']) == 4096
          PY
          sha256sum smoke_dataset.jsonl validated.json head_results.json stress_results.json gate.json > result_hashes.txt

      - name: Execute E1-E5 regression matrix with explicit blockers
        shell: bash
        run: |
          set -euo pipefail
          DATA_SHA="$(sha256sum smoke_dataset.jsonl | cut -d' ' -f1)"
          python3 -m neuron_shared_encoder.validation_v3 e2-heads --allow-synthetic --dataset smoke_dataset.jsonl --dataset-sha256 "$DATA_SHA" --output e2_dynamic_heads.json --steps 2 --budgets 2048 16384
          python3 -m neuron_shared_encoder.strict_e2 --allow-synthetic --dataset smoke_dataset.jsonl --dataset-sha256 "$DATA_SHA" --output e2_equal_shadow.json --dimension 128 --budget 16384 --steps 2 --seeds 7 19
          python3 -m neuron_shared_encoder.validation_v3 e3-reuse --allow-synthetic --dataset smoke_dataset.jsonl --dataset-sha256 "$DATA_SHA" --output e3_input_reuse.json --batch 32 --steps 2 --budgets 2048 16384
          echo '{}' > absent_host_and_model_receipts.json
          INPUT_SHA="$(sha256sum absent_host_and_model_receipts.json | cut -d' ' -f1)"
          python3 -m neuron_shared_encoder.validation_v3 e1-plan --input-json absent_host_and_model_receipts.json --input-sha256 "$INPUT_SHA" --output e1_missing_real_models.json
          python3 -m neuron_shared_encoder.validation_v3 e5-host --input-json absent_host_and_model_receipts.json --input-sha256 "$INPUT_SHA" --output e5_missing_host_receipts.json
          python3 - <<'PY'
          import json
          e1 = json.load(open('e1_missing_real_models.json'))
          e2 = json.load(open('e2_dynamic_heads.json'))
          e2_equal = json.load(open('e2_equal_shadow.json'))
          e3 = json.load(open('e3_input_reuse.json'))
          e5 = json.load(open('e5_missing_host_receipts.json'))
          assert e1['status'] == 'BLOCKED' and not e1['real_encoder_runs_completed']
          assert e2['production_admission'] == 'BLOCKED'
          assert e2['evidence_class'] == 'SYNTHETIC_SMOKE'
          assert e2_equal['production_admission'] == 'BLOCKED'
          assert e2_equal['evidence_class'] == 'SYNTHETIC_SMOKE'
          assert e2_equal['future_used_to_select_winner'] is False
          assert e2_equal['encoder_model_forward_observation'] is None
          assert len(e2_equal['runs']) == 2
          assert all(row['candidates']['dynamic_gate']['parameter_count'] == row['candidates']['swiglu']['parameter_count'] for row in e2_equal['runs'])
          assert {'static_gate', 'dynamic_gate'} <= {x['kind'] for x in e2['candidates']}
          assert all(x['production_admission'] == 'BLOCKED' for x in (e2, e3, e5))
          assert e3['public']['encoder_forward_rows'] < e3['joint']['encoder_forward_rows']
          assert 'quality_shadow' in e3 and e3['state_adapter'] == 'SYNTHETIC_HASH_NOT_DEPLOYABLE'
          assert e3['public_vs_joint_quality_not_established']
          assert e3['joint']['model_forward_observation'] is None
          assert e3['public']['model_forward_observation'] is None
          assert not e3['joint']['model_forward_attestation_verified']
          assert not e3['public']['model_forward_attestation_verified']
          assert e5['schema_status'] == 'BLOCKED'
          PY
          sha256sum e1_missing_real_models.json e2_dynamic_heads.json e2_equal_shadow.json e3_input_reuse.json e5_missing_host_receipts.json >> result_hashes.txt

      - name: Enforce pinned Prettier YAML formatting (show diff on failure)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          npx --yes --package=prettier@3.5.3 prettier --write .github/workflows/hepta-neuron-shared-encoder-shadow.yml
          git --no-pager diff -- .github/workflows/hepta-neuron-shared-encoder-shadow.yml
          git diff --quiet -- .github/workflows/hepta-neuron-shared-encoder-shadow.yml

      - name: Retain synthetic evidence without authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neuron-shared-encoder-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification/neuron-shared-encoder/validated.json
            qualification/neuron-shared-encoder/head_results.json
            qualification/neuron-shared-encoder/stress_results.json
            qualification/neuron-shared-encoder/gate.json
            qualification/neuron-shared-encoder/result_hashes.txt
            qualification/neuron-shared-encoder/e1_missing_real_models.json
            qualification/neuron-shared-encoder/e2_dynamic_heads.json
            qualification/neuron-shared-encoder/e2_equal_shadow.json
            qualification/neuron-shared-encoder/e3_input_reuse.json
            qualification/neuron-shared-encoder/e5_missing_host_receipts.json
          if-no-files-found: warn
          retention-days: 7
