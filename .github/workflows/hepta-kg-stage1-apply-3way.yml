name: Hepta knowledge.graph stage-one three-way apply

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - .github/workflows/hepta-kg-stage1-apply-3way.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-kg-stage1-three-way-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed stage-one patch with three-way fallback
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure repository author
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"

      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - ".github/workflows/hepta-kg-stage1-apply-clean.yml" "$RUNNER_TEMP/kg-stage1.patch" <<'PY'
          import base64
          import gzip
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(
              r"cat > .*?kg\.patch\.gz\.b64.*?<<'PATCH'\n(.*?)\n\s*PATCH\n",
              source,
              flags=re.DOTALL,
          )
          if match is None:
              raise SystemExit("embedded reviewed patch was not found")
          payload = "".join(line.strip() for line in match.group(1).splitlines())
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          Path(sys.argv[2]).write_bytes(patch)
          print(f"extracted reviewed patch: {len(patch)} bytes")
          PY

          git apply --stat "$RUNNER_TEMP/kg-stage1.patch"
          git apply --3way --index "$RUNNER_TEMP/kg-stage1.patch"

      - name: Run stage-one preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/hepta_kg_stage1_preflight.py
          python3 scripts/hepta_kg_stage1_preflight.py
          git diff --check --cached
          git status --short

      - name: Commit and push exact patch result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "reviewed stage-one patch produced no changes" >&2
            exit 1
          fi
          git commit -s -m "feat(knowledge.graph): close stage-one resource correctness"
          git push origin HEAD:work/kg-abc-evidence-hardening-20260928
