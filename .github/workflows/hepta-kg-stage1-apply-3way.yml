name: Hepta knowledge.graph stage-one materialization

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - .github/workflows/hepta-kg-stage1-apply-3way.yml
  workflow_dispatch:

# Transitional one-shot materializer. The produced source commit deletes this
# workflow and every other stage-one apply workflow before it is pushed.
permissions:
  contents: write

concurrency:
  group: hepta-kg-stage1-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize reviewed stage-one patch as ordinary source
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure repository author
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"

      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - ".github/workflows/hepta-kg-stage1-apply-clean.yml" "$RUNNER_TEMP/kg-stage1.patch" <<'PY'
          import base64
          import gzip
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(
              r"cat > .*?kg\.patch\.gz\.b64.*?<<'PATCH'\n(.*?)\n\s*PATCH\n",
              source,
              flags=re.DOTALL,
          )
          if match is None:
              raise SystemExit("embedded reviewed patch was not found")
          payload = "".join(line.strip() for line in match.group(1).splitlines())
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          Path(sys.argv[2]).write_bytes(patch)
          print(f"extracted reviewed patch: {len(patch)} bytes")
          PY

          git apply --stat "$RUNNER_TEMP/kg-stage1.patch"
          git apply --3way --index "$RUNNER_TEMP/kg-stage1.patch"
          git diff --cached --check

      - name: Prepare native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v protoc >/dev/null || brew install protobuf

      - name: Format and verify materialized source
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --package codex-hepta-kg \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-memory \
            --package codex-hepta-agentd
          cargo fmt --package codex-hepta-kg \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-memory \
            --package codex-hepta-agentd -- --check
          cargo test -p codex-hepta-kg -p codex-hepta-prompt-optimizer --no-fail-fast
          cargo test -p codex-hepta-memory --lib --no-run
          cargo test -p codex-hepta-memory --test kg_delivery_consistency --no-run
          cargo clippy -p codex-hepta-kg --all-targets -- -D warnings
          cd ..
          python3 scripts/hepta_kg_legacy_guard.py
          python3 -m unittest discover -s scripts -p 'test_hepta_kg_*.py' -v
          git diff --check

      - name: Commit ordinary source and retire write workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/hepta-kg-stage1-apply.yml \
            .github/workflows/hepta-kg-stage1-apply-clean.yml \
            .github/workflows/hepta-kg-stage1-apply-3way.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "reviewed stage-one patch produced no changes" >&2
            exit 1
          fi
          git commit -s -m "feat(knowledge.graph): materialize stage-one resource correctness"
          git push origin HEAD:work/kg-abc-evidence-hardening-20260928