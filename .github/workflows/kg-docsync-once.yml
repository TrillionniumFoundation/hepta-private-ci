name: knowledge.graph one-shot documentation synchronization

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - .github/workflows/kg-docsync-once.yml

permissions:
  contents: write

concurrency:
  group: knowledge-graph-docsync-once
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/kg-abc-evidence-hardening-20260928
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic documentation synchronization and self-remove
        shell: bash
        env:
          BRANCH: work/kg-abc-evidence-hardening-20260928
        run: |
          set -euo pipefail
          git config user.name 'Hepta KG documentation synchronizer'
          git config user.email 'hepta-kg-ci@users.noreply.github.com'

          # Start from the authoritative branch tip in case the exact-candidate
          # binder advanced the implementation map while this job was queued.
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          python3 scripts/hepta_kg_documentation_sync.py --apply
          python3 scripts/hepta_kg_documentation_sync.py --check
          git rm --ignore-unmatch .github/workflows/kg-docsync-once.yml
          git diff --check
          git add docs/modules/knowledge.graph/TECHNICAL.md \
            qualification/module-execution-dossiers/detail/knowledge.graph.md \
            qualification/knowledge-graph/WRITER_SELECTION_20260927.md

          test -n "$(git diff --cached --name-only)"
          git commit \
            -m 'docs(knowledge.graph): synchronize runtime documentation' \
            -m 'Apply the repository-owned fail-closed synchronizer and remove its one-shot runner. No execution, acceptance, activation or release claim is advanced.' \
            -m 'Signed-off-by: ChatGPT <noreply@openai.com>'

          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo 'failed to publish deterministic documentation synchronization' >&2
          exit 1
