          replace(
              "scripts/neuron/release_readiness.py",
              '''    bindings = source_bindings(args.spec.resolve())

              generated_at = (''',
              '''    bindings = source_bindings(args.spec.resolve())
              candidate_objects = module_manifest.get("candidateObjects")
              if not isinstance(candidate_objects, dict):
                  blockers.append("module candidate object inventory is missing")
              else:
                  if candidate_objects.get("sourceHeadSha") != source_sha:
                      blockers.append("module source-head object differs from candidate")
                  if candidate_objects.get("deterministicMergeSha") != deterministic_merge_sha:
                      blockers.append("module deterministic merge SHA differs from finalizer")
                  if candidate_objects.get("deterministicMergeTree") != deterministic_merge_tree:
                      blockers.append("module deterministic merge tree differs from finalizer")
              if github_merge_tree != deterministic_merge_tree:
                  blockers.append("GitHub and deterministic merge trees differ")

              gates = module_manifest.get("gates") if isinstance(module_manifest.get("gates"), list) else []
              runner_images = {str(item.get("id")): item.get("runnerImage") for item in gates if isinstance(item, dict)}
              target_triples = {str(item.get("id")): item.get("targetTriple") for item in gates if isinstance(item, dict)}
              rustc_versions = {str(item.get("id")): item.get("rustcVersion") for item in gates if isinstance(item, dict)}
              test_set_records = [
                  {"id": str(item.get("id")), "sha256": item.get("testSetSha256")}
                  for item in gates if isinstance(item, dict)
              ]
              test_set_records.sort(key=lambda item: item["id"])
              if any(not isinstance(item["sha256"], str) for item in test_set_records):
                  blockers.append("one or more gate test-set hashes are missing")
              test_set_hash = sha256_bytes(canonical_bytes(test_set_records))
              module_evidence = module_manifest.get("inputEvidence")
              if not isinstance(module_evidence, list):
                  blockers.append("module input evidence hash inventory is missing")
                  module_evidence = []

              generated_at = (''',
          )
          replace(
              "scripts/neuron/release_readiness.py",
              '''        "sourceSha": source_sha,
                  "baseSha": base_sha,
                  "pullRequestNumber": pull_request_number,
                  "qualificationReady": not blockers,''',
              '''        "sourceSha": source_sha,
                  "sourceHeadSha": source_sha,
                  "baseSha": base_sha,
                  "pullRequestNumber": pull_request_number,
                  "deterministicMergeSha": deterministic_merge_sha,
                  "deterministicMergeTree": deterministic_merge_tree,
                  "githubMergeSha": github_merge_sha,
                  "githubMergeTree": github_merge_tree,
                  "workflowSha": workflow_sha,
                  "workflowRunId": workflow_run_id,
                  "runAttempt": workflow_run_attempt,
                  "testedSha": deterministic_merge_sha,
                  "testedTree": deterministic_merge_tree,
                  "runnerImage": runner_images,
                  "targetTriple": target_triples,
                  "rustcVersion": rustc_versions,
                  "cargoLockHash": bindings["cargoLockSha256"],
                  "testSetHash": test_set_hash,
                  "moduleSpecHash": bindings["specSha256"],
                  "documentationHash": bindings["documentationSha256"],
                  "implementationMapHash": bindings["implementationMapSha256"],
                  "artifactHashes": {
                      "moduleReadiness": file_sha256(args.module_manifest),
                      "repositoryBaseline": file_sha256(args.baseline),
                      "gateEvidence": module_evidence,
                  },
                  "qualificationReady": not blockers,
                  "sourceQualified": not blockers,
                  "mergeReady": not blockers,
                  "productionQualified": False,''',
          )
          replace(
              "scripts/neuron/release_readiness.py",
              '''            "productExecutionProved": False,
                      "independentAcceptance": False,
                      "productionActivation": False,''',
              '''            "productExecutionProved": False,
                      "independentAcceptance": False,
                      "productionQualified": False,
                      "mergeReady": not blockers,
                      "productionActivation": False,''',
          )
          replace(
              "scripts/neuron/release_readiness.py",
              '''    command.add_argument("--pull-request-number", type=int, required=True)
              command.add_argument("--generated-at")''',
              '''    command.add_argument("--pull-request-number", type=int, required=True)
              command.add_argument("--deterministic-merge-sha", required=True)
              command.add_argument("--deterministic-merge-tree", required=True)
              command.add_argument("--github-merge-sha", required=True)
              command.add_argument("--github-merge-tree", required=True)
              command.add_argument("--workflow-sha", required=True)
              command.add_argument("--workflow-run-id", required=True)
              command.add_argument("--workflow-run-attempt", required=True)
              command.add_argument("--generated-at")''',
          )

          replace(
              "scripts/neuron/test_release_readiness.py",
              '''SOURCE = "a" * 40
          BASE = "b" * 40
''',
              '''SOURCE = "a" * 40
          BASE = "b" * 40
          DETERMINISTIC_MERGE = "c" * 40
          MERGE_TREE = "d" * 40
          GITHUB_MERGE = "e" * 40
          WORKFLOW_SHA = "f" * 40
''',
          )
          replace(
              "scripts/neuron/test_release_readiness.py",
              '''        "workflowOutcomes": {"qualification": "success", "download": "success"},
                  "productionActivation": False,''',
              '''        "workflowOutcomes": {"qualification": "success", "download": "success"},
                  "candidateObjects": {
                      "sourceHeadSha": SOURCE,
                      "sourceHeadTree": "1" * 40,
                      "deterministicMergeSha": DETERMINISTIC_MERGE,
                      "deterministicMergeTree": MERGE_TREE,
                  },
                  "inputEvidence": [{"path": "gate.json", "sha256": "9" * 64}],
                  "productionActivation": False,''',
          )
          replace(
              "scripts/neuron/test_release_readiness.py",
              '''        "gates": [{"id": "linux-stable-source-head", "result": "success"}],''',
              '''        "gates": [{
                      "id": "linux-stable-source-head",
                      "result": "success",
                      "runnerImage": "ubuntu-24.04",
                      "targetTriple": "x86_64-unknown-linux-gnu",
                      "rustcVersion": "1.95.0",
                      "testSetSha256": "8" * 64,
                  }],''',
          )
          replace(
              "scripts/neuron/test_release_readiness.py",
              '''            pull_request_number=1240,
                      generated_at="2026-09-30T00:00:00+00:00",''',
              '''            pull_request_number=1240,
                      deterministic_merge_sha=DETERMINISTIC_MERGE,
                      deterministic_merge_tree=MERGE_TREE,
                      github_merge_sha=GITHUB_MERGE,
                      github_merge_tree=MERGE_TREE,
                      workflow_sha=WORKFLOW_SHA,
                      workflow_run_id="404",
                      workflow_run_attempt="2",
                      generated_at="2026-09-30T00:00:00+00:00",''',
          )
          replace(
              "scripts/neuron/test_release_readiness.py",
              '''            "moduleWorkflowSha256": "5" * 64,
                      "repositoryBaselineDefinitionSha256": "6" * 64,''',
              '''            "moduleWorkflowSha256": "5" * 64,
                      "releaseWorkflowSha256": "a" * 64,
                      "repositoryBaselineDefinitionSha256": "6" * 64,''',
          )
          replace(
              "scripts/neuron/test_release_readiness.py",
              '''            self.assertTrue(result["qualificationReady"])
                      self.assertFalse(result["productionActivation"])''',
              '''            self.assertTrue(result["qualificationReady"])
                      self.assertTrue(result["sourceQualified"])
                      self.assertTrue(result["mergeReady"])
                      self.assertFalse(result["productionQualified"])
                      self.assertEqual(result["deterministicMergeSha"], DETERMINISTIC_MERGE)
                      self.assertEqual(result["githubMergeSha"], GITHUB_MERGE)
                      self.assertEqual(result["workflowRunId"], 404)
                      self.assertEqual(result["testedTree"], MERGE_TREE)
                      self.assertIn("gateEvidence", result["artifactHashes"])
                      self.assertFalse(result["productionActivation"])''',
          )
          replace(
              "scripts/neuron/test_release_readiness.py",
              '''    def test_duplicate_json_keys_are_rejected(self):''',
              '''    @mock.patch.object(release_readiness, "source_bindings", return_value={
                  "specSha256": "1" * 64,
                  "cargoLockSha256": "2" * 64,
                  "documentationSha256": "3" * 64,
                  "implementationMapSha256": "4" * 64,
              })
              def test_github_and_deterministic_tree_mismatch_fails_closed(self, _bindings):
                  with tempfile.TemporaryDirectory() as directory:
                      args = self.args(Path(directory), module_manifest(), baseline(), allow=True)
                      args.github_merge_tree = "0" * 40
                      result = release_readiness.finalize(args)
                      self.assertFalse(result["sourceQualified"])
                      self.assertFalse(result["mergeReady"])
                      self.assertIn("GitHub and deterministic merge trees differ", result["blockers"])

              def test_duplicate_json_keys_are_rejected(self):''',
