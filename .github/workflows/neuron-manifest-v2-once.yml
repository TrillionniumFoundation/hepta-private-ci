name: Neuron exact candidate manifest migration (one shot)

on:
  push:
    branches:
      - codex/neuron-runtime-manifest-v2-staging-20260930
    paths:
      - .github/workflows/neuron-manifest-v2-once.yml

permissions:
  contents: write

concurrency:
  group: neuron-manifest-v2-migration
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact migration input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Materialize exact candidate manifest and remove authority
        shell: bash
        env:
          TARGET_BRANCH: codex/neuron-runtime-manifest-v2-staging-20260930
        run: |
          set -euo pipefail
          workflow=.github/workflows/neuron-manifest-v2-once.yml
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              value = file.read_text()
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(value.replace(old, new, 1))

          replace(
              "scripts/neuron/readiness.py",
              '''        "workflowOutcomes": {
                  "qualification": args.qualification_outcome,
                  "download": args.download_outcome,
              },
              "evidenceAuthentication": "trusted-workflow-job-results-required",''',
              '''        "workflowOutcomes": {
                  "qualification": args.qualification_outcome,
                  "download": args.download_outcome,
              },
              "candidateObjects": {
                  "sourceHeadSha": objects["source-head"][0],
                  "sourceHeadTree": objects["source-head"][1],
                  "deterministicMergeSha": objects["synthetic-merge"][0],
                  "deterministicMergeTree": objects["synthetic-merge"][1],
              },
              "contentBindings": {
                  "sourceHead": candidate_bindings(
                      spec, spec_path, objects["source-head"][0]
                  ),
                  "deterministicMerge": candidate_bindings(
                      spec, spec_path, objects["synthetic-merge"][0]
                  ),
              },
              "evidenceAuthentication": "trusted-workflow-job-results-required",''',
          )
          replace(
              "scripts/neuron/readiness.py",
              '''                "id": gate,
                          "result": records.get(gate, {}).get("result", "missing"),
                          "workflowRunId": record_object(records, gate, "workflow").get("runId"),
                          "targetTriple": record_object(records, gate, "runner").get(
                              "targetTriple"
                          ),
                          "runnerFingerprintSha256": record_object(records, gate, "runner").get(
                              "fingerprintSha256"
                          ),
                          "testSetSha256": record_object(records, gate, "bindings").get(
                              "testSetSha256"
                          ),''',
              '''                "id": gate,
                          "result": records.get(gate, {}).get("result", "missing"),
                          "lane": records.get(gate, {}).get("lane"),
                          "testedSha": records.get(gate, {}).get("testedSha"),
                          "testedTree": records.get(gate, {}).get("testedTree"),
                          "workflowRunId": record_object(records, gate, "workflow").get("runId"),
                          "workflowRunAttempt": record_object(records, gate, "workflow").get("runAttempt"),
                          "runnerImage": record_object(records, gate, "runner").get("image"),
                          "targetTriple": record_object(records, gate, "runner").get(
                              "targetTriple"
                          ),
                          "rustcVersion": record_object(records, gate, "observedRust").get("release"),
                          "runnerFingerprintSha256": record_object(records, gate, "runner").get(
                              "fingerprintSha256"
                          ),
                          "testSetSha256": record_object(records, gate, "bindings").get(
                              "testSetSha256"
                          ),
                          "cargoLockSha256": record_object(records, gate, "bindings").get(
                              "cargoLockSha256"
                          ),
                          "moduleSpecSha256": record_object(records, gate, "bindings").get(
                              "specSha256"
                          ),
                          "documentationSha256": record_object(records, gate, "bindings").get(
                              "documentationSha256"
                          ),
                          "implementationMapSha256": record_object(records, gate, "bindings").get(
                              "implementationMapSha256"
                          ),
                          "workflowSha256": record_object(records, gate, "bindings").get(
                              "workflowSha256"
                          ),''',
          )
          replace(
              "scripts/neuron/test_readiness.py",
              '''        self.assertEqual(len(report["inputEvidence"]), 8)
''',
              '''        self.assertEqual(len(report["inputEvidence"]), 8)
                  self.assertEqual(report["candidateObjects"]["sourceHeadSha"], self.source)
                  self.assertEqual(
                      report["candidateObjects"]["deterministicMergeSha"],
                      self.objects["synthetic-merge"][0],
                  )
                  self.assertEqual(
                      report["candidateObjects"]["deterministicMergeTree"],
                      self.objects["synthetic-merge"][1],
                  )
                  self.assertEqual(
                      report["contentBindings"]["sourceHead"]["cargoLockSha256"],
                      report["contentBindings"]["deterministicMerge"]["cargoLockSha256"],
                  )
                  by_id = {item["id"]: item for item in report["gates"]}
                  source_gate = by_id["linux-stable-source-head"]
                  self.assertEqual(source_gate["testedSha"], self.source)
                  self.assertEqual(source_gate["runnerImage"], "fixture-image")
                  self.assertEqual(source_gate["rustcVersion"], "1.95.0")
                  self.assertIn("workflowSha256", source_gate)
''',
          )

          replace(
              "scripts/neuron/release_readiness.py",
              'FINAL_SCHEMA = "hepta.neuron.runtime.release-readiness-manifest.v1"',
              'FINAL_SCHEMA = "hepta.neuron.runtime.release-readiness-manifest.v2"',
          )
          replace(
              "scripts/neuron/release_readiness.py",
              '''def require_false(label: str, value: Any) -> None:
              if value is not False:
                  raise ReleaseReadinessError(f"{label} must remain false")


          def validate_module_manifest(''',
              '''def require_false(label: str, value: Any) -> None:
              if value is not False:
                  raise ReleaseReadinessError(f"{label} must remain false")


          def require_positive_int(label: str, value: Any) -> int:
              try:
                  result = int(value)
              except (TypeError, ValueError) as error:
                  raise ReleaseReadinessError(f"{label} must be a positive integer") from error
              if result <= 0:
                  raise ReleaseReadinessError(f"{label} must be a positive integer")
              return result


          def validate_module_manifest(''',
          )
          replace(
              "scripts/neuron/release_readiness.py",
              '''        "moduleWorkflowSha256": file_sha256(ROOT / module_workflow),
                  "repositoryBaselineDefinitionSha256": sha256_bytes(''',
              '''        "moduleWorkflowSha256": file_sha256(ROOT / module_workflow),
                  "releaseWorkflowSha256": file_sha256(
                      ROOT / ".github/workflows/neuron-runtime-release-readiness.yml"
                  ),
                  "repositoryBaselineDefinitionSha256": sha256_bytes(''',
          )
          replace(
              "scripts/neuron/release_readiness.py",
              '''    pull_request_number = args.pull_request_number
              if pull_request_number <= 0:
                  raise ReleaseReadinessError("pull request number must be positive")
              module_manifest = read_json(args.module_manifest)
              baseline = read_json(args.baseline)

              blockers = validate_module_manifest(module_manifest, source_sha, base_sha)''',
              '''    pull_request_number = args.pull_request_number
              if pull_request_number <= 0:
                  raise ReleaseReadinessError("pull request number must be positive")
              deterministic_merge_sha = require_sha(
                  "deterministic merge SHA", args.deterministic_merge_sha
              )
              deterministic_merge_tree = require_sha(
                  "deterministic merge tree", args.deterministic_merge_tree
              )
              github_merge_sha = require_sha("GitHub merge SHA", args.github_merge_sha)
              github_merge_tree = require_sha("GitHub merge tree", args.github_merge_tree)
              workflow_sha = require_sha("workflow blob SHA", args.workflow_sha)
              workflow_run_id = require_positive_int("workflow run ID", args.workflow_run_id)
              workflow_run_attempt = require_positive_int(
                  "workflow run attempt", args.workflow_run_attempt
              )
              module_manifest = read_json(args.module_manifest)
              baseline = read_json(args.baseline)

              blockers = validate_module_manifest(module_manifest, source_sha, base_sha)''',
