          )
          replace(
              ".github/workflows/neuron-runtime-release-readiness.yml",
              '''      - name: Bind exact source and base
                  shell: bash
                  env:
                    BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
                  run: |
                    set -euo pipefail
                    test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
                    git cat-file -e "$BASE_SHA^{commit}"
                    test -z "$(git status --porcelain --untracked-files=all)"
''',
              '''      - name: Bind exact source, deterministic merge and GitHub merge
                  id: candidate
                  shell: bash
                  env:
                    BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
                    PULL_REQUEST_NUMBER: ${{ steps.resolve.outputs.pull_request_number }}
                    GITHUB_MERGE_SHA: ${{ steps.resolve.outputs.github_merge_sha }}
                  run: |
                    set -euo pipefail
                    test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
                    git cat-file -e "$BASE_SHA^{commit}"
                    git fetch --no-tags origin \
                      "refs/pull/${PULL_REQUEST_NUMBER}/merge:refs/remotes/origin/neuron-pr-${PULL_REQUEST_NUMBER}-merge"
                    test "$(git rev-parse refs/remotes/origin/neuron-pr-${PULL_REQUEST_NUMBER}-merge)" = "$GITHUB_MERGE_SHA"
                    test "$(git show -s --format=%P "$GITHUB_MERGE_SHA")" = "$BASE_SHA $SOURCE_SHA"
                    github_tree="$(git rev-parse "$GITHUB_MERGE_SHA^{tree}")"
                    deterministic_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
                    export GIT_AUTHOR_NAME=hepta-qualification
                    export GIT_COMMITTER_NAME=hepta-qualification
                    export GIT_AUTHOR_EMAIL=qualification@invalid
                    export GIT_COMMITTER_EMAIL=qualification@invalid
                    export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
                    export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
                    deterministic_merge="$(printf '%s\\n' 'Qualification only; no selection or release' | \
                      git commit-tree "$deterministic_tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
                    test "$github_tree" = "$deterministic_tree"
                    workflow_sha="$(git rev-parse "$SOURCE_SHA:.github/workflows/neuron-runtime-release-readiness.yml")"
                    {
                      printf 'deterministic_merge_sha=%s\\n' "$deterministic_merge"
                      printf 'deterministic_merge_tree=%s\\n' "$deterministic_tree"
                      printf 'github_merge_tree=%s\\n' "$github_tree"
                      printf 'workflow_sha=%s\\n' "$workflow_sha"
                    } >> "$GITHUB_OUTPUT"
                    test -z "$(git status --porcelain --untracked-files=all)"
''',
          )
