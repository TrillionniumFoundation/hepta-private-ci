# remediation-generation: 9
name: Temporary Hepta controller remediation

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/tmp-hepta-controller-remediation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tmp-hepta-controller-remediation
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_REF: ops/hepta-global-gap-closure-controller-20260910-r1
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact controller executors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 -m py_compile \
            scripts/hepta-candidate-publisher-r12.py \
            scripts/hepta-fixed-point-sealer-r10.py \
            scripts/hepta-fixed-point-sealer-r11.py \
            scripts/hepta-global-finalizer-r6.py \
            scripts/hepta-global-finalizer-r7.py \
            scripts/hepta-global-finalizer-r8-fixed.py \
            scripts/hepta-global-finalizer-r8.py \
            scripts/hepta-global-gap-closure-r4.py \
            scripts/hepta-global-gap-closure.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Dispatch exact fixed-point pipeline
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${CONTROLLER_REF}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          for workflow in \
            hepta-global-finalizer-r7.yml \
            hepta-global-finalizer-r8.yml \
            hepta-global-finalizer-r9.yml \
            hepta-fixed-point-sealer-r10.yml \
            hepta-fixed-point-sealer-r11.yml \
            hepta-candidate-publisher-r12.yml
          do
            gh workflow run "${workflow}" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${CONTROLLER_REF}"
          done
