name: MemoryCell temporary exact source-binding formatter
on:
  push:
    branches:
      - "codex/memory-cell-evidence-20261008"
    paths:
      - ".github/workflows/hepta-memory-source-binding-format.yml"
permissions:
  contents: read
jobs:
  inspected-source-format:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Exact Python AST-preserving format and restricted-format branch
        run: |
          set -euo pipefail
          python3 -m pip install ruff==0.15.13
          python3 - <<'PY'
          import ast,json
          from pathlib import Path
          names=[
            'scripts/memory_cell/source_binding_margin.py',
            'scripts/memory_cell/test_source_binding_margin.py',
            'scripts/memory_cell/test_source_binding_writer.py',
            'scripts/memory_cell/experience_memory.py',
            'scripts/memory_cell/experience_write_trial.py',
          ]
          Path('/tmp/binding-ast.json').write_text(json.dumps({n:ast.dump(ast.parse(Path(n).read_text())) for n in names}))
          PY
          ruff format scripts/memory_cell/source_binding_margin.py scripts/memory_cell/test_source_binding_margin.py scripts/memory_cell/test_source_binding_writer.py scripts/memory_cell/experience_memory.py scripts/memory_cell/experience_write_trial.py
          python3 - <<'PY'
          import ast,json,subprocess
          from pathlib import Path
          old=json.loads(Path('/tmp/binding-ast.json').read_text())
          files=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if files-set(old): raise ValueError('out-of-scope formatting edits')
          for name, previous in old.items():
              if ast.dump(ast.parse(Path(name).read_text())) != previous:
                  raise ValueError('formatter changed executable training code')
          PY
          git diff --check
          git add scripts/memory_cell/source_binding_margin.py scripts/memory_cell/test_source_binding_margin.py scripts/memory_cell/test_source_binding_writer.py scripts/memory_cell/experience_memory.py scripts/memory_cell/experience_write_trial.py
          git rm .github/workflows/hepta-memory-source-binding-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory-cell): format source-binding candidate and remove temporary writer'
          git push origin "HEAD:refs/heads/codex/memory-source-binding-format-${GITHUB_RUN_ID}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
