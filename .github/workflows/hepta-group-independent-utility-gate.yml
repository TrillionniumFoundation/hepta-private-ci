name: Group Independent Utility Gate (Research)
on:
  push:
    branches:
      - research/group-evidence-utility-gates-20261015
  pull_request:
    paths:
      - qualification/stem-cell-v1/group_independent_utility_gate.py
      - qualification/stem-cell-v1/test_group_independent_utility_gate.py
      - .github/workflows/hepta-group-independent-utility-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-utility-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax and bounded utility regressions
        run: |
          python -m py_compile qualification/stem-cell-v1/group_independent_utility_gate.py qualification/stem-cell-v1/test_group_independent_utility_gate.py
          PYTHONPATH=qualification/stem-cell-v1 python -m unittest test_group_independent_utility_gate -v
          PYTHONPATH=qualification/stem-cell-v1 python -O -m unittest test_group_independent_utility_gate -v
