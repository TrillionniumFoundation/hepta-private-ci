name: hcsn-currentstate-n256-resource-snapshot

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_resource_snapshot/**"
      - ".github/workflows/hcsn-currentstate-n256-resource-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-original-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original resource snapshot without numerical work
        run: |
          python -m unittest qualification.hcsn_currentstate_n256_resource_snapshot.test_snapshot -v
          python qualification/hcsn_currentstate_n256_resource_snapshot/audit_snapshot.py > REPORT.json
          cp qualification/hcsn_currentstate_n256_resource_snapshot/SOURCE_FREEZE.json SOURCE_FREEZE.json
      - uses: actions/upload-artifact@v4
        with:
          name: hcsn-n256-resource-snapshot-${{ github.sha }}
          path: |
            REPORT.json
            SOURCE_FREEZE.json
            qualification/hcsn_currentstate_n256_resource_snapshot/original_job/
