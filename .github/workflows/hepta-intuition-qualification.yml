name: Hepta intuition qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-contracts/CALLERS.toml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "docs/modules/intuition.policy/**"
      - "qualification/module-execution-dossiers/detail/intuition.policy.md"
      - "qualification/intuition.policy/**"
      - "scripts/intuition_qualify_exact.py"
      - ".github/workflows/hepta-intuition-qualification.yml"
      - ".github/actions/hepta-synthetic-merge/**"
      - ".github/actions/setup-ci/**"
  push:
    branches: [main]
    paths:
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-contracts/CALLERS.toml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "docs/modules/intuition.policy/**"
      - "qualification/module-execution-dossiers/detail/intuition.policy.md"
      - "qualification/intuition.policy/**"
      - "scripts/intuition_qualify_exact.py"
      - ".github/workflows/hepta-intuition-qualification.yml"
      - ".github/actions/hepta-synthetic-merge/**"
      - ".github/actions/setup-ci/**"
  workflow_dispatch:

permissions:
  contents: read

# No shared concurrency group with any other module or source-writing workflow.
# Preserve receipts for an already-running exact commit instead of cancelling it.
concurrency:
  group: hepta-intuition-readonly-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Intuition qualification (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","synthetic-merge"]' || '["source-head"]') }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Construct deterministic synthetic merge
        if: matrix.lane == 'synthetic-merge'
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Intuition CI
          author-email: hepta-intuition-ci@users.noreply.github.com
          message: Synthetic merge
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Execute and record actual commands without changing source
        env:
          EXPECTED_SHA: ${{ steps.synthetic.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/intuition_qualify_exact.py \
            --evidence "$RUNNER_TEMP/intuition-evidence/$LANE" \
            --expected-sha "$EXPECTED_SHA" \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --lane "$LANE"
      - name: Retain successes, failures and interrupted command records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-evidence/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 90

  required:
    name: Intuition required
    if: always()
    needs: [qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable qualification lane
        env:
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
        run: test "$QUALIFICATION_RESULT" = success
