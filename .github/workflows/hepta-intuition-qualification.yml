name: Hepta intuition qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-agentd/src/intuition_policy.rs"
      - "codex-rs/hepta-agentd/src/intuition_policy_service.rs"
      - "codex-rs/hepta-agentd/src/intuition_policy_serving.rs"
      - "codex-rs/hepta-agentd/src/intelligence_ingress.rs"
      - "codex-rs/hepta-agentd/src/intelligence_product.rs"
      - "codex-rs/hepta-agentd/src/intelligence_product_runner.rs"
      - "codex-rs/hepta-agentd/src/state.rs"
      - "codex-rs/hepta-agentd/src/runtime.rs"
      - "codex-rs/hepta-agentd/src/config.rs"
      - "codex-rs/hepta-agentd/src/lib.rs"
      - "codex-rs/hepta-agentd/tests/intuition_policy_product.rs"
      - "codex-rs/hepta-agentd/tests/intuition_policy_product_v3.rs"
      - "codex-rs/hepta-agentd/Cargo.toml"
      - "codex-rs/hepta-contracts/CALLERS.toml"
      - "docs/modules/intuition.policy/**"
      - "qualification/module-execution-dossiers/detail/intuition.policy.md"
      - "qualification/intuition.policy/**"
      - ".github/workflows/hepta-intuition-qualification.yml"
      - ".github/actions/hepta-synthetic-merge/**"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-agentd/src/intuition_policy.rs"
      - "codex-rs/hepta-agentd/src/intuition_policy_service.rs"
      - "codex-rs/hepta-agentd/src/intuition_policy_serving.rs"
      - "codex-rs/hepta-agentd/src/intelligence_ingress.rs"
      - "codex-rs/hepta-agentd/src/intelligence_product.rs"
      - "codex-rs/hepta-agentd/src/intelligence_product_runner.rs"
      - "codex-rs/hepta-agentd/src/state.rs"
      - "codex-rs/hepta-agentd/src/runtime.rs"
      - "codex-rs/hepta-agentd/src/config.rs"
      - "codex-rs/hepta-agentd/src/lib.rs"
      - "codex-rs/hepta-agentd/tests/intuition_policy_product.rs"
      - "codex-rs/hepta-agentd/tests/intuition_policy_product_v3.rs"
      - "codex-rs/hepta-agentd/Cargo.toml"
      - "codex-rs/hepta-contracts/CALLERS.toml"
      - "docs/modules/intuition.policy/**"
      - "qualification/module-execution-dossiers/detail/intuition.policy.md"
      - "qualification/intuition.policy/**"
      - ".github/workflows/hepta-intuition-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intuition-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-closure:
    name: Compose intuition closure source once
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/intuition-policy-production-closure-20260927'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact closure source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Apply deterministic serving composition
        run: |
          python3 scripts/intuition_finalize_branch.py
          python3 scripts/intuition_legacy_imports.py
      - name: Format, compile, lint and test composed surfaces
        working-directory: codex-rs
        run: |
          cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd
          cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets
          cargo clippy --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence
          cargo test --locked -p codex-hepta-agentd --lib intuition_policy
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_product
          if test -f hepta-agentd/tests/intuition_policy_product_v3.rs; then
            cargo test --locked -p codex-hepta-agentd --test intuition_policy_product_v3
          fi
          cargo run --locked --release -p codex-hepta-intuition --example fast_gate
          cargo run --locked --release -p codex-hepta-intelligence --example intuition_authenticated_fast_gate
      - name: Commit source and exact provenance locally
        run: |
          set -euo pipefail
          git config user.name "Hepta Intuition Integrator"
          git config user.email "hepta-intuition-ci@users.noreply.github.com"
          git add codex-rs/hepta-agentd codex-rs/hepta-intuition codex-rs/hepta-intelligence docs/modules/intuition.policy/TECHNICAL.md
          if ! git diff --cached --quiet; then
            git commit -m "feat(intuition): enforce authenticated product gate in Agentd serving"
          fi
          python3 scripts/hepta-implementation-maps.py migrate --module intuition.policy
          git add docs/modules/intuition.policy/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(intuition): bind composed source objects"
          fi
          python3 scripts/hepta-implementation-maps.py verify --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})"
          git push origin HEAD:codex/intuition-policy-production-closure-20260927

  source-head:
    name: Intuition exact source qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Format product surfaces
        run: cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd -- --check
      - name: Compile all product targets
        run: cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets
      - name: Strict Clippy for product surfaces
        run: cargo clippy --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Run policy and qualification tests
        run: |
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence
      - name: Run Agentd authenticated serving and product E2E
        run: |
          cargo test --locked -p codex-hepta-agentd --lib intuition_policy
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_product
          if test -f hepta-agentd/tests/intuition_policy_product_v3.rs; then
            cargo test --locked -p codex-hepta-agentd --test intuition_policy_product_v3
          fi
      - name: Capture exact command record and source-host profile
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          rustc_vv="$(rustc -Vv | tr '\n' ';')"
          cargo_v="$(cargo -V)"
          cat > ../intuition-command-record.json <<JSON
          {
            "schema": "hepta.intuition.command-record.v1",
            "sourceSha": "${source_sha}",
            "treeSha": "${tree_sha}",
            "runner": "ubuntu-24.04",
            "rustc": "${rustc_vv}",
            "cargo": "${cargo_v}",
            "commands": [
              "cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd -- --check",
              "cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets",
              "cargo clippy --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets -- -D warnings",
              "cargo test --locked -p codex-hepta-intuition",
              "cargo test --locked -p codex-hepta-intelligence",
              "cargo test --locked -p codex-hepta-agentd --lib intuition_policy",
              "cargo test --locked -p codex-hepta-agentd --test intuition_policy_product",
              "cargo run --locked --release -p codex-hepta-intuition --example fast_gate",
              "cargo run --locked --release -p codex-hepta-intelligence --example intuition_authenticated_fast_gate"
            ]
          }
          JSON
          {
            echo "source_sha=${source_sha}"
            echo "tree_sha=${tree_sha}"
            uname -a
            rustc -Vv
            cargo -V
            if command -v lscpu >/dev/null 2>&1; then lscpu; fi
          } | tee ../intuition-source-host-profile.txt
      - name: Run kernel fast-policy gate
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p codex-hepta-intuition --example fast_gate | tee ../intuition-kernel-fast-gate.csv
      - name: Run authenticated end-to-end fast-policy gate
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p codex-hepta-intelligence --example intuition_authenticated_fast_gate | tee ../intuition-authenticated-fast-gate.csv
      - name: Verify patch hygiene
        working-directory: ${{ github.workspace }}
        run: git diff --check
      - name: Retain exact qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            intuition-kernel-fast-gate.csv
            intuition-authenticated-fast-gate.csv
            intuition-source-host-profile.txt
            intuition-command-record.json
          if-no-files-found: error
          retention-days: 90

  merge-candidate:
    name: Intuition exact merge qualification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Check out exact source for merge construction
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Construct deterministic synthetic merge
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Intuition CI
          author-email: hepta-intuition-ci@users.noreply.github.com
          message: Synthetic merge
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Verify exact merge identity
        env:
          EXPECTED_SHA: ${{ steps.synthetic.outputs.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Format merge candidate
        run: cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd -- --check
      - name: Compile and lint merge candidate
        run: |
          cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets
          cargo clippy --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Test product composition on merge candidate
        run: |
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence
          cargo test --locked -p codex-hepta-agentd --lib intuition_policy
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_product
          if test -f hepta-agentd/tests/intuition_policy_product_v3.rs; then
            cargo test --locked -p codex-hepta-agentd --test intuition_policy_product_v3
          fi
      - name: Gate kernel fast policy on merge candidate
        run: cargo run --locked --release -p codex-hepta-intuition --example fast_gate
      - name: Gate authenticated end-to-end fast policy on merge candidate
        run: cargo run --locked --release -p codex-hepta-intelligence --example intuition_authenticated_fast_gate
      - name: Verify patch hygiene
        working-directory: ${{ github.workspace }}
        run: git diff --check
