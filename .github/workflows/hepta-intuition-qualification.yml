name: intuition.policy Qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-contracts/CALLERS.toml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "docs/modules/intuition.policy/**"
      - "qualification/module-execution-dossiers/detail/intuition.policy.md"
      - "qualification/intuition.policy/**"
      - "scripts/intuition_*.py"
      - "scripts/tests/test_intuition*.py"
      - ".github/workflows/hepta-intuition*.yml"
      - ".github/workflows/intuition-*.yml"
      - ".github/actions/hepta-synthetic-merge/**"
      - ".github/actions/setup-ci/**"
  push:
    branches: [main, codex/intuition-policy-production-closure-20260927]
    paths:
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-contracts/CALLERS.toml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "docs/modules/intuition.policy/**"
      - "qualification/module-execution-dossiers/detail/intuition.policy.md"
      - "qualification/intuition.policy/**"
      - "scripts/intuition_*.py"
      - "scripts/tests/test_intuition*.py"
      - ".github/workflows/hepta-intuition*.yml"
      - ".github/workflows/intuition-*.yml"
      - ".github/actions/hepta-synthetic-merge/**"
      - ".github/actions/setup-ci/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
  CARGO_BUILD_JOBS: "2"

concurrency:
  # v2 escapes the legacy group whose `always()` sentinel could survive a
  # cancellation. Future updates share this group, so only the newest PR head
  # may execute qualification.
  group: hepta-intuition-readonly-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-tests:
    name: Intuition evidence integrity tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -p 'test_intuition*.py' -v

  qualify:
    name: Intuition qualification (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","synthetic-merge"]' || '["source-head"]') }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Construct deterministic synthetic merge
        if: matrix.lane == 'synthetic-merge'
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Intuition CI
          author-email: hepta-intuition-ci@users.noreply.github.com
          message: Synthetic merge
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Execute resource-bounded exact qualification and retain real binaries
        env:
          EXPECTED_SHA: ${{ steps.synthetic.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          LANE: ${{ matrix.lane }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/intuition-target
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/intuition_ci_exact.py \
            --evidence "$RUNNER_TEMP/intuition-evidence/$LANE" \
            --expected-sha "$EXPECTED_SHA" \
            --source-commit "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --lane "$LANE"
      - name: Retain successes, infrastructure failures and interrupted command records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-evidence/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 90

  independent:
    name: Intuition independent execution
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - name: Run independent mode in a clean runner and target directory
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/intuition-independent-target
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/intuition_ci_exact.py \
            --source-commit "$SOURCE_SHA" --independent \
            --evidence "$RUNNER_TEMP/intuition-evidence/independent"
      - name: Retain independent command evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-independent-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-evidence/independent/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Intuition exact-source and merge evidence agreement
    needs: [evidence-tests, qualify, independent]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      # No run-id override or cross-workflow lookup: only artifacts from this run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: intuition-source-head-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs/qualification
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: intuition-independent-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs/independent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.event_name == 'pull_request'
        with:
          name: intuition-synthetic-merge-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inputs/merge
      - name: Verify Git objects, recomputed merge tree, command logs and actual binaries
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          merge_args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            merge_args=(--require-merge --merge "$RUNNER_TEMP/inputs/merge" --base-commit "$BASE_SHA")
          fi
          python3 scripts/intuition_accept_exact.py \
            --source-commit "$SOURCE_SHA" \
            --qualification "$RUNNER_TEMP/inputs/qualification" \
            --independent "$RUNNER_TEMP/inputs/independent" \
            "${merge_args[@]}" \
            --output "$RUNNER_TEMP/intuition-agreement"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intuition-agreement-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-agreement/
          if-no-files-found: error
          retention-days: 90

  required:
    name: Intuition required
    # Preserve a single required check on ordinary failures, but do not let a
    # cancelled obsolete run keep a concurrency lock alive.
    if: ${{ always() && !cancelled() }}
    needs: [evidence-tests, qualify, independent, aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all source, merge, independent and evidence checks
        env:
          EVIDENCE_RESULT: ${{ needs.evidence-tests.result }}
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
          INDEPENDENT_RESULT: ${{ needs.independent.result }}
          AGREEMENT_RESULT: ${{ needs.aggregate.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVIDENCE_RESULT" = success
          test "$QUALIFICATION_RESULT" = success
          test "$INDEPENDENT_RESULT" = success
          test "$AGREEMENT_RESULT" = success
