name: memory federation v3 materialize

on:
  push:
    branches:
      - fix/memory-federation-v3-production-closure-20260927
    paths:
      - ".github/workflows/memory-federation-v3-materialize.yml"
      - "qualification/memory-federation/bootstrap_v3.py"
      - "qualification/memory-federation/bootstrap_v3_followup.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memory-federation-v3-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out writable feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/memory-federation-v3-production-closure-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed deterministic integration
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/memory-federation/bootstrap_v3.py
          python3 qualification/memory-federation/bootstrap_v3_followup.py

      - name: Commit and push source materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Memory Federation Materializer"
          git config user.email "hepta-memory-federation-materializer@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "memory.federation: materialize reviewed v3 closure"
            git push origin HEAD:fix/memory-federation-v3-production-closure-20260927
          fi

      - name: Rebind implementation map and derived projections
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p qualification/memory-federation/bootstrap-diagnostics
          log=qualification/memory-federation/bootstrap-diagnostics/v3-rebind.log
          rm -f "$log"
          set +e
          {
            echo '$ python3 scripts/hepta-implementation-maps.py migrate --module memory.federation'
            python3 scripts/hepta-implementation-maps.py migrate --module memory.federation
            echo '$ python3 scripts/hepta-module-docs.py refresh-derived'
            python3 scripts/hepta-module-docs.py refresh-derived
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "docs(memory-federation): bind v3 source and projections"
            fi
            echo '$ python3 scripts/hepta-implementation-maps.py verify'
            python3 scripts/hepta-implementation-maps.py verify
            echo '$ python3 scripts/hepta-module-docs.py refresh-derived --check'
            python3 scripts/hepta-module-docs.py refresh-derived --check
            git diff --check
            test -z "$(git status --porcelain --untracked-files=normal)"
          } 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git add "$log"
            git commit -m "ci(memory-federation): retain v3 rebind failure"
            git push origin HEAD:fix/memory-federation-v3-production-closure-20260927
            exit "$status"
          fi
          rm -f "$log"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci(memory-federation): remove materialization diagnostic"
          fi
          git push origin HEAD:fix/memory-federation-v3-production-closure-20260927
