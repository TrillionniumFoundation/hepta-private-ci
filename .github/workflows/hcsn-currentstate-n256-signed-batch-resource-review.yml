name: hcsn-currentstate-n256-signed-batch-resource-review

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_signed_batch_resource_review/**"
      - ".github/workflows/hcsn-currentstate-n256-signed-batch-resource-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-authentic-input-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assertions-enabled static resource review
        run: python3 -m unittest qualification.hcsn_currentstate_n256_signed_batch_resource_review.test_review
      - name: Optimized-mode static resource review
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_signed_batch_resource_review.test_review
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_signed_batch_resource_review/*.py
      - name: Verify frozen source and fail-closed scope
        run: python3 -m qualification.hcsn_currentstate_n256_signed_batch_resource_review.verify_source
      - name: Verify frozen source in optimized mode
        run: python3 -O -m qualification.hcsn_currentstate_n256_signed_batch_resource_review.verify_source
