name: hcsn-currentstate-n256-signed-batch-policy-fix

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_signed_batch_workflow_policy_fix/**"
      - "qualification/hcsn_currentstate_n256_signed_batch_candidate/SOURCE_FREEZE.json"
      - ".github/workflows/hcsn-currentstate-n256-signed-batch-candidate.yml"
      - ".github/workflows/hcsn-currentstate-n256-signed-batch-policy-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assertions-enabled policy fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_signed_batch_workflow_policy_fix.test_policy_fix
      - name: Optimized-mode policy fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_signed_batch_workflow_policy_fix.test_policy_fix
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_signed_batch_workflow_policy_fix/*.py
      - name: Verify frozen metadata and fail-closed scope
        run: python3 -m qualification.hcsn_currentstate_n256_signed_batch_workflow_policy_fix.verify_source
      - name: Verify frozen metadata in optimized mode
        run: python3 -O -m qualification.hcsn_currentstate_n256_signed_batch_workflow_policy_fix.verify_source
