name: Hepta control runtime (read-only)

on:
  push:
    branches: [main, fix/control-runtime-closure-20260927]
    paths:
      - 'codex-rs/hepta-control-plane/**'
      - 'codex-rs/hepta-ndu/**'
      - 'codex-rs/hepta-agentd/**'
      - 'docs/modules/control.runtime/**'
      - 'scripts/hepta-control-runtime*'
      - '.github/workflows/hepta-control-runtime.yml'
  pull_request:
    paths:
      - 'codex-rs/hepta-control-plane/**'
      - 'codex-rs/hepta-ndu/**'
      - 'codex-rs/hepta-agentd/**'
      - 'docs/modules/control.runtime/**'
      - 'scripts/hepta-control-runtime*'
      - '.github/workflows/hepta-control-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Archive exact reviewed source and instructions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/control-runtime-source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/control-runtime-source/identity.txt"
          git archive --format=tar HEAD \
            AGENTS.md codex-rs/hepta-control-plane codex-rs/hepta-ndu \
            codex-rs/hepta-agentd codex-rs/hepta-cognitive-read \
            codex-rs/hepta-types codex-rs/hepta-contracts \
            codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/rust-toolchain.toml \
            codex-rs/justfile codex-rs/.config/nextest.toml \
            docs/modules/control.runtime docs/readiness/CONTROL_RUNTIME_EXECUTION.md \
            qualification/module-execution-dossiers/detail/control.runtime.md \
            > "$RUNNER_TEMP/control-runtime-source/source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-runtime-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/control-runtime-source
          if-no-files-found: error
          retention-days: 14

  native:
    name: control-runtime / ${{ matrix.lane }} / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
        check: [tests, lint, named-host]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          BASE_SHA=$(git rev-parse "$BASE_REF^{commit}")
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Control runtime qualification only; no activation' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$MERGE"
          fi
          mkdir -p "$RUNNER_TEMP/control-runtime-evidence"
          printf 'source=%s\nbase=%s\ncandidate=%s\ntree=%s\nlane=%s\ncheck=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            '${{ matrix.lane }}' '${{ matrix.check }}' \
            > "$RUNNER_TEMP/control-runtime-evidence/identity.txt"
          python3 scripts/verify_cargo_lock.py
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Execute native checks without source mutation
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          EVIDENCE="$RUNNER_TEMP/control-runtime-evidence"
          rustc --version --verbose > "$EVIDENCE/rustc.txt"
          uname -a > "$EVIDENCE/host.txt"
          status=0
          record() {
            local name="$1"
            shift
            printf '%q ' "$@" > "$EVIDENCE/$name.command"
            printf '\n' >> "$EVIDENCE/$name.command"
            "$@" > "$EVIDENCE/$name.log" 2>&1
            local code=$?
            cat "$EVIDENCE/$name.log"
            printf '%s\n' "$code" > "$EVIDENCE/$name.exit"
            if [ "$code" -ne 0 ]; then status=1; fi
          }
          case '${{ matrix.check }}' in
            tests)
              record compile cargo check --locked --all-targets -p codex-hepta-ndu -p codex-hepta-control-plane
              record ndu just test --locked -p codex-hepta-ndu
              record control just test --locked -p codex-hepta-control-plane
              ;;
            lint)
              record fmt cargo fmt --package codex-hepta-ndu --package codex-hepta-control-plane -- --check
              record clippy cargo clippy --locked --all-targets -p codex-hepta-ndu -p codex-hepta-control-plane -- -D warnings
              ;;
            named-host)
              export HEPTA_NDU_HOST_ID=github-hosted-ubuntu-24.04-x86_64
              export HEPTA_NDU_FS_PROFILE="$(stat -f -c %T "$RUNNER_TEMP")"
              export HEPTA_NDU_RUSTC="$(rustc --version)"
              export HEPTA_NDU_CLK_TCK="$(getconf CLK_TCK)"
              export HEPTA_NDU_RECEIPT_PATH="$EVIDENCE/ndu-host.json"
              export HEPTA_NDU_SOURCE_SHA="$(git rev-parse HEAD)"
              export HEPTA_NDU_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
              export HEPTA_NDU_QUALIFICATION_LANE='${{ matrix.lane }}'
              record named-host cargo run --locked --release -p codex-hepta-ndu --bin ndu-named-host-qualification
              ;;
          esac
          exit "$status"
      - name: Reject candidate source drift
        if: always()
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain command outcomes including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-runtime-${{ matrix.lane }}-${{ matrix.check }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/control-runtime-evidence
          if-no-files-found: error
          retention-days: 30
