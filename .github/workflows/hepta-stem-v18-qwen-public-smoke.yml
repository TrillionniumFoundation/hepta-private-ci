name: hepta-stem-v18-qwen-public-physical-smoke
on:
  push:
    branches:
      - research/stem-v17-qwen-reference-sourcefirst-20261016
    paths:
      - '.github/workflows/hepta-stem-v18-qwen-public-smoke.yml'
      - 'qualification/stem-cell-v1/v18_reference_material_stage.py'
      - 'qualification/stem-cell-v1/v18_reference_public_smoke.py'
      - 'qualification/stem-cell-v1/test_v18_reference_public_smoke.py'
      - 'qualification/stem-cell-v1/v25_pinned_qwen_loader.py'
      - 'qualification/stem-cell-v1/test_v25_pinned_qwen_loader.py'
      - 'qualification/stem-cell-v1/v17_reference_reader_physical.py'
      - 'qualification/stem-cell-v1/STEM_V25_QWEN_LOADER_COMPAT.md'
      - 'qualification/stem-cell-v1/v26_public_smoke_audit.py'
      - 'qualification/stem-cell-v1/test_v26_public_smoke_audit.py'
      - 'qualification/stem-cell-v1/V26_PUBLIC_QWEN_ORIGINAL_FORWARD_20261016.json'
      - 'qualification/stem-cell-v1/STEM_V26_QWEN_OBSERVED_FORWARD.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hepta-v18-qwen-public-smoke
  cancel-in-progress: true
jobs:
  public-only-neural-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only tests before any pretrained model call
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=qualification/stem-cell-v1
          python -m compileall -q qualification/stem-cell-v1/v18_reference_material_stage.py qualification/stem-cell-v1/v18_reference_public_smoke.py qualification/stem-cell-v1/test_v18_reference_public_smoke.py qualification/stem-cell-v1/v25_pinned_qwen_loader.py qualification/stem-cell-v1/test_v25_pinned_qwen_loader.py qualification/stem-cell-v1/v17_reference_reader_physical.py qualification/stem-cell-v1/v26_public_smoke_audit.py qualification/stem-cell-v1/test_v26_public_smoke_audit.py
          python -m unittest discover -s qualification/stem-cell-v1 -p 'test_v18_reference_public_smoke.py' -v
          python -O -m unittest discover -s qualification/stem-cell-v1 -p 'test_v18_reference_public_smoke.py' -v
          python -m unittest discover -s qualification/stem-cell-v1 -p 'test_v25_pinned_qwen_loader.py' -v
          python -O -m unittest discover -s qualification/stem-cell-v1 -p 'test_v25_pinned_qwen_loader.py' -v
      - name: Install pinned CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input --disable-pip-version-check 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-input --disable-pip-version-check 'transformers==4.53.3' 'huggingface_hub==0.33.5' 'safetensors==0.5.3' 'tokenizers==0.21.2' 'hf_xet==1.1.5' 'packaging==25.0'
          python -m pip check
          export PYTHONPATH=qualification/stem-cell-v1
          python -m unittest discover -s qualification/stem-cell-v1 -p 'test_v26_public_smoke_audit.py' -v
          python -O -m unittest discover -s qualification/stem-cell-v1 -p 'test_v26_public_smoke_audit.py' -v
      - name: Exercise actual pinned Transformers Qwen3 constructor with tiny synthetic weights
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=qualification/stem-cell-v1
          python qualification/stem-cell-v1/v25_pinned_qwen_loader.py
      - name: Pin public Qwen bytes and execute one genuine public-input model forward
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PYTHONPATH=qualification/stem-cell-v1
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -m700 "$root/cache"
          python qualification/stem-cell-v1/v18_reference_material_stage.py \
            --cache-dir "$root/cache" --model-dir "$root/model" --model-spec "$root/model-spec.json"
          python qualification/stem-cell-v1/v18_reference_public_smoke.py \
            --model-dir "$root/model" --model-spec "$root/model-spec.json"
      - name: No private-source/semantic-success promotion
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=qualification/stem-cell-v1
          python qualification/stem-cell-v1/v26_public_smoke_audit.py \
            --workflow .github/workflows/hepta-stem-v18-qwen-public-smoke.yml \
            --source qualification/stem-cell-v1/v18_reference_public_smoke.py \
            --receipt qualification/stem-cell-v1/V26_PUBLIC_QWEN_ORIGINAL_FORWARD_20261016.json
