fn pin_v2(artifact: &TabularOperatorArtifactV1, bytes: &[u8]) -> TabularPayloadPinV2 {
    TabularPayloadPinV2 {
        artifact_id: artifact.artifact_id.clone(),
        producer_id: artifact.producer_id.clone(),
        artifact_schema_version: TABULAR_ARTIFACT_SCHEMA_V1,
        payload_schema_version: TABULAR_PAYLOAD_SCHEMA_V1,
        payload_digest: Digest32::of_bytes(bytes),
        artifact_digest: artifact.artifact_digest,
        objective_digest: artifact.objective_digest,
        dataset_digest: artifact.dataset_digest,
        sensor_core_digest: artifact.sensor_core_digest,
        training_profile_digest: artifact.training_profile_digest,
        runtime_profile_digest: hash("runtime-profile"),
        trust_digest: hash("trust-snapshot"),
        registry_head_digest: hash("registry-head"),
        authority_epoch: 9,
        generation: artifact.generation,
    }
}

#[test]
fn v2_pin_binds_identity_runtime_trust_and_registry() {
    let artifact = fitted(3, 13);
    let bytes = encode_tabular_payload_v1(&artifact).expect("encode");
    let pin = pin_v2(&artifact, &bytes);
    let loaded = LoadedTabularOperatorV2::from_pinned_payload_v2(&bytes, &pin).expect("load");
    assert_eq!(loaded.predict(&id("state"), &id("read")).unwrap().value.raw(), 13);
    assert_eq!(loaded.authority_epoch(), 9);

    let mut wrong = pin.clone();
    wrong.artifact_id = id("other-artifact");
    assert!(LoadedTabularOperatorV2::from_pinned_payload_v2(&bytes, &wrong).is_err());
    let mut wrong = pin.clone();
    wrong.runtime_profile_digest = Digest32::ZERO;
    assert!(LoadedTabularOperatorV2::from_pinned_payload_v2(&bytes, &wrong).is_err());
    let mut wrong = pin.clone();
    wrong.trust_digest = Digest32::ZERO;
    assert!(LoadedTabularOperatorV2::from_pinned_payload_v2(&bytes, &wrong).is_err());
    let mut wrong = pin;
    wrong.registry_head_digest = Digest32::ZERO;
    assert!(LoadedTabularOperatorV2::from_pinned_payload_v2(&bytes, &wrong).is_err());
}
