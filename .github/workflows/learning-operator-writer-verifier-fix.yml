          # learning.operator developer guide

          ## Supported production sequence

          1. Replay `learning.ledger` and freeze `DatasetSnapshotReceiptV3`.
          2. Rebind the receipt with `verify_dataset_snapshot_receipt_against_ledger_v3`.
          3. Build `LearningEvidenceVerifierV1` only from host-owned trust state.
          4. Canonically encode every training row, including row identity, state/sensor,
             action, target/outcome and source evidence digest.
          5. Require an Ed25519 `Observer` attestation over those exact bytes.
          6. Call `verify_tabular_operator_plan_v3` or
             `verify_world_model_dataset_v3`; only the opaque result may reach the V3 fit.
          7. Persist create-only payload bytes and a host-selected `TabularPayloadPinV2`.
          8. Independently evaluate and select the exact artifact.
          9. In a fresh process load through `LoadedTabularOperatorV2` or the evaluated
             ranker path. Keep the result read-only and deny-all during shadow operation.

          V2 dataset admission and V1 payload pins are compatibility surfaces. They are
          not sufficient evidence for production promotion.

          ## Local qualification

          ```bash
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-bellman-operator --locked
          cargo clippy --manifest-path codex-rs/Cargo.toml -p codex-hepta-bellman-operator --all-targets --locked -- -D warnings
          ```

          ## Failure handling

          Receipt, ledger-head, trust-epoch, signature, row-payload, registry-head or
          runtime-profile mismatch is a global admission failure. Unsupported prediction
          cells abstain. No path may repair or silently quarantine a semantically changed
          training row.
          EOF

          cat > docs/modules/learning.operator/OPERATIONS_RUNBOOK.md <<'EOF'
          # learning.operator operations runbook

          ## Revocation and key rotation

          Freeze the current trust digest and authority epoch with every selection. A key
          rotation creates a new immutable trust snapshot; it never rewrites prior evidence.
          At or after `revoked_at`, re-verification must fail and the candidate must be
          removed from the eligible shadow set. Never derive trust keys from candidate data.

          ## Rollback

          Rollback selects an already persisted immutable predecessor payload and its
          original complete pin. Do not retrain, rewrite, or recompute the predecessor.
          Confirm artifact ID, producer ID, generation, schema versions, runtime profile,
          trust digest, authority epoch and registry head before opening the payload.

          ## Incident stop conditions

          Stop shadow admission on ledger rollback, stale registry head, trust epoch drift,
          signature failure, semantic-row digest drift, unsupported cell-rate breach,
          calibration breach, resource-budget breach or missing independent evaluation.
          Production writes remain disabled throughout qualification.
          EOF

          cat > docs/modules/learning.operator/COMPATIBILITY_AND_MIGRATION.md <<'EOF'
          # Compatibility and migration policy

          * V1 payload bytes remain decodable while their schema is explicitly pinned.
          * V1 pins and V2 dataset wrappers are read-only compatibility inputs and cannot
            independently authorize promotion.
          * V2 pins add identity, schemas, runtime, trust epoch and registry-head binding.
          * New schema versions use a new domain separator and decoder. Unknown versions
            fail closed; there is no best-effort field defaulting.
          * Migration is decode-old, fully validate-old, encode-new, compare semantic
            projection, persist create-only, then independently re-evaluate. In-place
            mutation of an accepted artifact is forbidden.
          EOF

          cat > docs/modules/learning.operator/RESOURCE_AND_SHADOW_POLICY.md <<'EOF'
          # Resource budgets and shadow acceptance

          Hard input ceilings remain 1,000,000 rows, 262,144 tabular cells, 4,096 sensors,
          128 actions and 64 MiB payloads. Qualification must additionally publish peak
          resident memory, wall time and prediction p50/p95/p99 for the largest admitted
          profile; a ceiling without a measured budget is not acceptance evidence.

          Shadow promotion requires all of the following over a preregistered longitudinal
          window: zero identity/trust/ledger violations; zero unauthorized writes; stable
          calibration and subgroup coverage; bounded abstention/OOD rates; no regression in
          independently measured utility; successful fresh-process load and immutable
          predecessor rollback. Thresholds are fixed before outcomes and stored with the
          evaluator receipt. A single hard-bound violation rejects the candidate.
          EOF

