name: AuthBus capability convergence apply

on:
  push:
    branches: [auth-authbus-boundary-convergence-20260928]
    paths: [.github/workflows/authbus-capability-convergence-apply.yml]

permissions:
  contents: write

concurrency:
  group: authbus-capability-convergence-apply
  cancel-in-progress: true

jobs:
  apply-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply exact local candidate
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/authbus.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_BASE64'])))
          PY
          git apply --index --whitespace=nowarn /tmp/authbus.patch
          cargo fmt --all --manifest-path codex-rs/Cargo.toml
          git add -A
          git diff --cached --check
          python3 scripts/check-authbus-closed-world.py --check

      - name: Compile affected targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-authbus \
            -p codex-hepta-authbus-p1-3-qualification \
            -p codex-hepta-evidence \
            -p codex-hepta-bao-adapter \
            --all-targets

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "authbus: enforce capability-scoped authority boundaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
