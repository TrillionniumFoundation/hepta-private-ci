name: Control runtime exact-head qualification

on:
  push:
    branches:
      - control-runtime-production-closure-v1
    paths:
      - "codex-rs/hepta-control-plane/**"
      - "codex-rs/hepta-agentd/src/cognitive_context.rs"
      - "codex-rs/hepta-agentd/src/cognitive_context_tests.rs"
      - "codex-rs/hepta-agent-protocol/src/lib.rs"
      - "docs/modules/control.runtime/**"
      - "docs/readiness/CONTROL_RUNTIME_EXECUTION.md"
      - ".github/workflows/control-runtime-qualification.yml"
  pull_request:
    paths:
      - "codex-rs/hepta-control-plane/**"
      - "codex-rs/hepta-agentd/src/cognitive_context.rs"
      - "codex-rs/hepta-agentd/src/cognitive_context_tests.rs"
      - "codex-rs/hepta-agent-protocol/src/lib.rs"
      - "docs/modules/control.runtime/**"
      - "docs/readiness/CONTROL_RUNTIME_EXECUTION.md"
      - ".github/workflows/control-runtime-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-runtime-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: control.runtime (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            if [ -z "$BASE_SHA" ]; then
              git fetch --no-tags origin main
              BASE_SHA=$(git rev-parse origin/main)
            fi
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'control.runtime qualification only' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$MERGE"
          fi
          printf 'source=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee "${RUNNER_TEMP}/candidate.txt"

      - name: Verify repository invariants
        run: |
          python3 scripts/verify_cargo_lock.py
          python3 scripts/hepta-ndu-source-policy.py
          python3 -m json.tool docs/modules/control.runtime/IMPLEMENTATION_MAP.json >/dev/null
          python3 -m json.tool docs/modules/control.runtime/MATURITY.json >/dev/null

      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Locked all-target compilation
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-control-plane \
            -p codex-hepta-agent-protocol \
            -p codex-hepta-agentd \
            -p codex-hepta-ndu 2>&1 | tee "${RUNNER_TEMP}/check.log"

      - name: Control runtime package tests
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo test --locked -p codex-hepta-control-plane 2>&1 | tee "${RUNNER_TEMP}/control-plane-tests.log"
          cargo test --locked -p codex-hepta-agent-protocol --lib 2>&1 | tee "${RUNNER_TEMP}/protocol-tests.log"
          cargo test --locked -p codex-hepta-agentd --lib cognitive_context 2>&1 | tee "${RUNNER_TEMP}/agentd-context-tests.log"

      - name: NDU regression suite
        working-directory: codex-rs
        run: |
          set -o pipefail
          just test --locked -p codex-hepta-ndu 2>&1 | tee "${RUNNER_TEMP}/ndu-tests.log"
          cargo test --locked -p codex-hepta-intelligence-eval --lib 2>&1 | tee "${RUNNER_TEMP}/ndu-eval-tests.log"
          cargo test --locked -p codex-hepta-intelligence --lib ndu_stochastic_admission 2>&1 | tee "${RUNNER_TEMP}/ndu-intelligence-tests.log"
          cargo test --locked -p codex-hepta-control-plane --lib planner_context 2>&1 | tee "${RUNNER_TEMP}/control-ndu-caller.log"
          cargo test --locked -p codex-hepta-control-plane --lib planner_ndu 2>&1 | tee -a "${RUNNER_TEMP}/control-ndu-caller.log"

      - name: Strict Clippy
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-control-plane \
            -p codex-hepta-agent-protocol \
            -p codex-hepta-agentd \
            -p codex-hepta-ndu \
            -- -D warnings 2>&1 | tee "${RUNNER_TEMP}/clippy.log"

      - name: Named-host NDU qualification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="${RUNNER_TEMP}/ndu-named-host-${{ matrix.lane }}.json"
          export HEPTA_NDU_HOST_ID="github-hosted-ubuntu-24.04-x86_64"
          export HEPTA_NDU_FS_PROFILE="$(stat -f -c %T "${RUNNER_TEMP}")"
          export HEPTA_NDU_RUSTC="$(rustc --version)"
          export HEPTA_NDU_CLK_TCK="$(getconf CLK_TCK)"
          export HEPTA_NDU_RECEIPT_PATH="$RECEIPT"
          export HEPTA_NDU_SOURCE_SHA="$(git rev-parse HEAD)"
          export HEPTA_NDU_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          export HEPTA_NDU_QUALIFICATION_LANE="${{ matrix.lane }}"
          cargo run --locked --release -p codex-hepta-ndu --bin ndu-named-host-qualification
          python3 -m json.tool "$RECEIPT" >/dev/null

      - name: Preserve source state
        if: always()
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-runtime-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/candidate.txt
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/ndu-named-host-${{ matrix.lane }}.json
          if-no-files-found: warn
