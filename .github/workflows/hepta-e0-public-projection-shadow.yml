name: Hepta E0 public pretrained Q24 shadow

on:
  push:
    branches:
      - research/hepta-e0-public-pretrained-q24-shadow-20261014
  pull_request:
    paths:
      - tools/hepta-neuron-experiments/public_e0_shadow.py
      - tools/hepta-neuron-experiments/public_e0_shadow_checks.py
      - .github/workflows/hepta-e0-public-projection-shadow.yml

permissions:
  contents: read

jobs:
  real-public-encoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Experiment checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: experiment
          persist-credentials: false
      - name: Reviewed HF source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: be511bd63aaae8813c415a116d50f01fe54baba5
          path: hf
          persist-credentials: false
      - name: Existing Q24 projection source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d6f35c362289c90427bfbdffd4505d2e535c1b1b
          path: projection
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned CPU numerical dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0 transformers==4.57.1 huggingface-hub==0.36.0 tokenizers==0.22.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip freeze > "$RUNNER_TEMP/e0-dependencies.txt"
      - name: Existing projected Q24 contract tests
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/experiment/tools/hepta-neuron-experiments:$GITHUB_WORKSPACE/projection/qualification/stem-cell-v1"
          python experiment/tools/hepta-neuron-experiments/public_e0_shadow_checks.py -v
      - name: Execute real pinned CPU pretrained Encoder through Q24 projection
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python experiment/tools/hepta-neuron-experiments/public_e0_shadow.py --hf-checkout "$GITHUB_WORKSPACE/hf" --projection-checkout "$GITHUB_WORKSPACE/projection" --output "$RUNNER_TEMP/e0-public-shadow"
      - name: Retain observed results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e0-public-q24-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e0-dependencies.txt
            ${{ runner.temp }}/e0-public-shadow/shadow.json
            ${{ runner.temp }}/e0-public-shadow/FAILED.json
          if-no-files-found: warn
          retention-days: 14
