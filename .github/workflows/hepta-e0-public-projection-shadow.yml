name: E0 public pretrained 768-to-Q24 shadow (not production)

on:
  push:
    branches:
      - "experiment/neuron-e0-public-pretrained-projection-shadow-20261014"
    paths:
      - "tools/hepta-neuron-experiments/public_e0_shadow.py"
      - "tools/hepta-neuron-experiments/public_e0_shadow_checks.py"
      - ".github/workflows/hepta-e0-public-projection-shadow.yml"
  pull_request:
    paths:
      - "tools/hepta-neuron-experiments/public_e0_shadow.py"
      - "tools/hepta-neuron-experiments/public_e0_shadow_checks.py"
      - ".github/workflows/hepta-e0-public-projection-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-pretrained-projection:
    name: Real HF weights -> existing projection -> Q24 control
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ${{ runner.temp }}/e0-hf-local-cache
    steps:
      - name: Exact experiment candidate source (no credentials retained)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: experiment
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned independently reviewed HF complete-loader source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: be511bd63aaae8813c415a116d50f01fe54baba5
          path: hf
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned existing Q24 projection/Head research source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d6f35c362289c90427bfbdffd4505d2e535c1b1b
          path: projection
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source candidates and Git trees
        shell: bash
        env:
          EXPERIMENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C experiment rev-parse HEAD)" = "$EXPERIMENT_SHA"
          test "$(git -C hf rev-parse HEAD)" = be511bd63aaae8813c415a116d50f01fe54baba5
          test "$(git -C hf rev-parse 'HEAD^{tree}')" = e2ae2b013e16f7aa3a0babe2869104b28a913132
          test "$(git -C projection rev-parse HEAD)" = d6f35c362289c90427bfbdffd4505d2e535c1b1b
          test "$(git -C projection rev-parse 'HEAD^{tree}')" = eff00c335408b3931e4316c2b0d4334d7620aee4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: experiment/tools/hepta-neuron-experiments/README.md
      - name: Install exact public CPU test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0 transformers==4.57.1 huggingface-hub==0.36.0 tokenizers==0.22.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -c "import torch, transformers, safetensors.torch, packaging.version; assert transformers.__version__ == '4.57.1'; assert torch.__version__.startswith('2.10.0')"
          python -m pip freeze > "$RUNNER_TEMP/e0-package-inventory.txt"
      - name: Run non-model source/projection fail-closed contract tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/experiment/tools/hepta-neuron-experiments:$GITHUB_WORKSPACE/projection/qualification/stem-cell-v1"
          python experiment/tools/hepta-neuron-experiments/public_e0_shadow_checks.py -v
          python -m unittest discover -v -s projection/qualification/stem-cell-v1 -p test_stem_projection.py
      - name: Run actual public pretrained Encoder and existing Q24 mechanism
        shell: bash
        run: |
          set -euo pipefail
          python experiment/tools/hepta-neuron-experiments/public_e0_shadow.py \
            --hf-checkout "$GITHUB_WORKSPACE/hf" \
            --projection-checkout "$GITHUB_WORKSPACE/projection" \
            --output "$RUNNER_TEMP/e0-public-q24-shadow"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"e0-public-q24-shadow/shadow.json"
          proof=json.loads(path.read_text())
          assert proof["actual_hf_forward_calls"]==3
          assert proof["q24_projection"]["source_width"]==768
          assert proof["q24_projection"]["native_width"]==256
          assert proof["q24_projection"]["last_coordinate_perturbation_survived"] is True
          assert proof["real_pretrained_model_loaded"] is True
          for disallowed in ("e0_accepted","production_authorized","native_worker_invoked","neuron_checkpoint_committed","independent_outcomes","trained_cell_head"):
              assert proof[disallowed] is False, disallowed
          PY
      - name: Retain exact research-only model observation or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-e0-public-q24-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e0-package-inventory.txt
            ${{ runner.temp }}/e0-public-q24-shadow/shadow.json
            ${{ runner.temp }}/e0-public-q24-shadow/FAILED.json
          if-no-files-found: warn
          retention-days: 14
      - name: Source check remains clean
        if: always()
        shell: bash
        run: |
          git -C experiment diff --check
          git -C experiment diff --exit-code
          git -C hf diff --exit-code
          git -C projection diff --exit-code
