name: runtime supervisor signed recovery

on:
  push:
    branches:
      - fix/runtime-supervisor-signed-recovery
    paths:
      - codex-rs/hepta-supervisor/**
      - docs/modules/runtime.supervisor/**
      - qualification/module-execution-dossiers/detail/runtime.supervisor.md
      - .github/runtime-supervisor-recovery-patch.py
      - .github/workflows/runtime-supervisor-signed-recovery.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[signed-recovery-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-supervisor-signed-recovery
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 .github/runtime-supervisor-recovery-patch.py
      - name: Remove one-shot patch machinery
        run: |
          rm .github/runtime-supervisor-recovery-patch.py
          rm .github/workflows/runtime-supervisor-signed-recovery.yml
      - name: Format supervisor crate
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-supervisor
      - name: Test supervisor crate
        working-directory: codex-rs
        run: cargo test -p codex-hepta-supervisor --all-features
      - name: Check recovery binary
        working-directory: codex-rs
        run: cargo check -p codex-hepta-supervisor --bin hepta-supervisor-recovery --all-features
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified recovery implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime.supervisor): add explicit signed recovery ceremony [signed-recovery-applied]"
          git push origin HEAD:fix/runtime-supervisor-signed-recovery
