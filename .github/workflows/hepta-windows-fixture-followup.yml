name: Windows original fixture follow-up (quiet source)

on:
  push:
    branches: ["codex/cell-windows-fixture-followup-20261109-898e"]

permissions:
  contents: read

concurrency:
  group: hepta-windows-fixture-followup-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 82ff5119200cab9d65461eb62a3829567fbc2e8f
  TESTED_SHA: 82ff5119200cab9d65461eb62a3829567fbc2e8f
  SOURCE_TREE: c4573035504ef5305d59d3e22c5d134593825455
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  original-eleven-cases:
    runs-on: windows-latest
    # Same job ceiling as the original hepta-windows-current-ci workflow.
    timeout-minutes: 65
    steps:
      - name: Enable the existing Windows checkout convention
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Checkout the independent observer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: observer
          persist-credentials: false
      - name: Checkout the exact quiet source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Install the original native compiler
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
      - name: Install the original test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Install the existing V8 artifact resolver
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Check observation rejection controls
        shell: pwsh
        run: |
          python -m unittest discover -s observer/.github/scripts -p test_windows_fixture_followup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all five selected groups and aggregate every result
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "hepta-windows-fixture-followup-target"
          python observer/.github/scripts/windows_fixture_followup.py --source-root "$env:GITHUB_WORKSPACE/source" --expected-head "$env:SOURCE_SHA" --expected-tree "$env:SOURCE_TREE" --expected-observer-head "${{ github.sha }}" --output "$env:RUNNER_TEMP/hepta-windows-fixture-followup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve every result, fresh JUnit, helper binary, and source binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-fixture-followup-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-windows-fixture-followup/
          if-no-files-found: error
          retention-days: 14
