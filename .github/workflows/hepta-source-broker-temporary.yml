name: Temporary fixed-object source broker

on:
  push:
    branches:
      - integration/hepta-rust-validation-20261117-59d82
    paths:
      - .github/workflows/hepta-source-broker-temporary.yml

permissions:
  contents: read

jobs:
  source-broker:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.event_name == 'push' &&
      github.event.deleted == false &&
      github.ref == 'refs/heads/integration/hepta-rust-validation-20261117-59d82'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Record actual storage and enable long paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $directory = Join-Path $env:RUNNER_TEMP 'hepta-source-broker-preflight'
          New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
          $volumes = Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Select-Object DeviceID, Size, FreeSpace
          [ordered]@{
            expected_head = $env:GITHUB_SHA
            event = $env:GITHUB_EVENT_NAME
            ref = $env:GITHUB_REF
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            fixed_volumes = @($volumes)
            repository_size_metadata_is_not_a_capacity_guarantee = $true
          } | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8 (Join-Path $directory 'preflight.json')
          $temporaryDrive = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP).TrimEnd('\')
          $available = $volumes | Where-Object DeviceID -eq $temporaryDrive
          if (-not $available -or $available.FreeSpace -lt 536870912) {
            throw 'Insufficient measured temporary-volume space even for partial export preparation.'
          }

      - name: Checkout the exact push with full commit history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Export the complete current tracked Git tree first
        id: current
        shell: pwsh
        env:
          BROKER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) {
            throw 'The checkout differs from the exact push head.'
          }
          $script = '.github/scripts/export_hepta_source_bundle.py'
          $expectedScript = 'ea3fd4f791bf2bc85ce28bd21b96946947ade9475635499252b44fd4f0148b44'
          if ((Get-FileHash -Algorithm SHA256 $script).Hash.ToLowerInvariant() -ne $expectedScript) {
            throw 'Exporter bytes differ from the reviewed script.'
          }
          $snapshot = '.github/scripts/hepta_source_bundle_refs.json.gz'
          if ((Get-FileHash -Algorithm SHA256 $snapshot).Hash.ToLowerInvariant() -ne 'e49cb2fabe04aa506c6073d56f2435a102189d022774a0e38a4a0ce037d49326') {
            throw 'The frozen ordinary-ref snapshot differs.'
          }
          python $script --phase current --expected-head $env:GITHUB_SHA --output (Join-Path $env:RUNNER_TEMP 'hepta-source-broker-head')
          exit $LASTEXITCODE

      - name: Preserve the current tree before historical export
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-source-broker-head-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hepta-source-broker-preflight/
            ${{ runner.temp }}/hepta-source-broker-head/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Export the fixed historical graph and source objects
        id: history
        shell: pwsh
        env:
          BROKER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = '.github/scripts/export_hepta_source_bundle.py'
          if ((Get-FileHash -Algorithm SHA256 $script).Hash.ToLowerInvariant() -ne 'ea3fd4f791bf2bc85ce28bd21b96946947ade9475635499252b44fd4f0148b44') {
            throw 'Exporter bytes changed between phases.'
          }
          python $script --phase history --expected-head $env:GITHUB_SHA --current-capsule (Join-Path $env:RUNNER_TEMP 'hepta-source-broker-head') --output (Join-Path $env:RUNNER_TEMP 'hepta-source-broker-history')
          exit $LASTEXITCODE

      - name: Preserve historical objects and the explicit omission ledger
        if: always() && steps.history.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-source-broker-history-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-source-broker-history/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
