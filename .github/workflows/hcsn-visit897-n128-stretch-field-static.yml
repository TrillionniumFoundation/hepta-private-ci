name: HCSN visit-897 N128 stretch-field static repair
on:
  push:
    branches:
      - research/hcsn-visit897-n128-stretch-field-static-20261112-c06d
permissions:
  contents: read
concurrency:
  group: hcsn-visit897-n128-stretch-field-static-20261112-c06d-001
  cancel-in-progress: false
jobs:
  stretch-field-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_COMMIT: ${{ github.sha }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_BRANCH: research/hcsn-visit897-n128-stretch-field-static-20261112-c06d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-ci-tools
      - name: Bind exact static repair source
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          git merge-base --is-ancestor ec608133a275a97f6712561a08af218fee4ebe26 HEAD
          root="$RUNNER_TEMP/visit897-n128-stretch-static"
          mkdir "$root"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          package = Path('qualification/hcsn_source_migration_vjp_n128_stretch_static')
          request = json.loads((package / 'REQUEST.json').read_text())
          source = json.loads((package / 'SOURCE.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          hashes = {
              name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for name in source['source_sha256']
          }
          if hashes != source['source_sha256']:
              raise ValueError('static repair source bytes differ')
          if request['identity'] != source['identity']:
              raise ValueError('request/source identity differs')
          if request['idempotency_key'] != source['idempotency_key']:
              raise ValueError('request/source key differs')
          result = {
              'source_commit': head,
              'identity': request['identity'],
              'idempotency_key': request['idempotency_key'],
              'source_sha256': hashes,
              'candidate_imports': 0,
              'model_forwards': 0,
              'adjoints': 0,
              'backward_attempts': 0,
              'optimizer_updates': 0,
              'numerical_execution_authorized': False,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'visit897-n128-stretch-static'
          (output / 'SOURCE-BIND.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Apply exact repository format gate
        run: |
          cd codex-rs
          just fmt --base ec608133a275a97f6712561a08af218fee4ebe26
          cd ..
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
      - name: Independent zero-execution field review
        run: |
          python -B qualification/hcsn_source_migration_vjp_n128_stretch_static/static_review.py \
            --root . \
            --output "$RUNNER_TEMP/visit897-n128-stretch-static/STATIC-REVIEW.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'visit897-n128-stretch-static' / 'STATIC-REVIEW.json').read_text()
          )
          if result['status'] != 'CLEAR_STRETCH_FIELD_STATIC_ONLY':
              raise ValueError('static repair did not clear')
          for name in ('candidate_imports', 'model_forwards', 'adjoints', 'backward_attempts', 'optimizer_updates'):
              if result[name] != 0:
                  raise ValueError('unexpected execution in static repair')
          if result['numerical_execution_authorized'] is not False:
              raise ValueError('static repair cannot authorize numerics')
          PY
      - name: Confirm checkout remained immutable
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visit897-n128-stretch-field-static-originals
          path: ${{ runner.temp }}/visit897-n128-stretch-static
          if-no-files-found: error
