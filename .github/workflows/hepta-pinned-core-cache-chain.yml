                    assert re.fullmatch('[0-9a-f]{64}',row['sha256']);result[row['path']]=row
                assert len(result)==value['file_count']<=200000 and sum(r['bytes'] for r in rows)==value['input_bytes']<=32*1024**3
                assert sum(p.startswith('ac/') for p in result)==value['ac_file_count'] and sum(p.startswith('cas/') for p in result)==value['cas_file_count']
                return result
