                assert (p['root'] / 'source-after-status.txt').read_bytes() == b''
                assert os.environ['SMALL_EVIDENCE_OUTCOME'] == 'success', 'small original evidence must already be uploaded'
                evidence_id = os.environ['SMALL_EVIDENCE_ARTIFACT_ID']
