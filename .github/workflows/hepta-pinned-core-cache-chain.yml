        def compare_manifests(old,new):
            def index(value):
                result={};rows=value['files'];assert value['schema']=='hepta-core-ac-cas-manifest-v2'
                assert value['only_regular_files'] is value['symlinks_and_devices_rejected'] is True
                for row in rows:
