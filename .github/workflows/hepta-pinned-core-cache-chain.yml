            changed=common-identical;added=set(b)-set(a);missing=set(a)-set(b)
            def group(names,source):return {'files':len(names),'bytes':sum(source[p]['bytes'] for p in names),'ac_files':sum(n.startswith('ac/') for n in names),'cas_files':sum(n.startswith('cas/') for n in names)}
            return {'old':{k:old[k] for k in ('file_count','input_bytes','ac_file_count','cas_file_count')},
                'new':{k:new[k] for k in ('file_count','input_bytes','ac_file_count','cas_file_count')},
                'unchanged':group(identical,b),'added':group(added,b),'changed_new':group(changed,b),'changed_old':group(changed,a),'missing':group(missing,a),
                'changed_paths':sorted(changed),'missing_paths':sorted(missing),
                'added_paths_sha256':sha((json.dumps(sorted(added),separators=(',',':'))+'\n').encode()),
                'raw_bytes_delta':new['input_bytes']-old['input_bytes'],'all_old_paths_retained_byte_exact':not changed and not missing}

