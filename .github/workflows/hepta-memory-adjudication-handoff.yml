name: MemoryCell complete LongMemEval adjudication handoff
on:
  pull_request:
    paths:
      - 'scripts/memory_cell/adjudication_handoff.py'
      - 'scripts/memory_cell/test_adjudication_handoff.py'
      - '.github/workflows/hepta-memory-adjudication-handoff.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-cell-adjudication-handoff-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  complete-transfer:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install the pinned complete regression environment
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-adjudication
          git rev-parse HEAD > /tmp/memory-adjudication/exporter-source.txt
          python3 -m venv /tmp/adjudication-python
          /tmp/adjudication-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/adjudication-python/bin/pip install -r scripts/memory_cell/requirements.txt
          /tmp/adjudication-python/bin/pip freeze > /tmp/memory-adjudication/python-lock.txt
      - name: Test strict native evidence and handoff boundaries
        run: |
          set -euo pipefail
          /tmp/adjudication-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/memory-adjudication/regressions.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preserved-native-plan
          run-id: 37886300748
          github-token: ${{ github.token }}
          path: /tmp/preserved-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preserved-native-complete-review
          run-id: 37886300748
          github-token: ${{ github.token }}
          path: /tmp/preserved-review
      - name: Bind all 2000 original attempts without judging or signing them
        env:
          EXPORTER_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-adjudication
          /tmp/adjudication-python/bin/python scripts/memory_cell/adjudication_handoff.py \
            /tmp/preserved-plan/longmemeval.json /tmp/preserved-review/complete /tmp/memory-adjudication/handoff \
            --plan-sha256 9352f25e3510b94a8c8663eb8850471574585b96f5c56812ccdd094178f0fc2d \
            --manifest-sha256 da23ded0e762ce6d130585c22645da8cfbf119696b2b33a284813614d0e4b923 \
            --exporter-commit "$EXPORTER_COMMIT" \
            2>&1 | tee /tmp/memory-adjudication/export.log
          cp /tmp/preserved-plan/longmemeval.json /tmp/memory-adjudication/preregistered-plan.json
          cp /tmp/preserved-review/complete/summary.json /tmp/memory-adjudication/original-complete-summary.json
          git rev-parse HEAD > /tmp/memory-adjudication/exporter-source.txt
      - name: Retain success or failure evidence hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-adjudication
          git rev-parse HEAD > /tmp/memory-adjudication/exporter-source.txt
          (cd /tmp/memory-adjudication && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-longmemeval-adjudication-handoff
          path: /tmp/memory-adjudication
          if-no-files-found: error
