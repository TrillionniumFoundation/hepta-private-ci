name: knowledge.graph read-only development verification

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - ".github/workflows/hepta-kg-source-snapshot-readonly.yml"
      - "codex-rs/hepta-kg/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kg-readonly-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'source_sha=%s\nsource_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            | tee "$RUNNER_TEMP/source-identity.txt"

      - name: Check KG-owned Rust formatting
        working-directory: codex-rs
        shell: bash
        run: cargo fmt --all -- --check

      - name: Check KG package and all targets
        working-directory: codex-rs
        shell: bash
        run: cargo check --locked -p codex-hepta-kg --all-targets

      - name: Run strict KG Clippy
        working-directory: codex-rs
        shell: bash
        run: cargo clippy --locked -p codex-hepta-kg --all-targets -- -D warnings

      - name: Run KG package tests
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-kg

      - name: Prove clean tracked state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload immutable development identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-development-identity-${{ github.sha }}
          path: ${{ runner.temp }}/source-identity.txt
          if-no-files-found: error
          retention-days: 1
