name: NDU bounded repair export
on:
  push:
    branches: [codex/utility-ndu-production-hardening-20260926]
    paths: [.github/workflows/hepta-ndu-repair-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Export committed source and formatting-only diagnostic
        shell: bash
        env:
          OUT: ${{ runner.temp }}/ndu-repair-export
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git rev-parse HEAD HEAD^{tree} > "$OUT/identity.txt"
          git archive --format=tar.gz -o "$OUT/source.tar.gz" HEAD \
            codex-rs/hepta-ndu codex-rs/hepta-agentd codex-rs/hepta-agent-protocol \
            codex-rs/hepta-intelligence codex-rs/hepta-intelligence-eval \
            codex-rs/hepta-contracts codex-rs/hepta-types \
            codex-rs/hepta-learning-artifacts codex-rs/hepta-learning-ledger \
            codex-rs/hepta-control-plane codex-rs/hepta-shadow-qualification \
            codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/rust-toolchain.toml \
            codex-rs/rustfmt.toml scripts docs/modules/utility.ndu \
            docs/modules/MODULE_DOCS.json docs/readiness/NDU_SYSTEM_EXECUTION.md \
            docs/learning/NDU_FBSDE_SPEC.md .github/workflows/hepta-ndu-recursion.yml
          python3 - <<'PY'
          import importlib.util, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          spec = importlib.util.spec_from_file_location('qualification', 'scripts/hepta-ndu-qualification.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          out = Path(os.environ['OUT'])
          command = ['cargo', 'fmt']
          for package in module.CORE + module.PRODUCT:
              command.extend(['--package', package])
          with (out / 'format.log').open('w') as stream:
              subprocess.run(command, cwd='codex-rs', stdout=stream, stderr=subprocess.STDOUT, check=True)
          PY
          git diff --binary > "$OUT/rustfmt.patch"
          git diff --stat > "$OUT/rustfmt-stat.txt"
          sha256sum "$OUT/source.tar.gz" "$OUT/rustfmt.patch" > "$OUT/SHA256SUMS"
      - name: Retain diagnostic source and exact formatter output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-repair-export-${{ github.sha }}
          path: ${{ runner.temp }}/ndu-repair-export
          if-no-files-found: error
          retention-days: 7
