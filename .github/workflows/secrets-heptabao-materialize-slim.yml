name: Materialize secrets.heptabao exact candidate on slim runner

on:
  push:
    branches:
      - codex/secrets-heptabao-production-qualified-20260930
    paths:
      - .github/workflows/secrets-heptabao-materialize-slim.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-materialize-slim
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FEATURES: bao-https-client authbus-admission durable-leases durable-operations final-use-consumer registered-final-use-host sqlite-owner sqlite-product-runtime

jobs:
  exact-candidate:
    runs-on: ubuntu-slim
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/secrets-heptabao-production-qualified-20260930
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Materialize and commit one candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/close_secrets_heptabao_candidate.py
          python3 scripts/generate_secrets_heptabao_module.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
          git diff --check
          git config user.name "Hepta qualification bot"
          git config user.email "hepta-qualification@users.noreply.github.com"
          git add codex-rs/hepta-bao-adapter docs/modules/secrets.heptabao \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            .github/workflows/secrets-heptabao-five-closure-qualified.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(secrets): bind exact candidate qualification"
            git push origin HEAD:codex/secrets-heptabao-production-qualified-20260930
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Run all exact-source lanes and build receipt
        id: qualify
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/secrets-evidence"
          mkdir -p "$evidence/logs"
          failed=0
          check() {
            name="$1"; shift
            echo "::group::$name"
            "$@" >"$evidence/logs/$name.log" 2>&1 || failed=1
            cat "$evidence/logs/$name.log"
            echo "::endgroup::"
          }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || failed=1
          check manifest python3 scripts/generate_secrets_heptabao_module.py
          git diff --exit-code -- docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/modules/secrets.heptabao/IMPLEMENTATION_MAP.json \
            docs/modules/secrets.heptabao/CAPABILITY_MATRIX.json \
            docs/modules/secrets.heptabao/NONCLAIMS.json \
            docs/modules/secrets.heptabao/SOURCE_ANCHORS.json \
            >"$evidence/logs/manifest-diff.log" 2>&1 || failed=1
          check format bash -lc 'cd codex-rs && cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite -- --check'
          check clippy bash -lc 'cd codex-rs && cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets --features "$FEATURES" -- -D warnings'
          check all-target-tests bash -lc 'cd codex-rs && cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets --features "$FEATURES" -- --test-threads=2'
          check no-default-features bash -lc 'cd codex-rs && cargo test --locked -p codex-hepta-bao-adapter --no-default-features --all-targets -- --test-threads=2'
          check authbus-authority bash -lc 'cd codex-rs && cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2'
          check authbus-operation bash -lc 'cd codex-rs && cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2'
          check python-qa python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*.py'
          args=(--output "$evidence/readiness-manifest.json")
          if [[ "$failed" -eq 0 ]]; then args+=(--qualified); fi
          python3 codex-rs/hepta-bao-adapter/qa/build_readiness_manifest.py "${args[@]}"
          git archive --format=tar.gz --output "$evidence/exact-source.tar.gz" HEAD
          sha256sum "$evidence/exact-source.tar.gz" > "$evidence/artifact-sha256.txt"
          python3 - "$failed" <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "secrets-evidence"
          data = json.loads((root / "readiness-manifest.json").read_text())
          data["artifact_hashes"] = {"exact-source.tar.gz": (root / "artifact-sha256.txt").read_text().split()[0]}
          data["sourceQualificationPassed"] = sys.argv[1] == "0"
          (root / "readiness-manifest.json").write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY
          cat "$evidence/readiness-manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "$failed" > "$evidence/failure-count"

      - name: Retain exact source and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-readiness-${{ steps.candidate.outputs.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secrets-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed on any source lane
        if: always()
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/secrets-evidence/failure-count")" = 0
