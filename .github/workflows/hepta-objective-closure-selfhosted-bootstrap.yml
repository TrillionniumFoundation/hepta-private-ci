# bootstrap-trigger: isolated-general-r2-20260927
name: Hepta objective closure isolated bootstrap

on:
  push:
    branches:
      - work/objective-compiler-final-closure-20260927
    paths:
      - .github/workflows/hepta-objective-closure-selfhosted-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: hepta-objective-closure-isolated-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: work/objective-compiler-final-closure-20260927
      TRIGGER_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact isolated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rebind closure materializer to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = TrillionniumFoundation/hepta-private-ci
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${TRIGGER_SHA}"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${TRIGGER_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/hepta-objective-closure-materialize.yml")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "# closure-trigger: durable-proof-and-evidence-arm-20260927\n",
                  "# closure-trigger: durable-proof-and-evidence-isolated-arm-20260927\n",
              ),
              (
                  "      - work/objective-compiler-convergence-20260925\n",
                  "      - work/objective-compiler-final-closure-20260927\n",
              ),
              (
                  "  group: hepta-objective-closure-materialize\n",
                  "  group: hepta-objective-closure-materialize-isolated\n",
              ),
              (
                  "      TARGET_BRANCH: work/objective-compiler-convergence-20260925\n",
                  "      TARGET_BRANCH: work/objective-compiler-final-closure-20260927\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement, observed {count}: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name hepta-qualification
          git config user.email qualification@invalid
          git rm .github/workflows/hepta-objective-closure-selfhosted-bootstrap.yml
          git add .github/workflows/hepta-objective-closure-materialize.yml
          git diff --cached --check
          git commit -m "ci(objective): isolate durable proof closure execution"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${TRIGGER_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"
