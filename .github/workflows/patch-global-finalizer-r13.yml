name: patch-global-finalizer-r13

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/patch-global-finalizer-r13.yml
      - scripts/patch-global-finalizer-r13.py

permissions:
  contents: write
  actions: write

concurrency:
  group: patch-global-finalizer-r13
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: d82ff27cd253210d8c1c0c625fe1c1880fa54931
      TARGET_BRANCH: ops/hepta-global-gap-closure-controller-20260910-r1
      FINALIZER: scripts/hepta-global-finalizer-r7.py
      PATCH_SCRIPT: scripts/patch-global-finalizer-r13.py
      PATCH_WORKFLOW: .github/workflows/patch-global-finalizer-r13.yml
    steps:
      - name: Check out exact patch bootstrap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact patch bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:${PATCH_WORKFLOW})" = "$(git hash-object "${PATCH_WORKFLOW}")"
          test -f "${PATCH_SCRIPT}"

      - name: Apply and validate the audited r13 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "${PATCH_SCRIPT}"
          python3 -m py_compile "${FINALIZER}" "${PATCH_SCRIPT}"
          python3 - <<'PY'
          from pathlib import Path

          text = Path("scripts/hepta-global-finalizer-r7.py").read_text(encoding="utf-8")
          required = (
              "def imported_workspace_crates_by_kind(",
              "def workspace_dependency_graph(",
              "def dependency_cycle_path(",
              "cycle = dependency_cycle_path(graph, package_name, dependency_name)",
              '"skippedCycles": skipped_cycles',
              '"skippedCycleCount": len(skipped_cycles)',
              'path == ".github/workflows/lane-f-bootstrap.yml"',
              'git("rm", "--", path)',
          )
          for phrase in required:
              if phrase not in text:
                  raise SystemExit(f"patched finalizer is missing {phrase}")
          PY
          git diff --check

      - name: Publish patched controller and dispatch r7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'hepta-global-finalizer-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm "${PATCH_WORKFLOW}" "${PATCH_SCRIPT}"
          git add "${FINALIZER}"
          git diff --cached --check
          git commit -m 'fix(hepta): remove transient Lane F publisher from convergence'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          gh workflow run hepta-global-finalizer-r7.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TARGET_BRANCH}" \
            -f target_branch=integration/hepta-all-gap-closure-20260910-r7 \
            -f shard_count=8
