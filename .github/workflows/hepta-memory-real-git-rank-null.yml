name: MemoryCell immutable Git rank-only null (no Reader)
on:
  pull_request:
    paths:
      - scripts/memory_cell/real_source_rank_null.py
      - scripts/memory_cell/test_real_source_rank_null.py
      - scripts/memory_cell/real_source_rank_paired_gate.py
      - scripts/memory_cell/test_real_source_rank_paired_gate.py
      - scripts/memory_cell/real_source_reader_probe.py
      - .github/workflows/hepta-memory-real-git-rank-null.yml
permissions:
  contents: read
  actions: read
jobs:
  source-rank-null:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts/memory_cell
      GH_TOKEN: ${{ github.token }}
      MEMORY_REAL_SOURCE_ZIP: /tmp/memory-git-rank-null/original.zip
      MEMORY_REOPEN_ZIP: /tmp/memory-git-rank-null/reopen.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checkout against actual PR source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Download original immutable Git source and separately reopened bytes
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-git-rank-null
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11778273351/zip' \
            -o "$MEMORY_REAL_SOURCE_ZIP"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11779107585/zip' \
            -o "$MEMORY_REOPEN_ZIP"
          echo "a4c7b9868461c11558546bd582796255cbca682c938a1704d62cd93a556406b4  $MEMORY_REAL_SOURCE_ZIP" | sha256sum --check
          echo "59dee0a84099f6fb101dbfd5420c569f10c44a2d8a7b67c984e381edf4db9d36  $MEMORY_REOPEN_ZIP" | sha256sum --check
      - name: Verify complete source-index and fail-closed regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/memory_cell/real_source_rank_null.py scripts/memory_cell/test_real_source_rank_null.py scripts/memory_cell/real_source_rank_paired_gate.py scripts/memory_cell/test_real_source_rank_paired_gate.py
          python3 -m unittest discover -s scripts/memory_cell -p test_real_source_rank_null.py -v
          python3 -m unittest discover -s scripts/memory_cell -p test_real_source_reader_probe.py -v
          python3 -m unittest discover -s scripts/memory_cell -p test_real_source_rank_paired_gate.py -v
      - name: Independently recompute rank-only source-bound null on original files
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-git-rank-null/results
          python3 scripts/memory_cell/real_source_rank_null.py \
            --source-zip "$MEMORY_REAL_SOURCE_ZIP" \
            --reopen-zip "$MEMORY_REOPEN_ZIP" \
            --output /tmp/memory-git-rank-null/results/rank-only-null.json
          echo '87dd3debd2cf69d6c4fbfe572868eb590d789d806c775fed2021bdbda0638114  /tmp/memory-git-rank-null/results/rank-only-null.json' | sha256sum --check
          git rev-parse HEAD > /tmp/memory-git-rank-null/results/tested-commit.txt
          (cd /tmp/memory-git-rank-null/results && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-git-source-rank-only-null
          path: /tmp/memory-git-rank-null/results
          if-no-files-found: warn
