name: Memory retrieval closure bootstrap scheduled

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memory-retrieval-closure-bootstrap-scheduled
  cancel-in-progress: false

env:
  TARGET_BRANCH: chatgpt/memory-retrieval-full-closure-20260929

jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect pending bootstrap
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/patches/memory-retrieval-phase1a.patch \
            && test -f .github/patches/memory-retrieval-phase1b.patch \
            && test -f .github/patches/memory-retrieval-phase2.patch; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply closure patches
        if: steps.pending.outputs.value == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test -z "$(git status --porcelain)"
          git apply --check --verbose .github/patches/memory-retrieval-phase1a.patch
          git apply --check --verbose .github/patches/memory-retrieval-phase1b.patch
          git apply --check --verbose .github/patches/memory-retrieval-phase2.patch
          git apply --index --verbose .github/patches/memory-retrieval-phase1a.patch
          git apply --index --verbose .github/patches/memory-retrieval-phase1b.patch
          git apply --index --verbose .github/patches/memory-retrieval-phase2.patch
          python3 scripts/validate_memory_retrieval_closure.py \
            --stamp-observation "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          git add -A
          git diff --cached --check

      - name: Install pinned formatter
        if: steps.pending.outputs.value == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.22"
          enable-cache: false

      - name: Prepare native prerequisites
        if: steps.pending.outputs.value == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler

      - name: Format and validate repository closure
        if: steps.pending.outputs.value == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/format.py
          git add -A
          git diff --cached --check
          python3 scripts/format.py --check
          python3 scripts/validate_memory_retrieval_closure.py

      - name: Validate locked Cargo graph
        if: steps.pending.outputs.value == 'true'
        working-directory: codex-rs
        shell: bash
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Test retrieval core and lifecycle
        if: steps.pending.outputs.value == 'true'
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-memory-retrieval

      - name: Test durable memory migration
        if: steps.pending.outputs.value == 'true'
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-memory

      - name: Compile Agentd product path
        if: steps.pending.outputs.value == 'true'
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-agentd --no-run

      - name: Test operations durability
        if: steps.pending.outputs.value == 'true'
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-operations

      - name: Strict all-target Clippy
        if: steps.pending.outputs.value == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          cargo clippy --locked --all-targets \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-operations \
            -- -D warnings

      - name: Commit and publish verified source closure
        if: steps.pending.outputs.value == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/patches/memory-retrieval-phase1a.patch
          rm .github/patches/memory-retrieval-phase1b.patch
          rm .github/patches/memory-retrieval-phase2.patch
          rm .github/workflows/memory-retrieval-apply-closure.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(memory-retrieval): close exact-head source blockers"
          git push origin "HEAD:$TARGET_BRANCH"
