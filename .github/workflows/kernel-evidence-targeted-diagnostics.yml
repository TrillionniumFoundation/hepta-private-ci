name: Kernel evidence targeted diagnostics

on:
  push:
    branches:
      - work/kernel-evidence-ad-integration-20260928
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-evidence-targeted-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          printf '%s\n' "$(git rev-parse HEAD)" > diagnostics/head.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > diagnostics/tree.txt
          git status --porcelain=v1 > diagnostics/status-before.txt

      - name: Diagnose Rust formatting
        continue-on-error: true
        shell: bash
        run: |
          set +e
          find codex-rs/hepta-evidence codex-rs/hepta-agentd codex-rs/state codex-rs/hepta-agent-protocol \
            -name '*.rs' -print0 \
            | xargs -0 rustfmt --edition 2024 --check \
            > diagnostics/rustfmt.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/rustfmt.exit
          cat diagnostics/rustfmt.log
          exit "$status"

      - name: Diagnose Python syntax
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            while IFS= read -r -d '' file; do
              python3 -m py_compile "$file" || exit $?
            done < <(find scripts -maxdepth 1 -name '*.py' -print0 | sort -z)
          } > diagnostics/python-syntax.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/python-syntax.exit
          cat diagnostics/python-syntax.log
          exit "$status"

      - name: Diagnose Python unit tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            while IFS= read -r -d '' file; do
              echo "==> $file"
              python3 "$file" || exit $?
            done < <(find scripts/tests -maxdepth 1 -name 'test_*.py' -print0 | sort -z)
          } > diagnostics/python-unit.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/python-unit.exit
          cat diagnostics/python-unit.log
          exit "$status"

      - name: Diagnose evidence package
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd codex-rs && cargo test --locked -p codex-hepta-evidence) \
            > diagnostics/evidence-tests.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/evidence-tests.exit
          cat diagnostics/evidence-tests.log
          exit "$status"

      - name: Diagnose Agentd product targets
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd codex-rs && cargo test --locked -p codex-hepta-agentd \
            --test kernel_evidence_product \
            --test kernel_evidence_profile \
            --test kernel_evidence_paging_product \
            --test kernel_evidence_publication_cli) \
            > diagnostics/agentd-tests.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/agentd-tests.exit
          cat diagnostics/agentd-tests.log
          exit "$status"

      - name: Diagnose Lane A truth
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/verify_lane_a_foundation.py verify \
            > diagnostics/lane-a-truth.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/lane-a-truth.exit
          cat diagnostics/lane-a-truth.log
          exit "$status"

      - name: Diagnose development documents
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/hepta-docs.py verify \
            > diagnostics/docs.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/docs.exit
          cat diagnostics/docs.log
          exit "$status"

      - name: Diagnose implementation maps
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/hepta-implementation-maps.py verify \
            > diagnostics/implementation-maps.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/implementation-maps.exit
          cat diagnostics/implementation-maps.log
          exit "$status"

      - name: Diagnose patch integrity
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git diff --check > diagnostics/diff-check.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/diff-check.exit
          cat diagnostics/diff-check.log
          exit "$status"

      - name: Record final worktree
        if: always()
        shell: bash
        run: git status --porcelain=v1 > diagnostics/status-after.txt

      - name: Retain all gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-evidence-targeted-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: diagnostics
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Fail closed on any missing or failed gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for gate in \
            rustfmt python-syntax python-unit evidence-tests agentd-tests \
            lane-a-truth docs implementation-maps diff-check; do
            file="diagnostics/${gate}.exit"
            if [[ ! -f "$file" ]]; then
              echo "missing result for $gate" >&2
              failures=$((failures + 1))
              continue
            fi
            status="$(cat "$file")"
            if [[ "$status" != 0 ]]; then
              echo "$gate failed with exit $status" >&2
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0
