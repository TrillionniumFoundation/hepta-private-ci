name: Paired runtime artifact contract

on:
  pull_request:
    paths:
      - scripts/cell_experiments/paired_loop.py
      - scripts/cell_experiments/runtime_artifacts.py
      - scripts/cell_experiments/test_runtime_artifacts.py
      - scripts/cell_experiments/test_paired_loop.py
      - .github/workflows/paired-artifact-contract.yml

permissions:
  contents: read

jobs:
  artifact-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/cell_experiments
            qualification/paired-consumer-use-20261123
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify actual file substitutions and retained loop records
        run: python -m unittest cell_experiments.test_runtime_artifacts cell_experiments.test_paired_loop -v
      - name: Check source stayed unchanged
        run: git diff --exit-code
