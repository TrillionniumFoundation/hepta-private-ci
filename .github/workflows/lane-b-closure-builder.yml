name: Lane B closure candidate builder (temporary)

on:
  push:
    branches:
      - codex/lane-b-gap-closure-20260911

permissions:
  contents: write

concurrency:
  group: lane-b-closure-builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.actor != 'hepta-lane-b-closure-bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Build Lane B closure tree
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/lane_b_closure_builder.py
          python3 .github/scripts/lane_b_closure_canonical_patch.py
          test ! -e .github/scripts/lane_b_closure_builder.py
          test ! -e .github/scripts/lane_b_closure_canonical_patch.py
          test ! -e .github/workflows/lane-b-closure-builder.yml
          git diff --check

      - name: Commit exact closure candidate
        id: candidate
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name hepta-lane-b-closure-bot
          git config user.email hepta-lane-b-closure-bot@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(lane-b): close repository-internal runtime blockers"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          git rev-parse HEAD HEAD^{tree}

      - name: Verify Lane B registry and native mappings
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/hepta-lane-b-closure.py self-test
          python3 scripts/hepta-lane-b-closure.py generate-status --check
          python3 scripts/hepta-lane-b-closure.py verify

      - name: Verify module document metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify

      - name: Verify implementation dossier contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository

      - name: Verify global canonical document system
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py verify

      - name: Verify repository integrity policy
        id: integrity
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          {
            set -x
            python3 scripts/hepta-repository-integrity.py self-test
            python3 scripts/hepta-repository-integrity.py verify \
              --base 04f60466394a024c218ce66b1b32d1c42c462985 \
              --head "$(git rev-parse HEAD)"
          } 2>&1 | tee "$RUNNER_TEMP/lane-b-integrity.log"
          exit "${PIPESTATUS[0]}"

      - name: Retain repository-integrity diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane-b-integrity-${{ steps.candidate.outputs.sha }}
          path: ${{ runner.temp }}/lane-b-integrity.log
          if-no-files-found: error
          retention-days: 7

      - name: Require repository integrity
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.integrity.outcome }}" = success

      - name: Verify browser boundary
        shell: bash
        run: |
          set -euxo pipefail
          npm --prefix apps/hepta-browser run ci

      - name: Verify control UI boundary
        shell: bash
        run: |
          set -euxo pipefail
          npm --prefix apps/hepta-control-ui run ci

      - name: Verify native UI boundary
        shell: bash
        run: |
          set -euxo pipefail
          npm --prefix apps/hepta-native run ci

      - name: Verify clean committed candidate
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push verified closure candidate
        shell: bash
        run: |
          set -euxo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
