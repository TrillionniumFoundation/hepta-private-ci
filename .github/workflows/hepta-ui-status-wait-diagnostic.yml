name: UI status wait diagnosis only

on:
  push:
    branches:
      - codex/cell-ui-status-diagnostic-20261109-898e

permissions:
  contents: read

concurrency:
  group: ui-status-wait-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  TESTED_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  original-gateway-group:
    name: Diagnostic source / original seven gateway browser cases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Admit the exact independent diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$TESTED_SHA"
          python3 .github/scripts/ui_status_wait_diagnostic.py --mode admit --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/ui-status-wait-diagnostic" --source-sha "$SOURCE_SHA"
          BACKEND_TOOLCHAIN="$(python3 apps/hepta-control-ui/tools/build-product-preview.py --print-toolchain)"
          echo "BACKEND_TOOLCHAIN=$BACKEND_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Install the original pinned UI toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup toolchain install nightly-2026-10-02 --profile minimal --component rust-src
          test "$(rustup run nightly-2026-10-02 rustc --version)" = "rustc 1.101.0-nightly (c36f14571 2026-10-01)"
          test "$(rustc --version)" = "rustc 1.95.0 (59807616e 2026-04-14)"
      - name: Build the original strict-CSP no-threads UI artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix apps/hepta-control-ui --ignore-scripts --no-audit --no-fund
          npm run build --prefix apps/hepta-control-ui
      - name: Install the original browser and OCR dependencies
        working-directory: apps/hepta-control-ui
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim python3-pil
          dpkg-query -W tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim python3-pil > "$RUNNER_TEMP/ui-status-wait-diagnostic/ocr-inputs.log"
      - name: Build the real gateway from this diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$BACKEND_TOOLCHAIN" --profile minimal
          python3 apps/hepta-control-ui/tools/build-product-preview.py --target-dir "$RUNNER_TEMP/product-gateway-target"
      - name: Install the original hash-pinned product browser
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/hepta-control-ui/tools/install-font-diagnostic-browser.py "$RUNNER_TEMP/product-qualified-browser"
          echo "HEPTA_PRODUCT_BROWSER=$RUNNER_TEMP/product-qualified-browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - id: gateway_group
        name: Run the unchanged complete seven-case gateway group
        env:
          HEPTA_GATEWAY_EXAMPLE: ${{ runner.temp }}/product-gateway-target/debug/examples/ui_product_preview
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_status_wait_diagnostic.py --mode run --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/ui-status-wait-diagnostic" --source-sha "$SOURCE_SHA"
      - name: Preserve source identity and original case results without diagnosing a cause
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/ui_status_wait_diagnostic.py --mode observe --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/ui-status-wait-diagnostic" --source-sha "$SOURCE_SHA"
      - name: Upload failed and successful diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-status-diagnostic-only-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ui-status-wait-diagnostic/
            apps/hepta-control-ui/test-results/product-status/
            apps/hepta-control-ui/test-results/product-status-results.json
            apps/hepta-control-ui/dist/build-manifest.json
            ${{ runner.temp }}/product-gateway-target/debug/examples/ui_product_preview.hepta-build.json
          if-no-files-found: error
