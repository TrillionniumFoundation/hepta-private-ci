name: NDU observed TLS advisory lock candidate

on:
  pull_request:
    paths:
      - .github/workflows/ndu-tls-lock-candidate.yml
      - scripts/ndu_tls_lock_candidate.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndu-tls-lock-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-reviewable-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare the pinned Bazel tools
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: ndu-tls-lock-candidate

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582

      - name: Generate patched TLS lock candidates without pushing changes
        env:
          CARGO_TERM_COLOR: never
        run: >-
          python3 scripts/ndu_tls_lock_candidate.py
          --repository "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/ndu-tls-lock-candidate"

      - name: Retain candidates and any resolver failures
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-tls-lock-candidate
          path: ${{ runner.temp }}/ndu-tls-lock-candidate
          if-no-files-found: error
          retention-days: 21
