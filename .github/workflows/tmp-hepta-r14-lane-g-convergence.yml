name: Temporary Hepta r14 Lane G convergence repair

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/tmp-hepta-r14-lane-g-convergence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-hepta-r14-lane-g-convergence
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current controller branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ops/hepta-global-gap-closure-controller-20260910-r1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact cumulative conflict policy
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ops/hepta-global-gap-closure-controller-20260910-r1"
          python3 scripts/patch-hepta-r7-lane-g-r14.py
          python3 -m py_compile scripts/hepta-global-finalizer-r7.py
          git diff --check

      - name: Publish repaired source and retire transient writers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-r14-convergence-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/hepta-global-finalizer-r7.py
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-hepta-r14-lane-g-convergence.yml \
            scripts/patch-hepta-r7-lane-g-r14.py \
            .github/workflows/patch-global-finalizer-r13.yml \
            scripts/patch-global-finalizer-r13.py \
            .github/workflows/tmp-hepta-controller-remediation.yml \
            .github/workflows/tmp-hepta-r7-dependency-scope-cycle.yml
          git diff --cached --check
          git commit -m 'fix(hepta): converge Lane G over cumulative owner metadata'
          git push origin HEAD:refs/heads/ops/hepta-global-gap-closure-controller-20260910-r1
