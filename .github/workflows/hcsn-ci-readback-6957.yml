name: hcsn-ci-readback-6957

on:
  pull_request:
    paths:
      - "qualification/hcsn_ci_readbacks/6957/**"
      - ".github/workflows/hcsn-ci-readback-6957.yml"

permissions:
  contents: read

jobs:
  exact-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify immutable originals without numerical replay
        run: |
          python3 qualification/hcsn_ci_readbacks/6957/verify.py
          python3 -O qualification/hcsn_ci_readbacks/6957/verify.py
          python3 -m py_compile qualification/hcsn_ci_readbacks/6957/verify.py
