name: Hepta memory retrieval A-E exact-head validation

on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: memory-retrieval-ae-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  identity:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      base: ${{ steps.bind.outputs.base }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: bind
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          echo "base=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

  native:
    name: Retrieval native ${{ matrix.lane }} / ${{ matrix.group }}
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, current-main, base-merge]
        group: [core, product]
    env:
      SOURCE_SHA: ${{ github.sha }}
      BASE_SHA: ${{ needs.identity.outputs.base }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
      NATIVE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind tested object without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retrieval-native"
          cp scripts/hepta_ci_exec.py "$RUNNER_TEMP/retrieval-ci-exec.py"
          sha256sum "$RUNNER_TEMP/retrieval-ci-exec.py" > "$RUNNER_TEMP/retrieval-native/harness.sha256"
          case "$HEPTA_CI_LANE" in
            source-head) tested="$SOURCE_SHA" ;;
            current-main) tested="$BASE_SHA" ;;
            base-merge)
              git fetch --no-tags origin "$BASE_SHA"
              tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
              tested="$(printf '%s\n' 'Read-only retrieval validation merge' | git -c user.name=Retrieval-CI -c user.email=retrieval-ci@example.invalid commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
              test "$(git show -s --format=%P "$tested")" = "$BASE_SHA $SOURCE_SHA"
              ;;
            *) exit 1 ;;
          esac
          if test "$HEPTA_CI_LANE" = current-main; then
            echo "SOURCE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
            echo 'HEPTA_CI_LANE=source-head' >> "$GITHUB_ENV"
          fi
          git checkout --detach "$tested"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "TESTED_SHA=$tested" >> "$GITHUB_ENV"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-native/identity.txt"
          printf 'candidate=%s\nbase=%s\nlane=%s\ngroup=%s\n' "$SOURCE_SHA" "$BASE_SHA" "$HEPTA_CI_LANE" "$NATIVE_GROUP" > "$RUNNER_TEMP/retrieval-native/input.txt"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Prepare native host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Resolve checksum-verified V8 product inputs
        if: matrix.group == 'product'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Execute all checks and retain failures independently
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/retrieval-native"
          rustc -Vv > "$out/rustc.txt"
          failed=0
          if test "$NATIVE_GROUP" = core; then
            packages=(codex-hepta-memory-retrieval codex-hepta-learning-ledger codex-hepta-infer-core)
          else
            packages=(codex-hepta-memory codex-hepta-agentd)
          fi
          args=()
          for package in "${packages[@]}"; do
            args+=(-p "$package")
            python3 "$RUNNER_TEMP/retrieval-ci-exec.py" --output "$out/$package-tests.json" --minimum-tests 1 --timeout-seconds 2400 -- just test --locked -p "$package" --all-targets || failed=1
          done
          python3 "$RUNNER_TEMP/retrieval-ci-exec.py" --output "$out/clippy.json" --timeout-seconds 1200 -- cargo clippy --manifest-path codex-rs/Cargo.toml --locked "${args[@]}" --all-targets -- -D warnings || failed=1
          python3 "$RUNNER_TEMP/retrieval-ci-exec.py" --output "$out/format.json" --timeout-seconds 120 -- cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check || failed=1
          python3 "$RUNNER_TEMP/retrieval-ci-exec.py" --output "$out/metadata.json" --timeout-seconds 120 -- cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps --format-version 1 || failed=1
          test -z "$(git status --porcelain --untracked-files=all)" || failed=1
          printf '%s\n' 'Native source validation only. No target-host, independent acceptance, activation or release claim.' > "$out/CLAIM_BOUNDARY.txt"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-${{ github.sha }}-${{ matrix.lane }}-${{ matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-native/
          retention-days: 30
          if-no-files-found: error

  formatter:
    name: Retrieval exact-head formatter
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Export pinned formatter for offline source reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retrieval-tools"
          formatter="$(rustup which --toolchain 1.95.0 rustfmt)"
          cp "$formatter" "$RUNNER_TEMP/retrieval-tools/rustfmt"
          ldd "$formatter" > "$RUNNER_TEMP/retrieval-tools/linked-libraries.txt"
          rustc -Vv > "$RUNNER_TEMP/retrieval-tools/toolchain.txt"
          (cd "$RUNNER_TEMP/retrieval-tools"; sha256sum rustfmt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrieval-formatter-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-tools/
          retention-days: 1
          if-no-files-found: error
      - name: Check formatting without mutating the candidate
        run: cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all -- --check
