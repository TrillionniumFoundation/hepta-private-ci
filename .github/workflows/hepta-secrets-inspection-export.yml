name: Export exact secrets.heptabao continuation checkout

on:
  push:
    branches:
      - codex/secrets-heptabao-inspection-export-20260929
    paths:
      - ".github/workflows/hepta-secrets-inspection-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Export tracked checkout
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/hepta-secrets-checkout.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/hepta-secrets-checkout.tar.gz" > "$RUNNER_TEMP/hepta-secrets-checkout.tar.gz.sha256"

      - name: Retain exact checkout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-secrets-checkout-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-secrets-checkout.tar.gz
            ${{ runner.temp }}/hepta-secrets-checkout.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2
