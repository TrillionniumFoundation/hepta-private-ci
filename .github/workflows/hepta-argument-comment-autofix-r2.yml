name: Hepta argument-comment repair materialization r2

on:
  push:
    branches:
      - codex/hepta-v8-argument-comment-closure-r2-20260907

permissions:
  contents: read

concurrency:
  group: hepta-argument-comment-repair-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.ref_name == 'codex/hepta-v8-argument-comment-closure-r2-20260907'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BASE_SHA: e16208a8d490e72006f60eb002a220eb5cb174dc
      WORKFLOW_PATH: .github/workflows/hepta-argument-comment-autofix-r2.yml
      RUST_MIN_STACK: "8388608"
    steps:
      - name: Enable Windows long paths before checkout
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Check out the exact repair input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact one-file workflow child
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = "$WORKFLOW_PATH"
          test -z "$(git status --porcelain)"

      - name: Prepare repository tools
        uses: ./.github/actions/setup-ci

      - name: Install the pinned stable Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install the lint ABI toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2025-09-18 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rustc-dev \
            --component rust-src \
            --no-self-update

      - name: Apply machine-applicable argument comments
        shell: bash
        run: |
          set -euo pipefail
          python tools/argument-comment-lint/run-prebuilt-linter.py \
            --fix \
            -- \
            --all-targets \
            --locked \
            --ignore-rust-version

      - name: Apply the repository Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --manifest-path codex-rs/Cargo.toml \
            -- \
            --config imports_granularity=Item

      - name: Verify the repaired full Cargo surface
        shell: bash
        run: |
          set -euo pipefail
          python tools/argument-comment-lint/run-prebuilt-linter.py \
            -- \
            --all-targets \
            --locked \
            --ignore-rust-version

      - name: Prove comment-only semantic equivalence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" -- . ":(exclude)$WORKFLOW_PATH"
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import re
          import subprocess

          base = os.environ["BASE_SHA"]
          workflow = os.environ["WORKFLOW_PATH"]
          raw = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", base, "--", ".", f":(exclude){workflow}"]
          )
          paths = [Path(item.decode("utf-8")) for item in raw.split(b"\0") if item]
          if not paths:
              raise SystemExit("argument-comment repair produced no source changes")

          argument_comment = re.compile(rb"/\*[A-Za-z_][A-Za-z0-9_]*\*/")
          whitespace = re.compile(rb"\s+")

          def normalized(data: bytes) -> bytes:
              return whitespace.sub(b"", argument_comment.sub(b"", data))

          for path in paths:
              if path.suffix != ".rs":
                  raise SystemExit(f"unexpected non-Rust repair path: {path.as_posix()}")
              before = subprocess.check_output(["git", "show", f"{base}:{path.as_posix()}"])
              after = path.read_bytes()
              if before == after:
                  raise SystemExit(f"unchanged path in repair set: {path.as_posix()}")
              if normalized(before) != normalized(after):
                  raise SystemExit(
                      f"repair changes tokens beyond identifier argument comments and whitespace: {path.as_posix()}"
                  )

          print(f"verified {len(paths)} Rust paths as comment/whitespace-only")
          PY

      - name: Build immutable repair payload
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/argument-comment-closure"
          mkdir -p "$out/files"
          git diff --binary "$BASE_SHA" -- . ":(exclude)$WORKFLOW_PATH" > "$out/argument-comment-closure.patch"
          git diff --name-status "$BASE_SHA" -- . ":(exclude)$WORKFLOW_PATH" > "$out/changed-files.txt"
          git rev-parse HEAD > "$out/workflow-head.txt"
          printf '%s\n' "$BASE_SHA" > "$out/base-sha.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import subprocess

          base = os.environ["BASE_SHA"]
          workflow = os.environ["WORKFLOW_PATH"]
          out = Path(os.environ["RUNNER_TEMP"]) / "argument-comment-closure" / "files"
          raw = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", base, "--", ".", f":(exclude){workflow}"]
          )
          for encoded in raw.split(b"\0"):
              if not encoded:
                  continue
              path = Path(encoded.decode("utf-8"))
              target = out / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
          PY
          (cd "$out" && sha256sum argument-comment-closure.patch changed-files.txt > SHA256SUMS)

      - name: Retain exact repair payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-argument-comment-closure-${{ github.sha }}
          path: ${{ runner.temp }}/argument-comment-closure
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
