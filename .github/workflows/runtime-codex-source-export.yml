name: runtime.codex exact source export

on:
  push:
    branches:
      - codex/runtime-codex-p0-ordinary-convergence-20260930
    paths:
      - .github/workflows/runtime-codex-source-export.yml
      - scripts/runtime-codex-process-crash-expansion-source.py
      - scripts/runtime-codex-process-crash-expansion-v2.py
      - scripts/runtime-codex-quarantine-authority-source.py
      - scripts/runtime-codex-quarantine-authority-v2.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-codex-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-exact-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Export immutable runtime.codex source snapshot
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
          paths="$RUNNER_TEMP/runtime-codex-source-paths.txt"
          git ls-files \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            rust-toolchain.toml \
            codex-rs/hepta-agent-protocol \
            codex-rs/hepta-agentd \
            codex-rs/hepta-infer-core \
            codex-rs/hepta-infer-worker-host \
            docs/modules/runtime.codex \
            'scripts/runtime-codex-*' \
            scripts/check-runtime-codex-fault-matrix.py \
            scripts/hepta-lane-b-truth.py \
            '.github/workflows/runtime-codex-*' \
            .github/actions/setup-ci \
            .github/actions/setup-rusty-v8 \
            qualification/runtime-codex-materialize-debug \
            | sort -u > "$paths"
          test -s "$paths"
          archive="$RUNNER_TEMP/runtime-codex-source-$EXPECTED_SHA.tar.gz"
          tar -czf "$archive" -T "$paths"
          sha256sum "$archive" > "$archive.sha256"
          cp "$paths" "$archive.paths"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Retain exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-codex-source-${{ github.sha }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
            ${{ env.archive }}.paths
          if-no-files-found: error
          retention-days: 1
