name: runtime.codex source export

on:
  push:
    branches:
      - codex/runtime-codex-production-closure-v1

permissions:
  contents: read

concurrency:
  group: runtime-codex-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export runtime.codex source workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          } > runtime-codex-export-identity.txt

      - name: Package exact source workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=runtime-codex-source.tar.gz \
            -czf runtime-codex-source.tar.gz .

      - name: Upload exact source workspace
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: runtime-codex-source-${{ github.sha }}
          path: runtime-codex-source.tar.gz
          if-no-files-found: error
          retention-days: 1
