name: Cognitive store exact remediation slim v3

on:
  push:
    branches:
      - automation/cognitive-store-exact-remediation-20260930
    paths:
      - '.github/workflows/cognitive-store-exact-remediation-slim-v3-20260930.yml'

permissions:
  contents: write

concurrency:
  group: cognitive-store-exact-remediation-slim-v3-20260930
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/cognitive-store-full-closure-20260927
  EXPECTED_SHA: a7cfdefa6643855d6a3735bf36a37cd7193a633d

jobs:
  author:
    runs-on: ubuntu-slim
    timeout-minutes: 180
    steps:
      - name: Checkout immutable authoring inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Retain reviewed script and patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/cognitive-store-exact-remediation-20260930.sh \
            /tmp/cognitive-store-exact-remediation.sh
          chmod 0700 /tmp/cognitive-store-exact-remediation.sh
          base64 --decode \
            .github/patches/cognitive-store-exact-remediation-20260930.patch.gz.b64 \
            | gzip --decompress > /tmp/cognitive-fixes.patch
          test "$(sha256sum /tmp/cognitive-fixes.patch | awk '{print $1}')" = \
            '9f4cb4c2c777a2cc2c512cd4951b001c32beba540533467f9dbddf6537b707b4'

      - name: Checkout exact target with publication credential
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Test, bind and publish exact remediation
        shell: bash
        env:
          PATCH_FILE: /tmp/cognitive-fixes.patch
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: /tmp/cognitive-store-exact-remediation.sh
