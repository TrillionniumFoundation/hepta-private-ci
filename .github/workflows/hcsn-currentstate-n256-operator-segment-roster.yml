name: hcsn-currentstate-n256-operator-segment-roster

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_operator_segment_roster/**"
      - ".github/workflows/hcsn-currentstate-n256-operator-segment-roster.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-operator-segment-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled exact roster review
        run: python3 -m unittest qualification.hcsn_currentstate_n256_operator_segment_roster.test_review -v
      - name: Optimized exact roster review
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_operator_segment_roster.test_review -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_operator_segment_roster/*.py
      - name: Verify exact frozen source and originals
        run: python3 -m qualification.hcsn_currentstate_n256_operator_segment_roster.verify_source
