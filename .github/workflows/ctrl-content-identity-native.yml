name: CTRL native content identity fixture

on:
  pull_request:
    paths:
      - scripts/ctrl_macro*.py
      - scripts/test_ctrl_macro*.py
      - .github/workflows/ctrl-content-identity-native.yml
      - scripts/ndu_real_runtime/content_identity.py
      - scripts/ndu_real_runtime/actor.py
      - scripts/ndu_real_runtime/episode.py
      - scripts/ndu_real_runtime/test_content_identity_native.py
      - scripts/ndu_real_runtime/macro*.py
      - scripts/ndu_real_runtime/test_macro*.py
      - scripts/ndu_real_runtime/metacontrol_macro_contract.py
      - scripts/ndu_real_runtime/critic_context.py
      - scripts/ndu_real_runtime/controllers.py
      - scripts/ndu_real_runtime/objective.py
      - scripts/ndu_real_runtime/neural.py
      - scripts/ndu_real_runtime/ocr.py
      - scripts/ndu_real_materials/**
      - scripts/ndu_real_runtime/metacontrol_value_gate.py
      - scripts/ndu_real_runtime/test_metacontrol_value_gate.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctrl-content-identity-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-fixture:
    name: Native OCR, delivery and scorer identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TESTED_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out the event commit without retained credentials
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind the source and tested tree outside the checkout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          out = Path(os.environ["RUNNER_TEMP"]) / "ctrl-content-identity-native"
          out.mkdir()
          tested, source = git("rev-parse", "HEAD"), os.environ["SOURCE_SHA"]
          parents = git("show", "-s", "--format=%P", "HEAD").split()
          assert tested == os.environ["TESTED_SHA"], "checkout differs from the event commit"
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              assert parents == [os.environ["BASE_SHA"], source], "unexpected PR merge parents"
          record = {"schema": "ctrl.native-fixture.identity.v1", "source_sha": source,
                    "source_tree": git("rev-parse", source + "^{tree}"),
                    "tested_sha": tested, "tested_tree": git("rev-parse", "HEAD^{tree}"),
                    "parents": parents, "event": os.environ["GITHUB_EVENT_NAME"],
                    "run_id": os.environ["GITHUB_RUN_ID"],
                    "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "scope": "fixture-only tested tree; no historical or policy qualification"}
          with (out / "identity.json").open("x") as stream:
              json.dump(record, stream, indent=2)
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install native OCR and mandatory isolation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng libseccomp2 fonts-dejavu-core

      - name: Install pinned CPU numerical dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy==2.3.5" "scipy==1.16.3" "pillow==12.0.0"
          python -m pip install --disable-pip-version-check \
            "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu

      - name: Record the actual runtime and kernel qualification
        id: runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          import ctypes.util
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import numpy
          import scipy
          import PIL
          import torch
          libc = ctypes.CDLL(None, use_errno=True)
          abi = libc.syscall(444, 0, 0, 1)
          abi_errno = ctypes.get_errno() if abi < 0 else 0
          record = {"schema": "ctrl.native-fixture.runtime.v1",
                    "system": platform.system(), "kernel": platform.release(),
                    "machine": platform.machine(), "uid": os.geteuid(),
                    "python": platform.python_version(), "numpy": numpy.__version__,
                    "scipy": scipy.__version__, "pillow": PIL.__version__,
                    "torch": torch.__version__, "cuda_build": torch.version.cuda,
                    "seccomp_library": ctypes.util.find_library("seccomp"),
                    "landlock_abi": abi, "landlock_errno": abi_errno,
                    "tesseract": subprocess.check_output(["tesseract", "--version"], text=True).splitlines()[0],
                    "qualification_scope": "native fixture integration only",
                    "policy_evaluation_performed": False}
          with (Path(os.environ["RUNNER_TEMP"]) / "ctrl-content-identity-native/runtime.json").open("x") as stream:
              json.dump(record, stream, indent=2)
          print(json.dumps(record, sort_keys=True))
          assert sys.version_info[:2] == (3, 11) and platform.system() == "Linux"
          assert os.geteuid() != 0 and record["seccomp_library"]
          assert torch.__version__ == "2.5.1+cpu" and torch.version.cuda is None
          # Both native suites must fail if Landlock is unavailable.
          # This observation grants no skip, fallback, or permission change.
          PY

      - name: Run the original native suite and require three non-skipped tests
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ctrl-content-identity-native/tests.log"
          import json
          import os
          from pathlib import Path
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("ndu_real_runtime.test_content_identity_native")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (result.wasSuccessful() and result.testsRun >= 3
                    and not result.skipped and not result.expectedFailures)
          record = {"schema": "ctrl.native-fixture.tests.v1",
                    "status": "PASSED_FIXTURE" if passed else "HOLD",
                    "executed_tests": result.testsRun, "errors": len(result.errors),
                    "failures": len(result.failures), "skipped": len(result.skipped),
                    "expected_failures": len(result.expectedFailures),
                    "historical_content_root_cause_established": False,
                    "policy_improvement_established": False}
          with (Path(os.environ["RUNNER_TEMP"]) / "ctrl-content-identity-native/tests.json").open("x") as stream:
              json.dump(record, stream, indent=2)
          print(json.dumps(record, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY

      - name: Require both new native macro methods separately with zero skips
        if: always() && steps.runtime.outcome == 'success'
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ctrl-content-identity-native/macro-tests.log"
          import json
          import os
          from pathlib import Path
          import unittest
          out = Path(os.environ["RUNNER_TEMP"]) / "ctrl-content-identity-native"
          identity = json.loads((out / "identity.json").read_text())
          name = "ndu_real_runtime.test_macro_native.NativeMacroTests"
          suite = unittest.defaultTestLoader.loadTestsFromName(name)
          required = {
              name + ".test_native_stop_and_read_reselect_deliver_and_score",
              name + ".test_training_and_exploration_overrides_are_rejected_before_launch",
          }
          discovered = {test.id() for test in suite}
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (required <= discovered and result.wasSuccessful()
                    and result.testsRun >= 2 and not result.skipped
                    and not result.expectedFailures and not result.unexpectedSuccesses)
          record = {"schema": "ctrl.native-macro.tests.v1",
                    "status": "PASSED_NATIVE_FIXTURE" if passed else "HOLD",
                    "source_sha": identity["source_sha"],
                    "tested_sha": identity["tested_sha"],
                    "tested_tree": identity["tested_tree"],
                    "suite": name, "minimum_tests": 2,
                    "required_test_ids": sorted(required),
                    "discovered_test_ids": sorted(discovered),
                    "executed_tests": result.testsRun, "errors": len(result.errors),
                    "failures": len(result.failures), "skipped": len(result.skipped),
                    "expected_failures": len(result.expectedFailures),
                    "unexpected_successes": len(result.unexpectedSuccesses),
                    "control_training_labels": "manufactured fixture only",
                    "independent_real_tasks_added": 0,
                    "policy_evaluation_performed": False,
                    "full_physical_cost_observed": False,
                    "adoption_authorized": False}
          with (out / "macro-tests.json").open("x") as stream:
              json.dump(record, stream, indent=2)
          print(json.dumps(record, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY

      - name: Require unchanged source and index
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Retain original and macro fixture runtime records and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctrl-content-identity-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctrl-content-identity-native/
          if-no-files-found: error
          retention-days: 14

  finite-value-contracts:
    name: Finite-cohort value arithmetic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: scripts:.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact source without retained credentials
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"

      - name: Bind source and runtime outside the checkout
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          out = Path(os.environ["RUNNER_TEMP"]) / "ctrl-finite-value-contracts"
          out.mkdir()
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert tested == os.environ["SOURCE_SHA"], "checkout differs from source head"
          assert platform.python_version() == "3.12.14"
          files = ["scripts/ndu_real_runtime/metacontrol_value_gate.py",
                   "scripts/ndu_real_runtime/test_metacontrol_value_gate.py"]
          record = {"schema": "ctrl.finite-value.identity.v1", "source_sha": tested,
                    "python": platform.python_version(),
                    "files_sha256": {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},
                    "scope": "finite-cohort arithmetic contracts only",
                    "real_paired_experiment_performed": False, "adoption_authorized": False}
          (out / "identity.json").write_text(json.dumps(record, indent=2))
          PY

      - name: Require at least four non-skipped value-contract tests
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ctrl-finite-value-contracts/tests.log"
          import json
          import os
          from pathlib import Path
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("ndu_real_runtime.test_metacontrol_value_gate")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (result.wasSuccessful() and result.testsRun >= 4
                    and not result.skipped and not result.expectedFailures)
          record = {"schema": "ctrl.finite-value.tests.v1",
                    "status": "PASSED_CONTRACTS" if passed else "HOLD",
                    "executed_tests": result.testsRun, "errors": len(result.errors),
                    "failures": len(result.failures), "skipped": len(result.skipped),
                    "expected_failures": len(result.expectedFailures),
                    "real_paired_experiment_performed": False,
                    "policy_improvement_established": False, "adoption_authorized": False}
          out = Path(os.environ["RUNNER_TEMP"]) / "ctrl-finite-value-contracts"
          (out / "tests.json").write_text(json.dumps(record, indent=2))
          print(json.dumps(record, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY

      - name: Require unchanged source and index
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Retain finite-value contract records on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctrl-finite-value-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctrl-finite-value-contracts/
          if-no-files-found: error
          retention-days: 14
