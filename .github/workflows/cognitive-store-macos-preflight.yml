name: Cognitive store macOS compile preflight

on:
  push:
    branches:
      - codex/cognitive-store-full-convergence-20260927

concurrency:
  group: cognitive-store-macos-preflight
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    if: ${{ !contains(github.event.head_commit.message, '[macos-diagnostic]') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Verify architecture, map and bootstrap
        run: |
          set -euo pipefail
          python3 scripts/cognitive_store_architecture.py
          python3 scripts/cognitive_store_map_verify.py \
            --expected-sha "${{ github.sha }}" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          python3 tools/cognitive-store-host-bootstrap/test_bootstrap.py
      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Check formatting
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-cognitive-store --package codex-hepta-memory --package codex-hepta-agentd -- --check
      - name: Run captured Rust preflight
        id: rust
        working-directory: codex-rs
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            echo '$ cargo test --locked -p codex-hepta-cognitive-store -p codex-hepta-memory --no-run'
            cargo test --locked -p codex-hepta-cognitive-store -p codex-hepta-memory --no-run
            echo '$ cargo test --locked -p codex-hepta-agentd --test cognitive_store_product_writer --features qualification-cognitive-write --no-run'
            cargo test --locked -p codex-hepta-agentd --test cognitive_store_product_writer --features qualification-cognitive-write --no-run
            echo '$ cargo clippy --locked -p codex-hepta-cognitive-store -p codex-hepta-memory -p codex-hepta-agentd --all-targets --features codex-hepta-agentd/qualification-cognitive-write -- -D warnings'
            cargo clippy --locked -p codex-hepta-cognitive-store -p codex-hepta-memory -p codex-hepta-agentd --all-targets --features codex-hepta-agentd/qualification-cognitive-write -- -D warnings
          ) > "$RUNNER_TEMP/cognitive-store-macos-full.txt" 2>&1
          status=$?
          set -e
          tail -n 500 "$RUNNER_TEMP/cognitive-store-macos-full.txt" \
            > "$GITHUB_WORKSPACE/cognitive-store-macos-diagnostic.txt"
          cat "$GITHUB_WORKSPACE/cognitive-store-macos-diagnostic.txt"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Retain failed compiler diagnostic
        if: steps.rust.outputs.status != '0'
        run: |
          set -euo pipefail
          git config user.name "Hepta Cognitive Store CI"
          git config user.email "hepta-cognitive-ci@users.noreply.github.com"
          git add -f cognitive-store-macos-diagnostic.txt
          git diff --cached --check
          git commit -m "ci(cognitive-store): retain macOS compiler diagnostic [macos-diagnostic]"
          git push origin HEAD:codex/cognitive-store-full-convergence-20260927
      - name: Enforce preflight success
        if: steps.rust.outputs.status != '0'
        run: exit 1
      - name: Clean successful diagnostic
        if: steps.rust.outputs.status == '0'
        run: rm -f cognitive-store-macos-diagnostic.txt
