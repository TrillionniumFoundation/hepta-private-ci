name: Cognitive store macOS compile preflight

on:
  push:
    branches:
      - codex/cognitive-store-full-convergence-20260927

concurrency:
  group: cognitive-store-macos-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Verify architecture, map and bootstrap
        run: |
          set -euo pipefail
          python3 scripts/cognitive_store_architecture.py
          python3 scripts/cognitive_store_map_verify.py \
            --expected-sha "$SOURCE_SHA" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          python3 tools/cognitive-store-host-bootstrap/test_bootstrap.py
      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Check formatting
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-cognitive-store --package codex-hepta-memory --package codex-hepta-agentd -- --check
      - name: Compile cognitive store and memory tests
        working-directory: codex-rs
        shell: bash
        run: |
          set +e
          cargo test --locked -p codex-hepta-cognitive-store -p codex-hepta-memory --no-run \
            > "$RUNNER_TEMP/cognitive-store-compile.txt" 2>&1
          status=$?
          set -e
          {
            echo '## cognitive-store + memory compile'
            echo '```text'
            tail -n 300 "$RUNNER_TEMP/cognitive-store-compile.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cognitive-store-compile.txt"
          exit "$status"
      - name: Compile Agentd cognitive product test
        working-directory: codex-rs
        shell: bash
        run: |
          set +e
          cargo test --locked -p codex-hepta-agentd --test cognitive_store_product_writer \
            --features qualification-cognitive-write --no-run \
            > "$RUNNER_TEMP/cognitive-store-agentd-compile.txt" 2>&1
          status=$?
          set -e
          {
            echo '## Agentd product compile'
            echo '```text'
            tail -n 300 "$RUNNER_TEMP/cognitive-store-agentd-compile.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cognitive-store-agentd-compile.txt"
          exit "$status"
      - name: Strict Clippy store and memory
        working-directory: codex-rs
        shell: bash
        run: |
          set +e
          cargo clippy --locked -p codex-hepta-cognitive-store -p codex-hepta-memory \
            --all-targets -- -D warnings \
            > "$RUNNER_TEMP/cognitive-store-clippy.txt" 2>&1
          status=$?
          set -e
          {
            echo '## Store and memory Clippy'
            echo '```text'
            tail -n 300 "$RUNNER_TEMP/cognitive-store-clippy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cognitive-store-clippy.txt"
          exit "$status"
      - name: Strict Clippy Agentd product profile
        working-directory: codex-rs
        shell: bash
        run: |
          set +e
          cargo clippy --locked -p codex-hepta-agentd --all-targets \
            --features qualification-cognitive-write -- -D warnings \
            > "$RUNNER_TEMP/cognitive-store-agentd-clippy.txt" 2>&1
          status=$?
          set -e
          {
            echo '## Agentd product Clippy'
            echo '```text'
            tail -n 300 "$RUNNER_TEMP/cognitive-store-agentd-clippy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cognitive-store-agentd-clippy.txt"
          exit "$status"
