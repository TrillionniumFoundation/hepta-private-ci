name: Inference worker experimental local-model qualification

on:
  pull_request:
    paths:
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - docs/modules/inference.worker/**
      - scripts/hepta-inference-worker-status.py
      - .github/workflows/inference-worker-local-model-experimental.yml
      - .github/actions/hepta-synthetic-merge/action.yml
  push:
    branches:
      - main
    paths:
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - docs/modules/inference.worker/**
      - scripts/hepta-inference-worker-status.py
      - .github/workflows/inference-worker-local-model-experimental.yml
      - .github/actions/hepta-synthetic-merge/action.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-worker-local-experimental-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  experimental-local-model:
    name: ${{ matrix.lane }} / ${{ matrix.os }} / experimental local model
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      RUST_BACKTRACE: "1"
      CARGO_BUILD_JOBS: "2"
      TMPDIR: /tmp
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Construct deterministic synthetic merge
        if: matrix.lane == 'merge-candidate'
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta inference worker CI
          author-email: hepta-inference-worker-ci@users.noreply.github.com
          message: Synthetic experimental local-model merge

      - name: Bind exact candidate
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          expected="$SOURCE_SHA"
          if [ "$LANE" = merge-candidate ]; then
            test -n "$MERGE_SHA"
            expected="$MERGE_SHA"
            expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check

      - name: Verify workspace manifest graph
        run: python3 scripts/hepta_workspace.py

      - name: Install focused test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Run sealed local-model tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          rm -f junit.xml nextest-output.log
          set +e
          cargo nextest run --locked \
            -p codex-hepta-infer-worker-host \
            --lib \
            --features experimental-local-model \
            --no-fail-fast \
            --test-threads=1 2>&1 | tee nextest-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ -e junit.xml ]; then test -s junit.xml; fi
          exit "$status"

      - name: Upload experimental test receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-${{ matrix.lane }}-${{ matrix.os }}-experimental-local-model
          path: |
            codex-rs/nextest-output.log
            codex-rs/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Require unchanged exact candidate
        if: always()
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          expected="$SOURCE_SHA"
          if [ "$LANE" = merge-candidate ]; then expected="$MERGE_SHA"; fi
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  result:
    name: Experimental local-model qualification result
    if: ${{ always() }}
    needs: [experimental-local-model]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require every applicable lane
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_NEEDS: '["experimental-local-model"]'
        run: python3 .github/scripts/check_ci_results.py
