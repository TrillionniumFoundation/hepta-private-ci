name: Windows app-server quiet-source regressions

on:
  push:
    branches: ["codex/windows-appserver-quiet-observer-20261109-898e"]

permissions:
  contents: read

concurrency:
  group: hepta-windows-appserver-quiet-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 5eee964cd06e9005c607c70ea3787ecdd5f0bded
  TESTED_SHA: 5eee964cd06e9005c607c70ea3787ecdd5f0bded
  SOURCE_TREE: 8ca1ad7178861225b02c28330a59a806a1cd3319
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  appserver-owner:
    runs-on: windows-latest
    # Preserve the original job ceiling. Strict preparation consumes this budget.
    timeout-minutes: 65
    steps:
      - name: Preserve original Windows source bytes before checkout
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Checkout the independent observer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: observer
          persist-credentials: false
      - name: Checkout the exact quiet source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Install the original native compiler
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Install the original test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Install the existing V8 artifact resolver
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Check existing receipt guards and strict-preparation failure controls
        shell: pwsh
        run: |
          python -m unittest discover -s observer/.github/scripts -p test_windows_fixture_followup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s observer/.github/scripts -p test_windows_image_edit_diagnostic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s observer/.github/scripts -p test_windows_appserver_quiet.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the strict owner and execute the exact five cases
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "hepta-windows-appserver-quiet-target"
          python observer/.github/scripts/windows_fixture_followup.py --source-root "$env:GITHUB_WORKSPACE/source" --expected-head "$env:SOURCE_SHA" --expected-tree "$env:SOURCE_TREE" --expected-observer-head "${{ github.sha }}" --output "$env:RUNNER_TEMP/hepta-windows-appserver-quiet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve every original output and source binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-appserver-quiet-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-windows-appserver-quiet/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
