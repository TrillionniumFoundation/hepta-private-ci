name: Hepta inference branch sync

on:
  push:
    branches:
      - codex/inference-control-v2-closure-20260927
    paths:
      - 'scripts/hepta-inference-control-ownership.py'
      - 'scripts/hepta-inference-control-current-state.py'
      - 'docs/modules/inference.control/CURRENT_STATE_SOURCE.json'
      - '.github/workflows/hepta-inference-branch-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-inference-branch-sync
  cancel-in-progress: true

jobs:
  synchronize:
    name: Synchronize inference.control projections
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/inference-control-v2-closure-20260927
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: '1.92.0'
          components: rustfmt

      - name: Synchronize machine-generated projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-control-ownership.py sync
          python3 scripts/hepta-inference-control-current-state.py sync
          cargo fmt --manifest-path codex-rs/Cargo.toml --all

      - name: Commit exact generated result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No synchronization changes were required.'
            exit 0
          fi
          git config user.name 'hepta-inference-sync[bot]'
          git config user.email 'hepta-inference-sync@users.noreply.github.com'
          git add \
            docs/modules/MODULES.json \
            qualification/CARGO_BINDINGS.json \
            qualification/SOURCE_BINDINGS.json \
            qualification/GITHUB_OWNERSHIP.json \
            delivery/ownership/PATH_OWNERSHIP.json \
            delivery/ownership/SOURCE_BINDINGS.json \
            docs/modules/inference.control/CURRENT_STATE.json \
            docs/modules/inference.control/IMPLEMENTATION_MAP.json \
            docs/modules/inference.control/TECHNICAL_STATUS.generated.md \
            qualification/module-execution-dossiers/detail/inference.control.current-state.md \
            codex-rs
          git commit -m 'inference.control: synchronize generated ownership and formatting'
          git push origin HEAD:codex/inference-control-v2-closure-20260927
