name: Hepta shared Stem actual execution (research only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/shared_stem_cell/**"
      - "experiments/shared_stem_head_matrix/**"
      - ".github/workflows/hepta-shared-stem-execution.yml"

permissions:
  contents: read

concurrency:
  group: shared-stem-execution-${{ github.event.pull_request.number || github.ref }}
  # Preserve started expensive model acquisition/inference; keep one running and one pending.
  cancel-in-progress: false

jobs:
  mechanics-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolated runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/hepta-execution-env"
          "$RUNNER_TEMP/hepta-execution-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          "$RUNNER_TEMP/hepta-execution-env/bin/pip" install numpy==2.2.6 safetensors==0.7.0 packaging==25.0 psutil==7.1.0 playwright==1.57.0 ruff==0.14.0 pillow==12.3.0 scikit-learn==1.8.0
          "$RUNNER_TEMP/hepta-execution-env/bin/python" -c "import safetensors.torch; import packaging.version"
          "$RUNNER_TEMP/hepta-execution-env/bin/python" -m playwright install --with-deps chromium
      - name: Actual tests and browser comparison
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-execution-env/bin/python"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-execution-source.txt"
          "$PY" -m pip freeze >> "$RUNNER_TEMP/hepta-execution-source.txt"
          "$PY" -m ruff check --select F,E9 experiments/shared_stem_cell/{execution,controls,wire,browser_loop,browser_recovery,checkpoint_conversion,public_smoke,public_media,control_evaluation,media_execution,hf_integration_checks,test_execution,test_browser,test_browser_recovery,test_checkpoint_conversion,test_media_execution,test_public_media,head_artifacts,test_head_artifacts,test_modality_probe,test_generation_contract,head_batch,head_batch_study,test_head_batch,head_training,head_training_study,test_head_training,split_learning,split_study,test_split_learning,stopping,stopping_study,test_stopping,test_materialization,calibrated_fusion,test_calibrated_fusion,choice_fusion,test_choice_fusion,feature_replay,test_feature_replay,consolidation,consolidation_study,consolidation_digits,test_consolidation,partial_consolidation,test_partial_consolidation,residual_consolidation,ridge_consolidation,test_residual_consolidation,test_ridge_consolidation,paired_frontier,test_paired_frontier,media_counterfactual,test_media_counterfactual,consolidation_group_guard,test_consolidation_group_guard,process_peak,test_process_peak,final_selection_gate,test_final_selection_gate,preflight_review,test_preflight_review,physical_head_replay,test_physical_head_replay,public_encoder_pair,public_encoder_pair_review,test_public_encoder_pair,e2_budget_sweep,e2_budget_review,e2_budget_integrity,test_e2_budget}.py
          "$PY" -m unittest -v experiments.shared_stem_cell.test_execution experiments.shared_stem_cell.test_browser experiments.shared_stem_head_matrix.tests.test_runner experiments.shared_stem_cell.test_checkpoint_conversion experiments.shared_stem_cell.test_media_execution experiments.shared_stem_cell.test_browser_recovery experiments.shared_stem_cell.test_public_media experiments.shared_stem_cell.test_head_artifacts experiments.shared_stem_cell.test_modality_probe experiments.shared_stem_cell.test_generation_contract experiments.shared_stem_cell.test_head_batch experiments.shared_stem_cell.test_head_training experiments.shared_stem_cell.test_split_learning experiments.shared_stem_cell.test_stopping experiments.shared_stem_cell.test_materialization experiments.shared_stem_cell.test_calibrated_fusion experiments.shared_stem_cell.test_choice_fusion experiments.shared_stem_cell.test_feature_replay experiments.shared_stem_cell.test_consolidation experiments.shared_stem_cell.test_partial_consolidation experiments.shared_stem_cell.test_residual_consolidation experiments.shared_stem_cell.test_ridge_consolidation experiments.shared_stem_cell.test_paired_frontier experiments.shared_stem_cell.test_media_counterfactual experiments.shared_stem_cell.test_consolidation_group_guard experiments.shared_stem_cell.test_process_peak experiments.shared_stem_cell.test_final_selection_gate experiments.shared_stem_cell.test_preflight_review experiments.shared_stem_cell.test_physical_head_replay experiments.shared_stem_cell.test_public_encoder_pair experiments.shared_stem_cell.test_e2_budget 2>&1 | tee "$RUNNER_TEMP/hepta-execution-tests.txt"
          "$PY" -m experiments.shared_stem_cell.browser_loop --output "$RUNNER_TEMP/hepta-browser-study" --tasks 24
          "$PY" -m experiments.shared_stem_cell.browser_recovery --output "$RUNNER_TEMP/hepta-controller-recovery"
          "$PY" -m experiments.shared_stem_cell.head_batch_study --synthetic --output "$RUNNER_TEMP/hepta-head-batch-study"
          "$PY" -m experiments.shared_stem_cell.head_training_study --cells 8 --output "$RUNNER_TEMP/hepta-learning-digits-8"
          "$PY" -m experiments.shared_stem_cell.head_training_study --cells 32 --output "$RUNNER_TEMP/hepta-learning-digits-32"
          "$PY" -m experiments.shared_stem_cell.split_study --output "$RUNNER_TEMP/hepta-split-digits"
          "$PY" -m experiments.shared_stem_cell.stopping_study --output "$RUNNER_TEMP/hepta-stopping-digits"
          "$PY" -m experiments.shared_stem_cell.consolidation_digits --partial --residual --ridge --output "$RUNNER_TEMP/hepta-consolidation-digits"
          git diff --exit-code
      - name: Retain actual results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-execution-source.txt
            ${{ runner.temp }}/hepta-execution-tests.txt
            ${{ runner.temp }}/hepta-browser-study
            ${{ runner.temp }}/hepta-controller-recovery
            ${{ runner.temp }}/hepta-head-batch-study
            ${{ runner.temp }}/hepta-learning-digits-8
            ${{ runner.temp }}/hepta-learning-digits-32
            ${{ runner.temp }}/hepta-split-digits
            ${{ runner.temp }}/hepta-stopping-digits
            ${{ runner.temp }}/hepta-consolidation-digits
  public-pretrained-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolated pretrained runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/hepta-pretrained-env"
          "$RUNNER_TEMP/hepta-pretrained-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          "$RUNNER_TEMP/hepta-pretrained-env/bin/pip" install transformers==4.57.1 datasets==4.2.0 numpy==2.2.6 safetensors==0.7.0 packaging==25.0 psutil==7.1.0 sentencepiece==0.2.1 pillow==12.3.0
          "$RUNNER_TEMP/hepta-pretrained-env/bin/python" -c "import safetensors.torch; import packaging.version"
      - name: Real public weights and public records, not future evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          USE_TF: "0"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-pretrained-env/bin/python"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-pretrained-source.txt"
          "$PY" -m pip freeze >> "$RUNNER_TEMP/hepta-pretrained-source.txt"
          "$PY" -m unittest -v experiments.shared_stem_cell.hf_integration_checks 2>&1 | tee "$RUNNER_TEMP/hepta-hf-api-tests.txt"
          "$PY" -m experiments.shared_stem_cell.public_smoke --allow-weights-only-conversion --output "$RUNNER_TEMP/hepta-public-study" 2>&1 | tee "$RUNNER_TEMP/hepta-public-log.txt"
          # Recheck all publicly sealed physical Head predictions against original dataset labels.
          # This read-only check does not manufacture future NDU, no-change or native-host receipts.
          REPORT_SHA=$(sha256sum "$RUNNER_TEMP/hepta-public-study/execution/report.json" | cut -d' ' -f1)
          "$PY" -m experiments.shared_stem_cell.preflight_review \
            --manifest "$RUNNER_TEMP/hepta-public-study/manifest.json" \
            --producer "$RUNNER_TEMP/hepta-public-study/execution" \
            --report-sha256 "$REPORT_SHA" \
            --output "$RUNNER_TEMP/hepta-public-preflight.json"
          "$PY" -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["ready_for_e1_e6_selection"] is False and r["production_accepted"] is False and r["held_out_cases"] == 32' "$RUNNER_TEMP/hepta-public-preflight.json"
          # Independent NumPy equations: load actual frozen features and 16 saved
          # learned/frozen Head safetensors, then reproduce all 256 probability rows.
          "$PY" -m experiments.shared_stem_cell.physical_head_replay \
            --manifest "$RUNNER_TEMP/hepta-public-study/manifest.json" \
            --producer "$RUNNER_TEMP/hepta-public-study/execution" \
            --report-sha256 "$REPORT_SHA" \
            --output "$RUNNER_TEMP/hepta-physical-head-replay.json"
          "$PY" -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["checked_prediction_vectors"] == 256 and r["physical_head_checkpoint_count"] == 16 and r["max_prediction_probability_abs_error"] < 2e-5 and r["production_accepted"] is False' "$RUNNER_TEMP/hepta-physical-head-replay.json"
          # E2: the exact same physical frozen 384d features are reused.
          # No second Encoder forward, no holdout labels to the Head optimizer.
          "$PY" -m experiments.shared_stem_cell.e2_budget_sweep \
            --manifest "$RUNNER_TEMP/hepta-public-study/manifest.json" \
            --producer "$RUNNER_TEMP/hepta-public-study/execution" \
            --report-sha256 "$REPORT_SHA" \
            --output "$RUNNER_TEMP/hepta-e2-physical-budget"
          "$PY" -m experiments.shared_stem_cell.e2_budget_review \
            --manifest "$RUNNER_TEMP/hepta-public-study/manifest.json" \
            --producer "$RUNNER_TEMP/hepta-public-study/execution" \
            --report-sha256 "$REPORT_SHA" \
            --sweep "$RUNNER_TEMP/hepta-e2-physical-budget" \
            --output "$RUNNER_TEMP/hepta-e2-budget-review.json"
          "$PY" -m experiments.shared_stem_cell.e2_budget_integrity \
            --manifest "$RUNNER_TEMP/hepta-public-study/manifest.json" \
            --producer "$RUNNER_TEMP/hepta-public-study/execution" \
            --report-sha256 "$REPORT_SHA" \
            --sweep "$RUNNER_TEMP/hepta-e2-physical-budget" \
            --output "$RUNNER_TEMP/hepta-e2-integrity.json"
          "$PY" -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["physical_head_checkpoint_count"] == 60 and r["independently_replayed_prediction_vectors"] == 1920 and r["future_ndu_evaluated"] is False and r["production_accepted"] is False' "$RUNNER_TEMP/hepta-e2-budget-review.json"
          # E1: execute a second real, immutable public Encoder in a new Python
          # process over the exact original mmBERT cohort and training contract.
          # Never fabricate a prospective window, no-change or independent NDU.
          "$PY" -m experiments.shared_stem_cell.public_encoder_pair \
            --baseline "$RUNNER_TEMP/hepta-public-study" \
            --output "$RUNNER_TEMP/hepta-modernbert-pair" 2>&1 \
            | tee "$RUNNER_TEMP/hepta-modernbert-log.txt"
          "$PY" -m experiments.shared_stem_cell.public_encoder_pair_review \
            --baseline "$RUNNER_TEMP/hepta-public-study" \
            --candidate "$RUNNER_TEMP/hepta-modernbert-pair" \
            --output "$RUNNER_TEMP/hepta-public-encoder-pair-review.json" 2>&1 \
            | tee "$RUNNER_TEMP/hepta-paired-review-log.txt"
          "$PY" -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["paired_holdout_cases"] == 32 and r["same_budget_cap_per_cell"] == 16384 and len(r["trained_heads"]) == 4 and r["saved_weights_replay_verified"] is True and r["four_encoder_e1_completed"] is False and r["future_ndu_utility_evaluated"] is False and r["production_accepted"] is False' "$RUNNER_TEMP/hepta-public-encoder-pair-review.json"
          # Replay input intentionally omits model weights, tokenizer and Head artifacts.
          mkdir -p "$RUNNER_TEMP/hepta-replay-input/producer"
          cp "$RUNNER_TEMP/hepta-public-study/manifest.json" "$RUNNER_TEMP/hepta-public-study/dataset.jsonl" "$RUNNER_TEMP/hepta-replay-input/"
          cp "$RUNNER_TEMP/hepta-public-study/execution/"{report,predictions}.json "$RUNNER_TEMP/hepta-replay-input/producer/"
          cp -r "$RUNNER_TEMP/hepta-public-study/execution/frozen-features" "$RUNNER_TEMP/hepta-replay-input/producer/"
          REPORT_SHA=$(sha256sum "$RUNNER_TEMP/hepta-replay-input/producer/report.json" | cut -d' ' -f1)
          for BACKEND in scalar grouped; do
            "$PY" -m experiments.shared_stem_cell.feature_replay --manifest "$RUNNER_TEMP/hepta-replay-input/manifest.json" --producer "$RUNNER_TEMP/hepta-replay-input/producer" --report-sha256 "$REPORT_SHA" --backend "$BACKEND" --output "$RUNNER_TEMP/hepta-replay-$BACKEND" 2>&1 | tee "$RUNNER_TEMP/hepta-replay-$BACKEND.log"
          done
          # Bound Cell teachers are copied, but NOT Encoder or tokenizer weights.
          cp -r "$RUNNER_TEMP/hepta-replay-input" "$RUNNER_TEMP/hepta-consolidation-input"
          mkdir -p "$RUNNER_TEMP/hepta-consolidation-input/producer/heads"
          cp -r "$RUNNER_TEMP/hepta-public-study/execution/heads/gated" "$RUNNER_TEMP/hepta-consolidation-input/producer/heads/"
          "$PY" -m experiments.shared_stem_cell.consolidation_study --partial --residual --ridge --manifest "$RUNNER_TEMP/hepta-consolidation-input/manifest.json" --producer "$RUNNER_TEMP/hepta-consolidation-input/producer" --report-sha256 "$REPORT_SHA" --output "$RUNNER_TEMP/hepta-consolidation" 2>&1 | tee "$RUNNER_TEMP/hepta-consolidation.log"
          git diff --exit-code
      - name: Retain manifests, predictions, counters and failures (no weight upload)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-public-pretrained-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-pretrained-source.txt
            ${{ runner.temp }}/hepta-public-log.txt
            ${{ runner.temp }}/hepta-public-preflight.json
            ${{ runner.temp }}/hepta-physical-head-replay.json
            ${{ runner.temp }}/hepta-e2-physical-budget
            ${{ runner.temp }}/hepta-e2-budget-review.json
            ${{ runner.temp }}/hepta-e2-integrity.json
            ${{ runner.temp }}/hepta-modernbert-log.txt
            ${{ runner.temp }}/hepta-paired-review-log.txt
            ${{ runner.temp }}/hepta-public-encoder-pair-review.json
            ${{ runner.temp }}/hepta-modernbert-pair/model-source.json
            ${{ runner.temp }}/hepta-modernbert-pair/verified-publisher-files.json
            ${{ runner.temp }}/hepta-modernbert-pair/manifest.json
            ${{ runner.temp }}/hepta-modernbert-pair/dataset.jsonl
            ${{ runner.temp }}/hepta-modernbert-pair/pair-member.json
            ${{ runner.temp }}/hepta-modernbert-pair/execution
            ${{ runner.temp }}/hepta-hf-api-tests.txt
            ${{ runner.temp }}/hepta-public-study/model-source.json
            ${{ runner.temp }}/hepta-public-study/verified-publisher-files.json
            ${{ runner.temp }}/hepta-public-study/conversion/conversion.json
            ${{ runner.temp }}/hepta-public-study/conversion/worker.log
            ${{ runner.temp }}/hepta-public-study/conversion/failure.json
            ${{ runner.temp }}/hepta-public-study/acquisition.json
            ${{ runner.temp }}/hepta-public-study/manifest.json
            ${{ runner.temp }}/hepta-public-study/dataset.jsonl
            ${{ runner.temp }}/hepta-public-study/execution
            ${{ runner.temp }}/hepta-replay-input
            ${{ runner.temp }}/hepta-replay-scalar
            ${{ runner.temp }}/hepta-replay-grouped
            ${{ runner.temp }}/hepta-replay-scalar.log
            ${{ runner.temp }}/hepta-replay-grouped.log
            ${{ runner.temp }}/hepta-consolidation-input
            ${{ runner.temp }}/hepta-consolidation
            ${{ runner.temp }}/hepta-consolidation.log

  public-image-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolated image and text execution runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/hepta-media-env"
          "$RUNNER_TEMP/hepta-media-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          "$RUNNER_TEMP/hepta-media-env/bin/pip" install transformers==4.57.1 datasets==4.2.0 numpy==2.2.6 safetensors==0.7.0 packaging==25.0 psutil==7.1.0 sentencepiece==0.2.1 pillow==12.3.0
          "$RUNNER_TEMP/hepta-media-env/bin/python" -c "import safetensors.torch; import packaging.version"
      - name: Actual public ScienceQA, CLIP connectors and text-only Qwen control
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          USE_TF: "0"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-media-env/bin/python"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-media-source.txt"
          "$PY" -m pip freeze >> "$RUNNER_TEMP/hepta-media-source.txt"
          "$PY" -m unittest -v experiments.shared_stem_cell.hf_integration_checks experiments.shared_stem_cell.test_public_media experiments.shared_stem_cell.test_head_artifacts experiments.shared_stem_cell.test_modality_probe experiments.shared_stem_cell.test_generation_contract experiments.shared_stem_cell.test_head_batch 2>&1 | tee "$RUNNER_TEMP/hepta-media-tests.txt"
          "$PY" -m experiments.shared_stem_cell.public_media --allow-weights-only-conversion --output "$RUNNER_TEMP/hepta-public-media" 2>&1 | tee "$RUNNER_TEMP/hepta-media-log.txt"
          "$PY" -m unittest -v experiments.shared_stem_cell.test_calibrated_fusion experiments.shared_stem_cell.test_choice_fusion experiments.shared_stem_cell.test_feature_replay experiments.shared_stem_cell.test_consolidation experiments.shared_stem_cell.test_partial_consolidation experiments.shared_stem_cell.test_residual_consolidation experiments.shared_stem_cell.test_ridge_consolidation 2>&1 | tee "$RUNNER_TEMP/hepta-calibrated-tests.txt"
          "$PY" -m experiments.shared_stem_cell.public_media --calibrated-fusion --allow-weights-only-conversion --output "$RUNNER_TEMP/hepta-calibrated-media" 2>&1 | tee "$RUNNER_TEMP/hepta-calibrated-log.txt"
          "$PY" -m experiments.shared_stem_cell.public_media --candidate-shared --allow-weights-only-conversion --output "$RUNNER_TEMP/hepta-choice-media" 2>&1 | tee "$RUNNER_TEMP/hepta-choice-log.txt"
          git diff --exit-code
      - name: Preserve original predictions and failures, never upload model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-public-media-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-media-source.txt
            ${{ runner.temp }}/hepta-media-tests.txt
            ${{ runner.temp }}/hepta-media-log.txt
            ${{ runner.temp }}/hepta-public-media/acquisition.json
            ${{ runner.temp }}/hepta-public-media/dataset-source.json
            ${{ runner.temp }}/hepta-public-media/dataset-publisher-verified.json
            ${{ runner.temp }}/hepta-public-media/cohort-before-labels.json
            ${{ runner.temp }}/hepta-public-media/dataset.jsonl
            ${{ runner.temp }}/hepta-public-media/manifest.json
            ${{ runner.temp }}/hepta-public-media/report.json
            ${{ runner.temp }}/hepta-public-media/failure.json
            ${{ runner.temp }}/hepta-public-media/vision/model-source.json
            ${{ runner.temp }}/hepta-public-media/vision/verified-publisher-files.json
            ${{ runner.temp }}/hepta-public-media/vision/conversion/*.json
            ${{ runner.temp }}/hepta-public-media/vision/conversion/*.log
            ${{ runner.temp }}/hepta-public-media/reader/model-source.json
            ${{ runner.temp }}/hepta-public-media/reader/verified-publisher-files.json
            ${{ runner.temp }}/hepta-public-media/media-execution
            ${{ runner.temp }}/hepta-public-media/text-execution
            ${{ runner.temp }}/hepta-calibrated-tests.txt
            ${{ runner.temp }}/hepta-calibrated-log.txt
            ${{ runner.temp }}/hepta-calibrated-media/acquisition.json
            ${{ runner.temp }}/hepta-calibrated-media/excluded-prior-cohort.json
            ${{ runner.temp }}/hepta-calibrated-media/cohort-before-labels.json
            ${{ runner.temp }}/hepta-calibrated-media/dataset-source.json
            ${{ runner.temp }}/hepta-calibrated-media/dataset-publisher-verified.json
            ${{ runner.temp }}/hepta-calibrated-media/dataset.jsonl
            ${{ runner.temp }}/hepta-calibrated-media/manifest.json
            ${{ runner.temp }}/hepta-calibrated-media/report.json
            ${{ runner.temp }}/hepta-calibrated-media/failure.json
            ${{ runner.temp }}/hepta-calibrated-media/vision/model-source.json
            ${{ runner.temp }}/hepta-calibrated-media/vision/verified-publisher-files.json
            ${{ runner.temp }}/hepta-calibrated-media/vision/conversion/*.json
