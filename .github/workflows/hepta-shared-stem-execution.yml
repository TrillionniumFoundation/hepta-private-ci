            ${{ runner.temp }}/hepta-choice-media/vision/conversion/*.log
            ${{ runner.temp }}/hepta-choice-media/choice-execution

  historical-postseal-replay:
    # Re-audit already completed 2026-10-14 source evidence. This is NOT new
    # inference, independent labels, a current-head model result or a selection.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Exact audit source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Replay the pinned historical negative decision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-historical-audit-source.txt"
          echo "Original model generating HEAD: b43cefc80e1855db7581b58ab527af44d15c0d50" >> "$RUNNER_TEMP/hepta-historical-audit-source.txt"
          echo "Original completed Actions run: 38514532798; artifact: 11872205556" >> "$RUNNER_TEMP/hepta-historical-audit-source.txt"
          ORIGINAL_SHA=05b6ec4b33a7563ea368f7d5be212ad1dbf1220bbccb9195ac900ac5adde34a6
          ZIP="$RUNNER_TEMP/hepta-original-pretrained.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11872205556/zip" > "$ZIP"
          printf '%s  %s\n' "$ORIGINAL_SHA" "$ZIP" | sha256sum -c -
          python3 -m unittest -v experiments.shared_stem_cell.test_postseal_historical_audit 2>&1 | tee "$RUNNER_TEMP/hepta-historical-audit-tests.log"
          python3 -m experiments.shared_stem_cell.postseal_historical_audit \
            --root "$ZIP" --zip-sha256 "$ORIGINAL_SHA" \
            --output "$RUNNER_TEMP/hepta-historical-replay.json" 2>&1 | tee "$RUNNER_TEMP/hepta-historical-replay.log"
          python3 -m experiments.shared_stem_cell.postseal_sparse_portfolio_probe \
            --root "$ZIP" --zip-sha256 "$ORIGINAL_SHA" \
            --output "$RUNNER_TEMP/hepta-retrospective-portfolio" 2>&1 | tee "$RUNNER_TEMP/hepta-retrospective-portfolio.log"
      - name: Retain negative audit, never republish original case data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-historical-postseal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-historical-audit-source.txt
            ${{ runner.temp }}/hepta-historical-audit-tests.log
            ${{ runner.temp }}/hepta-historical-replay.log
            ${{ runner.temp }}/hepta-historical-replay.json
            ${{ runner.temp }}/hepta-retrospective-portfolio.log
            ${{ runner.temp }}/hepta-retrospective-portfolio
          if-no-files-found: warn

  historical-physical-head:
    # Actually invoke sealed trained Heads on original frozen features.
    # This does NOT measure the Encoder or qualify new model results.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Exact research source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install exact isolated CPU Head runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hepta-physical-env"
          "$RUNNER_TEMP/hepta-physical-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          "$RUNNER_TEMP/hepta-physical-env/bin/pip" install safetensors==0.7.0 packaging==25.0 ruff==0.14.0
      - name: Verify original archive and execute physical Head control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-physical-env/bin/python"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-physical-source.txt"
          "$PY" -m pip freeze >> "$RUNNER_TEMP/hepta-physical-source.txt"
          ORIGINAL_SHA=05b6ec4b33a7563ea368f7d5be212ad1dbf1220bbccb9195ac900ac5adde34a6
          ZIP="$RUNNER_TEMP/hepta-original-pretrained.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11872205556/zip" > "$ZIP"
          printf '%s  %s\n' "$ORIGINAL_SHA" "$ZIP" | sha256sum -c -
          "$PY" -m ruff check --select F,E9 experiments/shared_stem_cell/pretrained_head_portfolio_benchmark.py experiments/shared_stem_cell/test_pretrained_head_portfolio_benchmark.py experiments/shared_stem_cell/selective_residual_governed.py experiments/shared_stem_cell/test_selective_residual_governed.py
          "$PY" -m unittest -v experiments.shared_stem_cell.test_pretrained_head_portfolio_benchmark experiments.shared_stem_cell.test_selective_residual_governed 2>&1 | tee "$RUNNER_TEMP/hepta-physical-tests.log"
          "$PY" -m experiments.shared_stem_cell.pretrained_head_portfolio_benchmark \
            --archive "$ZIP" --sha256 "$ORIGINAL_SHA" \
            --output "$RUNNER_TEMP/hepta-physical-work" 2>&1 | tee "$RUNNER_TEMP/hepta-physical-work.log"
          "$PY" -m experiments.shared_stem_cell.selective_residual_governed \
            --archive "$ZIP" --output "$RUNNER_TEMP/hepta-selective-training" 2>&1 | tee "$RUNNER_TEMP/hepta-selective-training.log"
          "$PY" -c 'import json,sys;from pathlib import Path;p=Path(sys.argv[1]);s=json.loads((p/"selection.json").read_text());r=json.loads((p/"result.json").read_text());assert s["selected_per_cell"]=={"0":"shared","1":"bank"};assert s["attempted_training_cells"]==[1];assert s["candidate_parameters"]==12416 and not s["strict_parameter_saving"];assert r["total_heldout_correct"]=={"bank":22,"shared":23,"corrected":25,"selected":26};assert r["production_accepted"] is False' "$RUNNER_TEMP/hepta-selective-training"
          git diff --exit-code
      - name: Preserve physical observations without republishing source model files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-historical-head-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-physical-source.txt
            ${{ runner.temp }}/hepta-physical-tests.log
            ${{ runner.temp }}/hepta-physical-work.log
            ${{ runner.temp }}/hepta-physical-work/result.json
            ${{ runner.temp }}/hepta-selective-training.log
            ${{ runner.temp }}/hepta-selective-training
          if-no-files-found: warn
