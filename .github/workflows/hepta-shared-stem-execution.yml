            ${{ runner.temp }}/hepta-public-media/text-execution
            ${{ runner.temp }}/hepta-calibrated-tests.txt
            ${{ runner.temp }}/hepta-calibrated-log.txt
            ${{ runner.temp }}/hepta-calibrated-media/acquisition.json
            ${{ runner.temp }}/hepta-calibrated-media/excluded-prior-cohort.json
            ${{ runner.temp }}/hepta-calibrated-media/cohort-before-labels.json
            ${{ runner.temp }}/hepta-calibrated-media/dataset-source.json
            ${{ runner.temp }}/hepta-calibrated-media/dataset-publisher-verified.json
            ${{ runner.temp }}/hepta-calibrated-media/dataset.jsonl
            ${{ runner.temp }}/hepta-calibrated-media/manifest.json
            ${{ runner.temp }}/hepta-calibrated-media/report.json
            ${{ runner.temp }}/hepta-calibrated-media/failure.json
            ${{ runner.temp }}/hepta-calibrated-media/vision/model-source.json
