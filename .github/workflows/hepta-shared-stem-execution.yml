name: Hepta shared Stem actual execution (research only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/shared_stem_cell/**"
      - "experiments/shared_stem_head_matrix/**"
      - ".github/workflows/hepta-shared-stem-execution.yml"

permissions:
  contents: read

concurrency:
  group: shared-stem-execution-${{ github.event.pull_request.number || github.ref }}
  # Preserve started expensive model acquisition/inference; keep one running and one pending.
  cancel-in-progress: false

jobs:
  mechanics-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolated runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/hepta-execution-env"
          "$RUNNER_TEMP/hepta-execution-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          "$RUNNER_TEMP/hepta-execution-env/bin/pip" install numpy==2.2.6 safetensors==0.7.0 packaging==25.0 psutil==7.1.0 playwright==1.57.0 ruff==0.14.0 pillow==12.3.0 scikit-learn==1.8.0
          "$RUNNER_TEMP/hepta-execution-env/bin/python" -c "import safetensors.torch; import packaging.version"
          "$RUNNER_TEMP/hepta-execution-env/bin/python" -m playwright install --with-deps chromium
      - name: Actual tests and browser comparison
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-execution-env/bin/python"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-execution-source.txt"
          "$PY" -m pip freeze >> "$RUNNER_TEMP/hepta-execution-source.txt"
          "$PY" -m ruff check --select F,E9 experiments/shared_stem_cell/{execution,controls,wire,browser_loop,browser_recovery,checkpoint_conversion,public_smoke,public_media,control_evaluation,media_execution,hf_integration_checks,test_execution,test_browser,test_browser_recovery,test_checkpoint_conversion,test_media_execution,test_public_media,head_artifacts,test_head_artifacts,test_modality_probe,test_generation_contract,head_batch,head_batch_study,test_head_batch,head_training,head_training_study,test_head_training,split_learning,split_study,test_split_learning,stopping,stopping_study,test_stopping,test_materialization,calibrated_fusion,test_calibrated_fusion,choice_fusion,test_choice_fusion,feature_replay,test_feature_replay,consolidation,consolidation_study,consolidation_digits,test_consolidation,partial_consolidation,test_partial_consolidation,residual_consolidation,ridge_consolidation,test_residual_consolidation,test_ridge_consolidation,retention_confirmation,fresh_confirmation,test_confirmation,postseal_historical_audit,test_postseal_historical_audit,postseal_sparse_portfolio_probe,test_postseal_sparse_portfolio_probe,selective_residual_governed,test_selective_residual_governed,sequential_evidence,sequential_confirmation,sequential_replay,sequential_work_audit,test_sequential_confirmation,test_sequential_replay,test_sequential_work_audit,external_bbc_shift,test_external_bbc_shift}.py
          "$PY" -m unittest -v experiments.shared_stem_cell.test_execution experiments.shared_stem_cell.test_browser experiments.shared_stem_head_matrix.tests.test_runner experiments.shared_stem_cell.test_checkpoint_conversion experiments.shared_stem_cell.test_media_execution experiments.shared_stem_cell.test_browser_recovery experiments.shared_stem_cell.test_public_media experiments.shared_stem_cell.test_head_artifacts experiments.shared_stem_cell.test_modality_probe experiments.shared_stem_cell.test_generation_contract experiments.shared_stem_cell.test_head_batch experiments.shared_stem_cell.test_head_training experiments.shared_stem_cell.test_split_learning experiments.shared_stem_cell.test_stopping experiments.shared_stem_cell.test_materialization experiments.shared_stem_cell.test_calibrated_fusion experiments.shared_stem_cell.test_choice_fusion experiments.shared_stem_cell.test_feature_replay experiments.shared_stem_cell.test_consolidation experiments.shared_stem_cell.test_partial_consolidation experiments.shared_stem_cell.test_residual_consolidation experiments.shared_stem_cell.test_ridge_consolidation experiments.shared_stem_cell.test_confirmation experiments.shared_stem_cell.test_postseal_historical_audit experiments.shared_stem_cell.test_postseal_sparse_portfolio_probe experiments.shared_stem_cell.test_sequential_confirmation experiments.shared_stem_cell.test_sequential_replay experiments.shared_stem_cell.test_sequential_work_audit experiments.shared_stem_cell.test_external_bbc_shift 2>&1 | tee "$RUNNER_TEMP/hepta-execution-tests.txt"
          "$PY" -m experiments.shared_stem_cell.browser_loop --output "$RUNNER_TEMP/hepta-browser-study" --tasks 24
          "$PY" -m experiments.shared_stem_cell.browser_recovery --output "$RUNNER_TEMP/hepta-controller-recovery"
          "$PY" -m experiments.shared_stem_cell.head_batch_study --synthetic --output "$RUNNER_TEMP/hepta-head-batch-study"
          "$PY" -m experiments.shared_stem_cell.head_training_study --cells 8 --output "$RUNNER_TEMP/hepta-learning-digits-8"
          "$PY" -m experiments.shared_stem_cell.head_training_study --cells 32 --output "$RUNNER_TEMP/hepta-learning-digits-32"
          "$PY" -m experiments.shared_stem_cell.split_study --output "$RUNNER_TEMP/hepta-split-digits"
          "$PY" -m experiments.shared_stem_cell.stopping_study --output "$RUNNER_TEMP/hepta-stopping-digits"
          "$PY" -m experiments.shared_stem_cell.consolidation_digits --partial --residual --ridge --output "$RUNNER_TEMP/hepta-consolidation-digits"
          git diff --exit-code
      - name: Retain actual results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-execution-source.txt
            ${{ runner.temp }}/hepta-execution-tests.txt
            ${{ runner.temp }}/hepta-browser-study
            ${{ runner.temp }}/hepta-controller-recovery
            ${{ runner.temp }}/hepta-head-batch-study
            ${{ runner.temp }}/hepta-learning-digits-8
            ${{ runner.temp }}/hepta-learning-digits-32
            ${{ runner.temp }}/hepta-split-digits
            ${{ runner.temp }}/hepta-stopping-digits
            ${{ runner.temp }}/hepta-consolidation-digits
  public-pretrained-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolated pretrained runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/hepta-pretrained-env"
          "$RUNNER_TEMP/hepta-pretrained-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          "$RUNNER_TEMP/hepta-pretrained-env/bin/pip" install transformers==4.57.1 datasets==4.2.0 numpy==2.2.6 safetensors==0.7.0 packaging==25.0 psutil==7.1.0 sentencepiece==0.2.1 pillow==12.3.0
          "$RUNNER_TEMP/hepta-pretrained-env/bin/python" -c "import safetensors.torch; import packaging.version"
      - name: Real public weights and public records, not future evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          USE_TF: "0"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-pretrained-env/bin/python"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-pretrained-source.txt"
          "$PY" -m pip freeze >> "$RUNNER_TEMP/hepta-pretrained-source.txt"
          "$PY" -m unittest -v experiments.shared_stem_cell.hf_integration_checks 2>&1 | tee "$RUNNER_TEMP/hepta-hf-api-tests.txt"
          "$PY" -m experiments.shared_stem_cell.public_smoke --allow-weights-only-conversion --output "$RUNNER_TEMP/hepta-public-study" 2>&1 | tee "$RUNNER_TEMP/hepta-public-log.txt"
          # Replay input intentionally omits model weights, tokenizer and Head artifacts.
          mkdir -p "$RUNNER_TEMP/hepta-replay-input/producer"
          cp "$RUNNER_TEMP/hepta-public-study/manifest.json" "$RUNNER_TEMP/hepta-public-study/dataset.jsonl" "$RUNNER_TEMP/hepta-replay-input/"
          cp "$RUNNER_TEMP/hepta-public-study/execution/"{report,predictions}.json "$RUNNER_TEMP/hepta-replay-input/producer/"
          cp -r "$RUNNER_TEMP/hepta-public-study/execution/frozen-features" "$RUNNER_TEMP/hepta-replay-input/producer/"
          REPORT_SHA=$(sha256sum "$RUNNER_TEMP/hepta-replay-input/producer/report.json" | cut -d' ' -f1)
          for BACKEND in scalar grouped; do
            "$PY" -m experiments.shared_stem_cell.feature_replay --manifest "$RUNNER_TEMP/hepta-replay-input/manifest.json" --producer "$RUNNER_TEMP/hepta-replay-input/producer" --report-sha256 "$REPORT_SHA" --backend "$BACKEND" --output "$RUNNER_TEMP/hepta-replay-$BACKEND" 2>&1 | tee "$RUNNER_TEMP/hepta-replay-$BACKEND.log"
          done
          # Bound Cell teachers are copied, but NOT Encoder or tokenizer weights.
          cp -r "$RUNNER_TEMP/hepta-replay-input" "$RUNNER_TEMP/hepta-consolidation-input"
          mkdir -p "$RUNNER_TEMP/hepta-consolidation-input/producer/heads"
          cp -r "$RUNNER_TEMP/hepta-public-study/execution/heads/gated" "$RUNNER_TEMP/hepta-consolidation-input/producer/heads/"
          "$PY" -m experiments.shared_stem_cell.consolidation_study --partial --residual --ridge --manifest "$RUNNER_TEMP/hepta-consolidation-input/manifest.json" --producer "$RUNNER_TEMP/hepta-consolidation-input/producer" --report-sha256 "$REPORT_SHA" --output "$RUNNER_TEMP/hepta-consolidation" 2>&1 | tee "$RUNNER_TEMP/hepta-consolidation.log"
          # Freeze the chosen candidate, then acquire disjoint confirmation/evaluation rows.
          CONSOLIDATION_SHA=$(sha256sum "$RUNNER_TEMP/hepta-consolidation/report.json" | cut -d' ' -f1)
          "$PY" -m experiments.shared_stem_cell.fresh_confirmation --study "$RUNNER_TEMP/hepta-public-study" --consolidation "$RUNNER_TEMP/hepta-consolidation" --producer-sha256 "$REPORT_SHA" --consolidation-sha256 "$CONSOLIDATION_SHA" --output "$RUNNER_TEMP/hepta-fresh-confirmation" 2>&1 | tee "$RUNNER_TEMP/hepta-fresh-confirmation.log"
          "$PY" -m experiments.shared_stem_cell.external_bbc_shift \
            --study "$RUNNER_TEMP/hepta-public-study" --consolidation "$RUNNER_TEMP/hepta-consolidation" \
            --producer-sha256 "$REPORT_SHA" --consolidation-sha256 "$CONSOLIDATION_SHA" \
            --previous "$RUNNER_TEMP/hepta-fresh-confirmation" \
            --output "$RUNNER_TEMP/hepta-bbc-domain-shift" 2>&1 | tee "$RUNNER_TEMP/hepta-bbc-shift.log"
          PRIOR_SHA=$(sha256sum "$RUNNER_TEMP/hepta-fresh-confirmation/report.json" | cut -d' ' -f1)
          "$PY" -m experiments.shared_stem_cell.sequential_confirmation --study "$RUNNER_TEMP/hepta-public-study" --consolidation "$RUNNER_TEMP/hepta-consolidation" --producer-sha256 "$REPORT_SHA" --consolidation-sha256 "$CONSOLIDATION_SHA" --previous "$RUNNER_TEMP/hepta-fresh-confirmation" --previous-sha256 "$PRIOR_SHA" --output "$RUNNER_TEMP/hepta-sequential-confirmation" 2>&1 | tee "$RUNNER_TEMP/hepta-sequential-confirmation.log"
          git diff --exit-code
      - name: Retain manifests, predictions, counters and failures (no weight upload)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-public-pretrained-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-pretrained-source.txt
            ${{ runner.temp }}/hepta-public-log.txt
            ${{ runner.temp }}/hepta-hf-api-tests.txt
            ${{ runner.temp }}/hepta-public-study/model-source.json
            ${{ runner.temp }}/hepta-public-study/verified-publisher-files.json
            ${{ runner.temp }}/hepta-public-study/conversion/conversion.json
            ${{ runner.temp }}/hepta-public-study/conversion/worker.log
            ${{ runner.temp }}/hepta-public-study/conversion/failure.json
            ${{ runner.temp }}/hepta-public-study/acquisition.json
            ${{ runner.temp }}/hepta-public-study/manifest.json
            ${{ runner.temp }}/hepta-public-study/dataset.jsonl
            ${{ runner.temp }}/hepta-public-study/execution
            ${{ runner.temp }}/hepta-replay-input
            ${{ runner.temp }}/hepta-replay-scalar
            ${{ runner.temp }}/hepta-replay-grouped
            ${{ runner.temp }}/hepta-replay-scalar.log
            ${{ runner.temp }}/hepta-replay-grouped.log
            ${{ runner.temp }}/hepta-consolidation-input
            ${{ runner.temp }}/hepta-consolidation
            ${{ runner.temp }}/hepta-consolidation.log
            ${{ runner.temp }}/hepta-fresh-confirmation
            ${{ runner.temp }}/hepta-fresh-confirmation.log
            ${{ runner.temp }}/hepta-sequential-confirmation
            ${{ runner.temp }}/hepta-sequential-confirmation.log
            ${{ runner.temp }}/hepta-bbc-domain-shift
            ${{ runner.temp }}/hepta-bbc-shift.log

  public-image-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolated image and text execution runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/hepta-media-env"
          "$RUNNER_TEMP/hepta-media-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          "$RUNNER_TEMP/hepta-media-env/bin/pip" install transformers==4.57.1 datasets==4.2.0 numpy==2.2.6 safetensors==0.7.0 packaging==25.0 psutil==7.1.0 sentencepiece==0.2.1 pillow==12.3.0
          "$RUNNER_TEMP/hepta-media-env/bin/python" -c "import safetensors.torch; import packaging.version"
      - name: Actual public ScienceQA, CLIP connectors and text-only Qwen control
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          USE_TF: "0"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-media-env/bin/python"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-media-source.txt"
          "$PY" -m pip freeze >> "$RUNNER_TEMP/hepta-media-source.txt"
          "$PY" -m unittest -v experiments.shared_stem_cell.hf_integration_checks experiments.shared_stem_cell.test_public_media experiments.shared_stem_cell.test_head_artifacts experiments.shared_stem_cell.test_modality_probe experiments.shared_stem_cell.test_generation_contract experiments.shared_stem_cell.test_head_batch 2>&1 | tee "$RUNNER_TEMP/hepta-media-tests.txt"
          "$PY" -m experiments.shared_stem_cell.public_media --allow-weights-only-conversion --output "$RUNNER_TEMP/hepta-public-media" 2>&1 | tee "$RUNNER_TEMP/hepta-media-log.txt"
          "$PY" -m unittest -v experiments.shared_stem_cell.test_calibrated_fusion experiments.shared_stem_cell.test_choice_fusion experiments.shared_stem_cell.test_feature_replay experiments.shared_stem_cell.test_consolidation experiments.shared_stem_cell.test_partial_consolidation experiments.shared_stem_cell.test_residual_consolidation experiments.shared_stem_cell.test_ridge_consolidation experiments.shared_stem_cell.test_confirmation experiments.shared_stem_cell.test_sequential_confirmation experiments.shared_stem_cell.test_sequential_replay experiments.shared_stem_cell.test_sequential_work_audit 2>&1 | tee "$RUNNER_TEMP/hepta-calibrated-tests.txt"
          "$PY" -m experiments.shared_stem_cell.public_media --calibrated-fusion --allow-weights-only-conversion --output "$RUNNER_TEMP/hepta-calibrated-media" 2>&1 | tee "$RUNNER_TEMP/hepta-calibrated-log.txt"
          "$PY" -m experiments.shared_stem_cell.public_media --candidate-shared --allow-weights-only-conversion --output "$RUNNER_TEMP/hepta-choice-media" 2>&1 | tee "$RUNNER_TEMP/hepta-choice-log.txt"
          git diff --exit-code
      - name: Preserve original predictions and failures, never upload model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-public-media-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-media-source.txt
            ${{ runner.temp }}/hepta-media-tests.txt
            ${{ runner.temp }}/hepta-media-log.txt
            ${{ runner.temp }}/hepta-public-media/acquisition.json
            ${{ runner.temp }}/hepta-public-media/dataset-source.json
            ${{ runner.temp }}/hepta-public-media/dataset-publisher-verified.json
            ${{ runner.temp }}/hepta-public-media/cohort-before-labels.json
            ${{ runner.temp }}/hepta-public-media/dataset.jsonl
            ${{ runner.temp }}/hepta-public-media/manifest.json
            ${{ runner.temp }}/hepta-public-media/report.json
            ${{ runner.temp }}/hepta-public-media/failure.json
            ${{ runner.temp }}/hepta-public-media/vision/model-source.json
            ${{ runner.temp }}/hepta-public-media/vision/verified-publisher-files.json
