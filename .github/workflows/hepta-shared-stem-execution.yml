            ${{ runner.temp }}/hepta-choice-media/dataset-publisher-verified.json
            ${{ runner.temp }}/hepta-choice-media/dataset.jsonl
            ${{ runner.temp }}/hepta-choice-media/manifest.json
            ${{ runner.temp }}/hepta-choice-media/report.json
            ${{ runner.temp }}/hepta-choice-media/failure.json
            ${{ runner.temp }}/hepta-choice-media/vision/model-source.json
            ${{ runner.temp }}/hepta-choice-media/vision/verified-publisher-files.json
