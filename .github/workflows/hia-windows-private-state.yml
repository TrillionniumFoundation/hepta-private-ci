name: HIA Windows private state

on:
  workflow_dispatch:
  push:
    branches:
      - codex/hia-windows-private-state-*

permissions:
  contents: read

jobs:
  private-state:
    name: Original Windows state and intelligence tests
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test

      - name: Run all original tests in the affected state packages
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --platforms=//:windows_x86_64_msvc \
            --nocache_test_results \
            --test_verbose_timeout_warnings \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_windows_private_state_component=true \
            -- \
            //codex-rs/utils/path-utils:path-utils-unit-tests \
            //codex-rs/state:state-unit-tests \
            //codex-rs/hepta-memory:hepta-memory-unit-tests \
            //codex-rs/hepta-prompt-registry:hepta-prompt-registry-unit-tests \
            //codex-rs/hepta-intelligence:hepta-intelligence-unit-tests \
            //codex-rs/hepta-agentd:hepta-agentd-unit-tests

      - name: Upload original execution logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hia-windows-private-state-${{ github.sha }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
