name: Hepta inference one-shot exact-state sync

on:
  push:
    branches:
      - codex/inference-control-v2-closure-20260927
    paths:
      - '.github/workflows/hepta-inference-one-shot-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-inference-one-shot-exact-state-sync
  cancel-in-progress: true

jobs:
  apply:
    name: Apply reviewed inference.control state patch
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/inference-control-v2-closure-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the bounded reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/inference-control-v2-closure-20260927'
          base64 --decode .github/inference-control-final.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/inference-control-final.patch"
          echo '62ed7d77cf25450eaf77f0ad23297569dff5d03a4ce8dc210077bdd93eb68705  '"$RUNNER_TEMP/inference-control-final.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/inference-control-final.patch"
          git apply "$RUNNER_TEMP/inference-control-final.patch"
          python3 scripts/hepta-inference-control-current-state.py sync
          python3 scripts/hepta-inference-control-current-state.py check
          python3 -m py_compile \
            scripts/hepta-inference-control-current-state.py \
            scripts/hepta-implementation-maps.py \
            scripts/test_hepta_implementation_source_identity.py
          python3 -m unittest -v scripts.test_hepta_implementation_source_identity
          git diff --check

      - name: Commit one immutable reviewed result
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/inference-control-final.patch.gz.b64 \
            .github/workflows/hepta-inference-one-shot-sync.yml
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //' | sort -u)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              .github/inference-control-final.patch.gz.b64|\
              .github/workflows/hepta-inference-one-shot-sync.yml|\
              .github/workflows/hepta-inference-maintenance.yml|\
              docs/modules/inference.control/CURRENT_STATE.json|\
              docs/modules/inference.control/CURRENT_STATE_SOURCE.json|\
              docs/modules/inference.control/IMPLEMENTATION_MAP.json|\
              docs/modules/inference.control/TECHNICAL_STATUS.generated.md|\
              scripts/hepta-implementation-maps.py|\
              scripts/hepta-inference-control-current-state.py|\
              scripts/test_hepta_implementation_source_identity.py)
                ;;
              *)
                echo "unexpected changed path: $path" >&2
                exit 1
                ;;
            esac
          done
          git config user.name 'hepta-inference-exact-state[bot]'
          git config user.email 'hepta-inference-exact-state@users.noreply.github.com'
          git add --all -- \
            .github/inference-control-final.patch.gz.b64 \
            .github/workflows/hepta-inference-one-shot-sync.yml \
            .github/workflows/hepta-inference-maintenance.yml \
            docs/modules/inference.control/CURRENT_STATE.json \
            docs/modules/inference.control/CURRENT_STATE_SOURCE.json \
            docs/modules/inference.control/IMPLEMENTATION_MAP.json \
            docs/modules/inference.control/TECHNICAL_STATUS.generated.md \
            scripts/hepta-implementation-maps.py \
            scripts/hepta-inference-control-current-state.py \
            scripts/test_hepta_implementation_source_identity.py
          git commit -m 'inference.control: bind exact-head generated state and scoped qualification'
          git push origin HEAD:codex/inference-control-v2-closure-20260927
