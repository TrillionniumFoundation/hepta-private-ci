name: Hepta H7 Windows ARM real writer

# This independent producer retains the original writer and golden comparison.
# The existing Ubuntu writer and Agentd qualifications remain required.
on:
  push:
    branches:
      - "agents/hepta-h7-arm-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-h7-windows-arm-writer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-fixture-arm:
    name: Real H7 registry fixture writer on Windows ARM
    runs-on: windows-11-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
      RUSTUP_TOOLCHAIN: 1.95.0-aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure native Rust host and temporary target
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'h7-windows-arm-target')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            rustup set default-host aarch64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Verify native compiler and required LLVM tools
        working-directory: codex-rs
        run: |
          $toolLog = Join-Path $env:RUNNER_TEMP 'h7-windows-arm-toolchain.txt'
          $rustcOutput = rustc -vV 2>&1
          $rustcExit = $LASTEXITCODE
          $rustcText = $rustcOutput -join "`n"
          $rustcText | Set-Content -LiteralPath $toolLog -Encoding utf8
          if ($rustcExit -ne 0) { exit $rustcExit }
          if ($rustcText -notmatch '(?m)^host: aarch64-pc-windows-msvc\r?$') { throw 'Rust host is not native Windows ARM64' }
          if ($rustcText -notmatch '(?m)^release: 1\.95\.0\r?$') { throw 'unexpected Rust release' }
          foreach ($tool in @('clang-cl', 'clang', 'just')) {
            $resolved = Get-Command $tool -ErrorAction Stop
            "$tool path: $($resolved.Source)" | Add-Content -LiteralPath $toolLog -Encoding utf8
            $version = & $tool --version 2>&1
            $versionExit = $LASTEXITCODE
            $version | Add-Content -LiteralPath $toolLog -Encoding utf8
            if ($versionExit -ne 0) { exit $versionExit }
          }
          $nextestVersion = cargo nextest --version 2>&1
          $nextestExit = $LASTEXITCODE
          $nextestVersion | Add-Content -LiteralPath $toolLog -Encoding utf8
          Get-Content -LiteralPath $toolLog
          if ($nextestExit -ne 0) { exit $nextestExit }
      - name: Verify source and manifest graph
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ github.sha }}") { throw 'unexpected source' }
          python scripts/hepta_workspace.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the real writer and its unchanged golden comparison
        id: producer
        working-directory: codex-rs
        env:
          HEPTA_H7_REGISTRY_FIXTURE_OUTPUT: ${{ runner.temp }}/h7-expired-registry-arm-${{ github.run_id }}-${{ github.run_attempt }}.sql
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'h7-windows-arm-writer.log'
          cmd.exe /d /s /c 'just test --locked -p codex-hepta-memory --lib -E "test(h7_registry_fixture_tests::expired_registry_fixture_matches_real_writers)" --no-tests fail --retries 0 > "%RUNNER_TEMP%\h7-windows-arm-writer.log" 2>&1'
          $testExit = $LASTEXITCODE
          $nativeExecutables = @()
          $nativeError = $null
          try {
            $deps = Join-Path $env:CARGO_TARGET_DIR "$env:CARGO_BUILD_TARGET/debug/deps"
            $executables = @(Get-ChildItem -LiteralPath $deps -Filter 'codex_hepta_memory-*.exe' -File -ErrorAction Stop)
            if ($executables.Count -eq 0) { throw 'no memory test executable was produced' }
            foreach ($exe in $executables) {
              $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($exe.FullName))
              try {
                if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'test executable has no DOS signature' }
                $reader.BaseStream.Seek(0x3c, [System.IO.SeekOrigin]::Begin) | Out-Null
                $peOffset = $reader.ReadInt32()
                if ($peOffset -lt 0x40 -or $peOffset -gt ($reader.BaseStream.Length - 6)) { throw 'invalid PE offset' }
                $reader.BaseStream.Seek($peOffset, [System.IO.SeekOrigin]::Begin) | Out-Null
                if ($reader.ReadUInt32() -ne 0x00004550) { throw 'test executable has no PE signature' }
                $machine = $reader.ReadUInt16()
              } finally {
                $reader.Dispose()
              }
              $nativeExecutables += [ordered]@{
                path = [System.IO.Path]::GetRelativePath($env:CARGO_TARGET_DIR, $exe.FullName)
                bytes = $exe.Length
                sha256 = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                pe_machine = ('0x{0:X4}' -f $machine)
              }
              if ($machine -ne 0xaa64) { throw 'memory test executable is not ARM64' }
            }
          } catch {
            $nativeError = $_.Exception.Message
          }
          $sql = $null
          if (Test-Path -LiteralPath $env:HEPTA_H7_REGISTRY_FIXTURE_OUTPUT) {
            $sql = [ordered]@{
              bytes = (Get-Item -LiteralPath $env:HEPTA_H7_REGISTRY_FIXTURE_OUTPUT).Length
              sha256 = (Get-FileHash -LiteralPath $env:HEPTA_H7_REGISTRY_FIXTURE_OUTPUT -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            source_sha = (git rev-parse HEAD).Trim()
            source_tree = (git rev-parse 'HEAD^{tree}').Trim()
            expected_sha = "${{ github.sha }}"
            run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            rustup_toolchain = $env:RUSTUP_TOOLCHAIN
            cargo_build_target = $env:CARGO_BUILD_TARGET
            command = 'just test --locked -p codex-hepta-memory --lib -E "test(h7_registry_fixture_tests::expired_registry_fixture_matches_real_writers)" --no-tests fail --retries 0'
            exit_code = $testExit
            log_bytes = (Get-Item -LiteralPath $log).Length
            log_sha256 = (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
            writer_sql = $sql
            native_executables = $nativeExecutables
            native_validation_error = $nativeError
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'h7-windows-arm-receipt.json') -Encoding utf8
          Get-Content -LiteralPath $log
          if ($testExit -ne 0) { exit $testExit }
          if ($nativeError) { throw $nativeError }
      - name: Retain actual writer output and native identity
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: h7-windows-arm-real-writer-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/h7-expired-registry-arm-${{ github.run_id }}-${{ github.run_attempt }}.sql
            ${{ runner.temp }}/h7-windows-arm-writer.log
            ${{ runner.temp }}/h7-windows-arm-toolchain.txt
            ${{ runner.temp }}/h7-windows-arm-receipt.json
            ${{ env.CARGO_TARGET_DIR }}/nextest/local/junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Verify unchanged tracked source
        if: always()
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
