name: Safe Lane F final materialization

on:
  push:
    branches:
      - candidate/hepta-main-final-r2-20260911
    paths:
      - ".github/workflows/lane-f-safe-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lane-f-safe-final-materialize
  cancel-in-progress: false

jobs:
  materialize-qualify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TRANSPORT_REF: transport/lane-f-full-remediation-20260911
      TRANSPORT_SHA: 2674bd406ccc7d5e8009d79fc13bb89e35fd7563
      PAYLOAD_SHA256: 0766eab0b250af4e9ab7265c72209f395fae2440493b12813237b42f1ffe8333
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct authoritative transport payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$TRANSPORT_REF"
          test "$(git rev-parse "origin/$TRANSPORT_REF")" = "$TRANSPORT_SHA"
          joined="$RUNNER_TEMP/lane-f-remediation.b64"
          archive="$RUNNER_TEMP/lane-f-remediation.tar.xz"
          : > "$joined"
          for part in part-00 part-01 part-02 part-03; do
            git show "$TRANSPORT_SHA:.lane-f-transport/$part" >> "$joined"
          done
          base64 --decode "$joined" > "$archive"
          echo "$PAYLOAD_SHA256  $archive" | sha256sum --check --strict
          xz --test "$archive"
          echo "LANE_F_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Safely inspect payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, tarfile
          archive = os.environ["LANE_F_ARCHIVE"]
          with tarfile.open(archive, "r:xz") as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit("empty Lane F payload")
              for m in members:
                  p = pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"unsafe payload path: {m.name}")
                  if m.issym() or m.islnk() or m.isdev():
                      raise SystemExit(f"unsafe payload member type: {m.name}")
              print("LANE_F_PAYLOAD_MEMBERS", len(members))
          PY

      - name: Materialize Lane F source and documentation delta
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf "$LANE_F_ARCHIVE" -C .
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/lane-f/LANE_F_IMPLEMENTATION_MATRIX.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          for record in data["modules"]:
              record.setdefault("nativeSources", record.get("sourceFiles", []))
              record.setdefault("nativeTests", record.get("testFiles", []))
              record.setdefault("publicEntrypoints", record.get("entrypoints", []))
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          python3 scripts/hepta-lane-f.py verify
          python3 scripts/test_hepta_lane_f.py
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Generate canonical registries and format vertical
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-f.py generate
          python3 scripts/hepta_module_doc_metadata.py --write
          python3 scripts/hepta-docs.py generate-status
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-intelligence
          cd codex-rs
          cargo test --locked -p codex-hepta-intelligence --all-targets --no-run

      - name: Commit clean Lane F candidate and remove transport scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lane-f-bootstrap .lane-f-transport
          rm -f .lane-f-overlay-diagnostic.txt
          rm -f .github/workflows/lane-f-bootstrap.yml
          rm -f .github/workflows/lane-f-ordinary-source-materializer.yml
          rm -f .github/workflows/lane-f-safe-materialize.yml
          git config user.name "hepta-convergence-bot"
          git config user.email "hepta-convergence-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(lane-f): materialize and qualify adaptive-policy closure"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify Lane F closed world and documentation registries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 scripts/hepta-lane-f.py self-test
          python3 -m unittest scripts/test_hepta_lane_f.py
          python3 scripts/hepta-lane-f.py generate --check
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-lane-f.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py verify
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Test Lane F native crates under strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-neuron --all-targets
          cargo test --locked -p codex-hepta-intuition --all-targets
          cargo test --locked -p codex-hepta-prompt-optimizer --all-targets
          cargo test --locked -p codex-hepta-plasticity --all-targets
          cargo test --locked -p codex-hepta-intelligence --all-targets
          cargo clippy --locked \
            -p codex-hepta-neuron \
            -p codex-hepta-intuition \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-plasticity \
            -p codex-hepta-intelligence \
            --all-targets -- -D warnings
          cargo fmt \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-intelligence \
            -- --check

      - name: Verify repository integrity and publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 scripts/hepta-repository-integrity.py
          git diff --check
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
