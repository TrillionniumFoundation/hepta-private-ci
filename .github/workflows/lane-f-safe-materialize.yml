name: Safe Lane F overlay diagnosis

on:
  push:
    branches:
      - candidate/hepta-main-final-r2-20260911
    paths:
      - ".github/workflows/lane-f-safe-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Diagnose overlay bytes
        shell: bash
        run: |
          set -u
          report=.lane-f-overlay-diagnostic.txt
          : > "$report"
          echo "head=$(git rev-parse HEAD)" >> "$report"
          echo "chunks:" >> "$report"
          for f in .lane-f-bootstrap/part-*; do
            printf '%s size=%s sha=%s first16=' "$f" "$(wc -c < "$f")" "$(sha256sum "$f" | awk '{print $1}')" >> "$report"
            od -An -tx1 -N16 "$f" | tr -d ' \n' >> "$report"
            echo >> "$report"
          done
          cat .lane-f-bootstrap/part-* > /tmp/joined
          echo "joined_size=$(wc -c < /tmp/joined)" >> "$report"
          echo "joined_sha=$(sha256sum /tmp/joined | awk '{print $1}')" >> "$report"
          echo "expected_sha=a574dba470fbdbc397401306ebb078c4193a05ea26e62fcb4834717bd3685308" >> "$report"
          file /tmp/joined >> "$report" 2>&1 || true
          if gzip -t /tmp/joined 2>> "$report"; then echo "gzip_test=PASS" >> "$report"; else echo "gzip_test=FAIL" >> "$report"; fi
          python3 - <<'PY' >> "$report" 2>&1
          import tarfile
          p='/tmp/joined'
          try:
              with tarfile.open(p,'r:gz') as tf:
                  ms=tf.getmembers()
                  print('tar_open=PASS')
                  print('member_count='+str(len(ms)))
                  for m in ms:
                      print(f'member={m.name} type={m.type!r} size={m.size} link={m.linkname!r}')
          except Exception as e:
              print('tar_open=FAIL')
              print(type(e).__name__+': '+str(e))
          PY
          git config user.name "hepta-convergence-bot"
          git config user.email "hepta-convergence-bot@users.noreply.github.com"
          git add "$report"
          git commit -m "diag(lane-f): capture overlay byte integrity"
          git push origin "HEAD:${GITHUB_REF_NAME}"
