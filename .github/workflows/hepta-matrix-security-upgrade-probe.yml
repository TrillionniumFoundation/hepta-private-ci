name: Matrix SDK security migration feasibility (read-only)
on:
  push:
    branches:
      - codex/matrix-rustsec-2026-probe-20261012
    paths:
      - ".github/workflows/hepta-matrix-security-upgrade-probe.yml"
      - "qualification/neuron-model-trials/MATRIX_ADVISORY_UPGRADE_PROBE.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-019-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Exact checkout, read-only token
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Pinned upstream-required Rust 1.96
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.96.0"
      - name: Probe resolver, native Matrix compile and residual unsafe dependency
        shell: bash
        env:
          OUT: ${{ runner.temp }}/matrix-upgrade-evidence
          CARGO_NET_RETRY: "2"
          CARGO_INCREMENTAL: "0"
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/sha.txt"
          rustc --version > "$OUT/toolchain.txt"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("codex-rs/Cargo.toml")
          s=p.read_text()
          old='matrix-sdk = { version = "0.18.0", default-features = false, features = ["e2e-encryption", "sqlite"] }'
          new='matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "sqlite"] }'
          if s.count(old)!=1:
              raise SystemExit("blocked: unknown original Matrix workspace dependency")
          p.write_text(s.replace(old,new))
          PY
          set +e
          (cd codex-rs && cargo update -p matrix-sdk --precise 0.19.1) > "$OUT/resolve.log" 2>&1
          resolve=$?
          echo "$resolve" > "$OUT/resolve-exit.txt"
          if [ "$resolve" -eq 0 ]; then
            (cd codex-rs && cargo check --locked -p codex-hepta-matrix-sdk --lib) > "$OUT/matrix-sdk-check.log" 2>&1
            sdk=$?
            echo "$sdk" > "$OUT/matrix-sdk-check-exit.txt"
            if [ "$sdk" -eq 0 ]; then
              (cd codex-rs && cargo check --locked -p codex-hepta-matrixd --lib) > "$OUT/matrixd-check.log" 2>&1
              echo "$?" > "$OUT/matrixd-check-exit.txt"
            fi
            (cd codex-rs && cargo tree -i anymap2) > "$OUT/anymap2-tree.log" 2>&1
            echo "$?" > "$OUT/anymap2-tree-exit.txt"
          fi
          set -e
          git diff -- codex-rs/Cargo.toml codex-rs/Cargo.lock > "$OUT/UNAPPLIED.patch"
          python3 - <<'PY'
          import json,os,tomllib
          from pathlib import Path
          out=Path(os.environ["OUT"])
          packages=tomllib.loads(Path("codex-rs/Cargo.lock").read_text())["package"]
          names={"matrix-sdk","matrix-sdk-crypto","matrix-sdk-sqlite","anymap2","chacha20","spin","rusqlite","libsqlite3-sys"}
          def status(name):
              p=out/(name+"-exit.txt")
              return int(p.read_text()) if p.exists() else None
          report={
              "schema":"hepta.matrix.security-probe.v1",
              "exact_probe_sha":(out/"sha.txt").read_text().strip(),
              "isolated_ephemeral_resolution":True,
              "all_advisory_ignores_unchanged":True,
              "promotion_authorized":False,
              "target_sdk":"0.19.1",
              "probe_toolchain":(out/"toolchain.txt").read_text().strip(),
              "resolver_exit":status("resolve"),
              "matrix_sdk_compile_exit":status("matrix-sdk-check"),
              "matrixd_compile_exit":status("matrixd-check"),
              "remaining_dependency_tree_exit":status("anymap2-tree"),
              "locked_versions":{p["name"]:p["version"] for p in packages if p["name"] in names},
              "known_blockers":["RUSTSEC-2026-0318","RUSTSEC-2026-0319"],
              "safe_to_merge":False
          }
          (out/"summary.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True,indent=2))
          if report["resolver_exit"] != 0 or report["matrix_sdk_compile_exit"] != 0 or "anymap2" in report["locked_versions"]:
              print("::warning::Migration unresolved; inspect artifact, no production changes")
          PY
      - name: Retain exact feasibility evidence, not a production acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-matrix-advisory-probe-${{ github.sha }}
          path: ${{ runner.temp }}/matrix-upgrade-evidence/
          if-no-files-found: error
          retention-days: 14
