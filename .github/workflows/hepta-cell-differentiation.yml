name: Hepta cell differentiation qualification

on:
  push:
    branches: [work/cell-differentiation-20261105]
    paths:
      - codex-rs/hepta-neuron/**
      - codex-rs/hepta-plasticity/**
      - qualification/cell-differentiation/**
      - .github/workflows/hepta-cell-differentiation.yml
  pull_request:
    paths:
      - codex-rs/hepta-neuron/**
      - codex-rs/hepta-plasticity/**
      - qualification/cell-differentiation/**
      - .github/workflows/hepta-cell-differentiation.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-cell-differentiation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  reference:
    name: Isolated CPU study and adversarial controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Bind source and prepare the fixed CPU reference runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/cell-study-evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/cell-study-evidence/source.txt"
          python3 -m venv "$RUNNER_TEMP/cell-study-venv"
          "$RUNNER_TEMP/cell-study-venv/bin/python" -m pip install numpy==2.3.5 \
            2>&1 | tee "$RUNNER_TEMP/cell-study-evidence/runtime.log"
      - name: Run study regressions and all preregistered arms
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cell-study-venv/bin/python" -m unittest discover \
            -s qualification/cell-differentiation -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/cell-study-evidence/tests.log"
          "$RUNNER_TEMP/cell-study-venv/bin/python" \
            qualification/cell-differentiation/run_study.py \
            --source-commit "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/cell-study-evidence/study.json"
          "$RUNNER_TEMP/cell-study-venv/bin/python" --version \
            > "$RUNNER_TEMP/cell-study-evidence/python.txt"
          git diff --exit-code
      - name: Retain the complete study and original failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cell-differentiation-study-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/cell-study-evidence/
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native Cell contracts and plasticity proposal owners
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Bind exact source and repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/cell-native-evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/cell-native-evidence/source.txt"
          cp codex-rs/rust-toolchain.toml "$RUNNER_TEMP/cell-native-evidence/"
          sha256sum codex-rs/Cargo.lock > "$RUNNER_TEMP/cell-native-evidence/lock.sha256"
      - name: Build the actual Joint helper and publish Nextest metadata
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
          cargo build --locked -p codex-hepta-infer-worker-host --bin hepta-joint-propose
          helper="$target_dir/debug/hepta-joint-propose"
          test -x "$helper"
          printf '%s\\n' "$helper" > "$RUNNER_TEMP/cell-native-evidence/joint-helper-path.txt"
          sha256sum "$helper" > "$RUNNER_TEMP/cell-native-evidence/joint-helper.sha256"
          printf 'NEXTEST_BIN_EXE_hepta-joint-propose=%s\\n' "$helper" >> "$GITHUB_ENV"
      - name: Run the existing package test entry point
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-neuron -p codex-hepta-plasticity \
            2>&1 | tee "$RUNNER_TEMP/cell-native-evidence/tests.log"
      - name: Lint the affected packages
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-neuron -p codex-hepta-plasticity \
            --all-targets -- -D clippy::correctness -D clippy::await_holding_lock \
            -D clippy::await_holding_invalid_type \
            2>&1 | tee "$RUNNER_TEMP/cell-native-evidence/clippy.log"
      - name: Check formatting without rewriting the tested source
        if: always()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-neuron --package codex-hepta-plasticity -- --check \
            2>&1 | tee "$RUNNER_TEMP/cell-native-evidence/format.log"
          git diff --check
          git diff --exit-code
      - name: Retain exact native results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cell-differentiation-native-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/cell-native-evidence/
          if-no-files-found: error
          retention-days: 14
