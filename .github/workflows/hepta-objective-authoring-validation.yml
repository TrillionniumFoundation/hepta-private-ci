name: Hepta objective authoring validation

on:
  push:
    branches:
      - work/objective-compiler-final-convergence-20260930
    paths:
      - codex-rs/hepta-objective/**
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-learning-ledger/**
      - codex-rs/Cargo.lock
      - docs/modules/objective.compiler/**
      - docs/readiness/OBJECTIVE_COMPILER_EXECUTION.md
      - docs/readiness/OBJECTIVE_TARGET_HOST_MEASUREMENT.md
      - qualification/module-execution-dossiers/detail/objective.compiler.md
      - scripts/hepta-objective-*.py
      - scripts/test_hepta_objective_*.py
      - scripts/hepta-implementation-maps.py
      - .github/workflows/hepta-objective-*.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

concurrency:
  group: objective-authoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind unprivileged authoring candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/objective-authoring"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/objective-authoring/source.txt"
          rustc --version --verbose | tee "$RUNNER_TEMP/objective-authoring/rustc.txt"
          cargo --version --verbose | tee "$RUNNER_TEMP/objective-authoring/cargo.txt"
          python3 --version | tee "$RUNNER_TEMP/objective-authoring/python.txt"
          git archive --format=tar.gz \
            --output="$RUNNER_TEMP/objective-authoring/repository.tgz" \
            HEAD \
            codex-rs/hepta-objective \
            codex-rs/hepta-intelligence/src/objective_run.rs \
            codex-rs/hepta-intelligence/src/objective_run_tests.rs \
            codex-rs/hepta-agentd/src/objective_runtime.rs \
            codex-rs/hepta-agentd/src/objective_runtime_replay.rs \
            codex-rs/hepta-agentd/src/objective_run_start_checkpoint.rs \
            codex-rs/hepta-agentd/src/lane_b_runtime.rs \
            codex-rs/hepta-agentd/tests/objective_product_e2e \
            codex-rs/hepta-learning-ledger/src/run_start.rs \
            codex-rs/hepta-learning-ledger/src/run_start_proof.rs \
            docs/modules/objective.compiler \
            docs/readiness/OBJECTIVE_COMPILER_EXECUTION.md \
            docs/readiness/OBJECTIVE_TARGET_HOST_MEASUREMENT.md \
            qualification/module-execution-dossiers/detail/objective.compiler.md \
            scripts/hepta-implementation-maps.py \
            scripts/hepta-objective-current-state.py \
            scripts/hepta-objective-evidence-project.py \
            scripts/hepta-objective-map-convergence.py \
            scripts/hepta-objective-qualify-exact.py \
            scripts/hepta-objective-release-gate.py \
            scripts/hepta-objective-spec-consistency.py \
            scripts/hepta-objective-target-measure.py \
            scripts/test_hepta_objective_spec_consistency.py \
            .github/workflows/hepta-objective-admission.yml \
            .github/workflows/hepta-objective-authoring-validation.yml \
            .github/workflows/hepta-objective-convergence-smoke.yml \
            .github/workflows/hepta-objective-exact-execution.yml \
            .github/workflows/hepta-objective-release-gate.yml \
            .github/workflows/hepta-objective-target-host.yml \
            .github/workflows/hepta-objective-target-measurement.yml
          sha256sum "$RUNNER_TEMP/objective-authoring/repository.tgz" \
            > "$RUNNER_TEMP/objective-authoring/repository.tgz.sha256"

      - name: Verify committed objective projections
        id: committed_projections
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-objective-current-state.py verify \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/current-state-verify.log"
          python3 scripts/hepta-objective-map-convergence.py verify \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/map-convergence-verify.log"
          python3 scripts/hepta-implementation-maps.py verify \
            --module objective.compiler \
            --expected-sha "$SOURCE_SHA" \
            --expected-tree "$tree" \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/map-verify.log"

      - name: Render deterministic projection preview in a disposable worktree
        id: projection_preview
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          preview="$RUNNER_TEMP/objective-projection-worktree"
          output="$RUNNER_TEMP/objective-authoring/generated-preview"
          rm -rf "$preview" "$output"
          mkdir -p "$output"
          git worktree add --detach "$preview" "$SOURCE_SHA"
          cleanup() {
            git worktree remove --force "$preview" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          (
            cd "$preview"
            test -z "$(git status --porcelain)"
            python3 scripts/hepta-implementation-maps.py migrate --module objective.compiler \
              2>&1 | tee "$RUNNER_TEMP/objective-authoring/map-migrate.log"
            python3 scripts/hepta-objective-map-convergence.py sync \
              2>&1 | tee "$RUNNER_TEMP/objective-authoring/map-convergence-sync.log"
            python3 scripts/hepta-objective-current-state.py sync \
              2>&1 | tee "$RUNNER_TEMP/objective-authoring/current-state-sync.log"
            python3 scripts/hepta-objective-map-convergence.py verify
            git diff --check
            git diff --binary > "$RUNNER_TEMP/objective-authoring/generated-state.patch"
            cp docs/modules/objective.compiler/IMPLEMENTATION_MAP.json "$output/"
            cp docs/modules/objective.compiler/TECHNICAL.md "$output/"
            cp docs/modules/objective.compiler/CURRENT_STATE.json "$output/"
            cp qualification/module-execution-dossiers/detail/objective.compiler.md "$output/"
            git diff --name-only | sort > "$output/changed-paths.txt"
          )

      - name: Verify normative source and document consistency
        id: normative
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.test_hepta_objective_spec_consistency \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/spec-consistency-tests.log"
          python3 scripts/hepta-objective-spec-consistency.py verify \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/spec-consistency.log"

      - name: Objective compile, tests and strict lint
        id: rust_validation
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --no-run \
            -p codex-hepta-objective \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-intelligence \
            -p codex-hepta-agentd \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/cargo-no-run.log"
          cargo test --locked -p codex-hepta-objective -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/objective-tests.log"
          cargo test --locked -p codex-hepta-objective \
            --features qualification-legacy-compile -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/objective-compat-tests.log"
          cargo clippy --locked \
            -p codex-hepta-objective \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-intelligence \
            -p codex-hepta-agentd \
            --all-targets --no-deps -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/clippy.log"
          cargo clippy --locked -p codex-hepta-objective \
            --all-targets --features qualification-legacy-compile --no-deps -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/clippy-compat.log"
          cargo fmt --all -- --check \
            2>&1 | tee "$RUNNER_TEMP/objective-authoring/fmt.log"

      - name: Preserve generated map and execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objective-authoring-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/objective-authoring
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm source checkout remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Enforce all authoring gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.committed_projections.outcome }}" = success
          test "${{ steps.projection_preview.outcome }}" = success
          test "${{ steps.normative.outcome }}" = success
          test "${{ steps.rust_validation.outcome }}" = success
