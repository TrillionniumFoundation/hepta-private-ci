name: Hepta V10 Granite source-first (research DENY_ALL)
on:
  push:
    branches: [research/v10-global-proof-granite-sourcefirst-20261015]
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/v10_*.py'
      - 'qualification/stem-cell-v1/test_v10_*.py'
      - 'qualification/stem-cell-v1/v9_typed_graph.py'
      - '.github/workflows/hepta-v10-real-granite-sourcefirst.yml'
permissions:
  contents: read
concurrency:
  group: v10-granite-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          python -m pip install packaging==25.0 numpy==2.3.5 safetensors==0.7.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Original-source regression, ordinary and optimized
        env:
          PYTHONPATH: qualification/stem-cell-v1
          OMP_NUM_THREADS: '1'
        run: |
          python -m unittest -v test_v9_graph test_v9_frozen test_v10_global_proof test_v10_granite_contract
          python -O -m unittest -v test_v9_graph test_v9_frozen test_v10_global_proof test_v10_granite_contract
          python -m compileall -q qualification/stem-cell-v1
  source-first-smoke:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Generate public and isolated truth without model claims
        run: |
          python qualification/stem-cell-v1/v10_granite_features.py source --output "$RUNNER_TEMP/v10-source"
          python - "$RUNNER_TEMP/v10-source/source-seal.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['train_rows']==288 and a['held_rows']==960
          assert a['production_accepted'] is False and a['authority']=='DENY_ALL'
          PY
