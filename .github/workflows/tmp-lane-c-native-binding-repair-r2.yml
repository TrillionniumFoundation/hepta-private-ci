name: tmp-lane-c-native-binding-repair-r2

on:
  push:
    branches:
      - codex/lane-c-full-gap-closure-20260910
    paths:
      - .github/workflows/tmp-lane-c-native-binding-repair-r2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact carrier with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Commit clean repair, verify exact tree, and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "96d62a5286c9d3bc313f655b07a66969e67faa54"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("qualification/module-execution-dossiers/NATIVE_BINDINGS.json")
          text = path.read_text(encoding="utf-8")
          old = '"blobSha": "f4fca6216821c994a401442cf06f69a3d082"'
          new = '"blobSha": "f4fca6216821c994a401e401442cf06f69a3d082"'
          if text.count(old) != 1:
              raise SystemExit("infer-worker stale binding anchor drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/tmp-lane-c-native-binding-repair.yml
          rm .github/workflows/tmp-lane-c-native-binding-repair-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/module-execution-dossiers/NATIVE_BINDINGS.json \
            .github/workflows/tmp-lane-c-native-binding-repair.yml \
            .github/workflows/tmp-lane-c-native-binding-repair-r2.yml
          git commit -m 'chore(lane-c): restore exact infer-worker source binding'
          test -z "$(git status --porcelain)"
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          git diff --check HEAD^
          git push origin HEAD:codex/lane-c-full-gap-closure-20260910
