name: Hepta migration fixtures and trust tools

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "research/wsp-ci-fixtures-*"
      - "research/wsp-dependency-*"
    paths:
      - ".bazelrc"
      - ".github/actions/setup-bazel-ci/**"
      - ".github/workflows/hepta-ci-fixtures.yml"
      - "codex-rs/hepta-automation/**"
      - "codex-rs/hepta-evidence/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-operator-acceptance/**"
      - "codex-rs/Cargo.lock"

permissions:
  contents: read

concurrency:
  group: hepta-ci-fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-and-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-fixture-target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Supply native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client build-essential pkg-config libcap-dev
          test -x /usr/bin/ssh-keygen
          mkdir -p "$RUNNER_TEMP/hepta-fixture-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-fixture-evidence/head.txt"
          dpkg-query -W openssh-client > "$RUNNER_TEMP/hepta-fixture-evidence/openssh.txt"
      - name: Exercise real SSHSIG trust qualification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test -p codex-hepta-operator-acceptance --lib --locked 2>&1 | tee "$RUNNER_TEMP/hepta-fixture-evidence/trust.log"
      - name: Replay the v1 automation migration
        if: success() || failure()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test -p codex-hepta-automation --test automation --locked v1_store_migrates_atomically_to_dispatch_outcome_schema 2>&1 | tee "$RUNNER_TEMP/hepta-fixture-evidence/automation.log"
      - name: Replay the v2 cognitive memory migration
        if: success() || failure()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test -p codex-hepta-memory --lib --locked v2_fixture_migrates_forward_preserving_memory_and_revoking_legacy_projection 2>&1 | tee "$RUNNER_TEMP/hepta-fixture-evidence/memory.log"
      - name: Verify AuthBus global and issuer capacity boundaries
        if: success() || failure()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test -p codex-hepta-evidence --lib --locked authbus_outbox_tests 2>&1 | tee "$RUNNER_TEMP/hepta-fixture-evidence/authbus-outbox.log"
      - name: Upload exact-source results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-fixture-cargo-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-fixture-evidence
          if-no-files-found: error
          retention-days: 14

  bazel-native-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: hepta-native-trust
      - name: Run the OpenSSH-dependent Bazel target
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          # This scoped job records JSON instead of the shared compact log.
          CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR: ""
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-trust-bazel-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-trust-bazel-evidence/head.txt"
          dpkg-query -W openssh-client > "$RUNNER_TEMP/hepta-trust-bazel-evidence/openssh.txt"
          ./.github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- \
            test --cache_test_results=no --test_output=all \
            --execution_log_json_file="$RUNNER_TEMP/hepta-trust-bazel-evidence/execution.json" -- \
            //codex-rs/hepta-operator-acceptance:hepta-operator-acceptance-tests \
            2>&1 | tee "$RUNNER_TEMP/hepta-trust-bazel-evidence/bazel.log"
      - name: Upload native execution results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-fixture-bazel-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-trust-bazel-evidence
          if-no-files-found: error
          retention-days: 14
