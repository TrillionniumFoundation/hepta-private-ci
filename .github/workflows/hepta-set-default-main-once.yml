name: Hepta set default branch to main once

on:
  push:
    branches:
      - codex/set-default-main-20260907

permissions:
  contents: write

jobs:
  set-default:
    if: ${{ contains(github.event.head_commit.message, '[hepta-set-default-main]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_BRANCH: codex/set-default-main-20260907
    steps:
      - name: Set and verify default branch
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          echo "default branch before: ${before}"
          if [[ "${before}" != "main" ]]; then
            gh api -X PATCH "/repos/${GITHUB_REPOSITORY}" -f default_branch=main >/tmp/repo.json
          fi
          after="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          echo "default branch after: ${after}"
          [[ "${after}" == "main" ]]

      - name: Remove one-shot control branch
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="${CONTROL_BRANCH//\//%2F}"
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
