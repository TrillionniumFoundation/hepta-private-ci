name: Architecture rustfmt one-shot

on:
  push:
    branches:
      - architecture/close-priority-scaleability-gaps-20260916
    paths:
      - ".github/workflows/architecture-rustfmt-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: add one-shot rustfmt executor' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 84ad13a9ced531ad8a04b483309ab5b6220b90e1
      TARGET_BRANCH: architecture/close-priority-scaleability-gaps-20260916
      PACKAGES: >-
        codex-hepta-agent-protocol codex-hepta-agentd
        codex-hepta-authbus codex-hepta-authbus-p1-3-qualification
        codex-hepta-automation codex-hepta-bao-adapter
        codex-hepta-bellman-operator codex-hepta-codex-adapter
        codex-hepta-cognitive-read codex-hepta-cognitive-store
        codex-hepta-cognitive-types codex-hepta-compact-engine
        codex-hepta-context-compiler codex-hepta-control-plane
        codex-hepta-evidence codex-hepta-fleet
        codex-hepta-infer-core codex-hepta-infer-worker-host
        codex-hepta-inferd codex-hepta-intelligence
        codex-hepta-intelligence-eval codex-hepta-intuition
        codex-hepta-kg codex-hepta-learning-artifacts
        codex-hepta-learning-ledger codex-hepta-matrixd
        codex-hepta-memory codex-hepta-memory-federation
        codex-hepta-memory-retrieval codex-hepta-ndu
        codex-hepta-plasticity codex-hepta-shadow-qualification
        codex-state codex-core codex-app-server
        codex-hepta-matrix-store codex-hepta-memory-extension
        codex-hepta-neuron codex-hepta-prompt-registry
        codex-hepta-supervisor codex-hepta-runtime
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify one-shot parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"

      - name: Materialize canonical rustfmt
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(--package "$package"); done
          cargo fmt "${args[@]}"

      - name: Enforce exact formatting scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected <<'EOF'
          codex-rs/hepta-learning-ledger/src/checkpoint.rs
          codex-rs/hepta-learning-ledger/src/ledger.rs
          codex-rs/hepta-learning-ledger/src/lib.rs
          codex-rs/hepta-learning-ledger/src/segment_codec.rs
          codex-rs/hepta-learning-ledger/src/segments.rs
          codex-rs/hepta-learning-ledger/src/segments_tests.rs
          codex-rs/hepta-memory/src/cognitive_federation.rs
          codex-rs/hepta-memory/src/cognitive_federation_tests.rs
          codex-rs/hepta-supervisor/src/process_deadline.rs
          codex-rs/hepta-supervisor/src/writer_handoff.rs
          codex-rs/hepta-supervisor/tests/process_deadline_unix.rs
          codex-rs/hepta-supervisor/tests/writer_handoff_production.rs
          EOF
          sed -i 's/^          //' /tmp/expected
          sort -o /tmp/expected /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check

      - name: Commit only formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Architecture CI"
          git config user.email "hepta-architecture-ci@users.noreply.github.com"
          mapfile -t files < /tmp/expected
          git add -- "${files[@]}"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "style: materialize rustfmt for architecture closure"
          git push origin "HEAD:$TARGET_BRANCH"
