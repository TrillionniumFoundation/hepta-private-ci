name: Hepta memory retrieval scoped source repair

on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
    paths:
      - scripts/hepta_memory_retrieval_owned_work_patch.py
      - .github/workflows/hepta-memory-retrieval-scoped-repair.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: memory-retrieval-scoped-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  prepare:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Generate and format only exact-preimage source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/hepta_memory_retrieval_owned_work_patch.py apply
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check
          mkdir -p "$RUNNER_TEMP/retrieval-patch"
          python3 scripts/hepta_memory_retrieval_owned_work_patch.py manifest "$RUNNER_TEMP/retrieval-patch/changes.json"
          git diff --stat
          git diff --binary > "$RUNNER_TEMP/retrieval-patch/source.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrieval-source-data-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-patch/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      # No checkout, candidate Python, Cargo, package manager, repository action,
      # shared cache or candidate executable is run in this write-scoped job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: retrieval-source-data-${{ github.run_id }}
          path: ${{ runner.temp }}/source-data
      - name: Publish bounded source data with a non-forced compare-and-swap
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path
          REPO = "TrillionniumFoundation/hepta-private-ci"
          BRANCH = "work/memory-retrieval-hardening-20260927"
          ALLOWED = {
              "codex-rs/hepta-agentd/src/retrieval_executor.rs",
              "codex-rs/hepta-agentd/src/retrieval_executor_tests.rs",
              "codex-rs/hepta-agentd/src/cognitive_context.rs",
              "codex-rs/hepta-agentd/Cargo.toml",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "source-data" / "changes.json"
          if path.is_symlink() or not 0 < path.stat().st_size <= 1_000_000:
              raise SystemExit("invalid source-data size or type")
          data = json.loads(path.read_text(encoding="utf-8"))
          base = os.environ["EXPECTED_BASE"]
          if not re.fullmatch(r"[0-9a-f]{40}", base) or data.get("base") != base:
              raise SystemExit("source identity mismatch")
          entries = data.get("changes")
          if not isinstance(entries, list) or len(entries) != len(ALLOWED):
              raise SystemExit("invalid source-data entry count")
          if {entry.get("path") for entry in entries} != ALLOWED:
              raise SystemExit("source path outside exact allowlist")
          for entry in entries:
              if set(entry) != {"path", "before", "content"}:
                  raise SystemExit("unexpected source-data fields")
              if not isinstance(entry["content"], str) or len(entry["content"].encode("utf-8")) > 300_000:
                  raise SystemExit("source content exceeds bound")
              if not re.fullmatch(r"[0-9a-f]{40}", entry["before"]):
                  raise SystemExit("invalid preimage identity")
          def api(method, endpoint, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + endpoint,
                  data=body, method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          ref = "/git/ref/heads/" + urllib.parse.quote(BRANCH, safe="/")
          if api("GET", ref)["object"]["sha"] != base:
              raise SystemExit("branch advanced: refusing to overwrite concurrent work")
          for entry in entries:
              existing = api("GET", "/contents/" + entry["path"] + "?ref=" + base)
              if existing.get("type") != "file" or existing.get("sha") != entry["before"]:
                  raise SystemExit("preimage changed: " + entry["path"])
          parent = api("GET", "/git/commits/" + base)
          tree = api("POST", "/git/trees", {"base_tree": parent["tree"]["sha"], "tree": [
              {"path": entry["path"], "mode": "100644", "type": "blob", "content": entry["content"]}
              for entry in entries]})
          commit = api("POST", "/git/commits", {
              "message": "fix(memory.retrieval): own async work and isolate shadow cancellation\n\nExact-preimage, source-only publication. Native qualification and production acceptance remain separate gates.",
              "tree": tree["sha"], "parents": [base]})
          api("PATCH", "/git/refs/heads/" + urllib.parse.quote(BRANCH, safe="/"), {"sha": commit["sha"], "force": False})
          if api("GET", ref)["object"]["sha"] != commit["sha"]:
              raise SystemExit("post-publication ref changed; inspect before qualification")
          print("PUBLISHED_SOURCE_SHA=" + commit["sha"])
          print("PUBLISHED_TREE_SHA=" + tree["sha"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("source_sha=" + commit["sha"] + "\n")
          PY

  qualify:
    needs: publish
    runs-on: ubuntu-slim
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [core, agentd]
    env:
      SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      TESTED_SHA: ${{ needs.publish.outputs.source_sha }}
      HEPTA_CI_LANE: source-head
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Validate the actually published source
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/retrieval-evidence"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -p HEAD > "$evidence/commit.txt"
          rustc -Vv > "$evidence/rustc.txt"
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps --format-version 1 > "$evidence/metadata.json"
          case "$SUITE" in
            core) packages=(-p codex-hepta-memory-retrieval -p codex-hepta-learning-ledger) ;;
            agentd) packages=(-p codex-hepta-agentd) ;;
            *) exit 2 ;;
          esac
          status=0
          python3 scripts/hepta_ci_exec.py --output "$evidence/tests.json" --minimum-tests 1 --timeout-seconds 1800 -- just test --locked "${packages[@]}" || status=1
          python3 scripts/hepta_ci_exec.py --output "$evidence/clippy.json" --minimum-tests 0 --timeout-seconds 600 -- cargo clippy --manifest-path codex-rs/Cargo.toml --locked "${packages[@]}" --all-targets -- -D warnings || status=1
          git diff --exit-code -- codex-rs/Cargo.lock
          printf '%s\n' "$status" > "$evidence/status.txt"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-source-qualification-${{ matrix.suite }}-${{ needs.publish.outputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-evidence/
          retention-days: 30
          if-no-files-found: error
