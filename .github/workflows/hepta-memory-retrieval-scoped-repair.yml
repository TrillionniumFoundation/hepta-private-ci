name: Hepta retrieval reviewed source transport
on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
    paths:
      - scripts/patches/memory_retrieval_reviewed_changes.json
      - .github/workflows/hepta-memory-retrieval-scoped-repair.yml
permissions:
  contents: read
concurrency:
  group: memory-retrieval-reviewed-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[retrieval-reviewed-source-v2]')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      # No checkout, candidate code, build, artifact input, package manager or
      # cache runs with this token. The reviewed JSON contains text edits only.
      - name: Apply exact-preimage text data to Git blobs, never execute source
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          REPO = 'TrillionniumFoundation/hepta-private-ci'
          BRANCH = 'work/memory-retrieval-hardening-20260927'
          PATCH = 'scripts/patches/memory_retrieval_reviewed_changes.json'
          ALLOWED = {
              'codex-rs/hepta-learning-ledger/src/production.rs',
              'codex-rs/hepta-learning-ledger/src/production_tests.rs',
              'codex-rs/hepta-learning-ledger/src/production_retrieval_preparation_tests.rs',
          }
          def api(method, endpoint, payload=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + endpoint,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(4_000_001)
              if len(raw) > 4_000_000:
                  raise ValueError('API response exceeded bound')
              return json.loads(raw)
          def blob_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          def file_at(path, sha):
              return api('GET', '/contents/' + urllib.parse.quote(path, safe='/') + '?ref=' + sha)
          def decode_file(record):
              if record.get('type') != 'file' or record.get('encoding') != 'base64':
                  raise ValueError('not an encoded regular file')
              raw = base64.b64decode(''.join(record['content'].split()), validate=True)
              if len(raw) > 1_000_000 or blob_sha(raw) != record['sha']:
                  raise ValueError('file identity or size mismatch')
              return raw
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate JSON key')
                  result[key] = value
              return result
          base = os.environ['EXPECTED_BASE']
          if not re.fullmatch('[0-9a-f]{40}', base):
              raise ValueError('invalid base')
          ref = '/git/ref/heads/' + urllib.parse.quote(BRANCH, safe='/')
          if api('GET', ref)['object']['sha'] != base:
              raise ValueError('branch advanced; no overwrite')
          data = json.loads(decode_file(file_at(PATCH, base)), object_pairs_hook=unique_object)
          if set(data) != {'schema', 'source_parent', 'changes'} or data['schema'] != 'hepta.retrieval.reviewed-text-edits.v2':
              raise ValueError('invalid patch envelope')
          parent = api('GET', '/git/commits/' + base)
          if [item['sha'] for item in parent['parents']] != [data['source_parent']]:
              raise ValueError('unexpected source ancestry')
          changes = data['changes']
          if not isinstance(changes, list) or not 0 < len(changes) <= len(ALLOWED):
              raise ValueError('invalid change count')
          seen, entries = set(), []
          for change in changes:
              if set(change) != {'path', 'before', 'after', 'hunks'}:
                  raise ValueError('unexpected change fields')
              path = change['path']
              if path not in ALLOWED or path in seen:
                  raise ValueError('unreviewed or duplicate path')
              seen.add(path)
              if not re.fullmatch('[0-9a-f]{40}', change['after']):
                  raise ValueError('invalid postimage')
              try:
                  existing = file_at(path, base)
              except urllib.error.HTTPError as error:
                  if error.code != 404 or change['before'] is not None:
                      raise
                  original = ''
              else:
                  if existing['sha'] != change['before']:
                      raise ValueError('preimage mismatch')
                  original = decode_file(existing).decode('utf-8')
              hunks = change['hunks']
              if not isinstance(hunks, list) or not 0 < len(hunks) <= 128:
                  raise ValueError('invalid hunk count')
              end = 0
              for hunk in hunks:
                  if not isinstance(hunk, list) or len(hunk) != 3:
                      raise ValueError('invalid text hunk')
                  start, stop, replacement = hunk
                  if type(start) is not int or type(stop) is not int or not end <= start <= stop <= len(original) or not isinstance(replacement, str):
                      raise ValueError('overlapping or invalid text range')
                  end = stop
              result = original
              for start, stop, replacement in reversed(hunks):
                  result = result[:start] + replacement + result[stop:]
              raw = result.encode('utf-8')
              if len(raw) > 500_000 or blob_sha(raw) != change['after']:
                  raise ValueError('postimage mismatch')
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'content': result})
          # The transport payload is removed in the same atomic source commit.
          # A clean checkout builds the committed source; no patch step is needed.
          entries.append({'path': PATCH, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('POST', '/git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'fix(memory.retrieval): land reviewed exact source and regression tests\n\nText-only transport; all source preimages and postimages are pinned. No source generation at build time. Qualification and independent acceptance remain separate.',
              'tree': tree['sha'], 'parents': [base]})
          api('PATCH', '/git/refs/heads/' + urllib.parse.quote(BRANCH, safe='/'), {'sha': commit['sha'], 'force': False})
          if api('GET', ref)['object']['sha'] != commit['sha']:
              raise ValueError('concurrent update after publication; inspect before qualification')
          print('PUBLISHED_SOURCE_SHA=' + commit['sha'])
          print('PUBLISHED_TREE_SHA=' + tree['sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('source_sha=' + commit['sha'] + '\n')
          PY
  qualify-core:
    needs: publish
    runs-on: ubuntu-slim
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      TESTED_SHA: ${{ needs.publish.outputs.source_sha }}
      HEPTA_CI_LANE: source-head
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Export pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retrieval-tools"
          cp "$(rustup which --toolchain 1.95.0 rustfmt)" "$RUNNER_TEMP/retrieval-tools/rustfmt"
          rustc -Vv > "$RUNNER_TEMP/retrieval-tools/toolchain.txt"
          (cd "$RUNNER_TEMP/retrieval-tools"; sha256sum rustfmt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrieval-formatter-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-tools/
          retention-days: 1
          if-no-files-found: error
      - name: Execute exact-source core checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          mkdir -p "$RUNNER_TEMP/retrieval-checks" "$RUNNER_TEMP/retrieval-tools"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-checks/identity.txt"
          failed=0
          for package in codex-hepta-memory-retrieval codex-hepta-learning-ledger codex-hepta-infer-core; do
            (cd codex-rs; python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/retrieval-checks/$package.json" --minimum-tests 1 --timeout-seconds 1800 -- just test --locked -p "$package" --all-targets) || failed=1
          done
          cargo fmt --manifest-path codex-rs/Cargo.toml --all --check > "$RUNNER_TEMP/retrieval-checks/fmt.log" 2>&1 || failed=1
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-learning-ledger --all-targets -- -D warnings > "$RUNNER_TEMP/retrieval-checks/clippy.log" 2>&1 || failed=1
          git diff --exit-code || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-reviewed-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/retrieval-checks/
            ${{ runner.temp }}/retrieval-tools/
          retention-days: 30
          if-no-files-found: error
