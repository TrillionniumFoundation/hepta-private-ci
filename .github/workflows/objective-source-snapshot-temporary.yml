name: Objective source snapshot temporary

on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927

permissions:
  contents: read

concurrency:
  group: objective-source-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build read-only source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          archive="$RUNNER_TEMP/objective-source-${{ github.sha }}.tar.gz"
          tar -czf "$archive" \
            codex-rs/hepta-agentd \
            codex-rs/Cargo.toml \
            codex-rs/clippy.toml \
            codex-rs/rust-toolchain.toml
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Retain immutable snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objective-source-${{ github.sha }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          if-no-files-found: error
          retention-days: 1
