name: One-shot fleet cleanup 2026-10-02

on:
  push:
    branches: [ops/fleet-cleanup-20261002]
  workflow_dispatch:

permissions: {}

jobs:
  desktop-repair:
    name: Restore desktop remote agent
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Inspect and restart existing Desktop Commander service only
        shell: bash
        run: |
          set -u
          test "$RUNNER_NAME" = desktop
          echo "host=$(hostname)"
          df -h /
          echo "--- preserved paths ---"
          find "$HOME" -maxdepth 2 \( -iname '*desktop*commander*' -o -iname '*claude-server-commander*' \) -print 2>/dev/null || true
          echo "--- dotslash ---"
          du -sh "$HOME/.cache/dotslash" 2>/dev/null || true
          echo "--- matching processes before ---"
          pgrep -af 'desktop.*commander|commander.*remote|claude-server-commander|desktopcommander' || true
          echo "--- matching user services ---"
          mapfile -t units < <(systemctl --user list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei 'desktop.*commander|commander.*remote|claude-server-commander|desktopcommander' || true)
          printf '%s\n' "${units[@]:-}"
          for u in "${units[@]:-}"; do
            [ -n "$u" ] || continue
            systemctl --user restart "$u" || true
          done
          echo "--- matching processes after ---"
          pgrep -af 'desktop.*commander|commander.*remote|claude-server-commander|desktopcommander' || true

  rog-clean:
    name: Clean ROG caches
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 15
    steps:
      - name: Conservative cache cleanup
        shell: bash
        run: |
          set -u
          test "$RUNNER_NAME" = rog
          before=$(df -B1 / | awk 'NR==2{print $3}')
          cache="$HOME/.cache"
          if [ -d "$cache" ]; then
            find "$cache" -mindepth 1 -maxdepth 1 -print0 | while IFS= read -r -d '' p; do
              b=$(basename "$p"); l=$(printf '%s' "$b" | tr '[:upper:]' '[:lower:]')
              case "$l" in
                *commander*|*desktop*commander*|codex-runtimes|codex|openai-*|openclaw*|dotslash|whisper|hepta|hepta-decisioncell-models|hepta-models|huggingface) continue ;;
              esac
              rm -rf -- "$p"
            done
          fi
          rm -rf -- "$HOME/.cargo/registry/cache" "$HOME/.cargo/registry/src" "$HOME/.cargo/git/checkouts" "$HOME/.cargo/git/db" 2>/dev/null || true
          rm -rf -- "$HOME/.npm/_cacache" "$HOME/.npm/_npx" "$HOME/.npm/_logs" 2>/dev/null || true
          rm -rf -- "$HOME/.rustup/downloads/"* "$HOME/.rustup/tmp/"* 2>/dev/null || true
          rm -rf -- "$HOME/.local/share/Trash/files/"* "$HOME/.local/share/Trash/info/"* "$HOME/.Trash/"* 2>/dev/null || true
          rm -rf -- "$HOME/hepta-account-readiness-wiring-20260719/node_modules" 2>/dev/null || true
          if sudo -n true 2>/dev/null; then sudo -n apt-get clean >/dev/null 2>&1 || true; fi
          after=$(df -B1 / | awk 'NR==2{print $3}')
          echo "freed_bytes=$((before-after))"
          df -h /

  pocket4-clean:
    name: Clean Pocket4 caches without trader state
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 15
    steps:
      - name: Conservative cache cleanup
        shell: bash
        run: |
          set -u
          test "$RUNNER_NAME" = pocket4
          before=$(df -B1 / | awk 'NR==2{print $3}')
          cache="$HOME/.cache"
          if [ -d "$cache" ]; then
            find "$cache" -mindepth 1 -maxdepth 1 -print0 | while IFS= read -r -d '' p; do
              b=$(basename "$p"); l=$(printf '%s' "$b" | tr '[:upper:]' '[:lower:]')
              case "$l" in
                *commander*|*desktop*commander*|codex-runtimes|codex|openai-*|openclaw*|dotslash|huggingface|ollama) continue ;;
              esac
              rm -rf -- "$p"
            done
          fi
          rm -rf -- "$HOME/.cargo/registry/cache" "$HOME/.cargo/registry/src" "$HOME/.cargo/git/checkouts" "$HOME/.cargo/git/db" 2>/dev/null || true
          rm -rf -- "$HOME/.npm/_cacache" "$HOME/.npm/_npx" "$HOME/.npm/_logs" 2>/dev/null || true
          rm -rf -- "$HOME/.rustup/downloads/"* "$HOME/.rustup/tmp/"* 2>/dev/null || true
          rm -rf -- "$HOME/.local/share/Trash/files/"* "$HOME/.local/share/Trash/info/"* "$HOME/.Trash/"* 2>/dev/null || true
          if sudo -n true 2>/dev/null; then sudo -n apt-get clean >/dev/null 2>&1 || true; fi
          after=$(df -B1 / | awk 'NR==2{print $3}')
          echo "freed_bytes=$((before-after))"
          pgrep -af 'ibgateway|tws|heptatrader|paper.*trade|runner' | head -n 30 || true
          df -h /

  mac-clean:
    name: Clean Mac caches
    runs-on: [self-hosted, macOS, ARM64, macbook]
    timeout-minutes: 15
    steps:
      - name: Conservative cache cleanup
        shell: bash
        run: |
          set -u
          test "$RUNNER_NAME" = macbook-pro
          before=$(df -k / | awk 'NR==2{print $3}')
          for root in "$HOME/.cache" "$HOME/Library/Caches"; do
            [ -d "$root" ] || continue
            find "$root" -mindepth 1 -maxdepth 1 -print0 | while IFS= read -r -d '' p; do
              b=$(basename "$p"); l=$(printf '%s' "$b" | tr '[:upper:]' '[:lower:]')
              case "$l" in
                *commander*|*desktop*commander*|codex-runtimes|codex|com.openai.*|openai-*|ollama|dotslash) continue ;;
              esac
              rm -rf -- "$p"
            done
          done
          rm -rf -- "$HOME/.npm/_cacache" "$HOME/.npm/_npx" "$HOME/.npm/_logs" 2>/dev/null || true
          rm -rf -- "$HOME/.Trash/"* 2>/dev/null || true
          for pat in '.test-helper-migration-*' '.activation-postflight-*' '.maintenance-v2-runtime-test-*' '.maintenance-plan-*' '.pre-scope-bootstrap-test-*' '.authbus-domain-candidate-integration-*' '.test-nested-ssh-bootstrap-*' 'pinned-node-runtime-test-*' '.controller-root-bootstrap-*' '.domain-authority-root-test-*' '.observer-read-v2-test.*' '.production-activation-inputs-*' '.mac-static-*'; do
            for p in "$HOME"/$pat; do [ -e "$p" ] || continue; rm -rf -- "$p"; done
          done
          after=$(df -k / | awk 'NR==2{print $3}')
          echo "freed_kb=$((before-after))"
          df -h /

  x230-via-rog:
    name: Clean x230 over tailnet from ROG
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 10
    needs: rog-clean
    steps:
      - name: Clean x230 caches if SSH key is already authorized
        shell: bash
        run: |
          set -u
          test "$RUNNER_NAME" = rog
          KH="$RUNNER_TEMP/x230_known_hosts"
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KH" qian@100.97.179.109 'bash -s' <<'EOS'
          set -u
          before=$(df -B1 / | awk 'NR==2{print $3}')
          cache="$HOME/.cache"
          if [ -d "$cache" ]; then
            find "$cache" -mindepth 1 -maxdepth 1 -print0 | while IFS= read -r -d '' p; do
              b=$(basename "$p"); l=$(printf '%s' "$b" | tr '[:upper:]' '[:lower:]')
              case "$l" in *commander*|*desktop*commander*|codex-runtimes|codex|openai-*|openclaw*|dotslash) continue ;; esac
              rm -rf -- "$p"
            done
          fi
          rm -rf -- "$HOME/.npm/_cacache" "$HOME/.npm/_npx" "$HOME/.npm/_logs" 2>/dev/null || true
          rm -rf -- "$HOME/.local/share/Trash/files/"* "$HOME/.local/share/Trash/info/"* "$HOME/.Trash/"* 2>/dev/null || true
          if sudo -n true 2>/dev/null; then sudo -n apt-get clean >/dev/null 2>&1 || true; fi
          after=$(df -B1 / | awk 'NR==2{print $3}')
          echo "freed_bytes=$((before-after))"
          df -h /
          EOS
