name: Native NDU four-weight interval scaling research
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-ndu/research/native_stem_abcd/width4_interval/**'
      - '.github/workflows/hepta-native-ndu-width4-interval.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  width4-complete-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout selected exact HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Pin numerical dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run math tests, exact certificates, 120 fits, independent audit and tamper suite
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/codex-rs/hepta-ndu/research/native_stem_abcd/width4_interval"
          OUT="$RUNNER_TEMP/ndu-width4"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/HEAD.txt"
          python -m pip freeze > "$OUT/ENVIRONMENT.txt"
          (cd "$SRC" && python -m unittest -v test_math) 2>&1 | tee "$OUT/MATH_TESTS.log"
          for WIDTH in 2 3 4; do
            python "$SRC/global_interval.py" --width "$WIDTH" --out "$OUT/cert_w$WIDTH" 2>&1 | tee "$OUT/CERT_W$WIDTH.log"
          done
          python "$SRC/run.py" sweep --out "$OUT/runs" 2>&1 | tee "$OUT/SWEEP.log"
          python "$SRC/audit/verify.py" --source "$SRC" --runs "$OUT/runs" --cert "$OUT" --out "$OUT/verified" 2>&1 | tee "$OUT/AUDIT.log"
          R21_SOURCE="$SRC" R21_RUNS="$OUT/runs" R21_CERT="$OUT" PYTHONPATH="$SRC" python -O -m unittest -v audit.test_tamper 2>&1 | tee "$OUT/TAMPER.log"
      - name: Retain complete positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-width4-r21-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndu-width4
          if-no-files-found: error
          retention-days: 14
