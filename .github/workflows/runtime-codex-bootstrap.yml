name: runtime.codex closure bootstrap

on:
  push:
    branches:
      - runtime-codex/closure-20260928

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: runtime-codex/closure-20260928
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Decode and apply closure transformation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/runtime_codex_closure.py.gz.b64 | gzip -d > /tmp/runtime_codex_closure.py
          chmod +x /tmp/runtime_codex_closure.py
          python3 /tmp/runtime_codex_closure.py
          python3 scripts/runtime-codex-qualification.py verify
          cargo fmt --all
          git diff --check
      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-codex-bootstrap.yml
          rm -f .github/runtime_codex_closure.py.gz.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'runtime.codex: close pre-effect ownership and qualification'
          git push origin HEAD:runtime-codex/closure-20260928
