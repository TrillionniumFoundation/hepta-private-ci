name: runtime.codex closure bootstrap

on:
  push:
    branches:
      - runtime-codex/closure-20260928
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: runtime-codex/closure-20260928
          fetch-depth: 0
          persist-credentials: true
      - name: Decode closure transformation and retain diagnostics
        shell: bash
        run: |
          set -u
          base64 -d .github/runtime_codex_closure.py.gz.b64 | gzip -d > .github/runtime_codex_closure.py
          python3 -m py_compile .github/runtime_codex_closure.py > .github/runtime_codex_closure.log 2>&1
          status=$?
          if [[ $status -eq 0 ]]; then
            python3 .github/runtime_codex_closure.py >> .github/runtime_codex_closure.log 2>&1
            status=$?
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'runtime.codex: retain closure transformation diagnostics' || true
          git push origin HEAD:runtime-codex/closure-20260928
          exit "$status"
