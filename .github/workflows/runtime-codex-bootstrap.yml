name: Inspect archived runtime.codex source payloads

on:
  workflow_dispatch:
    inputs:
      inspect_archive:
        description: Inspect preserved payload hashes and Python syntax
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_archive
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect without executing archived transformations
        run: |
          python3 -B .github/scripts/inspect_runtime_codex_archive.py \
            --report "$RUNNER_TEMP/runtime-codex-archive-inspection.json"
      - name: Retain the inspection result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-codex-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-codex-archive-inspection.json
          if-no-files-found: error
          retention-days: 14
