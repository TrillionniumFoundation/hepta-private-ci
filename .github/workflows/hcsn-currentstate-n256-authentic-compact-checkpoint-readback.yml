name: hcsn-currentstate-n256-authentic-compact-checkpoint-readback

on:
  pull_request:
    paths:
      - "qualification/hcsn_ci_readbacks/6948/**"
      - ".github/workflows/hcsn-currentstate-n256-authentic-compact-checkpoint-readback.yml"

permissions:
  contents: read

jobs:
  exact-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 qualification/hcsn_ci_readbacks/6948/verify_source.py
      - run: python3 qualification/hcsn_ci_readbacks/6948/verify_readback.py
      - run: python3 -O qualification/hcsn_ci_readbacks/6948/verify_readback.py
      - run: python3 -m py_compile qualification/hcsn_ci_readbacks/6948/*.py
