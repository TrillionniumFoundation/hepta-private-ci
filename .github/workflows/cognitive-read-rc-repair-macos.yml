        if scoped_source_path(path) and path != "docs/modules/cognitive.read/IMPLEMENTATION_MAP.json"
    }
    missing = sorted(required.difference(objects))
    if missing:
        raise SystemExit(f"closed-world cognitive.read source paths are unmapped: {missing}")
    declared = mapping.get("closedWorldSourcePaths")
    if declared != sorted(objects):
        raise SystemExit("closedWorldSourcePaths must exactly equal sorted sourceObjects paths")
