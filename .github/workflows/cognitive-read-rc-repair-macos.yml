        "operation_latency_includes_lock_wait_and_transaction": true,
        "remember": distribution(remember_us),
        "correct": distribution(correct_us),
        "forget": distribution(forget_us),
    });
    fs::write(output_path, serde_json::to_vec_pretty(&report)?)?;
    Ok(())
}
