async fn expect_witness_reopen_failure(
    layout: &codex_hepta_paths::HeptaAgentLayout,
    expected: &str,
) -> TestResult {
    match CognitiveStore::open(layout).await {
        Ok(_) => Err("tampered Lane C witness store reopened".into()),
        Err(error) => {
            assert!(
                error.to_string().contains(expected),
                "unexpected reopen error: {error}"
            );
            Ok(())
        }
    }
}

async fn seed_witness_head(
    layout: &codex_hepta_paths::HeptaAgentLayout,
    owner: &AgentId,
    suffix: &str,
) -> TestResult {
    let store = CognitiveStore::open(layout).await?;
    let access = CognitiveAccess::agent_private(owner.clone());
    let scope = CognitiveScope::AgentPrivate;
    let citation = store
        .append_source(
            &access,
            &SourceDraft {
                scope: scope.clone(),
                kind: LedgerSourceKind::ExplicitMemoryDirective,
                event_key: format!("lane-c-reopen-source-{suffix}"),
                content: format!("lane c reopen {suffix}").into_bytes(),
                observed_at_unix_seconds: 100,
            },
        )
        .await?;
    store
        .remember_memory(
            &access,
            &MemoryDraft {
                stable_key: format!("lane-c-reopen-memory-{suffix}"),
                revision: MemoryRevisionDraft {
                    scope,
                    content: format!("lane c reopen memory {suffix}"),
                    verification: MemoryVerification::Verified,
                    lifecycle: MemoryLifecycleState::Active,
                    valid_from_unix_seconds: 100,
                    valid_to_unix_seconds: None,
                    citations: vec![citation],
                },
            },
        )
        .await?;
    drop(store);
    Ok(())
}

#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
async fn lane_c_reopen_rejects_dropped_required_witness_trigger() -> TestResult {
    let temp = tempfile::tempdir()?;
    let fleet_path = temp.path().join("fleet");
    fs::create_dir_all(&fleet_path)?;
    let owner = AgentId::parse("00000000-0000-4000-8000-000000000520")?;
    let layout = HeptaFleetRoot::parse(fleet_path)?.layout().agent(&owner);
    let store = CognitiveStore::open(&layout).await?;
    drop(store);
    let pool = raw_pool(&layout.cognitive_root().join("cognitive_1.sqlite3"), false).await?;
    sqlx::query("DROP TRIGGER lane_c_source_witness_after_insert")
        .execute(&pool)
        .await?;
    pool.close().await;
    expect_witness_reopen_failure(&layout, "required cognitive schema object").await
}

