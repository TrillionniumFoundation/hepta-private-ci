                        observed_at_unix_seconds: 100,
                    },
                )
                .await?,
        );
    }

    let mut remember_us = Vec::with_capacity(records);
    let mut heads = Vec::<MemoryRevisionRecord>::with_capacity(records);
    for index in 0..records {
        let started = Instant::now();
        let record = store
            .remember_memory(
                &access,
                &MemoryDraft {
                    stable_key: format!("write-capacity-{index:07}"),
                    revision: MemoryRevisionDraft {
                        scope: scope.clone(),
                        content: format!("write capacity record {index:07}"),
                        verification: MemoryVerification::Verified,
                        lifecycle: MemoryLifecycleState::Active,
                        valid_from_unix_seconds: 100,
                        valid_to_unix_seconds: None,
                        citations: citations.clone(),
                    },
                },
            )
            .await?;
        remember_us.push(micros(started));
        heads.push(record);
    }

    let mut correct_us = Vec::with_capacity(MUTATION_SAMPLES);
