from __future__ import annotations

import argparse
import json
import os
from pathlib import Path
import re
import subprocess

ROOT = Path(__file__).resolve().parents[1]
MAP = ROOT / "docs/modules/cognitive.read/IMPLEMENTATION_MAP.json"
HEX = re.compile(r"[0-9a-f]{40}")


def git(*args: str) -> str:
    env = {key: value for key, value in os.environ.items() if not key.startswith("GIT_")}
    env.update(GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM="1", GIT_NO_REPLACE_OBJECTS="1")
    return subprocess.check_output(["git", "--literal-pathspecs", *args], cwd=ROOT, env=env, text=True).strip()


def exists(commit: str, path: str) -> bool:
    return subprocess.run(["git", "cat-file", "-e", f"{commit}:{path}"], cwd=ROOT,
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0


def scoped(path: str) -> bool:
    prefixes = (
        "codex-rs/hepta-cognitive-read/", "codex-rs/hepta-cognitive-types/",
        "codex-rs/hepta-cognitive-store/", "codex-rs/hepta-memory/",
        "codex-rs/hepta-agentd/", "codex-rs/hepta-agent-protocol/",
        "codex-rs/hepta-infer-core/", "codex-rs/hepta-infer-worker-host/",
        "codex-rs/hepta-learning-ledger/", "codex-rs/hepta-compact-engine/",
        "codex-rs/hepta-context-compiler/", "qualification/cognitive-read/",
        "docs/modules/cognitive.read/",
    )
    if path.startswith(prefixes):
        return path != "docs/modules/cognitive.read/IMPLEMENTATION_MAP.json"
    return (
        path in {"codex-rs/Cargo.toml", "codex-rs/Cargo.lock",
                 ".github/workflows/cognitive-read-qualification.yml"}
        or path.startswith("scripts/cognitive_read")
        or path.startswith("scripts/verify-cognitive-read")
        or path == "scripts/generate_cognitive_read_candidate.py"
    )


def refresh_blobs(node: object, source: str) -> None:
    if isinstance(node, dict):
        path = node.get("sourcePath")
        if isinstance(path, str) and "sourceBlob" in node:
            if not exists(source, path):
                raise SystemExit(f"mapped operation source is absent: {path}")
            node["sourceBlob"] = git("rev-parse", f"{source}:{path}")
        for value in node.values():
            refresh_blobs(value, source)
    elif isinstance(node, list):
        for value in node:
            refresh_blobs(value, source)


def generate(source: str, base: str) -> dict[str, object]:
    if HEX.fullmatch(source) is None or HEX.fullmatch(base) is None:
        raise SystemExit("source/base must be complete lowercase SHAs")
    git("merge-base", "--is-ancestor", base, source)
    value = json.loads(MAP.read_text(encoding="utf-8"))
    source_identity = {"commit": source, "tree": git("rev-parse", f"{source}^{{tree}}")}
    base_identity = {"commit": base, "tree": git("rev-parse", f"{base}^{{tree}}")}
    value["sourceBase"] = source_identity
    value["observedAtHead"] = source_identity
    value["observedImplementationBase"] = {
        **base_identity,
        "interpretation": "exact pull-request base used for closed-world cognitive.read source coverage",
    }
    value["mappingSourceIdentityMode"] = "exact_blob"
    value["sourceIdentityMode"] = "repository_baseline_plus_exact_head_objects"

    existing = {
        row["path"] for row in value.get("sourceObjects", [])
        if isinstance(row, dict) and isinstance(row.get("path"), str)
    }
    changed = git("diff", "--name-only", base, source).splitlines()
    required = {path for path in changed if scoped(path) and exists(source, path)}
    paths = sorted(path for path in existing.union(required) if exists(source, path))
    value["sourceObjects"] = [
        {"path": path, "object": git("rev-parse", f"{source}:{path}")}
        for path in paths
    ]
    value["closedWorldSourcePaths"] = paths
    evidence = value.get("exactSourceEvidence")
    if isinstance(evidence, dict):
        evidence["kind"] = "path_blob_manifest_v1"
        evidence["entries"] = [
            {"path": row["path"], "blobSha": row["object"]}
            for row in value["sourceObjects"]
        ]
    refresh_blobs(value, source)
    value["productionImplementation"] = False
    value["productExecutionProved"] = False
    boundary = value.get("claimBoundary")
    if isinstance(boundary, dict):
        for key in ("productionImplementation", "productExecutionProved",
                    "independentAcceptance", "activation", "release"):
            boundary[key] = False
    return value


def write_pr_body(path: Path, source: str, candidate: str) -> None:
    consumers = json.loads((ROOT / "docs/modules/cognitive.read/CONSUMER_EXECUTION.json").read_text())
    source_tree = git("rev-parse", f"{source}^{{tree}}")
