    let pick = |percent: usize| {
        let index = ((values.len() - 1) * percent).div_ceil(100);
        values[index.min(values.len() - 1)]
    };
    json!({
        "p50_us": pick(50),
        "p95_us": pick(95),
        "p99_us": pick(99),
    })
