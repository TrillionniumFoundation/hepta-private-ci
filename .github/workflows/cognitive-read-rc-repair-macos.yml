#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
async fn lane_c_reopen_audit_rejects_missing_head_validity_row() -> TestResult {
    let temp = tempfile::tempdir()?;
    let fleet_path = temp.path().join("fleet");
    fs::create_dir_all(&fleet_path)?;
    let owner = AgentId::parse("00000000-0000-4000-8000-000000000522")?;
    let layout = HeptaFleetRoot::parse(fleet_path)?.layout().agent(&owner);
    seed_witness_head(&layout, &owner, "validity").await?;
    let pool = raw_pool(&layout.cognitive_root().join("cognitive_1.sqlite3"), false).await?;
    let guard_sql: String = sqlx::query_scalar(
        "SELECT sql FROM sqlite_schema
         WHERE name = 'lane_c_head_validity_direct_delete_guard'",
    )
    .fetch_one(&pool)
    .await?;
    sqlx::query("DROP TRIGGER lane_c_head_validity_direct_delete_guard")
        .execute(&pool)
        .await?;
    sqlx::query("DELETE FROM lane_c_head_validity")
        .execute(&pool)
        .await?;
    sqlx::query(&guard_sql).execute(&pool).await?;
    pool.close().await;
    expect_witness_reopen_failure(&layout, "Lane C witness audit detected").await
}

#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
