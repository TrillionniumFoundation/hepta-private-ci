Converges `cognitive.read` through the existing SQLite owner, Agentd and native-worker boundaries without a second durable owner, authorization cache or admitted wire protocol.

### Frozen candidate identity

- source commit: `{source}`
- source tree: `{source_tree}`
- documentation-only exact-map child: `{candidate}`
- candidate tree: `{candidate_tree}`

The child changes only `docs/modules/cognitive.read/IMPLEMENTATION_MAP.json`. The map is generated by `scripts/generate_cognitive_read_candidate.py`, binds every mapped path to the frozen source object, and verifies closed-world coverage relative to the exact PR base.

## Correctness closure in this candidate

- qualification runner and verifier both use `cognitive_read_release_evidence.py`;
- all mutable/self-pushing cognitive.read repair workflows are absent from the frozen candidate;
- every Lane C witness table, index, view and trigger is in the fixed schema oracle;
- every store open/recovery runs both independent witness audit views;
