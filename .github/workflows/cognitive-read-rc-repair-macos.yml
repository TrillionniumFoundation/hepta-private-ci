            )
            .await?;
        correct_us.push(micros(started));
    }

    let mut forget_us = Vec::with_capacity(MUTATION_SAMPLES);
    for index in MUTATION_SAMPLES..MUTATION_SAMPLES * 2 {
        let current = heads[index].clone();
        let started = Instant::now();
        heads[index] = store
