name: Cognitive read final immutable convergence

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
    paths:
      - ".github/workflows/cognitive-read-rc-repair-macos.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cognitive-read-final-immutable-convergence
  cancel-in-progress: false

jobs:
  converge:
    name: Produce frozen source and exact map child
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_PARENT: a3a3f426a06e524a1988367b41025b8c11856edb
      BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
      TARGET_BRANCH: work/cognitive-read-production-convergence-20260927
      RUST_MIN_STACK: "8388608"
      CARGO_TERM_COLOR: never
      NO_COLOR: "1"
    steps:
      - name: Check out exact repair carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove carrier identity and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = ".github/workflows/cognitive-read-rc-repair-macos.yml"

      - name: Prepare repository tools
        uses: ./.github/actions/setup-ci

      - name: Install pinned nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103

      - name: Configure source author
        shell: bash
        run: |
          git config user.name "Cognitive Read Convergence"
          git config user.email "cognitive-read-convergence@users.noreply.github.com"

      - name: Apply correctness, evidence and closed-world fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import sqlite3
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: Path, old: str, new: str) -> None:
              body = path.read_text(encoding="utf-8")
              if body.count(old) != 1:
                  raise SystemExit(f"{path}: expected one replacement marker, found {body.count(old)}")
              path.write_text(body.replace(old, new, 1), encoding="utf-8")

          # Qualification is release-candidate evidence; the verifier must inspect
          # the same release wrapper rather than its full-suite predecessor.
          constants = ROOT / "scripts/verify-cognitive-read-constants.py"
          replace_once(
              constants,
              'exec python3 scripts/cognitive_read_full_evidence.py "$@"',
              'exec python3 scripts/cognitive_read_release_evidence.py "$@"',
          )
          body = constants.read_text(encoding="utf-8")
          workflow_guard = '''\n    workflow_root = ROOT / ".github/workflows"\n    mutable = []\n    for candidate in sorted(workflow_root.glob("*cognitive*read*.yml")):\n        text = candidate.read_text(encoding="utf-8")\n        if "contents: write" in text or re.search(r"(?m)^\\s*git push(?:\\s|$)", text):\n            mutable.append(str(candidate.relative_to(ROOT)))\n    if mutable:\n        raise ValueError(f"cognitive.read qualification candidate contains mutable workflows: {mutable}")\n'''
          marker = '    if "contents: write" in read(workflow_path) or "git push" in read(workflow_path):\n        raise ValueError("qualification may not write repository source")\n'
          if workflow_guard.strip() not in body:
              if marker not in body:
                  raise SystemExit("qualification workflow guard marker missing")
              body = body.replace(marker, marker + workflow_guard, 1)
              constants.write_text(body, encoding="utf-8")

          # Build an empty current schema with the exact migration SQL, discover
          # every Lane C witness object, and bind it into the fixed schema oracle.
          connection = sqlite3.connect(":memory:")
          connection.execute("PRAGMA foreign_keys = ON")
          for migration in sorted((ROOT / "codex-rs/hepta-memory/migrations").glob("*.sql")):
              try:
                  connection.executescript(migration.read_text(encoding="utf-8"))
              except sqlite3.Error as error:
                  raise SystemExit(f"failed to execute {migration}: {error}") from error
          witness_objects = connection.execute(
              "SELECT name, type, sql FROM sqlite_schema "
              "WHERE name GLOB 'lane_c_*' AND type IN ('table','index','view','trigger') "
              "ORDER BY name"
          ).fetchall()
          if not witness_objects:
              raise SystemExit("no Lane C witness schema objects discovered")

          store_path = ROOT / "codex-rs/hepta-memory/src/cognitive_store.rs"
          store = store_path.read_text(encoding="utf-8")
          start = store.index('const REQUIRED_SCHEMA_OBJECTS: &[(&str, &str)] = &[')
          finish_marker = '];\nconst REQUIRED_SCHEMA_ORACLE_SHA256: &str ='
          finish = store.index(finish_marker, start)
          block = store[start:finish]
          pair_pattern = re.compile(r'\(\s*"([^"]+)"\s*,\s*"([^"]+)"\s*,?\s*\)', re.DOTALL)
          pairs = pair_pattern.findall(block)
          existing = {name for name, _ in pairs}
          additions = [
              f'    ("{name}", "{kind}"),\n'
              for name, kind, _ in witness_objects
              if name not in existing
          ]
          if additions:
              store = store[:finish] + "".join(additions) + store[finish:]

          # Reparse the expanded list and reproduce cognitive_store.rs frame_part.
          start = store.index('const REQUIRED_SCHEMA_OBJECTS: &[(&str, &str)] = &[')
          finish = store.index(finish_marker, start)
          pairs = pair_pattern.findall(store[start:finish])
          if len({name for name, _ in pairs}) != len(pairs):
              raise SystemExit("duplicate required schema object")
          schema_rows = []
          for name, expected_type in pairs:
              row = connection.execute(
                  "SELECT type, sql FROM sqlite_schema WHERE name = ?", (name,)
              ).fetchone()
              if row is None or row[0] != expected_type or not row[1]:
                  raise SystemExit(f"required schema object mismatch while sealing: {name}")
              schema_rows.append((name, row[0], row[1]))
          schema_rows.sort(key=lambda row: row[0])

          digest = hashlib.sha256()
          def frame(part: bytes) -> None:
              digest.update(len(part).to_bytes(8, "big"))
              digest.update(part)
          frame(b"hepta:cognitive:required-schema-oracle:v1")
          frame(len(schema_rows).to_bytes(8, "big"))
          for name, kind, sql in schema_rows:
              frame(name.encode())
              frame(kind.encode())
              frame(sql.encode())
          oracle = digest.hexdigest()
          store, replacements = re.subn(
              r'(const REQUIRED_SCHEMA_ORACLE_SHA256: &str =\s*\n\s*")[0-9a-f]{64}(";)',
              rf'\g<1>{oracle}\2',
              store,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("schema oracle constant marker missing")

          audit = '''    let lane_c_witness_problems: i64 = sqlx::query_scalar(
        "SELECT (
             SELECT COUNT(*) FROM lane_c_scope_witness_audit
         ) + (
             SELECT COUNT(*) FROM lane_c_head_validity_audit
         )",
    )
    .fetch_one(pool)
    .await
    .map_err(|error| {
        CognitiveStoreError::Corrupt(format!(
            "Lane C witness audit is unavailable: {error}"
        ))
    })?;
    if lane_c_witness_problems != 0 {
        return Err(CognitiveStoreError::Corrupt(format!(
            "Lane C witness audit detected {lane_c_witness_problems} inconsistent rows"
        )));
    }
'''
          audit_marker = '''    let row = sqlx::query(
        "SELECT schema_version, owner_agent_id FROM cognitive_meta WHERE singleton = 1",
    )
'''
          if audit.strip() not in store:
              if store.count(audit_marker) != 1:
                  raise SystemExit("verify_store audit insertion marker missing")
              store = store.replace(audit_marker, audit + audit_marker, 1)
          store_path.write_text(store, encoding="utf-8")

          # The compaction owner samples a trusted clock again at publication,
          # enforces its observation window, and never reuses the acquisition time.
          compact_path = ROOT / "codex-rs/hepta-memory/src/cognitive_read_compact_product.rs"
          compact = compact_path.read_text(encoding="utf-8")
          compact = compact.replace(
              'use std::collections::BTreeSet;\n',
              'use std::collections::BTreeSet;\nuse std::time::SystemTime;\nuse std::time::UNIX_EPOCH;\n',
              1,
          )
          compact = compact.replace(
              'pub const COGNITIVE_READ_COMPACTION_PURPOSE_ID: &str = "purpose:cognitive-compaction";\n',
              'pub const COGNITIVE_READ_COMPACTION_PURPOSE_ID: &str = "purpose:cognitive-compaction";\nconst COMPACTION_OBSERVATION_WINDOW_MS: u64 = 5_000;\n',
              1,
          )
          compact = compact.replace(
              'let lease_expires_unix_ms = acquired_at_unix_ms.checked_add(1_000).ok_or_else(|| {',
              'let lease_expires_unix_ms = acquired_at_unix_ms\n            .checked_add(COMPACTION_OBSERVATION_WINDOW_MS)\n            .ok_or_else(|| {',
              1,
          )
          compact = compact.replace(
              '        #[cfg(test)]\n        pause_before_compaction_revalidation_for_test().await;\n        self.revalidate_lane_c_selection(access, scope, &selected, now_unix_seconds)\n            .await?;\n',
              '''        #[cfg(test)]
        pause_before_compaction_revalidation_for_test().await;
        let final_now_unix_seconds =
            compaction_final_revalidation_time(now_unix_seconds)?;
        let final_now_unix_ms = u64::try_from(final_now_unix_seconds)
            .map_err(|error| CognitiveStoreError::Invalid(error.to_string()))?
            .checked_mul(1_000)
            .ok_or_else(|| {
                CognitiveStoreError::Invalid(
                    "cognitive compaction final-use time overflow".to_string(),
                )
            })?;
        if final_now_unix_ms >= lease_expires_unix_ms {
            return Err(CognitiveStoreError::Conflict(
                "cognitive compaction owner observation expired before publication".to_string(),
            ));
        }
        self.revalidate_lane_c_selection(
            access,
            scope,
            &selected,
            final_now_unix_seconds,
        )
        .await?;
''',
              1,
          )
          clock_code = '''fn trusted_compaction_now_unix_seconds() -> Result<i64, CognitiveStoreError> {
    let seconds = SystemTime::now()
        .duration_since(UNIX_EPOCH)
        .map_err(|error| CognitiveStoreError::Unavailable(error.to_string()))?
        .as_secs();
    i64::try_from(seconds)
        .map_err(|error| CognitiveStoreError::Unavailable(error.to_string()))
}

#[cfg(test)]
static COMPACTION_FINAL_REVALIDATION_TIME: std::sync::OnceLock<
    std::sync::Mutex<Option<i64>>,
> = std::sync::OnceLock::new();

#[cfg(test)]
fn set_compaction_final_revalidation_time_for_test(value: i64) {
    *COMPACTION_FINAL_REVALIDATION_TIME
        .get_or_init(|| std::sync::Mutex::new(None))
        .lock()
        .expect("compaction final-use clock lock") = Some(value);
}

fn compaction_final_revalidation_time(
    acquisition_time: i64,
) -> Result<i64, CognitiveStoreError> {
    #[cfg(test)]
    {
        return Ok(COMPACTION_FINAL_REVALIDATION_TIME
            .get_or_init(|| std::sync::Mutex::new(None))
            .lock()
            .expect("compaction final-use clock lock")
            .take()
            .unwrap_or(acquisition_time));
    }
    #[cfg(not(test))]
    {
        let _ = acquisition_time;
        trusted_compaction_now_unix_seconds()
    }
}

