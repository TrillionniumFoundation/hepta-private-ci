name: cognitive-types-remediation-bootstrap

on:
  push:
    branches:
      - codex/cognitive-types-full-closure-20260927
    paths:
      - '.github/workflows/cognitive-types-remediation-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-types-remediation-bootstrap
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed source patch
        run: |
          set -euo pipefail
          python3 scripts/remediate_cognitive_types_final_use.py
          python3 -m unittest discover -s qualification/cognitive-types-v1 -p 'test_*.py'
          python3 qualification/cognitive-types-v1/render_traceability.py --check
          python3 scripts/hepta-hnmf.py verify

      - name: Format and qualify the core plus normal product consumers
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add rustfmt clippy
          cd codex-rs
          cargo fmt \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-compact-engine \
            -p codex-hepta-intelligence \
            -p codex-hepta-agentd
          cargo check --locked --all-targets \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-compact-engine \
            -p codex-hepta-intelligence \
            -p codex-hepta-agentd
          cargo test --locked --no-fail-fast \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-compact-engine \
            -p codex-hepta-intelligence
          cargo clippy --locked --all-targets \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-compact-engine \
            -p codex-hepta-intelligence \
            -p codex-hepta-agentd \
            -- -D warnings
          cd ..
          git diff --check

      - name: Commit the verified patch and remove the bootstrap
        env:
          TARGET_BRANCH: codex/cognitive-types-full-closure-20260927
        run: |
          set -euo pipefail
          rm -f scripts/remediate_cognitive_types_final_use.py
          rm -f .github/workflows/cognitive-types-remediation-bootstrap.yml
          git config user.name 'cognitive-types remediation'
          git config user.email 'cognitive-types-remediation@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(cognitive.types): centralize final-use consumer revalidation'
          git push origin "HEAD:${TARGET_BRANCH}"
