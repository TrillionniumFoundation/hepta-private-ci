name: Hepta PR515 blocker diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - ops/hepta-pr515-blocker-diagnostic-20260910

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Locate evidence producers and consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== producers/consumers outside generated qualification payloads ==='
          git grep -n -E \
            'archived_job_logs|prepared_by_run|FINAL_QUALIFIED_STATUS|global-gap-closure-final-r[68]|PREPARE\.json|children.*channel_states|channel_states.*children' \
            -- \
            . \
            ':!qualification/**' \
            ':!.github/workflows/hepta-pr515-blocker-diagnostic.yml' \
            | head -400 || true

          echo '=== likely convergence scripts/workflows ==='
          find .github/workflows scripts convergence -type f \
            \( -iname '*closure*' -o -iname '*converg*' -o -iname '*qualif*' -o -iname '*archive*' \) \
            -print | sort | head -400

          echo '=== exact references in bounded text artifacts ==='
          git grep -n -E \
            'STATUS\.json|PREPARE\.json|FINAL_QUALIFIED_STATUS\.json' \
            -- \
            'qualification/**/*.md' \
            'qualification/**/*.json' \
            ':!qualification/global-gap-closure-final-r6/STATUS.json' \
            ':!qualification/global-gap-closure-final-r8/receipts/PREPARE.json' \
            | head -400 || true

      - name: Inspect repository validation entrypoints
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            scripts/hepta-readiness.py \
            scripts/hepta-docs.py \
            scripts/check_blob_size.py
          do
            echo "=== $file ==="
            grep -n -E 'qualification|STATUS|PREPARE|receipt|json' "$file" | head -160 || true
          done

      - name: Confirm checkout remains clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
