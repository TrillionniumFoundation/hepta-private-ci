name: Kernel evidence native convergence repair 20260928

on:
  push:
    branches:
      - fix/kernel-evidence-production-closure
    paths:
      - .github/workflows/kernel-evidence-live-fix-20260928.yml

permissions:
  contents: write

concurrency:
  group: kernel-evidence-live-fix-diagnostics-20260928
  cancel-in-progress: false

jobs:
  repair-test-and-push:
    if: ${{ contains(github.event.head_commit.message, '[kernel-evidence-native-repair]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out latest fast-forward closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/kernel-evidence-production-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Verify audited source ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 99419dedbd83684cc7a9ace31a2fb6ece0d9140f HEAD
          test "$(git status --porcelain)" = ""

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt,clippy

      - name: Apply exact native compile and lint repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              text = read(path)
              observed = text.count(old)
              if observed != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} exact matches, observed {observed}: {old[:160]!r}"
                  )
              write(path, text.replace(old, new, expected))

          def replace_regex(path: str, pattern: str, replacement: str, expected: int) -> None:
              text = read(path)
              updated, observed = re.subn(pattern, replacement, text, flags=re.S)
              if observed != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} regex matches, observed {observed}: {pattern}"
                  )
              write(path, updated)

          qualification = "codex-rs/hepta-evidence/src/qualification.rs"
          replace_regex(
              qualification,
              r"sqlx::query\(&format!\((.*?)\)\)",
              r"sqlx::query(sqlx::AssertSqlSafe(format!(\1)))",
              4,
          )

          replace_exact(
              "codex-rs/hepta-evidence/src/qualification_commitment.rs",
              "sqlx::query(&statement)",
              "sqlx::query(sqlx::AssertSqlSafe(statement))",
          )
          replace_exact(
              "codex-rs/hepta-evidence/src/recovery_snapshot.rs",
              "sqlx::query(&statement)",
              "sqlx::query(sqlx::AssertSqlSafe(statement))",
          )

          runtime = "codex-rs/hepta-evidence/src/store/runtime.rs"
          replace_exact(
              runtime,
              "sqlx::query(statement).execute(&store.pool).await",
              "sqlx::query(sqlx::AssertSqlSafe(statement))\n            .execute(&store.pool)\n            .await",
          )
          replace_exact(
              runtime,
              "sqlx::query_scalar(&format!(\"PRAGMA max_page_count = {requested_limit}\"))",
              "sqlx::query_scalar(sqlx::AssertSqlSafe(format!(\n                \"PRAGMA max_page_count = {requested_limit}\"\n            )))",
          )

          segmented = "codex-rs/hepta-evidence/src/frontier_backend_file/segmented/tests.rs"
          replace_exact(
              segmented,
              """            std::fs::set_permissions(&identity_path, std::fs::Permissions::from_mode(0o600))
                .unwrap();
            Self {""",
              """            std::fs::set_permissions(&identity_path, std::fs::Permissions::from_mode(0o600))
                .unwrap();
            let local_root = local.path().canonicalize().unwrap();
            Self {""",
          )
          replace_exact(
              segmented,
              "                local_root: local.path().canonicalize().unwrap(),",
              "                local_root,",
          )
          replace_exact(segmented, "for generation in 1..=6 {", "for generation in 1_u64..=6 {", 2)
          replace_exact(segmented, "for generation in 1..=5 {", "for generation in 1_u64..=5 {")

          destination = "codex-rs/hepta-operations/src/destination_dedupe.rs"
          replace_exact(
              destination,
              """    pub async fn open_standalone(path: &Path) -> Result<Self, DurableOperationError> {""",
              """    #[expect(
        clippy::disallowed_methods,
        reason = "standalone qualification store owns this isolated SQLite pool; product owners inject an already-migrated pool"
    )]
    pub async fn open_standalone(path: &Path) -> Result<Self, DurableOperationError> {""",
          )

          durable = "codex-rs/hepta-operations/src/durable_store.rs"
          replace_exact(
              durable,
              """    pub async fn open(path: &Path) -> Result<Self, DurableOperationError> {""",
              """    #[expect(
        clippy::disallowed_methods,
        reason = "the durable operation ledger owns this standalone SQLite lineage and has no codex-state home binding"
    )]
    pub async fn open(path: &Path) -> Result<Self, DurableOperationError> {""",
          )
          replace_exact(
              durable,
              """        if let Some(status) = load_outbox_tx(
            &mut tx,
            &operation.intent.destination,
            scope_id,
            operation_id,
        )
        .await?
        {
            if status.state != DurableOutboxState::Acknowledged {
                let fence = status
                    .fence
                    .checked_add(1)
                    .ok_or(DurableOperationError::Capacity)?;
                sqlx::query(
                    "UPDATE cross_owner_outbox SET state = 'acked', fence = ?, worker_id = NULL,
                     lease_until_ms = NULL, acknowledgement_digest = ?, updated_at_ms = ?,
                     terminal_at_ms = COALESCE(terminal_at_ms, ?)
                     WHERE destination = ? AND scope_id = ? AND operation_id = ?",
                )
                .bind(to_i64(fence)?)
                .bind(receipt.evidence_digest.as_array().as_slice())
                .bind(now)
                .bind(now)
                .bind(operation.intent.destination.as_str())
                .bind(scope_id.as_str())
                .bind(operation_id.as_str())
                .execute(&mut *tx)
                .await
                .map_err(sqlx_error)?;
            }
        }""",
              """        if let Some(status) = load_outbox_tx(
            &mut tx,
            &operation.intent.destination,
            scope_id,
            operation_id,
        )
        .await?
            && status.state != DurableOutboxState::Acknowledged
        {
            let fence = status
                .fence
                .checked_add(1)
                .ok_or(DurableOperationError::Capacity)?;
            sqlx::query(
                "UPDATE cross_owner_outbox SET state = 'acked', fence = ?, worker_id = NULL,
                 lease_until_ms = NULL, acknowledgement_digest = ?, updated_at_ms = ?,
                 terminal_at_ms = COALESCE(terminal_at_ms, ?)
                 WHERE destination = ? AND scope_id = ? AND operation_id = ?",
            )
            .bind(to_i64(fence)?)
            .bind(receipt.evidence_digest.as_array().as_slice())
            .bind(now)
            .bind(now)
            .bind(operation.intent.destination.as_str())
            .bind(scope_id.as_str())
            .bind(operation_id.as_str())
            .execute(&mut *tx)
            .await
            .map_err(sqlx_error)?;
        }""",
          )

          for obsolete in [
              "qualification/kernel-evidence/live-fix-20260928.patch.gz.b64",
              "qualification/kernel-evidence/live-fix-20260928.patch",
              "qualification/kernel-evidence/live-fix-20260928.patch-check.txt",
          ]:
              Path(obsolete).unlink(missing_ok=True)
          PY

          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Verify Lane A closed-world truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lane_a_foundation.py verify

      - name: Test kernel evidence native package
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-evidence

      - name: Test Agentd kernel evidence product surfaces
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-agentd \
            --lib \
            --test kernel_evidence_product \
            --test kernel_evidence_profile \
            --test kernel_evidence_paging_product \
            --test kernel_evidence_publication_cli

      - name: Build the named Agentd binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-agentd --bin codex-hepta-agentd

      - name: Commit and push verified native repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kernel-evidence-closure-bot"
          git config user.email "kernel-evidence-closure-bot@users.noreply.github.com"
          rm -f .github/workflows/kernel-evidence-live-fix-20260928.yml
          git add -A
          git commit -m "fix(kernel.evidence): restore native compile and product qualification [kernel-evidence-closure] [kernel-evidence-status-sync] [kernel-evidence-native-repaired]"
          git fetch origin fix/kernel-evidence-production-closure
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/fix/kernel-evidence-production-closure)"
          git push origin HEAD:fix/kernel-evidence-production-closure

      - name: Run strict scoped clippy on the pushed candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-evidence -p codex-hepta-agentd --all-targets -- -D warnings
