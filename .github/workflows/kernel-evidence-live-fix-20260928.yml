name: Kernel evidence native convergence repair 20260928

# One-shot final lint repair for the current kernel.evidence integration candidate.
on:
  push:
    branches:
      - fix/kernel-evidence-production-closure
    paths:
      - .github/workflows/kernel-evidence-live-fix-20260928.yml

permissions:
  contents: write

concurrency:
  group: kernel-evidence-live-fix-diagnostics-20260928
  cancel-in-progress: false

jobs:
  repair-test-and-push:
    if: ${{ contains(github.event.head_commit.message, '[kernel-evidence-native-repair]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out latest fast-forward closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/kernel-evidence-production-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Verify audited source ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 99419dedbd83684cc7a9ace31a2fb6ece0d9140f HEAD
          test "$(git status --porcelain)" = ""
          test -f scripts/kernel_evidence_native_repair_20260928.py

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt,clippy

      - name: Apply exact native compile and lint repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kernel_evidence_native_repair_20260928.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Verify Lane A closed-world truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lane_a_foundation.py verify

      - name: Test kernel evidence native package
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-evidence

      - name: Test Agentd kernel evidence product surfaces
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-agentd \
            --lib \
            --test kernel_evidence_product \
            --test kernel_evidence_profile \
            --test kernel_evidence_paging_product \
            --test kernel_evidence_publication_cli

      - name: Build the named Agentd binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-agentd --bin codex-hepta-agentd

      - name: Commit and push verified native repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kernel-evidence-closure-bot"
          git config user.email "kernel-evidence-closure-bot@users.noreply.github.com"
          rm -f .github/workflows/kernel-evidence-live-fix-20260928.yml
          rm -f scripts/kernel_evidence_native_repair_20260928.py
          git add -A
          git commit -m "fix(kernel.evidence): restore native compile and product qualification [kernel-evidence-closure] [kernel-evidence-status-sync] [kernel-evidence-native-repaired]"
          git fetch origin fix/kernel-evidence-production-closure
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/fix/kernel-evidence-production-closure)"
          git push origin HEAD:fix/kernel-evidence-production-closure

      - name: Run strict scoped clippy on the pushed candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-evidence -p codex-hepta-agentd --all-targets -- -D warnings
