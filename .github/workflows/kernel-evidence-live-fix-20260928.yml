name: Kernel evidence live fix diagnostics 20260928

on:
  push:
    branches:
      - fix/kernel-evidence-production-closure
    paths:
      - .github/workflows/kernel-evidence-live-fix-20260928.yml

permissions:
  contents: write

concurrency:
  group: kernel-evidence-live-fix-diagnostics-20260928
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ contains(github.event.head_commit.message, '[kernel-evidence-live-fix-debug]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/kernel-evidence-production-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize audited patch and exact dry-run diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 99419dedbd83684cc7a9ace31a2fb6ece0d9140f HEAD
          test -s qualification/kernel-evidence/live-fix-20260928.patch.gz.b64
          base64 --decode qualification/kernel-evidence/live-fix-20260928.patch.gz.b64 \
            | gzip -dc > qualification/kernel-evidence/live-fix-20260928.patch
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo
            set +e
            patch --dry-run --fuzz=0 --verbose -p1 \
              < qualification/kernel-evidence/live-fix-20260928.patch
            status=$?
            set -e
            echo
            echo "patch_dry_run_exit=$status"
          } > qualification/kernel-evidence/live-fix-20260928.patch-check.txt 2>&1

      - name: Commit diagnostic materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kernel-evidence-closure-bot"
          git config user.email "kernel-evidence-closure-bot@users.noreply.github.com"
          git add qualification/kernel-evidence/live-fix-20260928.patch \
            qualification/kernel-evidence/live-fix-20260928.patch-check.txt
          git commit -m "chore(kernel.evidence): materialize audited live-fix diagnostics [kernel-evidence-closure] [kernel-evidence-live-fix-debug-output]"
          git fetch origin fix/kernel-evidence-production-closure
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/fix/kernel-evidence-production-closure)"
          git push origin HEAD:fix/kernel-evidence-production-closure
