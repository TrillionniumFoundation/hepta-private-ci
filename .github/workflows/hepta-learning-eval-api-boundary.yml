name: Hepta learning.eval API boundary

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: hepta-learning-eval-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  api-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Verify generated current status
        run: python3 scripts/hepta-learning-eval-status.py verify

      - name: Verify closed public surface
        run: python3 scripts/hepta-learning-eval-api-boundary.py verify

      - name: Compile repository consumers
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-intelligence-eval
          -p codex-hepta-intelligence
          -p codex-hepta-agentd
          --all-targets

      - name: Prove raw decision API is externally unimportable
        run: python3 scripts/hepta-learning-eval-api-boundary.py compile-fail

      - name: Sealed admission and recovery fault matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/learning-eval
          : > .hepta-evidence/learning-eval/fault-injection.log
          for filter in \
            repository_admission \
            evidence_sink::tests \
            attempt_journal::tests \
            checkpoint_holdout_file::tests
          do
            printf 'filter=%s\n' "${filter}" | tee -a .hepta-evidence/learning-eval/fault-injection.log
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-intelligence-eval \
              "${filter}" -- --test-threads=1 \
              2>&1 | tee -a .hepta-evidence/learning-eval/fault-injection.log
          done

      - name: Maximum checkpoint recovery and disk budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/learning-eval
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-intelligence-eval \
            checkpoint_holdout_file::tests::maximum_checkpoint_recovery_capacity_profile \
            -- --ignored --exact --nocapture --test-threads=1 \
            2>&1 | tee .hepta-evidence/learning-eval/checkpoint-capacity.log
          grep -q 'HEPTA_CHECKPOINT_CAPACITY_JSON=' \
            .hepta-evidence/learning-eval/checkpoint-capacity.log

      - name: Emit exact-source resilience evidence
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          root = Path('.')
          evidence = root / '.hepta-evidence/learning-eval'
          evidence.mkdir(parents=True, exist_ok=True)

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          source_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          expected = os.environ['SOURCE_SHA']
          if source_sha != expected:
              raise SystemExit('source SHA mismatch')

          paths = {
              'privateApiCompileFail': evidence / 'private-api-compile-fail.stderr',
              'faultInjection': evidence / 'fault-injection.log',
              'checkpointCapacity': evidence / 'checkpoint-capacity.log',
              'currentState': root / 'docs/modules/learning.eval/CURRENT_STATE.json',
              'currentStatus': root / 'docs/modules/learning.eval/CURRENT_STATUS.md',
              'recoveryContract': root / 'codex-rs/hepta-intelligence-eval/RECOVERY_CONTRACT.md',
              'cargoLock': root / 'codex-rs/Cargo.lock',
          }
          missing = [str(path) for path in paths.values() if not path.is_file()]
          if missing:
              raise SystemExit('missing resilience evidence: ' + ', '.join(missing))
          payload = {
              'schema': 'hepta.learning-eval.resilience-evidence.v1',
              'sourceSha': source_sha,
              'sourceTree': source_tree,
              'workflowRunId': os.environ['RUN_ID'],
              'workflowRunAttempt': os.environ['RUN_ATTEMPT'],
              'createdAtUnixMicros': time.time_ns() // 1000,
              'checks': {
                  'rawSignedDecisionPrimitives': 'crate_private_compile_fail_verified',
                  'repositoryConsumers': ['agentd', 'plasticity', 'evaluated-shadow'],
                  'acceptedUnknownEvidencePublication': 'reconciled_or_indeterminate',
                  'evaluationAttemptJournal': 'fault_injection_passed',
                  'checkpointCompaction': 'fault_injection_passed',
                  'checkpointCapacity': 'maximum_configured_checkpoint_count_measured',
                  'authority': 'deny_all',
              },
              'artifacts': {
                  name: {
                      'path': str(path),
                      'sha256': digest(path),
                  }
                  for name, path in paths.items()
              },
          }
          target = evidence / 'resilience.json'
          target.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(target.read_text(encoding='utf-8'))
          PY

      - name: Strict boundary lint
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-intelligence-eval
          -p codex-hepta-intelligence
          -p codex-hepta-agentd
          --all-targets -- -D warnings

      - name: Formatting and clean source
        if: always()
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-intelligence \
            --package codex-hepta-agentd \
            -- --check
          git diff --check
          git diff --exit-code

      - name: Retain learning.eval resilience evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-eval-resilience-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/learning-eval/
          if-no-files-found: error
          retention-days: 30

      - name: Attest resilience evidence
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .hepta-evidence/learning-eval/resilience.json
