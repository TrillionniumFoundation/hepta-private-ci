name: Hepta learning.eval API boundary

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: hepta-learning-eval-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Verify closed public surface
        run: python3 scripts/hepta-learning-eval-api-boundary.py verify

      - name: Compile repository consumers
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-intelligence-eval
          -p codex-hepta-intelligence
          -p codex-hepta-agentd
          --all-targets

      - name: Prove raw decision API is externally unimportable
        run: python3 scripts/hepta-learning-eval-api-boundary.py compile-fail

      - name: Focused sealed-admission tests
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-intelligence-eval
          repository_admission
          -- --test-threads=1

      - name: Strict boundary lint
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-intelligence-eval
          -p codex-hepta-intelligence
          -p codex-hepta-agentd
          --all-targets -- -D warnings

      - name: Formatting and clean source
        if: always()
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-intelligence \
            --package codex-hepta-agentd \
            -- --check
          git diff --check
          git diff --exit-code

      - name: Retain compile-fail evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-eval-private-api-${{ github.sha }}
          path: .hepta-evidence/learning-eval/private-api-compile-fail.stderr
          if-no-files-found: error
          retention-days: 30

      - name: Attest compile-fail evidence
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .hepta-evidence/learning-eval/private-api-compile-fail.stderr
