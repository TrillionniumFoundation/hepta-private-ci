name: Hepta integration workspace

on:
  push:
    branches: [work/architecture-scalability-convergence-20260918]
    paths: [.github/workflows/hepta-integration-workspace.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-integration-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact integration inputs without credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git branch integration-source "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --unshallow --no-tags origin \
            refs/heads/main:refs/heads/integration-main \
            refs/heads/work/scalability-remediation-20260919:refs/heads/integration-remediation
          unset auth GH_TOKEN
          mkdir -p "$RUNNER_TEMP/hepta-integration-inputs"
          git rev-parse integration-source integration-main integration-remediation > "$RUNNER_TEMP/hepta-integration-inputs/commits.txt"
          git bundle create "$RUNNER_TEMP/hepta-integration-inputs/source.bundle" integration-source integration-main integration-remediation
          git bundle verify "$RUNNER_TEMP/hepta-integration-inputs/source.bundle"
          sha256sum "$RUNNER_TEMP/hepta-integration-inputs/source.bundle" > "$RUNNER_TEMP/hepta-integration-inputs/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-integration-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-integration-inputs/
          retention-days: 3
          if-no-files-found: error
