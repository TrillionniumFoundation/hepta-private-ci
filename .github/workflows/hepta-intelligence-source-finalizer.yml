name: intelligence.control source finalizer

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/workflows/hepta-intelligence-source-finalizer.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-source-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    name: compose and verify exact intelligence closed loop
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact trigger
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ea94aad1aca3195ca50127e31320d21b77b20d9d"
          test "$(git branch --show-current)" = "codex/intelligence-control-product-closure-20260926"

      - name: Compose existing owners without a second control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new))

          replace(
              "codex-rs/hepta-agentd/src/intelligence_learning.rs",
              '#[path = "intelligence_learning_payload.rs"]\nmod payload;\n',
              '#[path = "intelligence_learning_payload.rs"]\nmod payload;\n#[path = "intelligence_learning_exact.rs"]\nmod exact;\n',
          )
          replace(
              "codex-rs/hepta-infer-worker-host/src/lib.rs",
              "pub mod final_use_authorizer;\npub mod native_app_server;\n",
              "pub mod final_use_authorizer;\npub mod native_app_server;\npub mod native_intelligence_product;\n",
          )
          PY

      - name: Format and refresh the exact lockfile
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Verify exact learning and physical product packages
        working-directory: codex-rs
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-infer-worker-host intelligence_handoff_is_committed_to_native_admission_identity
          cargo test --locked -p codex-hepta-infer-worker-host intelligence_prompt_substitution_fails_before_provider_contact
          cargo test --locked -p codex-hepta-agentd --lib intelligence_learning
          cargo check --locked -p codex-hepta-agentd -p codex-hepta-infer-worker-host --all-targets
          cargo clippy --locked -p codex-hepta-agentd -p codex-hepta-infer-worker-host --all-targets -- -D warnings

      - name: Restrict mutation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hepta-intelligence-source-finalizer.yml
          allowed='^(\.github/workflows/hepta-intelligence-source-finalizer\.yml|codex-rs/Cargo\.lock|codex-rs/hepta-agentd/src/intelligence_.*\.rs|codex-rs/hepta-intelligence/(src|tests)/.*\.rs|codex-rs/hepta-operations/src/.*\.rs|codex-rs/hepta-infer-worker-host/src/(lib|native_intelligence_product|native_run_control|native_run_control_tests)\.rs|codex-rs/hepta-infer-worker-host/src/bin/hepta-infer-worker\.rs)$'
          unexpected="$(git status --short | cut -c4- | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git status --short)"

      - name: Commit verified product closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Intelligence Source Finalizer"
          git config user.email "hepta-intelligence-source-finalizer@users.noreply.github.com"
          git add -A
          git commit -m "feat(intelligence): compose decision execution outcome closure"
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
