name: intelligence.control source finalizer

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/workflows/hepta-intelligence-source-finalizer.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-source-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    name: format lock and verify prompt binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact trigger
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dfc57d0e5dc90399fc377ecc57d469d388913c2f"
          test "$(git branch --show-current)" = "codex/intelligence-control-product-closure-20260926"

      - name: Format and refresh the exact lockfile
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Verify physical prompt binding and all worker targets
        working-directory: codex-rs
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-infer-worker-host intelligence_handoff_is_committed_to_native_admission_identity
          cargo test --locked -p codex-hepta-infer-worker-host intelligence_prompt_substitution_fails_before_provider_contact
          cargo check --locked -p codex-hepta-infer-worker-host --all-targets

      - name: Restrict mutation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hepta-intelligence-source-finalizer.yml
          allowed='^(\.github/workflows/hepta-intelligence-source-finalizer\.yml|codex-rs/Cargo\.lock|codex-rs/hepta-agentd/src/intelligence_.*\.rs|codex-rs/hepta-intelligence/(src|tests)/.*\.rs|codex-rs/hepta-operations/src/.*\.rs|codex-rs/hepta-infer-worker-host/src/(native_run_control|native_run_control_tests)\.rs|codex-rs/hepta-infer-worker-host/src/bin/hepta-infer-worker\.rs)$'
          unexpected="$(git status --short | cut -c4- | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git status --short)"

      - name: Commit verified mechanical closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Intelligence Source Finalizer"
          git config user.email "hepta-intelligence-source-finalizer@users.noreply.github.com"
          git add -A
          git commit -m "chore(intelligence): format prompt binding and refresh lockfile"
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
