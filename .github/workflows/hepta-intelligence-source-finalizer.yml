name: intelligence.control source finalizer

# The job runs only the checked-in deterministic finalizer, native validation,
# a closed changed-path inventory and one non-force fast-forward push.
on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/workflows/hepta-intelligence-source-finalizer.yml
      - scripts/finalize-intelligence-control-product.py

permissions:
  contents: write

concurrency:
  group: intelligence-control-source-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    name: compose and verify owner-backed intelligence product
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - name: Check out exact trigger without persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Bind exact source event
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "codex/intelligence-control-product-closure-20260926"
          git cat-file -e HEAD^\{commit\}
          git merge-base --is-ancestor a126987b84737dbc2ee2592442a314117bddb4a2 HEAD
          test -f scripts/finalize-intelligence-control-product.py
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Compose existing owners without a second control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize-intelligence-control-product.py
          git diff --check

      - name: Format and refresh the exact lockfile
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Verify canonical and product packages
        working-directory: codex-rs
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-intelligence
          cargo test --locked -p codex-hepta-operations
          cargo test --locked -p codex-hepta-agentd --lib
          cargo test --locked -p codex-hepta-agentd --lib --features qualification-legacy-learning-write
          cargo test --locked -p codex-hepta-infer-worker-host --lib
          cargo check --locked -p codex-hepta-agentd -p codex-hepta-infer-worker-host --all-targets
          cargo clippy --locked -p codex-hepta-intelligence -p codex-hepta-operations -p codex-hepta-agentd -p codex-hepta-infer-worker-host --all-targets -- -D warnings

      - name: Verify generated intelligence declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-intelligence-control-status.py --check-tracked
          git diff --check

      - name: Restrict mutation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hepta-intelligence-source-finalizer.yml
          git rm scripts/finalize-intelligence-control-product.py
          allowed='^(\.github/workflows/hepta-intelligence-source-finalizer\.yml|scripts/finalize-intelligence-control-product\.py|codex-rs/Cargo\.lock|codex-rs/hepta-agentd/src/intelligence_.*\.rs|codex-rs/hepta-intelligence/(src|tests)/.*\.rs|codex-rs/hepta-operations/src/.*\.rs|codex-rs/hepta-infer-worker-host/src/(lib|native_intelligence_product|native_run_control|native_run_control_tests)\.rs|codex-rs/hepta-infer-worker-host/src/bin/hepta-infer-worker\.rs)$'
          unexpected="$(git status --short | cut -c4- | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git status --short)"

      - name: Commit and fast-forward the verified product closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "Hepta Intelligence Source Finalizer"
          git config user.email "hepta-intelligence-source-finalizer@users.noreply.github.com"
          git add -A
          git commit -m "feat(intelligence): bind owner prompt to physical product closure"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
