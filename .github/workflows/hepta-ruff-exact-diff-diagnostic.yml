name: Hepta Ruff exact diff diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/hepta-ruff-exact-diff-diagnostic.yml
permissions:
  contents: read
jobs:
  exact-ruff-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR merge source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Print pinned Ruff 0.15.13 formatter diff and enforce check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/ruff-diagnostic"
          "${RUNNER_TEMP}/ruff-diagnostic/bin/pip" install --disable-pip-version-check 'ruff==0.15.13'
          ruff="${RUNNER_TEMP}/ruff-diagnostic/bin/ruff"
          target="scripts/test_hepta_smollm_answer_eos_research_v3.py"
          "${ruff}" --version
          set +e
          "${ruff}" format --diff "${target}"
          diff_rc=$?
          set -e
          echo "Diagnostic diff exit: ${diff_rc}"
          "${ruff}" format --check "${target}"
