name: AuthBus exact source convergence once

on:
  push:
    branches:
      - auth-authbus-boundary-convergence-20260928
    paths:
      - ".github/workflows/authority-convergence-once.yml"
      - "scripts/authbus-materialize-boundaries-once.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authority-convergence-once.yml"
      - "scripts/authbus-materialize-boundaries-once.py"

permissions:
  contents: write

concurrency:
  group: authbus-exact-source-convergence-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.95.0"
  TARGET_BRANCH: auth-authbus-boundary-convergence-20260928
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  converge:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'auth-authbus-boundary-convergence-20260928' }}
    name: Materialize reviewed AuthBus source boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Materialize reviewed source transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authbus-materialize-boundaries-once.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-authbus \
            -p codex-hepta-evidence \
            -p codex-hepta-agentd \
            -p codex-hepta-operations \
            -p codex-hepta-bao-adapter

      - name: Compile and test the affected authority boundary
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo check -p codex-hepta-authbus --all-targets --all-features
          cargo test -p codex-hepta-authbus --all-targets --all-features
          cargo test -p codex-hepta-evidence --all-targets
          cargo check -p codex-hepta-agentd --all-targets
          cargo check -p codex-hepta-operations --all-targets
          cargo check -p codex-hepta-bao-adapter --all-targets
          cargo clippy -p codex-hepta-authbus -p codex-hepta-evidence \
            -p codex-hepta-agentd -p codex-hepta-operations \
            -p codex-hepta-bao-adapter --all-targets --all-features -- -D warnings
          cd ..
          ! grep -q 'pub async fn bootstrap(' codex-rs/hepta-authbus/src/host.rs
          grep -q 'let host = bootstrap_retryable(' \
            codex-rs/hepta-authbus/src/bin/hepta-authbus-admin.rs
          ! grep -RIl 'store::now_millis' codex-rs/hepta-evidence/src/authbus_*.rs \
            | grep -v 'authbus_time.rs'
          python3 scripts/check-authbus-composition-root.py --check

      - name: Commit one self-contained candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git rm .github/workflows/authority-convergence-once.yml \
            scripts/authbus-materialize-boundaries-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "authbus: close bootstrap, time, and operation boundaries"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
