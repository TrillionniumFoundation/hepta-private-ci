name: Hepta Lane E materialize generated files

on:
  push:
    branches:
      - codex/hepta-lane-e-gap-closure-20260910

permissions:
  contents: write

concurrency:
  group: hepta-lane-e-materialize-generated
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Materialize deterministic source and dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification
          cargo check --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets
          git diff --check

      - name: Commit generated bytes
        shell: bash
        run: |
          set -euo pipefail
          git add codex-rs/Cargo.lock \
            codex-rs/hepta-learning-ledger \
            codex-rs/hepta-learning-artifacts \
            codex-rs/hepta-bellman-operator \
            codex-rs/hepta-intelligence-eval \
            codex-rs/hepta-shadow-qualification
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name hepta-lane-e-bot
          git config user.email hepta-lane-e-bot@users.noreply.github.com
          git commit -m 'chore(lane-e): materialize rustfmt and lockfile'
          git push origin HEAD:codex/hepta-lane-e-gap-closure-20260910
