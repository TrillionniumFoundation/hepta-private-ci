name: hcsn-n256-index1159-resource-projection

on:
  pull_request:
    paths:
      - "qualification/hcsn_ci_readbacks/6948/**"
      - "qualification/hcsn_ci_readbacks/6957/**"
      - "qualification/hcsn_currentstate_n256_index1159_resource_projection/**"
      - ".github/workflows/hcsn-n256-index1159-resource-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-readonly-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify immutable index256 originals
        run: python3 qualification/hcsn_ci_readbacks/6948/verify_readback.py
      - name: Verify immutable index537 originals
        run: python3 qualification/hcsn_ci_readbacks/6957/verify.py
      - name: Verify committed projection in normal mode
        run: >-
          python3 qualification/hcsn_currentstate_n256_index1159_resource_projection/audit.py
          --verify-expected
          qualification/hcsn_currentstate_n256_index1159_resource_projection/AUDIT.json
      - name: Verify committed projection in optimized mode
        run: >-
          python3 -O qualification/hcsn_currentstate_n256_index1159_resource_projection/audit.py
          --verify-expected
          qualification/hcsn_currentstate_n256_index1159_resource_projection/AUDIT.json
