name: Hepta Browser Servo deployment qualification

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: GitHub Actions run ID containing the primary exact worker evidence artifact
        required: true
        type: string
      independent_build_run_id:
        description: GitHub Actions run ID containing the independent exact-input rebuild
        required: true
        type: string
      worker_sha256:
        description: Expected SHA-256 of the worker binary from the reviewed primary receipt
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-browser-servo-deployment-qualification
  cancel-in-progress: false

jobs:
  linux-target:
    name: Trusted Linux target qualification
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      INDEPENDENT_BUILD_RUN_ID: ${{ inputs.independent_build_run_id }}
      EXPECTED_WORKER_SHA256: ${{ inputs.worker_sha256 }}
      SERVO_PIN: b5a1f5e6ec6f8685d40cd389802ced7abe4980f6
    steps:
      - name: Reject non-main or malformed qualification requests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$INDEPENDENT_BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          test "$BUILD_RUN_ID" != "$INDEPENDENT_BUILD_RUN_ID"
          [[ "$EXPECTED_WORKER_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind checkout and trusted host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          command -v node
          command -v python3
          command -v bwrap
          command -v prlimit
          mkdir -p deployment-evidence
          git rev-parse HEAD HEAD^{tree} > deployment-evidence/source-identity.txt
          uname -a > deployment-evidence/uname.txt
          node --version > deployment-evidence/node-version.txt
          python3 --version > deployment-evidence/python-version.txt 2>&1
          bwrap --version > deployment-evidence/bwrap-version.txt
          sha256sum "$(command -v bwrap)" > deployment-evidence/bwrap.sha256
          prlimit --version | head -n 1 > deployment-evidence/prlimit-version.txt
          sha256sum "$(command -v prlimit)" > deployment-evidence/prlimit.sha256

      - name: Verify both independent build run provenances
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          def load(run_id):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/runs/{run_id}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          primary = load(os.environ["BUILD_RUN_ID"])
          independent = load(os.environ["INDEPENDENT_BUILD_RUN_ID"])
          expected = (
              (
                  primary,
                  "Hepta Browser Servo worker dev",
                  ".github/workflows/hepta-browser-servo-worker-dev.yml",
              ),
              (
                  independent,
                  "Hepta Browser Servo independent rebuild",
                  ".github/workflows/hepta-browser-servo-independent-rebuild.yml",
              ),
          )
          for run, name, path in expected:
              assert run["head_sha"] == os.environ["SOURCE_SHA"]
              assert run["head_branch"] == "main"
              assert run["name"] == name
              assert run["path"] == path
              assert run["conclusion"] == "success"
              assert run["event"] in {"push", "workflow_dispatch"}
              assert run["repository"]["full_name"] == "TrillionniumFoundation/hepta-private-ci"
          assert primary["id"] != independent["id"]
          PY

      - name: Download exact primary worker evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hepta-browser-servo-worker-evidence-${{ github.sha }}
          path: worker-evidence
          repository: TrillionniumFoundation/hepta-private-ci
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact independent rebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hepta-browser-servo-independent-rebuild-${{ github.sha }}
          path: independent-evidence
          repository: TrillionniumFoundation/hepta-private-ci
          run-id: ${{ inputs.independent_build_run_id }}
          github-token: ${{ github.token }}

      - name: Verify reviewed receipts, exact artifacts and cross-runner reproducibility
        shell: bash
        run: |
          set -euo pipefail
          test -s worker-evidence/build-receipt.json
          test -s worker-evidence/hepta-servo-worker
          test -s worker-evidence/Cargo.lock
          test -s worker-evidence/hepta-servo-worker.spdx.json
          test -s independent-evidence/independent-rebuild-receipt.json
          test -s independent-evidence/hepta-servo-worker
          test -s independent-evidence/Cargo.lock
          primary_sha="$(sha256sum worker-evidence/hepta-servo-worker | awk '{print $1}')"
          independent_sha="$(sha256sum independent-evidence/hepta-servo-worker | awk '{print $1}')"
          test "$primary_sha" = "$EXPECTED_WORKER_SHA256"
          test "$independent_sha" = "$EXPECTED_WORKER_SHA256"
          cmp --silent worker-evidence/hepta-servo-worker independent-evidence/hepta-servo-worker
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          primary_root = pathlib.Path('worker-evidence')
          independent_root = pathlib.Path('independent-evidence')
          target_root = pathlib.Path('deployment-evidence')
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          primary = json.loads((primary_root / 'build-receipt.json').read_text())
          independent = json.loads((independent_root / 'independent-rebuild-receipt.json').read_text())

          assert primary['schema'] == 'hepta.browser.servo-worker-build-receipt.v2'
          assert primary['sourceSha'] == os.environ['SOURCE_SHA']
          assert primary['sourceTree'] == source_tree
          assert primary['servoPin'] == os.environ['SERVO_PIN']
          assert primary['cargoLockCommitted'] is True
          assert primary['sameRunnerByteIdenticalBuilds'] is True
          assert primary['reproducibleIndependentBuilds'] is False
          assert primary['independentRunnerBuildCount'] == 1
          assert primary['cargoLockSha256'] == digest(primary_root / 'Cargo.lock')
          assert primary['workerSha256'] == os.environ['EXPECTED_WORKER_SHA256']
          assert primary['workerSha256'] == digest(primary_root / 'hepta-servo-worker')
          assert primary['sbomSha256'] == digest(primary_root / 'hepta-servo-worker.spdx.json')

          assert independent['schema'] == 'hepta.browser.servo-independent-rebuild-receipt.v1'
          assert independent['sourceSha'] == os.environ['SOURCE_SHA']
          assert independent['sourceTree'] == source_tree
          assert independent['servoPin'] == os.environ['SERVO_PIN']
          assert independent['committedLock'] is True
          assert independent['independentEphemeralRunner'] is True
          assert independent['githubRunId'] == os.environ['INDEPENDENT_BUILD_RUN_ID']
          assert independent['cargoLockSha256'] == digest(independent_root / 'Cargo.lock')
          assert independent['cargoLockSha256'] == primary['cargoLockSha256']
          assert independent['workerSha256'] == primary['workerSha256']
          assert independent['workerSha256'] == digest(independent_root / 'hepta-servo-worker')

          assert primary['linuxSandboxProbe']['externalNetworkDenied'] is True
          assert primary['linuxSandboxProbe']['hostSecretHidden'] is True
          assert primary['linuxSandboxProbe']['parentDeathCleanupObserved'] is True
          assert primary['linuxSandboxProbe']['descendantCleanupObserved'] is True
          assert primary['linuxSandboxProbe']['resourceLimitsEnforced'] is True
          assert primary['realWorkerSmoke']['currentPinWorkerBooted'] is True
          assert primary['realWorkerSmoke']['privateProtocolRoundTrip'] is True
          assert primary['realBrowserE2E']['openNavigateObserveTypeClickClose'] is True
          assert primary['realBrowserE2E']['crossOriginSubresourceDenied'] is True
          assert primary['realBrowserE2E']['redirectEscapeDenied'] is True
          assert primary['realBrowserE2E']['profileAllowedCrossOriginRedirectDeniedByEffectGrant'] is True
          assert primary['realBrowserE2E']['crossProfileCookieIsolation'] is True
          assert primary['realBrowserE2E']['persistedCrashReconciliation'] is True
          assert primary['realBrowserSoak']['cycles'] == 32
          assert primary['realBrowserSoak']['boundedFdGrowth'] is True

          multi = {
              'schema': 'hepta.browser.servo-multi-builder-receipt.v1',
              'sourceSha': os.environ['SOURCE_SHA'],
              'sourceTree': source_tree,
              'servoPin': os.environ['SERVO_PIN'],
              'primaryBuildRunId': os.environ['BUILD_RUN_ID'],
              'independentBuildRunId': os.environ['INDEPENDENT_BUILD_RUN_ID'],
              'cargoLockSha256': primary['cargoLockSha256'],
              'workerSha256': primary['workerSha256'],
              'primaryReceiptSha256': digest(primary_root / 'build-receipt.json'),
              'independentReceiptSha256': digest(independent_root / 'independent-rebuild-receipt.json'),
              'reproducibleIndependentBuilds': True,
              'independentRunnerBuildCount': 2,
              'byteIdentical': True,
          }
          (target_root / 'multi-builder-receipt.json').write_text(
              json.dumps(multi, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
          sha256sum deployment-evidence/multi-builder-receipt.json \
            > deployment-evidence/multi-builder-receipt.json.sha256
          chmod 0555 worker-evidence/hepta-servo-worker
          cp worker-evidence/build-receipt.json deployment-evidence/source-build-receipt.json
          cp independent-evidence/independent-rebuild-receipt.json \
            deployment-evidence/independent-rebuild-receipt.json
          sha256sum worker-evidence/hepta-servo-worker \
            > deployment-evidence/worker.sha256

      - name: Re-probe host filesystem and external egress isolation
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/linux-sandbox-probe.js \
            | tee deployment-evidence/linux-sandbox-probe.json
          python3 - <<'PY'
          import json, pathlib
          probe = json.loads(pathlib.Path("deployment-evidence/linux-sandbox-probe.json").read_text())
          assert probe["resourceLimitsEnforced"] is True
          PY

      - name: Re-run real worker in the target sandbox
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/real-worker-smoke.js \
            worker-evidence/hepta-servo-worker \
            | tee deployment-evidence/real-worker-smoke.json

      - name: Re-run real Browser lifecycle and profile isolation on trusted target
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/real-browser-e2e.js worker-evidence/hepta-servo-worker | tee deployment-evidence/real-browser-e2e.json
          python3 - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path("deployment-evidence/real-browser-e2e.json").read_text())
          assert result["openNavigateObserveTypeClickClose"] is True
          assert result["crossOriginSubresourceDenied"] is True
          assert result["redirectEscapeDenied"] is True
          assert result["profileAllowedCrossOriginRedirectDeniedByEffectGrant"] is True
          assert result["profileExpiryContainsBackgroundNetwork"] is True
          assert result["profileCloseRevocationContainsBackgroundNetwork"] is True
          assert result["crossProfileCookieIsolation"] is True
          assert result["persistedCrashReconciliation"] is True
          assert result["authenticatedPersistedCrashReconciliation"] is True
          assert result["crossProfileStorageIsolation"] is True
          assert result["crossProfileCacheIsolation"] is True
          assert result["noExternallyReachableWorkerListener"] is True
          PY

      - name: Prove public DNS and certificate-validating HTTPS egress on trusted target
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/public-egress-probe.js worker-evidence/hepta-servo-worker | tee deployment-evidence/public-egress-probe.json
          python3 - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path("deployment-evidence/public-egress-probe.json").read_text())
          assert result["publicDnsResolved"] is True
          assert result["publicTlsValidated"] is True
          assert result["realServoPublicHttps"] is True
          assert result["realServoObservedOrigin"] == "https://example.com"
          assert result["profileScopeEscapeDenied"] is True
          assert result["ungrantedPublicOriginDenied"] is True
          assert result["grantedOrigin"] == "https://example.com"
          assert result["workerSha256"] == pathlib.Path("worker-evidence/hepta-servo-worker.sha256").read_text().split()[0]
          PY

      - name: Re-run bounded Browser resource soak on trusted target
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/real-browser-soak.js worker-evidence/hepta-servo-worker | tee deployment-evidence/real-browser-soak.json
          python3 - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path("deployment-evidence/real-browser-soak.json").read_text())
          assert result["cycles"] == 32
          assert result["boundedFdGrowth"] is True
          assert result["boundedRssGrowth"] is True
          assert result["rssPeakGrowthLimitKiB"] == 524288
          assert result["rssTerminalGrowthLimitKiB"] == 262144
          PY

      - name: Record target qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('deployment-evidence')
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          public_egress = json.loads((root / 'public-egress-probe.json').read_text())
          multi = json.loads((root / 'multi-builder-receipt.json').read_text())
          receipt = {
              'schema': 'hepta.browser.servo-linux-target-qualification.v2',
              'sourceSha': os.environ['SOURCE_SHA'],
              'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'buildRunId': os.environ['BUILD_RUN_ID'],
              'independentBuildRunId': os.environ['INDEPENDENT_BUILD_RUN_ID'],
              'workerSha256': os.environ['EXPECTED_WORKER_SHA256'],
              'multiBuilderReceiptSha256': digest(root / 'multi-builder-receipt.json'),
              'reproducibleIndependentBuilds': multi['reproducibleIndependentBuilds'],
              'independentRunnerBuildCount': multi['independentRunnerBuildCount'],
              'sandboxProbeSha256': digest(root / 'linux-sandbox-probe.json'),
              'realWorkerSmokeSha256': digest(root / 'real-worker-smoke.json'),
              'realBrowserE2ESha256': digest(root / 'real-browser-e2e.json'),
              'publicEgressProbeSha256': digest(root / 'public-egress-probe.json'),
              'publicDnsResolved': public_egress['publicDnsResolved'],
              'publicTlsValidated': public_egress['publicTlsValidated'],
              'realServoPublicHttps': public_egress['realServoPublicHttps'],
              'profileScopeEscapeDenied': public_egress['profileScopeEscapeDenied'],
              'realBrowserSoakSha256': digest(root / 'real-browser-soak.json'),
              'noExternallyReachableWorkerListener': True,
              'crossProfileCookieIsolation': True,
              'crossProfileStorageIsolation': True,
              'crossProfileCacheIsolation': True,
              'boundedRssGrowth': True,
              'boundedFdGrowth': True,
              'operatorAcceptance': False,
              'promotion': False,
              'releaseQualified': False,
              'interpretation': 'two-builder artifact identity plus target execution evidence; independent operator/release authority is not self-issued',
          }
          (root / 'target-qualification-receipt.json').write_text(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
          sha256sum deployment-evidence/target-qualification-receipt.json \
            > deployment-evidence/target-qualification-receipt.json.sha256

      - name: Preserve target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-browser-servo-linux-target-${{ github.sha }}
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Verify source stayed read-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
