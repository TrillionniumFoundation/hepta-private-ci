name: Hepta Browser Servo deployment qualification

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: GitHub Actions run ID containing the primary signed worker evidence
        required: true
        type: string
      independent_build_run_id:
        description: GitHub Actions run ID containing the independent signed rebuild
        required: true
        type: string
      worker_sha256:
        description: Expected SHA-256 of the reviewed worker binary
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: hepta-browser-servo-deployment-qualification
  cancel-in-progress: false

jobs:
  linux-target:
    name: Trusted Linux target qualification
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      INDEPENDENT_BUILD_RUN_ID: ${{ inputs.independent_build_run_id }}
      EXPECTED_WORKER_SHA256: ${{ inputs.worker_sha256 }}
      SERVO_PIN: b5a1f5e6ec6f8685d40cd389802ced7abe4980f6
    steps:
      - name: Reject non-main or malformed qualification requests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$INDEPENDENT_BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          test "$BUILD_RUN_ID" != "$INDEPENDENT_BUILD_RUN_ID"
          [[ "$EXPECTED_WORKER_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out exact main source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind checkout and trusted-host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          command -v node
          command -v python3
          command -v bwrap
          command -v prlimit
          command -v gh
          gh attestation verify --help >/dev/null
          mkdir -p deployment-evidence
          git rev-parse HEAD HEAD^{tree} > deployment-evidence/source-identity.txt
          uname -a > deployment-evidence/uname.txt
          node --version > deployment-evidence/node-version.txt
          python3 --version > deployment-evidence/python-version.txt 2>&1
          gh --version > deployment-evidence/gh-version.txt
          bwrap --version > deployment-evidence/bwrap-version.txt
          sha256sum "$(command -v bwrap)" > deployment-evidence/bwrap.sha256
          prlimit --version | head -n 1 > deployment-evidence/prlimit-version.txt
          sha256sum "$(command -v prlimit)" > deployment-evidence/prlimit.sha256

      - name: Download exact primary signed worker evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hepta-browser-servo-worker-evidence-${{ github.sha }}
          path: worker-evidence
          repository: TrillionniumFoundation/hepta-private-ci
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact independent signed rebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hepta-browser-servo-independent-rebuild-${{ github.sha }}
          path: independent-evidence
          repository: TrillionniumFoundation/hepta-private-ci
          run-id: ${{ inputs.independent_build_run_id }}
          github-token: ${{ github.token }}

      - name: Verify run provenance, receipts, locks and byte-identical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/hepta-browser/scripts/verify-deployment-evidence.py preflight

      - name: Verify primary and independent Sigstore provenance and SPDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY_SIGNER: TrillionniumFoundation/hepta-private-ci/.github/workflows/hepta-browser-servo-worker-dev.yml
          INDEPENDENT_SIGNER: TrillionniumFoundation/hepta-private-ci/.github/workflows/hepta-browser-servo-independent-rebuild.yml
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --repo "$GITHUB_REPOSITORY"
            --source-digest "$SOURCE_SHA"
            --source-ref refs/heads/main
            --deny-self-hosted-runners
            --format json
          )
          gh attestation verify worker-evidence/hepta-servo-worker \
            "${common[@]}" \
            --bundle worker-evidence/build-provenance-attestation.jsonl \
            --signer-workflow "$PRIMARY_SIGNER" \
            --signer-digest "$SOURCE_SHA" \
            > deployment-evidence/primary-provenance-verification.json
          gh attestation verify worker-evidence/hepta-servo-worker \
            "${common[@]}" \
            --bundle worker-evidence/sbom-attestation.jsonl \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --signer-workflow "$PRIMARY_SIGNER" \
            --signer-digest "$SOURCE_SHA" \
            > deployment-evidence/primary-sbom-verification.json
          gh attestation verify independent-evidence/hepta-servo-worker \
            "${common[@]}" \
            --bundle independent-evidence/build-provenance-attestation.jsonl \
            --signer-workflow "$INDEPENDENT_SIGNER" \
            --signer-digest "$SOURCE_SHA" \
            > deployment-evidence/independent-provenance-verification.json
          python3 apps/hepta-browser/scripts/verify-deployment-evidence.py attestations

      - name: Re-probe target filesystem, process, resource and direct-egress isolation
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/linux-sandbox-probe.js \
            | tee deployment-evidence/linux-sandbox-probe.json

      - name: Re-run exact worker in the trusted target sandbox
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/real-worker-smoke.js \
            worker-evidence/hepta-servo-worker \
            | tee deployment-evidence/real-worker-smoke.json

      - name: Re-run real Browser lifecycle and profile-isolation E2E
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/real-browser-e2e.js \
            worker-evidence/hepta-servo-worker \
            | tee deployment-evidence/real-browser-e2e.json

      - name: Prove public DNS and certificate-validating HTTPS through real Servo
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/public-egress-probe.js \
            worker-evidence/hepta-servo-worker \
            | tee deployment-evidence/public-egress-probe.json

      - name: Re-run bounded Browser resource soak on the trusted target
        shell: bash
        run: |
          set -euo pipefail
          node apps/hepta-browser/scripts/real-browser-soak.js \
            worker-evidence/hepta-servo-worker \
            | tee deployment-evidence/real-browser-soak.json

      - name: Validate target evidence and emit non-self-authorizing receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/hepta-browser/scripts/verify-deployment-evidence.py finalize

      - name: Preserve trusted target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-browser-servo-linux-target-${{ github.sha }}
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Verify source stayed read-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
