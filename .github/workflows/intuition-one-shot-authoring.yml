name: intuition.policy isolated one-shot authoring

on:
  pull_request:
    branches: [codex/intuition-policy-authoring-base-20260929]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: intuition-isolated-authoring-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/intuition-policy-final-use-recovery-20260929
  CLEAN_PARENT: 696447e733e22e425cd05691d98f4fe0ef63f759
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply-verify-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/intuition-policy-final-use-recovery-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUTHORING_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.AUTHORING_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate, uniquely repair, and apply immutable source patch
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/intuition-authoring-validate.log") 2>&1
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORING_HEAD"
          ready=.github/intuition-authoring-patch/READY
          base="$(sed -n 's/^base=//p' "$ready" | tr -d '\r')"
          part_000="$(sed -n 's/^part-000=//p' "$ready" | tr -d '\r')"
          part_001="$(sed -n 's/^part-001=//p' "$ready" | tr -d '\r')"
          part_002="$(sed -n 's/^part-002=//p' "$ready" | tr -d '\r')"
          test "$base" = "$CLEAN_PARENT"
          test "$part_000" = "ff90ec4b0bb594c6659c0805f7683e625f423d46"
          test "$part_001" = "8ef03a50ccef25591918ed67fb42506bcfdd21f1"
          test "$part_002" = "627e323cc4086e712a04ffa58b02e7723415e64c"
          test "$(git cat-file -t "$base")" = commit
          for blob in "$part_000" "$part_001" "$part_002"; do
            test "$(git cat-file -t "$blob")" = blob
          done
          PART_000="$part_000" PART_001="$part_001" PART_002="$part_002" python - <<'PY'
          import base64
          import hashlib
          import os
          import pathlib
          import subprocess
          import tempfile

          parts = []
          for name in ('PART_000', 'PART_001', 'PART_002'):
              raw = subprocess.check_output(['git', 'cat-file', 'blob', os.environ[name]])
              compact = b''.join(raw.split())
              print(f'{name}: raw={len(raw)} compact={len(compact)}')
              parts.append(compact)

          def decode_applicable(encoded: bytes, label: str):
              try:
                  patch = base64.b64decode(encoded, validate=True)
                  text = patch.decode('utf-8')
              except (ValueError, UnicodeDecodeError) as error:
                  return None
              if not text.startswith('diff --git a/') or '\x00' in text or not text.endswith('\n'):
                  return None
              with tempfile.NamedTemporaryFile(prefix='intuition-', suffix='.patch', delete=False) as handle:
                  handle.write(patch)
                  candidate = handle.name
              try:
                  result = subprocess.run(
                      ['git', 'apply', '--check', candidate],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                  )
              finally:
                  pathlib.Path(candidate).unlink(missing_ok=True)
              if result.returncode != 0:
                  return None
              print(f'applicable candidate {label}: bytes={len(patch)} sha256={hashlib.sha256(patch).hexdigest()}')
              return patch

          encoded = b''.join(parts)
          applicable = []
          direct = decode_applicable(encoded, 'direct') if len(encoded) % 4 == 0 else None
          if direct is not None:
              applicable.append(('direct', None, direct))

          if len(encoded) % 4 == 1 and len(parts[1]) == 12001:
              for index in range(len(parts[1])):
                  repaired = parts[0] + parts[1][:index] + parts[1][index + 1:] + parts[2]
                  try:
                      patch = base64.b64decode(repaired, validate=True)
                      text = patch.decode('utf-8')
                  except (ValueError, UnicodeDecodeError):
                      continue
                  if not text.startswith('diff --git a/') or '\x00' in text or not text.endswith('\n'):
                      continue
                  with tempfile.NamedTemporaryFile(prefix='intuition-', suffix='.patch', delete=False) as handle:
                      handle.write(patch)
                      candidate = handle.name
                  try:
                      result = subprocess.run(
                          ['git', 'apply', '--check', candidate],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          check=False,
                      )
                  finally:
                      pathlib.Path(candidate).unlink(missing_ok=True)
                  if result.returncode == 0:
                      applicable.append((
                          'part-001-single-byte-removal',
                          index,
                          patch,
                      ))

          if len(applicable) != 1:
              raise SystemExit(f'expected exactly one applicable reconstruction, found {len(applicable)}')
          method, index, patch = applicable[0]
          removed = None if index is None else parts[1][index:index + 1]
          target = pathlib.Path('.git/intuition-source.patch')
          target.write_bytes(patch)
          digest = hashlib.sha256(patch).hexdigest()
          pathlib.Path('.git/intuition-source.patch.sha256').write_text(
              f'{digest}  {target.name}\n', encoding='utf-8'
          )
          pathlib.Path('.git/intuition-source.patch.recovery').write_text(
              f'method={method}\nindex={index}\nremoved={removed!r}\nsha256={digest}\n',
              encoding='utf-8',
          )
          print(f'selected method={method} index={index} removed={removed!r} bytes={len(patch)} sha256={digest}')
          PY
          git diff --quiet
          git apply --check .git/intuition-source.patch
          git apply --index .git/intuition-source.patch
          rm -rf .github/intuition-authoring-patch
          rm -f .github/workflows/intuition-source-export.yml
          test -z "$(git diff --name-only "$CLEAN_PARENT" -- .github/intuition-authoring-patch .github/workflows/intuition-source-export.yml)"

      - name: Capture applied patch before execution
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intuition-patched-source"
          mkdir -p "$output"
          cp .git/intuition-source.patch "$output/source.patch"
          cp .git/intuition-source.patch.sha256 "$output/source.patch.sha256"
          cp .git/intuition-source.patch.recovery "$output/source.patch.recovery"
          cp "$RUNNER_TEMP/intuition-authoring-validate.log" "$output/validate.log"
          git diff --cached --binary > "$output/applied.patch"

      - name: Upload applied-patch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-applied-patch-${{ env.AUTHORING_HEAD }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-patched-source/
          if-no-files-found: error
          retention-days: 3

      - name: Set up repository CI dependencies
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Format exact Rust source
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Verify source projections and legacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          python scripts/intuition_legacy_consumers.py
          python -m unittest discover -s scripts/tests -p 'test_intuition*.py' -v

      - name: Run final-use and compatibility regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence intuition
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_final_use_v4
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_commit_boundary
          cargo test --locked -p codex-hepta-agentd --lib intuition_policy

      - name: Run strict lint on affected product package
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-agentd --lib --tests -- -D warnings

      - name: Verify formatting and patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          (cd codex-rs && cargo fmt --all -- --check)
          git diff --check
          test -z "$(find . -type d -name __pycache__ -print -quit)"

      - name: Publish one clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI source authoring"
          git config user.email "assistant@openai.invalid"
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^\.github/(intuition-authoring-patch|workflows/intuition-source-export\.yml)$' || true)"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(intuition): revalidate authority at final use' \
            'Preserve the sole ledger owner while moving fresh time, generation, and three-party qualification checks under its serialization boundary. Add typed boundary domains, stage telemetry, legacy-consumer drift checks, and separate safety/effectiveness/operator acceptance states.' \
            | git commit-tree "$tree" -p "$CLEAN_PARENT")"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORING_HEAD" \
            origin "$commit:refs/heads/$TARGET_BRANCH"
          printf '%s\n' "$commit"

      - name: Retain diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intuition-authoring-failure"
          mkdir -p "$output"
          git status --short > "$output/status.txt"
          git diff --binary > "$output/worktree.patch"
          git diff --cached --binary > "$output/index.patch"
          cp "$RUNNER_TEMP/intuition-authoring-validate.log" "$output/validate.log" 2>/dev/null || true
          cp .git/intuition-source.patch "$output/source.patch" 2>/dev/null || true
          cp .git/intuition-source.patch.sha256 "$output/source.patch.sha256" 2>/dev/null || true
          cp .git/intuition-source.patch.recovery "$output/source.patch.recovery" 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-authoring-failure-${{ env.AUTHORING_HEAD }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-authoring-failure/
          if-no-files-found: warn
          retention-days: 3
