name: HCSN precision restore focused tests
on:
  push:
    branches: [research/hcsn-precision-restore-20261030]
    paths:
      - tools/hcsn/task_flow_20261030/precision_restore_v1/**
      - .github/workflows/hcsn-precision-restore.yml
  pull_request:
    paths:
      - tools/hcsn/task_flow_20261030/precision_restore_v1/**
      - .github/workflows/hcsn-precision-restore.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/hcsn/task_flow_20261030/flow
            tools/hcsn/task_flow_20261030/precision_restore_v1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jax[cpu]==0.4.38' 'numpy==1.26.4' 'scipy==1.13.1'
      - name: Run full-real-flow restore test and adversarial denial cases
        env:
          JAX_ENABLE_X64: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest -v tools.hcsn.task_flow_20261030.precision_restore_v1.test_checkpoint tools.hcsn.task_flow_20261030.precision_restore_v1.test_recover
