name: Neuron target evidence hardening runner

on:
  push:
    branches:
      - codex/neuron-runtime-lock-sync-staging-20260930
    paths:
      - .github/workflows/neuron-target-evidence-runner.yml

permissions:
  contents: write

concurrency:
  group: neuron-target-evidence-hardening-runner
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact migration input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Materialize reviewed target evidence contracts and remove authority
        shell: bash
        env:
          TARGET_BRANCH: codex/neuron-runtime-lock-sync-staging-20260930
        run: |
          set -euo pipefail
          old=.github/workflows/neuron-target-evidence-hardening-once.yml
          runner=.github/workflows/neuron-target-evidence-runner.yml
          archive="$RUNNER_TEMP/neuron-target-evidence-hardening.tar.gz"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(find .github/migrations -maxdepth 1 -type f -name 'neuron-hardening.part*' | wc -l)" -eq 6
          cat .github/migrations/neuron-hardening.part* | tr -d '\n' | base64 -d > "$archive"
          printf '%s  %s\n' \
            2eba99c0d6542d4b54465c9a7cdabfa031affb9ce9cd0dd371b92deaaaab68dd \
            "$archive" | sha256sum -c -

          cat > "$RUNNER_TEMP/expected-files.txt" <<'FILES'
          .github/workflows/neuron-runtime-target-host-acceptance.yml
          .github/workflows/neuron-runtime-target-host-execution.yml
          scripts/neuron/target_host_acceptance.py
          scripts/neuron/test_docs_contracts.py
          scripts/neuron/test_target_host_acceptance.py
          FILES
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files.txt"
          tar -tzf "$archive" | sed 's#^\./##' | sort > "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          tar -xzf "$archive" -C .

          python3 -m py_compile \
            scripts/neuron/target_host_acceptance.py \
            scripts/neuron/test_target_host_acceptance.py \
            scripts/neuron/test_docs_contracts.py
          python3 -m unittest discover -v -s scripts/neuron -p 'test_target_host_acceptance.py'
          python3 -m unittest discover -v -s scripts/neuron -p 'test_docs_contracts.py'
          python3 scripts/neuron/readiness.py render --check
          python3 scripts/verify_cargo_lock.py
          (cd codex-rs && cargo metadata --locked --format-version=1 >/dev/null)

          rm -f "$old" "$runner" .github/migrations/neuron-hardening.part*
          rmdir .github/migrations 2>/dev/null || true
          if grep -R --line-number --fixed-strings 'contents: write' \
            .github/workflows/*neuron*.yml; then
            echo 'mutable Neuron workflow remains in final tree' >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          git config user.name hepta-source-migration
          git config user.email source-migration@invalid
          git commit -m "fix(neuron): authenticate retained target-host evidence"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse FETCH_HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
