name: Apply public re-export fix v9

on:
  push:
    branches:
      - ops/final-blocker-closure-v9-20260908

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'ops apply public re-export fix v9 repaired'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ops/final-blocker-closure-v9-20260908
          fetch-depth: 0
          persist-credentials: true
      - name: Use the public StartTransition re-export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/core/src/tasks/mod.rs')
          source = path.read_text(encoding='utf-8')
          old = 'super::state::turn::StartTransition::take_deferred_idle'
          new = 'crate::state::StartTransition::take_deferred_idle'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one private path, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit exact compiler-suggested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-blocker-closure-bot"
          git config user.email "hepta-blocker-closure-bot@users.noreply.github.com"
          git add codex-rs/core/src/tasks/mod.rs
          git commit -m "fix: use public StartTransition re-export"
          git push origin HEAD:ops/final-blocker-closure-v9-20260908
