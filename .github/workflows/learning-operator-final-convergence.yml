name: Learning operator one-shot parent guard repair

on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths: ['.github/workflows/learning-operator-final-convergence.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: learning-operator-one-shot-parent-guard-repair
  cancel-in-progress: false

jobs:
  rebind-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: codex/learning-operator-full-convergence-20260926
      DIAGNOSTICS_WORKFLOW: .github/workflows/learning-operator-diagnostics.yml
      REPAIR_WORKFLOW: .github/workflows/learning-operator-final-convergence.yml
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebind the audited materializer to this exact trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$REPAIR_WORKFLOW"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          target = Path(os.environ["DIAGNOSTICS_WORKFLOW"])
          text = target.read_text(encoding="utf-8")
          parent = os.environ["GITHUB_SHA"]
          pattern = re.compile(r"(?m)^(\s*EXPECTED_PARENT:\s*)[0-9a-f]{40}\s*$")
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"expected one EXPECTED_PARENT binding, found {len(matches)}")
          replacement = rf"\g<1>{parent}"
          updated = pattern.sub(replacement, text, count=1)
          if updated == text:
              raise SystemExit("EXPECTED_PARENT was not changed")
          target.write_text(updated, encoding="utf-8")
          PY

          mapfile -t dirty < <(git status --porcelain | sed 's/^...//')
          test "${#dirty[@]}" -eq 1
          test "${dirty[0]}" = "$DIAGNOSTICS_WORKFLOW"
          git diff --check

          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add "$DIAGNOSTICS_WORKFLOW"
          git commit \
            -m "ci(learning.operator): rebind one-shot materializer parent" \
            -m "Bind the authoritative exact-source writer to this precise trigger commit so its ancestry and single-file guards remain fail-closed." \
            -m "Signed-off-by: OpenAI <openai@users.noreply.github.com>"
          git push origin "HEAD:$TARGET_BRANCH"
