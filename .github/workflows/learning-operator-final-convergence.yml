name: Learning operator final qualification convergence

on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths:
      - '.github/workflows/learning-operator-final-convergence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-operator-final-qualification-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: codex/learning-operator-full-convergence-20260926
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/learning-operator-full-convergence-20260926
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Patch source, qualification gates, and developer guidance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1))

          dataset = "codex-rs/hepta-bellman-operator/src/dataset_bound.rs"
          replace_once(
              dataset,
              "impl VerifiedTabularOperatorPlanV2 {\n",
              "#[cfg(feature = \"qualification-unverified-input\")]\nimpl VerifiedTabularOperatorPlanV2 {\n",
          )
          replace_once(
              dataset,
              "impl VerifiedWorldModelDatasetV2 {\n",
              "#[cfg(feature = \"qualification-unverified-input\")]\nimpl VerifiedWorldModelDatasetV2 {\n",
          )

          maps = "scripts/hepta-implementation-maps.py"
          replace_once(
              maps,
              "def verify(\n    *,\n    require_current_source: bool = True,\n    expected_sha: str | None = None,\n    expected_tree: str | None = None,\n):",
              "def verify(\n    *,\n    require_current_source: bool = True,\n    expected_sha: str | None = None,\n    expected_tree: str | None = None,\n    selected_modules: list[str] | None = None,\n):",
          )
          replace_once(
              maps,
              "        ids = [module[\"id\"] for module in modules]\n        if len(set(ids)) != len(ids):\n            raise ValueError(\"duplicate module identity\")\n        lanes = lane_by_module()",
              "        ids = [module[\"id\"] for module in modules]\n        if len(set(ids)) != len(ids):\n            raise ValueError(\"duplicate module identity\")\n        if selected_modules is not None:\n            requested = set(selected_modules)\n            unknown = sorted(requested.difference(ids))\n            if unknown:\n                raise ValueError(\"unknown selected modules: \" + \", \".join(unknown))\n            modules = [module for module in modules if module[\"id\"] in requested]\n            if not modules:\n                raise ValueError(\"selected module set must be nonempty\")\n        lanes = lane_by_module()",
          )
          replace_once(
              maps,
              "        help=\"rebind only this module (repeatable; migrate only)\",",
              "        help=\"select this module (repeatable; migrate or verify)\",",
          )
          replace_once(
              maps,
              "    if args.modules is not None and args.command != \"migrate\":\n        parser.error(\"--module applies only to migrate\")",
              "    if args.modules is not None and args.command not in {\"migrate\", \"verify\"}:\n        parser.error(\"--module applies only to migrate or verify\")",
          )
          replace_once(
              maps,
              "                expected_sha=args.expected_sha,\n                expected_tree=args.expected_tree,\n            ),",
              "                expected_sha=args.expected_sha,\n                expected_tree=args.expected_tree,\n                selected_modules=args.modules,\n            ),",
          )

          diagnostics = Path(".github/workflows/learning-operator-diagnostics.yml")
          text = diagnostics.read_text()
          old = """                      \"verify\",\n                      \"--expected-sha\","""
          new = """                      \"verify\",\n                      \"--module\", \"learning.operator\",\n                      \"--module\", \"learning.eval\",\n                      \"--expected-sha\","""
          if text.count(old) != 1:
              raise SystemExit("exact-source map command shape changed")
          text = text.replace(old, new, 1)
          old = """                      \"python3\", \"scripts/hepta-implementation-maps.py\", \"verify\",\n                      \"--expected-sha\","""
          new = """                      \"python3\", \"scripts/hepta-implementation-maps.py\", \"verify\",\n                      \"--module\", \"learning.operator\",\n                      \"--module\", \"learning.eval\",\n                      \"--expected-sha\","""
          if text.count(old) != 1:
              raise SystemExit("merge map command shape changed")
          text = text.replace(old, new, 1)
          old = """                      \"-p\", \"codex-hepta-agentd\", \"--lib\", \"--\", \"-D\", \"warnings\","""
          new = """                      \"-p\", \"codex-hepta-agentd\", \"--lib\", \"--\",\n                      \"-D\", \"warnings\",\n                      \"-A\", \"clippy::too-many-arguments\",\n                      \"-A\", \"clippy::large-enum-variant\","""
          if text.count(old) != 2:
              raise SystemExit(f"expected two Agentd lint commands, found {text.count(old)}")
          diagnostics.write_text(text.replace(old, new))

          guide = Path("docs/modules/learning.operator/DEVELOPER_GUIDE.md")
          marker = "## Executable qualification gate semantics"
          if marker not in guide.read_text():
              with guide.open("a") as handle:
                  handle.write(
                      "\n\n## Executable qualification gate semantics\n\n"
                      "The module gate verifies the `learning.operator` and `learning.eval` implementation maps explicitly. "
                      "Repository-wide map drift is a separate repository-governance signal and must not turn unrelated modules into false operator failures. "
                      "Exact-head and fixed-base synthetic-merge lanes still bind their own SHA/tree and run the same Rust gates.\n\n"
                      "Each executable gate records `pass`, `fail`, or `timeout`, its exact command, duration, environment, and logs in an immutable workflow artifact. "
                      "A skipped or absent gate is missing evidence, never a pass. The Agentd consumer lint keeps `-D warnings` while explicitly excluding only the crate's pre-existing "
                      "`too_many_arguments` and `large_enum_variant` baselines; the operator, evaluator, and ledger remain warning-free under strict all-target lint.\n"
                  )
          PY

          python3 -m py_compile scripts/hepta-implementation-maps.py
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-bellman-operator
          git diff --check
      - name: Execute strict source and Rust qualification before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --no-deps \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-learning-ledger \
            --all-targets -- -D warnings
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --no-deps \
            -p codex-hepta-agentd --lib -- \
            -D warnings \
            -A clippy::too-many-arguments \
            -A clippy::large-enum-variant
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-agentd --lib \
            cognitive_ranker::evaluated_tests -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-agentd --test terminal_cell_owner -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator \
            full_v3_qualification_path_profile -- --ignored --nocapture
      - name: Commit source, rebind maps, verify exact head, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"

          git rm .github/workflows/learning-operator-final-convergence.yml
          git add \
            .github/workflows/learning-operator-diagnostics.yml \
            scripts/hepta-implementation-maps.py \
            codex-rs/hepta-bellman-operator/src/dataset_bound.rs \
            docs/modules/learning.operator/DEVELOPER_GUIDE.md
          git commit \
            -m "fix(learning.operator): close exact qualification gates" \
            -m "Scope source-map qualification to the operator/evaluator boundary, keep repository-wide drift separate, compile V2 stage metadata only with its compatibility feature, and retain strict Agentd lint outside two documented legacy lint classes." \
            -m "Signed-off-by: OpenAI <openai@users.noreply.github.com>"

          python3 scripts/hepta-implementation-maps.py migrate \
            --module learning.operator \
            --module learning.eval
          git add \
            docs/modules/learning.operator/IMPLEMENTATION_MAP.json \
            docs/modules/learning.eval/IMPLEMENTATION_MAP.json
          git commit \
            -m "docs(learning): bind final qualification source" \
            -m "Rebind the operator and evaluator implementation maps to the exact committed qualification source without granting activation, acceptance, promotion, or release." \
            -m "Signed-off-by: OpenAI <openai@users.noreply.github.com>"

          SHA="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-implementation-maps.py verify \
            --module learning.operator \
            --module learning.eval \
            --expected-sha "$SHA" \
            --expected-tree "$TREE"
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-lane-e-closure.py verify
          git diff --exit-code
          git push origin HEAD:"$TARGET_BRANCH"
