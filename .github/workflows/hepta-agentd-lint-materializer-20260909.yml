name: Hepta Agentd lint materializer 20260909

on:
  push:
    branches:
      - ops/hepta-agentd-lint-materializer-20260909-r2

permissions:
  contents: write

concurrency:
  group: hepta-agentd-lint-materializer-20260909-r2
  cancel-in-progress: false

jobs:
  amend-exact-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/hepta-all-gap-closure-20260908
          fetch-depth: 0
          persist-credentials: true

      - name: Bind, repair, qualify, and atomically amend
        shell: bash
        run: |
          set -euo pipefail
          expected_head=c916ecf0e3629411e56f086f2b3be5363ea5837d
          expected_parent=04f60466394a024c218ce66b1b32d1c42c462985
          candidate_ref=refs/heads/codex/hepta-all-gap-closure-20260908

          test "$(git rev-parse HEAD)" = "${expected_head}"
          test "$(git rev-parse HEAD^)" = "${expected_parent}"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-agentd/examples/h4_persistent_writer.rs")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          filter_matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == ".filter_map(|entry| {"
          ]
          if len(filter_matches) != 1:
              raise SystemExit(
                  f"expected one H4 filter_map entry block, found {len(filter_matches)}"
              )
          filter_index = filter_matches[0]
          lines[filter_index] = lines[filter_index].replace(
              ".filter_map(|entry| {", ".map(|entry| {", 1
          )

          constructor_matches = [
              index
              for index in range(filter_index + 1, len(lines))
              if "Some(CacheDeviceEvidence {" in lines[index]
          ]
          if len(constructor_matches) != 1:
              raise SystemExit(
                  "expected one H4 optional CacheDeviceEvidence constructor, "
                  f"found {len(constructor_matches)}"
              )
          constructor_index = constructor_matches[0]
          lines[constructor_index] = lines[constructor_index].replace(
              "Some(CacheDeviceEvidence {", "CacheDeviceEvidence {", 1
          )

          closing_index = next(
              (
                  index
                  for index in range(constructor_index + 1, len(lines))
                  if lines[index].strip() == "})"
              ),
              None,
          )
          if closing_index is None:
              raise SystemExit("H4 CacheDeviceEvidence constructor close marker drifted")
          lines[closing_index] = lines[closing_index].replace("})", "}", 1)

          path.write_text("".join(lines), encoding="utf-8")
          PY

          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-agentd
          git diff --check
          test "$(git diff --name-only | sort)" = "codex-rs/hepta-agentd/examples/h4_persistent_writer.rs"

          cd codex-rs
          cargo clippy --locked -p codex-hepta-agentd --no-deps \
            --example h4_persistent_writer \
            --features qualification-cognitive-write -- -D warnings
          cd ..

          git config user.name "hepta-gap-materializer"
          git config user.email "hepta-gap-materializer@users.noreply.github.com"
          git add codex-rs/hepta-agentd/examples/h4_persistent_writer.rs
          git commit --amend --no-edit
          test "$(git rev-parse HEAD^)" = "${expected_parent}"
          git push \
            --force-with-lease="${candidate_ref}:${expected_head}" \
            origin "HEAD:${candidate_ref}"
