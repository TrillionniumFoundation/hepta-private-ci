name: Hepta Matrix SDK 0.19 Security Upgrade Qualification (shadow)

on:
  push:
    branches:
      - experiment/hepta-security-matrix-sdk-019-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-locked-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Rust without changing security policy
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Resolve patched Matrix SDK family (artifact only)
        run: |
          set -euo pipefail
          grep -F 'matrix-sdk = { version = "0.19.0"' Cargo.toml
          cargo +1.95.0 update -p matrix-sdk --precise 0.19.0
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          packages = {entry["name"]: entry["version"] for entry in lock["package"]}
          crypto = packages.get("matrix-sdk-crypto")
          sdk = packages.get("matrix-sdk")
          if not sdk or not crypto or tuple(map(int, sdk.split(".")[:2])) < (0, 19) or tuple(map(int, crypto.split(".")[:2])) < (0, 19):
              raise SystemExit(f"Matrix still vulnerable: matrix-sdk={sdk}, matrix-sdk-crypto={crypto}")
          Path("matrix-security-evidence.json").write_text(
              json.dumps({
                  "schema": "hepta.matrix-security-resolution-shadow.v1",
                  "matrix_sdk": sdk, "matrix_sdk_crypto": crypto,
                  "anymap2_still_present": "anymap2" in packages,
                  "unsafe_libyaml_still_present": "unsafe-libyaml" in packages,
                  "cargo_deny_verified": False,
                  "production_promotion_permitted": False,
                  "source": "actual Cargo.lock produced by Cargo 1.95",
              }, indent=2) + "\n", encoding="utf-8"
          )
          PY
          cargo +1.95.0 metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Compile actual Matrix host with upgraded immutable dependency graph
        run: cargo +1.95.0 check --locked -p codex-hepta-matrix-sdk -p codex-hepta-matrix-store
      - name: Execute native Matrix SDK owner tests without disabling safety gates
        run: cargo +1.95.0 test --locked -p codex-hepta-matrix-sdk --lib
      - name: Strict Matrix owner Clippy
        run: cargo +1.95.0 clippy --locked -p codex-hepta-matrix-sdk --all-targets -- -D warnings
      - name: Preserve dependency resolution and honest fail-closed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matrix-sdk-019-security-resolution
          path: |
            codex-rs/Cargo.lock
            codex-rs/Cargo.toml
            codex-rs/matrix-security-evidence.json
          if-no-files-found: error
          retention-days: 14
