name: platform.wire read-only source consistency

on:
  push:
    branches:
      - codex/platform-wire-final-convergence-20260925
    paths:
      - '.github/workflows/platform-wire-repair.yml'
      - '.github/workflows/lane-a-foundation.yml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/hepta-wire/**'
      - 'docs/modules/MODULES.json'
      - 'docs/modules/platform.wire/**'
      - 'scripts/generate_lane_a_workflow_paths.py'
      - 'scripts/test_generate_lane_a_workflow_paths.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/platform-wire-repair.yml'
      - '.github/workflows/lane-a-foundation.yml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/hepta-wire/**'
      - 'docs/modules/MODULES.json'
      - 'docs/modules/platform.wire/**'
      - 'scripts/generate_lane_a_workflow_paths.py'
      - 'scripts/test_generate_lane_a_workflow_paths.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-wire-source-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # Source authoring belongs in ordinary reviewed commits. This workflow
      # never updates a lockfile, rewrites source, formats files, or pushes refs.
      - name: Verify source identity and generated path contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 scripts/generate_lane_a_workflow_paths.py check
          python3 -m unittest discover -s scripts -p 'test_generate_lane_a_workflow_paths.py'
          python3 scripts/platform_wire_status.py self-test
          python3 scripts/platform_wire_status.py check-doc

      - name: Reject source or untracked-file drift
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
