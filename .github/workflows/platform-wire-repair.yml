name: platform.wire one-shot repair

on:
  push:
    branches:
      - codex/platform-wire-final-convergence-20260925
    paths:
      - '.github/workflows/platform-wire-repair.yml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/hepta-wire/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/platform-wire-repair.yml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/hepta-wire/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-wire-one-shot-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'codex/platform-wire-final-convergence-20260925') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'codex/platform-wire-final-convergence-20260925')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Check out the writable branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Synchronize the local package lock entry and deterministic formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/Cargo.lock')
          text = path.read_text(encoding='utf-8')
          old = '''[[package]]
          name = "codex-hepta-wire"
          version = "0.0.0"
          dependencies = [
           "codex-hepta-types",
          ]
          '''
          new = '''[[package]]
          name = "codex-hepta-wire"
          version = "0.0.0"
          dependencies = [
           "codex-hepta-types",
           "serde_json",
          ]
          '''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('ambiguous codex-hepta-wire lock entry')
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('unexpected codex-hepta-wire lock entry')
          PY
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-wire
          git diff --check

      - name: Commit the atomic repair to the branch
        shell: bash
        run: |
          set -euo pipefail
          git add codex-rs/Cargo.lock codex-rs/hepta-wire
          if git diff --cached --quiet; then
            echo 'No repair changes were required.'
            exit 0
          fi
          git config user.name 'Hepta Platform Wire CI'
          git config user.email 'hepta-platform-wire-ci@users.noreply.github.com'
          git commit -m 'fix(platform.wire): synchronize lockfile and formatting'
          git push origin "HEAD:$HEAD_REF"

      - name: Validate the repaired checkout
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-wire -- --check
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-wire --no-run
          git diff --quiet
          git diff --cached --quiet
