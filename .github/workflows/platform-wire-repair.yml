name: platform.wire read-only source consistency

on:
  push:
    branches:
      - codex/platform-wire-final-convergence-20260925
    paths:
      - '.github/workflows/platform-wire-repair.yml'
      - '.github/workflows/lane-a-foundation.yml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/hepta-wire/**'
      - 'docs/modules/MODULES.json'
      - 'docs/modules/platform.wire/**'
      - 'scripts/generate_lane_a_workflow_paths.py'
      - 'scripts/test_generate_lane_a_workflow_paths.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/platform-wire-repair.yml'
      - '.github/workflows/lane-a-foundation.yml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/hepta-wire/**'
      - 'docs/modules/MODULES.json'
      - 'docs/modules/platform.wire/**'
      - 'scripts/generate_lane_a_workflow_paths.py'
      - 'scripts/test_generate_lane_a_workflow_paths.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-wire-source-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Retain exact source inputs independently of verification outcome
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/wire-source-inputs"
          git archive --format=tar.gz --output="$RUNNER_TEMP/wire-source-inputs/source.tar.gz" HEAD
          git show -s --format='%H%n%T%n%P%n%aI' HEAD > "$RUNNER_TEMP/wire-source-inputs/git-identity.txt"
          sha256sum "$RUNNER_TEMP/wire-source-inputs/source.tar.gz" > "$RUNNER_TEMP/wire-source-inputs/SHA256SUMS"

      - name: Upload immutable inputs (not a passing qualification receipt)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-wire-source-${{ env.EXPECTED_SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/wire-source-inputs/
          retention-days: 14
          if-no-files-found: error

      # Source authoring belongs in ordinary reviewed commits. This workflow
      # never updates a lockfile, rewrites source, formats files, or pushes refs.
      - name: Verify source identity and generated path contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 scripts/generate_lane_a_workflow_paths.py check
          python3 -m unittest discover -s scripts -p 'test_generate_lane_a_workflow_paths.py'
          python3 scripts/platform_wire_status.py self-test
          python3 scripts/platform_wire_status.py check-doc

      - name: Reject source or untracked-file drift
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
