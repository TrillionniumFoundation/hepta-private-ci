name: Runtime Codex Integration Audit

on:
  push:
    branches: [codex/runtime-codex-integration-20260928]
    paths: [.github/workflows/runtime-codex-integration-audit.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Retain exact source, not a qualification claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-codex-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/runtime-codex-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-codex-source/head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/runtime-codex-source/tree.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/runtime-codex-source/objects.txt"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: runtime-codex-source-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-codex-source
          retention-days: 7
          if-no-files-found: error
