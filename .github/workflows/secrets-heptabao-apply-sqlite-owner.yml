name: Apply and qualify secrets.heptabao SQLite owner

on:
  push:
    branches:
      - codex/secrets-heptabao-full-closure-20260927
    paths:
      - ".github/workflows/secrets-heptabao-apply-sqlite-owner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-sqlite-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-qualify-commit:
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 90
    steps:
      - name: Check out exact full-closure head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Reconstruct reviewed phase-three patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = codex/secrets-heptabao-full-closure-20260927
          git fetch --no-tags origin 96ff7270d83f235bb013b26bf6c324f5dfd758cd
          bundle="$RUNNER_TEMP/secrets-phase3.patch.gz.b64"
          patch="$RUNNER_TEMP/secrets-phase3.patch"
          : > "$bundle"
          for part in 00 01 02 03; do
            git show "96ff7270d83f235bb013b26bf6c324f5dfd758cd:.hepta-bootstrap/secrets-phase3/part-$part" >> "$bundle"
          done
          test "$(wc -c < "$bundle")" -eq 28000
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          sha256sum "$bundle" "$patch"
          grep '^diff --git ' "$patch" | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' | sort -u
          git apply --3way --index "$patch"
          git diff --cached --check
          git diff --cached --stat

      - name: Regenerate canonical module outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py --write
          python3 scripts/generate_secrets_heptabao_module.py
          git add docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/modules/secrets.heptabao/IMPLEMENTATION_MAP.json \
            docs/lane-a-foundation/secrets.heptabao/CURRENT_IMPLEMENTATION.md \
            qualification/module-execution-dossiers/detail/secrets.heptabao.md
          git diff --cached --check

      - name: Format and qualify production owner
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
          cd ..
          git add codex-rs
          git diff --cached --check
          cd codex-rs
          cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- --test-threads=2
          cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2

      - name: Commit exact qualified owner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/secrets-heptabao-apply-sqlite-owner.yml
          rm -f .github/workflows/secrets-heptabao-full-closure-source-export.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta secrets owner bot"
          git config user.email "hepta-secrets-owner@users.noreply.github.com"
          git commit -m "secrets: add qualified SQLite production owner"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
