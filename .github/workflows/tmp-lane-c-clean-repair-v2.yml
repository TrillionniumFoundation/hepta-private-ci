name: tmp-lane-c-clean-repair-v2

on:
  push:
    branches:
      - codex/lane-c-full-gap-closure-20260910
    paths:
      - .github/workflows/tmp-lane-c-clean-repair-v2.yml

permissions:
  contents: write

concurrency:
  group: tmp-lane-c-clean-repair-v2
  cancel-in-progress: false

jobs:
  repair-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Build committed clean candidate
        shell: bash
        run: |
          set -euo pipefail
          carrier="$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "codex/lane-c-full-gap-closure-20260910"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("qualification/module-execution-dossiers/NATIVE_BINDINGS.json")
          text = path.read_text(encoding="utf-8")
          stale = '"blobSha": "f4fca6216821c994a401e401442cf06f69a3d082"'
          exact = '"blobSha": "f4fca6216821c994a401e401442cf06f69a3d082"'
          stale_count = text.count(stale)
          exact_count = text.count(exact)
          if stale_count == 1 and exact_count == 0:
              text = text.replace(stale, exact, 1)
          elif stale_count == 0 and exact_count == 1:
              pass
          else:
              raise SystemExit(
                  f"unexpected inference.worker binding state: stale={stale_count} exact={exact_count}"
              )
          path.write_text(text, encoding="utf-8")
          PY
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-lane-c-native-binding-repair.yml \
            .github/workflows/tmp-lane-c-clean-repair-v2.yml
          git add qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(lane-c): publish exact clean native-source bindings'
          test "$(git rev-parse HEAD^)" = "$carrier"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify committed candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          git show --check --oneline --no-renames HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish verified clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/lane-c-full-gap-closure-20260910
