name: Context compiler bounded WIP recovery

on:
  push:
    branches: [context-compiler-product-closure]

permissions:
  contents: write

jobs:
  recover-existing-candidate:
    name: Recover existing context compiler worktree
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Commit and publish the existing bounded candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: context-compiler-product-closure
          EXPECTED_REMOTE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          R=/tmp/hepta-context-compiler-converge-20260925-JWHsTh/repo
          test -d "$R/.git"
          test "$(git -C "$R" branch --show-current)" = "$BRANCH"
          test "$(git -C "$R" rev-parse HEAD)" = a126987b84737dbc2ee2592442a314117bddb4a2
          test -f /tmp/hepta-context-compiler-converge-20260925-JWHsTh/backup-current/working-tree.patch
          git -C "$R" diff --check
          git -C "$R" status --short
          git -C "$R" add -A
          if ! git -C "$R" diff --cached --quiet; then
            git -C "$R" -c user.name='Hepta Context Closure' \
              -c user.email='context-closure@users.noreply.github.com' \
              commit -s -m 'feat(context.compiler): compose verified product delivery path'
          fi
          gh auth setup-git
          git -C "$R" push \
            --force-with-lease="refs/heads/$BRANCH:$EXPECTED_REMOTE_SHA" \
            origin "HEAD:refs/heads/$BRANCH"
