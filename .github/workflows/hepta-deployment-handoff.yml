name: Hepta deployment handoff (read-only)

on:
  pull_request:
    paths:
      - "tools/hepta-engineering-control/**"
      - "docs/modules/**"
      - "docs/cns/**"
      - "docs/data/**"
      - ".github/workflows/hepta-deployment-handoff.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$BASE_SHA" != "$SOURCE_SHA"
      - name: Reconstruct the exact qualified synthetic merge
        id: synthetic
        if: matrix.lane == 'synthetic-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Confirm tested candidate identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            expected='${{ steps.synthetic.outputs.sha }}'
            test "$(git show -s --format=%P HEAD)" = "$BASE_SHA $SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          git rev-parse HEAD HEAD^{tree}
      - name: Validate inventory behavior (full engineering suite belongs to scoped discovery)
        run: python3 -m unittest discover -s tools/hepta-engineering-control -p 'test_deployment_inventory.py' -v
      - name: Generate exact committed inventory
        shell: bash
        run: |
          set -euo pipefail
          mode=source-head
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            mode=base-merge
          fi
          export CANDIDATE_MODE="$mode"
          python3 tools/hepta-engineering-control/deployment_inventory.py \
            --base "$BASE_SHA" \
            --source "$SOURCE_SHA" \
            --mode "$mode" > "$RUNNER_TEMP/deployment-inventory.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess

          path = os.path.join(os.environ["RUNNER_TEMP"], "deployment-inventory.json")
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)
          with open("docs/modules/MODULES.json", encoding="utf-8") as handle:
              modules = json.load(handle)["modules"]
          with open("docs/cns/CNS_ARCHITECTURE.json", encoding="utf-8") as handle:
              organs = json.load(handle)["organs"]
          assert {row["id"] for row in payload["modules"]} == {row["id"] for row in modules}
          assert {row["id"] for row in payload["organs"]} == {row["id"] for row in organs}
          assert payload["sourceCommit"] == os.environ["SOURCE_SHA"]
          assert payload["testedCommit"] == subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          assert payload["candidateMode"] == os.environ["CANDIDATE_MODE"]
          if os.environ["CANDIDATE_MODE"] == "base-merge":
              assert payload["orderedMergeParents"] == [
                  os.environ["BASE_SHA"],
                  os.environ["SOURCE_SHA"],
              ]
          else:
              assert payload["orderedMergeParents"] == []
          assert not payload["runtimeAuthority"]
          print(json.dumps(payload, indent=2))
          PY
      - name: Ensure tests did not rewrite tracked source
        if: always()
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
