name: Hepta deployment handoff (read-only)

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
    inputs:
      source_sha:
        description: Source commit; defaults to the pull request head or invoking commit.
        required: false
        type: string
      base_sha:
        description: Comparison commit; defaults to the pull request base or invoking commit.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source commit; leave empty to inventory this workflow's commit.
        required: false
        type: string
      base_sha:
        description: Comparison commit; leave empty to use this workflow's commit.
        required: false
        type: string

concurrency:
  group: hepta-deployment-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A main dispatch inventories one source, without inventing a merge.
        lane: ${{ fromJSON((inputs.base_sha || github.event.pull_request.base.sha || github.sha) == (inputs.source_sha || github.event.pull_request.head.sha || github.sha) && '["source-head"]' || '["source-head","synthetic-merge"]') }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.sha }}
      HANDOFF_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and actual-base synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          INVENTORY_BASE_SHA=$(git merge-base "$BASE_SHA" "$SOURCE_SHA")
          if [ "$HANDOFF_LANE" = synthetic-merge ]; then
            test "$BASE_SHA" != "$SOURCE_SHA"
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only, no selection' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
            INVENTORY_BASE_SHA="$BASE_SHA"
          fi
          printf 'INVENTORY_BASE_SHA=%s\n' "$INVENTORY_BASE_SHA" >> "$GITHUB_ENV"
          printf 'source=%s\ntarget=%s\ninventory_base=%s\n' "$SOURCE_SHA" "$BASE_SHA" "$INVENTORY_BASE_SHA"
          git rev-parse HEAD HEAD^{tree}
      - name: Validate inventory behavior (full engineering suite belongs to scoped discovery)
        run: python3 -m unittest discover -s tools/hepta-engineering-control -p 'test_deployment_inventory.py' -v
      - name: Generate exact committed inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hepta-engineering-control/deployment_inventory.py --base "$INVENTORY_BASE_SHA" > "$RUNNER_TEMP/deployment-inventory.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/deployment-inventory.json")); assert {m["id"] for m in p["modules"]} == {m["id"] for m in json.load(open("docs/modules/MODULES.json"))["modules"]}; assert {o["id"] for o in p["organs"]} == {o["id"] for o in json.load(open("docs/cns/CNS_ARCHITECTURE.json"))["organs"]}; assert not p["runtimeAuthority"]; print(json.dumps(p,indent=2))'
      - name: Ensure tests did not rewrite tracked source
        if: always()
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
