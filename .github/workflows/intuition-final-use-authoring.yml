name: intuition.policy Final-Use Authoring
on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths: [.github/intuition-final-use-authoring/TRIGGER]
permissions:
  contents: write
concurrency:
  group: intuition-final-use-authoring-${{ github.sha }}
  cancel-in-progress: false
jobs:
  author:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Transform, qualify and push exact source
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: codex/intuition-policy-production-closure-20260927
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          raw = b''.join(path.read_bytes() for path in sorted(Path('.github/intuition-final-use-authoring').glob('part-*')))
          Path(__import__('os').environ['RUNNER_TEMP'], 'transform.py').write_bytes(gzip.decompress(base64.b64decode(raw)))
          PY
          test "$(sha256sum "$RUNNER_TEMP/transform.py" | awk '{print $1}')" = "ecc77ed897363aa99e2d6d7f406773a0c37d2217fe76c12fee1eeb82e02c85f4"
          python3 "$RUNNER_TEMP/transform.py"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/hepta-agentd/tests/intuition_policy_product_v3.rs')
          text = path.read_text()
          text = text.replace(
              '    fn set(&self, now: u64) {',
              '    #[allow(dead_code)]\n    fn set(&self, now: u64) {',
              1,
          )
          text = text.replace(
              '\nfn successor_trust_distribution(',
              '\n#[allow(dead_code)]\nfn successor_trust_distribution(',
              1,
          )
          path.write_text(text)
          PY
          git diff --check
          cd codex-rs
          cargo fmt --package codex-hepta-agentd
          cargo fmt --package codex-hepta-agentd -- --check
          cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-learning-ledger -p codex-hepta-agentd --all-targets
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_product_v3
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_commit_boundary
          cargo test --locked -p codex-hepta-agentd intuition_policy
          cargo clippy --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-learning-ledger -p codex-hepta-agentd --all-targets -- -D warnings
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codex-rs/hepta-agentd/src/intuition_policy.rs').read_text()
          s=p.index('fn commit_prepared('); l=p.index('.writer\n            .lock()',s); c=p.index('let now = self.clock.now()?;',s); v=p.index('let revalidated = decide_authenticated_intuition_v3(',s); a=p.index('writer.append_decision(',s)
          assert s < l < c < v < a
          assert 'owner_trust_generation' in p and 'OwnedIntuitionQualificationEvidenceV2' in p
          assert 'commit_intuition_policy_v3' not in Path('codex-rs/hepta-agentd/src/intuition_policy_service.rs').read_text()
          assert 'commit_now' not in Path('codex-rs/hepta-agentd/src/intuition_policy_serving.rs').read_text()
          tests = Path('codex-rs/hepta-agentd/tests/intuition_policy_commit_boundary.rs').read_text()
          assert 'writer_wait_samples_fresh_clock_and_expires_before_any_ledger_mutation' in tests
          assert 'rotate to revoked-generator trust generation' in tests
          PY
          rm -f .github/intuition-final-use-authoring/part-* \
                .github/intuition-final-use-authoring/TRIGGER \
                .github/workflows/intuition-final-use-authoring.yml
          rmdir .github/intuition-final-use-authoring
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(intuition): revalidate final use under writer lock'
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
