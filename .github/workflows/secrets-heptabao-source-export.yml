name: Export secrets.heptabao remediation workspace

on:
  push:
    branches:
      - codex/secrets-heptabao-convergence
    paths:
      - ".github/workflows/secrets-heptabao-source-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Pack exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-export
          git archive --format=tar.gz \
            --output=.hepta-export/secrets-heptabao-source.tgz HEAD
          sha256sum .hepta-export/secrets-heptabao-source.tgz > .hepta-export/SHA256SUMS
          git rev-parse HEAD > .hepta-export/HEAD
          git rev-parse HEAD^{tree} > .hepta-export/TREE

      - name: Upload exact workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-source-${{ github.sha }}
          path: .hepta-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

