name: Export secrets.heptabao remediation workspace

on:
  push:
    branches:
      - codex/secrets-heptabao-convergence
    paths:
      - ".github/workflows/secrets-heptabao-source-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Pack bounded remediation workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-export
          tar -czf .hepta-export/secrets-heptabao-source.tgz \
            .cargo \
            rust-toolchain.toml \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            codex-rs/hepta-bao-adapter \
            codex-rs/hepta-authbus \
            codex-rs/hepta-contracts \
            codex-rs/hepta-types \
            codex-rs/http-client \
            codex-rs/state/sqlite \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/lane-a-foundation/secrets.heptabao \
            docs/modules/secrets.heptabao \
            qualification/module-execution-dossiers \
            scripts/generate_secrets_heptabao_module.py \
            .github/workflows/lane-a-foundation.yml \
            .github/workflows/secrets-heptabao-manifest-materialize.yml \
            .github/workflows/secrets-heptabao-source-export.yml
          sha256sum .hepta-export/secrets-heptabao-source.tgz > .hepta-export/SHA256SUMS
          git rev-parse HEAD > .hepta-export/HEAD
          git rev-parse HEAD^{tree} > .hepta-export/TREE

      - name: Upload exact workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-source-${{ github.sha }}
          path: .hepta-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
