name: Codex HIA duration units component

on:
  pull_request:
    paths:
      - hia/duration_units.hepta
      - hia/duration_units_buffer_contract.json
      - hia/build_duration_units.py
      - hia/tests/test_duration_units.py
      - hia/tests/duration_units_oracle/**
      - hia/tests/duration_units_cases.py
      - hia/tests/datetime_calendar_oracle/custody.py
      - hia/tests/test_datetime_calendar.py
      - hia/toolchain.json
      - .github/workflows/codex-hia-duration-units.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duration-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out the producing source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: codex
          persist-credentials: false

      - name: Check out the unchanged pinned HIA compiler
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TrillionniumFoundation/Hepta
          ref: 0de5657a80f96b138525ac7ee9ce11712a83a10d
          path: Hepta
          persist-credentials: false

      - name: Check out the immutable original dependency lock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 756f7a31ad4373809a00da65a91ba1ca4571f6cb
          path: original
          persist-credentials: false
          sparse-checkout: codex-rs/Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Select the formal Rust oracle compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.96.1" >> "$GITHUB_ENV"
          echo "DURATION_RUSTC=$(rustup which --toolchain 1.96.1 rustc)" >> "$GITHUB_ENV"
          echo "DURATION_CARGO=$(rustup which --toolchain 1.96.1 cargo)" >> "$GITHUB_ENV"

      - name: Rebuild B1, B2, B3 and the duration units with native HIA
        shell: bash
        run: |
          set -euo pipefail
          python3 -B codex/hia/build_duration_units.py \
            --hepta-root "$GITHUB_WORKSPACE/Hepta" \
            --output "$RUNNER_TEMP/duration-native" \
            2>&1 | tee "$RUNNER_TEMP/duration-build.log"

      - name: Run original Chrono constructor, accessor and buffer differentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -B codex/hia/tests/test_duration_units.py \
            --build "$RUNNER_TEMP/duration-native" \
            --original-lock "$GITHUB_WORKSPACE/original/codex-rs/Cargo.lock" \
            --cargo "$DURATION_CARGO" --rustc "$DURATION_RUSTC" \
            --output "$RUNNER_TEMP/duration-differential" \
            2>&1 | tee "$RUNNER_TEMP/duration-differential.log"

      - name: Preserve complete component receipts and call transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hia-duration-units-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/duration-build.log
            ${{ runner.temp }}/duration-differential.log
            ${{ runner.temp }}/duration-native/**
            ${{ runner.temp }}/duration-differential/*.json
            ${{ runner.temp }}/duration-differential/*.bin
            ${{ runner.temp }}/duration-differential/*.gz
            ${{ runner.temp }}/duration-differential/*.stdout
            ${{ runner.temp }}/duration-differential/*.stderr
            ${{ runner.temp }}/duration-differential/target/debug/codex-hia-duration-units-oracle
