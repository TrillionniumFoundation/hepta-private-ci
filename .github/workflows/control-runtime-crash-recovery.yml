name: control.runtime canonical rustfmt capture

on:
  pull_request:
    branches: [main]
    paths:
      - 'codex-rs/hepta-control-plane/**'
      - '.github/workflows/control-runtime-crash-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-runtime-rustfmt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-rustfmt:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Generate canonical package formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-control-plane

      - name: Retain exact formatted files and patch
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/control-runtime-rustfmt"
          mkdir -p "$bundle/files"
          git diff --check
          git diff --binary > "$bundle/rustfmt.patch"
          git diff --name-only --diff-filter=ACMRT > "$bundle/paths.txt"
          git rev-parse HEAD > "$bundle/source-head.txt"
          rustfmt --version > "$bundle/rustfmt-version.txt"
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path.cwd()
          bundle_root = Path(os.environ["RUNNER_TEMP"]) / "control-runtime-rustfmt"
          files = bundle_root / "files"
          paths = (bundle_root / "paths.txt").read_text().splitlines()
          for value in paths:
              source = root / value
              if not source.is_file():
                  raise SystemExit(f"formatted path is not a file: {value}")
              destination = files / value
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)

          status = "changes\n" if paths else "clean\n"
          (bundle_root / "format-status.txt").write_text(status)
          PY
          test -f "$bundle/rustfmt.patch"
          test -f "$bundle/paths.txt"
          test -s "$bundle/source-head.txt"
          test -s "$bundle/rustfmt-version.txt"
          test -s "$bundle/format-status.txt"

      - name: Upload canonical formatting bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-runtime-rustfmt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/control-runtime-rustfmt
          if-no-files-found: error
          retention-days: 7
