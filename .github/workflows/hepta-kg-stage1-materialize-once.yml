name: Hepta knowledge.graph one-shot stage-one materialization

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - .github/workflows/hepta-kg-stage1-materialize-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-kg-stage1-materialize-${{ github.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure repository author
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"

      - name: Extract and apply content-addressed reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          payload_source=.github/patches/hepta-kg-stage1.patch-source.yml
          test "$(git hash-object "$payload_source")" = "88630c6733bd2f363d1d89da2b34989c911ccc4c"
          python3 - "$payload_source" "$RUNNER_TEMP/kg-stage1.patch" <<'PY'
          import base64
          import gzip
          import hashlib
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(
              r"cat > .*?kg\.patch\.gz\.b64.*?<<'PATCH'\n(.*?)\n\s*PATCH\n",
              source,
              flags=re.DOTALL,
          )
          if match is None:
              raise SystemExit("embedded reviewed patch was not found")
          payload = "".join(line.strip() for line in match.group(1).splitlines())
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          expected_size = 31802
          expected_sha = "aab5aad22816decdf84fe945c7fd7f9fc5277ebae3e56f89a882ca20ff49a0af"
          observed = hashlib.sha256(patch).hexdigest()
          if len(patch) != expected_size or observed != expected_sha:
              raise SystemExit(
                  f"unexpected patch identity: bytes={len(patch)} sha256={observed}"
              )
          Path(sys.argv[2]).write_bytes(patch)
          print(f"verified reviewed patch: bytes={len(patch)} sha256={observed}")
          PY
          git apply --stat "$RUNNER_TEMP/kg-stage1.patch"
          git apply --3way --index "$RUNNER_TEMP/kg-stage1.patch"

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs
          codex-rs/hepta-kg/Cargo.toml
          codex-rs/hepta-kg/src/guarded_query.rs
          codex-rs/hepta-kg/src/incremental.rs
          codex-rs/hepta-kg/src/indexed_query.rs
          codex-rs/hepta-kg/src/prompt_factor_tests.rs
          codex-rs/hepta-kg/src/resource.rs
          codex-rs/hepta-memory/src/cognitive_kg_history_tests.rs
          codex-rs/hepta-memory/src/cognitive_retrieval.rs
          codex-rs/hepta-memory/tests/kg_delivery_consistency.rs
          codex-rs/hepta-prompt-optimizer/Cargo.toml
          codex-rs/hepta-prompt-optimizer/src/graph_tests.rs
          codex-rs/hepta-prompt-registry/Cargo.toml
          codex-rs/hepta-prompt-registry/src/lib.rs
          scripts/hepta_kg_legacy_guard.py
          EOF
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/observed-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/observed-paths"
          git diff --check --cached

      - name: Format materialized Rust source
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --package codex-hepta-kg --package codex-hepta-prompt-registry --package codex-hepta-prompt-optimizer --package codex-hepta-memory --package codex-hepta-agentd
          cd ..
          git add -A
          git diff --cached --check

      - name: Commit and push ordinary source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "reviewed stage-one patch produced no changes" >&2
            exit 1
          fi
          git commit -s -m "feat(knowledge.graph): materialize stage-one resource correctness"
          git push origin "HEAD:${GITHUB_REF_NAME}"
