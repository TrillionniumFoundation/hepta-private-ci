name: cognitive-types-compile-repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: cognitive-types-compile-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/cognitive-types-production-hardening-20260926'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out writable branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository-pinned formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt

      - name: Apply minimal compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          durable = Path('codex-rs/hepta-operations/src/durable_store.rs')
          text = durable.read_text(encoding='utf-8')
          needle = 'use std::time::SystemTime;\n'
          if 'use std::time::Duration;\n' not in text:
              if needle not in text:
                  raise SystemExit('durable_store import anchor missing')
              text = text.replace(needle, 'use std::time::Duration;\n' + needle, 1)
          durable.write_text(text, encoding='utf-8')

          wire = Path('codex-rs/hepta-cognitive-types/src/wire.rs')
          text = wire.read_text(encoding='utf-8')
          old = '    let payload_bytes = encode_payload_canonical_v1(value)?;\n'
          new = '    encode_payload_canonical_v1(value)?;\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('wire validation anchor missing')
          wire.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Commit repairs and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cognitive-types-compile-repair.yml
          git config user.name 'hepta-ci'
          git config user.email 'hepta-ci@users.noreply.github.com'
          git add codex-rs/hepta-operations/src/durable_store.rs \
                  codex-rs/hepta-cognitive-types/src/wire.rs \
                  .github/workflows/cognitive-types-compile-repair.yml
          git diff --cached --check
          git commit -m 'fix(cognitive.types): restore compile-safe validation paths'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
