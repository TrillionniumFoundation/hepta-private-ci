name: MemoryCell isolated frozen-policy formatting
on:
  pull_request:
    paths:
      - '.github/workflows/hepta-memory-frozen-policy-format.yml'
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.pull_request.number == 1452 && github.head_ref == 'codex/memory-cell-evidence-20261008' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: ./.github/actions/setup-ci
      - name: Prepare a reviewable formatting-only branch, never main or the PR head
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/frozen-fmt
          /tmp/frozen-fmt/bin/pip install uv==0.8.22 PyYAML==6.0.2
          export PATH="/tmp/frozen-fmt/bin:$PATH"
          python3 - <<'PY'
          import ast, json, yaml
          from pathlib import Path
          files = ['frozen_memory_session.py', 'policy_ancestry.py', 'frozen_policy_trial.py',
                   'frozen_policy_audit.py', 'test_policy_ancestry.py', 'test_frozen_policy_trial.py']
          before = {str(Path('scripts/memory_cell', f)): ast.dump(ast.parse(Path('scripts/memory_cell', f).read_text())) for f in files}
          workflow = {str(p): yaml.safe_load(p.read_text()) for p in [
              Path('.github/workflows/hepta-memory-frozen-policy.yml'),
              Path('.github/workflows/hepta-memory-frozen-policy-format.yml')]}
          Path('/tmp/frozen-asts.json').write_text(json.dumps(before))
          Path('/tmp/frozen-yaml.json').write_text(json.dumps(workflow))
          PY
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --base "$BASE"
          python3 - <<'PY'
          import ast, json, subprocess, yaml
          from pathlib import Path
          before = json.loads(Path('/tmp/frozen-asts.json').read_text())
          workflows = json.loads(Path('/tmp/frozen-yaml.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert not set(changed) - set(before) - set(workflows), 'out-of-scope formatter mutation'
          for name, tree in before.items():
              assert ast.dump(ast.parse(Path(name).read_text())) == tree, 'executable AST changed'
          for name, tree in workflows.items():
              # JSON normalization also normalizes YAML 1.1's boolean mapping keys.
              assert json.loads(json.dumps(yaml.safe_load(Path(name).read_text()))) == tree, 'workflow semantics changed'
          if changed:
              subprocess.run(['git', 'add', '--', *changed], check=True)
          PY
          git rm .github/workflows/hepta-memory-frozen-policy-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory-cell): format frozen-policy sources and remove temporary writer'
          git push origin "HEAD:refs/heads/codex/memory-frozen-policy-format-${GITHUB_RUN_ID}"
          echo "REVIEW_CANDIDATE_SHA=$(git rev-parse HEAD)"
