name: Automation TaskFlow current-source schema-22 convergence

on:
  push:
    branches:
      - work/automation-taskflow-full-closure-2026-09-27
    paths:
      - .github/workflows/automation-taskflow-converge-20260927.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-taskflow-schema22-current-source-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-full-closure-2026-09-27
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse concurrent-head overwrite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote="$(git ls-remote origin refs/heads/work/automation-taskflow-full-closure-2026-09-27 | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"

      - name: Verify current schema-22 source anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'pub const AUTOMATION_SCHEMA_VERSION: u32 = 22;' codex-rs/hepta-automation/src/lib.rs
          grep -Fq 'CREATE TABLE neural_circuit_runs' codex-rs/hepta-automation/migrations/0022_durable_neural_circuit.sql
          grep -Fq 'CREATE TABLE neural_circuit_activation_receipts' codex-rs/hepta-automation/migrations/0022_durable_neural_circuit.sql
          grep -Fq 'committed circuit outcome has no activation receipt' codex-rs/hepta-automation/src/durable_neural_circuit.rs
          grep -Fq 'check_circuit_taskflow_fence_tx' codex-rs/hepta-automation/src/durable_neural_circuit.rs
          grep -Fq 'settle_durable_neural_circuit_recovery_v1' codex-rs/hepta-automation/src/durable_neural_circuit_recovery.rs
          grep -Fq -- '--test durable_neural_circuit' .github/workflows/automation-taskflow-selected-host.yml
          grep -Fq -- '--test durable_neural_circuit_recovery' .github/workflows/automation-taskflow-selected-host.yml
          git diff --exit-code
          git diff --cached --exit-code

      - name: Configure ordinary commits
        shell: bash
        run: |
          git config user.name "hepta-automation-convergence"
          git config user.email "hepta-automation-convergence@users.noreply.github.com"

      - name: Converge truthful schema and documentation state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/automation_taskflow_truthful_finalize_20260929.py \
            scripts/automation_taskflow_contract.py \
            scripts/automation_taskflow_selected_host.py
          python3 scripts/automation_taskflow_truthful_finalize_20260929.py
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          technical = root / "docs/modules/automation.taskflow/TECHNICAL.md"
          body = technical.read_text(encoding="utf-8")
          body = body.replace("**Durable store schema:** **v21**", "**Durable store schema:** **v22**")
          body = body.replace("## 3. Durable schema v21 and retained history", "## 3. Durable schema v22 and retained history")
          body = body.replace("schema 21 must not open", "schema 22 must not open")
          row21 = "| 21 | indexed sparse unknown frontier | preserves migration 20's checksum and selects the indexed dispatch key |"
          row22 = "| 22 | durable Neural Circuit activation, receipts, choices and checkpoints | additive existing-owner state; unsettled owner contact prevents handoff |"
          if row22 not in body:
              if row21 not in body:
                  raise SystemExit("TECHNICAL migration-table anchor is missing")
              body = body.replace(row21, row21 + "\n" + row22, 1)
          old_status = (
              "**Status:** V1 durable owner and configured Agentd product composition are\n"
              "source-present. Exact-head/native/merged-tree execution, durable Circuit product\n"
              "integration, cross-host operation and selected-runtime evidence remain distinct\n"
              "unfinished work. No deployment or independent acceptance is asserted."
          )
          new_status = (
              "**Status:** schema-22 durable Circuit source is present in the native build tree,\n"
              "while its normal Agentd DecisionCell/organ/Wait/Effect product port is still open.\n"
              "Exact-head and merged-tree execution, real process/two-host recovery, bounded\n"
              "TaskFlow startup, selected-host behavior and independent acceptance remain separate."
          )
          body = body.replace(old_status, new_status)
          old_owner = (
              "The bounded Neural Circuit library adapter produces choice/organ/wait traces up\n"
              "to a wait or effect boundary. It is not yet the durable product interpreter."
          )
          new_owner = (
              "The bounded Neural Circuit adapter now has a schema-22 durable owner extension: it\n"
              "persists activation intent, reservation, exact outcome, choices and checkpoints.\n"
              "It still lacks the normal Agentd product port that supplies real owner components."
          )
          body = body.replace(old_owner, new_owner)
          old_row = "| Neural Circuit activation adapter | `neural_circuit_runtime/` | library trace/boundary output; durable product continuation remains open |"
          new_rows = (
              "| Neural Circuit runtime adapter | `neural_circuit_runtime/` | bounded trace and boundary computation |\n"
              "| Durable Neural Circuit owner | `durable_neural_circuit.rs`, `durable_neural_circuit_recovery.rs` | schema-22 persistence; normal Agentd owner-port composition remains open |"
          )
          body = body.replace(old_row, new_rows)
          technical.write_text(body, encoding="utf-8")

          slo = root / "docs/modules/automation.taskflow/SLO.md"
          body = slo.read_text(encoding="utf-8").replace(
              "These schema-21 objectives", "These schema-22 objectives"
          )
          slo.write_text(body, encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/automation_taskflow_contract.py")
          body = path.read_text(encoding="utf-8")
          old = '''COMPONENTS = ("boundedAdmissionBatchComplete", "separateRecoveryBudgetComplete",
              "externalEffectProductCompositionComplete",
              "neuralCircuitRuntimeVerticalSliceComplete", "durableNeuralCircuitProductComplete",
              "crossHostRecoveryContractComplete", "crossHostRecoveryProductComplete",
              "selectedHostQualificationPathComplete", "independentAcceptanceVerificationPathComplete")
'''
          new = '''COMPONENTS = ("boundedAdmissionBatchComplete", "separateRecoveryBudgetComplete",
              "externalEffectProductCompositionComplete",
              "neuralCircuitRuntimeVerticalSliceComplete", "durableNeuralCircuitSourceComplete",
              "durableNeuralCircuitBuildTreeComplete", "durableNeuralCircuitProductComplete",
              "crossHostRecoveryContractComplete", "signedCrossHostFenceReceiptComplete",
              "crossHostRecoveryProductComplete", "boundedOccurrenceStartupVerificationComplete",
              "boundedTaskFlowStartupVerificationComplete", "exactConsumedSelectedHostBindingComplete",
              "selectedHostQualificationPathComplete", "independentAcceptanceVerificationPathComplete")
DELIVERY_STAGES = ("schema22SourcePresent", "nativeBuildTreeIntegrated",
                   "normalProductEntrypointComposed", "exactSourceQualificationPassed",
                   "deterministicMergeQualificationPassed", "selectedHostBehaviorPassed",
                   "independentAcceptancePassed")
'''
          if "DELIVERY_STAGES =" not in body:
              if old not in body:
                  raise SystemExit("contract component-list anchor is missing")
              body = body.replace(old, new, 1)
          old = '''    gaps = implementation.get("remainingModuleGaps")
    product_gaps = implementation.get("repositoryControlledProductCompositionGaps")
'''
          new = '''    stages = implementation.get("deliveryStages")
    need(isinstance(stages, dict), "implementation map deliveryStages is missing")
    for key in DELIVERY_STAGES:
        need(type(stages.get(key)) is bool, f"delivery stage {key} must be an explicit boolean")
    need(stages["schema22SourcePresent"], "schema-22 source stage must reflect the current source")
    need(stages["nativeBuildTreeIntegrated"], "schema-22 native build-tree stage is missing")
    need(not stages["normalProductEntrypointComposed"],
         "source map cannot claim the missing normal Agentd Circuit entrypoint")
    for key in ("exactSourceQualificationPassed", "deterministicMergeQualificationPassed",
                "selectedHostBehaviorPassed", "independentAcceptancePassed"):
        need(stages[key] is False, f"source map cannot self-issue delivery stage {key}")
    gaps = implementation.get("remainingModuleGaps")
    product_gaps = implementation.get("repositoryControlledProductCompositionGaps")
'''
          if "implementation map deliveryStages is missing" not in body:
              if old not in body:
                  raise SystemExit("contract facts anchor is missing")
              body = body.replace(old, new, 1)
          old = '''        "claimBoundary": {key: claims[key] for key in (*REPOSITORY, *COMPONENTS, *EXTERNAL)},
        "remainingModuleGaps": implementation["remainingModuleGaps"],
'''
          new = '''        "claimBoundary": {key: claims[key] for key in (*REPOSITORY, *COMPONENTS, *EXTERNAL)},
        "deliveryStages": {key: implementation["deliveryStages"][key] for key in DELIVERY_STAGES},
        "remainingModuleGaps": implementation["remainingModuleGaps"],
'''
          if '"deliveryStages": {key:' not in body:
              if old not in body:
                  raise SystemExit("contract projection anchor is missing")
              body = body.replace(old, new, 1)
          old = '''    lines += [f"| `{key}` | `{str(value).lower()}` |" for key, value in state["claimBoundary"].items()]
    lines += ["", "## Remaining module work", ""]
'''
          new = '''    lines += [f"| `{key}` | `{str(value).lower()}` |" for key, value in state["claimBoundary"].items()]
    lines += ["", "## Layered delivery status", "", "| Delivery stage | State |", "|---|---|"]
    lines += [f"| `{key}` | `{str(value).lower()}` |" for key, value in state["deliveryStages"].items()]
    lines += ["", "## Remaining module work", ""]
'''
          if "## Layered delivery status" not in body:
              if old not in body:
                  raise SystemExit("contract status-render anchor is missing")
              body = body.replace(old, new, 1)
          path.write_text(body, encoding="utf-8")
          PY
          python3 scripts/automation_taskflow_contract.py render
          python3 scripts/hepta_transition_lineage.py
          python3 scripts/hepta-document-index.py
          git rm -r \
            .github/workflows/automation-taskflow-converge-20260927.yml \
            scripts/automation_taskflow_converge_20260927.py \
            scripts/automation_taskflow_finalize_20260928.py \
            scripts/automation_taskflow_truthful_finalize_20260929.py \
            scripts/automation_taskflow_patch_parts
          git diff --check
          git add -u
          while IFS= read -r -d '' path; do
            git add -- "$path"
          done < <(git ls-files --others --exclude-standard -z)
          for generated in \
            docs/generated/TRANSITION_STATE_GRAPH.json \
            docs/generated/TRANSITION_STATE_REPORT.md \
            docs/generated/DOCUMENT_INDEX.md \
            docs/generated/DOCUMENT_INDEX.json
          do
            test -f "$generated"
            git add -f -- "$generated"
          done
          git commit --no-verify -m "docs(automation): align schema-22 layered source truth"

      - name: Refresh implementation-map navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module automation.taskflow
          git diff --check
          if ! git diff --quiet; then
            git add docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json
            git commit -m "docs(automation): refresh schema-22 implementation navigation"
          fi

      - name: Bind exact source objects and generated projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/automation_taskflow_contract.py observe
          python3 scripts/automation_taskflow_contract.py render
          python3 scripts/hepta_transition_lineage.py
          python3 scripts/hepta-document-index.py
          git diff --check
          if ! git diff --quiet; then
            git add -u
            while IFS= read -r -d '' path; do
              git add -- "$path"
            done < <(git ls-files --others --exclude-standard -z)
            for generated in \
              docs/generated/TRANSITION_STATE_GRAPH.json \
              docs/generated/TRANSITION_STATE_REPORT.md \
              docs/generated/DOCUMENT_INDEX.md \
              docs/generated/DOCUMENT_INDEX.json
            do
              test -f "$generated"
              git add -f -- "$generated"
            done
            git commit -m "docs(automation): bind exact schema-22 source objects"
          fi

      - name: Verify final self-contained source candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          python3 scripts/automation_taskflow_contract.py self-test
          python3 -m unittest -v \
            scripts/test_automation_taskflow_contract.py \
            scripts/test_verify_automation_taskflow_acceptance.py \
            scripts/test_automation_recovery_sweeps.py \
            scripts/test_automation_taskflow_checkpoint.py \
            scripts/test_automation_taskflow_commands.py \
            scripts/test_automation_taskflow_selected_host.py
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$candidate_sha" \
            --expected-tree "$candidate_tree"
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-design-provenance.py verify
          python3 scripts/hepta-transition-state.py verify
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push only if remote still names the trigger commit
        env:
          TARGET_BRANCH: work/automation-taskflow-full-closure-2026-09-27
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
