name: Cognitive read one-shot convergence

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
    paths:
      - ".github/scripts/cognitive_read_converge.py.xz.b64.*"
      - ".github/workflows/cognitive-read-one-shot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-read-one-shot-${{ github.ref_name }}
  cancel-in-progress: true

env:
  RUST_MIN_STACK: "8388608"
  TARGET_BRANCH: work/cognitive-read-production-convergence-20260927

jobs:
  converge:
    name: Apply, qualify, and seal cognitive.read convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Configure exact writer identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cognitive Read Convergence'
          git config user.email 'cognitive-read-convergence@users.noreply.github.com'
          test "$(git branch --show-current)" = "$TARGET_BRANCH" || git switch -C "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'

      - name: Assemble reviewed convergence helper
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/cognitive_read_converge.py.xz.b64.* \
            | base64 --decode \
            | xz --decompress > "$RUNNER_TEMP/cognitive_read_converge.py"
          python3 -m py_compile "$RUNNER_TEMP/cognitive_read_converge.py"

      - name: Apply reviewed source, contract, and workflow closure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cognitive_read_converge.py" patch
          python3 -m py_compile \
            scripts/emit-cognitive-read-qualification.py \
            scripts/verify-cognitive-read-constants.py \
            scripts/verify-cognitive-read-map.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --format-version=1 --all-features \
            --filter-platform x86_64-unknown-linux-gnu >/dev/null
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --format-version=1 --all-features \
            --filter-platform aarch64-unknown-linux-gnu >/dev/null
          rm -f codex-rs/hepta-cognitive-read/fuzz/Cargo.lock
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff --check

      - name: Commit exact source candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && { echo 'source convergence produced no changes' >&2; exit 1; }
          git commit -m 'feat(cognitive.read): close bounded product and evidence contracts'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Atomically rebind every affected implementation map
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 "$RUNNER_TEMP/cognitive_read_converge.py" rebind-maps | tee "$RUNNER_TEMP/rebound-maps.json"
          git diff --check
          git add docs/modules
          git diff --cached --quiet && { echo 'map convergence produced no changes' >&2; exit 1; }
          git commit -m 'docs(cognitive.read): atomically rebind affected implementation maps'

      - name: Verify source, maps, lock, and focused Rust surface
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          python3 scripts/verify-cognitive-read-constants.py
          python3 scripts/verify-cognitive-read-map.py --expected-sha "$expected_sha"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$expected_sha" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          python3 -m unittest scripts/test_hepta_implementation_maps.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-agentd \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-worker-host \
            --all-targets
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-cognitive-read --lib
          cargo check --manifest-path codex-rs/hepta-cognitive-read/fuzz/Cargo.toml \
            --all-targets
          rm -f codex-rs/hepta-cognitive-read/fuzz/Cargo.lock
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Remove one-shot bootstrap and seal branch
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/cognitive_read_converge.py.xz.b64.* \
            .github/workflows/cognitive-read-one-shot.yml
          git add -A
          git commit -m 'ci(cognitive.read): retire one-shot convergence bootstrap'
          python3 scripts/verify-cognitive-read-map.py --expected-sha "$(git rev-parse HEAD)"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Push sealed candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$TARGET_BRANCH"
          {
            echo '## cognitive.read one-shot convergence'
            echo
            echo "- source commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- sealed commit: \`${{ steps.seal.outputs.sha }}\`"
            echo "- sealed tree: \`${{ steps.seal.outputs.tree }}\`"
            echo '- production/activation/release claims remain false.'
          } >> "$GITHUB_STEP_SUMMARY"
