name: Cognitive read one-shot convergence

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
    paths:
      - ".github/scripts/cognitive_read_converge.py.xz.b64.*"
      - ".github/workflows/cognitive-read-one-shot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-read-source-writer-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONPATH: scripts
  SOURCE_SHA: ${{ github.sha }}
  TARGET_BRANCH: work/cognitive-read-production-convergence-20260927

jobs:
  materialize:
    name: Materialize and atomically push cognitive.read source candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure exact writer identity and workflow baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cognitive Read Convergence'
          git config user.email 'cognitive-read-convergence@users.noreply.github.com'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$SOURCE_SHA"
          git show a16fa81bfec716037332ed30ab3c4e82d91c8636:.github/workflows/cognitive-read-qualification.yml \
            > .github/workflows/cognitive-read-qualification.yml

      - name: Assemble reviewed convergence helper portably
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import lzma
          import os
          from pathlib import Path

          parts = sorted(Path('.github/scripts').glob('cognitive_read_converge.py.xz.b64.*'))
          if not parts:
              raise SystemExit('missing cognitive.read convergence payload')
          encoded = b''.join(path.read_bytes().replace(b'\n', b'').replace(b'\r', b'') for path in parts)
          decoded = base64.b64decode(encoded, validate=True)
          target = Path(os.environ['RUNNER_TEMP']) / 'cognitive_read_converge.py'
          target.write_bytes(lzma.decompress(decoded))
          print(target)
          PY
          python3 -m py_compile "$RUNNER_TEMP/cognitive_read_converge.py"

      - name: Apply source, contract, and workflow closure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cognitive_read_converge.py" patch
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one generated regression marker, '
                      f'found {text.count(old)}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'codex-rs/hepta-cognitive-read/src/property_tests.rs',
              '                        record_ids: candidate_ids,\n',
              '                        record_ids: candidate_ids.clone(),\n',
          )
          replace_once(
              'codex-rs/hepta-cognitive-read/src/golden_vectors.rs',
              '            "{\\n",\n',
              '            "{{\\n",\n',
          )
          replace_once(
              'codex-rs/hepta-cognitive-read/src/golden_vectors.rs',
              '            "}"\n        ),\n        EXPECTED_CANONICAL_HEX\n',
              '            "}}"\n        ),\n        EXPECTED_CANONICAL_HEX\n',
          )
          replace_once(
              'codex-rs/hepta-agentd/src/cognitive_context.rs',
              '        response.omitted_records = record_omissions(\n'
              '            &mut omitted_records,\n'
              '            cognitive_context_metrics::OmissionReason::Unclassified,\n'
              '            expected_omitted - omitted_records,\n'
              '        );\n',
              '        let remaining_unclassified =\n'
              '            expected_omitted.saturating_sub(omitted_records);\n'
              '        response.omitted_records = record_omissions(\n'
              '            &mut omitted_records,\n'
              '            cognitive_context_metrics::OmissionReason::Unclassified,\n'
              '            remaining_unclassified,\n'
              '        );\n',
          )

          for path in (
              '.github/workflows/cognitive-read-qualification.yml',
              'scripts/run-cognitive-read-qualification.sh',
          ):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              text = text.replace(
                  'python3 -m unittest scripts/test_hepta_implementation_maps.py',
                  'PYTHONPATH=scripts python3 -m unittest '
                  'scripts/test_hepta_implementation_maps.py',
              )
              target.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile \
            scripts/emit-cognitive-read-qualification.py \
            scripts/verify-cognitive-read-constants.py \
            scripts/verify-cognitive-read-map.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Capture generated source before compilation
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/generated-source"
          mkdir -p "$snapshot"
          git diff --binary > "$RUNNER_TEMP/cognitive-read-generated.patch"
          while IFS= read -r path; do
            test -f "$path" || continue
            mkdir -p "$snapshot/$(dirname "$path")"
            cp "$path" "$snapshot/$path"
          done <<'PATHS'
          codex-rs/Cargo.lock
          codex-rs/hepta-agentd/Cargo.toml
          codex-rs/hepta-agentd/src/cognitive_context.rs
          codex-rs/hepta-agentd/src/cognitive_context_metrics.rs
          codex-rs/hepta-cognitive-read/examples/cognitive_read_bench.rs
          codex-rs/hepta-cognitive-read/src/authoritative.rs
          codex-rs/hepta-cognitive-read/src/fuzz_tests.rs
          codex-rs/hepta-cognitive-read/src/golden_vectors.rs
          codex-rs/hepta-cognitive-read/src/ids.rs
          codex-rs/hepta-cognitive-read/src/ids_tests.rs
          codex-rs/hepta-cognitive-read/src/lib.rs
          codex-rs/hepta-cognitive-read/src/mutation_tests.rs
          codex-rs/hepta-cognitive-read/src/property_tests.rs
          codex-rs/hepta-cognitive-read/src/v2.rs
          docs/modules/cognitive.read/COMPATIBILITY.md
          docs/modules/cognitive.read/CONTRACT_LIMITS.md
          docs/modules/cognitive.read/IMPLEMENTATION_MAP.json
          docs/modules/cognitive.read/OPERATIONS.md
          docs/modules/cognitive.read/TECHNICAL.md
          scripts/emit-cognitive-read-qualification.py
          scripts/run-cognitive-read-qualification.sh
          scripts/verify-cognitive-read-constants.py
          scripts/verify-cognitive-read-map.py
          .github/workflows/cognitive-read-qualification.yml
          PATHS

      - name: Retain generated source diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-generated-source-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cognitive-read-generated.patch
            ${{ runner.temp }}/generated-source
          if-no-files-found: error
          retention-days: 30

      - name: Resolve lock and validate generated source
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --format-version=1 --all-features \
            --filter-platform x86_64-unknown-linux-gnu >/dev/null
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --format-version=1 --all-features \
            --filter-platform aarch64-unknown-linux-gnu >/dev/null
          rm -f codex-rs/hepta-cognitive-read/fuzz/Cargo.lock
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff --check

      - name: Commit exact source candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && { echo 'source convergence produced no changes' >&2; exit 1; }
          git commit -m 'feat(cognitive.read): close bounded product and evidence contracts'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Atomically rebind all affected implementation maps
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 "$RUNNER_TEMP/cognitive_read_converge.py" rebind-maps \
            | tee "$RUNNER_TEMP/rebound-maps.json"
          git diff --check
          git add docs/modules
          git diff --cached --quiet && { echo 'map convergence produced no changes' >&2; exit 1; }
          git commit -m 'docs(cognitive.read): atomically rebind affected implementation maps'

      - name: Verify static contracts, exact map identity, and lock consistency
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          python3 scripts/verify-cognitive-read-constants.py
          python3 scripts/verify-cognitive-read-map.py --expected-sha "$expected_sha"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$expected_sha" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          PYTHONPATH=scripts python3 -m unittest scripts/test_hepta_implementation_maps.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked \
            --format-version=1 --all-features \
            --filter-platform x86_64-unknown-linux-gnu >/dev/null
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain materialization diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-materialization-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rebound-maps.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove bootstrap and seal branch
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/cognitive_read_converge.py.xz.b64.* \
            .github/workflows/cognitive-read-one-shot.yml
          git add -A
          git commit -m 'ci(cognitive.read): retire one-shot convergence bootstrap'
          python3 scripts/verify-cognitive-read-map.py --expected-sha "$(git rev-parse HEAD)"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Push sealed source candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$TARGET_BRANCH"
          {
            echo '## cognitive.read source materialization'
            echo
            echo "- source commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- sealed commit: \`${{ steps.seal.outputs.sha }}\`"
            echo "- sealed tree: \`${{ steps.seal.outputs.tree }}\`"
            echo '- Linux compile, Clippy, product E2E, and immutable receipts remain required.'
            echo '- productionImplementation/productExecutionProved/activation/release remain false.'
          } >> "$GITHUB_STEP_SUMMARY"
