name: NDU ABCD exact candidate qualification
on:
  push:
    branches: [work/utility-ndu-abcd-convergence-20260928]
    paths: [.github/workflows/hepta-ndu-abcd-materialize.yml]
permissions:
  contents: read
concurrency:
  group: ndu-abcd-materialization
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      base: ${{ steps.source.outputs.base }}
      bazel_lock_rc: ${{ steps.source.outputs.bazel_lock_rc }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
          checksum: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
      - name: Apply, normalize, verify and publish exact source
        id: source
        shell: bash
        env:
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndu-materialized"
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          test "$(git rev-parse HEAD^)" = 5beffa35a1ae237c5fe4cc0327fdad588c481e21
          BASE=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$BASE" HEAD
          echo '7e171b9e535b1510bb974a5833f305a51af43bcfc98fecbe1f979322e8d6e521  scripts/ndu-abcd-lock-repair.patch' | sha256sum -c -
          git apply --check scripts/ndu-abcd-lock-repair.patch
          git apply scripts/ndu-abcd-lock-repair.patch
          rm scripts/ndu-abcd-lock-repair.patch
          (cd codex-rs && cargo fmt --package codex-hepta-ndu --package codex-hepta-agent-protocol --package codex-hepta-agentd --package codex-hepta-control-plane)
          for test in source_policy map_integrity mounted_filesystem qualification evidence; do
            python3 "scripts/test_hepta_ndu_$test.py"
          done
          # Publish source even when external Bazel resolution fails; the final
          # qualification aggregator separately requires this recorded exit 0.
          set +e
          timeout --foreground 300s just bazel-lock-update > "$RUNNER_TEMP/ndu-materialized/bazel-lock-update.log" 2>&1
          BAZEL_RC=$?
          set -e
          echo "$BAZEL_RC" > "$RUNNER_TEMP/ndu-materialized/bazel-lock-update.exit"
          echo "bazel_lock_rc=$BAZEL_RC" >> "$GITHUB_OUTPUT"
          git add -A
          python3 scripts/hepta_ndu_map_integrity.py --rebind-index --candidate-branch "$GITHUB_REF_NAME" --baseline-main "$BASE"
          git add docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
          git diff --cached --check
          git config user.name hepta-ndu-remediation
          git config user.email qualification@invalid
          git commit -s -m 'fix(ndu): disambiguate locked rustix 1.1.4 and rebind exact candidate'
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/hepta-ndu-implementation-map-closed-world.py --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})" 2>&1 | tee "$RUNNER_TEMP/ndu-materialized/map-verifier.log"
          # Fast-forward only: a concurrent update is a conflict, never overwritten.
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Export exact materialized source
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ndu-materialized"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/ndu-materialized/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ndu-materialized/IDENTITY"
          git diff > "$RUNNER_TEMP/ndu-materialized/uncommitted.diff"
          cd "$RUNNER_TEMP/ndu-materialized"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ndu-abcd-bcd-materialized-source-${{ github.sha }}
          path: ${{ runner.temp }}/ndu-materialized/
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: materialize
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
        suite: [source, core, callers, product, lint, host]
    env:
      SOURCE_SHA: ${{ needs.materialize.outputs.sha }}
      BASE_SHA: ${{ needs.materialize.outputs.base }}
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source or deterministic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git cat-file -t "$BASE_SHA")" = commit
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
          checksum: true
      - name: Execute independent suite
        run: python3 scripts/hepta-ndu-qualification.py --suite '${{ matrix.suite }}' --lane '${{ matrix.lane }}' --output '${{ runner.temp }}/ndu-${{ matrix.lane }}-${{ matrix.suite }}'
      - name: Retain logs and exact-source receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-abcd-bcd-${{ matrix.lane }}-${{ matrix.suite }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-${{ matrix.lane }}-${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: [materialize, verify]
    runs-on: ubuntu-22.04
    env:
      SOURCE_SHA: ${{ needs.materialize.outputs.sha }}
      BASE_SHA: ${{ needs.materialize.outputs.base }}
      BAZEL_LOCK_RC: ${{ needs.materialize.outputs.bazel_lock_rc }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ndu-abcd-bcd-*-*-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-evidence
      - name: Verify twelve suites, exact identities and every retained checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$BAZEL_LOCK_RC" = 0
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
          export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
          export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
          export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
          MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
          python3 scripts/hepta_ndu_evidence.py aggregate --root "$RUNNER_TEMP/ndu-evidence" --source "$SOURCE_SHA" --base "$BASE_SHA" --merge "$MERGE" --output "$RUNNER_TEMP/ndu-evidence/aggregate.json"
          python3 scripts/hepta_ndu_evidence.py seal --root "$RUNNER_TEMP/ndu-evidence"
          python3 scripts/hepta_ndu_evidence.py verify --root "$RUNNER_TEMP/ndu-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-qualified-evidence-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-evidence/
          if-no-files-found: error
          retention-days: 30
