name: Neuroscience replay decision-time evidence

on:
  push:
    branches:
      - research/neuroscience-priority-audit-20261110-475c
  pull_request:
    branches:
      - research/neuroscience-mechanisms-20261110
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout exact candidate, no retained Git credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare pinned CPU Python environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hpca-venv"
          "$RUNNER_TEMP/hpca-venv/bin/python" -m pip install numpy==2.3.5 ruff==0.15.13
          echo "$RUNNER_TEMP/hpca-venv/bin" >> "$GITHUB_PATH"
      - name: Check source and exercise selected replay contracts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hpca-evidence"
          ruff check qualification/cell_common_foundations/{memory_replay,test_memory_replay}.py
          ruff format --check qualification/cell_common_foundations/{memory_replay,test_memory_replay}.py
          python -m unittest -v qualification.cell_common_foundations.test_memory_replay \
            2>&1 | tee "$RUNNER_TEMP/hpca-evidence/tests.log"
      - name: Fit candidate-only replay models and retain every priority receipt
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/hpca-evidence/cpu-time.txt" \
            python - "$RUNNER_TEMP/hpca-evidence" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          from qualification.cell_common_foundations.memory_replay import (
              replay_specs, run_replay_attempt, verify_priority_selection_audit
          )
          target = Path(sys.argv[1])
          selected = [s for s in replay_specs((11,)) if s["method"] in ("uniform", "error_prioritized")]
          results = [run_replay_attempt(s) for s in selected]
          for row in results:
              if row["method"] == "error_prioritized":
                  assert len(row["replay_selections"]) == 16
                  assert all(verify_priority_selection_audit(s["selection_audit"]) for s in row["replay_selections"])
                  assert all(s["selection_audit"]["selected_ids"] == s["ids"] for s in row["replay_selections"])
          packet = {
              "schema": "hepta.neuroscience-priority-audit-development.v1",
              "exact_head": os.environ["GITHUB_SHA"],
              "source_kind": "FP64_SYNTHETIC_MODEL_TRAINING_NOT_INDEPENDENT_TASKS",
              "independent_real_task_count": 0,
              "scientific_acceptance": "HOLD_NO_GO",
              "production_adoption": False,
              "results": results,
          }
          with (target / "RESULT.json").open("x", encoding="utf-8") as output:
              json.dump(packet, output, indent=2, sort_keys=True, allow_nan=False)
          print(json.dumps({
              "head": packet["exact_head"], "arm_count": len(results),
              "optimizer_calls": {r["method"]: r["optimizer_calls"] for r in results},
              "priority_receipts": len(results[1]["replay_selections"])
          }, sort_keys=True))
          PY
      - name: Verify unchanged checked-out code
        if: always()
        run: git diff --exit-code
      - name: Retain raw results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neuroscience-priority-audit-${{ github.sha }}
          path: ${{ runner.temp }}/hpca-evidence/
          retention-days: 14
          if-no-files-found: warn
