name: Composed owner and maintained source generation

on:
  push:
    branches: [integration/private-ci-complete-source-20261104-gpt6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composed-source-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == 'integration/private-ci-complete-source-20261104-gpt6'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      qualified: ${{ steps.generate.outputs.qualified }}
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 64
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: complete-source-generation
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - name: Install the repository pinned Python formatter prerequisite
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Verify strict lock adoption controls
        run: |
          python3 -m unittest discover -s qualification/complete-source-union-20261104 -p test_generate.py -v
          python3 - <<'PY'
          import subprocess
          result = subprocess.run([
              "python3", "-O", "qualification/complete-source-union-20261104/generate.py",
              "--output", "/unused-optimized-evidence"
          ], capture_output=True, text=True)
          if result.returncode == 0 or "optimized Python execution is not accepted" not in result.stderr:
              raise SystemExit("optimized reader was not rejected")
          PY
      - name: Run the original formatter and actual Cargo/Bazel lock commands
        id: generate
        run: >-
          python3 qualification/complete-source-union-20261104/generate.py
          --output "$RUNNER_TEMP/complete-source-generation"
      - name: Preserve every source input, original command, generated byte and failure
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: complete-source-generation-${{ github.sha }}
          path: ${{ runner.temp }}/complete-source-generation
          if-no-files-found: error
          retention-days: 14

  original-alias-tests:
    if: github.ref_name == 'integration/private-ci-complete-source-20261104-gpt6' && needs.generate.outputs.qualified == 'true'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: bazel
      deployment: false
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: complete-source-alias
      - name: Execute the original crate alias suite against the actual generated graph
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          .github/scripts/run_bazel_with_buildbuddy.py test //bazel/rules:crate_aliases_tests
          git diff --exit-code HEAD --
          just bazel-lock-check

  original-private-storage-owners:
    if: github.ref_name == 'integration/private-ci-complete-source-20261104-gpt6' && needs.generate.outputs.qualified == 'true'
    needs: generate
    uses: ./.github/workflows/fleet-private-registration-qualification.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
