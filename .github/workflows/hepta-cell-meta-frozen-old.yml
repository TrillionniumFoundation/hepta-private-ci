name: Hepta Cell Meta E2f frozen old-parent control

on:
  pull_request:
    paths:
      - 'qualification/cell_meta_execution_af/physical_router_frozen_old*.py'
      - 'qualification/cell_meta_execution_af/FROZEN_PARENT_CONTROL.md'
      - '.github/workflows/hepta-cell-meta-frozen-old.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-meta-frozen-old-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  frozen-control:
    name: Actual old-only FP32 and independent replay (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - name: Checkout exact source with no persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source head
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
      - name: Prospective base merge without publication
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Frozen Router Research CI
          author-email: hepta-frozen-router-ci@users.noreply.github.com
          message: Synthetic frozen Cell Meta research merge
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned CPU Torch (no pretrained model)
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          # The physical FP32 weight sealing calls Tensor.numpy(); torch's
          # CPU wheel alone does not guarantee NumPy is present in CI.
          python -m pip install --only-binary=:all: 'numpy==2.2.6'
          python -m pip check
          python - <<'PY'
          import numpy
          import torch
          assert numpy.__version__ == '2.2.6'
          assert torch.tensor([1.25], dtype=torch.float32).numpy().dtype == numpy.float32
          PY
      - name: Compile exact own source and run physical/adversarial tests
        run: |
          set -euo pipefail
          python -m py_compile \
            qualification/cell_meta_execution_af/physical_router_trial.py \
            qualification/cell_meta_execution_af/physical_router_audit.py \
            qualification/cell_meta_execution_af/physical_router_frozen_old.py \
            qualification/cell_meta_execution_af/physical_router_frozen_old_audit.py \
            qualification/cell_meta_execution_af/physical_router_frozen_old_tests.py
          python -m unittest qualification.cell_meta_execution_af.physical_router_frozen_old_tests -v
      - name: Independent frozen vs continued training comparison (synthetic only)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meta-frozen"
          python - "$RUNNER_TEMP/meta-frozen/panel.json" <<'PY'
          from pathlib import Path
          import sys
          from qualification.cell_meta_execution_af.physical_router_trial import synthetic_panel, canonical
          Path(sys.argv[1]).write_bytes(canonical(synthetic_panel(seed=41, rule='conditional', rows=32)))
          PY
          python qualification/cell_meta_execution_af/physical_router_frozen_old.py \
            --panel "$RUNNER_TEMP/meta-frozen/panel.json" --steps 4 \
            --report "$RUNNER_TEMP/meta-frozen/frozen.json"
          python qualification/cell_meta_execution_af/physical_router_trial.py \
            --input "$RUNNER_TEMP/meta-frozen/panel.json" --steps 4 \
            --out "$RUNNER_TEMP/meta-frozen/continued.json"
          python qualification/cell_meta_execution_af/physical_router_frozen_old_audit.py \
            --panel "$RUNNER_TEMP/meta-frozen/panel.json" \
            --frozen "$RUNNER_TEMP/meta-frozen/frozen.json" \
            --continued "$RUNNER_TEMP/meta-frozen/continued.json" \
            > "$RUNNER_TEMP/meta-frozen/audit.json"
          python - "$RUNNER_TEMP/meta-frozen/audit.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['production_admission'] == 'BLOCKED'
          assert result['ndu_selection_authorized'] is False
          assert result['existing_v1_no_change_is_frozen'] is False
          assert result['training_budget_matched'] is False
          PY
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Preserve research-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-frozen-old-research-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ runner.temp }}/meta-frozen/*.json
          retention-days: 7
