name: memory federation semantic patch validate temp

on:
  push:
    branches:
      - work/memory-federation-source-export-20260930-r2

permissions:
  contents: read

concurrency:
  group: memory-federation-semantic-patch-temp
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ecb502a7a1435d84441a74cb8c3159e76f9b8a69
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed semantic patch
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/memory-federation-semantic.patch.gz.b64" <<'PATCH_B64'
          
          PATCH_B64
          sed -i 's/^          //' "$RUNNER_TEMP/memory-federation-semantic.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/memory-federation-semantic.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/memory-federation-semantic.patch"
          echo "7ac42725dd1bab195cb5ad2c5a46a9aa6f95dab137e8f26b06aef1430e7f6424  $RUNNER_TEMP/memory-federation-semantic.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/memory-federation-semantic.patch"
          git apply "$RUNNER_TEMP/memory-federation-semantic.patch"

      - name: Format patched source and retain exact bytes
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cd ..
          git diff --check
          git diff --binary ecb502a7a1435d84441a74cb8c3159e76f9b8a69 > "$RUNNER_TEMP/memory-federation-formatted.patch"
          mkdir -p "$RUNNER_TEMP/memory-federation-formatted-source"
          cp --parents \
            codex-rs/hepta-memory/src/cognitive_retrieval.rs \
            codex-rs/hepta-memory/src/cognitive_retrieval_observation.rs \
            codex-rs/hepta-memory/src/cognitive_federation.rs \
            codex-rs/hepta-memory/src/cognitive_runtime.rs \
            codex-rs/hepta-memory/src/memory_federation_convergence_tests.rs \
            codex-rs/ext/hepta-memory/src/cognitive/federation.rs \
            "$RUNNER_TEMP/memory-federation-formatted-source"
          sha256sum \
            codex-rs/hepta-memory/src/cognitive_retrieval.rs \
            codex-rs/hepta-memory/src/cognitive_retrieval_observation.rs \
            codex-rs/hepta-memory/src/cognitive_federation.rs \
            codex-rs/hepta-memory/src/cognitive_runtime.rs \
            codex-rs/hepta-memory/src/memory_federation_convergence_tests.rs \
            codex-rs/ext/hepta-memory/src/cognitive/federation.rs \
            > "$RUNNER_TEMP/memory-federation-formatted-source/SHA256SUMS"

      - name: Run affected Rust matrix
        id: rust
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/memory-federation-rust.log") 2>&1
          cd codex-rs
          cargo check -p codex-hepta-memory --all-targets
          cargo test -p codex-hepta-memory --lib -- --nocapture
          cargo test -p codex-hepta-memory-federation --lib -- --nocapture
          cargo test -p codex-hepta-memory-federation --features legacy-v1 --lib -- --nocapture
          cargo test -p codex-hepta-memory-extension --lib -- --nocapture
          cargo clippy -p codex-hepta-memory --all-targets -- -D warnings
          cargo clippy -p codex-hepta-memory-federation --all-targets -- -D warnings
          cargo clippy -p codex-hepta-memory-federation --all-targets --features legacy-v1 -- -D warnings
          cargo clippy -p codex-hepta-memory-extension --all-targets -- -D warnings

      - name: Upload formatted source and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-federation-semantic-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/memory-federation-formatted.patch
            ${{ runner.temp }}/memory-federation-formatted-source
            ${{ runner.temp }}/memory-federation-rust.log
          if-no-files-found: warn
          retention-days: 7
