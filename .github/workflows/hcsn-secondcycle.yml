name: HCSN retained second-cycle arithmetic
on:
  pull_request:
    paths:
      - 'qualification/hcsn_secondcycle/**'
      - '.github/workflows/hcsn-secondcycle.yml'
permissions:
  contents: read
jobs:
  retained-secondcycle-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Verify retained second-cycle evidence only
        run: python -m qualification.hcsn_secondcycle.verify_retained
      - name: Check clean executing source
        run: git diff --exit-code
