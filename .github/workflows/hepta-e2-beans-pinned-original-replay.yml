name: Hepta E2 pinned natural Beans original archive replay (DENY_ALL)
on:
  push:
    branches:
      - research/e2-beans-pinned-artifact-ridge-replay-20261015
permissions:
  contents: read
  actions: read
concurrency:
  group: hepta-e2-pinned-beans-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  contract-tests:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin research matrix numerics
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Verify independent SVD, source seals, original ZIP metadata, and optimized mode
        shell: bash
        run: |
          set -euo pipefail
          export OPENBLAS_NUM_THREADS=1
          export PYTHONPATH=experiments/shared_stem_cell
          for mode in normal optimized; do
            if test "$mode" = normal; then FLAGS=(); else FLAGS=(-O); fi
            python "${FLAGS[@]}" -m unittest discover -s experiments/shared_stem_cell -p 'test_e2_beans_original_archival_replay.py' -q
            python "${FLAGS[@]}" -m unittest discover -s experiments/shared_stem_cell -p 'test_e2_beans_frozen_vision_linear_probe.py' -q
            python "${FLAGS[@]}" -m unittest discover -s experiments/shared_stem_cell -p 'test_e2_beans_original_zip_review.py' -q
          done
          python -m compileall -q \
            experiments/shared_stem_cell/e2_beans_independent_svd_oracle.py \
            experiments/shared_stem_cell/e2_beans_original_replay.py \
            experiments/shared_stem_cell/e2_beans_original_artifact_fetch.py


  pinned-original-intake:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Detect explicitly committed four-ZIP pins, reject invalid pins
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          manifest=qualification/e2-original-beans/PINNED_ORIGINAL_ARCHIVES.json
          if test -f "$manifest"; then
            python experiments/shared_stem_cell/e2_beans_original_artifact_fetch.py \
              --operator-manifest "$manifest" --github-env "$GITHUB_ENV"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Original natural Beans ZIPs not yet pinned. No physical replay claim.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

  original-label-blind-fit:
    if: needs.pinned-original-intake.outputs.ready == 'true'
    needs: pinned-original-intake
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Export operator-pinned source and artifact digests (safe env values)
        shell: bash
        run: |
          set -euo pipefail
          python experiments/shared_stem_cell/e2_beans_original_artifact_fetch.py \
            --operator-manifest qualification/e2-original-beans/PINNED_ORIGINAL_ARCHIVES.json \
            --github-env "$GITHUB_ENV"
      - name: Verify original exact run and download ONLY source/producers
        shell: bash
        run: |
          set -euo pipefail
          export OPENBLAS_NUM_THREADS=1
          export PYTHONPATH=experiments/shared_stem_cell
          args=(--run-id "$RUN_ID" --source-id "$SOURCE_ID" --source-sha256 "$SOURCE_SHA"
            --producer-id "$PRODUCER_ID" --producer-sha256 "$PRODUCER_SHA"
            --withheld-id "$WITHHELD_ID" --withheld-sha256 "$WITHHELD_SHA"
            --independent-id "$INDEPENDENT_ID" --independent-sha256 "$INDEPENDENT_SHA")
          python experiments/shared_stem_cell/e2_beans_original_artifact_fetch.py \
            "${args[@]}" --roles source,producer --output-dir /tmp/hepta-e2-fit-inputs
          test "$(find /tmp/hepta-e2-fit-inputs -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 2
          test ! -e /tmp/hepta-e2-fit-inputs/withheld.zip
          test ! -e /tmp/hepta-e2-fit-inputs/independent.zip
      - name: Seal fit-only original frozen vision Ridge (no future targets)
        shell: bash
        run: |
          set -euo pipefail
          export OPENBLAS_NUM_THREADS=1
          export PYTHONPATH=experiments/shared_stem_cell
          mkdir -p /tmp/hepta-e2-public-seal
          python experiments/shared_stem_cell/e2_beans_original_replay.py seal \
            --source-zip /tmp/hepta-e2-fit-inputs/source.zip --source-sha256 "$SOURCE_SHA" \
            --producer-zip /tmp/hepta-e2-fit-inputs/producer.zip --producer-sha256 "$PRODUCER_SHA" \
            --output-dir /tmp/hepta-e2-public-seal/seal | tee /tmp/hepta-e2-public-seal/seal-receipt.json
          test ! -e /tmp/hepta-e2-public-seal/withheld.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-e2-original-beans-frozen-ridge-sealed-no-raw-source
          path: /tmp/hepta-e2-public-seal/
          if-no-files-found: error
          retention-days: 7

  independent-original-retrospective-readout:
    if: needs.original-label-blind-fit.result == 'success'
    needs: original-label-blind-fit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-e2-original-beans-frozen-ridge-sealed-no-raw-source
          path: /tmp/hepta-e2-sealed
      - name: Export operator-pinned source and artifact digests (safe env values)
        shell: bash
        run: |
          set -euo pipefail
          python experiments/shared_stem_cell/e2_beans_original_artifact_fetch.py \
            --operator-manifest qualification/e2-original-beans/PINNED_ORIGINAL_ARCHIVES.json \
            --github-env "$GITHUB_ENV"
      - name: Independently fetch all FOUR original, SHA-pinned ZIPs
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=experiments/shared_stem_cell
          args=(--run-id "$RUN_ID" --source-id "$SOURCE_ID" --source-sha256 "$SOURCE_SHA"
            --producer-id "$PRODUCER_ID" --producer-sha256 "$PRODUCER_SHA"
            --withheld-id "$WITHHELD_ID" --withheld-sha256 "$WITHHELD_SHA"
            --independent-id "$INDEPENDENT_ID" --independent-sha256 "$INDEPENDENT_SHA")
          python experiments/shared_stem_cell/e2_beans_original_artifact_fetch.py \
            "${args[@]}" --output-dir /tmp/hepta-e2-original-four
      - name: Score only after sealed model identity and independently replay via SVD
        shell: bash
        run: |
          set -euo pipefail
          export OPENBLAS_NUM_THREADS=1
          export PYTHONPATH=experiments/shared_stem_cell
          mkdir -p /tmp/hepta-e2-independent-result
          MODEL_SHA=$(python -c 'import json;print(json.load(open("/tmp/hepta-e2-sealed/seal-receipt.json"))["seal"]["model_sha256"])')
          PRED_SHA=$(python -c 'import json;print(json.load(open("/tmp/hepta-e2-sealed/seal-receipt.json"))["seal"]["predictions_sha256"])')
          python experiments/shared_stem_cell/e2_beans_original_replay.py score \
            --source-zip /tmp/hepta-e2-original-four/source.zip --source-sha256 "$SOURCE_SHA" \
            --producer-zip /tmp/hepta-e2-original-four/producer.zip --producer-sha256 "$PRODUCER_SHA" \
            --withheld-zip /tmp/hepta-e2-original-four/withheld.zip --withheld-sha256 "$WITHHELD_SHA" \
            --independent-zip /tmp/hepta-e2-original-four/independent.zip --independent-sha256 "$INDEPENDENT_SHA" \
            --model /tmp/hepta-e2-sealed/seal/probe_model.json --model-sha256 "$MODEL_SHA" \
            --predictions /tmp/hepta-e2-sealed/seal/probe_predictions.json --predictions-sha256 "$PRED_SHA" \
            --output /tmp/hepta-e2-independent-result/readout.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: hepta-e2-natural-beans-independent-frozen-ridge-readout-no-raw-weights
          path: /tmp/hepta-e2-independent-result/readout.json
          if-no-files-found: error
          retention-days: 7
