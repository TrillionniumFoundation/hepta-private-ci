name: Temporary pinned Ruff selector formatting diagnostic
on:
  push:
    branches:
      - dot/pinned-ruff-selector-diagnostic-20261104-gpt6
  pull_request:
    paths:
      - .github/scripts/test_run_bazel_clippy_targets.py
      - .github/workflows/pinned-ruff-selector-diagnostic-20261104.yml

permissions:
  contents: read

jobs:
  show-exact-formatter-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Exact pinned formatter diagnostic (non-mutating)
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff --version
          uv run --frozen --project scripts ruff format --diff .github/scripts/test_run_bazel_clippy_targets.py
          uv run --frozen --project scripts ruff format --check .github/scripts/test_run_bazel_clippy_targets.py
