name: Hepta E1 failed real run independent Granite numeric rescue
on:
  pull_request:
    paths:
      - "experiments/shared_stem_cell/e1_failed_run_rescue.py"
      - "experiments/shared_stem_cell/test_e1_failed_run_rescue.py"
      - "experiments/shared_stem_cell/E1_GRANITE_REAL_FAILED_RUN_RESCUE.md"
      - ".github/workflows/hepta-e1-archive-granite-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric-archive-only:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact source, deterministic model-free ZIP adversarial suite
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -m py_compile experiments/shared_stem_cell/e1_failed_run_rescue.py
          python -m unittest discover -s experiments/shared_stem_cell -p test_e1_failed_run_rescue.py -v
      - name: Retrieve frozen immutable artifact from actual overall FAILED E1 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e1-granite-history"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11926728554/zip" > "$RUNNER_TEMP/e1-granite-history/original-failed-run.zip"
          printf '%s  %s\n' "c90c5174eb8c2949dc64637ab2676ea756464723c3474cb56a8eb4a092434955" "$RUNNER_TEMP/e1-granite-history/original-failed-run.zip" | sha256sum -c -
      - name: Independently replay Granite E1 raw answers and E2 actual training comparisons
        run: |
          set -euo pipefail
          python experiments/shared_stem_cell/e1_failed_run_rescue.py \
            --archive "$RUNNER_TEMP/e1-granite-history/original-failed-run.zip" \
            --output "$RUNNER_TEMP/e1-granite-history/independent-granite-numeric.json"
          python - "$RUNNER_TEMP/e1-granite-history/independent-granite-numeric.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf8'))
          assert r['holdout_cases']==64
          assert r['mmbert_arm']['quality_scores_admitted'] is False
          assert r['embeddinggemma_2_text_arm']['quality_scores_admitted'] is False
          assert r['three_model_pairwise_scientific_comparison_complete'] is False
          assert r['production_promotion_permitted'] is False
          assert r['granite_e2_independent_numeric_review']['production_promotion_permitted'] is False
          print('Actual archived Granite E1/E2 recomputed; no candidate winner or production access.')
          PY
      - name: Upload only numeric audit, not original raw archived records
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-e1-granite-original-failed-run-review-${{ github.run_id }}
          path: ${{ runner.temp }}/e1-granite-history/independent-granite-numeric.json
          retention-days: 7
