name: memory federation frozen source export

on:
  push:
    branches:
      - fix/memory-federation-product-qualification-20260930
    paths:
      - .github/workflows/memory-federation-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out frozen source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5e36ad2d4952992571b60cd02068ad06c2765ddd
          fetch-depth: 0
          persist-credentials: false
      - name: Build self-contained source bundle
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "5e36ad2d4952992571b60cd02068ad06c2765ddd"
          mkdir -p "$RUNNER_TEMP/memory-federation-source-export"
          git bundle create "$RUNNER_TEMP/memory-federation-source-export/hepta-private-ci.bundle" HEAD refs/remotes/origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/memory-federation-source-export/source.sha"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/memory-federation-source-export/source.tree"
          git bundle verify "$RUNNER_TEMP/memory-federation-source-export/hepta-private-ci.bundle"
      - name: Upload frozen source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-federation-frozen-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-federation-source-export
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
