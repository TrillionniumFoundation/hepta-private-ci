name: Kernel evidence qualification

on:
  workflow_call:
    inputs:
      base_sha:
        description: Explicit full base commit; defaults to the source first parent outside PRs
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      base_sha:
        description: Explicit full base commit; defaults to the source first parent
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Reusable callers must not cancel each other's qualification runs.
  group: kernel-evidence-qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-head:
    name: Kernel evidence exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || '' }}
      HEPTA_CI_LANE: source-head
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialize exact source diagnostics before checkout
        shell: bash
        run: |
          set -euo pipefail
          records="$RUNNER_TEMP/kernel-evidence/source"
          mkdir -p "$records"
          printf 'KERNEL_EVIDENCE_RECORDS=%s\n' "$records" >> "$GITHUB_ENV"
          python3 - "$records/runner.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "phase": "initialized", "qualificationGranted": False,
              "sourceCommit": os.environ.get("SOURCE_SHA"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "job": os.environ.get("GITHUB_JOB"),
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable source and base
        id: candidate
        shell: bash
        run: |
          python3 scripts/kernel_evidence_candidate.py \
            --source "$SOURCE_SHA" --base "$BASE_SHA" \
            --diagnostic "$KERNEL_EVIDENCE_RECORDS/candidate-plan.json" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Test locked kernel evidence crate
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --minimum-tests 1 --output "$KERNEL_EVIDENCE_RECORDS/evidence-tests.json" -- \
            bash -lc 'cd codex-rs && cargo test --locked -p codex-hepta-evidence'

      - name: Test locked Agentd library product profile paging and publication
        if: always()
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --minimum-tests 1 --output "$KERNEL_EVIDENCE_RECORDS/agentd-product-test.json" -- \
            bash -lc 'cd codex-rs && cargo test --locked -p codex-hepta-agentd --lib --test kernel_evidence_product --test kernel_evidence_profile --test kernel_evidence_paging_product --test kernel_evidence_publication_cli'

      - name: Verify Lane-A truth
        if: always()
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --output "$KERNEL_EVIDENCE_RECORDS/lane-a-truth.json" -- \
            python3 scripts/verify_lane_a_foundation.py verify

      - name: Verify technical documentation
        if: always()
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --output "$KERNEL_EVIDENCE_RECORDS/docs.json" -- \
            python3 scripts/hepta-docs.py verify

      - name: Verify implementation maps
        if: always()
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --output "$KERNEL_EVIDENCE_RECORDS/implementation-maps.json" -- \
            python3 scripts/hepta-implementation-maps.py verify

      - name: Build exact source machine-readable status
        if: always()
        shell: bash
        run: |
          python3 scripts/build_kernel_evidence_status.py \
            --records "$KERNEL_EVIDENCE_RECORDS" \
            --kind kernel_evidence_exact_source \
            --output "$KERNEL_EVIDENCE_RECORDS/STATUS.json"

      - name: Upload exact source diagnostics and receipts
        id: source-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-evidence-source-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-evidence/source/
          if-no-files-found: error
          retention-days: 90

      - name: Record exact source artifact digest
        if: always() && steps.source-artifact.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.source-artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.source-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.source-artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          python3 scripts/build_kernel_evidence_status.py \
            --records "$KERNEL_EVIDENCE_RECORDS" \
            --kind kernel_evidence_exact_source \
            --output "$KERNEL_EVIDENCE_RECORDS/STATUS.with-artifact.json" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-url "$ARTIFACT_URL" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --require-qualified

      - name: Upload exact source canonical status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-evidence-source-status-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-evidence/source/STATUS.with-artifact.json
          if-no-files-found: error
          retention-days: 90

  merge-candidate:
    name: Kernel evidence deterministic merge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || '' }}
      HEPTA_CI_LANE: base-merge
    steps:
      - name: Initialize deterministic merge diagnostics before checkout
        shell: bash
        run: |
          set -euo pipefail
          records="$RUNNER_TEMP/kernel-evidence/merge"
          mkdir -p "$records"
          printf 'KERNEL_EVIDENCE_RECORDS=%s\n' "$records" >> "$GITHUB_ENV"
          python3 - "$records/runner.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "phase": "initialized", "qualificationGranted": False,
              "sourceCommit": os.environ.get("SOURCE_SHA"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "job": os.environ.get("GITHUB_JOB"),
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable source and base
        id: candidate
        shell: bash
        run: |
          python3 scripts/kernel_evidence_candidate.py \
            --source "$SOURCE_SHA" --base "$BASE_SHA" \
            --diagnostic "$KERNEL_EVIDENCE_RECORDS/candidate-plan.json" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - name: Construct deterministic synthetic merge
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.candidate.outputs.base-sha }}
          source-sha: ${{ steps.candidate.outputs.source-sha }}
          pr-number: ${{ github.event.pull_request.number || '0' }}
          author-name: Hepta kernel evidence CI
          author-email: hepta-kernel-evidence-ci@users.noreply.github.com
          message: Synthetic kernel evidence merge

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Bind deterministic merge identity
        env:
          TESTED_SHA: ${{ steps.merge.outputs.sha }}
          EXPECTED_TREE: ${{ steps.merge.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Test locked kernel evidence crate
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --minimum-tests 1 --output "$KERNEL_EVIDENCE_RECORDS/evidence-tests.json" -- \
            bash -lc 'cd codex-rs && cargo test --locked -p codex-hepta-evidence'

      - name: Test locked Agentd library product profile paging and publication
        if: always()
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --minimum-tests 1 --output "$KERNEL_EVIDENCE_RECORDS/agentd-product-test.json" -- \
            bash -lc 'cd codex-rs && cargo test --locked -p codex-hepta-agentd --lib --test kernel_evidence_product --test kernel_evidence_profile --test kernel_evidence_paging_product --test kernel_evidence_publication_cli'

      - name: Verify Lane-A truth
        if: always()
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --output "$KERNEL_EVIDENCE_RECORDS/lane-a-truth.json" -- \
            python3 scripts/verify_lane_a_foundation.py verify

      - name: Verify technical documentation
        if: always()
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --output "$KERNEL_EVIDENCE_RECORDS/docs.json" -- \
            python3 scripts/hepta-docs.py verify

      - name: Verify implementation maps
        if: always()
        shell: bash
        run: |
          python3 scripts/hepta_ci_exec.py \
            --output "$KERNEL_EVIDENCE_RECORDS/implementation-maps.json" -- \
            python3 scripts/hepta-implementation-maps.py verify

      - name: Build deterministic merge machine-readable status
        if: always()
        shell: bash
        run: |
          python3 scripts/build_kernel_evidence_status.py \
            --records "$KERNEL_EVIDENCE_RECORDS" \
            --kind kernel_evidence_synthetic_merge \
            --output "$KERNEL_EVIDENCE_RECORDS/STATUS.json"

      - name: Upload deterministic merge diagnostics and receipts
        id: merge-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-evidence-merge-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-evidence/merge/
          if-no-files-found: error
          retention-days: 90

      - name: Record deterministic merge artifact digest
        if: always() && steps.merge-artifact.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.merge-artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.merge-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.merge-artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          python3 scripts/build_kernel_evidence_status.py \
            --records "$KERNEL_EVIDENCE_RECORDS" \
            --kind kernel_evidence_synthetic_merge \
            --output "$KERNEL_EVIDENCE_RECORDS/STATUS.with-artifact.json" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-url "$ARTIFACT_URL" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --require-qualified

      - name: Upload deterministic merge canonical status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-evidence-merge-status-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-evidence/merge/STATUS.with-artifact.json
          if-no-files-found: error
          retention-days: 90

  required:
    name: Kernel evidence required
    if: always()
    needs: [source-head, merge-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both qualification lanes for every supported event
        env:
          SOURCE_RESULT: ${{ needs.source-head.result }}
          MERGE_RESULT: ${{ needs.merge-candidate.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$MERGE_RESULT" = success
