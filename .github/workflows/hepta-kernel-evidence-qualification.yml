name: Kernel evidence qualification

# The required aggregate must exist on every PR. Path filters here can leave a
# branch-protection check permanently pending for unrelated or dependency diffs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-evidence-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-head:
    name: Kernel evidence exact source
    uses: ./.github/workflows/hepta-kernel-evidence-lane.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base-sha: ${{ github.event.pull_request.base.sha || '' }}
      lane: source-head

  merge-candidate:
    name: Kernel evidence deterministic merge
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/hepta-kernel-evidence-lane.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      lane: base-merge
      pr-number: ${{ format('{0}', github.event.pull_request.number) }}

  qualification-complete:
    name: Kernel evidence qualification required
    if: always()
    needs: [source-head, merge-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      SUFFIX: ${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the candidate status verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download this attempt's command and lane receipts
        id: receipts_download
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: kernel-evidence-*-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/kernel-evidence-downloaded
          merge-multiple: false
          digest-mismatch: error

      - name: Verify receipts and build canonical status
        id: canonical_status
        if: always()
        continue-on-error: true
        env:
          SOURCE_QUALIFIED: ${{ needs.source-head.result == 'success' && needs.source-head.outputs.qualified == 'true' && steps.receipts_download.outcome == 'success' }}
          MERGE_QUALIFIED: ${{ needs.merge-candidate.result == 'success' && needs.merge-candidate.outputs.qualified == 'true' && steps.receipts_download.outcome == 'success' }}
          SOURCE_DIGEST: ${{ needs.source-head.outputs.artifact_digest }}
          MERGE_DIGEST: ${{ needs.merge-candidate.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kernel-evidence-canonical"
          mkdir -p "$output"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tree="$(git rev-parse 'HEAD^{tree}')"
          downloads="$RUNNER_TEMP/kernel-evidence-downloaded"
          python3 scripts/kernel_evidence_status.py aggregate \
            --source-commit "$SOURCE_SHA" --source-tree "$tree" --base-commit "$BASE_SHA" \
            --source-qualified "$SOURCE_QUALIFIED" --merge-qualified "$MERGE_QUALIFIED" \
            --source-artifact-digest "$SOURCE_DIGEST" --merge-artifact-digest "$MERGE_DIGEST" \
            --source-status "$downloads/kernel-evidence-source-head-status-${SUFFIX}/source-head.json" \
            --merge-status "$downloads/kernel-evidence-base-merge-status-${SUFFIX}/base-merge.json" \
            --records-root "$downloads" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --event-name "$GITHUB_EVENT_NAME" \
            --output "$output/STATUS.json" --github-output "$GITHUB_OUTPUT" \
            2>&1 | tee "$output/verification.log"
          python3 scripts/kernel_evidence_status.py verify "$output/STATUS.json"
          sha256sum "$output/STATUS.json" > "$output/STATUS.sha256"

      - name: Generate and check all canonical documentation views
        id: generated_views
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kernel-evidence-canonical"
          python3 scripts/kernel_evidence_status.py render "$output/STATUS.json" \
            --source-root "$GITHUB_WORKSPACE" --output-dir "$output/views"
          python3 scripts/kernel_evidence_status.py render "$output/STATUS.json" \
            --source-root "$GITHUB_WORKSPACE" --output-dir "$output/views" --check
          cat "$output/views/qualification/kernel-evidence/RELEASE_DASHBOARD.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Record aggregate diagnostics even when qualification fails
        if: always()
        env:
          JOB_OUTCOMES: ${{ toJSON(needs) }}
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-evidence-canonical"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kernel-evidence-canonical/diagnostics.json"
          path.write_text(json.dumps({"sourceCommit": os.environ["SOURCE_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "jobs": json.loads(os.environ["JOB_OUTCOMES"]),
              "steps": json.loads(os.environ["STEP_OUTCOMES"])}, indent=2) + "\n")
          PY

      - name: Upload canonical status and generated views
        id: canonical_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: kernel-evidence-canonical-status-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/kernel-evidence-canonical/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce required qualification without accepting skipped lanes
        if: always()
        env:
          SOURCE_RESULT: ${{ needs.source-head.result }}
          MERGE_RESULT: ${{ needs.merge-candidate.result }}
          QUALIFIED: ${{ steps.canonical_status.outputs.qualified }}
          CANONICAL_RESULT: ${{ steps.canonical_status.outcome }}
          DOWNLOAD_RESULT: ${{ steps.receipts_download.outcome }}
          VIEWS_RESULT: ${{ steps.generated_views.outcome }}
          UPLOAD_RESULT: ${{ steps.canonical_upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then test "$MERGE_RESULT" = success; fi
          test "$QUALIFIED" = true
          test "$CANONICAL_RESULT" = success
          test "$DOWNLOAD_RESULT" = success
          test "$VIEWS_RESULT" = success
          test "$UPLOAD_RESULT" = success
