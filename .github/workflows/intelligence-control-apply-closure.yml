name: intelligence.control apply reviewed closure patch

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/intelligence-control-closure.patch.part-00
      - .github/intelligence-control-closure.patch.part-01
      - .github/intelligence-control-closure.patch.part-02
      - .github/intelligence-control-closure.patch.part-03
      - .github/intelligence-control-closure.patch.part-04
      - .github/workflows/intelligence-control-apply-closure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intelligence-control-materialize-codex-intelligence-control-product-closure-20260926
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'codex/intelligence-control-product-closure-20260926'
    # This transport-only job does not compile target code. Keep it isolated on
    # a hosted pool and make each integrity boundary independently visible.
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_BRANCH: codex/intelligence-control-product-closure-20260926
      EXPECTED_SOURCE_PARENT: 64580d8bcb0785567569d55f7993a26daf2ac4df
      EXPECTED_PATCH_SHA256: 851c60e292318b61cbee37e753c0bcdc5f93388cf1757b2a4edf7e95245c4f92
      PATCH_PATH: ${{ runner.temp }}/intelligence-control-closure.patch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable transport envelope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          if ! git merge-base --is-ancestor "$EXPECTED_SOURCE_PARENT" HEAD; then
            echo "expected source parent is not an ancestor" >&2
            git log --oneline --decorate -n 20 >&2
            exit 1
          fi

          actual_paths="$(git diff --name-only "$EXPECTED_SOURCE_PARENT"..HEAD | sort)"
          printf '%s\n' "transport paths:" "$actual_paths"
          unexpected_paths="$(
            printf '%s\n' "$actual_paths" \
              | grep -Ev '^(\.github/intelligence-control-closure\.patch\.part-[0-9][0-9]|\.github/workflows/intelligence-control-apply-closure\.yml|\.github/workflows/hepta-intelligence-diagnostics\.yml)$' \
              || true
          )"
          if [ -n "$unexpected_paths" ]; then
            printf 'unexpected transport paths:\n%s\n' "$unexpected_paths" >&2
            exit 1
          fi

          parts=(.github/intelligence-control-closure.patch.part-*)
          test "${#parts[@]}" -eq 5
          cat "${parts[@]}" > "$PATCH_PATH"
          python3 - "$PATCH_PATH" "$EXPECTED_PATCH_SHA256" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          payload = path.read_bytes()
          actual = hashlib.sha256(payload).hexdigest()
          print(f"patch_bytes={len(payload)}")
          print(f"patch_sha256={actual}")
          if actual != expected:
              raise SystemExit(
                  f"patch sha256 mismatch: expected {expected}, observed {actual}"
              )
          PY

      - name: Verify reviewed patch applies exactly
        shell: bash
        run: |
          set -euo pipefail
          if ! git apply --check --verbose "$PATCH_PATH"; then
            echo "reviewed closure patch does not apply to the frozen source parent" >&2
            echo "current head: $(git rev-parse HEAD)" >&2
            echo "source parent: $EXPECTED_SOURCE_PARENT" >&2
            exit 1
          fi

      - name: Apply reviewed patch and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$PATCH_PATH"
          git rm -f .github/intelligence-control-closure.patch.part-* \
            .github/workflows/intelligence-control-apply-closure.yml

          if git cat-file -e "$EXPECTED_SOURCE_PARENT:.github/workflows/hepta-intelligence-diagnostics.yml"; then
            git checkout "$EXPECTED_SOURCE_PARENT" -- \
              .github/workflows/hepta-intelligence-diagnostics.yml
          else
            git rm -f .github/workflows/hepta-intelligence-diagnostics.yml
          fi

          git diff --cached --check
          git status --short

      - name: Verify generated status and acceptance declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-intelligence-control-status.py --check-tracked
          python3 scripts/hepta-intelligence-control-status-tests.py
          python3 scripts/hepta-intelligence-acceptance.py --check

      - name: Commit materialized candidate atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(intelligence-control): close qualification and recovery gaps"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$EXPECTED_SOURCE_BRANCH"
