name: Prompt registry fast source author

on:
  push:
    branches: [ops/prompt-registry-full-closeout-author-20260929]
    paths:
      - .github/scripts/prompt_registry_full_closeout_phase1.py
      - .github/workflows/prompt-registry-full-closeout-author-fast.yml

permissions:
  contents: write

concurrency:
  group: prompt-registry-fast-source-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      TARGET_BRANCH: codex/prompt-registry-full-closeout-20260929
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply source changes from isolated authoring branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b6cdf7d069a84592c610d57f2685096bb1cf0859"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/prompt_registry_full_closeout_phase1.py?ref=${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/prompt_registry_full_closeout_phase1.py"
          python3 "$RUNNER_TEMP/prompt_registry_full_closeout_phase1.py"
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'scripts/hepta-prompt-registry-map.py',
              'scripts/hepta-prompt-registry-status.py',
              'scripts/hepta-prompt-registry-qualify.py',
              'scripts/hepta-prompt-registry-aggregate.py',
              'scripts/hepta-prompt-registry-harness-tests.py',
              'scripts/hepta-prompt-registry-accept.py',
          ]:
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          PY
          python3 scripts/hepta-prompt-registry-harness-tests.py
          if grep -n 'nonce: \[' \
            codex-rs/hepta-agentd/src/prompt_final_use_tests.rs \
            codex-rs/hepta-agentd/src/prompt_runtime_tests.rs \
            codex-rs/hepta-prompt-registry/tests/durable_relations_v4.rs; then
            exit 1
          fi
      - name: Commit source candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'prompt.registry: close product qualification and evidence identity'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Generate and publish exact source truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-prompt-registry-map.py --write
          python3 scripts/hepta-prompt-registry-map.py --check
          python3 scripts/hepta-prompt-registry-status.py --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            docs/modules/prompt.registry/IMPLEMENTATION_MAP.json \
            docs/modules/prompt.registry/QUALIFICATION_STATUS.md | sort)
          test "$changed" = "$expected"
          git add \
            docs/modules/prompt.registry/IMPLEMENTATION_MAP.json \
            docs/modules/prompt.registry/QUALIFICATION_STATUS.md
          git diff --cached --check
          git commit -m 'docs(prompt.registry): regenerate exact source truth'
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'source_parent=%s\ndelivery_sha=%s\ndelivery_tree=%s\n' \
            "${{ steps.source.outputs.sha }}" \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^{tree})" | tee "$RUNNER_TEMP/prompt-registry-delivery.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-fast-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-registry-delivery.txt
          if-no-files-found: error
          retention-days: 30
