name: cognitive-types-integration-source-export

on:
  push:
    branches:
      - 'codex/cognitive-types-full-closure-20260927'
    paths:
      - '.github/workflows/cognitive-types-integration-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > cognitive-types-source-sha.txt
          git rev-parse HEAD^{tree} > cognitive-types-source-tree.txt

      - name: Upload audited source slice
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cognitive-types-integration-source-${{ github.sha }}
          path: |
            cognitive-types-source-sha.txt
            cognitive-types-source-tree.txt
            codex-rs/hepta-cognitive-types
            codex-rs/hepta-cognitive-store
            codex-rs/hepta-cognitive-read
            codex-rs/hepta-memory-retrieval
            codex-rs/hepta-compact-engine
            codex-rs/hepta-intelligence
            codex-rs/hepta-memory
            codex-rs/hepta-agentd
            codex-rs/Cargo.toml
            codex-rs/Cargo.lock
            docs/modules/cognitive.types
            qualification/cognitive-types-v1
            qualification/cognitive-types-v2
          if-no-files-found: error
          retention-days: 1
