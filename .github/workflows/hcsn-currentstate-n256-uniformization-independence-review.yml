name: hcsn-currentstate-n256-uniformization-independence-review

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_uniformization_independence_review/**"
      - ".github/workflows/hcsn-currentstate-n256-uniformization-independence-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled synthetic review fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_uniformization_independence_review.test_review -v
      - name: Optimized synthetic review fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_uniformization_independence_review.test_review -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_uniformization_independence_review/*.py
      - name: Verify exact frozen review and sources
        run: python3 -m qualification.hcsn_currentstate_n256_uniformization_independence_review.verify_source
