name: Cognitive read source preparation (not qualification)

on:
  push:
    branches: [work/cognitive-read-source-preparation-20260928]
    paths: [.github/workflows/cognitive-read-source-preparation.yml]

permissions:
  contents: read

concurrency:
  group: cognitive-read-source-preparation-20260928
  cancel-in-progress: false

env:
  SOURCE_SHA: 4fb91f9ebf7883d7b5e0202a90e8091383991d2c

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Source-authoring proposal only. This workflow cannot write any remote
      # branch or produce a qualification/activation/acceptance receipt.
      - name: Check out the frozen source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare repository tools
        uses: ./.github/actions/setup-ci
      - name: Prepare source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cognitive-read-source-preparation"
          mkdir -p "$out"
          printf '%s\n' "$SOURCE_SHA" > "$out/base.txt"
          printf '%s\n' 'Reviewable source-authoring proposal only. Not qualification, production execution, acceptance or release evidence.' > "$out/SCOPE.txt"
      - name: Reconcile workspace lock without upgrading unrelated packages
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path codex-rs/Cargo.toml --workspace \
            2>&1 | tee "$RUNNER_TEMP/cognitive-read-source-preparation/lock-resolution.log"
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version=1 \
            --all-features --filter-platform x86_64-unknown-linux-gnu > /dev/null
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version=1 \
            --all-features --filter-platform aarch64-unknown-linux-gnu > /dev/null
      - name: Apply scoped formatting as ordinary source changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-cognitive-read --package codex-hepta-agentd
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-cognitive-read --package codex-hepta-agentd -- --check
          git diff --check
      - name: Refresh matching Bazel lock
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- codex-rs/Cargo.lock; then
            just bazel-lock-update 2>&1 | tee "$RUNNER_TEMP/cognitive-read-source-preparation/bazel-lock.log"
          fi
      - name: Commit and export reviewable source without remote writes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import subprocess
          allowed = {'codex-rs/Cargo.lock', 'MODULE.bazel.lock'}
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in paths:
              if path not in allowed and not path.startswith(('codex-rs/hepta-agentd/', 'codex-rs/hepta-cognitive-read/')):
                  raise SystemExit(f'unexpected source change: {path}')
          PY
          git diff --check
          git add -u
          git commit --signoff -m 'fix(cognitive.read): reconcile locked build inputs and scoped Rust formatting'
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Preserve source bytes even after a preparation failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cognitive-read-source-preparation"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/proposed-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$out/proposed-tree.txt"
          git diff --stat "$SOURCE_SHA" > "$out/diff-stat.txt"
          git diff --binary "$SOURCE_SHA" > "$out/proposed.patch"
          git status --porcelain > "$out/worktree-status.txt"
          git archive --format=tar.gz --output="$out/source.tar.gz" HEAD
          git bundle create "$out/source.bundle" HEAD
          (cd "$out" && sha256sum proposed.patch source.tar.gz source.bundle > SHA256SUMS)
      - name: Retain source proposal artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-source-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/cognitive-read-source-preparation
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
