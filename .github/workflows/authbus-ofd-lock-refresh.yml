name: Temporary AuthBus OFD lock refresh

on:
  push:
    branches:
      - auth-authbus-boundary-convergence-20260928
    paths:
      - codex-rs/hepta-authbus/Cargo.toml
      - codex-rs/hepta-authbus/tests/owner_lock_compat.rs
      - .github/workflows/authbus-ofd-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: authbus-ofd-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Refresh and validate the AuthBus lock dependency
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 >/dev/null
          cargo fmt --all --manifest-path codex-rs/Cargo.toml -- --check
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets --no-run
          cargo clippy --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets --all-features -- -D warnings
          git diff --check

      - name: Commit the generated Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- codex-rs/Cargo.lock; then
            echo "Cargo.lock already matches the manifest"
            exit 0
          fi
          test -z "$(git status --short --untracked-files=no | grep -v '^ M codex-rs/Cargo.lock$' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/Cargo.lock
          git commit -m "chore(authbus): refresh Cargo.lock for OFD locking"
          git push origin "HEAD:${GITHUB_REF_NAME}"
