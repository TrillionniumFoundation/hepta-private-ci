name: Temporary AuthBus source authoring

on:
  push:
    branches:
      - auth-authbus-boundary-convergence-20260928
    paths:
      - .github/workflows/authbus-ofd-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: authbus-source-authoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Materialize canonical AuthBus formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path codex-rs/Cargo.toml
          git add -- codex-rs/hepta-authbus
          if git diff --cached --quiet; then
            echo 'AuthBus source is already formatted.'
            exit 0
          fi
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -s -m 'style(auth.authbus): apply canonical formatting'
          git push origin "HEAD:${GITHUB_REF_NAME}"
