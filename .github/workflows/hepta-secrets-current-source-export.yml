name: Export exact current secrets.heptabao source

on:
  push:
    branches:
      - codex/secrets-heptabao-final-hardening-20260928
    paths:
      - ".github/workflows/hepta-secrets-current-source-export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-current-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Check out exact source surface
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            codex-rs/hepta-bao-adapter
            codex-rs/hepta-authbus
            codex-rs/state/sqlite
            codex-rs/Cargo.toml
            codex-rs/Cargo.lock
            codex-rs/rust-toolchain.toml
            docs/modules/secrets.heptabao
            docs/lane-a-foundation/secrets.heptabao
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json
            scripts/generate_secrets_heptabao_module.py
            .github/workflows/hepta-secrets-recovery.yml
            .github/workflows/secrets-heptabao-candidate-attestation.yml
      - name: Bind and package exact source
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status"
          mkdir -p .hepta-evidence/source-export
          git rev-parse HEAD | tee .hepta-evidence/source-export/HEAD
          git rev-parse HEAD^{tree} | tee .hepta-evidence/source-export/TREE
          printf '%s' "$status" > .hepta-evidence/source-export/status.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf .hepta-evidence/source-export/secrets-current-source.tar.gz \
            codex-rs/hepta-bao-adapter \
            codex-rs/hepta-authbus \
            codex-rs/state/sqlite \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            codex-rs/rust-toolchain.toml \
            docs/modules/secrets.heptabao \
            docs/lane-a-foundation/secrets.heptabao \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            scripts/generate_secrets_heptabao_module.py \
            .github/workflows/hepta-secrets-recovery.yml \
            .github/workflows/secrets-heptabao-candidate-attestation.yml
          sha256sum .hepta-evidence/source-export/secrets-current-source.tar.gz \
            | tee .hepta-evidence/source-export/SHA256SUMS
      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-current-source-${{ github.sha }}
          path: .hepta-evidence/source-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
