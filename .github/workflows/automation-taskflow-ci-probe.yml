name: Automation TaskFlow exact-head CI probe

on:
  push:
    branches:
      - ci/automation-taskflow-f2a0208-probe
    paths:
      - .github/workflows/automation-taskflow-ci-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-taskflow-f2a0208-probe
  cancel-in-progress: true

env:
  CANDIDATE_SHA: f2a0208f45b156209c9ad5d1316b60b8b0f05186

jobs:
  probe:
    name: Exact candidate source qualification
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Prepare CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt

      - name: Verify schema and caller truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/automation_taskflow_contract.py self-test
          python3 -m unittest -v \
            scripts/test_automation_taskflow_contract.py \
            scripts/test_verify_automation_taskflow_acceptance.py
          git diff --check

      - name: Verify exact workspace formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Compile automation owners and Agentd
        working-directory: codex-rs
        run: cargo check -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd --all-targets

      - name: Strict Clippy
        working-directory: codex-rs
        run: cargo clippy -p codex-hepta-automation -p codex-hepta-agentd --all-targets --all-features -- -D warnings

      - name: Test durable automation and migration convergence
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-hepta-operations
          cargo test -p codex-hepta-automation
          cargo test -p codex-hepta-automation --features taskflow-structural-qualification
          cargo test -p codex-hepta-automation --test durable_causal_chain
          cargo test -p codex-hepta-automation migration_convergence

      - name: Test Agentd product composition
        working-directory: codex-rs
        run: cargo test -p codex-hepta-agentd --lib

      - name: Emit exact candidate receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          receipt = {
              "schema": "hepta.automation-taskflow.exact-head-probe.v1",
              "commit": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "runnerOs": os.environ.get("RUNNER_OS"),
              "runnerArch": os.environ.get("RUNNER_ARCH"),
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "automation-taskflow-exact-head-probe.json"
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY

      - name: Retain exact candidate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-taskflow-exact-head-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automation-taskflow-exact-head-probe.json
          if-no-files-found: error
          retention-days: 7
