name: Hepta multiscale regressions

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-multiscale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  contracts:
    name: Multiscale protocols (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEPTA_CI_LANE: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct exact prospective merge
        if: matrix.lane == 'base-merge'
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Bind identity and test without model weights
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --check
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/multiscale-python.json" --minimum-tests 53 -- python3 -m unittest -v scripts.tests.test_hepta_multiscale_scope scripts.tests.test_hepta_laya_retrieval scripts.tests.test_hepta_laya_experiment scripts.tests.test_hepta_laya_immutability
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/existing-scope.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_ci_scope
          printf 'Tested commit: `%s`\n\nThese are protocol/optimizer tests, not real Laya efficacy.\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/check-clean-worktree
        if: always()

  native-recovery:
    name: Multiscale owner recovery (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEPTA_CI_LANE: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct exact prospective merge
        if: matrix.lane == 'base-merge'
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Bind identity and select native scope
        id: scope
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          FULL_SCOPE: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          args=(--head "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$FULL_SCOPE" = "true" ]; then args+=(--full); else args+=(--base "$BASE_SHA"); fi
          python3 scripts/hepta_ci_scope.py "${args[@]}"
          printf 'Tested commit: `%s`\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-ci
        if: steps.scope.outputs.lifecycle == 'true'
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        if: steps.scope.outputs.lifecycle == 'true'
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.scope.outputs.lifecycle == 'true'
        with:
          tool: nextest@0.9.103
      - name: Run actual AutomationStore reopen tests
        if: steps.scope.outputs.lifecycle == 'true'
        working-directory: codex-rs
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/multiscale-native.json" --minimum-tests 2 -- just test --locked -p codex-hepta-automation --test convergence_recovery
      - uses: ./.github/actions/check-clean-worktree
        if: always()
