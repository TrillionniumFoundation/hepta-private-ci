name: Hepta memory retrieval A-E one-shot materializer

on:
  push:
    branches:
      - work/memory-retrieval-ae-convergence-20260928
    paths:
      - .github/workflows/hepta-memory-retrieval-ae-materialize.yml
      - scripts/hepta_memory_retrieval_apply_closure.py
      - scripts/hepta_memory_retrieval_phase_a.py
      - scripts/hepta_memory_retrieval_completion.py
      - scripts/patches/memory_retrieval_assertion_delivery_v2.part*

permissions:
  contents: write

concurrency:
  group: memory-retrieval-ae-materialize-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[retrieval-ae-apply-v2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the triggering source exactly without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify one-shot scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "TrillionniumFoundation/hepta-private-ci"
          test "${GITHUB_REF_NAME}" = "work/memory-retrieval-ae-convergence-20260928"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git config core.hooksPath /dev/null
          case "$(git log -1 --pretty=%B)" in
            *'[retrieval-ae-apply-v2]'*) ;;
            *) echo 'missing one-shot materialization marker' >&2; exit 1 ;;
          esac

      - name: Apply reviewed assertion and delivery closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_memory_retrieval_apply_closure.py \
            --root . --receipt /tmp/retrieval-closure.json

      - name: Apply Phase A monotonic delivery semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_memory_retrieval_phase_a.py \
            --root . --receipt /tmp/retrieval-phase-a.json

      - name: Apply bounded end-to-end deadline closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_memory_retrieval_completion.py \
            --root . --receipt /tmp/retrieval-completion.json

      - name: Stage immutable application receipts
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir=docs/modules/memory.retrieval/receipts
          mkdir -p "${receipt_dir}"
          cp /tmp/retrieval-closure.json "${receipt_dir}/assertion-delivery-closure.json"
          cp /tmp/retrieval-phase-a.json "${receipt_dir}/phase-a-correctness.json"
          cp /tmp/retrieval-completion.json "${receipt_dir}/phase-b-runtime-boundary.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path('.')
          paths = sorted(
              line for line in subprocess.check_output(
                  ['git', 'status', '--porcelain=v1'], text=True
              ).splitlines()
              if line
          )
          manifest = {
              'schema': 'hepta.memory-retrieval.ae-materialization.v2',
              'input_commit': os.environ['GITHUB_SHA'],
              'input_tree': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD^{tree}'], text=True
              ).strip(),
              'changed_status_rows': paths,
              'transforms': {
                  name: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
                  for name, path in {
                      'assertion_delivery': '/tmp/retrieval-closure.json',
                      'phase_a': '/tmp/retrieval-phase-a.json',
                      'phase_b': '/tmp/retrieval-completion.json',
                  }.items()
              },
              'production_activation': False,
              'release': False,
          }
          target = root / 'docs/modules/memory.retrieval/receipts/ae-materialization.json'
          target.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Prove bounded source inventory and formatting
        shell: bash
        run: |
          set -euo pipefail
          git add --all
          git diff --cached --check
          python3 -m py_compile \
            scripts/hepta_memory_retrieval_apply_closure.py \
            scripts/hepta_memory_retrieval_phase_a.py \
            scripts/hepta_memory_retrieval_completion.py
          test -f codex-rs/hepta-agentd/src/retrieval_delivery.rs
          test -f codex-rs/hepta-agentd/src/retrieval_delivery_tests.rs
          test -f codex-rs/hepta-memory/src/cognitive_proposition_writer.rs
          test -f codex-rs/hepta-memory/src/production_writer.rs
          grep -q 'AssignmentPrepared' codex-rs/hepta-agentd/src/retrieval_delivery.rs
          grep -q 'Published' codex-rs/hepta-agentd/src/retrieval_delivery.rs
          grep -q 'NativeStarted' codex-rs/hepta-agentd/src/retrieval_delivery.rs
          grep -q 'OutcomeObserved' codex-rs/hepta-agentd/src/retrieval_delivery.rs
          grep -q 'run_async' codex-rs/hepta-agentd/src/retrieval_executor.rs
          grep -q 'MAX_PROVIDER_REQUEST_TIMEOUT_MS: u64 = 800' \
            codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap.rs
          grep -q 'cannot enable Vector without an authenticated generation-bound encoder/index owner' \
            codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap.rs
          ! grep -q 'delivered_candidate_indices.sort_unstable' \
            codex-rs/hepta-learning-ledger/src/ledger.rs
          (cd codex-rs && cargo +1.95.0 fmt --all -- --check)

      - name: Commit and fast-forward only after a remote-head CAS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$(git diff --cached --name-only)"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(memory.retrieval): materialize A-E correctness and runtime closure'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
