name: Windows private filesystem

on:
  push:
    paths:
      - .github/workflows/windows-private-fs.yml
      - codex-rs/utils/path-utils/**
      - codex-rs/utils/absolute-path/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - justfile
      - scripts/just-shell.py
      - scripts/run-nextest.py
  pull_request:
    paths:
      - .github/workflows/windows-private-fs.yml
      - codex-rs/utils/path-utils/**
      - codex-rs/utils/absolute-path/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - justfile
      - scripts/just-shell.py
      - scripts/run-nextest.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-private-fs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-path-utils:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: ${{ github.sha }}
      CARGO_TERM_COLOR: never
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ runner.temp }}/windows-private-fs-target
      EVIDENCE_DIR: ${{ runner.temp }}/windows-private-fs-evidence
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3f2778ee6a28c53e512b95bbcf7b2120993da70d
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Bind native checkout and toolchain
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force $env:EVIDENCE_DIR | Out-Null
          $head = git --no-replace-objects rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw "source identity mismatch" }
          $tree = git --no-replace-objects rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @("head=$head", "tree=$tree", "runner=$env:RUNNER_OS") | Set-Content "$env:EVIDENCE_DIR/identity.txt"
          rustc --version | Add-Content "$env:EVIDENCE_DIR/identity.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem codex-rs/utils/path-utils/src -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content "$env:EVIDENCE_DIR/source-sha256.txt"
      - name: Execute the complete path-utils crate on Windows
        working-directory: codex-rs
        run: |
          just test -p codex-utils-path --locked --retries 0 2>&1 | Tee-Object -FilePath "$env:EVIDENCE_DIR/tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check all path-utils targets with strict Clippy
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          cargo clippy --locked -p codex-utils-path --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath "$env:EVIDENCE_DIR/clippy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify tracked source is unchanged
        if: ${{ always() && !cancelled() }}
        run: |
          $head = git --no-replace-objects rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw "source identity changed" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows source and execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-private-fs-${{ github.sha }}
          path: ${{ runner.temp }}/windows-private-fs-evidence/
          if-no-files-found: error
          retention-days: 7
