name: Runtime supervisor final materializer

on:
  push:
    branches:
      - codex/runtime-supervisor-final-convergence-20260928
    paths:
      - .github/runtime-supervisor-final-materialize.py

permissions:
  contents: write

concurrency:
  group: runtime-supervisor-final-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply checked source and documentation transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/runtime-supervisor-final-materialize.py
          rm .github/runtime-supervisor-final-materialize.py
          rm .github/workflows/runtime-supervisor-final-materialize.yml
          git diff --check
      - name: Commit exact transformed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "runtime-supervisor-materializer"
          git config user.email "runtime-supervisor-materializer@users.noreply.github.com"
          git add --all
          test -n "$(git status --short)"
          git commit -m "feat(runtime.supervisor): converge control recovery and diagnostics"
          git push origin HEAD:codex/runtime-supervisor-final-convergence-20260928
