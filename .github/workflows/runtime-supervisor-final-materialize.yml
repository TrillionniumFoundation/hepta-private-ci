name: Runtime supervisor production closure materializer

on:
  push:
    branches:
      - codex/runtime-supervisor-production-closure-20260928
    paths:
      - .github/runtime-supervisor-final-materialize.py
      - .github/workflows/runtime-supervisor-final-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-supervisor-production-closure-materializer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact formatting toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$channel" >> "$GITHUB_ENV"
      - name: Materialize native source and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/runtime-supervisor-final-materialize.py
          rm .github/runtime-supervisor-final-materialize.py
          rm .github/workflows/runtime-supervisor-final-materialize.yml
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check
      - name: Verify materialized production closure
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/runtime-supervisor-final-materialize.py
          test ! -e .github/workflows/runtime-supervisor-final-materialize.yml
          test -f codex-rs/hepta-supervisor/src/control_latency.rs
          test -f docs/modules/runtime.supervisor/PRODUCTION_CLOSURE.md
          test -f docs/modules/runtime.supervisor/PRODUCTION_CLOSURE.json
          grep -q 'pub use control_latency::control_latency_snapshot' codex-rs/hepta-supervisor/src/lib.rs
          grep -q 'persistence_indeterminate' codex-rs/hepta-supervisor/src/daemon.rs
          grep -q 'hepta_supervisord_control_audit' codex-rs/hepta-supervisor/src/daemon.rs
          grep -q 'ControlLatencyStage::ExitObservation' codex-rs/hepta-supervisor/src/tick.rs
      - name: Commit exact transformed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "runtime-supervisor-materializer"
          git config user.email "runtime-supervisor-materializer@users.noreply.github.com"
          git add --all
          test -n "$(git status --short)"
          git commit -m "feat(runtime.supervisor): close control recovery and diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
