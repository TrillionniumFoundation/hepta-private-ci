name: Hepta Exec P2g signed Final-use and original owner denial

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-evidence/tests/exec_final_use_denial_p2g.rs'
      - 'codex-rs/hepta-evidence/src/execution_*'
      - 'codex-rs/hepta-contracts/src/final_use*'
      - 'codex-rs/hepta-contracts/src/execution_contract_v1.rs'
      - 'qualification/codex-exec-p2e/corpus.json'
      - 'qualification/codex-exec-p2g/**'
      - '.github/workflows/hepta-exec-p2g.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-exec-p2g-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-denial:
    name: Signed claim and real Evidence no-effect (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout exact non-production candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact P2f ancestry and source-head or prospective merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor 35ca2c90cde04e50fb6296f39c15d68cf250f80c HEAD
          if [ '${{ matrix.lane }}' = base-merge ]; then
            test -n "$BASE_SHA"
            tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            merge="$(printf '%s\n' 'P2g signed no-effect qualification only' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            test "$(git show -s --format=%P "$merge")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$merge"
            test "$(git rev-parse HEAD^{tree})" = "$tree"
          fi
          printf 'source=%s base=%s tested=%s tree=%s\n' "$SOURCE_SHA" "$BASE_SHA" \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          git diff --quiet
          git diff --cached --quiet

      - name: Verify original Cargo lock and pinned Rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_cargo_lock.py
          cd codex-rs
          rustc --version --verbose
          cargo fmt -p codex-hepta-evidence -p codex-hepta-contracts -- --check

      - name: Test original signed authority and original durable Evidence owner
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-contracts -p codex-hepta-evidence --all-targets
          cargo test --locked -p codex-hepta-contracts --lib final_use
          cargo test --locked -p codex-hepta-evidence --lib
          cargo test --locked -p codex-hepta-evidence --test exec_server_cold_p2f
          cargo test --locked -p codex-hepta-evidence --test exec_final_use_denial_p2g
          cargo clippy --locked -p codex-hepta-contracts -p codex-hepta-evidence --all-targets -- -D warnings

      - name: Refuse source, lock or generated-output drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet
          git diff --cached --quiet
