name: compact.engine native developer tools

on:
  push:
    branches:
      - fix/compact-engine-current-main-convergence-20260925
    paths:
      - .github/workflows/compact-engine-native-tools.yml

permissions:
  contents: read

jobs:
  tools:
    name: Export native test runners (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Install the repository test entrypoint tools
        run: cargo install --locked just cargo-nextest
      - name: Retain only executables and version evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compact-tools/bin"
          cp "$(command -v just)" "$RUNNER_TEMP/compact-tools/bin/just"
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/compact-tools/bin/cargo-nextest"
          {
            rustc -Vv
            cargo -V
            just --version
            cargo nextest --version
            printf 'source_sha=%s\n' '${{ github.sha }}'
          } > "$RUNNER_TEMP/compact-tools/versions.txt"
          cd "$RUNNER_TEMP/compact-tools"
          tar -czf test-runners.tar.gz bin
          sha256sum test-runners.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-engine-test-runners-${{ github.sha }}
          path: |
            ${{ runner.temp }}/compact-tools/test-runners.tar.gz
            ${{ runner.temp }}/compact-tools/SHA256SUMS
            ${{ runner.temp }}/compact-tools/versions.txt
          retention-days: 1
          if-no-files-found: error
