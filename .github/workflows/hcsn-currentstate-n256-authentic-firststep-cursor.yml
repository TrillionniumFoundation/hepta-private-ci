name: hcsn-currentstate-n256-authentic-firststep-cursor

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_authentic_firststep_cursor/**"
      - ".github/workflows/hcsn-currentstate-n256-authentic-firststep-cursor.yml"

permissions:
  contents: read

jobs:
  authentic-firststep-cursor-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNIQUE_EXECUTION_KEY: hcsn-n256-authentic-firststep-cursor-20261121-c6bc-001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify precommitted source and fail-closed scope
        run: python3 -m qualification.hcsn_currentstate_n256_authentic_firststep_cursor.verify_source
      - name: Synthetic first-step controls
        run: |
          python3 -m unittest qualification.hcsn_currentstate_n256_authentic_firststep_cursor.test_cursor
          python3 -O -m unittest qualification.hcsn_currentstate_n256_authentic_firststep_cursor.test_cursor
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_authentic_firststep_cursor/*.py
      - name: Execute authentic first-step cursor once
        run: python3 -m qualification.hcsn_currentstate_n256_authentic_firststep_cursor.run
      - name: Upload immutable first-step originals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-authentic-firststep-cursor-001
          path: qualification/hcsn_currentstate_n256_authentic_firststep_cursor/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 90
