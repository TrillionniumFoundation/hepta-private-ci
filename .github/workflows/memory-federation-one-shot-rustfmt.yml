name: memory federation one-shot rustfmt

on:
  push:
    branches:
      - feat/memory-federation-full-closure-20260927
    paths:
      - .github/workflows/memory-federation-one-shot-rustfmt.yml

permissions:
  contents: write

concurrency:
  group: memory-federation-one-shot-rustfmt
  cancel-in-progress: true

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply repository rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt \
            -p codex-hepta-memory-federation \
            -p codex-hepta-memory \
            -p codex-hepta-memory-extension \
            -p codex-hepta-agentd \
            -p codex-app-server

      - name: Remove one-shot workflow and verify scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/memory-federation-one-shot-rustfmt.yml
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            .github/workflows/memory-federation-one-shot-rustfmt.yml
            codex-rs/hepta-memory-federation/src/v2.rs
            codex-rs/hepta-memory/src/cognitive_runtime.rs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Commit exact formatting result
        shell: bash
        env:
          BRANCH: feat/memory-federation-full-closure-20260927
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TRIGGER_SHA"
          git config user.name "Hepta Memory Federation CI"
          git config user.email "hepta-memory-federation-ci@users.noreply.github.com"
          git add \
            .github/workflows/memory-federation-one-shot-rustfmt.yml \
            codex-rs/hepta-memory-federation/src/v2.rs \
            codex-rs/hepta-memory/src/cognitive_runtime.rs
          git commit -m "style(memory-federation): apply pinned rustfmt diagnostics"
          git push origin "HEAD:$BRANCH"
