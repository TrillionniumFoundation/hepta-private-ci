name: context-compiler-one-shot-squash

on:
  push:
    branches:
      - codex/context-compiler-v3-closure-20260928
    paths:
      - .github/workflows/context-compiler-one-shot-squash.yml

permissions:
  contents: write

concurrency:
  group: context-compiler-one-shot-squash
  cancel-in-progress: false

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: bedf77652f74b62c1e5d6bb3b2119893e581cecc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate and verify all projections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          state_path = Path("docs/modules/context.compiler/CURRENT_STATE.json")
          state = json.loads(state_path.read_text())
          state["runtimeSourceAnchor"] = source_sha
          state["runtimeSourceTree"] = subprocess.check_output(
              ["git", "rev-parse", f"{source_sha}^{{tree}}"], text=True
          ).strip()
          for item in state["runtimeSourceFiles"]:
              source_blob = subprocess.check_output(
                  ["git", "rev-parse", f"{source_sha}:{item['path']}"], text=True
              ).strip()
              head_blob = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{item['path']}"], text=True
              ).strip()
              if head_blob != source_blob:
                  raise SystemExit(f"runtime source changed after anchor: {item['path']}")
              item["blobSha"] = source_blob
          state_path.write_text(json.dumps(state, indent=2) + "\n")
          PY
          python3 -B scripts/generate_context_compiler_module_docs.py --write
          python3 -B scripts/generate_context_compiler_module_docs.py --check
          python3 -B -m unittest discover -s scripts -p 'test_context_compiler_*.py' -q
      - name: Replace transient workflow commits with one atomic docs commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git read-tree "${SOURCE_SHA}^{tree}"
          git add \
            docs/modules/context.compiler/CURRENT_STATE.json \
            docs/modules/context.compiler/CURRENT_PRODUCT_PATH.md \
            docs/modules/context.compiler/IMPLEMENTATION_MAP.json \
            docs/modules/context.compiler/MODULE_MANIFEST.json \
            docs/modules/context.compiler/TECHNICAL.md \
            qualification/module-execution-dossiers/detail/context.compiler.md
          git diff --cached --check
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$SOURCE_SHA" <<EOF
          docs(context.compiler): bind generated truth to bedf776

          Refresh registered runtime blob identities after lifecycle fixture changes, bind provenance to bedf776/0cf89, and regenerate the technical guide, product path, implementation map, manifest, state, and execution dossier together.

          The 61-test projection suite and generator check pass. This does not claim authenticated App Server ingress, external security consumption, independent provider evidence, selected-host qualification, independent acceptance, activation, or release.
          EOF
          )
          git push --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}" \
            origin "${commit}:refs/heads/${GITHUB_REF_NAME}"
