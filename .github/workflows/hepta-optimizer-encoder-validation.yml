# Reviewed source anchor: f143652bdfaf4b2b9ac2d4dc0b846aa62af81290
name: Optimizer, delivery encoder, and NDU validation

on:
  push:
    branches:
      - integration/hepta-rust-validation-20261117-59d82
    paths:
      - .github/workflows/hepta-optimizer-encoder-validation.yml

permissions:
  contents: read

jobs:
  original-package-gates:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/integration/hepta-rust-validation-20261117-59d82' &&
      github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Set isolated validation directories on the runner
        run: |
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/optimizer-encoder-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'HEPTA_VALIDATION_OUTPUT=%s\n' "$RUNNER_TEMP/optimizer-encoder-records-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'HEPTA_PUBLIC_TOOL_OUTPUT=%s\n' "$RUNNER_TEMP/optimizer-encoder-public-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out the actual push commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the existing Python runtime version
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.14"

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - name: Install the existing qualification runner versions
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest@0.9.103

      - name: Install the formatter project runner
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Run original formatting, fix, and full package tests
        run: python3 .github/scripts/validate_optimizer_encoder.py

      - name: Export only public installed tool files
        if: always()
        run: python3 .github/scripts/validate_optimizer_encoder.py --export-tools

      - name: Preserve execution records and public tools
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-encoder-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HEPTA_VALIDATION_OUTPUT }}
            ${{ env.HEPTA_PUBLIC_TOOL_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
