name: Evaluate secrets.heptabao phase-three payload read-only

on:
  push:
    branches:
      - codex/secrets-heptabao-final-hardening-20260928
    paths:
      - ".hepta-bootstrap/secrets-phase3/**"
      - ".github/workflows/hepta-secrets-phase3-evaluate-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-phase3-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-slim
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct and audit the stored payload
        shell: bash
        run: |
          set -euo pipefail
          evidence=.hepta-evidence/phase3
          mkdir -p "$evidence"
          shopt -s nullglob
          parts=(.hepta-bootstrap/secrets-phase3/part-*)
          test "${#parts[@]}" -eq 4
          bundle="$evidence/secrets-phase3.patch.gz.b64"
          patch="$evidence/secrets-phase3.patch"
          cat "${parts[@]}" > "$bundle"
          test "$(wc -c < "$bundle")" -eq 28000
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          sha256sum "$bundle" "$patch" | tee "$evidence/SHA256SUMS"
          grep '^diff --git ' "$patch" \
            | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' \
            | LC_ALL=C sort -u > "$evidence/paths.txt"
          test -s "$evidence/paths.txt"
          while IFS= read -r path; do
            case "$path" in
              codex-rs/hepta-bao-adapter/*|codex-rs/hepta-authbus/*|codex-rs/state/sqlite/*|codex-rs/Cargo.toml|codex-rs/Cargo.lock|docs/modules/secrets.heptabao/*|docs/lane-a-foundation/secrets.heptabao/*|docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json|qualification/module-execution-dossiers/*|scripts/*|.github/workflows/lane-a-foundation.yml)
                ;;
              *)
                echo "phase-three payload touches unapproved path: $path" >&2
                exit 1
                ;;
            esac
          done < "$evidence/paths.txt"

      - name: Apply payload in the disposable checkout
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence=.hepta-evidence/phase3
          git apply --3way --index "$evidence/secrets-phase3.patch" \
            2>&1 | tee "$evidence/apply.log"
          git diff --cached --check
          git diff --cached --stat | tee "$evidence/applied.stat"
          git diff --cached --name-only | LC_ALL=C sort -u > "$evidence/applied-paths.txt"
          git diff --cached --binary > "$evidence/applied.diff"

      - name: Install repository Rust toolchain
        if: steps.apply.outcome == 'success'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Execute native phase-three qualification
        id: native
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py --write
          python3 scripts/generate_secrets_heptabao_module.py
          git add \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/modules/secrets.heptabao/IMPLEMENTATION_MAP.json \
            docs/modules/secrets.heptabao/CAPABILITY_MATRIX.json \
            docs/modules/secrets.heptabao/NONCLAIMS.json \
            docs/modules/secrets.heptabao/SOURCE_ANCHORS.json
          git diff --cached --check
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite -- --check
          cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- --test-threads=2
          cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2
          cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2

      - name: Retain exact payload and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-phase3-readonly-${{ github.sha }}
          path: .hepta-evidence/phase3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Preserve evaluation failures
        if: always()
        env:
          APPLY: ${{ steps.apply.outcome }}
          NATIVE: ${{ steps.native.outcome }}
        shell: bash
        run: test "$APPLY" = success && test "$NATIVE" = success
