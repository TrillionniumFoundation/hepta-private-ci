name: Hepta FastCell real Unix socket-pair transport (research only)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-compiled-use/**"
      - ".github/workflows/hepta-fastcell-unix-duplex-v3.yml"
  push:
    branches:
      - "research/fastcell-unix-duplex-v3-20261016"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastcell-unix-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-uds-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact source and toolchain
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Full fixed-frame crate native tests
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-compiled-use
      - name: Strict crate lints and formatting
        run: |
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-compiled-use --all-targets -- -D warnings
          cargo fmt --manifest-path codex-rs/hepta-compiled-use/Cargo.toml -- --check
      - name: Physical kernel Unix socket RTT only
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-compiled-use --example unix_duplex_bench -- --smoke | tee "$RUNNER_TEMP/fastcell-unix-rtt.json"
          python3 - "$RUNNER_TEMP/fastcell-unix-rtt.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: x=json.load(f)
          assert x['schema']=='hepta.fastcell.unix-duplex-rtt.v1'
          assert x['roundtrips']==64 and x['payload_bytes_per_direction']==256
          assert x['same_process_two_threads'] is True and x['kernel_socket_syscalls'] is True
          assert x['separate_process'] is False and x['mcp_comparison'] is False
          assert x['external_effects'] is False and x['production_authorized'] is False
          assert 0 < x['p50_ns'] <= x['p95_ns'] <= x['p99_ns']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastcell-unix-original-${{ github.run_id }}
          path: ${{ runner.temp }}/fastcell-unix-rtt.json
          if-no-files-found: warn
