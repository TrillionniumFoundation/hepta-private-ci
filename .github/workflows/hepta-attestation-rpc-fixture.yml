name: Attestation reverse-RPC fixture regression

on:
  pull_request:
    branches:
      - "agents/20261022/organ-owner-ci-convergence"
    paths:
      - "codex-rs/app-server/tests/suite/v2/attestation.rs"
      - "codex-rs/app-server/tests/suite/v2/ATTESTATION.md"
      - ".github/workflows/hepta-attestation-rpc-fixture.yml"

permissions:
  contents: read

concurrency:
  group: attestation-rpc-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  original-attestation:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agents/20261022/attestation-rpc-fixture'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ATTESTATION_EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout the exact candidate without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install original Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev bubblewrap
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt,rust-src
      - name: Restore original dependency downloads
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: attestation-rpc-fixture-cargo-${{ matrix.target }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-dev-
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Configure original verified V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Require original source, defaults and native loopback availability
        id: prepared
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check HEAD
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$RUNNER_TEMP/attestation-rpc-fixture"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/attestation-rpc-fixture/source.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import socket
          import subprocess
          root = Path(os.environ["RUNNER_TEMP"]) / "attestation-rpc-fixture"
          expected_sources = {
              "codex-rs/app-server/tests/suite/v2/attestation.rs": "05dbc2aa62c1dad48bb6f9d1968115b9885bf3a9a4c575ecfc789746e8af15d8",
              "codex-rs/app-server/src/attestation.rs": "28f9776283803b3a691f3f5736df6df060b77f6dfe22002b38c4df2056a229ef",
              "codex-rs/app-server/tests/common/test_app_server.rs": "1b925012501380979ed975981726d419ba2c64dfa729d1bd6359bda01846337a",
              "codex-rs/.config/nextest.toml": "78b998d1fcb16dfef6b243a4b18748c1b28ce2d5a28d57f1f477adf0546e5ac6",
              "justfile": "74f869224eba12fc4212b043428e7f5b35b551d26f5b06161c25d8aca525f124",
              "scripts/run-nextest.py": "45c4e35d1ff24840d9e1e05331af0b89475bfe1aec3231afc56fecb8cea66127",
          }
          actual_sources = {}
          for path, expected in expected_sources.items():
              committed = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              actual = hashlib.sha256(committed).hexdigest()
              if actual != expected:
                  raise SystemExit(f"reviewed source or original test defaults changed: {path}")
              blob = subprocess.check_output(["git", "rev-parse", f"HEAD:{path}"], text=True).strip()
              worktree_blob = subprocess.check_output(["git", "hash-object", "--path", path, path], text=True).strip()
              if worktree_blob != blob:
                  raise SystemExit(f"worktree does not match the reviewed Git content: {path}")
              actual_sources[path] = {
                  "git_blob": blob,
                  "git_content_sha256": actual,
                  "worktree_sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest(),
              }
          if "CODEX_SANDBOX_NETWORK_DISABLED" in os.environ:
              raise SystemExit("original network skip condition is present; cannot qualify")
          overrides = sorted(name for name in os.environ if name.startswith("NEXTEST_"))
          if overrides:
              raise SystemExit(f"inherited nextest overrides are not allowed: {overrides}")
          user_configs = {
              Path(os.environ.get("XDG_CONFIG_HOME", Path.home() / ".config")) / "nextest/config.toml",
          }
          if any(path.exists() or path.is_symlink() for path in user_configs):
              raise SystemExit("inherited nextest user configuration is not allowed")
          expected_system = {"Linux": "Linux", "Windows": "Windows"}.get(os.environ["RUNNER_OS"])
          if platform.system() != expected_system:
              raise SystemExit("native runner platform does not match the matrix")
          rustc = subprocess.check_output(["rustc", "-vV"], text=True)
          if f"host: {os.environ['ATTESTATION_EXPECTED_TARGET']}" not in rustc.splitlines():
              raise SystemExit("native Rust host does not match the matrix target")
          (root / "rustc.txt").write_text(rustc)
          with socket.socket() as listener:
              listener.settimeout(5)
              listener.bind(("127.0.0.1", 0))
              listener.listen(1)
              with socket.create_connection(listener.getsockname(), timeout=5) as client:
                  connection, _ = listener.accept()
                  with connection:
                      connection.settimeout(5)
                      client.sendall(b"loopback")
                      if connection.recv(8) != b"loopback":
                          raise SystemExit("loopback preflight failed")
          result = {
              "source_sha": os.environ["SOURCE_SHA"],
              "source_hashes": actual_sources,
              "native_platform": platform.system(),
              "rust_host": os.environ["ATTESTATION_EXPECTED_TARGET"],
              "profile": "local",
              "default_retries": 1,
              "original_runner_timeout_seconds": 60,
              "production_attestation_timeout_ms": 100,
              "network_skip_condition_absent": True,
              "loopback_available": True,
          }
          (root / "prepared.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PY
      - name: Run the original exact attestation handshake regression
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          # Nextest 0.9.103: workspace_root / store.dir / profile / junit.path.
          # The original local profile inherits junit.xml; Cargo's target dir is separate.
          junit="$PWD/target/nextest/local/junit.xml"
          previous="$RUNNER_TEMP/attestation-rpc-fixture/attestation.previous.junit.xml"
          test ! -L "$junit"
          if [ -e "$junit" ]; then
            test -f "$junit"
            test ! -e "$previous"
            test ! -L "$previous"
            mv "$junit" "$previous"
          fi
          test ! -e "$junit"
          set +e
          just test --locked -p codex-app-server --test all -E 'test(=suite::v2::attestation::attestation_generate_round_trip_adds_header_to_responses_websocket_handshake)' --no-tests fail --success-output immediate 2>&1 | tee "$RUNNER_TEMP/attestation-rpc-fixture/attestation.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$RUNNER_TEMP/attestation-rpc-fixture/attestation.exit"
          printf '%s\n' "${statuses[1]}" > "$RUNNER_TEMP/attestation-rpc-fixture/attestation.tee.exit"
          test -f "$junit"
          test ! -L "$junit"
          cp "$junit" "$RUNNER_TEMP/attestation-rpc-fixture/attestation.junit.xml"
          if [ "${statuses[0]}" -ne 0 ]; then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"
      - name: Require the original non-skipped test and immutable tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check HEAD
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ["RUNNER_TEMP"]) / "attestation-rpc-fixture"
          prepared = json.loads((root / "prepared.json").read_text())
          if prepared["source_sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("preflight source does not match the actual PR head")
          if (
              prepared["profile"] != "local"
              or prepared["default_retries"] != 1
              or prepared["original_runner_timeout_seconds"] != 60
              or prepared["production_attestation_timeout_ms"] != 100
              or prepared["network_skip_condition_absent"] is not True
              or prepared["loopback_available"] is not True
              or prepared["native_platform"] != {"Linux": "Linux", "Windows": "Windows"}.get(os.environ["RUNNER_OS"])
              or prepared["rust_host"] != os.environ["ATTESTATION_EXPECTED_TARGET"]
          ):
              raise SystemExit("original defaults or native network preflight did not qualify")
          for path, expected in prepared["source_hashes"].items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != expected["worktree_sha256"]:
                  raise SystemExit(f"reviewed source changed during the test: {path}")
          for name in ("attestation.exit", "attestation.tee.exit"):
              if (root / name).read_text().strip() != "0":
                  raise SystemExit(f"actual test command or log capture failed: {name}")
          junit = root / "attestation.junit.xml"
          if not junit.is_file() or junit.is_symlink():
              raise SystemExit("fresh regular JUnit result is missing")
          cases = ET.parse(junit).findall(".//testcase")
          expected = "suite::v2::attestation::attestation_generate_round_trip_adds_header_to_responses_websocket_handshake"
          if [case.get("name") for case in cases] != [expected]:
              raise SystemExit("exactly the original testcase must be present")
          case = cases[0]
          if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
              raise SystemExit("original testcase did not pass")
          if "Skipping test" in (root / "attestation.log").read_text(errors="replace"):
              raise SystemExit("original test skipped internally")
          prior_failures = [
              {"kind": item.tag, "message": item.get("message"), "type": item.get("type")}
              for item in case
              if item.tag in ("flakyFailure", "flakyError", "rerunFailure", "rerunError")
          ]
          if len(prior_failures) > 1:
              raise SystemExit("retry history exceeds the original one-retry policy")
          result = {
              **prepared,
              "test": expected,
              "final_passed": True,
              "first_attempt_passed": not prior_failures,
              "passed_after_retry": bool(prior_failures),
              "prior_failures": prior_failures,
              "junit_sha256": hashlib.sha256(junit.read_bytes()).hexdigest(),
              "log_sha256": hashlib.sha256((root / "attestation.log").read_bytes()).hexdigest(),
          }
          (root / "verification.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PY
      - name: Retain actual source identity, test history and output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attestation-rpc-fixture-${{ matrix.target }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-rpc-fixture/
          if-no-files-found: error
          retention-days: 14
