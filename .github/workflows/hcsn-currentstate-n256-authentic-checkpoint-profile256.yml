name: hcsn-currentstate-n256-authentic-checkpoint-profile256

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_authentic_checkpoint_profile256/**"
      - ".github/workflows/hcsn-currentstate-n256-authentic-checkpoint-profile256.yml"

permissions:
  contents: read

jobs:
  authentic-checkpoint-profile256-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNIQUE_EXECUTION_KEY: hcsn-n256-authentic-checkpoint-profile256-20261122-c6bc-001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify frozen source, exact inputs, and fail-closed scope
        run: python3 -m qualification.hcsn_currentstate_n256_authentic_checkpoint_profile256.verify_source
      - name: Synthetic index-256 checkpoint controls
        run: |
          python3 -m unittest \
            qualification.hcsn_currentstate_n256_authentic_checkpoint_profile256.test_profile256
          python3 -O -m unittest \
            qualification.hcsn_currentstate_n256_authentic_checkpoint_profile256.test_profile256
      - name: Compile source
        run: |
          python3 -m py_compile \
            qualification/hcsn_currentstate_n256_authentic_checkpoint_profile256/*.py
      - name: Profile authentic recurrence from index 128 to 256 once
        run: python3 -m qualification.hcsn_currentstate_n256_authentic_checkpoint_profile256.run
      - name: Upload immutable index-256 originals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-authentic-checkpoint-profile256-001
          path: qualification/hcsn_currentstate_n256_authentic_checkpoint_profile256/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 90
