name: ui.native retained feedback diagnostics

on:
  push:
    branches: [work/ui-native-qualified-integration-20260928]
    paths: [.github/workflows/hepta-ui-native-feedback-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  inspect-retained-log:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Read primary job diagnostics without changing qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          api = 'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path, maximum=4 * 1024 * 1024):
              request = urllib.request.Request(api + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read(maximum + 1)
                  if len(data) > maximum:
                      raise SystemExit('diagnostic response exceeds byte limit')
                  return data
          sections = []
          for run_id, expected in [
              (36450557375, '6ff6cd07c25c9af4fd6d6f59348eb79fa1fec8c1'),
              (36454592940, 'a0d911f50bddf35da7b3a8cd7e671373a3c128fb'),
          ]:
              run = json.loads(get('/actions/runs/' + str(run_id)))
              if run['head_sha'] != expected or run['run_attempt'] != 1:
                  raise SystemExit('unexpected diagnostic subject')
              jobs = json.loads(get('/actions/runs/' + str(run_id) + '/jobs'))['jobs']
              for job in jobs:
                  if job['name'] != 'Linux committed-source feedback (not six-subject acceptance)':
                      continue
                  if job['status'] != 'completed':
                      sections.append('Run ' + str(run_id) + ': native feedback has not completed; no result claimed.')
                      continue
                  data = get('/actions/jobs/' + str(job['id']) + '/logs')
                  lines = data.decode('utf-8', 'strict').splitlines()
                  selected = set()
                  for i, line in enumerate(lines):
                      if any(word in line for word in ('error[', 'error:', 'FAILED', 'test result:', 'could not compile')):
                          selected.update(range(max(0, i - 2), min(len(lines), i + 14)))
                  excerpt = '\n'.join(lines[i] for i in sorted(selected))[-22000:]
                  steps = [{'name': s['name'], 'conclusion': s['conclusion']} for s in job['steps']]
                  sections.append('### Run ' + str(run_id) + ', source `' + expected + '`\nJob `' + str(job['id']) + '`, log SHA-256 `' + hashlib.sha256(data).hexdigest() + '`\n```json\n' + json.dumps(steps, indent=2) + '\n```\n```text\n' + excerpt.replace('```', "''' ") + '\n```')
          body = ('## Primary job diagnostics — not qualification\nThe previous artifact export failed digest validation; it remains rejected. These are separately retrieved GitHub job logs for troubleshooting, not accepted artifacts or proof of a successful candidate.\n\n' + '\n\n'.join(sections))[:60000]
          request = urllib.request.Request(api + '/issues/1139/comments', data=json.dumps({'body': body}).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Published diagnostic comment', json.load(response)['id'])
          PY
