name: trigger-hepta-r8-r21

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/trigger-hepta-r8-r21.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: trigger-hepta-r8-r21
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 20435fcb2d0258b609ec5a3e49e3b35d1c088c16
      TARGET_BRANCH: ops/hepta-global-gap-closure-controller-20260910-r1
      TARGET_CANDIDATE: integration/hepta-all-gap-closure-20260910-r8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact dispatcher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and retire dispatcher
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:.github/workflows/trigger-hepta-r8-r21.yml)" = "$(git hash-object .github/workflows/trigger-hepta-r8-r21.yml)"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          git config user.name 'hepta-r8-dispatcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/trigger-hepta-r8-r21.yml
          git commit --signoff -m 'chore(hepta): retire one-shot r8 dispatcher'
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Dispatch exact repaired r8
        shell: bash
        run: |
          set -euo pipefail
          clean_sha="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${clean_sha}"
          gh workflow run hepta-global-finalizer-r8.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TARGET_BRANCH}" \
            --field target_branch="${TARGET_CANDIDATE}" \
            --field shard_count='8'
