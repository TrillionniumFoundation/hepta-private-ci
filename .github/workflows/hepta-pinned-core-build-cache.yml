        """Snapshot only stopped ac/cas regular files; verify every archive byte/member."""
        import gzip
        import hashlib
        import json
        import os
        import re
        import shutil
        import signal
        import stat
        import sys
        import tarfile
        import time
        from pathlib import PurePosixPath
        from core_cache_common import (
            DISK_RESERVE_BYTES, MAX_ARCHIVE_BYTES, MAX_CACHE_FILES, MAX_CACHE_INPUT_BYTES,
            PACK_MAX_SECONDS, TRANSFER_RESERVE_SECONDS,
            file_identity, output, paths, read_json, seconds_left, sha256_file, write_json,
        )

        def fingerprint(info):
            return (info.st_dev, info.st_ino, info.st_mode, info.st_size, info.st_mtime_ns, info.st_ctime_ns, info.st_nlink)

        def safe_name(name):
            path = PurePosixPath(name)
            return (not path.is_absolute() and len(path.parts) >= 2 and path.parts[0] in ('ac', 'cas')
                    and all(part not in ('', '.', '..') for part in path.parts)
                    and '\\' not in name and len(name) <= 1024
                    and all(32 <= ord(c) < 127 for c in name))

        def scan(cache, guard):
            assert cache.is_dir() and not cache.is_symlink()
            files, directories, total = {}, {}, 0
            for kind in ('ac', 'cas'):
                base = cache / kind
                if not base.exists():
                    continue
                assert base.is_dir() and not base.is_symlink(), 'cache roots must be actual directories'
                for current, dirs, names in os.walk(base, followlinks=False):
                    guard()
                    current = type(cache)(current)
                    info = current.lstat()
                    assert stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode)
                    directories[str(current.relative_to(cache))] = fingerprint(info)
                    dirs.sort()
                    names.sort()
                    for name in dirs:
                        child = current / name
                        child_info = child.lstat()
                        assert stat.S_ISDIR(child_info.st_mode) and not stat.S_ISLNK(child_info.st_mode), 'no linked cache directory'
                    for name in names:
                        path = current / name
                        info = path.lstat()
                        relative = path.relative_to(cache).as_posix()
                        assert safe_name(relative), 'noncanonical cache member name'
                        assert stat.S_ISREG(info.st_mode) and not stat.S_ISLNK(info.st_mode), 'only regular files are transferable'
                        assert relative not in files
                        files[relative] = fingerprint(info)
                        total += info.st_size
                        assert len(files) <= MAX_CACHE_FILES, 'cache member count exceeds the explicit packaging bound'
                        assert total <= MAX_CACHE_INPUT_BYTES, 'cache input bytes exceed the explicit packaging bound'
            assert files, 'empty cache is not transferable compiled work'
            assert any(n.startswith('ac/') for n in files) and any(n.startswith('cas/') for n in files), 'both action records and content blobs are required'
            return files, directories, total

        class LimitedWriter:
            def __init__(self, stream, directory, byte_limit, guard):
                self.stream, self.directory, self.byte_limit, self.guard = stream, directory, byte_limit, guard
                self.written, self.next_space_check = 0, 0

            def write(self, data):
                self.guard()
                assert self.written + len(data) <= self.byte_limit, 'compressed archive exceeds available-space/size bound'
                if self.written >= self.next_space_check:
                    assert shutil.disk_usage(self.directory).free >= DISK_RESERVE_BYTES + len(data), 'preserve disk reserve while packing'
                    self.next_space_check = self.written + 4 * 1024**2
                count = self.stream.write(data)
                assert count == len(data)
                self.written += count
                return count

            def flush(self):
                self.stream.flush()

            def tell(self):
                return self.written

        class HashingReader:
            def __init__(self, stream, guard):
                self.stream, self.guard, self.hasher, self.bytes = stream, guard, hashlib.sha256(), 0

            def read(self, size=-1):
                self.guard()
                assert size >= 0, 'unbounded file reads are not used by this packer'
                data = self.stream.read(size)
                self.hasher.update(data)
                self.bytes += len(data)
                return data

        def main():
            p = paths()
            p['evidence'].mkdir(mode=0o700, exist_ok=True)
            record = {'schema': 'hepta-core-cache-pack-result-v2', 'result': 'FAIL',
                'archive_verified': False, 'native_admission': False, 'consumer_implemented': False,
                'limits': {'maximum_pack_seconds': PACK_MAX_SECONDS, 'maximum_regular_files': MAX_CACHE_FILES,
                           'maximum_input_bytes': MAX_CACHE_INPUT_BYTES, 'maximum_archive_bytes': MAX_ARCHIVE_BYTES,
                           'disk_reserve_bytes': DISK_RESERVE_BYTES, 'upload_reserve_seconds': TRANSFER_RESERVE_SECONDS}}
            partial = None
            alarm_enabled = False
            started = time.monotonic()
            try:
                build = read_json(p['evidence'] / 'build-result.json')
                shutdown = read_json(p['evidence'] / 'shutdown-result.json')
                assert shutdown['result'] == 'PASS_SHUTDOWN' and shutdown['server_shutdown_confirmed'] is True
                assert shutdown['output_base'] == str(p['output_base']) and shutdown['fresh_disk_cache'] == str(p['cache'])
                assert build['producer']['harness_commit'] == os.environ['GITHUB_SHA']
                assert build['producer']['run_id'] == os.environ['GITHUB_RUN_ID']
                assert build['producer']['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT'] == '1'
                assert build['producer']['source']['tested_commit'] == os.environ['EXPECTED_HEAD']
                assert build['producer']['source']['tested_tree'] == os.environ['EXPECTED_TREE']
                assert build.get('test_execution_observed') is False
                assert (p['root'] / 'source-after.txt').read_text().splitlines() == [os.environ['EXPECTED_HEAD'], os.environ['EXPECTED_TREE']]
                assert (p['root'] / 'source-after-status.txt').read_bytes() == b''
                assert os.environ['SMALL_EVIDENCE_OUTCOME'] == 'success', 'small original evidence must already be uploaded'
                evidence_id = os.environ['SMALL_EVIDENCE_ARTIFACT_ID']
                evidence_digest = os.environ['SMALL_EVIDENCE_ARTIFACT_DIGEST']
                assert re.fullmatch(r'[1-9][0-9]*', evidence_id)
                assert re.fullmatch(r'[0-9a-f]{64}', evidence_digest)
                record['small_evidence_artifact'] = {'id': evidence_id, 'sha256': evidence_digest, 'upload_reported_success': True}
                budget = min(PACK_MAX_SECONDS, int(seconds_left()) - TRANSFER_RESERVE_SECONDS)
                assert budget > 0, 'no time remains for bounded packing with upload reserve'
                record['actual_pack_budget_seconds'] = budget
                deadline = time.monotonic() + budget
                def guard():
                    if time.monotonic() >= deadline:
                        raise TimeoutError('pack/readback phase exhausted its reserved budget')
                def alarm(signum, frame):
                    raise TimeoutError('hard pack/readback alarm expired')
                signal.signal(signal.SIGALRM, alarm)
                signal.setitimer(signal.ITIMER_REAL, budget)
                alarm_enabled = True

                p['transfer'].mkdir(mode=0o700)
                initial_free = shutil.disk_usage(p['transfer']).free
                assert initial_free > DISK_RESERVE_BYTES + 1024**2, 'insufficient disk reserve for packaging'
                byte_limit = min(MAX_ARCHIVE_BYTES, initial_free - DISK_RESERVE_BYTES)
                record.update({'disk_free_before': initial_free, 'effective_archive_byte_limit': byte_limit})
                before_files, before_dirs, total_bytes = scan(p['cache'], guard)
                partial = p['transfer'] / 'core-action-cache.tar.gz.partial'
                rows = []
                with partial.open('xb') as raw:
                    bounded = LimitedWriter(raw, p['transfer'], byte_limit, guard)
                    with gzip.GzipFile(filename='', mode='wb', fileobj=bounded, compresslevel=1, mtime=0) as gz:
                        with tarfile.open(fileobj=gz, mode='w|', format=tarfile.PAX_FORMAT) as tar:
                            for name in sorted(before_files):
                                guard()
                                source = p['cache'] / name
                                fd = os.open(source, os.O_RDONLY | os.O_NOFOLLOW)
                                with os.fdopen(fd, 'rb') as stream:
                                    original = os.fstat(stream.fileno())
                                    assert stat.S_ISREG(original.st_mode) and fingerprint(original) == before_files[name]
                                    member = tarfile.TarInfo(name)
                                    member.size = original.st_size
                                    member.type = tarfile.REGTYPE
                                    member.mode, member.uid, member.gid, member.mtime = 0o600, 0, 0, 0
                                    member.uname = member.gname = ''
                                    reader = HashingReader(stream, guard)
                                    tar.addfile(member, reader)
                                    assert reader.bytes == original.st_size
                                    assert fingerprint(os.fstat(stream.fileno())) == before_files[name]
                                    assert fingerprint(source.lstat()) == before_files[name]
                                rows.append({'path': name, 'bytes': original.st_size,
                                             'sha256': reader.hasher.hexdigest(), 'archive_mode': '0600'})
                after_files, after_dirs, after_total = scan(p['cache'], guard)
                assert (after_files, after_dirs, after_total) == (before_files, before_dirs, total_bytes), 'stopped cache changed during snapshot'

                expected = {row['path']: row for row in rows}
                observed = set()
                with partial.open('rb') as raw:
                    with gzip.GzipFile(fileobj=raw, mode='rb') as gz:
                        with tarfile.open(fileobj=gz, mode='r|') as tar:
                            for member in tar:
                                guard()
                                assert member.isreg() and member.type in (tarfile.REGTYPE, tarfile.AREGTYPE)
                                assert safe_name(member.name) and member.name in expected and member.name not in observed
                                row = expected[member.name]
                                assert member.size == row['bytes'] and member.mode == 0o600
                                assert member.uid == member.gid == member.mtime == 0
                                assert member.uname == member.gname == '' and not member.linkname
                                h = hashlib.sha256()
                                count = 0
                                stream = tar.extractfile(member)
                                assert stream is not None
                                with stream:
                                    while True:
                                        guard()
                                        chunk = stream.read(1024**2)
                                        if not chunk:
                                            break
                                        count += len(chunk)
                                        h.update(chunk)
                                assert count == row['bytes'] and h.hexdigest() == row['sha256']
                                observed.add(member.name)
                        # Drain gzip through its trailer, so CRC/size verification is not skipped at tar EOF.
                        while gz.read(1024**2):
                            guard()
                assert observed == set(expected)
                guard()
                archive_sha = sha256_file(partial)
                archive_bytes = partial.stat().st_size
                assert archive_bytes <= byte_limit
                complete = build['build_complete'] is True and build['result'] == 'PASS_BUILD_ONLY'
                cache_kind = 'complete_target_build' if complete else 'partial_build_only'
                bindings = {
                    'producer': build['producer'], 'build_result': file_identity(p['evidence'] / 'build-result.json'),
                    'shutdown': file_identity(p['evidence'] / 'shutdown-result.json'),
                    'source_after': file_identity(p['root'] / 'source-after.txt'),
                    'source_after_status': file_identity(p['root'] / 'source-after-status.txt'),
                    'small_evidence_artifact': record['small_evidence_artifact'],
                    'build_complete': build['build_complete'], 'producer_build_result': build['result'],
                    'cache_kind': cache_kind, 'native_admission': False,
                    'configured_target': build.get('target_completion', []),
                    'bazel_configurations': build.get('configurations', []),
                    'actual_bazel_options': build.get('parsed_options', []),
                    'actual_bazel_started': build.get('build_starts', []),
                }
                manifest = {'schema': 'hepta-core-ac-cas-manifest-v2', 'bindings': bindings,
                    'file_count': len(rows), 'input_bytes': total_bytes,
                    'ac_file_count': sum(r['path'].startswith('ac/') for r in rows),
                    'cas_file_count': sum(r['path'].startswith('cas/') for r in rows),
                    'only_regular_files': True, 'symlinks_and_devices_rejected': True,
                    'cache_set_and_file_stat_identity_unchanged': True, 'files': rows}
                manifest_path = p['transfer'] / 'core-cache-manifest.json'
                write_json(manifest_path, manifest)
                final_archive = p['transfer'] / 'core-action-cache.tar.gz'
                assert not final_archive.exists()
                os.link(partial, final_archive)  # create-only publication of this job's verified bytes
                partial.unlink()
                partial = None
                record.update({'result': 'VERIFIED_COMPLETE_BUILD_CACHE_BYTES' if complete else 'VERIFIED_PARTIAL_COMPILE_DATA', 'archive_verified': True,
                    'cache_kind': cache_kind, 'build_complete': build['build_complete'],
                    'producer_build_result': build['result'], 'file_count': len(rows), 'input_bytes': total_bytes,
                    'archive': {'file': final_archive.name, 'bytes': archive_bytes, 'sha256': archive_sha},
                    'manifest': file_identity(manifest_path), 'all_members_rehashed': True,
                    'gzip_trailer_validated': True,
                    'native_admission': False,
                    'consumer_requirement': 'Data only. Independently bind producer/run/source/tree/lock/configuration, download and verify archive plus every regular member and manifest before Bazel decides reuse by action key. Partial data never qualifies a complete Core build or native execution.'})
                write_json(p['transfer'] / 'cache-pack.json', record)
                output('archive_verified', 'true')
                output('cache_kind', cache_kind)
            except Exception as error:
                record['error'] = type(error).__name__ + ': ' + str(error)
                output('archive_verified', 'false')
            finally:
                if alarm_enabled:
                    signal.setitimer(signal.ITIMER_REAL, 0)
                if partial is not None and partial.exists():
                    partial.unlink()  # only this invocation's incomplete transfer file
                record['elapsed_seconds'] = time.monotonic() - started
                record['disk_free_after'] = shutil.disk_usage(p['root']).free
                write_json(p['evidence'] / 'pack-result.json', record)
                print(json.dumps({k: record.get(k) for k in ('result', 'archive_verified', 'cache_kind', 'build_complete', 'file_count', 'input_bytes', 'archive', 'native_admission', 'error')}))
            return 0 if record['archive_verified'] else 1

        if __name__ == '__main__':
            sys.exit(main())
