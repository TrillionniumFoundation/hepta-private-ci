      shell: bash
      timeout-minutes: 1
      env:
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        SHUTDOWN_OUTCOME: ${{ steps.shutdown.outcome }}
        SOURCE_AFTER_OUTCOME: ${{ steps.source_after.outcome }}
        PACK_OUTCOME: ${{ steps.pack.outcome }}
        CACHE_UPLOAD_OUTCOME: ${{ steps.cache_upload.outcome }}
        CACHE_ARTIFACT_ID: ${{ steps.cache_upload.outputs.artifact-id }}
        CACHE_ARTIFACT_DIGEST: ${{ steps.cache_upload.outputs.artifact-digest }}
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/core_transfer_receipt.py"
    - name: Retain packaging and transfer receipts after every outcome
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      timeout-minutes: 1
      with:
        name: core-build-evidence-after-pack-${{ matrix.platform }}-${{ env.EXPECTED_HEAD }}
        path: ${{ runner.temp }}/normal-bazel/
        if-no-files-found: error
        retention-days: 30
