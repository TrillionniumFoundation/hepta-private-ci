                'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                'harness_commit': os.environ['GITHUB_SHA'], 'source_head': os.environ['EXPECTED_HEAD'],
                'source_tree': os.environ['EXPECTED_TREE'], 'platform': os.environ['BAZEL_PLATFORM'],
                'outcomes': {key: os.environ[key] for key in ('BUILD_OUTCOME', 'SHUTDOWN_OUTCOME', 'SOURCE_AFTER_OUTCOME', 'PACK_OUTCOME', 'CACHE_UPLOAD_OUTCOME')},
                'cache_artifact_id': os.environ['CACHE_ARTIFACT_ID'],
