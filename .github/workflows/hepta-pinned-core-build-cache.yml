                assert re.fullmatch(r'[0-9a-f]{64}', os.environ['CACHE_ARTIFACT_DIGEST'])
                record['result'] = 'UPLOADED_CACHE_DATA_ONLY'
            except Exception as error:
                record['error'] = type(error).__name__ + ': ' + str(error)
            finally:
                write_json(p['root'] / 'cache-upload-outcome.json', record)
                print(json.dumps(record))
            return 0 if record['result'] == 'UPLOADED_CACHE_DATA_ONLY' else 1

        if __name__ == '__main__':
