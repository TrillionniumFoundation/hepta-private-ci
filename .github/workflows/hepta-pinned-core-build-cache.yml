                pack_path = p['evidence'] / 'pack-result.json'
                pack = read_json(pack_path)
                record['pack_receipt_sha256'] = hashlib.sha256(pack_path.read_bytes()).hexdigest()
                record['cache_kind'] = pack.get('cache_kind')
                record['build_complete'] = pack.get('build_complete', False)
                record['archive'] = pack.get('archive')
                record['manifest'] = pack.get('manifest')
                assert pack['archive_verified'] is True and os.environ['PACK_OUTCOME'] == 'success'
                assert os.environ['SHUTDOWN_OUTCOME'] == os.environ['SOURCE_AFTER_OUTCOME'] == 'success'
                assert os.environ['CACHE_UPLOAD_OUTCOME'] == 'success'
