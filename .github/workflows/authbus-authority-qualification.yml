name: AuthBus authority qualification

on:
  pull_request:
    paths:
      - codex-rs/hepta-authbus/**
      - codex-rs/hepta-authbus-p1-3-qualification/**
      - codex-rs/hepta-evidence/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-bao-adapter/**
      - docs/modules/auth.authbus/**
      - docs/lane-a-foundation/auth.authbus/**
      - scripts/check-authbus-closed-world.py
      - scripts/authbus-exact-head-evidence.py
      - .github/workflows/authbus-authority-qualification.yml
  push:
    branches: [main]
    paths:
      - codex-rs/hepta-authbus/**
      - codex-rs/hepta-authbus-p1-3-qualification/**
      - codex-rs/hepta-evidence/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-bao-adapter/**
      - docs/modules/auth.authbus/**
      - docs/lane-a-foundation/auth.authbus/**
      - scripts/check-authbus-closed-world.py
      - scripts/authbus-exact-head-evidence.py
      - .github/workflows/authbus-authority-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authbus-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  source-head:
    name: AuthBus exact source head
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$EXPECTED_HEAD^{tree}")"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Closed-world API inventory
        run: python3 scripts/check-authbus-closed-world.py --check

      - name: Formatting
        run: cargo fmt --all --manifest-path codex-rs/Cargo.toml -- --check

      - name: Focused authority and product execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authbus-evidence"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/authbus.log"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus-p1-3-qualification --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/qualification.log"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-evidence --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/evidence.log"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --test kernel_evidence_product 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/agentd.log"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/bao.log"

      - name: Exact-head workspace regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --workspace --all-targets --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/workspace.log"

      - name: Strict lint
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-authbus \
            -p codex-hepta-authbus-p1-3-qualification \
            -p codex-hepta-evidence \
            -p codex-hepta-agentd \
            -p codex-hepta-bao-adapter \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/clippy.log"

      - name: Exact-head evidence receipt
        run: |
          python3 scripts/authbus-exact-head-evidence.py \
            --output "$RUNNER_TEMP/authbus-evidence/receipt.json" \
            --test-log "$RUNNER_TEMP/authbus-evidence/authbus.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/qualification.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/evidence.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/agentd.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/bao.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/workspace.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/clippy.log"

      - name: Clean tracked tree
        run: git diff --exit-code && git diff --cached --exit-code

      - uses: actions/upload-artifact@v4
        with:
          name: authbus-source-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/authbus-evidence
          if-no-files-found: error
          retention-days: 30

  synthetic-merge:
    if: github.event_name == 'pull_request'
    name: AuthBus synthetic merge
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Verify synthetic-merge identity
        shell: bash
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          generated_tree="$(git merge-tree --write-tree "$EXPECTED_BASE" "$EXPECTED_HEAD" | sed -n '1p')"
          test -n "$generated_tree"
          test "$(git rev-parse HEAD^{tree})" = "$generated_tree"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Closed-world API inventory
        run: python3 scripts/check-authbus-closed-world.py --check

      - name: Formatting
        run: cargo fmt --all --manifest-path codex-rs/Cargo.toml -- --check

      - name: Merge-candidate focused execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authbus-evidence"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/authbus.log"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus-p1-3-qualification --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/qualification.log"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-evidence --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/evidence.log"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --test kernel_evidence_product 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/agentd.log"
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/bao.log"

      - name: Merge-candidate workspace regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --workspace --all-targets --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/workspace.log"

      - name: Merge-candidate strict lint
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-authbus \
            -p codex-hepta-authbus-p1-3-qualification \
            -p codex-hepta-evidence \
            -p codex-hepta-agentd \
            -p codex-hepta-bao-adapter \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/authbus-evidence/clippy.log"

      - name: Merge-candidate evidence receipt
        run: |
          python3 scripts/authbus-exact-head-evidence.py \
            --output "$RUNNER_TEMP/authbus-evidence/receipt.json" \
            --test-log "$RUNNER_TEMP/authbus-evidence/authbus.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/qualification.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/evidence.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/agentd.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/bao.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/workspace.log" \
            --test-log "$RUNNER_TEMP/authbus-evidence/clippy.log"

      - name: Clean tracked tree
        run: git diff --exit-code && git diff --cached --exit-code

      - uses: actions/upload-artifact@v4
        with:
          name: authbus-merge-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/authbus-evidence
          if-no-files-found: error
          retention-days: 30
