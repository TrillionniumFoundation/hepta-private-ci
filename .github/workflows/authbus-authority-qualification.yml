name: AuthBus authority qualification

on:
  pull_request:
    paths:
      - codex-rs/hepta-authbus/**
      - codex-rs/hepta-authbus-p1-3-qualification/**
      - codex-rs/hepta-evidence/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-bao-adapter/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - docs/modules/auth.authbus/**
      - scripts/*authbus*.py
      - .github/workflows/authbus-authority-qualification.yml
  push:
    branches: [main, codex/authbus-concurrency-closure-20260927]
    paths:
      - codex-rs/hepta-authbus/**
      - codex-rs/hepta-authbus-p1-3-qualification/**
      - codex-rs/hepta-evidence/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-bao-adapter/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - docs/modules/auth.authbus/**
      - scripts/*authbus*.py
      - .github/workflows/authbus-authority-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authbus-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  portable-contract:
    name: AuthBus receipt contract (not Rust qualification)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exercise failure and stale-evidence cases
        run: python3 scripts/test-authbus-exact-head-evidence.py
      - name: Closed-world API inventory
        run: python3 scripts/check-authbus-closed-world.py --check

  qualification:
    name: AuthBus ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [source-head, synthetic-merge]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fix source and base identities before any validation
        id: identity
        shell: bash
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE: ${{ github.event.before || '' }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authbus-evidence"
          SOURCE=$(git rev-parse "$SOURCE^{commit}")
          if test -n "$EVENT_BASE"; then
            BASE=$(git rev-parse "$EVENT_BASE^{commit}")
          elif test "$GITHUB_REF" = refs/heads/main && test -n "$BEFORE" && test "$BEFORE" != 0000000000000000000000000000000000000000; then
            BASE=$(git rev-parse "$BEFORE^{commit}")
          else
            BASE=$(git rev-parse refs/remotes/origin/main)
            if test "$BASE" = "$SOURCE"; then BASE=$(git rev-parse "$SOURCE^"); fi
          fi
          printf 'source=%s\nbase=%s\nmode=%s\n' "$SOURCE" "$BASE" "$MODE" | tee "$RUNNER_TEMP/authbus-evidence/preparation.txt"
          if test "$MODE" = synthetic-merge; then
            git config user.name 'AuthBus qualification'
            git config user.email 'authbus-qualification@invalid.local'
            git checkout --detach "$BASE"
            git -c core.hooksPath=/dev/null merge --no-ff --no-commit "$SOURCE"
            TREE=$(git write-tree)
            MERGE=$(printf 'AuthBus fixed-base synthetic qualification\n' | git commit-tree "$TREE" -p "$BASE" -p "$SOURCE")
            git reset --hard "$MERGE"
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD | tee -a "$RUNNER_TEMP/authbus-evidence/preparation.txt"
      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: authbus-dependencies-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Execute all gates and record actual outcomes
        shell: bash
        env:
          SOURCE: ${{ steps.identity.outputs.source }}
          BASE: ${{ steps.identity.outputs.base }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 scripts/authbus-exact-head-evidence.py \
            --output "$RUNNER_TEMP/authbus-evidence/receipt.json" \
            --mode "$MODE" --source-head "$SOURCE" --base-sha "$BASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authbus-${{ matrix.mode }}-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authbus-evidence
          if-no-files-found: error
          retention-days: 30
