name: AuthBus authority qualification

on:
  pull_request:
    paths:
      - .github/workflows/authbus-authority-qualification.yml
      - scripts/migrate-authbus-sealed-callers.py

permissions:
  contents: write

concurrency:
  group: authbus-sealed-caller-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate-sealed-callers:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'auth-authbus-hardening-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Apply source migration
        run: |
          set -euo pipefail
          python3 scripts/migrate-authbus-sealed-callers.py
          cargo fmt --all --manifest-path codex-rs/Cargo.toml
          python3 scripts/check-authbus-closed-world.py --check

      - name: Compile affected products
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets --no-run
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-evidence --all-targets --no-run
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --test kernel_evidence_product --no-run
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-bao-adapter --all-targets --no-run

      - name: Commit migration and restore qualification workflow
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/authbus-authority-qualification.yml > .github/workflows/authbus-authority-qualification.yml
          rm -f .github/workflows/authbus-trust-boundary-migrate.yml
          rm -f scripts/migrate-authbus-sealed-callers.py
          git config user.name "hepta-authbus-remediation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(authbus): migrate callers to sealed authority APIs"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
