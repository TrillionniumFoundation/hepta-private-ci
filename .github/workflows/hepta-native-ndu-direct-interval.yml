name: Native NDU direct interval global cost certificate
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-ndu/research/native_stem_abcd/direct_interval/**'
      - '.github/workflows/hepta-native-ndu-direct-interval.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r20-interval-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Pinned numerical environment
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Exact mathematical proof, 80-case replication and adversarial replay
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/codex-rs/hepta-ndu/research/native_stem_abcd"
          SRC="$BASE/direct_interval"
          OUT="$RUNNER_TEMP/ndu-r20"
          mkdir -p "$OUT/evidence"
          git rev-parse HEAD > "$OUT/HEAD.txt"
          python -m pip freeze > "$OUT/ENVIRONMENT.txt"
          (cd "$SRC" && python -m unittest -v test_math) 2>&1 | tee "$OUT/evidence/MATH_TESTS.log"
          (cd "$BASE/nonquotient_bnb" && python -m unittest -v test_math) 2>&1 | tee "$OUT/evidence/R19_TESTS.log"
          (cd "$BASE/asymmetric_2d" && python -m unittest -v test_math) 2>&1 | tee "$OUT/evidence/R18_TESTS.log"
          python "$SRC/global_interval.py" --out "$OUT/evidence/CERT_NEW.json" --frontier "$OUT/evidence/FRONTIER_NEW.jsonl" --a 1.54696889 --b .44887401 --threshold 1/100 --cap 50000
          python "$SRC/global_interval.py" --out "$OUT/evidence/CERT_CONTROL.json" --frontier "$OUT/evidence/FRONTIER_CONTROL.jsonl" --a 1.64044199 --b .42331392 --control --threshold 1/100 --cap 50000
          python "$SRC/run.py" sweep --out "$OUT/runs" 2>&1 | tee "$OUT/evidence/SWEEP.log"
          python "$SRC/audit/verify.py" --source "$SRC" --runs "$OUT/runs" --evidence "$OUT/evidence" --out "$OUT/verified" 2>&1 | tee "$OUT/evidence/AUDIT.log"
          NDU_R20_RUNS="$OUT/runs" NDU_R20_EVIDENCE="$OUT/evidence" NDU_R20_SOURCE="$SRC" python -O -m unittest discover -v -s "$SRC/audit" -p test_tamper.py 2>&1 | tee "$OUT/evidence/TAMPER.log"
      - name: Preserve failed cases, proof frontier, full traces and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ndu-direct-interval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndu-r20
          if-no-files-found: error
          retention-days: 14
