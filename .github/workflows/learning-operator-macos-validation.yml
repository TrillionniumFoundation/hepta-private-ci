name: Learning operator macOS executable validation

on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths:
      - '.github/workflows/learning-operator-macos-validation.yml'
      - 'codex-rs/hepta-bellman-operator/**'
      - 'codex-rs/hepta-learning-ledger/**'
      - 'codex-rs/hepta-intelligence-eval/**'
      - 'codex-rs/hepta-agentd/**'
      - 'docs/modules/learning.operator/**'
      - 'qualification/lane-e/**'
      - 'scripts/hepta-lane-e-closure.py'
      - 'scripts/hepta-implementation-maps.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-operator-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Execute every gate independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/learning-operator-macos"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform
          import re
          import subprocess
          import sys
          import time

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "learning-operator-macos"
          repo = pathlib.Path(".")
          rust = pathlib.Path("codex-rs")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          if sha != os.environ["SOURCE_SHA"]:
              raise SystemExit("checkout/source SHA mismatch")

          commands = [
              ("closure-self-test", ["python3", "scripts/hepta-lane-e-closure.py", "self-test"], None, repo, 300),
              ("closure-verify", ["python3", "scripts/hepta-lane-e-closure.py", "verify"], None, repo, 300),
              (
                  "implementation-maps",
                  [
                      "python3", "scripts/hepta-implementation-maps.py", "verify",
                      "--expected-sha", sha,
                      "--expected-tree", tree,
                  ],
                  None,
                  repo,
                  300,
              ),
              (
                  "fmt",
                  [
                      "cargo", "fmt",
                      "-p", "codex-hepta-bellman-operator",
                      "-p", "codex-hepta-learning-ledger",
                      "-p", "codex-hepta-intelligence-eval",
                      "-p", "codex-hepta-agentd",
                      "--", "--check",
                  ],
                  None,
                  rust,
                  600,
              ),
              (
                  "clippy-learning-core",
                  [
                      "cargo", "clippy", "--locked", "--no-deps",
                      "-p", "codex-hepta-bellman-operator",
                      "-p", "codex-hepta-learning-ledger",
                      "-p", "codex-hepta-intelligence-eval",
                      "--all-targets", "--", "-D", "warnings",
                  ],
                  None,
                  rust,
                  1800,
              ),
              (
                  "operator-eval-tests",
                  [
                      "cargo", "test", "--locked",
                      "-p", "codex-hepta-bellman-operator",
                      "-p", "codex-hepta-intelligence-eval",
                  ],
                  r"test result: ok\.",
                  rust,
                  2400,
              ),
              (
                  "agentd-evaluated-consumer",
                  [
                      "cargo", "test", "--locked",
                      "-p", "codex-hepta-agentd", "--lib",
                      "cognitive_ranker::evaluated_tests", "--", "--nocapture",
                  ],
                  r"test result: ok\. [1-9][0-9]* passed; 0 failed",
                  rust,
                  1800,
              ),
              (
                  "owner-loop-recovery",
                  [
                      "cargo", "test", "--locked",
                      "-p", "codex-hepta-agentd",
                      "--test", "terminal_cell_owner", "--", "--nocapture",
                  ],
                  r"test result: ok\.",
                  rust,
                  1800,
              ),
              (
                  "operator-full-path-profile",
                  [
                      "cargo", "test", "--locked",
                      "-p", "codex-hepta-bellman-operator",
                      "full_v3_qualification_path_profile",
                      "--", "--ignored", "--nocapture",
                  ],
                  r"LEARNING_OPERATOR_FULL_PATH_PROFILE=",
                  rust,
                  1800,
              ),
          ]

          gates = []
          for gate_id, command, required_pattern, cwd, timeout in commands:
              started = time.monotonic()
              try:
                  result = subprocess.run(
                      command,
                      cwd=cwd,
                      capture_output=True,
                      text=True,
                      timeout=timeout,
                      check=False,
                  )
                  output = result.stdout + result.stderr
                  matched = required_pattern is None or re.search(required_pattern, output)
                  state = "pass" if result.returncode == 0 and matched else "fail"
                  exit_code = result.returncode
                  stdout = result.stdout
                  stderr = result.stderr
              except subprocess.TimeoutExpired as error:
                  state = "timeout"
                  exit_code = None
                  stdout = error.stdout or ""
                  stderr = error.stderr or ""
              (root / f"{gate_id}.stdout.log").write_text(stdout)
              (root / f"{gate_id}.stderr.log").write_text(stderr)
              print(f"[{state}] {' '.join(command)}", flush=True)
              print(stdout, flush=True)
              print(stderr, file=sys.stderr, flush=True)
              gates.append(
                  {
                      "id": gate_id,
                      "command": command,
                      "state": state,
                      "exitCode": exit_code,
                      "durationMs": round((time.monotonic() - started) * 1000),
                      "requiredPattern": required_pattern,
                      "stdout": f"{gate_id}.stdout.log",
                      "stderr": f"{gate_id}.stderr.log",
                  }
              )

          status = {
              "schema": "hepta.learning-operator-gate-status.v1",
              "candidate": {"sha": sha, "tree": tree},
              "environment": {
                  "runnerOs": platform.platform(),
                  "python": sys.version,
                  "rustc": subprocess.check_output(["rustc", "--version", "--verbose"], text=True),
              },
              "gates": gates,
              "overall": "pass" if all(gate["state"] == "pass" for gate in gates) else "fail",
              "externalAcceptanceIncluded": False,
          }
          (root / "status.json").write_text(json.dumps(status, indent=2, sort_keys=True) + "\n")
          raise SystemExit(status["overall"] != "pass")
          PY
      - name: Upload macOS execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-operator-macos-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/learning-operator-macos/
          if-no-files-found: error
          retention-days: 14
