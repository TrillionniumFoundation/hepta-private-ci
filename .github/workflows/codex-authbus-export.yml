name: Codex AuthBus source export

on:
  push:
    branches:
      - codex/authbus-production-hardening-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Package exact source tree
        shell: bash
        run: tar --exclude=.git -czf /tmp/hepta-private-ci-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codex-authbus-source-${{ github.sha }}
          path: /tmp/hepta-private-ci-source.tar.gz
          retention-days: 1
          if-no-files-found: error
