name: Joint feasibility offline source controls
"on":
  pull_request:
    paths:
      - "qualification/weight_joint_feasibility_20261121/**"
      - ".github/workflows/weight-joint-feasibility.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline_controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: qualification/weight_joint_feasibility_20261121
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned numerical dependencies
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/joint-feasibility-venv"
          "$RUNNER_TEMP/joint-feasibility-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt
      - name: Run 12 offline synthetic controls
        env:
          HEPTA_WSP_INPUT_ROOT: ${{ runner.temp }}/joint-feasibility-no-private-inputs
          HEPTA_WSP_PREVIOUS_ROOT: ${{ runner.temp }}/joint-feasibility-no-private-previous
        run: '"$RUNNER_TEMP/joint-feasibility-venv/bin/python" -m unittest -v test_synthetic_controls.py'
