name: Hepta V18 original Reader causal prompt diagnostic (DENY_ALL)
on:
  push:
    branches: [research/stem-v18-original-reader-prompt-20261016]
    paths:
      - 'research/hepta_v18_reader/**'
      - '.github/workflows/hepta-v18-original-reader-prompt.yml'
  pull_request:
    paths:
      - 'research/hepta_v18_reader/**'
      - '.github/workflows/hepta-v18-original-reader-prompt.yml'
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: research/hepta_v17_reader:research/hepta_v18_reader
concurrency:
  group: hepta-v18-original-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-adversarial-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Source-only contracts, normal and optimized; never import pretrained dependencies
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          D=research/hepta_v18_reader
          python -S -m unittest discover -s "$D" -p 'test_v18_prompt_trial.py' -v
          python -O -S -m unittest discover -s "$D" -p 'test_v18_prompt_trial.py' -v
          python -m compileall -q "$D"
          python -S - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/hepta_v18_reader/V18_ORIGINAL_READER_PROMPT_OBSERVATION_20261016.json')
          r=json.loads(p.read_text())
          assert r['authority']=='DENY_ALL' and r['decision']=='HOLD_NO_GO'
          assert r['original_cases']==30 and r['source_roots']==10
          assert r['genuinely_new_original_unique_requests']==90
          assert r['genuinely_new_original_model_forward_calls']==1773
          assert r['no_stronger_Qwen_reference_executed'] is True
          assert r['production_authorized'] is False
          assert all(x['literal_full_equal']==0 for x in r['arms'])
          assert all(x['cases']==30 and x['missing_publisher_answer']==8 for x in r['arms'])
          PY
  original-135m-private-physical-replay:
    # Source-first physical execution, no raw source/weights/answers in Git or uploaded artifacts.
    if: github.event_name == 'push'
    needs: source-and-adversarial-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install actual Torch model dependency, pinned to prior authentic original Reader runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu'
          python -m pip install --no-cache-dir 'safetensors==0.7.0' 'regex==2026.5.9'
      - name: Recover SHA-pinned original archived model and LoCoMo, reject all substitute bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 25 --max-time 1200 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip' \
            -o "$RUNNER_TEMP/v18-original.zip"
          echo '07b357cbb3362f4afa4dc1872ab7e28e8a46daaf338f2636fed8d40fbcee76af  '"$RUNNER_TEMP/v18-original.zip" | sha256sum -c -
          python - <<'PY'
          import os, zipfile, tarfile, pathlib, shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'original'
          root.mkdir()
          required={
            'memory-inputs/reader/model.safetensors':('reader/model.safetensors',269060552),
            'memory-inputs/reader/tokenizer.json':('reader/tokenizer.json',2104556),
            'memory-inputs/reader/config.json':('reader/config.json',861),
            'memory-inputs/locomo.json':('locomo.json',2805274),
          }
          seen=set()
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'v18-original.zip') as z:
            if z.namelist()!=['memory-inputs.tar.gz']:
              raise ValueError('unexpected original archive ZIP members')
            with z.open('memory-inputs.tar.gz') as raw:
              with tarfile.open(fileobj=raw,mode='r|gz') as tf:
                for member in tf:
                  if member.name not in required:continue
                  dst,size=required[member.name]
                  if member.name in seen or not member.isfile() or member.size!=size:
                    raise ValueError('original archive member modified/duplicated')
                  seen.add(member.name)
                  f=root/dst;f.parent.mkdir(parents=True,exist_ok=True)
                  with tf.extractfile(member) as src,f.open('xb') as out:
                    shutil.copyfileobj(src,out,1024*1024)
          if seen!=set(required):raise ValueError('missing original source or pretrained weight')
          PY
      - name: Physical original 135M V17 frozen controls + V18 90 additional original Reader inputs
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          D=research/hepta_v18_reader
          P=research/hepta_v17_reader
          INPUT="$RUNNER_TEMP/original"
          O="$RUNNER_TEMP/private-original-model"
          python "$P/source_first.py" prepare --source "$INPUT/locomo.json" --out "$O"
          python "$P/source_first.py" plan --public "$O/public.json" --owner "$O/owner.json" --out "$O/plan.json"
          python "$P/source_first.py" annotate --public "$O/public.json" --owner "$O/owner.json" --hidden "$O/hidden.json" --plan "$O/plan.json" --out "$O/annotation.json"
          python "$P/source_first.py" requests --public "$O/public.json" --owner "$O/owner.json" --plan "$O/plan.json" --annotation "$O/annotation.json" --out "$O/requests.json"
          python "$P/physical.py" --public "$O/public.json" --owner "$O/owner.json" --plan "$O/plan.json" --annotation "$O/annotation.json" --requests "$O/requests.json" --reader-dir "$INPUT/reader" --private-output "$O/physical.json"
          python "$D/v18_prompt_trial.py" plan --public "$O/public.json" --owner "$O/owner.json" --plan "$O/plan.json" --annotation "$O/annotation.json" --previous "$O/requests.json" --out "$O/proposal.json"
          python "$D/v18_prompt_trial.py" run --public "$O/public.json" --owner "$O/owner.json" --plan "$O/plan.json" --annotation "$O/annotation.json" --previous "$O/requests.json" --proposal "$O/proposal.json" --model-dir "$INPUT/reader" --out "$O/v18-physical.json"
          python "$D/v18_independent_review.py" \
            --original "$INPUT/locomo.json" --public "$O/public.json" --owner "$O/owner.json" \
            --hidden "$O/hidden.json" --plan "$O/plan.json" --annotation "$O/annotation.json" \
            --previous "$O/requests.json" --previous-physical "$O/physical.json" \
            --previous-journal "$O/physical.json.starts.jsonl" --proposal "$O/proposal.json" \
            --physical "$O/v18-physical.json" --journal "$O/v18-physical.json.starts.jsonl" \
            --reader-dir "$INPUT/reader" --out "$RUNNER_TEMP/v18-independent-sanitized.json"
          python "$D/v18_private_adversarial.py" \
            --scratch-dir "$RUNNER_TEMP" --reader-dir "$INPUT/reader" \
            --original "$INPUT/locomo.json" --v17-dir "$O" --v18-dir "$O" \
            --out "$RUNNER_TEMP/v18-adversarial-sanitized.json"
          python -S - "$RUNNER_TEMP/v18-independent-sanitized.json" "$RUNNER_TEMP/v18-adversarial-sanitized.json" <<'PY'
          import json,sys
          a,b=[json.load(open(p)) for p in sys.argv[1:]]
          assert a['decision']=='HOLD_NO_GO' and a['original_cases']==30
          assert a['genuinely_new_original_unique_requests']==90
          assert a['genuinely_new_original_model_forward_calls']>=90
          assert a['no_stronger_Qwen_reference_executed'] is True
          assert a['reported_strict_matches_not_independent_semantic_correctness'] is True
          assert b['rejected_all'] is True and b['mutation_count']==9
          assert b['production_authorized'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: v18-original-135m-sanitized-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v18-independent-sanitized.json
            ${{ runner.temp }}/v18-adversarial-sanitized.json
          if-no-files-found: error
          retention-days: 5
