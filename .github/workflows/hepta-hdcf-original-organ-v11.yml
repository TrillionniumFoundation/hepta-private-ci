name: hepta-hdcf-original-organ-v11

on:
  push:
    branches:
      - research/hdcf-original-organ-v11-20261017
    paths:
      - 'qualification/hdcf-research/organ_vision_text_v11.py'
      - 'qualification/hdcf-research/test_organ_vision_text_v11.py'
      - 'qualification/hdcf-research/ORIGINAL_ORGAN_ALIGNMENT_V11.md'
      - '.github/workflows/hepta-hdcf-original-organ-v11.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-hdcf-organ-v11-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-dino-granite-rank8-organ-blind-comparison:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact source and pinned bounded numerical runtime
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -f qualification/hdcf-research/original_beans_v9.py
          test -f qualification/hdcf-research/original_crossdomain_v10.py
          test -f qualification/hdcf-research/organ_vision_text_v11.py
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          python3 -m pip check
          python3 -m py_compile qualification/hdcf-research/organ_vision_text_v11.py qualification/hdcf-research/test_organ_vision_text_v11.py
      - name: Get original source and frozen image/text features before any blind labels
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          umask 077
          python3 original_beans_v9.py download --kind source --out "$RUNNER_TEMP/organ-v11-source.zip"
          python3 original_beans_v9.py download --kind features --out "$RUNNER_TEMP/organ-v11-features.zip"
      - name: Physically fit rank-8 Organ and equal-touch Heads on original TRAIN labels ONLY
        working-directory: qualification/hdcf-research
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          umask 077
          python3 organ_vision_text_v11.py fit \
            --source "$RUNNER_TEMP/organ-v11-source.zip" \
            --features "$RUNNER_TEMP/organ-v11-features.zip" \
            --out "$RUNNER_TEMP/private-organ-v11-sealed.json"
          test -s "$RUNNER_TEMP/private-organ-v11-sealed.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'private-organ-v11-sealed.json'
          d=json.loads(p.read_text())
          assert d['schema']=='hepta.hdcf.real-vision-text-organ-v11.sealed'
          assert d['manifest']['blind_labels_in_fit'] is False
          assert d['manifest']['original_model_new_forwards']==0
          assert not any('target' in row or 'label' in row for row in d['predictions'])
          assert len(d['predictions'])==24
          PY
      - name: Obtain original held targets and publisher Parquet AFTER sealed training
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          umask 077
          python3 original_beans_v9.py download --kind targets --out "$RUNNER_TEMP/organ-v11-targets.zip"
          python3 -m pip install --disable-pip-version-check huggingface-hub==0.36.0 pyarrow==20.0.0
          python3 -m pip check
          python3 - <<'PY'
          import hashlib,os,sys
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          sys.path.insert(0,'qualification/hdcf-research')
          import original_beans_v9 as v9
          for phase,original_sha in (('train',v9.TRAIN_SHA),('test',v9.TEST_SHA)):
              name=f'data/{phase}-00000-of-00001.parquet'
              path=Path(hf_hub_download(repo_type='dataset',repo_id='AI-Lab-Makerere/beans',
                                         filename=name,revision=v9.DATA_REV))
              with path.open('rb') as f: observed=hashlib.file_digest(f,'sha256').hexdigest()
              if observed!=original_sha: raise ValueError('publisher original parquet changed')
              target=Path(os.environ['RUNNER_TEMP'])/f'publisher-{phase}-v11.parquet'
              with target.open('xb') as out,path.open('rb') as inp:
                  for block in iter(lambda:inp.read(1024*1024),b''): out.write(block)
          PY
      - name: Reopen real publisher truth and run original adversarial tests with ZERO skips
        working-directory: qualification/hdcf-research
        env:
          HDCF_ORIGINAL_SOURCE_ZIP: ${{ runner.temp }}/organ-v11-source.zip
          HDCF_ORIGINAL_FEATURE_ZIP: ${{ runner.temp }}/organ-v11-features.zip
          HDCF_ORIGINAL_TARGET_ZIP: ${{ runner.temp }}/organ-v11-targets.zip
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import original_beans_v9 as v9
          from original_beans_v9 import PinnedZip, images_and_labels, _source_targets, verify_publisher_parquets
          source=Path(os.environ['HDCF_ORIGINAL_SOURCE_ZIP'])
          target=Path(os.environ['HDCF_ORIGINAL_TARGET_ZIP'])
          _,train,held,labels=_source_targets(source,target)
          base=Path(os.environ['RUNNER_TEMP'])
          verify_publisher_parquets(base/'publisher-train-v11.parquet',base/'publisher-test-v11.parquet',train,held,labels)
          print('ORIGINAL_PUBLISHER_TRAIN_TEST_BYTES_REVALIDATED')
          PY
          python3 -m unittest -v test_organ_vision_text_v11
          python3 -O -m unittest -v test_organ_vision_text_v11
      - name: Separate late-label reviewer, always scientific HOLD
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          umask 077
          python3 organ_vision_text_v11.py review \
            --sealed "$RUNNER_TEMP/private-organ-v11-sealed.json" \
            --source "$RUNNER_TEMP/organ-v11-source.zip" \
            --features "$RUNNER_TEMP/organ-v11-features.zip" \
            --targets "$RUNNER_TEMP/organ-v11-targets.zip" \
            --out "$RUNNER_TEMP/sanitized-organ-v11-review.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'sanitized-organ-v11-review.json').read_text())
          assert d['disposition']=='HOLD_NO_GO_DENY_ALL'
          assert d['original_fit']==36 and d['original_held']==24
          assert d['arm_scores']['original_frozen_visual_prototype']['correct']==20
          assert d['general_multimodal_capability_verified'] is False
          assert d['organ_benefit_verified'] is False and d['cell_split_benefit_verified'] is False
          assert d['production_authorized'] is False and d['stem_selected'] is False
          print('ORIGINAL_DINO_GRANITE_ORGAN_REAL_SGD_REPLAYED_HOLD_NO_GO')
          print({k:v['correct'] for k,v in sorted(d['arm_scores'].items())})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: hepta-original-dino-granite-organ-v11-sanitized-no-go
          path: ${{ runner.temp }}/sanitized-organ-v11-review.json
          if-no-files-found: error
          retention-days: 7
