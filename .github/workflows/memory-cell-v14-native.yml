name: Memory cell V14 native isolation and versioned fallback

on:
  push:
    branches:
      - research/memory-cell-v14-20261031
    # Research/evidence-only publication does not rerun this native suite.
    # Carry results forward only after comparing all native/build inputs with
    # the exact tested source commit recorded in the uploaded receipt.
    paths:
      - 'codex-rs/**'
      - 'qualification/memory-cell-v14/native/**'
      - '.github/workflows/memory-cell-v14-native.yml'
      - '.github/actions/setup-ci/**'
      - 'scripts/**'
      - 'tools/**'
      - 'patches/**'
      - 'third_party/**'
      - 'bazel/**'
      - '.cargo/**'
      - 'justfile'
      - 'AGENTS.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '*.bzl'
      - '.bazel*'
      - 'flake.nix'
      - 'flake.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.prettier*'
      - '.gitattributes'
      - '.gitignore'
      - 'CALLERS.toml'
      - 'workspace_root_test_launcher.*.tpl'

permissions:
  contents: read

concurrency:
  group: memory-v14-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/memory-v7-target
      HEPTA_MEMORY_V14_NATIVE_OUTPUT: /tmp/h14-native-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout the exact source and formatter baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        timeout-minutes: 5
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        timeout-minutes: 5
        with:
          toolchain: '1.95.0'
          components: clippy,rustfmt
      - name: Install the pinned nextest runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        timeout-minutes: 5
        with:
          tool: cargo-nextest@0.9.131
      - name: Restore scoped Rust dependencies and prior native build outputs
        id: rust-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: memory-v14-native-rust-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            memory-v14-native-rust-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-
            memory-v12-native-rust-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-
            memory-v11-native-rust-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-
            memory-v10-rust-1.95-verify-${{ hashFiles('codex-rs/Cargo.lock') }}-
            memory-v10-rust-1.95-finalize-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Test exact sources, then final fix and format without further tests
        timeout-minutes: 205
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import subprocess
          import time
          import tomllib
          import xml.etree.ElementTree as ET

          root = Path(os.environ["GITHUB_WORKSPACE"])
          workspace = root / "codex-rs"
          output = Path(os.environ["HEPTA_MEMORY_V14_NATIVE_OUTPUT"])
          output.mkdir(parents=True, exist_ok=False)
          started = time.monotonic()
          baseline = "b020a9b1648513ed7cb4edfbca6893c2b9ec99d4"
          commands = []
          receipt = {
              "schema": "hepta.memory.v14.native-ci-receipt.v1", "passed": False,
              "tests_command_started": False, "tests_executed": False,
              "final_fix_executed": False, "formatter_executed": False,
              "tests_executed_after_fix_or_format": False,
              "production_activation_allowed": False, "trained_quality_claimed": False,
              "baseline_commit": baseline, "commands": commands,
              "github": {key: os.environ.get(key) for key in (
                  "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY")},
              "resource_settings": {key: os.environ.get(key) for key in (
                  "CARGO_PROFILE_DEV_DEBUG", "CARGO_PROFILE_TEST_DEBUG", "CARGO_INCREMENTAL", "CARGO_BUILD_JOBS")},
              "platform": platform.platform(), "disk_before": shutil.disk_usage(output)._asdict(),
          }

          def save():
              temporary = output / "receipt.pending.json"
              temporary.write_text(json.dumps(receipt, indent=2) + "\n")
              temporary.replace(output / "receipt.json")

          def git(*args):
              return subprocess.check_output(["git", *args], cwd=root)

          def execute(name, command):
              item = {"name": name, "command": command, "started": True, "exit_code": None}
              commands.append(item)
              save()
              began = time.monotonic()
              with (output / (name + ".log")).open("w") as log:
                  child = subprocess.Popen(command, cwd=workspace, stdout=subprocess.PIPE,
                                           stderr=subprocess.STDOUT, text=True, errors="replace")
                  for line in child.stdout:
                      log.write(line)
                      print(line, end="", flush=True)
                  item.update(exit_code=child.wait(), wall_seconds=time.monotonic() - began)
              save()
              if item["exit_code"]:
                  raise RuntimeError(name + " exited " + str(item["exit_code"]))

          def retain_tree(name):
              changes = git("status", "--porcelain", "--untracked-files=no").decode()
              (output / (name + ".status.txt")).write_text(changes)
              (output / (name + ".patch")).write_bytes(git("diff", "--binary", "--full-index", "--no-ext-diff", "--no-textconv"))
              receipt[name + "_changed_tree"] = bool(changes)
              save()
              return changes

          report = None
          save()
          try:
              receipt["source_commit"] = git("rev-parse", "HEAD").decode().strip()
              receipt["source_tree"] = git("rev-parse", "HEAD^{tree}").decode().strip()
              if receipt["source_commit"] != os.environ["GITHUB_SHA"] or retain_tree("initial"):
                  raise RuntimeError("Exact clean GitHub source checkout required")
              tree = git("ls-tree", "-r", "--full-tree", "HEAD")
              (output / "source-tree.txt").write_bytes(tree)
              receipt["source_inventory_sha256"] = hashlib.sha256(tree).hexdigest()
              for name, command in (("rustc-version", ["rustc", "--version"]),
                                    ("cargo-version", ["cargo", "--version"]),
                                    ("nextest-version", ["cargo", "nextest", "--version"]),
                                    ("just-version", ["just", "--version"])):
                  execute(name, command)
              config = tomllib.loads((workspace / ".config/nextest.toml").read_text())
              profiles = config["profile"]
              local = profiles["local"]
              if local.get("inherits", "default") != "default":
                  raise RuntimeError("Unexpected nextest local profile inheritance")
              store = Path(config.get("store", {}).get("dir", "target/nextest"))
              junit = Path(local.get("junit", {}).get("path", profiles["default"]["junit"]["path"]))
              if any(path.is_absolute() or ".." in path.parts for path in (store, junit)):
                  raise RuntimeError("Unexpected nextest JUnit output path")
              report = workspace / store / "local" / junit
              report.unlink(missing_ok=True)
              receipt["junit_source"] = str(report)
              receipt["tests_command_started"] = True
              execute("scoped-native-tests", ["just", "test", "--locked", "--lib", "--retries", "0",
                      "-p", "codex-hepta-memory", "-p", "codex-hepta-agentd", "-p", "codex-hepta-cognitive-types",
                      "-E", "test(memory_v14_) | test(memory_v12_) | test(memory_v11_) | test(inventory_v14_)"])
              cases = ET.parse(report).getroot().findall(".//testcase")
              ran = [case for case in cases if case.find("skipped") is None]
              expected = {
                  "memory_v12_python_trained_bytes_match_native_reader",
                  "memory_v12_trained_payload_rejects_version_and_parameter_substitution",
                  "memory_v12_trained_cells_publish_read_restart_correct_and_forget",
                  "memory_v11_candidate_binds_the_complete_owner_partition_and_acquisition_cut",
                  "memory_v11_owner_projection_is_local_complete_and_recoverable",
                  "memory_v11_new_effective_version_and_tombstone_cannot_hide_behind_old_source_ids",
                  "memory_v11_independent_cells_reuse_weights_with_fresh_queries_and_replace_one_version",
                  "memory_v11_query_fences_reject_source_and_selected_version_races",
                  "memory_v11_return_fence_rechecks_timed_dependencies_outside_query_support",
                  "memory_v11_recovery_requires_live_signed_selection_and_withdrawal_frontier",
                  "memory_v11_plan_rejects_duplicate_and_ambiguous_ownership",
              }
              expected.update({
                  "memory_v14_trained_cells_fallback_reject_retrain_restart_and_withdraw",
                  "memory_v14_preserves_full_fitted_dependencies_and_return_fences",
                  "inventory_v14_exact_fallback_roundtrips_without_relaxing_v1",
                  "inventory_v14_preserves_empty_failure_and_typed_value_constraints",
              })
              observed = {case.get("name", "").rsplit("::", 1)[-1] for case in ran}
              receipt.update(tests_executed=bool(ran), executed_cases=len(ran),
                             required_lifecycle_cases=sorted(expected & observed))
              if not expected <= observed or any(case.find("failure") is not None or case.find("error") is not None for case in ran):
                  raise RuntimeError("Required V14 and regression lifecycle cases missing or failed")
              if retain_tree("after_tests"):
                  raise RuntimeError("Tests changed tracked sources")
              receipt["final_fix_executed"] = True
              try:
                  execute("final-scoped-fix", ["just", "fix", "--locked", "-p", "codex-hepta-agentd", "-p", "codex-hepta-cognitive-types"])
              finally:
                  retain_tree("after_fix")
              receipt["formatter_executed"] = True
              try:
                  execute("final-format", ["just", "fmt", "--base", baseline])
              finally:
                  changes = retain_tree("after_format")
              if changes:
                  raise RuntimeError("Final fix or format changed the tested source tree; review the saved patch")
              subprocess.run(["git", "diff", "--check"], cwd=root, check=True)
              receipt["passed"] = True
          except Exception as error:
              receipt.update(error_type=type(error).__name__, error=str(error))
              print("V14 native verification failed:", error, flush=True)
          finally:
              if report is not None and report.is_file():
                  shutil.copy2(report, output / "native-junit.xml")
                  # A failing test command still executed tests. Preserve the
                  # observed JUnit counts instead of leaving the initial false.
                  try:
                      cases = ET.parse(report).getroot().findall(".//testcase")
                      ran = [case for case in cases if case.find("skipped") is None]
                      receipt.update(tests_executed=bool(ran), executed_cases=len(ran),
                                     junit_skipped_cases=len(cases) - len(ran),
                                     failed_cases=[case.get("name", "") for case in ran
                                         if case.find("failure") is not None or case.find("error") is not None],
                                     required_lifecycle_cases=sorted(case.get("name", "").rsplit("::", 1)[-1] for case in ran
                                         if case.get("name", "").rsplit("::", 1)[-1].startswith(("memory_v14_", "inventory_v14_", "memory_v12_", "memory_v11_"))))
                  except Exception as error:
                      receipt.update(passed=False, junit_parse_error=str(error))
              test_log = output / "scoped-native-tests.log"
              if test_log.is_file():
                  plain = re.sub(r"\x1b\[[0-9;]*m", "", test_log.read_text())
                  summaries = [line.strip() for line in plain.splitlines()
                               if re.match(r"\s*Summary\s+\[", line)]
                  if summaries:
                      receipt["nextest_summary"] = summaries[-1]
                      skipped = re.search(r"(\d+) skipped", summaries[-1])
                      if skipped:
                          receipt["nextest_reported_skipped_cases"] = int(skipped.group(1))
              retain_tree("final")
              receipt.update(wall_seconds=time.monotonic() - started,
                             disk_after=shutil.disk_usage(output)._asdict())
              save()
          raise SystemExit(0 if receipt["passed"] else 1)
          PY
      - name: Upload immutable logs, source receipt, JUnit and finalization patches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: memory-v14-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HEPTA_MEMORY_V14_NATIVE_OUTPUT }}/
          if-no-files-found: error
          retention-days: 30
      - name: Save scoped build cache after immutable evidence upload
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: memory-v14-native-rust-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}

  preserve:
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: memory-v14-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/v14-native-collected
      - name: Preserve executed native evidence and finalization patches
        env:
          EVIDENCE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 qualification/memory-cell-v14/preserve_evidence.py --input /tmp/v14-native-collected --output /tmp/v14-native-packed --commit "$GITHUB_SHA" --run "$EVIDENCE_RUN"
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("/tmp/v14-native-collected").rglob("*.patch"):
              target = Path("/tmp/v14-native-packed/readable") / path.relative_to("/tmp/v14-native-collected")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(path.read_bytes())
          PY
          git fetch origin "$GITHUB_REF_NAME"
          git checkout --detach FETCH_HEAD
          mkdir -p "qualification/memory-cell-v14/evidence/native-$EVIDENCE_RUN"
          cp -a /tmp/v14-native-packed/. "qualification/memory-cell-v14/evidence/native-$EVIDENCE_RUN/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "qualification/memory-cell-v14/evidence/native-$EVIDENCE_RUN"
          git commit -m "test(memory): preserve V14 native execution $EVIDENCE_RUN"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            git fetch origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
          done
          exit 1

