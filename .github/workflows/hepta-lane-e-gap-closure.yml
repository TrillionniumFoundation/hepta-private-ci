name: Hepta Lane E gap closure

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: hepta-lane-e-gap-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  rust-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install evaluator coverage tool
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,llvm-tools-preview

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Closed-world Lane E verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify

      - name: Default operator API and source projection regressions
        run: |
          python3 -m unittest discover -s scripts -p test_hepta_rust_surface.py
          python3 -m unittest discover -s scripts -p test_hepta_learning_operator_boundary.py
          python3 scripts/hepta-learning-operator-boundary.py

      - name: Locked all-target compilation
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-intelligence
          -p codex-hepta-shadow-qualification
          --all-targets

      - name: Lane E owner regression tests
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval

      - name: Signed learning.eval qualification E2E
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-intelligence-eval
          signed_qualification_e2e
          --test-threads=1

      - name: Evaluated-shadow signed runtime admission E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/learning-eval
          just test --locked             -p codex-hepta-intelligence             evaluated_shadow             --test-threads=1             2>&1 | tee .hepta-evidence/learning-eval/runtime-e2e.log

      - name: Adversarial qualification stress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/learning-eval
          : > .hepta-evidence/learning-eval/stress.log
          for iteration in $(seq 1 8); do
            printf 'iteration=%s\n' "$iteration" >> .hepta-evidence/learning-eval/stress.log
            (
              cd codex-rs
              just test --locked                 -p codex-hepta-intelligence-eval                 signed_qualification_e2e                 --test-threads=1
            ) >> .hepta-evidence/learning-eval/stress.log 2>&1
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path(".hepta-evidence/learning-eval/stress.json").write_text(
              json.dumps(
                  {
                      "schema": "hepta.learning-eval.stress.v1",
                      "iterations": 8,
                      "signedQualificationSuitesPassed": 8,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Evaluator line coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov --manifest-path codex-rs/Cargo.toml --locked             -p codex-hepta-intelligence-eval             --all-features             --fail-under-lines 85             --json             --output-path .hepta-evidence/learning-eval/coverage.json

      - name: Trusted-only compatibility surface remains explicit
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-intelligence-eval
          --features trusted-inprocess-eval
          --test operator_claim
          --test-threads=1

      - name: Cross-crate causal learning closure
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          lane_e_causal_candidate_chain_is_digest_bound_and_deny_all
          --test-threads=1

      - name: Cross-language wire and fault closure
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          --test cross_language_wire_fault
          --test-threads=1

      - name: Strict Lane E lint
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-intelligence
          -p codex-hepta-shadow-qualification
          --all-targets -- -D warnings

      - name: Formatting and clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-intelligence \
            --package codex-hepta-shadow-qualification \
            -- --check
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit exact-source learning.eval evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/learning-eval
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-learning-eval-evidence.py emit \
            --mode exact-source \
            --source-sha "${SOURCE_SHA}" \
            --candidate-sha "${SOURCE_SHA}" \
            --candidate-tree "${CANDIDATE_TREE}" \
            --base-sha "${BASE_SHA:-}" \
            --coverage .hepta-evidence/learning-eval/coverage.json \
            --stress .hepta-evidence/learning-eval/stress.json \
            --stress-log .hepta-evidence/learning-eval/stress.log \
            --runtime-log .hepta-evidence/learning-eval/runtime-e2e.log \
            --output .hepta-evidence/learning-eval/exact-source.json
          python3 scripts/hepta-learning-eval-evidence.py verify \
            .hepta-evidence/learning-eval/exact-source.json

      - name: Retain exact-source learning.eval evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-eval-exact-source-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/learning-eval/
          if-no-files-found: error
          retention-days: 30

      - name: Attest exact-source learning.eval evidence
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .hepta-evidence/learning-eval/exact-source.json

  synthetic-merge:
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      base: ${{ steps.merge.outputs.base }}
      merge_commit: ${{ steps.merge.outputs.commit }}
      merge_tree: ${{ steps.merge.outputs.tree }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Materialize ordered-parent synthetic merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "${SOURCE_COMMIT}" = "${SOURCE_SHA}"
          if [[ -z "${BASE_SHA}" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "${SOURCE_COMMIT}^1")"
          fi
          BASE_COMMIT="${BASE_SHA}"
          git checkout --detach "${BASE_COMMIT}"
          git -c user.name=hepta-lane-e-ci \
            -c user.email=hepta-lane-e-ci@users.noreply.github.com \
            merge --no-commit --no-ff "${SOURCE_COMMIT}"
          MERGE_TREE="$(git write-tree)"
          MERGE_COMMIT="$(printf '%s\n' 'Lane E synthetic merge qualification' | \
            git -c user.name=hepta-lane-e-ci \
              -c user.email=hepta-lane-e-ci@users.noreply.github.com \
              commit-tree "${MERGE_TREE}" -p "${BASE_COMMIT}" -p "${SOURCE_COMMIT}")"
          printf 'base=%s\nsource=%s\nmerge=%s\ntree=%s\n' \
            "${BASE_COMMIT}" "${SOURCE_COMMIT}" "${MERGE_COMMIT}" "${MERGE_TREE}"
          test "$(git rev-parse "${MERGE_COMMIT}^1")" = "${BASE_COMMIT}"
          test "$(git rev-parse "${MERGE_COMMIT}^2")" = "${SOURCE_COMMIT}"
          test "$(git rev-parse "${MERGE_COMMIT}^{tree}")" = "${MERGE_TREE}"
          {
            printf 'MERGE_TREE=%s\n' "${MERGE_TREE}"
            printf 'MERGE_COMMIT=%s\n' "${MERGE_COMMIT}"
          } >> "${GITHUB_ENV}"
          {
            printf 'base=%s\n' "${BASE_COMMIT}"
            printf 'commit=%s\n' "${MERGE_COMMIT}"
            printf 'tree=%s\n' "${MERGE_TREE}"
          } >> "${GITHUB_OUTPUT}"
          git diff --cached --check
          git diff --exit-code

      - name: Verify merged closed world
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py verify

      - name: Verify merged default operator boundary
        run: |
          python3 -m unittest discover -s scripts -p test_hepta_rust_surface.py
          python3 -m unittest discover -s scripts -p test_hepta_learning_operator_boundary.py
          python3 scripts/hepta-learning-operator-boundary.py

      - name: Compile merged candidate
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-intelligence
          -p codex-hepta-shadow-qualification
          --all-targets

      - name: Test merged owner crates
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval

      - name: Test merged signed learning.eval qualification E2E
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-intelligence-eval
          signed_qualification_e2e
          --test-threads=1

      - name: Test merged evaluated-shadow runtime admission
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-intelligence
          evaluated_shadow
          --test-threads=1

      - name: Test merged trusted-only compatibility surface
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-intelligence-eval
          --features trusted-inprocess-eval
          --test operator_claim
          --test-threads=1

      - name: Test merged cross-crate closure
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          lane_e_causal_candidate_chain_is_digest_bound_and_deny_all
          --test-threads=1

      - name: Test merged cross-language wire and fault closure
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          --test cross_language_wire_fault
          --test-threads=1

      - name: Strict merged Lane E lint
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-intelligence
          -p codex-hepta-shadow-qualification
          --all-targets -- -D warnings

      - name: Verify merged formatting and index stability
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-intelligence \
            --package codex-hepta-shadow-qualification \
            -- --check
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = "${MERGE_TREE}"
          test "$(git rev-parse "${MERGE_COMMIT}^{tree}")" = "${MERGE_TREE}"

  learning-eval-qualification:
    needs:
      - rust-closure
      - synthetic-merge
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install qualification tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103,cargo-llvm-cov@0.9.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Bind exact source and production surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          ! grep -Eq '^pub fn evaluate\\(' codex-rs/hepta-intelligence-eval/src/lib.rs
          ! grep -Eq '^pub use closure::decide_independently' codex-rs/hepta-intelligence-eval/src/lib.rs
          ! grep -Eq '^pub use signed_evaluation::decide_with_signed_evidence_v2' codex-rs/hepta-intelligence-eval/src/lib.rs
          ! grep -Eq '^pub use longitudinal_time::decide_with_signed_longitudinal_evidence_v3' codex-rs/hepta-intelligence-eval/src/lib.rs
          grep -Fq 'pub use product_runner::ProductEvaluationRunnerV1' codex-rs/hepta-intelligence-eval/src/lib.rs
          grep -Fq 'pub use signed_evaluation::evaluation_signing_payload_v2' codex-rs/hepta-intelligence-eval/src/lib.rs
          grep -Fq 'trusted-inprocess-eval = []' codex-rs/hepta-intelligence-eval/Cargo.toml
          grep -Fq 'ProductEvaluationRunnerV1' codex-rs/hepta-intelligence-eval/PRODUCTION_CONTRACT.md
          grep -Fq 'FencedFinalHoldoutOwnerV1' codex-rs/hepta-intelligence-eval/PRODUCTION_CONTRACT.md

      - name: Product evaluation runner evidence-chain tests
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-intelligence-eval
          product_runner::tests
          --test-threads=1

      - name: Default public API contract
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          --test lane_e_api_contract
          --test-threads=1

      - name: Explicit trusted compatibility surface
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-intelligence-eval
          --features trusted-inprocess-eval
          --test operator_claim
          --test-threads=1

      - name: Signed cross-crate evaluation E2E
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          lane_e_causal_candidate_chain_is_digest_bound_and_deny_all
          --test-threads=1

      - name: Evaluated-shadow signed runtime admission E2E
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-intelligence
          evaluated_shadow
          --test-threads=1

      - name: Fenced holdout stress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/learning-eval
          : > .hepta-evidence/learning-eval/fenced-holdout-stress.log
          for iteration in $(seq 1 16); do
            printf 'iteration=%s\n' "${iteration}" | tee -a .hepta-evidence/learning-eval/fenced-holdout-stress.log
            (
              cd codex-rs
              just test --locked -p codex-hepta-intelligence-eval fenced_holdout --test-threads=1
            ) 2>&1 | tee -a .hepta-evidence/learning-eval/fenced-holdout-stress.log
          done

      - name: Learning eval coverage
        working-directory: codex-rs
        run: >-
          cargo llvm-cov --locked
          -p codex-hepta-intelligence-eval
          --all-targets
          --fail-under-lines 85
          --json
          --output-path ../.hepta-evidence/learning-eval/coverage.json

      - name: Build qualification manifest
        shell: bash
        env:
          MERGE_BASE: ${{ needs['synthetic-merge'].outputs.base }}
          MERGE_COMMIT: ${{ needs['synthetic-merge'].outputs.merge_commit }}
          MERGE_TREE: ${{ needs['synthetic-merge'].outputs.merge_tree }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          evidence = root / ".hepta-evidence" / "learning-eval"
          coverage_path = evidence / "coverage.json"
          coverage = json.loads(coverage_path.read_text())
          totals = coverage["data"][0]["totals"]
          line_percent = float(totals["lines"]["percent"])
          if line_percent <= 0.0:
              raise SystemExit("coverage report contains no measured lines")

          def sha256(path: str) -> str:
              return hashlib.sha256((root / path).read_bytes()).hexdigest()

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          now = dt.datetime.now(dt.timezone.utc)
          manifest = {
              "schema": "hepta.learning-eval.qualification-evidence.v1",
              "source": {
                  "commit": git("rev-parse", "HEAD"),
                  "tree": git("rev-parse", "HEAD^{tree}"),
                  "baseCommit": os.environ["MERGE_BASE"],
                  "syntheticMergeCommit": os.environ["MERGE_COMMIT"],
                  "syntheticMergeTree": os.environ["MERGE_TREE"],
              },
              "build": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "workflow": os.environ["GITHUB_WORKFLOW"],
                  "runId": os.environ["GITHUB_RUN_ID"],
                  "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "job": os.environ["GITHUB_JOB"],
                  "actor": os.environ["GITHUB_ACTOR"],
              },
              "inputs": {
                  "cargoLockSha256": sha256("codex-rs/Cargo.lock"),
                  "productionContractSha256": sha256("codex-rs/hepta-intelligence-eval/PRODUCTION_CONTRACT.md"),
                  "nativeMappingSha256": sha256("codex-rs/hepta-intelligence-eval/NATIVE_MAPPING.md"),
                  "traceabilitySha256": sha256("qualification/lane-e/TEST_TRACEABILITY.json"),
              },
              "tooling": {
                  "cargoLlvmCov": "0.9.1",
                  "rust": "1.95.0",
              },
              "coverage": {
                  "report": ".hepta-evidence/learning-eval/coverage.json",
                  "sha256": hashlib.sha256(coverage_path.read_bytes()).hexdigest(),
                  "linePercent": line_percent,
                  "linesCount": totals["lines"]["count"],
                  "linesCovered": totals["lines"]["covered"],
              },
              "stress": {
                  "fencedHoldoutIterations": 16,
                  "logSha256": hashlib.sha256(
                      (evidence / "fenced-holdout-stress.log").read_bytes()
                  ).hexdigest(),
              },
              "e2e": {
                  "test": "lane_e_causal_candidate_chain_is_digest_bound_and_deny_all",
                  "admission": "signed_v2",
                  "claimScope": "Qualification",
              },
              "createdAt": now.isoformat().replace("+00:00", "Z"),
              "expiresAt": (now + dt.timedelta(days=30)).isoformat().replace("+00:00", "Z"),
              "authority": "DENY_ALL",
              "externalEvidenceSatisfied": False,
          }
          input_rows = [
              f"{name}={value}"
              for name, value in sorted(manifest["inputs"].items())
          ]
          manifest["qualificationInputSetSha256"] = hashlib.sha256(
              ("\n".join(input_rows) + "\n").encode()
          ).hexdigest()
          manifest["provenance"] = {
              "issuer": "github-actions",
              "workflowIdentity": (
                  f"{os.environ['GITHUB_REPOSITORY']}/"
                  f".github/workflows/hepta-lane-e-gap-closure.yml"
              ),
              "sourceRef": os.environ["GITHUB_REF"],
              "sourceSha": os.environ["SOURCE_SHA"],
          }
          if manifest["source"]["commit"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("source SHA drift")
          (evidence / "qualification.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY
          cat .hepta-evidence/learning-eval/qualification.json

      - name: Attest qualification manifest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: .hepta-evidence/learning-eval/qualification.json

      - name: Retain learning eval qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-eval-qualification-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/learning-eval/
          if-no-files-found: error
          retention-days: 30
