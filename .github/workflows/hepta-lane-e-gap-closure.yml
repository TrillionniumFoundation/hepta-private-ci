name: Hepta Lane E gap closure

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - codex-rs/hepta-learning-ledger/**
      - codex-rs/hepta-learning-artifacts/**
      - codex-rs/hepta-bellman-operator/**
      - codex-rs/hepta-intelligence-eval/**
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-shadow-qualification/**
      - docs/lane-e/**
      - qualification/lane-e/**
      - scripts/hepta-lane-e-closure.py
      - .github/workflows/hepta-lane-e-gap-closure.yml

permissions:
  contents: read

concurrency:
  group: hepta-lane-e-gap-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  rust-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103,cargo-llvm-cov@0.8.6

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,llvm-tools-preview

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Closed-world Lane E verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify

      - name: Locked all-target compilation
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-shadow-qualification
          --all-targets

      - name: Lane E owner regression tests
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval

      - name: Cross-crate causal learning closure
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          lane_e_causal_candidate_chain_is_digest_bound_and_deny_all
          --test-threads=1

      - name: Cross-language wire and fault closure
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-shadow-qualification
          --test cross_language_wire_fault
          -- --test-threads=1

      - name: Signed evaluated-shadow end-to-end qualification
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-intelligence
          evaluated_shadow
          -- --test-threads=1

      - name: Durable holdout reopen/replay stress audit
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-intelligence-eval
          durable_holdout_reopen_replay_stress
          -- --ignored --test-threads=1

      - name: learning.eval coverage evidence
        working-directory: codex-rs
        run: |
          set -euo pipefail
          mkdir -p ../.hepta-evidence
          cargo llvm-cov --locked \
            -p codex-hepta-intelligence-eval \
            --lcov \
            --output-path ../.hepta-evidence/learning-eval-source.lcov

      - name: Strict Lane E lint
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-shadow-qualification
          --all-targets -- -D warnings

      - name: Formatting and clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification \
            -- --check
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit exact-source Lane E qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence
          python3 scripts/hepta-lane-e-closure.py receipt \
            --kind source-head \
            --expected-sha "${SOURCE_SHA}" \
            --output .hepta-evidence/lane-e-source-head.json
          python3 scripts/hepta-lane-e-closure.py receipt-verify \
            --kind source-head \
            --expected-sha "${SOURCE_SHA}" \
            --input .hepta-evidence/lane-e-source-head.json

      - name: Retain exact-source Lane E qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-lane-e-qualification-source-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  synthetic-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103,cargo-llvm-cov@0.8.6

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,llvm-tools-preview

      - name: Materialize ordered-parent synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "${SOURCE_COMMIT}" = "${SOURCE_SHA}"
          test -n "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          BASE_COMMIT="${BASE_SHA}"
          git checkout --detach "${BASE_COMMIT}"
          git -c user.name=hepta-lane-e-ci \
            -c user.email=hepta-lane-e-ci@users.noreply.github.com \
            merge --no-commit --no-ff "${SOURCE_COMMIT}"
          MERGE_TREE="$(git write-tree)"
          MERGE_COMMIT="$(printf '%s\n' 'Lane E synthetic merge qualification' | \
            git -c user.name=hepta-lane-e-ci \
              -c user.email=hepta-lane-e-ci@users.noreply.github.com \
              commit-tree "${MERGE_TREE}" -p "${BASE_COMMIT}" -p "${SOURCE_COMMIT}")"
          printf 'base=%s\nsource=%s\nmerge=%s\ntree=%s\n' \
            "${BASE_COMMIT}" "${SOURCE_COMMIT}" "${MERGE_COMMIT}" "${MERGE_TREE}"
          test "$(git rev-parse "${MERGE_COMMIT}^1")" = "${BASE_COMMIT}"
          test "$(git rev-parse "${MERGE_COMMIT}^2")" = "${SOURCE_COMMIT}"
          test "$(git rev-parse "${MERGE_COMMIT}^{tree}")" = "${MERGE_TREE}"
          {
            printf 'MERGE_TREE=%s\n' "${MERGE_TREE}"
            printf 'MERGE_COMMIT=%s\n' "${MERGE_COMMIT}"
          } >> "${GITHUB_ENV}"
          git diff --cached --check
          git diff --exit-code
          git checkout --detach "${MERGE_COMMIT}"
          test "$(git rev-parse HEAD)" = "${MERGE_COMMIT}"

      - name: Verify merged closed world
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py verify

      - name: Compile merged candidate
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-shadow-qualification
          --all-targets

      - name: Test merged owner crates
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval

      - name: Test merged cross-crate closure
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          lane_e_causal_candidate_chain_is_digest_bound_and_deny_all
          --test-threads=1

      - name: Test merged cross-language wire and fault closure
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-shadow-qualification
          --test cross_language_wire_fault
          -- --test-threads=1

      - name: Test merged signed evaluated-shadow end-to-end qualification
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-intelligence
          evaluated_shadow
          -- --test-threads=1

      - name: Test merged durable holdout stress audit
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-intelligence-eval
          durable_holdout_reopen_replay_stress
          -- --ignored --test-threads=1

      - name: Verify merged formatting and index stability
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification \
            -- --check
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = "${MERGE_TREE}"
          test "$(git rev-parse "${MERGE_COMMIT}^{tree}")" = "${MERGE_TREE}"

      - name: Emit synthetic-merge Lane E qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence
          python3 scripts/hepta-lane-e-closure.py receipt \
            --kind synthetic-merge \
            --expected-sha "${MERGE_COMMIT}" \
            --output .hepta-evidence/lane-e-synthetic-merge.json
          python3 scripts/hepta-lane-e-closure.py receipt-verify \
            --kind synthetic-merge \
            --expected-sha "${MERGE_COMMIT}" \
            --input .hepta-evidence/lane-e-synthetic-merge.json

      - name: Retain synthetic-merge Lane E qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-lane-e-qualification-merge-${{ env.MERGE_COMMIT }}
          path: .hepta-evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
