name: Hepta Lane E gap closure

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - codex-rs/hepta-learning-ledger/**
      - codex-rs/hepta-learning-artifacts/**
      - codex-rs/hepta-bellman-operator/**
      - codex-rs/hepta-intelligence-eval/**
      - codex-rs/hepta-shadow-qualification/**
      - docs/lane-e/**
      - qualification/lane-e/**
      - scripts/hepta-lane-e-closure.py
      - scripts/hepta-learning-eval-status.py
      - .github/workflows/hepta-lane-e-gap-closure.yml

permissions:
  contents: read

concurrency:
  group: hepta-lane-e-gap-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  rust-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Closed-world Lane E verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          python3 scripts/hepta-learning-eval-status.py

      - name: Locked all-target compilation
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-shadow-qualification
          --all-targets

      - name: Lane E owner regression tests
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval

      - name: Cross-crate causal learning closure
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          lane_e_causal_candidate_chain_is_digest_bound_and_deny_all
          --test-threads=1

      - name: Cross-language wire and fault closure
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-shadow-qualification
          --test cross_language_wire_fault
          -- --test-threads=1

      - name: Strict learning.eval lint
        if: always()
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-intelligence-eval --all-targets -- -D warnings

      - name: Strict learning.ledger lint
        if: always()
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-learning-ledger --all-targets -- -D warnings

      - name: Strict learning.artifacts lint
        if: always()
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-learning-artifacts --all-targets -- -D warnings

      - name: Strict learning.operator lint
        if: always()
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-bellman-operator --all-targets -- -D warnings

      - name: Strict shadow qualification lint
        if: always()
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-shadow-qualification --all-targets -- -D warnings

      - name: Formatting and clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification \
            -- --check
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Write exact-head qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          source = git("rev-parse", "HEAD")
          expected = os.environ["SOURCE_SHA"]
          if source != expected:
              raise SystemExit(f"source drift: {source} != {expected}")
          receipt = {
              "schema": "hepta.lane-e.exact-head-qualification-receipt.v1",
              "claimBoundary": "repository_source_qualification_only",
              "sourceSha": source,
              "sourceTree": git("rev-parse", "HEAD^{tree}"),
              "laneMatrixBlob": git("hash-object", "docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json"),
              "traceabilityBlob": git("hash-object", "qualification/lane-e/TEST_TRACEABILITY.json"),
              "statusGuardBlob": git("hash-object", "scripts/hepta-learning-eval-status.py"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "workflowRunId": os.environ.get("GITHUB_RUN_ID"),
              "workflowRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "productionExecutionProved": False,
              "futureCalendarEvidenceProved": False,
              "independentAcceptanceProved": False,
              "releaseProved": False,
          }
          Path(".hepta-evidence/lane-e-exact-head.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain exact-head qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-e-exact-head-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/lane-e-exact-head.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  synthetic-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Materialize ordered-parent synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "${SOURCE_COMMIT}" = "${SOURCE_SHA}"
          test -n "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          BASE_COMMIT="${BASE_SHA}"
          git checkout --detach "${BASE_COMMIT}"
          git -c user.name=hepta-lane-e-ci \
            -c user.email=hepta-lane-e-ci@users.noreply.github.com \
            merge --no-commit --no-ff "${SOURCE_COMMIT}"
          MERGE_TREE="$(git write-tree)"
          MERGE_COMMIT="$(printf '%s\n' 'Lane E synthetic merge qualification' | \
            git -c user.name=hepta-lane-e-ci \
              -c user.email=hepta-lane-e-ci@users.noreply.github.com \
              commit-tree "${MERGE_TREE}" -p "${BASE_COMMIT}" -p "${SOURCE_COMMIT}")"
          printf 'base=%s\nsource=%s\nmerge=%s\ntree=%s\n' \
            "${BASE_COMMIT}" "${SOURCE_COMMIT}" "${MERGE_COMMIT}" "${MERGE_TREE}"
          test "$(git rev-parse "${MERGE_COMMIT}^1")" = "${BASE_COMMIT}"
          test "$(git rev-parse "${MERGE_COMMIT}^2")" = "${SOURCE_COMMIT}"
          test "$(git rev-parse "${MERGE_COMMIT}^{tree}")" = "${MERGE_TREE}"
          {
            printf 'MERGE_TREE=%s\n' "${MERGE_TREE}"
            printf 'MERGE_COMMIT=%s\n' "${MERGE_COMMIT}"
          } >> "${GITHUB_ENV}"
          git diff --cached --check
          git diff --exit-code

      - name: Verify merged closed world
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py verify
          python3 scripts/hepta-learning-eval-status.py

      - name: Compile merged candidate
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval
          -p codex-hepta-shadow-qualification
          --all-targets

      - name: Test merged owner crates
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-learning-ledger
          -p codex-hepta-learning-artifacts
          -p codex-hepta-bellman-operator
          -p codex-hepta-intelligence-eval

      - name: Test merged cross-crate closure
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-shadow-qualification
          lane_e_causal_candidate_chain_is_digest_bound_and_deny_all
          --test-threads=1

      - name: Test merged cross-language wire and fault closure
        working-directory: codex-rs
        run: >-
          cargo test --locked
          -p codex-hepta-shadow-qualification
          --test cross_language_wire_fault
          -- --test-threads=1

      - name: Verify merged formatting and index stability
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification \
            -- --check
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = "${MERGE_TREE}"
          test "$(git rev-parse "${MERGE_COMMIT}^{tree}")" = "${MERGE_TREE}"

      - name: Write synthetic-merge qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          source = os.environ["SOURCE_SHA"]
          base = os.environ["BASE_SHA"]
          merge_commit = os.environ["MERGE_COMMIT"]
          merge_tree = os.environ["MERGE_TREE"]
          if git("rev-parse", f"{merge_commit}^1") != base:
              raise SystemExit("synthetic merge first-parent drift")
          if git("rev-parse", f"{merge_commit}^2") != source:
              raise SystemExit("synthetic merge second-parent drift")
          if git("rev-parse", f"{merge_commit}^{{tree}}") != merge_tree:
              raise SystemExit("synthetic merge tree drift")
          if git("write-tree") != merge_tree:
              raise SystemExit("qualified index no longer matches merge tree")
          receipt = {
              "schema": "hepta.lane-e.synthetic-merge-qualification-receipt.v1",
              "claimBoundary": "repository_source_qualification_only",
              "baseSha": base,
              "sourceSha": source,
              "mergeCommit": merge_commit,
              "mergeTree": merge_tree,
              "laneMatrixBlob": git("hash-object", "docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json"),
              "traceabilityBlob": git("hash-object", "qualification/lane-e/TEST_TRACEABILITY.json"),
              "statusGuardBlob": git("hash-object", "scripts/hepta-learning-eval-status.py"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "workflowRunId": os.environ.get("GITHUB_RUN_ID"),
              "workflowRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "productionExecutionProved": False,
              "futureCalendarEvidenceProved": False,
              "independentAcceptanceProved": False,
              "releaseProved": False,
          }
          Path(".hepta-evidence/lane-e-synthetic-merge.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain synthetic-merge qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-e-synthetic-merge-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/lane-e-synthetic-merge.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
