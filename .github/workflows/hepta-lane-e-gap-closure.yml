name: Hepta Lane E gap closure

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: hepta-learning-operator-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-learning-operator:
    if: ${{ github.event.pull_request.head.ref == 'work/product-convergence-20260923' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact candidate with write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ env.SOURCE_SHA }}

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Bind exact source and materialize known-safe transformations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/apply_learning_operator_convergence_20260925_v2.py

      - name: Verify Lane E, implementation maps and CI scope
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          python3 scripts/hepta-implementation-maps.py verify
          python3 -m unittest scripts.tests.test_hepta_ci_scope

      - name: Prove topology gate executes real tests
        run: |
          set -euo pipefail
          output="$(cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-plasticity topology_v2 -- --nocapture 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'test result: ok\. [1-9][0-9]* passed'

      - name: Format, test and strict lint affected packages
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-agentd \
            --package codex-hepta-plasticity \
            -- --check
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-agentd --lib
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-agentd \
            -p codex-hepta-plasticity \
            --all-targets -- -D warnings

      - name: Restore registered workflow and commit without overwriting concurrent work
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/hepta-lane-e-gap-closure.yml > .github/workflows/hepta-lane-e-gap-closure.yml
          rm -f scripts/apply_learning_operator_convergence_20260925.py
          rm -f scripts/apply_learning_operator_convergence_20260925_v2.py
          rm -f .github/workflows/hepta-learning-operator-materialize.yml
          rm -f .github/workflows/hepta-learning-operator-materialize-v2.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name 'Hepta Convergence Bot'
          git config user.email 'hepta-convergence@users.noreply.github.com'
          git commit -m 'fix(learning.operator): close Lane E source and caller boundaries [learning-operator-materialized-v3]'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
