name: Evolution unified source closeout trigger

on:
  push:
    branches: [ops/evolution-agentd-clippy-closeout-20260929]
    paths:
      - '.github/workflows/evolution-unified-closeout-trigger.yml'
      - '.github/scripts/apply_evolution_agentd_clippy_closeout.py'
      - '.github/patches/evolution-unified-closeout.patch.zlib.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evolution-unified-closeout-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE: 14ceaff8a398ef8bbb02ac8a98a8777fdd2fa3a2
  EXPECTED_TREE: 202224e6a820252edf49a69fd8eda1d1e401be44
  TARGET_BRANCH: codex/evolution-convergence-20260928
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  verify-and-publish:
    name: verify and publish exact unified source
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          fetch-depth: 1
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Prepare native dependencies and verified V8 inputs
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          python3 scripts/hepta_workspace.py
          python3 scripts/hepta_ci_v8.py

      - name: Materialize exact reviewed source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          author_root="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$author_root/.github/scripts/apply_evolution_agentd_clippy_closeout.py" \
            -o "$RUNNER_TEMP/apply-evolution-closeout.py"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$author_root/.github/patches/evolution-unified-closeout.patch.zlib.b64" \
            -o "$RUNNER_TEMP/evolution-closeout.patch.zlib.b64"
          python3 "$RUNNER_TEMP/apply-evolution-closeout.py" \
            --payload "$RUNNER_TEMP/evolution-closeout.patch.zlib.b64" \
            | tee "$RUNNER_TEMP/patch-digest.txt"

      - name: Verify source and workflow syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta_repository_controls.py \
            scripts/tests/test_hepta_repository_controls.py
          python3 -m unittest -v scripts.tests.test_hepta_repository_controls
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/hepta-architecture-convergence.yml').read_text()
          stale = 'codex-hepta-plasticity topology_v3'
          current = '-p codex-hepta-plasticity || status=1'
          if stale in workflow or workflow.count(current) != 1:
              raise SystemExit('architecture topology qualification is stale or ambiguous')
          PY
          git diff --check

      - name: Verify committed Rust formatting contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-agentd \
            --package codex-hepta-operations \
            --package codex-hepta-plasticity -- --check

      - name: Compile and test existing owners
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-agentd \
            -p codex-hepta-operations \
            -p codex-hepta-plasticity
          just test --locked --lib -p codex-hepta-agentd \
            --retries 0 --test-threads=1
          just test --locked -p codex-hepta-operations \
            --retries 0 --test-threads=1
          just test --locked -p codex-hepta-plasticity \
            --retries 0 --test-threads=1

      - name: Deny warnings without waivers
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-agentd \
            -p codex-hepta-operations \
            -p codex-hepta-plasticity -- -D warnings

      - name: Commit ordinary source and fast-forward the integration line
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/hepta-architecture-convergence.yml \
            codex-rs/hepta-agentd/src \
            codex-rs/hepta-operations/src \
            scripts/hepta_repository_controls.py \
            scripts/tests/test_hepta_repository_controls.py
          git diff --cached --check
          git commit -m 'fix(evolution): close exact Agentd and architecture candidate blockers'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_SOURCE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          mkdir -p "$RUNNER_TEMP/evolution-unified-closeout"
          cp "$RUNNER_TEMP/patch-digest.txt" "$RUNNER_TEMP/evolution-unified-closeout/"
          git rev-parse HEAD > "$RUNNER_TEMP/evolution-unified-closeout/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/evolution-unified-closeout/source-tree.txt"
          git show --stat --oneline HEAD > "$RUNNER_TEMP/evolution-unified-closeout/commit.txt"

      - name: Retain exact authored-source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evolution-unified-closeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evolution-unified-closeout/
          if-no-files-found: warn
          retention-days: 14
