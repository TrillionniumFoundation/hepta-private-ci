name: Intuition source proposal inspection
on:
  push:
    branches: [codex/intuition-devhost-20260928]
    paths: [.github/workflows/intuition-proposal-inspect.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Print existing proposal identity and test summaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/jobs/108853118867/logs',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              log = response.read(8000000).decode('utf-8', errors='replace')
          lines = [line for line in log.splitlines() if re.search(r'test result:|Ran [0-9]+ tests|INTUITION_SOURCE_PROPOSAL=|proposedCommit|candidateRefUpdated|sourceSha|Finished `dev`|Finished `test`|Error|Traceback', line)]
          for line in lines[-30:]:
              print(line)
          assert re.search(r'INTUITION_SOURCE_PROPOSAL=[0-9a-f]{40}', log), 'no generated commit in completed log'
          print('Read-only inspection of authoring output; not immutable qualification.')
          PY
