name: original app-server schema regeneration

on:
  push:
    branches:
      - research/private-ci-original-schema-regeneration-20261104-gpt6

permissions:
  contents: read

concurrency:
  group: original-schema-regeneration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-generate-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libdbus-1-dev libssl-dev libcap-dev
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103
      - name: Run both original schema recipes and every original protocol library test
        run: python3 qualification/app-server-schema-20261104/generate.py --output "$RUNNER_TEMP/app-server-schema"
      - name: Retain complete original generation and native outputs
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: original-app-server-schema-${{ github.sha }}
          path: ${{ runner.temp }}/app-server-schema
          if-no-files-found: error
          retention-days: 7
