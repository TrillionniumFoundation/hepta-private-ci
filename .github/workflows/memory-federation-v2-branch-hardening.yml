name: memory federation v2 branch hardening

on:
  push:
    branches:
      - fix/memory-federation-v2-hardening
    paths:
      - .github/workflows/memory-federation-v2-branch-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/memory-federation-v2-hardening

      - name: Apply product composition patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual < expected:
                  raise SystemExit(f"{path}: expected at least {expected} occurrence(s), found {actual}: {old[:100]!r}")
              text = text.replace(old, new, expected)
              p.write_text(text)

          # Product Agentd stores enrolled owner layouts and lets the canonical
          # V2 caller rediscover current capabilities at each physical read.
          replace(
              "codex-rs/hepta-agentd/src/runtime.rs",
              "use std::time::SystemTime;\nuse std::time::UNIX_EPOCH;\n",
              "",
          )
          replace(
              "codex-rs/hepta-agentd/src/runtime.rs",
              "use codex_hepta_memory::FederatedRecallSet;\n",
              "",
          )
          replace(
              "codex-rs/hepta-agentd/src/runtime.rs",
              '''async fn attach_federation_after_generation_fence(
              state: &AgentdState,
              runtime: CognitiveRuntime,
              owner_layouts: Vec<codex_hepta_paths::HeptaAgentLayout>,
          ) -> Result<CognitiveRuntime, AgentdError> {
              if runtime.available_store().is_none() || owner_layouts.is_empty() {
                  return Ok(runtime);
              }
              state.refresh_generation()?;
              let now = SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .map_err(|error| AgentdError::Protocol(error.to_string()))?
                  .as_secs();
              let now = i64::try_from(now)
                  .map_err(|_| AgentdError::Protocol("system clock overflow".to_string()))?;
              let federation =
                  FederatedRecallSet::discover(state.identity().agent_id.clone(), owner_layouts, now).await;
              // Discovery reads other owner stores and can outlive a lifecycle update.
              // Fence once more before the read-only set reaches App Server.
              state.refresh_generation()?;
              Ok(runtime.with_federation(federation))
          }
          ''',
              '''async fn attach_federation_after_generation_fence(
              state: &AgentdState,
              runtime: CognitiveRuntime,
              owner_layouts: Vec<codex_hepta_paths::HeptaAgentLayout>,
          ) -> Result<CognitiveRuntime, AgentdError> {
              if runtime.available_store().is_none() || owner_layouts.is_empty() {
                  return Ok(runtime);
              }
              state.refresh_generation()?;
              let runtime = runtime.with_federation_sources(
                  state.identity().agent_id.clone(),
                  owner_layouts,
              );
              // Bind the exact fleet generation on both sides of product
              // federation composition. Physical reads rediscover current grants.
              state.refresh_generation()?;
              Ok(runtime)
          }
          ''',
          )

          # The extension keeps a legacy constructor for focused compatibility
          # tests, but production registration passes the CognitiveRuntime so V2
          # coverage and post-I/O authority observations are preserved.
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "use codex_hepta_memory::FederatedMemoryExplanation;\n",
              "use codex_hepta_memory::CognitiveRuntime;\nuse codex_hepta_memory::CognitiveStoreError;\nuse codex_hepta_memory::FederatedMemoryExplanation;\n",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''    query_sha256: Sha256Digest,
              bindings: Vec<FederatedMemoryRevalidationBinding>,
          ''',
              '''    query_sha256: Sha256Digest,
              coverage: [u32; 4],
              bindings: Vec<FederatedMemoryRevalidationBinding>,
          ''',
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''pub(crate) struct FederatedCognitiveExtension {
              federation: Arc<FederatedRecallSet>,
          }

          impl FederatedCognitiveExtension {
              pub(crate) fn new(federation: Arc<FederatedRecallSet>) -> Self {
                  Self { federation }
              }
          ''',
              '''enum FederatedBackend {
              Legacy(Arc<FederatedRecallSet>),
              Runtime(CognitiveRuntime),
          }

          pub(crate) struct FederatedCognitiveExtension {
              backend: FederatedBackend,
          }

          impl FederatedCognitiveExtension {
              pub(crate) fn new(federation: Arc<FederatedRecallSet>) -> Self {
                  Self {
                      backend: FederatedBackend::Legacy(federation),
                  }
              }

              pub(crate) fn from_runtime(runtime: CognitiveRuntime) -> Self {
                  Self {
                      backend: FederatedBackend::Runtime(runtime),
                  }
              }

              fn consumer_agent_id(&self) -> Option<AgentId> {
                  match &self.backend {
                      FederatedBackend::Legacy(federation) => {
                          Some(federation.consumer_agent_id().clone())
                      }
                      FederatedBackend::Runtime(runtime) => {
                          runtime.federation_consumer_agent_id().cloned()
                      }
                  }
              }

              async fn retrieve(
                  &self,
                  access: &FederationConsumerAccess,
                  request: &RetrievalRequest,
              ) -> Result<(FederatedRetrievalBatch, [u32; 4]), CognitiveStoreError> {
                  match &self.backend {
                      FederatedBackend::Legacy(federation) => {
                          let batch = federation.retrieve(access, request).await?;
                          Ok((batch, [1, 1, 0, 0]))
                      }
                      FederatedBackend::Runtime(runtime) => {
                          let (batch, coverage) = runtime.retrieve_federated(access, request).await?;
                          Ok((
                              batch,
                              [
                                  coverage.requested_peers,
                                  coverage.completed_peers,
                                  coverage.failed_peers,
                                  coverage.truncated_items,
                              ],
                          ))
                      }
                  }
              }

              async fn revalidate(
                  &self,
                  access: &FederationConsumerAccess,
                  binding: &FederatedMemoryRevalidationBinding,
                  now_unix_seconds: i64,
              ) -> Result<FederatedRevalidationStatus, CognitiveStoreError> {
                  match &self.backend {
                      FederatedBackend::Legacy(federation) => {
                          federation.revalidate(access, binding, now_unix_seconds).await
                      }
                      FederatedBackend::Runtime(runtime) => {
                          runtime
                              .revalidate_federated(access, binding, now_unix_seconds)
                              .await
                      }
                  }
              }
          ''',
          )

          access_block = '''        let access = FederationConsumerAccess::new(
              self.federation.consumer_agent_id().clone(),
              workspace_digest(input.cwd),
          );
          '''
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              access_block,
              '''        let access = FederationConsumerAccess::new(
              self.consumer_agent_id()?,
              workspace_digest(input.cwd),
          );
          ''',
              1,
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              access_block,
              '''        let Some(consumer_agent_id) = self.consumer_agent_id() else {
              return Ok(None);
          };
          let access = FederationConsumerAccess::new(
              consumer_agent_id,
              workspace_digest(input.cwd),
          );
          ''',
              1,
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "self.federation.revalidate(&access, binding, now).await",
              "self.revalidate(&access, binding, now).await",
              2,
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''            let access = FederationConsumerAccess::new(
                  self.federation.consumer_agent_id().clone(),
                  workspace_digest(workspace.as_path()),
              );
              let Ok(batch) = self
                  .federation
                  .retrieve(&access, &RetrievalRequest::new(query, now))
                  .await
              else {
                  return Vec::new();
              };
          ''',
              '''            let Some(consumer_agent_id) = self.consumer_agent_id() else {
                  return Vec::new();
              };
              let access = FederationConsumerAccess::new(
                  consumer_agent_id,
                  workspace_digest(workspace.as_path()),
              );
              let Ok((batch, coverage)) = self
                  .retrieve(&access, &RetrievalRequest::new(query, now))
                  .await
              else {
                  return Vec::new();
              };
          ''',
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "compile_retrieval_batch(&batch, byte_budget, item_budget)",
              "compile_retrieval_batch(&batch, byte_budget, item_budget, coverage)",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "let content = compile_explanations(&explanations)?;",
              "let content = compile_explanations(&explanations, prepared.coverage)?;",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "let Some(content) = compile_explanations(&explanations) else {",
              "let Some(content) = compile_explanations(&explanations, prepared.coverage) else {",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''            &prepared.query_sha256,
              &prepared.bindings,
              &content_sha256,
          ''',
              '''            &prepared.query_sha256,
              &prepared.coverage,
              &prepared.bindings,
              &content_sha256,
          ''',
              2,
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''                &batch.query_sha256,
                  &bindings,
                  &content_sha256,
          ''',
              '''                &batch.query_sha256,
                  &coverage,
                  &bindings,
                  &content_sha256,
          ''',
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''                query_sha256: batch.query_sha256,
                  bindings,
          ''',
              '''                query_sha256: batch.query_sha256,
                  coverage,
                  bindings,
          ''',
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''struct FederatedAttachment<'a> {
              schema_version: u32,
              source: &'static str,
              memories: &'a [FederatedAttachmentMemory],
          }
          ''',
              '''struct FederatedAttachment<'a> {
              schema_version: u32,
              source: &'static str,
              coverage: [u32; 4],
              memories: &'a [FederatedAttachmentMemory],
          }
          ''',
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''fn compile_retrieval_batch(
              batch: &FederatedRetrievalBatch,
              max_bytes: usize,
              max_item_bytes: usize,
          ) -> Option<(Vec<FederatedMemoryRevalidationBinding>, String)> {
          ''',
              '''fn compile_retrieval_batch(
              batch: &FederatedRetrievalBatch,
              max_bytes: usize,
              max_item_bytes: usize,
              coverage: [u32; 4],
          ) -> Option<(Vec<FederatedMemoryRevalidationBinding>, String)> {
          ''',
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "serialize_attachment(&proposed)",
              "serialize_attachment(&proposed, coverage)",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "let content = serialize_attachment(&selected_memories).ok()?;",
              "let content = serialize_attachment(&selected_memories, coverage).ok()?;",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "fn compile_explanations(explanations: &[FederatedMemoryExplanation]) -> Option<String> {",
              "fn compile_explanations(explanations: &[FederatedMemoryExplanation], coverage: [u32; 4]) -> Option<String> {",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              "serialize_attachment(&memories).ok()",
              "serialize_attachment(&memories, coverage).ok()",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''fn serialize_attachment(
              memories: &[FederatedAttachmentMemory],
          ) -> Result<String, serde_json::Error> {
              serde_json::to_string(&FederatedAttachment {
                  schema_version: FEDERATED_ATTACHMENT_SCHEMA_VERSION,
                  source: "explicit_federated_verified_memory",
                  memories,
              })
          }
          ''',
              '''fn serialize_attachment(
              memories: &[FederatedAttachmentMemory],
              coverage: [u32; 4],
          ) -> Result<String, serde_json::Error> {
              serde_json::to_string(&FederatedAttachment {
                  schema_version: FEDERATED_ATTACHMENT_SCHEMA_VERSION,
                  source: "explicit_federated_verified_memory",
                  coverage,
                  memories,
              })
          }
          ''',
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''fn federation_source_binding(
              thread_id: &str,
              turn_id: &str,
              workspace: &Path,
              query_sha256: &Sha256Digest,
              bindings: &[FederatedMemoryRevalidationBinding],
              content_sha256: &Sha256Digest,
          ) -> Option<Sha256Digest> {
              let serialized = serde_json::to_vec(bindings).ok()?;
          ''',
              '''fn federation_source_binding(
              thread_id: &str,
              turn_id: &str,
              workspace: &Path,
              query_sha256: &Sha256Digest,
              coverage: &[u32; 4],
              bindings: &[FederatedMemoryRevalidationBinding],
              content_sha256: &Sha256Digest,
          ) -> Option<Sha256Digest> {
              let serialized = serde_json::to_vec(bindings).ok()?;
              let serialized_coverage = serde_json::to_vec(coverage).ok()?;
          ''',
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''            query_sha256.as_str().as_bytes(),
              serialized.as_slice(),
              content_sha256.as_str().as_bytes(),
          ''',
              '''            query_sha256.as_str().as_bytes(),
              serialized_coverage.as_slice(),
              serialized.as_slice(),
              content_sha256.as_str().as_bytes(),
          ''',
          )

          # Product registry passes the runtime instead of extracting the legacy set.
          replace(
              "codex-rs/ext/hepta-memory/src/extension.rs",
              '''    if !matches!(&cognitive_runtime, CognitiveRuntime::Absent) {
              let federation = cognitive_runtime.federation().cloned();
              let cognitive = Arc::new(CognitiveExtension::new(cognitive_runtime));
              builder.turn_input_contributor(cognitive.clone());
              builder.tool_contributor(cognitive.clone());
              if let Some(federation) = federation {
                  let federated = Arc::new(FederatedCognitiveExtension::new(federation));
                  builder.turn_input_contributor(federated.clone());
                  builder.ephemeral_model_input_contributor(Arc::new(
                      CombinedCognitiveEphemeralContributor::new(cognitive, federated),
                  ));
              } else {
                  builder.ephemeral_model_input_contributor(cognitive);
              }
          }
          ''',
              '''    if !matches!(&cognitive_runtime, CognitiveRuntime::Absent) {
              let has_federation = cognitive_runtime.has_federation();
              let cognitive = Arc::new(CognitiveExtension::new(cognitive_runtime.clone()));
              builder.turn_input_contributor(cognitive.clone());
              builder.tool_contributor(cognitive.clone());
              if has_federation {
                  let federated = Arc::new(FederatedCognitiveExtension::from_runtime(
                      cognitive_runtime,
                  ));
                  builder.turn_input_contributor(federated.clone());
                  builder.ephemeral_model_input_contributor(Arc::new(
                      CombinedCognitiveEphemeralContributor::new(cognitive, federated),
                  ));
              } else {
                  builder.ephemeral_model_input_contributor(cognitive);
              }
          }
          ''',
          )

          # New runtime variant is still the same local store for cognitive tools.
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/tools.rs",
              "CognitiveRuntime::Available(_) | CognitiveRuntime::AvailableFederated { .. } => {}",
              "CognitiveRuntime::Available(_)\n                | CognitiveRuntime::AvailableFederated { .. }\n                | CognitiveRuntime::AvailableFederatedV2 { .. } => {}",
          )
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/tools.rs",
              '''            CognitiveRuntime::Available(store)
              | CognitiveRuntime::AvailableFederated { store, .. } => store,
          ''',
              '''            CognitiveRuntime::Available(store)
              | CognitiveRuntime::AvailableFederated { store, .. }
              | CognitiveRuntime::AvailableFederatedV2 { store, .. } => store,
          ''',
          )

          # Remove this one-shot branch workflow from the resulting code commit.
          Path(".github/workflows/memory-federation-v2-branch-hardening.yml").unlink()
          PY

      - name: Format touched Rust packages
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-memory-extension -p codex-hepta-agentd

      - name: Test memory federation contract
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory-federation --lib

      - name: Test memory owner integration
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory --lib

      - name: Test product memory extension
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory-extension --lib cognitive::federation

      - name: Check Agentd product composition
        working-directory: codex-rs
        run: cargo check -p codex-hepta-agentd

      - name: Verify diff whitespace
        run: git diff --check

      - name: Commit verified composition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "memory.federation: compose canonical v2 product path"
          git push origin HEAD:fix/memory-federation-v2-hardening
