name: Kernel authority dispatch materialization

on:
  push:
    branches:
      - work/kernel-authority-convergence-20260925
    paths:
      - '.github/scripts/kernel_authority_materialize_dispatch.py'
      - '.github/workflows/kernel-authority-materialize-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernel-authority-dispatch-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Materialize scoped source and governance changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/kernel_authority_materialize_dispatch.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet
          git diff --check

      - name: Verify the closed-world boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py -v
          python3 scripts/verify_hepta_callers.py

      - name: Verify contracts and Fleet regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts dispatch_binding_
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-fleet --lib authority_port::tests
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts -p codex-hepta-fleet \
            --lib --no-deps -- -D warnings

      - name: Commit native closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name kernel-authority-materializer
          git config user.email kernel-authority-materializer@users.noreply.github.com
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m 'fix(kernel-authority): seal one-shot general-lease dispatch'
          fi

      - name: Regenerate source-bound implementation projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate
          python3 scripts/hepta-implementation-maps.py sync-plasticity-status
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m 'docs(kernel-authority): rebind generated source projections'
          fi
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse 'HEAD^{tree}')"
          git diff --check

      - name: Fast-forward the reviewed branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:work/kernel-authority-convergence-20260925
