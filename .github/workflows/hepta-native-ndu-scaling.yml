name: Native NDU scaling quality research
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-ndu/research/native_stem_abcd/scaling/**'
      - '.github/workflows/hepta-native-ndu-scaling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scaling-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify source and execute full scaling experiment
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/codex-rs/hepta-ndu/research/native_stem_abcd"
          OUT="$RUNNER_TEMP/ndu-scaling"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/SOURCE_SHA.txt"
          python -m pip freeze > "$OUT/ENVIRONMENT.txt"
          for PART in . population nonquadratic continuous matrix_free scaling; do
            (cd "$ROOT/$PART" && python -m unittest -v) 2>&1 | tee "$OUT/tests-${PART//./root}.log"
          done
          python "$ROOT/scaling/run_scaling.py" sweep --out "$OUT/runs" 2>&1 | tee "$OUT/SWEEP.log"
          python "$ROOT/scaling/audit/verify.py" --source "$ROOT/scaling" --runs "$OUT/runs" --out "$OUT/audit" 2>&1 | tee "$OUT/AUDIT.log"
          NDU_R8_SOURCE="$ROOT/scaling" NDU_R8_RUNS="$OUT/runs" python "$ROOT/scaling/audit/test_tamper.py" 2>&1 | tee "$OUT/TAMPER.log"
      - name: Retain all results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-scaling-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndu-scaling
          if-no-files-found: error
          retention-days: 14
