name: hepta-v26-physical-pixel-deny-all
on:
  pull_request:
    paths:
      - "qualification/stem-cell-v1/v26_*.py"
      - "qualification/stem-cell-v1/test_v26_*.py"
      - "qualification/stem-cell-v1/STEM_V26_*"
      - ".github/workflows/hepta-stem-v26-original-pixel-lesion.yml"
  push:
    branches:
      - research/stem-v26-physical-vision-lesions-20261016
    paths:
      - "qualification/stem-cell-v1/v26_*.py"
      - "qualification/stem-cell-v1/test_v26_*.py"
      - "qualification/stem-cell-v1/STEM_V26_*"
      - ".github/workflows/hepta-stem-v26-original-pixel-lesion.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: stem-v26-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact-source fail-closed source-only tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install Pillow==11.3.0
          python -m pip check
          cd qualification/stem-cell-v1
          python -m py_compile v26_real_pixel_lesion.py v26_original_pixel_review.py test_v26_original_pixel_lesion.py
          for mode in ordinary optimized; do
            if test "$mode" = optimized; then python -O -m unittest -v test_v26_original_pixel_lesion.SourceOnly 2>&1 | tee "$RUNNER_TEMP/v26-$mode.log";
            else python -m unittest -v test_v26_original_pixel_lesion.SourceOnly 2>&1 | tee "$RUNNER_TEMP/v26-$mode.log"; fi
            grep -F 'Ran 22 tests' "$RUNNER_TEMP/v26-$mode.log"
            grep -x 'OK' "$RUNNER_TEMP/v26-$mode.log"
          done
          python -m py_compile test_v26_workflow_guard.py
          for mode in ordinary optimized; do
            if test "$mode" = optimized; then python -O -m unittest -v test_v26_workflow_guard.SourceOnly 2>&1 | tee "$RUNNER_TEMP/v26-workflow-guard-$mode.log";
            else python -m unittest -v test_v26_workflow_guard.SourceOnly 2>&1 | tee "$RUNNER_TEMP/v26-workflow-guard-$mode.log"; fi
            grep -F 'Ran 8 tests' "$RUNNER_TEMP/v26-workflow-guard-$mode.log"
            grep -x 'OK' "$RUNNER_TEMP/v26-workflow-guard-$mode.log"
          done
  physical-original-pixels:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.event_name == 'push'
    needs: source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONPATH: qualification/stem-cell-v1:exact-old-e3/experiments/shared_stem_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download byte-exact archived original predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11945106672/zip" > "$RUNNER_TEMP/e3-original.zip"
          echo "7807b82d6c747b0b13666b330145e3801a8c8a0aadeee3f2ff7ab5f5c8c00a30  $RUNNER_TEMP/e3-original.zip" | sha256sum -c -
      - name: Exact immutable original E3 reference source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/hepta-private-ci
          ref: b8b2f10fe38506972301e77e3836729a90200673
          path: exact-old-e3
          persist-credentials: false
      - name: Verify original E3 loader, stager and contract blobs
        run: |
          set -euo pipefail
          test "$(git -C exact-old-e3 rev-parse HEAD)" = b8b2f10fe38506972301e77e3836729a90200673
          old=exact-old-e3/experiments/shared_stem_cell
          test "$(git hash-object "$old/e3_scienceqa_stage.py")" = 3ca8f55ed6b7143729258e4a1e53693614460950
          test "$(git hash-object "$old/e3_scienceqa_contract.py")" = bd6d95ff957c3855b71a8778d7c13f61ff4d6a7a
          test "$(git hash-object "$old/e3_granite_dino_real.py")" = b99c99d8e13a4d1899a0597d7733753fb3ce092a
          test "$(git hash-object "$old/execution.py")" = 733da82a4bbbde1b256dfd1dbe4c05832dcd4856
      - name: Install pinned stock original CPU model runtime
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/original-model-venv"
          v="$RUNNER_TEMP/original-model-venv/bin"
          "$v/pip" install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          "$v/pip" install numpy==1.26.4 transformers==4.57.1 safetensors==0.6.2 huggingface-hub==0.35.3 tokenizers==0.22.1 datasets==3.6.0 pyarrow==19.0.1 Pillow==11.3.0 psutil==7.0.0 packaging==25.0
          "$v/pip" check
          "$v/python" -c 'from transformers import AutoImageProcessor,Dinov2Model; from datasets import load_dataset; from huggingface_hub import HfApi'
      - name: Re-acquire authentic source and label material
        run: |
          set -euo pipefail
          v="$RUNNER_TEMP/original-model-venv/bin"
          "$v/python" exact-old-e3/experiments/shared_stem_cell/e3_scienceqa_stage.py --output "$RUNNER_TEMP/e3-original-source"
          src="$RUNNER_TEMP/e3-original-source"
          echo "a561916c7d56b6677c5511c329a49bbeec94879f019d29f159ff59be83359202  $src/inputs/sources.jsonl" | sha256sum -c -
          echo "e8506bc65f96501b6b2fa4e4ae04c094c2b6b17b353de528a051136569e2849e  $src/inputs/fit_labels.jsonl" | sha256sum -c -
          echo "b15cb81cbce3ff500ec58bb7da59c92801170bbce3b7995d689342505161f6d3  $src/private_labels/test_labels.jsonl" | sha256sum -c -
      - name: Re-test with mandatory real original source archive
        run: |
          set -euo pipefail
          cd qualification/stem-cell-v1
          export HEPTA_V26_ORIGINAL_ZIP="$RUNNER_TEMP/e3-original.zip"
          v="$RUNNER_TEMP/original-model-venv/bin"
          "$v/python" -m unittest -v test_v26_original_pixel_lesion
          "$v/python" -O -m unittest -v test_v26_original_pixel_lesion
      - name: Execute actual original Granite and DINO forwards and pixel lesions
        run: |
          set -euo pipefail
          v="$RUNNER_TEMP/original-model-venv/bin"
          src="$RUNNER_TEMP/e3-original-source"
          "$v/python" qualification/stem-cell-v1/v26_real_pixel_lesion.py --archive "$RUNNER_TEMP/e3-original.zip" --source "$src/inputs/sources.jsonl" --fit-labels "$src/inputs/fit_labels.jsonl" --images "$src/images" --output "$RUNNER_TEMP/v26-private"
          test -s "$RUNNER_TEMP/v26-private/sealed-conditional-before-full-images.json"
          test -s "$RUNNER_TEMP/v26-private/sealed-interventions-before-labels.json"
      - name: Independently score only AFTER both immutable prediction seals
        run: |
          set -euo pipefail
          v="$RUNNER_TEMP/original-model-venv/bin"
          src="$RUNNER_TEMP/e3-original-source"
          "$v/python" qualification/stem-cell-v1/v26_original_pixel_review.py --archive "$RUNNER_TEMP/e3-original.zip" --source "$src/inputs/sources.jsonl" --held-labels "$src/private_labels/test_labels.jsonl" --images "$src/images" --model-output "$RUNNER_TEMP/v26-private" --output "$RUNNER_TEMP/v26-sanitized-review.json"
          "$v/python" -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"v26-sanitized-review.json").read_text()); assert d["real_pixel_interventions_executed"] is True and d["production_authorized"] is False and d["authority_posture"]=="DENY_ALL" and d["precommitted_selected_test_images"]==21'
      - name: Upload only sanitized aggregates, no media or private labels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v26-original-pixel-sanitized-${{ github.sha }}
          path: ${{ runner.temp }}/v26-sanitized-review.json
          if-no-files-found: error
