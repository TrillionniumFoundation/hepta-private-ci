name: Export exact secrets.heptabao source snapshot

on:
  push:
    branches:
      - codex/secrets-heptabao-production-closure-20260930
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-source:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build immutable source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/hepta-private-ci-${GITHUB_SHA}.tar.gz"
          tar --exclude=.git -czf "$archive" .
          sha256sum "$archive" | tee "${archive}.sha256"

      - name: Retain exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-private-ci-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/hepta-private-ci-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
