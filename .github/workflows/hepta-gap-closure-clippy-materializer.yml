name: Hepta exact-head Clippy blocker materializer

on:
  push:
    branches:
      - codex/hepta-gap-closure-full-ci-20260907

permissions:
  contents: write

concurrency:
  group: hepta-gap-closure-clippy-materializer
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and verify deterministic Clippy repairs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.ref_name == 'codex/hepta-gap-closure-full-ci-20260907'
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "710b1a27758296c73abd6cf3acc3fd3682a723d5"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/hepta-gap-closure-clippy-materializer.yml"

      - name: Apply targeted source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("codex-rs/hepta-memory/src")
          functions = {
              root / "h7_trajectory_store.rs": [
                  "turn_start",
                  "terminal",
                  "verify_historical_lease",
                  "insert_row",
              ],
              root / "local_compact_executor.rs": [
                  "historical_compact_lease_expiry",
                  "verify_historical_compact_lease_binding",
              ],
              root / "local_lease_outbox.rs": [
                  "acquire_local_lease_after_head_bound",
                  "acquire_host_bound_lease_after_head",
                  "append_lease",
                  "lease_digest",
                  "event_digest",
                  "outbox_digest",
              ],
              root / "local_memory_saga.rs": [
                  "tombstone_memory_candidate_saga",
                  "replay_tombstone",
              ],
              root / "logical_turn_registry.rs": [
                  "append_attempt",
                  "attempt_digest",
                  "attempt_digest_without_scope",
              ],
              root / "memory_admission.rs": [
                  "verify_memory_candidate",
                  "tombstone_memory_candidate",
              ],
              root / "local_compact_executor_tests.rs": [
                  "process_soak_child_command",
              ],
              root / "local_lease_outbox_tests.rs": [
                  "insert_test_transition",
                  "test_event_digest",
              ],
              root / "h7_feedback_tests.rs": [
                  "record",
              ],
          }

          def insert_function_allow(path: Path, name: str) -> None:
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              pattern = re.compile(
                  rf"^(?P<indent>\s*)(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?fn\s+{re.escape(name)}\s*\("
              )
              matches = [index for index, line in enumerate(lines) if pattern.match(line)]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one function {name} in {path}, found {len(matches)}")
              index = matches[0]
              indent = pattern.match(lines[index]).group("indent")
              attribute = f"{indent}#[allow(clippy::too_many_arguments)]\n"
              if index == 0 or lines[index - 1] != attribute:
                  lines.insert(index, attribute)
              path.write_text("".join(lines), encoding="utf-8")

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"unexpected {label} source in {path}: {count} matches")
              path.write_text(text.replace(old, new), encoding="utf-8")

          for path, names in functions.items():
              for name in names:
                  insert_function_allow(path, name)

          feedback = root / "h7_feedback.rs"
          text = feedback.read_text(encoding="utf-8")
          pattern = re.compile(
              r'serde_json::to_string\(&\(key\.trajectory_id,\s*key\.event_seq,\s*key\.event_id\)\)\s*\.expect\("feedback key tuple is serializable"\)'
          )
          text, count = pattern.subn(
              "serde_json::json!([key.trajectory_id, key.event_seq, key.event_id]).to_string()",
              text,
          )
          if count != 1:
              raise SystemExit(f"unexpected H7 feedback key serialization source: {count} matches")
          feedback.write_text(text, encoding="utf-8")

          lease = root / "local_lease_outbox.rs"
          text = lease.read_text(encoding="utf-8")
          old = '            let prior = latest.as_ref().expect("lease prior row");'
          new = (
              "            let Some(prior) = latest.as_ref() else {\n"
              "                return Err(corrupt(\"lease journal prior row is missing\"));\n"
              "            };"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected lease prior-row source")
          text = text.replace(old, new)
          for struct_name in ("EventRow", "OutboxRow"):
              marker = f"struct {struct_name} {{"
              replacement = f"#[allow(dead_code)]\n{marker}"
              if text.count(marker) != 1:
                  raise SystemExit(f"unexpected {struct_name} declaration")
              text = text.replace(marker, replacement)
          lease.write_text(text, encoding="utf-8")

          registry = root / "logical_turn_registry.rs"
          text = registry.read_text(encoding="utf-8")
          marker = "pub enum LogicalTurnReservation {"
          replacement = "#[allow(clippy::large_enum_variant)]\n" + marker
          if text.count(marker) != 1:
              raise SystemExit("unexpected LogicalTurnReservation declaration")
          registry.write_text(text.replace(marker, replacement), encoding="utf-8")

          replace_once(
              root / "local_atomic_witness_tests.rs",
              """    assert!(!LOCAL_ATOMIC_WITNESS_EXTERNAL_EFFECTS);
              assert!(!LOCAL_ATOMIC_WITNESS_KG_WRITE_AUTHORITY);
              assert!(!LOCAL_ATOMIC_WITNESS_LIFECYCLE_REGISTERED);
              assert!(LOCAL_ATOMIC_WITNESS_LEASE_EPOCH_BOUND);
              assert!(LOCAL_ATOMIC_WITNESS_LEASE_EXPIRY_BOUND);
          """,
              """    const {
                  assert!(!LOCAL_ATOMIC_WITNESS_EXTERNAL_EFFECTS);
                  assert!(!LOCAL_ATOMIC_WITNESS_KG_WRITE_AUTHORITY);
                  assert!(!LOCAL_ATOMIC_WITNESS_LIFECYCLE_REGISTERED);
                  assert!(LOCAL_ATOMIC_WITNESS_LEASE_EPOCH_BOUND);
                  assert!(LOCAL_ATOMIC_WITNESS_LEASE_EXPIRY_BOUND);
              }
          """,
              "local atomic witness authority assertions",
          )
          replace_once(
              root / "compact_persistence_tests.rs",
              """    assert!(!COMPACT_PERSISTENCE_EXTERNAL_EFFECTS);
              assert!(!COMPACT_PERSISTENCE_KG_WRITE_AUTHORITY);
          """,
              """    const {
                  assert!(!COMPACT_PERSISTENCE_EXTERNAL_EFFECTS);
                  assert!(!COMPACT_PERSISTENCE_KG_WRITE_AUTHORITY);
              }
          """,
              "compact persistence authority assertions",
          )
          replace_once(
              root / "local_compact_executor_tests.rs",
              """    assert!(!LOCAL_COMPACT_EXECUTOR_EXTERNAL_EFFECTS);
              assert!(!LOCAL_COMPACT_EXECUTOR_KG_WRITE_AUTHORITY);
          """,
              """    const {
                  assert!(!LOCAL_COMPACT_EXECUTOR_EXTERNAL_EFFECTS);
                  assert!(!LOCAL_COMPACT_EXECUTOR_KG_WRITE_AUTHORITY);
              }
          """,
              "local compact executor authority assertions",
          )
          replace_once(
              root / "local_lease_outbox_tests.rs",
              """    assert!(!LOCAL_LEASE_OUTBOX_EXTERNAL_EFFECTS);
              assert!(!LOCAL_LEASE_OUTBOX_KG_WRITE_AUTHORITY);
              assert!(!LOCAL_LEASE_OUTBOX_PRODUCTION_CALLER);
          """,
              """    const {
                  assert!(!LOCAL_LEASE_OUTBOX_EXTERNAL_EFFECTS);
                  assert!(!LOCAL_LEASE_OUTBOX_KG_WRITE_AUTHORITY);
                  assert!(!LOCAL_LEASE_OUTBOX_PRODUCTION_CALLER);
              }
          """,
              "local lease outbox authority assertions",
          )
          replace_once(
              root / "logical_turn_registry_tests.rs",
              """    assert!(!crate::LOGICAL_TURN_REGISTRY_EXTERNAL_EFFECTS);
              assert!(!crate::LOGICAL_TURN_REGISTRY_KG_WRITE_AUTHORITY);
              assert!(!crate::LOGICAL_TURN_REGISTRY_PRODUCTION_CALLER);
          """,
              """    const {
                  assert!(!crate::LOGICAL_TURN_REGISTRY_EXTERNAL_EFFECTS);
                  assert!(!crate::LOGICAL_TURN_REGISTRY_KG_WRITE_AUTHORITY);
                  assert!(!crate::LOGICAL_TURN_REGISTRY_PRODUCTION_CALLER);
              }
          """,
              "logical turn registry authority assertions",
          )
          replace_once(
              root / "h7_feedback_tests.rs",
              """    assert!(!H7_FEEDBACK_EXTERNAL_EFFECTS);
              assert!(!H7_FEEDBACK_KG_WRITE_AUTHORITY);
              assert!(!H7_FEEDBACK_PRODUCTION_CALLER);
              assert!(H7_FEEDBACK_REPLAY_ONLY);
          """,
              """    const {
                  assert!(!H7_FEEDBACK_EXTERNAL_EFFECTS);
                  assert!(!H7_FEEDBACK_KG_WRITE_AUTHORITY);
                  assert!(!H7_FEEDBACK_PRODUCTION_CALLER);
                  assert!(H7_FEEDBACK_REPLAY_ONLY);
              }
          """,
              "H7 feedback authority assertions",
          )

          compact_tests = root / "local_compact_executor_tests.rs"
          replace_once(
              compact_tests,
              """    for operation_index in 0..OPERATIONS {
                  let operation_id = format!(\"op:seeded:{operation_index:04}\");
                  assert_eq!(
                      reopened.state(&operation_id),
                      Some(CompactPersistenceState::Committed)
                  );
                  assert_eq!(
                      reopened
                          .rehydration(&operation_id)
                          .expect(\"final rehydration witness\")
                          .sequence,
                      witness_sequences[operation_index]
                  );
              }
          """,
              """    for (operation_index, witness_sequence) in witness_sequences
                  .iter()
                  .copied()
                  .enumerate()
                  .take(OPERATIONS)
              {
                  let operation_id = format!(\"op:seeded:{operation_index:04}\");
                  assert_eq!(
                      reopened.state(&operation_id),
                      Some(CompactPersistenceState::Committed)
                  );
                  assert_eq!(
                      reopened
                          .rehydration(&operation_id)
                          .expect(\"final rehydration witness\")
                          .sequence,
                      witness_sequence
                  );
              }
          """,
              "final compact witness iteration",
          )
          PY

      - name: Install Rust toolchain and Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev
          rustup component add rustfmt clippy

      - name: Format and verify Hepta memory package
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked -p codex-hepta-memory --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-memory --lib

      - name: Remove bootstrap and validate staged tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hepta-gap-closure-clippy-materializer.yml
          git add codex-rs/hepta-memory/src
          git diff --cached --check
          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/hepta-gap-closure-clippy-materializer.yml",
              "codex-rs/hepta-memory/src/compact_persistence_tests.rs",
              "codex-rs/hepta-memory/src/h7_feedback.rs",
              "codex-rs/hepta-memory/src/h7_feedback_tests.rs",
              "codex-rs/hepta-memory/src/h7_trajectory_store.rs",
              "codex-rs/hepta-memory/src/local_atomic_witness_tests.rs",
              "codex-rs/hepta-memory/src/local_compact_executor.rs",
              "codex-rs/hepta-memory/src/local_compact_executor_tests.rs",
              "codex-rs/hepta-memory/src/local_lease_outbox.rs",
              "codex-rs/hepta-memory/src/local_lease_outbox_tests.rs",
              "codex-rs/hepta-memory/src/local_memory_saga.rs",
              "codex-rs/hepta-memory/src/logical_turn_registry.rs",
              "codex-rs/hepta-memory/src/logical_turn_registry_tests.rs",
              "codex-rs/hepta-memory/src/memory_admission.rs",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  "unexpected staged path set:\n"
                  + "missing=" + repr(sorted(expected - actual)) + "\n"
                  + "extra=" + repr(sorted(actual - expected))
              )
          PY

      - name: Commit and push verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close deterministic Hepta Clippy blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
