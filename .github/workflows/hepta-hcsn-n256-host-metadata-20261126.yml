name: HCSN N256 fixed-host metadata

on:
  push:
    branches:
      - "fix/hcsn-n256-host-metadata-20261126-0198a7"
    paths:
      - "qualification/hcsn_ci_readbacks/engineering_repairs_20261126_0198a7/n256_host_profile/**"
      - ".github/workflows/hepta-hcsn-n256-host-metadata-20261126.yml"

permissions:
  contents: read

concurrency:
  group: hcsn-n256-host-metadata-20261126-0198a7-01
  cancel-in-progress: false

jobs:
  metadata-once:
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.3"
      - name: Install exact metadata-visible wheels
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          -r qualification/hcsn_ci_readbacks/engineering_repairs_20261126_0198a7/n256_host_profile/requirements.txt
      - name: Observe one host and run five host-negative controls
        run: >-
          python -I -B qualification/hcsn_ci_readbacks/engineering_repairs_20261126_0198a7/n256_host_profile/run_profile.py
          --output "$RUNNER_TEMP/hcsn-n256-host-metadata-20261126-0198a7-01"
      - name: Preserve original success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-host-metadata-20261126-0198a7-01-${{ github.run_id }}
          path: ${{ runner.temp }}/hcsn-n256-host-metadata-20261126-0198a7-01
          if-no-files-found: error
          retention-days: 30
