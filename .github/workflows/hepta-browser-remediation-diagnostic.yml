name: Hepta Browser remediation diagnostic

on:
  push:
    branches:
      - codex/browser-servo-full-convergence-20260927
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-browser-remediation-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentd-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
          rustc -vV
          cargo -vV

      - name: Run exact Agentd Browser tests with retained output
        working-directory: codex-rs
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-remediation-diagnostic"
          cargo test --locked -p codex-hepta-agentd browser_servo --lib -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/browser-remediation-diagnostic/cargo-test-browser-servo-lib.log"
          cargo test --locked -p codex-hepta-agentd --bin hepta-agentd-browser-service -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/browser-remediation-diagnostic/cargo-test-browser-service.log"

      - name: Upload Agentd diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-remediation-agentd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-remediation-diagnostic
          if-no-files-found: warn
          retention-days: 14

  sandbox-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install and enable Bubblewrap prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap build-essential util-linux
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          prlimit --version | head -n 1

      - name: Run exact production sandbox probe with retained stderr
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-remediation-diagnostic"
          node apps/hepta-browser/scripts/linux-sandbox-probe.js \
            2> >(tee "$RUNNER_TEMP/browser-remediation-diagnostic/linux-sandbox-probe.stderr" >&2) \
            | tee "$RUNNER_TEMP/browser-remediation-diagnostic/linux-sandbox-probe.json"

      - name: Upload sandbox diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-remediation-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-remediation-diagnostic
          if-no-files-found: warn
          retention-days: 14
