name: Hepta diagnostic source export

on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/hepta-diagnostic-source-export.yml]

permissions:
  contents: read

concurrency:
  group: hepta-diagnostic-source-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    name: Export exact tracked source (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact checkout without executing or modifying source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-identity.txt"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/source-manifest.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          cd "$RUNNER_TEMP"
          sha256sum source.tar.gz source-manifest.txt source-identity.txt > source.sha256
      - name: Retain diagnostic snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-source-snapshot-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-manifest.txt
            ${{ runner.temp }}/source-identity.txt
            ${{ runner.temp }}/source.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Package pinned offline formatter (tooling only)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          formatter=$(rustup which --toolchain 1.95.0 rustfmt)
          toolchain=$(dirname "$(dirname "$formatter")")
          tar -C "$toolchain" -czf "$RUNNER_TEMP/formatter.tar.gz" bin/rustfmt lib
          cd "$RUNNER_TEMP"
          sha256sum formatter.tar.gz > formatter.sha256
      - name: Retain pinned formatter
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-offline-formatter-1.95.0
          path: |
            ${{ runner.temp }}/formatter.tar.gz
            ${{ runner.temp }}/formatter.sha256
          if-no-files-found: error
          retention-days: 1
