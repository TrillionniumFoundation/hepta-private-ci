name: Hepta diagnostic source export

on:
  pull_request:
    branches: [work/ui-rust-scifi-audit-20261002]
    paths:
      - apps/hepta-native/src/ui.rs
      - apps/hepta-native/src/ui/**
      - apps/hepta-native/src/chat_runtime*.rs
      - apps/hepta-native/src/main*.rs
      - apps/hepta-native/src/launch_config.rs
      - apps/hepta-ui-shared/**
      - .github/workflows/hepta-diagnostic-source-export.yml
  workflow_dispatch:
    inputs:
      native_chat_only:
        description: Run only Linux native chat fixtures and rendered screenshots
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hepta-diagnostic-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-exact-source:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_chat_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Export immutable source snapshot
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          archive="$RUNNER_TEMP/hepta-source-$EXPECTED_SHA.tar.gz"
          tar --exclude=.git --exclude=.hepta-evidence --exclude=.hepta-diagnostics -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Retain diagnostic snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-diagnostic-source-${{ github.sha }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  rust-policy-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_chat_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582

      - name: Install cargo-shear
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-shear@1.11.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-deny@0.19.0

      - name: Capture policy diagnostics
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .hepta-diagnostics
          set +e
          (cd codex-rs && cargo shear --deny-warnings) > .hepta-diagnostics/cargo-shear.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/cargo-shear.exit
          cargo deny --log-level warn --manifest-path ./codex-rs/Cargo.toml --all-features check > .hepta-diagnostics/cargo-deny.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/cargo-deny.exit
          cargo metadata --manifest-path ./codex-rs/Cargo.toml --locked --format-version 1 --no-deps > .hepta-diagnostics/cargo-metadata.json 2> .hepta-diagnostics/cargo-metadata.stderr
          printf '%s\n' "$?" > .hepta-diagnostics/cargo-metadata.exit
          set -e
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Retain Rust policy diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-rust-policy-diagnostics-${{ github.sha }}
          path: .hepta-diagnostics
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  bazel-lock-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_chat_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: diagnostic-lock

      - name: Generate exact Bazel lock candidate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .hepta-diagnostics
          set +e
          ./scripts/check-module-bazel-lock.sh > .hepta-diagnostics/bazel-lock-before.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/bazel-lock-before.exit
          just bazel-lock-update > .hepta-diagnostics/bazel-lock-update.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/bazel-lock-update.exit
          ./scripts/check-module-bazel-lock.sh > .hepta-diagnostics/bazel-lock-after.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/bazel-lock-after.exit
          git diff --stat -- MODULE.bazel.lock > .hepta-diagnostics/MODULE.bazel.lock.stat
          git diff --numstat -- MODULE.bazel.lock > .hepta-diagnostics/MODULE.bazel.lock.numstat
          cp MODULE.bazel.lock .hepta-diagnostics/MODULE.bazel.lock
          set -e

      - name: Retain Bazel lock diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-bazel-lock-diagnostics-${{ github.sha }}
          path: .hepta-diagnostics
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  python-sdk-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_chat_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Run Python SDK on hosted Linux
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .hepta-diagnostics
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/codex-python-sdk-home \
            -e UV_LINK_MODE=copy \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}/sdk/python" \
            python:3.12-slim \
            sh -euxc '
              python -m venv /tmp/uv
              /tmp/uv/bin/python -m pip install uv==0.11.3
              /tmp/uv/bin/uv sync --group dev --frozen
              /tmp/uv/bin/uv run --frozen --no-sync ruff check --output-format=github .
              /tmp/uv/bin/uv run --frozen --no-sync ruff format --check .
              /tmp/uv/bin/uv run --frozen --no-sync pytest
            ' > .hepta-diagnostics/python-sdk.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/python-sdk.exit
          set -e

      - name: Retain Python SDK diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-python-sdk-diagnostics-${{ github.sha }}
          path: .hepta-diagnostics
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  python-format-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_chat_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Produce repository-pinned Ruff formatting candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          uv run --frozen --project scripts ruff format scripts
          mkdir -p .hepta-diagnostics/formatted-scripts
          for path in \
            scripts/hepta-algorithm-docs.py \
            scripts/hepta-docs.py \
            scripts/hepta-hnmf.py \
            scripts/hepta-module-docs.py \
            scripts/hepta-repository-integrity.py; do
            install -D -m 0644 "$path" ".hepta-diagnostics/formatted-scripts/$path"
          done
          tar -C .hepta-diagnostics/formatted-scripts -czf .hepta-diagnostics/formatted-scripts.tar.gz scripts
          git diff --check
          git diff --stat -- scripts > .hepta-diagnostics/formatted-scripts.stat

      - name: Retain formatter candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-python-format-candidate-${{ github.sha }}
          path: |
            .hepta-diagnostics/formatted-scripts.tar.gz
            .hepta-diagnostics/formatted-scripts.stat
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  native-chat-render-diagnostics:
    if: ${{ github.event_name == 'pull_request' || inputs.native_chat_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Configure fixture paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/native-chat-target" >> "$GITHUB_ENV"
          echo "HEPTA_NATIVE_SCREENSHOT_DIR=$RUNNER_TEMP/native-chat-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146
      - name: Install fixture-only Linux rendering prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libssl-dev xvfb xauth python3-pil
      - name: Verify exact source and UI-only fixtures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$HEPTA_NATIVE_SCREENSHOT_DIR"
          git show --no-patch --format='commit=%H%ntree=%T%nsubject=%s' HEAD > "$HEPTA_NATIVE_SCREENSHOT_DIR/source.txt"
          just test --manifest-path ../apps/hepta-native/Cargo.toml --locked --lib --bin hepta-native -E 'test(ui::) | test(chat_runtime::) | test(main_bootstrap)' 2>&1 | tee "$HEPTA_NATIVE_SCREENSHOT_DIR/tests.log"
      - name: Render disconnected and local-fixture chat layouts
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1400x1000x24' just test --manifest-path ../apps/hepta-native/Cargo.toml --locked --lib --run-ignored ignored-only -E 'test(capture_chat_first_screens)' 2>&1 | tee "$HEPTA_NATIVE_SCREENSHOT_DIR/render.log"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          from PIL import Image
          root = Path(os.environ["HEPTA_NATIVE_SCREENSHOT_DIR"])
          captures = []
          for path in sorted(root.glob("*.ppm")):
              image = Image.open(path)
              image.save(path.with_suffix(".png"))
              captures.append({"file": path.with_suffix(".png").name, "size": image.size})
          assert captures, "No rendered native screenshots"
          (root / "manifest.json").write_text(json.dumps({"fixture": True, "liveAccounts": False, "nativeSecurityQualification": False, "installedAcceptance": False, "captures": captures}, indent=2))
          PYCODE
          git diff --exit-code
      - name: Retain native chat render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-chat-render-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/native-chat-evidence
          if-no-files-found: error
          retention-days: 7
