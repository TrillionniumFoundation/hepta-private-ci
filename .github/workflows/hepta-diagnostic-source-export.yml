name: Hepta diagnostic source export

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
    inputs:
      rust_toolchain_locks:
        description: Generate source-bound Rust compiler lock candidates only
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rust_toolchain_locks:
        description: Generate source-bound Rust compiler lock candidates only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hepta-diagnostic-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-exact-source:
    if: ${{ !inputs.rust_toolchain_locks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Export immutable source snapshot
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          archive="$RUNNER_TEMP/hepta-source-$EXPECTED_SHA.tar.gz"
          tar --exclude=.git --exclude=.hepta-evidence --exclude=.hepta-diagnostics -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Retain diagnostic snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-diagnostic-source-${{ github.sha }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  rust-policy-diagnostics:
    if: ${{ !inputs.rust_toolchain_locks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # Explicit toolchain input
        with:
          toolchain: "1.99.0"

      - name: Install cargo-shear
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-shear@1.11.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-deny@0.19.0

      - name: Capture policy diagnostics
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .hepta-diagnostics
          set +e
          (cd codex-rs && cargo shear --deny-warnings) > .hepta-diagnostics/cargo-shear.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/cargo-shear.exit
          cargo deny --log-level warn --manifest-path ./codex-rs/Cargo.toml --all-features check > .hepta-diagnostics/cargo-deny.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/cargo-deny.exit
          cargo metadata --manifest-path ./codex-rs/Cargo.toml --locked --format-version 1 --no-deps > .hepta-diagnostics/cargo-metadata.json 2> .hepta-diagnostics/cargo-metadata.stderr
          printf '%s\n' "$?" > .hepta-diagnostics/cargo-metadata.exit
          set -e
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Retain Rust policy diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-rust-policy-diagnostics-${{ github.sha }}
          path: .hepta-diagnostics
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  bazel-lock-diagnostics:
    if: ${{ !inputs.rust_toolchain_locks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: diagnostic-lock

      - name: Generate exact Bazel lock candidate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .hepta-diagnostics
          set +e
          ./scripts/check-module-bazel-lock.sh > .hepta-diagnostics/bazel-lock-before.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/bazel-lock-before.exit
          just bazel-lock-update > .hepta-diagnostics/bazel-lock-update.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/bazel-lock-update.exit
          ./scripts/check-module-bazel-lock.sh > .hepta-diagnostics/bazel-lock-after.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/bazel-lock-after.exit
          git diff --stat -- MODULE.bazel.lock > .hepta-diagnostics/MODULE.bazel.lock.stat
          git diff --numstat -- MODULE.bazel.lock > .hepta-diagnostics/MODULE.bazel.lock.numstat
          cp MODULE.bazel.lock .hepta-diagnostics/MODULE.bazel.lock
          set -e

      - name: Retain Bazel lock diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-bazel-lock-diagnostics-${{ github.sha }}
          path: .hepta-diagnostics
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  python-sdk-diagnostics:
    if: ${{ !inputs.rust_toolchain_locks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Run Python SDK on hosted Linux
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .hepta-diagnostics
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/codex-python-sdk-home \
            -e UV_LINK_MODE=copy \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}/sdk/python" \
            python:3.12-slim \
            sh -euxc '
              python -m venv /tmp/uv
              /tmp/uv/bin/python -m pip install uv==0.11.3
              /tmp/uv/bin/uv sync --group dev --frozen
              /tmp/uv/bin/uv run --frozen --no-sync ruff check --output-format=github .
              /tmp/uv/bin/uv run --frozen --no-sync ruff format --check .
              /tmp/uv/bin/uv run --frozen --no-sync pytest
            ' > .hepta-diagnostics/python-sdk.log 2>&1
          printf '%s\n' "$?" > .hepta-diagnostics/python-sdk.exit
          set -e

      - name: Retain Python SDK diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-python-sdk-diagnostics-${{ github.sha }}
          path: .hepta-diagnostics
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  python-format-candidate:
    if: ${{ !inputs.rust_toolchain_locks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Produce repository-pinned Ruff formatting candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          uv run --frozen --project scripts ruff format scripts
          mkdir -p .hepta-diagnostics/formatted-scripts
          for path in \
            scripts/hepta-algorithm-docs.py \
            scripts/hepta-docs.py \
            scripts/hepta-hnmf.py \
            scripts/hepta-module-docs.py \
            scripts/hepta-repository-integrity.py; do
            install -D -m 0644 "$path" ".hepta-diagnostics/formatted-scripts/$path"
          done
          tar -C .hepta-diagnostics/formatted-scripts -czf .hepta-diagnostics/formatted-scripts.tar.gz scripts
          git diff --check
          git diff --stat -- scripts > .hepta-diagnostics/formatted-scripts.stat

      - name: Retain formatter candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-python-format-candidate-${{ github.sha }}
          path: |
            .hepta-diagnostics/formatted-scripts.tar.gz
            .hepta-diagnostics/formatted-scripts.stat
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  rust-toolchain-locks:
    if: inputs.rust_toolchain_locks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
      - name: Record exact input source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/rust-toolchain-locks"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/rust-toolchain-locks/source.txt"
          cp MODULE.bazel.lock "$RUNNER_TEMP/rust-toolchain-locks/MODULE.bazel.lock.before"
          cp flake.lock "$RUNNER_TEMP/rust-toolchain-locks/flake.lock.before"
      - name: Generate Bazel lock with the repository's pinned Bazel
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run_bazel_with_buildbuddy.py mod deps --lockfile_mode=update
          python3 .github/scripts/run_bazel_with_buildbuddy.py mod deps --lockfile_mode=error
      - name: Install official Nix without a daemon or credential configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            https://releases.nixos.org/nix/nix-2.35.2/install \
            --output "$RUNNER_TEMP/nix-install"
          sh "$RUNNER_TEMP/nix-install" --no-daemon --yes --no-channel-add
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Refresh only the Rust overlay input and evaluate all Nix systems
        shell: bash
        run: |
          set -euo pipefail
          nix flake update rust-overlay
          for system in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin; do
            nix eval --no-write-lock-file --raw ".#packages.${system}.codex-rs.drvPath"
            nix eval --no-write-lock-file --raw ".#devShells.${system}.default.drvPath"
          done
      - name: Verify official Rust archive hashes and bind generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rust-toolchain-locks"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            https://static.rust-lang.org/dist/channel-rust-1.99.0.toml \
            --output "$output/channel-rust-1.99.0.toml"
          python3 .github/scripts/verify_rust_toolchain_locks.py "$output"
          cp MODULE.bazel.lock flake.lock "$output/"
          git diff --binary -- MODULE.bazel.lock flake.lock > "$output/generated-locks.patch"
          (cd "$output" && sha256sum MODULE.bazel.lock flake.lock MODULE.bazel.lock.before flake.lock.before generated-locks.patch source.txt receipt.json channel-rust-1.99.0.toml > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-toolchain-locks-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-toolchain-locks/
          if-no-files-found: error
          retention-days: 7
