name: Hepta diagnostic source export

on:
  workflow_dispatch:
  push:
    branches: [codex/stable-trunk-convergence-20260915]
    paths: [.github/workflows/hepta-diagnostic-source-export.yml]

permissions:
  contents: read

concurrency:
  group: hepta-diagnostic-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-cache:
    name: Export locked dependency sources (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch pinned dependency sources
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked > "$RUNNER_TEMP/cargo-fetch.log" 2>&1
      - name: Package only dependency sources and checksums
        shell: bash
        run: |
          set -euo pipefail
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          tar -C "$cargo_home" -czf "$RUNNER_TEMP/cache.tar.gz" registry git
          cd "$RUNNER_TEMP"
          split --bytes=300M --numeric-suffixes=0 --suffix-length=2 cache.tar.gz cache.part-
          sha256sum cache.tar.gz cache.part-* > cache.sha256
          git -C "$GITHUB_WORKSPACE" diff --exit-code
      - name: Retain dependency cache first part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-offline-cache-part-00-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cache.part-00
            ${{ runner.temp }}/cache.sha256
            ${{ runner.temp }}/cargo-fetch.log
          if-no-files-found: error
          retention-days: 1
      - name: Retain dependency cache second part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-offline-cache-part-01-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cache.part-01
            ${{ runner.temp }}/cache.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Retain dependency cache overflow part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-offline-cache-part-02-${{ github.sha }}
          path: ${{ runner.temp }}/cache.part-02
          if-no-files-found: ignore
          retention-days: 1
