name: Hepta SELECT content validation with fixed saved Readers
on:
  push:
    branches: ["research/five-causal-experiments-20261013"]
    paths:
      - "scripts/memory_cell/select_content_inventory.py"
      - "scripts/memory_cell/select_content_validation_trial.py"
      - "scripts/memory_cell/test_select_content_inventory.py"
      - ".github/workflows/hepta-select-content-validation.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: select-content-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixed-select-inventory-and-saved-reader:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate new inventory without model dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-select-content/source/memory_cell
          python3 -m unittest discover -s scripts/memory_cell -p test_select_content_inventory.py -v 2>&1 | tee /tmp/hepta-select-content/inventory-tests.log
          python3 -m py_compile scripts/memory_cell/select_content_inventory.py scripts/memory_cell/select_content_validation_trial.py scripts/memory_cell/test_select_content_inventory.py
      - name: Install existing pinned official model environment
        run: |
          set -euo pipefail
          python3 -m venv /tmp/hepta-select-env
          /tmp/hepta-select-env/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu > /tmp/hepta-select-content/install-torch.log 2>&1
          /tmp/hepta-select-env/bin/pip install -r scripts/memory_cell/requirements.txt packaging==25.0 cryptography==46.0.4 psutil==7.0.0 regex==2024.11.6 Jinja2==3.1.6 > /tmp/hepta-select-content/install-worker.log 2>&1
          /tmp/hepta-select-env/bin/pip check | tee /tmp/hepta-select-content/pip-check.log
          /tmp/hepta-select-env/bin/pip freeze > /tmp/hepta-select-content/environment.txt
      - name: Require inherited contracts before any pretrained model execution
        run: |
          set -euo pipefail
          failed=0
          for pattern in test_full_cell_matrix.py test_five_causal_experiments.py test_five_causal_native.py 'test_five_group*.py' test_five_reader_response.py 'test_five_reader_adapter*.py' test_five_encoder_snapshot.py test_five_reader_evidence_pairs.py 'test_source_time_evidence*.py' test_reader_fit_audit.py 'test_assistant_projection*.py' test_reader_content_swap.py; do
            name=$(printf '%s' "$pattern" | tr '*' '_')
            if /tmp/hepta-select-env/bin/python -m unittest discover -s scripts/memory_cell -p "$pattern" -v 2>&1 | tee "/tmp/hepta-select-content/$name.log"; then
              printf '%s\tpassed\n' "$pattern" >> /tmp/hepta-select-content/suites.tsv
            else
              failed=1
              printf '%s\tfailed\n' "$pattern" >> /tmp/hepta-select-content/suites.tsv
            fi
          done
          test "$failed" -eq 0
      - name: Retrieve exactly pinned original material and saved budget results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip > /tmp/select-original.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11838105827/zip > /tmp/select-budget.zip
          printf '%s  %s\n' 07b357cbb3362f4afa4dc1872ab7e28e8a46daaf338f2636fed8d40fbcee76af /tmp/select-original.zip | sha256sum -c -
          printf '%s  %s\n' ce5178bf4bea0d45d65f22765e29a835b7a99a4b3a4fd1dc4fa0d248a6d5c151 /tmp/select-budget.zip | sha256sum -c -
      - name: Seal complete SELECT donor inventory then replay three fixed saved Readers
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/hepta-select-content/process-resources.txt /tmp/hepta-select-env/bin/python scripts/memory_cell/select_content_validation_trial.py --original-archive /tmp/select-original.zip --budget-archive /tmp/select-budget.zip --work /tmp/hepta-select-materials --output /tmp/hepta-select-content/study 2>&1 | tee /tmp/hepta-select-content/execution.log
      - name: Preserve exact source and all failures without original model bytes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-select-content/source/memory_cell
          git rev-parse HEAD > /tmp/hepta-select-content/source/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/hepta-select-content/source/tested-tree.txt
          cp scripts/memory_cell/*.py scripts/memory_cell/requirements.txt /tmp/hepta-select-content/source/memory_cell/
          cp experiments/shared_stem_cell/execution.py .github/workflows/hepta-select-content-validation.yml /tmp/hepta-select-content/source/
          (cd /tmp/hepta-select-content && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-select-content-development-not-confirmation
          path: /tmp/hepta-select-content
          if-no-files-found: error
