name: learning.operator required qualification

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: learning-operator-required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  exact-source:
    name: learning.operator exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned qualification tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103,cargo-llvm-cov@0.9.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,llvm-tools-preview

      - name: Bind exact commit and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          printf 'source=%s\ntree=%s\n' "${SOURCE_SHA}" "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 -m py_compile \
            scripts/hepta-learning-operator-map.py \
            scripts/hepta-learning-operator-mutation.py \
            scripts/hepta-learning-operator-receipt.py

      - name: Exact-source compile, final-use, shadow, revocation and rollback tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/learning-operator
          {
            cargo check --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator \
              -p codex-hepta-agentd \
              -p codex-hepta-shadow-qualification \
              --all-targets
            cargo check --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator \
              --all-targets --features compatibility-api
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator --features compatibility-api
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-agentd --test terminal_cell_owner \
              real_owner_decision_outcome_freeze_fit_registry_reload_and_withdrawal \
              -- --exact --test-threads=1
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-agentd --test terminal_cell_owner \
              clean_agent_recall_replay_training_load_and_source_withdrawal \
              -- --exact --test-threads=1
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-shadow-qualification --test lane_e_api_contract \
              -- --test-threads=1
            cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator \
              -p codex-hepta-agentd \
              -p codex-hepta-shadow-qualification \
              --all-targets -- -D warnings
            cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator \
              --all-targets --features compatibility-api -- -D warnings
            cargo fmt --manifest-path codex-rs/Cargo.toml \
              --package codex-hepta-bellman-operator \
              --package codex-hepta-agentd \
              --package codex-hepta-shadow-qualification \
              -- --check
          } 2>&1 | tee .hepta-evidence/learning-operator/exact-source-tests.log
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Independent operator coverage floor
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator \
            --all-targets \
            --fail-under-lines 85 \
            --json \
            --output-path .hepta-evidence/learning-operator/coverage.json

      - name: Kill all required safety mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-learning-operator-mutation.py \
            --output .hepta-evidence/learning-operator/mutation.json
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Measure bounded scale and enforce runaway guards
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator --release \
            --example qualification_performance -- \
            .hepta-evidence/learning-operator/performance.json

      - name: Refresh exact-source implementation map
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-learning-operator-map.py emit \
            --mode exact-source \
            --source-sha "${SOURCE_SHA}" \
            --base-sha "${BASE_SHA:-}" \
            --candidate-sha "${SOURCE_SHA}" \
            --candidate-tree "${TREE}" \
            --output .hepta-evidence/learning-operator/implementation-map-exact.json
          python3 scripts/hepta-learning-operator-map.py verify \
            .hepta-evidence/learning-operator/implementation-map-exact.json

      - name: Emit exact-source immutable receipt
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-learning-operator-receipt.py emit \
            --mode exact-source \
            --source-sha "${SOURCE_SHA}" \
            --candidate-sha "${SOURCE_SHA}" \
            --candidate-tree "${TREE}" \
            --base-sha "${BASE_SHA:-}" \
            --coverage .hepta-evidence/learning-operator/coverage.json \
            --mutation .hepta-evidence/learning-operator/mutation.json \
            --performance .hepta-evidence/learning-operator/performance.json \
            --implementation-map .hepta-evidence/learning-operator/implementation-map-exact.json \
            --test-log .hepta-evidence/learning-operator/exact-source-tests.log \
            --output .hepta-evidence/learning-operator/exact-source.json
          python3 scripts/hepta-learning-operator-receipt.py verify \
            .hepta-evidence/learning-operator/exact-source.json

      - name: Retain exact-source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: learning-operator-exact-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/learning-operator/
          if-no-files-found: error
          retention-days: 30

  synthetic-merge:
    name: learning.operator deterministic merge
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned qualification tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Materialize deterministic ordered-parent merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "${SOURCE_COMMIT}" = "${SOURCE_SHA}"
          BASE_COMMIT="${BASE_SHA:-}"
          if [[ -z "${BASE_COMMIT}" ]] \
             || [[ "${BASE_COMMIT}" = "0000000000000000000000000000000000000000" ]] \
             || ! git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            BASE_COMMIT="$(git rev-parse "${SOURCE_COMMIT}^1")"
          fi
          git checkout --detach "${BASE_COMMIT}"
          git -c user.name=hepta-learning-operator-ci \
            -c user.email=hepta-learning-operator-ci@users.noreply.github.com \
            merge --no-commit --no-ff "${SOURCE_COMMIT}"
          MERGE_TREE="$(git write-tree)"
          MERGE_COMMIT="$(printf '%s\n' 'learning.operator deterministic qualification merge' | \
            git -c user.name=hepta-learning-operator-ci \
              -c user.email=hepta-learning-operator-ci@users.noreply.github.com \
              commit-tree "${MERGE_TREE}" -p "${BASE_COMMIT}" -p "${SOURCE_COMMIT}")"
          test "$(git rev-parse "${MERGE_COMMIT}^1")" = "${BASE_COMMIT}"
          test "$(git rev-parse "${MERGE_COMMIT}^2")" = "${SOURCE_COMMIT}"
          test "$(git rev-parse "${MERGE_COMMIT}^{tree}")" = "${MERGE_TREE}"
          {
            printf 'BASE_COMMIT=%s\n' "${BASE_COMMIT}"
            printf 'MERGE_COMMIT=%s\n' "${MERGE_COMMIT}"
            printf 'MERGE_TREE=%s\n' "${MERGE_TREE}"
          } >> "${GITHUB_ENV}"
          git diff --cached --check
          git diff --exit-code

      - name: Compile and test deterministic merge candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/learning-operator
          {
            cargo check --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator \
              -p codex-hepta-agentd \
              -p codex-hepta-shadow-qualification \
              --all-targets
            cargo check --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator \
              --all-targets --features compatibility-api
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-agentd --test terminal_cell_owner \
              real_owner_decision_outcome_freeze_fit_registry_reload_and_withdrawal \
              -- --exact --test-threads=1
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-shadow-qualification --test lane_e_api_contract \
              -- --test-threads=1
            cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator \
              -p codex-hepta-agentd \
              -p codex-hepta-shadow-qualification \
              --all-targets -- -D warnings
            cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator \
              --all-targets --features compatibility-api -- -D warnings
            cargo fmt --manifest-path codex-rs/Cargo.toml \
              --package codex-hepta-bellman-operator \
              --package codex-hepta-agentd \
              --package codex-hepta-shadow-qualification \
              -- --check
          } 2>&1 | tee .hepta-evidence/learning-operator/synthetic-merge-tests.log
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = "${MERGE_TREE}"

      - name: Refresh deterministic-merge implementation map
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-learning-operator-map.py emit \
            --mode synthetic-merge \
            --source-sha "${SOURCE_SHA}" \
            --base-sha "${BASE_COMMIT}" \
            --candidate-sha "${MERGE_COMMIT}" \
            --candidate-tree "${MERGE_TREE}" \
            --output .hepta-evidence/learning-operator/implementation-map-merge.json
          python3 scripts/hepta-learning-operator-map.py verify \
            .hepta-evidence/learning-operator/implementation-map-merge.json

      - name: Emit deterministic-merge immutable receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-learning-operator-receipt.py emit \
            --mode synthetic-merge \
            --source-sha "${SOURCE_SHA}" \
            --base-sha "${BASE_COMMIT}" \
            --candidate-sha "${MERGE_COMMIT}" \
            --candidate-tree "${MERGE_TREE}" \
            --implementation-map .hepta-evidence/learning-operator/implementation-map-merge.json \
            --test-log .hepta-evidence/learning-operator/synthetic-merge-tests.log \
            --output .hepta-evidence/learning-operator/synthetic-merge.json
          python3 scripts/hepta-learning-operator-receipt.py verify \
            .hepta-evidence/learning-operator/synthetic-merge.json

      - name: Retain deterministic-merge evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: learning-operator-merge-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/learning-operator/
          if-no-files-found: error
          retention-days: 30

  required:
    name: learning.operator qualification required
    if: ${{ always() }}
    needs:
      - exact-source
      - synthetic-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject failed, cancelled or skipped qualification lanes
        env:
          EXACT_RESULT: ${{ needs.exact-source.result }}
          MERGE_RESULT: ${{ needs.synthetic-merge.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${EXACT_RESULT}" = success
          test "${MERGE_RESULT}" = success

      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download both qualification receipts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: learning-operator-*-${{ env.SOURCE_SHA }}
          path: .
          merge-multiple: true

      - name: Build single readiness receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-learning-operator-receipt.py combine \
            --exact .hepta-evidence/learning-operator/exact-source.json \
            --synthetic .hepta-evidence/learning-operator/synthetic-merge.json \
            --output .hepta-evidence/learning-operator/qualification-set.json
          test -s .hepta-evidence/learning-operator/qualification-set.json

      - name: Retain combined readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: learning-operator-qualified-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/learning-operator/qualification-set.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest combined receipt on protected-branch push
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .hepta-evidence/learning-operator/qualification-set.json
