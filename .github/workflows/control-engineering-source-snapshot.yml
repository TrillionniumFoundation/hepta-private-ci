name: control.engineering source snapshot

on:
  push:
    branches:
      - codex/control-engineering-final-convergence-20260926
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-engineering-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and package review surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/control-engineering-final-convergence-20260926"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/source-sha.txt"
          printf '%s\n' "$SOURCE_TREE" > "$RUNNER_TEMP/source-tree.txt"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$RUNNER_TEMP/control-engineering-source.tgz" \
            tools/hepta-engineering-control \
            docs/modules/control.engineering \
            docs/modules/MODULES.json \
            docs/modules/SOURCE_BINDINGS.json \
            docs/modules/MODULE_DOCS.json \
            docs/delivery/WORK_PACKAGES.json \
            qualification/module-execution-dossiers \
            scripts/hepta-implementation-maps.py \
            scripts/test_hepta_implementation_maps.py \
            scripts/hepta-gap-closure.py \
            .github/workflows/hepta-consolidated-source.yml \
            .github/workflows/control-engineering-convergence-apply.yml \
            .github/workflows/control-engineering-main-qualification.yml \
            .github/workflows/control-engineering-restore-main.yml \
            .github/workflows/control-engineering-source-snapshot.yml
          (
            cd "$RUNNER_TEMP"
            sha256sum \
              control-engineering-source.tgz \
              source-sha.txt \
              source-tree.txt \
              > control-engineering-source.SHA256
          )
      - name: Retain exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-engineering-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/control-engineering-source.tgz
            ${{ runner.temp }}/control-engineering-source.SHA256
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/source-tree.txt
          if-no-files-found: error
          retention-days: 30
