name: Objective fixed candidate check

on:
  push:
    branches:
      - automation/objective-source-snapshot-20260929

permissions:
  contents: read

concurrency:
  group: objective-fixed-candidate-64d432f4
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 64d432f4107a11a11da5808bb6fa9171f56da45f
          persist-credentials: false
      - name: Bind fixed candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = 64d432f4107a11a11da5808bb6fa9171f56da45f
      - name: Check formatting
        shell: bash
        run: |
          cd codex-rs
          cargo fmt --check -p codex-hepta-objective -p codex-hepta-agentd
      - name: Test objective compiler
        shell: bash
        run: |
          cd codex-rs
          cargo test --locked -p codex-hepta-objective
      - name: Test product objective E2E
        shell: bash
        run: |
          cd codex-rs
          cargo test --locked -p codex-hepta-agentd --test objective_product_e2e -- --nocapture
      - name: Strict owned-target clippy
        shell: bash
        run: |
          cd codex-rs
          cargo clippy --locked \
            -p codex-hepta-objective \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-agentd \
            --all-targets --no-deps -- -D warnings
