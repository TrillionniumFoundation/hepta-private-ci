name: Native NDU exact two-step certificate
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-ndu/research/native_stem_abcd/exact_two_step/**'
      - '.github/workflows/hepta-native-ndu-exact-two-step.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-two-stage-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned numerical tools
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Verify full-law certificate and actual solver outcomes
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/codex-rs/hepta-ndu/research/native_stem_abcd/exact_two_step"
          OUT="$RUNNER_TEMP/ndu-two-step"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/HEAD.txt"
          python -m pip freeze > "$OUT/ENVIRONMENT.txt"
          cd "$SRC"
          python -m compileall -q .
          python -m unittest -v test_certified 2>&1 | tee "$OUT/MATH_TESTS.log"
          python certificate.py > "$OUT/EXACT_CERTIFICATE.json"
          python sweep.py sweep --out "$OUT/runs" 2>&1 | tee "$OUT/SWEEP.log"
          test "$(sha256sum "$OUT/runs/CERTIFICATE.json" | awk '{print $1}')" = "0b50f395391d254c916b7e44dd351c1608ea8a39c41de689e2a95cb56ca665d3"
          python audit.py --source "$SRC" --runs "$OUT/runs" --out "$OUT/verified" 2>&1 | tee "$OUT/AUDIT.log"
          NDU_R14_RUNS="$OUT/runs" python -m unittest -v test_tamper 2>&1 | tee "$OUT/TAMPER.log"
          sha256sum problem.py intervals.py certificate.py solver.py sweep.py audit.py "$OUT/runs/CERTIFICATE.json" > "$OUT/SHA256.txt"
      - name: Retain both outcomes and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-two-step-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndu-two-step
          if-no-files-found: error
          retention-days: 14
