name: Apply knowledge.graph bounded materialization patch

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/hepta-kg-query-materialization-patch.yml

permissions:
  contents: write

concurrency:
  group: hepta-kg-query-materialization-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Replace unbounded result materialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-kg/src/generation.rs")
          text = path.read_text()
          old = '''    let mut edges = generation
              .edges
              .iter()
              .filter(|edge| {
                  (seeds.contains(&edge.identity.source_node_id)
                      || seeds.contains(&edge.identity.target_node_id))
                      && (relation_kinds.is_empty() || relation_kinds.contains(&edge.identity.relation))
                      && visible_nodes.as_ref().is_none_or(|visible| {
                          visible.contains(&edge.identity.source_node_id)
                              && visible.contains(&edge.identity.target_node_id)
                      })
              })
              .filter_map(|edge| {
                  let mut edge = edge.clone();
                  if let Some(at) = query.valid_at_unix_seconds {
                      edge.supports.retain(|support| support.visible_at(at));
                      if edge.supports.is_empty() {
                          return None;
                      }
                  }
                  Some(edge)
              })
              .collect::<Vec<_>>();
          let omitted_count = edges.len().saturating_sub(maximum_edges);
          edges.truncate(maximum_edges);
          '''
          new = '''    let mut matched_count = 0_usize;
          let mut edges = Vec::with_capacity(maximum_edges.min(generation.edges.len()));
          for edge in &generation.edges {
              let identity_matches = seeds.contains(&edge.identity.source_node_id)
                  || seeds.contains(&edge.identity.target_node_id);
              let relation_matches =
                  relation_kinds.is_empty() || relation_kinds.contains(&edge.identity.relation);
              let endpoints_visible = visible_nodes.as_ref().is_none_or(|visible| {
                  visible.contains(&edge.identity.source_node_id)
                      && visible.contains(&edge.identity.target_node_id)
              });
              if !identity_matches || !relation_matches || !endpoints_visible {
                  continue;
              }
              if query.valid_at_unix_seconds.is_some_and(|at| {
                  !edge.supports.iter().any(|support| support.visible_at(at))
              }) {
                  continue;
              }

              matched_count = matched_count.saturating_add(1);
              if edges.len() >= maximum_edges {
                  continue;
              }

              let mut selected_edge = edge.clone();
              if let Some(at) = query.valid_at_unix_seconds {
                  selected_edge
                      .supports
                      .retain(|support| support.visible_at(at));
              }
              edges.push(selected_edge);
          }
          let omitted_count = matched_count.saturating_sub(edges.len());
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one query materialization block, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Format and test canonical KG kernel
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-kg
          cargo test --locked -p codex-hepta-kg --lib -- --nocapture
          cargo clippy --locked -p codex-hepta-kg --no-deps --all-targets -- -D warnings

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-kg-query-materialization-patch.yml
          git diff --check
          git config user.name "Hepta KG CI"
          git config user.email "hepta-kg-ci@users.noreply.github.com"
          git add codex-rs/hepta-kg/src/generation.rs .github/workflows/hepta-kg-query-materialization-patch.yml
          git commit -m "knowledge.graph: bound query result materialization"
          git fetch origin work/product-convergence-20260923
          git rebase origin/work/product-convergence-20260923
          git push origin HEAD:work/product-convergence-20260923

# one-shot trigger revision 2
