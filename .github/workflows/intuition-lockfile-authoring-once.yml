name: Intuition lockfile authoring once

on:
  push:
    branches:
      - codex/intuition-policy-production-closure-20260927
    paths:
      - ".github/workflows/intuition-lockfile-authoring-once.yml"

permissions:
  contents: write

concurrency:
  group: intuition-lockfile-authoring-once
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  author-lockfile:
    name: Generate reviewed Cargo.lock source commit
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out immutable authoring source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - name: Generate and verify workspace lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw "authoring checkout drifted from GITHUB_SHA"
          }

          Push-Location codex-rs
          try {
            cargo metadata --offline --format-version 1 | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo check --locked -p codex-hepta-agentd --lib
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- codex-rs/Cargo.lock

          $lockStatus = @(git status --porcelain -- codex-rs/Cargo.lock)
          if ($lockStatus.Count -eq 0) {
            throw "Cargo.lock was not updated"
          }
          $unexpected = @(git status --porcelain | Where-Object { $_ -ne " M codex-rs/Cargo.lock" })
          if ($unexpected.Count -ne 0) {
            throw "authoring changed files other than codex-rs/Cargo.lock: $($unexpected -join ', ')"
          }
      - name: Commit generated lockfile as ordinary source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "Hepta Intuition Authoring"
          git config user.email "hepta-intuition-authoring@users.noreply.github.com"
          git add codex-rs/Cargo.lock
          git commit -m "fix(intuition): synchronize workspace lockfile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/intuition-policy-production-closure-20260927
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
