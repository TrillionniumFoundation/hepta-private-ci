              'turn_id: "turn.final.1".to_string(),',
              'turn_id: "turn.provisional.1".to_string(),',
              2,
          )
          replace_once(
              "codex-rs/hepta-infer-worker-host/src/native_recovery.rs",
              '''        || receipt.model != record.request.model
                  || receipt.model_provider != dispatch.model_provider
                  || receipt.turn_id.is_empty()
          ''',
              '''        || receipt.model != record.request.model
                  || receipt.model_provider != dispatch.model_provider
                  || record
                      .turn_id
                      .as_ref()
                      .is_some_and(|turn| turn != &receipt.turn_id)
                  || receipt.turn_id.is_empty()
          ''',
          )
          replace_once(
              "codex-rs/hepta-infer-worker-host/src/native_recovery_tests.rs",
              '''    assert_eq!(error, NativeRecoveryError::BindingMismatch);
              assert_eq!(counters.snapshot().provider_receipt_successes, 0);
          }
          ''',
              '''    assert_eq!(error, NativeRecoveryError::BindingMismatch);
              assert_eq!(counters.snapshot().provider_receipt_successes, 0);
          }

          #[tokio::test]
          async fn provider_receipt_must_match_exact_durable_turn() {
              let (_directory, mut control) = open_dispatched_control();
              let counters = NativeRecoveryCounters::default();
              let error = reconcile_provider_terminal(
                  &mut control,
                  "request.recovery.1",
                  ProviderTerminalReceipt {
                      request_id: "request.recovery.1".to_string(),
                      thread_id: "thread.recovery.1".to_string(),
                      turn_id: "turn.other".to_string(),
                      model: "model.recovery.1".to_string(),
                      model_provider: "provider.recovery.1".to_string(),
                      status: NativeRunStatus::Failed,
                      output: String::new(),
                      observed_output_tokens: Some(0),
                      stop_reason: Some("provider failure".to_string()),
                      verifier_witness_digest: digest("trusted-provider-receipt"),
                  },
                  &PassVerifier,
                  &counters,
              )
              .await
              .expect_err("turn drift must fail");
              assert_eq!(error, NativeRecoveryError::BindingMismatch);
              assert_eq!(counters.snapshot().provider_receipt_successes, 0);
          }
          ''',
          )

          # Keep strict Clippy without broad allowances.
          replace_once(
              "codex-rs/hepta-infer-worker-host/src/native_recovery.rs",
              '''            if let Some(output) = &record.observation {
