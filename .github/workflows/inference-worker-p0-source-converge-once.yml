name: Inference worker P0 source convergence (one shot)

on:
  push:
    branches:
      - codex/inference-worker-authoritative-20260929
    paths:
      - .github/workflows/inference-worker-p0-source-converge-once.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-p0-source-converge-once
  cancel-in-progress: false

env:
  BRANCH_NAME: codex/inference-worker-authoritative-20260929
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact one-shot source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind immutable input head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "$BRANCH_NAME"
          test "$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Materialize reviewed P0 fixes as ordinary source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(relative: str, old: str, new: str) -> None:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_count(relative: str, old: str, new: str, expected: int) -> None:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{relative}: expected {expected} matches for {old!r}, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          # Legacy settlement without explicit metadata remains semantically
          # idempotent. Explicit timestamp/usage APIs continue to reject rollback.
          replace_once(
              "codex-rs/hepta-infer-core/src/native_control/control_impl.rs",
              '''    pub fn settle_native(
                  &mut self,
                  request_id: &str,
                  output: NativeRunOutput,
              ) -> Result<NativeRunRecord, Error> {
                  self.settle_native_with_usage_at(request_id, output, None, host_unix_time_ms()?)
              }
          ''',
              '''    pub fn settle_native(
                  &mut self,
                  request_id: &str,
                  output: NativeRunOutput,
              ) -> Result<NativeRunRecord, Error> {
                  let record = self
                      .native
                      .records
                      .get(request_id)
                      .ok_or(Error::RequestNotFound)?;
                  if record.observation.as_ref() == Some(&output) {
                      return Ok(record.clone());
                  }
                  self.settle_native_with_usage_at(request_id, output, None, host_unix_time_ms()?)
              }
          ''',
          )

          # Terminal local observations consume the driver result exactly once.
          replace_once(
              "codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs",
              '''        let boundary = self.terminal_boundary(grant, handle, &observed).await;
              let output = terminal_output(
                  &admission.request_id,
                  manifest.model_id(),
                  handle.handle_id(),
                  observed,
                  boundary,
                  None,
              )?;
              let release_resources =
                  output.boundary_status != NativeBoundaryStatus::Quarantined;
              let settled = self.settle_local(
                  control,
                  &admission.request_id,
                  output,
                  observed.usage_units,
              )?;
          ''',
              '''        let usage_units = observed.usage_units;
              let boundary = self.terminal_boundary(grant, handle, &observed).await;
              let output = terminal_output(
                  &admission.request_id,
                  manifest.model_id(),
                  handle.handle_id(),
                  observed,
                  boundary,
                  None,
              )?;
              let release_resources =
                  output.boundary_status != NativeBoundaryStatus::Quarantined;
              let settled = self.settle_local(
                  control,
                  &admission.request_id,
                  output,
                  usage_units,
              )?;
          ''',
          )
          replace_once(
              "codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs",
              '''                let boundary = self.terminal_boundary(grant, handle, &observed).await;
                  let output = terminal_output(
                      &record.request.request_id,
                      manifest.model_id(),
                      handle.handle_id(),
                      observed,
                      boundary,
                      None,
                  )?;
                  let release_resources =
                      output.boundary_status != NativeBoundaryStatus::Quarantined;
                  let settled = self.settle_local(
                      control,
                      &record.request.request_id,
                      output,
                      observed.usage_units,
                  )?;
          ''',
              '''                let usage_units = observed.usage_units;
                  let boundary = self.terminal_boundary(grant, handle, &observed).await;
                  let output = terminal_output(
                      &record.request.request_id,
                      manifest.model_id(),
                      handle.handle_id(),
                      observed,
                      boundary,
                      None,
                  )?;
                  let release_resources =
                      output.boundary_status != NativeBoundaryStatus::Quarantined;
                  let settled = self.settle_local(
                      control,
                      &record.request.request_id,
                      output,
                      usage_units,
                  )?;
          ''',
