      - name: Commit ordinary source fixes locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-inference-p0-convergence
          git config user.email hepta-inference-p0-convergence@users.noreply.github.com
          git add \
            codex-rs/hepta-infer-core \
            codex-rs/hepta-infer-worker-host \
            codex-rs/hepta-agentd \
            scripts/hepta-implementation-maps.py \
            scripts/run_inference_worker_qualification_lane.sh
          git commit -m 'inference.worker: close P0 runtime and qualification regressions'

      - name: Rebind only inference implementation maps
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate \
            --module inference.control \
            --module inference.worker
          python3 scripts/hepta-module-docs.py refresh-derived
          git diff --check
          git add docs/modules/inference.control docs/modules/inference.worker
          if ! git diff --cached --quiet; then
            git commit -m 'docs(inference): bind implementation maps to ordinary source'
          fi

      - name: Prepare native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Expose DotSlash and resolve V8
        shell: bash
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
          python3 scripts/hepta_ci_v8.py

      - name: Verify P0 source and runtime closure
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/inference-worker-p0"
          pushd codex-rs >/dev/null
          cargo test --locked -p codex-hepta-infer-core --lib
          cargo clippy --locked -p codex-hepta-infer-core --all-targets --no-deps -- -D warnings
          cargo test --locked -p codex-hepta-infer-worker-host --lib
          cargo clippy --locked -p codex-hepta-infer-worker-host --all-targets --no-deps -- -D warnings
          cargo test --locked -p codex-hepta-infer-worker-host --features experimental-local-model --lib
          cargo check --locked -p codex-hepta-infer-worker-host --features experimental-local-model --all-targets
          cargo clippy --locked -p codex-hepta-infer-worker-host --features experimental-local-model --all-targets --no-deps -- -D warnings
          cargo test --locked -p codex-hepta-agentd --lib
          cargo clippy --locked -p codex-hepta-agentd --all-targets --no-deps -- -D warnings
          cargo build --locked -p codex-cli --bin codex
          export HEPTA_TEST_CODEX_SELF_EXE="$CARGO_TARGET_DIR/debug/codex"
          test -x "$HEPTA_TEST_CODEX_SELF_EXE"
          cargo test --locked -p codex-hepta-infer-worker-host \
            --features experimental-local-model \
            real_agentd_worker_accepts_fresh_context_and_rejects_final_use_tombstone \
            -- --ignored --nocapture --test-threads=1
          popd >/dev/null
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify \
            --module inference.control \
            --module inference.worker
          python3 -m unittest discover -v -s scripts/tests -p 'test_inference_worker_*.py'
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Remove one-shot writer and publish exact ordinary source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/inference-worker-p0-source-converge-once.yml
          git add -A
          git commit -m 'ci(inference.worker): retire one-shot source convergence writer'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:$BRANCH_NAME"
