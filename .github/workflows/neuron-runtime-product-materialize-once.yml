name: Neuron runtime source materializer (one shot)

on:
  push:
    branches:
      - codex/neuron-runtime-five-phase-closure-v2
    paths:
      - .github/workflows/neuron-runtime-product-materialize-once.yml

# This temporary workflow performs a one-time source migration only. It never
# produces qualification evidence. The committed result deletes this workflow;
# all validation of the resulting SHA is performed by read-only workflows.
permissions:
  contents: write

concurrency:
  group: neuron-runtime-source-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact migration input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Commit one ordinary immutable source candidate
        shell: bash
        env:
          TARGET_BRANCH: codex/neuron-runtime-five-phase-closure-v2
        run: |
          set -euo pipefail
          migration_script="scripts/neuron_runtime_apply_gate_repair.sh"
          migration_workflow=".github/workflows/neuron-runtime-product-materialize-once.yml"

          if [[ ! -f "${migration_script}" ]]; then
            echo "Neuron V2 product source is already materialized."
            exit 0
          fi

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          # Reuse the reviewed migration transform, but remove its embedded
          # test/commit/push tail. This job creates exactly one source commit;
          # it does not qualify the mutable worktree.
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/neuron_runtime_apply_gate_repair.sh")
          source = source_path.read_text()

          preamble = "from pathlib import Path\n\n\ndef replace"
          injected = (
              "from pathlib import Path\n\n"
              "workflow = '.github/workflows/neuron-runtime-gate-fix-once.yml'\n"
              "script = 'scripts/neuron_runtime_apply_gate_repair.sh'\n\n"
              "def replace"
          )
          if source.count(preamble) != 1:
              raise SystemExit("migration script Python preamble changed")
          source = source.replace(preamble, injected, 1)

          shutdown_old = """        .map(|host| host.shutdown())
                  .transpose();"""
          shutdown_new = """        .map_or(Ok(()), |host| host.shutdown());"""
          if source.count(shutdown_old) != 1:
              raise SystemExit("expected one Neuron shutdown Option closure")
          source = source.replace(shutdown_old, shutdown_new, 1)

          tail_marker = "\nrustup toolchain install stable --profile minimal --component rustfmt\n"
          if source.count(tail_marker) != 1:
              raise SystemExit("migration script execution tail changed")
          source = source.split(tail_marker, 1)[0].rstrip() + """

          git diff --check
          rm -f "$workflow" "$script"
          """

          target = Path("/tmp/neuron_runtime_apply_gate_repair.sh")
          target.write_text(source)
          target.chmod(0o755)
          PY

          bash /tmp/neuron_runtime_apply_gate_repair.sh

          # Apply the already-reviewed graceful-restart/specification transform
          # from its immutable source commit. Do not derive it from this commit's
          # parent: the predecessor workflow was intentionally deleted earlier.
          python3 - <<'PY'
          import subprocess
          import textwrap
          from pathlib import Path

          transform_commit = "094549e831534feef629ba446a0d63eb51cc434b"
          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{transform_commit}:.github/workflows/neuron-runtime-source-materialize-once.yml",
              ],
              text=True,
          )
          marker = "          python3 - <<'PY'\n"
          starts = []
          offset = 0
          while True:
              position = source.find(marker, offset)
              if position < 0:
                  break
              starts.append(position)
              offset = position + len(marker)
          if len(starts) != 2:
              raise SystemExit(f"expected two Python transforms, found {len(starts)}")
          body_start = starts[1] + len(marker)
          body_end = source.index("\n          PY\n", body_start)
          body = textwrap.dedent(source[body_start:body_end])
          Path("/tmp/neuron_runtime_finalize.py").write_text(body + "\n")
          PY

          python3 /tmp/neuron_runtime_finalize.py
          python3 scripts/neuron/readiness.py render

          # Formatting is source construction, not qualification. The final SHA
          # is subsequently compiled and tested only by read-only workflows.
          rustup toolchain install stable --profile minimal --component rustfmt
          (cd codex-rs && cargo +stable fmt --all)

          rm -f "${migration_workflow}"
          test ! -e .github/neuron-agentd-integration.patch
          test ! -e .github/workflows/neuron-runtime-gate-fix-once.yml
          test ! -e scripts/neuron_runtime_apply_gate_repair.sh
          if grep -R --line-number --fixed-strings 'contents: write' .github/workflows/*neuron*.yml; then
            echo 'mutable neuron workflow remains' >&2
            exit 1
          fi

          git diff --check
          test -n "$(git status --porcelain=v1 --untracked-files=all)"
          git add -A
          git diff --cached --check
          git config user.name hepta-qualification
          git config user.email qualification@invalid
          git commit -m "feat(neuron): materialize daemon-owned V2 product source"

          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${GITHUB_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
