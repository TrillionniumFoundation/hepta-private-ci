name: hepta-hdcf-original-beans-v9

on:
  push:
    branches:
      - research/hdcf-original-beans-v9-20261017
    paths:
      - 'qualification/hdcf-research/original_beans_v9.py'
      - 'qualification/hdcf-research/test_original_beans_v9.py'
      - 'qualification/hdcf-research/ORIGINAL_BEANS_V9.md'
      - '.github/workflows/hepta-hdcf-original-beans-v9.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: hdcf-original-beans-v9-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-dino-beans-cellbank-five-arm:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Exact-head existing parent and source-only tests
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -f physical_bank.py
          test -f paired_utility_gate.py
          test -f independent_head_replay.py
          test -f physical_cli.py
          test -f multimodal_token_bridge_v8.py
          python3 -m py_compile original_beans_v9.py test_original_beans_v9.py
          python3 -m unittest -v test_original_beans_v9.V9ContractTests
          python3 -O -m unittest -v test_original_beans_v9.V9ContractTests
      - name: Reacquire exact original source and DINO pretrained feature archives
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          umask 077
          python3 original_beans_v9.py download --kind source --out "$RUNNER_TEMP/original-source.zip"
          python3 original_beans_v9.py download --kind features --out "$RUNNER_TEMP/original-features.zip"
      - name: Audit exact 36+24 real-image DINO receipts and train-label-only CellBank
        env:
          HDCF_BEANS_ORIGINAL_SOURCE_ZIP: ${{ runner.temp }}/original-source.zip
          HDCF_BEANS_ORIGINAL_FEATURE_ZIP: ${{ runner.temp }}/original-features.zip
          HDCF_BEANS_ORIGINAL_TARGET_ZIP: ''
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          umask 077
          python3 original_beans_v9.py stage \
            --source-zip "$HDCF_BEANS_ORIGINAL_SOURCE_ZIP" \
            --features-zip "$HDCF_BEANS_ORIGINAL_FEATURE_ZIP" \
            --out "$RUNNER_TEMP/physical-v9-bank.json"
          python3 physical_cli.py train --features "$RUNNER_TEMP/physical-v9-bank.json" \
            --steps 256 --out "$RUNNER_TEMP/sealed-five-arm-v9.json"
          test -s "$RUNNER_TEMP/sealed-five-arm-v9.json"
      - name: Reacquire withheld original blind labels only AFTER SGD/predictions were sealed
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          umask 077
          python3 original_beans_v9.py download --kind targets --out "$RUNNER_TEMP/withheld-v9.zip"
      - name: Verify complete original ZIP-specific adversarial tests (no skips)
        env:
          HDCF_BEANS_ORIGINAL_SOURCE_ZIP: ${{ runner.temp }}/original-source.zip
          HDCF_BEANS_ORIGINAL_FEATURE_ZIP: ${{ runner.temp }}/original-features.zip
          HDCF_BEANS_ORIGINAL_TARGET_ZIP: ${{ runner.temp }}/withheld-v9.zip
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          python3 -m unittest -v test_original_beans_v9
          python3 -O -m unittest -v test_original_beans_v9
      - name: Obtain publisher original TRAIN and TEST Parquet in reviewer-only phase
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            huggingface-hub==0.36.0 pyarrow==20.0.0
          python3 -m pip check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          import sys
          sys.path.insert(0, 'qualification/hdcf-research')
          import original_beans_v9 as v
          for phase, expected in [('train', v.TRAIN_SHA), ('test', v.TEST_SHA)]:
              name = f'data/{phase}-00000-of-00001.parquet'
              path = Path(hf_hub_download(repo_type='dataset', repo_id='AI-Lab-Makerere/beans',
                                          filename=name,revision=v.DATA_REV))
              with path.open('rb') as fd:
                  actual=hashlib.file_digest(fd,'sha256').hexdigest()
              if actual != expected:
                  raise ValueError('original publisher Parquet has different bytes')
              output=Path('/tmp')/f'hdcf-original-beans-{phase}.parquet'
              with output.open('xb') as out, path.open('rb') as inp:
                  for block in iter(lambda:inp.read(1024*1024), b''):
                      out.write(block)
          PY
      - name: Independent publisher source re-selection + scalar Head replay + original DINO baseline
        working-directory: qualification/hdcf-research
        run: |
          set -euo pipefail
          umask 077
          python3 original_beans_v9.py review \
            --bank "$RUNNER_TEMP/physical-v9-bank.json" \
            --trial "$RUNNER_TEMP/sealed-five-arm-v9.json" \
            --source-zip "$RUNNER_TEMP/original-source.zip" \
            --features-zip "$RUNNER_TEMP/original-features.zip" \
            --targets-zip "$RUNNER_TEMP/withheld-v9.zip" \
            --publisher-train /tmp/hdcf-original-beans-train.parquet \
            --publisher-test /tmp/hdcf-original-beans-test.parquet \
            --out "$RUNNER_TEMP/independent-v9-summary.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ['RUNNER_TEMP'])/'independent-v9-summary.json').read_text())
          assert doc['schema']=='hepta.hdcf.original-beans-dino-v9-readout.v1'
          assert doc['original_publisher_train_test_sha_verified'] is True
          assert doc['genuine_original_train_cases']==36 and doc['genuine_original_held_cases']==24
          assert doc['new_dino_image_forwards']==0
          assert doc['disposition']=='HOLD_NO_GO_DENY_ALL' and doc['production_authorized'] is False
          assert doc['model_selected'] is False and doc['total_service_cost_attested'] is False
          print('ORIGINAL_BEANS_V9_PAIRED_EVIDENCE_REPLAYED_HOLD_DENY_ALL')
          print({k:doc['head_arms'][k]['correct'] for k in sorted(doc['head_arms'])})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: hdcf-original-beans-v9-sanitized-independent-no-go
          path: ${{ runner.temp }}/independent-v9-summary.json
          if-no-files-found: error
          retention-days: 7
