name: Apply secrets.heptabao state-machine closure

on:
  push:
    branches:
      - codex/secrets-heptabao-convergence
    paths:
      - ".hepta-bootstrap/secrets-phase1.ready"
      - ".hepta-bootstrap/secrets-phase1.patch"
      - ".github/workflows/hepta-bootstrap-apply-secrets-phase1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-bootstrap-secrets-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply the exact state-machine patch
        shell: bash
        run: |
          set -euo pipefail
          patch=.hepta-bootstrap/secrets-phase1.patch
          marker=.hepta-bootstrap/secrets-phase1.ready
          test -f "$patch"
          test -f "$marker"
          test "$(sha256sum "$patch" | awk '{print $1}')" = \
            "65796ccb4e0888ff98649570bf01e3fcde5d41d4cd639511a7df755113126fda"
          git merge-base --is-ancestor \
            b08d811e41109f0f2119fe526fc9643768daed0f HEAD
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo "State-machine closure is already present."
          else
            echo "State-machine closure does not apply cleanly and is not already present." >&2
            exit 1
          fi

      - name: Decode phase-three proposal for review only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/phase3-review
          shopt -s nullglob
          parts=(.hepta-bootstrap/secrets-phase3/part-*)
          test "${#parts[@]}" -eq 4
          bundle="$RUNNER_TEMP/secrets-phase3.patch.gz.b64"
          patch=.hepta-evidence/phase3-review/secrets-phase3.patch
          cat "${parts[@]}" > "$bundle"
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          sha256sum "$bundle" > .hepta-evidence/phase3-review/bundle.sha256
          sha256sum "$patch" > .hepta-evidence/phase3-review/patch.sha256
          grep '^diff --git ' "$patch" \
            | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' \
            | sort -u > .hepta-evidence/phase3-review/paths.txt
          set +e
          git apply --check "$patch"
          code=$?
          set -e
          printf '%s\n' "$code" > .hepta-evidence/phase3-review/apply-check-exit.txt
          cat .hepta-evidence/phase3-review/paths.txt
          test -s .hepta-evidence/phase3-review/paths.txt

      - name: Retain phase-three review proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-phase3-review-${{ github.sha }}
          path: .hepta-evidence/phase3-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Format and execute focused qualification
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter
          cargo test --locked -p codex-hepta-bao-adapter --all-targets -- --test-threads=2
          cargo clippy --locked -p codex-hepta-bao-adapter --all-targets -- -D warnings

      - name: Commit the qualified state-machine closure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hepta-evidence
          rm -f .hepta-bootstrap/secrets-phase1.ready \
            .hepta-bootstrap/secrets-phase1.patch
          rm -f .github/workflows/hepta-bootstrap-apply-secrets-phase1.yml
          # The earlier atomic bootstrap payload has already been materialized at
          # this branch head. Remove only its inert transport artifacts.
          rm -f .hepta-bootstrap/secrets-phase12.ready \
            .hepta-bootstrap/secrets-phase12.part-* \
            .hepta-bootstrap/secrets-phase12.patch.gz.b64 \
            .hepta-bootstrap/secrets-phase12-clippy.patch
          rm -f .github/workflows/hepta-bootstrap-apply-secrets-remediation.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta remediation bot"
          git config user.email "hepta-remediation@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No state-machine changes remain."
            exit 0
          fi
          git commit -m "secrets: close post-dispatch recovery and migrate saga schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"
