name: Hepta intuition policy qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-intuition/**"
      - "qualification/intuition-policy/**"
      - "docs/modules/intuition.policy/**"
      - ".github/workflows/hepta-intuition-policy.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-intuition/**"
      - "qualification/intuition-policy/**"
      - "docs/modules/intuition.policy/**"
      - ".github/workflows/hepta-intuition-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intuition-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: Authenticated frozen-data and fast-path qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and clean tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Test authenticated and frozen-data policy path
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intuition
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intuition --all-targets -- -D warnings
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-intuition -- --check
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Enforce qualified fast-path budgets
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-intuition --test fast_benchmark_gate -- --ignored --nocapture

  synthetic-merge:
    name: Authenticated policy on merge candidate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build deterministic merge commit
        id: merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME="Hepta Intuition Policy CI"
          export GIT_AUTHOR_EMAIL="hepta-intuition-policy-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SHA="$(printf 'Synthetic intuition policy merge for PR %s\n' "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$SHA"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Test merge candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha }}"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intuition
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intuition --all-targets -- -D warnings
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-intuition -- --check
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
