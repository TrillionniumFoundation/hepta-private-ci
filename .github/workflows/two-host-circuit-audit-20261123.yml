name: Read back original two-host Circuit artifacts
on:
  push:
    branches: [research/frozen-circuit-two-host-edge-20261123]
    paths:
      - qualification/circuit-two-host-edge-20261123/audit.py
      - .github/workflows/two-host-circuit-audit-20261123.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
      STUDY: qualification/circuit-two-host-edge-20261123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - name: Install numeric readback dependency
        run: python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Retain original compressed artifacts and platform timeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$STUDY/audit.py" collect "$RUNNER_TEMP/TWO_HOST_ORIGINALS.zip"
      - name: Reconstruct both nodes and removed edge from bound tensor files
        run: |
          python "$STUDY/audit.py" verify "$RUNNER_TEMP/TWO_HOST_ORIGINALS.zip" > "$RUNNER_TEMP/AUDIT.json"
          sha256sum "$RUNNER_TEMP/TWO_HOST_ORIGINALS.zip"
          python - "$RUNNER_TEMP" <<'PY'
          import base64, pathlib, sys
          for file in ("TWO_HOST_ORIGINALS.zip", "AUDIT.json"):
              material = (pathlib.Path(sys.argv[1]) / file).read_bytes()
              print("AUTHORED_FIXTURE_EXPORT", file, base64.b64encode(material).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-host-circuit-audit
          path: |
            ${{ runner.temp }}/TWO_HOST_ORIGINALS.zip
            ${{ runner.temp }}/AUDIT.json
          if-no-files-found: error
          retention-days: 30
