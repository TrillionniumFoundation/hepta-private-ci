name: MemoryCell Oct12 strict 576 nonpromotion
on:
  push:
    branches: ["codex/memory-cell-evidence-20261008"]
    paths:
      - "scripts/memory_cell/stem_oct12_strict_nonpromotion.py"
      - "scripts/memory_cell/test_stem_oct12_strict_nonpromotion.py"
      - ".github/workflows/hepta-memory-stem-oct12-nonpromotion.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-stem-20261012-rejection-${{ github.sha }}
  cancel-in-progress: false
jobs:
  independently-reject-scale-out:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify no-promotion gate and tampering tests without a model
        run: |
          set -euo pipefail
          mkdir -p /tmp/stem-current-rejection
          git rev-parse HEAD > /tmp/stem-current-rejection/auditor-commit.txt
          git rev-parse HEAD^{tree} > /tmp/stem-current-rejection/auditor-tree.txt
          python3 -m unittest -v test_stem_oct12_strict_nonpromotion 2>&1 | tee /tmp/stem-current-rejection/tests.log
          python3 -m compileall -q scripts/memory_cell/stem_oct12_strict_nonpromotion.py scripts/memory_cell/test_stem_oct12_strict_nonpromotion.py
      - name: Retrieve exact immutable strict 576-run from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11726530850/zip > /tmp/stem-oct12-native.zip
          printf '%s  %s\n' 07b0f15ec150cc9817db6bfc9b4bae1e2c06a5296ca2ba3c4c7895da18b99e2f /tmp/stem-oct12-native.zip | sha256sum -c -
      - name: Independently reconcile every policy choice and reject unsupported production claims
        run: |
          set -euo pipefail
          python3 scripts/memory_cell/stem_oct12_strict_nonpromotion.py \
            --archive /tmp/stem-oct12-native.zip \
            --output /tmp/stem-current-rejection/immutable-rejection.json \
            2>&1 | tee /tmp/stem-current-rejection/decision.log
      - name: Preserve audited exact source and all failure logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/stem-current-rejection/source
          cp scripts/memory_cell/stem_oct12_strict_nonpromotion.py /tmp/stem-current-rejection/source/
          cp scripts/memory_cell/test_stem_oct12_strict_nonpromotion.py /tmp/stem-current-rejection/source/
          cp scripts/memory_cell/stem_native_nonpromotion.py /tmp/stem-current-rejection/source/
          cp scripts/memory_cell/stem_effective_n.py /tmp/stem-current-rejection/source/
          cp scripts/memory_cell/stem_audit_archive.py /tmp/stem-current-rejection/source/
          cp .github/workflows/hepta-memory-stem-oct12-nonpromotion.yml /tmp/stem-current-rejection/source/
          (cd /tmp/stem-current-rejection && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stem-oct12-strict-no-promotion
          path: /tmp/stem-current-rejection
          if-no-files-found: error
