name: hepta Windows helper lock artifact

on:
  push:
    branches:
      - audit/windows-helper-lock-20261104

permissions:
  contents: read

concurrency:
  group: hepta-windows-helper-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/audit/windows-helper-lock-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact artifact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Verify the reviewed parent and seven source paths before setup
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python3 qualification/product-fixture-lock-20261104/generate_lock.py --verify-inputs-only --expected-source "$EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/product-fixture-lock/preflight"
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: windows-helper-lock-artifact
      - name: Generate a real lock candidate with the original recipes
        timeout-minutes: 25
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python3 qualification/product-fixture-lock-20261104/generate_lock.py --expected-source "$EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/product-fixture-lock/generated"
      - name: Retain lock bytes, source identities and complete original logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-windows-helper-lock-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-fixture-lock
          if-no-files-found: error
          retention-days: 7
