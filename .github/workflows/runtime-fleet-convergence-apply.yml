name: Runtime Fleet convergence apply

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/runtime-fleet-convergence-apply.yml

permissions:
  contents: write

concurrency:
  group: runtime-fleet-convergence-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_PARENT: d6b3d9706f236c91a9e2325fbfbb6f0689da0d19
      HISTORICAL_HEAD: 6298a20a087a3874276d10c6362ee4647351a8a6
      BRANCH: work/product-convergence-20260923
      CARGO_BUILD_JOBS: "2"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require reviewed parent and uncontended branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git cat-file -e "$HISTORICAL_HEAD^{commit}"

      - name: Apply reviewed Fleet source convergence
        shell: bash
        run: python3 .github/scripts/runtime_fleet_core_apply.py apply

      - name: Format Fleet sources
        shell: bash
        run: cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-fleet

      - name: Execute Fleet regressions
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-fleet --lib -- --test-threads=1

      - name: Strict Fleet lint
        working-directory: codex-rs
        shell: bash
        run: cargo clippy --locked -p codex-hepta-fleet --all-targets -- -D warnings

      - name: Compile current Supervisor consumer
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-supervisor --lib --no-run

      - name: Commit validated Fleet source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Hepta convergence bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/runtime-fleet-convergence-apply.yml
          git add .github/workflows/hepta-lane-b-truth.yml codex-rs/hepta-fleet
          git commit -s -m "fix(runtime.fleet): restore durable allocation invariants"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Rebind implementation source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: python3 .github/scripts/runtime_fleet_core_apply.py rebind

      - name: Commit truthful implementation map
        shell: bash
        run: |
          set -euo pipefail
          git add docs/modules/runtime.fleet/IMPLEMENTATION_MAP.json
          git rm -- .github/scripts/runtime_fleet_core_apply.py
          git commit -s -m "docs(runtime.fleet): bind restored durable owner source"

      - name: Verify governance and Lane B truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-lane-b-path-guard.py verify
          python3 scripts/hepta-lane-b-truth.py verify
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify deterministic synthetic merge Fleet slice
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          git fetch origin main
          merge_dir="${RUNNER_TEMP}/runtime-fleet-merge"
          git worktree add --detach "$merge_dir" origin/main
          git -C "$merge_dir" merge --no-ff --no-edit "$final_sha"
          cd "$merge_dir/codex-rs"
          cargo test --locked -p codex-hepta-fleet --lib -- --test-threads=1
          cargo clippy --locked -p codex-hepta-fleet --all-targets -- -D warnings

      - name: Push only onto unchanged canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
