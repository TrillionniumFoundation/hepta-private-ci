name: patch-global-finalizer-r22

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/patch-global-finalizer-r22.yml

permissions:
  contents: write

concurrency:
  group: patch-global-finalizer-r22
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: f1903276dd86dbb97bd91cca2e19c5fb509577a0
      TARGET_BRANCH: ops/hepta-global-gap-closure-controller-20260910-r1
      FINALIZER: scripts/hepta-global-finalizer-r8.py
      PATCH_SCRIPT: scripts/patch-global-finalizer-r22.py
    steps:
      - name: Check out exact one-shot source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable patch tuple
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:.github/workflows/patch-global-finalizer-r22.yml)" = "$(git hash-object .github/workflows/patch-global-finalizer-r22.yml)"
          test "$(git rev-parse HEAD:${PATCH_SCRIPT})" = "$(git hash-object "${PATCH_SCRIPT}")"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"

      - name: Apply and validate canonical appendix refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "${PATCH_SCRIPT}"
          python3 "${PATCH_SCRIPT}"
          python3 "${PATCH_SCRIPT}"
          python3 -m py_compile "${FINALIZER}"
          grep -Fq 'body = original.split(heading, 1)[0].rstrip()' "${FINALIZER}"
          grep -Fq 'if rendered == original:' "${FINALIZER}"
          grep -Fq '*[f"- `{value}`" for value in protocols]' "${FINALIZER}"
          grep -Fq '*[f"- `{value}`" for value in gap_ids]' "${FINALIZER}"
          git diff --check

      - name: Publish clean r8 controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-global-finalizer-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/patch-global-finalizer-r22.yml \
            scripts/patch-global-finalizer-r22.py
          git add "${FINALIZER}"
          git diff --cached --check
          git diff --cached --name-only | grep -Fxq "${FINALIZER}"
          git commit --signoff -m 'fix(hepta): rebuild readiness appendices from current registry'
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
