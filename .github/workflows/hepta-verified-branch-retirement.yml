name: Hepta verified branch retirement

on:
  push:
    branches:
      - ops/hepta-default-main-switch-20260907

permissions:
  contents: write

concurrency:
  group: hepta-verified-branch-retirement
  cancel-in-progress: false

env:
  EXPECTED_FINAL_TREE: 2fdc718db78ee7333cab0f21777cf02f0a6fbee4

jobs:
  retire:
    if: ${{ contains(github.event.head_commit.message, '[hepta-retirement-arm]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out live main with complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Prove final main and control ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          main_tree="$(git rev-parse "${main_sha}^{tree}")"
          [[ "${main_tree}" == "${EXPECTED_FINAL_TREE}" ]] || {
            echo "::error::main tree is not the fully qualified final tree: ${main_tree}"
            exit 1
          }
          git merge-base --is-ancestor "${GITHUB_SHA}" "${main_sha}" || {
            echo "::error::retirement controller is not retained by main"
            exit 1
          }
          echo "MAIN_SHA=${main_sha}" >> "${GITHUB_ENV}"

      - name: Freeze refs and create verified recovery bundle
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/hepta-branch-retirement"
          python3 tools/branch-consolidation/hepta_branch_consolidation.py \
            plan --root . --output "${output}"
          python3 - "${output}/plan.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          if not plan.get("backupVerified"):
              raise SystemExit("recovery bundle was not verified")
          if not plan.get("allHeadsRetainedByMain"):
              missing = [row["branch"] for row in plan["branches"] if not row["ancestorOfMain"]]
              raise SystemExit("heads not retained by main: " + ", ".join(missing))
          print(f"verified {len(plan['branches'])} frozen branch heads")
          PY
          digest="$(sha256sum "${output}/plan.json" | awk '{print $1}')"
          echo "output=${output}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Retain immutable pre-deletion recovery packet
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-branch-retirement-plan-${{ github.run_id }}
          path: ${{ steps.plan.outputs.output }}
          if-no-files-found: error
          retention-days: 90

      - name: Reject any ref drift after backup
        shell: bash
        env:
          PLAN_PATH: ${{ steps.plan.outputs.output }}/plan.json
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - "${PLAN_PATH}" <<'PY'
          import json, subprocess, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          frozen = {row["branch"]: row["sha"] for row in plan["branches"]}
          live = {}
          raw = subprocess.check_output(["git", "ls-remote", "--heads", "origin"], text=True)
          for line in raw.splitlines():
              sha, ref = line.split("\t", 1)
              live[ref.removeprefix("refs/heads/")] = sha
          if live != frozen:
              removed = sorted(set(frozen) - set(live))
              added = sorted(set(live) - set(frozen))
              moved = sorted(name for name in set(live) & set(frozen) if live[name] != frozen[name])
              raise SystemExit(f"ref drift: removed={removed}, added={added}, moved={moved}")
          PY

      - name: Atomically retire every SHA-leased merged branch
        shell: bash
        env:
          OUTPUT: ${{ steps.plan.outputs.output }}
          PLAN_DIGEST: ${{ steps.plan.outputs.digest }}
        run: |
          set -euo pipefail
          python3 tools/branch-consolidation/hepta_branch_consolidation.py \
            apply --root . --output "${OUTPUT}" \
            --expected-plan-sha256 "${PLAN_DIGEST}"

      - name: Verify only main and the live default ref remain
        shell: bash
        env:
          OUTPUT: ${{ steps.plan.outputs.output }}
        run: |
          set -euo pipefail
          default_branch="$(git ls-remote --symref origin HEAD | sed -n 's#^ref: refs/heads/\([^[:space:]]*\)[[:space:]]HEAD$#\1#p')"
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | LC_ALL=C sort)
          allowed=(main)
          [[ "${default_branch}" == main ]] || allowed+=("${default_branch}")
          mapfile -t allowed < <(printf '%s\n' "${allowed[@]}" | LC_ALL=C sort -u)
          [[ "${remaining[*]}" == "${allowed[*]}" ]] || {
            printf '::error::unexpected remaining refs: %s\n' "${remaining[*]}"
            exit 1
          }
          {
            echo "## Branch retirement result"
            echo
            echo "- final main before cleanup: \`${MAIN_SHA}\`"
            echo "- final content tree: \`${EXPECTED_FINAL_TREE}\`"
            echo "- live default branch: \`${default_branch}\`"
            echo "- remaining branch refs: \`${remaining[*]}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain post-deletion receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-branch-retirement-receipt-${{ github.run_id }}
          path: ${{ steps.plan.outputs.output }}/receipt.json
          if-no-files-found: ignore
          retention-days: 90
