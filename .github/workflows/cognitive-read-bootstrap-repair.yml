name: Repair cognitive.read convergence payload

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
    paths:
      - ".github/workflows/cognitive-read-bootstrap-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-read-bootstrap-repair-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  repair:
    name: Make reviewed convergence helper strictly idempotent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch, re-seal, and publish helper payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cognitive Read Bootstrap Repair'
          git config user.email 'cognitive-read-bootstrap-repair@users.noreply.github.com'
          test "$(git branch --show-current)" = 'work/cognitive-read-production-convergence-20260927'
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          python3 - <<'PY'
          import base64
          import lzma
          import re
          from pathlib import Path

          root = Path('.github/scripts')
          parts = sorted(root.glob('cognitive_read_converge.py.xz.b64.[0-9][0-9]'))
          if not parts:
              raise SystemExit('missing numeric cognitive.read convergence payload chunks')
          encoded = b''.join(
              path.read_bytes().replace(b'\n', b'').replace(b'\r', b'')
              for path in parts
          )
          source = lzma.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
          marker = 'if actual == 0 and text.count(new) == 1:'
          if marker not in source:
              pattern = re.compile(
                  r'(?m)^(?P<indent>[ \t]*)actual = text\.count\(old\)\n'
                  r'(?P=indent)if actual != 1:\n'
              )
              matches = list(pattern.finditer(source))
              if len(matches) != 1:
                  raise SystemExit(
                      f'expected one replace_once count guard, found {len(matches)}'
                  )
              match = matches[0]
              indent = match.group('indent')
              replacement = (
                  f'{indent}actual = text.count(old)\n'
                  f'{indent}if actual == 0 and text.count(new) == 1:\n'
                  f'{indent}    return\n'
                  f'{indent}if actual != 1:\n'
              )
              source = source[:match.start()] + replacement + source[match.end():]
          compile(source, 'cognitive_read_converge.py', 'exec')

          sealed = base64.b64encode(
              lzma.compress(source.encode('utf-8'), format=lzma.FORMAT_XZ, preset=9)
          ).decode('ascii')
          for path in parts:
              path.unlink()
          chunk_size = 6500
          for index, start in enumerate(range(0, len(sealed), chunk_size)):
              (root / f'cognitive_read_converge.py.xz.b64.{index:02d}').write_text(
                  sealed[start:start + chunk_size] + '\n',
                  encoding='ascii',
              )
          PY
          rm -f .github/scripts/cognitive_read_converge.py.xz.b64.zz-retrigger
          rm -f .github/workflows/cognitive-read-bootstrap-repair.yml
          git diff --check
          git add -A
          git diff --cached --quiet && { echo 'bootstrap repair produced no changes' >&2; exit 1; }
          git commit -m 'ci(cognitive.read): make convergence payload strictly idempotent'
          git push origin 'HEAD:work/cognitive-read-production-convergence-20260927'
