name: MEM frozen Windows scoped lint

on:
  push:
    branches:
      - codex/mem8-windows-scoped-fix-b054-20261111-ed353817

permissions:
  contents: read

concurrency:
  group: mem8-windows-scoped-fix-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  scoped-fix:
    if: github.ref == 'refs/heads/codex/mem8-windows-scoped-fix-b054-20261111-ed353817'
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Record the one original job envelope
        shell: pwsh
        run: |
          $records = Join-Path $env:RUNNER_TEMP "mem8-windows-scoped-fix"
          New-Item -ItemType Directory -Path $records -ErrorAction Stop | Out-Null
          $anchor = @{
            first_step_started_at = [DateTimeOffset]::UtcNow.ToString("o")
            job_timeout_minutes = 65
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            harness_sha = $env:GITHUB_SHA
            authority = "Actions job timeout starts before this first-step observation; no timer is reset"
          }
          $anchor | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$records/JOB_ANCHOR.json"
      - name: Checkout the immutable harness separately
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Checkout only the frozen formatted source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b0547d2f874c0aeb54dabd3491caa2bee49fcb0b
          path: source
          persist-credentials: false
      - name: Install the fixed compiler and linter
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Install the fixed recipe runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
      - name: Run only the three scoped fixes
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "mem8-windows-scoped-fix-target"
          python "$env:GITHUB_WORKSPACE/harness/.github/scripts/mem_windows_scoped_fix.py" run --source "$env:GITHUB_WORKSPACE/source" --records "$env:RUNNER_TEMP/mem8-windows-scoped-fix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain observed source, locks and all rewrite proposals
        if: always()
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/harness/.github/scripts/mem_windows_scoped_fix.py" collect --source "$env:GITHUB_WORKSPACE/source" --records "$env:RUNNER_TEMP/mem8-windows-scoped-fix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve every original receipt and complete raw output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mem8-windows-scoped-fix-b054-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mem8-windows-scoped-fix/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
