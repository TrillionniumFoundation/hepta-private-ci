name: tmp-integration-finalizer-r2

on:
  push:
    branches:
      - integration/all-lanes-gap-closure-20260910-r2
    paths:
      - .github/workflows/tmp-integration-finalizer-r2.yml

permissions:
  contents: write

concurrency:
  group: tmp-integration-finalizer-r2
  cancel-in-progress: false

jobs:
  normalize-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Build committed normalized candidate
        shell: bash
        run: |
          set -euo pipefail
          carrier="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          bindings = Path("qualification/module-execution-dossiers/NATIVE_BINDINGS.json")
          doc = json.loads(bindings.read_text(encoding="utf-8"))
          for row in doc["observations"]:
              source = Path(row["path"])
              if not source.is_file():
                  raise SystemExit(f"missing bound source: {source}")
              row["blobSha"] = subprocess.check_output(
                  ["git", "hash-object", "--", str(source)], text=True
              ).strip()
          bindings.write_text(
              json.dumps(doc, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )

          readme = Path("qualification/lane-b/README.md")
          if readme.is_file():
              text = readme.read_text(encoding="utf-8").replace(
                  "python3 scripts/hepta-lane-b-docs.py\n",
                  "python3 scripts/hepta-lane-b-docs.py verify\n",
              )
              readme.write_text(text, encoding="utf-8")

          composition = Path("docs/readiness/LANE_B_RUNTIME_COMPOSITION.md")
          if composition.is_file():
              text = composition.read_text(encoding="utf-8")
              statement = "- production activation passed;\n"
              anchor = (
                  "The following claims remain false until exact evidence is committed "
                  "and independently issued where required:\n\n"
              )
              if statement not in text:
                  if text.count(anchor) != 1:
                      raise SystemExit("Lane B production-boundary anchor drifted")
                  text = text.replace(anchor, anchor + statement, 1)
              composition.write_text(text, encoding="utf-8")
          PY

          find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -delete
          if command -v cargo >/dev/null 2>&1; then
            cargo fmt --all
          fi
          python3 scripts/hepta-readiness.py generate-status || true
          python3 scripts/hepta-implementation-dossiers.py generate-status || true
          python3 scripts/hepta-algorithm-docs.py generate-status || true
          python3 scripts/hepta-cns.py generate-status || true
          python3 scripts/hepta-docs.py generate-status || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize converged source and generated truth'
          test "$(git rev-parse HEAD^)" = "$carrier"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run repository-controlled qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          if test -f scripts/hepta-lane-b-truth.py; then
            python3 scripts/hepta-lane-b-truth.py self-test
            python3 -m unittest scripts/test_hepta_lane_b_truth.py
            python3 scripts/hepta-lane-b-truth.py verify
            python3 scripts/hepta-lane-b-docs.py verify
          fi
          if command -v cargo >/dev/null 2>&1; then
            cargo fmt --all -- --check
          fi
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish finalized candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:integration/all-lanes-gap-closure-20260910-r2
