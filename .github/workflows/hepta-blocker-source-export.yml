name: Hepta bounded blocker integration
on:
  push:
    branches: [ops/hepta-blocker-source-export-20260913]
    paths: [.github/workflows/hepta-blocker-source-export.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_SHA: c5504259990c90637a6b52ead81c8ee66e7b3616
      HEPTA_CI_LANE: source-head
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: be96e8eb69cd08f851eb5fce252598454b8c52c8
          fetch-depth: 0
          persist-credentials: false
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Reproduce reviewed merges and fail closed on any tree difference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = be96e8eb69cd08f851eb5fce252598454b8c52c8
          git config user.name 'Hepta integration repair'
          git config user.email 'hepta-integration@users.noreply.github.com'
          git switch -c bounded-blocker-candidate
          (cd codex-rs && cargo fmt --package codex-hepta-agentd)
          git add codex-rs/hepta-agentd/src/cognitive_context_tests.rs
          test "$(git write-tree)" = 98258b8a0345a32b129828ec2acb561451971869
          git commit -m 'style: apply pinned formatter to context budget regression'
          git update-ref refs/heads/formatted-ranked HEAD
          set +e
          git merge --no-ff --no-commit b6a5712f18427db51d603357d79c28a47e1a7d8f
          merge_status=$?
          set -e
          test "$merge_status" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          paths = {
              '.github/workflows/hepta-development-docs.yml',
              'docs/readiness/LANE_B_RUNTIME_COMPOSITION.md',
              'scripts/hepta-implementation-maps.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          if actual != paths:
              raise RuntimeError(f'unexpected merge conflicts: {actual}')
          for name in sorted(paths):
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              source, count = re.subn(r'^<<<<<<< HEAD\n(.*?)^=======\n.*?^>>>>>>> b6a5712f18427db51d603357d79c28a47e1a7d8f\n', lambda match: match.group(1), source, flags=re.M | re.S)
              if count != 1:
                  raise RuntimeError(f'unexpected conflict structure: {name}')
              if name.endswith('hepta-implementation-maps.py'):
                  old = '"resolvedRoots": [x for x in declared if (ROOT / x).exists()],'
                  if source.count(old) != 1:
                      raise RuntimeError('unexpected source-root migration context')
                  source = source.replace(old, '"resolvedRoots": resolve_source_roots(ROOT, module),')
              path.write_text(source, encoding='utf-8')
          PY
          git add .github/workflows/hepta-development-docs.yml docs/readiness/LANE_B_RUNTIME_COMPOSITION.md scripts/hepta-implementation-maps.py
          git diff --check --cached
          git commit -m 'Merge canonical alias repairs, retaining unconditional source and merge gates'
          git merge --no-ff e505cd874c6e9f4ae228c3a36fb3f2439c8b918e -m 'Merge independent synthetic tree verification into blocker candidate'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/hepta_module_source_roots.py')
          source = path.read_text(encoding='utf-8')
          old = '            if (_path(root, target) / "BINDING.json").exists():\n'
          new = ('            nested_binding = _path(root, target) / "BINDING.json"\n'
                 '            # A dangling binding is still an alias boundary, not a plain root.\n'
                 '            if nested_binding.is_symlink() or nested_binding.exists():\n')
          if source.count(old) != 1:
              raise RuntimeError('unexpected nested binding guard')
          path.write_text(source.replace(old, new), encoding='utf-8')
          path = Path('scripts/test_hepta_module_source_roots.py')
          source = path.read_text(encoding='utf-8')
          marker = '    def test_symlink_targets_and_binding_reject(self):\n'
          addition = '''    def test_nested_alias_binding_rejects_live_and_dangling_symlinks(self):
                  binding = self.root / "implementation/BINDING.json"
                  for target in ("missing.json", "alias/BINDING.json"):
                      with self.subTest(target=target):
                          binding.symlink_to(self.root / target)
                          try:
                              with self.assertRaisesRegex(ValueError, "nested source alias"):
                                  resolve_source_roots(self.root, self.module)
                          finally:
                              binding.unlink()

          '''
          # YAML removes ten spaces from this heredoc; the method body above
          # therefore has the same indentation as the locally reviewed source.
          if source.count(marker) != 1:
              raise RuntimeError('unexpected alias regression insertion point')
          path.write_text(source.replace(marker, addition + marker), encoding='utf-8')
          PY
          just fmt
          git add scripts/hepta-implementation-maps.py scripts/hepta_ci_exec.py scripts/hepta_module_source_roots.py scripts/test_hepta_ci_exec.py scripts/test_hepta_module_source_roots.py
          git diff --check --cached
          test "$(git write-tree)" = f3236664a3de8a8327193ac4a7b3570ed376fac5
          git commit -m 'fix: reject dangling nested aliases and format integrated regression sources'
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Execute exact candidate source checks
        shell: bash
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/blocker-records"
          python3 scripts/hepta_ci_exec.py --output "$record/python.json" -- python3 -m unittest discover -v -s scripts -p 'test_hepta_*.py'
          python3 scripts/hepta_ci_exec.py --output "$record/docs.json" -- python3 scripts/hepta-docs.py verify
          python3 scripts/hepta_ci_exec.py --output "$record/inventory.json" -- python3 scripts/hepta-gap-closure.py verify
          python3 scripts/hepta_ci_exec.py --output "$record/module-maps.json" -- python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta_ci_exec.py --output "$record/format.json" -- just fmt-check
      - name: Publish a new draft-candidate branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = f3236664a3de8a8327193ac4a7b3570ed376fac5
          destination=refs/heads/work/hepta-blocker-convergence-20260913
          test -z "$(git ls-remote origin "$destination")"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "HEAD:$destination"
          output="$RUNNER_TEMP/blocker-result"
          mkdir -p "$output"
          git bundle create "$output/source.bundle" HEAD refs/heads/formatted-ranked ^be96e8eb69cd08f851eb5fce252598454b8c52c8 ^b6a5712f18427db51d603357d79c28a47e1a7d8f ^e505cd874c6e9f4ae228c3a36fb3f2439c8b918e
          git bundle list-heads "$output/source.bundle" > "$output/heads.txt"
          git rev-parse HEAD HEAD^{tree} refs/heads/formatted-ranked > "$output/identity.txt"
          (cd "$output" && sha256sum source.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-bounded-integration-result
          path: |
            ${{ runner.temp }}/blocker-result
            ${{ runner.temp }}/blocker-records
          if-no-files-found: error
          retention-days: 2
