name: hepta native Windows archive input qualification

on:
  pull_request:
    paths:
      - .github/workflows/hepta-windows-archive-input-qualification.yml
      - qualification/windows-archive-inputs-20261104/**
      - patches/rules_rust_windows_process_wrapper_skip_temp_outputs.patch
      - codex-rs/Cargo.lock
      - MODULE.bazel
      - MODULE.bazel.lock

permissions:
  contents: read

concurrency:
  group: windows-archive-inputs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-format:
    if: github.head_ref == 'fix/windows-wrapper-archive-inputs-20261104-gpt6'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Run the repository formatter and require identical source bytes
        working-directory: codex-rs
        run: |
          git fetch --no-tags --depth=1 origin 3cc71d6ec7e5e084dcecceb2757bc940459f0ada
          just fmt --base 3cc71d6ec7e5e084dcecceb2757bc940459f0ada
          git diff --exit-code HEAD -- .
  native:
    if: github.head_ref == 'fix/windows-wrapper-archive-inputs-20261104-gpt6'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment:
      name: bazel
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            config: ci-linux
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            config: ci-windows
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - name: Preserve exact Git bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: windows-archive-inputs
      - name: Run the complete original wrapper tests and native archive regression
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PROCESS_WRAPPER_QUALIFICATION_BASH="$(cygpath -w "$BASH")"
          else
            export PROCESS_WRAPPER_QUALIFICATION_BASH="$BASH"
          fi
          python3 qualification/windows-archive-inputs-20261104/run.py --config "${{ matrix.config }}" --output "$RUNNER_TEMP/windows-archive-inputs"
      - name: Retain complete native results and source identities
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-archive-inputs-${{ matrix.target }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/windows-archive-inputs
          if-no-files-found: error
          retention-days: 7
  original-lock:
    if: github.head_ref == 'fix/windows-wrapper-archive-inputs-20261104-gpt6'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: windows-archive-inputs-lock
      - name: Check the committed lock and require identical original regeneration
        run: python3 qualification/windows-archive-inputs-20261104/run_lock.py --require-committed --output "$RUNNER_TEMP/windows-archive-inputs-lock"
      - name: Retain complete original commands and generated lock bytes
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-archive-inputs-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/windows-archive-inputs-lock
          if-no-files-found: error
          retention-days: 7
