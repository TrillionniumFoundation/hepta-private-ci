name: intuition.policy Reviewed Source Authoring V2

on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths:
      - ".github/workflows/intuition-source-author-v2.yml"
      - ".github/intuition-authoring-patch/READY"

permissions:
  contents: write

concurrency:
  group: intuition-reviewed-source-authoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  author:
    name: Recover, verify, and publish reviewed source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out immutable authoring head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Recover exact reviewed patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee "$RUNNER_TEMP/intuition-authoring-validate.log") 2>&1
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'AUTHORING_HEAD=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"

          ready=.github/intuition-authoring-patch/READY
          base="$(sed -n 's/^base=//p' "$ready" | tr -d '\r')"
          part_000="$(sed -n 's/^part-000=//p' "$ready" | tr -d '\r')"
          part_001="$(sed -n 's/^part-001=//p' "$ready" | tr -d '\r')"
          part_002="$(sed -n 's/^part-002=//p' "$ready" | tr -d '\r')"
          test "$base" = "696447e733e22e425cd05691d98f4fe0ef63f759"
          test "$part_000" = "ff90ec4b0bb594c6659c0805f7683e625f423d46"
          test "$part_001" = "8ef03a50ccef25591918ed67fb42506bcfdd21f1"
          test "$part_002" = "627e323cc4086e712a04ffa58b02e7723415e64c"
          test "$(git cat-file -t "$base")" = commit

          : > .git/intuition-source.patch
          for blob in "$part_000" "$part_001" "$part_002"; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content \
              | tr -d '\n' \
              | base64 --decode \
              >> .git/intuition-source.patch
          done

          expected=65975856ab09997a83bc4587639c6f3e49b07f5c5c9fafb283d01c1a2efce920
          actual="$(sha256sum .git/intuition-source.patch | awk '{print $1}')"
          bytes="$(wc -c < .git/intuition-source.patch | tr -d ' ')"
          printf 'reviewed_patch_sha256=%s\nreviewed_patch_bytes=%s\n' "$actual" "$bytes"
          test "$actual" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          patch = Path('.git/intuition-source.patch').read_bytes()
          if not patch.startswith(b'diff --git a/'):
              raise SystemExit('reviewed object does not begin with a Git patch header')
          print('reviewed_patch_tail=', repr(patch[-96:]))
          PY
          printf '%s  %s\n' "$expected" intuition-source.patch > .git/intuition-source.patch.sha256
          printf 'method=raw-git-blob-concatenation\nsha256=%s\nbytes=%s\n' \
            "$expected" "$bytes" > .git/intuition-source.patch.recovery

          # Git, rather than an incidental final-newline heuristic, is the source
          # of truth for whether the reviewed bytes form an applicable patch.
          git apply --check .git/intuition-source.patch
          git apply --index .git/intuition-source.patch

          rm -rf .github/intuition-authoring-patch
          rm -f .github/workflows/intuition-source-export.yml
          rm -f .github/workflows/intuition-source-author-v2.yml
          rm -f .github/workflows/intuition-source-author-self-hosted.yml
          rm -f .github/workflows/intuition-source-author-pocket4.yml
          rm -f .github/workflows/intuition-source-author-macbook.yml

      - name: Preserve reviewed patch evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intuition-source-authoring-evidence"
          mkdir -p "$output"
          cp "$RUNNER_TEMP/intuition-authoring-validate.log" "$output/validate.log" 2>/dev/null || true
          cp .git/intuition-source.patch "$output/source.patch" 2>/dev/null || true
          cp .git/intuition-source.patch.sha256 "$output/source.patch.sha256" 2>/dev/null || true
          cp .git/intuition-source.patch.recovery "$output/source.patch.recovery" 2>/dev/null || true
          git status --short > "$output/status.txt"
          git diff --binary > "$output/worktree.patch"
          git diff --cached --binary > "$output/index.patch"

      - name: Upload reviewed patch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-reviewed-source-${{ env.AUTHORING_HEAD }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-source-authoring-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Set up repository CI dependencies
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Verify source, compatibility, and final-use boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cd ..
          python3 scripts/intuition_legacy_consumers.py
          python3 -m unittest discover -s scripts/tests -p 'test_intuition*.py' -v
          cd codex-rs
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence intuition
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_final_use_v4
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_commit_boundary
          cargo test --locked -p codex-hepta-agentd --lib intuition_policy
          cargo clippy --locked -p codex-hepta-agentd --lib --tests -- -D warnings
          cargo fmt --all -- --check

      - name: Publish one clean source commit with exact lease
        shell: bash
        env:
          TARGET_BRANCH: codex/intuition-policy-production-closure-20260927
          CLEAN_PARENT: 696447e733e22e425cd05691d98f4fe0ef63f759
        run: |
          set -euo pipefail
          git diff --check
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "OpenAI source authoring"
          git config user.email "assistant@openai.invalid"
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^\.github/(intuition-authoring-patch|workflows/intuition-source-(export|author-v2|author-self-hosted|author-pocket4|author-macbook)\.yml)' || true)"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(intuition): revalidate authority at final use' \
            'Preserve the sole ledger owner while moving fresh time, generation, and three-party qualification checks under its serialization boundary. Add typed boundary domains, stage telemetry, legacy-consumer drift checks, and separate safety/effectiveness/operator acceptance states.' \
            | git commit-tree "$tree" -p "$CLEAN_PARENT")"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORING_HEAD" \
            origin "$commit:refs/heads/$TARGET_BRANCH"
          printf 'published_tree=%s\npublished_commit=%s\n' "$tree" "$commit"
