name: ui.control qualification diagnostics

on:
  push:
    branches:
      - "work/ui-control-*"
    paths:
      - "apps/hepta-control-ui/**"
      - "docs/modules/ui.control/**"
      - "qualification/ui-control/**"
      - "qualification/module-execution-dossiers/detail/ui.control.md"
      - "scripts/ui-control-artifacts.mjs"
      - "scripts/ui-control-status.mjs"
      - "scripts/hepta-lane-b-path-guard.py"
      - "scripts/test_hepta_lane_b_path_guard.py"
      - "scripts/hepta-lane-b-truth.py"
      - "scripts/test_hepta_lane_b_truth.py"
      - ".github/workflows/ui-control-node-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-control-qualification-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-diagnostics:
    name: isolate generated-truth qualification failures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22

      - id: artifacts
        name: Generated technical artifacts
        continue-on-error: true
        run: node scripts/ui-control-artifacts.mjs --check

      - id: status
        name: Generated status and gate map
        continue-on-error: true
        run: node scripts/ui-control-status.mjs --check

      - id: path_self
        name: Lane B path guard self-test
        continue-on-error: true
        run: python3 scripts/hepta-lane-b-path-guard.py self-test

      - id: path_unit
        name: Lane B path guard unit tests
        continue-on-error: true
        run: python3 -m unittest scripts/test_hepta_lane_b_path_guard.py

      - id: path_verify
        name: Lane B path guard verification
        continue-on-error: true
        run: python3 scripts/hepta-lane-b-path-guard.py verify

      - id: truth_self
        name: Lane B truth self-test
        continue-on-error: true
        run: python3 scripts/hepta-lane-b-truth.py self-test

      - id: truth_unit
        name: Lane B truth unit tests
        continue-on-error: true
        run: python3 -m unittest scripts/test_hepta_lane_b_truth.py

      - id: truth_verify
        name: Lane B truth verification
        continue-on-error: true
        run: python3 scripts/hepta-lane-b-truth.py verify

      - name: Fail on any diagnostic failure
        shell: bash
        env:
          ARTIFACTS: ${{ steps.artifacts.outcome }}
          STATUS: ${{ steps.status.outcome }}
          PATH_SELF: ${{ steps.path_self.outcome }}
          PATH_UNIT: ${{ steps.path_unit.outcome }}
          PATH_VERIFY: ${{ steps.path_verify.outcome }}
          TRUTH_SELF: ${{ steps.truth_self.outcome }}
          TRUTH_UNIT: ${{ steps.truth_unit.outcome }}
          TRUTH_VERIFY: ${{ steps.truth_verify.outcome }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "artifacts=$ARTIFACTS" \
            "status=$STATUS" \
            "path_self=$PATH_SELF" \
            "path_unit=$PATH_UNIT" \
            "path_verify=$PATH_VERIFY" \
            "truth_self=$TRUTH_SELF" \
            "truth_unit=$TRUTH_UNIT" \
            "truth_verify=$TRUTH_VERIFY"
          test "$ARTIFACTS" = success
          test "$STATUS" = success
          test "$PATH_SELF" = success
          test "$PATH_UNIT" = success
          test "$PATH_VERIFY" = success
          test "$TRUTH_SELF" = success
          test "$TRUTH_UNIT" = success
          test "$TRUTH_VERIFY" = success
