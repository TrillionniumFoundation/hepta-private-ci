name: Inference worker authoritative convergence

on:
  push:
    branches:
      - codex/inference-worker-authoritative-20260929
    paths:
      - .github/materialization/inference-worker-stage1/**
      - .github/materialization/inference-worker-stage2/**
      - .github/workflows/inference-worker-authoritative-materialize.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-authoritative-materialize
  cancel-in-progress: true

env:
  BASE_SHA: c3b3aaa9887e15bf18b1572f259b6893ddbe2b68
  BRANCH_NAME: codex/inference-worker-authoritative-20260929
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  converge:
    name: Materialize resource and deadline closure
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact transfer head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and verify reviewed stage-1 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"

          verify_blob() {
            local expected="$1"
            local path="$2"
            local actual
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              printf 'staged blob mismatch: %s expected=%s actual=%s\n' \
                "$path" "$expected" "$actual" >&2
              exit 1
            }
          }

          verify_blob 61f5e74ef904016978740b7cb5905bb395522fe4 .github/materialization/inference-worker-stage1/part00
          verify_blob 47cae9999ae5fefecf25a2c4c811a9556fce33a8 .github/materialization/inference-worker-stage1/part01
          verify_blob b2ec3f29753afac2e7bb2204af42d7efb650edfd .github/materialization/inference-worker-stage1/part02
          verify_blob 23c5c0082a42a3f1dc3d5efbd38c5ec5d82a4d8a .github/materialization/inference-worker-stage1/part03
          verify_blob 9db3cb414b089b697cad7cde23a0d6a06c90fd11 .github/materialization/inference-worker-stage1/part0405
          verify_blob 56df0a88a2030a690040146a2850e43cbe1577f4 .github/materialization/inference-worker-stage1/part0607
          verify_blob 362990c01fd8019874f697c4e5bc8a8cb81a4a7e .github/materialization/inference-worker-stage1/part0809

          LC_ALL=C cat \
            .github/materialization/inference-worker-stage1/part00 \
            .github/materialization/inference-worker-stage1/part01 \
            .github/materialization/inference-worker-stage1/part02 \
            .github/materialization/inference-worker-stage1/part03 \
            .github/materialization/inference-worker-stage1/part0405 \
            .github/materialization/inference-worker-stage1/part0607 \
            .github/materialization/inference-worker-stage1/part0809 \
            | base64 --decode > "$RUNNER_TEMP/inference-worker-stage1.patch"
          sha256sum "$RUNNER_TEMP/inference-worker-stage1.patch"
          git apply --check --verbose "$RUNNER_TEMP/inference-worker-stage1.patch"
          git apply "$RUNNER_TEMP/inference-worker-stage1.patch"

      - name: Apply worker-owned deadline and kill boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/materialization/inference-worker-stage2/apply.py.gz.b64)" = ec08a862c786e9474f326b11b1bcf68420724599
          base64 --decode .github/materialization/inference-worker-stage2/apply.py.gz.b64 \
            | gzip --decompress > "$RUNNER_TEMP/inference-worker-stage2.py"
          python3 "$RUNNER_TEMP/inference-worker-stage2.py"

      - name: Bind source and lifecycle work-package status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/modules/inference.worker/TECHNICAL.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "#### `INFER-V4-T4`\n\n- State: `planned`; priority: `2`; parallel class: `contract_coordinated`.":
                  "#### `INFER-V4-T4`\n\n"
                  "- Source state: `source_implemented`.\n"
                  "- Product composition state: `product_composition_pending`.\n"
                  "- External qualification state: `external_qualification_pending`.\n"
                  "- Priority: `2`; parallel class: `contract_coordinated`.",
              "#### `INFER-V4-T5`\n\n- State: `planned`; priority: `2`; parallel class: `contract_coordinated`.":
                  "#### `INFER-V4-T5`\n\n"
                  "- Source state: `source_implemented`.\n"
                  "- Product composition state: `product_composition_pending`.\n"
                  "- External qualification state: `external_qualification_pending`.\n"
                  "- Priority: `2`; parallel class: `contract_coordinated`.",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one work-package status marker: {old!r}")
              text = text.replace(old, new)
          anchor = (
              "Source implementation completes only when the declared target root exists, public surfaces match registries, "
              "tests pass and exact-head plus merge-candidate evidence is current. Later planned packages may remain without "
              "invalidating documentation closure."
          )
          addition = anchor + (
              "\n\nJournal checkpoint, archive, schema migration and authenticated retirement remain owned by "
              "`inference.control`. `inference.worker` consumes that single owner through its registered port and must not "
              "introduce a second journal or recovery authority. Product composition remains pending until the accepted "
              "control-owner implementation is composed and exact-candidate evidence is current."
          )
          if text.count(anchor) != 1:
              raise SystemExit("source-completion anchor drifted")
          text = text.replace(anchor, addition)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format reviewed Rust surfaces
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 \
            codex-rs/hepta-infer-core/src/native_control.rs \
            codex-rs/hepta-infer-core/src/native_control_tests.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/driver.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/resources.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/resources_tests.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local_tests.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs \
            codex-rs/hepta-infer-worker-host/src/native_recovery.rs \
            codex-rs/hepta-infer-worker-host/src/native_run_control.rs \
            codex-rs/hepta-infer-worker-host/src/native_run_control_tests.rs
          git diff --check

      - name: Run durable inference core tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-core

      - name: Run authoritative local worker tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-worker-host \
            --features experimental-local-model

      - name: Run strict worker lint and all-target check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-worker-host \
            --all-targets \
            --features experimental-local-model
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-worker-host \
            --all-targets \
            --features experimental-local-model \
            -- -D warnings

      - name: Verify exact final tree surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/materialization/inference-worker-stage1
          rm -rf .github/materialization/inference-worker-stage2
          rm -f .github/workflows/inference-worker-authoritative-materialize.yml
          rm -f .github/workflows/inference-worker-qualification.yml
          python3 - <<'PY'
          import subprocess

          expected = sorted([
              '.github/workflows/inference-worker-authoritative-qualification.yml',
              '.github/workflows/inference-worker-qualification.yml',
              'codex-rs/hepta-infer-core/src/native_control.rs',
              'codex-rs/hepta-infer-core/src/native_control_tests.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local/driver.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local/resources.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local/resources_tests.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local_tests.rs',
              'codex-rs/hepta-infer-worker-host/src/native_app_server.rs',
              'codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs',
              'codex-rs/hepta-infer-worker-host/src/native_recovery.rs',
              'codex-rs/hepta-infer-worker-host/src/native_run_control.rs',
              'codex-rs/hepta-infer-worker-host/src/native_run_control_tests.rs',
              'docs/modules/inference.worker/LOCAL_MODEL_RECOVERY.md',
              'docs/modules/inference.worker/RECOVERY_AND_OPERATIONS.md',
              'docs/modules/inference.worker/TECHNICAL.md',
              'scripts/inference_worker_command_receipt.py',
              'scripts/run_inference_worker_qualification_lane.sh',
              'scripts/test_inference_worker_command_receipt.py',
          ])
          actual = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only',
               'c3b3aaa9887e15bf18b1572f259b6893ddbe2b68', '--'],
              text=True,
          ).splitlines()))
          if actual != expected:
              raise SystemExit(f'unexpected final tree surface: {actual!r}')
          PY
          git diff --check

      - name: Commit and push verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-inference-materializer
          git config user.email hepta-inference-materializer@users.noreply.github.com
          git add -A
          git commit -m 'inference.worker: enforce absolute deadlines and hard-kill recovery'
          git fetch origin "$BRANCH_NAME"
          git rebase "origin/$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
