name: Hepta Supervisor P0 Cross-Platform Restart Qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-supervisor/**"
      - "codex-rs/hepta-agent-protocol/**"
      - ".github/workflows/hepta-supervisor-p0-crossplatform.yml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "codex-rs/.config/nextest.toml"
      - "scripts/run-nextest.py"
      - "justfile"
      - ".github/actions/setup-ci-tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-linux-restart:
    name: Restart and signed recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: codex-rs
        shell: bash
    steps:
      - name: Checkout exact PR head without write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git show -s --format='source=%H tree=%T parents=%P'
          git diff --check

      - name: Initialize isolated Cargo target directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/hepta-supervisor-p0-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install repository CI tools
        uses: ./.github/actions/setup-ci-tools

      - name: Install pinned nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103

      - name: Install pinned Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy,rust-src
      - name: Execute actual restart budget, repeated recovery and signed intent recovery
        run: just test --locked -p codex-hepta-supervisor --test restart_budget --test restart_budget_recovery --test signed_intent_recovery --no-tests fail --retries 0 --status-level all --final-status-level all

      - name: Verify named native test evidence
        shell: bash
        run: |
          python - <<'PYTEST'
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import xml.etree.ElementTree as ET

          expected_sha = os.environ["EXPECTED_SOURCE_SHA"]
          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source_sha != expected_sha:
              raise SystemExit("source HEAD changed during native tests")
          report = Path(os.environ["GITHUB_WORKSPACE"]) / "codex-rs/target/nextest/local/junit.xml"
          cases = ET.parse(report).findall(".//testcase")
          expected = ['unexpected_agent_crashes_back_off_and_stop_after_three_restarts', 'restart_budget_survives_repeated_supervisord_recovery', 'unsigned_digest_abort_directive_cannot_clear_signed_production_recovery_fence']
          for name in expected:
              matching = [case for case in cases if case.get("name") == name]
              if len(matching) != 1:
                  raise SystemExit(f"expected exactly one native result for {name}")
          for case in cases:
              if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                  raise SystemExit(f"native case did not pass: {case.get('name')}")
          print(json.dumps({"source_sha": source_sha, "platform": platform.system(),
                            "passed": len(cases), "required_tests": expected}, sort_keys=True))
          PYTEST

      - name: Execute the complete Agentd protocol package
        run: just test --locked -p codex-hepta-agent-protocol --profile default --test-threads 2 --no-tests fail --retries 0 --status-level all --final-status-level all

      - name: Verify signed protocol wire regression evidence
        shell: bash
        run: |
          python - <<'PYTEST'
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import xml.etree.ElementTree as ET

          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source_sha != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("source HEAD changed during protocol tests")
          report = Path(os.environ["GITHUB_WORKSPACE"]) / "codex-rs/target/nextest/default/junit.xml"
          cases = ET.parse(report).findall(".//testcase")
          required = "tests::automation_effect_wire_round_trip_is_strict_and_bounded"
          matching = [case for case in cases if case.get("name") == required]
          if len(matching) != 1:
              raise SystemExit("missing unique signed protocol wire regression result")
          for case in cases:
              if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                  raise SystemExit(f"protocol case did not pass: {case.get('name')}")
          print(json.dumps({"source_sha": source_sha, "platform": platform.system(),
                            "passed": len(cases), "required_test": required}, sort_keys=True))
          PYTEST

      - name: Strict Supervisor Clippy
        run: cargo +1.95.0 clippy --locked -p codex-hepta-supervisor --all-targets -- -D warnings

      - name: Verify full-workspace canonical Rust format on Linux
        if: always() && runner.os == 'Linux'
        run: cargo +1.95.0 fmt --all -- --check
      - name: Verify Supervisor canonical Rust format on Windows
        if: always() && runner.os == 'Windows'
        # A Windows runner cannot pass the entire huge Hepta workspace to
        # rustfmt in one command (OS error 206: argument list too long).
        # The same complete workspace is independently checked on Linux.
        run: cargo +1.95.0 fmt -p codex-hepta-supervisor -- --check

      - name: Preserve native JUnit evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-supervisor-p0-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: codex-rs/target/nextest/local/junit.xml
          if-no-files-found: error

      - name: Preserve Agentd protocol JUnit evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-agent-protocol-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: codex-rs/target/nextest/default/junit.xml
          if-no-files-found: error

      - name: Ensure test checkout remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
