name: intuition.policy Decode Partial Carrier Once

on:
  push:
    branches: [codex/intuition-policy-final-use-recovery-20260929]
    paths:
      - ".github/workflows/intuition-decode-partial-once.yml"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Decode the immutable reviewed prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import subprocess
          blobs = [
              'ff90ec4b0bb594c6659c0805f7683e625f423d46',
              '8ef03a50ccef25591918ed67fb42506bcfdd21f1',
              '627e323cc4086e712a04ffa58b02e7723415e64c',
          ]
          encoded = b''.join(b''.join(subprocess.check_output(['git', 'cat-file', 'blob', blob]).split()) for blob in blobs)
          decoded = base64.b64decode(encoded, validate=True)
          pathlib.Path('.github/intuition-authoring-patch/decoded-reviewed-prefix.patch').write_bytes(decoded)
          print(f'encoded={len(encoded)} decoded={len(decoded)}')
          PY
          git add .github/intuition-authoring-patch/decoded-reviewed-prefix.patch
          git config user.name "OpenAI source recovery"
          git config user.email "assistant@openai.invalid"
          git commit -m "chore(intuition): expose reviewed patch prefix for recovery"
          git push origin HEAD:codex/intuition-policy-final-use-recovery-20260929
