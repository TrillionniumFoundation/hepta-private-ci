name: control.runtime one-shot convergence bootstrap

on:
  push:
    branches:
      - codex/control-runtime-convergence-v1
    paths:
      - .github/workflows/control-runtime-apply-fixes.yml

permissions:
  contents: write

concurrency:
  group: control-runtime-convergence-bootstrap
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 74e81e3d868d3127f80ca6da9385179188e2b363
  EXPECTED_BRANCH: codex/control-runtime-convergence-v1
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Acquire exact branch lease
        shell: bash
        run: |
          set -euo pipefail
          checked_head="$(git rev-parse HEAD)"
          checked_parent="$(git rev-parse HEAD^)"
          remote_head="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$checked_parent" = "$EXPECTED_PARENT"
          test "$checked_head" = "$remote_head"
          echo "CHECKED_HEAD=$checked_head" >> "$GITHUB_ENV"

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev

      - name: Apply prepared source and mapping convergence
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/.control-runtime-finalize-1.py.part \
            scripts/.control-runtime-finalize-2.py.part \
            scripts/.control-runtime-finalize-3.py.part \
            scripts/.control-runtime-finalize-4.py.part \
            > "$RUNNER_TEMP/control-runtime-finalize.py"
          python3 "$RUNNER_TEMP/control-runtime-finalize.py"

      - name: Close portable stale-lock and public health-contract gaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one block in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          core = "codex-rs/hepta-control-plane/src/planner_store_core.rs"
          replace_once(
              core,
              '''/// RAII owner lock. On Linux, a lock left by an exited process is reclaimed
          /// only when the recorded PID/start-time pair is no longer current. On other
          /// targets an existing lock fails closed.
          ''',
              '''/// RAII compatibility sidecar for the public OS-backed owner lock.
          /// Linux binds the token to PID plus process start time. Other targets use a
          /// process-local token and reclaim it only after the OS owner lock has proved
          /// that no live writer still owns the directory.
          ''',
          )
          replace_once(
              core,
              '''#[cfg(not(target_os = "linux"))]
          fn process_token(pid: u32) -> Result<Option<String>, PlannerStoreError> {
              Ok(Some(pid.to_string()))
          }
          ''',
              '''#[cfg(not(target_os = "linux"))]
          fn process_token(pid: u32) -> Result<Option<String>, PlannerStoreError> {
              if pid == std::process::id() {
                  Ok(Some(format!("{pid}:portable-v1")))
              } else {
                  Ok(None)
              }
          }
          ''',
          )

          wrapper = "codex-rs/hepta-control-plane/src/planner_store.rs"
          replace_once(
              wrapper,
              '''    pub(crate) fn ensure_healthy(&self) -> Result<(), PlannerStoreError> {
          ''',
              '''    /// Verify that the owner can still make authoritative observations.
              /// A poisoned handle retains records for diagnostics only; callers must
              /// drop and reopen before using them for authorization or recovery.
              pub fn ensure_healthy(&self) -> Result<(), PlannerStoreError> {
          ''',
          )
          PY

      - name: Remove derived-tree and self-publishing machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/control-runtime-apply-fixes.yml
          rm -f .github/workflows/control-runtime-apply-fixes-macos.yml
          rm -f .github/workflows/control-runtime-export-source.yml
          rm -f .control-runtime-finalize-*.part

      - name: Canonical formatting
        working-directory: codex-rs
        run: |
          cargo fmt -p codex-hepta-control-plane
          cargo fmt -p codex-hepta-agentd
          cargo fmt -p codex-hepta-ndu
          cargo fmt -p codex-hepta-control-plane -p codex-hepta-agentd -p codex-hepta-ndu -- --check

      - name: Refresh implementation-map Git object identities
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          export INDEX_TREE="$(git write-tree)"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path("docs/modules/control.runtime/IMPLEMENTATION_MAP.json")
          implementation = json.loads(path.read_text(encoding="utf-8"))
          source_objects = implementation.get("sourceObjects")
          if not isinstance(source_objects, list):
              raise SystemExit("sourceObjects must be a list")
          tree = os.environ["INDEX_TREE"]
          for source_object in source_objects:
              source_path = source_object.get("path")
              if not isinstance(source_path, str) or not source_path:
                  raise SystemExit("source object path must be non-empty")
              source_object["object"] = subprocess.check_output(
                  ["git", "rev-parse", f"{tree}:{source_path}"], text=True
              ).strip()
          path.write_text(
              json.dumps(implementation, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git add docs/modules/control.runtime/IMPLEMENTATION_MAP.json
          git diff --cached --check

      - name: Resolve verified build inputs
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Validate canonical state
        run: python3 scripts/control_runtime_validate_state.py --output "$RUNNER_TEMP/control-runtime-state.json"

      - name: Run package regression suite
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-control-plane -p codex-hepta-agentd -p codex-hepta-ndu

      - name: Compile all targets
        working-directory: codex-rs
        run: cargo check --locked --all-targets -p codex-hepta-control-plane -p codex-hepta-agentd -p codex-hepta-ndu

      - name: Enforce strict lint
        working-directory: codex-rs
        run: cargo clippy --locked --all-targets -p codex-hepta-control-plane -p codex-hepta-agentd -p codex-hepta-ndu -- -D warnings

      - name: Publish one ordinary fast-forward commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --cached --check
          remote_head="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$CHECKED_HEAD"
          git config user.name "control-runtime-convergence"
          git config user.email "control-runtime-convergence@users.noreply.github.com"
          git commit -m "fix(control.runtime): publish exact convergence source"
          git push origin "HEAD:$EXPECTED_BRANCH"
