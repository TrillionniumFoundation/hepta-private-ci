name: control.runtime one-shot rustfmt

on:
  push:
    branches:
      - codex/control-runtime-full-closure-2026-09-27
    paths:
      - .github/workflows/control-runtime-rustfmt-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/control-runtime-full-closure-2026-09-27
          fetch-depth: 0
      - name: Apply repository Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all
      - name: Commit formatting delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- codex-rs; then
            echo "No formatting delta."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs
          git commit -m "style(control.runtime): apply canonical rustfmt"
          git push origin HEAD:codex/control-runtime-full-closure-2026-09-27
