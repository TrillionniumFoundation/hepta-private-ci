name: control.runtime one-shot closure sync

on:
  push:
    branches:
      - codex/control-runtime-full-closure-2026-09-27
    paths:
      - .github/workflows/control-runtime-rustfmt-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closure-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/control-runtime-full-closure-2026-09-27
          fetch-depth: 0
      - name: Synchronize as-built maturity truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')
          branch = 'codex/control-runtime-full-closure-2026-09-27'

          maturity_path = root / 'docs/modules/control.runtime/MATURITY.json'
          maturity = json.loads(maturity_path.read_text(encoding='utf-8'))
          maturity['sourceObservation']['candidateBranch'] = branch
          maturity['productCallerState'] = (
              'read_only_agentd_source_composed_request_integrity_v2_'
              'global_planner_not_composed'
          )
          maturity['productionWriterState'] = (
              'planner_store_source_candidate_unqualified_'
              'named_product_writer_not_composed'
          )
          subsystems = maturity['subsystems']
          subsystems['plannerKernel'].update({
              'state': 'source_candidate_implemented',
              'productionComposed': False,
              'authority': 'deny_all',
          })
          subsystems['plannerPublicBoundary'].update({
              'state': 'source_candidate_implemented',
              'productionComposed': False,
              'controls': [
                  'exact_required_owner_set',
                  'duplicate_final_payload_rejection',
                  'sealed_candidate_and_policy_revalidation',
              ],
          })
          subsystems['plannerStore'].update({
              'state': 'source_candidate_implemented_unqualified',
              'productionComposed': False,
          })
          subsystems['readOnlyAgentdContextCaller'] = {
              'state': 'source_composed_candidate_request_integrity_v2',
              'productionComposed': True,
              'scope': 'authenticated_bounded_read_only_context_delivery',
              'controls': [
                  'final_use_plan_receipt_delivery_seal',
                  'canonical_authenticated_record_set',
                  'request_query_retrieval_ranker_binding',
                  'monotonic_process_generation_lease',
                  'bounded_issued_seal_registry',
              ],
              'remaining': [],
          }
          subsystems['plannerExecutionCoordinator'] = {
              'state': 'source_candidate_implemented_not_product_composed',
              'productionComposed': False,
              'controls': [
                  'deny_all_request_set_admission',
                  'independent_authority_port',
                  'final_payload_and_expiry_revalidation',
                  'durable_authority_request_and_grant_evidence',
                  'signed_terminal_observation_validation',
                  'indeterminate_stop_and_signed_reconciliation',
              ],
          }
          subsystems['globalPlannerCaller'] = {
              'state': 'not_composed',
              'productionComposed': False,
          }
          subsystems['authorityConsumer'] = {
              'state': 'typed_port_and_validation_source_candidate_no_named_product_consumer',
              'productionComposed': False,
          }
          subsystems['effectExecutor'] = {
              'state': 'typed_port_and_signed_terminal_validation_source_candidate_no_named_product_executor',
              'productionComposed': False,
          }
          subsystems['terminalReconciliation'] = {
              'state': 'typed_port_and_signed_receipt_validation_source_candidate_no_named_product_reconciler',
              'productionComposed': False,
          }
          maturity['qualification'] = {
              'exactHead': 'pending_current_candidate_runs',
              'syntheticMerge': 'pending_current_candidate_runs',
              'packageTests': 'passed_on_predecessor_2f5ae97_rerun_required_current_candidate',
              'allTargetCompilation': 'passed_on_predecessor_2f5ae97_rerun_required_current_candidate',
              'strictClippy': 'passed_on_predecessor_2f5ae97_rerun_required_current_candidate',
              'formatting': 'canonical_rustfmt_applied_current_candidate_run_required',
              'nduCallerRegression': 'pending_current_candidate_runs',
              'namedHost': 'pending_current_candidate_runs',
          }
          maturity['completion'].update({
              'nativePlanningKernel': 'candidate_implemented',
              'publicBoundaryGuards': 'candidate_implemented',
              'ownerLocalDurabilityReference': 'candidate_implemented',
              'productionDurabilityCandidate': 'candidate_implemented_unqualified',
              'readOnlyAgentdProductCaller': 'source_composed_candidate_request_integrity_v2',
              'plannerExecutionCoordinator': 'source_candidate_implemented_not_product_composed',
              'globalPlannerProductCaller': 'not_established',
              'productionWriter': 'not_established',
              'authorityConsumer': 'not_established',
              'effectExecutor': 'not_established',
              'terminalReconciler': 'not_established',
              'canonicalExternalProtocolAdmission': 'not_established',
              'exactHeadQualification': 'pending',
              'independentAcceptanceState': 'not_established',
              'activationState': 'not_established',
              'releaseState': 'not_established',
          })
          maturity['nonClaims'] = [
              'No planner output is a capability.',
              'The generic execution coordinator is not a named activated Agentd global-planner caller.',
              'Source-level authority, executor and reconciler ports are not production implementations.',
              'No source candidate establishes operator acceptance, canary promotion or activation.',
              'No tracked manifest self-authenticates the commit that contains it.',
              'The Unix durability profile is not a Windows durability qualification.',
              'A read-only Agentd context caller is not a global planner production caller.',
          ]
          maturity_path.write_text(json.dumps(maturity, indent=2) + '\n', encoding='utf-8')

          generator_path = root / 'scripts/hepta-control-runtime-maturity.py'
          generator = generator_path.read_text(encoding='utf-8')
          generator = generator.replace(
              '        "plannerStore",\n        "readOnlyAgentdContextCaller",',
              '        "plannerStore",\n        "plannerExecutionCoordinator",\n        "readOnlyAgentdContextCaller",',
          )
          new_render = '''def render_current(manifest: dict[str, Any]) -> str:
              subsystems = manifest["subsystems"]
              rows = [
                  ("Planner kernel", "plannerKernel"),
                  ("Public planner guard", "plannerPublicBoundary"),
                  ("Planner store", "plannerStore"),
                  ("Planner execution coordinator", "plannerExecutionCoordinator"),
                  ("Agentd read-only context caller", "readOnlyAgentdContextCaller"),
                  ("Global planner caller", "globalPlannerCaller"),
                  ("Organ host", "organHost"),
                  ("Embodiment reference", "embodimentReference"),
                  ("Authority consumer", "authorityConsumer"),
                  ("Effect executor", "effectExecutor"),
                  ("Terminal reconciliation", "terminalReconciliation"),
              ]
              lines = [
                  "# control.runtime current implementation",
                  "",
                  "> Generated from `MATURITY.json`. Do not hand-edit state claims in this file.",
                  "",
                  "## Current claim boundary",
                  "",
                  "`control.runtime` has a deterministic deny-all planner kernel, strict public input guards, a crash-bounded `PlannerStoreV1` source candidate, a generic source-level authority/executor/reconciliation coordinator, and one authenticated bounded read-only Agentd context caller. The Agentd caller now uses a canonical authenticated record set, a request/query/retrieval/ranker-bound delivery seal, final-use plan-receipt binding and a monotonic process-generation lease. It does **not** yet have a named global-planner product caller, selected production writer, independently admitted production authority consumer, production effect executor, production reconciler, activation, canary promotion or release.",
                  "",
                  "| Subsystem | Current state | Product composition |",
                  "|---|---|---:|",
              ]
              for label, key in rows:
                  value = subsystems[key]
                  composed = "yes" if value["productionComposed"] else "no"
                  if key == "readOnlyAgentdContextCaller" and value["productionComposed"]:
                      composed = "yes, bounded read-only scope"
                  lines.append(f"| {label} | `{value['state']}` | {composed} |")
              lines.extend(
                  [
                      "",
                      "## Durable store controls",
                      "",
                      "The source candidate implements a versioned self-validating image, exclusive writer lock, exact canonical bodies, typed evidence parent links, temp write, file and directory `fsync`, atomic replacement, indeterminate poisoning, crash failpoints, legacy digest-only migration, bounded retention compaction, monotonic backup restore, and externally anchored checkpoints. It remains unqualified and uncomposed until current exact-head and target-host evidence passes.",
                      "",
                      "## Request-integrity controls",
                      "",
                      "The bounded Agentd context path authenticates the exact owner cut and selected record set, binds owner/generation/query/limit/request/retrieval/ranker identity, seals the raw planner receipt, uses a bounded monotonic lease registry, and repeats owner-cut, content, retrieval, ranker and lease validation immediately before final use.",
                      "",
                      "## Execution closure",
                      "",
                      "`PlannerExecutionCoordinatorV1` consumes deny-all grant requests, calls an independent authority port, validates payload- and expiry-bound grants, persists request/grant/terminal evidence, stops on indeterminate outcomes, and accepts only signed reconciliation receipts. These are source contracts and fixtures, not named activated Agentd production ports.",
                      "",
                      "## Qualification and governance",
                      "",
                      "Current exact-head and synthetic-merge checks must pass for the final candidate. Independent semantic review, operator acceptance, activation, canary promotion and release remain externally governed and false. A branch name, generated file, or `IMPLEMENTATION_MAP.json` provenance field is not an exact-source execution receipt.",
                      "",
                  ]
              )
              return "\\n".join(lines)

          '''
          generator, count = re.subn(
              r'def render_current\(manifest: dict\[str, Any\]\) -> str:\n.*?(?=def projected_map)',
              new_render,
              generator,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'failed to replace render_current: {count}')
          generator_path.write_text(generator, encoding='utf-8')

          lane_path = root / 'docs/readiness/LANE_D_MATURITY.json'
          lane = json.loads(lane_path.read_text(encoding='utf-8'))
          control = next(row for row in lane['modules'] if row['module'] == 'control.runtime')
          dimensions = control['dimensions']
          dimensions['durability'] = {
              'state': 'planner_store_source_candidate_implemented_not_product_composed',
              'evidence': [
                  'codex-rs/hepta-control-plane/src/planner_store.rs::PlannerStoreV1',
                  'codex-rs/hepta-control-plane/src/planner_store_tests_unix.rs',
              ],
          }
          dimensions['effectAuthority'] = {
              'state': 'planner_deny_all_independent_authority_port_source_candidate_not_product_composed',
              'evidence': [
                  'AuthorityPosture::DENY_ALL',
                  'IndependentPlannerAuthorityV1',
                  'VerifiedExecutionGrantV1',
              ],
          }
          dimensions['exactHeadSourceQualification'] = {
              'state': 'pending_current_candidate_workflows',
              'evidence': [
                  '.github/workflows/hepta-lane-d-semantic-conformance.yml',
                  '.github/workflows/hepta-ndu-recursion.yml',
                  '.github/workflows/hepta-consolidated-source.yml',
              ],
          }
          dimensions['productCaller'] = {
              'state': 'read_only_agentd_context_source_composed_global_planner_not_composed',
              'evidence': [
                  'codex-rs/hepta-agentd/src/cognitive_context_v2/read.rs',
                  'codex-rs/hepta-agentd/src/cognitive_context_v2/verify.rs',
                  'codex-rs/hepta-control-plane/src/planner_context.rs',
              ],
          }
          dimensions['productionWriter'] = {
              'state': 'planner_store_source_candidate_not_selected_or_activated',
              'evidence': [
                  'codex-rs/hepta-control-plane/src/planner_store.rs::PlannerStoreV1',
              ],
          }
          dimensions['requestLevelIntegrity'] = {
              'state': 'source_composed_candidate_request_integrity_v2',
              'evidence': [
                  'codex-rs/hepta-agentd/src/cognitive_context_v2/helpers.rs',
                  'codex-rs/hepta-agentd/src/cognitive_context_v2/read.rs',
                  'codex-rs/hepta-agentd/src/cognitive_context_v2/verify.rs',
              ],
          }
          dimensions['executionClosure'] = {
              'state': 'generic_source_candidate_implemented_not_product_composed',
              'evidence': [
                  'codex-rs/hepta-control-plane/src/planner_execution/coordinator.rs',
                  'codex-rs/hepta-control-plane/src/planner_execution/types.rs',
                  'granted_request_reaches_executor_and_persists_complete_evidence_chain',
                  'final_payload_drift_is_rejected_before_executor_dispatch',
                  'indeterminate_effect_requires_signed_reconciliation',
              ],
          }
          lane_path.write_text(json.dumps(lane, indent=2) + '\n', encoding='utf-8')

          semantic_path = root / 'scripts/hepta-lane-d-semantic-conformance.py'
          semantic_lines = semantic_path.read_text(encoding='utf-8').splitlines()
          start = next(
              index for index, line in enumerate(semantic_lines)
              if 'for row in maturity["modules"]:' in line
          )
          end = start + 1
          while end < len(semantic_lines):
              line = semantic_lines[end]
              if line.strip() and line.startswith('    ') and not line.startswith('        '):
                  break
              end += 1
          replacement = '''    expected_product_callers = {
              "objective.compiler": "source_composed_authenticated_agentd_not_activated",
              "utility.ndu": "request_local_read_only_established_authenticated_production_not_composed",
              "control.runtime": "read_only_agentd_context_source_composed_global_planner_not_composed",
          }
              for row in maturity["modules"]:
                  module = row["module"]
                  product_caller = row["dimensions"]["productCaller"]["state"]
                  need(module in expected_product_callers, f"unexpected Lane D module: {module}")
                  need(
                      product_caller == expected_product_callers[module],
                      f"{module} product-caller maturity does not match its as-built scope",
                  )'''.splitlines()
          semantic_lines[start:end] = replacement
          semantic_path.write_text('\n'.join(semantic_lines) + '\n', encoding='utf-8')
          PY
          python3 scripts/hepta-control-runtime-maturity.py sync
          python3 scripts/hepta-control-runtime-maturity.py check
          python3 -m py_compile \
            scripts/hepta-control-runtime-maturity.py \
            scripts/hepta-lane-d-semantic-conformance.py
      - name: Apply repository Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all
      - name: Verify canonical formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Commit closure synchronization and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/control-runtime-rustfmt-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No closure delta."
            exit 0
          fi
          git commit -m "control.runtime: synchronize maturity truth and canonical formatting"
          git push origin HEAD:codex/control-runtime-full-closure-2026-09-27
