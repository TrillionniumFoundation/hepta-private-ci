name: cognitive-types-apply-macbook

on:
  push:
    branches: ['codex/cognitive-types-full-closure-20260927']
    paths:
      - '.github/workflows/cognitive-types-apply-macbook.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-types-apply-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    runs-on: [self-hosted, macOS, ARM64, macbook]
    timeout-minutes: 120
    steps:
      - name: Check out exact staged candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify runner identity
        shell: bash
        run: test "$RUNNER_NAME" = 'macbook-pro'
      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy
      - name: Apply verify and commit normal source
        shell: bash
        run: bash .github/cognitive-types-repair/apply-final.sh
