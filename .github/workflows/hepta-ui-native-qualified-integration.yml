name: ui.native qualified integration

on:
  push:
    branches: [work/ui-native-qualified-integration-20260928]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-native-qualified-integration
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: work/ui-native-qualified-integration-20260928
  FIXED_BASE: a126987b84737dbc2ee2592442a314117bddb4a2
  RUST_TOOLCHAIN: 1.95.0
  CARGO_INCREMENTAL: "0"

jobs:
  converge:
    name: converge canonical candidate metadata
    if: ${{ !contains(github.event.head_commit.message || '', '[ui-native-converged]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bind event and fixed base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}" \
            "${FIXED_BASE}"
          test "$(git rev-parse "${FIXED_BASE}^{commit}")" = "$FIXED_BASE"
      - name: Materialize the unique non-promoting candidate
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          branch = "work/ui-native-qualified-integration-20260928"
          fixed_base = "a126987b84737dbc2ee2592442a314117bddb4a2"
          superseded = [
              "work/ui-native-acceptance-repair-20260927",
              "work/ui-native-verified-closure-20260927",
              "work/ui-native-operational-closure-20260927",
              "work/ui-native-remediation-20260927",
              "work/ui-native-closure-20260927",
              "work/ui-native-full-closure-20260927",
          ]

          tool = Path("apps/hepta-native/tools/prepare_current_source.py")
          source = tool.read_text(encoding="utf-8")
          source, branch_count = re.subn(
              r'^BRANCH = ".*"$', f'BRANCH = "{branch}"', source,
              count=1, flags=re.MULTILINE,
          )
          source, write_count = re.subn(
              r'^WRITE_BRANCHES = .*$', 'WRITE_BRANCHES = {BRANCH}', source,
              count=1, flags=re.MULTILINE,
          )
          if branch_count != 1 or write_count != 1:
              raise SystemExit("unable to bind the unique metadata writer")
          candidate_entry = '    ROOT / "docs/modules/ui.native/INTEGRATION_CANDIDATE.json",\n'
          workflow_entry = '    ROOT / ".github/workflows/hepta-ui-native-qualified-integration.yml",\n'
          anchor = '    ROOT / "docs/modules/ui.native/CURRENT_SOURCE.json",\n'
          if candidate_entry not in source:
              source = source.replace(anchor, anchor + candidate_entry, 1)
          workflow_anchor = '    ROOT / ".github/workflows/hepta-ui-native-current-source.yml",\n'
          if workflow_entry not in source:
              source = source.replace(workflow_anchor, workflow_anchor + workflow_entry, 1)
          tool.write_text(source, encoding="utf-8")

          status = {
              "schema": "hepta.ui.native.integration-candidate.v1",
              "canonicalBranch": branch,
              "fixedSyntheticMergeBase": fixed_base,
              "supersededBranches": superseded,
              "supersessionPolicy": "history retained; no superseded branch may publish current qualification or release claims",
              "qualificationSubjects": [
                  f"{os}-{source}"
                  for os in ("linux", "macos", "windows")
                  for source in ("exact-head", "fixed-base-merge")
              ],
              "acceptQueued": False,
              "acceptSkipped": False,
              "acceptCancelled": False,
              "productionQualified": False,
              "deploymentQualified": False,
              "independentAcceptanceComplete": False,
              "releaseAuthorized": False,
              "externalGates": [
                  "production signing and key custody",
                  "macOS notarization and Windows installer identity",
                  "installed upgrade, crash-cut, and rollback qualification",
                  "physical accessibility, CJK IME, focus, DPI, and multi-monitor acceptance",
                  "long-running installed-product measurement",
                  "independent release approval",
              ],
          }
          Path("docs/modules/ui.native/INTEGRATION_CANDIDATE.json").write_text(
              json.dumps(status, indent=2) + "\n", encoding="utf-8"
          )

          docs_manifest = Path("docs/modules/ui.native/CURRENT_SOURCE.json")
          docs_data = json.loads(docs_manifest.read_text(encoding="utf-8"))
          docs_data["canonicalBranch"] = branch
          for key in ("productionQualified", "deploymentQualified", "releaseAuthorized"):
              if key in docs_data:
                  docs_data[key] = False
          docs_manifest.write_text(json.dumps(docs_data, indent=2) + "\n", encoding="utf-8")

          block = """<!-- ui-native-candidate:start -->
          > **Canonical integration candidate.** `work/ui-native-qualified-integration-20260928`
          > is the only branch permitted to publish current `ui.native` qualification
          > evidence. Synthetic-merge qualification is pinned to
          > `a126987b84737dbc2ee2592442a314117bddb4a2`. Earlier closure, remediation,
          > verified, and acceptance branches are retained as history but are
          > superseded. Production qualification, independent acceptance, signing,
          > notarization, activation, and release authority remain false until their
          > external receipts are committed and independently approved.
          <!-- ui-native-candidate:end -->"""
          for name in (
              "docs/modules/ui.native/TECHNICAL.md",
              "apps/hepta-native/DEVELOPMENT.md",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'<!-- ui-native-candidate:start -->.*?<!-- ui-native-candidate:end -->',
                  block, text, count=1, flags=re.DOTALL,
              )
              if "<!-- ui-native-candidate:start -->" not in text:
                  lines = text.splitlines()
                  insert_at = 1 if lines and lines[0].startswith("#") else 0
                  lines[insert_at:insert_at] = ["", block, ""]
                  text = "\n".join(lines) + ("\n" if not text.endswith("\n") else "")
              path.write_text(text, encoding="utf-8")
          PY
          python3 -m json.tool docs/modules/ui.native/INTEGRATION_CANDIDATE.json >/dev/null
          python3 -m py_compile apps/hepta-native/tools/prepare_current_source.py
          git config user.name hepta-ui-native-convergence
          git config user.email hepta-ui-native-convergence@users.noreply.github.com
          git add -- \
            apps/hepta-native/tools/prepare_current_source.py \
            docs/modules/ui.native/INTEGRATION_CANDIDATE.json \
            docs/modules/ui.native/CURRENT_SOURCE.json \
            docs/modules/ui.native/TECHNICAL.md \
            apps/hepta-native/DEVELOPMENT.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui.native): designate unique integration candidate"
          fi
      - name: Regenerate bounded identity and registry projections
        env:
          HEPTA_UI_NATIVE_WRITE_BRANCH: work/ui-native-qualified-integration-20260928
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 apps/hepta-native/tools/prepare_current_source.py --prepare
          python3 apps/hepta-native/tools/prepare_current_source.py --write-fingerprints
          python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          git add -A -- \
            apps/hepta-native/CURRENT_SOURCE.json \
            docs/modules/ui.native \
            docs/modules/MODULE_DOCS.json \
            docs/modules/SOURCE_BINDINGS.json \
            qualification/module-execution-dossiers/DETAILS.json \
            qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui.native): refresh candidate identities [ui-native-converged]"
          fi
          python3 apps/hepta-native/tools/prepare_current_source.py
          python3 scripts/test_hepta_module_registry.py
          python3 scripts/hepta-implementation-maps.py verify --require-current-source
          test -z "$(git status --porcelain)"
      - name: Push the converged exact candidate
        id: candidate
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  qualify:
    needs: converge
    name: ${{ matrix.os }} / ${{ matrix.source }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
            source: exact-head
          - os: ubuntu-24.04
            label: linux
            source: fixed-base-merge
          - os: macos-15
            label: macos
            source: exact-head
          - os: macos-15
            label: macos
            source: fixed-base-merge
          - os: windows-2025
            label: windows
            source: exact-head
          - os: windows-2025
            label: windows
            source: fixed-base-merge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE: ${{ needs.converge.outputs.candidate }}
      CARGO_TARGET_DIR: apps/hepta-native/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.converge.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact head and deterministic source tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git fetch --no-tags origin "$FIXED_BASE"
          if test "${{ matrix.source }}" = fixed-base-merge; then
            tree=$(git merge-tree --write-tree "$FIXED_BASE" "$CANDIDATE")
            export GIT_AUTHOR_NAME=ui-native-qualification
            export GIT_AUTHOR_EMAIL=ui-native-qualification@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
            export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            merge=$(printf '%s\n' 'deterministic ui.native fixed-base qualification merge' |
              git commit-tree "$tree" -p "$FIXED_BASE" -p "$CANDIDATE")
            git checkout --detach "$merge"
          fi
          mkdir -p native-evidence
          printf '%s\n' \
            "candidate=$CANDIDATE" \
            "fixed_base=$FIXED_BASE" \
            "source=${{ matrix.source }}" \
            "checkout=$(git rev-parse HEAD)" \
            "tree=$(git rev-parse HEAD^{tree})" > native-evidence/source.txt
          python3 apps/hepta-native/tools/prepare_current_source.py
          python3 scripts/test_hepta_module_registry.py
          python3 scripts/hepta-implementation-maps.py verify --require-current-source
          test -z "$(git status --porcelain)"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libssl-dev desktop-file-utils \
            xvfb xauth dbus-x11 gnome-keyring xdotool x11-utils \
            python3-cryptography fonts-noto-cjk
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Verify locked dependency graphs
        run: |
          cargo +"$RUST_TOOLCHAIN" metadata --manifest-path apps/hepta-native/Cargo.toml --locked --format-version 1 >/dev/null
          cargo +"$RUST_TOOLCHAIN" metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Strict formatting
        run: |
          cargo +"$RUST_TOOLCHAIN" fmt --manifest-path apps/hepta-native/Cargo.toml --check
          cargo +"$RUST_TOOLCHAIN" fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-native-gateway -p codex-hepta-contracts \
            -p codex-hepta-private-state -- --check
      - name: Strict Clippy
        run: |
          cargo +"$RUST_TOOLCHAIN" clippy --manifest-path apps/hepta-native/Cargo.toml \
            --locked --all-targets --all-features -- -D warnings
          cargo +"$RUST_TOOLCHAIN" clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-native-gateway -p codex-hepta-contracts \
            -p codex-hepta-private-state --all-targets --all-features --no-deps -- -D warnings
      - name: Native and owner tests
        run: |
          cargo +"$RUST_TOOLCHAIN" test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets
          cargo +"$RUST_TOOLCHAIN" test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-native-gateway -p codex-hepta-contracts \
            -p codex-hepta-private-state --all-targets --all-features
      - name: Release build and fault qualification
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" build --manifest-path apps/hepta-native/Cargo.toml --locked --release --bins
          binary=apps/hepta-native/target/release/hepta-native
          if test "$RUNNER_OS" = Windows; then binary="${binary}.exe"; fi
          "$binary" --self-test > native-evidence/self-test.json
          "$binary" --qualification-e2e > native-evidence/faults.json
      - name: Package and smoke installed layout
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) platform=linux; architecture=x86_64 ;;
            macOS) platform=macos; architecture="$(uname -m)" ;;
            Windows) platform=windows; architecture=x86_64 ;;
            *) exit 2 ;;
          esac
          python3 apps/hepta-native/tools/package_unsigned.py --self-test
          python3 apps/hepta-native/tools/package_unsigned.py \
            --platform "$platform" --architecture "$architecture" \
            --release-dir apps/hepta-native/target/release \
            --out-dir native-package > native-evidence/package-output.json
          case "$RUNNER_OS" in
            Linux) packaged='native-package/extracted/HeptaNative.AppDir/usr/bin/hepta-native' ;;
            macOS) packaged='native-package/extracted/Hepta Native.app/Contents/MacOS/hepta-native' ;;
            Windows) packaged='native-package/extracted/HeptaNative/hepta-native.exe' ;;
          esac
          "$packaged" --self-test > native-evidence/packaged-self-test.json
          "$packaged" --qualification-e2e > native-evidence/packaged-faults.json
      - name: Write non-promoting subject receipt
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          artifacts = {}
          for path in sorted(Path("native-package").glob("*.zip")):
              artifacts[path.name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          receipt = {
              "schema": "hepta.ui.native.qualified-subject.v1",
              "candidate": os.environ["CANDIDATE"],
              "fixedBase": os.environ["FIXED_BASE"],
              "runnerOs": os.environ["RUNNER_OS"],
              "runnerArch": os.environ["RUNNER_ARCH"],
              "source": "${{ matrix.source }}",
              "jobStatus": "${{ job.status }}",
              "artifacts": artifacts,
              "productionSigningObserved": False,
              "notarizationObserved": False,
              "physicalAccessibilityAcceptance": False,
              "independentAcceptanceComplete": False,
              "releaseAuthorized": False,
          }
          Path("native-evidence/results.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-native-${{ matrix.label }}-${{ matrix.source }}-${{ needs.converge.outputs.candidate }}
          path: native-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Reject non-successful subject
        if: failure() || cancelled()
        run: exit 1

  aggregate:
    name: require all six subjects
    if: always() && needs.converge.result == 'success'
    needs: [converge, qualify]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject missing, skipped, cancelled, or failed subjects
        env:
          MATRIX_RESULT: ${{ needs.qualify.result }}
          CANDIDATE: ${{ needs.converge.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = success
          cat > ui-native-qualified-integration.json <<EOF
          {
            "schema": "hepta.ui.native.qualified-integration.v1",
            "candidate": "$CANDIDATE",
            "fixedBase": "$FIXED_BASE",
            "requiredSubjects": 6,
            "matrixResult": "$MATRIX_RESULT",
            "queuedAccepted": false,
            "skippedAccepted": false,
            "cancelledAccepted": false,
            "productionSigningObserved": false,
            "notarizationObserved": false,
            "physicalAcceptanceComplete": false,
            "independentAcceptanceComplete": false,
            "releaseAuthorized": false
          }
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-qualified-integration-${{ needs.converge.outputs.candidate }}
          path: ui-native-qualified-integration.json
          if-no-files-found: error
          retention-days: 30
