name: Hepta Lane D final candidate repair

on:
  push:
    branches:
      - candidate/hepta-main-final-r2-20260911
    paths:
      - .github/workflows/hepta-lane-d-compile-repair.yml
      - scripts/hepta-lane-d-journal-fix.py
      - scripts/hepta-lane-d-ndu-error-fix.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-lane-d-final-candidate-repair
  cancel-in-progress: true

jobs:
  repair-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Repair sealed journal call sites and NDU taxonomy fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-d-journal-fix.py
          python3 scripts/hepta-lane-d-ndu-error-fix.py

      - name: Canonical formatting
        working-directory: codex-rs
        shell: bash
        run: cargo fmt --all

      - name: Compile Lane D packages
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-hepta-objective \
            -p codex-hepta-ndu \
            -p codex-hepta-control-plane \
            --all-targets

      - name: Test Lane D packages
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-objective
          cargo test --locked -p codex-hepta-ndu
          cargo test --locked -p codex-hepta-control-plane

      - name: Strict Lane D lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p codex-hepta-objective \
            -p codex-hepta-ndu \
            -p codex-hepta-control-plane \
            --all-targets -- -D warnings

      - name: Verify semantic closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-d-semantic-conformance.py self-test
          python3 scripts/hepta-lane-d-semantic-conformance.py verify
          git diff --check

      - name: Publish verified repair and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/hepta-lane-d-journal-fix.py
          rm -f scripts/hepta-lane-d-ndu-error-fix.py
          rm -f .github/workflows/hepta-lane-d-compile-repair.yml
          git add -A
          git config user.name "Hepta Convergence Repair"
          git config user.email "noreply@openai.com"
          git commit -m "fix(lane-d): materialize journal and NDU closure"
          git push origin HEAD:refs/heads/candidate/hepta-main-final-r2-20260911
