name: HCSN visit-897 complete-source-tree static successor
on:
  pull_request:
    paths:
      - qualification/hcsn_source_migration_vjp_n128/**
      - qualification/hcsn_source_migration_vjp_n128_successor/**
      - qualification/hcsn_initial_law/migration.py
      - qualification/hcsn_adjoint_torch/torch_flow.py
      - qualification/hcsn_initial_adjoint/solver.py
      - qualification/hcsn_joint_dde/model.py
      - qualification/hcsn_boundary_audit/refractory_transport.py
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - qualification/hcsn_graded/model.py
      - qualification/hcsn_graded/spatial.py
      - .github/workflows/hcsn-source-migration-vjp-n128.yml
permissions:
  contents: read
concurrency:
  group: hcsn-original-visit897-source-tree-successor-static-clear-20261112-c06d-001
  cancel-in-progress: false
jobs:
  complete-source-tree-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind complete frozen source tree
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          package = Path('qualification/hcsn_source_migration_vjp_n128_successor')
          request = json.loads((package / 'REQUEST.json').read_text())
          inventory = json.loads((package / 'SOURCE.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['CANDIDATE_COMMIT']
          assert request['identity'] == inventory['identity']
          hashes = {
              name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for name in inventory['source_sha256']
          }
          assert hashes == inventory['source_sha256']
          source = {
              'source_commit': head,
              'request_identity': request['identity'],
              'idempotency_key': request['idempotency_key'],
              'source_sha256': hashes,
              'source_inventory_sha256': hashlib.sha256(
                  (package / 'SOURCE.json').read_bytes()
              ).hexdigest(),
              'candidate_imports': 0,
              'model_forwards': 0,
              'adjoints': 0,
              'optimizer_updates': 0,
              'numerical_execution_authorized': False,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'source-tree-static'
          output.mkdir()
          (output / 'SOURCE-BIND.json').write_text(
              json.dumps(source, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(source, sort_keys=True))
          PY
      - name: Apply repository-required format check
        run: |
          cd codex-rs
          just fmt --base 000e667ad7a92eae0ad314929cb4293d6bb994d6
          cd ..
          git diff --exit-code
          git diff --cached --exit-code
      - name: Independent zero-execution static review
        run: |
          python -B qualification/hcsn_source_migration_vjp_n128_successor/static_review.py \
            --root . \
            --output "$RUNNER_TEMP/source-tree-static/STATIC-REVIEW.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (
                  Path(os.environ['RUNNER_TEMP'])
                  / 'source-tree-static'
                  / 'STATIC-REVIEW.json'
              ).read_text()
          )
          assert result['status'] == 'CLEAR_SOURCE_TREE_STATIC_ONLY'
          assert result['candidate_imports'] == 0
          assert result['model_forwards'] == 0
          assert result['adjoints'] == 0
          assert result['optimizer_updates'] == 0
          assert result['numerical_execution_authorized'] is False
          PY
      - name: Confirm checkout remained immutable
        run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visit897-complete-source-tree-static-successor
          path: ${{ runner.temp }}/source-tree-static
          if-no-files-found: error
