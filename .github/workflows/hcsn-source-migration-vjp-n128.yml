name: HCSN visit-897 N128 source-migration VJP
on:
  pull_request:
    paths:
      - qualification/hcsn_source_migration_vjp_n128/**
      - qualification/hcsn_initial_law/migration.py
      - qualification/hcsn_adjoint_torch/torch_flow.py
      - qualification/hcsn_initial_adjoint/solver.py
      - qualification/hcsn_joint_dde/model.py
      - qualification/hcsn_boundary_audit/refractory_transport.py
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - qualification/hcsn_graded/model.py
      - qualification/hcsn_graded/spatial.py
      - .github/workflows/hcsn-source-migration-vjp-n128.yml
permissions:
  contents: read
jobs:
  source-migration-vjp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Bind exact independently frozen source
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          package=Path('qualification/hcsn_source_migration_vjp_n128')
          request=json.loads((package/'REQUEST.json').read_text())
          inventory=json.loads((package/'SOURCE.json').read_text())
          clear=json.loads((package/'STATIC-CLEAR.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['CANDIDATE_COMMIT']
          hashes={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in inventory['source_sha256']}
          assert hashes==inventory['source_sha256']
          assert clear['status']=='CLEAR'
          assert clear['reviewed_source_commit']==inventory['reviewed_source_commit']
          assert clear['reviewed_source_sha256']==hashes
          source=dict(source_commit=head,request_identity=request['identity'],source_sha256=hashes,prefrozen_inventory_sha256=hashlib.sha256((package/'SOURCE.json').read_bytes()).hexdigest())
          Path(os.environ['RUNNER_TEMP'],'source-migration-source.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          print(json.dumps(source,sort_keys=True))
          PY
      - name: Execute the single bounded 42-forward admission
        run: |
          python - <<'PY'
          import json, os, resource, subprocess, sys, time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'source-migration-vjp'
          root.mkdir()
          command=['prlimit','--as=3221225472','--cpu=900','--',sys.executable,'-B','-m','qualification.hcsn_source_migration_vjp_n128.native_probe','--source',str(Path(os.environ['RUNNER_TEMP'])/'source-migration-source.json'),'--output',str(root/'native')]
          wall,cpu=time.perf_counter(),time.process_time()
          before=resource.getrusage(resource.RUSAGE_CHILDREN)
          with (root/'native.stdout').open('wb') as stdout,(root/'native.stderr').open('wb') as stderr:
              process=subprocess.Popen(command,stdout=stdout,stderr=stderr)
              result=process.wait(timeout=900)
          after=resource.getrusage(resource.RUSAGE_CHILDREN)
          cost=dict(source_commit=os.environ['CANDIDATE_COMMIT'],exit_code=result,pid=process.pid,full_child_process_wall_seconds=time.perf_counter()-wall,full_child_process_cpu_seconds=(after.ru_utime+after.ru_stime)-(before.ru_utime+before.ru_stime),wrapper_cpu_seconds=time.process_time()-cpu,child_process_peak_rss_kib=after.ru_maxrss,address_space_limit_bytes=3221225472,cpu_time_limit_seconds=900,maximum_forwards=42,maximum_adjoints=2,maximum_optimizer_updates=0,includes_python_torch_import_and_all_numerical_work=True)
          (root/'WRAPPER-COST.json').write_text(json.dumps(cost,indent=2,sort_keys=True)+'\n')
          print((root/'native.stdout').read_text())
          print((root/'native.stderr').read_text(),file=sys.stderr)
          print(json.dumps(cost,sort_keys=True))
          raise SystemExit(result)
          PY
      - run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visit897-source-migration-vjp-n128-originals
          path: |
            ${{ runner.temp }}/source-migration-vjp
            ${{ runner.temp }}/source-migration-source.json
          if-no-files-found: error
