name: HCSN visit-897 complete-tree stretch static successor
on:
  pull_request:
    paths:
      - qualification/hcsn_source_migration_vjp_n128/**
      - qualification/hcsn_source_migration_vjp_n128_successor/**
      - qualification/hcsn_source_migration_vjp_n128_stretch_static/**
      - qualification/hcsn_source_migration_vjp_n128_complete_tree_stretch_static/**
      - qualification/hcsn_initial_law/migration.py
      - qualification/hcsn_adjoint_torch/torch_flow.py
      - qualification/hcsn_initial_adjoint/solver.py
      - qualification/hcsn_joint_dde/model.py
      - qualification/hcsn_boundary_audit/refractory_transport.py
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - qualification/hcsn_graded/model.py
      - qualification/hcsn_graded/spatial.py
      - .github/workflows/hcsn-source-migration-vjp-n128.yml
permissions:
  contents: read
concurrency:
  group: hcsn-visit897-n128-complete-tree-stretch-static-20261112-c06d-001
  cancel-in-progress: false
jobs:
  complete-source-tree-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE: research/hcsn-visit897-n128-stretch-field-static-20261112-c06d
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-ci-tools
      - name: Bind complete repaired source tree
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.pull_request.base.ref }}" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          git merge-base --is-ancestor ffcad5a6aa9bea30a66b7f217af93e7e850cd0b5 HEAD
          root="$RUNNER_TEMP/complete-tree-stretch-static"
          mkdir "$root"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          package = Path('qualification/hcsn_source_migration_vjp_n128_complete_tree_stretch_static')
          request = json.loads((package / 'REQUEST.json').read_text())
          source = json.loads((package / 'SOURCE.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          hashes = {
              name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for name in source['source_sha256']
          }
          if hashes != source['source_sha256']:
              raise ValueError('complete repaired source bytes differ')
          if request['identity'] != source['identity']:
              raise ValueError('request/source identity differs')
          if request['idempotency_key'] != source['idempotency_key']:
              raise ValueError('request/source key differs')
          result = {
              'source_commit': head,
              'identity': request['identity'],
              'idempotency_key': request['idempotency_key'],
              'source_sha256': hashes,
              'candidate_imports': 0,
              'model_forwards': 0,
              'adjoints': 0,
              'backward_attempts': 0,
              'optimizer_updates': 0,
              'numerical_execution_authorized': False,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'complete-tree-stretch-static'
          (output / 'SOURCE-BIND.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Apply exact repository format gate
        run: |
          cd codex-rs
          just fmt --base ffcad5a6aa9bea30a66b7f217af93e7e850cd0b5
          cd ..
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
      - name: Independent zero-execution complete-tree review
        run: |
          python -B qualification/hcsn_source_migration_vjp_n128_complete_tree_stretch_static/static_review.py \
            --root . \
            --output "$RUNNER_TEMP/complete-tree-stretch-static/STATIC-REVIEW.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'complete-tree-stretch-static' / 'STATIC-REVIEW.json').read_text()
          )
          if result['status'] != 'CLEAR_COMPLETE_TREE_STRETCH_STATIC_ONLY':
              raise ValueError('complete repaired source tree did not clear')
          for name in ('candidate_imports', 'model_forwards', 'adjoints', 'backward_attempts', 'optimizer_updates'):
              if result[name] != 0:
                  raise ValueError('unexpected execution in complete-tree static review')
          if result['numerical_execution_authorized'] is not False:
              raise ValueError('complete-tree static review cannot authorize numerics')
          PY
      - name: Confirm checkout remained immutable
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visit897-n128-complete-tree-stretch-static-originals
          path: ${{ runner.temp }}/complete-tree-stretch-static
          if-no-files-found: error
