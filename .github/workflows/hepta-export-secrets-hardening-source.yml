name: Export materialized secrets hardening source

on:
  push:
    branches:
      - codex/secrets-heptabao-final-hardening-20260928
    paths:
      - ".github/workflows/hepta-export-secrets-hardening-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-export-secrets-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          base="074de71f0feb032cc1b61c49da1aa0a8af00ea86"
          shopt -s nullglob
          parts=(.hepta-bootstrap/secrets-final-hardening/part-*)
          test "${#parts[@]}" -eq 8
          bundle="$RUNNER_TEMP/secrets-final-hardening.patch.gz.b64"
          patch="$RUNNER_TEMP/secrets-final-hardening.patch"
          fixup=".hepta-bootstrap/secrets-final-hardening/fixup.patch"
          source_root="$RUNNER_TEMP/source"
          cat "${parts[@]}" > "$bundle"
          echo "565ccaad2b2aa61b8d18c4fea808046fa75afe10fe4ccdafff5ead902e876360  $bundle" | sha256sum -c -
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          echo "367195ea3bfc989ff4b6331e4a07720c9c4e0d3d77123c0419f41efeec209114  $patch" | sha256sum -c -
          test "$(git hash-object "$fixup")" = "65a80b1374cb784f55acb3e44bb3ea9cd7101a39"
          git worktree add --detach "$source_root" "$base"
          git -C "$source_root" apply "$patch"
          git -C "$source_root" apply "$GITHUB_WORKSPACE/$fixup"
          cp -a "$source_root/codex-rs/hepta-bao-adapter" "$RUNNER_TEMP/hepta-bao-adapter"
          git worktree remove --force "$source_root"

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format exported source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf codex-rs/hepta-bao-adapter
          cp -a "$RUNNER_TEMP/hepta-bao-adapter" codex-rs/hepta-bao-adapter
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter
          tar -czf "$RUNNER_TEMP/hepta-bao-adapter-materialized.tgz" hepta-bao-adapter

      - name: Upload exact materialized source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-hardening-materialized-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-bao-adapter-materialized.tgz
          if-no-files-found: error
          retention-days: 2
