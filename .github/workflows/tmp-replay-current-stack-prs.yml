name: tmp-replay-current-stack-prs

on:
  push:
    branches:
      - ops/lane-f-final-source-export-20260910
    paths:
      - .github/workflows/tmp-replay-current-stack-prs.yml

permissions:
  contents: write
  pull-requests: read

env:
  CANDIDATE_BRANCH: integration/hepta-seven-lane-gap-closure-20260910-r2

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Wait for concurrent lane work to settle
        shell: bash
        run: sleep 900

      - name: Check out current candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0

      - name: Discover and replay relevant current PR heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          original="$(git rev-parse HEAD)"
          test "${original}" = "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title,headRefName,baseRefName,headRepositoryOwner,updatedAt,isDraft \
            >"${RUNNER_TEMP}/open-prs.json"
          python3 - "${RUNNER_TEMP}/open-prs.json" "${CANDIDATE_BRANCH}" >"${RUNNER_TEMP}/replay.tsv" <<'PY'
          import json
          import re
          import sys
          from datetime import datetime, timezone

          rows=json.load(open(sys.argv[1], encoding='utf-8'))
          candidate=sys.argv[2]
          cutoff=datetime(2026,9,9,tzinfo=timezone.utc)
          title_pattern=re.compile(r'(lane[ -]?[a-g]\b|gap[- ]closure|native[- ]source|external[- ]gap|convergence)', re.I)
          branch_pattern=re.compile(r'(lane-[a-g]|gap-closure|native-source|external-gap|convergence)', re.I)
          allowed_bases={
              'codex/hepta-all-gap-closure-20260908',
              'codex/hepta-native-source-closed-world-20260909',
              'main',
          }
          selected=[]
          for row in rows:
              head=row.get('headRefName') or ''
              base=row.get('baseRefName') or ''
              title=row.get('title') or ''
              updated=row.get('updatedAt') or ''
              try:
                  stamp=datetime.fromisoformat(updated.replace('Z','+00:00'))
              except Exception:
                  continue
              if stamp < cutoff or head == candidate:
                  continue
              if base not in allowed_bases:
                  continue
              if not (head.startswith('codex/') or head.startswith('integration/')):
                  continue
              if not (title_pattern.search(title) or branch_pattern.search(head)):
                  continue
              if head.startswith(('archive/','backup/','ops/')):
                  continue
              selected.append((int(row['number']), head, base, title.replace('\t',' ')))
          for number,head,base,title in sorted(selected):
              print(f'{number}\t{head}\t{base}\t{title}')
          PY

          mkdir -p qualification/convergence
          cp "${RUNNER_TEMP}/replay.tsv" qualification/convergence/CURRENT_STACK_PRS.tsv

          while IFS=$'\t' read -r number branch base title; do
            [[ -z "${branch}" ]] && continue
            ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "${ref}"; then
              echo "missing current head ref for PR #${number}: ${branch}" >&2
              exit 101
            fi
            if git merge-base --is-ancestor "${ref}" HEAD; then
              continue
            fi
            echo "REPLAY_PR #${number} ${branch} ${title}"
            if git merge --no-ff --no-edit "${ref}"; then
              continue
            fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            safe=1
            for file in "${conflicts[@]}"; do
              case "${file}" in
                docs/STATUS.md|qualification/module-execution-dossiers/NATIVE_BINDINGS.json|qualification/convergence/SEVEN_LANE_SOURCE_HEADS.json|qualification/convergence/CURRENT_STACK_PRS.tsv)
                  git checkout --ours -- "${file}"
                  git add "${file}"
                  ;;
                *)
                  echo "UNRESOLVED_PR_SOURCE_CONFLICT #${number} ${branch} ${file}" >&2
                  safe=0
                  ;;
              esac
            done
            if [[ "${safe}" != 1 ]]; then
              git merge --abort || true
              exit 102
            fi
            git commit --no-edit
          done <"${RUNNER_TEMP}/replay.tsv"

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          root=Path.cwd()
          path=root/'qualification/module-execution-dossiers/NATIVE_BINDINGS.json'
          data=json.loads(path.read_text(encoding='utf-8'))
          rows=data.get('observations')
          if not isinstance(rows,list) or len(rows)!=40:
              raise SystemExit('native source ledger is not exactly 40 modules')
          seen=set()
          for row in rows:
              module=row.get('module'); source_path=row.get('path')
              if not isinstance(module,str) or module in seen:
                  raise SystemExit(f'invalid native module {module!r}')
              seen.add(module)
              if not isinstance(source_path,str):
                  raise SystemExit(f'missing source path for {module}')
              source=root/source_path
              if not source.is_file():
                  raise SystemExit(f'missing source {source_path}')
              payload=source.read_bytes()
              row['blobSha']=hashlib.sha1(f'blob {len(payload)}\0'.encode('ascii')+payload,usedforsecurity=False).hexdigest()
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

          find .github/workflows -maxdepth 1 -type f \( -name 'tmp-*.yml' -o -name 'tmp-*.yaml' \) -delete
          python3 scripts/hepta-readiness.py generate-status || true
          python3 scripts/hepta-implementation-dossiers.py generate-status || true
          python3 scripts/hepta-algorithm-docs.py generate-status || true
          python3 scripts/hepta-cns.py generate-status || true
          python3 scripts/hepta-docs.py generate-status || true
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'chore(convergence): replay all current stack PR heads'
          fi
          test -z "$(git status --porcelain)"

          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          if [[ -f scripts/hepta-lane-b-truth.py ]]; then
            python3 scripts/hepta-lane-b-truth.py verify
            python3 scripts/hepta-lane-b-docs.py verify
          fi
          git diff --check
          test -z "$(git status --porcelain)"

          git fetch origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})" = "${original}"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
