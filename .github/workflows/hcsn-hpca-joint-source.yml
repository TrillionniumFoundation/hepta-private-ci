name: HCSN HPCA one-source research checks
on:
  pull_request:
    paths:
      - qualification/hcsn_hpca_joint_gate/**
      - qualification/hcsn_boundary_audit/**
      - qualification/hcsn_differentiable/c2_successor_v1/**
      - qualification/hpca-neuroscience-20261110/**
      - .github/workflows/hcsn-hpca-joint-source.yml
permissions:
  contents: read
jobs:
  joint-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -B qualification/hcsn_hpca_joint_gate/run.py --output "$RUNNER_TEMP/joint-source"
      - run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joint-source-original-checks
          path: ${{ runner.temp }}/joint-source
          if-no-files-found: error
