name: Apply intuition versioned commitments

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/hepta-intuition-commitment-materialize.yml
      - scripts/apply_intuition_commitments_20260925.py

permissions:
  contents: write

concurrency:
  group: hepta-intuition-commitment-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/product-convergence-20260923
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Apply bounded patch and freeze candidate
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/work/product-convergence-20260923
          mkdir -p "$RUNNER_TEMP/intuition-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/intuition-evidence/base-sha.txt"
          python3 scripts/apply_intuition_commitments_20260925.py
          rm scripts/apply_intuition_commitments_20260925.py
          rm .github/workflows/hepta-intuition-commitment-materialize.yml
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-intuition --package codex-hepta-intelligence
          python3 - <<'PY'
          import subprocess
          allowed = {
              'codex-rs/hepta-intuition/src/lib.rs',
              'codex-rs/hepta-intuition/src/runtime_commitment.rs',
              'codex-rs/hepta-intuition/src/runtime_commitment_v2.rs',
              'codex-rs/hepta-intelligence/src/lib.rs',
              'codex-rs/hepta-intelligence/src/intuition_qualification.rs',
              'codex-rs/hepta-intelligence/tests/intuition_admission_boundaries.rs',
              'codex-rs/hepta-intelligence/tests/intuition_frozen_qualification.rs',
              'codex-rs/hepta-intelligence/examples/intuition_authenticated_fast_gate.rs',
              'scripts/apply_intuition_commitments_20260925.py',
              '.github/workflows/hepta-intuition-commitment-materialize.yml',
          }
          paths = [line[3:] for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()]
          unexpected = set(paths) - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changed paths: {sorted(unexpected)}')
          PY
          git diff --check
          git config user.name 'Hepta Intuition CI'
          git config user.email 'hepta-intuition-ci@users.noreply.github.com'
          git add -A
          git commit -m 'feat(intuition): separate versioned scoring and behavior commitments' -m 'Retain V1 signed bytes and introduce authenticated V3 over V2 commitments. No activation or production qualification claim.' -m 'Signed-off-by: Hepta Intuition CI <hepta-intuition-ci@users.noreply.github.com>'
          git rev-parse HEAD | tee "$RUNNER_TEMP/intuition-evidence/candidate-sha.txt"
          git show --format=fuller --binary HEAD > "$RUNNER_TEMP/intuition-evidence/candidate.patch"
      - name: Compile all targets
        id: check
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence --all-targets 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/check.log"
      - name: Strict all-target Clippy
        id: clippy
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-intuition -p codex-hepta-intelligence --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/clippy.log"
      - name: Policy and authenticated regressions
        id: tests
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-intuition -p codex-hepta-intelligence 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/tests.log"
      - name: Source-host performance qualification
        id: performance
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          { git rev-parse HEAD; uname -a; rustc -Vv; lscpu; } > "$RUNNER_TEMP/intuition-evidence/host.txt"
          cargo run --locked --release -p codex-hepta-intuition --example fast_gate 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/kernel.log"
          cargo run --locked --release -p codex-hepta-intelligence --example intuition_authenticated_fast_gate 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/authenticated.log"
      - name: Publish without replacing concurrent work
        id: publish
        if: ${{ success() && steps.check.outcome == 'success' && steps.clippy.outcome == 'success' && steps.tests.outcome == 'success' && steps.performance.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/product-convergence-20260923
          if ! git merge-base --is-ancestor origin/work/product-convergence-20260923 HEAD; then
            git rebase origin/work/product-convergence-20260923
            git rev-parse HEAD | tee "$RUNNER_TEMP/intuition-evidence/rebased-sha.txt"
            cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-intuition --package codex-hepta-intelligence -- --check
            cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-intuition -p codex-hepta-intelligence --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/rebased-clippy.log"
            just test --locked -p codex-hepta-intuition -p codex-hepta-intelligence 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/rebased-tests.log"
            cargo run --manifest-path codex-rs/Cargo.toml --locked --release -p codex-hepta-intuition --example fast_gate 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/rebased-kernel.log"
            cargo run --manifest-path codex-rs/Cargo.toml --locked --release -p codex-hepta-intelligence --example intuition_authenticated_fast_gate 2>&1 | tee "$RUNNER_TEMP/intuition-evidence/rebased-authenticated.log"
          fi
          git diff --check
          test -z "$(git status --porcelain)"
          git show --format=fuller --binary HEAD > "$RUNNER_TEMP/intuition-evidence/published.patch"
          git push origin HEAD:work/product-convergence-20260923
          git rev-parse HEAD | tee "$RUNNER_TEMP/intuition-evidence/published-sha.txt"
      - name: Retain actual command results and candidate patch
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-commitment-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/intuition-evidence/
          if-no-files-found: warn
          retention-days: 14
