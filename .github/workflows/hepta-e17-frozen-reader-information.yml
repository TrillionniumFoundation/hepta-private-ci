name: Hepta E17 original frozen Reader answer-information audit (DENY_ALL)
on:
  pull_request:
    paths:
      - 'qualification/shared-stem-system2-architecture/e17_*.py'
      - 'qualification/shared-stem-system2-architecture/test_e17_*.py'
      - 'qualification/shared-stem-system2-architecture/E17_ORIGINAL_READER_INFORMATION_20261015.md'
      - '.github/workflows/hepta-e17-frozen-reader-information.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-frozen-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source_profile: [source_head, synthetic_merge]
    env:
      ROOT: qualification/shared-stem-system2-architecture
      PYTHONPATH: qualification/shared-stem-system2-architecture
      HEPTA_E17_REAL_ARCHIVE: /tmp/hepta-e17-original-pretrained.zip
      OUTPUT: /tmp/hepta-e17-original-frozen-reader-${{ matrix.source_profile }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_profile == 'source_head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze exact source, original test code and SOURCE HEAD boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT"
          git rev-parse HEAD | tee "$OUTPUT/exact-head.txt"
          if [[ '${{ matrix.source_profile }}' == source_head && '${{ github.event_name }}' == pull_request ]]; then
            test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          fi
          sha256sum "$ROOT"/e17_*.py "$ROOT"/test_e17_*.py | tee "$OUTPUT/code-sha256.txt"
          python --version
      - name: Download original pre-scored pretrained model archive through exact GitHub artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11946621518/zip' \
            --output "$HEPTA_E17_REAL_ARCHIVE"
          printf '%s  %s\n' '1a9b485b6b1ee28c952934069b2cd4d765a17742655f3f3cb3339d3ca672ad17' "$HEPTA_E17_REAL_ARCHIVE" | sha256sum -c -
      - name: Real pretrained ZIP answer-information regressions, normal and optimized
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s "$ROOT" -p 'test_e17_*.py' -v > "$OUTPUT/tests-normal.txt" 2>&1 \
            || { cat "$OUTPUT/tests-normal.txt"; exit 1; }
          python -O -m unittest discover -s "$ROOT" -p 'test_e17_*.py' -v > "$OUTPUT/tests-optimized.txt" 2>&1 \
            || { cat "$OUTPUT/tests-optimized.txt"; exit 1; }
          grep -F 'Ran 19 tests' "$OUTPUT/tests-normal.txt"
          grep -F 'Ran 19 tests' "$OUTPUT/tests-optimized.txt"
          if grep -E '^.+\.\.\. skipped |FAILED |ERROR:' "$OUTPUT"/tests-*.txt; then exit 1; fi
      - name: Create-only label-blind original Reader information and seal BEFORE human scores
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/e17_reader_signal.py" \
            --archive "$HEPTA_E17_REAL_ARCHIVE" \
            --output "$OUTPUT/first-sealed-blind.json" | tee "$OUTPUT/blind-stdout.txt"
          sha256sum "$OUTPUT/first-sealed-blind.json" > "$OUTPUT/before-original-score.sha256"
      - name: Independently review original human mixed-label bound after blind source seal
        shell: bash
        run: |
          set -euo pipefail
          cut -d ' ' -f1 "$OUTPUT/before-original-score.sha256" > "$OUTPUT/expected-blind-hash.txt"
          expected="$(cat "$OUTPUT/expected-blind-hash.txt")"
          python "$ROOT/e17_independent_review.py" \
            --archive "$HEPTA_E17_REAL_ARCHIVE" \
            --blind "$OUTPUT/first-sealed-blind.json" \
            --blind-sha256 "$expected" \
            --output "$OUTPUT/independent-original-human-summary.json" \
            | tee "$OUTPUT/review-stdout.txt"
          sha256sum "$OUTPUT/independent-original-human-summary.json" > "$OUTPUT/review.sha256"
      - name: Retain original audit and failed attempts, never raw human annotations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-e17-original-reader-info-${{ matrix.source_profile }}
          path: /tmp/hepta-e17-original-frozen-reader-${{ matrix.source_profile }}/
          retention-days: 14
          if-no-files-found: warn
