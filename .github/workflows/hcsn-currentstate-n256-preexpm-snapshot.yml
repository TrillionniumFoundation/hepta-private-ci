name: hcsn-currentstate-n256-preexpm-snapshot

on:
  push:
    branches:
      - research/hcsn-n256-preexpm-inputs-20261121-c6bc-run

permissions:
  contents: read

concurrency:
  group: hcsn-n256-preexpm-input-snapshot-20261121-c6bc-001
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HCSN_UNIQUE_EXECUTION_KEY: hcsn-n256-preexpm-input-snapshot-20261121-c6bc-001
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact numerical runtime
        run: python -m pip install --disable-pip-version-check --no-deps numpy==2.3.5
      - name: Verify source-only controls
        run: |
          python -m qualification.hcsn_currentstate_n256_preexpm_snapshot_intent.verify_source
          python -m unittest qualification.hcsn_currentstate_n256_preexpm_snapshot_intent.test_source
          python -O -m unittest qualification.hcsn_currentstate_n256_preexpm_snapshot_intent.test_source
      - name: Snapshot pre-expm inputs once
        run: python -m qualification.hcsn_currentstate_n256_preexpm_snapshot_intent.run
      - name: Upload immutable raw snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcsn-n256-preexpm-input-snapshot-20261121-c6bc-001
          path: |
            hcsn-n256-preexpm-snapshot-output
            hcsn-n256-preexpm-snapshot-output.zip
          if-no-files-found: error
          retention-days: 90
