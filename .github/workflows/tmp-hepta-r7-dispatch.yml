name: Temporary dispatch of patched Hepta r7 convergence

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/tmp-hepta-r7-dispatch.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch patched r7 at exact controller ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: TrillionniumFoundation/hepta-private-ci
          CONTROLLER_REF: ops/hepta-global-gap-closure-controller-20260910-r1
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${CONTROLLER_REF}"
          gh workflow run hepta-global-finalizer-r7.yml \
            --repo "${REPOSITORY}" \
            --ref "${CONTROLLER_REF}" \
            -f target_branch=integration/hepta-all-gap-closure-20260910-r7 \
            -f shard_count=8
