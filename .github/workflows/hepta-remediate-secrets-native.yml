name: Remediate secrets.heptabao native gates

on:
  push:
    branches:
      - codex/secrets-heptabao-remediation-20260927
    paths:
      - ".hepta-bootstrap/run-secrets-native-remediation"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-native-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic compiler fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ingress = Path("codex-rs/hepta-bao-adapter/src/registered_product_ingress.rs")
          text = ingress.read_text()
          old = "            reserved: |reservation| {"
          new = "            reserved: |reservation: &codex_hepta_authbus::QuotaReservation| {"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected reservation callback count: {text.count(old)}")
          ingress.write_text(text.replace(old, new))

          crash = Path("codex-rs/hepta-bao-adapter/src/saga_crash_tests.rs")
          text = crash.read_text()
          count = text.count("assert_eq!(")
          if count != 7:
              raise SystemExit(f"unexpected assert_eq macro count: {count}")
          crash.write_text(text.replace("assert_eq!(", "::std::assert_eq!("))
          PY

      - name: Format the exact Rust closure
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite

      - name: Execute native tests and strict lint
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- --test-threads=2
          cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2

      - name: Commit only qualified source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .hepta-bootstrap/run-secrets-native-remediation
          rm -f .github/workflows/hepta-remediate-secrets-native.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "Hepta remediation bot"
          git config user.email "hepta-remediation@users.noreply.github.com"
          git commit -m "secrets: restore native compile format and lint gates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
