          study = out / "learning-generations-study"
          subprocess.run([sys.executable, "qualification/learning-generations/run_study.py",
                          "--binary", str(binary), "--output", str(study)], check=True)
          receipt = json.loads(study.with_suffix(".execution.json").read_text())
          assert receipt["binary_sha256"] == digest and receipt["binary_unchanged"] is True
          assert receipt["native_exit_code"] == 0
          PY
      - name: Require signed-intent recovery and exact local abort controls
