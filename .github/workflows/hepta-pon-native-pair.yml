          assert selected["binary-name"] == "codex_hepta_agentd" and selected["build-platform"] == "target"
          build = listing["rust-build-meta"]
          target = Path(metadata["target_directory"]).resolve(strict=True)
          assert Path(build["target-directory"]).resolve(strict=True) == target
          assert build["base-output-directories"] == ["debug"], "unchanged native test profile required"
          binary = Path(selected["binary-path"]).resolve(strict=True)
          assert binary.parent == target / "debug/deps" and binary.is_file() and os.access(binary, os.X_OK)
