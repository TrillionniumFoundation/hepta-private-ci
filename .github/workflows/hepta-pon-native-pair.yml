          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root, out = Path.cwd().resolve(), Path(sys.argv[1]).resolve(strict=True)
          metadata = json.loads((out / "learning-generations-metadata.json").read_text())
          listing = json.loads((out / "learning-generations-binaries.json").read_text())
          assert Path(metadata["workspace_root"]).resolve() == root / "codex-rs"
          packages = [value for value in metadata["packages"] if value["name"] == "codex-hepta-agentd"]
          assert len(packages) == 1 and packages[0]["id"] in metadata["workspace_members"]
          assert Path(packages[0]["manifest_path"]).resolve() == root / "codex-rs/hepta-agentd/Cargo.toml"
          binaries = list(listing["rust-binaries"].values())
          assert len(binaries) == 1, "one actual Agentd library binary required"
          selected = binaries[0]
