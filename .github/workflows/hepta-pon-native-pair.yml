          with binary.open("rb") as handle:
              digest = hashlib.file_digest(handle, "sha256").hexdigest()
          with (out / "learning-generations-selected-binary.json").open("x") as handle:
              json.dump(dict(binary=str(binary), sha256=digest, nextest=selected, build=build), handle, indent=2)
