name: Hepta inference one-shot source remediation

on:
  push:
    branches:
      - codex/inference-control-v2-closure-20260927
    paths:
      - '.github/workflows/hepta-inference-source-export.yml'
      - '.github/remediation/inference-control-remediation.patch.gz'
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - '.github/workflows/hepta-inference-source-export.yml'
      - '.github/remediation/inference-control-remediation.patch.gz'

concurrency:
  group: hepta-inference-one-shot-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_PARENT: 65822d52842662038812aa03fc8640f2e25983d7
  RESTORE_COMMIT: a80f50a552d2608f238a9e934bf6fade66876912
  RESTORE_BLOB: c8fe5357b5b8efac14a220c29f94ba061a5f5c34
  PATCH_SHA256: c2599a124d0e1574aaebaadf3ce0313d4f906a9e9f9f1472c10491fa83100f57
  PATCH_PATH: .github/remediation/inference-control-remediation.patch.gz
  WORKFLOW_PATH: .github/workflows/hepta-inference-source-export.yml

jobs:
  verify:
    name: Verify bounded inference remediation
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/inference-control-v2-closure-20260927') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/inference-control-v2-closure-20260927')
    permissions:
      contents: read
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind transport commit and patch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(sha256sum "$PATCH_PATH" | awk '{print $1}')" = "$PATCH_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=$RESTORE_COMMIT" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/restored-workflow.yml"
          test "$(git hash-object "$RUNNER_TEMP/restored-workflow.yml")" = "$RESTORE_BLOB"

      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Apply bounded patch in read-only qualification job
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc "$PATCH_PATH" | git apply --index --whitespace=error-all
          rm -f "$PATCH_PATH"
          rmdir .github/remediation 2>/dev/null || true
          cp "$RUNNER_TEMP/restored-workflow.yml" "$WORKFLOW_PATH"
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-infer-core --package codex-hepta-infer-worker-host
          git add -A
          git diff --cached --check
          test ! -e "$PATCH_PATH"
          test "$(git hash-object "$WORKFLOW_PATH")" = "$RESTORE_BLOB"

      - name: Execute focused native verification
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --manifest-path codex-rs/Cargo.toml --format-version 1 >/dev/null
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-core -p codex-hepta-infer-worker-host
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-core -p codex-hepta-infer-worker-host \
            --all-targets --all-features -- -D warnings
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-infer-core --package codex-hepta-infer-worker-host -- --check
          git diff --cached --check

  publish:
    name: Publish verified inference remediation
    needs: verify
    permissions:
      contents: write
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: true

      - name: Reproduce reviewed source tree without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(sha256sum "$PATCH_PATH" | awk '{print $1}')" = "$PATCH_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=$RESTORE_COMMIT" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/restored-workflow.yml"
          test "$(git hash-object "$RUNNER_TEMP/restored-workflow.yml")" = "$RESTORE_BLOB"
          gzip -dc "$PATCH_PATH" | git apply --index --whitespace=error-all
          rm -f "$PATCH_PATH"
          rmdir .github/remediation 2>/dev/null || true
          cp "$RUNNER_TEMP/restored-workflow.yml" "$WORKFLOW_PATH"
          git add -A
          git diff --cached --check
          test ! -e "$PATCH_PATH"
          test "$(git hash-object "$WORKFLOW_PATH")" = "$RESTORE_BLOB"

      - name: Publish ordinary source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hepta Inference Remediation'
          git config user.email 'hepta-inference-remediation@users.noreply.github.com'
          git commit -m 'fix(inference): close owner lifecycle and recovery gaps'
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          printf 'source_sha=%s\nsource_tree=%s\n' "$source_sha" "$source_tree" | tee "$RUNNER_TEMP/remediation-source.txt"
          git push origin HEAD:codex/inference-control-v2-closure-20260927

      - name: Retain transport execution record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inference-remediation-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/remediation-source.txt
          if-no-files-found: warn
          retention-days: 3
