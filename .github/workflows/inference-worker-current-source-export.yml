name: Inference worker current-source export

on:
  push:
    branches:
      - automation/inference-worker-materialize-final-20260930
    paths:
      - .github/workflows/inference-worker-current-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-worker-current-source-export
  cancel-in-progress: true

env:
  TARGET_SHA: c85e991687c32608e4f3b3c54345ff19e1616d3f

jobs:
  export:
    name: Export frozen current-source files
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out frozen authoritative source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Bind immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Export exact ordinary-source inputs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/inference-worker-current-source"
          mkdir -p "$out"
          cat > "$out/requested-paths.txt" <<'EOF'
          codex-rs/hepta-infer-core/src/native_control.rs
          codex-rs/hepta-infer-core/src/native_control/control_impl.rs
          codex-rs/hepta-infer-core/src/native_control/model.rs
          codex-rs/hepta-infer-core/src/native_control/state.rs
          codex-rs/hepta-infer-core/src/native_control/journal_impl.rs
          codex-rs/hepta-infer-core/src/native_control_tests.rs
          codex-rs/hepta-infer-core/src/native_control_v2_tests.rs
          codex-rs/hepta-infer-worker-host/Cargo.toml
          codex-rs/hepta-infer-worker-host/src
          codex-rs/hepta-agentd/src/test_support.rs
          codex-rs/hepta-agentd/src/browser_servo.rs
          codex-rs/hepta-agentd/src/cognitive_retrieval_learning.rs
          codex-rs/hepta-agentd/src/plasticity_learning_producer.rs
          codex-rs/hepta-agentd/src/state.rs
          codex-rs/hepta-agentd/src/automation_effect_host.rs
          codex-rs/hepta-agentd/src/cognitive_context.rs
          codex-rs/hepta-agentd/src/intelligence_product.rs
          codex-rs/hepta-agentd/src/plasticity_host.rs
          scripts/hepta-implementation-maps.py
          scripts/inference_worker_command_receipt.py
          scripts/inference_worker_current_status.py
          scripts/run_inference_worker_qualification_lane.sh
          scripts/test_inference_worker_command_receipt.py
          scripts/tests/test_inference_worker_current_status.py
          docs/modules/inference.worker
          docs/modules/inference.control/IMPLEMENTATION_MAP.json
          qualification/module-execution-dossiers/detail/inference.worker.md
          .github/workflows/inference-worker-authoritative-qualification.yml
          .github/workflows/hepta-inference-maintenance.yml
          .github/workflows/inference-worker-p0-source-converge-once.yml
          EOF
          sed -i 's/^          //' "$out/requested-paths.txt"
          : > "$out/export-paths.txt"
          while IFS= read -r path; do
            if test -e "$path"; then
              printf '%s\n' "$path" >> "$out/export-paths.txt"
            fi
          done < "$out/requested-paths.txt"
          test -s "$out/export-paths.txt"
          tar -czf "$out/source-files.tar.gz" -T "$out/export-paths.txt"
          printf '%s\n' "$TARGET_SHA" > "$out/source-head.txt"
          git rev-parse "$TARGET_SHA^{tree}" > "$out/source-tree.txt"
          git ls-tree -r --full-tree "$TARGET_SHA" -- .github/materialization .github/workflows \
            > "$out/workflow-materialization-tree.txt"
          sha256sum "$out"/* > "$out/SHA256SUMS"

      - name: Prove checkout identity and source cleanliness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Upload source export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inference-worker-current-source-${{ github.sha }}
          path: ${{ runner.temp }}/inference-worker-current-source
          if-no-files-found: error
          retention-days: 3
