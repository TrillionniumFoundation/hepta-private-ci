name: AuthBus one-shot bootstrap API authoring

on:
  push:
    branches:
      - auth-authbus-boundary-convergence-20260928
    paths:
      - "codex-rs/hepta-authbus/src/bootstrap.rs"
      - "docs/modules/auth.authbus/BOOTSTRAP_RECOVERY.md"
      - ".github/workflows/authbus-bootstrap-api-authoring.yml"

permissions:
  contents: write

concurrency:
  group: authbus-bootstrap-api-authoring-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  author-bootstrap-api:
    name: Seal raw bootstrap and verify pair recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout triggering branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Seal the raw constructor and route the administrator through retry-safe bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one bootstrap boundary in {path}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "codex-rs/hepta-authbus/src/host.rs",
              "    pub async fn bootstrap(\n",
              "    pub(crate) async fn bootstrap(\n",
          )
          replace_once(
              "codex-rs/hepta-authbus/src/bin/hepta-authbus-admin.rs",
              "use codex_hepta_authbus::AuthBusAuthorityHost;\n",
              "use codex_hepta_authbus::AuthBusAuthorityHost;\nuse codex_hepta_authbus::bootstrap_retryable;\n",
          )
          replace_once(
              "codex-rs/hepta-authbus/src/bin/hepta-authbus-admin.rs",
              "    let host = AuthBusAuthorityHost::bootstrap(\n",
              "    let host = bootstrap_retryable(\n",
          )
          PY
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus

      - name: Compile exact affected product boundary
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo check -p codex-hepta-authbus --all-targets --all-features
          cargo check -p codex-hepta-operations --all-targets
          cargo check -p codex-hepta-bao-adapter --all-targets
          cd ..
          python3 - <<'PY'
          import subprocess

          expected = {
              "codex-rs/Cargo.lock",
              "codex-rs/hepta-authbus/src/host.rs",
              "codex-rs/hepta-authbus/src/bin/hepta-authbus-admin.rs",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          required = {
              "codex-rs/hepta-authbus/src/host.rs",
              "codex-rs/hepta-authbus/src/bin/hepta-authbus-admin.rs",
          }
          if not required.issubset(changed) or not changed.issubset(expected):
              raise SystemExit(f"unexpected one-shot authoring changes: {sorted(changed)}")
          PY

      - name: Commit only for the still-current branch head
        shell: bash
        env:
          TARGET_BRANCH: auth-authbus-boundary-convergence-20260928
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if test "$remote_head" != "$GITHUB_SHA"; then
            echo "A newer candidate exists; its run owns bootstrap authoring."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock \
            codex-rs/hepta-authbus/src/host.rs \
            codex-rs/hepta-authbus/src/bin/hepta-authbus-admin.rs
          git commit -m "authbus: make pair bootstrap retry-safe"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
