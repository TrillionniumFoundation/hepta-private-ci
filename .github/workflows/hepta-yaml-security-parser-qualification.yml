name: Hepta YAML security parser compatibility (qualification only)

on:
  pull_request:
    paths:
      # These jobs execute both entire --lib suites, not only two parser files.
      # Any owner source or Cargo manifest change must invalidate prior green.
      - "codex-rs/core-plugins/**"
      - "codex-rs/external-agent-migration/**"
      - "codex-rs/skills/**"
      - "codex-rs/ext/skills/**"
      # Workspace resolver, toolchain and formatting policy are qualification inputs.
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "codex-rs/rustfmt.toml"
      - "codex-rs/.cargo/config.toml"
      - ".github/workflows/hepta-yaml-security-parser-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaml-security-parser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  frontmatter-contract:
    name: Locked real YAML frontmatter compatibility (non-promoting)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          rustc --version --verbose
          cargo --version
      - name: Run complete locked Command Skill import and frontmatter regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-core-plugins --lib
      - name: Run complete locked Subagent metadata and import regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-external-agent-migration --lib
      - name: Verify parser owner formatting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-core-plugins --package codex-external-agent-migration -- --check
      - name: Verify clean checkout
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
