name: Prompt registry phase 1 qualification repair

on:
  push:
    branches: [ops/prompt-registry-closeout-20260930]
    paths:
      - .github/workflows/prompt-registry-phase1-author.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/prompt-registry-full-closeout-20260929
      EXPECTED_HEAD: 8d9f85f26f490c5c520576dca200d7420e60bc27
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply source repair and verify it locally
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          author="$RUNNER_TEMP/prompt_registry_phase1.py"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/prompt_registry_phase1_20260930.py?ref=${GITHUB_SHA}" \
            -o "$author"
          python3 "$author"
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p codex-hepta-prompt-extension
          cargo test --locked -p codex-hepta-prompt-registry
          cargo check --locked -p codex-core --all-targets
          cargo clippy --locked -p codex-hepta-prompt-extension --all-targets --no-deps -- -D warnings
          cd ..
          git diff --check

      - name: Commit and fast-forward the delivery candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          git add -A
          git diff --cached --check
          git -c commit.gpgsign=false commit --no-verify \
            -m 'fix(prompt.registry): restore exact qualification build'
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'source_sha=%s\nsource_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            | tee "$RUNNER_TEMP/prompt-registry-phase1.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-phase1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-registry-phase1.txt
          if-no-files-found: error
          retention-days: 30
