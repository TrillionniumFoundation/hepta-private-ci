name: Neuron runtime target-host acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit exercised on the target host
        required: true
        type: string
      base_sha:
        description: Exact integration base commit
        required: true
        type: string
      artifact_id:
        description: Artifact ID containing TARGET_HOST_RECEIPT.json and retained logs
        required: true
        type: string
      receipt_filename:
        description: Receipt file name inside the artifact
        required: false
        default: TARGET_HOST_RECEIPT.json
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: neuron-runtime-target-host-${{ inputs.source_sha }}-${{ inputs.artifact_id }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  BASE_SHA: ${{ inputs.base_sha }}
  ARTIFACT_ID: ${{ inputs.artifact_id }}
  RECEIPT_FILENAME: ${{ inputs.receipt_filename }}
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  finalize:
    name: Validate target-host receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          for name in ("SOURCE_SHA", "BASE_SHA"):
              if re.fullmatch(r"[0-9a-f]{40}", os.environ[name]) is None:
                  raise SystemExit(f"{name} must be lowercase 40-hex")
          if re.fullmatch(r"[1-9][0-9]*", os.environ["ARTIFACT_ID"]) is None:
              raise SystemExit("ARTIFACT_ID must be a positive integer")
          if "/" in os.environ["RECEIPT_FILENAME"] or not os.environ["RECEIPT_FILENAME"]:
              raise SystemExit("RECEIPT_FILENAME must be a simple file name")
          PY

      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download retained target-host evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target-host-evidence"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/target-host-evidence.zip"
          unzip -q "$RUNNER_TEMP/target-host-evidence.zip" \
            -d "$RUNNER_TEMP/target-host-evidence"
          mapfile -t receipts < <(
            find "$RUNNER_TEMP/target-host-evidence" -type f \
              -name "$RECEIPT_FILENAME" -print
          )
          test "${#receipts[@]}" -eq 1
          printf 'TARGET_RECEIPT=%s\n' "${receipts[0]}" >> "$GITHUB_ENV"

      - name: Validate receipt and exact claim boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s scripts/neuron \
            -p 'test_target_host_acceptance.py'
          python3 scripts/neuron/target_host_acceptance.py validate \
            --receipt "$TARGET_RECEIPT" \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --output "$RUNNER_TEMP/TARGET_HOST_MANIFEST.json"
          python3 - <<'PY' "$RUNNER_TEMP/TARGET_HOST_MANIFEST.json"
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["productExecutionProved"] is True
          assert value["productionActivation"] is False
          assert value["release"] is False
          PY
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Retain finalized target-host manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neuron-target-host-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TARGET_HOST_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
