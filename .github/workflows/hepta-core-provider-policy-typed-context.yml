name: Hepta Core Provider Policy Typed Context

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codex-rs/core/src/client.rs'
      - 'codex-rs/core/src/client_tests.rs'
      - 'codex-rs/core/src/client_provider_policy_tests.rs'
      - '.github/workflows/hepta-core-provider-policy-typed-context.yml'

permissions:
  contents: read

jobs:
  provider-policy-typed-context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Pin Rust 1.95 and rustfmt
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Full-workspace Rust formatting (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: cargo +1.95.0 fmt --all -- --check
      - name: Package Rust formatting (Windows avoids OS error 206)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cargo +1.95.0 fmt --package codex-core -- --check
      - name: Compile and exercise all provider terminal policy tests
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo +1.95.0 test --locked -p codex-core --lib client::client_provider_policy_tests -- --nocapture
