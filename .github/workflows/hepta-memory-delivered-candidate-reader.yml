name: MemoryCell original Reader source-delivered candidate experiment

on:
  push:
    branches:
      - "research/memorycell-four-stage-audit-20261016"
    paths:
      - "scripts/memory_cell/delivered_candidate_reader.py"
      - "scripts/memory_cell/delivered_candidate_replay.py"
      - "scripts/memory_cell/test_delivered_candidate_reader.py"
      - "scripts/memory_cell/source_delivered_local_receipt_gate.py"
      - "scripts/memory_cell/test_source_delivered_local_receipt_gate.py"
      - "scripts/memory_cell/data/source_delivered_original_local_20261016.json"
      - "codex-rs/hepta-intelligence-eval/MEMORY_CELL_DELIVERED_LOCAL_ACTUAL_20261016.md"
      - "scripts/memory_cell/four_stage_evidence.py"
      - "scripts/memory_cell/test_four_stage_evidence.py"
      - "codex-rs/hepta-intelligence-eval/MEMORY_CELL_DELIVERED_CANDIDATE_READER_20261016.md"
      - ".github/workflows/hepta-memory-delivered-candidate-reader.yml"
  pull_request:
    paths:
      - "scripts/memory_cell/delivered_candidate_reader.py"
      - "scripts/memory_cell/delivered_candidate_replay.py"
      - "scripts/memory_cell/test_delivered_candidate_reader.py"
      - "scripts/memory_cell/source_delivered_local_receipt_gate.py"
      - "scripts/memory_cell/test_source_delivered_local_receipt_gate.py"
      - "scripts/memory_cell/data/source_delivered_original_local_20261016.json"
      - "codex-rs/hepta-intelligence-eval/MEMORY_CELL_DELIVERED_LOCAL_ACTUAL_20261016.md"
      - "codex-rs/hepta-intelligence-eval/MEMORY_CELL_DELIVERED_CANDIDATE_READER_20261016.md"
      - ".github/workflows/hepta-memory-delivered-candidate-reader.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: memory-source-delivered-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime and model-free QA dependencies
        run: |
          set -euo pipefail
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.6.2 Jinja2==3.1.6 regex==2026.9.29 packaging==25.0 ruff==0.15.8
      - name: Verify source-only adversarial controls and original pinned receipts
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/memory_cell/four_stage_evidence.py \
            scripts/memory_cell/test_four_stage_evidence.py \
            scripts/memory_cell/delivered_candidate_reader.py \
            scripts/memory_cell/delivered_candidate_replay.py \
            scripts/memory_cell/test_delivered_candidate_reader.py \
            scripts/memory_cell/source_delivered_local_receipt_gate.py \
            scripts/memory_cell/test_source_delivered_local_receipt_gate.py
          python -m unittest discover -s scripts/memory_cell -p 'test_four_stage_evidence.py' -v
          python -m unittest discover -s scripts/memory_cell -p 'test_delivered_candidate_reader.py' -v
          python -m unittest discover -s scripts/memory_cell -p 'test_source_delivered_local_receipt_gate.py' -v
          python scripts/memory_cell/source_delivered_local_receipt_gate.py \
            scripts/memory_cell/data/source_delivered_original_local_20261016.json \
            --output "$RUNNER_TEMP/source-delivered-receipt-audit.json"
          ruff check --select F,E9 \
            scripts/memory_cell/four_stage_evidence.py \
            scripts/memory_cell/test_four_stage_evidence.py \
            scripts/memory_cell/delivered_candidate_reader.py \
            scripts/memory_cell/delivered_candidate_replay.py \
            scripts/memory_cell/test_delivered_candidate_reader.py \
            scripts/memory_cell/source_delivered_local_receipt_gate.py \
            scripts/memory_cell/test_source_delivered_local_receipt_gate.py
      - name: Verify exact tested source and current worktree integrity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code

  real-original-smol:
    needs: source-contracts
    if: github.event_name == 'push' && github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact original CPU runtime
        run: |
          set -euo pipefail
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.6.2 Jinja2==3.1.6 regex==2026.9.29 packaging==25.0
          mkdir -p "$RUNNER_TEMP/delivered-public"
          python -m pip freeze > "$RUNNER_TEMP/delivered-public/environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/delivered-public/tested-head.txt"
      - name: Fetch unchanged signed-by-digest GitHub historical input artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip \
            > "$RUNNER_TEMP/pinned-original-smol.zip"
          gh api /repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11827287296/zip \
            > "$RUNNER_TEMP/pinned-original-events.zip"
          printf '%s  %s\n' \
            07b357cbb3362f4afa4dc1872ab7e28e8a46daaf338f2636fed8d40fbcee76af \
            "$RUNNER_TEMP/pinned-original-smol.zip" | sha256sum -c -
          printf '%s  %s\n' \
            31c6f191ecf62095779f7c9a5dd6c5b2f89c6ae408fe9c26f74e017a2d62c47a \
            "$RUNNER_TEMP/pinned-original-events.zip" | sha256sum -c -
      - name: Stage exact pinned original-weight 135M model
        run: |
          set -euo pipefail
          python scripts/memory_cell/hf_original_parity.py \
            stage "$RUNNER_TEMP/pinned-original-smol.zip" "$RUNNER_TEMP/source-original-smol" \
            > "$RUNNER_TEMP/delivered-public/model-source-pins.json"
      - name: Complete 48 actual model forwards and close original answer journal
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          /usr/bin/time -v -o "$RUNNER_TEMP/delivered-public/reader-resources.txt" \
            python scripts/memory_cell/delivered_candidate_reader.py \
              "$RUNNER_TEMP/pinned-original-events.zip" \
              "$RUNNER_TEMP/source-original-smol" \
              "$RUNNER_TEMP/private-delivered-original" \
              --source-commit "$EXPECTED_COMMIT" \
              2>&1 | tee "$RUNNER_TEMP/delivered-public/model-execution.log"
      - name: Independently rederive source/rank and rerun 12 original procedures
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/memory_cell/delivered_candidate_replay.py \
            "$RUNNER_TEMP/pinned-original-events.zip" \
            "$RUNNER_TEMP/private-delivered-original" \
            "$RUNNER_TEMP/delivered-public/independent-replay.json" \
            --source-commit "$EXPECTED_COMMIT"
          cp "$RUNNER_TEMP/private-delivered-original/summary.json" \
            "$RUNNER_TEMP/delivered-public/sanitized-summary.json"
          cp "$RUNNER_TEMP/private-delivered-original/preregistered.json" \
            "$RUNNER_TEMP/delivered-public/registered-model-and-source.json"
      - name: Retain ONLY public receipts, checksums and failure evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivered-public/source"
          cp scripts/memory_cell/delivered_candidate_reader.py \
            scripts/memory_cell/delivered_candidate_replay.py \
            scripts/memory_cell/test_delivered_candidate_reader.py \
            "$RUNNER_TEMP/delivered-public/source/"
          cp .github/workflows/hepta-memory-delivered-candidate-reader.yml \
            "$RUNNER_TEMP/delivered-public/source/"
          (cd "$RUNNER_TEMP/delivered-public" && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          rm -rf "$RUNNER_TEMP/private-delivered-original" \
            "$RUNNER_TEMP/source-original-smol" \
            "$RUNNER_TEMP/pinned-original-smol.zip" \
            "$RUNNER_TEMP/pinned-original-events.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-source-delivered-real-original-smol
          path: ${{ runner.temp }}/delivered-public
          if-no-files-found: warn
