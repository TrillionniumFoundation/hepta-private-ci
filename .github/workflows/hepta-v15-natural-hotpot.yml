name: Hepta V15 natural HotpotQA evidence (DENY_ALL)
on:
  push:
    branches: [research/v15-natural-hotpot-evidence-20261016]
    paths:
      - 'qualification/stem-cell-v1/v15_*.py'
      - 'qualification/stem-cell-v1/test_v15_hotpot.py'
      - '.github/workflows/hepta-v15-natural-hotpot.yml'
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/v15_*.py'
      - 'qualification/stem-cell-v1/test_v15_hotpot.py'
      - '.github/workflows/hepta-v15-natural-hotpot.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: hepta-v15-natural-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Zero-dependency evidence contracts, including optimized assertion-free mode
        shell: bash
        env:
          PYTHONPATH: qualification/stem-cell-v1
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/v15-head.txt"
          python -S -m unittest -v test_v15_hotpot 2>&1 | tee "$RUNNER_TEMP/v15-standard.log"
          python -O -S -m unittest -v test_v15_hotpot 2>&1 | tee "$RUNNER_TEMP/v15-optimized.log"
          python -m compileall -q qualification/stem-cell-v1/v15_*.py qualification/stem-cell-v1/test_v15_hotpot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v15-test-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v15-head.txt
            ${{ runner.temp }}/v15-standard.log
            ${{ runner.temp }}/v15-optimized.log
          if-no-files-found: warn
          retention-days: 5

  original-source-owner:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fetch officially published 7,405 HotpotQA human questions; refuse checksum changes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 25 --max-time 900 \
            'https://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json' \
            -o "$RUNNER_TEMP/hotpot_official.json"
          echo '4e9ecb5c8d3b719f624d66b60f8d56bf227f03914f5f0753d6fa1b359d7104ea  '"$RUNNER_TEMP/hotpot_official.json" | sha256sum -c -
          python qualification/stem-cell-v1/v15_hotpot_source.py \
            --official-source "$RUNNER_TEMP/hotpot_official.json" --output "$RUNNER_TEMP/original-v15" \
            | tee "$RUNNER_TEMP/source-observation.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v15-original-public-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/original-v15/public.json
            ${{ runner.temp }}/original-v15/manifest.json
            ${{ runner.temp }}/source-observation.log
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: v15-original-hidden-${{ github.run_id }}
          path: ${{ runner.temp }}/original-v15/hidden-restricted.json
          if-no-files-found: error
          retention-days: 5

  blind-evidence-proposer:
    needs: original-source-owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v15-original-public-${{ github.run_id }}
          path: ${{ runner.temp }}/public
      - name: Freeze four zero-SGD evidence retrieval arms; no answer/support labels visible
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/public/hidden-restricted.json"
          python qualification/stem-cell-v1/v15_evidence_proposer.py plan \
            --public "$RUNNER_TEMP/public/public.json" \
            --owner "$RUNNER_TEMP/public/manifest.json" \
            --output "$RUNNER_TEMP/plan.json"
          python qualification/stem-cell-v1/v15_evidence_proposer.py propose \
            --public "$RUNNER_TEMP/public/public.json" \
            --owner "$RUNNER_TEMP/public/manifest.json" \
            --plan "$RUNNER_TEMP/plan.json" \
            --output "$RUNNER_TEMP/sealed.json" | tee "$RUNNER_TEMP/proposer.log"
          python -S - "$RUNNER_TEMP/sealed.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['completed_questions']==7405
          assert x['answers_or_gold_never_read'] is True
          assert x['optimizer_updates']==0 and x['pretrained_calls']==0
          assert x['actual_answer_generation'] is False
          assert x['authority']=='DENY_ALL' and x['production_accepted'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v15-sealed-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/sealed.json
            ${{ runner.temp }}/proposer.log
          if-no-files-found: warn
          retention-days: 5

  independent-citation-score:
    needs: [original-source-owner, blind-evidence-proposer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v15-original-public-${{ github.run_id }}
          path: ${{ runner.temp }}/public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v15-sealed-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed
      # Gold is first mounted here, NOT in the public proposer job.
      # Artifact visibility is an operational rather than cryptographic fence.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v15-original-hidden-${{ github.run_id }}
          path: ${{ runner.temp }}/held
      - name: Independently re-open all source-backed citations and original human support truth
        shell: bash
        run: |
          set -euo pipefail
          python -S qualification/stem-cell-v1/v15_hotpot_review.py \
            --public "$RUNNER_TEMP/public/public.json" \
            --owner "$RUNNER_TEMP/public/manifest.json" \
            --hidden "$RUNNER_TEMP/held/hidden-restricted.json" \
            --plan "$RUNNER_TEMP/sealed/plan.json" \
            --seal "$RUNNER_TEMP/sealed/sealed.json" \
            --output "$RUNNER_TEMP/independent-review.json" \
            | tee "$RUNNER_TEMP/reviewer.log"
          python -S - "$RUNNER_TEMP/independent-review.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['reviewed_questions']==7405 and len(r['summary'])==8
          assert r['evaluate_answers'] is False
          assert r['authority']=='DENY_ALL' and r['production_accepted'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v15-natural-human-support-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/independent-review.json
            ${{ runner.temp }}/reviewer.log
          if-no-files-found: warn
          retention-days: 5
