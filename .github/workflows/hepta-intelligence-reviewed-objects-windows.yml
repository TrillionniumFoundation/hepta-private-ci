name: intelligence.control reviewed objects Windows
on:
  pull_request:
    paths: ['.github/workflows/hepta-intelligence-reviewed-objects-windows.yml']
permissions:
  contents: write
concurrency:
  group: intelligence-reviewed-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reviewed-objects:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.event.pull_request.number == 1022 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/intelligence-control-product-closure-20260926'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Preserve exact Git blob bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse reviewed blob-only transport
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('.github/workflows/hepta-intelligence-reviewed-objects.yml')
          original = subprocess.check_output(['git', 'show', '90c1946f87929589df25a8a4b2df0f9218738b73:' + p.as_posix()])
          assert p.read_bytes() == original
          text = original.decode('utf-8')
          block = text.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          lines = block.splitlines()
          assert all(not line or line.startswith('          ') for line in lines)
          code = '\n'.join(line[10:] if line else '' for line in lines)
          exec(compile(code, 'reviewed-blob-transport', 'exec'))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-reviewed-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-objects/manifest.json
          if-no-files-found: error
          retention-days: 3
