name: Hepta retrieval bounded deadline and workflow hardening

on:
  push:
    branches: [work/memory-retrieval-phase-bde-20260927]

permissions:
  contents: read

concurrency:
  group: retrieval-phase-bde-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  close:
    if: contains(github.event.head_commit.message, '[retrieval-phase-bde-v1]')
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind exact isolated source and decode reviewed patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: work/memory-retrieval-phase-bde-20260927
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/hepta-private-ci
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$RUNNER_TEMP/retrieval-phase-bde"
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          source = pathlib.Path('scripts/patches/memory_retrieval_phase_b_v1.py.zlib.b64')
          packed = base64.b64decode(source.read_bytes(), validate=True)
          script = zlib.decompress(packed)
          expected = '50a9cf06323296f6b06b4bea65dbc00f568b694d9a9469c1056a7b51c8b14d00'
          if hashlib.sha256(script).hexdigest() != expected:
              raise SystemExit('phase B patch identity mismatch')
          target = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'retrieval-phase-bde' / 'apply.py'
          target.write_bytes(script)
          compile(script, str(target), 'exec')
          PY
          python3 "$RUNNER_TEMP/retrieval-phase-bde/apply.py"
      - name: Complete convergence workflow hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hepta-memory-retrieval-convergence.yml')
          text = path.read_text()
          old = '      CARGO_TARGET_DIR: ${{ runner.temp }}/retrieval-cargo-target\n'
          new = '      CARGO_TARGET_DIR: /tmp/hepta-retrieval-${{ github.run_id }}-${{ matrix.lane }}\n'
          if text.count(old) != 1:
              raise SystemExit('convergence target-directory preimage differs')
          path.write_text(text.replace(old, new))
          forbidden = ('workflow_dispatch:', 'needs.identity.outputs.source_sha', 'scripts/hepta_memory_retrieval_candidate.py merge')
          for needle in forbidden:
              if needle in path.read_text():
                  raise SystemExit(f'untrusted convergence indirection remains: {needle}')
          PY
      - name: Install pinned native tools and format scoped source
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check
          git status --short
      - name: Commit exact bounded source without advancing claims
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/hepta-memory-retrieval-convergence.yml \
            codex-rs/hepta-agentd/src/cognitive_context.rs \
            codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap.rs \
            codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap_tests.rs \
            codex-rs/hepta-agentd/src/retrieval_executor.rs \
            codex-rs/hepta-agentd/src/retrieval_executor_tests.rs
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/retrieval-phase-bde/source.patch"
          git commit -m 'feat(memory.retrieval): enforce one absolute deadline across product stages'
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-phase-bde/source-identity.txt"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest
      - name: Resolve repository-pinned V8 inputs
        run: python3 scripts/hepta_ci_v8.py
      - name: Native package tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          python3 ../scripts/hepta_ci_exec.py \
            --output "$RUNNER_TEMP/retrieval-phase-bde/package-tests.json" \
            --minimum-tests 10 --timeout-seconds 5400 -- \
            just test --locked \
              -p codex-hepta-memory-retrieval \
              -p codex-hepta-memory \
              -p codex-hepta-agentd \
              -p codex-hepta-learning-ledger
      - name: Strict all-target Clippy
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          python3 ../scripts/hepta_ci_exec.py \
            --output "$RUNNER_TEMP/retrieval-phase-bde/clippy.json" \
            --timeout-seconds 3600 -- \
            cargo +1.95.0 clippy --locked \
              -p codex-hepta-memory-retrieval \
              -p codex-hepta-memory \
              -p codex-hepta-agentd \
              -p codex-hepta-learning-ledger \
              --all-targets -- -D warnings
      - name: Formatting, workflow guards, and clean source
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          (cd codex-rs && python3 ../scripts/hepta_ci_exec.py \
            --output "$RUNNER_TEMP/retrieval-phase-bde/format.json" -- just fmt-check)
          python3 -m unittest -v \
            scripts.tests.test_hepta_memory_retrieval_candidate \
            scripts.tests.test_hepta_memory_retrieval_qualification \
            scripts.tests.test_hepta_memory_retrieval_refresh_map
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Remove one-shot transport, refresh source map, and publish
        if: ${{ !cancelled() }}
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: work/memory-retrieval-phase-bde-20260927
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/hepta-memory-retrieval-phase-bde.yml \
            scripts/patches/memory_retrieval_phase_b_v1.py.zlib.b64
          git add -A -- \
            .github/workflows/hepta-memory-retrieval-phase-bde.yml \
            scripts/patches/memory_retrieval_phase_b_v1.py.zlib.b64
          git commit -m 'chore(memory.retrieval): remove one-shot deadline transport'
          python3 - <<'PY'
          import importlib.util, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('retrieval_refresh', root / 'scripts/hepta_memory_retrieval_refresh_map.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          docs = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', head, '--', 'docs/modules/memory.retrieval'], text=True).splitlines()
          module.INPUTS = tuple(module.INPUTS) + tuple(path for path in docs if path != module.MAP)
          before = json.loads((root / module.MAP).read_text())
          mapping = module.refresh(root, head)
          if mapping['sourceBase'] != before['sourceBase']:
              raise SystemExit('sourceBase changed')
          for field in ('productionImplementation', 'productExecutionProved', 'independentAcceptance', 'activation', 'release'):
              if mapping['claimBoundary'][field] is not False:
                  raise SystemExit(f'claim advanced: {field}')
          (root / module.MAP).write_text(json.dumps(mapping, indent=2) + '\n')
          PY
          git add -- docs/modules/memory.retrieval/IMPLEMENTATION_MAP.json
          git diff --cached --quiet || git commit -m 'docs(memory.retrieval): observe bounded all-stage deadline candidate'
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote --heads origin "$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-phase-bde/final-identity.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/retrieval-phase-bde/source.tar.gz"
          shasum -a 256 "$RUNNER_TEMP/retrieval-phase-bde/source.tar.gz" > "$RUNNER_TEMP/retrieval-phase-bde/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-phase-bde-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-phase-bde/
          retention-days: 30
          if-no-files-found: error
