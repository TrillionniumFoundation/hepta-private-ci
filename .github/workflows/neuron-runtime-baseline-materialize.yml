name: Neuron Runtime Baseline Materializer

on:
  push:
    branches:
      - work/neuron-runtime-recovery-lifecycle-20260928
    paths:
      - '.github/workflows/neuron-runtime-baseline-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neuron-runtime-baseline-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded compiler repair
        env:
          BRANCH: work/neuron-runtime-recovery-lifecycle-20260928
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/neuron-runtime-baseline-fix.patch.gz.b64
          test "$(wc -c < "$payload" | tr -d ' ')" -eq 1124
          PAYLOAD="$payload" OUTPUT="$RUNNER_TEMP/neuron-runtime-baseline.patch" python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = Path(os.environ['PAYLOAD']).read_bytes()
          decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '6eed55c147cf7034d0b8dee34f601147be38fed7ae0d5c4a67a1e1c10b0242ba'
          actual = hashlib.sha256(decoded).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch digest mismatch: {actual}')
          Path(os.environ['OUTPUT']).write_bytes(decoded)
          PY
          git apply --check "$RUNNER_TEMP/neuron-runtime-baseline.patch"
          git apply "$RUNNER_TEMP/neuron-runtime-baseline.patch"

          {
            cd codex-rs
            cargo fmt --package codex-hepta-neuron
            cargo check --locked -p codex-hepta-neuron --all-targets
            cargo test --locked -p codex-hepta-neuron --lib
            cargo fmt --package codex-hepta-neuron -- --check
          } 2>&1 | tee "$RUNNER_TEMP/neuron-runtime-baseline.log"

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/neuron-runtime-baseline-materialize.yml \
            .github/neuron-runtime-baseline-fix.patch.gz.b64
          git add -A
          git commit -m 'fix(neuron): restore exact-head test compilation'
          candidate_head="$(git rev-parse HEAD)"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'candidate_head=%s\n' "$candidate_head" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain compiler repair log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neuron-runtime-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/neuron-runtime-baseline.log
          if-no-files-found: warn
          retention-days: 14
