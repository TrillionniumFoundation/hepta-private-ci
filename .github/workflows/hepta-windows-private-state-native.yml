name: Hepta Windows private-state native (security qualification only)

on:
  pull_request:
    paths:
      - "codex-rs/utils/path-utils/**"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - ".github/workflows/hepta-windows-private-state-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-windows-private-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  windows-secure-private-state:
    name: ACL, anti-reparse, signed-owner durability and recovery on Windows
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout immutable PR head without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source identity and pinned native compiler
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ github.event.pull_request.head.sha || github.sha }}") { throw "unqualified head SHA" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location codex-rs
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise private file handles, ACL, reparse and hardlink invariants
        shell: pwsh
        run: |
          Set-Location codex-rs
          cargo test --locked -p codex-utils-path --lib private_state_windows:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual Prompt Registry Windows durable owner
        shell: pwsh
        run: |
          Set-Location codex-rs
          cargo test --locked -p codex-hepta-prompt-registry --lib durable::windows::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise signed final-use and authority-lease durable stores
        shell: pwsh
        run: |
          Set-Location codex-rs
          cargo test --locked -p codex-hepta-contracts --lib final_use::store::windows::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p codex-hepta-contracts --lib authority_lease::windows::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Agentd Prompt Runtime integration and reopened state
        shell: pwsh
        run: |
          Set-Location codex-rs
          cargo test --locked -p codex-hepta-agentd --lib prompt_runtime::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce source-level Rust formatting for durable owners
        shell: pwsh
        run: |
          Set-Location codex-rs
          cargo fmt --package codex-utils-path --package codex-hepta-prompt-registry --package codex-hepta-contracts --package codex-hepta-agentd -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm no generated or modified tracked source
        if: always()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # @(...) yields an empty array when Git prints no status lines;
          # comparing a null/scalar command result with "" can misclassify a
          # clean Windows worktree. Preserve the fail-closed tracked-dirty gate.
          $trackedStatus = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($trackedStatus.Count -ne 0) {
            $trackedStatus | ForEach-Object { Write-Output "Tracked change: $_" }
            throw "unqualified worktree mutation"
          }

  windows-ledger-and-v15:
    name: Windows evaluated shadow, outcome credit and V15 migration (no promotion)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove checked-out source and migration fixture are bound to exact head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ github.event.pull_request.head.sha || github.sha }}") { throw "unqualified source SHA" }
          if (-not (Test-Path "codex-rs/hepta-memory/migrations/0015_shared_experience_use.sql")) { throw "missing compiled V15 migration" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test actual Windows Evaluated Shadow durable journal and segmented recovery
        shell: pwsh
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence --lib evaluated_shadow::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real Windows Outcome Credit append, witness and recovery
        shell: pwsh
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence --lib outcome_credit_v2::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require and run complete V2-to-V15 SQLite migration with owner table validation
        shell: pwsh
        run: |
          $testName = "cognitive_store_tests::v2_fixture_migrates_forward_preserving_memory_and_revoking_legacy_projection"
          $listed = @(cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory --lib -- --list)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($listed -contains "${testName}: test")) { throw "V15 migration conformance test missing" }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory --lib $testName -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce owner Clippy correctness and formatting
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence -p codex-hepta-memory --lib -- -D clippy::correctness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-intelligence --package codex-hepta-memory -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm immutable tracked source after all conformance checks
        if: always()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tracked.Count -ne 0) { throw "unqualified source mutation" }
