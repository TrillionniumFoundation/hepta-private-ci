name: hepta-final-materializer

on:
  push:
    branches:
      - codex/hepta-final-materializer-v2-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: b35b55f7767a3610481551c6260929904798b33c
      SOURCE_SHA: c4d942c2d245e935575be4fe29107b76032fed17
      CANDIDATE_BRANCH: codex/hepta-final-candidate-v3-20260907
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build isolated one-parent candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/hepta_final_materializer.py "${RUNNER_TEMP}/hepta_final_materializer.py"
          git checkout --detach "${SOURCE_SHA}"
          python3 "${RUNNER_TEMP}/hepta_final_materializer.py"

          git diff --check
          mapfile -t changed_files < <(git diff --name-only | LC_ALL=C sort)
          expected_files=(
            .github/workflows/bazel.yml
            codex-rs/hepta-operator-acceptance/src/durable.rs
          )
          if [[ "${changed_files[*]}" != "${expected_files[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed_files[*]}" >&2
            exit 1
          fi

          git add -- "${expected_files[@]}"
          tree_sha="$(git write-tree)"
          git config user.name "Hepta CI Finalizer"
          git config user.email "actions@users.noreply.github.com"
          candidate_commit="$(
            printf '%s\n' \
              'chore: repair inherited formatting and Rust dependency baseline' \
              '' \
              'Close deterministic Bazel dependency, native Windows ABI, platform lint, release matrix, and V8 canary blockers.' \
              | git commit-tree "${tree_sha}" -p "${BASE_SHA}"
          )"

          [[ "$(git show -s --format=%P "${candidate_commit}")" == "${BASE_SHA}" ]]
          git diff --check "${BASE_SHA}" "${candidate_commit}"
          for forbidden in \
            .github/workflows/hepta-final-materializer.yml \
            .github/scripts/hepta_final_materializer.py \
            .github/workflows/hepta-blocker-round2.yml \
            .hepta-blocker-round2-trigger; do
            if git cat-file -e "${candidate_commit}:${forbidden}" 2>/dev/null; then
              echo "Candidate retained helper: ${forbidden}" >&2
              exit 1
            fi
          done

          echo "CANDIDATE_COMMIT=${candidate_commit}"
          echo "CANDIDATE_TREE=${tree_sha}"
          git show --stat --oneline "${candidate_commit}"
          git push --force origin "${candidate_commit}:refs/heads/${CANDIDATE_BRANCH}"
