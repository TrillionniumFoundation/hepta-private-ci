name: hepta-final-materializer

on:
  push:
    branches:
      - codex/hepta-final-materializer-v2-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: b35b55f7767a3610481551c6260929904798b33c
      SOURCE_SHA: c4d942c2d245e935575be4fe29107b76032fed17
      CANDIDATE_BRANCH: codex/hepta-final-candidate-v3-20260907
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build isolated one-parent candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${SOURCE_SHA}"

          python3 <<'PY'
          from pathlib import Path

          bazel_path = Path('.github/workflows/bazel.yml')
          bazel = bazel_path.read_text(encoding='utf-8')
          old = '''          bazel_wrapper_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Release-mode compile coverage must use one coherent native ABI
            # for target crates, proc macros, SQLite, and cryptographic code.
            bazel_wrapper_args+=(--windows-msvc-host-platform)
          fi

          bazel_build_args=(
            --compilation_mode=fastbuild
            --platforms=//:windows_x86_64_msvc
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
'''
          new = '''          bazel_wrapper_args=()
          bazel_build_args=(
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Release-mode compile coverage must use one coherent native ABI
            # for target crates, proc macros, SQLite, and cryptographic code.
            bazel_wrapper_args+=(--windows-msvc-host-platform)
            bazel_build_args+=(--platforms=//:windows_x86_64_msvc)
          fi
'''
          if bazel.count(old) != 1:
              raise SystemExit(f'expected one release block, found {bazel.count(old)}')
          bazel = bazel.replace(old, new)
          if bazel.count('--platforms=//:windows_x86_64_msvc') != 4:
              raise SystemExit('unexpected native MSVC platform selector count')
          bazel_path.write_text(bazel, encoding='utf-8')

          durable_path = Path('codex-rs/hepta-operator-acceptance/src/durable.rs')
          durable = durable_path.read_text(encoding='utf-8')
          old = '''#[cfg(not(unix))]
fn verify_private_mode(
    _metadata: &std::fs::Metadata,
    _label: &str,
) -> Result<(), AcceptanceError> {
    Ok(())
}
'''
          new = '''#[cfg(not(unix))]
fn verify_private_mode(_metadata: &std::fs::Metadata, _label: &str) -> Result<(), AcceptanceError> {
    Ok(())
}
'''
          if durable.count(old) != 1:
              raise SystemExit(f'expected one rustfmt block, found {durable.count(old)}')
          durable_path.write_text(durable.replace(old, new), encoding='utf-8')
          PY

          git diff --check
          mapfile -t changed_files < <(git diff --name-only | LC_ALL=C sort)
          expected_files=(
            .github/workflows/bazel.yml
            codex-rs/hepta-operator-acceptance/src/durable.rs
          )
          if [[ "${changed_files[*]}" != "${expected_files[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed_files[*]}" >&2
            exit 1
          fi

          git add -- "${expected_files[@]}"
          tree_sha="$(git write-tree)"
          git config user.name "Hepta CI Finalizer"
          git config user.email "actions@users.noreply.github.com"
          candidate_commit="$(
            printf '%s\n' \
              'chore: repair inherited formatting and Rust dependency baseline' \
              '' \
              'Close deterministic Bazel dependency, native Windows ABI, platform lint, release matrix, and V8 canary blockers.' \
              | git commit-tree "${tree_sha}" -p "${BASE_SHA}"
          )"

          [[ "$(git show -s --format=%P "${candidate_commit}")" == "${BASE_SHA}" ]]
          git diff --check "${BASE_SHA}" "${candidate_commit}"
          if git cat-file -e "${candidate_commit}:.github/workflows/hepta-final-materializer.yml" 2>/dev/null; then
            echo 'Candidate retained final materializer workflow.' >&2
            exit 1
          fi
          if git cat-file -e "${candidate_commit}:.github/scripts/hepta_final_materializer.py" 2>/dev/null; then
            echo 'Candidate retained final materializer script.' >&2
            exit 1
          fi

          echo "CANDIDATE_COMMIT=${candidate_commit}"
          echo "CANDIDATE_TREE=${tree_sha}"
          git show --stat --oneline "${candidate_commit}"
          git push --force origin "${candidate_commit}:refs/heads/${CANDIDATE_BRANCH}"
