name: hcsn-index1159-current-resource-observation-source

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_index1159_resource_observation/**"
      - ".github/workflows/hcsn-index1159-current-resource-observation-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify frozen source
        run: python3 qualification/hcsn_currentstate_n256_index1159_resource_observation/verify_source.py
      - name: Verify frozen source under optimized Python
        run: python3 -O qualification/hcsn_currentstate_n256_index1159_resource_observation/verify_source.py
      - name: Parse shell source without executing it
        run: sh -n qualification/hcsn_currentstate_n256_index1159_resource_observation/snapshot_source.sh
      - name: Verify immutable observation originals
        run: >-
          python3 qualification/hcsn_currentstate_n256_index1159_resource_observation/audit_observation.py
          --verify-expected
          qualification/hcsn_currentstate_n256_index1159_resource_observation/RESULT.json
      - name: Verify immutable observation originals under optimized Python
        run: >-
          python3 -O qualification/hcsn_currentstate_n256_index1159_resource_observation/audit_observation.py
          --verify-expected
          qualification/hcsn_currentstate_n256_index1159_resource_observation/RESULT.json
