name: Prompt optimizer temporary autofmt

on:
  push:
    branches: [work/prompt-optimizer-v1-pipeline-20260917]
    paths:
      - "codex-rs/hepta-prompt-optimizer/**"
      - ".github/workflows/prompt-optimizer-autofmt.yml"

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/prompt-optimizer-v1-pipeline-20260917
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply compile fix and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-prompt-optimizer/src/policy.rs")
          source = path.read_text(encoding="utf-8")
          old = "        portfolio_id: input.portfolio_id,\n"
          new = "        portfolio_id: input.portfolio_id.clone(),\n"
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise RuntimeError("unexpected portfolio_id construction")
          path.write_text(source, encoding="utf-8")
          PY
          cd codex-rs
          cargo fmt --package codex-hepta-prompt-optimizer
          cd ..
          git diff --check
          if ! git diff --quiet -- codex-rs/hepta-prompt-optimizer; then
            git config user.name 'hepta-prompt-optimizer-autofmt'
            git config user.email 'hepta-prompt-optimizer-autofmt@users.noreply.github.com'
            git add codex-rs/hepta-prompt-optimizer
            git commit -m 'fix(prompt-optimizer): retain portfolio id across audit borrow'
            git push origin HEAD:work/prompt-optimizer-v1-pipeline-20260917
          fi
      - name: Run prompt optimizer package tests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-hepta-prompt-optimizer
