name: Prompt optimizer temporary autofmt

on:
  push:
    branches: [work/prompt-optimizer-v1-pipeline-20260917]
    paths:
      - "codex-rs/hepta-prompt-optimizer/**"
      - ".github/workflows/prompt-optimizer-autofmt.yml"

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/prompt-optimizer-v1-pipeline-20260917
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Migrate strict-shadow regressions and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-prompt-optimizer/src/local_shadow_tests.rs")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "LocalSelectionMethod::GreedyMarginalV1",
              "LocalSelectionMethod::GreedyRequirementClosureV2",
          )
          old = '''#[test]
          fn unavailable_prerequisite_blocks_high_gain_dependent_factor() {
              let mut input = local_input(vec![
                  factor(/*index*/ 0, /*gain*/ 100, /*cost*/ 1),
                  factor(/*index*/ 1, /*gain*/ -1, /*cost*/ 1),
              ]);
              input.maximum_selected_factors = 2;
              input.interaction_edges = complete_interactions(&input.factor_candidates);
              input.hard_constraints.push(LocalHardConstraint::Requires {
                  candidate_id: id("candidate:000"),
                  prerequisite_candidate_id: id("candidate:001"),
                  support_reference_digest: test_digest(b"requires-reference"),
              });

              let proposal = calculate(input);
              assert!(proposal.selections.is_empty());
              assert_eq!(proposal.total_caller_supplied_gain, FixedQ32::ZERO);
          }
          '''
          new = '''#[test]
          fn positive_requirement_bundle_can_carry_negative_prerequisite() {
              let mut input = local_input(vec![
                  factor(/*index*/ 0, /*gain*/ 100, /*cost*/ 1),
                  factor(/*index*/ 1, /*gain*/ -1, /*cost*/ 1),
              ]);
              input.maximum_selected_factors = 2;
              input.interaction_edges = complete_interactions(&input.factor_candidates);
              input.hard_constraints.push(LocalHardConstraint::Requires {
                  candidate_id: id("candidate:000"),
                  prerequisite_candidate_id: id("candidate:001"),
                  support_reference_digest: test_digest(b"requires-reference"),
              });

              let proposal = calculate(input);
              assert_eq!(
                  proposal.selections,
                  vec![
                      LocalShadowSelection {
                          candidate_id: id("candidate:001"),
                          factor_id: id("factor:001"),
                      },
                      LocalShadowSelection {
                          candidate_id: id("candidate:000"),
                          factor_id: id("factor:000"),
                      },
                  ]
              );
              assert_eq!(
                  proposal.total_caller_supplied_gain,
                  FixedQ32::from_raw(/*raw*/ 99)
              );
          }
          '''
          if old in source:
              source = source.replace(old, new)
          elif "fn positive_requirement_bundle_can_carry_negative_prerequisite()" not in source:
              raise RuntimeError("unexpected negative-prerequisite test structure")

          marker = '''#[test]
          fn unknown_prerequisite_is_rejected_instead_of_ignored() {
          '''
          addition = '''#[test]
          fn requires_cycle_is_rejected_explicitly() {
              let mut input = local_input(vec![
                  factor(/*index*/ 0, /*gain*/ 2, /*cost*/ 1),
                  factor(/*index*/ 1, /*gain*/ 1, /*cost*/ 1),
              ]);
              input.hard_constraints = vec![
                  LocalHardConstraint::Requires {
                      candidate_id: id("candidate:000"),
                      prerequisite_candidate_id: id("candidate:001"),
                      support_reference_digest: test_digest(b"a-requires-b"),
                  },
                  LocalHardConstraint::Requires {
                      candidate_id: id("candidate:001"),
                      prerequisite_candidate_id: id("candidate:000"),
                      support_reference_digest: test_digest(b"b-requires-a"),
                  },
              ];
              assert!(matches!(
                  calculate_local_shadow(input),
                  Err(LocalShadowError::InvalidInput(InvalidInput::RequiresCycle(_)))
              ));
          }

          #[test]
          fn requirement_conflict_is_rejected_as_unsatisfiable() {
              let mut input = local_input(vec![
                  factor(/*index*/ 0, /*gain*/ 2, /*cost*/ 1),
                  factor(/*index*/ 1, /*gain*/ 1, /*cost*/ 1),
              ]);
              input.hard_constraints = vec![
                  LocalHardConstraint::Conflict {
                      left_candidate_id: id("candidate:000"),
                      right_candidate_id: id("candidate:001"),
                      support_reference_digest: test_digest(b"conflict-reference"),
                  },
                  LocalHardConstraint::Requires {
                      candidate_id: id("candidate:000"),
                      prerequisite_candidate_id: id("candidate:001"),
                      support_reference_digest: test_digest(b"requires-reference"),
                  },
              ];
              assert_eq!(
                  calculate_local_shadow(input),
                  Err(LocalShadowError::InvalidInput(
                      InvalidInput::UnsatisfiableRequirementConflict("candidate:000".to_string())
                  ))
              );
          }

          '''
          if "fn requires_cycle_is_rejected_explicitly()" not in source:
              if marker not in source:
                  raise RuntimeError("unexpected insertion marker")
              source = source.replace(marker, addition + marker)
          path.write_text(source, encoding="utf-8")
          PY
          cd codex-rs
          cargo fmt --package codex-hepta-prompt-optimizer
          cd ..
          git diff --check
          if ! git diff --quiet -- codex-rs/hepta-prompt-optimizer; then
            git config user.name 'hepta-prompt-optimizer-autofmt'
            git config user.email 'hepta-prompt-optimizer-autofmt@users.noreply.github.com'
            git add codex-rs/hepta-prompt-optimizer
            git commit -m 'test(prompt-optimizer): migrate strict-shadow regressions'
            git push origin HEAD:work/prompt-optimizer-v1-pipeline-20260917
          fi
      - name: Run prompt optimizer package tests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-hepta-prompt-optimizer
