name: tmp-lane-e-readiness-sync-r4

on:
  push:
    branches:
      - tmp/hepta-lane-e-readiness-sync-r4-20260910
    paths:
      - .github/workflows/tmp-lane-e-readiness-sync-r4.yml

permissions:
  contents: write

concurrency:
  group: tmp-lane-e-readiness-sync-r4
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recompute the exact learning.eval detailed-design digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          index_path = Path("qualification/module-execution-dossiers/DETAILS.json")
          detail_path = Path("qualification/module-execution-dossiers/detail/learning.eval.md")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          rows = [row for row in index["rows"] if row["module"] == "learning.eval"]
          if len(rows) != 1:
              raise SystemExit(f"expected exactly one learning.eval row, found {len(rows)}")
          old_digest = rows[0]["sha256"]
          new_digest = hashlib.sha256(detail_path.read_bytes()).hexdigest()
          if old_digest == new_digest:
              raise SystemExit("learning.eval digest was already synchronized")
          rows[0]["sha256"] = new_digest
          index_path.write_text(
              json.dumps(index, ensure_ascii=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"learning.eval digest: {old_digest} -> {new_digest}")
          PY

      - name: Verify the complete implementation-readiness closed world
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          git diff --check

      - name: Publish the clean synchronized tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-lane-e-readiness-sync-r4.yml
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/tmp-lane-e-readiness-sync-r4.yml \
            qualification/module-execution-dossiers/DETAILS.json \
            | sort)"
          test "$actual" = "$expected"
          git diff --check
          git config user.name hepta-lane-e-readiness-sync-bot
          git config user.email hepta-lane-e-readiness-sync-bot@users.noreply.github.com
          git add \
            qualification/module-execution-dossiers/DETAILS.json \
            .github/workflows/tmp-lane-e-readiness-sync-r4.yml
          git commit -m "docs(lane-e): synchronize detailed-design digest"
          git push origin HEAD:refs/heads/tmp/hepta-lane-e-readiness-sync-r4-20260910
