name: hepta Windows owner-local union qualification

on:
  pull_request:
    paths:
      - .github/workflows/hepta-windows-owner-local-qualification.yml
      - qualification/windows-owner-local-current/**
      - codex-rs/uds/**
      - codex-rs/hepta-matrixd/**
      - codex-rs/hepta-fleet/**
      - codex-rs/hepta-automation/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - MODULE.bazel.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-windows-owner-local-union-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.head_ref == 'fix/private-ci-windows-owner-local-20261103' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/private-ci-windows-owner-local-20261103')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.151
      - name: Run all original owner-local, Matrixd, Fleet and Automation library controls
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/owner-local-target
          HEPTA_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python qualification/windows-owner-local-current/run_qualification.py native --output "$env:RUNNER_TEMP/owner-local-qualification"
      - name: Retain complete original results including failures
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: owner-local-union-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/owner-local-qualification
          if-no-files-found: error
          retention-days: 7

  bazel:
    if: github.head_ref == 'fix/private-ci-windows-owner-local-20261103' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/private-ci-windows-owner-local-20261103')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: windows-owner-local-union
      - name: Check committed lock before generating and running original Bazel targets
        env:
          HEPTA_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 qualification/windows-owner-local-current/run_qualification.py bazel --output "$RUNNER_TEMP/owner-local-bazel"
      - name: Preserve generated lock and exact original failures
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: owner-local-union-bazel-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/owner-local-bazel
          if-no-files-found: error
          retention-days: 7
