name: Runtime Agentd manual publication fallback

# The registered runtime-agentd-format-repair workflow is the sole automatic
# content-addressed publisher for this carrier. Keep this file manual-only so
# two workflows cannot race to publish the same tested tree. The successful
# publication removes this fallback together with the carrier parts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain automatic publication owner
        run: |
          echo 'Automatic publication is owned by runtime-agentd-format-repair.yml.'
          echo 'This fallback intentionally does not mutate the candidate.'
