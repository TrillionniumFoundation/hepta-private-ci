name: Cancel superseded cleanup run

on:
  push:
    branches: [ops/fleet-cleanup-20261002]
    paths:
      - .github/workflows/ops-cancel-cleanup-20261002.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded queued cleanup run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "36984593919"
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel")
          cat response.json || true
          echo "http_code=$code"
          test "$code" = "202" || test "$code" = "409"
