name: Learning operator convergence unblock

on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths:
      - '.github/workflows/learning-operator-convergence-unblock.yml'

permissions:
  contents: write

concurrency:
  group: learning-operator-convergence-unblock
  cancel-in-progress: true

jobs:
  unblock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/learning-operator-full-convergence-20260926
          fetch-depth: 0
          persist-credentials: true
      - name: Retire obsolete writer and release authoritative convergence run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/learning-operator-remaining-convergence.yml')
          text = workflow.read_text()
          old = 'group: learning-operator-final-qualification-convergence'
          new = 'group: learning-operator-remaining-convergence-frozen'
          if new not in text:
              if old not in text:
                  raise SystemExit('remaining convergence group marker missing')
              workflow.write_text(text.replace(old, new, 1))
          PY
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/learning-operator-final-convergence.yml \
            .github/workflows/learning-operator-convergence-unblock.yml
          git add .github/workflows/learning-operator-remaining-convergence.yml
          git commit \
            -m "ci(learning.operator): freeze authoritative convergence writer" \
            -m "Retire the obsolete queued writer and move the remaining V4 convergence to its own frozen concurrency group." \
            -m "Signed-off-by: OpenAI <openai@users.noreply.github.com>"
          git push origin HEAD:codex/learning-operator-full-convergence-20260926
