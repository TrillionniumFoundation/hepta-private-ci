name: Hepta content delivery identity

on:
  pull_request:
    paths:
      - .github/workflows/hepta-content-chain.yml
      - scripts/ndu_real_runtime/**
      - scripts/ndu_real_materials/**
      - scripts/hepta_ci_exec.py
      - scripts/pyproject.toml
      - scripts/uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/hepta-content-chain.yml
      - scripts/ndu_real_runtime/**
      - scripts/ndu_real_materials/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-content-chain-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HEPTA_CI_LANE: source-head
  PYTHONDONTWRITEBYTECODE: "1"
  UV_PYTHON_DOWNLOADS: never

jobs:
  content-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Run bounded content and host regressions on the exact source
        shell: bash
        env:
          PYTHONPATH: scripts
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/content-chain-uv-env
          UV_CACHE_DIR: ${{ runner.temp }}/content-chain-uv-cache
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          records="$RUNNER_TEMP/content-chain-ci"
          mkdir -p "$records"
          git rev-parse HEAD HEAD^{tree} > "$records/source.txt"
          status=0
          while read -r minimum module; do
            python3 scripts/hepta_ci_exec.py --timeout-seconds 120 \
              --minimum-tests "$minimum" --output "$records/${module##*.}.json" \
              -- uv run --frozen --project scripts --python 3.12.14 \
              --with numpy==2.3.5 --with pillow==13.0.0 \
              python -B -m unittest -v "$module" || status=1
          done <<'CASES'
          5 ndu_real_runtime.test_content_chain
          9 ndu_real_runtime.test_content_episode
          CASES
          git diff --exit-code
          test -z "$(git status --porcelain)"
          exit "$status"
      - name: Retain original results including unsuccessful attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/content-chain-ci/*
          if-no-files-found: error
          retention-days: 30
