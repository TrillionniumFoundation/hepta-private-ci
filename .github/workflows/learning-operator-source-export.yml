name: learning-operator-source-export

on:
  push:
    branches:
      - codex/learning-operator-full-convergence-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Package immutable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > source-sha.txt
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude='*/target' \
            -czf /tmp/hepta-private-ci-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-operator-source-${{ github.sha }}
          path: /tmp/hepta-private-ci-source.tar.gz
          if-no-files-found: error
          retention-days: 1
