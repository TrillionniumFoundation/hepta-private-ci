name: Hepta PR524 r23 blocker materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/hepta-pr524-r23-materializer.yml
      - .hepta-materializer/**

permissions:
  contents: write

concurrency:
  group: hepta-pr524-r23-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/pr524-r23-materializer-20260911-r1' &&
      github.event.pull_request.base.ref == 'candidate/hepta-all-gap-closure-final-r21-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact materializer head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Apply exact blocker patch and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          cat .hepta-materializer/patch.b64.* | base64 --decode > /tmp/pr524-r23.patch.gz
          echo "a0cd3d989563717396d79280c6bf0e36bcb2a61fb0c546a8328223492d265ba8  /tmp/pr524-r23.patch.gz" | sha256sum -c -
          gzip -dc /tmp/pr524-r23.patch.gz > /tmp/pr524-r23.patch
          echo "ef56859108534c6984b6026fecc59edbfcd75c927b838e58843205cf0eb5cd4c  /tmp/pr524-r23.patch" | sha256sum -c -
          git apply --check /tmp/pr524-r23.patch
          git apply /tmp/pr524-r23.patch
          rm -rf .hepta-materializer
          rm .github/workflows/hepta-pr524-r23-materializer.yml
          uv run --frozen --project scripts ruff format scripts
          (cd codex-rs && cargo fmt --all)
          git diff --check

      - name: Commit candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-pr524-materializer
          git config user.email hepta-pr524-materializer@users.noreply.github.com
          git add -A
          git commit -m "fix(convergence): close repository-controlled blockers"
          git rev-parse HEAD HEAD^{tree}

      - name: Verify Python formatting
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format --check scripts

      - name: Verify module documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify

      - name: Verify implementation contract oracles
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository

      - name: Verify technical closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-technical-closure.py verify

      - name: Verify readiness projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify

      - name: Verify repository index stability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Check Rust owner crates
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets --message-format=short \
            -p codex-hepta-control-plane \
            -p codex-hepta-cognitive-store

      - name: Test Rust owner crates
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets \
            -p codex-hepta-control-plane \
            -p codex-hepta-cognitive-store

      - name: Lint Rust owner crates
        id: rust_owner_lint
        working-directory: codex-rs
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-control-plane \
            -p codex-hepta-cognitive-store \
            -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/r23-rust-owner-clippy.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Retain exact Rust owner lint diagnostic
        if: failure() && steps.rust_owner_lint.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r23-rust-owner-clippy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r23-rust-owner-clippy.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish validated materialized tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
