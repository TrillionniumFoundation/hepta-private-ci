name: runtime.codex p0 materialize macos

on:
  push:
    branches:
      - codex/runtime-codex-p0-convergence-20260930
    paths:
      - .github/workflows/runtime-codex-materialize-macos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-codex-p0-materialize-macos
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Materialize ordinary source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          scripts=(
            scripts/runtime-codex-maintainer.py
            scripts/runtime-codex-maintainer-followup.py
            scripts/runtime-codex-durability-migration.py
            scripts/runtime-codex-durability-fixup.py
            scripts/runtime-codex-quarantine-migration.py
            scripts/runtime-codex-deadline-migration.py
            scripts/runtime-codex-cleanup-migration.py
            scripts/runtime-codex-storage-fixup.py
            scripts/runtime-codex-terminal-outbox-migration.py
            scripts/runtime-codex-product-executor-migration.py
            scripts/runtime-codex-product-executor-hardening.py
            scripts/runtime-codex-structured-sequence-migration.py
            scripts/runtime-codex-process-crash-migration.py
            scripts/runtime-codex-qualification-fixup.py
            scripts/runtime-codex-final-closure.py
          )
          python3 -m py_compile "${scripts[@]}" \
            scripts/runtime-codex-finalize-map.py \
            scripts/runtime-codex-finalize-map-followup.py
          for script in "${scripts[@]}"; do
            echo "materialize: ${script}"
            python3 "$script"
          done
          (
            cd codex-rs
            cargo fmt --all
          )
          git diff --check
      - name: Commit immutable source
        shell: bash
        env:
          TARGET_BRANCH: codex/runtime-codex-p0-convergence-20260930
        run: |
          set -euo pipefail
          git config user.name 'runtime.codex p0 materializer'
          git config user.email 'runtime-codex-materializer@invalid'
          git rm -f \
            .github/workflows/runtime-codex-materialize-once.yml \
            .github/workflows/runtime-codex-materialize-macos.yml \
            .github/workflows/runtime-codex-fast-feedback.yml \
            .github/workflows/runtime-codex-maintainer.yml
          git rm -f \
            scripts/runtime-codex-maintainer.py \
            scripts/runtime-codex-maintainer-followup.py \
            scripts/runtime-codex-durability-migration.py \
            scripts/runtime-codex-durability-fixup.py \
            scripts/runtime-codex-quarantine-migration.py \
            scripts/runtime-codex-deadline-migration.py \
            scripts/runtime-codex-cleanup-migration.py \
            scripts/runtime-codex-storage-fixup.py \
            scripts/runtime-codex-terminal-outbox-migration.py \
            scripts/runtime-codex-product-executor-migration.py \
            scripts/runtime-codex-product-executor-hardening.py \
            scripts/runtime-codex-structured-sequence-migration.py \
            scripts/runtime-codex-process-crash-migration.py \
            scripts/runtime-codex-qualification-fixup.py \
            scripts/runtime-codex-final-closure.py
          git add -A
          git diff --cached --check
          git commit -m 'fix(runtime.codex): materialize converged durable source'
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          RUNTIME_CODEX_SOURCE_COMMIT="$source_commit" \
          RUNTIME_CODEX_SOURCE_TREE="$source_tree" \
            python3 scripts/runtime-codex-finalize-map.py
          RUNTIME_CODEX_SOURCE_COMMIT="$source_commit" \
          RUNTIME_CODEX_SOURCE_TREE="$source_tree" \
            python3 scripts/runtime-codex-finalize-map-followup.py
          git rm -f \
            scripts/runtime-codex-finalize-map.py \
            scripts/runtime-codex-finalize-map-followup.py
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs(runtime.codex): bind immutable p0 source'
          fi
          test -z "$(git status --porcelain=v1)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
