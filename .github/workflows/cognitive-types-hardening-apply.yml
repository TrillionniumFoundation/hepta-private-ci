name: cognitive-types-hardening-apply

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: cognitive-types-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-qualify-and-push:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/cognitive-types-production-hardening-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact same-repository head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev

      - name: Install pinned Rust toolchain components
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Reconstruct and authenticate fail-closed migration
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cognitive-types-hardening/part-*.b64 > /tmp/cognitive-types-hardening.py.gz.b64
          echo '240a87c804e8b9dd0547e6056dde81600fffcb1c2e2aa9756527bd84748e1d24  /tmp/cognitive-types-hardening.py.gz.b64' | sha256sum -c -
          base64 --decode /tmp/cognitive-types-hardening.py.gz.b64 | gzip --decompress > /tmp/apply-cognitive-types-hardening.py
          echo 'fbb6c457b4526b17fec24eea7ccfdb8e0a147fb6915ad488d9f29dd30fcdfd55  /tmp/apply-cognitive-types-hardening.py' | sha256sum -c -
          python3 -m py_compile /tmp/apply-cognitive-types-hardening.py

      - name: Apply contract, consumer, API and CI hardening
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/apply-cognitive-types-hardening.py scripts/.apply-cognitive-types-hardening.py
          python3 scripts/.apply-cognitive-types-hardening.py
          rm -f scripts/.apply-cognitive-types-hardening.py .cognitive-types-hardening-applied
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Verify registries and cross-language vectors
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 qualification/cognitive-types-v1/verify_vectors.py
          python3 qualification/cognitive-types-v1/verify_bound_vector.py
          node qualification/cognitive-types-v1/verify_bound_vector.mjs

      - name: Check targeted production closure
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          cargo check --manifest-path codex-rs/Cargo.toml --locked --all-targets \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-operations \
            -p codex-state

      - name: Run targeted tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-operations \
            -p codex-state

      - name: Run strict targeted clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --all-targets \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-operations \
            -p codex-state -- -D warnings

      - name: Commit exact tested implementation
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/cognitive-types-hardening
          rm -f .github/workflows/cognitive-types-hardening-apply.yml
          git config user.name 'hepta-ci'
          git config user.email 'hepta-ci@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'migration produced no implementation changes' >&2
            exit 1
          fi
          git commit -m 'feat(cognitive.types): close production contract hardening'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Qualify synthetic merge candidate
        id: synthetic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          implementation_sha="${{ steps.implementation.outputs.sha }}"
          main_sha="$(git rev-parse origin/main)"
          git checkout --detach "$implementation_sha"
          if ! git merge --no-commit --no-ff origin/main; then
            git merge --abort || true
            echo 'synthetic merge conflict' >&2
            exit 1
          fi
          synthetic_tree="$(git write-tree)"
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          cargo check --manifest-path codex-rs/Cargo.toml --locked --all-targets \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-operations \
            -p codex-state
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-cognitive-read
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --all-targets \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-operations \
            -p codex-state -- -D warnings
          git merge --abort 2>/dev/null || true
          git checkout "${{ github.event.pull_request.head.ref }}"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$synthetic_tree" >> "$GITHUB_OUTPUT"

      - name: Write immutable qualification receipt
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
          IMPLEMENTATION_TREE: ${{ steps.implementation.outputs.tree }}
          SYNTHETIC_MAIN_SHA: ${{ steps.synthetic.outputs.main_sha }}
          SYNTHETIC_TREE: ${{ steps.synthetic.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p qualification/cognitive-types-v1/receipts
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import subprocess

          commands = [
              'hepta-hnmf self-test/verify',
              'python/node bound golden vectors',
              'cargo fmt --all --check',
              'targeted cargo check --all-targets --locked',
              'targeted cargo test --locked',
              'targeted cargo clippy --all-targets --locked -- -D warnings',
              'synthetic-merge fmt/check/test/clippy',
          ]
          receipt = {
              'schema': 'hepta.cognitive-types.qualification-receipt.v1',
              'status': 'PASS',
              'implementationCommit': os.environ['IMPLEMENTATION_SHA'],
              'implementationTree': os.environ['IMPLEMENTATION_TREE'],
              'syntheticBaseCommit': os.environ['SYNTHETIC_MAIN_SHA'],
              'syntheticMergeTree': os.environ['SYNTHETIC_TREE'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'workflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'rustc': subprocess.check_output(['rustc', '--version', '--verbose'], text=True),
              'cargo': subprocess.check_output(['cargo', '--version', '--verbose'], text=True),
              'platform': platform.platform(),
              'commands': [{'command': command, 'status': 'PASS'} for command in commands],
          }
          payload = json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          receipt['receiptSha256'] = hashlib.sha256(payload).hexdigest()
          path = pathlib.Path('qualification/cognitive-types-v1/receipts') / f"{receipt['implementationCommit']}.json"
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          PY
          git add qualification/cognitive-types-v1/receipts
          git commit -m 'chore(cognitive.types): record exact qualification receipt'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Publish command record
        if: always()
        shell: bash
        run: |
          {
            echo '## cognitive.types production hardening'
            echo
            echo "- source branch: ${{ github.event.pull_request.head.ref }}"
            echo "- implementation commit: ${{ steps.implementation.outputs.sha }}"
            echo "- implementation tree: ${{ steps.implementation.outputs.tree }}"
            echo "- synthetic base: ${{ steps.synthetic.outputs.main_sha }}"
            echo "- synthetic tree: ${{ steps.synthetic.outputs.tree }}"
          } >> "$GITHUB_STEP_SUMMARY"
