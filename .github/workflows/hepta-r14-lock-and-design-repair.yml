name: Hepta r14 lock and detailed-design repair

on:
  push:
    branches:
      - integration/hepta-all-gap-closure-20260910-r14
    paths:
      - .github/workflows/hepta-r14-lock-and-design-repair.yml

permissions:
  contents: write

concurrency:
  group: hepta-r14-lock-and-design-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact r14 repair controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: integration/hepta-all-gap-closure-20260910-r14
          fetch-depth: 0

      - name: Configure repository identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hepta r14 closure controller'
          git config user.email 'hepta-r14-closure@users.noreply.github.com'

      - name: Normalize objective.compiler detailed-design contract and index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          detail_path = Path(
              'qualification/module-execution-dossiers/detail/objective.compiler.md'
          )
          index_path = Path(
              'qualification/module-execution-dossiers/DETAILS.json'
          )
          text = detail_path.read_text(encoding='utf-8')
          replacements = {
              '## 2. Native operations and exact contract':
                  '## 2. Public operations and contract details',
              '## 3. State, identity and publication':
                  '## 3. State records and transaction design',
              '## 4. Deterministic algorithm and complexity':
                  '## 4. Deterministic algorithm and scheduling',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one heading {old!r}, observed {count}'
                  )
              text = text.replace(old, new)
          detail_path.write_text(text, encoding='utf-8')
          data = detail_path.read_bytes()
          digest = hashlib.sha256(data).hexdigest()

          index = json.loads(index_path.read_text(encoding='utf-8'))
          rows = [
              row for row in index.get('modules', [])
              if row.get('module') == 'objective.compiler'
          ]
          if len(rows) != 1:
              raise SystemExit(
                  f'expected one objective.compiler index row, observed {len(rows)}'
              )
          row = rows[0]
          if row.get('detailedDesignPath') != 'detail/objective.compiler.md':
              raise SystemExit('objective.compiler detailedDesignPath drifted')
          row['detailByteCount'] = len(data)
          row['detailedDesignSha256'] = digest
          index_path.write_text(
              json.dumps(
                  index,
                  ensure_ascii=True,
                  separators=(',', ':'),
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'detailByteCount': len(data),
              'detailedDesignSha256': digest,
          }, sort_keys=True))
          PY

      - name: Regenerate the workspace lockfile from the exact manifests
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata \
            --manifest-path codex-rs/Cargo.toml \
            --no-deps \
            --format-version 1 \
            >/dev/null
          cargo metadata \
            --manifest-path codex-rs/Cargo.toml \
            --no-deps \
            --format-version 1 \
            --locked \
            >/dev/null
          if git diff --quiet -- codex-rs/Cargo.lock; then
            echo 'expected stale codex-rs/Cargo.lock to change' >&2
            exit 1
          fi

      - name: Verify core fixed-point and detailed-design gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify

      - name: Commit only the reviewed repair surfaces
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            codex-rs/Cargo.lock \
            qualification/module-execution-dossiers/DETAILS.json \
            qualification/module-execution-dossiers/detail/objective.compiler.md \
            | sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo 'unexpected repair surface' >&2
            printf 'expected:\n%s\nobserved:\n%s\n' "$expected" "$changed" >&2
            exit 1
          fi
          rm .github/workflows/hepta-r14-lock-and-design-repair.yml
          git add -A
          git diff --cached --check
          git commit --signoff -m 'fix(convergence): refresh lock and canonical detailed design'
          git push origin HEAD:refs/heads/integration/hepta-all-gap-closure-20260910-r14
