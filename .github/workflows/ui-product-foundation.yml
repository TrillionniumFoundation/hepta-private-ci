name: Rust UI product foundation
on:
  pull_request:
    paths:
      - apps/hepta-control-ui/**
      # Conservative gateway Cargo closure; drift-checked against the shared graph.
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-native-gateway/**
      - codex-rs/hepta-ndu/**
      - codex-rs/hepta-paths/**
      - codex-rs/hepta-plasticity/**
      - codex-rs/hepta-runtime/**
      - codex-rs/hepta-types/**
      - codex-rs/hepta-wire/**
      - codex-rs/utils/absolute-path/**
      - codex-rs/utils/path-utils/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - codex-rs/.cargo/**
      - codex-rs/.config/nextest.toml
      - justfile
      - scripts/run-nextest.py
      - scripts/just-shell.py
      - scripts/hepta_ci_dependencies.py
      - scripts/hepta_ci_exec.py
      - scripts/hepta_ci_junit.py
      - scripts/hepta_ci_git_objects.py
      - scripts/hepta_ci_module_paths.py
      - scripts/test_hepta_ci_module_path_scopes.py
      - apps/hepta-native/resources/NATIVE-ASSETS.json
      - apps/hepta-native/resources/notices/Noto-Sans-CJK-2.004-OFL.txt
      - apps/hepta-native/resources/**
      - .github/workflows/ui-product-foundation.yml
      - .github/actions/hepta-synthetic-merge/**
      - scripts/test_ui_product_foundation_ci.py
permissions:
  contents: read
concurrency:
  group: rust-ui-product-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  robrix-host:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    name: Rust UI foundation / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Construct separately identified product merge
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Rust UI product CI
          author-email: rust-ui-product-ci@invalid
          message: Synthetic Rust UI product merge
      - name: Bind exact source and preserve backend toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PR_SOURCE_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          BACKEND_TOOLCHAIN="$(python3 apps/hepta-control-ui/tools/build-product-preview.py --print-toolchain)"
          echo "BACKEND_TOOLCHAIN=$BACKEND_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Verify immutable merge checkout regression
        run: |
          python3 -m unittest discover -s scripts -p test_ui_product_foundation_ci.py -v
          python3 -m unittest discover -s scripts -p test_hepta_ci_module_path_scopes.py -v
          python3 -m unittest discover -s apps/hepta-control-ui/test -p test_build_product_preview.py -v
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Install and verify official build inputs
        env:
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup toolchain install nightly-2026-10-02 --profile minimal --component rust-src
          test "$(rustup run nightly-2026-10-02 rustc --version)" = "rustc 1.101.0-nightly (c36f14571 2026-10-01)"
          test "$(rustc --version)" = "rustc 1.95.0 (59807616e 2026-04-14)"
      # Cache only pinned official tool installations. Nextest has archive and binary
      # digests; source-built tools retain --locked. No product binaries or receipts.
      - id: official-tools-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ runner.temp }}/ui-official-tools-robrix
          key: ui-official-tools-v3-runner-temp-ubuntu24.04-${{ runner.os }}-${{ runner.arch }}-rustc59807616e-just1.58.0-nextest0.9.146-prebuilt-aac21fea
      - name: Install missing pinned official tools
        if: steps.official-tools-cache.outputs.cache-hit != 'true'
        env:
          TOOL_ROOT: ${{ runner.temp }}/ui-official-tools-robrix
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          cargo install just --locked --version 1.58.0 --root "$TOOL_ROOT"
          python3 apps/hepta-control-ui/tools/install-official-nextest.py "$TOOL_ROOT"
      - name: Verify installed tool versions on every cache hit or miss
        env:
          TOOL_ROOT: ${{ runner.temp }}/ui-official-tools-robrix
        run: |
          set -euo pipefail
          test -x "$TOOL_ROOT/bin/just"
          test -x "$TOOL_ROOT/bin/cargo-nextest"
          export PATH="$TOOL_ROOT/bin:$PATH"
          test "$(command -v just)" = "$TOOL_ROOT/bin/just"
          test "$(command -v cargo-nextest)" = "$TOOL_ROOT/bin/cargo-nextest"
          test "$(just --version)" = "just 1.58.0"
          python3 apps/hepta-control-ui/tools/install-official-nextest.py --verify "$TOOL_ROOT"
          cargo nextest --version | grep -E '^cargo-nextest 0\.9\.146([[:space:]]|$)'
          echo "$TOOL_ROOT/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        if: steps.official-tools-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ui-official-tools-robrix
          key: ui-official-tools-v3-runner-temp-ubuntu24.04-${{ runner.os }}-${{ runner.arch }}-rustc59807616e-just1.58.0-nextest0.9.146-prebuilt-aac21fea
      - name: Verify shared Rust presentation and renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s apps/hepta-control-ui/test -p test_prepare_fonts.py -v
          cargo fmt --manifest-path apps/hepta-control-ui/rust/Cargo.toml --all -- --check
          just test --manifest-path ../apps/hepta-control-ui/rust/Cargo.toml -p hepta-control-core -p hepta-robrix-ui --no-default-features
          cargo clippy --manifest-path apps/hepta-control-ui/rust/Cargo.toml -p hepta-robrix-ui --target wasm32-unknown-unknown -- -D warnings
          node --test apps/hepta-control-ui/test/artifact-lifetime.test.mjs apps/hepta-control-ui/test/workspace-patch-relocation.test.mjs
          python3 -m unittest discover -s apps/hepta-control-ui/test -p test_font_diagnostic_browser.py -v
          node --test apps/hepta-control-ui/test/font-delivery-diagnostic.test.mjs
          node --test apps/hepta-control-ui/test/font-diagnostic-browser-identity.test.mjs
          node --test apps/hepta-control-ui/test/product-status-pixels.test.mjs apps/hepta-control-ui/test/product-console-audit.test.mjs
          node --test apps/hepta-control-ui/test/static-makepad-bridge.test.mjs apps/hepta-control-ui/test/makepad-dsl.test.mjs apps/hepta-control-ui/test/visual-theme-contract.test.mjs apps/hepta-control-ui/test/robrix-font-readiness.test.mjs
      - id: sdk_composition_tests
        name: Execute the explicitly enabled SDK composition regressions
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEPTA_CI_LANE: ${{ matrix.lane }}
          SDK_EVIDENCE_DIR: ${{ runner.temp }}/ui-sdk-composition-${{ matrix.lane }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/ui-sdk-target-${{ matrix.lane }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$SDK_EVIDENCE_DIR"
          export TESTED_SHA="$(git rev-parse HEAD)"
          # These are the pkg-config probes and Linux link libraries of the
          # pinned ui-only SDK, without the unrelated native-host dependencies.
          sudo apt-get update 2>&1 | tee "$SDK_EVIDENCE_DIR/system-preparation.log"
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libasound2-dev libpulse-dev libglx-dev libssl-dev 2>&1 | tee -a "$SDK_EVIDENCE_DIR/system-preparation.log"
          dpkg-query -W pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libasound2-dev libpulse-dev libglx-dev libssl-dev > "$SDK_EVIDENCE_DIR/system-inputs.log"
          # The ui-only build requires the hash-pinned desktop fonts. Keep those
          # generated inputs in a separate exact-source worktree, with the full
          # repository layout required by the existing Cargo path patches.
          git worktree add --detach "$SDK_EVIDENCE_DIR/source" "$TESTED_SHA"
          test -z "$(git -C "$SDK_EVIDENCE_DIR/source" status --porcelain --untracked-files=all)"
          python3 apps/hepta-control-ui/tools/prepare-fonts.py --cache "$SDK_EVIDENCE_DIR/font-cache" --install "$SDK_EVIDENCE_DIR/source/apps/hepta-control-ui/rust/robrix-ui/resources/fonts" > "$SDK_EVIDENCE_DIR/fonts.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          directory = Path(os.environ["SDK_EVIDENCE_DIR"])
          source = directory / "source"
          def git(*args):
              return subprocess.check_output(["git", "-C", str(source), *args], text=True).strip()
          if git("rev-parse", "HEAD") != os.environ["TESTED_SHA"]:
              raise SystemExit("staged checkout differs from the tested source")
          subprocess.run(["git", "-C", str(source), "diff", "--exit-code", "HEAD", "--"], check=True)
          fonts = json.loads((directory / "fonts.json").read_text())
          expected = sorted("apps/hepta-control-ui/rust/robrix-ui/resources/fonts/" + asset["file"] for asset in fonts["assets"])
          untracked = sorted(git("ls-files", "--others", "--exclude-standard").splitlines())
          if untracked != expected:
              raise SystemExit("unexpected source staging inputs")
          before = {"commit": git("rev-parse", "HEAD"), "tree": git("rev-parse", "HEAD^{tree}"), "untracked_resource_files": untracked, "font_manifest_sha256": fonts["manifestSha256"]}
          with (directory / "staged-source-before.json").open("x") as stream:
              json.dump(before, stream, indent=2)
              stream.write("\n")
          with (directory / "nextest.toml").open("x") as stream:
              stream.write("[store]\ndir = " + json.dumps(str(directory / "nextest-store")) + "\n[profile.local.junit]\npath = \"junit.xml\"\nreport-name = \"hepta-ui-sdk-composition\"\n")
          PY
          python3 scripts/hepta_ci_exec.py --output "$SDK_EVIDENCE_DIR/execution.json" --minimum-tests 7 --timeout-seconds 1200 -- just test --locked --manifest-path "$SDK_EVIDENCE_DIR/source/apps/hepta-control-ui/rust/Cargo.toml" -p hepta-robrix-ui --no-default-features --features ui --lib -E 'test(composer_transaction::tests::)' --tool-config-file "hepta-ui-sdk:$SDK_EVIDENCE_DIR/nextest.toml" --profile local --retries 0 --no-tests fail
      - name: Require all seven SDK cases in the fresh native report
        if: always() && steps.sdk_composition_tests.outcome != 'skipped'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEPTA_CI_LANE: ${{ matrix.lane }}
          SDK_EVIDENCE_DIR: ${{ runner.temp }}/ui-sdk-composition-${{ matrix.lane }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timedelta
          import hashlib, json, math, os, runpy, stat, subprocess, sys, uuid
          from pathlib import Path
          import xml.etree.ElementTree as ET
          sys.path.insert(0, "scripts")
          from hepta_ci_junit import NoDoctypeTreeBuilder
          directory = Path(os.environ["SDK_EVIDENCE_DIR"])
          source = directory / "source"
          required = {"robrix::composer_transaction::tests::" + name for name in (
              "rejected_selection_replacement_restores_the_exact_sdk_editor_state",
              "stale_room_cannot_restore_another_rooms_selection_or_undo",
              "actual_sdk_preedit_preserves_committed_draft_title_and_checkpoint_until_commit",
              "actual_sdk_cancel_preserves_committed_draft_after_ignored_previews",
              "actual_sdk_full_state_same_text_commit_reaches_owner_without_changed_action",
              "actual_sdk_full_state_cancel_does_not_commit_the_ignored_preview",
              "actual_sdk_full_state_commit_retains_the_original_room_guard",
          )}
          result = {"status": "rejected", "scope": "Seven native SDK regressions with exact source and resource inputs; not browser or research qualification"}
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def git(*args):
              return subprocess.check_output(["git", "-C", str(source), *args], text=True).strip()
          def date(value):
              stamp = datetime.fromisoformat(value)
              require(stamp.tzinfo is not None, "timestamp has no timezone")
              return stamp
          try:
              raw_execution = (directory / "execution.json").read_bytes()
              receipt = json.loads(raw_execution)
              before = json.loads((directory / "staged-source-before.json").read_text())
              subprocess.run(["git", "-C", str(source), "diff", "--exit-code", "HEAD", "--"], check=True)
              fonts = runpy.run_path("apps/hepta-control-ui/tools/prepare-fonts.py")
              manifest, font_identity = fonts["manifest"]()
              expected_resources = sorted("apps/hepta-control-ui/rust/robrix-ui/resources/fonts/" + asset["file"] for asset in manifest["assets"])
              after = {"commit": git("rev-parse", "HEAD"), "tree": git("rev-parse", "HEAD^{tree}"), "untracked_resource_files": sorted(git("ls-files", "--others", "--exclude-standard").splitlines()), "font_manifest_sha256": font_identity}
              result["staged_source_after"] = after
              require(after == before and after["untracked_resource_files"] == expected_resources, "staged source or resource inventory changed")
              for asset in manifest["assets"]:
                  resource = source / "apps/hepta-control-ui/rust/robrix-ui/resources/fonts" / asset["file"]
                  require(not resource.is_symlink(), "font input became a symlink")
                  fonts["check"](resource.read_bytes(), asset, asset["file"])
              require(receipt["before"] == receipt["after"] and receipt["before"]["dirty"] is False, "original source changed")
              require(after["commit"] == receipt["tested_sha"] == receipt["before"]["commit"] and after["tree"] == receipt["before"]["tree"], "staging differs from the recorded source")
              for field, variable in (("source_sha", "SOURCE_SHA"), ("base_sha", "BASE_SHA"), ("lane", "HEPTA_CI_LANE")):
                  require(receipt[field] == os.environ[variable], "execution lane identity differs")
              expected_command = ["just", "test", "--locked", "--manifest-path", str(source / "apps/hepta-control-ui/rust/Cargo.toml"), "-p", "hepta-robrix-ui", "--no-default-features", "--features", "ui", "--lib", "-E", "test(composer_transaction::tests::)", "--tool-config-file", "hepta-ui-sdk:" + str(directory / "nextest.toml"), "--profile", "local", "--retries", "0", "--no-tests", "fail"]
              require(receipt["command"] == expected_command, "SDK command or feature scope differs")
              require(receipt["status"] == "passed" and all(receipt[field] == 0 for field in ("exit_code", "command_exit_code", "returncode", "observed_failed_tests")), "native execution did not pass")
              require(receipt["timed_out"] is False and receipt["output_limit_exceeded"] is False and receipt["observed_passed_tests"] == 7, "exact seven passing cases were not observed")
              log_name = receipt["log_file"]
              require(Path(log_name).name == log_name, "execution log is not a sibling file")
              log = (directory / log_name).read_bytes()
              require(len(log) == receipt["log_bytes"] and hashlib.sha256(log).hexdigest() == receipt["log_sha256"], "original execution log changed")
              started, finished = date(receipt["started_at"]), date(receipt["finished_at"])
              require(started <= finished, "invalid execution interval")
              junit = directory / "nextest-store/local/junit.xml"
              require(not junit.is_symlink(), "JUnit must be a fresh regular file")
              with junit.open("rb") as stream:
                  state_before = os.fstat(stream.fileno())
                  raw = stream.read(8 * 1024 * 1024 + 1)
                  state_after = os.fstat(stream.fileno())
              require(len(raw) <= 8 * 1024 * 1024 and stat.S_ISREG(state_before.st_mode), "JUnit exceeded its bound")
              require(all(getattr(state_before, field) == getattr(state_after, field) for field in ("st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns")), "JUnit changed while reading")
              require(started.timestamp() <= state_after.st_mtime <= finished.timestamp(), "JUnit is outside this execution interval")
              root = ET.fromstring(raw, parser=ET.XMLParser(target=NoDoctypeTreeBuilder()))
              require(root.tag == "testsuites" and root.get("name") == "hepta-ui-sdk-composition", "unexpected SDK report")
              run_uuid = str(uuid.UUID(root.attrib["uuid"]))
              stamp = date(root.attrib["timestamp"])
              require(started - timedelta(milliseconds=1) <= stamp <= finished, "stale JUnit timestamp")
              suites = root.findall("testsuite")
              require(len(suites) == 1 and suites[0].get("name") == "hepta-robrix-ui", "foreign library suite")
              cases = suites[0].findall("testcase")
              require(len(root.findall(".//testcase")) == len(cases), "nested or foreign test cases")
              for aggregate in (root, suites[0]):
                  require(aggregate.get("tests") == str(len(cases)) and aggregate.get("failures") == aggregate.get("errors") == "0", "unsuccessful or inconsistent aggregate")
              names, passed = set(), set()
              for case in cases:
                  name = case.get("name")
                  require(name and name not in names and case.get("classname") == "hepta-robrix-ui", "duplicate or foreign test case")
                  names.add(name)
                  require(all(child.tag in {"skipped", "system-out", "system-err", "properties"} for child in case), "failed or retried test case")
                  if case.find("skipped") is not None:
                      require(name not in required, "required SDK case was skipped")
                      continue
                  require(name in required, "unexpected unfiltered passing case")
                  elapsed = float(case.attrib["time"])
                  require(math.isfinite(elapsed) and elapsed >= 0 and stamp <= date(case.attrib["timestamp"]) <= finished, "invalid native case timing")
                  passed.add(name)
              require(passed == required, "required SDK cases are missing or did not execute")
              result.update(status="passed", source_sha=receipt["source_sha"], tested_sha=receipt["tested_sha"], lane=receipt["lane"], source_tree=after["tree"], execution_sha256=hashlib.sha256(raw_execution).hexdigest(), junit_sha256=hashlib.sha256(raw).hexdigest(), junit_bytes=len(raw), run_uuid=run_uuid, passed_tests=7, required_passed_tests=sorted(passed))
          except (OSError, ValueError, KeyError, TypeError, ET.ParseError, subprocess.CalledProcessError) as error:
              result["error"] = str(error)
          with (directory / "junit-gate.json").open("x") as stream:
              json.dump(result, stream, indent=2, sort_keys=True)
              stream.write("\n")
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(0 if result["status"] == "passed" else 1)
          PY
      - name: Preserve exact SDK regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-sdk-composition-${{ matrix.lane }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/ui-sdk-composition-${{ matrix.lane }}/*.json
            ${{ runner.temp }}/ui-sdk-composition-${{ matrix.lane }}/*.log
            ${{ runner.temp }}/ui-sdk-composition-${{ matrix.lane }}/nextest.toml
            ${{ runner.temp }}/ui-sdk-composition-${{ matrix.lane }}/nextest-store/local/junit.xml
          if-no-files-found: warn
      - id: default_build
        name: Build canonical strict-CSP no-threads artifact
        run: |
          npm ci --prefix apps/hepta-control-ui --ignore-scripts --no-audit --no-fund
          npm run build --prefix apps/hepta-control-ui
          node --test apps/hepta-control-ui/test/packaged-resource-set.test.mjs
          node --test apps/hepta-control-ui/test/makepad-font-patch.test.mjs apps/hepta-control-ui/test/makepad-instance-layout.test.mjs apps/hepta-control-ui/test/makepad-ime-bridge.test.mjs apps/hepta-control-ui/test/makepad-network-memory.test.mjs apps/hepta-control-ui/test/makepad-widget-borrow.test.mjs apps/hepta-control-ui/test/makepad-ime-router.test.mjs apps/hepta-control-ui/test/makepad-cjk-font.test.mjs
          python3 apps/hepta-control-ui/test/check-makepad-ime-dto.py
          cd apps/hepta-control-ui
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim python3-pil
          dpkg-query -W tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim python3-pil
          node --test test/screenshot-readability.test.mjs test/robrix-pixel-plan.test.mjs
      - id: default_browser
        name: Run actual browser renderer and capture layouts
        working-directory: apps/hepta-control-ui
        run: xvfb-run -a npm run test:robrix
      - name: Require every default screenshot pixel check
        if: always() && steps.default_build.outcome == 'success'
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: node apps/hepta-control-ui/tools/verify-robrix-evidence.mjs apps/hepta-control-ui/test-results/robrix-default default
      - id: product_gateway_build
        name: Build source-bound actual gateway preview
        run: |
          rustup toolchain install "$BACKEND_TOOLCHAIN" --profile minimal
          python3 apps/hepta-control-ui/tools/build-product-preview.py --target-dir "$RUNNER_TEMP/product-gateway-target"
      - id: product_gateway_transport_tests
        name: Execute bounded gateway transport and boundary regressions
        env:
          RUSTUP_TOOLCHAIN: ${{ env.BACKEND_TOOLCHAIN }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/product-gateway-target
          CARGO_PROFILE_TEST_DEBUG: 0
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEPTA_CI_LANE: ${{ matrix.lane }}
        run: |
          TESTED_SHA="$(git rev-parse HEAD)" python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/gateway-transport-${{ matrix.lane }}.json" --minimum-tests 9 --timeout-seconds 600 -- just test --locked -p codex-hepta-native-gateway --lib -E 'test(http_transport::tests::)'
          TESTED_SHA="$(git rev-parse HEAD)" python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/gateway-boundary-owner-status-${{ matrix.lane }}.json" --minimum-tests 5 --timeout-seconds 600 -- just test --locked -p codex-hepta-native-gateway --lib -E 'test(owner_status::tests::)'
          TESTED_SHA="$(git rev-parse HEAD)" python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/gateway-boundary-ui-bundle-${{ matrix.lane }}.json" --minimum-tests 11 --timeout-seconds 600 -- just test --locked -p codex-hepta-native-gateway --lib -E 'test(ui_bundle::tests::)'
          TESTED_SHA="$(git rev-parse HEAD)" python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/gateway-boundary-http-origin-${{ matrix.lane }}.json" --minimum-tests 2 --timeout-seconds 600 -- just test --locked -p codex-hepta-native-gateway --lib -E 'test(http_origin::tests::)'
      - id: product_browser_install
        name: Install hash-pinned browser for strict no-store product transport
        timeout-minutes: 3
        run: |
          python3 apps/hepta-control-ui/tools/install-font-diagnostic-browser.py "$RUNNER_TEMP/product-qualified-browser"
          echo "HEPTA_PRODUCT_BROWSER=$RUNNER_TEMP/product-qualified-browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - id: product_gateway_browser
        name: Exercise real gateway unavailable status and cancellation
        working-directory: apps/hepta-control-ui
        env:
          HEPTA_GATEWAY_EXAMPLE: ${{ runner.temp }}/product-gateway-target/debug/examples/ui_product_preview
        run: xvfb-run -a npx playwright test --config=playwright.product.config.mjs
      - name: Preserve actual gateway evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-gateway-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: |
            apps/hepta-control-ui/test-results/product-status/
            apps/hepta-control-ui/test-results/product-status-results.json
            ${{ runner.temp }}/product-gateway-target/debug/examples/ui_product_preview.hepta-build.json
            ${{ runner.temp }}/gateway-transport-${{ matrix.lane }}.json*
            ${{ runner.temp }}/gateway-boundary-*-${{ matrix.lane }}.json*
          if-no-files-found: warn
      - id: fixture_build
        if: always() && steps.default_build.outcome == 'success'
        name: Build explicitly labeled owner-fixture through the same renderer
        run: node apps/hepta-control-ui/tools/build-robrix.mjs --fixtures
      - if: always() && steps.fixture_build.outcome == 'success'
        name: Capture populated fixture and responsive transitions
        working-directory: apps/hepta-control-ui
        env:
          HEPTA_ROBRIX_FIXTURES: "1"
        run: xvfb-run -a npm run test:robrix
      - name: Require every populated screenshot pixel check
        if: always() && steps.fixture_build.outcome == 'success'
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: node apps/hepta-control-ui/tools/verify-robrix-evidence.mjs apps/hepta-control-ui/test-results/robrix-fixtures fixtures
      - name: Diagnose WebKit drawing buffer without changing product defaults
        if: always() && steps.fixture_build.outcome == 'success'
        working-directory: apps/hepta-control-ui
        env:
          HEPTA_ROBRIX_DIAGNOSTICS: "1"
          HEPTA_ROBRIX_FIXTURES: "1"
        run: xvfb-run -a npm run test:robrix -- --project=webkit --output=test-results/robrix-buffer-diagnostic
      - if: always() && steps.default_build.outcome == 'success'
        name: Confirm exact source after build and browser checks
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD
      - name: Inventory every source-bound browser evidence file
        if: always()
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          python3 -m unittest discover -s apps/hepta-control-ui/test -p 'test_group_robrix_evidence.py' -v
          python3 apps/hepta-control-ui/tools/group-robrix-evidence.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-default-chromium-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/default-chromium/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-default-firefox-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/default-firefox/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-default-webkit-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/default-webkit/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-fixtures-chromium-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/fixtures-chromium/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-fixtures-firefox-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/fixtures-firefox/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-fixtures-webkit-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/fixtures-webkit/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-sidebar-chromium-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/sidebar-chromium/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-sidebar-firefox-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/sidebar-firefox/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-sidebar-webkit-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/sidebar-webkit/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-diagnostic-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/diagnostic/
          include-hidden-files: true
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-robrix-${{ matrix.lane }}-summary-${{ env.SOURCE_SHA }}
          path: apps/hepta-control-ui/test-results/evidence-groups/summary/
          include-hidden-files: true
          if-no-files-found: warn
      # All ordinary acceptance checks and evidence uploads precede optional work.
      # Opt-in evidence only: no required acceptance step is waived or replaced.
      - id: font_diagnostic_browser
        name: Install hash-pinned diagnostic browser (not acceptance)
        if: always() && steps.product_gateway_build.outcome == 'success' && contains(github.event.pull_request.labels.*.name, 'ui-font-diagnostic')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 apps/hepta-control-ui/tools/install-font-diagnostic-browser.py "$RUNNER_TEMP/font-diagnostic-browser"
          echo "HEPTA_FONT_DIAGNOSTIC_BROWSER=$RUNNER_TEMP/font-diagnostic-browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Compare unchanged product assertions and SDK transport (not acceptance)
        if: always() && steps.font_diagnostic_browser.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        working-directory: apps/hepta-control-ui
        env:
          HEPTA_GATEWAY_EXAMPLE: ${{ runner.temp }}/product-gateway-target/debug/examples/ui_product_preview
        run: xvfb-run -a npx playwright test --config=playwright.font-diagnostic.config.mjs
      - name: Compare Rust fixture font use and pixels (not acceptance)
        if: always() && steps.fixture_build.outcome == 'success' && steps.font_diagnostic_browser.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        working-directory: apps/hepta-control-ui
        env:
          HEPTA_ROBRIX_FIXTURES: "1"
          HEPTA_FONT_DIAGNOSTIC_SUITE: fixture
        run: xvfb-run -a npx playwright test --config=playwright.font-diagnostic.config.mjs
      - name: Require every diagnostic fixture semantic pixel check (not acceptance)
        if: always() && steps.fixture_build.outcome == 'success' && steps.font_diagnostic_browser.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: node apps/hepta-control-ui/tools/verify-font-diagnostic-evidence.mjs apps/hepta-control-ui/test-results/font-diagnostic-fixture
      - name: Preserve failed and successful font diagnostic arms without changing acceptance
        if: always() && contains(github.event.pull_request.labels.*.name, 'ui-font-diagnostic')
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: font-diagnostic-only-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: |
            apps/hepta-control-ui/test-results/font-diagnostic-*/
            apps/hepta-control-ui/test-results/font-diagnostic-*-results.json
          if-no-files-found: warn

  native-presentation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    name: Original native presentation / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Construct separately identified native presentation merge
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Native presentation CI
          author-email: native-presentation-ci@invalid
          message: Synthetic native presentation merge
      - name: Bind source before installing native inputs
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/native-presentation-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-presentation-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-presentation-evidence/tested-head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/native-presentation-evidence/tested-tree.txt"
          sha256sum apps/hepta-control-ui/rust/Cargo.lock > "$RUNNER_TEMP/native-presentation-evidence/original-lock.sha256"
      - name: Install the official compiler and pinned test tools
        env:
          TOOL_ROOT: ${{ runner.temp }}/native-presentation-tools
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          test "$(rustc --version)" = "rustc 1.95.0 (59807616e 2026-04-14)"
          cargo install just --locked --version 1.58.0 --root "$TOOL_ROOT"
          python3 apps/hepta-control-ui/tools/install-official-nextest.py "$TOOL_ROOT"
          export PATH="$TOOL_ROOT/bin:$PATH"
          test "$(just --version)" = "just 1.58.0"
          python3 apps/hepta-control-ui/tools/install-official-nextest.py --verify "$TOOL_ROOT"
          echo "$TOOL_ROOT/bin" >> "$GITHUB_PATH"
          rustc -Vv > "$RUNNER_TEMP/native-presentation-evidence/rustc.txt"
          cargo -Vv > "$RUNNER_TEMP/native-presentation-evidence/cargo.txt"
      - name: Install Linux native compile dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpulse-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev
          dpkg-query -W pkg-config libasound2-dev libpulse-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev > "$RUNNER_TEMP/native-presentation-evidence/system-inputs.txt"
      - name: Execute the explicitly enabled composition and lifecycle tests
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)" python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/native-presentation-evidence/junit-gate-tests.json" --minimum-tests 12 --timeout-seconds 60 -- python3 apps/hepta-control-ui/test/test_native_composition_junit.py
          cargo fmt --manifest-path apps/hepta-control-ui/rust/Cargo.toml --all -- --check
          python3 apps/hepta-control-ui/tools/check-native-composition-junit.py prepare --start "$RUNNER_TEMP/native-presentation-evidence/headless-junit-start.json" --junit "$GITHUB_WORKSPACE/apps/hepta-control-ui/rust/target/nextest/native-composition-headless/junit.xml" --mode headless --tested-sha "$(git rev-parse HEAD)"
          TESTED_SHA="$(git rev-parse HEAD)" python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/native-presentation-evidence/headless.json" --minimum-tests 5 --timeout-seconds 600 -- just test --locked --manifest-path ../apps/hepta-control-ui/rust/Cargo.toml -p hepta-robrix-ui --no-default-features --features native-presentation --lib --profile native-composition-headless
          python3 apps/hepta-control-ui/tools/check-native-composition-junit.py verify --start "$RUNNER_TEMP/native-presentation-evidence/headless-junit-start.json" --execution "$RUNNER_TEMP/native-presentation-evidence/headless.json" --output "$RUNNER_TEMP/native-presentation-evidence/headless-junit.json"
          python3 apps/hepta-control-ui/tools/check-native-composition-junit.py prepare --start "$RUNNER_TEMP/native-presentation-evidence/native-junit-start.json" --junit "$GITHUB_WORKSPACE/apps/hepta-control-ui/rust/target/nextest/native-composition-native/junit.xml" --mode native --tested-sha "$(git rev-parse HEAD)"
          TESTED_SHA="$(git rev-parse HEAD)" python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/native-presentation-evidence/native.json" --minimum-tests 8 --timeout-seconds 1200 -- just test --locked --manifest-path ../apps/hepta-control-ui/rust/Cargo.toml -p hepta-robrix-ui --features ui,native-host,native-presentation --lib --profile native-composition-native
          python3 apps/hepta-control-ui/tools/check-native-composition-junit.py verify --start "$RUNNER_TEMP/native-presentation-evidence/native-junit-start.json" --execution "$RUNNER_TEMP/native-presentation-evidence/native.json" --output "$RUNNER_TEMP/native-presentation-evidence/native-junit.json"
          cargo clippy --locked --manifest-path apps/hepta-control-ui/rust/Cargo.toml -p hepta-robrix-ui --all-targets --features ui,native-host,native-presentation -- -D warnings 2>&1 | tee "$RUNNER_TEMP/native-presentation-evidence/clippy.log"
          sha256sum -c "$RUNNER_TEMP/native-presentation-evidence/original-lock.sha256"
          git diff --exit-code HEAD --
      - name: Preserve native compilation and test evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-presentation-${{ matrix.lane }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/native-presentation-evidence/
            apps/hepta-control-ui/rust/target/nextest/native-composition-*/junit.xml
          if-no-files-found: error

  ui-bazel-lock-generation:
    name: Generate UI dependency lock for review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind the source before dependency generation
        shell: bash
        env:
          LOCKGEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKGEN_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$RUNNER_TEMP/ui-bazel-lock-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-bazel-lock-evidence/source-head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ui-bazel-lock-evidence/source-tree.txt"
          sha256sum .bazelversion MODULE.bazel MODULE.bazel.lock codex-rs/Cargo.toml codex-rs/Cargo.lock justfile \
            > "$RUNNER_TEMP/ui-bazel-lock-evidence/inputs.sha256"

      - name: Prepare the original Bazel CI environment
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: ui-bazel-lock-generation

      - name: Generate the lock using the repository entry point
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          bazel --version | tee "$RUNNER_TEMP/ui-bazel-lock-evidence/bazel-version.txt"
          just --version | tee "$RUNNER_TEMP/ui-bazel-lock-evidence/just-version.txt"
          set +e
          just bazel-lock-update 2>&1 | tee "$RUNNER_TEMP/ui-bazel-lock-evidence/generation.log"
          lockgen_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$lockgen_status" > "$RUNNER_TEMP/ui-bazel-lock-evidence/generation-exit-code.txt"
          git diff --binary HEAD -- MODULE.bazel.lock > "$RUNNER_TEMP/ui-bazel-lock-evidence/MODULE.bazel.lock.diff"
          git diff --binary HEAD -- > "$RUNNER_TEMP/ui-bazel-lock-evidence/all-tracked.diff"
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/ui-bazel-lock-evidence/tracked-status.txt"
          sha256sum MODULE.bazel.lock > "$RUNNER_TEMP/ui-bazel-lock-evidence/generated-lock.sha256"
          cp MODULE.bazel.lock "$RUNNER_TEMP/ui-bazel-lock-evidence/MODULE.bazel.lock"
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-bazel-lock-evidence'
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == (evidence / 'source-head.txt').read_text().strip()
          changed = git('diff', '--name-only', 'HEAD', '--').splitlines()
          assert set(changed) <= {'MODULE.bazel.lock'}, f'unexpected generated changes: {changed}'
          PY
          exit "$lockgen_status"

      - name: Validate the generated lock with the original drift check
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-module-bazel-lock.sh 2>&1 | tee "$RUNNER_TEMP/ui-bazel-lock-evidence/lock-check.log"

      - name: Upload the unchanged generation evidence for review
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ui-bazel-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-bazel-lock-evidence
          if-no-files-found: error
