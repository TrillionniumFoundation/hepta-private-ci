name: Lane B repository import-format repair

on:
  push:
    branches:
      - ops/lane-b-import-format-20260910-r3

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ops/lane-b-import-format-20260910-r3
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Apply canonical repository rustfmt profile
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -- --config imports_granularity=Item
          cargo fmt -- --config imports_granularity=Item --check
          cd ..
          rm .github/workflows/lane-b-import-format-repair.yml
          git diff --check
          git config user.name "Hepta Lane B Repair"
          git config user.email "hepta-lane-b-repair@users.noreply.github.com"
          git add -A
          git commit -m "fix(lane-b): apply canonical import formatting"
          git push origin HEAD:refs/heads/ops/lane-b-import-format-20260910-r3
