name: AuthBus concurrency repair and native regression

on:
  push:
    branches: [codex/authbus-concurrency-closure-20260927]
    paths: [.github/workflows/authbus-concurrency-repair.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/authbus-concurrency-closure-20260927'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Apply exact-source concurrency patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          host_path = Path('codex-rs/hepta-authbus/src/host.rs')
          ops_path = Path('codex-rs/hepta-authbus/src/operations.rs')
          tests_path = Path('codex-rs/hepta-authbus/src/host_tests.rs')
          marker = '// AuthBus concurrency closure: one mutation-to-witness critical section.'
          host = host_path.read_text()
          if marker in host:
              assert 'sync_checkpoint_locked' in host
              assert 'self.mutation.lock().await' in ops_path.read_text()
              raise SystemExit(0)
          expected = {
              host_path: 'a98c4c293e987ec2d71df6332b1f89f0fd9615c8',
              ops_path: 'df6d0adfe7abb7a6eb56bac9a7bfb08b3403c63e',
              tests_path: 'd3c4687d78b69046b71121c14df7640630b27243',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              if actual != blob:
                  raise SystemExit(f'refusing source drift in {path}: {actual} != {blob}')

          def one(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one patch anchor: {old!r}')
              return text.replace(old, new, 1)

          host = one(host, '    _owner_fence: OwnerFence,',
              '    _owner_fence: OwnerFence,\n    ' + marker + '\n    pub(crate) mutation: tokio::sync::Mutex<()>,')
          host = one(host, '            _owner_fence: owner_fence,',
              '            _owner_fence: owner_fence,\n            mutation: tokio::sync::Mutex::new(()),')
          host = one(host,
              '    pub async fn sync_checkpoint(&self) -> Result<(), AuthBusAuthorityError> {\n        let external',
              '    pub async fn sync_checkpoint(&self) -> Result<(), AuthBusAuthorityError> {\n        let _mutation = self.mutation.lock().await;\n        self.sync_checkpoint_locked().await\n    }\n\n    pub(crate) async fn sync_checkpoint_locked(&self) -> Result<(), AuthBusAuthorityError> {\n        let external')
          host = one(host, '        self.sync_checkpoint().await?;\n        result',
              '        self.sync_checkpoint_locked().await?;\n        result')
          mutation_count = host.count('        let result = self')
          if mutation_count != 20:
              raise SystemExit(f'host mutation inventory drift: {mutation_count}, expected 20')
          host = host.replace('        let result = self',
              '        let _mutation = self.mutation.lock().await;\n        self.sync_checkpoint_locked().await?;\n        let result = self')

          # Fault injection is scoped by checkpoint pathname, not by process.
          # Parallel unrelated host tests must never inherit another host's fault.
          host = one(host, '#[cfg(test)]\nuse std::sync::atomic::AtomicU8;\n#[cfg(test)]\nuse std::sync::atomic::Ordering;',
              '#[cfg(test)]\nuse std::collections::HashMap;\n#[cfg(test)]\nuse std::sync::Mutex;\n#[cfg(test)]\nuse std::sync::OnceLock;')
          begin = host.index('#[cfg(test)]\nstatic CHECKPOINT_FAILPOINT:')
          end = host.index('pub struct AuthBusAuthorityHost', begin)
          host = host[:begin] + '''#[cfg(test)]
          static CHECKPOINT_FAILPOINTS: OnceLock<Mutex<HashMap<PathBuf, u8>>> = OnceLock::new();

          #[cfg(test)]
          pub(crate) struct CheckpointFaultGuard {
              path: PathBuf,
          }

          #[cfg(test)]
          impl Drop for CheckpointFaultGuard {
              fn drop(&mut self) {
                  if let Ok(mut points) = CHECKPOINT_FAILPOINTS.get_or_init(|| Mutex::new(HashMap::new())).lock() {
                      points.remove(&self.path);
                  }
              }
          }

          #[cfg(test)]
          pub(crate) fn set_checkpoint_failpoint(path: &Path, stage: u8) -> CheckpointFaultGuard {
              CHECKPOINT_FAILPOINTS.get_or_init(|| Mutex::new(HashMap::new())).lock()
                  .expect("checkpoint failpoint registry").insert(path.to_path_buf(), stage);
              CheckpointFaultGuard { path: path.to_path_buf() }
          }

          fn checkpoint_failpoint(path: &Path, stage: u8) -> Result<(), AuthBusAuthorityError> {
              #[cfg(test)]
              if CHECKPOINT_FAILPOINTS.get_or_init(|| Mutex::new(HashMap::new())).lock()
                  .map_err(|_| AuthBusAuthorityError::Storage("checkpoint failpoint registry poisoned".into()))?
                  .get(path).copied() == Some(stage) {
                  return Err(AuthBusAuthorityError::Storage(format!("injected checkpoint I/O failure at stage {stage}")));
              }
              #[cfg(not(test))]
              let _ = (path, stage);
              Ok(())
          }

          ''' + host[end:]
          for stage in range(1, 5):
              host = one(host, f'checkpoint_failpoint({stage})?;', f'checkpoint_failpoint(path, {stage})?;')
          tests = tests_path.read_text()
          tests = one(tests, '        set_checkpoint_failpoint(stage);',
              '        let fault = set_checkpoint_failpoint(&paths.checkpoint, stage);')
          tests = one(tests, '        set_checkpoint_failpoint(0);', '        drop(fault);')
          tests += '''

          #[tokio::test(flavor = "multi_thread", worker_threads = 4)]
          async fn concurrent_mutations_checkpoint_and_reopen_without_lost_publication() {
              let paths = private_paths();
              let host = std::sync::Arc::new(AuthBusAuthorityHost::bootstrap(
                  &paths.database, paths.checkpoint.clone(), "concurrent-owner",
              ).await.expect("bootstrap"));
              let barrier = std::sync::Arc::new(tokio::sync::Barrier::new(24));
              let mut tasks = tokio::task::JoinSet::new();
              for index in 1_u8..=24 {
                  let host = std::sync::Arc::clone(&host);
                  let barrier = std::sync::Arc::clone(&barrier);
                  tasks.spawn(async move {
                      barrier.wait().await;
                      host.enroll_issuer(IssuerPurpose::Message, IssuerSpec {
                          issuer_id: StableId::new(format!("issuer:concurrent-{index}")).expect("id"),
                          key_epoch: Generation::new(1).expect("epoch"),
                          verifying_key: SigningKey::from_bytes(&[index; 32]).verifying_key(),
                      }).await.expect("serialized issuer mutation");
                      host.sync_checkpoint().await.expect("concurrent explicit publication");
                  });
              }
              while let Some(result) = tasks.join_next().await {
                  result.expect("concurrent task");
              }
              drop(host);
              let reopened = AuthBusAuthorityHost::open(
                  &paths.database, paths.checkpoint.clone(), "concurrent-owner",
              ).await.expect("reopen exact published state");
              for index in 1_u8..=24 {
                  reopened.message_issuer(
                      &StableId::new(format!("issuer:concurrent-{index}")).expect("id"),
                      Generation::new(1).expect("epoch"),
                  ).await.expect("every acknowledged mutation survived");
              }
          }

          #[tokio::test]
          async fn checkpoint_faults_do_not_cross_host_boundaries() {
              let first_paths = private_paths();
              let second_paths = private_paths();
              let first = AuthBusAuthorityHost::bootstrap(
                  &first_paths.database, first_paths.checkpoint.clone(), "first",
              ).await.expect("first host");
              let second = AuthBusAuthorityHost::bootstrap(
                  &second_paths.database, second_paths.checkpoint.clone(), "second",
              ).await.expect("second host");
              let fault = set_checkpoint_failpoint(&first_paths.checkpoint, 1);
              let make_spec = || IssuerSpec {
                  issuer_id: StableId::new("issuer:isolated-fault").expect("id"),
                  key_epoch: Generation::new(1).expect("epoch"),
                  verifying_key: SigningKey::from_bytes(&[42; 32]).verifying_key(),
              };
              second.enroll_issuer(IssuerPurpose::Message, make_spec()).await
                  .expect("unrelated checkpoint must not inherit fault");
              assert!(first.enroll_issuer(IssuerPurpose::Message, make_spec()).await.is_err());
              drop(fault);
              first.sync_checkpoint().await.expect("recover affected host");
          }
          '''
          ops = ops_path.read_text()
          ops = one(ops, '        self.store.operational_snapshot(time).await',
              '        let _mutation = self.mutation.lock().await;\n        self.store.operational_snapshot(time).await')
          old = '''        let recovery_complete = self.store.reconcile_after_restart(limit).await?;
                  let expired_reservation_sweep = self
                      .store
                      .sweep_expired_reservations(time.clone(), limit)
                      .await?;
                  self.sync_checkpoint().await?;'''
          # The source anchor is dedented relative to the embedded Python block.
          old = '\n'.join(line[10:] if i else line for i, line in enumerate(old.splitlines()))
          start = ops.index('        let recovery_complete = self.store.reconcile_after_restart(limit).await?;')
          stop = ops.index('        let snapshot = self.store.operational_snapshot(&time).await?;', start)
          expected_block = ops[start:stop]
          assert expected_block.count('self.sync_checkpoint().await?;') == 1
          ops = ops[:start] + '''        let policy = policy.validate()?;
                  let _mutation = self.mutation.lock().await;
                  self.sync_checkpoint_locked().await?;
                  let result: Result<_, AuthBusAuthorityError> = async {
                      let recovery_complete = self.store.reconcile_after_restart(limit).await?;
                      let sweep = self.store.sweep_expired_reservations(time.clone(), limit).await?;
                      Ok((recovery_complete, sweep))
                  }.await;
                  // Even a failed sweep may follow committed restart reconciliation.
                  self.sync_checkpoint_locked().await?;
                  let (recovery_complete, expired_reservation_sweep) = result?;
          ''' + ops[stop:]
          host_path.write_text(host)
          ops_path.write_text(ops)
          tests_path.write_text(tests)
          print(f'applied {mutation_count} host mutation guards plus maintenance/snapshot guards')
          PY
      - name: Format only AuthBus-owned Rust packages
        run: cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus -p codex-hepta-authbus-p1-3-qualification
      - name: Commit actual source without overwriting concurrent work
        id: commit
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = ('codex-rs/hepta-authbus/', 'codex-rs/hepta-authbus-p1-3-qualification/')
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if any(not path.startswith(allowed) for path in paths):
              raise SystemExit(f'out-of-scope formatter change: {paths}')
          PY
          git fetch origin refs/heads/codex/authbus-concurrency-closure-20260927
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SOURCE"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add codex-rs/hepta-authbus codex-rs/hepta-authbus-p1-3-qualification
            git commit -m 'fix(authbus): serialize mutation-to-checkpoint publication and isolate fault injection'
            git push origin HEAD:refs/heads/codex/authbus-concurrency-closure-20260927
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
  native-owner:
    needs: materialize
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
      - name: Native owner tests (supplemental; never substitutes for Linux workspace qualification)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authbus-owner"
          git rev-parse HEAD | tee "$RUNNER_TEMP/authbus-owner/source.txt"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-owner/tests.log"
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/authbus-owner/clippy.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authbus-native-owner-${{ needs.materialize.outputs.source }}
          path: ${{ runner.temp }}/authbus-owner
          if-no-files-found: error
