# One-shot convergence runner; deleted after the verified source commit.
name: Cognitive read convergence bootstrap

on:
  push:
    branches:
      - work/cognitive-read-convergence-20260925

permissions:
  contents: write

concurrency:
  group: cognitive-read-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    if: "${{ github.event.head_commit.message == 'chore(cognitive.read): bootstrap convergence phase 1' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Implementation-map migration validates retained sourceBase objects.
          # A shallow clone makes valid historical provenance unverifiable.
          fetch-depth: 0

      - name: Install repository tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0

      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Apply phase-one convergence patch
        run: |
          python3 scripts/cognitive-read-convergence-phase1.py
          python3 scripts/cognitive-read-convergence-phase1-fix.py

      - name: Format changed Rust crates
        working-directory: codex-rs
        run: >-
          cargo fmt
          --package codex-hepta-cognitive-read
          --package codex-hepta-agentd
          --package codex-hepta-infer-worker-host

      - name: Reject whitespace errors
        run: git diff --check

      - name: Test exact-ID read library
        id: exact_read_tests
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          cargo test -p codex-hepta-cognitive-read --lib --locked -- --test-threads=1 \
            2>&1 | tee ../qualification/cognitive-read-phase1-test.log

      - name: Publish exact-ID failure log
        if: steps.exact_read_tests.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-ci-convergence"
          git config user.email "hepta-ci-convergence@users.noreply.github.com"
          git add -f qualification/cognitive-read-phase1-test.log
          git commit -m "debug(cognitive.read): capture phase-one test failure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1

      - name: Strict lint exact-ID read library
        working-directory: codex-rs
        run: cargo clippy -p codex-hepta-cognitive-read --all-targets --locked -- -D warnings

      - name: Test Agentd cognitive context
        working-directory: codex-rs
        run: cargo test -p codex-hepta-agentd --lib --locked cognitive_context -- --test-threads=1

      - name: Test native final-use ordering
        working-directory: codex-rs
        run: >-
          cargo test -p codex-hepta-infer-worker-host --lib --locked
          cognitive_final_use_revalidation_follows_durable_dispatch_and_precedes_turn_start
          -- --test-threads=1

      - name: Test real Agentd and worker final-use race
        working-directory: codex-rs
        run: >-
          cargo test -p codex-hepta-infer-worker-host --lib --locked
          real_agentd_worker_accepts_fresh_context_and_rejects_final_use_tombstone
          -- --test-threads=1

      - name: Commit source and semantic map corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-ci-convergence"
          git config user.email "hepta-ci-convergence@users.noreply.github.com"
          git add \
            codex-rs/hepta-cognitive-read/src/ids.rs \
            codex-rs/hepta-cognitive-read/src/ids_tests.rs \
            codex-rs/hepta-agentd/src/cognitive_context.rs \
            codex-rs/hepta-agentd/src/test_support.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs \
            docs/modules/cognitive.read/TECHNICAL.md \
            docs/modules/cognitive.read/IMPLEMENTATION_MAP.json
          git commit -m "fix(cognitive.read): align bounded reads and product evidence"

      - name: Rebind exact implementation identity
        run: python3 scripts/hepta-implementation-maps.py migrate --module cognitive.read

      - name: Remove one-shot bootstrap and commit exact map
        shell: bash
        run: |
          set -euo pipefail
          rm -f qualification/cognitive-read-phase1-test.log
          rm \
            .github/workflows/cognitive-read-convergence-bootstrap.yml \
            scripts/cognitive-read-convergence-phase1.py \
            scripts/cognitive-read-convergence-phase1-fix.py
          git add -A
          git commit -m "docs(cognitive.read): bind convergence candidate identity"
          python3 scripts/hepta-implementation-maps.py check --module cognitive.read
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
