name: Intuition source preflight (not product acceptance)
on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths:
      - codex-rs/hepta-intuition/**
      - codex-rs/hepta-intelligence/src/intuition_qualification_v3.rs
      - codex-rs/hepta-agentd/src/intuition*.rs
      - codex-rs/hepta-agentd/src/state*.rs
      - codex-rs/hepta-agentd/src/objective_runtime*.rs
      - scripts/intuition*.py
      - scripts/tests/test_intuition*.py
      - docs/modules/intuition.policy/**
      - .github/workflows/intuition-source-regressions.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intuition-source-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Exercise evidence and documentation regressions
        shell: bash
        run: python -m unittest discover -s scripts/tests -p 'test_intuition*.py' -v
      - name: Verify pinned workspace resolution and policy compilation
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intuition-preflight-target
        run: |
          set -euo pipefail
          cd codex-rs
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/intuition-locked-metadata.json"
          cargo check --locked -p codex-hepta-intuition --all-targets
      - name: Require unchanged source even after failed preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intuition-locked-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-locked-metadata.json
          if-no-files-found: warn
          retention-days: 7
