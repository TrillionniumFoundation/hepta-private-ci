name: Intuition source preflight (not product acceptance)
on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths:
      - codex-rs/hepta-intuition/**
      - codex-rs/hepta-intelligence/src/intuition_qualification_v3.rs
      - codex-rs/hepta-agentd/src/intuition*.rs
      - codex-rs/hepta-agentd/src/state*.rs
      - codex-rs/hepta-agentd/src/objective_runtime*.rs
      - scripts/intuition*.py
      - scripts/tests/test_intuition*.py
      - docs/modules/intuition.policy/**
      - .github/workflows/intuition-source-regressions.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intuition-source-preflight-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
jobs:
  windows-lock:
    name: Windows immutable lock, policy and source-state preflight
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Record immutable source identity and verify documentation projection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}'
          python scripts/intuition_state.py --check
          python -m unittest discover -s scripts/tests -p 'test_intuition_state.py' -v
      - name: Verify pinned workspace resolution
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/intuition-locked-metadata.json"
      - name: Test and lint native policy without changing candidate source
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intuition-preflight-target
        run: |
          set -euo pipefail
          cd codex-rs
          cargo check --locked -p codex-hepta-intuition --all-targets
          cargo test --locked -p codex-hepta-intuition --lib
          cargo clippy --locked -p codex-hepta-intuition --all-targets -- -D warnings
          cargo fmt -p codex-hepta-intuition -- --check
      - name: Require unchanged source
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intuition-locked-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-locked-metadata.json
          if-no-files-found: warn
          retention-days: 7
  posix-source:
    name: Linux ARM source regression preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Run the full POSIX evidence suite without excluding failing tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_intuition*.py' -v
      - name: Check source format without rewriting the candidate
        if: ${{ always() && !cancelled() }}
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Test the actual Agentd policy and admission modules
        if: ${{ always() && !cancelled() }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intuition-agentd-preflight-target
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib intuition_policy -- --nocapture
      - name: Require unchanged source after every result
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
# These platform preflights never replace the required Ubuntu x86 exact-source,
# deterministic-merge, independent execution or ledger qualification artifacts.
# No step edits, commits, pushes, promotes or signs acceptance for its candidate.
