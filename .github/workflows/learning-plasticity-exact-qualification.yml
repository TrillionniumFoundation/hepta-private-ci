name: Learning plasticity exact qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "qualification/module-execution-dossiers/detail/learning.plasticity.md"
      - "scripts/*plasticity*"
      - ".authoring/learning-plasticity-p0.tar.gz.b64.part*"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
      - ".github/workflows/learning-plasticity-p0-materialize.yml"
      - ".github/workflows/learning-plasticity-source-materialize.yml"
  push:
    branches: [main]
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "scripts/*plasticity*"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-plasticity-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  materialize-reviewed-p0:
    name: Materialize reviewed P0 source
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/learning-plasticity-product-closure-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Authenticate and extract reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f .authoring/learning-plasticity-p0.tar.gz.b64.part00
          cat .authoring/learning-plasticity-p0.tar.gz.b64.part{00..02} \
            > /tmp/learning-plasticity-p0.tar.gz.b64
          test "$(sha256sum /tmp/learning-plasticity-p0.tar.gz.b64 | cut -d' ' -f1)" = \
            "83f5b4b50b24a8c61156c63baec1c9cbc04e404e44642ebd47e48ee2ab1675b6"
          base64 --decode /tmp/learning-plasticity-p0.tar.gz.b64 \
            > /tmp/learning-plasticity-p0.tar.gz
          test "$(sha256sum /tmp/learning-plasticity-p0.tar.gz | cut -d' ' -f1)" = \
            "2a5478e206eff0834eec4131717635183e29f30729a5b129ea4774c56cbe0b0d"
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/learning-plasticity-p0.tar.gz')
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
          PY
          tar --no-same-owner --no-same-permissions -xzf \
            /tmp/learning-plasticity-p0.tar.gz -C .
          sha256sum -c <<'EOF'
          2104dc357151bf41b5a87515966d6e19474d6b79ad62d24de4e3910c285c0034  codex-rs/hepta-agentd/Cargo.toml
          c048a80ffa880947b2e837bc9894db72adb86e6a9cd33958adbd6589b1ab6d12  codex-rs/hepta-agentd/src/plasticity_coordination.rs
          61892d34b0215f0fcc45c4f2f614c778932aa623b8f6af1003b09a905a89807a  codex-rs/hepta-agentd/src/plasticity_iteration_coordinator.rs
          fcae76680705c58d89d557eb02119c36d34b78a57e9f4e8e5a5f9eab2a037c15  codex-rs/hepta-agentd/src/plasticity_storage_security.rs
          863fd99269534e5793c49c0f00a8242c7c0a816b112d51be06cf2da83d2c2d34  codex-rs/hepta-agentd/src/plasticity_topology_iteration_coordinator.rs
          cc40a473c1ae4f21bfd888f14c00778ba28253e4849dfed6c97e3e8227674f9f  codex-rs/hepta-plasticity/src/generator_coverage_v1.rs
          a0a0f0a7df553f4d689b7acbeb5d1218a92a385f94dd4b282529069e650b61f6  codex-rs/hepta-plasticity/src/lib.rs
          3d7137733cca25cb9ac8eec1fbe79f0717775ff0d6b29e590cc165a61109c9fe  codex-rs/hepta-plasticity/src/topology_coverage_v1.rs
          EOF
      - name: Format, compile, test, and lint reviewed source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-agentd
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-agentd -- --check
          cargo check --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-agentd
          cargo test --locked -p codex-hepta-plasticity --lib -- --test-threads=1
          cargo test --locked -p codex-hepta-agentd --lib plasticity_ -- --test-threads=1
          cargo clippy --locked --no-deps --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-agentd -- -D warnings
      - name: Publish ordinary source and remove one-shot materializers
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_SHA^:.github/workflows/learning-plasticity-exact-qualification.yml" \
            > .github/workflows/learning-plasticity-exact-qualification.yml
          rm -f \
            .authoring/learning-plasticity-p0.tar.gz.b64.part00 \
            .authoring/learning-plasticity-p0.tar.gz.b64.part01 \
            .authoring/learning-plasticity-p0.tar.gz.b64.part02 \
            .github/workflows/learning-plasticity-p0-materialize.yml \
            .github/workflows/learning-plasticity-source-materialize.yml \
            /tmp/learning-plasticity-p0.tar.gz.b64 \
            /tmp/learning-plasticity-p0.tar.gz
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "fix(plasticity): close coverage and coordinator P0 gaps"
          git fetch origin feat/learning-plasticity-product-closure-20260928
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git push origin HEAD:feat/learning-plasticity-product-closure-20260928
          echo "changed=true" >> "$GITHUB_OUTPUT"

  source-snapshot:
    name: Preserve immutable review source
    needs: materialize-reviewed-p0
    if: always() && (needs.materialize-reviewed-p0.result == 'skipped' || needs.materialize-reviewed-p0.outputs.changed != 'true')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export the exact source and fixed base for reproducible review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/plasticity-source"
          git bundle create "$RUNNER_TEMP/plasticity-source/source.bundle" HEAD "$BASE_SHA"
          git rev-parse HEAD HEAD^{tree} "$BASE_SHA" "$BASE_SHA^{tree}" > "$RUNNER_TEMP/plasticity-source/identity.txt"
          shasum -a 256 "$RUNNER_TEMP/plasticity-source/source.bundle" > "$RUNNER_TEMP/plasticity-source/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plasticity-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plasticity-source/
          retention-days: 7
          if-no-files-found: error

  qualify:
    name: Plasticity ${{ matrix.lane }}
    needs: materialize-reviewed-p0
    if: always() && (needs.materialize-reviewed-p0.result == 'skipped' || needs.materialize-reviewed-p0.outputs.changed != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable source or deterministic merge
        id: candidate
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          if [ "$LANE" = synthetic-merge ]; then
            TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
            export GIT_AUTHOR_NAME="Hepta Plasticity CI"
            export GIT_AUTHOR_EMAIL="hepta-plasticity-ci@users.noreply.github.com"
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            TESTED_SHA="$(printf 'Synthetic learning.plasticity qualification\n' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            git checkout --detach "$TESTED_SHA"
          else
            TESTED_SHA="$SOURCE_SHA"
          fi
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA" >> "$GITHUB_ENV"
          printf 'tested_sha=%s\n' "$TESTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'source=%s\nbase=%s\ntested=%s\ntree=%s\n' "$SOURCE_SHA" "$BASE_SHA" "$TESTED_SHA" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Execute all gates and retain every exit status
        env:
          LANE: ${{ matrix.lane }}
        run: python3 scripts/qualify_learning_plasticity.py --output "${{ runner.temp }}/plasticity-evidence"
      - name: Check unchanged candidate
        if: always() && steps.candidate.outputs.tested_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plasticity-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plasticity-evidence/
          retention-days: 14
          if-no-files-found: error
