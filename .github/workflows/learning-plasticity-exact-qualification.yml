name: Learning plasticity exact qualification

on:
  pull_request:
    paths:
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
      - "docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json"
      - "docs/modules/control.engineering/IMPLEMENTATION_MAP.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-plasticity-map-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebind-inherited-provenance:
    name: Rebind inherited implementation-map provenance
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/learning-plasticity-product-closure-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rebind the two squashed integration observations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "73f111ee51f051392ea9520dfa231b0bf4425e01"
          test "$(git rev-parse HEAD^^)" = "012f8794b1aa43794ad0330303422b7337a86c45"
          python3 - <<'PY'
          import json
          from pathlib import Path

          identity = {
              "commit": "73f111ee51f051392ea9520dfa231b0bf4425e01",
              "tree": "e44ddac383fc440cc33e403f9e574b46dac3875c",
          }
          paths = [
              Path("docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json"),
              Path("docs/modules/control.engineering/IMPLEMENTATION_MAP.json"),
          ]
          for path in paths:
              row = json.loads(path.read_text(encoding="utf-8"))
              row["sourceBase"] = dict(identity)
              row["observedAtHead"] = dict(identity)
              path.write_text(
                  json.dumps(row, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          PY
          git diff --check

      - name: Commit locally before strict clean-tree verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json \
            docs/modules/control.engineering/IMPLEMENTATION_MAP.json
          git commit -m "fix(docs): rebind squashed integration provenance"

      - name: Verify the complete canonical documentation gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-implementation-maps.py verify
          python3 -m unittest discover -v -s scripts -p 'test_hepta_implementation_maps.py'
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push verified map repair to the active convergence branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.head_ref }}"
