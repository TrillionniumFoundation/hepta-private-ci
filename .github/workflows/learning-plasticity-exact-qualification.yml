name: Learning plasticity exact qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "qualification/module-execution-dossiers/detail/learning.plasticity.md"
      - "scripts/test_learning_plasticity_grammar_contract.py"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "qualification/module-execution-dossiers/detail/learning.plasticity.md"
      - "scripts/test_learning_plasticity_grammar_contract.py"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-plasticity-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  exact-head:
    name: Plasticity exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s\n' "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify canonical grammar and generated documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_learning_plasticity_grammar_contract.py
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-implementation-maps.py verify

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Format, compile, test and lint exact source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-agentd -- --check
          cargo check --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd
          just test --locked -p codex-hepta-plasticity -p codex-hepta-learning-artifacts \
            --test-threads=1
          just test --locked -p codex-hepta-agentd --lib plasticity_ --test-threads=1
          just test --locked -p codex-hepta-agentd --test plasticity_process_e2e \
            --test-threads=1
          just test --locked -p codex-hepta-runtime \
            authenticated_canary_forces_live_fault_then_rolls_forward_to_reconciled_predecessor_semantics \
            --test-threads=1
          cargo clippy --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd -- -D warnings

      - name: Preserve read-only candidate
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  synthetic-merge:
    name: Plasticity deterministic merge tree
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Construct deterministic synthetic merge
        id: merge
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME="Hepta Plasticity CI"
          export GIT_AUTHOR_EMAIL="hepta-plasticity-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SHA="$(printf 'Synthetic learning.plasticity merge for PR %s\n' "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          printf 'merge_commit=%s\n' "$SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'merge_tree=%s\n' "$TREE" >> "$GITHUB_STEP_SUMMARY"

      - name: Select exact merge-tree execution
        id: execution
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_candidate.py \
            --source "$SOURCE_SHA" \
            --tested "${{ steps.merge.outputs.sha }}" \
            --base "$BASE_SHA" \
            --lane synthetic-merge \
            --github-output "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.execution.outputs.run_native == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Verify merge-tree contracts and native vertical
        if: steps.execution.outputs.run_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha }}"
          python3 scripts/test_learning_plasticity_grammar_contract.py
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-implementation-maps.py verify
          cd codex-rs
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-agentd -- --check
          cargo check --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd
          just test --locked -p codex-hepta-agentd --lib plasticity_ --test-threads=1
          just test --locked -p codex-hepta-agentd --test plasticity_process_e2e \
            --test-threads=1
          just test --locked -p codex-hepta-runtime \
            authenticated_canary_forces_live_fault_then_rolls_forward_to_reconciled_predecessor_semantics \
            --test-threads=1
          cargo clippy --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd -- -D warnings

      - name: Preserve deterministic merge candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha }}"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
