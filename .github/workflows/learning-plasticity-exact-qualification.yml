name: Learning plasticity exact qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "qualification/module-execution-dossiers/detail/learning.plasticity.md"
      - "scripts/*plasticity*"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
  push:
    branches: [main]
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "scripts/*plasticity*"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-plasticity-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  author-runtime-closure:
    name: One-shot authored runtime closure
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/learning-plasticity-product-closure-20260928'
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and authenticate authoring payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat scripts/.learning_plasticity_runtime_materializer.part{00..05} \
            > scripts/materialize_learning_plasticity_runtime_closure.py
          test "$(shasum -a 256 scripts/materialize_learning_plasticity_runtime_closure.py | awk '{print $1}')" = \
            "6e81ba8d9a316a3d94d98f23927f68f538f6fda6692a79cd8ebee779779cd010"
          python3 -m py_compile scripts/materialize_learning_plasticity_runtime_closure.py

      - name: Materialize exact source and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_learning_plasticity_runtime_closure.py
          test "$(shasum -a 256 codex-rs/hepta-agentd/src/plasticity_runtime.rs | awk '{print $1}')" = \
            "8bb9e10d29181dc0eaa97a1f805eba13e3aead92b1217bf7d59c063efd13f29b"
          test "$(shasum -a 256 docs/modules/learning.plasticity/RUNTIME_RESOURCE_RECOVERY.md | awk '{print $1}')" = \
            "d3f591894eb9570f91ee03b98cc0b81b8373aad892c988f4cccfa496af514970"
          test "$(shasum -a 256 scripts/qualify_learning_plasticity.py | awk '{print $1}')" = \
            "eac4db744a4d95990e824d9c46bac386b3aebdc8aa79f23aac392809acb96685"
          python3 -m py_compile scripts/qualify_learning_plasticity.py
          python3 scripts/test_learning_plasticity_grammar_contract.py

      - name: Format authored Rust source
        working-directory: codex-rs
        run: cargo fmt --manifest-path Cargo.toml --package codex-hepta-agentd

      - name: Compile all Agentd targets
        working-directory: codex-rs
        run: cargo check --locked --all-targets -p codex-hepta-agentd

      - name: Exercise quota, cache, lifecycle, and recovery regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd --lib \
            plasticity_runtime::tests \
            -- --test-threads=1
          cargo test --locked -p codex-hepta-agentd --lib \
            agentd_lifetime_owner_submits_restarts_and_reconciles_idempotently \
            -- --test-threads=1

      - name: Enforce strict Agentd lint
        working-directory: codex-rs
        run: cargo clippy --locked --all-targets -p codex-hepta-agentd -- -D warnings

      - name: Publish authored candidate and restore read-only qualification
        shell: bash
        run: |
          set -euo pipefail
          git show 4325a520da597972aa5930ec1293882bd62d904c:.github/workflows/learning-plasticity-exact-qualification.yml \
            > .github/workflows/learning-plasticity-exact-qualification.yml
          rm scripts/materialize_learning_plasticity_runtime_closure.py
          git rm scripts/.learning_plasticity_runtime_materializer.part{00..05}
          git rm .github/workflows/learning-plasticity-runtime-materialize.yml
          git add \
            .github/workflows/learning-plasticity-exact-qualification.yml \
            codex-rs/hepta-agentd/src/plasticity_runtime.rs \
            docs/modules/learning.plasticity/RUNTIME_RESOURCE_RECOVERY.md \
            docs/modules/learning.plasticity/DEVELOPER_QUICKSTART.md \
            scripts/qualify_learning_plasticity.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(plasticity): bound aggregate runtime resources"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  source-snapshot:
    name: Preserve immutable review source
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export the exact source and fixed base for reproducible review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/plasticity-source"
          git bundle create "$RUNNER_TEMP/plasticity-source/source.bundle" HEAD "$BASE_SHA"
          git rev-parse HEAD HEAD^{tree} "$BASE_SHA" "$BASE_SHA^{tree}" > "$RUNNER_TEMP/plasticity-source/identity.txt"
          shasum -a 256 "$RUNNER_TEMP/plasticity-source/source.bundle" > "$RUNNER_TEMP/plasticity-source/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plasticity-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plasticity-source/
          retention-days: 7
          if-no-files-found: error

  qualify:
    name: Plasticity ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable source or deterministic merge
        id: candidate
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          if [ "$LANE" = synthetic-merge ]; then
            TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
            export GIT_AUTHOR_NAME="Hepta Plasticity CI"
            export GIT_AUTHOR_EMAIL="hepta-plasticity-ci@users.noreply.github.com"
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            TESTED_SHA="$(printf 'Synthetic learning.plasticity qualification\n' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            git checkout --detach "$TESTED_SHA"
          else
            TESTED_SHA="$SOURCE_SHA"
          fi
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA" >> "$GITHUB_ENV"
          printf 'tested_sha=%s\n' "$TESTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'source=%s\nbase=%s\ntested=%s\ntree=%s\n' "$SOURCE_SHA" "$BASE_SHA" "$TESTED_SHA" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Execute all gates and retain every exit status
        env:
          LANE: ${{ matrix.lane }}
        run: python3 scripts/qualify_learning_plasticity.py --output "${{ runner.temp }}/plasticity-evidence"
      - name: Check unchanged candidate
        if: always() && steps.candidate.outputs.tested_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plasticity-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plasticity-evidence/
          retention-days: 14
          if-no-files-found: error
