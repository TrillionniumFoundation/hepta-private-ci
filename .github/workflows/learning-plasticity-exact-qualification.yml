name: Learning plasticity exact qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "qualification/lane-f-shadow/**"
      - "scripts/qualify_learning_plasticity.py"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
  push:
    branches: [feat/learning-plasticity-product-closure-20260928]
    paths:
      - "codex-rs/**"
      - "docs/modules/learning.plasticity/**"
      - "qualification/lane-f-shadow/**"
      - "scripts/qualify_learning_plasticity.py"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
      - ".github/workflows/learning-plasticity-p1-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-plasticity-exact-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: exact-${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    steps:
      - name: Resolve immutable candidate identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            source_sha="$PR_HEAD_SHA"
            base_sha="$PR_BASE_SHA"
          else
            source_sha="$EVENT_SHA"
            base_sha="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Materialize deterministic tested commit without changing source
        id: tested
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          if [[ "$LANE" == source-head ]]; then
            tested_sha="$SOURCE_SHA"
          else
            tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            test -n "$tree"
            tested_sha="$(printf '%s\n' 'learning.plasticity deterministic qualification merge' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            git checkout --detach "$tested_sha"
          fi
          test "$(git rev-parse HEAD)" = "$tested_sha"
          test -z "$(git status --porcelain)"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "tested_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Run read-only qualification
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          TESTED_SHA: ${{ steps.tested.outputs.tested_sha }}
          LANE: ${{ matrix.lane }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/learning-plasticity-${{ matrix.lane }}"
          python3 scripts/qualify_learning_plasticity.py --output "$evidence"
          python3 - "$evidence/execution.json" <<'PY'
          import json, pathlib, sys
          row = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not row.get("passed"):
              raise SystemExit("qualification receipt is not passing")
          if row.get("testedCommit") != "${{ steps.tested.outputs.tested_sha }}":
              raise SystemExit("tested commit drift")
          PY

      - name: Upload immutable lane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-plasticity-${{ matrix.lane }}-${{ steps.identity.outputs.source_sha }}
          path: ${{ runner.temp }}/learning-plasticity-${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 14

      - name: Prove checkout unchanged
        if: always()
        shell: bash
        env:
          TESTED_SHA: ${{ steps.tested.outputs.tested_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  readiness:
    name: exact-candidate-readiness
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download both lane receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: learning-plasticity-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/receipts
          merge-multiple: false

      - name: Build one non-stitchable readiness manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "receipts"
          receipts = [json.loads(p.read_text()) for p in root.rglob("execution.json")]
          by_lane = {r["lane"]: r for r in receipts}
          required = {"source-head", "synthetic-merge"}
          if set(by_lane) != required:
              raise SystemExit(f"required lane set mismatch: {sorted(by_lane)}")
          source = os.environ["SOURCE_SHA"]
          run = os.environ.get("GITHUB_RUN_ID")
          attempt = os.environ.get("GITHUB_RUN_ATTEMPT")
          for lane, row in by_lane.items():
              if not row.get("passed") or row.get("sourceCommit") != source:
                  raise SystemExit(f"invalid {lane} receipt")
              if str(row.get("workflowRun")) != str(run) or str(row.get("runAttempt")) != str(attempt):
                  raise SystemExit(f"cross-run receipt stitching rejected for {lane}")
          manifest = {
              "schema": "hepta.learning-plasticity-readiness.v1",
              "sourceHeadSha": source,
              "baseSha": by_lane["source-head"]["baseCommit"],
              "sourceTree": by_lane["source-head"]["sourceTree"],
              "deterministicMergeSha": by_lane["synthetic-merge"]["testedCommit"],
              "deterministicMergeTree": by_lane["synthetic-merge"]["testedTree"],
              "workflowSha": by_lane["source-head"].get("workflowSha"),
              "workflowRunId": run,
              "attemptId": attempt,
              "requiredLanes": sorted(required),
              "laneReceiptSha256": {
                  lane: hashlib.sha256(json.dumps(row, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
                  for lane, row in sorted(by_lane.items())
              },
              "repositorySourceQualified": True,
              "mergeReady": True,
              "productionQualified": False,
              "targetHostEvidence": False,
              "independentAcceptance": False,
              "activation": False,
              "release": False,
          }
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "learning-plasticity-readiness.json"
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(out.read_text())
          PY

      - name: Upload single readiness manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-plasticity-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/learning-plasticity-readiness.json
          if-no-files-found: error
          retention-days: 14
