name: Learning plasticity exact qualification

on:
  pull_request:
    paths:
      - ".authoring/learning-plasticity-p0.tar.gz.b64.part*"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
      - ".github/workflows/learning-plasticity-p0-materialize.yml"
      - ".github/workflows/learning-plasticity-source-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-plasticity-p0-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: feat/learning-plasticity-product-closure-20260928
  READ_ONLY_WORKFLOW_COMMIT: b3f6353141afc8ec0aaaf844e285ffb9ea88b0e0

jobs:
  materialize-reviewed-p0:
    name: Materialize reviewed P0 source
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/learning-plasticity-product-closure-20260928'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Authenticate and extract reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import base64
          import hashlib
          import tarfile
          from pathlib import Path

          parts = [Path(f'.authoring/learning-plasticity-p0.tar.gz.b64.part{i:02d}') for i in range(3)]
          if not all(path.is_file() for path in parts):
              raise SystemExit('reviewed P0 payload is incomplete')
          encoded = b''.join(path.read_bytes() for path in parts)
          if hashlib.sha256(encoded).hexdigest() != '83f5b4b50b24a8c61156c63baec1c9cbc04e404e44642ebd47e48ee2ab1675b6':
              raise SystemExit('reviewed P0 base64 digest mismatch')
          archive_bytes = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(archive_bytes).hexdigest() != '2a5478e206eff0834eec4131717635183e29f30729a5b129ea4774c56cbe0b0d':
              raise SystemExit('reviewed P0 archive digest mismatch')
          archive = Path('/tmp/learning-plasticity-p0.tar.gz')
          archive.write_bytes(archive_bytes)
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
              tar.extractall('.')

          expected = {
              'codex-rs/hepta-agentd/Cargo.toml': '2104dc357151bf41b5a87515966d6e19474d6b79ad62d24de4e3910c285c0034',
              'codex-rs/hepta-agentd/src/plasticity_coordination.rs': 'c048a80ffa880947b2e837bc9894db72adb86e6a9cd33958adbd6589b1ab6d12',
              'codex-rs/hepta-agentd/src/plasticity_iteration_coordinator.rs': '61892d34b0215f0fcc45c4f2f614c778932aa623b8f6af1003b09a905a89807a',
              'codex-rs/hepta-agentd/src/plasticity_storage_security.rs': 'fcae76680705c58d89d557eb02119c36d34b78a57e9f4e8e5a5f9eab2a037c15',
              'codex-rs/hepta-agentd/src/plasticity_topology_iteration_coordinator.rs': '863fd99269534e5793c49c0f00a8242c7c0a816b112d51be06cf2da83d2c2d34',
              'codex-rs/hepta-plasticity/src/generator_coverage_v1.rs': 'cc40a473c1ae4f21bfd888f14c00778ba28253e4849dfed6c97e3e8227674f9f',
              'codex-rs/hepta-plasticity/src/lib.rs': 'a0a0f0a7df553f4d689b7acbeb5d1218a92a385f94dd4b282529069e650b61f6',
              'codex-rs/hepta-plasticity/src/topology_coverage_v1.rs': '3d7137733cca25cb9ac8eec1fbe79f0717775ff0d6b29e590cc165a61109c9fe',
          }
          for name, digest in expected.items():
              path = Path(name)
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'reviewed source digest mismatch: {name}')
          PY

      - name: Verify formatting before publication
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-agentd -- --check

      - name: Publish ordinary source and restore read-only qualification
        shell: bash
        run: |
          set -euo pipefail
          git show "$READ_ONLY_WORKFLOW_COMMIT:.github/workflows/learning-plasticity-exact-qualification.yml" \
            > .github/workflows/learning-plasticity-exact-qualification.yml
          rm -f \
            .authoring/learning-plasticity-p0.tar.gz.b64.part00 \
            .authoring/learning-plasticity-p0.tar.gz.b64.part01 \
            .authoring/learning-plasticity-p0.tar.gz.b64.part02 \
            .github/workflows/learning-plasticity-p0-materialize.yml \
            .github/workflows/learning-plasticity-source-materialize.yml \
            /tmp/learning-plasticity-p0.tar.gz
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "fix(plasticity): close coverage and coordinator P0 gaps"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git push origin "HEAD:${TARGET_BRANCH}"
