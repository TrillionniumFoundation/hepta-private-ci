name: Learning plasticity exact qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "qualification/module-execution-dossiers/detail/learning.plasticity.md"
      - "scripts/test_learning_plasticity_grammar_contract.py"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-runtime/**"
      - "docs/modules/learning.plasticity/**"
      - "qualification/module-execution-dossiers/detail/learning.plasticity.md"
      - "scripts/test_learning_plasticity_grammar_contract.py"
      - ".github/workflows/learning-plasticity-exact-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-plasticity-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  remediate-verifier:
    name: One-shot exact-blob provenance remediation
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha == '012f8794b1aa43794ad0330303422b7337a86c45'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact remediation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair exact-blob provenance validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path("scripts/hepta-implementation-maps.py")
          text = verifier.read_text(encoding="utf-8")
          signature = "def checked_identity(value, candidate: dict[str, str]) -> dict[str, str]:"
          replacement = """def checked_identity(
              value, candidate: dict[str, str], *, require_ancestor: bool = True
          ) -> dict[str, str]:"""
          if text.count(signature) != 1:
              raise SystemExit("checked_identity signature drift")
          text = text.replace(signature, replacement, 1)

          ancestry = '    git("merge-base", "--is-ancestor", commit, candidate["commit"])\n'
          guarded = '''    if require_ancestor:
              git("merge-base", "--is-ancestor", commit, candidate["commit"])
          '''
          if text.count(ancestry) != 1:
              raise SystemExit("checked_identity ancestry drift")
          text = text.replace(ancestry, guarded, 1)

          old = '''    source = checked_identity(row.get("sourceBase"), candidate)
              mapping_mode = row.get("mappingSourceIdentityMode", "path_only")
              if mapping_mode not in {"path_only", "exact_blob"}:
                  raise ValueError(f"unknown mapping source identity mode: {mapping_mode}")
          '''
          new = '''    mapping_mode = row.get("mappingSourceIdentityMode", "path_only")
              if mapping_mode not in {"path_only", "exact_blob"}:
                  raise ValueError(f"unknown mapping source identity mode: {mapping_mode}")
              source = checked_identity(
                  row.get("sourceBase"),
                  candidate,
                  require_ancestor=mapping_mode != "exact_blob",
              )
          '''
          if text.count(old) != 1:
              raise SystemExit("verify_source_identity dispatch drift")
          verifier.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("scripts/test_hepta_exact_blob_provenance.py").write_text(
              '''from __future__ import annotations

          import importlib.util
          import sys
          import unittest
          from pathlib import Path
          from unittest.mock import call, patch

          SCRIPTS = Path(__file__).resolve().parent
          sys.path.insert(0, str(SCRIPTS))
          SPEC = importlib.util.spec_from_file_location(
              "hepta_implementation_maps_exact_blob_test",
              SCRIPTS / "hepta-implementation-maps.py",
          )
          if SPEC is None or SPEC.loader is None:
              raise RuntimeError("cannot load implementation-map verifier")
          MAPS = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MAPS)


          class ExactBlobProvenanceTests(unittest.TestCase):
              def test_detached_provenance_retains_object_validation(self) -> None:
                  commit, tree = "1" * 40, "2" * 40
                  candidate = {"commit": "3" * 40, "tree": "4" * 40}

                  def fake_git(*args: str, **_kwargs: object) -> str:
                      if args == ("cat-file", "-t", commit):
                          return "commit"
                      if args == ("rev-parse", f"{commit}^{{tree}}"):
                          return tree
                      if args and args[0] == "merge-base":
                          raise AssertionError("detached provenance required ancestry")
                      raise AssertionError(f"unexpected git call: {args!r}")

                  with patch.object(MAPS, "git", side_effect=fake_git):
                      actual = MAPS.checked_identity(
                          {"commit": commit, "tree": tree},
                          candidate,
                          require_ancestor=False,
                      )
                  self.assertEqual(actual, {"commit": commit, "tree": tree})

              def test_exact_blob_dispatch_detaches_only_source_base(self) -> None:
                  source = {"commit": "1" * 40, "tree": "2" * 40}
                  candidate = {"commit": "3" * 40, "tree": "4" * 40}
                  row = {
                      "sourceIdentityPolicy": "candidate_or_exact_observation_v1",
                      "mappingSourceIdentityMode": "exact_blob",
                      "sourceBase": source,
                      "observedAtHead": candidate,
                      "observedSourcePaths": ["dummy-source"],
                      "operations": [],
                  }
                  with (
                      patch.object(MAPS, "checked_identity", side_effect=[source, candidate]) as checked,
                      patch.object(MAPS, "evidence_paths", return_value=[]),
                      patch.object(MAPS, "checked_source_path") as checked_path,
                      patch.object(MAPS, "require_tracked_paths"),
                  ):
                      checked_path.return_value.exists.return_value = True
                      MAPS.verify_source_identity(row, [], candidate, check_checkout=False)
                  checked.assert_has_calls(
                      [
                          call(source, candidate, require_ancestor=False),
                          call(candidate, candidate),
                      ]
                  )


          if __name__ == "__main__":
              unittest.main()
          ''',
              encoding="utf-8",
          )
          PY
          python3 -m unittest -v scripts/test_hepta_exact_blob_provenance.py
          python3 scripts/hepta-docs.py verify
          git diff --check

      - name: Commit the verified repair and restore read-only qualification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/learning-plasticity-exact-qualification.yml > .github/workflows/learning-plasticity-exact-qualification.yml
          git rm .github/workflows/learning-plasticity-verifier-remediation.yml
          git add scripts/hepta-implementation-maps.py scripts/test_hepta_exact_blob_provenance.py .github/workflows/learning-plasticity-exact-qualification.yml
          git commit -m "fix(docs): accept exact-blob integration provenance"
          git push origin "HEAD:${{ github.head_ref }}"

  exact-head:
    name: Plasticity exact source
    needs: remediate-verifier
    if: always() && needs.remediate-verifier.result == 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s\n' "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify canonical grammar and generated documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_learning_plasticity_grammar_contract.py
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-implementation-maps.py verify

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Format, compile, test and lint exact source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-agentd -- --check
          cargo check --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd
          just test --locked -p codex-hepta-plasticity -p codex-hepta-learning-artifacts \
            --test-threads=1
          just test --locked -p codex-hepta-agentd --lib plasticity_ --test-threads=1
          just test --locked -p codex-hepta-agentd --test plasticity_process_e2e \
            --test-threads=1
          just test --locked -p codex-hepta-runtime \
            authenticated_canary_forces_live_fault_then_rolls_forward_to_reconciled_predecessor_semantics \
            --test-threads=1
          cargo clippy --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd -- -D warnings

      - name: Preserve read-only candidate
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  synthetic-merge:
    name: Plasticity deterministic merge tree
    needs: remediate-verifier
    if: >-
      always() &&
      needs.remediate-verifier.result == 'skipped' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Construct deterministic synthetic merge
        id: merge
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME="Hepta Plasticity CI"
          export GIT_AUTHOR_EMAIL="hepta-plasticity-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SHA="$(printf 'Synthetic learning.plasticity merge for PR %s\n' "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          printf 'merge_commit=%s\n' "$SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'merge_tree=%s\n' "$TREE" >> "$GITHUB_STEP_SUMMARY"

      - name: Select exact merge-tree execution
        id: execution
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_candidate.py \
            --source "$SOURCE_SHA" \
            --tested "${{ steps.merge.outputs.sha }}" \
            --base "$BASE_SHA" \
            --lane synthetic-merge \
            --github-output "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.execution.outputs.run_native == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Verify merge-tree contracts and native vertical
        if: steps.execution.outputs.run_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha }}"
          python3 scripts/test_learning_plasticity_grammar_contract.py
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-implementation-maps.py verify
          cd codex-rs
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-agentd -- --check
          cargo check --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd
          just test --locked -p codex-hepta-agentd --lib plasticity_ --test-threads=1
          just test --locked -p codex-hepta-agentd --test plasticity_process_e2e \
            --test-threads=1
          just test --locked -p codex-hepta-runtime \
            authenticated_canary_forces_live_fault_then_rolls_forward_to_reconciled_predecessor_semantics \
            --test-threads=1
          cargo clippy --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd -- -D warnings

      - name: Preserve deterministic merge candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha }}"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"