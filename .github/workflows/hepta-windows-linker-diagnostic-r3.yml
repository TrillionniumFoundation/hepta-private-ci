name: Hepta Windows linker diagnostic r3

on:
  push:
    branches:
      - ops/windows-linker-diagnostic-20260909-r3

permissions:
  contents: read

env:
  SOURCE_SHA: 05981ed1adfb931a87a47b0606f1cedaa69f123b

jobs:
  diagnose-std-link:
    runs-on: windows-latest
    timeout-minutes: 30
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse HEAD^)" = "04f60466394a024c218ce66b1b32d1c42c462985"
          test "$(git rev-parse HEAD^{tree})" = "454061365d2c816598012c3a317e56bfe4ffa5cf"

      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-windows-linker-diagnostic-r3

      - name: Create non-product std-only diagnostic target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-link-diag
          cat > .hepta-link-diag/BUILD.bazel <<'EOF'
          load("@rules_rust//rust:defs.bzl", "rust_binary")
          rust_binary(
              name = "hello",
              srcs = ["main.rs"],
              edition = "2024",
          )
          EOF
          cat > .hepta-link-diag/main.rs <<'EOF'
          fn main() {
              println!("hepta-link-diagnostic");
          }
          EOF

      - name: Run exact MSVC/rust-lld diagnostic
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          out="${RUNNER_TEMP}/hepta-windows-linker-diagnostic-r3"
          mkdir -p "${out}"
          ./.github/scripts/run-bazel-ci.sh \
            --windows-msvc-host-platform \
            -- \
            build \
            --platforms=//:windows_x86_64_msvc \
            --verbose_failures \
            --subcommands \
            --sandbox_debug \
            --remote_download_outputs=all \
            -- \
            //.hepta-link-diag:hello \
            2>&1 | tee "${out}/std-link.log"

      - name: Record exact verdict and environment surface
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hepta-windows-linker-diagnostic-r3'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          @(
            "source=$env:SOURCE_SHA",
            "baseline=${{ steps.baseline.outcome }}",
            "LIB_present=$(-not [string]::IsNullOrWhiteSpace($env:LIB))",
            "LIBPATH_present=$(-not [string]::IsNullOrWhiteSpace($env:LIBPATH))",
            "INCLUDE_present=$(-not [string]::IsNullOrWhiteSpace($env:INCLUDE))",
            "WindowsSdkDir_present=$(-not [string]::IsNullOrWhiteSpace($env:WindowsSdkDir))"
          ) | Set-Content -Path (Join-Path $out 'VERDICT')

      - name: Upload diagnostic packet
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-windows-linker-diagnostic-r3-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/hepta-windows-linker-diagnostic-r3
          if-no-files-found: error
          retention-days: 14

      - name: Preserve diagnostic result
        if: always()
        shell: bash
        run: |
          cat "${RUNNER_TEMP}/hepta-windows-linker-diagnostic-r3/VERDICT"
          test -s "${RUNNER_TEMP}/hepta-windows-linker-diagnostic-r3/std-link.log"
