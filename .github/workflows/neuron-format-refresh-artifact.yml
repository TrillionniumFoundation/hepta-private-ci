name: Neuron format refresh artifact

on:
  push:
    branches:
      - codex/neuron-runtime-durable-closure-v1
    paths:
      - '.github/workflows/neuron-format-refresh-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuron-format-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the pinned formatter in an isolated checkout
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-neuron
          git diff --check
          git diff -- codex-rs/hepta-neuron > "$RUNNER_TEMP/neuron-format.patch"
          test -s "$RUNNER_TEMP/neuron-format.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-format-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codex-rs/hepta-neuron/src/runtime_index_v2.rs
            codex-rs/hepta-neuron/src/runtime_index_v2_tests.rs
            codex-rs/hepta-neuron/src/runtime_v2.rs
            codex-rs/hepta-neuron/src/runtime_v2_tests.rs
            codex-rs/hepta-neuron/tests/generation_capacity.rs
            ${{ runner.temp }}/neuron-format.patch
          if-no-files-found: error
          retention-days: 3
