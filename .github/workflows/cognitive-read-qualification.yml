name: Cognitive read qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-cognitive-read/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-cognitive-store/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-agent-protocol/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/cognitive.read/**"
      - "docs/contracts/**"
      - "qualification/cognitive-read/**"
      - "scripts/*cognitive*read*"
      - "scripts/hepta-implementation-maps.py"
      - ".github/scripts/verify_cargo_workspace_manifests.py"
      - ".github/workflows/cognitive-read-qualification.yml"
      - ".github/actions/setup-ci/**"
      - ".github/actions/hepta-synthetic-merge/**"
  push:
    branches:
      - main
      - work/cognitive-read-production-convergence-20260927
    paths:
      - "codex-rs/hepta-cognitive-read/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-cognitive-store/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-agent-protocol/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/cognitive.read/**"
      - "docs/contracts/**"
      - "qualification/cognitive-read/**"
      - "scripts/*cognitive*read*"
      - "scripts/hepta-implementation-maps.py"
      - ".github/scripts/verify_cargo_workspace_manifests.py"
      - ".github/workflows/cognitive-read-qualification.yml"
      - ".github/actions/setup-ci/**"
      - ".github/actions/hepta-synthetic-merge/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-read-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_MIN_STACK: "8388608"

jobs:
  exact-head:
    name: Exact-head cognitive.read qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare CI tools
        uses: ./.github/actions/setup-ci
      - name: Install pinned repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103
      - name: Verify repository test entry points
        shell: bash
        run: |
          set -euo pipefail
          just --version
          cargo nextest --version
      - name: Run exact-head suite and seal evidence
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          bash scripts/run-cognitive-read-qualification.sh \
            source-head "$EXPECTED_SHA" \
            .hepta-evidence/cognitive-read-source exact-head
      - name: Retain immutable exact-head evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.qualification.outputs.bundle }}
            ${{ steps.qualification.outputs.bundle_sha }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact-head artifact identity
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          BUNDLE_SHA: ${{ steps.qualification.outputs.bundle_sha }}
        shell: bash
        run: |
          {
            echo '## cognitive.read source-head evidence'
            echo "Artifact digest: $ARTIFACT_DIGEST"
            test -n "$BUNDLE_SHA" && cat "$BUNDLE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce exact-head qualification result
        if: always()
        env:
          FAILED: ${{ steps.qualification.outputs.failed }}
        run: test "$FAILED" = '0'

  merge-candidate:
    name: Synthetic-merge cognitive.read qualification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Construct deterministic synthetic merge
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Cognitive Read CI
          author-email: cognitive-read-ci@users.noreply.github.com
          message: Cognitive read synthetic merge
      - name: Prepare CI tools
        uses: ./.github/actions/setup-ci
      - name: Install pinned repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103
      - name: Verify repository test entry points
        shell: bash
        run: |
          set -euo pipefail
          just --version
          cargo nextest --version
      - name: Run merge-candidate suite and seal evidence
        id: qualification
        env:
          EXPECTED_SHA: ${{ steps.synthetic.outputs.sha }}
        shell: bash
        run: |
          bash scripts/run-cognitive-read-qualification.sh \
            merge-candidate "$EXPECTED_SHA" \
            .hepta-evidence/cognitive-read-merge merge-candidate
      - name: Retain immutable merge-candidate evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-merge-${{ steps.synthetic.outputs.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.qualification.outputs.bundle }}
            ${{ steps.qualification.outputs.bundle_sha }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish merge-candidate artifact identity
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          BUNDLE_SHA: ${{ steps.qualification.outputs.bundle_sha }}
        shell: bash
        run: |
          {
            echo '## cognitive.read synthetic-merge evidence'
            echo "Artifact digest: $ARTIFACT_DIGEST"
            test -n "$BUNDLE_SHA" && cat "$BUNDLE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce merge-candidate qualification result
        if: always()
        env:
          FAILED: ${{ steps.qualification.outputs.failed }}
        run: test "$FAILED" = '0'

  maintenance-closure:
    name: Repair exact candidate blockers
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci(cognitive.read): enable one-shot maintenance closure'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_PARENT: c20035266afa1cd08570b021632ba71dcb7766b7
      TARGET_BRANCH: work/cognitive-read-production-convergence-20260927
    steps:
      - name: Check out exact maintenance input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare repository CI tools
        uses: ./.github/actions/setup-ci
      - name: Validate one-shot input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = ".github/workflows/cognitive-read-qualification.yml"
      - name: Repair qualification contracts and hostile-input validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path("scripts/verify-cognitive-read-constants.py")
          body = verifier.read_text(encoding="utf-8")
          old = 'require("scripts/run-cognitive-read-qualification.sh", (\'exec python3 scripts/cognitive_read_evidence.py "$@"\',))'
          new = 'require("scripts/run-cognitive-read-qualification.sh", (\'exec python3 scripts/cognitive_read_full_evidence.py "$@"\',))'
          if body.count(old) != 1:
              raise SystemExit("unexpected qualification wrapper contract")
          verifier.write_text(body.replace(old, new), encoding="utf-8")

          evidence = Path("scripts/cognitive_read_evidence.py")
          body = evidence.read_text(encoding="utf-8")
          old = '''        if label == "test-runner":
            runner_lines = log.read_text(errors="replace").splitlines()
            first_line = runner_lines[0].strip() if runner_lines else ""
            version = re.escape(NEXTEST_VERSION)
            if re.fullmatch(rf"cargo-nextest {version}(?:[ \\t][^\\r\\n]*)?", first_line) is None:
                problems.append("test-runner: missing or unexpected pinned nextest version")
'''
          new = '''        if label == "test-runner":
            runner_output = log.read_text(errors="replace").strip()
            version = re.escape(NEXTEST_VERSION)
            if re.fullmatch(rf"cargo-nextest {version}(?:[ \\t][^\\r\\n]*)?", runner_output) is None:
                problems.append("test-runner: missing or unexpected pinned nextest version")
'''
          if body.count(old) != 1:
              raise SystemExit("unexpected nextest validation block")
          evidence.write_text(body.replace(old, new), encoding="utf-8")

          consumers = Path("docs/modules/cognitive.read/CONSUMERS.md")
          body = consumers.read_text(encoding="utf-8")
          if "\x00" not in body:
              raise SystemExit("expected embedded NUL marker is absent")
          consumers.write_text(body.replace("\x00", ""), encoding="utf-8")
          PY
      - name: Format affected Rust packages
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-agentd
      - name: Refresh lockfile and compile affected packages
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-agentd \
            --all-targets
      - name: Verify repaired source before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_cognitive_read_*.py'
          python3 scripts/verify-cognitive-read-constants.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-agentd -- --check
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-agentd \
            --all-targets
          git diff --check
      - name: Restore read-only qualification workflow and bound the diff
        shell: bash
        run: |
          set -euo pipefail
          git show "$EXPECTED_PARENT":.github/workflows/cognitive-read-qualification.yml \
            > .github/workflows/cognitive-read-qualification.yml
          rm -f .github/workflows/cognitive-read-maintenance-closure.yml
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD", "--"], text=True
          ).splitlines()
          allowed_exact = {
              ".github/workflows/cognitive-read-maintenance-closure.yml",
              ".github/workflows/cognitive-read-qualification.yml",
              "codex-rs/Cargo.lock",
              "docs/modules/cognitive.read/CONSUMERS.md",
              "scripts/cognitive_read_evidence.py",
              "scripts/verify-cognitive-read-constants.py",
          }
          allowed_prefixes = (
              "codex-rs/hepta-agentd/src/cognitive_context",
              "codex-rs/hepta-cognitive-read/",
          )
          unexpected = [
              path for path in changed
              if path not in allowed_exact
              and not any(path.startswith(prefix) for prefix in allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f"unexpected maintenance paths: {unexpected}")
          required = {
              ".github/workflows/cognitive-read-maintenance-closure.yml",
              ".github/workflows/cognitive-read-qualification.yml",
              "codex-rs/Cargo.lock",
              "docs/modules/cognitive.read/CONSUMERS.md",
              "scripts/cognitive_read_evidence.py",
              "scripts/verify-cognitive-read-constants.py",
          }
          missing = sorted(required.difference(changed))
          if missing:
              raise SystemExit(f"required maintenance paths unchanged: {missing}")
          print("\n".join(changed))
          PY
      - name: Commit source, lock and workflow closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cognitive Read Maintenance'
          git config user.email 'cognitive-read-maintenance@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(cognitive.read): close exact qualification blockers'
      - name: Rebind cognitive.read implementation evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module cognitive.read
          git add docs/modules/cognitive.read/IMPLEMENTATION_MAP.json
          git diff --cached --quiet || \
            git commit -m 'docs(cognitive.read): rebind repaired source evidence'
      - name: Verify final committed candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          python3 scripts/verify-cognitive-read-map.py \
            --expected-sha "$candidate" \
            --expected-tree "$tree"
          python3 scripts/cognitive_read_consumers.py \
            --expected-sha "$candidate" \
            --output "$RUNNER_TEMP/cognitive-read-consumers.json"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$candidate" \
            --expected-tree "$tree"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Push repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$TARGET_BRANCH"
