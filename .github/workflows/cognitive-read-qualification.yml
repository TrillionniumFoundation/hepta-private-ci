name: Cognitive read qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cognitive-read-qualification.yml
      - .github/scripts/cognitive_read_maintenance_closure.sh

permissions:
  contents: write

concurrency:
  group: cognitive-read-maintenance-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  maintenance-closure:
    name: Repair exact candidate blockers
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/cognitive-read-production-convergence-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUST_MIN_STACK: "8388608"
      EXPECTED_PARENT: bd87a1a7387d5227c3670e5bb7afa4e006e4a718
      RESTORE_COMMIT: c20035266afa1cd08570b021632ba71dcb7766b7
      TARGET_BRANCH: work/cognitive-read-production-convergence-20260927
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare repository CI tools
        uses: ./.github/actions/setup-ci
      - name: Run bounded maintenance closure
        shell: bash
        run: bash .github/scripts/cognitive_read_maintenance_closure.sh
