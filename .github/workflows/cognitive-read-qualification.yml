name: Cognitive read qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-cognitive-read/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-cognitive-store/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-agent-protocol/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/cognitive.read/**"
      - "docs/contracts/**"
      - "qualification/cognitive-read/**"
      - "scripts/*cognitive*read*"
      - "scripts/hepta-implementation-maps.py"
      - ".github/scripts/verify_cargo_workspace_manifests.py"
      - ".github/workflows/cognitive-read-qualification.yml"
      - ".github/actions/setup-ci/**"
      - ".github/actions/hepta-synthetic-merge/**"
  push:
    branches:
      - main
      - work/cognitive-read-production-convergence-20260927
    paths:
      - "codex-rs/hepta-cognitive-read/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-cognitive-store/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-agent-protocol/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/cognitive.read/**"
      - "docs/contracts/**"
      - "qualification/cognitive-read/**"
      - "scripts/*cognitive*read*"
      - "scripts/hepta-implementation-maps.py"
      - ".github/scripts/verify_cargo_workspace_manifests.py"
      - ".github/workflows/cognitive-read-qualification.yml"
      - ".github/actions/setup-ci/**"
      - ".github/actions/hepta-synthetic-merge/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-read-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_MIN_STACK: "8388608"

jobs:
  exact-head:
    name: Exact-head cognitive.read qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare CI tools
        uses: ./.github/actions/setup-ci
      - name: Install pinned repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103
      - name: Verify repository test entry points
        shell: bash
        run: |
          set -euo pipefail
          just --version
          cargo nextest --version
      - name: Run exact-head suite and seal evidence
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          bash scripts/run-cognitive-read-qualification.sh \
            source-head "$EXPECTED_SHA" \
            .hepta-evidence/cognitive-read-source exact-head
      - name: Retain immutable exact-head evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.qualification.outputs.bundle }}
            ${{ steps.qualification.outputs.bundle_sha }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact-head artifact identity
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          BUNDLE_SHA: ${{ steps.qualification.outputs.bundle_sha }}
        shell: bash
        run: |
          {
            echo '## cognitive.read source-head evidence'
            echo "Artifact digest: $ARTIFACT_DIGEST"
            test -n "$BUNDLE_SHA" && cat "$BUNDLE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce exact-head qualification result
        if: always()
        env:
          FAILED: ${{ steps.qualification.outputs.failed }}
        run: test "$FAILED" = '0'

  merge-candidate:
    name: Synthetic-merge cognitive.read qualification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Construct deterministic synthetic merge
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Cognitive Read CI
          author-email: cognitive-read-ci@users.noreply.github.com
          message: Cognitive read synthetic merge
      - name: Prepare CI tools
        uses: ./.github/actions/setup-ci
      - name: Install pinned repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103
      - name: Verify repository test entry points
        shell: bash
        run: |
          set -euo pipefail
          just --version
          cargo nextest --version
      - name: Run merge-candidate suite and seal evidence
        id: qualification
        env:
          EXPECTED_SHA: ${{ steps.synthetic.outputs.sha }}
        shell: bash
        run: |
          bash scripts/run-cognitive-read-qualification.sh \
            merge-candidate "$EXPECTED_SHA" \
            .hepta-evidence/cognitive-read-merge merge-candidate
      - name: Retain immutable merge-candidate evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-merge-${{ steps.synthetic.outputs.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.qualification.outputs.bundle }}
            ${{ steps.qualification.outputs.bundle_sha }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish merge-candidate artifact identity
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          BUNDLE_SHA: ${{ steps.qualification.outputs.bundle_sha }}
        shell: bash
        run: |
          {
            echo '## cognitive.read synthetic-merge evidence'
            echo "Artifact digest: $ARTIFACT_DIGEST"
            test -n "$BUNDLE_SHA" && cat "$BUNDLE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce merge-candidate qualification result
        if: always()
        env:
          FAILED: ${{ steps.qualification.outputs.failed }}
        run: test "$FAILED" = '0'

  source-proposal:
    name: Local-only cognitive.read source proposal (non-qualification)
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'work/cognitive-read-production-convergence-20260927') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/work/cognitive-read-production-convergence-20260927')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PROPOSAL_DIR: ${{ runner.temp }}/cognitive-read-source-proposal
      PROPOSAL_WORKTREE: ${{ runner.temp }}/cognitive-read-source-worktree
    steps:
      - name: Check out exact source without persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare CI tools
        uses: ./.github/actions/setup-ci
      - name: Generate credential-free local repair proposal
        id: proposal
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$PROPOSAL_DIR/files"
          status=0
          (
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            test -z "$(git status --porcelain)"
            test -z "$(git config --local --get-regexp 'http\..*extraheader|credential\.|includeif\..*credentials' || true)"
            git worktree add --detach "$PROPOSAL_WORKTREE" "$SOURCE_SHA"
            cd "$PROPOSAL_WORKTREE"
            git config user.name 'cognitive.read local source proposal'
            git config user.email 'cognitive-read-proposal@invalid.example'
            python3 scripts/run-cognitive-read-convergence-repair.py \
              --expected-sha "$SOURCE_SHA"
            repaired_head="$(git rev-parse HEAD)"
            python3 scripts/prepare-cognitive-read-durable-handoff.py \
              --expected-sha "$repaired_head"
            cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
            test -z "$(git status --porcelain)"
            prepared_head="$(git rev-parse HEAD)"
            git diff --binary "$SOURCE_SHA" "$prepared_head" \
              >"$PROPOSAL_DIR/source.patch"
            git diff --name-status "$SOURCE_SHA" "$prepared_head" \
              >"$PROPOSAL_DIR/changed-files.txt"
            git log --format=fuller "$SOURCE_SHA".."$prepared_head" \
              >"$PROPOSAL_DIR/commits.txt"
            printf '%s\n' "$prepared_head" >"$PROPOSAL_DIR/prepared-head.txt"
            python3 - "$SOURCE_SHA" "$prepared_head" "$PROPOSAL_DIR" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          source, prepared, proposal = sys.argv[1:]
          root = Path.cwd()
          out = Path(proposal)
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", source, prepared]
          ).decode().split("\0")
          copied: list[str] = []
          deleted: list[str] = []
          for item in changed:
              if not item:
                  continue
              path = root / item
              if path.is_file():
                  destination = out / "files" / item
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, destination)
                  copied.append(item)
              else:
                  deleted.append(item)

          lock = root / "codex-rs" / "Cargo.lock"
          manifest = {
              "schema": 1,
              "kind": "cognitive-read-local-source-proposal",
              "qualification": False,
              "source_sha": source,
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", f"{source}^{{tree}}"], text=True
              ).strip(),
              "prepared_sha": prepared,
              "prepared_tree": subprocess.check_output(
                  ["git", "rev-parse", f"{prepared}^{{tree}}"], text=True
              ).strip(),
              "cargo_lock_sha256": hashlib.sha256(lock.read_bytes()).hexdigest(),
              "copied_files": copied,
              "deleted_files": deleted,
              "toolchain": {
                  "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
                  "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              },
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
          ) >"$PROPOSAL_DIR/generation.log" 2>&1 || status=$?
          printf '%s\n' "$status" >"$PROPOSAL_DIR/status.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo '## Local-only cognitive.read source proposal'
            echo "Input SHA: $SOURCE_SHA"
            echo "Generation status: $status"
            echo 'This independent job has contents:read, persists no checkout credential and never pushes, edits the PR, activates a flag or claims qualification.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Retain reviewable proposal artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-source-proposal-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cognitive-read-source-proposal
          if-no-files-found: error
          retention-days: 14
      - name: Enforce proposal generation
        if: always()
        env:
          STATUS: ${{ steps.proposal.outputs.status }}
        run: test "$STATUS" = '0'
