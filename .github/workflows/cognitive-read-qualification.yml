name: Cognitive read qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-cognitive-read/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-agent-protocol/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/cognitive.read/**"
      - "qualification/cognitive-read/**"
      - "scripts/emit-cognitive-read-qualification.py"
      - "scripts/run-cognitive-read-qualification.sh"
      - "scripts/verify-cognitive-read-constants.py"
      - "scripts/verify-cognitive-read-map.py"
      - "scripts/hepta-implementation-maps.py"
      - ".github/scripts/verify_cargo_workspace_manifests.py"
      - ".github/workflows/cognitive-read-qualification.yml"
      - ".github/actions/hepta-synthetic-merge/**"
  push:
    branches:
      - main
      - work/cognitive-read-production-convergence-20260927
    paths:
      - "codex-rs/hepta-cognitive-read/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-agent-protocol/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/cognitive.read/**"
      - "qualification/cognitive-read/**"
      - "scripts/emit-cognitive-read-qualification.py"
      - "scripts/run-cognitive-read-qualification.sh"
      - "scripts/verify-cognitive-read-constants.py"
      - "scripts/verify-cognitive-read-map.py"
      - "scripts/hepta-implementation-maps.py"
      - ".github/scripts/verify_cargo_workspace_manifests.py"
      - ".github/workflows/cognitive-read-qualification.yml"
      - ".github/actions/hepta-synthetic-merge/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-read-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_MIN_STACK: "8388608"

jobs:
  exact-head:
    name: Exact-head cognitive.read qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare CI tools
        uses: ./.github/actions/setup-ci

      - name: Run exact-head suite and seal evidence
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          bash scripts/run-cognitive-read-qualification.sh \
            source-head \
            "$EXPECTED_SHA" \
            .hepta-evidence/cognitive-read-source \
            exact-head

      - name: Retain immutable exact-head evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.qualification.outputs.bundle }}
            ${{ steps.qualification.outputs.bundle_sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact-head artifact digests
        if: always()
        shell: bash
        run: |
          {
            echo '## cognitive.read exact-head evidence'
            echo
            echo '- commit: `${{ github.event.pull_request.head.sha || github.sha }}`'
            echo '- GitHub artifact digest: `${{ steps.upload.outputs['artifact-digest'] }}`'
            echo '- deterministic bundle digest:'
            echo '```text'
            cat '${{ steps.qualification.outputs.bundle_sha }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact-head qualification result
        if: always()
        shell: bash
        run: test '${{ steps.qualification.outputs.failed }}' = '0'

  merge-candidate:
    name: Synthetic-merge cognitive.read qualification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Construct deterministic synthetic merge
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Cognitive Read CI
          author-email: cognitive-read-ci@users.noreply.github.com
          message: Cognitive read synthetic merge

      - name: Prepare CI tools
        uses: ./.github/actions/setup-ci

      - name: Run merge-candidate suite and seal evidence
        id: qualification
        env:
          EXPECTED_SHA: ${{ steps.synthetic.outputs.sha }}
        shell: bash
        run: |
          bash scripts/run-cognitive-read-qualification.sh \
            merge-candidate \
            "$EXPECTED_SHA" \
            .hepta-evidence/cognitive-read-merge \
            merge-candidate

      - name: Retain immutable merge-candidate evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-merge-${{ steps.synthetic.outputs.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.qualification.outputs.bundle }}
            ${{ steps.qualification.outputs.bundle_sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish merge-candidate artifact digests
        if: always()
        shell: bash
        run: |
          {
            echo '## cognitive.read synthetic-merge evidence'
            echo
            echo '- commit: `${{ steps.synthetic.outputs.sha }}`'
            echo '- GitHub artifact digest: `${{ steps.upload.outputs['artifact-digest'] }}`'
            echo '- deterministic bundle digest:'
            echo '```text'
            cat '${{ steps.qualification.outputs.bundle_sha }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce merge-candidate qualification result
        if: always()
        shell: bash
        run: test '${{ steps.qualification.outputs.failed }}' = '0'
