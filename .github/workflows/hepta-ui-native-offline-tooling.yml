name: ui.native offline tooling

on:
  push:
    branches: [work/ui-native-qualified-integration-20260928]
    paths: [.github/workflows/hepta-ui-native-offline-tooling.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-public-tooling:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned public toolchain and fetch locked native dependencies
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_HOME=/tmp/native-rustup
          export CARGO_HOME=/tmp/native-cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          source "$CARGO_HOME/env"
          rustup component add rustfmt clippy --toolchain 1.95.0
          cargo +1.95.0 fetch --manifest-path apps/hepta-native/Cargo.toml --locked
          mkdir -p /tmp/native-tooling
          rustc +1.95.0 -vV > /tmp/native-tooling/toolchain.txt
          sha256sum apps/hepta-native/Cargo.lock > /tmp/native-tooling/lock.sha256
          git rev-parse HEAD HEAD^{tree} > /tmp/native-tooling/source.txt
          # Only public compiler files and crate archives: no credentials, git
          # configuration, runtime state, environment dump or signing material.
          tar -C "$RUSTUP_HOME/toolchains" -czf /tmp/native-tooling/toolchain.tar.gz 1.95.0-x86_64-unknown-linux-gnu
          tar -C "$CARGO_HOME" -czf /tmp/native-tooling/registry.tar.gz registry
          sha256sum /tmp/native-tooling/*.tar.gz > /tmp/native-tooling/archives.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-offline-tooling-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/native-tooling
          if-no-files-found: error
          retention-days: 3
