name: Codex kernel evidence source export

on:
  push:
    branches:
      - codex/kernel-evidence-production-hardening-20260927

permissions:
  contents: read

jobs:
  export-source:
    name: Export exact branch source
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=source.tar.gz -czf source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codex-kernel-evidence-source-${{ github.sha }}
          path: source.tar.gz
          if-no-files-found: error
          retention-days: 1
