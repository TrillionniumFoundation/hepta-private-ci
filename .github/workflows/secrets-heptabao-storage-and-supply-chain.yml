name: secrets.heptabao storage and supply-chain evidence

on:
  push:
    branches:
      - codex/secrets-heptabao-production-qualified-20260930
    paths:
      - codex-rs/hepta-bao-adapter/**
      - codex-rs/Cargo.lock
      - docs/modules/secrets.heptabao/**
      - .github/workflows/secrets-heptabao-storage-and-supply-chain.yml
  pull_request:
    paths:
      - codex-rs/hepta-bao-adapter/**
      - codex-rs/Cargo.lock
      - docs/modules/secrets.heptabao/**
      - .github/workflows/secrets-heptabao-storage-and-supply-chain.yml

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-storage-supply-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Build dependency SBOM input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secrets-evidence"
          cargo metadata --locked --format-version 1 \
            --manifest-path codex-rs/hepta-bao-adapter/Cargo.toml \
            > "$RUNNER_TEMP/secrets-evidence/cargo-metadata.json"

      - name: Exercise storage qualifier on runner-local volume
        shell: bash
        run: |
          set -euo pipefail
          python3 codex-rs/hepta-bao-adapter/qa/qualify_storage_profile.py \
            --path "$RUNNER_TEMP/secrets-storage-profile" \
            --target-id "github-runner-local-nonproduction" \
            --output "$RUNNER_TEMP/secrets-evidence/storage-profile-receipt.json"

      - name: Build exact supply-chain receipt
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --output "$RUNNER_TEMP/secrets-evidence/exact-source.tar.gz" HEAD
          python3 codex-rs/hepta-bao-adapter/qa/build_supply_chain_manifest.py \
            --cargo-metadata "$RUNNER_TEMP/secrets-evidence/cargo-metadata.json" \
            --artifact "$RUNNER_TEMP/secrets-evidence/exact-source.tar.gz" \
            --output "$RUNNER_TEMP/secrets-evidence/supply-chain-receipt.json"

      - name: Verify fail-closed truth state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "secrets-evidence"
          storage = json.loads((root / "storage-profile-receipt.json").read_text())
          supply = json.loads((root / "supply-chain-receipt.json").read_text())
          assert storage["targetId"] == "github-runner-local-nonproduction"
          assert supply["released"] is False
          assert supply["productionQualified"] is False
          assert supply["sourceHeadSha"]
          assert supply["sourceTreeSha"]
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload exact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-storage-supply-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secrets-evidence
          if-no-files-found: error
          retention-days: 90
