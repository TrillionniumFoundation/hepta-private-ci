name: Automation TaskFlow export exact convergence patch

on:
  push:
    branches:
      - work/automation-taskflow-full-closure-2026-09-27
    paths:
      - .github/workflows/automation-taskflow-export-final-patch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-taskflow-export-exact-convergence-patch
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact patch payload
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-full-closure-2026-09-27
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/automation_taskflow_patch_parts
          sparse-checkout-cone-mode: false

      - name: Materialize exact observed patch bytes
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/automation-taskflow-final.patch"
          cat scripts/automation_taskflow_patch_parts/part-*.b64 \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            | gzip --decompress --stdout > "$output"
          test -s "$output"
          grep -Eq '^index [0-9a-f]+\.\.[0-9a-f]+' "$output"
          sha256sum "$output" > "$RUNNER_TEMP/patch-sha256.txt"
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/source-sha.txt"
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/source-tree.txt"

      - name: Retain exact observed patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-taskflow-exact-convergence-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/automation-taskflow-final.patch
            ${{ runner.temp }}/patch-sha256.txt
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/source-tree.txt
          if-no-files-found: error
          retention-days: 7
