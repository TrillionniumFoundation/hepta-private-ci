name: Hepta Neuron shared Q24 owner CI

on:
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      # The real native Worker test embeds Agentd's cross-crate App Server.
      - "codex-rs/hepta-agentd/src/test_support.rs"
      - ".github/workflows/hepta-neuron-shared-q24-owner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-neuron-shared-q24-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-owner:
    name: Frozen Q24 cache and worker regression (exact source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout exact PR head without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          rustc --version
          cargo --version
      - name: Check formatting on both owners
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-infer-core --package codex-hepta-infer-worker-host --package codex-hepta-agentd -- --check
      - name: Check every native target
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets
      - name: Run infer core source tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core --lib
      - name: Build exact local Codex CLI for real Agentd App Server test
        shell: bash
        run: |
          set -euo pipefail
          # Do not replace the physical CLI with the Rust test harness or
          # skip the Native App Server integration test on missing binaries.
          cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-cli --bin codex
          cli="$(pwd)/codex-rs/target/debug/codex"
          test -f "$cli"
          test -x "$cli"
          "$cli" --version
          printf 'HEPTA_COGNITIVE_TEST_CODEX_EXE=%s\n' "$cli" >> "$GITHUB_ENV"
      - name: Run worker source and public Q24 tests
        shell: bash
        run: |
          set -euo pipefail
          test -x "$HEPTA_COGNITIVE_TEST_CODEX_EXE"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-worker-host --lib
      - name: Strict correctness and resource safety Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets -- -D warnings
      - name: Preserve tested worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
