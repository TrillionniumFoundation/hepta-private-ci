name: Automation TaskFlow provider-key compatibility repair

on:
  push:
    branches:
      - work/automation-taskflow-full-closure-2026-09-27
    paths:
      - ".github/workflows/automation-taskflow-provider-key-compat.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-taskflow-map-rebind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out current work branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-full-closure-2026-09-27
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt

      - name: Apply schema-v1 provider identity repair
        run: python3 scripts/automation_taskflow_provider_key_compat_patch.py source

      - name: Format and qualify compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          (
            cd codex-rs
            cargo fmt -p codex-hepta-automation -p codex-hepta-agentd
            cargo fmt -p codex-hepta-automation -p codex-hepta-agentd -- --check
            cargo check -p codex-hepta-automation -p codex-hepta-agentd --all-targets
            cargo clippy -p codex-hepta-automation -p codex-hepta-agentd --all-targets --all-features -- -D warnings
            cargo test -p codex-hepta-automation authorized_effect
            cargo test -p codex-hepta-agentd --lib automation_effect_host
          )
          git diff --check

      - name: Commit source compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-automation-ci"
          git config user.email "hepta-automation-ci@users.noreply.github.com"
          git add \
            .github/workflows/automation-taskflow-focused.yml \
            codex-rs/hepta-agentd/src/automation_effect_host.rs \
            docs/modules/automation.taskflow/TECHNICAL.md \
            docs/modules/automation.taskflow/MIGRATION_V19_RUNBOOK.md \
            docs/modules/automation.taskflow/RELEASE_QUALIFICATION.md \
            docs/modules/automation.taskflow/SCHEMA_CONTRACT.json \
            qualification/module-execution-dossiers/detail/automation.taskflow.md \
            scripts/automation_taskflow_contract.py \
            scripts/test_automation_taskflow_contract.py
          git commit -m "fix(automation): preserve schema-v1 provider effect identity [automation-provider-key-compat]"

      - name: Rebind exact implementation map
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module automation.taskflow
          python3 scripts/automation_taskflow_provider_key_compat_patch.py map
          python3 scripts/hepta-implementation-maps.py migrate --module automation.taskflow
          python3 scripts/automation_taskflow_contract.py verify
          python3 -m unittest -v \
            scripts/test_automation_taskflow_contract.py \
            scripts/test_verify_automation_taskflow_acceptance.py
          git rm \
            .github/workflows/automation-taskflow-provider-key-compat.yml \
            scripts/automation_taskflow_provider_key_compat_patch.py
          git diff --check
          git add docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json
          git commit -m "docs(automation): rebind provider-key-compatible source identity [automation-map-rebind]"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push exact repaired branch
        env:
          TARGET_BRANCH: work/automation-taskflow-full-closure-2026-09-27
        run: git push origin "HEAD:${TARGET_BRANCH}"
