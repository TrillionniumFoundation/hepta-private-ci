name: hcsn-currentstate-n256-independent-oracle-intent

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_independent_oracle_intent/**"
      - ".github/workflows/hcsn-currentstate-n256-independent-oracle-intent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-independent-oracle-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify independent fail-closed oracle source
        run: |
          set -euo pipefail
          package=qualification/hcsn_currentstate_n256_independent_oracle_intent
          mkdir -p "$package/ci-artifact"
          /usr/bin/time -v python -m unittest \
            qualification.hcsn_currentstate_n256_independent_oracle_intent.test_static -v \
            > "$package/ci-artifact/TEST_STDOUT.txt" \
            2> "$package/ci-artifact/TEST_STDERR.txt"
          python "$package/static_inspector.py" \
            --source "$package/independent_oracle.py" \
            --admission "$package/admission.py" \
            --request "$package/REQUEST.json" \
            > "$package/ci-artifact/REPORT.json"
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          package = Path("qualification/hcsn_currentstate_n256_independent_oracle_intent")
          report = json.loads((package / "ci-artifact/REPORT.json").read_text())
          if report["status"] != "PASS_SOURCE_ONLY_HOLD_NUMERICAL":
              raise SystemExit("unexpected status")
          if any(name in sys.modules for name in ("numpy", "scipy")):
              raise SystemExit("numeric module imported by static admission")
          (package / "ci-artifact/COUNTS.json").write_text(
              json.dumps({"dynamic_runs": 0, "matrix_exponential_actions": 0, "oracle_calls": 0, "serializer_calls": 0, "torch_calls": 0, "optimizer_steps": 0}, indent=2, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hcsn-n256-independent-oracle-source-${{ github.sha }}
          path: qualification/hcsn_currentstate_n256_independent_oracle_intent/ci-artifact
          if-no-files-found: error
          retention-days: 30
