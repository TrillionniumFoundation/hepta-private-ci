name: ui.native current source export (read-only)

on:
  pull_request:
    branches: [work/ui-native-qualified-integration-20260928]
    paths:
      - .ci/ui-native-source-export-trigger/**

permissions:
  contents: read

concurrency:
  group: ui-native-current-source-export-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: true

jobs:
  export-current-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Export exact current source and tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p export
          paths=(
            apps/hepta-native/src/journal.rs
            apps/hepta-native/src/journal_storage.rs
            apps/hepta-native/src/journal_storage_tests.rs
            apps/hepta-native/src/retirement.rs
            apps/hepta-native/src/retirement_tests.rs
            apps/hepta-native/src/retirement_claim_tests.rs
            apps/hepta-native/src/ui.rs
            apps/hepta-native/src/ui/operations_view.rs
            apps/hepta-native/src/ui/task_supervisor.rs
            apps/hepta-native/src/lib.rs
            apps/hepta-native/Cargo.toml
            apps/hepta-native/DEVELOPMENT.md
            docs/modules/ui.native/TECHNICAL.md
            docs/modules/ui.native/QUALIFIED-INTEGRATION-20260928.md
            docs/modules/ui.native/IMPLEMENTATION_MAP.json
            apps/hepta-native/CURRENT_SOURCE.json
          )
          for path in "${paths[@]}"; do
            test -f "$path"
          done
          tar -czf export/ui-native-current-source.tar.gz "${paths[@]}"
          git rev-parse HEAD HEAD^{tree} > export/identity.txt
          sha256sum export/ui-native-current-source.tar.gz > export/source.sha256
          printf '%s\n' "${paths[@]}" > export/paths.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-current-source-${{ env.TARGET_SHA }}-attempt-${{ github.run_attempt }}
          path: export
          if-no-files-found: error
          retention-days: 7
