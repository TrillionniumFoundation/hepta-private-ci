name: channel.matrix one-shot finalizer

on:
  push:
    branches:
      - codex/channel-matrix-full-closure-20260927
    paths:
      - '.github/workflows/channel-matrix-one-shot-finalize.yml'
      - '.github/channel-matrix-one-shot-finalize.py'

permissions:
  contents: write

concurrency:
  group: channel-matrix-one-shot-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/channel-matrix-full-closure-20260927
          fetch-depth: 0
      - name: Require unchanged remote head
        run: |
          set -euo pipefail
          git fetch origin codex/channel-matrix-full-closure-20260927
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/channel-matrix-full-closure-20260927)"
      - name: Apply reviewed qualification fixes
        run: |
          set -euo pipefail
          python3 .github/channel-matrix-one-shot-finalize.py
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix_documentation.py' -v
          git diff --check
      - name: Commit ordinary source and remove finalizer
        run: |
          set -euo pipefail
          git config user.name 'channel.matrix finalizer'
          git config user.email 'channel-matrix@invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix(channel.matrix): close exact-candidate qualification blockers'
          git push origin HEAD:codex/channel-matrix-full-closure-20260927
