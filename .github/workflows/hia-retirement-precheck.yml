name: HIA retirement precheck contract

on:
  push:
    paths:
      - scripts/ci/check_hia_retirement_gate.py
      - scripts/ci/test_hia_retirement_gate.py
      - hia/RETIREMENT_READINESS.md
      - .github/workflows/hia-retirement-precheck.yml
  pull_request:
    paths:
      - scripts/ci/check_hia_retirement_gate.py
      - scripts/ci/test_hia_retirement_gate.py
      - hia/RETIREMENT_READINESS.md
      - .github/workflows/hia-retirement-precheck.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise fail-closed evidence and identity guards
        run: python3 -m unittest discover -s scripts/ci -p test_hia_retirement_gate.py -v
