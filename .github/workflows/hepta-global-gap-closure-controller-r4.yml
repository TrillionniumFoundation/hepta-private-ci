name: Hepta global blocker convergence controller r4

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/hepta-global-gap-closure-controller-r4.yml
      - scripts/hepta-global-gap-closure-r4.py
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: hepta-global-gap-closure-controller-r4
  cancel-in-progress: false

jobs:
  converge-r4:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HEPTA_CONVERGENCE_TARGET: integration/hepta-global-gap-closure-20260910-r4
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out exact controller source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind and syntax-check the executor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD HEAD^{tree}
          python3 -m py_compile scripts/hepta-global-gap-closure-r4.py
          rustc --version
          cargo --version

      - name: Materialize, mechanically repair and qualify the r4 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/hepta-global-gap-closure-r4.py "${RUNNER_TEMP}/hepta-global-gap-closure-r4.py"
          python3 "${RUNNER_TEMP}/hepta-global-gap-closure-r4.py"

      - name: Upload r4 convergence receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-global-gap-closure-r4-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/global-gap-closure-r4
          if-no-files-found: warn
          retention-days: 7
