name: Promote final all-branches convergence

on:
  push:
    branches:
      - ops/final-all-branches-convergence-20260908
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: promote-final-all-branches-convergence
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_BRANCH: integration/final-all-branches-main-tree-20260908
      CONTROLLER_BRANCH: ops/final-all-branches-convergence-20260908
    steps:
      - name: Wait for convergence PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          pr=''
          for _ in $(seq 1 600); do
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$CANDIDATE_BRANCH" --json number --jq '.[0].number // empty')
            [[ -n "$pr" ]] && break
            sleep 30
          done
          if [[ -z "$pr" ]]; then
            echo '::error::convergence PR was not created'
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Wait for all candidate checks and require green
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          observed=0
          for _ in $(seq 1 600); do
            json=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeable,mergeStateStatus,statusCheckRollup,headRefOid)
            count=$(jq '.statusCheckRollup | length' <<<"$json")
            pending=$(jq '[.statusCheckRollup[] | select((.status // "COMPLETED") != "COMPLETED" and (.state // "") != "SUCCESS" and (.state // "") != "FAILURE" and (.state // "") != "ERROR")] | length' <<<"$json")
            failed=$(jq '[.statusCheckRollup[] | ((.conclusion // .state // "") | ascii_upcase) | select(. == "FAILURE" or . == "ERROR" or . == "CANCELLED" or . == "TIMED_OUT" or . == "ACTION_REQUIRED" or . == "STALE")] | length' <<<"$json")
            if (( count > 0 )); then observed=1; fi
            if (( failed > 0 )); then
              gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" || true
              echo '::error::one or more candidate checks failed'
              exit 1
            fi
            mergeable=$(jq -r '.mergeable' <<<"$json")
            if (( observed == 1 && pending == 0 )) && [[ "$mergeable" != UNKNOWN ]]; then
              break
            fi
            sleep 30
          done
          if (( observed == 0 )); then
            echo '::error::no candidate checks were observed'
            exit 1
          fi
          gh pr checks "$pr" --repo "$GITHUB_REPOSITORY"

      - name: Merge through normal protected path
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify all recorded branch heads are reachable and archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-convergence-bot'
          git config user.email 'hepta-convergence-bot@users.noreply.github.com'
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          manifest=docs/archive/branch-convergence-20260908.json
          test -f "$manifest"
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          payload = json.loads(Path('docs/archive/branch-convergence-20260908.json').read_text())
          failed = []
          for item in payload['branches']:
              sha = item['sha']
              rc = subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD']).returncode
              if rc != 0:
                  failed.append((item['branch'], sha))
          if failed:
              for branch, sha in failed:
                  print(f'::error::recorded head not reachable: {branch} {sha}')
              sys.exit(1)
          print(f"verified {len(payload['branches'])} recorded branch heads")
          PY
          tag=all-branches-converged-20260908
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git tag -a "$tag" -m 'All repository branches converged into the single main history'
            git push origin "refs/tags/$tag"
          fi

      - name: Delete every non-main branch that has not moved
        shell: bash
        run: |
          set -euo pipefail
          manifest=docs/archive/branch-convergence-20260908.json
          default_branch=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')
          python3 - <<'PY' > /tmp/branches.tsv
          import json
          from pathlib import Path
          for item in json.loads(Path('docs/archive/branch-convergence-20260908.json').read_text())['branches']:
              print(f"{item['branch']}\t{item['sha']}")
          PY
          while IFS=$'\t' read -r branch recorded_sha; do
            [[ "$branch" == main || "$branch" == "$default_branch" ]] && continue
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)
            [[ -z "$current_sha" ]] && continue
            if [[ "$current_sha" != "$recorded_sha" ]]; then
              echo "::error::branch moved after convergence: $branch recorded=$recorded_sha current=$current_sha"
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done < /tmp/branches.tsv

      - name: Request main as the default branch
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')
          if [[ "$current" != main ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f default_branch=main || {
              echo '::warning::workflow token cannot administer the repository; default-branch switch must be completed by the connected administrator'
            }
          fi
