name: E3 bilingual evidence and weight regeneration
on:
  push:
    branches: [research/e3-encoder-transfer-20261123]
    paths: ['qualification/cell-e3-encoder-transfer-20261123/translation/verification/*', '.github/workflows/cell-e3-recheck-bilingual.yml']
permissions:
  contents: read
  actions: read
jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qualification/cell-e3-encoder-transfer-20261123/translation
      - uses: actions/download-artifact@v4
        with:
          name: original-flores-marian-identities
          github-token: ${{ github.token }}
          run-id: 45181970877
          path: ${{ runner.temp }}/flores
      - name: Recompute every forced and free translation score
        working-directory: qualification/cell-e3-encoder-transfer-20261123/translation
        run: |
          PYTHONPATH=. python3 verification/check_choices.py bilingual-results.zip "$RUNNER_TEMP/flores" 7a19fab2e9f6174ab9f28e0ada13ab93b6c420506441f885718fbbd38587db7c > /tmp/e3-choices.json
          cmp verification/choices.json /tmp/e3-choices.json
          PYTHONPATH=. python3 verification/check_free.py generation/free-bilingual.zip "$RUNNER_TEMP/flores" > /tmp/e3-free.json
          cmp verification/free.json /tmp/e3-free.json
  weights:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qualification/cell-e3-encoder-transfer-20261123/translation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the exact two independently packed tensor files from the original checkpoints
        working-directory: qualification/cell-e3-encoder-transfer-20261123/translation
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          python -m pip install --disable-pip-version-check numpy==2.3.5 transformers==4.57.3 accelerate tokenizers==0.22.2 sentencepiece==0.2.1 requests
          python material.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/rebuilt"
          python - "$RUNNER_TEMP/rebuilt" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          with zipfile.ZipFile("bilingual-results.zip") as a:
              freeze=json.loads(a.read("freeze.json"))
          for lang,digest in sorted(freeze["packed"].items()):
              f=pathlib.Path(sys.argv[1])/lang/"packed.safetensors"
              assert hashlib.file_digest(f.open("rb"),"sha256").hexdigest()==digest
              print(lang, f.stat().st_size, digest)
          PY
