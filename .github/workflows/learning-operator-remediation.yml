name: learning-operator-remediation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - codex/learning-operator-authoritative-convergence-20260930

permissions:
  contents: write

jobs:
  remediate:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      (github.event_name == 'push' || github.head_ref == 'codex/learning-operator-authoritative-convergence-20260930')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/learning-operator-authoritative-convergence-20260930
          fetch-depth: 0

      - name: Repair contract and refresh exact observation
        env:
          BRANCH: codex/learning-operator-authoritative-convergence-20260930
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/hepta-learning-operator-contract.py")
          text = path.read_text(encoding="utf-8")
          needle = '            "owner.revalidate_dataset_snapshot",\n'
          if text.count(needle) != 1:
              raise SystemExit("expected exactly one brittle revalidation token")
          text = text.replace(needle, "", 1)
          anchor = '        require(token in final_use, f"final-use source missing {token!r}")\n'
          if text.count(anchor) != 1:
              raise SystemExit("expected exactly one final-use token-loop anchor")
          replacement = anchor + '''    require(
              re.search(r"owner\\s*\\.\\s*revalidate_dataset_snapshot\\s*\\(", final_use)
              is not None,
              "final-use source missing durable owner snapshot revalidation",
          )
          '''
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY

          git config user.name hepta-learning-operator-remediation
          git config user.email hepta-learning-operator-remediation@users.noreply.github.com
          git rm .github/workflows/learning-operator-remediation.yml
          git add scripts/hepta-learning-operator-contract.py
          git diff --cached --check
          git commit -m "ci(learning): make durable revalidation contract rustfmt-safe"

          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          export SOURCE_SHA SOURCE_TREE
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("docs/modules/learning.operator/IMPLEMENTATION_MAP.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          document["observedAtHead"] = {
              "commit": os.environ["SOURCE_SHA"],
              "tree": os.environ["SOURCE_TREE"],
          }
          path.write_text(
              json.dumps(document, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git add docs/modules/learning.operator/IMPLEMENTATION_MAP.json
          git diff --cached --check
          git commit -m "docs(learning): refresh authoritative source observation"
          git push origin "HEAD:${BRANCH}"
