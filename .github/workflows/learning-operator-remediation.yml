name: Learning operator remediation materializer

on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths:
      - '.github/workflows/learning-operator-remediation.yml'
      - 'scripts/learning_operator_remediation.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-operator-remediation
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/learning-operator-full-convergence-20260926
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
      - name: Apply and commit convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/learning_operator_remediation.py

          # The one-shot script also prepares improved workflow definitions, but
          # the Actions installation token cannot update workflow files. Keep
          # this materialization commit scoped to source, tests, documentation,
          # status evidence, and implementation maps. Existing workflows will
          # execute those changes after the push.
          git checkout HEAD -- \
            .github/workflows/learning-operator-diagnostics.yml \
            .github/workflows/learning-operator-remediation.yml \
            scripts/learning_operator_remediation.py

          cd codex-rs
          cargo fmt -p codex-hepta-bellman-operator \
            -p codex-hepta-agentd \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-learning-ledger
          cd ..

          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add -A
          git commit \
            -m "feat(learning.operator): unify admission and executable evidence" \
            -m "Add typed admission stages and recovery dispositions, preserve owner-operation failures, add an end-to-end qualification profile, and make exact-source/merge gates execute independently with explicit status artifacts." \
            -m "Signed-off-by: OpenAI <openai@users.noreply.github.com>"

          python3 scripts/hepta-implementation-maps.py migrate \
            --module learning.operator \
            --module learning.eval
          git add \
            docs/modules/learning.operator/IMPLEMENTATION_MAP.json \
            docs/modules/learning.eval/IMPLEMENTATION_MAP.json
          git commit \
            -m "docs(learning): rebind implementation maps" \
            -m "Bind the refreshed learning.operator and learning.eval source objects to the committed remediation candidate without claiming execution or external acceptance." \
            -m "Signed-off-by: OpenAI <openai@users.noreply.github.com>"

          git push origin HEAD:codex/learning-operator-full-convergence-20260926
