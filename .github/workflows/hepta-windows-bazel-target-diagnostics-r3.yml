name: Hepta Windows Bazel target diagnostics R3

on:
  push:
    branches:
      - codex/hepta-v8-windows-bazel-diagnostics-r3-20260907
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-windows-bazel-target-diagnostics-r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: shard-2
            targets: |
              //codex-rs/hepta-memory:hepta-memory-unit-tests
              //codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests
              //codex-rs/exec-server:exec-server-file_system_windows-test-windows-cross
              //codex-rs/app-server:app-server-unit-tests
              //codex-rs/hepta-agentd:hepta-agentd-cognitive-write-qualification-test
              //codex-rs/cli:cli-sandbox_cloud_config-test-windows-cross
              //codex-rs/cli:hepta-bin-unit-tests
          - group: shard-3
            targets: |
              //codex-rs/utils/home-dir:home-dir-unit-tests
              //codex-rs/hepta-neuron:hepta-neuron-unit-tests
              //codex-rs/hepta-evidence:hepta-evidence-unit-tests
              //codex-rs/hepta-matrixd:hepta-matrixd-unit-tests
              //codex-rs/tui:tui-unit-tests
          - group: shard-4
            targets: |
              //codex-rs/hepta-operator-acceptance:hepta-operator-acceptance-tests
              //codex-rs/hepta-shadow-qualification:hepta-shadow-qualification-tests
              //codex-rs/hepta-supervisor:hepta-supervisor-unit-tests
              //codex-rs/hepta-supervisor:hepta-supervisor-robrix_control_projection-test-windows-cross
    runs-on: windows-latest
    name: Diagnose Windows Bazel failures (${{ matrix.group }})
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-test

      - name: Run each failing target with full diagnostics
        id: diagnostics
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DIAG_GROUP: ${{ matrix.group }}
          TARGETS: ${{ matrix.targets }}
        shell: bash
        run: |
          set -euo pipefail
          runner_temp_unix="$(cygpath -u "${RUNNER_TEMP}")"
          diag_root="${runner_temp_unix}/hepta-target-diagnostics/${DIAG_GROUP}"
          mkdir -p "${diag_root}/commands"
          printf 'target\texit_code\n' > "${diag_root}/results.tsv"
          mapfile -t targets < <(printf '%s\n' "${TARGETS}" | sed '/^[[:space:]]*$/d')

          failed=0
          for target in "${targets[@]}"; do
            safe_name="$(printf '%s' "${target}" | sed -E 's#^//##; s#[/:]#_#g; s#[^A-Za-z0-9_.-]#_#g')"
            log_file="${diag_root}/commands/${safe_name}.log"
            echo "::group::${target}"
            set +e
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-action-summary \
              --print-failed-test-logs \
              --windows-cross-compile \
              --remote-download-toplevel \
              -- \
              test \
              --skip_incompatible_explicit_targets \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
              --build_metadata=TAG_windows_diagnostic_group=${DIAG_GROUP} \
              -- \
              "${target}" \
              2>&1 | tee "${log_file}"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            printf '%s\t%s\n' "${target}" "${rc}" >> "${diag_root}/results.tsv"
            git status --porcelain=v1 --untracked-files=all > "${diag_root}/commands/${safe_name}.git-status.txt"
            git diff --stat HEAD > "${diag_root}/commands/${safe_name}.git-diff-stat.txt"
            git diff --binary HEAD > "${diag_root}/commands/${safe_name}.git-diff.patch"
            if [[ ${rc} -ne 0 ]]; then failed=1; fi
          done

          git status --porcelain=v1 --untracked-files=all > "${diag_root}/final-git-status.txt"
          git diff --binary HEAD > "${diag_root}/final-worktree.diff"
          exit "${failed}"

      - name: Upload target diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-windows-bazel-target-diagnostics-r3-${{ matrix.group }}
          path: ${{ runner.temp }}/hepta-target-diagnostics/${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
