name: Hepta Windows Bazel target diagnostics R3

on:
  push:
    branches:
      - codex/hepta-v8-windows-bazel-diagnostics-r3-20260907
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-windows-bazel-target-diagnostics-r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group:
          - shard-2
          - shard-3
          - shard-4
    runs-on: windows-latest
    name: Diagnose Windows Bazel failures (${{ matrix.group }})
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-test

      - name: Run each failing target with full diagnostics
        id: diagnostics
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DIAG_GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          set -euo pipefail

          case "${DIAG_GROUP}" in
            shard-2)
              targets=(
                //labs/hepta-swarm/test:test_benchmark_harness_communication
                //testing/python:0_test_hermeticity__hermeticity_test__no_external_imports
                //hepta_ingress_core:tests/test_conduit_termination.py
                //hepta_agentd:integration_tests
                //testing/taskflows/python:test_taskflow_eval_realdata
                //testing/taskflows/python:comprehensive_test
                //testing/taskflows/python-alt:workflow_scenarios_test
              )
              ;;
            shard-3)
              targets=(
                //testing/taskflows/python-alt:subtask_test
                //bindings/matrix-conduit-nosql:lib_test
                //tools/recovery:contract_tests
                //hepta_agentd:server_test
                //apps/tui:tui_test
              )
              ;;
            shard-4)
              targets=(
                //bindings/matrix-sdk-crypto-ffi:matrix_sdk_crypto_ffi_uniffi_tests
                //tools/recovery/windows_delete_verifier:delete_probe_wrapper_test
                //bindings/matrix-sdk-ffi:headers_test
                //bindings/matrix-sdk-ffi:matrix_sdk_ffi_uniffi_tests
              )
              ;;
            *)
              echo "Unknown diagnostic group: ${DIAG_GROUP}" >&2
              exit 2
              ;;
          esac

          runner_temp_unix="$(cygpath -u "${RUNNER_TEMP}")"
          diag_root="${runner_temp_unix}/hepta-target-diagnostics/${DIAG_GROUP}"
          mkdir -p "${diag_root}/commands"
          printf 'target\texit_code\n' > "${diag_root}/results.tsv"

          failed=0
          for target in "${targets[@]}"; do
            safe_name="$(printf '%s' "${target}" | sed -E 's#^//##; s#[/:]#_#g; s#[^A-Za-z0-9_.-]#_#g')"
            log_file="${diag_root}/commands/${safe_name}.log"

            echo "::group::${target}"
            set +e
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-action-summary \
              --print-failed-test-logs \
              --windows-cross-compile \
              --remote-download-toplevel \
              -- \
              test \
              --skip_incompatible_explicit_targets \
              --test_tag_filters=-argument-comment-lint \
              --test_verbose_timeout_warnings \
              --test_output=all \
              --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
              --build_metadata=TAG_windows_diagnostic_group=${DIAG_GROUP} \
              -- \
              "${target}" \
              2>&1 | tee "${log_file}"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            printf '%s\t%s\n' "${target}" "${rc}" >> "${diag_root}/results.tsv"
            git status --porcelain=v1 --untracked-files=all > "${diag_root}/commands/${safe_name}.git-status.txt"
            git diff --stat HEAD > "${diag_root}/commands/${safe_name}.git-diff-stat.txt"
            git diff --binary HEAD > "${diag_root}/commands/${safe_name}.git-diff.patch"

            if [[ ${rc} -ne 0 ]]; then
              failed=1
            fi
          done

          testlogs_root="$(bazel info bazel-testlogs)"
          printf '%s\n' "${testlogs_root}" > "${diag_root}/bazel-testlogs-root.txt"
          python - "${testlogs_root}" "${diag_root}" <<'PY'
          from __future__ import annotations

          import pathlib
          import shutil
          import subprocess
          import sys

          testlogs_root = pathlib.Path(sys.argv[1])
          diag_root = pathlib.Path(sys.argv[2])
          out_root = diag_root / "bazel-testlogs"
          max_file_bytes = 20 * 1024 * 1024

          if testlogs_root.is_dir():
              for source in testlogs_root.rglob("*"):
                  if not source.is_file():
                      continue
                  if source.name != "test.xml" and source.suffix.lower() not in {".log", ".txt"}:
                      continue
                  try:
                      size = source.stat().st_size
                  except OSError:
                      continue
                  if size > max_file_bytes:
                      continue
                  destination = out_root / source.relative_to(testlogs_root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)

          status = subprocess.run(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          (diag_root / "final-git-status.txt").write_text(status, encoding="utf-8")
          untracked_root = diag_root / "untracked-worktree-files"
          for line in status.splitlines():
              if not line.startswith("?? "):
                  continue
              relative = pathlib.Path(line[3:])
              source = pathlib.Path.cwd() / relative
              if not source.is_file():
                  continue
              try:
                  size = source.stat().st_size
              except OSError:
                  continue
              if size > max_file_bytes:
                  continue
              destination = untracked_root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY

          git diff --binary HEAD > "${diag_root}/final-worktree.diff"
          if [[ ${failed} -ne 0 ]]; then
            exit 1
          fi

      - name: Upload target diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-windows-bazel-target-diagnostics-r3-${{ matrix.group }}
          path: ${{ runner.temp }}/hepta-target-diagnostics/${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
