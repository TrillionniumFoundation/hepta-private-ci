name: hepta-cell-fast-path-actionir-p3

on:
  pull_request:
    paths:
      - "qualification/cell-fast-path-actionir-p0/**"
      - "qualification/cell-fast-path-actionir-p1/**"
      - "qualification/cell-fast-path-actionir-p2/**"
      - "qualification/cell-fast-path-actionir-p3/**"
      - ".github/workflows/hepta-cell-fast-path-actionir-p3.yml"

permissions:
  contents: read

jobs:
  rust-receipt-adapter:
    name: rust-receipt-adapter-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile contracts
        run: |
          python -m py_compile qualification/cell-fast-path-actionir-p0/cell_fast_path_actionir.py
          python -m py_compile qualification/cell-fast-path-actionir-p1/fast_path_shadow_qualification.py
          python -m py_compile qualification/cell-fast-path-actionir-p2/owner_evidence_projection.py
          python -m py_compile qualification/cell-fast-path-actionir-p3/rust_receipt_adapter.py
      - name: Run P0 through P3 contract tests
        run: |
          export PYTHONPATH=qualification/cell-fast-path-actionir-p0:qualification/cell-fast-path-actionir-p1:qualification/cell-fast-path-actionir-p2:qualification/cell-fast-path-actionir-p3
          python -m unittest discover -s qualification/cell-fast-path-actionir-p0 -p 'test_*.py' -v
          python -m unittest discover -s qualification/cell-fast-path-actionir-p1 -p 'test_*.py' -v
          python -m unittest discover -s qualification/cell-fast-path-actionir-p2 -p 'test_*.py' -v
          python -m unittest discover -s qualification/cell-fast-path-actionir-p3 -p 'test_*.py' -v
