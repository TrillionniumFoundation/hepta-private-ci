name: Merge all branches into main (one-shot 2026-09-07)

on:
  push:
    branches:
      - integration/vnext-main-20260811
    paths:
      - .github/workflows/merge-all-branches-to-main-20260907.yml
      - .github/scripts/merge-all-branches-20260907.sh

permissions:
  contents: write

concurrency:
  group: merge-all-branches-to-main-20260907
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build ancestry-complete workflow-neutral staging commit
        id: merge
        shell: bash
        env:
          TARGET_BRANCH: main
          WORKFLOW_PATH: .github/workflows/merge-all-branches-to-main-20260907.yml
          SCRIPT_PATH: .github/scripts/merge-all-branches-20260907.sh
          REPORT_PATH: ${{ runner.temp }}/merge-all-branches-report.tsv
          MERGE_LOG_PATH: ${{ runner.temp }}/merge-all-branches.log
          MANIFEST_PATH: .merge-all-branches/final-workflows.json
        run: bash .github/scripts/merge-all-branches-20260907.sh

      - name: Create exact final workflow tree and commit objects
        id: finalize
        if: steps.merge.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STAGING_HEAD: ${{ steps.merge.outputs.staging_head }}
          STAGING_TREE: ${{ steps.merge.outputs.staging_tree }}
          FULLY_MERGED_TREE: ${{ steps.merge.outputs.fully_merged_tree }}
          MANIFEST_PATH: .merge-all-branches/final-workflows.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          staging_head = os.environ["STAGING_HEAD"]
          staging_tree = os.environ["STAGING_TREE"]
          expected_tree = os.environ["FULLY_MERGED_TREE"]
          manifest = json.loads(pathlib.Path(os.environ["MANIFEST_PATH"]).read_text(encoding="utf-8"))

          if manifest.get("schema") != "org.trillionnium.merge-all-branches.workflow-transport.v1":
              raise SystemExit("unexpected workflow transport manifest schema")
          if manifest.get("fully_merged_tree") != expected_tree:
              raise SystemExit("manifest desired-tree binding mismatch")

          desired = manifest["desired"]
          desired_paths = {row["path"] for row in desired}
          entries = [
              {
                  "path": row["path"],
                  "mode": row["mode"],
                  "type": "blob",
                  "sha": row["sha"],
              }
              for row in desired
          ]
          for path in manifest["baseline_paths"]:
              if path not in desired_paths:
                  entries.append(
                      {"path": path, "mode": "100644", "type": "blob", "sha": None}
                  )
          for path in manifest["temporary_paths"]:
              entries.append(
                  {"path": path, "mode": "100644", "type": "blob", "sha": None}
              )

          def api_post(path: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "trillionnium-merge-all-branches",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API {error.code} for {path}: {body}") from error

          tree_response = api_post(
              "/git/trees",
              {"base_tree": staging_tree, "tree": entries},
          )
          final_tree = tree_response["sha"]
          if final_tree != expected_tree:
              raise SystemExit(
                  f"exact final tree mismatch: expected {expected_tree}, created {final_tree}"
              )

          commit_response = api_post(
              "/git/commits",
              {
                  "message": "merge(all-branches): finalize exact workflow tree [skip ci]",
                  "tree": final_tree,
                  "parents": [staging_head],
              },
          )
          final_commit = commit_response["sha"]

          output_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"final_commit_sha={final_commit}\n")
              output.write(f"final_tree_sha={final_tree}\n")
          print(f"Created unreferenced final commit object: {final_commit}")
          print(f"Exact final tree: {final_tree}")
          PY

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: merge-all-branches-to-main-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/merge-all-branches-report.tsv
            ${{ runner.temp }}/merge-all-branches.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        if: always()
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/merge-all-branches-report.tsv
        run: |
          {
            echo "## Merge all branches staging result"
            echo
            echo "- Main before: \`${{ steps.merge.outputs.main_before }}\`"
            echo "- Backup: \`${{ steps.merge.outputs.backup_branch }}\`"
            echo "- Staging branch: \`${{ steps.merge.outputs.staging_branch }}\`"
            echo "- Staging head: \`${{ steps.merge.outputs.staging_head }}\`"
            echo "- Staging tree: \`${{ steps.merge.outputs.staging_tree }}\`"
            echo "- Fully merged tree: \`${{ steps.merge.outputs.fully_merged_tree }}\`"
            echo "- Final commit object: \`${{ steps.finalize.outputs.final_commit_sha }}\`"
            echo "- Final tree object: \`${{ steps.finalize.outputs.final_tree_sha }}\`"
            echo "- Branch rows: \`${{ steps.merge.outputs.branch_rows }}\`"
            echo
            if [[ -f "${REPORT_PATH}" ]]; then
              echo '```tsv'
              tail -n 40 "${REPORT_PATH}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
