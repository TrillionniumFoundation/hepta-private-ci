name: platform.types convergence gates

on:
  pull_request:
    paths:
      - ".github/workflows/platform-types-convergence-gates.yml"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-wire/**"
      - "codex-rs/hepta-ndu/**"
      - "docs/modules/platform.types/**"
      - "docs/lane-a-foundation/platform.types/**"
      - "scripts/*platform_types*.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-types-convergence-gates.yml"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-wire/**"
      - "codex-rs/hepta-ndu/**"
      - "docs/modules/platform.types/**"
      - "docs/lane-a-foundation/platform.types/**"
      - "scripts/*platform_types*.py"
  merge_group:

permissions:
  contents: read

concurrency:
  group: platform-types-convergence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PLATFORM_TYPES_MSRV: "1.96.0"
  CARGO_TERM_COLOR: always

jobs:
  contract-and-migration:
    name: Exact-head documentation and legacy API contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify immutable checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Test gate diagnostics
        run: |
          python3 -m unittest \
            scripts/test_platform_types_convergence_gates.py \
            scripts/test_platform_types_generated_artifacts.py \
            scripts/test_platform_types_candidate_support.py

      - name: Verify documentation authority contract
        run: python3 scripts/check_platform_types_documentation_contract.py

      - name: Generate fail-closed exact-head status
        env:
          PLATFORM_TYPES_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLATFORM_TYPES_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python3 scripts/platform_types_implementation_status.py \
            --check \
            --emit-json .hepta-evidence/platform-types-status/status.json

      - name: Reject removed platform.types APIs
        run: python3 scripts/check_platform_types_legacy_api_usage.py

      - name: Verify structured duplicate-key classification
        run: python3 scripts/check_platform_types_structured_json_errors.py

      - name: Verify generated platform.types artifacts
        run: python3 scripts/check_platform_types_generated_artifacts.py

      - name: Preserve read-only worktree
        shell: bash
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Upload exact-head status evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-types-status-${{ github.event.pull_request.head.sha || github.sha }}
          path: .hepta-evidence/platform-types-status/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  cross-platform-smoke:
    name: Cross-platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Install pinned MSRV toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PLATFORM_TYPES_MSRV" --profile minimal --no-self-update
          rustup default "$PLATFORM_TYPES_MSRV"
          rustc --version
          cargo --version

      - name: Check platform type and wire crates
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-types \
            -p codex-hepta-wire

      - name: Preserve read-only worktree
        shell: bash
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  mandatory-consumer:
    name: Mandatory NDU consumer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Install pinned MSRV toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PLATFORM_TYPES_MSRV" --profile minimal --no-self-update
          rustup default "$PLATFORM_TYPES_MSRV"

      - name: Compile and test mandatory NDU consumer
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-ndu \
            --lib

      - name: Preserve read-only worktree
        shell: bash
        run: git diff --exit-code && test -z "$(git status --porcelain)"
