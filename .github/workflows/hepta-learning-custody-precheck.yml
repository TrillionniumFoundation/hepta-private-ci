name: Hepta learning original custody precheck (HOLD only)

on:
  pull_request:
    paths:
      - 'qualification/learning-original-custody/**'
      - '.github/workflows/hepta-learning-custody-precheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-custody-precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact original source (not synthetic merge ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false

      - name: Run synthetic refusal tests on exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'EXACT_SOURCE_HEAD=%s\n' "$SOURCE_HEAD"
          python3 --version
          python3 -m unittest discover -v -s qualification/learning-original-custody -p 'test_*.py'
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'FINAL_EXACT_SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'HOLD_ONLY=1; no owner, holdout, training or benefit qualification\n'
