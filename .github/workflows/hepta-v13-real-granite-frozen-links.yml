name: Hepta V13 frozen original Granite entity-links (research only)

on:
  push:
    branches: [research/v13-granite-relation-link-diagnostics-20261016]
    paths:
      - qualification/stem-cell-v1/v13_frozen_edge_recount.py
      - .github/workflows/hepta-v13-real-granite-frozen-links.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-v13-original-real-features-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independently-recount-original-granite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install only Torch CPU to independently reopen archived true embeddings
        run: |
          python -m pip install --disable-pip-version-check packaging==25.0 numpy==2.3.5
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Reopen exact original GitHub artifact ZIP bytes, NOT regenerated synthetic tensors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/12031109272/zip" \
            -o "$RUNNER_TEMP/original-real-granite.zip"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/12026585378/zip" \
            -o "$RUNNER_TEMP/original-public-source.zip"
          printf '%s  %s\n' \
            12af9d0a77be31b4bf6229e2ed1e58c80cff41e1380c1e1d175e79ad1ab9543f "$RUNNER_TEMP/original-real-granite.zip" \
            efee1e07fdb26cb9f3222a86244ad8a41062b0c647a3be762d76c688826995af "$RUNNER_TEMP/original-public-source.zip" \
            | sha256sum -c -
          git rev-parse HEAD > "$RUNNER_TEMP/v13-source-head.txt"
      - name: Original frozen token-link recount: 240 true source groups, 0 new model forwards
        shell: bash
        run: |
          set -euo pipefail
          python qualification/stem-cell-v1/v13_frozen_edge_recount.py \
            --features "$RUNNER_TEMP/original-real-granite.zip" \
            --public "$RUNNER_TEMP/original-public-source.zip" \
            --output "$RUNNER_TEMP/v13-source-bound-result.json" \
            2>&1 | tee "$RUNNER_TEMP/v13-real-frozen-recount.log"
          python - "$RUNNER_TEMP/v13-source-bound-result.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='hepta.v13.frozen-granite-link-recount.v1'
          assert x['original_encoder_batches']==104 and x['new_encoder_forwards']==0
          assert x['new_optimizer_steps']==0
          assert x['totals']['held_known']['correct']==1303
          assert x['totals']['held_known']['choices']==1440
          assert x['totals']['held_novel']['correct']==1387
          assert x['totals']['held_novel']['choices']==1440
          assert x['totals']['held_known']['unique_source_groups']==120
          assert x['totals']['held_novel']['unique_source_groups']==120
          assert x['grammar_supplies_relation_type_and_candidates'] is True
          assert x['whole_question_success_not_measured'] is True
          assert x['production_accepted'] is False and x['model_selected'] is False
          assert x['authority']=='DENY_ALL'
          print('INDEPENDENT_HOSTED_ORIGINAL_FROZEN_LINK_SCORE_VERIFIED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-original-granite-frozen-links-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v13-source-head.txt
            ${{ runner.temp }}/v13-source-bound-result.json
            ${{ runner.temp }}/v13-real-frozen-recount.log
          if-no-files-found: warn
          retention-days: 5
