name: Export secrets.heptabao ops closure source

on:
  push:
    branches:
      - codex/secrets-heptabao-ops-closure-build-20260929

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - name: Package bounded source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/secrets-ops-source.tar.gz" \
            codex-rs/hepta-bao-adapter \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            docs/modules/secrets.heptabao \
            docs/lane-a-foundation/secrets.heptabao \
            scripts/generate_secrets_heptabao_module.py
          sha256sum "$RUNNER_TEMP/secrets-ops-source.tar.gz" > "$RUNNER_TEMP/secrets-ops-source.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-ops-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/secrets-ops-source.tar.gz
            ${{ runner.temp }}/secrets-ops-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
