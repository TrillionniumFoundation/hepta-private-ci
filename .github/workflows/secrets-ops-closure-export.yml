name: Build secrets.heptabao SQLite product runtime

on:
  push:
    branches:
      - codex/secrets-heptabao-ops-closure-build-20260929
    paths:
      - ".github/workflows/secrets-ops-closure-export.yml"

permissions:
  contents: write

env:
  SOURCE_SHA: f169cc9f4874c7956e6ff638609fdef1b362883b
  OUTPUT_BRANCH: codex/secrets-heptabao-sqlite-product-runtime-20260929
  CARGO_TERM_COLOR: never

jobs:
  build-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out staged patch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize candidate on exact source
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .ci/secrets-heptabao-ops.patch.gz.b64 "$RUNNER_TEMP/ops.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/ops.patch.gz.b64" | gzip --decompress --stdout > "$RUNNER_TEMP/ops.patch"
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          git switch --create "$OUTPUT_BRANCH"
          git apply --index "$RUNNER_TEMP/ops.patch"
          (
            cd codex-rs
            cargo fmt -p codex-hepta-bao-adapter
          )
          git add codex-rs/hepta-bao-adapter/src
          git diff --cached --check
          git config user.name "Hepta secrets ops closure bot"
          git config user.email "hepta-secrets-ops-closure@users.noreply.github.com"
          git commit -m "secrets: wire SQLite product runtime and recovery worker"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          test -z "$(git status --porcelain)"

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -- --check 2>&1 | tee "$RUNNER_TEMP/fmt.log"

      - name: Adapter tests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$RUNNER_TEMP/adapter-tests.log"

      - name: SQLite owner tests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-state-sqlite --all-targets 2>&1 | tee "$RUNNER_TEMP/sqlite-tests.log"

      - name: AuthBus tests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-hepta-authbus --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-tests.log"

      - name: All-target check
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo check -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo clippy -p codex-hepta-bao-adapter --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"

      - name: Retain exact candidate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          cat > "$RUNNER_TEMP/evidence/candidate.json" <<EOF
          {
            "schema": "hepta.secrets-heptabao-ops-candidate.v1",
            "sourceSha": "$SOURCE_SHA",
            "candidateSha": "${{ steps.candidate.outputs.sha }}",
            "candidateTree": "${{ steps.candidate.outputs.tree }}",
            "outputBranch": "$OUTPUT_BRANCH",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunAttempt": "${{ github.run_attempt }}"
          }
          EOF
          sha256sum "$RUNNER_TEMP/evidence"/* > "$RUNNER_TEMP/evidence/SHA256SUMS"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-ops-candidate-${{ steps.candidate.outputs.sha || github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
