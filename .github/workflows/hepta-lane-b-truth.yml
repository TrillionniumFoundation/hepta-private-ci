name: Hepta Lane B repository closure

on:
  pull_request:
    paths:
      - ".github/workflows/hepta-lane-b-*.yml"
      - "qualification/lane-b/**"
      - "docs/readiness/LANE_B_*.md"
      - "docs/modules/**/IMPLEMENTATION_MAP.json"
      - "scripts/hepta-lane-b-*.py"
      - "scripts/test_hepta_lane_b_*.py"
      - "codex-rs/hepta-supervisor/**"
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/app-server/**"
      - "codex-rs/core/**"
      - "codex-rs/hepta-codex-adapter/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-inferd/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-automation/**"
      - "codex-rs/hepta-matrix-sdk/**"
      - "codex-rs/hepta-matrixd/**"
      - "apps/hepta-browser/**"
      - "apps/hepta-control-ui/**"
      - "apps/hepta-native/**"
  push:
    branches:
      - integration/vnext-main-20260811
      - "codex/hepta-lane-b-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-lane-b-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-head:
    name: Exact-head truth, maps and documents
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/hepta-lane-b-truth.py self-test
          python3 -m unittest scripts/test_hepta_lane_b_truth.py
          python3 scripts/hepta-lane-b-truth.py verify
          python3 scripts/hepta-lane-b-docs.py verify
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  node-boundaries:
    name: Browser and UI runtime boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: node --test apps/hepta-browser/test/runtime.test.js
      - run: node --test apps/hepta-control-ui/test/runtime-client.test.js
      - run: node --test apps/hepta-native/test/shell-runtime.test.js

  rust-runtime-boundaries:
    name: Fleet, inference, TaskFlow and Matrix boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fleet lease runtime
        working-directory: codex-rs
        run: cargo test -p codex-hepta-fleet --bin hepta-fleet-leased
      - name: Durable inference control
        working-directory: codex-rs
        run: cargo test -p codex-hepta-infer-core --bin hepta-infer-control
      - name: Inference worker boundary
        working-directory: codex-rs
        run: cargo test -p codex-hepta-infer-worker-host --bin hepta-infer-worker
      - name: TaskFlow runtime
        working-directory: codex-rs
        run: cargo test -p codex-hepta-automation --bin hepta-taskflow-runtime
      - name: Matrix send observer
        working-directory: codex-rs
        run: cargo test -p codex-hepta-matrixd --bin hepta-matrix-send-observer

  rust-existing-spine:
    name: Supervisor, Agentd and Codex adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Supervisor package
        working-directory: codex-rs
        run: cargo test -p codex-hepta-supervisor --lib
      - name: Agentd package
        working-directory: codex-rs
        run: cargo test -p codex-hepta-agentd --lib
      - name: Codex boundary adapter
        working-directory: codex-rs
        run: cargo test -p codex-hepta-codex-adapter

  governance-merge-candidate:
    name: Deterministic synthetic-merge governance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Construct exact synthetic merge
        id: merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME="Hepta Lane B CI"
          export GIT_AUTHOR_EMAIL="hepta-lane-b-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SHA="$(printf 'Synthetic Lane B merge for PR %s\n' "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify merge candidate
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/hepta-lane-b-truth.py self-test
          python3 -m unittest scripts/test_hepta_lane_b_truth.py
          python3 scripts/hepta-lane-b-truth.py verify
          python3 scripts/hepta-lane-b-docs.py verify
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
