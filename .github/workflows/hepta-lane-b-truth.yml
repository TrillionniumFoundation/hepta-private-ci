name: Hepta Lane B source closure

on:
  pull_request:
  push:
    branches:
      - integration/vnext-main-20260811
      - "codex/lane-b-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-lane-b-source-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-head:
    name: Verify exact Lane B source head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify source truth and generated projections
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/hepta-lane-b-truth.py self-test
          python3 -m unittest scripts/test_hepta_lane_b_truth.py
          python3 scripts/hepta-lane-b-truth.py verify
          git diff --check

      - name: Verify JavaScript runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/hepta-browser/test/runtime.test.js
          node --test apps/hepta-control-ui/test/runtime-client.test.js
          node --test apps/hepta-native/test/shell-runtime.test.js

      - name: Verify Rust formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Verify Rust Lane B owners
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-hepta-supervisor --lib
          cargo test -p codex-hepta-agentd --lib
          cargo test -p codex-hepta-fleet --bin hepta-fleet-leased
          cargo test -p codex-hepta-infer-core --bin hepta-infer-control
          cargo test -p codex-hepta-infer-worker-host --bin hepta-infer-worker
          cargo test -p codex-hepta-automation --lib
          cargo test -p codex-hepta-automation --bin hepta-taskflow-runtime
          cargo test -p codex-hepta-matrixd --lib
          cargo test -p codex-hepta-matrixd --bin hepta-matrix-send-observer
          cargo test -p codex-app-server --test all thread_start
          cargo test -p codex-app-server --test all turn_start
          cargo test -p codex-core executed_tool_calls

      - name: Assert tracked tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  merge-candidate:
    name: Verify deterministic Lane B synthetic merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Construct exact synthetic merge
        id: merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          export GIT_AUTHOR_NAME="Hepta Lane B CI"
          export GIT_AUTHOR_EMAIL="hepta-lane-b-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SHA="$(printf 'Synthetic Lane B merge for PR %s\n' "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify synthetic merge truth and tests
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
          HEPTA_SYNTHETIC_MERGE: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/hepta-lane-b-truth.py self-test
          python3 -m unittest scripts/test_hepta_lane_b_truth.py
          python3 scripts/hepta-lane-b-truth.py verify
          node --test apps/hepta-browser/test/runtime.test.js
          node --test apps/hepta-control-ui/test/runtime-client.test.js
          node --test apps/hepta-native/test/shell-runtime.test.js
          cd codex-rs
          cargo fmt --all -- --check
          cargo test -p codex-hepta-agentd --lib
          cargo test -p codex-hepta-fleet --bin hepta-fleet-leased
          cargo test -p codex-hepta-infer-core --bin hepta-infer-control
          cargo test -p codex-hepta-infer-worker-host --bin hepta-infer-worker
          cargo test -p codex-hepta-automation --bin hepta-taskflow-runtime
          cargo test -p codex-hepta-matrixd --bin hepta-matrix-send-observer
          cd ..
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
