name: Hepta Lane B implementation truth

on:
  pull_request:
  push:
    branches:
      - main
      - integration/vnext-main-20260811
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-lane-b-truth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-head:
    name: Verify exact Lane B source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Lane B implementation truth and documents
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/lane-b-source-head.log"
          status=0
          {
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || status=$?
            python3 scripts/hepta-lane-b-truth.py self-test || status=$?
            python3 -m unittest -v scripts/test_hepta_lane_b_truth.py || status=$?
            python3 scripts/hepta-lane-b-truth.py verify || status=$?
            python3 scripts/hepta-lane-b-docs.py || status=$?
            git diff --check || status=$?
            test -z "$(git status --porcelain --untracked-files=no)" || status=$?
          } 2>&1 | tee "${log}"
          exit "${status}"

      - name: Retain source-head diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-b-source-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/lane-b-source-head.log
          if-no-files-found: warn
          retention-days: 14

  merge-candidate:
    name: Verify exact Lane B merge candidate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source for deterministic merge construction
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Construct exact synthetic merge candidate
        id: merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME="Hepta Lane B CI"
          export GIT_AUTHOR_EMAIL="hepta-lane-b-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SHA="$(printf 'Synthetic Lane B merge for PR %s\n' "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify synthetic merge candidate
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/lane-b-merge-candidate.log"
          status=0
          {
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || status=$?
            python3 scripts/hepta-lane-b-truth.py self-test || status=$?
            python3 -m unittest -v scripts/test_hepta_lane_b_truth.py || status=$?
            python3 scripts/hepta-lane-b-truth.py verify || status=$?
            python3 scripts/hepta-lane-b-docs.py || status=$?
            git diff --check || status=$?
            test -z "$(git status --porcelain --untracked-files=no)" || status=$?
          } 2>&1 | tee "${log}"
          exit "${status}"

      - name: Retain merge-candidate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-b-merge-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/lane-b-merge-candidate.log
          if-no-files-found: warn
          retention-days: 14
