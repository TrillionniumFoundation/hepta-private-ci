name: Learning plasticity exact status

on:
  workflow_run:
    workflows:
      - Learning plasticity exact qualification
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: learning-plasticity-exact-status-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retain-status:
    name: Retain expiring exact-head status
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact qualified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate expiring exact-head page
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/learning_plasticity_exact_status.py \
            --lane source-head \
            --source-commit "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --ttl-seconds 86400 \
            --output "$RUNNER_TEMP/learning-plasticity-exact-head.md"
          cat "$RUNNER_TEMP/learning-plasticity-exact-head.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact-head status artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-plasticity-exact-status-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/learning-plasticity-exact-head.md
            ${{ runner.temp }}/learning-plasticity-exact-head.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve exact source
        if: always()
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
