name: hcsn-currentstate-n256-provider-fullstate-bridge

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_provider_fullstate_bridge/**"
      - ".github/workflows/hcsn-currentstate-n256-provider-fullstate-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled bridge fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_provider_fullstate_bridge.test_bridge -v
      - name: Optimized bridge fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_provider_fullstate_bridge.test_bridge -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_provider_fullstate_bridge/*.py
      - name: Verify exact frozen source and inherited originals
        run: python3 -m qualification.hcsn_currentstate_n256_provider_fullstate_bridge.verify_source
