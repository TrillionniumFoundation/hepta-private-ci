name: runtime.supervisor phase-2 source validation

on:
  push:
    branches:
      - ops/runtime-supervisor-phase2-source-validate-20260930

permissions:
  contents: read

concurrency:
  group: runtime-supervisor-phase2-source-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact validation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Decode and apply reviewed phase-2 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded = ''.join(Path('.github/runtime-supervisor/phase2_patch.b64').read_text().split())
          compressed = base64.b64decode(encoded, validate=True)
          source = gzip.decompress(compressed)
          expected = '7771d7c2742743d5e3f50ce453f1bfad7ef6ee78359248095a211276d81d08f5'
          actual = hashlib.sha256(source).hexdigest()
          if actual != expected:
              raise SystemExit(f'phase-2 payload digest mismatch: {actual}')
          target = Path('scripts/.runtime_supervisor_phase2_author.py')
          target.write_bytes(source)
          PY
          python3 -m py_compile scripts/.runtime_supervisor_phase2_author.py
          python3 scripts/.runtime_supervisor_phase2_author.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-supervisor
          git diff --check
          git diff --name-status > .hepta-evidence/changed-files.txt
          git diff --stat > .hepta-evidence/diff-stat.txt
          git diff --binary > .hepta-evidence/phase2-formatted.patch
          sha256sum .hepta-evidence/phase2-formatted.patch > .hepta-evidence/phase2-formatted.patch.sha256

      - name: Test phase-2 source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-supervisor -- --check
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-supervisor --lib
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-supervisor --all-targets -- -D warnings

      - name: Capture failure evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p .hepta-evidence
          git diff --check > .hepta-evidence/diff-check.txt 2>&1 || true
          git diff --name-status > .hepta-evidence/changed-files.txt || true
          git diff --stat > .hepta-evidence/diff-stat.txt || true
          git diff --binary > .hepta-evidence/phase2-formatted.patch || true
          sha256sum .hepta-evidence/phase2-formatted.patch > .hepta-evidence/phase2-formatted.patch.sha256 || true

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-supervisor-phase2-source-validation-${{ github.sha }}
          path: .hepta-evidence/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
