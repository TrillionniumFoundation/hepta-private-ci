name: Repair cognitive.read exact candidate

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
    paths:
      - ".github/workflows/cognitive-read-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-read-exact-repair-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RUST_MIN_STACK: "8388608"
  TARGET_BRANCH: work/cognitive-read-production-convergence-20260927
  SOURCE_SHA: ${{ github.sha }}

jobs:
  repair:
    name: Repair and seal exact cognitive.read candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Install pinned repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103

      - name: Repair qualification inputs and regenerate the lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cognitive Read Exact Repair'
          git config user.email 'cognitive-read-exact-repair@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git switch -C "$TARGET_BRANCH"

          python3 - <<'PY'
          from pathlib import Path

          evidence = Path("scripts/cognitive_read_evidence.py")
          body = evidence.read_text(encoding="utf-8")
          old = r'''        if label == "test-runner":
              runner = log.read_text(errors="replace").strip()
              version = re.escape(NEXTEST_VERSION)
              if re.fullmatch(rf"cargo-nextest {version}(?:[ \t][^\r\n]*)?", runner) is None:
                  problems.append("test-runner: missing or unexpected pinned nextest version")
          '''
          new = r'''        if label == "test-runner":
              runner_lines = log.read_text(errors="replace").splitlines()
              first_line = runner_lines[0].strip() if runner_lines else ""
              version = re.escape(NEXTEST_VERSION)
              if re.fullmatch(rf"cargo-nextest {version}(?:[ \t][^\r\n]*)?", first_line) is None:
                  problems.append("test-runner: missing or unexpected pinned nextest version")
          '''
          if body.count(old) != 1:
              raise SystemExit("nextest validation block did not match exactly once")
          evidence.write_text(body.replace(old, new), encoding="utf-8")

          tests = Path("scripts/test_cognitive_read_evidence.py")
          body = tests.read_text(encoding="utf-8")
          anchor = '''    def test_complete_evidence_is_accepted(self):
              self.assertEqual(validate_evidence(self.evidence, self.required), [])

          '''
          addition = '''    def test_pinned_nextest_multiline_version_is_accepted(self):
              (self.evidence / "test-runner.log").write_text(
                  f"cargo-nextest {NEXTEST_VERSION} (revision)\\n"
                  f"release: {NEXTEST_VERSION}\\n"
                  "host: x86_64-unknown-linux-gnu\\n"
              )
              self.assertEqual(validate_evidence(self.evidence, self.required), [])

          '''
          if body.count(anchor) != 1:
              raise SystemExit("evidence regression anchor did not match exactly once")
          tests.write_text(body.replace(anchor, anchor + addition), encoding="utf-8")
          PY

          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --format-version=1 --all-features \
            --filter-platform x86_64-unknown-linux-gnu >/dev/null
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --format-version=1 --all-features \
            --filter-platform aarch64-unknown-linux-gnu >/dev/null
          rm -f codex-rs/hepta-cognitive-read/fuzz/Cargo.lock
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff --check
          git add -A
          git diff --cached --quiet || \
            git commit -m 'fix(cognitive.read): repair exact qualification inputs'

      - name: Rebind exact source objects
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/cognitive_read_converge.py.xz.b64.0[0-3] \
            | base64 --decode \
            | xz --decompress > "$RUNNER_TEMP/cognitive_read_converge.py"
          python3 -m py_compile "$RUNNER_TEMP/cognitive_read_converge.py"
          python3 "$RUNNER_TEMP/cognitive_read_converge.py" rebind-maps \
            | tee "$RUNNER_TEMP/rebound-maps.json"
          git diff --check
          git add docs/modules
          git diff --cached --quiet || \
            git commit -m 'docs(cognitive.read): rebind repaired qualification inputs'

      - name: Verify repaired candidate before push
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          python3 scripts/verify-cognitive-read-constants.py
          python3 scripts/verify-cognitive-read-map.py --expected-sha "$candidate"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$candidate" \
            --expected-tree "$tree"
          python3 scripts/cognitive_read_consumers.py \
            --expected-sha "$candidate" \
            --output "$RUNNER_TEMP/cognitive-read-consumers.json"
          PYTHONPATH=scripts python3 -m unittest discover \
            -s scripts -p 'test_cognitive_read_*.py'
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-worker-host \
            --all-targets
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-cognitive-read \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-worker-host \
            --all-targets -- -D warnings
          just test --locked -p codex-hepta-cognitive-read --no-tests=fail
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retire bootstrap and push sealed candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/cognitive_read_converge.py.xz.b64.* \
            .github/workflows/cognitive-read-convergence-diagnostic.yml \
            .github/workflows/cognitive-read-repair.yml
          git add -A
          git commit -m 'ci(cognitive.read): retire exact repair bootstrap'

          python3 "$RUNNER_TEMP/cognitive_read_converge.py" rebind-maps \
            | tee "$RUNNER_TEMP/rebound-final-maps.json"
          git diff --check
          git add docs/modules
          git diff --cached --quiet || \
            git commit -m 'docs(cognitive.read): seal final source identities'

          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          python3 scripts/verify-cognitive-read-map.py --expected-sha "$candidate"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$candidate" \
            --expected-tree "$tree"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:$TARGET_BRANCH"
