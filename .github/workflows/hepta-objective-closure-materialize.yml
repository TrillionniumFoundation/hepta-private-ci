# closure-trigger: durable-proof-and-evidence-pocket4-r5-20260927
name: Hepta objective compiler closure materializer

on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927
    paths:
      - .github/workflows/hepta-objective-closure-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-objective-production-convergence
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 150
    env:
      TARGET_BRANCH: work/objective-compiler-production-convergence-20260927
      TRIGGER_SHA: ${{ github.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: /tmp/hepta-objective-compiler-materialize
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Bind exact source and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRIGGER_SHA}"
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${TRIGGER_SHA}"
          test -z "$(git status --porcelain)"
          rm -rf "${CARGO_TARGET_DIR}"
          git rev-parse HEAD HEAD^{tree}

      - name: Make the one-shot migration re-entrant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/hepta-objective-materialize-closure.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, observed {count}: {old!r}")
              write(path, text.replace(old, new, 1))
          '''
          new = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return
              if count == 0 and path == ".github/workflows/hepta-objective-admission.yml":
                  if old == "          python3 scripts/hepta-implementation-maps.py verify\\n":
                      marker = "          python3 scripts/hepta-objective-target-measure.py --self-test\\n"
                      state_check = "          python3 scripts/hepta-objective-current-state.py verify\\n"
                      if state_check not in text:
                          if marker not in text:
                              raise SystemExit(f"{path}: target-host recorder marker is absent")
                          write(path, text.replace(marker, state_check + marker, 1))
                      return
                  if old == "      - scripts/hepta-implementation-maps.py\\n":
                      state_path = "      - scripts/hepta-objective-current-state.py\\n"
                      if state_path not in text:
                          write(path, text.replace(old, old + state_path, 1))
                      return
              if count == 0 and new in text:
                  return
              raise SystemExit(f"{path}: expected one replacement, observed {count}: {old!r}")
          '''
          old_count = '''def replace_count(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} replacements, observed {count}: {old!r}"
                  )
              write(path, text.replace(old, new))
          '''
          new_count = '''def replace_count(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count == expected:
                  write(path, text.replace(old, new))
                  return
              if count == 0 and text.count(new) == expected:
                  return
              raise SystemExit(
                  f"{path}: expected {expected} replacements, observed {count}: {old!r}"
              )
          '''
          if old not in text or old_count not in text:
              raise SystemExit("objective closure helper shape changed")
          path.write_text(
              text.replace(old, new, 1).replace(old_count, new_count, 1),
              encoding="utf-8",
          )
          PY

      - name: Materialize durable proof and end-to-end evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-objective-materialize-closure.py
          python3 scripts/hepta-objective-evidence-materialize.py
          python3 scripts/hepta-objective-current-state.py sync
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-objective \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-intelligence \
            --package codex-hepta-agentd
          mkdir -p codex-rs/hepta-intelligence/tests/fixtures
          HEPTA_OBJECTIVE_GOLDEN_OUTPUT="${GITHUB_WORKSPACE}/codex-rs/hepta-intelligence/tests/fixtures/objective_end_to_end_v1.txt" \
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-intelligence \
              update_objective_end_to_end_golden_vector_v1 -- \
              --ignored --nocapture
          test -s codex-rs/hepta-intelligence/tests/fixtures/objective_end_to_end_v1.txt
          git diff --check

      - name: Validate generated source before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-objective-current-state.py \
            scripts/hepta-objective-materialize-closure.py \
            scripts/hepta-objective-evidence-materialize.py \
            scripts/hepta-objective-release-gate.py
          python3 scripts/hepta-objective-current-state.py verify
          python3 scripts/hepta-objective-release-gate.py verify-source
          python3 -m unittest -v \
            scripts.test_hepta_objective_contracts \
            scripts.test_hepta_objective_target_measure \
            scripts.test_hepta_objective_release_gate
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-objective -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-learning-ledger run_start -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-intelligence objective_run -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-agentd objective_runtime -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-agentd objective_run_start_checkpoint -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-agentd --test objective_product_e2e -- --nocapture

      - name: Commit source closure and retire one-shot writers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-qualification
          git config user.email qualification@invalid
          git rm \
            .github/workflows/hepta-objective-closure-materialize.yml \
            .github/workflows/hepta-objective-production-convergence.yml \
            scripts/hepta-objective-materialize-closure.py \
            scripts/hepta-objective-evidence-materialize.py
          git add -A
          git diff --cached --check
          git commit -m "objective.compiler: persist proof-bound admission and end-to-end evidence"

      - name: Rebind exact-source provenance and generated status
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 scripts/hepta-implementation-maps.py migrate --module objective.compiler
          python3 scripts/hepta-objective-current-state.py sync
          git add \
            docs/modules/objective.compiler/CURRENT_STATE.json \
            docs/modules/objective.compiler/IMPLEMENTATION_MAP.json \
            docs/modules/objective.compiler/TECHNICAL.md \
            qualification/module-execution-dossiers/detail/objective.compiler.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "objective.compiler: rebind exact-head provenance and generated status"
          fi

      - name: Qualify the exact generated candidate
        shell: bash
        run: |
          set -euo pipefail
          QUALIFIED_SHA="$(git rev-parse HEAD)"
          QUALIFIED_TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-implementation-maps.py verify --module objective.compiler \
            --expected-sha "${QUALIFIED_SHA}" --expected-tree "${QUALIFIED_TREE}"
          python3 scripts/hepta-objective-current-state.py verify
          python3 scripts/hepta-objective-release-gate.py verify-source
          python3 -m unittest -v scripts.test_hepta_objective_release_gate
          python3 scripts/hepta-objective-target-measure.py --self-test
          python3 scripts/hepta-lane-d-semantic-conformance.py self-test
          python3 scripts/hepta-lane-d-semantic-conformance.py verify
          python3 scripts/verify_cargo_lock.py
          cargo test --manifest-path codex-rs/Cargo.toml --locked --no-run \
            -p codex-hepta-objective -p codex-hepta-learning-ledger \
            -p codex-hepta-intelligence -p codex-hepta-agentd
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-objective -p codex-hepta-learning-ledger \
            -p codex-hepta-intelligence -p codex-hepta-agentd \
            --all-targets --no-deps -- -D warnings
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-objective --package codex-hepta-learning-ledger \
            --package codex-hepta-intelligence --package codex-hepta-agentd -- --check
          git diff --check
          test -z "$(git status --porcelain)"
          printf 'QUALIFIED_SHA=%s\nQUALIFIED_TREE=%s\n' "${QUALIFIED_SHA}" "${QUALIFIED_TREE}"

      - name: Push only if the remote source is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${TRIGGER_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"
