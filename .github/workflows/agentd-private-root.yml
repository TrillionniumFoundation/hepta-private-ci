name: Agentd private grant original UID0 fixture
on:
  push:
    branches: ["diagnostic/agentd-private-root-20261123"]
permissions:
  contents: read
env:
  BASE: dafb12e11e7d95ffb9c5eb6d256223d6fd45ac34
  CANDIDATE: a05921f391788684fbe9e76b8cf58211cb3080b7
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: bazel
      deployment: false
    env:
      CODEX_BAZEL_LINUX_TARGET_PLATFORM: "@rules_rs//rs/platforms:x86_64-unknown-linux-musl"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 9
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-musl
          cache-scope: bazel-test
      - name: Materialize both exact product worktrees and verify original fixtures
        run: bash .github/scripts/agentd-private-tree-pair.sh
      - name: Build and save two source-specific original libtest ELFs
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          for arm in base candidate; do
            cd "$RUNNER_TEMP/source-private-$arm"
            ./.github/scripts/run-bazel-ci.sh --remote-download-toplevel --print-failed-action-summary -- build --show_result=1 --color=no --curses=no -- //codex-rs/hepta-agentd:hepta-agentd-unit-tests-bin |& tee "$RUNNER_TEMP/private16-evidence/build-$arm.log"
            binary=$(sed -nE 's/^  (bazel-bin\/[^ ]+)$/\1/p' "$RUNNER_TEMP/private16-evidence/build-$arm.log" | tail -1)
            test -n "$binary" && test -x "$binary"
            cp -L "$binary" "$RUNNER_TEMP/agentd-private-$arm"
            file "$RUNNER_TEMP/agentd-private-$arm"
            sha256sum "$RUNNER_TEMP/agentd-private-$arm"
            git diff --exit-code
          done
      - name: Verify previous ELF hashes and run the ignored original case under actual UID0
        run: python3 .github/scripts/agentd-private-root.py
      - name: Upload original compiler and native execution evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: private16-root-${{ env.CANDIDATE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private16-evidence
          if-no-files-found: error
