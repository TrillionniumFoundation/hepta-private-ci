name: Matrix SDK compatibility
on:
  pull_request:
    paths:
      - "codex-rs/hepta-matrix*/**"
      - "codex-rs/third_party/**"
      - "codex-rs/Cargo.*"
      - "codex-rs/rust-toolchain.toml"
      - "qualification/matrix-sdk-019/**"
      - ".github/workflows/matrix-sdk-upgrade.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-protocol:
    name: Matrix SDK (${{ matrix.qualification }})
    strategy:
      fail-fast: false
      matrix:
        qualification: [crypto-migration, synapse-protocol]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      HEPTA_SDK_ARTIFACTS: ${{ github.workspace }}/sdk-qualification-artifacts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          components: clippy
      - name: Install pinned official test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Real SDK 0.18 data-bearing crypto migration
        if: matrix.qualification == 'crypto-migration'
        run: qualification/matrix-sdk-019/run-crypto-migration.sh
      - name: Real isolated encrypted send, sync and store reopen
        if: matrix.qualification == 'synapse-protocol'
        run: codex-rs/hepta-matrix-sdk/tests/support/run-synapse-sdk.sh
      - name: Strict final-source Matrix lint
        if: matrix.qualification == 'synapse-protocol'
        working-directory: codex-rs
        run: just clippy -p codex-hepta-matrix-sdk -p codex-hepta-matrix-store -p codex-hepta-matrix-protocol --features crypto-migration-qualification,synapse-sdk-qualification --no-deps -- -D warnings
      - name: Preserve protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matrix-sdk-${{ matrix.qualification }}-evidence
          path: sdk-qualification-artifacts


  current-main:
    name: Matrix exact-current-main merge regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact source with complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate GitHub prospective merge tree and current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA" && test -n "$BASE_SHA" && test -n "$PR_NUMBER"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          gh_ref="$(gh api "repos/$REPO/git/ref/pull/$PR_NUMBER/merge")"
          merge_sha="$(jq -er '.object.sha' <<<"$gh_ref")"
          merge_commit="$(gh api "repos/$REPO/git/commits/$merge_sha")"
          mapfile -t parents < <(jq -r '.parents[].sha' <<<"$merge_commit")
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_SHA"
          test "${parents[1]}" = "$SOURCE_SHA"
          expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          test "$expected_tree" = "$(jq -er '.tree.sha' <<<"$merge_commit")"
          printf 'EXPECTED_MERGE_TREE=%s\n' "$expected_tree" >> "$GITHUB_ENV"
      - name: Construct locally verified exact prospective merge
        id: candidate
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Matrix CI
          author-email: hepta-matrix-ci@users.noreply.github.com
          message: Matrix prospective merge
      - name: Bind regression test to exact two-parent merge
        env:
          TESTED_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_MERGE_TREE"
          test "$(git rev-list --parents -n 1 HEAD)" = "$TESTED_SHA $BASE_SHA $SOURCE_SHA"
          git diff --check
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Run real locked Matrix regressions on exact main merge
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-matrix-protocol -p codex-hepta-matrix-sdk -p codex-hepta-matrix-store -p codex-hepta-matrixd
      - name: Verify tested source tree remains unchanged
        env:
          TESTED_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_MERGE_TREE"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
