name: Matrix SDK compatibility
on:
  pull_request:
    paths:
      - "codex-rs/hepta-matrix*/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/third_party/**"
      - "codex-rs/Cargo.*"
      - "codex-rs/rust-toolchain.toml"
      - "qualification/matrix-sdk-019/**"
      - ".github/workflows/matrix-sdk-upgrade.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-advisory-audit:
    name: Matrix exact-head cargo-deny (no advisory waivers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Matrix source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify locked source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -s codex-rs/Cargo.lock
          git diff --check
      - uses: ./.github/actions/setup-ci-build
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
      - name: Check live advisories and exact locked dependency graph
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246
        with:
          rust-version: 1.96.0
          manifest-path: ./codex-rs/Cargo.toml
      - name: Verify cargo-deny did not alter tracked sources
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code

  sdk-protocol:
    name: Matrix SDK (${{ matrix.qualification }})
    strategy:
      fail-fast: false
      matrix:
        qualification: [crypto-migration, synapse-protocol]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      HEPTA_SDK_ARTIFACTS: ${{ github.workspace }}/sdk-qualification-artifacts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          components: clippy
      - name: Install pinned official test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Real SDK 0.18 data-bearing crypto migration
        if: matrix.qualification == 'crypto-migration'
        run: qualification/matrix-sdk-019/run-crypto-migration.sh
      - name: Real isolated encrypted send, sync and store reopen
        if: matrix.qualification == 'synapse-protocol'
        run: codex-rs/hepta-matrix-sdk/tests/support/run-synapse-sdk.sh
      - name: Strict final-source Matrix lint
        if: matrix.qualification == 'synapse-protocol'
        working-directory: codex-rs
        run: just clippy -p codex-hepta-matrix-sdk -p codex-hepta-matrix-store -p codex-hepta-matrix-protocol --features crypto-migration-qualification,synapse-sdk-qualification --no-deps -- -D warnings
      - name: Preserve protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matrix-sdk-${{ matrix.qualification }}-evidence
          path: sdk-qualification-artifacts

  current-main:
    name: Matrix exact-current-main merge regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact source with complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate GitHub prospective merge tree and current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA" && test -n "$PR_NUMBER"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # Verify both GitHub PR-base and live-main merge trees. A stacked
          # PR's GitHub pull/<id>/merge ref targets its actual parent branch,
          # NOT main. Confusing those identities invalidates P0 qualification.
          current_main="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          live_pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          live_base="$(jq -er '.base.sha' <<<"$live_pr")"
          live_head="$(jq -er '.head.sha' <<<"$live_pr")"
          live_base_ref="$(jq -er '.base.ref' <<<"$live_pr")"
          [[ "$live_base" =~ ^[0-9a-f]{40}$ ]]
          [[ "$live_head" =~ ^[0-9a-f]{40}$ ]]
          test "$live_head" = "$SOURCE_SHA"
          if [[ "$live_base" != "$BASE_SHA" ]]; then
            echo "::error::PR base moved; requalify with a fresh event" >&2
            exit 1
          fi
          git cat-file -e "$current_main^{commit}"
          git cat-file -e "$live_base^{commit}"
          gh_ref="$(gh api "repos/$REPO/git/ref/pull/$PR_NUMBER/merge")"
          merge_sha="$(jq -er '.object.sha' <<<"$gh_ref")"
          merge_commit="$(gh api "repos/$REPO/git/commits/$merge_sha")"
          mapfile -t parents < <(jq -r '.parents[].sha' <<<"$merge_commit")
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$live_base"
          test "${parents[1]}" = "$SOURCE_SHA"
          pr_tree="$(jq -er '.tree.sha' <<<"$merge_commit")"
          expected_pr_tree="$(git merge-tree --write-tree "$live_base" "$SOURCE_SHA")"
          test "$pr_tree" = "$expected_pr_tree"
          expected_tree="$(git merge-tree --write-tree "$current_main" "$SOURCE_SHA")"
          [[ "$expected_tree" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$live_base_ref" = main ]]; then
            test "$live_base" = "$current_main"
            test "$pr_tree" = "$expected_tree"
          else
            echo "::notice::Stacked PR base $live_base_ref independently checked; testing exact live-main merge"
          fi
          # Synthetic merge and all subsequent tests use current main even
          # when this review PR is deliberately stacked on a Draft parent.
          BASE_SHA="$current_main"
          printf 'BASE_SHA=%s\n' "$BASE_SHA" >> "$GITHUB_ENV"
          printf 'EXPECTED_MERGE_TREE=%s\n' "$expected_tree" >> "$GITHUB_ENV"
      - name: Construct locally verified exact prospective merge
        id: candidate
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Matrix CI
          author-email: hepta-matrix-ci@users.noreply.github.com
          message: Matrix prospective merge
      - name: Bind regression test to exact two-parent merge
        env:
          TESTED_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_MERGE_TREE"
          test "$(git rev-list --parents -n 1 HEAD)" = "$TESTED_SHA $BASE_SHA $SOURCE_SHA"
          git diff --check
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Run real locked Matrix regressions on exact main merge
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-matrix-protocol -p codex-hepta-matrix-sdk -p codex-hepta-matrix-store -p codex-hepta-matrixd
      - name: Verify tested source tree remains unchanged
        env:
          TESTED_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_MERGE_TREE"
          test "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$BASE_SHA"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
