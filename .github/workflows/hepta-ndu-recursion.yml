name: Hepta NDU recursion (read-only)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-control-plane/**"
      - "codex-rs/hepta-intelligence-eval/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence/**"
      - "docs/modules/utility.ndu/**"
      - "docs/modules/learning.eval/**"
      - "docs/modules/intelligence.control/**"
      - "docs/readiness/LANE_D_MATURITY.json"
      - "docs/readiness/NDU_SYSTEM_EXECUTION.md"
      - "docs/learning/NDU_FBSDE_SPEC.md"
      - "qualification/module-execution-dossiers/detail/utility.ndu.md"
      - "qualification/module-execution-dossiers/detail/learning.eval.md"
      - "qualification/module-execution-dossiers/detail/intelligence.control.md"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - ".github/workflows/hepta-ndu-recursion.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-control-plane/**"
      - "codex-rs/hepta-intelligence-eval/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence/**"
      - "docs/modules/utility.ndu/**"
      - "docs/modules/learning.eval/**"
      - "docs/modules/intelligence.control/**"
      - "docs/readiness/LANE_D_MATURITY.json"
      - "docs/readiness/NDU_SYSTEM_EXECUTION.md"
      - "docs/learning/NDU_FBSDE_SPEC.md"
      - "qualification/module-execution-dossiers/detail/utility.ndu.md"
      - "qualification/module-execution-dossiers/detail/learning.eval.md"
      - "qualification/module-execution-dossiers/detail/intelligence.control.md"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - ".github/workflows/hepta-ndu-recursion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-ndu-recursion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ndu:
    name: NDU (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind source and optional synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              BASE_SHA=$(git rev-parse "$SOURCE_SHA^")
            fi
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}

      - name: Verify Cargo lockfile integrity
        run: python3 scripts/verify_cargo_lock.py

      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Locked all-target compilation
        working-directory: codex-rs
        run: |
          cargo check --locked -p codex-hepta-ndu --all-targets
          cargo check --locked -p codex-hepta-intelligence-eval --all-targets
          cargo check --locked -p codex-hepta-learning-artifacts --all-targets
          cargo check --locked -p codex-hepta-intelligence --all-targets

      - name: Regression tests
        working-directory: codex-rs
        run: |
          just test --locked -p codex-hepta-ndu
          just test --locked -p codex-hepta-intelligence-eval
          just test --locked -p codex-hepta-learning-artifacts
          just test --locked -p codex-hepta-intelligence

      - name: Control product-caller regressions
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-control-plane

      - name: Strict lint
        working-directory: codex-rs
        run: |
          cargo clippy --locked -p codex-hepta-ndu --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-control-plane --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-intelligence-eval --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-learning-artifacts --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-intelligence --all-targets -- -D warnings

      - name: Formatting check without source mutation
        if: always()
        working-directory: codex-rs
        run: |
          cargo fmt --package codex-hepta-ndu -- --check
          cargo fmt --package codex-hepta-control-plane -- --check
          cargo fmt --package codex-hepta-intelligence-eval -- --check
          cargo fmt --package codex-hepta-learning-artifacts -- --check
          cargo fmt --package codex-hepta-intelligence -- --check

      - name: Preserve exact source state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
