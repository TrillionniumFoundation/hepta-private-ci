      - "scripts/hepta-ndu-mounted-filesystem.py"
      - "scripts/test_hepta_ndu_mounted_filesystem.py"
      - "scripts/hepta-ndu-source-policy.py"
      - ".github/workflows/hepta-ndu-recursion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-ndu-recursion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.pin.outputs.source }}
      base: ${{ steps.pin.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: pin
        env:
          BASE: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse refs/remotes/origin/main)
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
  qualify:
    needs: resolve
    name: NDU ${{ matrix.lane }} / ${{ matrix.suite }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
        suite: [source, core, callers, product, lint, host]
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source }}
      BASE_SHA: ${{ needs.resolve.outputs.base }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact candidate or deterministic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            test "$(git cat-file -t "$BASE_SHA")" = commit
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}
      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
          checksum: true
      - name: Execute independent suite and retain every exit status
        shell: bash
        run: |
          python3 scripts/hepta-ndu-qualification.py \
            --suite '${{ matrix.suite }}' --lane '${{ matrix.lane }}' \
            --output '${{ runner.temp }}/ndu-${{ matrix.lane }}-${{ matrix.suite }}'
      - name: Retain exact-candidate execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-${{ matrix.lane }}-${{ matrix.suite }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-${{ matrix.lane }}-${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 30
  ndu:
    name: NDU (${{ matrix.lane }})
    if: always()
    needs: qualify
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        lane: [source-head, synthetic-merge]
    steps:
      - name: Require every independently executed suite
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
  aggregate:
    needs: [resolve, qualify]
    runs-on: ubuntu-22.04
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source }}
      BASE_SHA: ${{ needs.resolve.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ndu-*-*-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-evidence
      - name: Verify twelve suites, exact identities and every retained checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
          export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
          export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
          export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
          MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
          python3 scripts/hepta_ndu_evidence.py aggregate --root "$RUNNER_TEMP/ndu-evidence" --source "$SOURCE_SHA" --base "$BASE_SHA" --merge "$MERGE" --output "$RUNNER_TEMP/ndu-evidence/aggregate.json"
          python3 scripts/hepta_ndu_evidence.py seal --root "$RUNNER_TEMP/ndu-evidence"
          python3 scripts/hepta_ndu_evidence.py verify --root "$RUNNER_TEMP/ndu-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-qualified-evidence-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-evidence/
          if-no-files-found: error
          retention-days: 30
