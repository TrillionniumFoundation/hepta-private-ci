name: Hepta NDU recursion (read-only)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-intelligence/src/ndu_stochastic_admission.rs"
      - "codex-rs/hepta-intelligence/src/ndu_stochastic_admission_tests.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_convergence.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_convergence_tests.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_well_posedness.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_well_posedness_tests.rs"
      - "codex-rs/hepta-learning-artifacts/src/pinned.rs"
      - "codex-rs/hepta-learning-ledger/src/signed_evidence.rs"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-control-plane/src/planner_ndu.rs"
      - "codex-rs/hepta-control-plane/src/planner_ndu_tests.rs"
      - "codex-rs/hepta-control-plane/src/planner_context.rs"
      - "codex-rs/hepta-control-plane/src/planner_context_tests.rs"
      - "docs/modules/utility.ndu/**"
      - "docs/readiness/LANE_D_MATURITY.json"
      - "docs/readiness/NDU_SYSTEM_EXECUTION.md"
      - "docs/learning/NDU_FBSDE_SPEC.md"
      - "qualification/module-execution-dossiers/detail/utility.ndu.md"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - "scripts/hepta-ndu-source-policy.py"
      - ".github/workflows/hepta-ndu-recursion.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-intelligence/src/ndu_stochastic_admission.rs"
      - "codex-rs/hepta-intelligence/src/ndu_stochastic_admission_tests.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_convergence.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_convergence_tests.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_well_posedness.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_well_posedness_tests.rs"
      - "codex-rs/hepta-learning-artifacts/src/pinned.rs"
      - "codex-rs/hepta-learning-ledger/src/signed_evidence.rs"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-control-plane/src/planner_ndu.rs"
      - "codex-rs/hepta-control-plane/src/planner_ndu_tests.rs"
      - "codex-rs/hepta-control-plane/src/planner_context.rs"
      - "codex-rs/hepta-control-plane/src/planner_context_tests.rs"
      - "docs/modules/utility.ndu/**"
      - "docs/readiness/LANE_D_MATURITY.json"
      - "docs/readiness/NDU_SYSTEM_EXECUTION.md"
      - "docs/learning/NDU_FBSDE_SPEC.md"
      - "qualification/module-execution-dossiers/detail/utility.ndu.md"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - "scripts/hepta-ndu-source-policy.py"
      - ".github/workflows/hepta-ndu-recursion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-ndu-recursion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ndu:
    name: NDU (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind source and optional synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              BASE_SHA=$(git rev-parse "$SOURCE_SHA^")
            fi
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}

      - name: Verify Cargo lockfile integrity
        run: python3 scripts/verify_cargo_lock.py

      - name: Reject new legacy NDU evaluator callers
        run: python3 scripts/hepta-ndu-source-policy.py

      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Locked all-target compilation
        working-directory: codex-rs
        run: |
          cargo check --locked --all-targets \
            -p codex-hepta-ndu \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-intelligence \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-shadow-qualification

      - name: Regression tests
        working-directory: codex-rs
        run: |
          just test --locked -p codex-hepta-ndu
          cargo test --locked -p codex-hepta-intelligence-eval --lib
          cargo test --locked -p codex-hepta-intelligence --lib ndu_stochastic_admission
          cargo test --locked -p codex-hepta-learning-artifacts --lib pinned
          cargo test --locked -p codex-hepta-learning-ledger --lib signed_evidence
          cargo test --locked -p codex-hepta-shadow-qualification value_learning

      - name: Control NDU caller regressions
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-control-plane --lib planner_context
          cargo test --locked -p codex-hepta-control-plane --lib planner_ndu

      - name: Strict lint
        working-directory: codex-rs
        run: |
          cargo clippy --locked --all-targets \
            -p codex-hepta-ndu \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-intelligence \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-shadow-qualification \
            -- -D warnings

      - name: Named-host NDU qualification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="${RUNNER_TEMP}/ndu-named-host-${{ matrix.lane }}.json"
          export HEPTA_NDU_HOST_ID="github-hosted-ubuntu-24.04-x86_64"
          export HEPTA_NDU_FS_PROFILE="$(stat -f -c %T "${RUNNER_TEMP}")"
          export HEPTA_NDU_RUSTC="$(rustc --version)"
          export HEPTA_NDU_CLK_TCK="$(getconf CLK_TCK)"
          export HEPTA_NDU_RECEIPT_PATH="${RECEIPT}"
          export HEPTA_NDU_SOURCE_SHA="$(git rev-parse HEAD)"
          export HEPTA_NDU_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          export HEPTA_NDU_QUALIFICATION_LANE="${{ matrix.lane }}"
          cargo run --locked --release -p codex-hepta-ndu --bin ndu-named-host-qualification
          python3 -m json.tool "${RECEIPT}" >/dev/null
          cat "${RECEIPT}"

      - name: Retain named-host NDU receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-named-host-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-named-host-${{ matrix.lane }}.json
          if-no-files-found: ignore

      - name: Formatting check without source mutation
        if: always()
        working-directory: codex-rs
        run: |
          cargo fmt \
            --package codex-hepta-ndu \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-intelligence \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-shadow-qualification \
            -- --check

      - name: Preserve exact source state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
