name: Hepta NDU deterministic qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-agentd/src/ndu*.rs"
      - "codex-rs/hepta-agentd/src/main.rs"
      - "codex-rs/hepta-agentd/src/config.rs"
      - "codex-rs/hepta-agentd/src/runtime.rs"
      - "codex-rs/hepta-agentd/src/state*.rs"
      - "codex-rs/hepta-agentd/src/client.rs"
      - "codex-rs/hepta-agentd/tests/ndu_process_e2e.rs"
      - "codex-rs/hepta-agentd/tests/support/fleet.rs"
      - "codex-rs/hepta-agent-protocol/**"
      - "codex-rs/hepta-contracts/src/final_use*.rs"
      - "codex-rs/hepta-contracts/src/authority_trust.rs"
      - "scripts/hepta-ndu-qualification.py"
      - "scripts/hepta-ndu-implementation-map-closed-world.py"
      - "scripts/test_hepta_ndu_qualification.py"
      - "scripts/hepta-implementation-maps.py"
      - "codex-rs/hepta-intelligence/src/ndu_stochastic_admission.rs"
      - "codex-rs/hepta-intelligence/src/ndu_stochastic_admission_tests.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_convergence.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_convergence_tests.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_well_posedness.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_well_posedness_tests.rs"
      - "codex-rs/hepta-learning-artifacts/src/pinned.rs"
      - "codex-rs/hepta-learning-ledger/src/signed_evidence.rs"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-control-plane/src/planner_ndu.rs"
      - "codex-rs/hepta-control-plane/src/planner_ndu_tests.rs"
      - "codex-rs/hepta-control-plane/src/planner_context.rs"
      - "codex-rs/hepta-control-plane/src/planner_context_tests.rs"
      - "docs/modules/utility.ndu/**"
      - "docs/readiness/LANE_D_MATURITY.json"
      - "docs/readiness/NDU_SYSTEM_EXECUTION.md"
      - "docs/learning/NDU_FBSDE_SPEC.md"
      - "qualification/module-execution-dossiers/detail/utility.ndu.md"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - "scripts/hepta-ndu-source-policy.py"
      - ".github/workflows/hepta-ndu-recursion.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-agentd/src/ndu*.rs"
      - "codex-rs/hepta-agentd/src/main.rs"
      - "codex-rs/hepta-agentd/src/config.rs"
      - "codex-rs/hepta-agentd/src/runtime.rs"
      - "codex-rs/hepta-agentd/src/state*.rs"
      - "codex-rs/hepta-agentd/src/client.rs"
      - "codex-rs/hepta-agentd/tests/ndu_process_e2e.rs"
      - "codex-rs/hepta-agentd/tests/support/fleet.rs"
      - "codex-rs/hepta-agent-protocol/**"
      - "codex-rs/hepta-contracts/src/final_use*.rs"
      - "codex-rs/hepta-contracts/src/authority_trust.rs"
      - "scripts/hepta-ndu-qualification.py"
      - "scripts/hepta-ndu-implementation-map-closed-world.py"
      - "scripts/test_hepta_ndu_qualification.py"
      - "scripts/hepta-implementation-maps.py"
      - "codex-rs/hepta-intelligence/src/ndu_stochastic_admission.rs"
      - "codex-rs/hepta-intelligence/src/ndu_stochastic_admission_tests.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_convergence.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_convergence_tests.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_well_posedness.rs"
      - "codex-rs/hepta-intelligence-eval/src/ndu_well_posedness_tests.rs"
      - "codex-rs/hepta-learning-artifacts/src/pinned.rs"
      - "codex-rs/hepta-learning-ledger/src/signed_evidence.rs"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-control-plane/src/planner_ndu.rs"
      - "codex-rs/hepta-control-plane/src/planner_ndu_tests.rs"
      - "codex-rs/hepta-control-plane/src/planner_context.rs"
      - "codex-rs/hepta-control-plane/src/planner_context_tests.rs"
      - "docs/modules/utility.ndu/**"
      - "docs/readiness/LANE_D_MATURITY.json"
      - "docs/readiness/NDU_SYSTEM_EXECUTION.md"
      - "docs/learning/NDU_FBSDE_SPEC.md"
      - "qualification/module-execution-dossiers/detail/utility.ndu.md"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - "scripts/hepta-ndu-source-policy.py"
      - ".github/workflows/hepta-ndu-recursion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-ndu-recursion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: NDU ${{ matrix.lane }} / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
        suite: [source, core, callers, product, lint, host]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact candidate or deterministic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              BASE_SHA=$(git rev-parse refs/remotes/origin/main)
            fi
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}
      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Validate closed-world implementation mapping
        if: matrix.suite == 'source'
        run: python3 scripts/hepta-ndu-implementation-map-closed-world.py
      - name: Execute independent suite and retain every exit status
        shell: bash
        run: |
          python3 scripts/hepta-ndu-qualification.py \
            --suite '${{ matrix.suite }}' --lane '${{ matrix.lane }}' \
            --output '${{ runner.temp }}/ndu-${{ matrix.lane }}-${{ matrix.suite }}'
      - name: Retain exact-candidate execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-${{ matrix.lane }}-${{ matrix.suite }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-${{ matrix.lane }}-${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 30
  ndu:
    name: NDU (${{ matrix.lane }})
    if: always()
    needs: qualify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        lane: [source-head, synthetic-merge]
    steps:
      - name: Require every independently executed suite
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
