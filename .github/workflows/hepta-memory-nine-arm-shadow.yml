name: Hepta Memory A-I nine-arm shadow acceptance

on:
  pull_request:
    paths:
      - 'qa/stem-bakeoff/memory_nine_arm_acceptance.py'
      - 'qa/stem-bakeoff/test_memory_nine_arm_acceptance.py'
      - 'docs/learning/MEMORY_NINE_ARM_ACCEPTANCE_20261023.md'
      - '.github/workflows/hepta-memory-nine-arm-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-memory-nine-arm-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  nine-arm-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify the exact triggering HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
      - name: Compile and run real fail-closed acceptance code
        run: |
          set -euo pipefail
          python3 -m py_compile \
            qa/stem-bakeoff/memory_nine_arm_acceptance.py \
            qa/stem-bakeoff/test_memory_nine_arm_acceptance.py
          python3 -m unittest discover -s qa/stem-bakeoff \
            -p 'test_memory_nine_arm_acceptance.py' -v
      - name: Reject any tracked-file mutation
        if: always()
        run: |
          git diff --check
          git diff --exit-code
