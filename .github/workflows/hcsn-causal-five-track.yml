name: HCSN causal five track

on:
  push:
    branches: [research/hcsn-causal-five-track-20261031]
    paths:
      - tools/hcsn/round10_20261031/native/**
      - tools/hcsn/round10_20261031/integration/**
      - .github/workflows/hcsn-causal-five-track.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcsn-causal-five-track-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/hcsn/round9_20261031/native
            tools/hcsn/round10_20261031
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/just
            ~/.cargo/registry
          key: hcsn-registry-just143-rust195-v1
      - name: Install fixed compiler and isolated test runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          if ! command -v just >/dev/null; then cargo install just --version 1.43.0 --locked; fi
      - name: Verify upstream sources and prepare clean workspace
        run: python3 tools/hcsn/round10_20261031/integration/prepare_native.py --build /tmp/hcsn-build
      - name: Compile and test actual Hepta owner
        run: |
          just --justfile /tmp/hcsn-build/justfile test
          just --justfile /tmp/hcsn-build/justfile build
          rustc --version --verbose > /tmp/hcsn-build/RUSTC.txt
      - name: Exercise preread owner and paired counterfactuals
        run: |
          if [ -f tools/hcsn/round10_20261031/native/qualify.py ]; then
            python3 -m pip install numpy==2.3.5 scipy==1.17.0
            python3 tools/hcsn/round10_20261031/native/qualify.py --binary /tmp/hcsn-build/target/release/hcsn-owner-preread --output /tmp/hcsn-build/evidence
          fi
      - name: Preserve scientific evidence transport
        if: always()
        run: python3 tools/hcsn/round10_20261031/integration/export_evidence.py --evidence /tmp/hcsn-build/evidence --archive /tmp/hcsn-build/evidence.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcsn-clean-native-${{ github.sha }}
          path: |
            /tmp/hcsn-build/BUILD_INPUTS.json
            /tmp/hcsn-build/Cargo.lock
            /tmp/hcsn-build/RUSTC.txt
            /tmp/hcsn-build/evidence/
            /tmp/hcsn-build/evidence.tar.gz
            /tmp/hcsn-build/target/release/hcsn-owner-baseline
            /tmp/hcsn-build/target/release/hcsn-owner-preread
          if-no-files-found: error
