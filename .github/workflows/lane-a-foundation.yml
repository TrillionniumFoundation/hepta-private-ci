name: Lane A foundation truth and native qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-*/**"
      - "codex-rs/kernel-*/**"
      - "docs/contracts/**"
      - "scripts/verify_hepta_callers.py"
      - ".github/workflows/lane-a-foundation.yml"
      - ".github/actions/hepta-synthetic-merge/action.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-a-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-head:
    name: Verify exact Lane A source and native contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify pull-request exact-subject tuple
        if: github.event_name == 'pull_request'
        shell: bash
        run: python3 scripts/verify_lane_a_pr_tuple.py --event "$GITHUB_EVENT_PATH"

      - name: Verify current implementation, traceability and nonclaims
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/verify_lane_a_foundation.py self-test
          python3 scripts/verify_lane_a_foundation.py verify
          python3 -m unittest qualification/module-execution-dossiers/test_lane_a_foundation.py
          (cd qualification/module-execution-dossiers && python3 -m unittest test_implementation_contracts.py)
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run Lane A native tests and strict lint
        shell: bash
        run: scripts/run_lane_a_native_qualification.sh

      - name: Resolve verified V8 artifacts for AuthBus product execution
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Execute AuthBus Agentd product path with exact-source receipt
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEPTA_CI_LANE: source-head
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py             --output "$RUNNER_TEMP/authbus-agentd-product-source.json"             -- cargo test --locked --manifest-path codex-rs/Cargo.toml               -p codex-hepta-agentd --test authbus_text_product --               --nocapture --test-threads=1

      - name: Write exact-source and native receipts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lane_a_foundation.py source-receipt \
            --expected-sha "$EXPECTED_SHA" \
            --output .hepta-evidence/lane-a-source-head.json
          python3 scripts/verify_lane_a_foundation.py native-receipt \
            --expected-sha "$EXPECTED_SHA" \
            --output .hepta-evidence/lane-a-native-head.json

      - name: Retain exact source receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-a-source-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: .hepta-evidence/lane-a-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Retain AuthBus exact-source product receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authbus-agentd-product-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/authbus-agentd-product-source.json
          if-no-files-found: error
          retention-days: 90

  merge-candidate:
    name: Verify synthetic Lane A merge candidate and native contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Construct deterministic synthetic merge
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Lane A CI
          author-email: hepta-lane-a-ci@users.noreply.github.com
          message: Synthetic Lane A merge

      - name: Verify synthetic merge truth
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/verify_lane_a_foundation.py self-test
          python3 scripts/verify_lane_a_foundation.py verify
          python3 -m unittest qualification/module-execution-dossiers/test_lane_a_foundation.py
          (cd qualification/module-execution-dossiers && python3 -m unittest test_implementation_contracts.py)
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run Lane A native tests and strict lint on merge candidate
        shell: bash
        run: scripts/run_lane_a_native_qualification.sh

      - name: Resolve verified V8 artifacts for AuthBus merge product execution
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Execute AuthBus Agentd product path on synthetic merge
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ steps.merge.outputs.sha }}
          HEPTA_CI_LANE: base-merge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py             --output "$RUNNER_TEMP/authbus-agentd-product-merge.json"             -- cargo test --locked --manifest-path codex-rs/Cargo.toml               -p codex-hepta-agentd --test authbus_text_product --               --nocapture --test-threads=1

      - name: Write synthetic-merge receipts
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lane_a_foundation.py source-receipt \
            --expected-sha "$EXPECTED_SHA" \
            --output .hepta-evidence/lane-a-merge-candidate.json
          python3 scripts/verify_lane_a_foundation.py native-receipt \
            --expected-sha "$EXPECTED_SHA" \
            --output .hepta-evidence/lane-a-native-merge-candidate.json

      - name: Retain synthetic merge receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-a-merge-native-${{ steps.merge.outputs.sha }}
          path: .hepta-evidence/lane-a-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Retain AuthBus merge product receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authbus-agentd-product-merge-${{ steps.merge.outputs.sha }}
          path: ${{ runner.temp }}/authbus-agentd-product-merge.json
          if-no-files-found: error
          retention-days: 90
