name: Windows fixture owner groups (additional execution)

on:
  push:
    branches: ["codex/cell-windows-fixture-owner-groups-20261109-898e"]

permissions:
  contents: read

concurrency:
  group: hepta-windows-fixture-owner-groups-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_SHA: bf42d2a5c2c1ed5134f8e7584de306fb015c1a8d
  TESTED_SHA: bf42d2a5c2c1ed5134f8e7584de306fb015c1a8d
  SOURCE_TREE: f7b65a747a1d2f585be38a4665ab2b4f1b07efb6
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  owner-group:
    runs-on: windows-latest
    # Each additional job retains the original 65-minute ceiling. The five-job
    # topology and its costs differ from the original single-job execution.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        group:
          - cli-cloud
          - agentd-fleet-default
          - agentd-h7-qualification
          - matrix-startup-diagnostic
          - appserver-fixtures
    steps:
      - name: Enable the existing Windows checkout convention
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Checkout the independent observer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: observer
          persist-credentials: false
      - name: Checkout the exact quiet source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Install the original native compiler
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
      - name: Install the original test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Install the existing V8 artifact resolver
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Check observation rejection controls
        shell: pwsh
        run: |
          python -m unittest discover -s observer/.github/scripts -p test_windows_fixture_followup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s observer/.github/scripts -p test_windows_fixture_owner_aggregate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the complete original selected owner group
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "hepta-windows-fixture-owner-${{ matrix.group }}-target"
          python observer/.github/scripts/windows_fixture_followup.py --source-root "$env:GITHUB_WORKSPACE/source" --expected-head "$env:SOURCE_SHA" --expected-tree "$env:SOURCE_TREE" --expected-observer-head "${{ github.sha }}" --group-id "${{ matrix.group }}" --output "$env:RUNNER_TEMP/hepta-windows-fixture-owner-${{ matrix.group }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve every original output and source binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-fixture-owner-${{ matrix.group }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-windows-fixture-owner-${{ matrix.group }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  observe-all-groups:
    if: always()
    needs: owner-group
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact observer for read-only aggregation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only this run's five original owner artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: windows-fixture-owner-*-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-owner-artifacts
          merge-multiple: false
      - name: Account for every original selected case
        if: always()
        run: |
          python .github/scripts/windows_fixture_owner_aggregate.py --input "$RUNNER_TEMP/original-owner-artifacts" --output "$RUNNER_TEMP/owner-group-aggregation" --expected-source "$SOURCE_SHA" --expected-tree "$SOURCE_TREE" --expected-observer "${{ github.sha }}" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
      - name: Preserve the additional-topology result even when incomplete
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-fixture-owner-aggregation-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-group-aggregation/
          if-no-files-found: error
          retention-days: 14
