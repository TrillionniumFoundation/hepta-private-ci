name: Agentd exact-head engineering

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - work/runtime-agentd-remediation-20260926
      - work/runtime-agentd-remediation-20260927
      - work/runtime-agentd-production-closure-20260928
      - work/product-convergence-20260923
      - integrate/agentd-product-sweep-20260829

permissions:
  contents: read

concurrency:
  group: agentd-exact-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow_ref }}
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_INCREMENTAL: '0'

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Receipt verifier adversarial tests
        run: python3 -B -m unittest discover -s scripts/qualification -p 'test_agentd_exact_head.py' -v
      - name: Dynamic status generator tests
        run: python3 -B -m unittest scripts.qualification.test_runtime_agentd_current_status -v
      - name: Dependency-boundary verifier tests
        run: python3 -B -m unittest scripts.qualification.test_runtime_agentd_dependency_boundary -v
      - name: Trust-boundary verifier tests
        run: python3 -B -m unittest scripts.test_hepta_agentd_trust_boundary -v
      - name: Derived projections, source ownership and explicit dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta_agentd_trust_boundary.py
          python3 scripts/qualification/runtime_agentd_dependency_boundary.py --repository .

  suite:
    name: Agentd ${{ matrix.os }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, macos-latest]
        suite: [owner-libraries, native-library, native-process, daemon-process, product-process, strict-clippy, read-only-profile]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: codex-rs
          shared-key: agentd-exact-v2
      - name: Execute suite and record actual source, commands, logs and binary digests
        if: ${{ always() }}
        shell: bash
        env:
          QUALIFICATION_OS: ${{ matrix.os }}
          QUALIFICATION_SUITE: ${{ matrix.suite }}
        run: |
          python3 -B scripts/qualification/agentd_exact_head.py run \
            --workspace "$GITHUB_WORKSPACE" --sha "$EXPECTED_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --os "$QUALIFICATION_OS" --suite "$QUALIFICATION_SUITE" \
            --output "$RUNNER_TEMP/agentd-exact-receipt"
      - name: Upload evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentd-exact-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/agentd-exact-receipt
          if-no-files-found: error
          retention-days: 14

  merge-candidate:
    name: Agentd prospective merge required
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      MERGE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Bind deterministic prospective merge tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: codex-rs
          shared-key: agentd-prospective-merge-v1
      - name: Compile and execute merge-candidate owner and process boundaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd --lib
          cargo check --locked -p codex-hepta-agentd --no-default-features --lib
          cargo test --locked -p codex-hepta-agentd --test runtime_codex_product_e2e
          cargo test --locked -p codex-hepta-agentd --test supervisord_product_e2e
          cargo test --locked -p codex-hepta-infer-worker-host --test native_host_process_e2e
          cargo clippy --locked -p codex-hepta-agentd -p codex-hepta-supervisor \
            -p codex-hepta-infer-worker-host --all-targets -- -D warnings

  qualification-result:
    name: Agentd exact-head required
    if: ${{ always() }}
    needs: [contract, suite, merge-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: agentd-exact-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/agentd-evidence
      - name: Reject missing, stale, skipped, failed or tampered receipts
        if: ${{ always() }}
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          python3 -B scripts/qualification/agentd_exact_head.py verify \
            --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence "$RUNNER_TEMP/agentd-evidence" --output "$RUNNER_TEMP/agentd-engineering-result.json" \
            --contract-result "$CONTRACT_RESULT" --suite-result "$SUITE_RESULT"
      - name: Generate exact-candidate status without changing source claims
        if: ${{ always() }}
        env:
          CANDIDATE_BRANCH: ${{ github.head_ref || github.ref_name }}
          MERGE_RESULT: ${{ needs.merge-candidate.result }}
        run: |
          python3 -B scripts/qualification/runtime_agentd_current_status.py \
            --repository "$GITHUB_WORKSPACE" --sha "$EXPECTED_SHA" \
            --branch "$CANDIDATE_BRANCH" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --event-name "$GITHUB_EVENT_NAME" \
            --merge-result "$MERGE_RESULT" \
            --engineering-result "$RUNNER_TEMP/agentd-engineering-result.json" \
            --output "$RUNNER_TEMP/runtime-agentd-current-status.json"
      - name: Require every independent job to succeed
        if: ${{ always() }}
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
          MERGE_RESULT: ${{ needs.merge-candidate.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = success
          test "$SUITE_RESULT" = success
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$MERGE_RESULT" = success
          else
            test "$MERGE_RESULT" = skipped
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: agentd-engineering-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agentd-engineering-result.json
            ${{ runner.temp }}/runtime-agentd-current-status.json
          if-no-files-found: error
