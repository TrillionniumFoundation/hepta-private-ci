name: Export secrets.heptabao hardening payload

on:
  push:
    branches:
      - codex/secrets-heptabao-final-hardening-20260928
    paths:
      - '.hepta-bootstrap/secrets-final-hardening/**'
      - '.github/workflows/hepta-secrets-payload-export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-payload-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify payload is present
        shell: bash
        run: |
          set -euo pipefail
          test -d .hepta-bootstrap/secrets-final-hardening
          test -f .hepta-bootstrap/secrets-final-hardening/part-00
          test -f .hepta-bootstrap/secrets-final-hardening/part-07
          find .hepta-bootstrap/secrets-final-hardening -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > secrets-final-hardening-files.sha256
          printf '%s\n' "${GITHUB_SHA}" > secrets-final-hardening-head.txt

      - name: Upload exact payload
        uses: actions/upload-artifact@v4
        with:
          name: secrets-final-hardening-payload-${{ github.sha }}
          path: |
            .hepta-bootstrap/secrets-final-hardening
            .github/workflows/hepta-bootstrap-apply-secrets-final-hardening-v2.yml
            secrets-final-hardening-files.sha256
            secrets-final-hardening-head.txt
          if-no-files-found: error
          retention-days: 1
