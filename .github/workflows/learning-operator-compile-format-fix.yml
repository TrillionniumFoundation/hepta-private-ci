name: Materialize learning.operator compile and formatting closure

on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths: [.github/workflows/learning-operator-compile-format-fix.yml]

permissions:
  contents: write

concurrency:
  group: learning-operator-compile-format-fix
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/learning-operator-full-convergence-20260926
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Restore signed empirical admission export and apply pinned formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/hepta-intelligence-eval/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = 'pub(crate) use signed_evaluation::decide_with_signed_evidence_v2;'
          new = 'pub use signed_evaluation::decide_with_signed_evidence_v2;'
          if text.count(old) != 1:
              raise SystemExit('unexpected signed V2 export state')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-agentd \
            -p codex-hepta-learning-ledger
          rm .github/workflows/learning-operator-compile-format-fix.yml
          git diff --check
          git config user.name 'openai-codex[bot]'
          git config user.email 'openai-codex[bot]@users.noreply.github.com'
          git add codex-rs/hepta-intelligence-eval/src/lib.rs \
            codex-rs/hepta-agentd/src/cognitive_ranker.rs \
            codex-rs/hepta-agentd/src/cognitive_ranker_admission.rs \
            codex-rs/hepta-agentd/src/cognitive_ranker_cache.rs \
            codex-rs/hepta-agentd/src/cognitive_ranker_evaluated_tests.rs \
            codex-rs/hepta-agentd/src/lib.rs \
            codex-rs/hepta-bellman-operator/src/dataset_bound.rs \
            codex-rs/hepta-bellman-operator/src/dataset_bound_tests.rs \
            codex-rs/hepta-bellman-operator/src/owner_dataset_tests.rs \
            codex-rs/hepta-bellman-operator/src/row_commitment.rs \
            codex-rs/hepta-learning-ledger/src/signed_evidence.rs \
            .github/workflows/learning-operator-compile-format-fix.yml
          git commit -m 'fix(learning.operator): restore signed admission and format exact source'
          git push origin HEAD:codex/learning-operator-full-convergence-20260926
