# Trigger isolated format candidate only; preserve the workflow and never force-push.
name: MemoryCell one-shot exact-source formatting candidate
on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - .github/workflows/hepta-memory-atomic-format.yml
permissions:
  contents: read
jobs:
  format-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-ci
      - name: Format entire PR diff but accept only AST-identical Python and semantic-identical YAML
        env:
          BASE: 78fdb0cf8537e3a84fc6e0a849707559c80881e8
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-atomic-format
          python3 -m pip install uv==0.8.22 PyYAML==6.0.3
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --base "$BASE" 2>&1 | tee /tmp/memory-atomic-format/format.log
          python3 - <<'PY'
          import ast
          import json
          import pathlib
          import subprocess
          import yaml

          def run(*args):
              return subprocess.check_output(args, text=True)

          changed = run('git', 'diff', '--name-only').splitlines()
          if not changed:
              raise ValueError('nothing formatted; do not publish empty repair')
          audit = []
          for name in changed:
              path = pathlib.Path(name)
              if path.is_symlink() or not path.is_file():
                  raise ValueError('formatter changed non-regular file: ' + name)
              original = run('git', 'show', 'HEAD:' + name)
              current = path.read_text(encoding='utf-8')
              if name.endswith('.py') and (name.startswith('scripts/') or name.startswith('.github/scripts/')):
                  if ast.dump(ast.parse(original)) != ast.dump(ast.parse(current)):
                      raise ValueError('Python behavior changed: ' + name)
                  rule = 'AST-identical'
              elif name.startswith('.github/workflows/') and name.endswith(('.yml', '.yaml')):
                  if yaml.safe_load(original) != yaml.safe_load(current):
                      raise ValueError('workflow semantics changed: ' + name)
                  rule = 'YAML-equivalent'
              else:
                  raise ValueError('out-of-scope formatter change: ' + name)
              audit.append(dict(path=name, contract=rule))
          pathlib.Path('/tmp/memory-atomic-format/changed.json').write_text(json.dumps(audit, indent=2))
          print(json.dumps(audit))
          PY
          git diff --check
          just fmt --check --base "$BASE" 2>&1 | tee /tmp/memory-atomic-format/check.log
          git add -- $(git diff --name-only)
          git diff --cached --check
          # This job must NOT delete/modify its own workflow. GitHub Actions
          # contents:write cannot push commits updating .github/workflows/*
          # without a separately granted workflows permission. The isolated
          # candidate branch is pre-created at the exact invoking source SHA.
          git diff --cached --name-only > /tmp/memory-atomic-format/staged-paths.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory-cell): AST-identical isolated Python format candidate'
          git push origin "HEAD:refs/heads/codex/memory-atomic-format-${GITHUB_RUN_ID}"
          git rev-parse HEAD > /tmp/memory-atomic-format/candidate-sha.txt
          echo "FORMAT_CANDIDATE=$(cat /tmp/memory-atomic-format/candidate-sha.txt)"
      - name: Preserve exact format logs and a candidate identifier
        if: always()
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/memory-atomic-format/checked-or-candidate-sha.txt
          (cd /tmp/memory-atomic-format && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-atomic-format-audit
          path: /tmp/memory-atomic-format
          if-no-files-found: error
