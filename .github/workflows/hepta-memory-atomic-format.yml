# Isolated AST-identical Python formatting candidate. No workflow writes by Actions.
# The exact candidate branch is provisioned by the authorized GitHub connector
# at the invoking HEAD before this job can push its Python-only changes.
name: MemoryCell one-shot exact-source formatting candidate
on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - .github/workflows/hepta-memory-atomic-format.yml
permissions:
  contents: read
jobs:
  format-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BASE: 78fdb0cf8537e3a84fc6e0a849707559c80881e8
      TARGET: codex/memory-atomic-pyfmt-20261013-c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Format ONLY changed Python and prove original AST equality
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-atomic-format
          git rev-parse HEAD > /tmp/memory-atomic-format/invoking-commit.txt
          git rev-parse HEAD^{tree} > /tmp/memory-atomic-format/invoking-tree.txt
          python3 -m pip install --user ruff==0.15.8
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          import subprocess
          import sys
          import os
          def run(*args):
              return subprocess.check_output(args, text=True)
          diff = run('git', 'diff', '--diff-filter=ACMR', '--name-only',
                     os.environ['BASE'], 'HEAD', '--',
                     'scripts/memory_cell/', '.github/scripts/').splitlines()
          paths = sorted(p for p in diff if p.endswith('.py'))
          if not paths:
              print('NO_PYTHON_SOURCE_DIFF; nothing to format')
              Path('/tmp/memory-atomic-format/noop.txt').write_text('no changed Python')
              raise SystemExit(0)
          original = {}
          for name in paths:
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise ValueError('nonregular changed source: ' + name)
              original[name] = ast.dump(ast.parse(path.read_text(encoding='utf-8')))
          executable = str(Path.home() / '.local/bin/ruff')
          subprocess.run([executable, 'format', '--', *paths], check=True)
          for name in paths:
              formatted = ast.dump(ast.parse(Path(name).read_text(encoding='utf-8')))
              if formatted != original[name]:
                  raise ValueError('Python AST changed: ' + name)
          subprocess.run([executable, 'format', '--check', '--', *paths], check=True)
          changed = run('git', 'diff', '--name-only').splitlines()
          if any(name not in original for name in changed):
              raise ValueError('formatter changed file outside admitted Python scope')
          report = dict(
              source_commit=os.environ['GITHUB_SHA'],
              original_base=os.environ['BASE'],
              total_changed_python=len(paths),
              actually_formatted=len(changed),
              ast_identical=True,
              workflow_files_written=False,
              complete_just_fmt_check_claim=False,
              changed_files=[dict(path=name, invariant='exact-Python-AST')
                             for name in changed],
          )
          Path('/tmp/memory-atomic-format/report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report))
          PY
          git diff --check
          if [[ -z "$(git diff --name-only)" ]]; then
            echo "Already Python-formatted at source HEAD; no candidate commit"
            exit 0
          fi
          # Only fast-forward an already provisioned exact-source ref.
          observed="$(git ls-remote --heads origin "$TARGET" | cut -f 1)"
          test "$observed" = "$GITHUB_SHA"
          git add -- scripts/memory_cell/ .github/scripts/
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory-cell): format only AST-identical Python source'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > /tmp/memory-atomic-format/candidate-sha.txt
          echo "AST_PYTHON_FORMAT_CANDIDATE=$(cat /tmp/memory-atomic-format/candidate-sha.txt)"
      - name: Preserve exact source, failure logs and candidate hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-atomic-format
          git rev-parse HEAD > /tmp/memory-atomic-format/checked-or-candidate-sha.txt
          (cd /tmp/memory-atomic-format && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-python-ast-format-audit
          path: /tmp/memory-atomic-format
          if-no-files-found: error
