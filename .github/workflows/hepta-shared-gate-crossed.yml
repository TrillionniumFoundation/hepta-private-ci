name: Hepta saved gate crossed evidence audit
on:
  push:
    branches: ["research/five-causal-experiments-20261013"]
    paths:
      - "scripts/memory_cell/shared_gate_crossed_evidence.py"
      - "scripts/memory_cell/shared_gate_crossed_trial.py"
      - "scripts/memory_cell/test_shared_gate_crossed.py"
      - ".github/workflows/hepta-shared-gate-crossed.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shared-gate-crossed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  saved-heads-no-fitting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install unchanged worker
        run: |
          set -euo pipefail
          mkdir -p /tmp/crossed-gate/checks
          python3 -m venv /tmp/crossed-gate-env
          /tmp/crossed-gate-env/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu > /tmp/crossed-gate/checks/install-torch.log 2>&1
          /tmp/crossed-gate-env/bin/pip install -r scripts/memory_cell/requirements.txt packaging==25.0 cryptography==46.0.4 psutil==7.0.0 regex==2024.11.6 Jinja2==3.1.6 > /tmp/crossed-gate/checks/install-worker.log 2>&1
          /tmp/crossed-gate-env/bin/pip check
          /tmp/crossed-gate-env/bin/pip freeze > /tmp/crossed-gate/checks/environment.txt
      - name: Require crossed audit and existing representation regressions
        run: |
          set -euo pipefail
          failed=0
          for pattern in test_shared_gate_crossed.py test_shared_question_gate_entrypoint.py test_shared_question_gate.py test_five_causal_experiments.py test_full_cell_matrix.py test_five_causal_native.py test_five_encoder_snapshot.py test_select_question_relevance.py test_select_content_inventory.py; do
            if /tmp/crossed-gate-env/bin/python -m unittest discover -s scripts/memory_cell -p "$pattern" -v 2>&1 | tee "/tmp/crossed-gate/checks/$pattern.log"; then
              printf '%s\tpassed\n' "$pattern" >> /tmp/crossed-gate/checks/suites.tsv
            else
              failed=1
              printf '%s\tfailed\n' "$pattern" >> /tmp/crossed-gate/checks/suites.tsv
            fi
          done
          /tmp/crossed-gate-env/bin/python -m py_compile scripts/memory_cell/shared_gate_crossed_evidence.py scripts/memory_cell/shared_gate_crossed_trial.py scripts/memory_cell/test_shared_gate_crossed.py
          /tmp/crossed-gate-env/bin/python scripts/memory_cell/shared_gate_crossed_trial.py --help > /tmp/crossed-gate/checks/real-cli-help.txt
          test "$failed" -eq 0
      - name: Check exact corrected Head execution once
        id: dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/runs/38526481788 > /tmp/crossed-gate/checks/upstream-run.json
          gh api 'repos/TrillionniumFoundation/hepta-private-ci/actions/runs/38526481788/artifacts?per_page=100' > /tmp/crossed-gate/checks/upstream-artifacts.json
          code=0
          /tmp/crossed-gate-env/bin/python scripts/memory_cell/shared_gate_crossed_trial.py dependency --run-json /tmp/crossed-gate/checks/upstream-run.json --artifacts-json /tmp/crossed-gate/checks/upstream-artifacts.json --output /tmp/crossed-gate/dependency.json || code=$?
          if test "$code" -ne 0 && test "$code" -ne 3; then exit "$code"; fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/crossed-gate/dependency.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('ready='+str(d['ready']).lower()+'\n')
              if d['ready']:
                  out.write('artifact_id='+str(d['artifact_id'])+'\n')
                  out.write('artifact_sha256='+d['artifact_sha256']+'\n')
          if not d['ready']: print('DEFERRED: no successful saved Head study; no model loading or fitting.')
          PY
      - name: Fetch exact saved Heads and unchanged material
        if: steps.dependency.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_ARTIFACT: ${{ steps.dependency.outputs.artifact_id }}
          HEAD_SHA: ${{ steps.dependency.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          gh api "repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/${HEAD_ARTIFACT}/zip" > /tmp/crossed-heads.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip > /tmp/crossed-original.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11872208169/zip > /tmp/crossed-cancelled.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11863981474/zip > /tmp/crossed-select.zip
          printf '%s  %s\n' "$HEAD_SHA" /tmp/crossed-heads.zip | sha256sum -c -
          printf '%s  %s\n' 07b357cbb3362f4afa4dc1872ab7e28e8a46daaf338f2636fed8d40fbcee76af /tmp/crossed-original.zip | sha256sum -c -
          printf '%s  %s\n' 601cd09ae82cc6915121aaf8bb0eac5c1fe7c8b370c9d4a832bc6e5d54b91bac /tmp/crossed-cancelled.zip | sha256sum -c -
          printf '%s  %s\n' aeb4113b6d2baace0a042f960876861c78b5449b6d9dac404dee2e5c041e46fa /tmp/crossed-select.zip | sha256sum -c -
      - name: Replay saved gates and score only missing evidence corners
        if: steps.dependency.outputs.ready == 'true'
        env:
          HEAD_SHA: ${{ steps.dependency.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/crossed-gate/checks/process-resources.txt /tmp/crossed-gate-env/bin/python scripts/memory_cell/shared_gate_crossed_trial.py run --original-archive /tmp/crossed-original.zip --cancelled-archive /tmp/crossed-cancelled.zip --select-archive /tmp/crossed-select.zip --head-archive /tmp/crossed-heads.zip --head-sha256 "$HEAD_SHA" --work /tmp/crossed-materials --output /tmp/crossed-gate/study 2>&1 | tee /tmp/crossed-gate/checks/execution.log
      - name: Preserve outcome distinction, source and costs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/crossed-gate/source/memory_cell
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/crossed-gate/study/report.json')
          d=json.loads(p.read_bytes()) if p.is_file() else None
          disposition={'model_execution_completed':d is not None and d.get('errors')==[], 'new_optimizer_updates':0, 'semantic_accuracy':None, 'production_accepted':False}
          Path('/tmp/crossed-gate/execution-disposition.json').write_text(json.dumps(disposition,sort_keys=True))
          print('CROSSED_EXECUTION_DISPOSITION',json.dumps(disposition,sort_keys=True))
          PY
          git rev-parse HEAD > /tmp/crossed-gate/source/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/crossed-gate/source/tested-tree.txt
          cp scripts/memory_cell/*.py scripts/memory_cell/requirements.txt /tmp/crossed-gate/source/memory_cell/
          cp experiments/shared_stem_cell/execution.py .github/workflows/hepta-shared-gate-crossed.yml /tmp/crossed-gate/source/
          (cd /tmp/crossed-gate && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-saved-gate-crossed-evidence-check-disposition
          path: /tmp/crossed-gate
          if-no-files-found: error
