name: Self-hosted ROG Pocket4 and Mac availability

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this bounded runner probe is being requested
        required: false
        default: operator-check
        type: string
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/self-hosted-fleet-availability.yml

permissions: {}

concurrency:
  group: self-hosted-fleet-availability-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rog:
    name: ROG runner probe
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/work/product-convergence-20260923')
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 10
    steps:
      - name: Verify trusted integration invocation on ROG
        shell: bash
        env:
          PROBE_REASON: ${{ inputs.reason || 'qian-qi-relay-recovery' }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = rog
          test "${#PROBE_REASON}" -le 128
          [[ "$PROBE_REASON" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]]
          [[ ! "/$PROBE_REASON/" =~ /\.\./ ]]
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:refs/heads/main) ;;
            push:refs/heads/work/product-convergence-20260923) ;;
            *) echo "untrusted invocation boundary" >&2; exit 1 ;;
          esac
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            "$PROBE_REASON"

      - name: Recover the existing qian-qi relay over a configured SSH alias
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(mktemp)"
          cat >"$remote_script" <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = "qian-qi"
          systemctl --user daemon-reload 2>/dev/null || true
          mapfile -t units < <(
            systemctl --user list-unit-files --no-legend 2>/dev/null \
              | awk '{print $1}' \
              | grep -Ei 'desktop.*commander|commander.*desktop|remote.*commander|commander.*remote' \
              || true
          )
          for unit in "${units[@]}"; do
            echo "restarting user unit $unit"
            systemctl --user restart "$unit"
          done

          python3 - <<'PY'
          import os
          import pathlib
          import signal
          import subprocess
          import time

          matches = []
          for proc in pathlib.Path('/proc').iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  argv = [
                      part.decode(errors='surrogateescape')
                      for part in (proc / 'cmdline').read_bytes().split(b'\0')
                      if part
                  ]
                  joined = ' '.join(argv).lower()
                  if not argv or 'actions/runner' in joined or 'github-runner' in joined:
                      continue
                  if any(token in joined for token in (
                      'desktop-commander', 'desktop_commander',
                      'remote-desktop', 'remote_desktop',
                      '@wonderwhy-er/desktop-commander',
                  )):
                      env = {}
                      for item in (proc / 'environ').read_bytes().split(b'\0'):
                          if b'=' not in item:
                              continue
                          key, value = item.split(b'=', 1)
                          env[key.decode(errors='surrogateescape')] = value.decode(errors='surrogateescape')
                      matches.append((int(proc.name), argv, env, os.readlink(proc / 'cwd')))
              except (FileNotFoundError, PermissionError, ProcessLookupError, OSError):
                  continue

          for pid, argv, env, cwd in matches:
              print(f'restarting pid={pid} cwd={cwd} argv0={argv[0]}')
              try:
                  os.kill(pid, signal.SIGTERM)
              except ProcessLookupError:
                  continue
              for _ in range(30):
                  if not pathlib.Path(f'/proc/{pid}').exists():
                      break
                  time.sleep(0.1)
              if pathlib.Path(f'/proc/{pid}').exists():
                  os.kill(pid, signal.SIGKILL)
              env.pop('RUNNER_TRACKING_ID', None)
              env.pop('RUNNER_TEMP', None)
              log = open('/tmp/desktop-commander-restart.log', 'ab', buffering=0)
              subprocess.Popen(
                  argv,
                  cwd=cwd,
                  env=env,
                  stdin=subprocess.DEVNULL,
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
                  close_fds=True,
              )
          print(f'restarted_existing_relays={len(matches)}')
          PY
          sleep 5
          ps -eo pid,ppid,etime,args \
            | grep -Ei 'desktop.?commander|remote.?desktop|wonderwhy|mcp.*desktop' \
            | grep -v grep || true
          tail -80 /tmp/desktop-commander-restart.log 2>/dev/null || true
          REMOTE

          success=0
          for target in p4-desktop desktop qian-qi; do
            echo "trying configured SSH target $target"
            if ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new \
                "$target" 'cat > /tmp/hepta-remote-relay-recover.sh && bash /tmp/hepta-remote-relay-recover.sh' \
                <"$remote_script"; then
              success=1
              break
            fi
          done
          test "$success" = 1

      - name: Read-only browser snapshot
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then "$bin" --version || true; break; fi
          done

  pocket4:
    name: Pocket4 runner probe
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 10
    steps:
      - name: Verify trusted integration invocation on Pocket4
        shell: bash
        env:
          PROBE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = pocket4
          test "${#PROBE_REASON}" -le 128
          [[ "$PROBE_REASON" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]]
          [[ ! "/$PROBE_REASON/" =~ /\.\./ ]]
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            "$PROBE_REASON"
      - name: Read-only capability snapshot
        shell: bash
        run: |
          set -euo pipefail
          uname -a

  macbook:
    name: MacBook Pro runner probe
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, macbook]
    timeout-minutes: 10
    steps:
      - name: Verify trusted integration invocation on MacBook Pro
        shell: bash
        env:
          PROBE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = macbook-pro
          test "${#PROBE_REASON}" -le 128
          [[ "$PROBE_REASON" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]]
          [[ ! "/$PROBE_REASON/" =~ /\.\./ ]]
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            "$PROBE_REASON"
      - name: Read-only platform snapshot
        shell: bash
        run: |
          set -euo pipefail
          sw_vers || true
          uname -a
