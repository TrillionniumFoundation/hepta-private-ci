name: Self-hosted ROG Pocket4 and Mac availability

on:
  push:
    branches:
      - ops/kernel-authority-fleet-probe-20260928
    paths:
      - '.github/workflows/self-hosted-fleet-availability.yml'

permissions: {}

concurrency:
  group: kernel-authority-readonly-fleet-probe
  cancel-in-progress: true

jobs:
  rog:
    name: Kernel authority ROG read-only probe
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 10
    steps:
      - name: Verify isolated ROG runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/ops/kernel-authority-fleet-probe-20260928
          test "$RUNNER_NAME" = rog
          printf 'runner=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"

  pocket4:
    name: Kernel authority Pocket4 read-only probe
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 10
    steps:
      - name: Verify isolated Pocket4 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/ops/kernel-authority-fleet-probe-20260928
          test "$RUNNER_NAME" = pocket4
          printf 'runner=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"

  macbook:
    name: Kernel authority MacBook read-only probe
    runs-on: [self-hosted, macOS, ARM64, macbook]
    timeout-minutes: 10
    steps:
      - name: Verify isolated MacBook runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/ops/kernel-authority-fleet-probe-20260928
          test "$RUNNER_NAME" = macbook-pro
          printf 'runner=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
