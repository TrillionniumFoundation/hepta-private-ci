name: runtime.codex convergence apply

on:
  push:
    branches:
      - runtime-codex/convergence-v1
    paths:
      - scripts/runtime-codex-converge.py
      - scripts/runtime-codex-converge-phase2.py
      - scripts/runtime-codex-converge-phase3.py
      - scripts/runtime-codex-converge-phase4.py
      - scripts/check-runtime-codex-fault-matrix.py
      - .github/workflows/runtime-codex-convergence-apply.yml
      - codex-rs/hepta-infer-core/examples/runtime_codex_microprofile.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-codex-convergence-branch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: runtime-codex/convergence-v1
          persist-credentials: false
      - name: Apply idempotent source migrations
        run: python3 scripts/runtime-codex-converge-phase4.py
      - name: Validate fault matrix
        run: python3 scripts/check-runtime-codex-fault-matrix.py
      - name: Format changed Rust sources
        working-directory: codex-rs
        run: cargo fmt --all
      - name: Export complete changed files and patch
        shell: bash
        run: |
          set -euo pipefail
          out=qualification/runtime-codex-convergence
          mkdir -p "$out/tree"
          git diff --binary > "$out/runtime-codex-convergence.patch"
          git diff --name-only > "$out/changed-files.txt"
          while IFS= read -r path; do
            test -n "$path" || continue
            mkdir -p "$out/tree/$(dirname "$path")"
            cp "$path" "$out/tree/$path"
          done < "$out/changed-files.txt"
          git diff --check
          test -s "$out/changed-files.txt"
      - name: Upload convergence tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-codex-convergence-tree-${{ github.run_id }}
          path: qualification/runtime-codex-convergence/
          if-no-files-found: error
