name: Hepta Browser Servo worker dev

on:
  push:
    branches: [codex/browser-servo-effect-correctness-20260917]
    paths:
      - 'apps/hepta-browser/servo-worker/**'
      - '.github/workflows/hepta-browser-servo-worker-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-browser-servo-worker-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
          rustc -vV
          cargo -vV
      - name: Install Servo build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl git libdbus-1-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev libglib2.0-dev libssl-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev llvm pkg-config python3
          command -v llvm-objdump
          llvm-objdump --version | head -n 1
      - name: Resolve exact worker dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path apps/hepta-browser/servo-worker/Cargo.toml
          test -s apps/hepta-browser/servo-worker/Cargo.lock
          grep -F '84bcc9ac701874fa9819e5cdee06356b961d736c' apps/hepta-browser/servo-worker/Cargo.lock
      - name: Check exact current-pin worker
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path apps/hepta-browser/servo-worker/Cargo.toml
      - name: Preserve exact worker dependency lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-browser-servo-worker-lock-${{ github.sha }}
          path: apps/hepta-browser/servo-worker/Cargo.lock
          if-no-files-found: error
          retention-days: 2
      - name: Verify source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
