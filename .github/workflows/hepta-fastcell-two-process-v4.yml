name: Hepta FastCell genuine two-process Unix RTT (research only)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-compiled-use/**"
      - ".github/workflows/hepta-fastcell-two-process-v4.yml"
  push:
    branches:
      - "research/fastcell-two-process-v4-20261016"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastcell-two-process-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  two-process-native-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact source and native toolchain
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Run complete typed data-plane native tests
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-compiled-use
      - name: Strict native lint and formatting on exact HEAD
        run: |
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-compiled-use --all-targets -- -D warnings
          cargo fmt --manifest-path codex-rs/hepta-compiled-use/Cargo.toml -- --check
      - name: Physical 64 and 1024 separate-process original frame RTT
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s cargo run --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-compiled-use --example two_process_unix_bench -- --smoke | tee "$RUNNER_TEMP/fastcell-two-process-smoke.json"
          timeout 20s cargo run --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-compiled-use --example two_process_unix_bench | tee "$RUNNER_TEMP/fastcell-two-process-full.json"
          python3 - "$RUNNER_TEMP" "$(git rev-parse HEAD)" <<'PY'
          import hashlib,json,pathlib,sys
          dest=pathlib.Path(sys.argv[1]); head=sys.argv[2]
          assert len(head)==40 and all(c in '0123456789abcdef' for c in head)
          results={}
          for key,n in (('smoke',64),('full',1024)):
              path=dest / ('fastcell-two-process-'+key+'.json')
              raw=path.read_bytes()
              x=json.loads(raw)
              assert set(x)=={
                  'schema','roundtrips','payload_bytes_per_direction',
                  'p50_ns','p95_ns','p99_ns','process_setup_ns',
                  'separate_processes','same_process_two_threads',
                  'peer_authentication_verified','mcp_comparison',
                  'external_effects','production_authorized'
              }
              assert x['schema']=='hepta.fastcell.two-process-unix-rtt.v1'
              assert x['roundtrips']==n and x['payload_bytes_per_direction']==256
              assert x['separate_processes'] is True
              assert x['same_process_two_threads'] is False
              for flag in ('peer_authentication_verified','mcp_comparison',
                           'external_effects','production_authorized'):
                  assert x[flag] is False
              for metric in ('p50_ns','p95_ns','p99_ns','process_setup_ns'):
                  assert type(x[metric]) is int and x[metric]>0
              assert x['p50_ns'] <= x['p95_ns'] <= x['p99_ns']
              results[key]=dict(raw_sha256=hashlib.sha256(raw).hexdigest(),
                                measured=x)
          source=pathlib.Path('codex-rs/hepta-compiled-use/examples/two_process_unix_bench.rs')
          receipt=dict(
              schema='hepta.fastcell.two-process-source-bound-receipt.v1',
              exact_head=head,
              source_path=source.as_posix(),
              source_sha256=hashlib.sha256(source.read_bytes()).hexdigest(),
              benchmark_modes=results,
              independent_performance_or_attestation=False,
              model_to_mcp_comparison=False,
              OS_UI_effect_executed=False,
              production_authorized=False,
          )
          output=dest/'fastcell-two-process-original-receipt.json'
          with output.open('x',encoding='utf-8') as f:
              json.dump(receipt,f,sort_keys=True,indent=2)
          print(json.dumps({
              'exact_head':head,'sample_counts':[
                  results['smoke']['measured']['roundtrips'],
                  results['full']['measured']['roundtrips']
              ],
              'source_sha256':receipt['source_sha256'],
              'fixed_abi_echo_original_bytes_verified':True,
              'real_UI_or_model_source_executed':False,
              'production_authorized':False,
          },sort_keys=True))
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastcell-two-process-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fastcell-two-process-smoke.json
            ${{ runner.temp }}/fastcell-two-process-full.json
            ${{ runner.temp }}/fastcell-two-process-original-receipt.json
          if-no-files-found: warn
