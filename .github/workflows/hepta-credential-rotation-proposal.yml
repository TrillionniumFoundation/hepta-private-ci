name: Controlled credential rotation on a disposable Windows VM

on:
  pull_request:
    branches: [research/ndu-credential-rotation-inputs-v2-20261106]
    paths:
      - .github/workflows/hepta-credential-rotation-proposal.yml
      - .github/scripts/hepta_rotation_probe.py
      - .github/scripts/hepta_rotation_guard.py
      - .github/scripts/hepta_rotation_evidence.py
      - .github/scripts/hepta-rotation-spec.json
      - codex-rs/windows-sandbox-rs/diagnostics/credential_rotation_probe_tests.rs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rotation-probe:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Prepare exact byte checkout on this dedicated VM
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout exact side proposal
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.10"

      - name: Verify exact source and disposable native runner before account APIs
        id: preflight
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
        run: python -B .github/scripts/hepta_rotation_probe.py preflight

      - name: Install the original Rust toolchain
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: rustfmt

      - name: Install the original just and nextest versions
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Build and list one exact case, then execute it once through just
        id: native
        env:
          PROBE_PRIVATE_DIR: ${{ steps.preflight.outputs.private_dir }}
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
        run: python -B .github/scripts/hepta_rotation_probe.py run

      - name: Retain original logs only through the existing credential and URI gate
        id: collect
        if: always() && steps.preflight.outcome == 'success'
        env:
          PROBE_PRIVATE_DIR: ${{ steps.preflight.outputs.private_dir }}
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
        run: python -B .github/scripts/hepta_rotation_probe.py collect

      - name: Upload only the gated diagnostic evidence
        id: upload
        if: always() && steps.collect.outcome == 'success' && steps.collect.outputs.safe_for_upload == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect.outputs.public_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Require native execution, explicit cleanup and complete evidence
        if: always()
        env:
          PREFLIGHT_RESULT: ${{ steps.preflight.outcome }}
          NATIVE_RESULT: ${{ steps.native.outcome }}
          COLLECTION_RESULT: ${{ steps.collect.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          VALIDATED_RESULT: ${{ steps.collect.outputs.validated }}
        shell: pwsh
        run: |
          if (@($env:PREFLIGHT_RESULT, $env:NATIVE_RESULT, $env:COLLECTION_RESULT, $env:UPLOAD_RESULT).Where({ $_ -ne 'success' }).Count -ne 0 -or $env:VALIDATED_RESULT -ne 'true') {
            throw 'Controlled native diagnostic or evidence gate did not pass.'
          }
