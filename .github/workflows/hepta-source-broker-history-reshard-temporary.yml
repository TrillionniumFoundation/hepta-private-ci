name: Temporary interrupted history artifact shards

on:
  push:
    branches:
      - integration/hepta-rust-validation-20261117-59d82
    paths:
      - .github/workflows/hepta-source-broker-history-reshard-temporary.yml

permissions:
  actions: read

jobs:
  history-shards:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.event_name == 'push' &&
      github.event.deleted == false &&
      github.ref == 'refs/heads/integration/hepta-rust-validation-20261117-59d82'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify the fixed interrupted artifact and runtime push
        shell: python {0}
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          REPOSITORY = "TrillionniumFoundation/hepta-private-ci"
          REF = "refs/heads/integration/hepta-rust-validation-20261117-59d82"
          HEAD = "eef4d2afed5f9176de4aaf790f74f5ca93d7151f"
          RUN = 44109517447
          ARTIFACT = 14342327563
          NAME = "hepta-source-broker-history-" + HEAD + "-1"
          DIGEST = "sha256:e38611f796454bdf71dd1d0615a26769a6cb7e5941d48188fdecb06697b116e9"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, url):
                  raise ValueError("Unexpected API redirect")

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def api(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPOSITORY + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=60) as response:
                  raw = response.read(2 * 1024 * 1024 + 1)
              require(len(raw) <= 2 * 1024 * 1024, "API response bound")
              return raw, json.loads(raw)

          event_bytes = Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes()
          require(len(event_bytes) <= 2 * 1024 * 1024, "Event response bound")
          event = json.loads(event_bytes)
          require(
              os.environ["GITHUB_EVENT_NAME"] == "push"
              and os.environ["GITHUB_REPOSITORY"] == REPOSITORY
              and os.environ["GITHUB_REF"] == REF
              and event.get("deleted") is False
              and event.get("ref") == REF
              and event.get("after") == os.environ["GITHUB_SHA"]
              and event.get("repository", {}).get("full_name") == REPOSITORY
              and event.get("repository", {}).get("id") == 1320694176,
              "Runtime push identity differs",
          )
          artifact_bytes, artifact = api(f"/actions/artifacts/{ARTIFACT}")
          run_bytes, run = api(f"/actions/runs/{RUN}")
          require(
              artifact.get("id") == ARTIFACT
              and artifact.get("name") == NAME
              and artifact.get("digest") == DIGEST
              and artifact.get("size_in_bytes") == 833754080
              and artifact.get("expired") is False
              and artifact.get("workflow_run", {}).get("id") == RUN
              and artifact.get("workflow_run", {}).get("head_sha") == HEAD
              and artifact.get("workflow_run", {}).get("repository_id") == 1320694176
              and artifact.get("workflow_run", {}).get("head_repository_id") == 1320694176,
              "Fixed source artifact identity differs",
          )
          require(
              run.get("id") == RUN
              and run.get("head_sha") == HEAD
              and run.get("head_branch") == REF.removeprefix("refs/heads/")
              and run.get("repository", {}).get("full_name") == REPOSITORY,
              "Fixed source run identity differs",
          )
          proof = Path(os.environ["RUNNER_TEMP"]) / "hepta-history-reshard-proof"
          proof.mkdir()
          (proof / "original-artifact-api.json").write_bytes(artifact_bytes)
          (proof / "original-run-api.json").write_bytes(run_bytes)
          (proof / "runtime-identity.json").write_text(
              json.dumps({
                  "repository": REPOSITORY,
                  "ref": REF,
                  "push_head": os.environ["GITHUB_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "original_artifact_id": ARTIFACT,
                  "original_run_id": RUN,
                  "original_head": HEAD,
                  "event_sha256": hashlib.sha256(event_bytes).hexdigest(),
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"original_artifact_id": ARTIFACT, "original_head": HEAD, "identity": "verified"}))

      - name: Download the fixed historical artifact once
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "14342327563"
          run-id: "44109517447"
          repository: TrillionniumFoundation/hepta-private-ci
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/hepta-history-original

      - name: Preserve all interrupted bytes in three bounded groups
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat

          PARTS = 3
          MAX_PAYLOAD = 383 * 1024 * 1024

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          def relative_path(value):
              path = PurePosixPath(value)
              require(
                  not path.is_absolute() and path.parts and path.as_posix() == value
                  and "\\" not in value and ":" not in value
                  and all(part not in (".", "..") for part in path.parts),
                  "Invalid original member path",
              )
              return path

          def all_files(root):
              require(root.is_dir() and not root.is_symlink(), "Original artifact directory")
              result = {}
              for path in sorted(root.rglob("*")):
                  mode = path.lstat().st_mode
                  require(stat.S_ISREG(mode) or stat.S_ISDIR(mode), "Non-regular original member")
                  if stat.S_ISREG(mode):
                      name = path.relative_to(root).as_posix()
                      relative_path(name)
                      result[name] = path
              return result

          def split(source, proof, output):
              files = all_files(source)
              require(files and len(files) <= 100000, "Original file count")
              require(not output.exists() and not output.is_symlink(), "Output already exists")
              file_rows = [{"path": name, "bytes": path.stat().st_size, "sha256": digest(path)} for name, path in sorted(files.items())]
              rows = {row["path"]: row for row in file_rows}
              pack_groups = {}
              metadata = []
              for name in files:
                  match = re.fullmatch(r"(.*(?:^|/)objects-[0-9]+)\.(pack|idx|rev)", name)
                  if match:
                      pack_groups.setdefault(match.group(1), []).append(name)
                  else:
                      metadata.append(name)
              groups = []
              for stem, names in sorted(pack_groups.items()):
                  members = sorted(names)
                  groups.append({
                      "id": stem,
                      "kind": "git-pack-files",
                      "members": members,
                      "bytes": sum(rows[name]["bytes"] for name in members),
                      "pack_present": stem + ".pack" in members,
                      "index_present": stem + ".idx" in members,
                      "reverse_index_present": stem + ".rev" in members,
                      "validation": "not performed; the interrupted final pack may be incomplete",
                  })
              metadata_bytes = sum(rows[name]["bytes"] for name in metadata)
              metadata_together = bool(metadata) and metadata_bytes + 16 * 1024 * 1024 <= MAX_PAYLOAD
              if metadata_together:
                  groups.insert(0, {"id": "original-metadata", "kind": "original-metadata", "members": sorted(metadata), "bytes": metadata_bytes})
              else:
                  groups.extend({"id": "member:" + name, "kind": "original-metadata", "members": [name], "bytes": rows[name]["bytes"]} for name in sorted(metadata))
              require(len(groups) >= PARTS, "Fewer than three complete file groups")
              for group in groups:
                  require(group["bytes"] <= MAX_PAYLOAD, "Group exceeds fixed shard bound: " + group["id"] + " (" + str(group["bytes"]) + " bytes)")
              proof_files = all_files(proof)
              require(set(proof_files) == {"original-artifact-api.json", "original-run-api.json", "runtime-identity.json"}, "Identity proof set")
              proof_rows = [{"path": name, "bytes": path.stat().st_size, "sha256": digest(path)} for name, path in sorted(proof_files.items())]
              copied_proof_bytes = sum(row["bytes"] for row in proof_rows)
              allocations = [[] for _ in range(PARTS)]
              sizes = [copied_proof_bytes] * PARTS
              if metadata_together:
                  metadata_group = groups[0]
                  allocations[0].append(metadata_group)
                  sizes[0] += metadata_group["bytes"]
                  remaining = groups[1:]
              else:
                  remaining = groups
              for group in sorted(remaining, key=lambda value: (-value["bytes"], value["id"])):
                  part = min(range(PARTS), key=lambda index: (sizes[index], index))
                  allocations[part].append(group)
                  sizes[part] += group["bytes"]
              require(all(allocations), "Empty historical shard")
              allocated_names = [name for groups_in_part in allocations for group in groups_in_part for name in group["members"]]
              require(len(allocated_names) == len(set(allocated_names)) and set(allocated_names) == set(files), "Original member allocation differs")
              base = {
                  "schema": "hepta.interrupted-history-artifact-shards.v1",
                  "original_repository": "TrillionniumFoundation/hepta-private-ci",
                  "original_run_id": 44109517447,
                  "original_artifact_id": 14342327563,
                  "original_artifact_bytes": 833754080,
                  "original_artifact_sha256": "e38611f796454bdf71dd1d0615a26769a6cb7e5941d48188fdecb06697b116e9",
                  "original_head": "eef4d2afed5f9176de4aaf790f74f5ca93d7151f",
                  "original_tree": "ab5bbb3dfbd98b3ab56a9321fa3c6925bc3b87e3",
                  "scope": "All files from the fixed interrupted historical artifact; not a complete export or a validated object store.",
                  "frozen_snapshot_policy": "Original selection is preserved. Recheck recovered ancestry against the latest protected names and pins before any merge decision.",
                  "old_manifests_and_receipts": "Opaque original bytes preserved without rewriting, requiring completion, or asserting their validity.",
                  "git_pack_validation": "Not performed; every pack and available sidecar is preserved even if incomplete.",
                  "original_relative_paths_under": "original-history/",
                  "original_files": file_rows,
                  "original_file_count": len(file_rows),
                  "original_raw_bytes": sum(row["bytes"] for row in file_rows),
                  "group_allocation": allocations,
                  "original_metadata_together_in_part_zero": metadata_together,
                  "copied_identity_proofs": proof_rows,
                  "part_count": PARTS,
              }
              manifests = [(json.dumps(dict(base, part=part), sort_keys=True, separators=(",", ":")) + "\n").encode() for part in range(PARTS)]
              require(all(sizes[part] + len(manifests[part]) <= MAX_PAYLOAD for part in range(PARTS)), "Three shards cannot contain all original groups and receipts within the fixed bound")
              output.mkdir(mode=0o700)
              for part in range(PARTS):
                  directory = output / f"part-{part}"
                  directory.mkdir(mode=0o700)
                  for group in allocations[part]:
                      for name in group["members"]:
                          destination = directory / "original-history" / relative_path(name)
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(files[name], destination)
                          require(destination.stat().st_size == rows[name]["bytes"] and digest(destination) == rows[name]["sha256"], "Copied original bytes differ: " + name)
                  for name, source_path in proof_files.items():
                      destination = directory / "reshard-identity" / name
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source_path, destination)
                      require(destination.stat().st_size == source_path.stat().st_size and digest(destination) == digest(source_path), "Copied identity bytes differ")
                  (directory / "reshard-manifest.json").write_bytes(manifests[part])
                  actual = sum(path.stat().st_size for path in all_files(directory).values())
                  require(actual == sizes[part] + len(manifests[part]) and actual <= MAX_PAYLOAD, "Final shard size differs")
                  print(json.dumps({"part": part, "payload_bytes": actual, "groups": len(allocations[part]), "original_files_in_all_parts": len(file_rows), "packs_verified": False}))

          temporary = Path(os.environ["RUNNER_TEMP"])
          split(temporary / "hepta-history-original", temporary / "hepta-history-reshard-proof", temporary / "hepta-history-shards")

      - name: Preserve historical shard 0
        id: part0
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-source-broker-history-eef4-part-0-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-history-shards/part-0/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Preserve historical shard 1
        id: part1
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-source-broker-history-eef4-part-1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-history-shards/part-1/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Preserve historical shard 2
        id: part2
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-source-broker-history-eef4-part-2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-history-shards/part-2/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Confirm all three uploaded artifact identities and sizes
        shell: python {0}
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          PART_0_ID: ${{ steps.part0.outputs.artifact-id }}
          PART_0_DIGEST: ${{ steps.part0.outputs.artifact-digest }}
          PART_1_ID: ${{ steps.part1.outputs.artifact-id }}
          PART_1_DIGEST: ${{ steps.part1.outputs.artifact-digest }}
          PART_2_ID: ${{ steps.part2.outputs.artifact-id }}
          PART_2_DIGEST: ${{ steps.part2.outputs.artifact-digest }}
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, url):
                  raise ValueError("Unexpected API redirect")

          deadline = time.monotonic() + 60
          for part in range(3):
              identifier = os.environ[f"PART_{part}_ID"]
              expected_digest = os.environ[f"PART_{part}_DIGEST"]
              if not identifier.isdecimal():
                  raise ValueError("Missing uploaded artifact identifier")
              request = urllib.request.Request(
                  "https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/" + identifier,
                  headers={
                      "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              while True:
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError("Fixed total metadata read budget expired")
                  try:
                      with urllib.request.build_opener(NoRedirect()).open(request, timeout=min(10, remaining)) as response:
                          raw = response.read(1024 * 1024 + 1)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      print(json.dumps({"part": part, "artifact_id": identifier, "observed_http_status": 404, "waiting_only_for_this_finalized_artifact": True}), flush=True)
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise
                      time.sleep(min(2, remaining))
              if time.monotonic() > deadline:
                  raise TimeoutError("Fixed total metadata read budget expired")
              if len(raw) > 1024 * 1024:
                  raise ValueError("Uploaded artifact metadata bound")
              artifact = json.loads(raw)
              expected_name = f"hepta-source-broker-history-eef4-part-{part}-" + os.environ["GITHUB_RUN_ATTEMPT"]
              if not (
                  artifact["id"] == int(identifier)
                  and artifact["name"] == expected_name
                  and artifact["size_in_bytes"] <= 384 * 1024 * 1024
                  and artifact["workflow_run"]["id"] == int(os.environ["GITHUB_RUN_ID"])
                  and artifact["workflow_run"]["head_sha"] == os.environ["GITHUB_SHA"]
                  and artifact["digest"] == "sha256:" + expected_digest
              ):
                  raise ValueError("Uploaded historical shard identity or size differs")
              print(json.dumps({key: artifact[key] for key in ("id", "name", "size_in_bytes", "digest", "workflow_run")}, sort_keys=True))
