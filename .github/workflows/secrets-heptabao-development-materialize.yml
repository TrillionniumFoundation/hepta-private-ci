name: Materialize secrets.heptabao development candidate

on:
  push:
    branches:
      - codex/secrets-heptabao-production-qualified-20260930
    paths:
      - .github/workflows/secrets-heptabao-development-materialize.yml
      - .hepta-staging/secrets-heptabao-review-materialize.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-development-materialize
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 60
    steps:
      - name: Check out exact development input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify isolated branch and clean input
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/secrets-heptabao-production-qualified-20260930"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize semantic source and canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/close_secrets_heptabao_candidate.py

      - name: Materialize deterministic strict-Clippy fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/close_secrets_heptabao_clippy.py

      - name: Generate canonical projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py --write

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format exact owned Rust sources
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-bao-adapter \
            -p codex-hepta-authbus \
            -p codex-state-sqlite

      - name: Verify build contract and generated source
        shell: bash
        run: |
          set -euo pipefail
          python3 codex-rs/hepta-bao-adapter/qa/validate_build_contract.py
          python3 scripts/generate_secrets_heptabao_module.py
          git diff --check

      - name: Commit materialized review object
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/secrets-heptabao-production-qualified-20260930 | cut -f1)"
          test "$remote_head" = "${GITHUB_SHA}"
          git config user.name "Hepta development materializer"
          git config user.email "hepta-development-materializer@users.noreply.github.com"
          git add \
            codex-rs/hepta-bao-adapter \
            docs/modules/secrets.heptabao \
            docs/lane-a-foundation/secrets.heptabao \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json
          if git diff --cached --quiet; then
            echo "No materialization delta; current SHA is already reviewable."
          else
            git commit -s -m "fix(secrets): materialize exact review candidate"
            git push origin HEAD:codex/secrets-heptabao-production-qualified-20260930
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Record generated candidate
        shell: bash
        run: |
          {
            echo "Materialized candidate: ${{ steps.candidate.outputs.sha }}"
            echo "Tree: ${{ steps.candidate.outputs.tree }}"
            echo
            echo "This workflow performs deterministic development materialization only."
            echo "It performs no qualification and grants no production state."
            echo "Independent read-only workflows must re-check the resulting SHA."
          } >> "$GITHUB_STEP_SUMMARY"
