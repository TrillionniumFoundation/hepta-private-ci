name: MemoryCell LoCoMo publisher Reader exact AST-safe format
on:
  push:
    branches: ["codex/memory-cell-evidence-20261008"]
    paths:
      - ".github/workflows/hepta-memory-locomo-publisher-astfmt.yml"
      - "scripts/memory_cell/locomo_publisher_support_reader.py"
      - "scripts/memory_cell/test_locomo_publisher_support_reader.py"
      - "scripts/memory_cell/test_locomo_publisher_astfmt_rebase.py"
permissions:
  contents: write
concurrency:
  group: memory-locomo-publisher-astfmt-${{ github.sha }}
  cancel-in-progress: false
jobs:
  format-pinned-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Format only the two previously failing source files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          TARGET_BRANCH: codex/memory-cell-evidence-20261008
        run: |
          set -euo pipefail
          mkdir -p /tmp/publisher-format
          git rev-parse HEAD > /tmp/publisher-format/original-head.txt
          git rev-parse HEAD^{tree} > /tmp/publisher-format/original-tree.txt
          python3 -m pip install --user uv==0.8.22
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          import subprocess
          files = [
              Path("scripts/memory_cell/locomo_publisher_support_reader.py"),
              Path("scripts/memory_cell/test_locomo_publisher_support_reader.py"),
          ]
          original = {}
          for path in files:
              if path.is_symlink() or not path.is_file() or not 0 < path.stat().st_size < 256000:
                  raise ValueError("nonregular or oversized source")
              original[str(path)] = ast.dump(ast.parse(path.read_text(encoding="utf-8")))
          subprocess.run(["uv", "run", "--frozen", "--project", "scripts",
                          "ruff", "format", *map(str, files)], check=True)
          for path in files:
              if ast.dump(ast.parse(path.read_text(encoding="utf-8"))) != original[str(path)]:
                  raise ValueError("AST was changed by formatting")
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed - set(original):
              raise ValueError("unapproved file modified: " + repr(sorted(changed)))
          Path("/tmp/publisher-format/receipt.json").write_text(
              json.dumps(dict(ast_identical=True, target_files=sorted(original),
                              changed_files=sorted(changed),
                              changed_business_logic=False,
                              independent_semantic_validation=False,
                              production_accepted=False), indent=2) + "\n"
          )
          PY
          python3 -m unittest discover -s scripts/memory_cell -p 'test_locomo_publisher_support_reader.py' -v |& tee /tmp/publisher-format/protocol.log
          python3 -m unittest discover -s scripts/memory_cell -p 'test_locomo_frozen_reader_pair.py' -v |& tee /tmp/publisher-format/frozen-reader.log
          python3 -m unittest discover -s scripts/memory_cell -p 'test_locomo_publisher_astfmt_rebase.py' -v |& tee /tmp/publisher-format/rebase-contract.log
          uv run --frozen --project scripts ruff format --check scripts/memory_cell/locomo_publisher_support_reader.py scripts/memory_cell/test_locomo_publisher_support_reader.py
          git diff --check
          if [[ -z "$(git diff --name-only)" ]]; then
            echo "already formatted" > /tmp/publisher-format/status.txt
            exit 0
          fi
          # Save an AST-equivalent patch; never copy stale repository trees.
          git diff --binary -- \
            scripts/memory_cell/locomo_publisher_support_reader.py \
            scripts/memory_cell/test_locomo_publisher_support_reader.py \
            > /tmp/publisher-format/ast-safe.patch
          test -s /tmp/publisher-format/ast-safe.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
            current="$(git rev-parse FETCH_HEAD)"
            # A racing Stem commit is allowed; a racing change to either
            # source file is NOT. Never overwrite the other author's fix.
            for path in \
              scripts/memory_cell/locomo_publisher_support_reader.py \
              scripts/memory_cell/test_locomo_publisher_support_reader.py; do
              original_blob="$(git rev-parse "$EXPECTED_HEAD:$path")"
              current_blob="$(git rev-parse "$current:$path")"
              if [ "$original_blob" != "$current_blob" ]; then
                echo "publisher source changed concurrently: $path" >&2
                exit 1
              fi
            done
            git reset --hard "$current"
            git apply --check /tmp/publisher-format/ast-safe.patch
            git apply /tmp/publisher-format/ast-safe.patch
            # AST is rechecked against the CURRENT parent, not only the
            # immutable workflow-triggering commit.
            python3 - <<'PYAST'
          import ast
          import subprocess
          from pathlib import Path
          paths = (
              'scripts/memory_cell/locomo_publisher_support_reader.py',
              'scripts/memory_cell/test_locomo_publisher_support_reader.py',
          )
          for name in paths:
              before = subprocess.check_output(
                  ['git', 'show', 'HEAD:' + name], text=True
              )
              after = Path(name).read_text(encoding='utf-8')
              if ast.dump(ast.parse(before)) != ast.dump(ast.parse(after)):
                  raise ValueError('formatter changed source AST: ' + name)
          PYAST
            uv run --frozen --project scripts ruff format --check \
              scripts/memory_cell/locomo_publisher_support_reader.py \
              scripts/memory_cell/test_locomo_publisher_support_reader.py
            git diff --check
            git add -- \
              scripts/memory_cell/locomo_publisher_support_reader.py \
              scripts/memory_cell/test_locomo_publisher_support_reader.py
            git diff --cached --check
            git commit -m "style(memory-cell): AST-identical privileged LoCoMo Reader formatter repair"
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              git rev-parse HEAD > /tmp/publisher-format/formatted-head.txt
              exit 0
            fi
            echo "concurrent unrelated push; retrying fast-forward $attempt/5" >&2
          done
          echo "could not fast-forward after five independent attempts" >&2
          exit 1
      - name: Retain source, exact hashes and failure artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/publisher-format/source
          cp scripts/memory_cell/locomo_publisher_support_reader.py /tmp/publisher-format/source/
          cp scripts/memory_cell/test_locomo_publisher_support_reader.py /tmp/publisher-format/source/
          cp .github/workflows/hepta-memory-locomo-publisher-astfmt.yml /tmp/publisher-format/source/
          git rev-parse HEAD > /tmp/publisher-format/checked-head.txt
          (cd /tmp/publisher-format && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: locomo-publisher-ast-safe-format
          path: /tmp/publisher-format
          if-no-files-found: error
