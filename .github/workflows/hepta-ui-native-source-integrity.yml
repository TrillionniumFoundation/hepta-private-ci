name: ui.native source integrity

on:
  push:
    branches: [work/ui-native-qualified-integration-20260928]
    paths:
      - apps/hepta-native/**
      - docs/modules/ui.native/**
      - scripts/hepta_ui_native*.py
      - scripts/test_hepta_ui_native*.py
      - .github/workflows/hepta-ui-native-source-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-native-source-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact committed source before checks (not qualification)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/ui-native-source
          git archive --format=tar HEAD | gzip -n > /tmp/ui-native-source/source.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/ui-native-source/identity.txt
          sha256sum /tmp/ui-native-source/source.tar.gz > /tmp/ui-native-source/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-source-integrity-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/ui-native-source
          if-no-files-found: error
          retention-days: 7
      - name: Source and evidence infrastructure regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_hepta_ui_native*.py' -v
          test -z "$(git status --porcelain)"

  native-feedback:
    name: Linux committed-source feedback (not six-subject acceptance)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/ui-native-target
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Establish exact feedback subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/ui-native-feedback
          git rev-parse HEAD HEAD^{tree} > /tmp/ui-native-feedback/identity.txt
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKFLOW_SHA" > /tmp/ui-native-feedback/run.txt
      - name: Install public toolchain and native build prerequisites
        id: toolchain
        run: |
          set -euo pipefail
          if test "$(id -u)" = 0; then elevated=(); else elevated=(sudo); fi
          "${elevated[@]}" apt-get update
          "${elevated[@]}" apt-get install -y build-essential pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          fi
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustc +1.95.0 -vV > /tmp/ui-native-feedback/toolchain.txt
      - name: Check committed formatting without rewriting source
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check 2>&1 | tee /tmp/ui-native-feedback/format.log
      - name: Require actual compiler-discovered retirement regressions
        id: discovery
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --lib -- --list 2>&1 | tee /tmp/ui-native-feedback/test-list.log
          grep -F 'legacy_tombstone_cannot_acquire_an_uncommitted_receipt_in_a_mixed_batch: test' /tmp/ui-native-feedback/test-list.log
          grep -F 'exact_archived_duplicate_still_returns_the_same_receipt_after_restart: test' /tmp/ui-native-feedback/test-list.log
      - name: Execute native library and integration regressions
        if: ${{ !cancelled() && steps.discovery.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets 2>&1 | tee /tmp/ui-native-feedback/native-tests.log
      - name: Strict native Clippy
        if: ${{ !cancelled() && steps.discovery.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/ui-native-feedback/clippy.log
      - name: Check source remained unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
          sha256sum /tmp/ui-native-feedback/*.log > /tmp/ui-native-feedback/logs.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-native-linux-feedback-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/ui-native-feedback
          if-no-files-found: error
          retention-days: 14
