name: Hepta Safe YAML RustSec Migration (shadow)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/skills/**"
      - "codex-rs/ext/skills/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/actions/setup-bazel-ci/**"
      - "codex-rs/core-plugins/**"
      - "codex-rs/external-agent-migration/**"
      - ".github/workflows/hepta-safe-yaml-rustsec-qualification.yml"

permissions:
  contents: read

jobs:
  resolve-reviewed-lockfile:
    # A generated proposal is not qualification of the committed dependency graph.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind qualification and lockfile to exact PR source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Install Matrix-qualified Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt
      - name: Resolve actual changed workspace Cargo.lock without fabricated crate checksums
        working-directory: codex-rs
        run: |
          cargo +1.96.0 metadata --format-version 1 >/dev/null
          cargo +1.96.0 metadata --locked --format-version 1 --no-deps >/dev/null
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          content = Path("Cargo.lock").read_bytes()
          print("HEPTA_YAML_LOCK_SHA256=" + hashlib.sha256(content).hexdigest())
          print("HEPTA_YAML_LOCK_BYTES=" + str(len(content)))
          print("HEPTA_YAML_CARGO_LOCK_BASE64_BEGIN")
          encoded = base64.b64encode(content).decode("ascii")
          for start in range(0, len(encoded), 120):
              print(encoded[start:start + 120])
          print("HEPTA_YAML_CARGO_LOCK_BASE64_END")
          PY
      - name: Retain exact dependency solver output as a reproducible review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-yaml-solver-lockfile
          path: codex-rs/Cargo.lock
          retention-days: 7
      - name: Require the generated Cargo graph to equal committed source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

  yaml-compile-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind qualification and lockfile to exact PR source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Install exact source toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Ensure committed lockfile and strict source formatting
        working-directory: codex-rs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safe-yaml-native"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/safe-yaml-native/source.txt"
          cargo +1.96.0 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +1.96.0 fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/safe-yaml-native/fmt.log"
      - name: Exercise all four YAML consumer owners and exact strict Clippy
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.96.0 test --locked -p codex-skills -p codex-core-plugins -p codex-external-agent-migration -p codex-skills-extension --lib 2>&1 | tee "$RUNNER_TEMP/safe-yaml-native/tests.log"
          cargo +1.96.0 clippy --locked -p codex-skills -p codex-core-plugins -p codex-external-agent-migration -p codex-skills-extension --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/safe-yaml-native/clippy.log"
      - name: Preserve exact tested source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Retain actual native results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-yaml-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-yaml-native/
          if-no-files-found: error
          retention-days: 7

  bazel-lock-proposal:
    # Use the original recipe. Changed output remains a proposal and fails the
    # final clean-source gate until a reviewed successor actually commits it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind actual Bazel source and original lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safe-yaml-bazel"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/safe-yaml-bazel/source.txt"
          git show HEAD:MODULE.bazel.lock > "$RUNNER_TEMP/safe-yaml-bazel/original-MODULE.bazel.lock"
          git diff --exit-code
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
      - name: Execute the existing Bazel lock generation recipe
        shell: bash
        run: |
          set -euo pipefail
          just bazel-lock-update 2>&1 | tee "$RUNNER_TEMP/safe-yaml-bazel/generation.log"
      - name: Preserve actual proposal bytes without rewriting checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safe-yaml-bazel"
          cp MODULE.bazel.lock "$RUNNER_TEMP/safe-yaml-bazel/MODULE.bazel.lock"
          git diff --binary -- MODULE.bazel.lock > "$RUNNER_TEMP/safe-yaml-bazel/MODULE.bazel.lock.patch"
          sha256sum "$RUNNER_TEMP/safe-yaml-bazel/MODULE.bazel.lock" > "$RUNNER_TEMP/safe-yaml-bazel/MODULE.bazel.lock.sha256"
      - name: Require committed-source lock parity and unchanged source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          just bazel-lock-check
      - name: Retain Bazel output including failures or lock drift
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-yaml-bazel-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-yaml-bazel/
          if-no-files-found: error
          retention-days: 7

  publish-reviewed-bazel-blob:
    # One-shot transfer of the reviewed native artifact, not a qualification gate.
    # No checkout, dependency execution, ref write, approval or deployment.
    # Remove this job when the exact blob is committed through the ordinary API.
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.event.pull_request.number == 1668 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/pon-yaml-prerequisite-rejection-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Upload only the exact reviewed generated lock blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYBLOB'
          """Publish one reviewed, immutable Bazel-generated Git blob; never mutate a ref."""
          import base64
          import hashlib
          import io
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPO = "TrillionniumFoundation/hepta-private-ci"
          API = "https://api.github.com/repos/" + REPO
          ARTIFACT = 11771830688
          RUN = 38299978867
          SOURCE = "d1b2b8dff170334a4e03a6e70d2023ba8c7adeee"
          TREE = "a32db415c526f75735faf2dfa6b75ca85170feac"
          ZIP_SHA = "26a7fe788daabe25659f8a401881f41b15452c7aaf53b4a0ae316944bed2956b"
          LOCK_SHA = "8839abba4baa3c436ad1f655ece3254b4aaa8926a9b20dc981295eb216b2f5d3"
          LOCK_BLOB = "3c82fa1427923b7893bc488598bb0efbb1226f67"
          BASE_BLOB = "fbce837efaef4e3d8a9f258c4e22bdbf3bff42ae"
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect)
          
          def read_response(response, maximum):
              data = response.read(maximum + 1)
              if len(data) > maximum:
                  raise ValueError("response exceeds fixed bound")
              return data
          
          def api(path, payload=None):
              headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                         "Accept": "application/vnd.github+json"}
              data = None if payload is None else json.dumps(payload).encode()
              if data is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(API + path, data=data, headers=headers)
              with opener.open(request, timeout=60) as response:
                  return json.loads(read_response(response, 2_000_000))
          
          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          
          metadata = api(f"/actions/artifacts/{ARTIFACT}")
          assert metadata["id"] == ARTIFACT and metadata["expired"] is False
          assert metadata["workflow_run"]["id"] == RUN
          assert metadata["workflow_run"]["head_sha"] == SOURCE
          assert metadata["digest"] == "sha256:" + ZIP_SHA
          assert metadata["size_in_bytes"] == 460987
          request = urllib.request.Request(API + f"/actions/artifacts/{ARTIFACT}/zip",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
          try:
              with opener.open(request, timeout=60) as response:
                  archive = read_response(response, 500_000)
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              location = error.headers["Location"]
              error.close()
              parsed = urllib.parse.urlsplit(location)
              assert parsed.scheme == "https" and parsed.username is None and parsed.password is None
              assert parsed.port in (None, 443)
              assert parsed.hostname and (parsed.hostname.endswith(".blob.core.windows.net")
                                          or parsed.hostname.endswith(".githubusercontent.com"))
              # A signed artifact URL is read WITHOUT forwarding the repository token.
              with opener.open(urllib.request.Request(location), timeout=60) as response:
                  archive = read_response(response, 500_000)
          assert hashlib.sha256(archive).hexdigest() == ZIP_SHA
          with zipfile.ZipFile(io.BytesIO(archive)) as package:
              names = package.namelist()
              assert len(names) == len(set(names)) == 6
              assert set(names) == {"MODULE.bazel.lock", "MODULE.bazel.lock.sha256", "MODULE.bazel.lock.patch",
                                   "generation.log", "original-MODULE.bazel.lock", "source.txt"}
              assert sum(item.file_size for item in package.infolist()) < 4_000_000
              assert package.read("source.txt").decode().splitlines() == [SOURCE, TREE]
              original = package.read("original-MODULE.bazel.lock")
              content = package.read("MODULE.bazel.lock")
          assert blob(original) == BASE_BLOB
          assert len(content) == 1706852
          assert hashlib.sha256(content).hexdigest() == LOCK_SHA and blob(content) == LOCK_BLOB
          before, after = json.loads(original), json.loads(content)
          expected_add = {"annotate-snippets_0.12.5", "arraydeque_0.5.1", "encoding_rs_io_0.1.8",
                          "granit-parser_1.3.0", "nohash-hasher_0.2.0", "serde-saphyr_1.3.0"}
          expected_remove = {"serde_yaml_0.9.34+deprecated", "unsafe-libyaml_0.2.11"}
          facts = "@@rules_rs+//rs:extensions.bzl%crate"
          old_facts, new_facts = before["facts"][facts], after["facts"][facts]
          assert set(new_facts) - set(old_facts) == expected_add
          assert set(old_facts) - set(new_facts) == expected_remove
          for key in expected_remove:
              del old_facts[key]
          for key in expected_add:
              old_facts[key] = new_facts[key]
          assert before == after
          # Upload inert bytes only. No commit, branch, tag, review or release API is used.
          result = api("/git/blobs", {"content": base64.b64encode(content).decode("ascii"), "encoding": "base64"})
          assert result["sha"] == LOCK_BLOB
          print(json.dumps({"operation": "reviewed_blob_upload_only", "artifact_id": ARTIFACT,
                            "source": SOURCE, "blob": result["sha"], "sha256": LOCK_SHA,
                            "refs_mutated": False, "qualification": False}, sort_keys=True))
          PYBLOB
