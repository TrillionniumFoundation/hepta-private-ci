name: ui.control external qualification observer

on:
  workflow_run:
    workflows:
      - ui.control external deployment qualification
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: ui-control-external-observer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  observe:
    name: secretless structured external-run observation
    if: ${{ github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: subject
        name: Bind the completed source workflow without trusting candidate code
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$SOURCE_WORKFLOW_NAME" = 'ui.control external deployment qualification'
          test "$SOURCE_RUN_EVENT" = workflow_dispatch
          test "$SOURCE_RUN_STATUS" = completed
          test -n "$SOURCE_RUN_CONCLUSION"
          [[ "$SOURCE_DISPLAY_TITLE" =~ ^ui\.control\ external\ qualification\ [0-9a-f]{40}$ ]]
          mkdir -p ui-control-external-observer-evidence
          printf 'run_id=%s\nrun_attempt=%s\nworkflow=%s\nconclusion=%s\ndisplay_title=%s\n' \
            "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_WORKFLOW_NAME" \
            "$SOURCE_RUN_CONCLUSION" "$SOURCE_DISPLAY_TITLE" \
            > ui-control-external-observer-evidence/source.txt

      - id: trusted
        name: Check out only the immutable trusted observer implementation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .ui-control-trusted
          persist-credentials: false
          fetch-depth: 1

      - id: node
        name: Setup Node.js 22 for the trusted observer only
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - id: metadata
        name: Fetch source-run and artifact metadata with read-only authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          base="$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
          for suffix in '' '/artifacts?per_page=100'; do
            case "$suffix" in
              '') output=ui-control-external-observer-evidence/workflow-run.json ;;
              *) output=ui-control-external-observer-evidence/artifacts.json ;;
            esac
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$base$suffix" \
              --output "$output"
          done

      - id: semantic
        name: Emit the non-authoritative structured source-run observation
        shell: bash
        run: |
          set -euo pipefail
          node .ui-control-trusted/qualification/ui-control/external-workflow-observation.mjs \
            ui-control-external-observer-evidence/workflow-run.json \
            ui-control-external-observer-evidence/artifacts.json \
            ui-control-external-observer-evidence/external-workflow-observation.json

      - name: Emit a fail-closed observer-infrastructure record when semantic observation is unavailable
        if: always()
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          OBSERVER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          OBSERVER_RUN_ID: ${{ github.run_id }}
          OBSERVER_RUN_ATTEMPT: ${{ github.run_attempt }}
          OBSERVER_REPOSITORY: ${{ github.repository }}
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          TRUSTED_OUTCOME: ${{ steps.trusted.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          SEMANTIC_OUTCOME: ${{ steps.semantic.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          output=ui-control-external-observer-evidence/external-workflow-observation.json
          if test -f "$output"; then exit 0; fi
          mkdir -p "$(dirname "$output")"
          python3 - "$output" <<'PY'
          import datetime
          import json
          import os
          import re
          import sys

          output = sys.argv[1]
          title = os.environ.get("SOURCE_DISPLAY_TITLE", "")
          match = re.fullmatch(r"ui\.control external qualification ([0-9a-f]{40})", title)
          def positive_integer(name):
              value = os.environ.get(name, "")
              return int(value) if value.isdigit() and int(value) > 0 else None
          receipt = {
              "schema": "hepta.ui-control.external-workflow-observation.v1",
              "status": "failed",
              "observedAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "observer": {
                  "workflowSha": os.environ.get("OBSERVER_WORKFLOW_SHA") or None,
                  "runId": positive_integer("OBSERVER_RUN_ID"),
                  "runAttempt": positive_integer("OBSERVER_RUN_ATTEMPT"),
                  "repository": os.environ.get("OBSERVER_REPOSITORY") or None,
              },
              "sourceRun": {
                  "id": positive_integer("SOURCE_RUN_ID"),
                  "attempt": positive_integer("SOURCE_RUN_ATTEMPT"),
                  "workflowId": None,
                  "workflowName": "ui.control external deployment qualification",
                  "headSha": None,
                  "event": "workflow_dispatch",
                  "status": "completed",
                  "conclusion": os.environ.get("SOURCE_RUN_CONCLUSION") or None,
                  "displayTitle": title or None,
                  "htmlUrl": None,
              },
              "requestedCandidate": {"commit": match.group(1) if match else None},
              "artifactInventory": [],
              "artifactInventoryComplete": False,
              "evidenceAvailability": {
                  "repositoryPreflight": False,
                  "candidateBuild": False,
                  "protectedExternalEvidence": False,
              },
              "observedOutcome": "failed",
              "acceptedEvidence": False,
              "failure": {
                  "stage": "observer-infrastructure",
                  "code": "UI_CONTROL_EXTERNAL_OBSERVER_INFRASTRUCTURE",
                  "message": "external workflow observer could not produce a semantic observation",
                  "checks": {
                      "subject": os.environ.get("SUBJECT_OUTCOME"),
                      "trusted": os.environ.get("TRUSTED_OUTCOME"),
                      "node": os.environ.get("NODE_OUTCOME"),
                      "metadata": os.environ.get("METADATA_OUTCOME"),
                      "semantic": os.environ.get("SEMANTIC_OUTCOME"),
                  },
              },
              "claims": {
                  "repositorySourceQualified": False,
                  "deterministicMergeQualified": False,
                  "deployedSecurityObserved": False,
                  "realBackendSemanticsQualified": False,
                  "durableCrashRestartQualified": False,
                  "independentAccessibilityAndOperatorAcceptanceSigned": False,
                  "independentSecurityReviewPassed": False,
                  "rollbackDisasterRecoveryMonitoringAndRedactionExercised": False,
                  "productionDeploymentApproved": False,
                  "releaseAuthorized": False,
              },
          }
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=False)
              handle.write("\n")
          PY

      - name: Publish the observer summary without promoting evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("ui-control-external-observer-evidence/external-workflow-observation.json")
          print("## ui.control external workflow observation")
          print()
          if not path.is_file():
              print("- Observation: unavailable")
          else:
              receipt = json.loads(path.read_text(encoding="utf-8"))
              print(f"- Source run: `{receipt.get('sourceRun', {}).get('id')}`")
              print(f"- Candidate: `{receipt.get('requestedCandidate', {}).get('commit')}`")
              print(f"- Observed outcome: `{receipt.get('observedOutcome')}`")
              print(f"- Accepted evidence: `{receipt.get('acceptedEvidence')}`")
              print(f"- Failure: `{(receipt.get('failure') or {}).get('code', 'none')}`")
          PY

      - name: Upload the immutable secretless observer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-control-external-workflow-observation-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ui-control-external-observer-evidence/
          if-no-files-found: error
          retention-days: 180
