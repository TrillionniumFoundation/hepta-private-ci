name: Hepta Stem Cell research qualification (L1 only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/**'
      - 'codex-rs/hepta-infer-worker-host/src/model_worker*.rs'
      - 'codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs'
      - '.github/workflows/hepta-stem-cell-qualification.yml'

permissions:
  contents: read

jobs:
  offline-contract-tests:
    name: Offline contract and trace tests (not model results)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Report tested commit identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python3 --version
      - name: Run strict L1 tests without model fetching
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m compileall -q qualification/stem-cell-v1
          python3 -m unittest discover -v -s qualification/stem-cell-v1 -p 'test_*.py'
          python3 -m json.tool qualification/stem-cell-v1/protocol.json > /dev/null
      - name: Check tested source remains unmodified
        run: |
          git diff --check
          git diff --exit-code

  native-worker-batch:
    name: Native Neuron Head/batch and final-use ordering contracts (L1 only)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record exact source identity
        run: |
          git rev-parse HEAD HEAD^{tree}
          rustc --version
          cargo --version
      - name: Install project test harness
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Compile native worker contract
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-infer-worker-host --lib
      # This L1 lane qualifies the changed Worker/Head implementation and a
      # source-order final-use guard. Other App Server end-to-end tests require
      # an actual Codex executable: they remain separate, non-waived gates
      # for overall production acceptance and must not be reported as passing.
      - name: Execute targeted native Worker and final-use-ordering tests
        working-directory: codex-rs
        run: >
          just test --locked -p codex-hepta-infer-worker-host --lib
          -E 'test(model_worker::) | test(cognitive_final_use_revalidation_follows_durable_dispatch)'
      - name: Enforce Rust formatting
        if: always()
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-infer-worker-host -- --check
      # Retain the deterministic formatter's exact proposed diff on the tested
      # SHA.  CI has only contents:read and never commits a formatting result.
      # This step runs even when compile/test fails; source is then restored so
      # the final clean-tree guard still exercises the checked-out candidate.
      - name: Capture candidate rustfmt patch (diagnostic only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-infer-worker-host
          git diff --binary -- codex-rs/hepta-infer-worker-host/src > "$RUNNER_TEMP/stem-worker-rustfmt.patch"
          git restore --worktree -- codex-rs/hepta-infer-worker-host/src
      - name: Upload rustfmt diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stem-worker-rustfmt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stem-worker-rustfmt.patch
          if-no-files-found: warn
          retention-days: 7
      - name: Verify read-only source
        if: always()
        run: |
          git diff --check
          git diff --exit-code
