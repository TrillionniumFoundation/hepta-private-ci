name: Apply control.engineering convergence

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/.control-engineering-patch/**
      - .github/workflows/control-engineering-convergence-patch.yml

permissions:
  contents: write

concurrency:
  group: control-engineering-convergence-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply durable owner, receipt and recovery convergence
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.control-engineering-patch/chunk* \
            | base64 --decode \
            | gzip --decompress \
            > scripts/apply_control_engineering_convergence_20260925.py
          python3 scripts/apply_control_engineering_convergence_20260925.py
          python3 -m compileall -q tools/hepta-engineering-control scripts
          git diff --check

      - name: Create local candidate and align latest convergence branch
        shell: bash
        run: |
          set -euo pipefail
          rm \
            scripts/apply_control_engineering_convergence_20260925.py \
            .github/workflows/control-engineering-convergence-patch.yml
          git config user.name "Hepta Control Engineering CI"
          git config user.email "hepta-control-engineering-ci@users.noreply.github.com"
          git add -A
          git commit -m "control.engineering: close durable product boundaries"
          git fetch origin work/product-convergence-20260923
          git rebase origin/work/product-convergence-20260923

      - name: Regenerate canonical source and gap evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-gap-closure.py normalize
          python3 scripts/hepta-implementation-maps.py migrate --module control.engineering
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta-gap-closure.py verify

      - name: Execute complete engineering owner suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -v \
            -s tools/hepta-engineering-control -p 'test_*.py'

      - name: Prepare strong sandbox host
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Execute strict sandbox and measured host qualification
        env:
          HEPTA_REQUIRE_STRONG_SANDBOX: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cd tools/hepta-engineering-control
          python3 -m unittest -v \
            test_candidate_sandbox_hardening.CandidateSandboxStrongIsolation
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=tools/hepta-engineering-control \
            python3 -m control_engineering_v2.host_qualification \
              --repository "$GITHUB_WORKSPACE" \
              --profile docs/modules/control.engineering/HOST_PROFILE.github-ubuntu-24.04.json \
              --include-strong-sandbox \
              --output "$RUNNER_TEMP/control-engineering-host.json"

      - name: Verify exact closure without promoting production
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta-gap-closure.py verify
          python3 - <<'PY'
          import json
          from pathlib import Path

          mapping = json.loads(
              Path("docs/modules/control.engineering/IMPLEMENTATION_MAP.json").read_text()
          )
          if mapping.get("productionImplementation") is not False:
              raise SystemExit("productionImplementation must remain false")
          if mapping.get("sourceBase", {}).get("commit") == "":
              raise SystemExit("sourceBase provenance missing")
          PY
          git diff --check

      - name: Amend generated evidence and push verified convergence
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit --amend --no-edit
          git fetch origin work/product-convergence-20260923
          if test "$(git rev-parse HEAD^)" != "$(git rev-parse origin/work/product-convergence-20260923)"; then
            git rebase origin/work/product-convergence-20260923
            python3 scripts/hepta-gap-closure.py normalize
            python3 scripts/hepta-implementation-maps.py migrate --module control.engineering
            python3 scripts/hepta-implementation-maps.py verify
            python3 scripts/hepta-gap-closure.py verify
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -v \
              -s tools/hepta-engineering-control -p 'test_*.py'
            git add -A
            git commit --amend --no-edit
          fi
          git push origin HEAD:work/product-convergence-20260923

      - name: Retain measured host receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-engineering-convergence-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-engineering-host.json
          if-no-files-found: warn
          retention-days: 30
