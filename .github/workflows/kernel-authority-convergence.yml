name: Kernel authority convergence

on:
  push:
    branches: [work/kernel-authority-convergence-20260925]
  pull_request:
    paths:
      - 'codex-rs/hepta-contracts/**'
      - 'codex-rs/hepta-agentd/src/authority_trust_host.rs'
      - 'codex-rs/hepta-agentd/src/automation_effect_host.rs'
      - 'codex-rs/hepta-automation/**'
      - 'qualification/kernel-authority/**'
      - 'qa/b4-no-bypass/**'
      - 'CALLERS.toml'
      - '.github/workflows/kernel-authority-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: kernel-authority-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN ONE-SHOT KERNEL AUTHORITY REMEDIATION
  bootstrap-remediation:
    name: One-shot kernel.authority remediation
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/kernel-authority-convergence-20260925')
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 0
          persist-credentials: true

      - name: Retire bootstrap from the local candidate before remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/kernel-authority-convergence.yml')
          content = path.read_text(encoding='utf-8')
          begin = '  # BEGIN ONE-SHOT KERNEL AUTHORITY REMEDIATION\n'
          end = '  # END ONE-SHOT KERNEL AUTHORITY REMEDIATION\n'
          if content.count(begin) != 1 or content.count(end) != 1:
              raise SystemExit('bootstrap markers are not exact')
          start = content.index(begin)
          stop = content.index(end, start) + len(end)
          path.write_text(content[:start] + content[stop:], encoding='utf-8')
          PY
          git config user.name kernel-authority-remediator
          git config user.email kernel-authority-remediator@users.noreply.github.com
          git add .github/workflows/kernel-authority-convergence.yml
          git commit -m 'ci(kernel-authority): retire one-shot bootstrap'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Rebase the guarded remediator onto the current branch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/kernel_authority_remediate.py')
          content = path.read_text(encoding='utf-8')

          old = '''    scaffold_changes = set(
              filter(
                  None,
                  output("git", "diff", "--name-only", f"{EXPECTED_HEAD}..HEAD").splitlines(),
              )
          )
          expected_scaffold = {
              ".github/scripts/kernel_authority_remediate.py",
              ".github/workflows/kernel-authority-remediation.yml",
          }
          if scaffold_changes != expected_scaffold:
              raise RuntimeError(
                  f"branch drifted outside the one-shot scaffold: {sorted(scaffold_changes)}"
              )
'''
          if content.count(old) != 1:
              raise SystemExit('stale scaffold-drift guard is not exact')
          content = content.replace(old, '', 1)

          old = '''    run(
                  "cargo",
                  "fmt",
                  "--manifest-path",
                  "codex-rs/Cargo.toml",
                  "-p",
                  "codex-hepta-contracts",
                  "-p",
                  "codex-hepta-fleet",
              )'''
          new = '''    run(
                  "cargo",
                  "fmt",
                  "--manifest-path",
                  "codex-rs/Cargo.toml",
                  "-p",
                  "codex-hepta-contracts",
              )'''
          if content.count(old) != 1:
              raise SystemExit('remediator formatting predecessor is not exact')
          content = content.replace(old, new, 1)

          needle = '              run format cargo fmt --check -p codex-hepta-automation -p codex-hepta-prompt-registry -p codex-hepta-fleet'
          replacement = '              run format cargo fmt --check -p codex-hepta-automation -p codex-hepta-prompt-registry'
          if content.count(needle) != 2:
              raise SystemExit('expected old and generated product formatting commands')
          index = content.rfind(needle)
          content = content[:index] + replacement + content[index + len(needle):]

          unsafe_test = '''    #[test]
    fn dispatch_boundary_serializes_revocation_until_local_entry_returns() {
        let (registry, _directory) = fixture().unwrap();
        registry.put_lease(lease(), 0).unwrap();
        let verifier = registry.verifier();
        let token = verifier.verify_use("lease-one", 1, &binding()).unwrap();
        let (entered_tx, entered_rx) = mpsc::channel();
        let (revoked_tx, revoked_rx) = mpsc::channel();
        std::thread::spawn(move || {
            entered_rx.recv().unwrap();
            let result = registry.revoke("lease-one", 1, [8; 32]);
            let _ = revoked_tx.send(result);
        });

        let expected = binding();
        let result = verifier
            .with_dispatch_boundary(token, &expected, || {
                entered_tx.send(()).unwrap();
                assert!(
                    revoked_rx.recv_timeout(Duration::from_millis(100)).is_err(),
                    "revocation crossed the local dispatch linearization fence"
                );
                11
            })
            .unwrap();
        assert_eq!(result, 11);
        assert!(
            revoked_rx
                .recv_timeout(Duration::from_secs(2))
                .expect("revocation did not complete after local dispatch boundary")
                .is_ok()
        );
    }
'''
          safe_test = '''    #[test]
    fn dispatch_boundary_serializes_revocation_until_local_entry_returns() {
        let (registry, _directory) = fixture().unwrap();
        registry.put_lease(lease(), 0).unwrap();
        let verifier = registry.verifier();
        let token = verifier.verify_use("lease-one", 1, &binding()).unwrap();
        let (entered_tx, entered_rx) = mpsc::channel();
        let (attempted_tx, attempted_rx) = mpsc::channel();
        let (release_tx, release_rx) = mpsc::channel();
        let (revoked_tx, revoked_rx) = mpsc::channel();
        let revoker = std::thread::spawn(move || {
            if entered_rx.recv().is_err() {
                return;
            }
            let _ = attempted_tx.send(());
            let result = registry.revoke("lease-one", 1, [8; 32]);
            let _ = revoked_tx.send(result);
        });

        let expected = binding();
        let dispatch = std::thread::spawn(move || {
            verifier.with_dispatch_boundary(token, &expected, || {
                let entered = entered_tx.send(()).is_ok();
                let released = release_rx.recv_timeout(Duration::from_secs(2)).is_ok();
                (entered, released, 11)
            })
        });
        attempted_rx
            .recv_timeout(Duration::from_secs(2))
            .expect("revocation worker did not reach the authority boundary");
        assert!(
            revoked_rx.recv_timeout(Duration::from_millis(100)).is_err(),
            "revocation crossed the local dispatch linearization fence"
        );
        release_tx
            .send(())
            .expect("dispatch worker did not retain the release channel");
        let (entered, released, result) = dispatch
            .join()
            .expect("dispatch worker panicked")
            .expect("dispatch boundary rejected a current lease");
        assert!(entered, "dispatch worker did not signal entry");
        assert!(released, "dispatch worker did not observe release");
        assert_eq!(result, 11);
        assert!(
            revoked_rx
                .recv_timeout(Duration::from_secs(2))
                .expect("revocation did not complete after local dispatch boundary")
                .is_ok()
        );
        revoker.join().expect("revocation worker panicked");
    }
'''
          if content.count(unsafe_test) != 2:
              raise SystemExit('expected predecessor and generated unsafe dispatch test')
          index = content.rfind(unsafe_test)
          content = content[:index] + safe_test + content[index + len(unsafe_test):]

          path.write_text(content, encoding='utf-8')
          PY
          git add .github/scripts/kernel_authority_remediate.py
          git commit -m 'ci(kernel-authority): rebase guarded remediator'

      - name: Apply, validate, commit, rebind and push
        env:
          CARGO_TERM_COLOR: always
        run: python3 .github/scripts/kernel_authority_remediate.py
  # END ONE-SHOT KERNEL AUTHORITY REMEDIATION
  identity:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.pin.outputs.source }}
      base: ${{ steps.pin.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: pin
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

  qualify:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [exact-head, synthetic-merge]
        lane: [governance, contracts, product, host]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.identity.outputs.source }}
          persist-credentials: false
      - name: Prepare immutable candidate
        run: |
          python3 qualification/kernel-authority/prepare_candidate.py \
            --mode '${{ matrix.mode }}' --base-sha '${{ needs.identity.outputs.base }}' \
            --output "$RUNNER_TEMP/authority-evidence/identity.json"
      - uses: dtolnay/rust-toolchain@master
        if: matrix.lane != 'governance'
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
        if: matrix.lane != 'governance'
      - uses: taiki-e/install-action@cargo-nextest
        if: matrix.lane != 'governance'
      - name: Execute every applicable check without retries
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set +e
          status=0
          out="$RUNNER_TEMP/authority-evidence"
          run() {
            name="$1"; shift
            "$@" 2>&1 | tee "$out/$name.log"
            rc=${PIPESTATUS[0]}
            echo "$rc" > "$out/$name.exit"
            if [ "$rc" -ne 0 ]; then status=1; fi
          }
          case "$LANE" in
            governance)
              run evidence python3 qualification/kernel-authority/verify.py self-test
              run candidate-parser python3 -m unittest discover -s qualification/kernel-authority -p "test_*.py" -v
              run b4 python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py -v
              run callers python3 scripts/verify_hepta_callers.py
              run maps python3 scripts/hepta-implementation-maps.py verify --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse 'HEAD^{tree}')"
              run whitespace git diff --check
              ;;
            contracts)
              cd codex-rs
              run format cargo fmt --check -p codex-hepta-contracts
              run tests just test --locked -p codex-hepta-contracts --retries 0
              run clippy cargo clippy --locked -p codex-hepta-contracts --all-targets -- -D warnings
              ;;
            product)
              cd codex-rs
              run format cargo fmt --check -p codex-hepta-automation -p codex-hepta-prompt-registry -p codex-hepta-fleet
              run tests just test --locked -p codex-hepta-automation -p codex-hepta-prompt-registry -p codex-hepta-fleet --retries 0
              run clippy cargo clippy --locked -p codex-hepta-automation -p codex-hepta-prompt-registry -p codex-hepta-fleet --all-targets -- -D warnings
              ;;
            host)
              cd codex-rs
              run format cargo fmt --check -p codex-hepta-agentd
              run tests just test --locked -p codex-hepta-agentd --retries 0
              run clippy cargo clippy --locked -p codex-hepta-agentd --all-targets -- -D warnings
              ;;
          esac
          exit "$status"
      - name: Retain candidate-bound logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-authority-${{ matrix.mode }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/authority-evidence
          if-no-files-found: error
          retention-days: 7
