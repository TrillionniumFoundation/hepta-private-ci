name: Kernel authority convergence

on:
  push:
    branches:
      - work/kernel-authority-convergence-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-authority-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: taiki-e/install-action@just

      - name: Verify Python evidence and B4 truth
        run: |
          python3 -m py_compile qualification/kernel-authority/verify.py
          python3 -m py_compile qa/b4-no-bypass/test_kernel_authority_closed_world.py
          python3 qualification/kernel-authority/verify.py self-test
          python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py -v
          python3 scripts/verify_hepta_callers.py

      - name: Check formatting
        working-directory: codex-rs
        run: cargo fmt --check

      - name: Test affected Rust packages
        working-directory: codex-rs
        run: |
          just test -p codex-hepta-contracts
          just test -p codex-hepta-automation --test authorized_effect
          just test -p codex-hepta-agentd
          just test -p codex-hepta-prompt-registry

      - name: Strict lint affected Rust packages
        working-directory: codex-rs
        run: |
          cargo clippy -p codex-hepta-contracts --all-targets --locked -- -D warnings
          cargo clippy -p codex-hepta-automation --all-targets --locked -- -D warnings
          cargo clippy -p codex-hepta-agentd --all-targets --locked -- -D warnings
          cargo clippy -p codex-hepta-prompt-registry --all-targets --locked -- -D warnings

      - name: Check patch cleanliness
        run: git diff --check
