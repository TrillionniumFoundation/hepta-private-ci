name: Kernel authority convergence

on:
  push:
    branches:
      - work/kernel-authority-convergence-20260925
    paths:
      - 'codex-rs/hepta-contracts/**'
      - 'codex-rs/hepta-fleet/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-automation/**'
      - 'codex-rs/hepta-prompt-registry/**'
      - 'docs/modules/kernel.authority/**'
      - 'docs/lane-a-foundation/kernel.authority/**'
      - 'qualification/kernel-authority/**'
      - 'qualification/module-execution-dossiers/detail/kernel.authority.md'
      - 'qa/b4-no-bypass/**'
      - 'CALLERS.toml'
      - 'scripts/hepta-implementation-maps.py'
      - 'scripts/verify_hepta_callers.py'
      - '.github/scripts/kernel_authority_materialize_dispatch.py'
      - '.github/workflows/kernel-authority-convergence.yml'
  pull_request:
    paths:
      - 'codex-rs/hepta-contracts/**'
      - 'codex-rs/hepta-fleet/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-automation/**'
      - 'codex-rs/hepta-prompt-registry/**'
      - 'docs/modules/kernel.authority/**'
      - 'docs/lane-a-foundation/kernel.authority/**'
      - 'qualification/kernel-authority/**'
      - 'qualification/module-execution-dossiers/detail/kernel.authority.md'
      - 'qa/b4-no-bypass/**'
      - 'CALLERS.toml'
      - 'scripts/hepta-implementation-maps.py'
      - 'scripts/verify_hepta_callers.py'
      - '.github/workflows/kernel-authority-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-authority-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-dispatch:
    name: Materialize one-shot general-lease dispatch
    if: github.event_name == 'push' && github.ref_name == 'work/kernel-authority-convergence-20260925'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Materialize and validate scoped changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/kernel_authority_materialize_dispatch.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet
          git diff --check
          python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py -v
          python3 scripts/verify_hepta_callers.py
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts dispatch_binding_
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-fleet --lib authority_port::tests
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts -p codex-hepta-fleet \
            --lib --no-deps -- -D warnings

      - name: Commit native closure and regenerate projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name kernel-authority-materializer
          git config user.email kernel-authority-materializer@users.noreply.github.com
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m 'fix(kernel-authority): seal one-shot general-lease dispatch'
          fi
          python3 scripts/hepta-implementation-maps.py migrate
          python3 scripts/hepta-implementation-maps.py sync-plasticity-status
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m 'docs(kernel-authority): rebind generated source projections'
          fi
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse 'HEAD^{tree}')"
          git diff --check
          git push origin HEAD:work/kernel-authority-convergence-20260925

  identity:
    name: Pin immutable source and base
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.pin.outputs.source }}
      source_tree: ${{ steps.pin.outputs.source_tree }}
      base: ${{ steps.pin.outputs.base }}
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - id: pin
        name: Verify immutable identities
        shell: bash
        env:
          EVENT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          source="$(git rev-parse HEAD)"
          test "$source" = "$EVENT_SOURCE"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ -n "$EVENT_BASE" ]; then
            git fetch --no-tags origin "$EVENT_BASE"
            base="$(git rev-parse "$EVENT_BASE^{commit}")"
          else
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            base="$(git rev-parse refs/remotes/origin/main)"
          fi
          test -n "$source_tree"
          test -n "$base"
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          git status --short
          test -z "$(git status --porcelain)"

  qualify:
    name: Qualification (${{ matrix.mode }}, ${{ matrix.lane }})
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [exact-head, synthetic-merge]
        lane: [governance, contracts, product, host]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.identity.outputs.source }}
          persist-credentials: false

      - name: Verify checkout before candidate preparation
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ needs.identity.outputs.source }}
          EXPECTED_TREE: ${{ needs.identity.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"

      - name: Prepare immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/kernel-authority/prepare_candidate.py \
            --mode '${{ matrix.mode }}' \
            --base-sha '${{ needs.identity.outputs.base }}' \
            --output "$RUNNER_TEMP/authority-evidence/identity.json"

      - name: Reject stale or cross-candidate identity
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          SOURCE: ${{ needs.identity.outputs.source }}
          BASE: ${{ needs.identity.outputs.base }}
          IDENTITY_PATH: ${{ runner.temp }}/authority-evidence/identity.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          path = pathlib.Path(os.environ["IDENTITY_PATH"])
          identity = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema",
              "mode",
              "sourceCommit",
              "baseCommit",
              "candidateCommit",
              "candidateTree",
              "activationGranted",
              "releaseGranted",
          }
          if set(identity) != expected:
              raise SystemExit(f"candidate identity fields drifted: {sorted(identity)}")
          if identity["schema"] != "hepta.kernel-authority-candidate.v1":
              raise SystemExit("candidate identity schema mismatch")
          if identity["mode"] != os.environ["MODE"]:
              raise SystemExit("candidate mode mismatch")
          if identity["sourceCommit"] != os.environ["SOURCE"]:
              raise SystemExit("candidate source mismatch")
          if identity["baseCommit"] != os.environ["BASE"]:
              raise SystemExit("candidate base mismatch")
          observed_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          observed_tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          if identity["candidateCommit"] != observed_commit:
              raise SystemExit("candidate commit mismatch")
          if identity["candidateTree"] != observed_tree:
              raise SystemExit("candidate tree mismatch")
          if identity["activationGranted"] is not False:
              raise SystemExit("qualification cannot grant activation")
          if identity["releaseGranted"] is not False:
              raise SystemExit("qualification cannot grant release")
          PY

      - name: Install pinned Rust toolchain
        if: matrix.lane != 'governance'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install pinned repository test tools
        if: matrix.lane != 'governance'
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Execute every applicable check without retries
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set +e
          status=0
          out="$RUNNER_TEMP/authority-evidence"
          run() {
            name="$1"; shift
            "$@" 2>&1 | tee "$out/$name.log"
            rc=${PIPESTATUS[0]}
            printf '%s\n' "$rc" > "$out/$name.exit"
            if [ "$rc" -ne 0 ]; then status=1; fi
          }
          case "$LANE" in
            governance)
              run evidence python3 qualification/kernel-authority/verify.py self-test
              run candidate-parser python3 -m unittest discover -s qualification/kernel-authority -p 'test_*.py' -v
              run b4 python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py -v
              run callers python3 scripts/verify_hepta_callers.py
              run maps python3 scripts/hepta-implementation-maps.py verify \
                --expected-sha "$(git rev-parse HEAD)" \
                --expected-tree "$(git rev-parse 'HEAD^{tree}')"
              run whitespace git diff --check
              ;;
            contracts)
              cd codex-rs
              run format cargo fmt --check -p codex-hepta-contracts
              run tests just test --locked -p codex-hepta-contracts --retries 0
              run clippy cargo clippy --locked -p codex-hepta-contracts --all-targets -- -D warnings
              ;;
            product)
              cd codex-rs
              run format cargo fmt --check -p codex-hepta-automation -p codex-hepta-prompt-registry -p codex-hepta-fleet
              run tests just test --locked -p codex-hepta-automation -p codex-hepta-prompt-registry -p codex-hepta-fleet --retries 0
              run clippy cargo clippy --locked -p codex-hepta-automation -p codex-hepta-prompt-registry -p codex-hepta-fleet --all-targets -- -D warnings
              ;;
            host)
              cd codex-rs
              run format cargo fmt --check -p codex-hepta-agentd
              run tests just test --locked -p codex-hepta-agentd --retries 0
              run clippy cargo clippy --locked -p codex-hepta-agentd --all-targets -- -D warnings
              ;;
            *)
              echo "unknown qualification lane: $LANE" >&2
              status=1
              ;;
          esac
          exit "$status"

      - name: Retain candidate-bound logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-authority-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.identity.outputs.source }}-${{ matrix.mode }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/authority-evidence
          if-no-files-found: error
          retention-days: 7

  merge-gate:
    name: Merge gate
    if: always()
    needs: [identity, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require immutable identity and every exact/merge lane
        shell: bash
        env:
          IDENTITY_RESULT: ${{ needs.identity.result }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
          SOURCE: ${{ needs.identity.outputs.source }}
          SOURCE_TREE: ${{ needs.identity.outputs.source_tree }}
          BASE: ${{ needs.identity.outputs.base }}
        run: |
          set -euo pipefail
          test "$IDENTITY_RESULT" = success
          test "$QUALIFY_RESULT" = success
          case "$SOURCE" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo 'missing immutable source identity' >&2; exit 1 ;;
          esac
          test "${#SOURCE}" -eq 40
          test "${#SOURCE_TREE}" -eq 40
          test "${#BASE}" -eq 40
          printf 'qualified source=%s tree=%s base=%s\n' "$SOURCE" "$SOURCE_TREE" "$BASE"
