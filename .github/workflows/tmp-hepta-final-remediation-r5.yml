name: tmp-hepta-final-remediation-r5

on:
  push:
    branches:
      - ops/hepta-final-remediation-r5-20260910
    paths:
      - .github/workflows/tmp-hepta-final-remediation-r5.yml

permissions:
  contents: write

concurrency:
  group: hepta-final-remediation-r5-20260910
  cancel-in-progress: false

env:
  BASE_BRANCH: integration/vnext-main-20260811
  BASE_SHA: 04f60466394a024c218ce66b1b32d1c42c462985
  SOURCE_BRANCH: codex/hepta-all-gap-closure-20260908
  SOURCE_SHA: 4d75adedbd0869fb3b8f85d8c1d697202aa8e48b
  TARGET_BRANCH: codex/hepta-all-gap-closure-final-20260910
  HEPTABAO_REPOSITORY: TrillionniumFoundation/HeptaBao
  HEPTABAO_PR: "81"
  HEPTABAO_BASE_SHA: 92894aa52de06f2f4ba7d5f234a0a55f93314474
  HEPTABAO_HEAD_SHA: 6480504418eaa2222dc372844114adb44c703510
  HEPTABAO_REMEDIATION_RUN_ID: "34424125351"
  RECIPE_COMMIT: 805cf90c8102b4e07a502a5a5689d9ffd0255d88
  RECIPE_BLOB: faaf189ac098cef37bc2aa4a6dcecad3c70625c1
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Verify immutable inputs and bind dependency
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = "$BASE_SHA"
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/final-base"
          git fetch --no-tags origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/final-source"
          test "$(git rev-parse refs/remotes/origin/final-base)" = "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/final-source)" = "$SOURCE_SHA"
          test "$(git merge-base "$BASE_SHA" "$SOURCE_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$SOURCE_SHA")" = "1"
          test -z "$(git ls-tree -r --name-only "$SOURCE_SHA" | grep '^.github/workflows/tmp-' || true)"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"

          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$HEPTABAO_REPOSITORY/pulls/$HEPTABAO_PR" \
            -o "$RUNNER_TEMP/heptabao-pr-initial.json"
          python3 - "$RUNNER_TEMP/heptabao-pr-initial.json" "$GITHUB_ENV" <<'PY'
          import json
          import sys

          path, env_path = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              pull = json.load(handle)
          observed = (pull["base"]["sha"], pull["head"]["sha"])
          expected = (
              "92894aa52de06f2f4ba7d5f234a0a55f93314474",
              "6480504418eaa2222dc372844114adb44c703510",
          )
          merge_sha = pull.get("merge_commit_sha")
          if pull["state"] != "open" or observed != expected or not merge_sha:
              raise SystemExit(
                  f"HeptaBao dependency is not exact/open: state={pull['state']!r} "
                  f"observed={observed!r} expected={expected!r} merge={merge_sha!r}"
              )
          with open(env_path, "a", encoding="utf-8") as handle:
              handle.write(f"HEPTABAO_MERGE_SHA={merge_sha}\n")
          print(f"HeptaBao exact binding: base={observed[0]} head={observed[1]} merge={merge_sha}")
          PY

      - name: Extract immutable already-qualified remediation recipe
        shell: bash
        run: |
          set -euo pipefail
          recipe="$RUNNER_TEMP/remediation-r3.yml"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/TrillionniumFoundation/hepta-private-ci/$RECIPE_COMMIT/.github/workflows/tmp-hepta-final-remediation-r3.yml" \
            -o "$recipe"
          test "$(git hash-object "$recipe")" = "$RECIPE_BLOB"
          python3 - "$recipe" "$RUNNER_TEMP/r3-apply.sh" "$RUNNER_TEMP/r3-verify.sh" <<'PY'
          from pathlib import Path
          import sys

          source, apply_out, verify_out = map(Path, sys.argv[1:])
          lines = source.read_text(encoding="utf-8").splitlines()

          def extract(step_name: str) -> str:
              marker = f"      - name: {step_name}"
              matches = [index for index, line in enumerate(lines) if line == marker]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one recipe step {step_name!r}")
              start = matches[0]
              end = next(
                  (index for index in range(start + 1, len(lines)) if lines[index].startswith("      - name: ")),
                  len(lines),
              )
              run_matches = [
                  index for index in range(start, end) if lines[index] == "        run: |"
              ]
              if len(run_matches) != 1:
                  raise SystemExit(f"expected exactly one run block for {step_name!r}")
              body = lines[run_matches[0] + 1 : end]
              rendered = []
              for line in body:
                  if line and not line.startswith("          "):
                      raise SystemExit(f"unexpected recipe indentation in {step_name!r}: {line!r}")
                  rendered.append(line[10:] if line else "")
              return "\n".join(rendered).rstrip() + "\n"

          apply_out.write_text(extract("Apply source-rooted blocker repairs"), encoding="utf-8")
          verify_out.write_text(
              extract("Regenerate and verify repository-controlled evidence"),
              encoding="utf-8",
          )
          PY
          bash -n "$RUNNER_TEMP/r3-apply.sh"
          bash -n "$RUNNER_TEMP/r3-verify.sh"

      - name: Apply source repairs and current dependency binding
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/r3-apply.sh"
          work="$RUNNER_TEMP/hepta-final-remediation-r3"
          cd "$work"
          python3 - <<'PY'
          import os
          from pathlib import Path

          merge_sha = os.environ.get("HEPTABAO_MERGE_SHA")
          if not merge_sha:
              raise SystemExit("HEPTABAO_MERGE_SHA is missing")
          candidate = Path("qualification/convergence/CANDIDATE_20260910.md")
          text = candidate.read_text(encoding="utf-8").rstrip()
          marker = "## Exact HeptaBao dependency binding"
          if marker in text:
              text = text.split(marker, 1)[0].rstrip()
          binding = f"""## Exact HeptaBao dependency binding

          This candidate is qualified only against `TrillionniumFoundation/HeptaBao` PR #81 with base `92894aa52de06f2f4ba7d5f234a0a55f93314474`, head `6480504418eaa2222dc372844114adb44c703510`, and the observed GitHub prospective merge `{merge_sha}`. The HeptaBao repository-controlled remediation qualification is GitHub Actions run `34424125351`. Any movement of the base/head pair invalidates this binding and requires exact-head requalification. A rematerialized prospective merge must be requalified even when its tree is content-equivalent. This dependency record does not grant compatibility, migration, release, deployment, or production authority.
          """
          candidate.write_text(text + "\n\n" + binding.strip() + "\n", encoding="utf-8")
          PY

      - name: Regenerate and verify repository-controlled evidence
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/r3-verify.sh"

      - name: Reverify tuple and publish exact one-parent branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$HEPTABAO_REPOSITORY/pulls/$HEPTABAO_PR" \
            -o "$RUNNER_TEMP/heptabao-pr-final.json"
          python3 - "$RUNNER_TEMP/heptabao-pr-final.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              pull = json.load(handle)
          observed = (
              pull["base"]["sha"],
              pull["head"]["sha"],
              pull.get("merge_commit_sha"),
          )
          expected = (
              os.environ["HEPTABAO_BASE_SHA"],
              os.environ["HEPTABAO_HEAD_SHA"],
              os.environ["HEPTABAO_MERGE_SHA"],
          )
          if pull["state"] != "open" or observed != expected:
              raise SystemExit(
                  f"HeptaBao tuple moved during qualification: observed={observed!r} expected={expected!r}"
              )
          PY

          work="$RUNNER_TEMP/hepta-final-remediation-r3"
          cd "$work"
          git config user.name 'Hepta final remediation'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git diff --cached --check
          tree_sha="$(git write-tree)"
          export GIT_AUTHOR_NAME='Hepta final remediation'
          export GIT_AUTHOR_EMAIL='102159240+ProfHepta@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          new_sha="$(printf '%s\n' 'fix(hepta): close final repository-controlled blockers' | git commit-tree "$tree_sha" -p "$BASE_SHA")"
          test "$(git rev-parse "$new_sha^")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$new_sha")" = "1"
          test "$(git rev-parse "$new_sha^{tree}")" = "$tree_sha"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          git push origin "$new_sha:refs/heads/$TARGET_BRANCH"
          printf 'new_candidate=%s\nbase=%s\ntree=%s\ntarget_branch=%s\n' \
            "$new_sha" "$BASE_SHA" "$tree_sha" "$TARGET_BRANCH"

      - name: Dump candidate diff on failure
        if: failure()
        shell: bash
        run: |
          work="$RUNNER_TEMP/hepta-final-remediation-r3"
          if test -d "$work/.git" || test -f "$work/.git"; then
            cd "$work"
            git status --short || true
            git diff --stat || true
            git diff --check || true
          fi

      - name: Remove source worktree
        if: always()
        shell: bash
        run: |
          git worktree remove --force "$RUNNER_TEMP/hepta-final-remediation-r3" || true
