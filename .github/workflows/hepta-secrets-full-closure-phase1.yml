name: Materialize secrets.heptabao full closure phase 1

on:
  push:
    branches:
      - codex/secrets-heptabao-full-closure-20260929
    paths:
      - ".github/workflows/hepta-secrets-full-closure-phase1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-full-closure-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-slim
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact staged candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install pinned repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Materialize, qualify, and publish ordinary source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/secrets-full-closure-phase1"
          mkdir -p "$evidence"
          shopt -s nullglob
          parts=(.hepta-staging/secrets-full-closure-phase1/part-*)
          test "${#parts[@]}" -eq 9
          cat "${parts[@]}" > "$evidence/payload.b64"
          test "$(wc -c < "$evidence/payload.b64")" -eq 48044
          echo "f715b8ea79da0721cf6f45e55fb9b8bd8c287c56de942bc68357ad6407f0185d  $evidence/payload.b64" | sha256sum -c -
          base64 -d "$evidence/payload.b64" > "$evidence/payload.tar.gz"
          echo "abe4ee89e8feca537a5106291a6f02bef62c1d79e417c890ea9008f5950d7f7b  $evidence/payload.tar.gz" | sha256sum -c -

          tar -tzf "$evidence/payload.tar.gz" | sed 's#^\./##' | grep -vE '(^$|/$)' | LC_ALL=C sort > "$evidence/actual-paths"
          printf '%s\n' \
            .github/workflows/hepta-secrets-recovery.yml \
            codex-rs/hepta-bao-adapter/migrations/0002_reconciliation_claims.sql \
            codex-rs/hepta-bao-adapter/src/lease_lifecycle.rs \
            codex-rs/hepta-bao-adapter/src/lib.rs \
            codex-rs/hepta-bao-adapter/src/operation_execution.rs \
            codex-rs/hepta-bao-adapter/src/sqlite_owner.rs \
            codex-rs/hepta-bao-adapter/src/sqlite_owner_tests.rs \
            | LC_ALL=C sort > "$evidence/expected-paths"
          diff -u "$evidence/expected-paths" "$evidence/actual-paths"
          if tar -tzf "$evidence/payload.tar.gz" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "unsafe payload path" >&2
            exit 1
          fi
          tar -xzf "$evidence/payload.tar.gz"

          # Phase two consumes the process-local execution guard. Phase one keeps
          # only the already-used cross-process lease and therefore has no dead API.
          git checkout -- codex-rs/hepta-bao-adapter/src/operation_execution.rs
          python3 - <<'PY'
          from pathlib import Path

          owner = Path("codex-rs/hepta-bao-adapter/src/sqlite_owner.rs")
          text = owner.read_text()

          field = "    executions: crate::operation_execution::OperationExecutionSet,\n"
          init = "            executions: Default::default(),\n"
          if text.count(field) != 1 or text.count(init) != 1:
              raise SystemExit("unexpected execution-set source shape")
          text = text.replace(field, "").replace(init, "")
          start = text.find("    pub(crate) fn enter_consumption_execution(")
          end = text.find("\n    pub async fn import_reference_snapshot(", start)
          if start < 0 or end < 0:
              raise SystemExit("unexpected execution-entry source shape")
          text = text[:start] + text[end:]

          metric_start = text.find("let max_reconciliation_attempts = max_reconciliation_attempts")
          metric_end = text.find(";", metric_start)
          if metric_start < 0 or metric_end < 0:
              raise SystemExit("missing reconciliation-attempt decode")
          metric = text[metric_start:metric_end]
          if metric.count(".map(fixed_u64)") != 1:
              raise SystemExit("unexpected reconciliation-attempt decode shape")
          text = text[:metric_start] + metric.replace(
              ".map(fixed_u64)", ".map(fixed_u64_allow_zero)"
          ) + text[metric_end:]

          import_marker = "    pub async fn import_reference_snapshot("
          close_method = """    pub async fn close(&self) {
              self.pool.close().await;
          }

          """
          if "pub async fn close(&self)" in text or text.count(import_marker) != 1:
              raise SystemExit("unexpected owner close/import API shape")
          text = text.replace(import_marker, close_method + import_marker)

          old_claim = """pub struct SqliteReconciliationClaimV1 {
              pub record: SqliteConsumptionRecordV1,
              pub claim_generation: u64,
              pub claim_until_unix_ms: u64,
          }
          """
          new_claim = """pub struct SqliteReconciliationClaimV1 {
              pub worker_id: String,
              pub record: SqliteConsumptionRecordV1,
              pub claim_generation: u64,
              pub claim_until_unix_ms: u64,
          }
          """
          if text.count(old_claim) != 1:
              raise SystemExit("unexpected reconciliation claim type")
          text = text.replace(old_claim, new_claim)

          old_build = """            claims.push(SqliteReconciliationClaimV1 {
                          record,
                          claim_generation,
                          claim_until_unix_ms,
                      });
          """
          new_build = """            claims.push(SqliteReconciliationClaimV1 {
                          worker_id: worker_id.to_owned(),
                          record,
                          claim_generation,
                          claim_until_unix_ms,
                      });
          """
          if text.count(old_build) != 1:
              raise SystemExit("unexpected reconciliation claim construction")
          text = text.replace(old_build, new_build)

          method_start = text.find("    pub async fn record_claimed_reconciliation_failure(")
          method_end = text.find("\n    async fn record_reconciliation_failure_inner(", method_start)
          if method_start < 0 or method_end < 0:
              raise SystemExit("unexpected claimed-failure method shape")
          method = """    pub async fn record_claimed_reconciliation_failure(
              &self,
              claim: &SqliteReconciliationClaimV1,
              observed_at_unix_ms: u64,
              next_attempt_at_unix_ms: u64,
              error_sha256: [u8; 32],
          ) -> Result<SqliteConsumptionRecordV1, SqliteBaoOwnerErrorV1> {
              validate_identifier(&claim.worker_id)?;
              if claim.claim_generation == 0 {
                  return Err(SqliteBaoOwnerErrorV1::InvalidInput);
              }
              self.record_reconciliation_failure_inner(
                  &claim.record.operation.operation_id,
                  claim.record.revision,
                  observed_at_unix_ms,
                  next_attempt_at_unix_ms,
                  error_sha256,
                  Some((&claim.worker_id, claim.claim_generation)),
              )
              .await
          }
          """
          text = text[:method_start] + method + text[method_end:]
          owner.write_text(text)

          tests = Path("codex-rs/hepta-bao-adapter/src/sqlite_owner_tests.rs")
          source = tests.read_text()
          wrong = """            .record_claimed_reconciliation_failure(
                          "worker:second",
                          "operation:recovery-claim",
                          first[0].claim_generation,
                          claimed.record.revision,
                          1_050,
                          2_000,
                          [72; 32],
                      )
          """
          wrong_typed = """            .record_claimed_reconciliation_failure(
                          &SqliteReconciliationClaimV1 {
                              worker_id: "worker:second".to_owned(),
                              ..first[0].clone()
                          },
                          1_050,
                          2_000,
                          [72; 32],
                      )
          """
          valid = """        .record_claimed_reconciliation_failure(
                      "worker:first",
                      "operation:recovery-claim",
                      first[0].claim_generation,
                      claimed.record.revision,
                      1_050,
                      2_000,
                      [72; 32],
                  )
          """
          valid_typed = """        .record_claimed_reconciliation_failure(
                      &first[0],
                      1_050,
                      2_000,
                      [72; 32],
                  )
          """
          if source.count(wrong) != 1 or source.count(valid) != 1:
              raise SystemExit("unexpected claimed-failure test calls")
          tests.write_text(source.replace(wrong, wrong_typed).replace(valid, valid_typed))
          PY

          python3 scripts/generate_secrets_heptabao_module.py 2>&1 | tee "$evidence/module-projection.log"
          python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*.py' -v 2>&1 | tee "$evidence/python-tests.log"

          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter
          cargo check --locked -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$evidence/check.log"
          cargo test --locked -p codex-hepta-bao-adapter --all-targets -- --test-threads=2 2>&1 | tee "$evidence/adapter-tests.log"
          cargo test --locked -p codex-state-sqlite --all-targets -- --test-threads=2 2>&1 | tee "$evidence/sqlite-tests.log"
          cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2 2>&1 | tee "$evidence/authbus-recovery.log"
          cargo clippy --locked -p codex-hepta-bao-adapter --all-targets -- -D warnings 2>&1 | tee "$evidence/clippy.log"
          cargo fmt -p codex-hepta-bao-adapter -- --check
          cd ..

          git diff --check
          rm -rf .hepta-staging/secrets-full-closure-phase1
          rm .github/workflows/hepta-secrets-full-closure-phase1.yml
          python3 - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/hepta-secrets-recovery.yml",
              "codex-rs/hepta-bao-adapter/migrations/0002_reconciliation_claims.sql",
              "codex-rs/hepta-bao-adapter/src/lease_lifecycle.rs",
              "codex-rs/hepta-bao-adapter/src/lib.rs",
              "codex-rs/hepta-bao-adapter/src/sqlite_owner.rs",
              "codex-rs/hepta-bao-adapter/src/sqlite_owner_tests.rs",
          }
          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True
          )
          changed = {line[3:] for line in status.splitlines() if line}
          source_changed = {
              path for path in changed
              if not path.startswith(".hepta-staging/secrets-full-closure-phase1/")
              and path != ".github/workflows/hepta-secrets-full-closure-phase1.yml"
          }
          if source_changed != expected:
              raise SystemExit(
                  f"unexpected source paths: missing={sorted(expected - source_changed)} "
                  f"extra={sorted(source_changed - expected)}"
              )
          PY

          git add -A
          git diff --cached --check
          git diff --cached --stat | tee "$evidence/final.stat"
          git config user.name "Hepta secrets closure bot"
          git config user.email "hepta-secrets-closure@users.noreply.github.com"
          git commit -m "secrets: harden SQLite owner migration, recovery, and operations"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload phase-one evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-full-closure-phase1-${{ github.sha }}
          path: ${{ runner.temp }}/secrets-full-closure-phase1
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
