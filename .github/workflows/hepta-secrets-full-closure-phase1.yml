name: Materialize secrets.heptabao full closure phase 1

on:
  push:
    branches:
      - codex/secrets-heptabao-full-closure-20260929
    paths:
      - ".github/workflows/hepta-secrets-full-closure-phase1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-full-closure-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-slim
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact staged candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install pinned repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Materialize, verify, and publish ordinary source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/secrets-full-closure-phase1"
          mkdir -p "$evidence"

          shopt -s nullglob
          parts=(.hepta-staging/secrets-full-closure-phase1/part-*)
          test "${#parts[@]}" -eq 9
          cat "${parts[@]}" > "$evidence/payload.b64"
          test "$(wc -c < "$evidence/payload.b64")" -eq 48044
          echo "f715b8ea79da0721cf6f45e55fb9b8bd8c287c56de942bc68357ad6407f0185d  $evidence/payload.b64" | sha256sum -c -
          base64 -d "$evidence/payload.b64" > "$evidence/payload.tar.gz"
          echo "abe4ee89e8feca537a5106291a6f02bef62c1d79e417c890ea9008f5950d7f7b  $evidence/payload.tar.gz" | sha256sum -c -

          tar -tzf "$evidence/payload.tar.gz" \
            | sed 's#^\./##' \
            | grep -vE '(^$|/$)' \
            | LC_ALL=C sort > "$evidence/actual-paths"
          printf '%s\n' \
            .github/workflows/hepta-secrets-recovery.yml \
            codex-rs/hepta-bao-adapter/migrations/0002_reconciliation_claims.sql \
            codex-rs/hepta-bao-adapter/src/lease_lifecycle.rs \
            codex-rs/hepta-bao-adapter/src/lib.rs \
            codex-rs/hepta-bao-adapter/src/operation_execution.rs \
            codex-rs/hepta-bao-adapter/src/sqlite_owner.rs \
            codex-rs/hepta-bao-adapter/src/sqlite_owner_tests.rs \
            | LC_ALL=C sort > "$evidence/expected-paths"
          diff -u "$evidence/expected-paths" "$evidence/actual-paths"
          if tar -tzf "$evidence/payload.tar.gz" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "unsafe payload path" >&2
            exit 1
          fi
          tar -xzf "$evidence/payload.tar.gz"

          python3 scripts/generate_secrets_heptabao_module.py 2>&1 | tee "$evidence/module-projection.log"
          python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*.py' -v 2>&1 | tee "$evidence/python-tests.log"

          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter
          cargo check --locked -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$evidence/check.log"
          cargo test --locked -p codex-hepta-bao-adapter --all-targets -- --test-threads=2 2>&1 | tee "$evidence/adapter-tests.log"
          cargo test --locked -p codex-state-sqlite --all-targets -- --test-threads=2 2>&1 | tee "$evidence/sqlite-tests.log"
          cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2 2>&1 | tee "$evidence/authbus-recovery.log"
          cargo clippy --locked -p codex-hepta-bao-adapter --all-targets -- -D warnings 2>&1 | tee "$evidence/clippy.log"
          cargo fmt -p codex-hepta-bao-adapter -- --check
          cd ..

          git diff --check
          rm -rf .hepta-staging/secrets-full-closure-phase1
          rm .github/workflows/hepta-secrets-full-closure-phase1.yml

          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/hepta-secrets-recovery.yml",
              "codex-rs/hepta-bao-adapter/migrations/0002_reconciliation_claims.sql",
              "codex-rs/hepta-bao-adapter/src/lease_lifecycle.rs",
              "codex-rs/hepta-bao-adapter/src/lib.rs",
              "codex-rs/hepta-bao-adapter/src/operation_execution.rs",
              "codex-rs/hepta-bao-adapter/src/sqlite_owner.rs",
              "codex-rs/hepta-bao-adapter/src/sqlite_owner_tests.rs",
          }
          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          changed = {line[3:] for line in status.splitlines() if line}
          source_changed = {
              path
              for path in changed
              if not path.startswith(".hepta-staging/secrets-full-closure-phase1/")
              and path != ".github/workflows/hepta-secrets-full-closure-phase1.yml"
          }
          if source_changed != expected:
              raise SystemExit(
                  f"unexpected source paths: missing={sorted(expected - source_changed)} "
                  f"extra={sorted(source_changed - expected)}"
              )
          PY

          git add -A
          git diff --cached --check
          git diff --cached --stat | tee "$evidence/final.stat"
          git config user.name "Hepta secrets closure bot"
          git config user.email "hepta-secrets-closure@users.noreply.github.com"
          git commit -m "secrets: harden SQLite owner migration, recovery, and operations"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload phase-one evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-full-closure-phase1-${{ github.sha }}
          path: ${{ runner.temp }}/secrets-full-closure-phase1
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
