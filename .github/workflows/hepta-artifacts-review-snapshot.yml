name: Learning artifacts review snapshot

on:
  push:
    branches:
      - codex/learning-artifacts-qualification-recovery-20260927-r1

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Archive tracked source and exact baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts-review"
          git archive --format=tar.gz --output="$RUNNER_TEMP/artifacts-review/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/artifacts-review/source-identity.txt"
          sha256sum "$RUNNER_TEMP/artifacts-review/source.tar.gz" > "$RUNNER_TEMP/artifacts-review/source.sha256"
      - name: Retain source snapshot without credentials or untracked files
        uses: actions/upload-artifact@v4
        with:
          name: learning-artifacts-source-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts-review/
          retention-days: 1
          if-no-files-found: error
