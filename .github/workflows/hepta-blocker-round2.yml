name: Hepta blocker round 2 materializer (temporary)

on:
  push:
    branches:
      - "codex/hepta-blocker-round2-20260907"

permissions:
  contents: read

concurrency:
  group: hepta-blocker-round2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact helper candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify formatter output and prepare guarded V8 canary retry
        shell: bash
        run: |
          set -euo pipefail
          (
            cd codex-rs
            cargo fmt --all
          )
          git diff --exit-code -- codex-rs

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/v8-canary.yml')
          text = workflow.read_text(encoding='utf-8')
          invocation_anchor = '          ./.github/scripts/run_bazel_with_buildbuddy.py '
          stage_anchor = '\n      - name: Stage release pair\n'
          stage_offset = text.index(stage_anchor)
          start = text.rfind(invocation_anchor, 0, stage_offset)
          if start < 0:
              raise SystemExit('V8 release-pair invocation anchor not found')
          block = text[start:stage_offset]
          if block.count('run_bazel_with_buildbuddy.py') != 1:
              raise SystemExit('V8 release-pair invocation block is not closed-world')
          nested_block = ''.join(
              ('  ' + line) if line.strip() else line
              for line in block.splitlines(keepends=True)
          )
          replacement = (
              '          run_v8_release_pair_build() {\n'
              + nested_block
              + '          }\n\n'
              + '          set +e\n'
              + '          run_v8_release_pair_build\n'
              + '          build_status=$?\n'
              + '          set -e\n'
              + '          if [[ "${build_status}" -eq 37 && "${TARGET}" == "aarch64-apple-darwin" && "${SANDBOX}" == "true" ]]; then\n'
              + '            echo "Bazel reported internal exit 37 on macOS arm64 sandbox; restarting the server and retrying this exact target once." >&2\n'
              + '            ./bazel shutdown || true\n'
              + '            run_v8_release_pair_build\n'
              + '          elif [[ "${build_status}" -ne 0 ]]; then\n'
              + '            exit "${build_status}"\n'
              + '          fi\n'
          )
          patched = text[:start] + replacement + text[stage_offset:]
          if patched.count('run_v8_release_pair_build()') != 1:
              raise SystemExit('unexpected retry helper cardinality')
          if patched.count('Bazel reported internal exit 37 on macOS arm64 sandbox') != 1:
              raise SystemExit('unexpected retry guard cardinality')
          if '            "--config=${{ matrix.bazel_config }}"' not in patched:
              raise SystemExit('matrix Bazel config expression was not preserved')
          workflow.write_text(patched, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = ".github/workflows/v8-canary.yml"
          grep -F '            ./.github/scripts/run_bazel_with_buildbuddy.py \' .github/workflows/v8-canary.yml
          grep -F '            "--config=${{ matrix.bazel_config }}"' .github/workflows/v8-canary.yml
          grep -F 'Bazel reported internal exit 37 on macOS arm64 sandbox' .github/workflows/v8-canary.yml

          artifact_root="${RUNNER_TEMP}/hepta-blocker-round2"
          rm -rf "${artifact_root}"
          mkdir -p "${artifact_root}"
          cp .github/workflows/v8-canary.yml "${artifact_root}/v8-canary.yml"

      - name: Upload patched V8 canary workflow
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-blocker-round2-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-blocker-round2/v8-canary.yml
          if-no-files-found: error
          retention-days: 1
