name: Hepta native desktop qualification

on:
  pull_request:
    paths:
      - "apps/hepta-native/**"
      - ".github/workflows/hepta-native-desktop.yml"
  push:
    branches:
      - main
    paths:
      - "apps/hepta-native/**"
      - ".github/workflows/hepta-native-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-native-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt-diagnostic:
    name: Rustfmt source diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Generate canonical rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/hepta-native/Cargo.toml
          git diff --binary -- apps/hepta-native/src apps/hepta-native/tests > rustfmt.patch

      - name: Retain canonical rustfmt patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-native-rustfmt-${{ github.event.pull_request.head.sha || github.sha }}
          path: rustfmt.patch
          if-no-files-found: error

      - name: Require committed source to be formatted
        shell: bash
        run: test ! -s rustfmt.patch

  native:
    name: Rust native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libdbus-1-dev

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.95.0

      - name: Resolve desktop lockfile
        shell: bash
        run: cargo generate-lockfile --manifest-path apps/hepta-native/Cargo.toml

      - name: Verify formatting
        shell: bash
        run: cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check

      - name: Test native state machine and security boundaries
        shell: bash
        run: cargo test --manifest-path apps/hepta-native/Cargo.toml --all-targets

      - name: Strict native lint
        shell: bash
        run: cargo clippy --manifest-path apps/hepta-native/Cargo.toml --all-targets -- -D warnings

      - name: Build release desktop binaries
        shell: bash
        run: cargo build --manifest-path apps/hepta-native/Cargo.toml --release --bins

      - name: Execute headless native binary self-test
        shell: bash
        run: |
          set -euo pipefail
          EXE=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then EXE=".exe"; fi
          "apps/hepta-native/target/release/hepta-native${EXE}" --self-test > native-self-test.json
          python3 - <<'PY'
          import json
          value=json.load(open("native-self-test.json", encoding="utf-8"))
          assert value["ok"] is True
          assert value["rust_state_machine"] is True
          assert value["effect_authority"] is False
          PY

      - name: Build exact-head qualification receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          EXE=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then EXE=".exe"; fi
          export BIN="apps/hepta-native/target/release/hepta-native${EXE}"
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          path=os.environ["BIN"]
          digest=hashlib.sha256(open(path,"rb").read()).hexdigest()
          head=subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          assert head == os.environ["EXPECTED_SHA"]
          receipt={
            "schema":"hepta.native.exact-head-qualification.v1",
            "head":head,
            "runner_os":os.environ.get("RUNNER_OS"),
            "machine":platform.machine(),
            "binary_sha256":digest,
            "self_test":json.load(open("native-self-test.json", encoding="utf-8")),
            "claims":{
              "source_tests_passed":True,
              "native_binary_built":True,
              "interactive_accessibility_accepted":False,
              "release_signing_accepted":False,
              "release":False
            }
          }
          with open("native-qualification.json","w",encoding="utf-8") as f:
            json.dump(receipt,f,sort_keys=True,indent=2)
          PY

      - name: Collect release binaries
        shell: bash
        run: |
          set -euo pipefail
          EXE=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then EXE=".exe"; fi
          mkdir -p native-dist
          cp "apps/hepta-native/target/release/hepta-native${EXE}" native-dist/
          cp "apps/hepta-native/target/release/hepta-native-updater${EXE}" native-dist/
          cp native-qualification.json native-dist/

      - name: Retain exact-head qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-dist/
          if-no-files-found: error

      - name: Retain generated lockfile for source pinning
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-native-lock-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/hepta-native/Cargo.lock
          if-no-files-found: error
