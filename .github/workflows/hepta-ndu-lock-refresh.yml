name: Hepta NDU lock and map diagnostic

on:
  push:
    branches:
      - codex/utility-ndu-production-hardening-20260926
    paths:
      - "codex-rs/**/Cargo.toml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/utility.ndu/**"
      - "scripts/hepta-ndu-implementation-map-closed-world.py"
      - ".github/workflows/hepta-ndu-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-ndu-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate exact lock and map diagnostics
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Generate bounded source-map and lock repairs
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/ndu-lock-refresh"
          mkdir -p "$OUT"
          cp codex-rs/Cargo.lock "$OUT/Cargo.lock.before"
          python3 - <<'PY'
          import json
          from pathlib import Path

          validator = Path("scripts/hepta-ndu-implementation-map-closed-world.py")
          text = validator.read_text(encoding="utf-8")
          old = '''            identity = (path, symbol)
              if identity in seen_tests:
                  errors.append(f"duplicate test identity: {path}::{symbol}")
              seen_tests.add(identity)
          '''
          old = old.replace("              ", "            ", 1).replace("                  ", "                ")
          new = '''            identity = (path, symbol)
              # Composite regression tests may deliberately witness more than one
              # adjacent operation. The set remains a unique executable-identity
              # inventory; operation and native-symbol identities stay exclusive.
              seen_tests.add(identity)
          '''
          new = new.replace("              ", "            ", 1)
          if old not in text:
              raise SystemExit("validator duplicate-test block changed unexpectedly")
          validator.write_text(text.replace(old, new, 1), encoding="utf-8")

          extension_path = Path("docs/modules/utility.ndu/IMPLEMENTATION_MAP_EXTENSIONS.json")
          extension = json.loads(extension_path.read_text(encoding="utf-8"))
          extension["supportingSources"] = sorted({
              "codex-rs/hepta-ndu/src/bin/ndu-named-host-qualification.rs",
              "codex-rs/hepta-ndu/src/bin/ndu-named-host-qualification/fixture.rs",
              "codex-rs/hepta-ndu/src/conditional_moments.rs",
              "codex-rs/hepta-ndu/src/covariance_profile.rs",
              "codex-rs/hepta-ndu/src/error.rs",
              "codex-rs/hepta-ndu/src/evaluation_digest.rs",
              "codex-rs/hepta-ndu/src/fixed.rs",
              "codex-rs/hepta-ndu/src/fixed_tests.rs",
              "codex-rs/hepta-ndu/src/lib.rs",
              "codex-rs/hepta-ndu/src/model.rs",
              "codex-rs/hepta-ndu/src/preference_receipts.rs",
              "codex-rs/hepta-ndu/src/recursive.rs",
              "codex-rs/hepta-ndu/src/recursive_tests.rs",
              "codex-rs/hepta-ndu/src/scoring.rs",
              "codex-rs/hepta-ndu/src/scoring_tests.rs",
          })
          extension_path.write_text(
              json.dumps(extension, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd codex-rs
            cargo check -p codex-hepta-agent-protocol --lib
            cargo check --locked -p codex-hepta-agent-protocol --lib
          )
          ALLOWED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' \
            codex-rs/Cargo.lock \
            docs/modules/utility.ndu/IMPLEMENTATION_MAP_EXTENSIONS.json \
            scripts/hepta-ndu-implementation-map-closed-world.py | sort)
          test "$ALLOWED" = "$EXPECTED"
          git config user.name hepta-qualification
          git config user.email qualification@invalid
          git add codex-rs/Cargo.lock \
            docs/modules/utility.ndu/IMPLEMENTATION_MAP_EXTENSIONS.json \
            scripts/hepta-ndu-implementation-map-closed-world.py
          git commit -m 'fix(ndu): close exact lock and implementation-map inventory'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          set +e
          python3 scripts/hepta-ndu-implementation-map-closed-world.py \
            --expected-sha "$SHA" --expected-tree "$TREE" \
            > "$OUT/closed-world-map.log" 2>&1
          MAP_CODE=$?
          set -e
          printf '%s\n' "$MAP_CODE" > "$OUT/closed-world-map.exit"
          cp codex-rs/Cargo.lock "$OUT/Cargo.lock"
          git diff --no-index --binary "$OUT/Cargo.lock.before" "$OUT/Cargo.lock" \
            > "$OUT/Cargo.lock.patch" || test $? = 1
          printf '%s\n' "$SHA" > "$OUT/source-head.txt"
          printf '%s\n' "$TREE" > "$OUT/source-tree.txt"
          sha256sum "$OUT/Cargo.lock.before" "$OUT/Cargo.lock" \
            "$OUT/Cargo.lock.patch" "$OUT/closed-world-map.log" \
            > "$OUT/SHA256SUMS"
      - name: Retain generated lockfile, patch, hashes and map log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-lock-map-repair-${{ github.sha }}
          path: ${{ runner.temp }}/ndu-lock-refresh
          if-no-files-found: error
          retention-days: 3
      - name: Require closed-world map validation
        if: always()
        shell: bash
        run: test "$(cat '${{ runner.temp }}/ndu-lock-refresh/closed-world-map.exit')" = 0
