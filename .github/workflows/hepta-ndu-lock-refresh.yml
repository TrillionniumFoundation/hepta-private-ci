name: Hepta NDU lock and map diagnostic

on:
  push:
    branches:
      - codex/utility-ndu-production-hardening-20260926
    paths:
      - "codex-rs/**/Cargo.toml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/utility.ndu/**"
      - "scripts/hepta-ndu-implementation-map-closed-world.py"
      - ".github/workflows/hepta-ndu-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-ndu-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate exact lock and map diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Generate diagnostics and exact lock refresh
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/ndu-lock-refresh"
          mkdir -p "$OUT"
          cp codex-rs/Cargo.lock "$OUT/Cargo.lock.before"
          SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          set +e
          python3 scripts/hepta-ndu-implementation-map-closed-world.py \
            --expected-sha "$SHA" --expected-tree "$TREE" \
            > "$OUT/closed-world-map.log" 2>&1
          MAP_CODE=$?
          set -e
          printf '%s\n' "$MAP_CODE" > "$OUT/closed-world-map.exit"
          (
            cd codex-rs
            cargo metadata --format-version 1 --no-deps > /dev/null
            cargo metadata --locked --format-version 1 --no-deps > /dev/null
          )
          cp codex-rs/Cargo.lock "$OUT/Cargo.lock"
          git diff --binary -- codex-rs/Cargo.lock > "$OUT/Cargo.lock.patch"
          sha256sum "$OUT/Cargo.lock.before" "$OUT/Cargo.lock" \
            "$OUT/Cargo.lock.patch" "$OUT/closed-world-map.log" \
            > "$OUT/SHA256SUMS"
          if ! git diff --quiet -- codex-rs/Cargo.lock; then
            test "$(git diff --name-only)" = "codex-rs/Cargo.lock"
            git config user.name hepta-qualification
            git config user.email qualification@invalid
            git add codex-rs/Cargo.lock
            git commit -m 'chore(ndu): refresh Cargo.lock for versioned admission'
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
      - name: Retain generated lockfile, patch, hashes and map log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-lock-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/ndu-lock-refresh
          if-no-files-found: error
          retention-days: 3
      - name: Require closed-world map validation
        if: always()
        shell: bash
        run: test "$(cat '${{ runner.temp }}/ndu-lock-refresh/closed-world-map.exit')" = 0
