name: Prompt registry source snapshot
on:
  push:
    branches:
      - codex/prompt-registry-production-closeout-20260929
    paths:
      - .github/workflows/prompt-registry-closeout-source.yml
permissions:
  contents: read
concurrency:
  group: prompt-registry-source-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/prompt-registry-production-closeout-20260929
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact tracked source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prompt-registry-source"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-sha.txt"
          git rev-parse HEAD^{tree} > "$out/source-tree.txt"
          git archive --format=tar.gz --output="$out/hepta-private-ci.tar.gz" HEAD
          sha256sum "$out/hepta-private-ci.tar.gz" > "$out/hepta-private-ci.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-source-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-registry-source
          if-no-files-found: error
          retention-days: 7
