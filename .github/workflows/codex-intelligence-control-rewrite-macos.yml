name: Codex intelligence-control fresh-authority rewrite macOS

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/intelligence-control-rewrite-macos-trigger

permissions:
  contents: write

concurrency:
  group: codex-intelligence-control-fresh-authority-rewrite-macos
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply restart replay fresh-authority rewrite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 -m py_compile scripts/codex-intelligence-learning-reconcile-rewrite.py
          python3 scripts/codex-intelligence-learning-reconcile-rewrite.py
          (cd codex-rs && cargo fmt --all)
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          source = Path("codex-rs/hepta-agentd/src/intelligence_learning.rs").read_text()
          normalized = " ".join(source.split())
          start = normalized.index("pub async fn reconcile_unsettled")
          end = normalized.index("pub async fn backlog_metrics", start)
          reconcile = normalized[start:end]

          required_source = (
              "fn observe_applied_payload(",
              "FinalUseError::EpochMismatch",
              "FinalUseError::Revoked",
              "ReconciliationOutcome::Applied",
              "ReconciliationOutcome::NotApplied",
              "ReconciliationOutcome::Quarantined",
              "Ok(Some(receipt)) => ApplyObservation::Acknowledged(receipt)",
          )
          missing_source = [item for item in required_source if item not in normalized]
          if missing_source:
              raise SystemExit(
                  f"fresh-authority rewrite missing required source anchors: {missing_source}"
              )

          required_reconcile = (
              "let binding = record.intent.final_use_binding();",
              "self.grants.signed_grant(&binding)?",
              "claim_final_use(&self.authority, &signed, &binding)",
              "dispatch_final_use(",
              "&self.authority, token, &binding,",
              "apply_payload(&mut writer, &payload)",
              "ApplyObservation::Acknowledged(receipt)",
          )
          missing_reconcile = [item for item in required_reconcile if item not in reconcile]
          if missing_reconcile:
              raise SystemExit(
                  f"restart reconciliation missing authority anchors: {missing_reconcile}"
              )

          ordered = (
              "observe_applied_payload(&writer, &payload)",
              "self.grants.signed_grant(&binding)?",
              "claim_final_use(&self.authority, &signed, &binding)",
              "dispatch_final_use(",
              "apply_payload(&mut writer, &payload)",
          )
          positions = [reconcile.index(item) for item in ordered]
          if positions != sorted(positions) or len(set(positions)) != len(positions):
              raise SystemExit(
                  f"restart reconciliation authority order is invalid: {positions}"
              )
          PY
          (cd codex-rs && cargo metadata --format-version 1 --no-deps >/dev/null)

      - name: Verify exact patch allowlist
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^codex-rs/hepta-agentd/src/intelligence_learning\.rs$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected rewrite paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit fresh-authority replay closure
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/hepta-agentd/src/intelligence_learning.rs
          git commit -m 'fix(intelligence): revalidate authority before restart replay'
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
