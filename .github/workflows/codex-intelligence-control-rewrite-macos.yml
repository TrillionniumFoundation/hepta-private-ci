name: Codex intelligence-control recovery repair macOS

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/intelligence-control-rewrite-macos-trigger

permissions:
  contents: write

concurrency:
  group: codex-intelligence-control-recovery-repair-macos
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair persisted completeness observation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 -m py_compile scripts/codex-intelligence-learning-completeness-rewrite.py
          python3 scripts/codex-intelligence-learning-completeness-rewrite.py
          (cd codex-rs && cargo fmt --all)
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          source = Path("codex-rs/hepta-agentd/src/intelligence_learning.rs").read_text()
          normalized = " ".join(source.split())
          required = (
              "use codex_hepta_learning_ledger::validate_candidate_set_completeness;",
              "validate_candidate_set_completeness(&completeness)",
              "value.candidate_completeness_digest == completeness_digest",
              "observe_applied_payload(&writer, &payload)",
              "self.grants.signed_grant(&binding)?",
              "claim_final_use(&self.authority, &signed, &binding)",
              "dispatch_final_use(",
          )
          missing = [item for item in required if item not in normalized]
          if missing:
              raise SystemExit(f"recovery repair missing required source anchors: {missing}")
          forbidden = (
              "value.completeness == completeness",
              "classify_apply(apply_payload(&mut writer, &payload))",
          )
          present = [item for item in forbidden if item in normalized]
          if present:
              raise SystemExit(f"stale recovery forms remain: {present}")
          PY
          (cd codex-rs && cargo metadata --format-version 1 --no-deps >/dev/null)

      - name: Verify exact patch allowlist
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^codex-rs/hepta-agentd/src/intelligence_learning\.rs$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected rewrite paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit recovery observation repair
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/hepta-agentd/src/intelligence_learning.rs
          git commit -m 'fix(intelligence): match persisted decision completeness digest'
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
