name: Hepta operator acceptance native signature verification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-operator-acceptance/**"
      - ".bazelrc"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - ".github/workflows/hepta-operator-acceptance-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-operator-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  native:
    name: Original operator controls and independent OpenSSH oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install original repository runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Record actual source, compiler and independent OpenSSH executable
        run: |
          $evidence = "$env:RUNNER_TEMP/operator-native"
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "${{ github.event.pull_request.head.sha || github.sha }}") { throw "source identity mismatch" }
          git rev-parse HEAD "HEAD^{tree}" | Tee-Object "$evidence/source.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $oracle = if ($IsWindows) { "$env:SystemRoot/System32/OpenSSH/ssh-keygen.exe" } else { "/usr/bin/ssh-keygen" }
          if (-not (Test-Path -LiteralPath $oracle -PathType Leaf)) { throw "independent native OpenSSH oracle is required" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $oracle | ConvertTo-Json | Set-Content "$evidence/openssh.json"
          Set-Location codex-rs
          rustc --version --verbose | Tee-Object "$evidence/toolchain.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path target/nextest/local/junit.xml) { Remove-Item target/nextest/local/junit.xml }
      - name: Run all original operator controls and actual OpenSSH compatibility checks
        run: |
          Set-Location codex-rs
          just test --locked -p codex-hepta-operator-acceptance --lib --no-tests fail --retries 0 2>&1 | Tee-Object "$env:RUNNER_TEMP/operator-native/tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain fresh JUnit and verify unchanged source
        if: always()
        run: |
          $evidence = "$env:RUNNER_TEMP/operator-native"
          if (Test-Path codex-rs/target/nextest/local/junit.xml) {
            Copy-Item codex-rs/target/nextest/local/junit.xml "$evidence/junit.xml"
            Get-FileHash -Algorithm SHA256 -LiteralPath "$evidence/junit.xml" | ConvertTo-Json | Set-Content "$evidence/junit-sha256.json"
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --porcelain | Set-Content "$evidence/status.txt"
          Set-Location codex-rs
          cargo fmt --package codex-hepta-operator-acceptance -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/operator-native
          if-no-files-found: error
          retention-days: 14

  bazel-oracle:
    name: Original Bazel operator oracle with native placement (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    environment:
      name: bazel
      deployment: false
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare original Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-test
      - name: Bind source and installed OpenSSH oracle
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          output = Path(os.environ["RUNNER_TEMP"]) / "operator-bazel"
          output.mkdir()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != os.environ["EXPECTED_SOURCE_SHA"]:
              raise RuntimeError("source identity mismatch")
          source = {"head": head,
                    "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                    "host_os": "${{ runner.os }}",
                    "target_triple": "${{ matrix.target }}",
                    "oracle": "/usr/bin/ssh-keygen",
                    "oracle_sha256": hashlib.sha256(Path("/usr/bin/ssh-keygen").read_bytes()).hexdigest(),
                    "bazelrc_sha256": hashlib.sha256(Path(".bazelrc").read_bytes()).hexdigest(),
                    "target": "//codex-rs/hepta-operator-acceptance:hepta-operator-acceptance-tests"}
          (output / "source.json").write_text(json.dumps(source, indent=2) + "\n")
          PY
      - name: Run the original target with the real CI execution policy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --remote-download-toplevel \
            -- \
            test \
            --nocache_test_results \
            --build_metadata=COMMIT_SHA=$EXPECTED_SOURCE_SHA \
            -- \
            //codex-rs/hepta-operator-acceptance:hepta-operator-acceptance-tests
      - name: Retain original test output and source identity
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          output = Path(os.environ["RUNNER_TEMP"]) / "operator-bazel"
          source = json.loads((output / "source.json").read_text())
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != source["head"]:
              raise RuntimeError("source identity changed")
          if hashlib.sha256(Path(".bazelrc").read_bytes()).hexdigest() != source["bazelrc_sha256"]:
              raise RuntimeError("execution policy changed")
          logs = Path("bazel-testlogs/codex-rs/hepta-operator-acceptance/hepta-operator-acceptance-tests")
          retained = {}
          for name in ("test.log", "test.xml"):
              path = logs / name
              if not path.is_file():
                  raise RuntimeError("missing original Bazel oracle evidence: " + str(path))
              data = path.read_bytes()
              shutil.copyfile(path, output / name)
              retained[name] = hashlib.sha256(data).hexdigest()
          (output / "retained.json").write_text(json.dumps(retained, indent=2) + "\n")
          subprocess.run(["git", "diff", "--exit-code"], check=True)
          PY
      - name: Preserve actual Bazel execution and oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-bazel-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/operator-bazel
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error
          retention-days: 14
