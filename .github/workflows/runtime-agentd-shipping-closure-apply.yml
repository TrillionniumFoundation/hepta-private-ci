name: Runtime Agentd shipping closure apply

on:
  push:
    branches:
      - work/runtime-agentd-shipping-closure-20260930
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-agentd-shipping-closure-apply
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/runtime-agentd-shipping-closure-20260930
          persist-credentials: true
          fetch-depth: 0
      - name: Materialize typed shipping profile
        run: python3 scripts/qualification/runtime_agentd_shipping_profile_apply.py
      - name: Install pinned Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - name: Format and verify typed profile
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml --package codex-hepta-agentd --package codex-hepta-agent-protocol
          cargo check --locked -p codex-hepta-agentd --all-targets
          cargo check --locked -p codex-hepta-agentd --all-targets --features shipping-product
          cargo test --locked -p codex-hepta-agentd --lib
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/hepta-agentd codex-rs/hepta-agent-protocol
          git diff --cached --quiet && exit 0
          git commit -m 'feat(runtime.agentd): bind typed shipping product profile'
          git push origin HEAD:work/runtime-agentd-shipping-closure-20260930
