name: Runtime Agentd shipping closure apply

on:
  push:
    branches:
      - work/runtime-agentd-shipping-closure-20260930
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-agentd-shipping-closure-apply
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/runtime-agentd-shipping-closure-20260930
          persist-credentials: true
          fetch-depth: 0
      - name: Materialize typed shipping profile
        shell: bash
        run: |
          set -euo pipefail
          # Keep the staged patch deterministic while correcting two Rust-level
          # details discovered during source review. The final committed source
          # is ordinary Rust; this temporary materializer is removed afterward.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/qualification/runtime_agentd_shipping_profile_apply.py')
          text = path.read_text()
          text = text.replace(
              'runtime_codex_supervisor_installed: self.runtime_codex_snapshot()?.is_some(),',
              'runtime_codex_supervisor_installed: self.runtime_codex.get().is_some(),',
          )
          text = text.replace(
              'pub const fn from_profile(profile: AgentdProductProfileV1) -> Self {',
              'pub fn from_profile(profile: AgentdProductProfileV1) -> Self {',
          )
          path.write_text(text)
          PY
          python3 scripts/qualification/runtime_agentd_shipping_profile_apply.py
      - name: Install pinned Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Format and verify typed profile
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml --package codex-hepta-agentd --package codex-hepta-agent-protocol
          cargo check --locked -p codex-hepta-agentd --all-targets
          cargo check --locked -p codex-hepta-agentd --all-targets --features shipping-product
          cargo clippy --locked -p codex-hepta-agentd --all-targets --features shipping-product -- -D warnings
          cargo test --locked -p codex-hepta-agentd --lib
          cargo test --locked -p codex-hepta-agentd --test runtime_codex_process_crash_matrix
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/hepta-agentd codex-rs/hepta-agent-protocol
          git diff --cached --quiet && exit 0
          git commit -m 'feat(runtime.agentd): bind typed shipping product profile'
          git push origin HEAD:work/runtime-agentd-shipping-closure-20260930
