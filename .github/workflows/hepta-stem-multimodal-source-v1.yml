name: Hepta multimodal Stem V1 source-only shadow
on:
  push:
    branches:
      - research/stem-multimodal-source-bound-v1-20261016
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/multimodal_stem_v1.py'
      - 'qualification/stem-cell-v1/test_multimodal_stem_v1.py'
      - 'qualification/stem-cell-v1/MULTIMODAL_STEM_V1_HANDOFF.md'
      - '.github/workflows/hepta-stem-multimodal-source-v1.yml'
permissions:
  contents: read
jobs:
  source-only:
    # Exact Python source-only tests and DENY_ALL assertions passed on ARM64
    # in isolated run 38912968310 (job 117013143931).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only adversarial tests
        working-directory: qualification/stem-cell-v1
        run: |
          python -m unittest -v test_multimodal_stem_v1
          python -O -m unittest -v test_multimodal_stem_v1
          python -m py_compile multimodal_stem_v1.py test_multimodal_stem_v1.py
      - name: Verify no source-only authorization
        working-directory: qualification/stem-cell-v1
        run: |
          python - <<'PY'
          from multimodal_stem_v1 import audit_split
          r=audit_split([0]*200,[1]*200,[1]*200,0)
          assert r["authority"]=="DENY_ALL"
          assert r["split_authorized"] is False
          assert r["quality_attested"] is False
          PY
