name: Cognitive store qualification closure Windows finalizer

on:
  push:
    branches:
      - codex/cognitive-store-full-closure-20260927
    paths:
      - '.github/workflows/cognitive-store-qualification-closure-windows-finalizer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-store-qualification-closure-windows-finalizer
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_HEAD: f2374811d3926e47e8a25e0e3fbbf530c3004ce3
  EXPECTED_STAGING_HEAD: 8474d3fa369e581be4c43dddc9afe7f4b2860872
  TARGET_BRANCH: codex/cognitive-store-full-closure-20260927
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/cognitive-store-full-closure-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded authoring head and apply reviewed closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'checkout is not the triggering commit' }
          git merge-base --is-ancestor $env:EXPECTED_STAGING_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw 'staging ancestor is missing' }
          $changed = @(git diff --name-only $env:EXPECTED_SOURCE_HEAD HEAD | Sort-Object)
          $expected = @(
            '.github/authoring/cognitive-store-qualification-closure.patch.b64.part-00',
            '.github/authoring/cognitive-store-qualification-closure.patch.b64.part-01',
            '.github/authoring/cognitive-store-qualification-closure.patch.b64.part-02',
            '.github/authoring/cognitive-store-qualification-closure.patch.b64.part-03',
            '.github/authoring/cognitive-store-qualification-closure.patch.b64.part-04',
            '.github/authoring/cognitive-store-qualification-closure.patch.b64.part-05',
            '.github/authoring/cognitive-store-qualification-closure.patch.b64.part-06',
            '.github/authoring/cognitive-store-qualification-closure.patch.b64.part-07',
            '.github/workflows/cognitive-store-qualification-closure-finalizer.yml',
            '.github/workflows/cognitive-store-qualification-closure-windows-finalizer.yml'
          )
          if (($changed -join "`n") -ne ($expected -join "`n")) { throw "unexpected staging paths:`n$($changed -join "`n")" }
          if (git status --porcelain --untracked-files=normal) { throw 'checkout is dirty' }
          @'
          import base64, gzip
          from pathlib import Path
          parts = sorted(Path('.github/authoring').glob('cognitive-store-qualification-closure.patch.b64.part-*'))
          encoded = ''.join(path.read_text(encoding='utf-8') for path in parts)
          Path('cognitive-store-qualification-closure.patch').write_bytes(
              gzip.decompress(base64.b64decode(encoded))
          )
          '@ | python -
          git apply --check cognitive-store-qualification-closure.patch
          git apply cognitive-store-qualification-closure.patch
          Remove-Item cognitive-store-qualification-closure.patch
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'source patch has whitespace errors' }

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Validate cross-platform source composition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/cognitive_store_status.py --write
          python scripts/cognitive_store_status.py --check
          python scripts/test_cognitive_plan_binding.py -v
          Push-Location codex-rs
          cargo fmt --package codex-hepta-cognitive-store --package codex-hepta-memory --package codex-hepta-agentd
          cargo check --locked -p codex-hepta-agentd --lib
          cargo test --locked -p codex-hepta-agentd --test cognitive_store_read_pages
          cargo test --locked -p codex-hepta-agentd --test cognitive_store_host_read_pages --features qualification-cognitive-write
          cargo test --locked -p codex-hepta-agentd --test cognitive_store_product_writer --features qualification-cognitive-write
          cargo test --locked -p codex-hepta-memory --lib
          cargo clippy --locked -p codex-hepta-cognitive-store -p codex-hepta-memory -p codex-hepta-agentd --all-targets --all-features --no-deps -- -D warnings
          cargo fmt --package codex-hepta-cognitive-store --package codex-hepta-memory --package codex-hepta-agentd -- --check
          Pop-Location
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'validated source has whitespace errors' }

      - name: Commit exact source snapshot and implementation bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Hepta Cognitive Store Finalizer'
          git config user.email 'hepta-cognitive-store@users.noreply.github.com'
          Remove-Item .github/authoring/cognitive-store-qualification-closure.patch.b64.part-*
          Remove-Item .github/workflows/cognitive-store-qualification-closure-finalizer.yml
          Remove-Item .github/workflows/cognitive-store-qualification-closure-windows-finalizer.yml
          Remove-Item scripts/cognitive_store_qualification_closure.sh
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'source snapshot has whitespace errors' }
          git commit -s -m 'fix(cognitive-store): close exact-candidate qualification blockers'
          $source = (git rev-parse HEAD).Trim()
          python scripts/cognitive_store_map_generate.py --source-commit $source > "$env:RUNNER_TEMP/IMPLEMENTATION_MAP.json"
          Move-Item -Force "$env:RUNNER_TEMP/IMPLEMENTATION_MAP.json" docs/modules/cognitive.store/IMPLEMENTATION_MAP.json
          git add docs/modules/cognitive.store/IMPLEMENTATION_MAP.json
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'implementation map has whitespace errors' }
          git commit -s -m 'docs(cognitive-store): bind qualification closure source snapshot'
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          python scripts/cognitive_store_map_verify.py --expected-sha $head --expected-tree $tree
          python scripts/cognitive_store_status.py --check
          Push-Location codex-rs
          cargo fmt --package codex-hepta-cognitive-store --package codex-hepta-memory --package codex-hepta-agentd -- --check
          Pop-Location
          if (git status --porcelain --untracked-files=normal) { throw 'final candidate is dirty' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
