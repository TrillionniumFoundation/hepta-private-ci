name: Hepta Git Process Tree Cleanup Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codex-rs/git-utils/src/git_process.rs'
      - 'codex-rs/git-utils/src/git_process_tests.rs'
      - '.github/workflows/hepta-git-process-tree-qualification.yml'

permissions:
  contents: read

jobs:
  unix-wrapper-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install exact project Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Source formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Real Unix process-tree cleanup regression tests
        run: |
          cargo +1.95.0 test --locked -p codex-git-utils --lib 'git_process::tests::' -- --nocapture
      - name: Strict git-utils clippy
        run: cargo +1.95.0 clippy --locked -p codex-git-utils --all-targets -- -D warnings

  windows-wrapper-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install exact project Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Real Windows JobObject child cleanup regression tests
        shell: pwsh
        run: |
          cargo +1.95.0 test --locked -p codex-git-utils --lib 'git_process::tests::' -- --nocapture
