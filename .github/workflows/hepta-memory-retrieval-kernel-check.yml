name: Memory retrieval kernel regression

on:
  pull_request:
  push:
    branches: [work/memory-retrieval-semantic-product-convergence-20260926]
    paths: ['codex-rs/**', 'scripts/**', '.github/workflows/**', 'docs/modules/memory.retrieval/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze source identity
        run: |
          python scripts/capture_memory_retrieval_source.py --source-sha "$SOURCE" --source-tree "$(git rev-parse HEAD^{tree})" --output "$RUNNER_TEMP/retrieval-kernel-source.json"
      - name: Install exact compiler
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Execute retrieval regressions
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-memory-retrieval --all-targets 2>&1 | tee "$RUNNER_TEMP/retrieval-kernel-tests.log"
      - name: Execute strict all-target lint diagnostics
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.95.0 clippy --locked -p codex-hepta-memory-retrieval --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/retrieval-kernel-clippy.log"
      - name: Retain exact-head source check
        if: ${{ !cancelled() }}
        run: |
          python scripts/capture_memory_retrieval_source.py --source-sha "$SOURCE" --source-tree "$(git rev-parse HEAD^{tree})" --verify "$RUNNER_TEMP/retrieval-kernel-source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retrieval-kernel-source.json
            ${{ runner.temp }}/retrieval-kernel-tests.log
            ${{ runner.temp }}/retrieval-kernel-clippy.log
          retention-days: 90
          if-no-files-found: error
