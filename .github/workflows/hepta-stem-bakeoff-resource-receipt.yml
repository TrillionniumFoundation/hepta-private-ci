name: hepta-stem-bakeoff-resource-receipt

on:
  pull_request:
    paths:
      - "qualification/stem-bakeoff-resource-receipt-20261017/**"
      - "qualification/cell-fast-path-actionir-p0/**"
      - ".github/workflows/hepta-stem-bakeoff-resource-receipt.yml"

permissions:
  contents: read

jobs:
  stem-bakeoff-contract:
    name: stem-bakeoff-shadow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile contracts
        run: |
          python -m py_compile qualification/cell-fast-path-actionir-p0/cell_fast_path_actionir.py
          python -m py_compile qualification/stem-bakeoff-resource-receipt-20261017/stem_bakeoff.py
      - name: Run contract tests
        run: |
          export PYTHONPATH=qualification/cell-fast-path-actionir-p0:qualification/stem-bakeoff-resource-receipt-20261017
          python -m unittest discover -s qualification/stem-bakeoff-resource-receipt-20261017 -p 'test_*.py' -v
