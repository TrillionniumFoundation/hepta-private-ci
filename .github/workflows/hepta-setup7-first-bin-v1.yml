name: Setup seven first native binary observation

on:
  pull_request:
    types: [opened]
    branches:
      - "fix/hepta-setup7-first-bin-controls-20261127-7c9e"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: hepta-setup7-tool-homes-20261127-7c9e
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: "1.96.0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  GIT_CONFIG_COUNT: "3"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.symlinks
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: core.longpaths
  GIT_CONFIG_VALUE_2: "true"

jobs:
  first-seven-native:
    if: >-
      ${{ true && github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.run_attempt == 1 &&
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/hepta-setup7-explicit-tool-homes-20261127-7c9e' &&
      github.event.pull_request.base.ref == 'fix/hepta-setup7-first-bin-controls-20261127-7c9e' &&
      github.event.pull_request.base.sha == 'b8cb004664d7f89d16d4e031cdb35617fd7f6188' &&
      github.actor == 'ProfHepta' &&
      github.event.pull_request.user.login == 'ProfHepta' }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Open the original shared cost ledger
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_RUN_ATTEMPT -ne "1") { throw "Original attempt required" }
          $out = Join-Path $env:RUNNER_TEMP ("hepta-setup7-" + $env:GITHUB_RUN_ID)
          $toolsRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ("hepta-setup7-tools-" + $env:GITHUB_RUN_ID)))
          if (Test-Path -LiteralPath $out) { throw "Original observation directory already exists" }
          if (Test-Path -LiteralPath $toolsRoot) { throw "Explicit tool homes already exist" }
          $rustupHome = Join-Path $toolsRoot "rustup"
          $cargoHome = Join-Path $toolsRoot "cargo"
          $toolchainBin = Join-Path $rustupHome "toolchains/1.96.0-x86_64-pc-windows-msvc/bin"
          $toolchainBin = [IO.Path]::GetFullPath($toolchainBin)
          $tick = [Environment]::TickCount64
          $utc = [DateTimeOffset]::UtcNow.ToString("o")
          [IO.Directory]::CreateDirectory($out) | Out-Null
          $boot = @{
            schema = "hepta.setup7.original_job_clock.v1"
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            tick_count_ms = $tick
            utc = $utc
            shared_whole_seconds = 1200
            working_seconds = 1000
            retention_seconds = 200
            includes_checkout_tools_diagnostics_failures_and_upload = $true
            tool_homes = @{
              schema = "hepta.setup7.explicit_tool_homes.v1"
              root = $toolsRoot
              rustup_home = $rustupHome
              cargo_home = $cargoHome
              toolchain = "1.96.0-x86_64-pc-windows-msvc"
              toolchain_bin = $toolchainBin
              selection = "explicit-before-provision-no-defaults"
            }
          } | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText((Join-Path $out "BOOTSTRAP.json"), $boot, [Text.UTF8Encoding]::new($false))
          [IO.Directory]::CreateDirectory($rustupHome) | Out-Null
          [IO.Directory]::CreateDirectory($cargoHome) | Out-Null
          $homes = "RUSTUP_HOME=$rustupHome" + [Environment]::NewLine + "CARGO_HOME=$cargoHome" + [Environment]::NewLine
          [IO.File]::AppendAllText($env:GITHUB_ENV, $homes, [Text.UTF8Encoding]::new($false))
      - name: Checkout the original opened source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true
      - name: Provision the pinned compiler request
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: "1.96.0"
          targets: x86_64-pc-windows-msvc
      - name: Bind the pinned nextest installation directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP ("hepta-setup7-" + $env:GITHUB_RUN_ID)
          $boot = [IO.File]::ReadAllText((Join-Path $out "BOOTSTRAP.json")) | ConvertFrom-Json -Depth 8
          if ($boot.tool_homes.schema -ne "hepta.setup7.explicit_tool_homes.v1") { throw "Missing explicit tool-home declaration" }
          if ($env:RUSTUP_HOME -cne $boot.tool_homes.rustup_home -or $env:CARGO_HOME -cne $boot.tool_homes.cargo_home) { throw "Provisioned homes differ from the original declaration" }
          $toolchainBin = [IO.Path]::GetFullPath((Join-Path $env:RUSTUP_HOME "toolchains/1.96.0-x86_64-pc-windows-msvc/bin"))
          if ($toolchainBin -cne $boot.tool_homes.toolchain_bin) { throw "Unexpected compiler directory" }
          foreach ($name in @("cargo.exe", "rustc.exe")) {
            $file = Get-Item -LiteralPath (Join-Path $toolchainBin $name)
            if ($file -isnot [IO.FileInfo] -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "Compiler path is not a regular file: $name" }
          }
          [IO.File]::AppendAllText($env:GITHUB_PATH, $toolchainBin + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          Write-Output ("Pinned nextest installation directory: " + $toolchainBin)
      - name: Provision the pinned nextest request
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
          checksum: "true"
          fallback: none
      - name: Observe the first seven native controls
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEPTA_SETUP7_INPUT_SHA256: "b3a135096f485c98d691758fa37b92cc46ced787d228b8ab327f0ccb4648005b"
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP ("hepta-setup7-" + $env:GITHUB_RUN_ID)
          $started = [Environment]::TickCount64
          $code = 1
          $failure = $null
          try {
            $bootstrap = @'
          import hashlib
          from pathlib import Path
          import sys
          path = Path(sys.argv[1]).absolute()
          raw = path.read_bytes()
          if len(raw) > 131072 or hashlib.sha256(raw).hexdigest() != sys.argv[2]:
              raise SystemExit("original runner source bytes differ")
          scope = {"__name__": "__main__", "__file__": str(path), "__package__": ""}
          exec(compile(raw, str(path), "exec"), scope)
          '@
            & python -I -B -X utf8 -c $bootstrap (Join-Path $env:GITHUB_WORKSPACE "scripts/run_hepta_setup7_first_bin_v1.py") "47c248db388061d5fa9d163e223996d87d17c1c244e8af35afd1d074cf99482c"
            $code = $LASTEXITCODE
            if ($null -eq $code) { $code = 1; throw "No original Python exit code" }
          } catch {
            $failure = $_.Exception.Message
            $code = 1
          } finally {
            $terminal = @{
              schema = "hepta.setup7.bootstrap_terminal.v1"
              exit_code = $code
              failure = $failure
              started_tick_ms = $started
              completed_tick_ms = [Environment]::TickCount64
              result_exists = (Test-Path -LiteralPath (Join-Path $out "RESULT.json"))
              after_io_exists = (Test-Path -LiteralPath (Join-Path $out "AFTER_IO.json"))
              whole_job_and_upload_still_require_original_platform_readback = $true
            } | ConvertTo-Json -Depth 8
            [IO.File]::WriteAllText((Join-Path $out "BOOTSTRAP_TERMINAL.json"), $terminal, [Text.UTF8Encoding]::new($false))
          }
          exit $code
      - name: Retain the original evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: setup7-first-native-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/BOOTSTRAP*.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/RESULT.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/AFTER_IO.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/*.ORIGINAL_ATTEMPT.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/INPUT.original.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/ORIGINAL_EVENT.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/SOURCE_*.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/TOOLS_*.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/source-*.original
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/*.windows.json
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/junit.original.xml
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/original-api/
            ${{ runner.temp }}/hepta-setup7-${{ github.run_id }}/commands/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
