name: R21 validator diagnostics

on:
  push:
    branches:
      - ops/r21-validator-diagnostic-20260911-r1
  workflow_dispatch:

permissions:
  contents: read

env:
  R21_BASE_SHA: 04f60466394a024c218ce66b1b32d1c42c462985
  R21_SOURCE_SHA: a87697760c183ce0378e3115c50f0388f5cbda73
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact diagnostic child
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$R21_SOURCE_SHA"
          test "$(git diff --name-only "$R21_SOURCE_SHA" HEAD)" = ".github/workflows/r21-validator-diagnostic.yml"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: ./.github/actions/setup-ci

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6.11.0
        with:
          version: "0.11.3"

      - name: Install pinned Rust tools
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Install test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0

      - name: Capture validators, NDU and formatted files
        shell: bash
        run: |
          set -uo pipefail
          reports="$RUNNER_TEMP/r21-validator-diagnostics"
          mkdir -p "$reports/formatted-scripts"

          capture() {
            name="$1"
            shift
            set +e
            "$@" >"$reports/${name}.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" >"$reports/${name}.exit"
          }

          set -e
          capture lane-a-self python3 scripts/verify_lane_a_foundation.py self-test
          capture lane-a-verify python3 scripts/verify_lane_a_foundation.py verify
          capture lane-a-dossier python3 -m unittest qualification/module-execution-dossiers/test_lane_a_foundation.py
          capture lane-b-self python3 scripts/hepta-lane-b-truth.py self-test
          capture lane-b-tests python3 -m unittest scripts/test_hepta_lane_b_truth.py
          capture lane-b-verify python3 scripts/hepta-lane-b-truth.py verify
          capture lane-b-docs python3 scripts/hepta-lane-b-docs.py
          capture readiness python3 scripts/hepta-readiness.py verify
          capture lane-d-self python3 scripts/hepta-lane-d-semantic-conformance.py self-test
          capture lane-d-verify python3 scripts/hepta-lane-d-semantic-conformance.py verify
          capture lane-d-changes python3 scripts/hepta-lane-d-semantic-conformance.py verify-changes --base "$R21_BASE_SHA"
          capture lane-e-self python3 scripts/hepta-lane-e-closure.py self-test
          capture lane-e-verify python3 scripts/hepta-lane-e-closure.py verify
          capture engineering-tests python3 -m unittest discover -v -s tools/hepta-engineering-control -p 'test_*.py'

          capture ndu-check bash -lc 'cd codex-rs && cargo check --locked -p codex-hepta-ndu --all-targets --message-format=short'
          capture ndu-tests bash -lc 'cd codex-rs && just test --locked -p codex-hepta-ndu'
          capture ndu-clippy bash -lc 'cd codex-rs && cargo clippy --locked -p codex-hepta-ndu --all-targets --message-format=short -- -D warnings'

          python3 scripts/format.py >"$reports/format-apply.log" 2>&1
          git diff --name-only "$R21_SOURCE_SHA" -- scripts > "$reports/format-paths.txt"
          while IFS= read -r path; do
            test -n "$path" || continue
            mkdir -p "$reports/formatted-scripts/$(dirname "$path")"
            cp "$path" "$reports/formatted-scripts/$path"
          done < "$reports/format-paths.txt"
          git diff --binary "$R21_SOURCE_SHA" -- scripts > "$reports/format.patch"
          tar -czf "$reports/formatted-scripts.tgz" -C "$reports/formatted-scripts" .

      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r21-validator-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/r21-validator-diagnostics
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Preserve diagnostic-only status
        shell: bash
        run: exit 1
