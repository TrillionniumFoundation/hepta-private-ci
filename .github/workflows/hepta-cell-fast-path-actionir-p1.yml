name: hepta-cell-fast-path-actionir-p1

on:
  pull_request:
    paths:
      - "qualification/cell-fast-path-actionir-p0/**"
      - "qualification/cell-fast-path-actionir-p1/**"
      - ".github/workflows/hepta-cell-fast-path-actionir-p1.yml"

permissions:
  contents: read

jobs:
  shadow-qualification:
    name: shadow-qualification-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile contracts
        run: |
          python -m py_compile qualification/cell-fast-path-actionir-p0/cell_fast_path_actionir.py
          python -m py_compile qualification/cell-fast-path-actionir-p1/fast_path_shadow_qualification.py
      - name: Run P0 and P1 contract tests
        run: |
          PYTHONPATH=qualification/cell-fast-path-actionir-p0:qualification/cell-fast-path-actionir-p1 \
            python -m unittest discover -s qualification/cell-fast-path-actionir-p0 -p 'test_*.py' -v
          PYTHONPATH=qualification/cell-fast-path-actionir-p0:qualification/cell-fast-path-actionir-p1 \
            python -m unittest discover -s qualification/cell-fast-path-actionir-p1 -p 'test_*.py' -v
