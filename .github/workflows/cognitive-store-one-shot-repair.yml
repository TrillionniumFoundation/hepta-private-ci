name: Cognitive store one-shot convergence repair

on:
  push:
    branches:
      - codex/cognitive-store-full-convergence-20260927
    paths:
      - '.github/workflows/cognitive-store-one-shot-repair.yml'

concurrency:
  group: cognitive-store-one-shot-repair
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/cognitive-store-full-convergence-20260927
          fetch-depth: 0
          persist-credentials: true
      - name: Apply convergence repair
        run: python3 scripts/cognitive_store_one_shot_repair.py apply
      - name: Prepare native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Expose DotSlash
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Format patched Rust sources
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-cognitive-store --package codex-hepta-memory --package codex-hepta-agentd
      - name: Bind exact source objects
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cognitive-store-one-shot-repair.yml
          git add -A
          python3 scripts/cognitive_store_one_shot_repair.py bind-map
          git add docs/modules/cognitive.store/IMPLEMENTATION_MAP.json
          git rm scripts/cognitive_store_one_shot_repair.py
      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          python3 scripts/cognitive_store_architecture.py
          git config user.name "Hepta Cognitive Store CI"
          git config user.email "hepta-cognitive-ci@users.noreply.github.com"
          git commit -m "fix(cognitive-store): close authority boundary and qualification blockers"
          python3 scripts/cognitive_store_map_verify.py \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
      - name: Compile repaired product profile
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-cognitive-store --all-targets
          cargo check --locked -p codex-hepta-memory --all-targets
          cargo check --locked -p codex-hepta-agentd --all-targets --features qualification-cognitive-write
      - name: Run focused repaired tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-memory \
            cognitive_store_tests::v2_fixture_migrates_forward_preserving_memory_and_revoking_legacy_projection \
            -- --exact
          cargo test --locked -p codex-hepta-memory \
            local_compact_executor_tests::terminal_bound_lease_transitions_audit_compact_journal_atomically \
            -- --exact
          cargo test --locked -p codex-hepta-agentd --test cognitive_store_product_writer \
            --features qualification-cognitive-write
      - name: Push repaired branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "codex/cognitive-store-full-convergence-20260927"
          git push origin HEAD:codex/cognitive-store-full-convergence-20260927
