name: Neuron diagnostic tooling export (read-only)

on:
  push:
    branches:
      - codex/neuron-runtime-durable-closure-v1
    paths:
      - .github/workflows/neuron-runtime-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuron-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neuron-tooling"
          printf 'source=%s\ntree=%s\nqualification_passed=false\nactivation=false\nrelease=false\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            > "$RUNNER_TEMP/neuron-tooling/identity.txt"
      - name: Export the repository-pinned native toolchain
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv > "$RUNNER_TEMP/neuron-tooling/toolchain.txt"
          cargo --version >> "$RUNNER_TEMP/neuron-tooling/toolchain.txt"
          sysroot=$(rustc --print sysroot)
          tar --exclude='share/doc' --exclude='lib/rustlib/src' \
            -C "$sysroot" -cJf "$RUNNER_TEMP/neuron-tooling/toolchain.tar.xz" .
      - name: Export dependency cache for offline diagnostics, not qualification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # Resolving a diagnostic cache is not an exact-head qualification.
          # Preserve any proposed lock delta as evidence; never commit it, and
          # never relax --locked in the separate qualification workflow.
          cargo fetch 2>&1 | tee "$RUNNER_TEMP/neuron-tooling/fetch.log"
          git diff -- Cargo.lock > "$RUNNER_TEMP/neuron-tooling/diagnostic-lock.patch"
          git restore -- Cargo.lock
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          entries=()
          for entry in registry/index registry/cache registry/src git/db git/checkouts; do
            if [ -d "$cargo_home/$entry" ]; then entries+=("$entry"); fi
          done
          test "${#entries[@]}" -gt 0
          # No credentials, Cargo configuration, home directory or checkout
          # credential helpers are exported.
          tar -C "$cargo_home" -cJf "$RUNNER_TEMP/neuron-tooling/dependencies.tar.xz" "${entries[@]}"
          git diff --exit-code
      - name: Export repository test runners
        shell: bash
        run: |
          set -euo pipefail
          command -v just >/dev/null || cargo install --locked just
          cargo nextest --version || cargo install --locked cargo-nextest
          mkdir -p "$RUNNER_TEMP/neuron-tooling/runners"
          cp "$(command -v just)" "$RUNNER_TEMP/neuron-tooling/runners/just"
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/neuron-tooling/runners/cargo-nextest"
          just --version >> "$RUNNER_TEMP/neuron-tooling/toolchain.txt"
          cargo nextest --version >> "$RUNNER_TEMP/neuron-tooling/toolchain.txt"
      - name: Hash retained diagnostic files
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/neuron-tooling"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuron-diagnostic-tooling-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neuron-tooling/
          if-no-files-found: error
          retention-days: 3
