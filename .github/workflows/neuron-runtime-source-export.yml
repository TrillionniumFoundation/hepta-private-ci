name: Temporary neuron runtime integration applicator

on:
  push:
    branches:
      - codex/neuron-runtime-durable-closure-v1
    paths:
      - .github/workflows/neuron-runtime-source-export.yml

permissions:
  contents: write

concurrency:
  group: neuron-runtime-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/neuron-runtime-durable-closure-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed integration patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || {
            echo "branch advanced before applicator start" >&2
            exit 1
          }
          git apply --check .github/neuron-agentd-integration.patch
          git apply .github/neuron-agentd-integration.patch
          cd codex-rs
          cargo fmt \
            --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host \
            --package codex-hepta-neuron \
            --package codex-hepta-agentd
          cargo check --locked \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-worker-host \
            -p codex-hepta-neuron \
            -p codex-hepta-agentd \
            --all-targets
          cargo test --locked -p codex-hepta-infer-core
          cargo test --locked -p codex-hepta-infer-worker-host durable_neuron_feature
          cargo test --locked -p codex-hepta-agentd neuron_runtime
          cd ..
          git rm -- .github/neuron-agentd-integration.patch
          git rm -- .github/workflows/neuron-runtime-source-export.yml
          git diff --check
      - name: Commit verified integration and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'neuron.runtime: compose durable inference into agentd'
          git push origin HEAD:codex/neuron-runtime-durable-closure-v1
