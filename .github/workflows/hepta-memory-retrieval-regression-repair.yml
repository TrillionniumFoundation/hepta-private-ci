name: Memory retrieval regression repair

on:
  push:
    branches: [work/memory-retrieval-semantic-product-convergence-20260926]
    paths: [.github/workflows/hepta-memory-retrieval-regression-repair.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair-and-test:
    if: github.ref == 'refs/heads/work/memory-retrieval-semantic-product-convergence-20260926'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Correct exact reviewed source objects without weakening assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('codex-rs/hepta-memory-retrieval/src')
          expected = {
              'generation_bound.rs': '79402db4a16e3b1255f7b926a879de34b28e42e4',
              'generation_bound_semantic_tests.rs': '3055a464ba75966dff6d7de6b182712af43aeb13',
          }
          values = {}
          for name, wanted in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'exact-source conflict: {name} {actual}')
              values[name] = data.decode()
          text = values['generation_bound.rs']
          for signature in ('pub fn recall(', 'fn contradiction_population_count('):
              if text.count('\n' + signature) != 1:
                  raise SystemExit('ambiguous legacy reference function')
              text = text.replace('\n' + signature,
                  '\n// The historical algorithm is retained solely as a test reference.\n#[cfg(test)]\n' + signature, 1)
          values['generation_bound.rs'] = text
          text = values['generation_bound_semantic_tests.rs']
          old = '    assert_eq!(packet.omitted_count, 0);'
          if text.count(old) != 1: raise SystemExit('ambiguous omission assertion')
          text = text.replace(old,
              '    // The rejected low-score candidate is still in the validated union.\n'
              '    // It cannot poison selection, but must remain in omission accounting.\n'
              '    assert_eq!(packet.omitted_count, 1);\n'
              '    assert_eq!(packet.selections.len() + packet.omitted_count as usize, 2);', 1)
          text += '''

          #[test]
          fn disabled_channel_cannot_bypass_raw_candidate_capacity() {
              let p = policy(vec![
                  (RetrievalChannelV1::Lexical, FixedQ32::ONE),
                  (RetrievalChannelV1::ContradictionSupport, FixedQ32::ZERO),
              ]);
              let c = candidate(1, RetrievalChannelV1::ContradictionSupport,
                  FixedQ32::ONE, ProbabilityQ32::ZERO, None);
              assert_eq!(build_candidate_union(&cue(), &p, vec![c; MAX_GENERATION_BOUND_CANDIDATES + 1]),
                  Err(RecallErrorV1::CandidateLimitExceeded));
          }

          #[test]
          fn disabled_channel_does_not_bypass_generation_or_duplicate_validation() {
              let p = policy(vec![
                  (RetrievalChannelV1::Lexical, FixedQ32::ONE),
                  (RetrievalChannelV1::ContradictionSupport, FixedQ32::ZERO),
              ]);
              let c = candidate(1, RetrievalChannelV1::ContradictionSupport,
                  FixedQ32::ONE, ProbabilityQ32::ZERO, None);
              let mut stale = c.clone();
              stale.generation_vector_digest = digest("stale-zero-weight-generator");
              assert!(matches!(build_candidate_union(&cue(), &p, vec![stale]),
                  Err(RecallErrorV1::GenerationVectorMismatch(_))));
              assert!(matches!(build_candidate_union(&cue(), &p, vec![c.clone(), c]),
                  Err(RecallErrorV1::DuplicateChannelCandidate(_))));
          }
          '''
          values['generation_bound_semantic_tests.rs'] = text
          for name, text in values.items(): (root / name).write_text(text)
          PY
      - name: Format and publish bounded native correction
        id: source
        env:
          BRANCH: work/memory-retrieval-semantic-product-convergence-20260926
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          (cd codex-rs && cargo +1.95.0 fmt -p codex-hepta-memory-retrieval)
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if not paths or any(not path.startswith('codex-rs/hepta-memory-retrieval/') for path in paths):
              raise SystemExit('refusing out-of-scope or empty source correction')
          PY
          git diff --check
          git config user.name 'Hepta retrieval source qualification'
          git config user.email 'qualification@example.invalid'
          git add -- codex-rs/hepta-memory-retrieval
          git commit -m 'fix(memory.retrieval): preserve omission accounting and isolate historical test algorithm'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/retrieval-regressions"
          python scripts/capture_memory_retrieval_source.py --source-sha "$(git rev-parse HEAD)" --source-tree "$(git rev-parse HEAD^{tree})" --output "$RUNNER_TEMP/retrieval-regressions/source.json"
      - name: Run actual retrieval tests
        id: retrieval
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-memory-retrieval --all-targets 2>&1 | tee "$RUNNER_TEMP/retrieval-regressions/retrieval.log"
      - name: Run strict retrieval all-target Clippy and formatting
        id: clippy
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.95.0 clippy --locked -p codex-hepta-memory-retrieval --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/retrieval-regressions/clippy.log"
          cargo +1.95.0 fmt -p codex-hepta-memory-retrieval -- --check
      - name: Run actual Agentd lifecycle and final-use tests
        id: agentd
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p codex-hepta-agentd cognitive_retrieval_context 2>&1 | tee "$RUNNER_TEMP/retrieval-regressions/provider.log"
          cargo +1.95.0 test --locked -p codex-hepta-agentd cognitive_context_hnmf 2>&1 | tee "$RUNNER_TEMP/retrieval-regressions/final-use.log"
      - name: Recheck exact source identity
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          python scripts/capture_memory_retrieval_source.py --source-sha "$(git rev-parse HEAD)" --source-tree "$(git rev-parse HEAD^{tree})" --verify "$RUNNER_TEMP/retrieval-regressions/source.json"
      - name: Publish actual bounded result and compiler diagnostics
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          SOURCE: ${{ steps.source.outputs.sha }}
          RETRIEVAL_RESULT: ${{ steps.retrieval.outcome }}
          CLIPPY_RESULT: ${{ steps.clippy.outcome }}
          AGENTD_RESULT: ${{ steps.agentd.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = path.join(process.env.RUNNER_TEMP, 'retrieval-regressions');
            let body = '## Executed native regression results\n\nRun: ' + context.runId + '\nExact source: `' + (process.env.SOURCE || 'not published') + '`\n\nRetrieval: ' + process.env.RETRIEVAL_RESULT + '; strict Clippy/format: ' + process.env.CLIPPY_RESULT + '; Agentd lifecycle/final-use: ' + process.env.AGENTD_RESULT + '.\n\nNo independent acceptance, E2E SLO, activation or release is granted.\n';
            for (const name of ['retrieval.log', 'clippy.log', 'provider.log', 'final-use.log']) {
              const file = path.join(root, name);
              if (!fs.existsSync(file)) continue;
              const lines = fs.readFileSync(file, 'utf8').split('\n');
              const indices = new Set();
              lines.forEach((line, index) => {
                if (/^error|^failures:|^test result:|panicked at|^test .*FAILED|^\s*-->/.test(line)) {
                  for (let i = Math.max(0, index - 1); i < Math.min(lines.length, index + 9); i++) indices.add(i);
                }
              });
              const selected = [...indices].sort((a, b) => a - b).map(i => lines[i]).join('\n').slice(0, 7000).replace(/@/g, '[at]').replace(/```/g, "'''");
              body += '\n### ' + name + '\n```text\n' + selected + '\n```\n';
            }
            await github.rest.issues.createComment({...context.repo, issue_number: 1014, body: body.slice(0, 35000)});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-repaired-native-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-regressions/
          retention-days: 90
          if-no-files-found: error
