name: Temporary objective base-source export

on:
  push:
    branches:
      - work/objective-compiler-convergence-20260925

permissions:
  contents: read

concurrency:
  group: temporary-objective-base-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 7ddbfac88525196e7a4b31387ceae194958275f5
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact base source
        shell: bash
        run: |
          set -euo pipefail
          expected=7ddbfac88525196e7a4b31387ceae194958275f5
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Export base source
        shell: bash
        run: |
          set -euo pipefail
          sha=7ddbfac88525196e7a4b31387ceae194958275f5
          archive="$RUNNER_TEMP/hepta-base-$sha.tar.gz"
          tar --exclude=.git --exclude=target -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Upload base source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-objective-base-7ddbfac88525196e7a4b31387ceae194958275f5
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          if-no-files-found: error
          retention-days: 1
