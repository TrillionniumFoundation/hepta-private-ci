name: AuthBus final hardening apply

on:
  push:
    branches: [auth-authbus-hardening-final-20260928]
    paths: [.github/workflows/authbus-final-hardening-apply.yml]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-authbus-hardening-final-20260928
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Apply exact-source migration
        run: python3 scripts/finalize-authbus-hardening.py

      - name: Format and verify closed world
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path codex-rs/Cargo.toml
          python3 scripts/check-authbus-closed-world.py --check

      - name: Focused compile and tests
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus-p1-3-qualification --all-targets
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-evidence --all-targets
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --test kernel_evidence_product
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-bao-adapter --all-targets

      - name: Strict AuthBus lint
        run: |
          cargo clippy --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-authbus \
            -p codex-hepta-authbus-p1-3-qualification \
            -p codex-hepta-evidence \
            -p codex-hepta-agentd \
            -p codex-hepta-bao-adapter \
            --all-targets --all-features -- -D warnings

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "hepta-authbus-hardening-bot"
          git config user.email "hepta-authbus-hardening-bot@users.noreply.github.com"
          git add codex-rs docs/modules/auth.authbus scripts/check-authbus-closed-world.py
          if git diff --cached --quiet; then
            echo "Migration produced no changes" >&2
            exit 1
          fi
          git commit -m "fix(authbus): close remaining trust-boundary gaps"
          git push origin HEAD:auth-authbus-hardening-final-20260928
