name: runtime.codex isolated source consolidation

on:
  push:
    branches: [codex/runtime-codex-consolidated-20260927]

permissions:
  contents: read

concurrency:
  group: runtime-codex-consolidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-codex-assembled]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    steps:
      - name: Check out the immutable input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble pinned repository-owned source changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin b01a3ea2122e545d8e32154e2043ed9e5183df41
          python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path.cwd()
          revision = 'b01a3ea2122e545d8e32154e2043ed9e5183df41'
          for name in ('apply_runtime_codex_p0.py', 'fix_runtime_codex_p0.py', 'fix_runtime_codex_p0_round2.py'):
              path = root / 'scripts' / name
              path.write_bytes(subprocess.check_output(['git', 'show', f'{revision}:scripts/{name}']))
              subprocess.run(['python3', str(path)], check=True)
              path.unlink()
          PY
          git diff --check
      - name: Install repository formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and bound the publication scope
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-infer-core --package codex-hepta-agent-protocol --package codex-hepta-agentd --package codex-hepta-infer-worker-host
          python3 - <<'PY'
          import subprocess
          allowed = ('codex-rs/hepta-infer-core/', 'codex-rs/hepta-agent-protocol/', 'codex-rs/hepta-agentd/', 'codex-rs/hepta-infer-worker-host/')
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, changed):
              if not path.startswith(allowed):
                  raise SystemExit(f'Unexpected generated source: {path}')
          PY
          git diff --check
      - name: Publish source candidate without claiming qualification
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/codex/runtime-codex-consolidated-20260927
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add codex-rs/hepta-infer-core codex-rs/hepta-agent-protocol codex-rs/hepta-agentd codex-rs/hepta-infer-worker-host
          git diff --cached --check
          git commit -m 'runtime.codex: integrate durable cross-owner abort candidate [runtime-codex-assembled]' -m 'Import the existing pinned remediation transformations into actual source. This source commit is not a test receipt or an independent acceptance. Preserve all qualification and deployment gates.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF}"
          printf 'candidate=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain the actual candidate source for review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-codex-source"
          git archive HEAD | gzip > "$RUNNER_TEMP/runtime-codex-source/candidate.tar.gz"
          git diff --binary > "$RUNNER_TEMP/runtime-codex-source/uncommitted.patch"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/runtime-codex-source/identity.txt"
      - name: Upload immutable source and diagnostic delta
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-codex-source-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-codex-source/
          retention-days: 14
          if-no-files-found: error
