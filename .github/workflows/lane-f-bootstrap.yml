name: Inspect Lane F textual source payloads

on:
  push:
    branches:
      - codex/lane-f-gap-closure-20260910
    paths:
      - ".github/workflows/lane-f-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Validate and enumerate textual source payloads
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.ref == 'refs/heads/codex/lane-f-gap-closure-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Decode, validate and enumerate each payload independently
        shell: bash
        run: |
          set -uo pipefail
          valid=0
          invalid=0
          for label in min final; do
            directory=".lane-f-$label"
            printf '\n=== %s ===\n' "$label"
            if ! test -d "$directory"; then
              printf 'INVALID missing directory %s\n' "$directory"
              invalid=$((invalid + 1))
              continue
            fi
            mapfile -t parts < <(printf '%s\n' "$directory"/part-*.b64 | sort)
            if test "${#parts[@]}" -eq 0; then
              printf 'INVALID no parts\n'
              invalid=$((invalid + 1))
              continue
            fi
            archive="/tmp/lane-f-$label.tar.xz"
            if ! cat "${parts[@]}" | base64 --decode > "$archive"; then
              printf 'INVALID base64 decode failed\n'
              invalid=$((invalid + 1))
              continue
            fi
            printf 'sha256='
            sha256sum "$archive" | awk '{print $1}'
            printf 'bytes='
            stat -c '%s' "$archive"
            if ! xz --test "$archive"; then
              printf 'INVALID xz stream\n'
              invalid=$((invalid + 1))
              continue
            fi
            destination="/tmp/lane-f-$label"
            mkdir -p "$destination"
            if ! tar -xJf "$archive" -C "$destination"; then
              printf 'INVALID tar extraction\n'
              invalid=$((invalid + 1))
              continue
            fi
            printf 'VALID\n'
            valid=$((valid + 1))
            printf '%s members:\n' "$label"
            tar -tJf "$archive" | sort
            printf '%s required-path summary:\n' "$label"
            for required in \
              scripts/hepta-lane-f.py \
              scripts/test_hepta_lane_f.py \
              codex-rs/hepta-neuron/src/lib.rs \
              codex-rs/hepta-intuition/src/lib.rs \
              codex-rs/hepta-prompt-optimizer/src/lib.rs \
              codex-rs/hepta-plasticity/src/lib.rs \
              codex-rs/hepta-intelligence/src/lib.rs; do
              if test -e "$destination/$required"; then
                printf 'PRESENT %s\n' "$required"
              else
                printf 'ABSENT  %s\n' "$required"
              fi
            done
          done
          printf '\nsummary valid=%s invalid=%s\n' "$valid" "$invalid"
          test "$valid" -gt 0
