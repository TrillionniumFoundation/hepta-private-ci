name: Inspect Lane F textual source payloads

on:
  push:
    branches:
      - codex/lane-f-gap-closure-20260910
    paths:
      - ".github/workflows/lane-f-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Validate and enumerate textual source payloads
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.ref == 'refs/heads/codex/lane-f-gap-closure-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Decode, validate and enumerate each payload
        shell: bash
        run: |
          set -euo pipefail
          for label in final min; do
            directory=".lane-f-$label"
            test -d "$directory"
            mapfile -t parts < <(printf '%s\n' "$directory"/part-*.b64 | sort)
            test "${#parts[@]}" -gt 0
            cat "${parts[@]}" | base64 --decode > "/tmp/lane-f-$label.tar.xz"
            printf '%s sha256=' "$label"
            sha256sum "/tmp/lane-f-$label.tar.xz" | awk '{print $1}'
            xz --test "/tmp/lane-f-$label.tar.xz"
            mkdir -p "/tmp/lane-f-$label"
            tar -xJf "/tmp/lane-f-$label.tar.xz" -C "/tmp/lane-f-$label"
            printf '%s members:\n' "$label"
            tar -tJf "/tmp/lane-f-$label.tar.xz" | sort
            printf '%s required-path summary:\n' "$label"
            for required in \
              scripts/hepta-lane-f.py \
              scripts/test_hepta_lane_f.py \
              codex-rs/hepta-neuron/src/lib.rs \
              codex-rs/hepta-intuition/src/lib.rs \
              codex-rs/hepta-prompt-optimizer/src/lib.rs \
              codex-rs/hepta-plasticity/src/lib.rs \
              codex-rs/hepta-intelligence/src/lib.rs; do
              if test -e "/tmp/lane-f-$label/$required"; then
                printf 'PRESENT %s\n' "$required"
              else
                printf 'ABSENT  %s\n' "$required"
              fi
            done
          done
