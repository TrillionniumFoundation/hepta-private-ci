name: Finalize Lane F clean source candidate

on:
  push:
    branches:
      - codex/lane-f-gap-closure-20260910
    paths:
      - ".github/workflows/lane-f-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lane-f-clean-finalizer-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_BRANCH: integration/vnext-main-20260811
  TEMP_RESULT_BRANCH: ops/lane-f-final-source-20260910

jobs:
  finalize:
    name: Materialize, verify and publish temporary clean commit
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.ref == 'refs/heads/codex/lane-f-gap-closure-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact bootstrap source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure repository build tools
        uses: ./.github/actions/setup-ci

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3
          activate-environment: false

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22

      - name: Install JavaScript formatting dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Verify and extract committed source overlay
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t parts < <(printf '%s\n' .lane-f-bootstrap/part-* | sort)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" > /tmp/lane-f-overlay.tar.gz
          archive_sha="$(sha256sum /tmp/lane-f-overlay.tar.gz | awk '{print $1}')"
          gzip -t /tmp/lane-f-overlay.tar.gz
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          with tarfile.open("/tmp/lane-f-overlay.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("empty Lane F overlay")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"links are forbidden in overlay: {member.name}")
              archive.extractall(".", members=members, filter="data")
          PY
          printf 'archive_sha=%s\n' "$archive_sha" >> "$GITHUB_OUTPUT"
          printf 'OVERLAY_SHA=%s\n' "$archive_sha" >> "$GITHUB_ENV"

      - name: Bind current base revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          base_sha="$(git rev-parse "origin/$BASE_BRANCH")"
          git cat-file -e "$base_sha^{commit}"
          printf 'BASE_SHA=%s\n' "$base_sha" >> "$GITHUB_ENV"

      - name: Materialize fail-closed admission, workflows and source receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          files = {
              "scripts/hepta-lane-f-admission.py": "",
              ".github/workflows/hepta-lane-f-gap-closure-audit.yml": "",
              ".github/workflows/hepta-lane-f-shadow-qualification.yml": "",
              "qualification/lane-f-shadow/Cargo.toml": "",
          }
          for relative, encoded in files.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))

          receipt = {
              "schema": "hepta.lane-f-source-receipt.v2",
              "baseSha": os.environ["BASE_SHA"],
              "bootstrapSha": os.environ["GITHUB_SHA"],
              "sourceArchiveSha256": os.environ["OVERLAY_SHA"],
              "subjectBinding": "commit-statuses-bind-exact-head",
              "checksRequired": [
                  "lane-f-gap-closure-audit / Exact source and generated truth",
                  "lane-f-gap-closure-audit / Ordered-parent synthetic merge",
                  "lane-f-shadow / Exact-head native and vertical tests",
                  "lane-f-shadow / Synthetic-merge native and vertical tests",
              ],
              "capabilityBoundary": {
                  "productionAuthorityGranted": False,
                  "independentAcceptance": False,
                  "operatorAcceptance": False,
                  "productionCanary": False,
                  "selection": False,
                  "promotion": False,
                  "release": False,
              },
          }
          path = Path("qualification/lane-f/VERIFICATION_RECEIPT.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          chmod +x scripts/hepta-lane-f-admission.py

      - name: Normalize explicit Prompt Optimizer profile boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-prompt-optimizer/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          marker = "pub mod local_shadow;\n"
          addition = """pub mod local_shadow;
          pub use local_shadow::calculate_local_shadow as calculate_shadow_portfolio_v2;

          /// Stable identity for the compatibility-only original portfolio API.
          pub const PROMPT_PORTFOLIO_LEGACY_V1_PROFILE: &str =
              "hepta.prompt-portfolio.legacy-v1";
          /// Stable identity for the bounded interaction-aware shadow API.
          pub const PROMPT_PORTFOLIO_SHADOW_V2_PROFILE: &str =
              "hepta.prompt-portfolio.shadow-v2";

          """
          if "PROMPT_PORTFOLIO_SHADOW_V2_PROFILE" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("unexpected Prompt Optimizer module marker")
              text = text.replace(marker, addition, 1)

          legacy = "pub fn optimize(mut request: OptimizationRequest)"
          if "Compatibility-only legacy V1 optimizer" not in text:
              if text.count(legacy) != 1:
                  raise SystemExit("unexpected legacy optimizer marker")
              text = text.replace(
                  legacy,
                  "/// Compatibility-only legacy V1 optimizer. New shadow "
                  "composition uses [`calculate_shadow_portfolio_v2`].\n"
                  + legacy,
                  1,
              )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate canonical truth, format sources and lock dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/hepta-lane-f.py
          test -f scripts/test_hepta_lane_f.py
          python3 scripts/hepta-lane-f.py generate
          python3 scripts/hepta_module_doc_metadata.py --write
          python3 scripts/hepta-docs.py generate-status
          (
            cd codex-rs
            cargo test -p codex-hepta-intelligence --all-targets --no-run
          )
          cargo generate-lockfile \
            --manifest-path qualification/lane-f-shadow/Cargo.toml
          just fmt
          cargo fmt \
            --manifest-path qualification/lane-f-shadow/Cargo.toml \
            -- --config imports_granularity=Item
          pnpm exec prettier --write \
            .github/workflows/hepta-lane-f-gap-closure-audit.yml \
            .github/workflows/hepta-lane-f-shadow-qualification.yml
          python3 -B scripts/hepta-lane-f-admission.py --help >/dev/null

      - name: Remove every transport and publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lane-f-bootstrap .lane-f-final .lane-f-min
          rm -f \
            .github/workflows/lane-f-bootstrap.yml \
            .github/workflows/lane-f-finalize-20260910.yml \
            .github/workflows/lane-f-finalize-v2-20260910.yml \
            .github/workflows/lane-f-resume-20260910.yml \
            .github/workflows/lane-f-resume.yml
          test ! -e .lane-f-bootstrap
          test ! -e .lane-f-final
          test ! -e .lane-f-min

      - name: Create one clean commit directly above current base
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-lane-f-finalizer
          git config user.email hepta-lane-f-finalizer@users.noreply.github.com
          git add -A
          git diff --cached --check
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME='Hepta Lane F Finalizer'
          export GIT_AUTHOR_EMAIL='hepta-lane-f-finalizer@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          clean_sha="$(
            printf '%s\n' \
              'feat(lane-f): close adaptive-policy source and documentation gaps' |
              git commit-tree "$tree" -p "$BASE_SHA"
          )"
          git checkout --detach "$clean_sha"
          test "$(git rev-parse HEAD)" = "$clean_sha"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          printf 'clean_sha=%s\n' "$clean_sha" >> "$GITHUB_OUTPUT"
          printf 'CLEAN_SHA=%s\n' "$clean_sha" >> "$GITHUB_ENV"

      - name: Validate exact clean source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-f-admission.py self-test
          python3 scripts/hepta-lane-f-admission.py verify \
            --mode source \
            --base-sha "$BASE_SHA"
          python3 scripts/hepta-lane-f.py self-test
          python3 -m unittest scripts/test_hepta_lane_f.py
          python3 scripts/hepta-lane-f.py generate --check
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-lane-f.py verify
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          just fmt-check
          pnpm run format
          (
            cd codex-rs
            cargo test --locked -p codex-hepta-neuron --all-targets
            cargo test --locked -p codex-hepta-intuition --all-targets
            cargo test --locked -p codex-hepta-prompt-optimizer --all-targets
            cargo test --locked -p codex-hepta-plasticity --all-targets
            cargo test --locked -p codex-hepta-intelligence --all-targets
            cargo clippy --locked \
              -p codex-hepta-neuron \
              -p codex-hepta-intuition \
              -p codex-hepta-prompt-optimizer \
              -p codex-hepta-plasticity \
              -p codex-hepta-intelligence \
              --all-targets -- -D warnings
            cargo fmt \
              --package codex-hepta-neuron \
              --package codex-hepta-intuition \
              --package codex-hepta-prompt-optimizer \
              --package codex-hepta-plasticity \
              --package codex-hepta-intelligence \
              -- --config imports_granularity=Item --check
          )
          cargo test \
            --manifest-path qualification/lane-f-shadow/Cargo.toml \
            --locked \
            --all-targets
          cargo clippy \
            --manifest-path qualification/lane-f-shadow/Cargo.toml \
            --locked \
            --all-targets -- -D warnings
          cargo fmt \
            --manifest-path qualification/lane-f-shadow/Cargo.toml \
            -- --config imports_granularity=Item --check
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Validate deterministic ordered-parent synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git merge-tree --write-tree "$BASE_SHA" "$CLEAN_SHA")"
          export GIT_AUTHOR_NAME='Hepta Lane F CI'
          export GIT_AUTHOR_EMAIL='hepta-lane-f-ci@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          merge_sha="$(
            printf 'Synthetic Lane F finalizer merge\n' |
              git commit-tree "$tree" -p "$BASE_SHA" -p "$CLEAN_SHA"
          )"
          git checkout --detach "$merge_sha"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$CLEAN_SHA"
          python3 scripts/hepta-lane-f-admission.py verify \
            --mode merge \
            --base-sha "$BASE_SHA" \
            --source-sha "$CLEAN_SHA"
          python3 scripts/hepta-lane-f.py self-test
          python3 -m unittest scripts/test_hepta_lane_f.py
          python3 scripts/hepta-lane-f.py generate --check
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-lane-f.py verify
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          (
            cd codex-rs
            cargo test --locked -p codex-hepta-neuron --all-targets
            cargo test --locked -p codex-hepta-intuition --all-targets
            cargo test --locked -p codex-hepta-prompt-optimizer --all-targets
            cargo test --locked -p codex-hepta-plasticity --all-targets
            cargo test --locked -p codex-hepta-intelligence --all-targets
          )
          cargo test \
            --manifest-path qualification/lane-f-shadow/Cargo.toml \
            --locked \
            --all-targets
          test -z "$(git status --porcelain)"
          git checkout --detach "$CLEAN_SHA"

      - name: Publish verified clean commit to temporary result ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLEAN_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          git push --force origin \
            "$CLEAN_SHA:refs/heads/$TEMP_RESULT_BRANCH"
          {
            printf '## Lane F clean candidate\n\n'
            printf -- '- Clean SHA: `%s`\n' "$CLEAN_SHA"
            printf -- '- Base SHA: `%s`\n' "$BASE_SHA"
            printf -- '- Overlay SHA-256: `%s`\n' "$OVERLAY_SHA"
            printf -- '- Temporary ref: `%s`\n' "$TEMP_RESULT_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
