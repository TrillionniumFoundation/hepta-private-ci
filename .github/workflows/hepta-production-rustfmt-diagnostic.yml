name: Hepta production rustfmt diagnostic

on:
  push:
    branches:
      - codex/hepta-production-gates-20261010

permissions:
  contents: read

concurrency:
  group: hepta-production-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Produce read-only exact rustfmt delta for review
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-contracts -p codex-hepta-neuron -p codex-hepta-agentd -p codex-hepta-infer-worker-host -p codex-hepta-evidence
          git diff -- hepta-contracts hepta-neuron hepta-agentd hepta-infer-worker-host hepta-evidence > "$RUNNER_TEMP/hepta-owner-rustfmt.diff"
          cat "$RUNNER_TEMP/hepta-owner-rustfmt.diff"
          if test -s "$RUNNER_TEMP/hepta-owner-rustfmt.diff"; then
            echo "::error::The candidate source differs from rustfmt; apply reviewed delta."
            exit 1
          fi
