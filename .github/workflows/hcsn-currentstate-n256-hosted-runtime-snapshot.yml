name: hcsn-currentstate-n256-hosted-runtime-snapshot

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/REQUEST.json"
      - "qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/SOURCE_FREEZE.json"
      - "qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/REQUEST_V2.json"
      - "qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/SOURCE_FREEZE_V2.json"
      - "qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/capture.py"
      - "qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/requirements.txt"
      - "qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/test_source.py"
      - "qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/verify_source.py"
      - "qualification/hcsn_currentstate_n256_firststep_resource_snapshot/snapshot_source.py"
      - ".github/workflows/hcsn-currentstate-n256-hosted-runtime-snapshot.yml"

permissions:
  contents: read

jobs:
  observe-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Install exact binary runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          -r qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/requirements.txt
      - name: Verify frozen zero-model source
        run: python qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/verify_source.py
      - name: Run five stdlib controls
        run: python -m unittest qualification.hcsn_currentstate_n256_hosted_runtime_snapshot.test_source -v
      - name: Run optimized controls
        run: python -O -m unittest qualification.hcsn_currentstate_n256_hosted_runtime_snapshot.test_source -v
      - name: Capture one observation
        run: >-
          python -m qualification.hcsn_currentstate_n256_hosted_runtime_snapshot.capture
          > qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/HOSTED_OBSERVATION.json
      - name: Upload raw observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hcsn-n256-hosted-runtime-snapshot
          path: qualification/hcsn_currentstate_n256_hosted_runtime_snapshot/HOSTED_OBSERVATION.json
          if-no-files-found: error
          retention-days: 30
