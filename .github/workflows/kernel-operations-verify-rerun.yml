name: Kernel operations durable verification rerun

on:
  push:
    branches:
      - work/kernel-operations-durable-v1-20260917
    paths:
      - .github/workflows/kernel-operations-verify-rerun.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Verify Lane A truth and durable package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lane_a_foundation.py self-test
          python3 scripts/verify_lane_a_foundation.py verify
          python3 -m unittest qualification/module-execution-dossiers/test_lane_a_foundation.py
          (cd qualification/module-execution-dossiers && python3 -m unittest test_implementation_contracts.py)
          (cd codex-rs && cargo fmt --all -- --check)
          (cd codex-rs && cargo test --locked -p codex-hepta-operations)
          (cd codex-rs && cargo clippy --locked -p codex-hepta-operations --all-targets --all-features -- -D warnings)
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
