name: Memory retrieval product delivery modes

on:
  push:
    branches: [work/memory-retrieval-semantic-product-convergence-20260926]
    paths: [.github/workflows/hepta-memory-retrieval-product-modes.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    if: github.ref == 'refs/heads/work/memory-retrieval-semantic-product-convergence-20260926'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source: ${{ steps.publish.outputs.sha }}
      base: ${{ steps.publish.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed exact-object mode patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 scripts/apply_memory_retrieval_product_modes.py
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          (cd codex-rs && cargo +1.95.0 fmt -p codex-hepta-agentd)
          git diff --check
      - name: Publish without overriding a concurrent writer
        id: publish
        shell: bash
        env:
          BRANCH: work/memory-retrieval-semantic-product-convergence-20260926
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if not paths or any(not p.startswith('codex-rs/hepta-agentd/') for p in paths):
              raise SystemExit('empty or out-of-scope product mode patch')
          PY
          git config user.name 'Hepta retrieval source qualification'
          git config user.email 'qualification@example.invalid'
          git add -- codex-rs/hepta-agentd
          git commit -m 'feat(memory.retrieval): wire isolated shadow and stable canary delivery into Agentd'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          git fetch origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git config --local --unset-all http.https://github.com/.extraheader || true

  native:
    needs: materialize
    strategy:
      fail-fast: false
      matrix:
        variant: [exact-source, ordered-parent-merge]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      SOURCE: ${{ needs.materialize.outputs.source }}
      BASE: ${{ needs.materialize.outputs.base }}
      VARIANT: ${{ matrix.variant }}
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.materialize.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Select and capture the immutable qualification source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p "$RUNNER_TEMP/retrieval-product-mode-evidence"
          if test "$VARIANT" = ordered-parent-merge; then
            python3 scripts/memory_retrieval_synthetic_merge.py --base "$BASE" --source "$SOURCE" > "$RUNNER_TEMP/retrieval-product-mode-evidence/merge-identity.txt"
            candidate="$(sed -n 's/^candidate=//p' "$RUNNER_TEMP/retrieval-product-mode-evidence/merge-identity.txt")"
            git checkout --detach "$candidate"
            test "$(git show -s --format=%P HEAD)" = "$BASE $SOURCE"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/capture_memory_retrieval_source.py --source-sha "$(git rev-parse HEAD)" --source-tree "$(git rev-parse HEAD^{tree})" --output "$RUNNER_TEMP/retrieval-product-mode-evidence/source.json"
      - name: Source freshness, SLO and promotion verifier regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*memory_retrieval*.py' -v 2>&1 | tee "$RUNNER_TEMP/retrieval-product-mode-evidence/verifiers.log"
      - name: Real native owner and delivery-mode regression tests
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd --lib -E 'package(codex-hepta-memory-retrieval) | (package(codex-hepta-memory) & test(cognitive_retrieval)) | (package(codex-hepta-agentd) & (test(cognitive_context) | test(cognitive_retrieval) | test(retrieval_mode)))' 2>&1 | tee "$RUNNER_TEMP/retrieval-product-mode-evidence/tests.log"
      - name: Strict all-target Clippy and formatting
        shell: bash
        run: |
          set -euo pipefail
          (cd codex-rs && cargo clippy --locked -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd --all-targets -- -D warnings) 2>&1 | tee "$RUNNER_TEMP/retrieval-product-mode-evidence/clippy.log"
          (cd codex-rs && cargo fmt -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -- --check)
      - name: Verify unmutated exact source after execution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/capture_memory_retrieval_source.py --source-sha "$(git rev-parse HEAD)" --source-tree "$(git rev-parse HEAD^{tree})" --verify "$RUNNER_TEMP/retrieval-product-mode-evidence/source.json"
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-product-modes-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-product-mode-evidence/
          retention-days: 90
          if-no-files-found: error

  qualification-result:
    if: always()
    needs: [materialize, native]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Reject failed or skipped source and native qualification
        env:
          SOURCE_RESULT: ${{ needs.materialize.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$NATIVE_RESULT" = success
