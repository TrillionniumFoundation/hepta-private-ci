name: Apply control.engineering convergence v2

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/control-engineering-convergence-patch-v2.yml

permissions:
  contents: write

concurrency:
  group: control-engineering-convergence-patch-v2
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Reconstruct and apply deterministic convergence payload
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.control-engineering-patch/fixed* \
            | base64 --decode \
            | gzip --decompress \
            > scripts/apply_control_engineering_convergence_20260925.py
          test "$(sha256sum scripts/apply_control_engineering_convergence_20260925.py | cut -d' ' -f1)" \
            = "e90808e1ccf32feb8d6ab23dff2baa9c63579bd846ef51c03d4f0d48bfe51f4b"
          python3 -m py_compile scripts/apply_control_engineering_convergence_20260925.py
          python3 scripts/apply_control_engineering_convergence_20260925.py
          python3 -m compileall -q tools/hepta-engineering-control scripts
          find tools/hepta-engineering-control scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Create clean local candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/.control-engineering-patch
          rm -f \
            scripts/apply_control_engineering_convergence_20260925.py \
            .github/workflows/control-engineering-convergence-patch.yml \
            .github/workflows/control-engineering-convergence-patch-v2.yml
          git config user.name "Hepta Control Engineering CI"
          git config user.email "hepta-control-engineering-ci@users.noreply.github.com"
          git add -A
          git commit -m "control.engineering: close durable product boundaries"
          git fetch origin work/product-convergence-20260923
          git rebase origin/work/product-convergence-20260923

      - name: Regenerate exact maps and canonical audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-gap-closure.py normalize
          python3 scripts/hepta-implementation-maps.py migrate --module control.engineering
          git add -A
          git commit --amend --no-edit
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta-gap-closure.py verify
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Execute complete engineering owner suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -v \
            -s tools/hepta-engineering-control -p 'test_*.py'

      - name: Prepare dedicated strong-sandbox runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Execute strict sandbox and measured host qualification
        env:
          HEPTA_REQUIRE_STRONG_SANDBOX: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cd tools/hepta-engineering-control
          python3 -m unittest -v \
            test_candidate_sandbox_hardening.CandidateSandboxStrongIsolation
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=tools/hepta-engineering-control \
            python3 -m control_engineering_v2.host_qualification \
              --repository "$GITHUB_WORKSPACE" \
              --profile docs/modules/control.engineering/HOST_PROFILE.github-ubuntu-24.04.json \
              --include-strong-sandbox \
              --output "$RUNNER_TEMP/control-engineering-host.json"

      - name: Verify exact closure without promoting production
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta-gap-closure.py verify
          python3 - <<'PY'
          import json
          from pathlib import Path

          mapping = json.loads(
              Path("docs/modules/control.engineering/IMPLEMENTATION_MAP.json").read_text()
          )
          if mapping.get("productionImplementation") is not False:
              raise SystemExit("productionImplementation must remain false")
          source_base = mapping.get("sourceBase", {})
          if not source_base.get("commit") or not source_base.get("tree"):
              raise SystemExit("sourceBase provenance missing")
          PY
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Reconcile latest branch and push only a verified candidate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/product-convergence-20260923
          if test "$(git rev-parse HEAD^)" != "$(git rev-parse origin/work/product-convergence-20260923)"; then
            git rebase origin/work/product-convergence-20260923
            python3 scripts/hepta-gap-closure.py normalize
            python3 scripts/hepta-implementation-maps.py migrate --module control.engineering
            git add -A
            git commit --amend --no-edit
            python3 scripts/hepta-implementation-maps.py verify
            python3 scripts/hepta-gap-closure.py verify
            python3 -m unittest discover -v \
              -s tools/hepta-engineering-control -p 'test_*.py'
            cd tools/hepta-engineering-control
            HEPTA_REQUIRE_STRONG_SANDBOX=1 python3 -m unittest -v \
              test_candidate_sandbox_hardening.CandidateSandboxStrongIsolation
            cd "$GITHUB_WORKSPACE"
            test -z "$(git status --porcelain)"
          fi
          git push origin HEAD:work/product-convergence-20260923

      - name: Retain measured host receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-engineering-convergence-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-engineering-host.json
          if-no-files-found: warn
          retention-days: 30