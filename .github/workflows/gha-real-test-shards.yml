name: Real Python CI suite runner capacity qualification
on:
  push:
    branches: [ci/gha-real-test-shards-20261016]
    paths: [.github/workflows/gha-real-test-shards.yml]

permissions:
  contents: read

# This branch-only test does not change product required checks. Every shard
# must contain a unique real unittest file and must execute >0 test cases.
jobs:
  python-suite:
    name: Real module ${{ matrix.test_module }}
    # Static 48-way test file matrix: no planner runner is required.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 48
      matrix:
        test_module:
          - scripts/test_hepta_agentd_ci.py
          - scripts/test_hepta_algorithm_semantics.py
          - scripts/test_hepta_algorithm_workflow.py
          - scripts/test_hepta_candidate_transport_workflow.py
          - scripts/test_hepta_ci_cargo_entrypoints.py
          - scripts/test_hepta_ci_dependency_scaling.py
          - scripts/test_hepta_ci_exec.py
          - scripts/test_hepta_ci_exec_deadline.py
          - scripts/test_hepta_ci_exec_output.py
          - scripts/test_hepta_ci_history.py
          - scripts/test_hepta_ci_module_inputs.py
          - scripts/test_hepta_ci_nested_inputs.py
          - scripts/test_hepta_ci_opaque_inputs.py
          - scripts/test_hepta_ci_owner_transitions.py
          - scripts/test_hepta_ci_scope_roots.py
          - scripts/test_hepta_ci_source_identity.py
          - scripts/test_hepta_ci_v8.py
          - scripts/test_hepta_cleanup_consumers.py
          - scripts/test_hepta_cleanup_history.py
          - scripts/test_hepta_cognitive_migration_checkout.py
          - scripts/test_hepta_consolidated_scope.py
          - scripts/test_hepta_control_hardening.py
          - scripts/test_hepta_document_inventory.py
          - scripts/test_hepta_format_scope.py
          - scripts/test_hepta_gap_closure.py
          - scripts/test_hepta_implementation_git_environment.py
          - scripts/test_hepta_implementation_identity.py
          - scripts/test_hepta_implementation_maps.py
          - scripts/test_hepta_implementation_source_identity.py
          - scripts/test_hepta_integration_feedback.py
          - scripts/test_hepta_lane_b_owner_registry.py
          - scripts/test_hepta_lane_b_truth.py
          - scripts/test_hepta_lane_d_scope.py
          - scripts/test_hepta_lane_e_registry.py
          - scripts/test_hepta_ledger_scale.py
          - scripts/test_hepta_main_protection.py
          - scripts/test_hepta_main_protection_freshness.py
          - scripts/test_hepta_metadata.py
          - scripts/test_hepta_module_catalog.py
          - scripts/test_hepta_module_doc_metadata.py
          - scripts/test_hepta_module_navigation.py
          - scripts/test_hepta_module_projection_membership.py
          - scripts/test_hepta_module_registry.py
          - scripts/test_hepta_module_source_roots.py
          - scripts/test_hepta_module_status_facts.py
          - scripts/test_hepta_native_feedback.py
          - scripts/test_hepta_objective_contracts.py
          - scripts/test_hepta_paper_evidence.py
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Execute actual unittest suite; prohibit empty shards
        shell: bash
        env:
          TEST_MODULE: ${{ matrix.test_module }}
        run: |
          set -euo pipefail
          python3 - "$TEST_MODULE" <<'PY'
          from pathlib import Path
          import sys
          import unittest

          path = Path(sys.argv[1])
          if path.parent != Path("scripts") or not path.name.startswith("test_hepta_"):
              raise SystemExit("unexpected test module path")
          if not path.is_file():
              raise SystemExit("missing checked-out test module")
          suite = unittest.defaultTestLoader.discover(start_dir="scripts", pattern=path.name)
          count = suite.countTestCases()
          print(f"Real test file: {path}; cases: {count}", flush=True)
          if count < 1:
              raise SystemExit("empty shard is forbidden")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  x64-ubuntu26-control:
    name: Linux x64 Ubuntu 26 identical real suite control
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -v -s scripts -p test_hepta_ci_scope_roots.py

  x64-ubuntu24-control:
    name: Linux x64 Ubuntu 24 identical real suite control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -v -s scripts -p test_hepta_ci_scope_roots.py
