name: Kernel evidence convergence

on:
  push:
    branches: [codex/kernel-evidence-converged-20260927]
  pull_request:
    paths:
      - 'codex-rs/hepta-evidence/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/state/**'
      - 'scripts/*kernel_evidence*'
      - 'scripts/tests/test_kernel_evidence*'
      - 'qualification/kernel-evidence/**'
      - '.github/workflows/hepta-kernel-evidence*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-evidence-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Evidence convergence regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence-convergence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence-convergence/source.commit"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/evidence-convergence/source.tree"
          git archive --format=tar.gz --output="$RUNNER_TEMP/evidence-convergence/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/evidence-convergence/source.tar.gz" > "$RUNNER_TEMP/evidence-convergence/source.sha256"
      - name: Run Python evidence regressions
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_kernel_evidence*.py' -v 2>&1 | tee "$RUNNER_TEMP/evidence-convergence/python-tests.log"
      - name: Upload source and partial diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-evidence-convergence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-convergence/
          if-no-files-found: error
          retention-days: 14
