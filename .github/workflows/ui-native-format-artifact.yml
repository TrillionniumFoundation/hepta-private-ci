name: ui.native formatter artifact

on:
  pull_request:
    branches:
      - work/ui-native-qualified-integration-20260928
    paths:
      - apps/hepta-native/**
      - .github/workflows/ui-native-format-artifact.yml
  push:
    branches:
      - work/ui-native-exact-convergence-20260930
    paths:
      - .github/workflows/ui-native-format-artifact.yml

permissions:
  contents: read

concurrency:
  group: ui-native-format-artifact-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  format-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Materialize formatter-only result
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          mkdir -p "$RUNNER_TEMP/ui-native-rustfmt"
          git diff --name-only -- apps/hepta-native > "$RUNNER_TEMP/ui-native-rustfmt/changed-files.txt"
          git diff --binary -- apps/hepta-native > "$RUNNER_TEMP/ui-native-rustfmt/rustfmt.patch"
          tar -czf "$RUNNER_TEMP/ui-native-rustfmt/formatted-source.tar.gz" apps/hepta-native/src
          git rev-parse HEAD > "$RUNNER_TEMP/ui-native-rustfmt/source-sha.txt"
          sha256sum \
            "$RUNNER_TEMP/ui-native-rustfmt/rustfmt.patch" \
            "$RUNNER_TEMP/ui-native-rustfmt/formatted-source.tar.gz" \
            > "$RUNNER_TEMP/ui-native-rustfmt/SHA256SUMS"
          printf 'formatted paths:\n'
          cat "$RUNNER_TEMP/ui-native-rustfmt/changed-files.txt"

      - name: Retain formatter result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-rustfmt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ui-native-rustfmt
          if-no-files-found: error
          retention-days: 1
