name: Cognitive store convergence finalizer

on:
  push:
    branches:
      - codex/cognitive-store-full-convergence-20260927

concurrency:
  group: cognitive-store-convergence-finalizer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[cognitive-store-finalize]') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/cognitive-store-full-convergence-20260927
          fetch-depth: 0
          persist-credentials: true
      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Finalize source and documentation tree
        run: |
          set -euo pipefail
          python3 scripts/cognitive_store_finalize.py
          python3 -m py_compile \
            scripts/cognitive_store_architecture.py \
            scripts/cognitive_store_map_verify.py \
            scripts/cognitive_store_qualification_manifest.py \
            tools/cognitive-store-host-bootstrap/bootstrap.py \
            tools/cognitive-store-host-bootstrap/test_bootstrap.py
          python3 scripts/cognitive_store_architecture.py
          python3 tools/cognitive-store-host-bootstrap/test_bootstrap.py
      - name: Commit finalized source
        run: |
          set -euo pipefail
          git config user.name "Hepta Cognitive Store CI"
          git config user.email "hepta-cognitive-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "cognitive.store: finalize workflow, map verifier, and clean tree [cognitive-store-finalize]"
      - name: Rebind cognitive and shared-callsite maps
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate \
            --module cognitive.store \
            --module kernel.operations \
            --module runtime.supervisor \
            --module runtime.agentd \
            --module intelligence.control \
            --module memory.retrieval \
            --module memory.federation \
            --module knowledge.graph \
            --module learning.operator
      - name: Commit exact map observations
        run: |
          set -euo pipefail
          git add docs/modules/*/IMPLEMENTATION_MAP.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No map observation changed."
          else
            git commit -m "docs(cognitive-store): rebind affected implementation maps [cognitive-store-finalize]"
          fi
      - name: Verify final candidate
        run: |
          set -euo pipefail
          python3 scripts/cognitive_store_architecture.py
          python3 scripts/cognitive_store_map_verify.py \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          python3 tools/cognitive-store-host-bootstrap/test_bootstrap.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Push finalized branch
        run: git push origin HEAD:codex/cognitive-store-full-convergence-20260927
