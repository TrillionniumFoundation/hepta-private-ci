name: NDU joint evidence and four-output research (shadow)
on:
  pull_request:
    paths:
      - 'experiments/multimodal_output_portfolio/v5/**'
      - '.github/workflows/ndu-joint-evidence-output-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-finite-oracle:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Pull-request merge SHAs are not source-head qualification receipts.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject different-SHA or dirty source before research tests
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked out $actual_source_sha but expected exact source $EXPECTED_SOURCE_SHA"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Research source tree was dirty before qualification"
            exit 1
          fi
      - name: Validate joint policy, path audit, independence and shift
        working-directory: experiments/multimodal_output_portfolio/v5
        run: |
          python3 -m unittest discover -v -p "test_*.py"
          python3 -m compileall -q joint_portfolio.py test_*.py
