name: Materialize learning.artifacts operational closure

on:
  push:
    branches:
      - chatgpt/learning-artifacts-operational-closure-20260928

permissions:
  contents: write

concurrency:
  group: materialize-learning-artifacts-operational-closure
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bind bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/chatgpt/learning-artifacts-operational-closure-20260928
      - name: Decode materializer
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializer-parts/*.b64 | tr -d '\n' > "$RUNNER_TEMP/materializer.b64"
          python3 - "$RUNNER_TEMP/materializer.b64" "$RUNNER_TEMP/materialize_learning_artifacts_operational_closure.py" <<'PY'
          import base64, pathlib, sys, zlib
          source = pathlib.Path(sys.argv[1]).read_text()
          pathlib.Path(sys.argv[2]).write_bytes(zlib.decompress(base64.b64decode(source)))
          PY
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Materialize source candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/materialize_learning_artifacts_operational_closure.py" source
          git rm .github/workflows/materialize-learning-artifacts-operational-closure.yml
          git rm -r .github/materializer-parts
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-learning-artifacts
          git add -A
          git diff --cached --check
      - name: Python qualification regressions
        run: python3 -m unittest discover -s scripts -p 'test_hepta_artifact_*.py' -v
      - name: Compile all artifact targets with test hooks
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-learning-artifacts --all-targets \
            --features artifact_test_hooks
      - name: Execute artifact package tests with test hooks
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-learning-artifacts \
            --features artifact_test_hooks -- --nocapture
      - name: Commit exact source candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT learning.artifacts closure'
          git config user.email 'chatgpt-learning-artifacts@users.noreply.github.com'
          git commit -m 'learning.artifacts: unify owner identity state metrics and measurements'
          source_commit=$(git rev-parse HEAD)
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Materialize verifiable delivery index
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/materialize_learning_artifacts_operational_closure.py" \
            delivery --source-commit "$SOURCE_COMMIT"
          git add docs/modules/learning.artifacts/IMPLEMENTATION_MAP.json \
            docs/modules/learning.artifacts/DELIVERY_INDEX.md \
            qualification/learning-artifacts/DELIVERY_INDEX.json \
            qualification/learning-artifacts/STATUS.json
          staged_tree=$(git write-tree)
          python3 scripts/hepta_artifact_source_binding.py \
            --tree "$staged_tree" --write \
            --include codex-rs/hepta-learning-artifacts/PERFORMANCE_PROTOCOL.md \
            --include docs/modules/learning.artifacts/DELIVERY_INDEX.md \
            --include qualification/learning-artifacts/DELIVERY_INDEX.json \
            --include qualification/learning-artifacts/STATUS.json
          git add docs/modules/learning.artifacts/IMPLEMENTATION_MAP.json
          python3 scripts/hepta_artifact_source_binding.py --tree "$(git write-tree)"
          python3 - "$SOURCE_COMMIT" <<'PY'
          import json, pathlib, subprocess, sys
          source = sys.argv[1]
          root = pathlib.Path('.')
          status = json.loads((root / 'qualification/learning-artifacts/STATUS.json').read_text())
          index = json.loads((root / 'qualification/learning-artifacts/DELIVERY_INDEX.json').read_text())
          assert status['sourceCommit'] == source == index['sourceCommit']
          subprocess.run(['git', 'cat-file', '-e', source + '^{commit}'], check=True)
          assert status['states'] == {
              'codeWritten': True,
              'executed': False,
              'nativeQualified': False,
              'onMain': False,
              'productionActivated': False,
              'independentAcceptance': False,
              'release': False,
          }
          for row in index['capabilities']:
              assert row['codeWritten'] is True
              assert row['executed'] is False
              assert row['nativeQualified'] is False
              assert row['onMain'] is False
          PY
          git diff --cached --check
      - name: Commit delivery index and push
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "learning.artifacts: bind delivery index to ${SOURCE_COMMIT}"
          git push origin HEAD:chatgpt/learning-artifacts-operational-closure-20260928
