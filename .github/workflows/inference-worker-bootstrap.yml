name: Apply inference.worker convergence patch

on:
  push:
    branches:
      - codex/inference-worker-convergence-20260928
    paths:
      - '.bootstrap/inference-worker/**'
      - '.github/workflows/inference-worker-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: inference-worker-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify bootstrap identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "codex/inference-worker-convergence-20260928"
          test "$(git rev-parse HEAD^)" = "a126987b84737dbc2ee2592442a314117bddb4a2"
      - name: Materialize exact patch archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/inference-worker/chunk-* | base64 --decode > /tmp/inference-worker-patch.tar.gz
          test "$(sha256sum /tmp/inference-worker-patch.tar.gz | awk '{print $1}')" = "552e93d7c43e405bde70746ddf630140d11386e930590a78ece08a9825b39da8"
          tar -tzf /tmp/inference-worker-patch.tar.gz >/tmp/inference-worker-patch.list
          ! grep -E '(^|/)\.git(/|$)' /tmp/inference-worker-patch.list
          tar -xzf /tmp/inference-worker-patch.tar.gz -C .
          rm -rf .bootstrap/inference-worker
          rm -f .github/workflows/inference-worker-bootstrap.yml
      - name: Commit materialized candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta inference.worker convergence"
          git config user.email "hepta-inference-worker@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "inference.worker: close profile, grant, resource, recovery, and qualification gaps"
          git push origin HEAD:${GITHUB_REF_NAME}
