name: Hepta retrieval V3 transport integrity
on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
permissions:
  contents: read
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[retrieval-v3-transport]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check byte-identical transport; never execute patch contents
        run: |
          mkdir -p "$RUNNER_TEMP/transport"
          python3 - <<'PY'
          import pathlib, base64, hashlib, gzip, os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'transport'
          parts=[pathlib.Path(f'scripts/patches/memory_retrieval_v3_delta.part{i}') for i in range(2)]
          original=b''.join(p.read_bytes().strip() for p in parts)
          (out/'received.b64').write_bytes(original)
          fixed=original
          for old,new in [(b'nZTGTJJ/q',b'nZTGTJ/q'),(b'RfhIYY/',b'RfhIY/'),(b'+5aEE+l',b'+5aE+l')]:
              fixed=fixed.replace(old,new)
          (out/'repaired.b64').write_bytes(fixed)
          assert hashlib.sha256(fixed).hexdigest()=='ffae649645611a1e7c0b8289088136c62e437e5485fe51af1f99eda46492b554', 'transport differs from reviewed bytes'
          patch=gzip.decompress(base64.b64decode(fixed,validate=True))
          assert len(patch)==74929 and hashlib.sha256(patch).hexdigest()=='f8ac4f94a183aea5bdc8291f52e26a8bf73a6c4cd55a8e67a8abd964d73e41f1'
          for i,p in enumerate(parts): p.write_bytes(fixed[i*10800:(i+1)*10800])
          (out/'integrity.txt').write_text('reviewed delta byte identity verified; no source executed\n')
          PY
      - name: Fast-forward corrected transport only
        env:
          WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scripts/patches/memory_retrieval_v3_delta.part0 scripts/patches/memory_retrieval_v3_delta.part1
          git diff --cached --quiet || git commit -m 'chore(memory.retrieval): restore exact reviewed transport bytes'
          header=$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" ls-remote --heads origin work/memory-retrieval-hardening-20260927 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/work/memory-retrieval-hardening-20260927
          git rev-parse HEAD > "$RUNNER_TEMP/transport/head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-v3-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/transport/
          retention-days: 7
          if-no-files-found: error
