name: Kernel authority target capacity collection

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate commit to measure
        required: true
        type: string
      profile_id:
        description: Stable target-host profile identifier
        required: true
        type: string
      samples:
        description: Samples per measurement and diagnostic row (minimum 100)
        required: true
        default: "100"
        type: string
      driver_sha256:
        description: Expected SHA-256 of the protected host-owned measurement driver
        required: true
        type: string
      policy_sha256:
        description: Expected SHA-256 of the independently reviewed hot-path policy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kernel-authority-target-capacity-${{ inputs.candidate_sha }}-${{ inputs.profile_id }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect exact target-host matrix
    if: github.ref == 'refs/heads/main'
    environment: kernel-authority-target
    runs-on: [self-hosted, kernel-authority-target]
    timeout-minutes: 360
    env:
      DRIVER: /opt/hepta/bin/kernel-authority-capacity-driver
      POLICY: /opt/hepta/policies/kernel-authority-hot-path-policy.json
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PROFILE_ID: ${{ inputs.profile_id }}
      SAMPLES: ${{ inputs.samples }}
      EXPECTED_DRIVER_SHA256: ${{ inputs.driver_sha256 }}
      EXPECTED_POLICY_SHA256: ${{ inputs.policy_sha256 }}
      EVIDENCE_ROOT: ${{ runner.temp }}/kernel-authority-target-capacity
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROFILE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,127}$ ]]
          [[ "$SAMPLES" =~ ^[0-9]+$ ]]
          test "$SAMPLES" -ge 100
          test "$SAMPLES" -le 1000000
          [[ "$EXPECTED_DRIVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$EVIDENCE_ROOT"

      - name: Checkout trusted collector from exact main dispatch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Checkout candidate as a non-executed identity subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}
          path: subject
          persist-credentials: false

      - id: identity
        name: Pin control, candidate, collector, policy, and driver identities
        shell: bash
        run: |
          set -euo pipefail
          control="$GITHUB_WORKSPACE/control"
          subject="$GITHUB_WORKSPACE/subject"
          test "$(git -C "$control" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$subject" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C "$control" status --porcelain)"
          test -z "$(git -C "$subject" status --porcelain)"
          collector="$control/qualification/kernel-authority/capacity_matrix.py"
          gate="$control/qualification/kernel-authority/hot_path_gate.py"
          test -f "$collector"
          test -f "$gate"
          test -f "$POLICY"
          test -f "$DRIVER"
          test -x "$DRIVER"
          candidate_tree="$(git -C "$subject" rev-parse 'HEAD^{tree}')"
          control_tree="$(git -C "$control" rev-parse 'HEAD^{tree}')"
          collector_sha256="$(python3 -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$collector")"
          gate_sha256="$(python3 -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$gate")"
          observed_policy_sha256="$(python3 -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$POLICY")"
          observed_driver_sha256="$(python3 -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$DRIVER")"
          test "$observed_policy_sha256" = "$EXPECTED_POLICY_SHA256"
          test "$observed_driver_sha256" = "$EXPECTED_DRIVER_SHA256"
          cp "$POLICY" "$EVIDENCE_ROOT/hot-path-policy.json"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_ROOT/candidate-commit.txt"
          printf '%s\n' "$candidate_tree" > "$EVIDENCE_ROOT/candidate-tree.txt"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_ROOT/control-commit.txt"
          printf '%s\n' "$control_tree" > "$EVIDENCE_ROOT/control-tree.txt"
          printf '%s\n' "$collector_sha256" > "$EVIDENCE_ROOT/collector-sha256.txt"
          printf '%s\n' "$gate_sha256" > "$EVIDENCE_ROOT/hot-path-gate-sha256.txt"
          printf '%s\n' "$observed_policy_sha256" > "$EVIDENCE_ROOT/policy-sha256.txt"
          printf '%s\n' "$observed_driver_sha256" > "$EVIDENCE_ROOT/driver-sha256.txt"
          printf '%s\n' "${RUNNER_NAME:-unknown}" > "$EVIDENCE_ROOT/runner-name.txt"
          printf 'candidate_tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"

      - name: Build exact measurement plan with trusted collector
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/control/qualification/kernel-authority/capacity_matrix.py" plan \
            --candidate-commit "$CANDIDATE_SHA" \
            --candidate-tree '${{ steps.identity.outputs.candidate_tree }}' \
            --profile-id "$PROFILE_ID" \
            --samples "$SAMPLES" \
            --output "$EVIDENCE_ROOT/plan.json"

      - name: Collect real target-host rows with pinned host driver
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/control/qualification/kernel-authority/capacity_matrix.py" collect \
            --plan "$EVIDENCE_ROOT/plan.json" \
            --driver "$DRIVER" \
            --output-dir "$EVIDENCE_ROOT/collection" \
            --timeout-seconds 3600

      - name: Reopen and validate the retained collection
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/control/qualification/kernel-authority/capacity_matrix.py" validate \
            --plan "$EVIDENCE_ROOT/plan.json" \
            --collection "$EVIDENCE_ROOT/collection/capacity-collection.json"
          python3 - "$EVIDENCE_ROOT/collection/capacity-collection.json" <<'PY'
          import json
          import pathlib
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if receipt.get("synthetic") is not False or receipt.get("passed") is not True:
              raise SystemExit("target collection is not a real validated pass")
          for field in (
              "productionEvidenceAdmissible",
              "productionSloGranted",
              "independentAcceptance",
              "activationGranted",
              "releaseGranted",
          ):
              if receipt.get(field) is not False:
                  raise SystemExit(f"target collection overclaims {field}")
          if len(receipt.get("measurements", [])) != 55:
              raise SystemExit("target collection does not contain 55 measurement rows")
          if len(receipt.get("faultResults", [])) != 8:
              raise SystemExit("target collection does not contain eight fault rows")
          if len(receipt.get("hotPathDiagnostics", [])) != 25:
              raise SystemExit("target collection does not contain 25 diagnostics")
          PY

      - name: Apply independent hot-path policy
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/control/qualification/kernel-authority/hot_path_gate.py" \
            --plan "$EVIDENCE_ROOT/plan.json" \
            --collection "$EVIDENCE_ROOT/collection/capacity-collection.json" \
            --policy "$EVIDENCE_ROOT/hot-path-policy.json" \
            --output "$EVIDENCE_ROOT/hot-path-decision.json"
          python3 - "$EVIDENCE_ROOT/hot-path-decision.json" <<'PY'
          import json
          import pathlib
          import sys

          decision = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if decision.get("passed") is not True:
              raise SystemExit("hot-path policy did not pass")
          if len(decision.get("metricResults", [])) != 5:
              raise SystemExit("hot-path decision does not contain five metrics")
          for field in (
              "runtimeOptimizationAuthorized",
              "productionSloGranted",
              "independentAcceptance",
              "activationGranted",
              "releaseGranted",
          ):
              if decision.get(field) is not False:
                  raise SystemExit(f"hot-path decision overclaims {field}")
          PY
          git -C "$GITHUB_WORKSPACE/control" diff --check
          test -z "$(git -C "$GITHUB_WORKSPACE/control" status --porcelain)"
          test -z "$(git -C "$GITHUB_WORKSPACE/subject" status --porcelain)"

      - name: Retain candidate-bound target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-authority-target-capacity-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/kernel-authority-target-capacity
          if-no-files-found: error
          retention-days: 30
