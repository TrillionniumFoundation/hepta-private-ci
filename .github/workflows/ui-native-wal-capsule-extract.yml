name: ui.native WAL capsule extraction

on:
  push:
    branches: [work/ui-native-storage-performance-convergence-20260929]
    paths:
      - .github/workflows/ui-native-wal-capsule-extract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-native-wal-capsule-extract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .ci/ui-native-wal-index/source.patch.gz
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Verify and materialize reviewed text patch
        env:
          PATCH_BLOB_SHA: cf8d5267cbcde61455849e24be9eac9d1a8d14f3
          PATCH_SHA256: b863bb348b91e038f711b5a155a383aaa342ee6beacb1cd168901f82159dd74a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:.ci/ui-native-wal-index/source.patch.gz)" = "$PATCH_BLOB_SHA"
          test -f .ci/ui-native-wal-index/source.patch.gz
          python3 - <<'PYTHON'
          import gzip
          import hashlib
          from pathlib import Path

          source = Path('.ci/ui-native-wal-index/source.patch.gz')
          destination = Path('.ci/ui-native-wal-index/source.patch')
          decoded = gzip.decompress(source.read_bytes())
          expected = 'b863bb348b91e038f711b5a155a383aaa342ee6beacb1cd168901f82159dd74a'
          observed = hashlib.sha256(decoded).hexdigest()
          if observed != expected:
              raise SystemExit(f'decoded patch digest mismatch: {observed}')
          destination.write_bytes(decoded)
          PYTHON
          printf '%s  %s\n' "$PATCH_SHA256" .ci/ui-native-wal-index/source.patch | sha256sum --check --strict
          git add -f .ci/ui-native-wal-index/source.patch
          git diff --cached --check
          git config user.name 'hepta-native-capsule-bot'
          git config user.email 'hepta-native-capsule-bot@users.noreply.github.com'
          git commit -m 'ci(ui.native): materialize reviewed WAL patch for convergence'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
