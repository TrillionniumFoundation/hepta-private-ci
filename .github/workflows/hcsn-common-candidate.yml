name: HCSN common numerical and training candidate

on:
  pull_request:
    paths:
      - qualification/hcsn_joint_dde/**
      - qualification/hcsn_reset_aligned/**
      - qualification/hcsn_common_current/**
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - qualification/hcsn_boundary_audit/refractory_transport.py
      - .github/workflows/hcsn-common-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-source:
    name: Common training / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: archived
            ref: a12f564d5d15258f6ef5d64ceaa5966d2fd04f8f
            entry: qualification.hcsn_reset_aligned.qualify_common
            artifact: hcsn-common-originals
          - lane: current
            ref: ""
            entry: qualification.hcsn_common_current.qualify
            artifact: hcsn-common-current
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CANDIDATE_COMMIT: ${{ matrix.ref || github.event.pull_request.head.sha || github.sha }}
      QUALIFY_MODULE: ${{ matrix.entry }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pinned CPU numerical runtime
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute common source with originals
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_COMMIT}"
          python -B -m "${QUALIFY_MODULE}" --output "${RUNNER_TEMP}/hcsn-common"
      - name: Require clean source tree
        run: git diff --exit-code && git diff --cached --exit-code && test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/hcsn-common
          if-no-files-found: error
