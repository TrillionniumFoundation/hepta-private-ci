name: hepta runtime blocker evidence

on:
  pull_request:
    paths:
      - .github/workflows/hepta-runtime-blocker-evidence.yml
      - .github/scripts/qualify_runtime_blockers.py
      - codex-rs/hepta-operator-acceptance/**
      - codex-rs/secrets/**
      - codex-rs/third_party/i18n-config-0.4.8/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - MODULE.bazel
      - MODULE.bazel.lock

permissions:
  contents: read

concurrency:
  group: hepta-runtime-blocker-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  RUSTUP_TOOLCHAIN: 1.95.0
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lock-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Freeze tracked source, manifests and locks
        run: |
          export EVIDENCE_DIR="${RUNNER_TEMP}/hepta-runtime-lock"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          python3 .github/scripts/qualify_runtime_blockers.py freeze lock
      - name: Install the repository Rust compiler
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Prepare original Bazel tooling
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: runtime-blocker-lock
      - name: Generate and check the actual Bazel lock candidate
        id: qualify
        run: python3 .github/scripts/qualify_runtime_blockers.py run lock
      - name: Retain lock bytes and verify source conservation
        if: always()
        env:
          SCOPE_OUTCOME: ${{ steps.qualify.outcome }}
        run: python3 .github/scripts/qualify_runtime_blockers.py finalize lock
      - name: Upload exact generated lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  native-consumer:
    name: ${{ matrix.scope }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: operator
            runner: ubuntu-24.04
            python: python3
          - scope: operator
            runner: windows-latest
            python: python
          - scope: operator
            runner: macos-15
            python: python3
          - scope: secrets
            runner: ubuntu-24.04
            python: python3
    env:
      PYTHON_COMMAND: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact source without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Freeze tracked source and original test inputs
        run: |
          export EVIDENCE_DIR="${RUNNER_TEMP}/hepta-runtime-${{ matrix.scope }}"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          "${PYTHON_COMMAND}" .github/scripts/qualify_runtime_blockers.py freeze "${{ matrix.scope }}"
      - name: Prepare repository native CI environment
        uses: ./.github/actions/setup-ci
      - name: Install the repository Rust compiler
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt
      - name: Install the original nextest version
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
      - name: Install scoped Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config perl libdbus-1-dev libcap-dev
      - name: Execute the unchanged package test entry point
        id: qualify
        run: '"${PYTHON_COMMAND}" .github/scripts/qualify_runtime_blockers.py run "${{ matrix.scope }}"'
      - name: Verify exact source after the native run
        if: always()
        env:
          SCOPE_OUTCOME: ${{ steps.qualify.outcome }}
        run: '"${PYTHON_COMMAND}" .github/scripts/qualify_runtime_blockers.py finalize "${{ matrix.scope }}"'
      - name: Upload raw native execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.scope }}-${{ matrix.runner }}-${{ github.event.pull_request.head.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
