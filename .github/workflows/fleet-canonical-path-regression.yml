name: Fleet canonical temporary-path regression

on:
  pull_request:
    paths:
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "codex-rs/hepta-fleet/**"
      - ".github/workflows/fleet-canonical-path-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-canonical-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: Fleet exact source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest
      - name: Install pinned Rust checks
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Record source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD HEAD^{tree}
      - name: Test all Fleet cases through an aliased temporary root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-real"
          ln -s "$RUNNER_TEMP/fleet-real" "$RUNNER_TEMP/fleet-alias"
          TMPDIR="$RUNNER_TEMP/fleet-alias" just test -p codex-hepta-fleet --locked
      - name: Check source formatting and strict Fleet lint
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-fleet -- --check
          cargo clippy --manifest-path codex-rs/Cargo.toml -p codex-hepta-fleet --locked --all-targets --no-deps -- -D warnings
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
