name: Prompt live-owner integrity regression

on:
  pull_request:
    paths:
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/hepta-prompt-optimizer/**"
      - ".github/workflows/prompt-live-integrity-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-live-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: Prompt exact source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest
      - name: Install pinned Rust checks
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Record source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD HEAD^{tree}
      - name: Test registry owner and optimizer consumer
        shell: bash
        run: just test -p codex-hepta-prompt-registry -p codex-hepta-prompt-optimizer --locked
      - name: Check source formatting and strict prompt lint
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-prompt-registry -p codex-hepta-prompt-optimizer -- --check
          cargo clippy --manifest-path codex-rs/Cargo.toml -p codex-hepta-prompt-registry -p codex-hepta-prompt-optimizer --locked --all-targets --no-deps -- -D warnings
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Report bounded live-read fixture cost
        shell: bash
        run: |
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-prompt-registry live_integrity_read_cost_is_reported -- --nocapture
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
