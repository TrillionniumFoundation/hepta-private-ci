name: kernel.evidence native closure pocket4 once

on:
  push:
    branches: [fix/kernel-evidence-production-closure]

permissions:
  contents: write

concurrency:
  group: kernel-evidence-native-closure-pocket4-once
  cancel-in-progress: true

jobs:
  close-native-blockers:
    if: github.ref == 'refs/heads/fix/kernel-evidence-production-closure'
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ github.sha }}
      TARGET_BRANCH: fix/kernel-evidence-production-closure
    steps:
      - name: Check out exact convergence head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          source = Path('.github/workflows/kernel-evidence-native-closure-once.yml').read_text(encoding='utf-8')
          match = re.search(
              r"          python3 - <<'PY'\n(.*?)\n          PY\n\n      - name: Format source and repository Python",
              source,
              flags=re.S,
          )
          if match is None:
              raise SystemExit('reviewed closure patch block was not found')
          code = textwrap.dedent(match.group(1))
          compile(code, 'kernel-evidence-native-closure.patch.py', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

      - name: Format and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          uv run --frozen --project scripts ruff format scripts
          git diff --check

      - name: Run native acceptance set
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          just test --locked -p codex-hepta-evidence
          just test --locked -p codex-hepta-agentd --lib --test kernel_evidence_product --test kernel_evidence_profile --test kernel_evidence_paging_product --test kernel_evidence_publication_cli
          cargo test --locked -p codex-hepta-evidence --doc
          cd ..
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-evidence -p codex-hepta-agentd --all-targets -- -D warnings
          cargo build --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-agentd --bin codex-hepta-agentd

      - name: Commit verified exact head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          rm -f \
            .github/workflows/kernel-evidence-native-closure-once.yml \
            .github/workflows/kernel-evidence-native-closure-rog-once.yml \
            .github/workflows/kernel-evidence-native-closure-pocket4-once.yml
          git diff --check
          git config user.name "kernel-evidence-closure"
          git config user.email "kernel-evidence-closure@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(kernel.evidence): close native test and lint blockers [kernel-evidence-closure]"
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
