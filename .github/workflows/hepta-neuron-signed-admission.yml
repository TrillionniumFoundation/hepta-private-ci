name: Hepta Neuron signed admission and worker qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/hepta-neuron-signed-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-neuron-signed-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  exact-source:
    name: Neuron signed entrypoint + worker compile (non-authorizing)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt
      - name: Verify exact checkout and Rust toolchain
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          rustc --version
          cargo --version
          cargo fmt --version
          git diff --quiet
          git diff --cached --quiet
      - name: Check locked workspace graph
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_workspace.py
          mkdir -p "$RUNNER_TEMP/hepta-neuron-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-neuron-evidence/tested-source-sha.txt"
          rustc --version --verbose > "$RUNNER_TEMP/hepta-neuron-evidence/toolchain.txt"
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps --format-version 1 > "$RUNNER_TEMP/hepta-neuron-evidence/cargo-metadata.json"
      - name: Verify closed-world B4 privileged caller inventory
        id: callers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-neuron-evidence"
          if python3 scripts/verify_hepta_callers.py verify > "$RUNNER_TEMP/hepta-neuron-evidence/caller-proof.log" 2>&1; then
            cat "$RUNNER_TEMP/hepta-neuron-evidence/caller-proof.log"
          else
            cat "$RUNNER_TEMP/hepta-neuron-evidence/caller-proof.log"
            exit 1
          fi
      - name: Check source formatting (no mutation)
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-neuron --package codex-hepta-intelligence --package codex-hepta-agentd --package codex-hepta-infer-worker-host -- --check
      - name: Run neuron + intelligence signed-authority tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked --lib -p codex-hepta-neuron -p codex-hepta-intelligence
      - name: Compile worker, agentd and model owner
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked --lib -p codex-hepta-infer-worker-host -p codex-hepta-agentd -p codex-hepta-neuron -p codex-hepta-intelligence
      - name: Reference microbatch and durable metrics qualification
        id: qualification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked --lib -p codex-hepta-infer-worker-host neuron_microbatch
          for cells in 64 256 1024 4096; do
            cargo run --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-infer-worker-host --bin hepta-neuron-microbatch-qualification -- --cells "$cells" > "$RUNNER_TEMP/hepta-neuron-evidence/reference-${cells}.json"
            python3 - "$RUNNER_TEMP/hepta-neuron-evidence/reference-${cells}.json" "$cells" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              receipt = json.load(handle)
          cells = int(sys.argv[2])
          assert receipt["cells"] == cells
          assert receipt["acceptedCells"] == cells
          assert receipt["executedBatchCalls"] == (cells + 255) // 256
          assert receipt["durableMetricRecords"] == (cells + 255) // 256
          assert receipt["recoveredCompleteRecords"] == (cells + 255) // 256
          assert receipt["crashTailRecovered"] is True
          assert receipt["productionClaim"] is False
          assert receipt["targetHostProductAcceptance"] is False
          assert receipt["authority"] == "DENY_ALL"
          print("reference qualification verified:", cells)
          PY
          done
      - name: Strict focused Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --lib -p codex-hepta-neuron -p codex-hepta-intelligence -p codex-hepta-agentd -p codex-hepta-infer-worker-host -- -D clippy::correctness -D clippy::await_holding_lock -D clippy::await_holding_invalid_type
      - name: Enforce every exact-head gate (no bypass from diagnostic continuation)
        if: always()
        shell: bash
        env:
          CALLERS: ${{ steps.callers.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          QUALIFICATION: ${{ steps.qualification.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          set -euo pipefail
          for result in "$CALLERS" "$FORMAT" "$TESTS" "$COMPILE" "$QUALIFICATION" "$CLIPPY"; do
            test "$result" = 'success' || { echo "required gate is not success: $result"; exit 1; }
          done
      - name: Verify no test mutated source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain locked graph and exact checkout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hepta-neuron-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-neuron-evidence/*
          if-no-files-found: warn
          retention-days: 14
