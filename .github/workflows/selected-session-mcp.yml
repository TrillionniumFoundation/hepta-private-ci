name: Selected external-agent MCP capture
on:
  push:
    branches: [research/selected-session-mcp-20261123]
    paths:
      - scripts/cell_experiments/selected_session_mcp.py
      - qualification/selected-session-mcp-20261123/**
      - .github/workflows/selected-session-mcp.yml
permissions:
  contents: read
jobs:
  selected-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install the loopback client and producer verifier
        run: |
          python -m venv "$RUNNER_TEMP/selected-env"
          "$RUNNER_TEMP/selected-env/bin/pip" install --only-binary=:all: mcp==1.29.0 cryptography==50.0.0 numpy==2.3.5
      - name: Reopen the actual selected artifact and run handoff and denial controls
        run: |
          "$RUNNER_TEMP/selected-env/bin/python" qualification/selected-session-mcp-20261123/qualify.py --archive "$RUNNER_TEMP/SELECTED_SESSION_ORIGINALS.zip"
      - name: Retain exact engineering observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-session-mcp-originals
          path: ${{ runner.temp }}/SELECTED_SESSION_ORIGINALS.zip
          if-no-files-found: error
          retention-days: 90
