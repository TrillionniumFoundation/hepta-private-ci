name: control-engineering-bootstrap

on:
  push:
    branches:
      - codex/control-engineering-production-closure-20260928
    paths:
      - .github/workflows/control-engineering-bootstrap.yml

concurrency:
  group: control-engineering-clean-commit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mint-clean-commit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/control-engineering-production-closure-20260928
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct verified payload and create clean Git object
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAYLOAD_COMMIT: 3f45dbd0f15a7c9fea9ee5bbdf32fb2b8684774e
          BASE_COMMIT: a126987b84737dbc2ee2592442a314117bddb4a2
          BASE_TREE: a22fd0074c45ae6f3cef2092cd6e273bf9c26c30
          EXPECTED_ARCHIVE: e5477cdbedf6b1ff4ed7e604826f57c0a1a96c93712b1b0d1832ab3eeb9d471b
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$PAYLOAD_COMMIT"
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import PurePosixPath
          import subprocess
          import tarfile
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          payload_commit = os.environ["PAYLOAD_COMMIT"]
          base_commit = os.environ["BASE_COMMIT"]
          base_tree = os.environ["BASE_TREE"]
          expected_archive = os.environ["EXPECTED_ARCHIVE"]
          manifest_name = ".bootstrap/control-engineering-manifest.json"

          encoded_parts: list[str] = []
          for index in range(8):
              path = f".github/control-engineering-bootstrap/part-{index:02d}"
              value = subprocess.run(
                  ["git", "show", f"{payload_commit}:{path}"],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              ).stdout.decode("ascii").strip()
              encoded_parts.append(value)
          archive = base64.b64decode("".join(encoded_parts), validate=True)
          if hashlib.sha256(archive).hexdigest() != expected_archive:
              raise SystemExit("clean_commit_archive_digest_mismatch")

          files: dict[str, bytes] = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              members = bundle.getmembers()
              names: list[str] = []
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      not member.isfile()
                      or path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or path.parts[0] == ".git"
                      or member.name.startswith(".github/control-engineering-bootstrap/")
                      or member.name == ".github/workflows/control-engineering-bootstrap.yml"
                  ):
                      raise SystemExit(f"clean_commit_unsafe_member:{member.name}")
                  names.append(member.name)
              if len(names) != len(set(names)) or manifest_name not in names:
                  raise SystemExit("clean_commit_member_set_invalid")
              manifest_handle = bundle.extractfile(manifest_name)
              if manifest_handle is None:
                  raise SystemExit("clean_commit_manifest_missing")
              manifest = json.loads(manifest_handle.read().decode("utf-8"))
              if manifest.get("schema") != "hepta.control-engineering-bootstrap.v1":
                  raise SystemExit("clean_commit_manifest_schema")
              rows = manifest.get("files")
              if not isinstance(rows, list) or len(rows) != 31:
                  raise SystemExit("clean_commit_manifest_files")
              expected_names = {manifest_name}
              for row in rows:
                  if not isinstance(row, dict) or not isinstance(row.get("path"), str):
                      raise SystemExit("clean_commit_manifest_row")
                  expected_names.add(str(row["path"]))
              if set(names) != expected_names:
                  raise SystemExit("clean_commit_member_manifest_mismatch")
              for row in rows:
                  path = str(row["path"])
                  handle = bundle.extractfile(path)
                  if handle is None:
                      raise SystemExit(f"clean_commit_file_missing:{path}")
                  value = handle.read()
                  if len(value) != int(row["bytes"]):
                      raise SystemExit(f"clean_commit_file_size:{path}")
                  if hashlib.sha256(value).hexdigest() != str(row["sha256"]):
                      raise SystemExit(f"clean_commit_file_digest:{path}")
                  files[path] = value

          required_workflows = {
              ".github/workflows/blocking-ci.yml",
              ".github/workflows/control-engineering-projection.yml",
              ".github/workflows/control-engineering-production-acceptance.yml",
          }
          if not required_workflows.issubset(files):
              raise SystemExit("clean_commit_workflows_missing")

          def api(method: str, path: str, payload: dict[str, object]) -> dict[str, object]:
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "hepta-control-engineering-clean-commit",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")[:4096]
                  raise SystemExit(f"github_git_data_api:{error.code}:{body}") from None

          tree_entries: list[dict[str, object]] = []
          blob_digests: dict[str, str] = {}
          for path in sorted(files):
              blob = api(
                  "POST",
                  f"/repos/{repository}/git/blobs",
                  {
                      "content": base64.b64encode(files[path]).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              sha = str(blob.get("sha", ""))
              if len(sha) != 40:
                  raise SystemExit(f"clean_commit_blob_sha:{path}")
              tree_entries.append({"path": path, "mode": "100644", "type": "blob", "sha": sha})
              blob_digests[path] = sha

          tree = api(
              "POST",
              f"/repos/{repository}/git/trees",
              {"base_tree": base_tree, "tree": tree_entries},
          )
          tree_sha = str(tree.get("sha", ""))
          if len(tree_sha) != 40:
              raise SystemExit("clean_commit_tree_sha")
          commit = api(
              "POST",
              f"/repos/{repository}/git/commits",
              {
                  "message": (
                      "control.engineering: close merge, quality, and production gates\n\n"
                      "Bind exact-blob observations to merge-commit delivery, add post-merge product gating, "
                      "durable worker identity renewal, clock/skew policy, incremental audit checkpoints, "
                      "capacity thresholds, quality and stress qualification, and fail-closed external provider adapters.\n\n"
                      "Independent semantic acceptance, deployment, HSM custody, external effects, merge authority, "
                      "runtime authority, release authority, and production_implementation remain false."
                  ),
                  "tree": tree_sha,
                  "parents": [base_commit],
              },
          )
          commit_sha = str(commit.get("sha", ""))
          if len(commit_sha) != 40:
              raise SystemExit("clean_commit_sha")
          receipt = {
              "schema": "hepta.control-engineering-clean-commit.v1",
              "archiveSha256": expected_archive,
              "baseCommit": base_commit,
              "baseTree": base_tree,
              "tree": tree_sha,
              "commit": commit_sha,
              "fileCount": len(files),
              "workflowCount": len(required_workflows),
              "blobDigests": blob_digests,
              "authorityGranted": False,
              "productionImplementation": False,
              "independentAcceptance": False,
              "deploymentAccepted": False,
              "releaseAuthority": False,
          }
          output = os.path.join(os.environ["RUNNER_TEMP"], "control-engineering-clean-commit.json")
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Retain clean commit receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-engineering-clean-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-engineering-clean-commit.json
          if-no-files-found: error
          retention-days: 30
