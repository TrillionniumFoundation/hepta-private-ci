name: Learning Artifacts Core Convergence

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/.learning-artifacts-core-patch/**
      - .github/workflows/hepta-learning-artifacts-core-convergence.yml

permissions:
  contents: write

concurrency:
  group: learning-artifacts-core-convergence
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Apply reviewed convergence patch
        run: |
          set -euo pipefail
          cat scripts/.learning-artifacts-core-patch/chunk* \
            | base64 -d \
            | gzip -d \
            > /tmp/learning-artifacts-core.patch
          git apply --whitespace=error-all /tmp/learning-artifacts-core.patch
          rm -rf scripts/.learning-artifacts-core-patch
          rm .github/workflows/hepta-learning-artifacts-core-convergence.yml
          rm -f qualification/reviewer-learning-artifacts-export.txt

      - name: Format exact package
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-learning-artifacts

      - name: Run owner regression suite
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-learning-artifacts --retries 0

      - name: Check every target
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-learning-artifacts --all-targets

      - name: Run strict Clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-learning-artifacts --all-targets -- -D warnings

      - name: Commit exact tested candidate
        env:
          TARGET_BRANCH: work/product-convergence-20260923
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "ProfHepta"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -s -m "fix(learning.artifacts): close current recovery and withdrawal invariants"

          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            (
              cd codex-rs
              cargo fmt -p codex-hepta-learning-artifacts -- --check
              just test --locked -p codex-hepta-learning-artifacts --retries 0
              cargo check --locked -p codex-hepta-learning-artifacts --all-targets
              cargo clippy --locked -p codex-hepta-learning-artifacts --all-targets -- -D warnings
            )
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            sleep 2
          done
          echo "branch kept advancing during all push attempts" >&2
          exit 1
