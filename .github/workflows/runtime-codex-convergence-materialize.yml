name: runtime.codex convergence materialization and verification
on:
  push:
    branches: [work/runtime-codex-convergence-20260928]
    paths: [.github/workflows/runtime-codex-convergence-materialize.yml]
permissions:
  contents: read
concurrency:
  group: runtime-codex-convergence-20260928
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Materialize reviewed changes without write credentials
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a11c9a68ca4c4510c64a6747959c4df903924a86 HEAD
          git fetch --no-tags origin 537950196b5d10258b9c9788a18ce6c7803575af
          git diff --binary b21add8523459a51af141bd151872181b20e9700 537950196b5d10258b9c9788a18ce6c7803575af | git apply --exclude='.github/workflows/runtime-codex-stage*-bootstrap.yml' --exclude='scripts/runtime_codex_stage*_bootstrap.py'
          for name in runtime_codex_stage2_identity_bootstrap.py runtime_codex_stage3_target_host_bootstrap.py; do
            git show "537950196b5d10258b9c9788a18ce6c7803575af:scripts/$name" > "scripts/$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          for name in ('runtime_codex_rejection_settlement_bootstrap.py', 'runtime_codex_stage2_identity_bootstrap.py', 'runtime_codex_stage3_target_host_bootstrap.py'):
              path = Path('scripts') / name
              old = 'return text[:first] + replacement + text[stop:]'
              new = 'return text[:first] + replacement + text[stop + len(end):]'
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit('unexpected transformer helper: ' + name)
              path.write_text(source.replace(old, new))
          PY
          python3 scripts/runtime_codex_rejection_settlement_bootstrap.py
          python3 scripts/runtime_codex_stage2_identity_bootstrap.py
          python3 scripts/runtime_codex_stage3_target_host_bootstrap.py
          python3 scripts/runtime_codex_convergence_patch.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-infer-core --package codex-hepta-agentd --package codex-hepta-infer-worker-host
          python3 -m unittest -v scripts.tests.test_runtime_codex_receipt_v2 scripts.tests.test_runtime_codex_target_host_evidence scripts.tests.test_runtime_codex_convergence
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          note = '\n\n## 2026-09-28 convergence\n\nRead [the current convergence contract](CONVERGENCE_2026-09-28.md). The native orchestration now lives in `codex-rs/hepta-infer-worker-host/src/native_execution.rs`. The exact Agentd CAS is irreversible; only ContextAttached may abort. Current native qualification remains pending until exact-source receipts pass. A structural target manifest is not producer authentication.\n'
          for name in ('TECHNICAL.md', 'REMEDIATION_STATUS.md'):
              path = Path('docs/modules/runtime.codex') / name
              path.write_text(path.read_text() + note)
          path = Path('docs/modules/runtime.codex/IMPLEMENTATION_MAP.json')
          value = json.loads(path.read_text())
          for row in value.get('productionCallerBindings', []):
              if row.get('symbol') == 'async fn run_once(':
                  row['path'] = 'codex-rs/hepta-infer-worker-host/src/native_execution.rs'
          value['repositoryControlledGaps'] = [
              'current exact-source and deterministic synthetic-merge native qualification must execute and pass',
              'full physical owner-RPC, partial-write and provider crash coverage is not proved by the 22-cut abstract model',
              'durable independent quarantine application and authenticated target-evidence producer verification remain open']
          subprocess.run(['git', 'add', '-A'], check=True)
          for row in value.get('sourceObjects', []):
              try:
                  row['object'] = subprocess.check_output(['git', 'rev-parse', ':' + row['path']], text=True).strip()
              except subprocess.CalledProcessError:
                  raise SystemExit('missing mapped source: ' + row['path'])
          path.write_text(json.dumps(value, indent=2) + '\n')
          PY
          git add -A
          git diff --cached --check
          mkdir -p "$RUNNER_TEMP/patch"
          git diff --cached --binary > "$RUNNER_TEMP/patch/source.patch"
          git diff --cached --name-only > "$RUNNER_TEMP/patch/paths.txt"
          git write-tree > "$RUNNER_TEMP/patch/tree.txt"
          printf '%s\n' '${{ github.sha }}' > "$RUNNER_TEMP/patch/parent.txt"
          sha256sum "$RUNNER_TEMP/patch/source.patch" > "$RUNNER_TEMP/patch/source.patch.sha256"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: runtime-codex-materialized-patch
          path: ${{ runner.temp }}/patch/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.publish.outputs.source }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-codex-materialized-patch
          path: ${{ runner.temp }}/patch
      - name: Publish exact bounded patch; never execute candidate code here
        id: publish
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/patch/parent.txt")" = "$EXPECTED"
          test "$(git ls-remote origin refs/heads/work/runtime-codex-convergence-20260928 | cut -f1)" = "$EXPECTED"
          git apply --index "$RUNNER_TEMP/patch/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/patch/tree.txt")"
          python3 - <<'PY'
          import subprocess
          allowed = ('codex-rs/hepta-agentd/', 'codex-rs/hepta-infer-core/', 'codex-rs/hepta-infer-worker-host/', 'docs/modules/runtime.codex/', 'scripts/runtime_codex_', 'scripts/tests/test_runtime_codex_', '.github/workflows/runtime-codex-')
          for path in subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines():
              if path != '.github/workflows/blocking-ci.yml' and not path.startswith(allowed):
                  raise SystemExit('out-of-scope publication: ' + path)
          PY
          git diff --cached --check
          git config user.name 'runtime.codex automation'
          git config user.email 'runtime-codex@users.noreply.github.com'
          git commit -m 'fix(runtime.codex): converge exact owner fence, recovery, identity and evidence' -m 'Materialize reviewed source; keep external target-host, durable quarantine service and independent acceptance gates open. No production activation or release.'
          git push origin HEAD:refs/heads/work/runtime-codex-convergence-20260928
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/published"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/published/source.tar.gz"
          git show -s --format=raw HEAD > "$RUNNER_TEMP/published/commit.txt"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: runtime-codex-published-source
          path: ${{ runner.temp }}/published/
          if-no-files-found: error
          retention-days: 14
  qualification:
    needs: publish
    name: runtime.codex convergence (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.publish.outputs.source }}
      BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
      HEPTA_CI_LANE: ${{ matrix.lane }}
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct exact source or deterministic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ "$HEPTA_CI_LANE" = base-merge ]; then
            tree=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME='runtime.codex qualification' GIT_AUTHOR_EMAIL='noreply@openai.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' GIT_COMMITTER_DATE='2000-01-01T00:00:00Z'
            commit=$(printf '%s\n' 'runtime.codex deterministic synthetic merge' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$commit"
          fi
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/runtime-codex" >> "$GITHUB_ENV"
          echo "RECORDS=$RUNNER_TEMP/runtime-codex/records" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/runtime-codex/records"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: ./.github/actions/setup-ci
      - name: Native prerequisites
        run: sudo apt-get update -y && sudo apt-get install -y build-essential pkg-config libcap-dev
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-unknown-linux-gnu
      - name: Verifier regressions
        run: python3 -m unittest -v scripts.tests.test_runtime_codex_receipt_v2 scripts.tests.test_runtime_codex_target_host_evidence scripts.tests.test_runtime_codex_convergence
      - name: Execute native command plan
        working-directory: codex-rs
        run: python3 ../scripts/runtime_codex_receipt_v2.py execute --records "$RECORDS"
      - name: Build exact-candidate receipt including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECORDS"
          args=(--source "$SOURCE_SHA" --lane "$HEPTA_CI_LANE" --records "$RECORDS" --output "$EVIDENCE/receipt.json")
          if [ "$HEPTA_CI_LANE" = base-merge ]; then args+=(--base "$BASE_SHA"); fi
          python3 scripts/runtime_codex_receipt_v2.py build "${args[@]}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: runtime-codex-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-codex/
          if-no-files-found: error
          retention-days: 30
  attest:
    needs: qualification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-codex-${{ matrix.lane }}-${{ github.run_id }}
          path: evidence
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        id: signature
        with:
          subject-path: evidence/receipt.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: runtime-codex-signature-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ steps.signature.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
