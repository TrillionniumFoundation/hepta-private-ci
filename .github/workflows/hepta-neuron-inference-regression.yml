name: Hepta bounded Neuron inference regression

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-neuron/**'
      - 'codex-rs/hepta-infer-core/**'
      - 'codex-rs/hepta-infer-worker-host/python/**'
      - '.github/workflows/hepta-neuron-inference-regression.yml'
  push:
    branches: [main]
    paths:
      - 'codex-rs/hepta-neuron/**'
      - 'codex-rs/hepta-infer-core/**'
      - 'codex-rs/hepta-infer-worker-host/python/**'
      - '.github/workflows/hepta-neuron-inference-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-neuron-inference-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  regression:
    name: Bounded regression (${{ matrix.lane }}, ${{ matrix.package }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
        package: [codex-hepta-infer-core, codex-hepta-neuron]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct immutable merge candidate
        id: merge
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Bind exact tested tree
        env:
          TESTED: ${{ steps.merge.outputs.sha || env.SOURCE_SHA }}
          LANE: ${{ matrix.lane }}
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED"
          mkdir -p "$RUNNER_TEMP/bounded-regression"
          printf 'source=%s\nbase=%s\ntested=%s\ntree=%s\nlane=%s\npackage=%s\n' "$SOURCE_SHA" "$BASE_SHA" "$TESTED" "$(git rev-parse HEAD^{tree})" "$LANE" "$PACKAGE" > "$RUNNER_TEMP/bounded-regression/identity.txt"
          git diff --check
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Check Python driver contracts (not real-model efficacy)
        id: contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s codex-rs/hepta-infer-worker-host/python -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/bounded-regression/contracts.log"
      - name: Check native package formatting
        id: format
        if: ${{ !cancelled() }}
        env:
          PACKAGE: ${{ matrix.package }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p "$PACKAGE" -- --check 2>&1 | tee "$RUNNER_TEMP/bounded-regression/format.log"
      - name: Test native package even when formatting fails
        id: native
        if: ${{ !cancelled() }}
        env:
          PACKAGE: ${{ matrix.package }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rm -f target/nextest/local/junit.xml
          trap 'if test -f target/nextest/local/junit.xml; then cp target/nextest/local/junit.xml "$RUNNER_TEMP/bounded-regression/native.xml"; fi' EXIT
          just test --locked --lib -p "$PACKAGE" --retries 0 --test-threads=1 2>&1 | tee "$RUNNER_TEMP/bounded-regression/native.log"
          python3 -c 'import xml.etree.ElementTree as E; r=E.parse("target/nextest/local/junit.xml").getroot(); assert len(list(r.iter("testcase"))) > 0, "no native tests observed"'
      - name: Strict native package lint
        id: lint
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        env:
          PACKAGE: ${{ matrix.package }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p "$PACKAGE" --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/bounded-regression/clippy.log"
      - name: Preserve tracked source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Record observed step outcomes
        if: ${{ always() }}
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          LINT: ${{ steps.lint.outcome }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bounded-regression"
          printf 'contracts=%s\nformat=%s\nnative=%s\nlint=%s\nproduction=false\nreal_model=false\n' "$CONTRACTS" "$FORMAT" "$NATIVE" "$LINT" > "$RUNNER_TEMP/bounded-regression/outcomes.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: bounded-${{ matrix.package }}-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/bounded-regression/
          retention-days: 14
          if-no-files-found: error
