name: Windows token memory AccessCheck
on:
  push:
    branches: [dot/windows-token-memory-accesscheck-v2-20261006]
permissions:
  contents: read
concurrency:
  group: windows-token-memory-accesscheck-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  memory-accesscheck:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact parent and two-file scope
        shell: pwsh
        run: |
          $env:PROBE_EVIDENCE = Join-Path $env:RUNNER_TEMP 'windows-token-memory-accesscheck'
          "PROBE_EVIDENCE=$env:PROBE_EVIDENCE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path $env:PROBE_EVIDENCE | Out-Null
          @'
          import hashlib, json, os, pathlib, subprocess
          base = '66f0ba01bb444a245001d7d1fd21121fc8c01206'
          expected_cpp_blob = '26ec6c223187560d7b921fb68b4b6fa66f648b3d'
          cpp = 'scripts/windows_token_accesscheck_probe.cpp'
          allowed = ['.github/workflows/windows-token-memory-accesscheck.yml', 'scripts/windows_token_accesscheck_probe.cpp']
          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args], text=True).strip()
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA']
          headers = git('cat-file', 'commit', head).split('\n\n', 1)[0].splitlines()
          parents = [line[7:] for line in headers if line.startswith('parent ')]
          trees = [line[5:] for line in headers if line.startswith('tree ')]
          assert parents == [base] and len(trees) == 1
          assert git('rev-parse', 'HEAD^{tree}') == trees[0]
          assert git('status', '--porcelain', '--untracked-files=normal') == ''
          assert git('rev-parse', f'{head}:{cpp}') == expected_cpp_blob
          assert git('hash-object', '--path', cpp, cpp) == expected_cpp_blob
          changed = sorted(git('diff', '--name-only', base, 'HEAD').splitlines())
          assert changed == sorted(allowed), changed
          assert sorted(git('diff', '--name-only', '--diff-filter=A', base, 'HEAD').splitlines()) == sorted(allowed)
          receipt = {'head': head, 'tree': trees[0], 'parents': parents, 'base': base, 'cpp_blob': expected_cpp_blob, 'changed': changed,
                     'files': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in allowed}}
          (pathlib.Path(os.environ['PROBE_EVIDENCE']) / 'source-before.json').write_text(json.dumps(receipt, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and execute temporary in-memory probe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $evidence = $env:PROBE_EVIDENCE
          $source = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows_token_accesscheck_probe.cpp'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere)) { throw 'Existing Visual Studio locator missing' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'Existing MSVC installation missing' }
          $developer = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          if (!(Test-Path -LiteralPath $developer)) { throw 'Existing MSVC environment script missing' }
          @"
          @echo off
          call "$developer" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc "$source" /Fe:"$evidence\probe.exe" /Fo:"$evidence\probe.obj" /link advapi32.lib
          exit /b %errorlevel%
          "@ | Set-Content -Path "$evidence\compile.cmd" -Encoding ascii
          Push-Location -LiteralPath $evidence
          try {
            & cmd.exe /d /c "$evidence\compile.cmd" *> "$evidence\compile.log"
            $compileCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          Remove-Item -LiteralPath "$evidence\compile.cmd" -Force
          if ($compileCode -ne 0) { exit $compileCode }
          & "$evidence\probe.exe" 1> "$evidence\matrix.jsonl" 2> "$evidence\stderr.log"
          $probeCode = $LASTEXITCODE
          Set-Content -Path "$evidence\probe-exit.txt" -Value $probeCode -Encoding ascii
          exit $probeCode
      - name: Preserve bounded evidence and exact source
        if: always()
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['PROBE_EVIDENCE'])
          out.mkdir(exist_ok=True)
          before = json.loads((out / 'source-before.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args], text=True).strip()
          head = git('rev-parse', 'HEAD')
          headers = git('cat-file', 'commit', head).split('\n\n', 1)[0].splitlines()
          parents = [line[7:] for line in headers if line.startswith('parent ')]
          trees = [line[5:] for line in headers if line.startswith('tree ')]
          cpp = 'scripts/windows_token_accesscheck_probe.cpp'
          after = {'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'), 'parents': parents, 'raw_trees': trees,
                   'cpp_blob': git('rev-parse', f'{head}:{cpp}'), 'worktree_cpp_blob': git('hash-object', '--path', cpp, cpp),
                   'changed': sorted(git('diff', '--name-only', before['base'], head).splitlines()),
                   'added': sorted(git('diff', '--name-only', '--diff-filter=A', before['base'], head).splitlines()),
                   'clean': git('status', '--porcelain', '--untracked-files=normal') == '',
                   'files': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in before['files']}}
          (out / 'source-after.json').write_text(json.dumps(after, indent=2))
          source_ok = (after['head'] == before['head'] == os.environ['GITHUB_SHA'] and after['tree'] == before['tree']
                       and parents == before['parents'] == ['66f0ba01bb444a245001d7d1fd21121fc8c01206'] and trees == [before['tree']]
                       and after['cpp_blob'] == after['worktree_cpp_blob'] == before['cpp_blob'] == '26ec6c223187560d7b921fb68b4b6fa66f648b3d'
                       and after['changed'] == after['added'] == sorted(before['changed'])
                       and after['clean'] and after['files'] == before['files'])
          # Preserve bounded partial evidence even when compilation or a control fails.
          limits = {'compile.log': 65536, 'matrix.jsonl': 131072, 'stderr.log': 16384}
          truncation = {}
          for name, limit in limits.items():
              p = out / name
              if p.exists() and p.stat().st_size > limit:
                  truncation[name] = p.stat().st_size
                  with p.open('rb') as stream: data = stream.read(limit)
                  p.write_bytes(data)
          (out / 'capture.json').write_text(json.dumps({'truncated': truncation, 'source_ok': source_ok}))
          qualified = False
          try:
              rows = [json.loads(line) for line in (out / 'matrix.jsonl').read_text(encoding='utf-8-sig').splitlines()]
              accesses = [r for r in rows if r.get('kind') == 'access']
              tokens = {'base', 'privileges_disabled', 'write_cap_only', 'full_cap_only', 'full_cap_user', 'full_cap_logon', 'full_cap_world', 'write_cap_identities', 'full_cap_identities'}
              descriptors = {'world_ambient', 'user_ambient', 'logon_ambient', 'other_account_only', 'world_plus_cap_read', 'world_plus_cap_write', 'world_plus_cap_all', 'world_plus_unrelated_cap', 'other_account_plus_cap'}
              rights = {'read_data': 1, 'write_data': 2, 'delete_object': 65536, 'delete_child': 64}
              assert len(accesses) == 324
              assert {(r['token'], r['descriptor'], r['right']) for r in accesses} == {(t, d, r) for t in tokens for d in descriptors for r in rights}
              assert len(rows) == 326
              assert rows[0] == {'schema': 1, 'kind': 'scope', 'identity': 'current_ci_account', 'real_dedicated_account': False, 'host_security_mutation': False}
              for row in accesses:
                  assert set(row) == {'kind', 'token', 'descriptor', 'right', 'allowed', 'granted', 'controlled', 'expected'}
                  assert type(row['allowed']) is bool and type(row['controlled']) is bool
                  assert type(row['granted']) is int and 0 <= row['granted'] <= 4294967295
                  if row['allowed']: assert row['granted'] & rights[row['right']] == rights[row['right']]
                  controlled = row['token'] in {'base', 'privileges_disabled', 'full_cap_only'}
                  assert row['controlled'] == controlled
                  ordinary = row['descriptor'] not in {'other_account_only', 'other_account_plus_cap'}
                  cap_grants = row['descriptor'] == 'world_plus_cap_all' or (row['descriptor'] == 'world_plus_cap_read' and row['right'] == 'read_data') or (row['descriptor'] == 'world_plus_cap_write' and row['right'] != 'read_data')
                  expected = ordinary and (row['token'] != 'full_cap_only' or cap_grants)
                  assert row['expected'] is (expected if controlled else None)
                  if controlled: assert row['allowed'] == expected
              assert rows[-1] == {'kind': 'summary', 'observations': 324, 'control_mismatches': 0, 'valid': True, 'backend_qualified': False}
              assert int((out / 'probe-exit.txt').read_text()) == 0
              assert source_ok and not truncation
              qualified = True
          except (AssertionError, KeyError, ValueError, OSError, TypeError, AttributeError, IndexError):
              pass
          (out / 'qualification.json').write_text(json.dumps({'memory_experiment_valid': qualified, 'backend_qualified': False}))
          retained = ['source-before.json', 'source-after.json', 'compile.log', 'matrix.jsonl', 'stderr.log', 'probe-exit.txt', 'capture.json', 'qualification.json']
          records = {}
          for name in retained:
              p = out / name
              if p.exists():
                  data = p.read_bytes()
                  records[name] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          (out / 'manifest.json').write_text(json.dumps(records, indent=2))
          assert qualified, 'Memory experiment incomplete or controls failed; inspect retained evidence'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-token-memory-accesscheck
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.PROBE_EVIDENCE }}/source-before.json
            ${{ env.PROBE_EVIDENCE }}/source-after.json
            ${{ env.PROBE_EVIDENCE }}/compile.log
            ${{ env.PROBE_EVIDENCE }}/matrix.jsonl
            ${{ env.PROBE_EVIDENCE }}/stderr.log
            ${{ env.PROBE_EVIDENCE }}/probe-exit.txt
            ${{ env.PROBE_EVIDENCE }}/capture.json
            ${{ env.PROBE_EVIDENCE }}/qualification.json
            ${{ env.PROBE_EVIDENCE }}/manifest.json
