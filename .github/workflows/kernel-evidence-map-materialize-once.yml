name: Kernel evidence map materialize once

on:
  push:
    branches:
      - codex/kernel-evidence-final-closure-20260930

permissions:
  contents: write

concurrency:
  group: kernel-evidence-map-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[kernel-evidence-map-materialize-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 974c48fbe8fd994328e2a13089bed730729367e4
      TARGET_BRANCH: codex/kernel-evidence-final-closure-20260930
      WORKFLOW_PATH: .github/workflows/kernel-evidence-map-materialize-once.yml
    steps:
      - name: Check out exact one-shot request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Admit only the exact parent and marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git log -1 --format=%B | grep -Fq '[kernel-evidence-map-materialize-once]'
          test -f "$WORKFLOW_PATH"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Materialize the kernel.evidence implementation map
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module kernel.evidence
          git diff --check
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('docs/modules/kernel.evidence/IMPLEMENTATION_MAP.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          expected_commit = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          expected_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          if value.get('module') != 'kernel.evidence':
              raise SystemExit('implementation map module identity changed')
          if value.get('sourceBase') != {
              'commit': expected_commit,
              'tree': expected_tree,
          }:
              raise SystemExit('implementation map is not bound to the exact materialization source')
          PY
          changed="$(git diff --name-only)"
          test "$changed" = 'docs/modules/kernel.evidence/IMPLEMENTATION_MAP.json'

      - name: Commit the map and self-delete the materializer
        shell: bash
        run: |
          set -euo pipefail
          rm "$WORKFLOW_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/modules/kernel.evidence/IMPLEMENTATION_MAP.json "$WORKFLOW_PATH"
          git commit -s -m 'docs(kernel.evidence): bind converged implementation map'
          test -z "$(git status --porcelain --untracked-files=normal)"
          git fetch origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse FETCH_HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
