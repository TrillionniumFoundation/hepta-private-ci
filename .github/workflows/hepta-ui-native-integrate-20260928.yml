name: ui.native exact candidate preparation 20260928
on:
  push:
    branches: [work/ui-native-qualified-integration-20260928]
    paths:
      - scripts/hepta_ui_native_integrate_20260928.py
      - apps/hepta-native/tools/canonicalize_source_objects_once.py
      - .github/workflows/hepta-ui-native-integrate-20260928.yml
permissions:
  contents: read
concurrency:
  group: ui-native-prepare-${{ github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/work/ui-native-qualified-integration-20260928'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      INPUT_SHA: ${{ github.sha }}
      HEPTA_UI_NATIVE_WRITE_BRANCH: work/ui-native-qualified-integration-20260928
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject an obsolete queued preparation before changing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url='https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/git/ref/heads/work/ui-native-qualified-integration-20260928'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response:
              current=json.load(response)['object']['sha']
          if current != os.environ['INPUT_SHA']:
              raise SystemExit('obsolete preparation input; no source changed and no qualification claimed')
          PY
      - name: Apply exact-preimage source edits on immutable input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INPUT_SHA"
          git merge-base --is-ancestor c84e0c760563ff0f8e67ab2208baf57bbe44ae44 HEAD
          git config user.name ui-native-candidate
          git config user.email ui-native-candidate@users.noreply.github.com
          python3 scripts/hepta_ui_native_integrate_20260928.py
          python3 apps/hepta-native/tools/canonicalize_source_objects_once.py
      - name: Format and exercise the actual standalone worker implementation
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-native-gateway -p codex-hepta-contracts -p codex-hepta-private-state
          mkdir -p "$RUNNER_TEMP/native-prepare"
          rustc +1.95.0 --edition=2024 --test apps/hepta-native/src/ui/task_supervisor.rs -o "$RUNNER_TEMP/native-prepare/worker-tests"
          "$RUNNER_TEMP/native-prepare/worker-tests" --nocapture 2>&1 | tee "$RUNNER_TEMP/native-prepare/worker-tests.log"
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_hepta_ui_native_*.py' -v 2>&1 | tee "$RUNNER_TEMP/native-prepare/python-tests.log"
          git add -- apps/hepta-native codex-rs/hepta-native-gateway codex-rs/hepta-contracts codex-rs/hepta-private-state docs/modules/ui.native docs/modules/kernel.authority/TECHNICAL.md scripts/test_hepta_ui_native_source.py scripts/hepta_ui_native_integrate_20260928.py .github/workflows/hepta-ui-native-integrate-20260928.yml .github/workflows/hepta-ui-native-remediation.yml .github/workflows/hepta-ui-native-remediation-format.yml
          git diff --cached --check
          git commit -m 'fix(ui.native): materialize cancellable lock waits and immutable retirement receipts'
      - name: Commit inventory before observing the complete app root
        run: |
          set -euo pipefail
          python3 apps/hepta-native/tools/prepare_current_source.py --write-fingerprints
          git add apps/hepta-native/CURRENT_SOURCE.json
          git commit -m 'docs(ui.native): freeze canonical source inventory'
          python3 scripts/hepta-implementation-maps.py migrate --module kernel.authority --module intelligence.control --module learning.plasticity --module utility.ndu
          python3 - <<'PY'
          import json, pathlib, subprocess
          for module in ('kernel.authority','intelligence.control','learning.plasticity','utility.ndu'):
              path=f'docs/modules/{module}/IMPLEMENTATION_MAP.json'
              before=json.loads(subprocess.check_output(['git','show',f'HEAD:{path}']))
              after=json.loads(pathlib.Path(path).read_text())
              changed={key for key in before.keys() | after.keys() if before.get(key) != after.get(key)}
              if changed - {'sourceBase','sourceObjects','observedAtHead'}:
                  raise SystemExit(f'{module}: dependency rebind attempted a non-identity change')
              if before.get('claimBoundary') != after.get('claimBoundary') or before.get('productionImplementation') != after.get('productionImplementation'):
                  raise SystemExit(f'{module}: dependency rebind altered execution authority')
          PY
          python3 scripts/hepta-implementation-maps.py sync-plasticity-status
          python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          python3 scripts/hepta-module-docs.py refresh-derived
          python3 scripts/hepta-module-docs.py refresh-indexes
          git add -- docs/modules/kernel.authority/IMPLEMENTATION_MAP.json docs/modules/intelligence.control/IMPLEMENTATION_MAP.json docs/modules/learning.plasticity/IMPLEMENTATION_MAP.json docs/modules/learning.plasticity/CURRENT_IMPLEMENTATION.md docs/modules/learning.plasticity/CURRENT_STATE.json docs/modules/utility.ndu/IMPLEMENTATION_MAP.json docs/modules/ui.native/IMPLEMENTATION_MAP.json docs/modules/MODULE_DOCS.json docs/modules/SOURCE_BINDINGS.json qualification/module-execution-dossiers/DETAILS.json qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          git diff --cached --check
          git commit -m 'docs(ui.native): bind complete source and repair inherited dependency navigation'
          python3 apps/hepta-native/tools/prepare_current_source.py
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-module-docs.py refresh-indexes --check
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
          test -z "$(git status --porcelain)"
      - name: Assert the complete publication scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          roots=('apps/hepta-native/', 'codex-rs/hepta-native-gateway/', 'codex-rs/hepta-contracts/', 'codex-rs/hepta-private-state/', 'docs/modules/ui.native/')
          allowed={'docs/modules/kernel.authority/TECHNICAL.md','docs/modules/kernel.authority/IMPLEMENTATION_MAP.json','docs/modules/intelligence.control/IMPLEMENTATION_MAP.json','docs/modules/learning.plasticity/IMPLEMENTATION_MAP.json','docs/modules/learning.plasticity/CURRENT_IMPLEMENTATION.md','docs/modules/learning.plasticity/CURRENT_STATE.json','docs/modules/utility.ndu/IMPLEMENTATION_MAP.json','docs/modules/MODULE_DOCS.json','docs/modules/SOURCE_BINDINGS.json','qualification/module-execution-dossiers/DETAILS.json','qualification/module-execution-dossiers/NATIVE_BINDINGS.json','scripts/test_hepta_ui_native_source.py','scripts/hepta_ui_native_integrate_20260928.py','.github/workflows/hepta-ui-native-integrate-20260928.yml','.github/workflows/hepta-ui-native-remediation.yml','.github/workflows/hepta-ui-native-remediation-format.yml'}
          names=subprocess.check_output(['git','diff','--name-only','-z',os.environ['INPUT_SHA'],'HEAD']).decode().split('\0')
          if any(p and not (p.startswith(roots) or p in allowed) for p in names):
              raise SystemExit('refusing publication outside the authorized native scope')
          PY
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/native-prepare/candidate.txt"
          git diff --stat "$INPUT_SHA" HEAD > "$RUNNER_TEMP/native-prepare/changes.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/native-prepare/source.tar.gz"
      - name: Non-forcing publication to the same candidate and exact qualification request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=work/ui-native-qualified-integration-20260928
          git remote set-url origin https://github.com/TrillionniumFoundation/hepta-private-ci.git
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote=$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote --exit-code origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$INPUT_SHA"
          git -c http.followRedirects=false -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          python3 - <<'PY'
          import json, os, urllib.request
          endpoint='https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/workflows/hepta-ui-native-remediation.yml/dispatches'
          body=json.dumps({'ref':'work/ui-native-qualified-integration-20260928'}).encode()
          request=urllib.request.Request(endpoint,data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              if response.status != 204: raise SystemExit('qualification dispatch not accepted')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-native-preparation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-prepare
          if-no-files-found: warn
          retention-days: 7
