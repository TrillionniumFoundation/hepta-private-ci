name: one-shot context.compiler settlement transport

on:
  push:
    branches:
      - work/context-compiler-settlement-transport-20260930

permissions:
  contents: write

concurrency:
  group: context-compiler-settlement-transport
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out immutable transport bundle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helper
          persist-credentials: false

      - name: Check out exact context.compiler candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/context-compiler-v3-closure-20260928
          path: target
          fetch-depth: 0

      - name: Reconstruct and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=c2d044272bcf106f6fd9e5aa40656cdc7069a702
          actual_parent="$(git -C target rev-parse HEAD)"
          test "$actual_parent" = "$expected_parent"
          cat helper/.github/context-compiler-transport/context-full.patch.gz.part* > "$RUNNER_TEMP/context-full.patch.gz"
          echo '69044db597081ef36ae1d2e4dbbf191debc2c03d0155dc41d34ad0816fbd69d6  '"$RUNNER_TEMP/context-full.patch.gz" | sha256sum --check
          gzip -t "$RUNNER_TEMP/context-full.patch.gz"
          gzip -dc "$RUNNER_TEMP/context-full.patch.gz" > "$RUNNER_TEMP/context-full.patch"
          git -C target apply --check --whitespace=error-all "$RUNNER_TEMP/context-full.patch"
          git -C target apply --index --whitespace=error-all "$RUNNER_TEMP/context-full.patch"
          git -C target diff --cached --check

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcap-dev pkg-config ca-certificates git

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt

      - name: Verify generated truth and Python regressions
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/generate_context_compiler_module_docs.py --check
          python3 -B -m unittest discover -s scripts -p 'test_context_compiler_*.py' -v
          python3 -m py_compile scripts/context_compiler_execution.py scripts/generate_context_compiler_module_docs.py

      - name: Verify Rust formatting, owner regressions, and strict lint
        working-directory: target/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p codex-hepta-agentd exact_context_delivery --no-fail-fast
          cargo clippy --locked -p codex-hepta-agentd --all-targets -- -D warnings

      - name: Commit verified candidate to isolated ready branch
        working-directory: target
        shell: bash
        env:
          READY_BRANCH: work/context-compiler-settlement-ready-20260930
        run: |
          set -euo pipefail
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'context.compiler transport'
          git config user.email 'context-compiler-transport@users.noreply.github.com'
          git commit -m 'context.compiler: settle final history and harden product owner'
          candidate="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${READY_BRANCH}"
          printf 'verified_candidate=%s\n' "$candidate" >> "$GITHUB_STEP_SUMMARY"
