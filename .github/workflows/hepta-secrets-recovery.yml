name: Secrets serializable recovery implementation

on:
  push:
    branches: [codex/secrets-heptabao-convergence]
    paths:
      - .hepta-bootstrap/secrets-recovery/**
      - .github/workflows/hepta-secrets-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-serializable-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out the exact requested candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply source changes and synchronize projections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/recovery
          if test -f .hepta-bootstrap/secrets-recovery/apply.py; then
            python3 .hepta-bootstrap/secrets-recovery/apply.py
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/modules/secrets.heptabao/MODULE_MANIFEST_V1.json')
          m = json.loads(p.read_text())
          for anchor in m['sourceAnchors']:
              if anchor['path'].endswith('final_use_host.rs'):
                  anchor['mustContain'] = [s.replace('reservation_by_operation', 'seal_unreserved_operation') for s in anchor['mustContain']]
          p.write_text(json.dumps(m, indent=2) + '\n')
          PY
            python3 scripts/generate_secrets_heptabao_module.py --write
            python3 scripts/generate_secrets_heptabao_module.py
            rm -rf .hepta-bootstrap/secrets-recovery
          fi
          git diff --check
      - name: Install the repository Rust toolchain and formatter
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus
      - name: Commit plain sources without claiming native qualification
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git add codex-rs/hepta-authbus codex-rs/hepta-bao-adapter/src docs/modules/secrets.heptabao docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json qualification/module-execution-dossiers .hepta-bootstrap/secrets-recovery
          git diff --cached --check
          git config user.name 'Hepta recovery implementation'
          git config user.email 'hepta-recovery@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(secrets): serialize negative admission recovery with late reservation commits'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat HEAD > .hepta-evidence/recovery/source.txt
      - name: Install repository test runners
        shell: bash
        run: cargo install --locked just cargo-nextest
      - name: Execute independent native tests and strict lint
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          out = Path('.hepta-evidence/recovery')
          checks = [
              ('docs', ['python3', 'scripts/generate_secrets_heptabao_module.py']),
              ('tests', ['just', 'test', '--locked', '-p', 'codex-hepta-bao-adapter', '-p', 'codex-hepta-authbus', '-p', 'codex-state-sqlite']),
              ('clippy', ['cargo', 'clippy', '--manifest-path', 'codex-rs/Cargo.toml', '--locked', '-p', 'codex-hepta-bao-adapter', '-p', 'codex-hepta-authbus', '--all-targets', '--', '-D', 'warnings']),
          ]
          rows = []
          for name, command in checks:
              log = out / (name + '.log')
              with log.open('wb') as stream:
                  try:
                      result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, timeout=2700, check=False)
                      code = result.returncode
                  except (OSError, subprocess.TimeoutExpired) as error:
                      stream.write(str(error).encode())
                      code = 124
              rows.append({'name': name, 'command': command, 'exitCode': code, 'logSha256': hashlib.sha256(log.read_bytes()).hexdigest()})
          git = lambda *a: subprocess.check_output(['git', *a], text=True).strip()
          clean = git('rev-parse', 'HEAD') == os.environ['SOURCE_SHA'] and not git('status', '--porcelain', '--untracked-files=no')
          receipt = {'schema': 'hepta.secrets-recovery-feedback.v1', 'sourceCommitSha': git('rev-parse','HEAD'), 'sourceTreeSha': git('rev-parse','HEAD^{tree}'), 'identityClean': clean, 'os': platform.platform(), 'architecture': platform.machine(), 'dependencyLockSha256': hashlib.sha256(Path('codex-rs/Cargo.lock').read_bytes()).hexdigest(), 'checks': rows, 'passed': clean and all(r['exitCode'] == 0 for r in rows), 'providerDynamicE2E': False, 'productionActivation': False, 'independentAcceptance': False}
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          raise SystemExit(0 if receipt['passed'] else 1)
          PY
      - name: Retain actual source and all available diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-recovery-${{ github.sha }}
          path: .hepta-evidence/recovery
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
