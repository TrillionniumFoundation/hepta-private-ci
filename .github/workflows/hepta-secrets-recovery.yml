name: Secrets serializable recovery verification

on:
  push:
    branches:
      - codex/secrets-heptabao-convergence
      - codex/secrets-heptabao-final-hardening-20260928
    paths:
      - codex-rs/hepta-authbus/**
      - codex-rs/hepta-bao-adapter/**
      - docs/modules/secrets.heptabao/**
      - docs/lane-a-foundation/secrets.heptabao/**
      - docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json
      - scripts/generate_secrets_heptabao_module.py
      - .github/workflows/hepta-secrets-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-recovery-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-receipts:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source projections and non-native tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/recovery-python
          python3 scripts/generate_secrets_heptabao_module.py
          python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*attestation.py' -v 2>&1 | tee .hepta-evidence/recovery-python/attestation.log
          python3 codex-rs/hepta-bao-adapter/qa/test_receipt_validation.py -v 2>&1 | tee .hepta-evidence/recovery-python/receipts.log
          python3 codex-rs/hepta-bao-adapter/qa/test_admission_fence_sqlite.py -v 2>&1 | tee .hepta-evidence/recovery-python/sqlite.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secrets-recovery-python-${{ github.sha }}
          path: .hepta-evidence/recovery-python
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native:
    runs-on: ubuntu-slim
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src
      - name: Execute existing exact-source native qualification
        id: qualification
        continue-on-error: true
        run: python3 codex-rs/hepta-bao-adapter/qa/qualify.py --expected-sha "$GITHUB_SHA" --candidate-role source-head --output .hepta-evidence/recovery-native
      - name: Execute the new AuthBus recovery regressions independently
        id: recovery
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/recovery-native
          cd codex-rs
          cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2 2>&1 | tee ../.hepta-evidence/recovery-native/authbus-operation-recovery.log
      - name: Preserve failures from either native gate
        if: always()
        env:
          QUALIFICATION: ${{ steps.qualification.outcome }}
          RECOVERY: ${{ steps.recovery.outcome }}
        shell: bash
        run: test "$QUALIFICATION" = success && test "$RECOVERY" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secrets-recovery-native-${{ github.sha }}
          path: .hepta-evidence/recovery-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
