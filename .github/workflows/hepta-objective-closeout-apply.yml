name: Hepta objective source authoring

on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927
    paths:
      - .github/workflows/hepta-objective-closeout-apply.yml
      - scripts/.objective-closeout/**

# This narrowly scoped, temporary source-authoring job is NOT qualification.
# Read-only exact-candidate qualification is a separate existing workflow.
permissions:
  contents: write

env:
  SOURCE_SHA: ${{ github.sha }}
  TARGET_BRANCH: work/objective-compiler-production-convergence-20260927
  TMPDIR: /private/tmp

jobs:
  apply-source:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out exact source-authoring input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/objective-closeout"
          python3 - <<'PY'
          import gzip
          import hashlib
          import os
          from pathlib import Path
          parts = sorted(Path('scripts/.objective-closeout').glob('*.gzpart'))
          if [p.name for p in parts] != [f'{i:02d}.gzpart' for i in range(1, 23)]:
              raise SystemExit('incorrect source transport inventory')
          compressed = b''.join(p.read_bytes() for p in parts)
          if hashlib.sha256(compressed).hexdigest() != '550be3ed2098562570a8c3dd01e463653e90ae4e292fabfb9ce5c184438bf5d2':
              raise SystemExit('source transport digest mismatch')
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != '62a6f10cd5df199d510dd36bff22528f923fd375e14cc074b336177d531ddcf5':
              raise SystemExit('reviewed patch digest mismatch')
          Path(os.environ['RUNNER_TEMP'], 'objective-closeout', 'reviewed.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/objective-closeout/reviewed.patch"
          git apply --index "$RUNNER_TEMP/objective-closeout/reviewed.patch"
          # Workflow updates are published through the authorized connector,
          # not by granting the Actions token workflow administration rights.
          git restore --source="$SOURCE_SHA" --staged --worktree -- \
            .github/workflows/hepta-objective-exact-execution.yml \
            .github/workflows/hepta-objective-target-measurement.yml
      - name: Format native sources without relaxing the format gate
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-objective -p codex-hepta-learning-ledger \
            -p codex-hepta-intelligence -p codex-hepta-agentd
      - name: Verify recorder regressions and fail-closed declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            scripts.test_hepta_objective_target_measure \
            scripts.test_hepta_objective_evidence_project \
            scripts.test_hepta_objective_release_gate \
            scripts.test_hepta_objective_contracts \
            scripts.test_hepta_objective_qualify_exact \
            2>&1 | tee "$RUNNER_TEMP/objective-closeout/python-tests.log"
          python3 scripts/hepta-objective-current-state.py verify
          python3 scripts/hepta-objective-release-gate.py verify-source
          git diff --check
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          roots = ('codex-rs/hepta-objective/', 'codex-rs/hepta-learning-ledger/',
                   'codex-rs/hepta-intelligence/', 'codex-rs/hepta-agentd/',
                   'docs/modules/objective.compiler/')
          scripts = {'scripts/' + name for name in (
              'hepta-objective-target-measure.py', 'test_hepta_objective_target_measure.py',
              'hepta-objective-evidence-project.py', 'test_hepta_objective_evidence_project.py',
              'hepta-objective-release-gate.py', 'test_hepta_objective_release_gate.py',
              'hepta-objective-qualify-exact.py')}
          if not paths or any(not p.startswith(roots) and p not in scripts for p in paths):
              raise SystemExit('source authoring changed an out-of-scope path')
          if 'docs/modules/objective.compiler/CURRENT_STATE.json' in paths:
              raise SystemExit('source authoring must not promote static lifecycle declarations')
          subprocess.run(['git', 'add', '--', *sorted(paths)], check=True)
          PY
      - name: Publish source to the same branch with a no-force frontier check
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$observed" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(objective): persist versioned admission evidence and bind native measurements'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/objective-closeout/SOURCE_SHA"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/objective-closeout/SOURCE_TREE"
          git diff "$SOURCE_SHA" HEAD --binary > "$RUNNER_TEMP/objective-closeout/published.patch"
          git archive --format=tar.gz --output="$RUNNER_TEMP/objective-closeout/source.tar.gz" HEAD
          printf '%s\n' 'Source authoring only. Not independent, target-host, FFI, activation or release acceptance.' > "$RUNNER_TEMP/objective-closeout/SCOPE.txt"
      - name: Preserve the published source and authoring checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objective-closeout-source-${{ github.sha }}
          path: ${{ runner.temp }}/objective-closeout
          if-no-files-found: error
          retention-days: 3
      - name: Run native compiler and durable-proof regressions on published source
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-objective -p codex-hepta-learning-ledger --lib \
            2>&1 | tee "$RUNNER_TEMP/objective-closeout/native-focused.log"
      - name: Preserve native observations including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objective-closeout-native-${{ github.sha }}
          path: ${{ runner.temp }}/objective-closeout/native-focused.log
          if-no-files-found: warn
          retention-days: 3
