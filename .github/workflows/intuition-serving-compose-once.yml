name: Intuition serving composition once

on:
  push:
    branches:
      - codex/intuition-policy-production-closure-20260927
    paths:
      - ".github/workflows/intuition-serving-compose-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intuition-autoformat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intuition-policy-production-closure-20260927
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Apply deterministic serving patch
        run: |
          python3 scripts/intuition_finalize_branch.py
          python3 scripts/intuition_legacy_imports.py
      - name: Format product surfaces
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd
      - name: Compile authenticated product surfaces
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets
      - name: Strict Clippy for composed surfaces
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Test composed intuition surfaces
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence intuition_qualification
          cargo test --locked -p codex-hepta-agentd intuition_policy
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_product
      - name: Run authenticated V3 fast gate
        working-directory: codex-rs
        run: cargo run --locked --release -p codex-hepta-intelligence --example intuition_authenticated_fast_gate
      - name: Commit composed serving source
        run: |
          git config user.name "Hepta Intuition Integrator"
          git config user.email "hepta-intuition-ci@users.noreply.github.com"
          git add codex-rs/hepta-agentd codex-rs/hepta-intuition codex-rs/hepta-intelligence docs/modules/intuition.policy/TECHNICAL.md
          if ! git diff --cached --quiet; then
            git commit -m "feat(intuition): enforce authenticated product gate in Agentd serving"
            git push origin HEAD:codex/intuition-policy-production-closure-20260927
          fi
      - name: Rebind and verify exact implementation-map provenance
        run: |
          git pull --ff-only origin codex/intuition-policy-production-closure-20260927
          python3 scripts/hepta-implementation-maps.py migrate --module intuition.policy
          git add docs/modules/intuition.policy/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(intuition): bind composed source objects"
          fi
          python3 scripts/hepta-implementation-maps.py verify --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})"
          git push origin HEAD:codex/intuition-policy-production-closure-20260927

# Deliberate no-op trigger: the workflow first appeared on the preceding commit.
