name: Intuition serving composition once

on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths: [".github/workflows/intuition-serving-compose-once.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intuition-source-composition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose:
    # This is an explicit one-time source edit, never a qualification job.
    # No effect, policy activation, evaluator, operator or promotion authority.
    if: github.ref == 'refs/heads/codex/intuition-policy-production-closure-20260927'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source-sha: ${{ steps.commit.outputs.source-sha }}
    steps:
      - name: Check out the triggering source, never an advancing branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Materialize reviewed source and preserve existing technical design
        run: |
          set -euo pipefail
          python3 scripts/intuition_finalize_branch.py
          python3 scripts/intuition_legacy_imports.py
          (cd codex-rs && cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd)
          git diff --check
      - name: Commit actual source and provenance without overwriting concurrent work
        id: commit
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=codex/intuition-policy-production-closure-20260927
          observed=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$observed" = "$TRIGGER_SHA"
          git config user.name "Hepta Intuition Integrator"
          git config user.email "hepta-intuition-ci@users.noreply.github.com"
          git add codex-rs/hepta-agentd codex-rs/hepta-intuition codex-rs/hepta-intelligence docs/modules/intuition.policy/TECHNICAL.md
          if ! git diff --cached --quiet; then
            git commit -m "feat(intuition): materialize authenticated serving and bounded ledger reconciliation"
          fi
          python3 scripts/hepta-implementation-maps.py migrate --module intuition.policy
          git add docs/modules/intuition.policy/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(intuition): bind implementation map to composed source objects"
          fi
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$branch"
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/intuition-composed-source"
          git show --stat HEAD > "$RUNNER_TEMP/intuition-composed-source/commit.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/intuition-composed-source/identity.txt"
          git archive --format=tar HEAD codex-rs/hepta-agentd codex-rs/hepta-intuition codex-rs/hepta-intelligence codex-rs/hepta-learning-ledger codex-rs/hepta-types codex-rs/hepta-contracts codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/rust-toolchain.toml docs/modules/intuition.policy qualification/intuition.policy qualification/module-execution-dossiers/detail/intuition.policy.md scripts/intuition_qualify_exact.py > "$RUNNER_TEMP/intuition-composed-source/source.tar"
      - name: Retain actual committed source, not a prospective patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-composed-source-${{ steps.commit.outputs.source-sha }}
          path: ${{ runner.temp }}/intuition-composed-source/
          if-no-files-found: error
          retention-days: 30

  qualify-source:
    name: Read-only qualification of committed source
    needs: [compose]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.compose.outputs.source-sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Qualify only the now-committed source
        env:
          SOURCE_SHA: ${{ needs.compose.outputs.source-sha }}
        run: |
          python3 scripts/intuition_qualify_exact.py --evidence "$RUNNER_TEMP/intuition-exact" --expected-sha "$SOURCE_SHA" --source-sha "$SOURCE_SHA" --lane source-head
      - name: Retain actual execution results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-composed-exact-${{ needs.compose.outputs.source-sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-exact/
          if-no-files-found: error
          retention-days: 90
