name: Intuition serving composition once

on:
  push:
    branches:
      - codex/intuition-policy-production-hardening-20260926
    paths:
      - ".github/workflows/intuition-serving-compose-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intuition-serving-compose-once
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intuition-policy-production-hardening-20260926
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Compose authenticated intuition into canonical serving
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              file.write_text(text.replace(old, new, 1))

          lib = "codex-rs/hepta-agentd/src/lib.rs"
          replace_one(
              lib,
              "mod intuition_policy_service;\n",
              "mod intuition_policy_service;\nmod intuition_policy_serving;\n",
          )
          replace_one(
              lib,
              "pub use intelligence_ingress::AgentdIntelligenceInvocationV1;\n",
              "pub use intelligence_ingress::AgentdIntelligenceInvocationV1;\n"
              "pub use intelligence_ingress::AgentdIntuitionProductInvocationV1;\n",
          )

          state = "codex-rs/hepta-agentd/src/state.rs"
          replace_one(
              state,
              "        let invocation = provider.build(&self.identity, record)?;\n"
              "        invocation.validate(&self.identity, record)?;\n\n"
              "        // Freeze only the small immutable composition while holding the run\n",
              "        let invocation = provider.build(&self.identity, record)?;\n"
              "        invocation.validate(&self.identity, record)?;\n"
              "        let crate::AgentdIntelligenceInvocationV1 {\n"
              "            request,\n"
              "            inputs,\n"
              "            intuition_product,\n"
              "        } = invocation;\n"
              "        let episode_id = request.run_id.clone();\n"
              "        let run_snapshot_digest = request.snapshot.digest();\n"
              "        let intuition_request = inputs.intuition_request.clone();\n\n"
              "        // Freeze only the small immutable composition while holding the run\n",
          )
          replace_one(
              state,
              "            .prepare_for_composition(&composition, invocation.request, invocation.inputs)\n",
              "            .prepare_for_composition(&composition, request, inputs)\n",
          )
          replace_one(
              state,
              "            })?;\n\n"
              "        match outcome {\n",
              "            })?;\n\n"
              "        // The compatibility advisory stage is not a product decision. A\n"
              "        // configured product host must independently authenticate the\n"
              "        // current profile/runtime evidence and commit any selected Decision\n"
              "        // before the outcome can cross run admission.\n"
              "        let policy_now = self.require_current_run_start(record)?;\n"
              "        let _authenticated_intuition =\n"
              "            crate::intuition_policy_serving::authenticate_canonical_intuition(\n"
              "                self,\n"
              "                intuition_product,\n"
              "                intuition_request,\n"
              "                episode_id,\n"
              "                run_snapshot_digest,\n"
              "                &outcome,\n"
              "                policy_now,\n"
              "            )?;\n\n"
              "        match outcome {\n",
          )
          PY
      - name: Format product surfaces
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd
      - name: Compile authenticated product surfaces
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets
      - name: Test intuition and Agentd serving gate
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence intuition_qualification
          cargo test --locked -p codex-hepta-agentd intuition_policy_serving
      - name: Commit composed serving path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Intuition Integrator"
          git config user.email "hepta-intuition-ci@users.noreply.github.com"
          git add codex-rs/hepta-agentd/src/lib.rs codex-rs/hepta-agentd/src/state.rs codex-rs/hepta-agentd/src/intelligence_ingress.rs codex-rs/hepta-agentd/src/intuition_policy_serving.rs codex-rs/hepta-intuition codex-rs/hepta-intelligence
          if git diff --cached --quiet; then
            echo "No serving composition changes required"
            exit 0
          fi
          git commit -m "feat(intuition): enforce authenticated product gate in Agentd serving"
          git push origin HEAD:codex/intuition-policy-production-hardening-20260926
