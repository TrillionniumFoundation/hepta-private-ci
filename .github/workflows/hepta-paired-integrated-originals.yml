name: Compare hosted issuer with original cold consumer runs
on:
  push:
    branches: [research/paired-consumer-integrated-20261123]
    paths: ['qualification/paired-consumer-integrated-20261123/verify_native_fixture.py', '.github/workflows/hepta-paired-integrated-originals.yml']
permissions:
  contents: read
  actions: read
jobs:
  cross-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cell_experiments
            qualification/paired-consumer-integrated-20261123
            qualification/paired-consent-process-20261123
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 60347d4d1687147ddf7c1e12350711583dac5918
          path: fixture-source
          persist-credentials: false
          sparse-checkout: qualification/paired-consumer-use-20261123
      - name: Download and validate the ELF from the independent Cargo build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/14822539480/zip > "$RUNNER_TEMP/issuer.zip"
          echo "ead0eecdb45642e3e89ca7fc4d7e56c17d497b9d53f5121e04759543c1e8fcd2  $RUNNER_TEMP/issuer.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/issuer.zip" hepta-paired-consent > "$RUNNER_TEMP/issuer"
          chmod 700 "$RUNNER_TEMP/issuer"
      - name: Check original scopes, actual output bindings and private permissions
        run: |
          set -euo pipefail
          python3 qualification/paired-consent-process-20261123/test_statement.py "$RUNNER_TEMP/issuer"
          python3 qualification/paired-consumer-integrated-20261123/test_integrated_contract.py "$RUNNER_TEMP/issuer"
          python3 qualification/paired-consumer-integrated-20261123/verify_native_fixture.py "$RUNNER_TEMP/issuer" fixture-source/qualification/paired-consumer-use-20261123/CONSUMER_ENGINEERING_ORIGINALS.zip qualification/paired-consumer-integrated-20261123/native-interop.json
