name: Hepta credential transport and YAML compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Install private-session test daemon
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus gnome-keyring
      - name: Offline parser/provider checks and isolated live old/new roundtrip
        run: python3 scripts/run_hepta_keyring_compatibility.py --output-dir "$RUNNER_TEMP/keyring-compatibility" --work-dir "$RUNNER_TEMP/keyring-compatibility-build"
      - name: Preserve logs, JUnit, graph and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyring-yaml-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/keyring-compatibility
          if-no-files-found: error
