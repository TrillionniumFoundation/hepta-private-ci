name: Automation TaskFlow apply correctness remediation

on:
  push:
    branches:
      - work/automation-taskflow-full-closure-2026-09-27
    paths:
      - .github/workflows/automation-taskflow-remediate-20260929.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-taskflow-remediate-20260929
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out exact remediation inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-full-closure-2026-09-27
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/automation-taskflow-export-final-patch.yml
            .github/workflows/automation-taskflow-remediate-20260929.yml
            .github/workflows/automation-taskflow-selected-host.yml
            codex-rs/hepta-automation/migrations/0022_durable_neural_circuit.sql
            codex-rs/hepta-automation/src/durable_neural_circuit.rs
            codex-rs/hepta-automation/src/durable_neural_circuit_recovery.rs
            codex-rs/hepta-automation/src/timer_lifecycle.rs
            codex-rs/hepta-automation/tests/automation.rs
            codex-rs/hepta-automation/tests/durable_neural_circuit.rs
            codex-rs/hepta-automation/tests/durable_neural_circuit_recovery.rs
            docs/modules/automation.taskflow/SCHEMA_CONTRACT.json
            scripts/automation_taskflow_remediation_20260929.patch.b64

      - name: Materialize and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/automation-taskflow-remediation.patch"
          tr -d '\r\n\t ' < scripts/automation_taskflow_remediation_20260929.patch.b64 \
            | base64 --decode \
            | gzip --decompress --stdout > "$patch_file"
          test "$(sha256sum "$patch_file" | awk '{print $1}')" = \
            "d0a48c30545262f63fc22587e36c03376cd9112eea626cf363ffc1a9d8ff844c"
          git apply --check --3way "$patch_file"
          git apply --3way "$patch_file"

      - name: Select real durable Circuit integration tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/automation-taskflow-selected-host.yml')
          body = path.read_text(encoding='utf-8')
          old = "          cargo test -p codex-hepta-automation durable_neural_circuit -- --nocapture\n          cargo test -p codex-hepta-automation external_host_fence -- --nocapture\n"
          new = "          cargo test -p codex-hepta-automation --test durable_neural_circuit -- --nocapture\n          cargo test -p codex-hepta-automation --test durable_neural_circuit_recovery -- --nocapture\n          cargo test -p codex-hepta-automation external_host_fence -- --nocapture\n"
          if body.count(old) != 1:
              raise SystemExit('selected-host durable Circuit command anchor changed')
          path.write_text(body.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m json.tool docs/modules/automation.taskflow/SCHEMA_CONTRACT.json >/dev/null
          git diff --check

      - name: Remove temporary transport files and push source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/automation-taskflow-export-final-patch.yml
          rm -f .github/workflows/automation-taskflow-remediate-20260929.yml
          rm -f scripts/automation_taskflow_remediation_20260929.patch.b64
          git diff --check
          git config user.name "hepta-automation-remediation"
          git config user.email "automation-remediation@users.noreply.github.com"
          git add -A
          git commit -m "fix(automation): fence durable circuit recovery and projection"
          git push origin HEAD:work/automation-taskflow-full-closure-2026-09-27
