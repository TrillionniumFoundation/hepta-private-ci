# Retired: all source edits must be ordinary reviewed commits.
# Historical implementation remains in Git; no CI job may rewrite the candidate.
name: Intuition source apply (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject the retired write-back path
        run: |
          echo "This source-mutating workflow is retired. Use an ordinary source commit and the read-only intuition qualification workflow."
          exit 1
