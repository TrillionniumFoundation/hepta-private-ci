name: hcsn-currentstate-n256-uniformization-output-interval

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_uniformization_output_interval/**"
      - ".github/workflows/hcsn-currentstate-n256-uniformization-output-interval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assertions-enabled bounded interval fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_uniformization_output_interval.test_output_interval
      - name: Optimized-mode bounded interval fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_uniformization_output_interval.test_output_interval
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_uniformization_output_interval/*.py
      - name: Verify frozen source and fail-closed gates
        run: python3 qualification/hcsn_currentstate_n256_uniformization_output_interval/verify_source.py
