name: hepta-neuron-next-round-matrix

on:
  pull_request:
    paths:
      - "qualification/stem-cell-v1/**"
      - ".github/workflows/hepta-neuron-next-round-matrix.yml"
  push:
    branches: [main]
    paths:
      - "qualification/stem-cell-v1/**"
      - ".github/workflows/hepta-neuron-next-round-matrix.yml"

permissions:
  contents: read

jobs:
  preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preregistered matrix
        run: |
          PYTHONPATH=qualification/stem-cell-v1 python3 -m unittest -v \
            qualification/stem-cell-v1/test_next_round_matrix.py
          PYTHONPATH=qualification/stem-cell-v1 python3 \
            qualification/stem-cell-v1/next_round_matrix.py \
            --reader-id reader-fixed-v1 \
            --task-set-id tasks-fixed-v1 \
            --output "$RUNNER_TEMP/next-round.json"

  execution-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "7347"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned CPU test dependencies
        run: |
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Record actual source and environment
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/stem-source.txt"
          python -m pip freeze > "$RUNNER_TEMP/stem-environment.txt"
      - name: Execute complete focused suite without skips
        shell: bash
        run: |
          set -euo pipefail
          python -c "from safetensors.torch import load_file, save_file; import packaging.version"
          python qualification/stem-cell-v1/run_checked_tests.py --output "$RUNNER_TEMP/stem-tests.json" 2>&1 | tee "$RUNNER_TEMP/stem-regression.log"
          python -m compileall -q qualification/stem-cell-v1
      - name: Retain exact-run source test observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-execution-source-tests
          path: |
            ${{ runner.temp }}/stem-source.txt
            ${{ runner.temp }}/stem-environment.txt
            ${{ runner.temp }}/stem-regression.log
            ${{ runner.temp }}/stem-tests.json
          if-no-files-found: error

  hf-profile-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact stock HF compatibility profile
        id: hf-deps
        run: |
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0 transformers==4.57.1 huggingface-hub==0.36.0 tokenizers==0.22.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Exercise real stock architecture offline, without pretrained claims
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/hf-source.txt"
          python -m pip freeze > "$RUNNER_TEMP/hf-environment.txt"
          python qualification/stem-cell-v1/run_checked_tests.py --pattern hf_profile_checks.py --output "$RUNNER_TEMP/hf-profile-tests.json" 2>&1 | tee "$RUNNER_TEMP/hf-profile.log"
      - name: Exercise stock generation independently of Encoder result
        if: ${{ !cancelled() && steps.hf-deps.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python qualification/stem-cell-v1/run_checked_tests.py --pattern hf_generation_checks.py --output "$RUNNER_TEMP/hf-generation-tests.json" 2>&1 | tee "$RUNNER_TEMP/hf-generation.log"
      - name: Retain HF architecture observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-hf-profile-compatibility
          path: |
            ${{ runner.temp }}/hf-source.txt
            ${{ runner.temp }}/hf-environment.txt
            ${{ runner.temp }}/hf-profile.log
            ${{ runner.temp }}/hf-generation.log
            ${{ runner.temp }}/hf-profile-tests.json
            ${{ runner.temp }}/hf-generation-tests.json
          if-no-files-found: error

  public-encoder-canary:
    needs: hf-profile-compatibility
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact CPU pretrained canary dependencies
        run: |
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0 transformers==4.57.1 huggingface-hub==0.36.0 tokenizers==0.22.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Pin public commit, acquire safe weights, execute Encoder
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/public-encoder-source.txt"
          python -m pip freeze > "$RUNNER_TEMP/public-encoder-environment.txt"
          python qualification/stem-cell-v1/public_encoder_probe.py \
            --acquire-public --upstream-revision 8949b909ec900327062f0ebf497f51aef5e6f0c8 \
            --compare-arithmetic --output "$RUNNER_TEMP/public-encoder" 2>&1 | tee "$RUNNER_TEMP/public-encoder.log"
      - name: Train real Cell banks on fixed public natural-language data
        shell: bash
        run: |
          set -euo pipefail
          python qualification/stem-cell-v1/public_cell_learning.py \
            --public-probe "$RUNNER_TEMP/public-encoder" --acquire-banking77 \
            --output "$RUNNER_TEMP/public-cell-learning" 2>&1 | tee "$RUNNER_TEMP/public-cell-learning.log"
      - name: Freeze original public case IDs without exposing official test labels
        shell: bash
        run: |
          set -euo pipefail
          python qualification/stem-cell-v1/public_q24_feature_snapshot.py prepare \
            --data-root "$RUNNER_TEMP/public-cell-learning/data" \
            --selection "$RUNNER_TEMP/public-cell-learning/selection.json" \
            --output "$RUNNER_TEMP/public-q24-encoder-only-inputs.json"
      - name: Physically encode same selected public cases and freeze train-only PCA32 Q24 features
        shell: bash
        run: |
          set -euo pipefail
          python qualification/stem-cell-v1/public_q24_feature_snapshot.py encode \
            --inputs "$RUNNER_TEMP/public-q24-encoder-only-inputs.json" \
            --public-probe "$RUNNER_TEMP/public-encoder" \
            --output "$RUNNER_TEMP/public-q24-feature-snapshot"
          python qualification/stem-cell-v1/audit_public_q24_snapshot.py \
            --snapshot "$RUNNER_TEMP/public-q24-feature-snapshot" \
            --input-id-file "$RUNNER_TEMP/public-q24-encoder-only-inputs.json" \
            --output "$RUNNER_TEMP/public-q24-independent-verdict.json"
      - name: Retain real Q24 feature/projection tensors and safe case IDs, not raw public text or base weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-real-public-q24-feature-snapshot
          path: |
            ${{ runner.temp }}/public-q24-feature-snapshot/SEALED.json
            ${{ runner.temp }}/public-q24-feature-snapshot/FAILED.json
            ${{ runner.temp }}/public-q24-feature-snapshot/case-registry.json
            ${{ runner.temp }}/public-q24-feature-snapshot/pooled-f32.safetensors
            ${{ runner.temp }}/public-q24-feature-snapshot/train-only-pca32.safetensors
            ${{ runner.temp }}/public-q24-feature-snapshot/feature-q24.safetensors
            ${{ runner.temp }}/public-q24-independent-verdict.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain public learning terminals and small Head weights, not base weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-public-cell-learning
          path: |
            ${{ runner.temp }}/public-cell-learning.log
            ${{ runner.temp }}/public-cell-learning/selection.json
            ${{ runner.temp }}/public-cell-learning/pre-execution-plan.json
            ${{ runner.temp }}/public-cell-learning/scores.json
            ${{ runner.temp }}/public-cell-learning/FAILED.json
            ${{ runner.temp }}/public-cell-learning/data/SOURCE.json
            ${{ runner.temp }}/public-cell-learning/data/MATERIAL.json
            ${{ runner.temp }}/public-cell-learning/data/LICENSE
            ${{ runner.temp }}/public-cell-learning/data/FAILED.json
            ${{ runner.temp }}/public-cell-learning/trial
          if-no-files-found: warn
      - name: Retain observations, never upload model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-public-encoder-canary
          path: |
            ${{ runner.temp }}/public-encoder-source.txt
            ${{ runner.temp }}/public-encoder-environment.txt
            ${{ runner.temp }}/public-encoder.log
            ${{ runner.temp }}/public-encoder/source-lock.json
            ${{ runner.temp }}/public-encoder/downloaded-material.json
            ${{ runner.temp }}/public-encoder/probe.json
            ${{ runner.temp }}/public-encoder/FAILED.json
          if-no-files-found: error
