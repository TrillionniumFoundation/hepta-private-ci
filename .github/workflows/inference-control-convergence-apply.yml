name: Inference control convergence apply

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/.hepta_inference_control_converge.py.gz.b64
      - .github/workflows/inference-control-convergence-apply.yml

permissions:
  contents: read

concurrency:
  group: inference-control-convergence-apply
  cancel-in-progress: false

jobs:
  diagnose-patch-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: work/product-convergence-20260923
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refresh canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Decode and print the stale anchor
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode scripts/.hepta_inference_control_converge.py.gz.b64 \
            | gzip --decompress > "$RUNNER_TEMP/hepta-inference-converge.py"
          echo "55820b7f5fbfc5db7bd3355e91386a981678f7bac9b177e98e0e58862b206324  $RUNNER_TEMP/hepta-inference-converge.py" \
            | sha256sum --check -
          python3 - "$RUNNER_TEMP/hepta-inference-converge.py" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text()
          needle = "durable fields"
          index = text.find(needle)
          print(f"script bytes={len(text)} anchor-index={index}")
          print("----- script context -----")
          print(text[max(0, index - 2400): index + 600])
          print("----- current source context -----")
          source = Path("codex-rs/hepta-infer-core/src/durable_control.rs").read_text()
          start = source.index("pub struct DurableInferenceControl")
          end = source.index("impl DurableInferenceControl", start)
          print(source[max(0, start - 120):end + 40])
          PY
          exit 1
