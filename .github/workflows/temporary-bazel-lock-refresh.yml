name: temporary Bazel lock refresh

on:
  push:
    branches:
      - fix/security-zip-20261017

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: lock-refresh
      - name: Refresh MODULE.bazel.lock
        run: bazel mod deps --lockfile_mode=update
      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- MODULE.bazel.lock; then
            echo "MODULE.bazel.lock already current"
            exit 0
          fi
          git config user.name "hepta-ci-lock-refresh"
          git config user.email "hepta-ci-lock-refresh@users.noreply.github.com"
          git add MODULE.bazel.lock
          git commit -m "chore: refresh Bazel module lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
