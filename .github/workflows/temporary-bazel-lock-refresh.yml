name: temporary Bazel lock refresh

on:
  push:
    branches:
      - fix/security-zip-20261017

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: lock-refresh
      - name: Refresh MODULE.bazel.lock
        run: bazel mod deps --lockfile_mode=update
      - name: Upload refreshed lock
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: refreshed-module-bazel-lock
          path: MODULE.bazel.lock
