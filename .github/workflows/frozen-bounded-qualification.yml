name: Frozen bounded source qualification
on:
  push:
    branches: [dot/frozen-bounded-qualification-20261006]
permissions:
  contents: read
concurrency:
  group: frozen-bounded-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety-hold:
    name: Safety hold - qualification paused
    if: github.event_name == 'push' && github.ref == 'refs/heads/dot/frozen-bounded-qualification-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Report the safety hold without checking out or building source
        shell: bash
        run: |
          echo "::error::Qualification paused: native setup must preserve host security settings. No tests or builds run in this pause job."
          exit 1
