      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        timeout-minutes: 3
        with:
          version: '0.11.3'
          enable-cache: false
      - name: Install frozen small docs verification environment
        timeout-minutes: 5
        run: |
          uv sync --frozen --project scripts --only-group ci
          echo "$GITHUB_WORKSPACE/scripts/.venv/bin" >> "$GITHUB_PATH"
