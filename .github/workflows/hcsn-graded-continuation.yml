name: HCSN graded continuation arithmetic checks

on:
  pull_request:
    paths:
      - qualification/hcsn_graded/**
      - .github/workflows/hcsn-graded-continuation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install array reader
        run: python -m pip install numpy==2.3.5
      - name: Recompute all 28672 retained rows without model execution
        run: python -m qualification.hcsn_graded.verify_continuation qualification/hcsn_graded/evidence/actual-migrated-continuation-attempt002
      - name: Require clean source tree
        run: git diff --exit-code && git diff --cached --exit-code && test -z "$(git status --porcelain --untracked-files=normal)"
