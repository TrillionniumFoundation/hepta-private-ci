name: Hepta intuition ledger qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "scripts/intuition_*.py"
      - "scripts/tests/test_intuition*.py"
      - "qualification/intuition.policy/**"
      - "docs/modules/intuition.policy/**"
      - ".github/workflows/hepta-intuition-ledger-qualification.yml"
      - ".github/actions/setup-ci/**"
  push:
    branches: [main]
    paths:
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "scripts/intuition_*.py"
      - "scripts/tests/test_intuition*.py"
      - "qualification/intuition.policy/**"
      - "docs/modules/intuition.policy/**"
      - ".github/workflows/hepta-intuition-ledger-qualification.yml"
      - ".github/actions/setup-ci/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
  CARGO_BUILD_JOBS: "2"

concurrency:
  group: hepta-intuition-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-ledger:
    name: Intuition durable append and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - name: Test Agentd selected-only writer composition
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/intuition-ledger-target
          HEPTA_TARGET_HOST_ID: github-actions-ubuntu-24.04-intuition
          HEPTA_LEDGER_RECORDS: "512"
          HEPTA_LEDGER_SEGMENT_RECORDS: "64"
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/intuition_ci_exact.py --kind ledger \
            --source-commit "$SOURCE_SHA" \
            --evidence "$RUNNER_TEMP/intuition-ledger-evidence"
      - name: Retain ledger success, infrastructure failure and interrupted-command evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-ledger-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-ledger-evidence/
          if-no-files-found: error
          retention-days: 90
