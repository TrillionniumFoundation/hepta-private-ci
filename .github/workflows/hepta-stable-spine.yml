name: Hepta stable spine qualification

on:
  push:
    branches: [work/stable-spine-acceptance-20260913]
    paths:
      - .github/workflows/hepta-stable-spine.yml
      - scripts/**
      - tools/hepta-engineering-control/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-runtime/**
  pull_request:
    paths:
      - .github/workflows/hepta-stable-spine.yml
      - scripts/**
      - tools/hepta-engineering-control/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-runtime/**

permissions:
  contents: read

concurrency:
  group: hepta-stable-spine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Resolve the repository-locked Python formatter
        run: uv run --frozen --project scripts ruff --version
      - name: Export immutable source, not an acceptance certificate
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          output="$RUNNER_TEMP/stable-spine-source"
          mkdir -p "$output"
          git rev-parse HEAD HEAD^{tree} > "$output/identity.txt"
          git archive --format=tar HEAD | gzip -n > "$output/source.tar.gz"
          git log --format='%H%n%T' HEAD | sort -u | git pack-objects --stdout > "$output/ancestry.pack"
          install -m 0755 scripts/.venv/bin/ruff "$output/ruff"
          (cd "$output" && sha256sum source.tar.gz ancestry.pack ruff > SHA256SUMS)
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-stable-spine-source-${{ github.sha }}
          path: ${{ runner.temp }}/stable-spine-source
          if-no-files-found: error
          retention-days: 2
