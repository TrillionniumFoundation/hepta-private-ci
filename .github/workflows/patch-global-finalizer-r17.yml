name: patch-global-finalizer-r17

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/patch-global-finalizer-r17.yml
      - scripts/patch-global-finalizer-r17.py

permissions:
  contents: write
  actions: write

concurrency:
  group: patch-global-finalizer-r17
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 9d69292007911dbc92f445ee285dceef83a282af
      TARGET_BRANCH: ops/hepta-global-gap-closure-controller-20260910-r1
      FINALIZER: scripts/hepta-global-finalizer-r7.py
      PATCH_SCRIPT: scripts/patch-global-finalizer-r17.py
      PATCH_WORKFLOW: .github/workflows/patch-global-finalizer-r17.yml
      TARGET_CANDIDATE: integration/hepta-all-gap-closure-20260910-r7
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact one-shot patch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable patch tuple
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:${PATCH_WORKFLOW})" = "$(git hash-object "${PATCH_WORKFLOW}")"
          test "$(git rev-parse HEAD:${PATCH_SCRIPT})" = "$(git hash-object "${PATCH_SCRIPT}")"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"

      - name: Apply and validate full native-source closure repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "${PATCH_SCRIPT}"
          python3 -m py_compile "${FINALIZER}" "${PATCH_SCRIPT}"
          grep -Fq '"codex/lane-g-real-full-closure-20260910"' "${FINALIZER}"
          grep -Fq '"currentRowsRetained": len(current_map)' "${FINALIZER}"
          grep -Fq '"baselineCommit": baseline_commit' "${FINALIZER}"
          grep -Fq 'lane_g_artifact_repair = repair_lane_g_shared_artifacts(selected["G"])' "${FINALIZER}"
          grep -Fq 'module_order[-1] != "control.engineering"' "${FINALIZER}"
          grep -Fq 'class NativeBindingCoverageTests' "${FINALIZER}"
          if grep -Fq 'implementation_contract_tests_native.py' "${FINALIZER}"; then
            echo 'shadow native test carrier survived r17 repair' >&2
            exit 1
          fi
          git diff --check

      - name: Publish repaired controller and dispatch r7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-global-finalizer-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm "${PATCH_WORKFLOW}" "${PATCH_SCRIPT}"
          git add "${FINALIZER}"
          git diff --cached --check
          expected_paths="${PATCH_WORKFLOW}
${PATCH_SCRIPT}
${FINALIZER}"
          actual_paths="$(git diff --cached --name-only | sort)"
          test "${actual_paths}" = "$(printf '%s\n' "${expected_paths}" | sort)"
          git commit --signoff -m 'fix(hepta): rebuild full native source observation closure'
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          gh workflow run hepta-global-finalizer-r7.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TARGET_BRANCH}" \
            --field target_branch="${TARGET_CANDIDATE}" \
            --field shard_count='8'
