name: ui.native exact-source qualification

on:
  pull_request:
    branches: [work/ui-native-qualified-integration-20260928]
    paths:
      - apps/hepta-native/**
      - docs/modules/ui.native/**
      - scripts/check_hepta_ui_native_convergence.py
      - scripts/test_hepta_ui_native_convergence.py
      - .github/workflows/ui-native-qualification.yml
  push:
    branches: [work/ui-native-exact-convergence-20260930]
    paths:
      - apps/hepta-native/**
      - docs/modules/ui.native/**
      - scripts/check_hepta_ui_native_convergence.py
      - scripts/test_hepta_ui_native_convergence.py
      - .github/workflows/ui-native-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-native-exact-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  source-identity:
    name: ui.native / source identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove immutable checkout and convergence invariants
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD 'HEAD^{tree}'
          git show --no-patch --format='parents=%P%ncommit=%H%ntree=%T%nsubject=%s' HEAD
          python3 scripts/check_hepta_ui_native_convergence.py \
            --emit "$RUNNER_TEMP/ui-native-source-evidence.json"
          cat "$RUNNER_TEMP/ui-native-source-evidence.json"
          test -z "$(git status --porcelain)"

  linux-quality:
    name: ui.native / Linux format, lint, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libssl-dev desktop-file-utils \
            xvfb xauth dbus-x11 gnome-keyring xdotool x11-utils \
            python3-cryptography fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
      - name: All-target all-feature compilation
        run: cargo +1.95.0 check --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features
      - name: Strict Clippy
        run: cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Native Rust tests
        run: cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets
      - name: Python contract and convergence tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_hepta_ui_native*.py' -v
      - name: Worktree remains immutable
        shell: bash
        run: test -z "$(git status --porcelain)"

  cross-platform-check:
    name: ui.native / ${{ matrix.name }} compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: All-target all-feature compilation
        run: cargo +1.95.0 check --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features
      - name: Strict Clippy
        run: cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Native Rust tests
        run: cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets

  qualification-result:
    name: ui.native / qualification result
    if: always()
    needs: [source-identity, linux-quality, cross-platform-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every exact-source subject
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source-identity.result }}
          LINUX_RESULT: ${{ needs.linux-quality.result }}
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform-check.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'source_sha=%s\nsource_identity=%s\nlinux=%s\ncross_platform=%s\n' \
            "$SOURCE_SHA" "$SOURCE_RESULT" "$LINUX_RESULT" "$CROSS_PLATFORM_RESULT"
          test "$SOURCE_RESULT" = success
          test "$LINUX_RESULT" = success
          test "$CROSS_PLATFORM_RESULT" = success
