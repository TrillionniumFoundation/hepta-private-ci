name: memory federation one-shot stable map rebind

on:
  push:
    branches:
      - fix/memory-federation-product-qualification-20260930
    paths:
      - .github/workflows/memory-federation-map-rebind-once.yml

permissions:
  contents: write
  actions: write

jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out focused qualification branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/memory-federation-product-qualification-20260930
          fetch-depth: 0
          persist-credentials: true
      - name: Create stable parent without this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Memory Federation Qualification"
          git config user.email "hepta-memory-federation-ci@users.noreply.github.com"
          rm .github/workflows/memory-federation-map-rebind-once.yml
          git add .github/workflows/memory-federation-map-rebind-once.yml
          git commit -m "ops(memory.federation): remove one-shot map rebind workflow"
          git push origin HEAD:fix/memory-federation-product-qualification-20260930
      - name: Rebind canonical implementation map to stable parent
        shell: bash
        run: |
          set -euo pipefail
          ANCHOR_COMMIT="$(git rev-parse HEAD)"
          ANCHOR_TREE="$(git rev-parse HEAD^{tree})"
          WIRE_OBJECT="$(git rev-parse HEAD:docs/modules/memory.federation/WIRE_IMPLEMENTATION_MAP.json)"
          export ANCHOR_COMMIT ANCHOR_TREE WIRE_OBJECT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("docs/modules/memory.federation/IMPLEMENTATION_MAP.json")
          data = json.loads(path.read_text())
          commit = os.environ["ANCHOR_COMMIT"]
          tree = os.environ["ANCHOR_TREE"]
          wire = os.environ["WIRE_OBJECT"]
          branch = "fix/memory-federation-product-qualification-20260930"

          data["sourceBase"] = {"commit": commit, "tree": tree}
          data["observedAtHead"] = {"commit": commit, "tree": tree}
          att = data["headAttestation"]
          att["candidateBranch"] = branch
          att["candidateHead"] = commit
          att["candidateTree"] = tree
          att["status"] = "pending_exact_current_head_and_merge_candidate_execution"
          att["note"] = (
              "Author-only observation of the stable host-product qualification parent after "
              "the authenticated wire implementation map was rebound and all one-shot tooling "
              "was removed from the final tree. Exact-scope pre-ranking selection, same-snapshot "
              "exhaustion, structured peer-local failure coverage, post-I/O authority observation "
              "time, final-use memory validity, workspace lint inheritance, qualification commands "
              "and release boundaries are unchanged. This metadata-only rebind grants no execution, "
              "acceptance, activation, promotion, or release claim."
          )
          for entry in data["sourceObjects"]:
              if entry["path"] == "docs/modules/memory.federation/WIRE_IMPLEMENTATION_MAP.json":
                  entry["object"] = wire
                  break
          else:
              raise SystemExit("wire implementation-map source object is missing")

          assert att["metadataOnlyPaths"] == [
              "docs/modules/memory.federation/IMPLEMENTATION_MAP.json"
          ]
          claims = data["claimBoundary"]
          assert claims["productionImplementation"] is False
          assert claims["productExecutionProved"] is False
          assert claims["independentAcceptance"] is False
          assert claims["activation"] is False
          assert claims["release"] is False
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY
          python3 -m json.tool docs/modules/memory.federation/IMPLEMENTATION_MAP.json >/dev/null
          python3 scripts/verify_memory_federation_implementation.py
          python3 scripts/verify_memory_federation_status.py
          git diff --check
          test "$(git diff --name-only)" = "docs/modules/memory.federation/IMPLEMENTATION_MAP.json"
      - name: Commit metadata-only frozen observation
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git add docs/modules/memory.federation/IMPLEMENTATION_MAP.json
          git commit -m "docs(memory.federation): bind stable product qualification head"
          git push origin HEAD:fix/memory-federation-product-qualification-20260930
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-head and deterministic-merge qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["FINAL_SHA"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "memory-federation-v2-final-verify.yml/dispatches"
          )
          payload = json.dumps({
              "ref": "fix/memory-federation-product-qualification-20260930",
              "inputs": {"expected_sha": sha},
          }).encode()
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 204:
                  raise SystemExit(f"unexpected dispatch status {response.status}")
          PY
