name: Subsequent consumer owner qualification
on:
  push:
    branches: [research/paired-consumer-outcome-20261123]
    paths:
      - 'codex-rs/hepta-agentd/src/bin/hepta-paired-consent.rs'
      - 'codex-rs/hepta-agentd/src/human_learning_consent.rs'
      - 'codex-rs/hepta-agentd/src/paired_learning_consent_tests.rs'
      - 'qualification/paired-consent-process-20261123/test_statement.py'
      - '.github/workflows/hepta-consumer-owner-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Resolve pinned native dependencies
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Build and test participant and owner paths
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-consumer-build
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked -p codex-hepta-agentd --bin hepta-paired-consent
          python3 ../qualification/paired-consent-process-20261123/test_statement.py "$CARGO_TARGET_DIR/debug/hepta-paired-consent"
          cargo test --locked -p codex-hepta-agentd --lib paired_learning_consent_tests -- --test-threads=1
      - name: Retain tested participant binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-paired-consent-linux
          path: ${{ runner.temp }}/hepta-consumer-build/debug/hepta-paired-consent
          if-no-files-found: error
