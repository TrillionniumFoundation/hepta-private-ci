name: Hepta learning.artifacts qualification

on:
  push:
    branches:
      - main
      - 'codex/learning-artifacts-qualification-recovery-*'
      - 'codex/learning-artifacts-qualified-host-*'
      - 'codex/learning-artifacts-convergence-*'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      base_commit:
        description: Optional full integration-base commit; otherwise resolve origin/main
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: learning-artifacts-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.base_commit }}
  PUSH_BEFORE: ${{ github.event.before }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: learning.artifacts (${{ matrix.os }}, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        lane: [exact-head, synthetic-merge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Bind source and actual integration base
        id: identity
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ -z "$BASE_SHA" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              BASE_SHA="$PUSH_BEFORE"
            else
              BASE_SHA=$(git rev-parse refs/remotes/origin/main)
            fi
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" != 0000000000000000000000000000000000000000
          git cat-file -e "$BASE_SHA^{commit}"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          if [[ "$LANE" == synthetic-merge ]]; then
            tree=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
            git config user.name 'Artifact qualification'
            git config user.email 'artifact-qualification@users.noreply.github.com'
            candidate=$(printf '%s\n' 'Ephemeral qualification merge; not a publication.' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$candidate"
          fi
      - name: Install test runner
        id: runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Install pinned Rust
        id: rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Evidence verifier regression tests
        run: python3 -m unittest discover -s scripts -p 'test_hepta_artifact_*.py' -v
      - name: Execute every native gate and retain each outcome
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.runner.outcome == 'success' && steps.rust.outcome == 'success' }}
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_artifact_qualification.py \
            --source "$SOURCE_SHA" --base "$BASE_SHA" --lane "$LANE" \
            --out "$RUNNER_TEMP/artifact-evidence"
      - name: Recompute receipt claims from independently bound source
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.runner.outcome == 'success' && steps.rust.outcome == 'success' }}
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_artifact_receipt_guard.py \
            --source "$SOURCE_SHA" --base "$BASE_SHA" --lane "$LANE" \
            --out "$RUNNER_TEMP/artifact-evidence"
      - name: Retain failure or success evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-artifacts-${{ env.SOURCE_SHA }}-${{ matrix.os }}-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-evidence
          if-no-files-found: error
          retention-days: 14

  required:
    name: Lane E artifacts required
    if: always()
    needs: [qualify]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failures, cancellation and skipped qualification
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success

# BEGIN TEMPORARY LEARNING ARTIFACTS MATERIALIZER
  materialize_static_candidate:
    name: Materialize learning.artifacts static candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'codex/learning-artifacts-convergence-20260929' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: codex/learning-artifacts-convergence-20260929
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Execute reviewed materializer
        env:
          TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          source = Path('.github/workflows/materialize-learning-artifacts-final-fixes.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          scripts: list[str] = []
          index = 0
          while index < len(lines):
              if lines[index] != '        run: |':
                  index += 1
                  continue
              index += 1
              body: list[str] = []
              while index < len(lines):
                  line = lines[index]
                  if line and not line.startswith('          '):
                      break
                  body.append(line[10:] if line.startswith('          ') else '')
                  index += 1
              scripts.append('\n'.join(body) + '\n')

          if len(scripts) != 2:
              raise SystemExit(f'expected exactly two materializer scripts, found {len(scripts)}')

          environment = os.environ.copy()
          for number, script in enumerate(scripts, start=1):
              path = Path(f'/tmp/learning-artifacts-materializer-step-{number}.sh')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(path)], cwd='.', env=environment, check=True)
          PY
      - name: Restore qualification workflow and remove trigger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'learning.artifacts candidate materializer'
          git config user.email 'artifact-candidate@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hepta-learning-artifacts-qualification.yml')
          text = path.read_text(encoding='utf-8')
          marker = '\n# BEGIN TEMPORARY LEARNING ARTIFACTS MATERIALIZER\n'
          if marker not in text:
              raise SystemExit('temporary materializer marker missing')
          text = text.split(marker, 1)[0].rstrip() + '\n'
          text = text.replace(
              'permissions:\n  actions: write\n  contents: write\n',
              'permissions:\n  contents: read\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/trigger-learning-artifacts-static-materialization.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'ci(learning-artifacts): retire one-shot materialization hooks'
            git push origin HEAD:codex/learning-artifacts-convergence-20260929
          fi
          gh workflow run hepta-learning-artifacts-qualification.yml \
            --ref codex/learning-artifacts-convergence-20260929 \
            -f base_commit=a126987b84737dbc2ee2592442a314117bddb4a2
# END TEMPORARY LEARNING ARTIFACTS MATERIALIZER
