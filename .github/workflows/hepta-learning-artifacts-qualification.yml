name: Hepta learning.artifacts qualification

on:
  push:
    branches: [main, 'codex/learning-artifacts-qualification-recovery-*', 'codex/learning-artifacts-qualified-host-*']
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      base_commit:
        description: Optional full integration-base commit; otherwise resolve origin/main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: learning-artifacts-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.base_commit }}
  PUSH_BEFORE: ${{ github.event.before }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: learning.artifacts (${{ matrix.profile }}, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-x86_64-stable
            runner: ubuntu-24.04
            toolchain: stable
            lane: exact-head
          - profile: linux-x86_64-stable
            runner: ubuntu-24.04
            toolchain: stable
            lane: synthetic-merge
          - profile: linux-x86_64-msrv
            runner: ubuntu-24.04
            toolchain: 1.95.0
            lane: exact-head
          - profile: linux-x86_64-msrv
            runner: ubuntu-24.04
            toolchain: 1.95.0
            lane: synthetic-merge
          - profile: linux-arm64-stable
            runner: ubuntu-24.04-arm
            toolchain: stable
            lane: exact-head
          - profile: linux-arm64-stable
            runner: ubuntu-24.04-arm
            toolchain: stable
            lane: synthetic-merge
          - profile: macos-arm64-stable
            runner: macos-15
            toolchain: stable
            lane: exact-head
          - profile: macos-arm64-stable
            runner: macos-15
            toolchain: stable
            lane: synthetic-merge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Bind source and actual integration base
        id: identity
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ -z "$BASE_SHA" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              BASE_SHA="$PUSH_BEFORE"
            else
              BASE_SHA=$(git rev-parse refs/remotes/origin/main)
            fi
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" != 0000000000000000000000000000000000000000
          git cat-file -e "$BASE_SHA^{commit}"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          if [[ "$LANE" == synthetic-merge ]]; then
            tree=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
            git config user.name 'Artifact qualification'
            git config user.email 'artifact-qualification@users.noreply.github.com'
            candidate=$(printf '%s\n' 'Ephemeral qualification merge; not a publication.' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$candidate"
          fi
      - name: Install test runner
        id: runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Install qualified Rust profile
        id: rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt
      - name: Bind runner, toolchain and lockfile identity
        env:
          PROFILE: ${{ matrix.profile }}
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact-evidence"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          lock = Path("codex-rs/Cargo.lock").read_bytes()
          rustc = subprocess.check_output(["rustc", "-Vv"], text=True)
          host = next(
              (line.split(":", 1)[1].strip() for line in rustc.splitlines() if line.startswith("host:")),
              "unknown",
          )
          payload = {
              "schema": "hepta.learning-artifacts.qualification-environment.v1",
              "sourceSha": os.environ["SOURCE_SHA"],
              "baseSha": os.environ.get("BASE_SHA", ""),
              "profile": os.environ["PROFILE"],
              "lane": os.environ["LANE"],
              "runnerOs": os.environ.get("RUNNER_OS", ""),
              "runnerArch": os.environ.get("RUNNER_ARCH", ""),
              "hostTarget": host,
              "platform": platform.platform(),
              "rustc": rustc,
              "cargoLockSha256": hashlib.sha256(lock).hexdigest(),
          }
          Path(os.environ["RUNNER_TEMP"], "artifact-evidence", "environment.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Evidence verifier regression tests
        run: python3 -m unittest discover -s scripts -p 'test_hepta_artifact_*.py' -v
      - name: Execute every native gate and retain each outcome
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.runner.outcome == 'success' && steps.rust.outcome == 'success' }}
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_artifact_qualification.py \
            --source "$SOURCE_SHA" --base "$BASE_SHA" --lane "$LANE" \
            --out "$RUNNER_TEMP/artifact-evidence"
      - name: Recompute receipt claims from independently bound source
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.runner.outcome == 'success' && steps.rust.outcome == 'success' }}
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_artifact_receipt_guard.py \
            --source "$SOURCE_SHA" --base "$BASE_SHA" --lane "$LANE" \
            --out "$RUNNER_TEMP/artifact-evidence"
      - name: Retain failure or success evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-artifacts-${{ env.SOURCE_SHA }}-${{ matrix.profile }}-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-evidence
          if-no-files-found: error
          retention-days: 14

  required:
    name: Lane E artifacts required
    if: always()
    needs: [qualify]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failures, cancellation and skipped qualification
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
