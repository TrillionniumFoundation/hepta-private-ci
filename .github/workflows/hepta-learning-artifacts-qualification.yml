name: Hepta learning.artifacts qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact nonzero base commit for ordered-parent merge qualification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: learning-artifacts-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Closed-world verification and receipt-verifier regressions
        run: python3 scripts/hepta-artifact-qualification.py run --lane metadata --source "$SOURCE_SHA" --directory .hepta-evidence/artifact-metadata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artifact-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hepta-evidence/artifact-metadata
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native:
    name: Artifact native (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [build, lint, format, owner, storage, lifecycle, selection, revocation, pinned, publication, all]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Compile before testing; retain nonzero test counts and exact output
        env:
          LANE: ${{ matrix.lane }}
        run: python3 scripts/hepta-artifact-qualification.py run --lane "$LANE" --source "$SOURCE_SHA" --directory .hepta-evidence/artifact-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artifact-native-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hepta-evidence/artifact-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Materialize the actual base with ordered parents
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" != 0000000000000000000000000000000000000000
          git cat-file -e "$BASE_SHA^{commit}"
          git config user.name 'Artifact qualification'
          git config user.email 'artifact-qualification@users.noreply.github.com'
          tree=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
          merge=$(printf 'Artifact qualification only\n' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")
          git checkout --detach "$merge"
      - name: Build and run all owner tests on the verified merge tree
        run: python3 scripts/hepta-artifact-qualification.py run --lane synthetic --source "$SOURCE_SHA" --base "$BASE_SHA" --directory .hepta-evidence/artifact-synthetic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artifact-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hepta-evidence/artifact-synthetic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  required:
    name: learning.artifacts exact-head required
    if: always()
    needs: [metadata, native, synthetic]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: artifact-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hepta-evidence/downloaded
      - name: Reject absent, stale, failed, cancelled, skipped or zero-test evidence
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/hepta-artifact-qualification.py collect --source "$SOURCE_SHA" --base "$BASE_SHA" --directory .hepta-evidence/downloaded --output .hepta-evidence/qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artifact-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hepta-evidence/qualification.json
          if-no-files-found: error
          retention-days: 14
