name: secrets.heptabao runtime remediation one-shot

on:
  push:
    branches:
      - codex/secrets-heptabao-runtime-remediation-20260930

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-runtime-remediation-one-shot
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/secrets-heptabao-production-qualified-20260930
          fetch-depth: 0
          persist-credentials: true

      - name: Require expected parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f16a02718de2cefea9f8f6e7f8b03e5722bf9422"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply JIT recovery and executable deadline contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-bao-adapter/src/sqlite_product_runtime.rs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "const MAX_RUNTIME_LEASE_MS: u64 = 5 * 60 * 1_000;\n",
              "const MAX_RUNTIME_LEASE_MS: u64 = 5 * 60 * 1_000;\n"
              "const MAX_RUNTIME_DEADLINE_MS: u64 = 15 * 60 * 1_000;\n",
          )
          replace_once(
              "    pub forward_execution_lease_ms: u64,\n"
              "    pub recovery_lease_ms: u64,\n",
              "    pub consumer_timeout_ms: u64,\n"
              "    pub forward_execution_lease_ms: u64,\n"
              "    pub recovery_lease_ms: u64,\n"
              "    pub absolute_operation_deadline_ms: u64,\n",
          )
          replace_once(
              "            forward_execution_lease_ms: 180_000,\n"
              "            recovery_lease_ms: 60_000,\n",
              "            consumer_timeout_ms: 30_000,\n"
              "            forward_execution_lease_ms: 180_000,\n"
              "            recovery_lease_ms: 60_000,\n"
              "            absolute_operation_deadline_ms: 240_000,\n",
          )
          replace_once(
              "            || self.forward_execution_lease_ms == 0\n"
              "            || self.forward_execution_lease_ms > MAX_RUNTIME_LEASE_MS\n"
              "            || self.recovery_lease_ms == 0\n"
              "            || self.recovery_lease_ms > MAX_RUNTIME_LEASE_MS\n",
              "            || self.consumer_timeout_ms == 0\n"
              "            || self.forward_execution_lease_ms == 0\n"
              "            || self.forward_execution_lease_ms > MAX_RUNTIME_LEASE_MS\n"
              "            || self.recovery_lease_ms == 0\n"
              "            || self.recovery_lease_ms > MAX_RUNTIME_LEASE_MS\n"
              "            || self.absolute_operation_deadline_ms == 0\n"
              "            || self.absolute_operation_deadline_ms > MAX_RUNTIME_DEADLINE_MS\n"
              "            || self.consumer_timeout_ms >= self.forward_execution_lease_ms\n"
              "            || self.forward_execution_lease_ms >= self.absolute_operation_deadline_ms\n"
              "            || self.recovery_lease_ms >= self.absolute_operation_deadline_ms\n",
          )
          replace_once(
              "    pub owner_failures: u64,\n"
              "    pub last_batch_duration_micros: u64,\n",
              "    pub owner_failures: u64,\n"
              "    pub claim_to_execution_start_seconds: u64,\n"
              "    pub lease_remaining_at_execution_start_seconds: u64,\n"
              "    pub claim_expired_before_execution_total: u64,\n"
              "    pub reclaim_total: u64,\n"
              "    pub claim_conflict_total: u64,\n"
              "    pub last_batch_duration_micros: u64,\n",
          )
          replace_once(
              "    owner_failures: u64,\n"
              "    batch_duration_samples_micros: VecDeque<u64>,\n",
              "    owner_failures: u64,\n"
              "    claim_to_execution_start_seconds: u64,\n"
              "    lease_remaining_at_execution_start_seconds: u64,\n"
              "    claim_expired_before_execution_total: u64,\n"
              "    reclaim_total: u64,\n"
              "    claim_conflict_total: u64,\n"
              "    batch_duration_samples_micros: VecDeque<u64>,\n",
          )
          replace_once(
              "impl BaoRecoveryWorkerMetricsOwnerV1 {\n"
              "    fn record(\n",
              "impl BaoRecoveryWorkerMetricsOwnerV1 {\n"
              "    fn record_claim_start(\n"
              "        &mut self,\n"
              "        claim_started: Instant,\n"
              "        claim: &SqliteReconciliationClaimV1,\n"
              "        execution_started_at_unix_ms: u64,\n"
              "    ) {\n"
              "        let claim_micros = elapsed_micros(claim_started);\n"
              "        self.claim_to_execution_start_seconds =\n"
              "            claim_micros.saturating_add(999_999) / 1_000_000;\n"
              "        let remaining_ms = claim\n"
              "            .claim_until_unix_ms\n"
              "            .saturating_sub(execution_started_at_unix_ms);\n"
              "        self.lease_remaining_at_execution_start_seconds = remaining_ms / 1_000;\n"
              "        if execution_started_at_unix_ms >= claim.claim_until_unix_ms {\n"
              "            self.claim_expired_before_execution_total =\n"
              "                self.claim_expired_before_execution_total.saturating_add(1);\n"
              "        }\n"
              "        if claim.attempt_count > 1 {\n"
              "            self.reclaim_total = self.reclaim_total.saturating_add(1);\n"
              "        }\n"
              "    }\n\n"
              "    fn record_claim_conflict(&mut self) {\n"
              "        self.claim_conflict_total = self.claim_conflict_total.saturating_add(1);\n"
              "    }\n\n"
              "    fn record(\n",
          )
          replace_once(
              "            owner_failures: self.owner_failures,\n"
              "            last_batch_duration_micros: self.last_batch_duration_micros,\n",
              "            owner_failures: self.owner_failures,\n"
              "            claim_to_execution_start_seconds: self.claim_to_execution_start_seconds,\n"
              "            lease_remaining_at_execution_start_seconds: self\n"
              "                .lease_remaining_at_execution_start_seconds,\n"
              "            claim_expired_before_execution_total: self\n"
              "                .claim_expired_before_execution_total,\n"
              "            reclaim_total: self.reclaim_total,\n"
              "            claim_conflict_total: self.claim_conflict_total,\n"
              "            last_batch_duration_micros: self.last_batch_duration_micros,\n",
          )
          replace_once(
              "    pub recovery_worker: BaoRecoveryWorkerMetricsV1,\n"
              "}\n",
              "    pub recovery_worker: BaoRecoveryWorkerMetricsV1,\n"
              "    pub oldest_reconciliation_age_seconds: Option<u64>,\n"
              "}\n",
          )

          old_reconcile = '''        let now_unix_ms = self.host.product_now()?;
          let claims = self
              .owner
              .claim_due_reconciliation(
                  &self.config.recovery_worker_id,
                  now_unix_ms,
                  self.config.recovery_lease_ms,
                  self.config.recovery_batch_limit,
              )
              .await
              .map_err(BaoProductHostError::SqliteStore)?;
          let mut report = BaoRecoveryBatchReportV1 {
              claimed: u64::try_from(claims.len()).unwrap_or(u64::MAX),
              succeeded: 0,
              terminal_failed: 0,
              rescheduled: 0,
          };
          let mut classes = Vec::new();
          for mut claim in claims {
              let started = Instant::now();
              let result = self
                  .host
                  .reconcile_sqlite_claim(authbus, &self.owner, &claim, evidence)
                  .await;
              self.host.record_recovery_metric(started, &result);
              match &result {
                  Ok(_) => report.succeeded = report.succeeded.saturating_add(1),
                  Err(BaoProductHostError::TerminalFailure(Box::new(_))) => {
                      report.terminal_failed = report.terminal_failed.saturating_add(1);
                      classes.push(BaoProductErrorClassV1::HistoricalTerminalFailure);
                  }
                  Err(error) => {
                      classes.push(error.class());
                      self.reschedule_claim(&mut claim, error).await?;
                      report.rescheduled = report.rescheduled.saturating_add(1);
                  }
              }
          }
          '''
          new_reconcile = '''        let mut report = BaoRecoveryBatchReportV1 {
              claimed: 0,
              succeeded: 0,
              terminal_failed: 0,
              rescheduled: 0,
          };
          let mut classes = Vec::new();
          for _ in 0..self.config.recovery_batch_limit {
              // Claim only the operation that is about to execute. A later item never
              // burns its lease while an earlier provider/query path is still running.
              let claim_started = Instant::now();
              let now_unix_ms = self.host.product_now()?;
              let mut claims = self
                  .owner
                  .claim_due_reconciliation(
                      &self.config.recovery_worker_id,
                      now_unix_ms,
                      self.config.recovery_lease_ms,
                      1,
                  )
                  .await
                  .map_err(BaoProductHostError::SqliteStore)?;
              if claims.len() > 1 {
                  return Err(BaoProductHostError::SqliteStore(
                      SqliteBaoOwnerErrorV1::CorruptState(
                          "single-item reconciliation claim returned multiple rows",
                      ),
                  ));
              }
              let Some(mut claim) = claims.pop() else {
                  break;
              };
              let execution_started_at_unix_ms = self.host.product_now()?;
              if let Ok(mut metrics) = self.recovery_metrics.lock() {
                  metrics.record_claim_start(
                      claim_started,
                      &claim,
                      execution_started_at_unix_ms,
                  );
              }
              report.claimed = report.claimed.saturating_add(1);
              let started = Instant::now();
              let result = self
                  .host
                  .reconcile_sqlite_claim(authbus, &self.owner, &claim, evidence)
                  .await;
              self.host.record_recovery_metric(started, &result);
              match &result {
                  Ok(_) => report.succeeded = report.succeeded.saturating_add(1),
                  Err(BaoProductHostError::TerminalFailure(Box::new(_))) => {
                      report.terminal_failed = report.terminal_failed.saturating_add(1);
                      classes.push(BaoProductErrorClassV1::HistoricalTerminalFailure);
                  }
                  Err(error) => {
                      if matches!(
                          error.class(),
                          BaoProductErrorClassV1::IdentityConflict
                              | BaoProductErrorClassV1::OwnerBusy
                      ) && let Ok(mut metrics) = self.recovery_metrics.lock()
                      {
                          metrics.record_claim_conflict();
                      }
                      classes.push(error.class());
                      self.reschedule_claim(&mut claim, error).await?;
                      report.rescheduled = report.rescheduled.saturating_add(1);
                  }
              }
          }
          '''
          replace_once(old_reconcile, new_reconcile)

          replace_once(
              "        Ok(SqliteBaoProductRuntimeMetricsV1 {\n"
              "            operations: self.host.operation_metrics(),\n"
              "            owner,\n"
              "            recovery_worker,\n"
              "        })\n",
              "        let oldest_reconciliation_age_seconds = owner\n"
              "            .oldest_due_reconciliation_age_ms\n"
              "            .map(|age_ms| age_ms / 1_000);\n"
              "        Ok(SqliteBaoProductRuntimeMetricsV1 {\n"
              "            operations: self.host.operation_metrics(),\n"
              "            owner,\n"
              "            recovery_worker,\n"
              "            oldest_reconciliation_age_seconds,\n"
              "        })\n",
          )
          replace_once(
              "        invalid = BaoSqliteProductRuntimeConfigV1::default();\n"
              "        invalid.recovery_batch_limit = 1_025;\n",
              "        invalid = BaoSqliteProductRuntimeConfigV1::default();\n"
              "        invalid.consumer_timeout_ms = invalid.forward_execution_lease_ms;\n"
              "        assert_eq!(\n"
              "            invalid.validate(),\n"
              "            Err(BaoFinalUseHostError::InvalidRuntimeConfiguration)\n"
              "        );\n"
              "        invalid = BaoSqliteProductRuntimeConfigV1::default();\n"
              "        invalid.absolute_operation_deadline_ms = invalid.forward_execution_lease_ms;\n"
              "        assert_eq!(\n"
              "            invalid.validate(),\n"
              "            Err(BaoFinalUseHostError::InvalidRuntimeConfiguration)\n"
              "        );\n"
              "        invalid = BaoSqliteProductRuntimeConfigV1::default();\n"
              "        invalid.recovery_batch_limit = 1_025;\n",
          )
          path.write_text(text, encoding="utf-8")
          PY

          cat > docs/modules/secrets.heptabao/DEADLINE_AND_RECOVERY_CONTRACT_V1.md <<'EOF'
          # secrets.heptabao deadline and recovery contract v1

          ## Executable ordering

          `BaoSqliteProductRuntimeConfigV1::validate` rejects every configuration
          that does not satisfy:

          ```text
          0 < consumer_timeout_ms
            < forward_execution_lease_ms
            < absolute_operation_deadline_ms
          0 < recovery_lease_ms < absolute_operation_deadline_ms
          ```

          The final-use callback is synchronous and must enforce its own network or
          external-transaction timeout at or below `consumer_timeout_ms`. A timeout
          after secret delivery is never classified as a clean negative result. It
          enters the existing indeterminate/query path, and recovery only observes
          the original effect; it never re-enters the consumer.

          New work must stop before shutdown drain. Already-dispatched work may finish
          only inside the absolute operation deadline. After the deadline, a worker may
          query or settle durable evidence but may not redispatch the provider read or
          final-use callback.

          ## Just-in-time recovery claims

          `reconcile_due` claims one due row immediately before executing that row and
          repeats up to `recovery_batch_limit`. It never leases an entire batch ahead
          of serial work. The runtime exposes:

          - `claim_to_execution_start_seconds`;
          - `lease_remaining_at_execution_start_seconds`;
          - `claim_expired_before_execution_total`;
          - `reclaim_total`;
          - `claim_conflict_total`;
          - `oldest_reconciliation_age_seconds`.

          A nonzero `claim_expired_before_execution_total` is a correctness alert. A
          rising reclaim/conflict rate or oldest age is an operational saturation
          alert and must not be hidden by retrying faster.
          EOF

          cat > codex-rs/hepta-bao-adapter/qa/test_runtime_recovery_contract.py <<'PY'
          from pathlib import Path
          import unittest

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = (ROOT / "src/sqlite_product_runtime.rs").read_text(encoding="utf-8")

          class RuntimeRecoveryContractTests(unittest.TestCase):
              def test_recovery_claims_are_just_in_time(self):
                  start = SOURCE.index("pub async fn reconcile_due")
                  end = SOURCE.index("pub async fn metrics", start)
                  body = SOURCE[start:end]
                  self.assertIn("for _ in 0..self.config.recovery_batch_limit", body)
                  self.assertIn("self.config.recovery_lease_ms,\n                    1,", body)
                  self.assertNotIn("self.config.recovery_batch_limit,\n            )", body)

              def test_deadline_ordering_is_executable(self):
                  self.assertIn("self.consumer_timeout_ms >= self.forward_execution_lease_ms", SOURCE)
                  self.assertIn("self.forward_execution_lease_ms >= self.absolute_operation_deadline_ms", SOURCE)
                  self.assertIn("self.recovery_lease_ms >= self.absolute_operation_deadline_ms", SOURCE)

              def test_recovery_metrics_are_public(self):
                  for name in (
                      "claim_to_execution_start_seconds",
                      "lease_remaining_at_execution_start_seconds",
                      "claim_expired_before_execution_total",
                      "reclaim_total",
                      "claim_conflict_total",
                      "oldest_reconciliation_age_seconds",
                  ):
                      self.assertIn(name, SOURCE)

          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Format and verify runtime remediation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/hepta-bao-adapter/Cargo.toml --all
          python3 -m unittest \
            codex-rs/hepta-bao-adapter/qa/test_candidate_immutability.py \
            codex-rs/hepta-bao-adapter/qa/test_runtime_recovery_contract.py
          cargo test --locked --manifest-path codex-rs/hepta-bao-adapter/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path codex-rs/hepta-bao-adapter/Cargo.toml --all-targets -- -D warnings
          python3 codex-rs/hepta-bao-adapter/qa/verify_candidate_immutability.py
          git diff --check

      - name: Commit and fast-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta runtime remediator"
          git config user.email "hepta-runtime-remediator@users.noreply.github.com"
          git add codex-rs/hepta-bao-adapter/src/sqlite_product_runtime.rs \
            codex-rs/hepta-bao-adapter/qa/test_runtime_recovery_contract.py \
            docs/modules/secrets.heptabao/DEADLINE_AND_RECOVERY_CONTRACT_V1.md
          git commit -m "fix(secrets): claim recovery work just in time"
          git push origin HEAD:codex/secrets-heptabao-production-qualified-20260930

      - name: Remove one-shot tooling branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete codex/secrets-heptabao-runtime-remediation-20260930
