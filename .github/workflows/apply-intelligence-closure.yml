name: Apply intelligence control closure

on:
  push:
    branches:
      - codex/intelligence-control-product-closure
    paths:
      - scripts/apply-intelligence-control-product-closure.py
      - .github/workflows/apply-intelligence-closure.yml
      - codex-rs/hepta-agentd/src/intelligence_invocation_registry.rs
      - codex-rs/hepta-agentd/src/intelligence_learning_outbox.rs
      - codex-rs/hepta-agentd/src/intelligence_learning_outbox_tests.rs

permissions:
  contents: write

concurrency:
  group: intelligence-control-closure-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest isolated branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intelligence-control-product-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed source transform
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-intelligence-control-product-closure.py

      - name: Format and verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cd ..
          git diff --check

      - name: Commit transformed source candidate
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-intelligence-control-product-closure.py
          rm .github/workflows/apply-intelligence-closure.yml
          git add -A
          git config user.name "hepta-ci-bot"
          git config user.email "hepta-ci-bot@users.noreply.github.com"
          git commit -m "intelligence.control: bind canonical product identity"
          git push origin HEAD:codex/intelligence-control-product-closure
