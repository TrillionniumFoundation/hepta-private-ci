name: Intuition durable closure payload decode

on:
  pull_request:
    paths:
      - ".github/workflows/intuition-closure-authoring-once.yml"
      - "scripts/intuition_closure_author_once.b85.part*"

permissions:
  contents: read

concurrency:
  group: intuition-durable-closure-decode-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decode:
    name: Materialize reviewed durable closure source
    if: ${{ github.event.pull_request.head.ref == 'codex/intuition-policy-production-closure-20260927' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Decode and validate the staged source transformation
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import base64
          import bz2
          from pathlib import Path

          parts = sorted(Path("scripts").glob("intuition_closure_author_once.b85.part*"))
          if len(parts) != 4:
              raise SystemExit(f"expected four payload parts, found {len(parts)}")
          payload = b"".join(path.read_bytes() for path in parts)
          source = bz2.decompress(base64.b85decode(payload))
          output = Path("scripts/intuition_closure_author_decoded.py")
          output.write_bytes(source)
          compile(source, str(output), "exec")
          print(f"decoded {len(source)} bytes to {output}")
          PY
          git diff --check
          remote_sha="$(git ls-remote origin refs/heads/codex/intuition-policy-production-closure-20260927 | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA"
          git config user.name "Hepta Intuition Authoring"
          git config user.email "hepta-intuition-authoring@users.noreply.github.com"
          git add scripts/intuition_closure_author_decoded.py
          git commit -m "chore(intuition): materialize durable closure authoring source"
          git push origin HEAD:codex/intuition-policy-production-closure-20260927
