name: hcsn-currentstate-n256-authentic-initial-capsule

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_authentic_initial_capsule/**"
      - ".github/workflows/hcsn-currentstate-n256-authentic-initial-capsule.yml"

permissions:
  contents: read

jobs:
  authentic-initial-capsule-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNIQUE_EXECUTION_KEY: hcsn-n256-authentic-initial-capsule-20261121-c6bc-001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify precommitted source and fail-closed scope
        run: python3 -m qualification.hcsn_currentstate_n256_authentic_initial_capsule.verify_source
      - name: Synthetic serializer controls
        run: |
          python3 -m unittest qualification.hcsn_currentstate_n256_authentic_initial_capsule.test_capsule
          python3 -O -m unittest qualification.hcsn_currentstate_n256_authentic_initial_capsule.test_capsule
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_authentic_initial_capsule/*.py
      - name: Execute authentic initial-capsule readback once
        run: python3 -m qualification.hcsn_currentstate_n256_authentic_initial_capsule.run
      - name: Upload immutable zero-recurrence originals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-authentic-initial-capsule-001
          path: qualification/hcsn_currentstate_n256_authentic_initial_capsule/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 90
