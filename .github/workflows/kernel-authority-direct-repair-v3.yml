name: Kernel authority direct repair v3

on:
  push:
    branches:
      - work/kernel-authority-convergence-20260925
    paths:
      - '.github/workflows/kernel-authority-direct-repair-v3.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-authority-direct-repair-v3
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust qualification toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Repair, verify, publish and dispatch qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/kernel_authority_direct_repair_v3.sh

# Manual deterministic trigger: 2026-09-28, x64 runner fallback
