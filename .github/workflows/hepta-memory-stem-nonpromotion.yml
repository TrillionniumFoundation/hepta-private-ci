name: MemoryCell pinned successful native nonpromotion gate
on:
  push:
    branches: ["codex/memory-cell-evidence-20261008"]
    paths:
      - "scripts/memory_cell/stem_native_nonpromotion.py"
      - "scripts/memory_cell/test_stem_native_nonpromotion.py"
      - ".github/workflows/hepta-memory-stem-nonpromotion.yml"
permissions:
  contents: read
  actions: read
jobs:
  audit-success-without-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test exact source failure-closed acceptance
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-nonpromotion
          git rev-parse HEAD > /tmp/native-nonpromotion/auditing-commit.txt
          git rev-parse HEAD^{tree} > /tmp/native-nonpromotion/auditing-tree.txt
          python3 -m unittest -v test_stem_native_nonpromotion 2>&1 | tee /tmp/native-nonpromotion/tests.log
      - name: Retrieve immutable completed strict-native matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11722640804/zip > /tmp/strict-native-success.zip
          printf '%s  %s\n' 0a1e21d6d7b5161dddde743f182b9c2820750b09f5f3384ed38a840ab704f228 /tmp/strict-native-success.zip | sha256sum -c -
      - name: Audit original 576 source/answer rows and reject scale-up
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from stem_audit_archive import PinnedArchive, require
          from stem_native_nonpromotion import audit_nonpromotion
          archive = PinnedArchive(
              Path('/tmp/strict-native-success.zip'),
              '0a1e21d6d7b5161dddde743f182b9c2820750b09f5f3384ed38a840ab704f228',
          )
          try:
              require(
                  archive.read('tested-commit.txt').decode().strip() ==
                  '06f081daa780dafa4bed0ff20def0999702b299f',
                  'strict-native successful generation commit drift',
              )
              report = archive.json('comparison/report.json')
              receipt = audit_nonpromotion(report)
              receipt['generating_commit'] = '06f081daa780dafa4bed0ff20def0999702b299f'
              receipt['archive_sha256'] = archive.sha256
              receipt['verified_members'] = archive.manifest_entries
              path = Path('/tmp/native-nonpromotion/receipt.json')
              with path.open('x') as output:
                  json.dump(receipt, output, sort_keys=True, indent=2, allow_nan=False)
              print(json.dumps(receipt, sort_keys=True))
          finally:
              archive.close()
          PY
      - name: Retain exact source and all audit receipts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-nonpromotion/source
          cp scripts/memory_cell/stem_native_nonpromotion.py scripts/memory_cell/test_stem_native_nonpromotion.py scripts/memory_cell/stem_audit_archive.py /tmp/native-nonpromotion/source/
          cp .github/workflows/hepta-memory-stem-nonpromotion.yml /tmp/native-nonpromotion/source/
          (cd /tmp/native-nonpromotion && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-stem-strict-native-nonpromotion
          path: /tmp/native-nonpromotion
          if-no-files-found: error
