name: runtime.codex ARM64 source materialization

on:
  push:
    branches:
      - automation/runtime-codex-materialize-arm64-20260930
    paths:
      - .github/workflows/runtime-codex-materialize-arm64.yml

permissions:
  contents: write

concurrency:
  group: runtime-codex-arm64-source-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true
          clean: true
      - name: Validate isolated ARM64 lane
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_REF}" = "refs/heads/automation/runtime-codex-materialize-arm64-20260930"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Materialize ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            scripts/runtime-codex-maintainer.py
            scripts/runtime-codex-maintainer-followup.py
            scripts/runtime-codex-durability-migration.py
            scripts/runtime-codex-durability-fixup.py
            scripts/runtime-codex-quarantine-migration.py
            scripts/runtime-codex-deadline-migration.py
            scripts/runtime-codex-cleanup-migration.py
            scripts/runtime-codex-storage-fixup.py
            scripts/runtime-codex-terminal-outbox-migration.py
            scripts/runtime-codex-product-executor-migration.py
            scripts/runtime-codex-product-executor-hardening.py
            scripts/runtime-codex-structured-sequence-migration.py
            scripts/runtime-codex-process-crash-migration.py
            scripts/runtime-codex-qualification-fixup.py
            scripts/runtime-codex-final-closure.py
          )
          python3 -m py_compile "${scripts[@]}" \
            scripts/runtime-codex-finalize-map.py \
            scripts/runtime-codex-finalize-map-followup.py
          for script in "${scripts[@]}"; do
            echo "materialize: ${script}"
            python3 "$script"
          done
          (
            cd codex-rs
            cargo fmt --all
          )
          git diff --check
          test -n "$(git status --porcelain=v1)"
          git status --short
      - name: Commit only to the isolated ARM64 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'runtime.codex source materializer'
          git config user.email 'runtime-codex-materializer@invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix(runtime.codex): materialize durable convergence source'
          git push origin HEAD:refs/heads/automation/runtime-codex-materialize-arm64-20260930
