name: Prompt optimizer source map

on:
  pull_request:
    paths:
      - "codex-rs/hepta-prompt-optimizer/**"
      - "codex-rs/hepta-agentd/src/prompt_runtime.rs"
      - "codex-rs/hepta-agentd/src/bin/prompt_optimizer_product.rs"
      - "codex-rs/hepta-intelligence/src/prompt_*.rs"
      - "codex-rs/hepta-learning-ledger/src/signed_evidence*"
      - "codex-rs/hepta-kg/**"
      - "codex-rs/hepta-context-compiler/**"
      - "codex-rs/rust-toolchain.toml"
      - "docs/contracts/PROTOCOL_SCHEMAS.json"
      - "docs/modules/prompt.optimizer/**"
      - "qualification/module-execution-dossiers/detail/prompt.optimizer.md"
      - "scripts/verify_prompt_optimizer_map.py"
      - "scripts/test_verify_prompt_optimizer_map.py"
      - ".github/workflows/prompt-optimizer-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-optimizer-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain tracked source identity for reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prompt-optimizer-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/prompt-optimizer-evidence/source-identity.txt"
          git archive --format=tar HEAD \
            codex-rs/hepta-prompt-optimizer \
            codex-rs/hepta-learning-ledger \
            codex-rs/hepta-agentd \
            codex-rs/hepta-intelligence \
            codex-rs/hepta-codex-adapter \
            codex-rs/hepta-context-compiler \
            codex-rs/hepta-prompt-registry \
            codex-rs/hepta-kg \
            codex-rs/hepta-types \
            codex-rs/core/src/model_provider_policy \
            codex-rs/app-server/src \
            codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/rust-toolchain.toml \
            docs/modules/prompt.optimizer docs/contracts/PROTOCOL_SCHEMAS.json \
            scripts/verify_prompt_optimizer_map.py scripts/test_verify_prompt_optimizer_map.py \
            qualification/module-execution-dossiers/detail/prompt.optimizer.md \
            > "$RUNNER_TEMP/prompt-optimizer-evidence/source.tar"
          sha256sum "$RUNNER_TEMP/prompt-optimizer-evidence/source.tar" > "$RUNNER_TEMP/prompt-optimizer-evidence/source.sha256"
      - name: Upload exact tracked source
        uses: actions/upload-artifact@v4
        with:
          name: prompt-optimizer-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/prompt-optimizer-evidence/source*
          if-no-files-found: error
          retention-days: 7
      - name: Test source-map discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_verify_prompt_optimizer_map.py' -v 2>&1 | tee "$RUNNER_TEMP/prompt-optimizer-evidence/map-tests.log"
      - name: Verify source-derived implementation map
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_prompt_optimizer_map.py 2>&1 | tee "$RUNNER_TEMP/prompt-optimizer-evidence/map.log"
          git diff --check
      - name: Install the repository Rust toolchain
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustc --version --verbose | tee "$RUNNER_TEMP/prompt-optimizer-evidence/toolchain.txt"
      - name: Test canonical and compatibility surfaces
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-prompt-optimizer 2>&1 | tee "$RUNNER_TEMP/prompt-optimizer-evidence/optimizer-tests.log"
      - name: Check product consumers
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets 2>&1 | tee "$RUNNER_TEMP/prompt-optimizer-evidence/consumer-check.log"
      - name: Strict optimizer lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-prompt-optimizer --all-targets --no-deps -- -D warnings 2>&1 | tee "$RUNNER_TEMP/prompt-optimizer-evidence/optimizer-clippy.log"
      - name: Upload actual command diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-optimizer-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/prompt-optimizer-evidence/*.log
            ${{ runner.temp }}/prompt-optimizer-evidence/*.txt
          if-no-files-found: warn
          retention-days: 14
