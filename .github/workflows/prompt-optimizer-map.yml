name: Prompt optimizer source map

on:
  pull_request:
    paths:
      - "codex-rs/hepta-prompt-optimizer/**"
      - "codex-rs/hepta-agentd/src/prompt_runtime.rs"
      - "codex-rs/hepta-agentd/src/bin/prompt_optimizer_product.rs"
      - "codex-rs/hepta-intelligence/src/prompt_*.rs"
      - "docs/modules/prompt.optimizer/**"
      - "qualification/module-execution-dossiers/detail/prompt.optimizer.md"
      - "scripts/verify_prompt_optimizer_map.py"
      - ".github/workflows/prompt-optimizer-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-optimizer-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source-derived implementation map
        run: |
          set -euo pipefail
          python3 scripts/verify_prompt_optimizer_map.py
          git diff --check
      - name: Test canonical and compatibility surfaces
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-prompt-optimizer
          cargo check --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --all-targets
