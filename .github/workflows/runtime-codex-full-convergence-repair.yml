name: runtime.codex full convergence repair

on:
  push:
    branches:
      - codex/runtime-codex-full-convergence-20260927

permissions:
  contents: write

concurrency:
  group: runtime-codex-full-convergence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-qualify:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-codex-full-converged]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Resolve verified sandboxed V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Apply bounded source repair
        run: |
          python3 -m py_compile scripts/apply_runtime_codex_full_convergence.py
          python3 scripts/apply_runtime_codex_full_convergence.py

      - name: Format repaired source
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Verify repair script idempotence guard
        run: |
          if python3 scripts/apply_runtime_codex_full_convergence.py 2>repair-second-run.err; then
            echo 'repair script unexpectedly applied twice' >&2
            exit 1
          fi
          grep -Eq 'expected one|stale API|expected [0-9]+ occurrences' repair-second-run.err

      - name: Focused owner and protocol tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-infer-core native_control
          cargo test --locked -p codex-hepta-agentd lane_b_runtime
          cargo test --locked -p codex-hepta-infer-worker-host --lib
          cargo test --locked -p codex-hepta-infer-worker-host --test runtime_codex_crash_matrix

      - name: Runtime Codex product E2E
        working-directory: codex-rs
        run: >-
          cargo test --locked -p codex-hepta-agentd
          runtime_codex_product_caller_commits_one_authorized_terminal_turn
          -- --exact --nocapture

      - name: Strict Clippy for changed owners
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-infer-core
          -p codex-hepta-agent-protocol
          -p codex-hepta-agentd
          -p codex-hepta-infer-worker-host
          --all-targets -- -D warnings

      - name: Commit exact tested repair
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          rm -f repair-second-run.err
          rm -f scripts/apply_runtime_codex_full_convergence.py
          rm -f .github/workflows/runtime-codex-full-convergence-repair.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'runtime-codex-convergence-bot'
          git config user.email 'runtime-codex-convergence-bot@users.noreply.github.com'
          git commit -m "runtime.codex: close effect-entry and structured execution gaps [runtime-codex-full-converged]

Tested from exact source head ${SOURCE_HEAD} with Rust 1.95.0. Adds the server-owned irreversible effect-entry marker, local durable entry proof, exact owner reconciliation, typestate orchestration, monotonic deadline budget, bounded thread cleanup, signed quarantine verifier, and executable crash-window matrix.

This is repository source qualification only. Real issuer key custody, trusted time/revocation distribution, target-host process identity, real provider terminality, canary, promotion, and release remain external gates."
          git push origin HEAD:${GITHUB_REF_NAME}
