name: Neuron V2 pinned native maintenance
on:
  push:
    branches: [codex/neuron-runtime-durable-closure-v1]
    paths: ['.github/workflows/neuron-v2-native-maintenance.yml']
permissions:
  contents: read
concurrency:
  group: neuron-v2-pinned-native-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/codex/neuron-runtime-durable-closure-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
      base: ${{ steps.commit.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check the authorized parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 20ffee8fbfc972d9837ef070aa7476595cbdbe4f
          mkdir -p "$RUNNER_TEMP/neuron-maintenance"
      - name: Format the actual Rust source
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-neuron
          rustfmt --edition 2024 hepta-infer-worker-host/src/durable_neuron_feature.rs hepta-infer-worker-host/src/durable_neuron_feature_tests.rs
          git diff --check
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.40.0
          fallback: none
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
      - name: Regenerate the repository dependency lock
        continue-on-error: true
        shell: bash
        run: |
          set +e
          just bazel-lock-update > "$RUNNER_TEMP/neuron-maintenance/bazel-lock-update.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/neuron-maintenance/bazel-lock-update.exit"
          cat "$RUNNER_TEMP/neuron-maintenance/bazel-lock-update.log"
          if [ "$code" -ne 0 ]; then
            git restore -- MODULE.bazel.lock
          fi
          exit "$code"
      - name: Commit source before read-only checks
        id: commit
        env:
          EXPECTED_TRIGGER: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          names = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          exact = {'MODULE.bazel.lock', 'codex-rs/hepta-infer-worker-host/src/durable_neuron_feature.rs', 'codex-rs/hepta-infer-worker-host/src/durable_neuron_feature_tests.rs'}
          assert all(p.startswith('codex-rs/hepta-neuron/') or p in exact for p in names), names
          PY
          test "$(git ls-remote origin refs/heads/codex/neuron-runtime-durable-closure-v1 | cut -f1)" = "$EXPECTED_TRIGGER"
          git config user.name 'neuron-runtime-maintenance'
          git config user.email 'qualification@invalid.local'
          git add codex-rs/hepta-neuron codex-rs/hepta-infer-worker-host/src/durable_neuron_feature.rs codex-rs/hepta-infer-worker-host/src/durable_neuron_feature_tests.rs MODULE.bazel.lock
          git rm .github/workflows/neuron-v2-native-maintenance.yml
          git diff --cached --check
          git commit -m 'style(neuron): commit native formatting and successful lock maintenance before qualification'
          git push origin HEAD:refs/heads/codex/neuron-runtime-durable-closure-v1
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git archive HEAD | gzip > "$RUNNER_TEMP/neuron-maintenance/source.tar.gz"
          printf 'source=%s\ntree=%s\nbase=%s\nactivation=false\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-parse origin/main)" > "$RUNNER_TEMP/neuron-maintenance/identity.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuron-v2-native-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/neuron-maintenance/
          if-no-files-found: error
  native:
    needs: maintain
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        candidate: [source-head, synthetic-merge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.maintain.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.40.0,cargo-nextest@0.9.102
          fallback: none
      - name: Qualify exact committed source without repair
        env:
          NEURON_SOURCE_SHA: ${{ needs.maintain.outputs.source }}
          NEURON_BASE_SHA: ${{ needs.maintain.outputs.base }}
          NEURON_CANDIDATE: ${{ matrix.candidate }}
          NEURON_EVIDENCE_DIR: ${{ runner.temp }}/neuron-v2-evidence
        run: bash scripts/neuron/qualify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuron-v2-${{ matrix.os }}-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neuron-v2-evidence/
          if-no-files-found: error
