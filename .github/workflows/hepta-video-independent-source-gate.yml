name: Independent video source identity gate (research only)
on:
  pull_request:
    paths:
      - "qualification/stem-video-independent-source/**"
      - ".github/workflows/hepta-video-independent-source-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-preflight-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Execute fail-closed stdlib source identity tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/stem-video-independent-source -p 'test_*.py' -v
          python3 -m py_compile qualification/stem-video-independent-source/source_gate.py qualification/stem-video-independent-source/test_source_gate.py
          git diff --exit-code
