name: Hepta global blocker convergence controller

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/hepta-global-gap-closure-controller.yml
      - scripts/hepta-global-gap-closure.py
      - ops/global-gap-closure/CONTROLLER.md
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact remote base ref
        required: false
        default: origin/ops/hepta-final-convergence-review-anchor-20260909
      target_branch:
        description: Dedicated convergence candidate branch
        required: false
        default: integration/hepta-global-gap-closure-20260910

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: hepta-global-gap-closure-controller
  cancel-in-progress: false

jobs:
  converge:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HEPTA_CONVERGENCE_BASE: ${{ inputs.base_ref || 'origin/ops/hepta-final-convergence-review-anchor-20260909' }}
      HEPTA_CONVERGENCE_TARGET: ${{ inputs.target_branch || 'integration/hepta-global-gap-closure-20260910' }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out exact controller source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind controller identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD HEAD^{tree}
          rustc --version
          cargo --version
          python3 --version
          cp scripts/hepta-global-gap-closure.py "${RUNNER_TEMP}/hepta-global-gap-closure.py"

      - name: Materialize and qualify the global candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/hepta-global-gap-closure.py"

      - name: Upload convergence receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-global-gap-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/global-gap-closure
          if-no-files-found: warn
          retention-days: 7
