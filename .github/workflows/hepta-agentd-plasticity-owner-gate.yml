name: Hepta Agentd Plasticity Owner Readiness Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codex-rs/hepta-agentd/src/plasticity_learning_producer.rs'
      - 'codex-rs/hepta-agentd/src/plasticity_runtime.rs'
      - 'codex-rs/hepta-agentd/src/plasticity_runtime_lifetime_tests.rs'
      - 'codex-rs/hepta-agentd/src/state.rs'
      - 'codex-rs/hepta-agentd/src/lib.rs'
      - '.github/workflows/hepta-agentd-plasticity-owner-gate.yml'

permissions:
  contents: read

jobs:
  native-agentd-plasticity-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Rust 1.95 toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Full Rust workspace formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Strict transitive Agentd owner Clippy
        run: cargo +1.95.0 clippy --locked -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Strict original Stem/Head Worker owner and dependency Clippy
        run: |
          cargo +1.95.0 clippy --locked -p codex-hepta-infer-core             -p codex-hepta-infer-worker-host --all-targets -- -D warnings
      - name: Real bounded Plasticity owner restart and idempotent CAS/anchor replay
        run: |
          cargo +1.95.0 test --locked -p codex-hepta-agentd --lib             plasticity_runtime::lifetime_tests::agentd_lifetime_owner_submits_restarts_and_reconciles_idempotently             -- --exact --nocapture
