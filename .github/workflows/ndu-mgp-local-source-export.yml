name: NDU P0 frozen-source local transfer (research only)

on:
  push:
    branches: [research/ndu-mgp-local-source-export-20261022]
    paths: [.github/workflows/ndu-mgp-local-source-export.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndu-mgp-source-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-source-export:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact frozen research candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 75107ba81170add170607fc0dba712ff0cc24a83
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            experiments/ndu_latent_riccati

      - name: Verify frozen source and build offline import bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root=pathlib.Path("experiments/ndu_latent_riccati")
          source_sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          expected="75107ba81170add170607fc0dba712ff0cc24a83"
          assert source_sha==expected, (source_sha,expected)
          freeze=json.loads((root/"SOURCE_FREEZE.json").read_text())
          request=json.loads((root/"CLOUD_RUN_REQUEST.json").read_text())
          assert freeze["implementation_commit"]==request["implementation_commit"]
          assert freeze["files"]["protocol.json"]==request["protocol_sha256"]
          assert freeze["formal_heldout_accessed"] is False
          for relative,digest in freeze["files"].items():
              p=root/relative
              assert p.is_file() and not p.is_symlink(),relative
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,relative
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"ndu-p0-frozen-transfer"
          output.mkdir(parents=True,exist_ok=True)
          files=sorted(p for p in root.rglob("*") if p.is_file() and not p.is_symlink()
                       and "__pycache__" not in p.parts)
          assert 15<=len(files)<=100
          checks={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in files}
          receipt={"scope":"P0 research source only, NO model weights and NO heldout outputs",
                   "source_sha":source_sha,"source_files":len(files),
                   "freeze_hashes_verified":len(freeze["files"]),
                   "file_sha256":checks,"scientific_success":False,
                   "dedicated_runner_verified":False,"production_authorized":False}
          (output/"source-receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          with tarfile.open(output/"ndu-p0-frozen-source.tar.gz","w:gz") as archive:
              for p in files:
                  archive.add(p,arcname=p.as_posix(),recursive=False)
          print(json.dumps({k:v for k,v in receipt.items() if k!="file_sha256"},sort_keys=True))
          PY

      - name: Upload non-secret frozen experimental source for local CPU reproduction
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ndu-p0-local-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndu-p0-frozen-transfer
          if-no-files-found: error
          retention-days: 7
