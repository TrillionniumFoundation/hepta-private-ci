name: Runtime Codex Offline Build Inputs

on:
  push:
    branches: [codex/runtime-codex-integration-20260928]
    paths: [.github/workflows/runtime-codex-build-material.yml]

permissions:
  contents: read

jobs:
  inputs:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Snapshot locked dependency sources without repository mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rcx-build/toolchain" "$RUNNER_TEMP/rcx-build/tools"
          cd codex-rs
          cargo vendor --locked --versioned-dirs "$RUNNER_TEMP/rcx-build/vendor" > "$RUNNER_TEMP/rcx-build/vendor-config.toml"
          git diff --exit-code
      - name: Download official Linux compiler components with published checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rcx-build/toolchain"
          for component in rustc cargo rust-std rustfmt clippy; do
            asset="${component}-1.95.0-x86_64-unknown-linux-gnu.tar.xz"
            curl --fail --location --retry 3 "https://static.rust-lang.org/dist/$asset" -o "$asset"
            curl --fail --location --retry 3 "https://static.rust-lang.org/dist/$asset.sha256" -o "$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
          done
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Retain verified V8 and official test tools
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/rusty_v8" "$RUNNER_TEMP/rcx-build/v8"
          curl --fail --location --retry 3 https://github.com/casey/just/releases/download/1.51.0/just-1.51.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/rcx-build/tools/just.tar.gz"
          curl --fail --location --retry 3 https://get.nexte.st/latest/linux -o "$RUNNER_TEMP/rcx-build/tools/nextest.tar.gz"
      - name: Archive inputs with exact source and lock identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/rcx-build/source-head.txt"
          shasum -a 256 codex-rs/Cargo.lock > "$RUNNER_TEMP/rcx-build/cargo-lock.sha256"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rcx-build'
          manifest = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and 'vendor' not in p.relative_to(root).parts}
          (root / 'input-manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          PY
          tar -czf "$RUNNER_TEMP/runtime-codex-build-inputs.tgz" -C "$RUNNER_TEMP" rcx-build
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: runtime-codex-offline-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-codex-build-inputs.tgz
          retention-days: 3
          if-no-files-found: error
