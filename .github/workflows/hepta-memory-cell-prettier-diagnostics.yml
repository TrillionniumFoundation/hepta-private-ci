name: MemoryCell Prettier source diagnostics
on:
  pull_request:
    paths:
      - ".github/workflows/hepta-memory-cell-lab.yml"
      - ".github/workflows/hepta-memory-cell-continuation.yml"
      - ".github/workflows/hepta-memory-cell-full-benchmark.yml"
      - ".github/workflows/hepta-memory-cell-prettier-diagnostics.yml"
permissions:
  contents: read
concurrency:
  group: memory-cell-prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Install exact repository Prettier dependencies
        run: pnpm install --frozen-lockfile
      - name: Emit exact Prettier source diff without remote write permission
        run: |
          set -euo pipefail
          pnpm exec prettier --write .github/workflows/hepta-memory-cell-continuation.yml .github/workflows/hepta-memory-cell-full-benchmark.yml .github/workflows/hepta-memory-cell-lab.yml
          git diff --binary -- .github/workflows/hepta-memory-cell-continuation.yml .github/workflows/hepta-memory-cell-full-benchmark.yml .github/workflows/hepta-memory-cell-lab.yml > /tmp/prettier.patch
          cat /tmp/prettier.patch
          git diff --exit-code -- .github/workflows/hepta-memory-cell-continuation.yml .github/workflows/hepta-memory-cell-full-benchmark.yml .github/workflows/hepta-memory-cell-lab.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-prettier-diagnostics
          path: /tmp/prettier.patch
          if-no-files-found: warn
