# Materialize the digest-pinned final-hardening patch into ordinary tracked source.
name: Apply secrets.heptabao final hardening

on:
  push:
    branches:
      - codex/secrets-heptabao-final-hardening-20260928
    paths:
      - ".hepta-bootstrap/secrets-final-hardening/**"
      - ".github/workflows/hepta-bootstrap-apply-secrets-final-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-bootstrap-secrets-final-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate final-hardening patch
        shell: bash
        run: |
          set -euo pipefail
          base="074de71f0feb032cc1b61c49da1aa0a8af00ea86"
          shopt -s nullglob
          parts=(.hepta-bootstrap/secrets-final-hardening/part-*)
          test "${#parts[@]}" -eq 8
          bundle="$RUNNER_TEMP/secrets-final-hardening.patch.gz.b64"
          patch="$RUNNER_TEMP/secrets-final-hardening.patch"
          fixup=".hepta-bootstrap/secrets-final-hardening/fixup.patch"
          cat "${parts[@]}" > "$bundle"
          test "$(git rev-list --count "$base"..HEAD)" -ge 1
          git merge-base --is-ancestor "$base" HEAD
          while IFS= read -r path; do
            case "$path" in
              .hepta-bootstrap/secrets-final-hardening/part-??|.hepta-bootstrap/secrets-final-hardening/fixup.patch|.github/workflows/hepta-bootstrap-apply-secrets-final-hardening.yml)
                ;;
              *)
                echo "bootstrap head contains unexpected path before apply: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$base"..HEAD)
          echo "565ccaad2b2aa61b8d18c4fea808046fa75afe10fe4ccdafff5ead902e876360  $bundle" | sha256sum -c -
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          echo "367195ea3bfc989ff4b6331e4a07720c9c4e0d3d77123c0419f41efeec209114  $patch" | sha256sum -c -
          validate_paths() {
            git apply --numstat "$1" | while IFS=$'\t' read -r _added _deleted path; do
              case "$path" in
                .github/workflows/hepta-secrets-recovery.yml|codex-rs/hepta-bao-adapter/*|docs/modules/secrets.heptabao/*|docs/lane-a-foundation/secrets.heptabao/*|docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json|scripts/generate_secrets_heptabao_module.py)
                  ;;
                *)
                  echo "final-hardening patch touches unapproved path: $path" >&2
                  exit 1
                  ;;
              esac
            done
          }
          git apply --stat "$patch"
          validate_paths "$patch"
          git apply --check "$patch"
          git apply "$patch"
          if test -f "$fixup"; then
            echo "fded9b77df166737c62858426e1def648af87ec12abb92fee9ea4ca9f17a0d6f  $fixup" | sha256sum -c -
            git apply --stat "$fixup"
            validate_paths "$fixup"
            git apply --check "$fixup"
            git apply "$fixup"
          fi
          git status --short > "$RUNNER_TEMP/applied-status.txt"

      - name: Retain exact reconstructed patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-final-hardening-patch-${{ github.sha }}
          path: |
            ${{ runner.temp }}/secrets-final-hardening.patch
            .hepta-bootstrap/secrets-final-hardening/fixup.patch
            ${{ runner.temp }}/applied-status.txt
          if-no-files-found: error
          retention-days: 2

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify projections and non-native regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py
          python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*.py' -v

      - name: Format and execute native qualification
        shell: bash
        run: |
          set -euo pipefail
          {
            cd codex-rs
            cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
            cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- --test-threads=2
            cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- -D warnings
            cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2
            cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2
          } 2>&1 | tee "$RUNNER_TEMP/native-qualification.log"

      - name: Retain native qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-final-hardening-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-qualification.log
            ${{ runner.temp }}/applied-status.txt
          if-no-files-found: warn
          retention-days: 2

      - name: Reverify generated truth after formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py
          git diff --check

      - name: Commit qualified final hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hepta-bootstrap/secrets-final-hardening
          rm -f .github/workflows/hepta-bootstrap-apply-secrets-final-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta secrets hardening bot"
          git config user.email "hepta-secrets-hardening@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No final-hardening changes remain."
            exit 0
          fi
          git commit -m "secrets: harden recovery capacity diagnostics and qualification"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
