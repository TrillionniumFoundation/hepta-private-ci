name: Hepta knowledge.graph qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-kg/**"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/hepta-prompt-optimizer/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/ext/hepta-memory/**"
      - "codex-rs/app-server/**"
      - "docs/modules/knowledge.graph/**"
      - "qualification/module-execution-dossiers/detail/knowledge.graph.md"
      - "qualification/module-execution-dossiers/DETAILS.json"
      - "scripts/hepta-implementation-maps.py"
      - "scripts/hepta-knowledge-graph-target-measure.py"
      - "scripts/test_hepta_knowledge_graph_target_measure.py"
      - "scripts/test_hepta_knowledge_graph_product_witness.py"
      - "qualification/knowledge-graph/**"
      - ".github/actions/hepta-synthetic-merge/**"
      - ".github/workflows/hepta-knowledge-graph-qualification.yml"
  push:
    branches: [main]
    paths:
      - "codex-rs/hepta-kg/**"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/hepta-prompt-optimizer/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/ext/hepta-memory/**"
      - "codex-rs/app-server/**"
      - "docs/modules/knowledge.graph/**"
      - "qualification/module-execution-dossiers/detail/knowledge.graph.md"
      - "qualification/module-execution-dossiers/DETAILS.json"
      - "scripts/hepta-implementation-maps.py"
      - "scripts/hepta-knowledge-graph-target-measure.py"
      - "scripts/test_hepta_knowledge_graph_target_measure.py"
      - "scripts/test_hepta_knowledge_graph_product_witness.py"
      - "qualification/knowledge-graph/**"
      - ".github/workflows/hepta-knowledge-graph-qualification.yml"

permissions:
  contents: read

concurrency:
  group: hepta-knowledge-graph-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR heads cannot satisfy current qualification and may be cancelled.
  # Mainline evidence remains non-cancellable and SHA-specific.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  qualification:
    name: knowledge.graph (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD HEAD^{tree}

      - name: Construct deterministic synthetic merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta KG CI
          author-email: hepta-kg-ci@users.noreply.github.com
          message: Synthetic merge

      - name: Bind tested candidate identity
        shell: bash
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD HEAD^{tree}

      - name: Verify knowledge.graph closed-world truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py verify

      - name: Observe repository-wide detailed-design health
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Global design health is still visible and remains enforced by its
          # owning workflows. Unrelated module drift must not suppress the
          # exact-candidate knowledge.graph executable evidence below.
          python3 scripts/hepta-technical-closure.py verify

      - name: Validate target measurement evidence parser
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/test_hepta_knowledge_graph_target_measure.py
          python3 scripts/test_hepta_knowledge_graph_product_witness.py
          python3 scripts/hepta-knowledge-graph-target-measure.py --self-test

      - name: Check KG-owned Rust formatting
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-kg --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer --package codex-hepta-memory \
            --package codex-hepta-agentd -- --check

      - name: Prepare native test prerequisites
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve verified sandboxed V8 artifacts
        if: ${{ !cancelled() }}
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      # Keep native feedback independent; earlier failed gates still fail this
      # job. No skipped, missing or failed result is converted into acceptance.
      - name: Test canonical KG kernel
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-kg -- --nocapture

      - name: Test prompt-factor owner, projection and real consumer
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-prompt-registry -- --nocapture
          cargo test --locked -p codex-hepta-prompt-optimizer -- --nocapture

      - name: Test durable cognitive KG owner and recovery
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-memory --lib -- --nocapture --test-threads=1

      - name: Crash/reopen KG transaction windows
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-memory --lib \
            cognitive_store_tests::qualification_kg_projection_crash_windows_restore_exact_predecessor \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Test default Agentd production cognitive-writer profile
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd \
            --test cognitive_product_e2e -- --nocapture --test-threads=1

      - name: Test qualification witness on top of product writer
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            --test cognitive_product_e2e -- --nocapture --test-threads=1

      - name: Strict KG lint
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p codex-hepta-kg -p codex-hepta-prompt-registry \
            -p codex-hepta-prompt-optimizer -p codex-hepta-memory -p codex-hepta-agentd \
            --no-deps --all-targets --features codex-hepta-agentd/qualification-cognitive-write \
            -- -D warnings

      - name: Measure PERF-LIBRARY pilot capacity
        if: ${{ !cancelled() && matrix.lane == 'source-head' }}
        timeout-minutes: 20
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked --release -p codex-hepta-memory --lib \
            cognitive_kg_benchmark_tests::qualification_knowledge_graph_capacity_receipt \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Preserve exact tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
