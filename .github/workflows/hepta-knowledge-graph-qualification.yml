name: Hepta knowledge.graph qualification

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-kg/**'
      - 'codex-rs/hepta-memory/src/cognitive_kg*'
      - 'codex-rs/hepta-memory/src/cognitive_intelligence_writer*'
      - 'codex-rs/hepta-memory/src/cognitive_retrieval*'
      - 'codex-rs/hepta-memory/src/cognitive_store*'
      - 'codex-rs/hepta-memory/migrations/**'
      - 'codex-rs/hepta-prompt-registry/**'
      - 'codex-rs/hepta-prompt-optimizer/**'
      - 'codex-rs/ext/hepta-memory/src/cognitive/**'
      - 'codex-rs/hepta-agentd/src/production_writer_host.rs'
      - 'codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/rust-toolchain*'
      - 'justfile'
      - 'scripts/hepta_knowledge_graph_qualification.py'
      - 'scripts/test_hepta_knowledge_graph_qualification.py'
      - 'scripts/test_hepta_kg_product_evidence.py'
      - 'scripts/hepta_ci_exec.py'
      - 'scripts/test_hepta_ci_exec*.py'
      - 'qualification/knowledge-graph/nextest.toml'
      - '.github/workflows/hepta-knowledge-graph-qualification.yml'
      - '.github/actions/hepta-synthetic-merge/**'
  push:
    branches: [main]
    paths:
      - 'codex-rs/hepta-kg/**'
      - 'codex-rs/hepta-memory/src/cognitive_kg*'
      - 'codex-rs/hepta-memory/src/cognitive_intelligence_writer*'
      - 'codex-rs/hepta-memory/src/cognitive_retrieval*'
      - 'codex-rs/hepta-memory/src/cognitive_store*'
      - 'codex-rs/hepta-memory/migrations/**'
      - 'codex-rs/hepta-prompt-registry/**'
      - 'codex-rs/hepta-prompt-optimizer/**'
      - 'codex-rs/ext/hepta-memory/src/cognitive/**'
      - 'codex-rs/hepta-agentd/src/production_writer_host.rs'
      - 'codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/rust-toolchain*'
      - 'justfile'
      - 'scripts/hepta_knowledge_graph_qualification.py'
      - 'scripts/test_hepta_knowledge_graph_qualification.py'
      - 'scripts/test_hepta_kg_product_evidence.py'
      - 'scripts/hepta_ci_exec.py'
      - 'scripts/test_hepta_ci_exec*.py'
      - 'qualification/knowledge-graph/nextest.toml'
      - '.github/workflows/hepta-knowledge-graph-qualification.yml'
      - '.github/actions/hepta-synthetic-merge/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-knowledge-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

jobs:
  qualification:
    name: knowledge.graph (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      HEPTA_CI_LANE: ${{ matrix.lane }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD HEAD^{tree}
          records="$RUNNER_TEMP/hepta-kg-${HEPTA_CI_LANE}"
          mkdir -p "$records"
          printf 'RECORDS_DIR=%s\n' "$records" >> "$GITHUB_ENV"
          printf 'source=%s\nbase=%s\nlane=%s\nstatus=awaiting-candidate-binding\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$HEPTA_CI_LANE" > "$records/setup.txt"

      - name: Construct deterministic synthetic merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta KG CI
          author-email: hepta-kg-ci@users.noreply.github.com
          message: Synthetic merge

      - name: Bind tested candidate identity
        id: identity
        shell: bash
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA" >> "$GITHUB_ENV"
          git show -s --format='commit=%H%ntree=%T%nparents=%P' HEAD > "$RECORDS_DIR/candidate.txt"
          cd codex-rs
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          rustc --version --verbose > "$RECORDS_DIR/toolchain.txt"
          cargo --version >> "$RECORDS_DIR/toolchain.txt"

      - name: Verify exact command and workflow failure semantics
        run: python3 -m unittest discover -v -s scripts -p 'test_hepta_knowledge_graph_qualification.py'

      - name: Install pinned repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Prepare native test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Execute required KG commands and retain every outcome
        id: qualification
        env:
          # Preserve the full declared workload; these are observations, not SLOs.
          HEPTA_KG_BENCH_WRITES: '256'
          HEPTA_KG_BENCH_QUERY_SAMPLES: '20'
          HEPTA_KG_BENCH_REOPEN_SAMPLES: '5'
        run: python3 scripts/hepta_knowledge_graph_qualification.py --records "$RECORDS_DIR/commands"

      - name: Observe repository-wide detailed-design health
        if: always() && steps.identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # This advisory remains separate from all required command results.
          python3 scripts/hepta_ci_exec.py --output "$RECORDS_DIR/detailed-design.json" -- python3 scripts/hepta-technical-closure.py verify

      - name: Preserve exact tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Retain exact source and merge outcomes, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-kg-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-kg-${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 30
