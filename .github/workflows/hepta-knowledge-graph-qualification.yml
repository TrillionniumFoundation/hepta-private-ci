name: Hepta knowledge.graph qualification

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit; omitted values use the caller candidate.
        type: string
        required: false
        default: ""
      base_sha:
        description: Exact base commit; a supplied value enables the synthetic merge lane.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA; defaults to the selected workflow ref.
        type: string
        required: false
        default: ""
      base_sha:
        description: Exact 40-character base SHA; leave empty for source-head only.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: hepta-knowledge-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}

jobs:
  qualification:
    name: knowledge.graph (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON((inputs.base_sha || github.event.pull_request.base.sha) && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Prepare qualification evidence directory
        shell: bash
        env:
          KG_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/kg-qualification-$KG_LANE"
          mkdir -p "$EVIDENCE_DIR"
          df -h > "$EVIDENCE_DIR/disk-before.txt"
          printf 'KG_EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$BASE_SHA" ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$BASE_SHA^{commit}"
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD HEAD^{tree}

      - name: Construct deterministic synthetic merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number || 0 }}
          author-name: Hepta KG CI
          author-email: hepta-kg-ci@users.noreply.github.com
          message: Synthetic merge

      - name: Bind tested candidate identity
        shell: bash
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          mkdir -p "$KG_EVIDENCE_DIR"
          git rev-parse HEAD HEAD^{tree} > "$KG_EVIDENCE_DIR/source-identity.txt"
          # Qualification watchdogs are not product latency acceptance budgets.
          cat > "$KG_EVIDENCE_DIR/nextest.toml" <<'TOML'
          [profile.default]
          retries = 0
          slow-timeout = { period = "60s", terminate-after = 30 }
          [profile.local]
          TOML

      - name: Verify knowledge.graph closed-world truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py verify --profile qualification \
            --module knowledge.graph --module prompt.registry \
            --module cognitive.store --module memory.retrieval \
            --module intelligence.control --module runtime.agentd

      - name: Self-test module source and target-host evidence harnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_hepta_implementation_maps_scoped.py -v
          python3 scripts/test_hepta_knowledge_graph_budget.py -v
          python3 scripts/hepta-knowledge-graph-target-measure.py --self-test

      - name: Observe repository-wide detailed-design health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Global design health is still visible and remains enforced by its
          # owning workflows. Unrelated module drift must not suppress the
          # exact-candidate knowledge.graph executable evidence below.
          python3 scripts/hepta-technical-closure.py verify

      - name: Check KG-owned Rust formatting
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-kg --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer --package codex-hepta-memory \
            --package codex-hepta-agentd --package codex-hepta-intelligence -- --check

      - name: Prepare native test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Test canonical KG kernel
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-kg --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/kernel.log"

      - name: Test prompt-factor owner, projection and real consumer
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-prompt-registry --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/prompt-registry.log"
          just test --locked -p codex-hepta-prompt-optimizer --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/prompt-optimizer.log"

      - name: Test durable cognitive KG owner and recovery
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-memory --lib --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/memory.log"

      - name: Test canonical prompt compiler delivery boundary
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-intelligence --lib \
            -E 'test(prompt_delivery::tests)' --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/prompt-delivery.log"

      - name: Crash/reopen KG transaction windows
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-memory --lib \
            -E 'test(=cognitive_store_tests::qualification_kg_projection_crash_windows_restore_exact_predecessor)' \
            --run-ignored only --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/crash.log"

      - name: Measure PERF-LIBRARY pilot capacity
        if: matrix.lane == 'source-head'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-memory --lib \
            -E 'test(=cognitive_kg_benchmark_tests::qualification_knowledge_graph_capacity_receipt)' \
            --run-ignored only --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/capacity.log"
          test "$(grep -c '^HEPTA_KNOWLEDGE_GRAPH_PERF_RECEIPT=' "$KG_EVIDENCE_DIR/capacity.log")" = 1

      - name: Test default Agentd production cognitive-writer profile
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd \
            --test cognitive_product_e2e --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/product.log"

      - name: Test Agentd persisted prompt source boundary
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd --lib \
            -E 'test(prompt_runtime::)' \
            --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/prompt-runtime.log"

      - name: Test qualification witness on top of product writer
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            --test cognitive_product_e2e --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/product-witness.log"

      - name: Exercise history growth and deletion across reopen
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-memory --lib \
            -E 'test(=cognitive_kg_benchmark_tests::history::qualification_kg_history_reopen_no_resurrection)' \
            --run-ignored only --no-tests=fail --no-capture \
            --config-file "$KG_EVIDENCE_DIR/nextest.toml" 2>&1 | tee "$KG_EVIDENCE_DIR/history.log"
          test "$(grep -c '^HEPTA_KNOWLEDGE_GRAPH_HISTORY_RECEIPT=' "$KG_EVIDENCE_DIR/history.log")" = 1

      - name: Apply scoped repository lint fixes
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just fix --locked \
            -p codex-hepta-kg -p codex-hepta-prompt-registry \
            -p codex-hepta-prompt-optimizer -p codex-hepta-memory \
            -p codex-hepta-agentd -p codex-hepta-intelligence \
            --features codex-hepta-agentd/qualification-cognitive-write \
            2>&1 | tee "$KG_EVIDENCE_DIR/fix.log"
          git diff > "$KG_EVIDENCE_DIR/lint-fixes.patch"
          git diff --exit-code

      - name: Strict KG lint
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p codex-hepta-kg -p codex-hepta-prompt-registry \
            -p codex-hepta-prompt-optimizer -p codex-hepta-memory -p codex-hepta-agentd \
            -p codex-hepta-intelligence \
            --no-deps --all-targets --features codex-hepta-agentd/qualification-cognitive-write \
            -- -D warnings

      - name: Record final build disk usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h > "$KG_EVIDENCE_DIR/disk-after.txt"
          BUILD_DIRECTORY="${CARGO_TARGET_DIR:-codex-rs/target}"
          if [ -d "$BUILD_DIRECTORY" ]; then
            du -sm "$BUILD_DIRECTORY" > "$KG_EVIDENCE_DIR/build-size-mib.txt"
          fi

      - name: Preserve exact-candidate receipts and test counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-graph-qualification-${{ matrix.lane }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ env.KG_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Preserve exact tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  bazel-lock:
    name: knowledge.graph dependency lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: knowledge-graph-lock

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0

      - name: Refresh and verify exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          LOCK_EVIDENCE="$RUNNER_TEMP/kg-dependency-lock"
          mkdir -p "$LOCK_EVIDENCE"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD HEAD^{tree} > "$LOCK_EVIDENCE/source-identity.txt"
          set +e
          just bazel-lock-update 2>&1 | tee "$LOCK_EVIDENCE/bazel-lock-update.log"
          LOCK_EXIT=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$LOCK_EXIT" > "$LOCK_EVIDENCE/bazel-lock-update.exit"
          cp MODULE.bazel.lock "$LOCK_EVIDENCE/MODULE.bazel.lock"
          git diff -- MODULE.bazel.lock > "$LOCK_EVIDENCE/MODULE.bazel.lock.patch"
          test "$LOCK_EXIT" = 0
          git diff --exit-code -- MODULE.bazel.lock

      - name: Preserve dependency lock receipt and generated candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-graph-dependency-lock-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kg-dependency-lock
          if-no-files-found: error
          retention-days: 30
