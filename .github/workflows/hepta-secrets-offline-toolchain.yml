name: Secrets credential-free offline native inputs

on:
  push:
    branches: [codex/secrets-heptabao-verified-integration-20260928]
    paths: [.github/workflows/hepta-secrets-offline-toolchain.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve pinned toolchain and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          cd codex-rs
          cargo check --locked -p codex-hepta-bao-adapter --all-targets
      - name: Export compiler and source caches only; never credentials or configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-inputs
          cd codex-rs
          toolchain=$(dirname "$(dirname "$(rustup which rustc)")")
          tar -C "$toolchain" -czf ../native-inputs/toolchain.tgz bin lib libexec 2>/dev/null
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          tar -C "$cargo_home" -czf ../native-inputs/dependency-sources.tgz registry git
          rustc -Vv > ../native-inputs/toolchain.txt
          sha256sum Cargo.lock > ../native-inputs/dependency-lock.txt
          git rev-parse HEAD HEAD^{tree} > ../native-inputs/source.txt
          cd ../native-inputs
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-offline-native-inputs-${{ github.sha }}
          path: native-inputs
          retention-days: 1
          if-no-files-found: error
