name: control.runtime canonical rustfmt

on:
  push:
    branches:
      - codex/control-runtime-full-convergence-20260930
    paths:
      - .github/workflows/control-runtime-autofmt.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned rustfmt
        run: rustup component add rustfmt
      - name: Apply canonical formatting
        run: cargo fmt --all --manifest-path codex-rs/Cargo.toml
      - name: Commit formatted source and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/control-runtime-autofmt.yml
          git diff --check
          git config user.name 'hepta-control-runtime-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git commit -m 'control.runtime: apply canonical rustfmt'
          git push origin HEAD:codex/control-runtime-full-convergence-20260930
