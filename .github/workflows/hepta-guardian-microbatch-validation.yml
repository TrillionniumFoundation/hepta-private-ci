name: Guardian and microbatch whole native validation

on:
  push:
    branches:
      - integration/hepta-rust-validation-20261117-59d82
    paths:
      - .github/workflows/hepta-guardian-microbatch-validation.yml

permissions:
  contents: read

jobs:
  whole-native-gates:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.event_name == 'push' && github.ref == 'refs/heads/integration/hepta-rust-validation-20261117-59d82' && github.event.deleted == false
    name: Whole native validation (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: host
            target: x86_64-unknown-linux-gnu
            platform: ""
            timeout_minutes: 60
          - mode: core-gnu
            target: x86_64-unknown-linux-gnu
            platform: ""
            timeout_minutes: 120
          - mode: core-musl
            target: x86_64-unknown-linux-musl
            platform: "@rules_rs//rs/platforms:x86_64-unknown-linux-musl"
            timeout_minutes: 120
    environment:
      name: bazel
      deployment: false
    env:
      CARGO_BUILD_JOBS: "2"
      CODEX_BAZEL_LINUX_TARGET_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Check out the exact validation push
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the original Bazel platform and namespace support
        if: matrix.mode != 'host'
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: guardian-whole-${{ matrix.mode }}

      - name: Prepare the original Cargo host prerequisites
        if: matrix.mode == 'host'
        uses: ./.github/actions/setup-ci

      - name: Install the original host build dependencies
        if: matrix.mode == 'host'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake protobuf-compiler libssl-dev libcap-dev pkg-config bubblewrap

      - name: Preserve the original native Core OpenSSH prerequisite
        if: matrix.mode != 'host'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client
          test -x /usr/bin/ssh-keygen
          dpkg-query -W -f='${Package} ${Version}\n' openssh-client
          sha256sum /usr/bin/ssh-keygen

      - name: Install the fixed Python interpreter
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.14

      - name: Install the fixed Rust toolchain
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Install the original just and nextest versions
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,cargo-nextest@0.9.103

      - name: Install the fixed formatter environment manager
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7.3.1
        with:
          version: 0.11.3
          enable-cache: false

      - name: Allocate independent output paths
        shell: bash
        env:
          VALIDATION_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          records="$RUNNER_TEMP/guardian-microbatch-$VALIDATION_MODE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/guardian-microbatch-target-$VALIDATION_MODE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "HEPTA_VALIDATION_OUTPUT=$records"
            echo "CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR=$records/bazel-execution-logs"
          } >> "$GITHUB_ENV"

      - name: Run the complete worker-host package and scoped maintenance
        if: matrix.mode == 'host'
        shell: bash
        run: python3 .github/scripts/validate_guardian_microbatch.py --mode host

      - name: Run the original complete Core integration target
        if: matrix.mode != 'host'
        env:
          VALIDATION_MODE: ${{ matrix.mode }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: python3 .github/scripts/validate_guardian_microbatch.py --mode "$VALIDATION_MODE"

      - name: Preserve complete logs, attempts and source snapshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: guardian-microbatch-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HEPTA_VALIDATION_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
