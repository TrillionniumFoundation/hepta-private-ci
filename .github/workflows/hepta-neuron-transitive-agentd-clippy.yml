name: Hepta Neuron Transitive Agentd Native Strict Clippy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-infer-worker-host/**'
      - '.github/workflows/hepta-neuron-transitive-agentd-clippy.yml'

permissions:
  contents: read

jobs:
  owner-native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain, formatter, and Clippy
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Exact full-source format gate (unchanged)
        run: cargo +1.95.0 fmt --all -- --check
      - name: Native Agentd library tests on actual source
        run: cargo +1.95.0 test --locked -p codex-hepta-agentd --lib
      - name: Native Agentd strict source Clippy
        run: cargo +1.95.0 clippy --locked -p codex-hepta-agentd --lib -- -D warnings
      - name: Existing Inference Core and Worker strict Clippy including transitive owners
        run: cargo +1.95.0 clippy --locked -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets -- -D warnings
