name: MemoryCell reference-anchored evidence preference
on:
  pull_request:
    paths:
      - "scripts/memory_cell/evidence_preference.py"
      - "scripts/memory_cell/test_evidence_preference*.py"
      - "scripts/memory_cell/balanced_reader_trial.py"
      - ".github/workflows/hepta-memory-evidence-preference.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-evidence-preference-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  locked-reader:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-external-span-e2e
          run-id: 37919555733
          github-token: ${{ github.token }}
          path: /tmp/environment
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-masked-span-execution
          run-id: 37926451871
          github-token: ${{ github.token }}
          path: /tmp/reference
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-token-task-factorial
          run-id: 37932675437
          github-token: ${{ github.token }}
          path: /tmp/factorial
      - name: Lock the recorded environment and execute every Python regression
        run: |
          set -euo pipefail
          mkdir /tmp/preference-evidence
          (cd /tmp/reference && sha256sum -c SHA256SUMS)
          (cd /tmp/factorial && sha256sum -c SHA256SUMS)
          test "$(cat /tmp/reference/tested-commit.txt)" = 40924865e23e5da028cc9a1c589e1a0fcb72adbe
          test "$(cat /tmp/factorial/tested-commit.txt)" = 71c6329b4bcf7febdfd6d97db1557f605ad1f0e1
          python3 -m venv /tmp/preference-python
          /tmp/preference-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/preference-python/bin/pip install -r /tmp/environment/environment.txt
          /tmp/preference-python/bin/pip freeze > /tmp/preference-evidence/environment.txt
          diff -u /tmp/environment/environment.txt /tmp/preference-evidence/environment.txt
          /tmp/preference-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/preference-evidence/tests.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-native-staged-inputs
          run-id: 37862780268
          github-token: ${{ github.token }}
          path: /tmp
      - name: Verify the original annotation and reader bytes
        run: |
          set -euo pipefail
          tar -C /tmp -xzf /tmp/memory-inputs.tar.gz
          /tmp/preference-python/bin/python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from urllib.request import urlopen
          from span_supervision import SQUAD_REVISION, MAX_BYTES, load_corpus
          from pretrained import file_inventory
          from native import digest
          pins = json.loads(Path('/tmp/environment/external-input-pins.json').read_text())
          root = Path('/tmp/external'); root.mkdir()
          for split in ('train', 'dev'):
              name = f'{split}-v2.0.json'
              url = f'https://raw.githubusercontent.com/rajpurkar/SQuAD-explorer/{SQUAD_REVISION}/dataset/{name}'
              with urlopen(url, timeout=90) as response:
                  raw = response.read(MAX_BYTES + 1)
              if len(raw) > MAX_BYTES or hashlib.sha256(raw).hexdigest() != pins[split]['sha256']:
                  raise ValueError('external annotation drift')
              (root / name).write_bytes(raw)
              load_corpus(root / name, split)
          original = json.loads(Path('/tmp/factorial/experiment/preregistered.json').read_text())
          if digest(file_inventory(Path('/tmp/memory-inputs/reader'))) != original['reader_inventory']:
              raise ValueError('pretrained reader drift')
          Path('/tmp/preference-evidence/data-pins.json').write_text(json.dumps(pins, indent=2))
          PY
      - name: Actual reference and actor training followed by matched fresh answers
        env:
          HEPTA_MEMORY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/preference-evidence/resources.txt /tmp/preference-python/bin/python scripts/memory_cell/balanced_reader_trial.py /tmp/memory-inputs /tmp/external /tmp/reference/experiment /tmp/factorial/experiment /tmp/preference-evidence/experiment --candidate preference 2>&1 | tee /tmp/preference-evidence/execution.log
      - name: Require repository formatting without discarding completed observations
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          PATH="/tmp/preference-python/bin:$PATH" just fmt --check --base "$BASE"
      - name: Retain exact source and original evidence, including any failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/preference-evidence/source
          cp scripts/memory_cell/evidence_preference.py scripts/memory_cell/test_evidence_preference*.py scripts/memory_cell/balanced_reader_trial.py /tmp/preference-evidence/source/
          git rev-parse HEAD > /tmp/preference-evidence/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/preference-evidence/tested-tree.txt
          (cd /tmp/preference-evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-evidence-preference
          path: /tmp/preference-evidence
          if-no-files-found: error
