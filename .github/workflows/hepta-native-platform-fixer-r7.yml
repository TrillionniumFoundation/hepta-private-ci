name: Hepta native platform exact-head fixer R7

on:
  push:
    branches:
      - codex/hepta-v8-windows-bazel-diagnostics-r3-20260907

concurrency:
  group: hepta-native-platform-fixer-r7
  cancel-in-progress: false

jobs:
  windows-fix:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TARGET_PR: "449"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve authoritative head
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)"
          [[ "${state}" == "OPEN" ]] || { echo 'active=false' >> "${GITHUB_OUTPUT}"; exit 0; }
          repo="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json headRepository --jq .headRepository.nameWithOwner)"
          [[ "${repo}" == "${GITHUB_REPOSITORY}" ]] || { echo "Fork PR rejected" >&2; exit 1; }
          sha="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq .headRefOid)"
          echo "active=true" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.pr.outputs.active == 'true' }}
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Prepare Windows Bazel environment
        if: ${{ steps.pr.outputs.active == 'true' }}
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-test

      - name: Run exact failing targets and apply snapshot-only updates
        if: ${{ steps.pr.outputs.active == 'true' }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            //codex-rs/hepta-memory:hepta-memory-unit-tests
            //codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests
            //codex-rs/exec-server:exec-server-file_system_windows-test-windows-cross
            //codex-rs/app-server:app-server-unit-tests
            //codex-rs/hepta-agentd:hepta-agentd-cognitive-write-qualification-test
            //codex-rs/cli:cli-sandbox_cloud_config-test-windows-cross
            //codex-rs/cli:hepta-bin-unit-tests
            //codex-rs/utils/home-dir:home-dir-unit-tests
            //codex-rs/hepta-neuron:hepta-neuron-unit-tests
            //codex-rs/hepta-evidence:hepta-evidence-unit-tests
            //codex-rs/hepta-matrixd:hepta-matrixd-unit-tests
            //codex-rs/tui:tui-unit-tests
            //codex-rs/hepta-operator-acceptance:hepta-operator-acceptance-tests
            //codex-rs/hepta-shadow-qualification:hepta-shadow-qualification-tests
            //codex-rs/hepta-supervisor:hepta-supervisor-unit-tests
            //codex-rs/hepta-supervisor:hepta-supervisor-robrix_control_projection-test-windows-cross
          )
          mkdir -p "${RUNNER_TEMP}/hepta-r7-logs"
          for target in "${targets[@]}"; do
            safe="$(printf '%s' "${target}" | sed -E 's#^//##; s#[/:]#_#g')"
            log="${RUNNER_TEMP}/hepta-r7-logs/${safe}.log"
            set +e
            ./.github/scripts/run-bazel-ci.sh \
              --print-failed-action-summary --print-failed-test-logs \
              --windows-cross-compile --remote-download-toplevel -- \
              test --skip_incompatible_explicit_targets \
              --test_tag_filters=-argument-comment-lint \
              --test_output=all -- "${target}" 2>&1 | tee "${log}"
            rc=${PIPESTATUS[0]}
            set -e
            if [[ ${rc} -ne 0 ]] && grep -Eqi 'snapshot|insta.*(new|difference|mismatch)' "${log}"; then
              ./.github/scripts/run-bazel-ci.sh \
                --print-failed-action-summary --print-failed-test-logs \
                --windows-cross-compile --remote-download-toplevel -- \
                test --skip_incompatible_explicit_targets \
                --test_tag_filters=-argument-comment-lint \
                --test_env=INSTA_UPDATE=always --test_output=all -- "${target}" || true
            fi
          done

      - name: Run Windows-target machine fixes
        if: ${{ steps.pr.outputs.active == 'true' }}
        shell: pwsh
        run: |
          if (Test-Path codex-rs/Cargo.toml) {
            Push-Location codex-rs
            cargo fix --target x86_64-pc-windows-gnullvm --workspace --all-targets --all-features --allow-dirty --allow-staged --ignore-rust-version
            if ($LASTEXITCODE -ne 0) { Write-Warning "cargo fix retained any fixes emitted before failure" }
            Pop-Location
            cargo fmt --manifest-path codex-rs/Cargo.toml --all
          }
          exit 0

      - name: Export Windows source patch
        if: ${{ steps.pr.outputs.active == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hepta-r7-windows"
          git diff --binary HEAD > "${RUNNER_TEMP}/hepta-r7-windows/windows.patch"
          git status --porcelain=v1 --untracked-files=all > "${RUNNER_TEMP}/hepta-r7-windows/status.txt"
          cp -R "${RUNNER_TEMP}/hepta-r7-logs" "${RUNNER_TEMP}/hepta-r7-windows/logs"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() && steps.pr.outputs.active == 'true' }}
        with:
          name: hepta-r7-windows-fix
          path: ${{ runner.temp }}/hepta-r7-windows
          if-no-files-found: error
          retention-days: 7

  macos-fix:
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      TARGET_PR: "449"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve authoritative head
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)"
          [[ "${state}" == "OPEN" ]] || { echo 'active=false' >> "${GITHUB_OUTPUT}"; exit 0; }
          repo="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json headRepository --jq .headRepository.nameWithOwner)"
          [[ "${repo}" == "${GITHUB_REPOSITORY}" ]] || { echo "Fork PR rejected" >&2; exit 1; }
          sha="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq .headRefOid)"
          echo "active=true" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.pr.outputs.active == 'true' }}
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Run native macOS Clippy machine fixes
        if: ${{ steps.pr.outputs.active == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f codex-rs/Cargo.toml ]]; then
            cd codex-rs
            cargo clippy --fix \
              --workspace --all-targets --all-features \
              --allow-dirty --allow-staged --ignore-rust-version \
              -- -D warnings || true
            cd ..
            cargo fmt --manifest-path codex-rs/Cargo.toml --all
          fi

      - name: Export macOS source patch
        if: ${{ steps.pr.outputs.active == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hepta-r7-macos"
          git diff --binary HEAD > "${RUNNER_TEMP}/hepta-r7-macos/macos.patch"
          git status --porcelain=v1 --untracked-files=all > "${RUNNER_TEMP}/hepta-r7-macos/status.txt"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() && steps.pr.outputs.active == 'true' }}
        with:
          name: hepta-r7-macos-fix
          path: ${{ runner.temp }}/hepta-r7-macos
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [windows-fix, macos-fix]
    if: ${{ always() }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_PR: "449"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve latest authoritative head
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)"
          [[ "${state}" == "OPEN" ]] || { echo 'active=false' >> "${GITHUB_OUTPUT}"; exit 0; }
          branch="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json headRefName --jq .headRefName)"
          sha="$(gh pr view "${TARGET_PR}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq .headRefOid)"
          echo "active=true" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.pr.outputs.active == 'true' }}
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        if: ${{ steps.pr.outputs.active == 'true' }}
        with:
          pattern: hepta-r7-*-fix
          path: .hepta-r7-fixes
          merge-multiple: true

      - name: Apply only clean source patches
        if: ${{ steps.pr.outputs.active == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import pathlib
          import subprocess

          forbidden_prefixes = ('.github/', '.git/', 'third_party/', 'vendor/')
          forbidden_exact = {'Cargo.lock', 'MODULE.bazel.lock', 'pnpm-lock.yaml'}
          for patch in sorted(pathlib.Path('.hepta-r7-fixes').glob('*.patch')):
              if not patch.read_bytes().strip():
                  continue
              if subprocess.run(['git','apply','--check','--whitespace=error-all',str(patch)]).returncode:
                  print(f'Skipping non-applicable patch: {patch}')
                  continue
              rows = subprocess.run(['git','apply','--numstat',str(patch)],check=True,capture_output=True,text=True).stdout.splitlines()
              paths = [row.split('\t',2)[2] for row in rows if len(row.split('\t',2)) == 3]
              if any(path in forbidden_exact or path.startswith(forbidden_prefixes) for path in paths):
                  raise SystemExit(f'Unsafe platform patch rejected: {patch}: {paths}')
              subprocess.run(['git','apply','--index','--whitespace=error-all',str(patch)],check=True)
              print(f'Applied {patch}: {paths}')
          PY
          rm -rf .hepta-r7-fixes
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git add -A
          git diff --cached --check

      - name: Commit platform fixes to the same PR head
        if: ${{ steps.pr.outputs.active == 'true' }}
        env:
          HEAD_BRANCH: ${{ steps.pr.outputs.branch }}
          ORIGINAL_HEAD: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-native-platform-fixer"
          git config user.email "hepta-native-platform-fixer@users.noreply.github.com"
          changed="$(git diff --cached --name-only)"
          if grep -Eq '^\.github/|(^|/)(CODEOWNERS|branch-protection|ruleset)' <<<"${changed}"; then
            echo "Refusing workflow or policy mutation" >&2
            exit 1
          fi
          if git diff --cached | grep -Eq -- 'test_tag_filters=.*-[^ ]+|^[+].*(allow\(warnings\)|-A warnings)'; then
            echo "Refusing test exclusion or warning downgrade" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply native Windows and macOS blocker corrections [hepta-r7]"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
          gh pr merge "${TARGET_PR}" --auto --squash --delete-branch
