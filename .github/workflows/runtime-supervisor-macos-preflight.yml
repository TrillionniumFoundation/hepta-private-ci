name: runtime-supervisor-macos-preflight

on:
  push:
    branches:
      - work/runtime-supervisor-qualification-20260929
    paths:
      - .github/workflows/runtime-supervisor-macos-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-supervisor-macos-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          ref: work/runtime-supervisor-qualification-20260929

      - name: Materialize candidate
        run: |
          python3 .github/scripts/runtime_supervisor_source.py
          python3 .github/scripts/runtime_supervisor_pre_integration.py
          python3 .github/scripts/runtime_supervisor_integration.py
          python3 .github/scripts/runtime_supervisor_fixups.py

      - name: Format and compile all targets
        working-directory: codex-rs
        run: |
          cargo fmt -p codex-hepta-supervisor
          cargo fmt -p codex-hepta-supervisor -- --check
          cargo check -p codex-hepta-supervisor --all-targets --features "qualification production-authority"

      - name: Execute core source qualification
        working-directory: codex-rs
        run: cargo test -p codex-hepta-supervisor --lib --features "qualification production-authority" -- --test-threads=1
