name: Inference control autoformat

on:
  push:
    branches:
      - work/inference-control-full-closure-20260927
    paths:
      - .github/workflows/inference-control-autoformat.yml

permissions:
  contents: write

concurrency:
  group: inference-control-autoformat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rustfmt:
    name: Rustfmt convergence branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Format Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Commit formatting-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No rustfmt changes required"
            exit 0
          fi
          git config user.name "hepta-inference-control-bot"
          git config user.email "hepta-inference-control-bot@users.noreply.github.com"
          git add -- 'codex-rs/**/*.rs'
          git commit -m "style(inference-control): apply rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
