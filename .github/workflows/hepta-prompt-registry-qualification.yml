name: Hepta prompt.registry qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codex-rs/hepta-prompt-registry/**'
      - 'codex-rs/hepta-prompt-optimizer/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/ext/hepta-prompt/**'
      - 'codex-rs/hepta-codex-adapter/**'
      - 'codex-rs/Cargo.*'
      - 'docs/modules/prompt.registry/**'
      - 'scripts/hepta-prompt-registry-*'
      - '.github/workflows/hepta-prompt-registry-qualification.yml'
      - '.github/workflows/hepta-prompt-registry-independent-acceptance.yml'
  push:
    branches: [main, codex/prompt-registry-delivery-consistency-20260928, codex/prompt-registry-verified-closeout-20260928, codex/prompt-registry-production-closeout-20260929]
    paths:
      - 'codex-rs/hepta-prompt-registry/**'
      - 'codex-rs/hepta-prompt-optimizer/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/ext/hepta-prompt/**'
      - 'codex-rs/hepta-codex-adapter/**'
      - 'codex-rs/Cargo.*'
      - 'docs/modules/prompt.registry/**'
      - 'scripts/hepta-prompt-registry-*'
      - '.github/workflows/hepta-prompt-registry-qualification.yml'
      - '.github/workflows/hepta-prompt-registry-independent-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: hepta-prompt-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bind:
    runs-on: ubuntu-slim
    outputs:
      source: ${{ steps.identity.outputs.source }}
      base: ${{ steps.identity.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          test "$source" = "$REQUESTED_SOURCE"
          base=$(git rev-parse "${REQUESTED_BASE:-refs/remotes/origin/main}")
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
  qualification:
    needs: bind
    name: prompt.registry ${{ matrix.profile }} (${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: core, lane: exact-head, runner: ubuntu-24.04, timeout: 45}
          - {profile: core, lane: base-merge, runner: ubuntu-24.04, timeout: 45}
          - {profile: product, lane: exact-head, runner: ubuntu-24.04, timeout: 75}
          - {profile: product, lane: base-merge, runner: ubuntu-24.04, timeout: 75}
    env:
      SOURCE_SHA: ${{ needs.bind.outputs.source }}
      BASE_SHA: ${{ needs.bind.outputs.base }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind tested source without patching or regenerating it
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/prompt-evidence"
          printf 'source=%s\nbase=%s\nprofile=%s\nlane=%s\nqualified=false\n' "$SOURCE_SHA" "$BASE_SHA" '${{ matrix.profile }}' "$LANE" > "$RUNNER_TEMP/prompt-evidence/setup.txt"
          if test "$LANE" = base-merge; then
            git config user.name 'Prompt registry qualification'
            git config user.email 'qualification@users.noreply.github.com'
            export GIT_AUTHOR_DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            git checkout --detach "$BASE_SHA"
            git merge --no-ff --no-edit "$SOURCE_SHA"
          fi
          git diff --exit-code HEAD
          test -z "$(find scripts -maxdepth 1 -name 'apply-prompt-*.py' -print)"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Prepare product native dependencies
        if: matrix.profile == 'product'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
      - name: Resolve existing checksum-verified V8 inputs
        if: matrix.profile == 'product'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Execute every required check and capture failures
        run: >-
          python3 scripts/hepta-prompt-registry-qualify.py
          --profile '${{ matrix.profile }}' --lane '${{ matrix.lane }}'
          --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA"
          --output "$RUNNER_TEMP/prompt-evidence"
      - name: Retain exact identity, raw logs, measurements and failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-${{ matrix.profile }}-${{ matrix.lane }}-${{ needs.bind.outputs.source }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-evidence/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: prompt.registry exact-run evidence gate
    if: always()
    needs: [bind, qualification]
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject failed, skipped or cancelled lanes
        env:
          BIND_RESULT: ${{ needs.bind.result }}
          LANES_RESULT: ${{ needs.qualification.result }}
        run: test "$BIND_RESULT" = success && test "$LANES_RESULT" = success
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.bind.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: prompt-registry-*-${{ needs.bind.outputs.source }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-registry-receipts
      - name: Verify all four identities, source trees and raw logs
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.source }}
          BASE_SHA: ${{ needs.bind.outputs.base }}
        run: >-
          python3 scripts/hepta-prompt-registry-aggregate.py
          --root "$RUNNER_TEMP/prompt-registry-receipts"
          --source "$SOURCE_SHA" --base "$BASE_SHA"
          --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/prompt-registry-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-summary-${{ needs.bind.outputs.source }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-registry-summary.json
          if-no-files-found: error
          retention-days: 30
