name: Self-hosted desktop runner availability

on:
  push:
    branches: [ops/fleet-cleanup-20261002]
    paths:
      - .github/workflows/self-hosted-desktop-availability.yml
  workflow_dispatch:

permissions: {}

jobs:
  runner-probe:
    name: Desktop Commander recovery probe
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Inspect preserved Desktop Commander installation and restart existing unit
        shell: bash
        run: |
          set -u
          test "$RUNNER_NAME" = desktop
          echo "host=$(hostname)"
          echo "--- preserved paths ---"
          for p in "$HOME/.desktop-commander-device" "$HOME/.claude-server-commander" "$HOME/.claude-server-commander-logs"; do
            if [ -e "$p" ]; then
              du -sh "$p" 2>/dev/null || true
              find "$p" -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | head -n 80 || true
            else
              echo "missing=$p"
            fi
          done
          echo "--- matching processes before ---"
          pgrep -af 'desktop.*commander|commander.*remote|claude-server-commander|desktopcommander' || true
          echo "--- matching user units ---"
          mapfile -t units < <(systemctl --user list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei 'desktop.*commander|commander.*remote|claude-server-commander|desktopcommander' || true)
          printf 'unit=%s\n' "${units[@]:-}"
          for u in "${units[@]:-}"; do
            [ -n "$u" ] || continue
            systemctl --user restart "$u" || true
            systemctl --user --no-pager status "$u" 2>&1 | tail -n 30 || true
          done
          echo "--- matching processes after ---"
          pgrep -af 'desktop.*commander|commander.*remote|claude-server-commander|desktopcommander' || true
          echo "--- recent logs ---"
          find "$HOME/.claude-server-commander-logs" -maxdepth 1 -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 5 | cut -d' ' -f2- | while IFS= read -r f; do
            echo "### $f"
            tail -n 50 "$f" 2>/dev/null || true
          done
