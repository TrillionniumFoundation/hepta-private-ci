name: Self-hosted desktop runner availability

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this bounded runner probe is being requested
        required: false
        default: operator-check
        type: string

# This probe does not check out repository code. It only proves that the
# selected trusted manual lane can acquire the desktop runner.
# `permissions: {}` is stricter than `contents: read`; no checkout is invoked,
# so `persist-credentials: false` is not an applicable action input.
permissions: {}

jobs:
  runner-probe:
    name: Desktop runner probe
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Verify trusted manual invocation
        shell: bash
        env:
          PROBE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = desktop
          test "${#PROBE_REASON}" -le 128
          [[ "$PROBE_REASON" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]]
          [[ ! "/$PROBE_REASON/" =~ /\.\./ ]]
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            "$PROBE_REASON"
      - name: Read-only capability snapshot
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          if command -v adb >/dev/null 2>&1; then adb devices -l || true; fi
          if command -v nvidia-smi >/dev/null 2>&1; then nvidia-smi --query-gpu=name --format=csv,noheader || true; fi
