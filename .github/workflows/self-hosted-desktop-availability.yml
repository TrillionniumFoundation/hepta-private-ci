name: Self-hosted desktop runner availability

on:
  push:
    branches:
      - ops/kernel-authority-runner-probe-20260928
    paths:
      - '.github/workflows/self-hosted-desktop-availability.yml'

permissions: {}

concurrency:
  group: kernel-authority-readonly-runner-probe
  cancel-in-progress: true

jobs:
  runner-probe:
    name: Kernel authority read-only runner probe
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Verify isolated trusted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/ops/kernel-authority-runner-probe-20260928
          test "$RUNNER_NAME" = desktop
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF"
      - name: Read-only capability snapshot
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          command -v git
          command -v python3
          command -v cargo || true
          command -v gh || true
