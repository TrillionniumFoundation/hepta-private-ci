name: Author prompt.registry GC age

on:
  push:
    branches:
      - ops/prompt-registry-production-convergence-author-20260929
    paths:
      - ops/trigger-prompt-registry-gc-age

permissions:
  contents: write

concurrency:
  group: author-prompt-registry-gc-age
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/prompt-registry-production-convergence-20260929

jobs:
  author-gc-age:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      authored_sha: ${{ steps.publish.outputs.authored_sha }}
    steps:
      - name: Checkout authoring source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: authoring
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply versioned GC-age source changes
        run: |
          set -euo pipefail
          if test -f target/codex-rs/hepta-prompt-registry/src/durable_gc_age.rs; then
            echo 'Versioned GC-age source already present; preserving the existing implementation.'
          else
            python3 authoring/scripts/author_prompt_registry_gc_age.py target
          fi

      - name: Format and verify patch hygiene
        working-directory: target
        run: |
          set -euo pipefail
          (cd codex-rs && cargo fmt --all)
          git diff --check
          git status --short

      - name: Publish GC-age commit
        id: publish
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "14957082+openai@users.noreply.github.com"
          git add \
            codex-rs/hepta-prompt-registry/src/durable.rs \
            codex-rs/hepta-prompt-registry/src/durable_gc.rs \
            codex-rs/hepta-prompt-registry/src/durable_gc_age.rs \
            codex-rs/hepta-prompt-registry/src/failure.rs
          if ! git diff --cached --quiet; then
            git commit -m "prompt.registry: persist versioned payload reclaim age"
            git push origin HEAD:refs/heads/${TARGET_BRANCH}
          fi
          echo "authored_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-gc-age:
    needs: author-gc-age
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout exact authored source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.author-gc-age.outputs.authored_sha }}
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Validate exact authored GC-age implementation
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p codex-hepta-prompt-registry --all-targets
          cargo test --locked -p codex-hepta-prompt-registry -- --test-threads=1
          cargo clippy --locked -p codex-hepta-prompt-registry --all-targets --no-deps -- -D warnings
