name: MemoryCell evidence sets and frozen reader capability
on:
  pull_request:
    paths:
      - 'scripts/memory_cell/evidence_bundle.py'
      - 'scripts/memory_cell/bundle_*.py'
      - 'scripts/memory_cell/test_*bundle*.py'
      - '.github/workflows/hepta-memory-bundle-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-bundle-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-external-span-e2e
          run-id: 37919555733
          github-token: ${{ github.token }}
          path: /tmp/environment
      - name: Validate exact-source tests and repository formatting
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir /tmp/bundle-validation
          python3 -m venv /tmp/bundle-python
          /tmp/bundle-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/bundle-python/bin/pip install -r /tmp/environment/environment.txt
          /tmp/bundle-python/bin/pip freeze > /tmp/bundle-validation/environment.txt
          diff -u /tmp/environment/environment.txt /tmp/bundle-validation/environment.txt
          /tmp/bundle-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/bundle-validation/tests.log
          git fetch --no-tags --depth=1 origin "$BASE"
          PATH="/tmp/bundle-python/bin:$PATH" just fmt --check --base "$BASE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-native-staged-inputs
          run-id: 37862780268
          github-token: ${{ github.token }}
          path: /tmp
      - name: Freeze native cases and all evidence-set conditions once
        env:
          HEPTA_MEMORY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          tar -C /tmp -xzf /tmp/memory-inputs.tar.gz
          /usr/bin/time -v -o /tmp/bundle-validation/planning-resources.txt /tmp/bundle-python/bin/python scripts/memory_cell/bundle_trial.py plan /tmp/memory-inputs /tmp/bundle-plan --limit 2
          cp /tmp/bundle-validation/environment.txt /tmp/bundle-plan/environment.txt
          (cd /tmp/bundle-plan && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-bundle-plan
          path: /tmp/bundle-plan
          if-no-files-found: error
      - name: Retain tested source identity
        if: always()
        run: |
          mkdir -p /tmp/bundle-validation
          git rev-parse HEAD > /tmp/bundle-validation/tested-commit.txt
          git diff --stat > /tmp/bundle-validation/worktree-diff.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-bundle-validation
          path: /tmp/bundle-validation
  reader:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tier: ['135M', '360M', '1.7B']
    env:
      PYTHONPATH: scripts/memory_cell
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-bundle-plan
          path: /tmp/bundle-plan
      - name: Lock packages and stage the immutable reader revision
        run: |
          set -euo pipefail
          (cd /tmp/bundle-plan && sha256sum -c SHA256SUMS)
          mkdir /tmp/bundle-result
          python3 -m venv /tmp/bundle-python
          /tmp/bundle-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/bundle-python/bin/pip install -r /tmp/bundle-plan/environment.txt
          /tmp/bundle-python/bin/pip freeze > /tmp/bundle-result/environment.txt
          diff -u /tmp/bundle-plan/environment.txt /tmp/bundle-result/environment.txt
          /tmp/bundle-python/bin/python scripts/memory_cell/bundle_assets.py stage '${{ matrix.tier }}' /tmp/bundle-model
          cp /tmp/bundle-model/inventory.json /tmp/bundle-result/
      - name: Actual offline frozen generation with the same evidence conditions
        env:
          HEPTA_MEMORY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          set -euo pipefail
          PLAN_SHA=$(/tmp/bundle-python/bin/python -c 'import json; print(json.load(open("/tmp/bundle-plan/READY.json"))["plan_sha256"])')
          LABELS_SHA=$(/tmp/bundle-python/bin/python -c 'import json; print(json.load(open("/tmp/bundle-plan/READY.json"))["labels_sha256"])')
          /usr/bin/time -v -o /tmp/bundle-result/resources.txt /tmp/bundle-python/bin/python scripts/memory_cell/bundle_trial.py run /tmp/bundle-plan/plan.json /tmp/bundle-plan/labels.json /tmp/bundle-model/reader /tmp/bundle-model/inventory.json /tmp/bundle-result/execution --plan-sha "$PLAN_SHA" --labels-sha "$LABELS_SHA" 2>&1 | tee /tmp/bundle-result/run.log
      - name: Retain raw failures and exact source hashes too
        if: always()
        run: |
          mkdir -p /tmp/bundle-result/source
          cp scripts/memory_cell/bundle_*.py scripts/memory_cell/evidence_bundle.py /tmp/bundle-result/source/
          git rev-parse HEAD > /tmp/bundle-result/tested-commit.txt
          (cd /tmp/bundle-result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-bundle-reader-${{ matrix.tier }}
          path: /tmp/bundle-result
          if-no-files-found: error
  compare:
    needs: reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: memory-bundle-reader-*
          path: /tmp/readers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-bundle-plan
          path: /tmp/bundle-plan
      - name: Compare only complete plans, never claim size increases as memory gains
        env:
          PYTHONPATH: scripts/memory_cell
        run: |
          set -euo pipefail
          python3 -m venv /tmp/compare-python
          /tmp/compare-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          for directory in /tmp/readers/*; do (cd "$directory" && sha256sum -c SHA256SUMS); done
          /tmp/compare-python/bin/python scripts/memory_cell/bundle_assets.py collect /tmp/readers /tmp/bundle-plan/plan.json /tmp/bundle-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-bundle-reader-matrix
          path: /tmp/bundle-matrix.json
