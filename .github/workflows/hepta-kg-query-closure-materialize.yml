name: Materialize KG query closure
on:
  push:
    branches: [work/kg-verified-query-closure-20260927]
    paths:
      - .github/workflows/hepta-kg-query-closure-materialize.yml
      - scripts/hepta-kg-query-closure-apply.py
permissions:
  contents: write
concurrency:
  group: kg-query-closure-materialization
  cancel-in-progress: true
jobs:
  materialize:
    if: github.ref == 'refs/heads/work/kg-verified-query-closure-20260927'
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      source-sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact scoped predecessor and query closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "$(git ls-remote origin refs/heads/work/kg-verified-query-closure-20260927 | cut -f1)" = '${{ github.sha }}'
          git config user.name 'Hepta KG source integration'
          git config user.email 'hepta-kg-ci@users.noreply.github.com'
          python3 scripts/test_hepta_knowledge_graph_budget.py -v
          python3 scripts/hepta-kg-query-closure-apply.py
          cd codex-rs
          cargo fmt --package codex-hepta-kg --package codex-hepta-memory
      - name: Commit source and remove one-shot writer
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/hepta-kg-query-closure-apply.py .github/workflows/hepta-kg-query-closure-materialize.yml
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/hepta-knowledge-graph-qualification.yml',
              '.github/workflows/hepta-kg-query-closure-materialize.yml',
              'scripts/hepta-kg-query-closure-apply.py',
              'scripts/hepta-knowledge-graph-target-measure.py',
              'qualification/knowledge-graph/TARGET_HOST.md',
              'docs/modules/knowledge.graph/TECHNICAL.md',
              'codex-rs/hepta-kg/src/generation.rs',
              'codex-rs/hepta-kg/src/generation_tests.rs',
              'codex-rs/hepta-kg/src/lib.rs',
              'codex-rs/hepta-kg/src/indexed_query.rs',
              'codex-rs/hepta-kg/src/query_closure_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_kg_benchmark_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_store_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_kg_history_tests.rs',
              'codex-rs/hepta-memory/src/cognitive_retrieval.rs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= allowed, sorted(changed - allowed)
          PY
          git add -A -- codex-rs/hepta-kg codex-rs/hepta-memory docs/modules/knowledge.graph/TECHNICAL.md qualification/knowledge-graph/TARGET_HOST.md scripts/hepta-knowledge-graph-target-measure.py scripts/hepta-kg-query-closure-apply.py .github/workflows/hepta-knowledge-graph-qualification.yml .github/workflows/hepta-kg-query-closure-materialize.yml
          git commit -m 'feat(knowledge.graph): wire verified transaction-local query cache and validator parity' -m 'Imports reviewed KG-only predecessor changes and retains full-scan equivalence oracle. No production or target-host qualification claim.' -m 'Signed-off-by: ChatGPT <noreply@openai.com>'
      - name: Bind complete typed source inventory to committed source
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          env = {k: v for k, v in os.environ.items() if not k.startswith('GIT_')}
          env.update(GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=os.devnull, GIT_NO_REPLACE_OBJECTS='1', GIT_NO_LAZY_FETCH='1')
          def git(*args):
              return subprocess.check_output(['git', '--literal-pathspecs', *args], env=env, text=True).strip()
          path = Path('docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text())
          identity = {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}')}
          row['sourceBase'] = identity
          row['observedAtHead'] = identity
          extra = ['codex-rs/hepta-kg/src/indexed_query.rs', 'codex-rs/hepta-kg/src/query_closure_tests.rs', 'codex-rs/hepta-memory/src/cognitive_kg_history_tests.rs', 'qualification/knowledge-graph/QUERY_CLOSURE_20260927.md', 'scripts/hepta-knowledge-graph-target-measure.py', 'scripts/hepta-knowledge-graph-budget-check.py', 'scripts/test_hepta_knowledge_graph_budget.py']
          paths = set(extra + row['observedSourcePaths'] + row['compositionRoots'] + row['declaredRoots'] + row['resolvedRoots'])
          paths.add(row['technicalGuide'])
          paths.update(item['path'] for item in row['sourceObjects'])
          for op in row['operations']:
              if op['operation'] == 'query_relations':
                  op['tests'].append('codex-rs/hepta-kg/src/query_closure_tests.rs')
              paths.add(op['sourcePath'])
              for key in ('tests', 'delegatedCallees'):
                  for item in op.get(key, []):
                      source = item if isinstance(item, str) else item.get('path', item.get('sourcePath'))
                      if not source:
                          raise ValueError('mapped evidence lacks a source path')
                      paths.add(source.split('.rs::')[0] + '.rs' if '.rs::' in source else source)
          assert str(path) not in paths, 'self-referential source map'
          objects = []
          for source in sorted(paths):
              assert not source.startswith('/') and '..' not in Path(source).parts, source
              kind = git('cat-file', '-t', f"{identity['commit']}:{source}")
              assert kind in ('tree', 'blob'), (source, kind)
              object_id = git('rev-parse', f"{identity['commit']}:{source}")
              assert re.fullmatch('[0-9a-f]{40}', object_id), source
              objects.append({'path': source, 'object': object_id})
          row['observedSourcePaths'] = sorted(paths)
          row['sourceObjects'] = objects
          path.write_text(json.dumps(row, indent=2) + '\n')
          print(json.dumps({'source': identity, 'sourceObjectCount': len(objects)}))
          PY
          git add docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json
          git commit -m 'docs(knowledge.graph): bind exact committed query closure source objects' -m 'Signed-off-by: ChatGPT <noreply@openai.com>'
          test "$(git ls-remote origin refs/heads/work/kg-verified-query-closure-20260927 | cut -f1)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/work/kg-verified-query-closure-20260927
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD HEAD^{tree}
      - name: Export focused exact source for independent inspection
        if: always()
        shell: bash
        run: |
          git diff --binary a126987b84737dbc2ee2592442a314117bddb4a2 > "$RUNNER_TEMP/kg-source.patch"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/kg-source-identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kg-query-closure-source
          path: |
            ${{ runner.temp }}/kg-source.patch
            ${{ runner.temp }}/kg-source-identity.txt
          if-no-files-found: error
  kernel:
    needs: materialize
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.materialize.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact prepared source and parser tests
        run: |
          test "$(git rev-parse HEAD)" = '${{ needs.materialize.outputs.source-sha }}'
          git diff --exit-code
          python3 scripts/test_hepta_knowledge_graph_budget.py -v
      - name: Check KG formatting
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-kg --package codex-hepta-memory -- --check
      - name: Test exact KG kernel
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-kg -- --nocapture
      - name: Lint exact KG kernel
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-kg --all-targets --no-deps -- -D warnings
      - name: Preserve exact source
        if: always()
        run: git diff --exit-code
