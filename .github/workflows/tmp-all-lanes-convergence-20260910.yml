name: tmp-all-lanes-convergence-20260910

on:
  push:
    branches:
      - codex/hepta-all-gap-closure-20260908
    paths:
      - .github/workflows/tmp-all-lanes-convergence-20260910.yml

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: tmp-all-lanes-convergence-20260910
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/all-lanes-gap-closure-20260910-r1

jobs:
  construct-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out controller carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Construct ordered convergence candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          carrier="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^)"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git switch --detach "$base"
          git switch -c "$TARGET_BRANCH"

          merge_one() {
            branch="$1"
            if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              printf 'SKIP_MISSING_BRANCH %s\n' "$branch"
              return 0
            fi
            printf 'MERGE_BRANCH %s %s\n' "$branch" "$(git rev-parse "refs/remotes/origin/${branch}")"
            if git merge --no-ff --no-edit "refs/remotes/origin/${branch}"; then
              return 0
            fi

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/tmp-*.yml)
                  git rm -f -- "$path"
                  ;;
                qualification/module-execution-dossiers/NATIVE_BINDINGS.json|docs/STATUS.md)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                qualification/*/STATUS.json|qualification/*/*_STATUS.json|docs/generated/*)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  printf 'UNRESOLVED_CODE_CONFLICT %s while merging %s\n' "$path" "$branch" >&2
                  git merge --abort || true
                  return 1
                  ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit
          }

          merge_one codex/hepta-native-source-closed-world-20260909
          merge_one codex/lane-a-gap-closure-20260910
          merge_one codex/hepta-lane-a-gap-closure-20260910
          merge_one codex/hepta-lane-b-gap-closure-20260910
          merge_one codex/lane-b-gap-closure-20260910
          merge_one codex/lane-c-full-gap-closure-20260910
          merge_one codex/hepta-lane-c-gap-closure-20260910
          merge_one codex/lane-d-gap-closure-20260910
          merge_one codex/hepta-lane-d-gap-closure-20260910
          merge_one codex/hepta-lane-e-gap-closure-20260910
          merge_one codex/lane-e-gap-closure-20260910
          merge_one codex/lane-f-gap-closure-20260910
          merge_one codex/hepta-lane-f-gap-closure-20260910
          merge_one codex/lane-g-gap-closure-20260910
          merge_one codex/hepta-lane-g-gap-closure-20260910

          find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -delete

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("qualification/module-execution-dossiers/NATIVE_BINDINGS.json")
          if path.is_file():
              doc = json.loads(path.read_text(encoding="utf-8"))
              changed = []
              for row in doc.get("observations", []):
                  source = Path(row["path"])
                  if not source.is_file():
                      raise SystemExit(f"native binding path missing after convergence: {source}")
                  digest = subprocess.check_output(
                      ["git", "hash-object", "--", str(source)], text=True
                  ).strip()
                  if row.get("blobSha") != digest:
                      changed.append((row.get("module"), row.get("blobSha"), digest))
                      row["blobSha"] = digest
              path.write_text(
                  json.dumps(doc, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
              )
              for module, before, after in changed:
                  print(f"REBIND {module} {before} -> {after}")
          PY

          python3 scripts/hepta-readiness.py generate-status || true
          python3 scripts/hepta-implementation-dossiers.py generate-status || true
          python3 scripts/hepta-algorithm-docs.py generate-status || true
          python3 scripts/hepta-cns.py generate-status || true
          python3 scripts/hepta-docs.py generate-status || true

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: reconcile generated convergence truth'
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'CARRIER=%s\nBASE=%s\nCANDIDATE=%s\n' "$carrier" "$base" "$(git rev-parse HEAD)" | tee /tmp/convergence-identities.txt

      - name: Verify repository-controlled closure surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          if test -f scripts/hepta-lane-b-truth.py; then
            python3 scripts/hepta-lane-b-truth.py self-test
            python3 -m unittest scripts/test_hepta_lane_b_truth.py
            python3 scripts/hepta-lane-b-truth.py verify
            python3 scripts/hepta-lane-b-docs.py verify
          fi
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain convergence diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-lanes-convergence-${{ github.run_id }}
          path: |
            /tmp/convergence-identities.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish verified integration branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists; refusing to overwrite" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
