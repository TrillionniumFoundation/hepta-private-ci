name: Learning operator authoritative qualification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-result:
    name: qualification-result
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned qualification tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,llvm-tools-preview

      - name: Run exact-source and deterministic synthetic-merge qualification
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/learning-operator-target"
          bash scripts/hepta-learning-operator-authoritative.sh

      - name: Retain immutable qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-operator-authoritative-${{ github.event.pull_request.head.sha || github.sha }}
          path: .hepta-evidence/learning-operator/
          if-no-files-found: error
          retention-days: 90
