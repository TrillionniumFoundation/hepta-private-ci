name: Learning operator authoritative qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-result:
    name: qualification-result
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable source and protected-base identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          base="${EVENT_BASE_SHA:-}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            :
          elif [[ "$GITHUB_REF" == "refs/heads/${DEFAULT_BRANCH}" ]] \
            && [[ "$base" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$base" != 0000000000000000000000000000000000000000 ]]; then
            :
          else
            git fetch --no-tags origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            base="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "unable to resolve an exact protected-base commit" >&2
            exit 1
          fi
          if [[ "$base" == "$SOURCE_SHA" ]]; then
            base="$(git rev-parse "${SOURCE_SHA}^1")"
          fi
          test "$(git rev-parse "$base^{commit}")" = "$base"
          printf 'BASE_SHA=%s\n' "$base" >> "$GITHUB_ENV"
          printf 'sourceSha=%s\nsourceTree=%s\nbaseSha=%s\n' \
            "$SOURCE_SHA" "$(git rev-parse HEAD^{tree})" "$base"

      - name: Install pinned qualification tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,llvm-tools-preview

      - name: Run exact-source and deterministic synthetic-merge qualification
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/learning-operator-target"
          bash scripts/hepta-learning-operator-authoritative.sh

      - name: Retain immutable qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-operator-authoritative-${{ env.SOURCE_SHA }}
          path: .hepta-evidence/learning-operator/
          if-no-files-found: error
          retention-days: 90
