name: Hepta memory retrieval convergence

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: memory-retrieval-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  identity:
    name: Memory retrieval exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind event candidate and freshly fetched main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          if test "$MAIN_SHA" = "$SOURCE_SHA"; then
            BASE_SHA="$(git rev-parse --verify "$SOURCE_SHA^1")"
          else
            BASE_SHA="$MAIN_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/retrieval-source"
          printf 'source_sha=%s\nbase_sha=%s\nmain_sha=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$MAIN_SHA" \
            | tee "$RUNNER_TEMP/retrieval-source/refs.env"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-source/identity.txt"
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/retrieval-source/base.txt"
          printf '%s\n' "$MAIN_SHA" > "$RUNNER_TEMP/retrieval-source/current-main.txt"
          git archive --format=tar.gz "$SOURCE_SHA" > "$RUNNER_TEMP/retrieval-source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/retrieval-source/source.tar.gz" > "$RUNNER_TEMP/retrieval-source/SHA256SUMS"
      - name: Test candidate, verifier, retention and SLO rejection behavior
        run: >-
          python3 -m unittest -v
          scripts.tests.test_hepta_memory_retrieval_candidate
          scripts.tests.test_hepta_memory_retrieval_qualification
          scripts.tests.test_hepta_memory_retrieval_slo
          scripts.tests.test_hepta_memory_retrieval_archive
          scripts.tests.test_hepta_memory_retrieval_refresh_map
      - name: Require current source-object closure
        run: >-
          python3 scripts/hepta_memory_retrieval_qualification.py source
          --head "$SOURCE_SHA"
          --output "$RUNNER_TEMP/retrieval-source/source-observation.json"
      - name: Enforce independent review before product claim promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/hepta_memory_retrieval_qualification.py promotion
          --head "$SOURCE_SHA"
          --output "$RUNNER_TEMP/retrieval-source/promotion-guard.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-retrieval-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retrieval-source/
          retention-days: 90
          if-no-files-found: error

  qualify:
    name: Memory retrieval ${{ matrix.lane }}
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge, current-main]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUALIFICATION_LANE: ${{ matrix.lane }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ runner.temp }}/retrieval-cargo-target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct the exact tested object without candidate-selected checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          if test "$MAIN_SHA" = "$SOURCE_SHA"; then
            BASE_SHA="$(git rev-parse --verify "$SOURCE_SHA^1")"
          else
            BASE_SHA="$MAIN_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/retrieval-$QUALIFICATION_LANE"
          case "$QUALIFICATION_LANE" in
            source-head)
              TESTED_SHA="$SOURCE_SHA"
              ;;
            base-merge)
              TREE_SHA="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
              [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
              export GIT_AUTHOR_NAME='Memory retrieval qualification'
              export GIT_AUTHOR_EMAIL='qualification@users.noreply.github.com'
              export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
              export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
              export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
              export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
              TESTED_SHA="$(printf '%s\n' 'Deterministic memory retrieval qualification' \
                | git -c commit.gpgSign=false commit-tree "$TREE_SHA" -p "$BASE_SHA" -p "$SOURCE_SHA")"
              test "$(git show -s --format=%P "$TESTED_SHA")" = "$BASE_SHA $SOURCE_SHA"
              test "$(git rev-parse "$TESTED_SHA^{tree}")" = "$TREE_SHA"
              ;;
            current-main)
              TESTED_SHA="$MAIN_SHA"
              echo "SOURCE_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
              echo 'HEPTA_CI_LANE=source-head' >> "$GITHUB_ENV"
              ;;
            *) exit 1 ;;
          esac
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'source_sha=%s\nbase_sha=%s\nmain_sha=%s\ntested_sha=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$MAIN_SHA" "$TESTED_SHA" \
            > "$RUNNER_TEMP/retrieval-$QUALIFICATION_LANE/refs.env"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-$QUALIFICATION_LANE/tested-object.txt"
      - name: Prepare native host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Execute package tests with real nonzero test-count receipts
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for package in codex-hepta-memory-retrieval codex-hepta-memory codex-hepta-agentd codex-hepta-learning-ledger; do
            python3 scripts/hepta_ci_exec.py \
              --output "$RUNNER_TEMP/retrieval-$QUALIFICATION_LANE/$package-tests.json" \
              --minimum-tests 1 -- just test --locked -p "$package" || failed=1
          done
          exit "$failed"
      - name: All-target Clippy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RUNNER_TEMP/retrieval-$QUALIFICATION_LANE/clippy.json" -- \
            bash -c 'cd codex-rs && cargo clippy --locked --all-targets -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-learning-ledger -- -D warnings'
      - name: Formatting and clean source
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RUNNER_TEMP/retrieval-$QUALIFICATION_LANE/format.json" -- just fmt-check
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-retrieval-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retrieval-${{ matrix.lane }}/
          retention-days: 90
          if-no-files-found: error
