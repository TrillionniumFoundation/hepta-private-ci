name: Trillionnium OS external evidence source

on:
  pull_request:
    paths:
      - .g1/trillionnium_os_external_evidence/**
      - .github/workflows/trillionnium-os-external-evidence-source.yml
  push:
    branches:
      - codex/trillionnium-os-**
    paths:
      - .g1/trillionnium_os_external_evidence/**
      - .github/workflows/trillionnium-os-external-evidence-source.yml

permissions:
  contents: read

concurrency:
  group: trillionnium-os-external-evidence-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: External evidence source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .g1/trillionnium_os_external_evidence
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify checked-in policies cannot authorize execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          admission = json.loads(Path("policy.template.json").read_text())
          execution = json.loads(Path("execution-policy.template.json").read_text())
          assert admission["status"] == "UNPROVISIONED_TEMPLATE"
          assert set(admission["grant_public_key_sha256"]) == {"0"}
          assert admission["issuer_allowlist"] == []
          assert execution["status"] == "UNPROVISIONED_TEMPLATE"
          for key in ("admission_policy_sha256_allowlist", "grant_public_key_sha256_allowlist", "issuer_allowlist"):
              assert execution[key] == []
          PY
      - name: Compile and run hostile source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile admission_service.py trusted_executor.py tests/*.py
          python3 -m unittest discover -s tests -v
      - name: Verify source tests did not mutate the checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
