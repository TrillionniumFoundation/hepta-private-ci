name: Intuition immutable development source
on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths: [.github/workflows/intuition-source-export.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export tracked bytes and immutable Git identity only
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intuition-source"
          mkdir -p "$output"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=tar HEAD > "$output/source.tar"
          git cat-file commit HEAD > "$output/commit.txt"
          git rev-parse HEAD > "$output/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$output/source-tree.txt"
          printf '%s\n' 'Development source input only; not build, runtime, independent acceptance or release evidence.' > "$output/CLAIM_BOUNDARY.txt"
          cd "$output"
          sha256sum source.tar commit.txt source-sha.txt source-tree.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-source-${{ github.sha }}
          path: ${{ runner.temp }}/intuition-source/
          if-no-files-found: error
          retention-days: 1
