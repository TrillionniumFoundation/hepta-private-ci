name: intuition.policy One-shot Source Authoring

on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths:
      - ".github/intuition-authoring-patch/READY"
      - ".github/workflows/intuition-source-export.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/intuition-authoring-patch/READY"
      - ".github/workflows/intuition-source-export.yml"

permissions:
  contents: write

concurrency:
  group: intuition-one-shot-authoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-verify-push:
    name: Apply, format, verify, and publish source patch
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact authoring head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve immutable authoring identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            authoring_head="$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["head"]["sha"])')"
          else
            authoring_head="$GITHUB_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$authoring_head"
          printf 'AUTHORING_HEAD=%s\n' "$authoring_head" >> "$GITHUB_ENV"

      - name: Recover the exact reviewed patch and apply it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee "$RUNNER_TEMP/intuition-authoring-validate.log") 2>&1
          set -euo pipefail
          ready=.github/intuition-authoring-patch/READY
          base="$(sed -n 's/^base=//p' "$ready" | tr -d '\r')"
          part_000="$(sed -n 's/^part-000=//p' "$ready" | tr -d '\r')"
          part_001="$(sed -n 's/^part-001=//p' "$ready" | tr -d '\r')"
          part_002="$(sed -n 's/^part-002=//p' "$ready" | tr -d '\r')"
          test "$base" = "696447e733e22e425cd05691d98f4fe0ef63f759"
          test "$part_000" = "ff90ec4b0bb594c6659c0805f7683e625f423d46"
          test "$part_001" = "8ef03a50ccef25591918ed67fb42506bcfdd21f1"
          test "$part_002" = "627e323cc4086e712a04ffa58b02e7723415e64c"
          test "$(git cat-file -t "$base")" = commit
          for spec in \
            "part-000:$part_000" \
            "part-001:$part_001" \
            "part-002:$part_002"
          do
            name="${spec%%:*}"
            blob="${spec#*:}"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$blob" \
              | python3 -c 'import base64, json, sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
              > ".git/$name.b64"
          done
          python3 - <<'PY'
          import base64
          import binascii
          import hashlib
          import pathlib

          expected = "d9988033416a6bf64588b593c34496abba4d3f66a20df57d749a6308500ca3dc"
          parts = [
              b"".join(pathlib.Path(f".git/part-{index:03d}.b64").read_bytes().split())
              for index in range(3)
          ]
          direct = b"".join(parts)
          print("compact lengths:", [len(part) for part in parts], "total:", len(direct))

          def candidates():
              yield "direct", None, direct
              if len(direct) % 4 == 1:
                  for index in range(len(direct)):
                      yield (
                          "single-byte-removal",
                          index,
                          direct[:index] + direct[index + 1 :],
                      )

          matches = []
          for method, index, encoded in candidates():
              try:
                  patch = base64.b64decode(encoded, validate=True)
              except (ValueError, binascii.Error):
                  continue
              if hashlib.sha256(patch).hexdigest() == expected:
                  matches.append((method, index, patch))
                  if len(matches) > 1:
                      break
          if len(matches) != 1:
              raise SystemExit(f"expected one exact reviewed reconstruction, found {len(matches)}")
          method, index, patch = matches[0]
          if not patch.startswith(b"diff --git a/") or not patch.endswith(b"\n"):
              raise SystemExit("reviewed digest did not decode to a unified patch")
          target = pathlib.Path(".git/intuition-source.patch")
          target.write_bytes(patch)
          pathlib.Path(".git/intuition-source.patch.sha256").write_text(
              f"{expected}  {target.name}\n", encoding="utf-8"
          )
          pathlib.Path(".git/intuition-source.patch.recovery").write_text(
              f"method={method}\nindex={index}\nsha256={expected}\n", encoding="utf-8"
          )
          print(f"selected method={method} index={index} sha256={expected}")
          PY
          git diff --quiet
          git apply --check .git/intuition-source.patch
          git apply --index .git/intuition-source.patch
          rm -rf .github/intuition-authoring-patch
          rm -f .github/workflows/intuition-source-export.yml

      - name: Preserve exact patch evidence
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intuition-patched-source"
          mkdir -p "$output"
          cp .git/intuition-source.patch "$output/source.patch"
          cp .git/intuition-source.patch.sha256 "$output/source.patch.sha256"
          cp .git/intuition-source.patch.recovery "$output/source.patch.recovery"
          cp "$RUNNER_TEMP/intuition-authoring-validate.log" "$output/validate.log"
          git diff --cached --binary > "$output/applied.patch"

      - name: Upload exact patch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-final-use-patch-${{ env.AUTHORING_HEAD }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-patched-source/
          if-no-files-found: error
          retention-days: 7

      - name: Set up repository CI dependencies
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Format exact Rust source
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Verify Python boundaries and source inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/intuition_legacy_consumers.py
          python -m unittest discover -s scripts/tests -p 'test_intuition*.py' -v

      - name: Run final-use and existing boundary regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-intuition
          cargo test --locked -p codex-hepta-intelligence intuition
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_final_use_v4
          cargo test --locked -p codex-hepta-agentd --test intuition_policy_commit_boundary
          cargo test --locked -p codex-hepta-agentd --lib intuition_policy

      - name: Run strict lint on affected product package
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-agentd --lib --tests -- -D warnings

      - name: Verify formatting and source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          (cd codex-rs && cargo fmt --all -- --check)
          git diff --check
          test -z "$(find . -type d -name __pycache__ -print -quit)"

      - name: Publish one clean source commit on the reviewed base
        shell: bash
        env:
          TARGET_BRANCH: codex/intuition-policy-production-closure-20260927
          CLEAN_PARENT: 696447e733e22e425cd05691d98f4fe0ef63f759
        run: |
          set -euo pipefail
          git config user.name "OpenAI source authoring"
          git config user.email "assistant@openai.invalid"
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^\.github/(intuition-authoring-patch|workflows/intuition-source-export\.yml)' || true)"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(intuition): revalidate authority at final use' \
            'Preserve the sole ledger owner while moving fresh time, generation, and three-party qualification checks under its serialization boundary. Add typed boundary domains, stage telemetry, legacy-consumer drift checks, and separate safety/effectiveness/operator acceptance states.' \
            | git commit-tree "$tree" -p "$CLEAN_PARENT")"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORING_HEAD" \
            origin "$commit:refs/heads/$TARGET_BRANCH"
          printf '%s\n' "$commit"

      - name: Retain diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intuition-authoring-failure"
          mkdir -p "$output"
          git status --short > "$output/status.txt"
          git diff --binary > "$output/worktree.patch"
          git diff --cached --binary > "$output/index.patch"
          cp "$RUNNER_TEMP/intuition-authoring-validate.log" "$output/validate.log" 2>/dev/null || true
          cp .git/intuition-source.patch "$output/source.patch" 2>/dev/null || true
          cp .git/intuition-source.patch.sha256 "$output/source.patch.sha256" 2>/dev/null || true
          cp .git/intuition-source.patch.recovery "$output/source.patch.recovery" 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-authoring-failure-${{ env.AUTHORING_HEAD }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-authoring-failure/
          if-no-files-found: warn
          retention-days: 7
