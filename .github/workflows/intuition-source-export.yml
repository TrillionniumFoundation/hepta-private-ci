name: intuition.policy Candidate Extraction (slim)

on:
  push:
    branches: [codex/intuition-policy-extract-slim-20260930]
    paths:
      - ".github/intuition-authoring-patch/READY"
      - ".github/workflows/intuition-source-export.yml"

permissions:
  contents: read

concurrency:
  group: intuition-candidate-extraction-slim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    name: Recover reviewed patch and upload candidate source
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out fixed authoring head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Recover, verify, and apply exact patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ready=.github/intuition-authoring-patch/READY
          base="$(sed -n 's/^base=//p' "$ready" | tr -d '\r')"
          part_000="$(sed -n 's/^part-000=//p' "$ready" | tr -d '\r')"
          part_001="$(sed -n 's/^part-001=//p' "$ready" | tr -d '\r')"
          part_002="$(sed -n 's/^part-002=//p' "$ready" | tr -d '\r')"
          test "$base" = "696447e733e22e425cd05691d98f4fe0ef63f759"
          test "$part_000" = "ff90ec4b0bb594c6659c0805f7683e625f423d46"
          test "$part_001" = "8ef03a50ccef25591918ed67fb42506bcfdd21f1"
          test "$part_002" = "627e323cc4086e712a04ffa58b02e7723415e64c"

          for spec in "part-000:$part_000" "part-001:$part_001" "part-002:$part_002"; do
            name="${spec%%:*}"
            blob="${spec#*:}"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$blob" \
              | python3 -c 'import base64,json,sys;sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
              > ".git/$name.patchpart"
          done
          cat .git/part-000.patchpart .git/part-001.patchpart .git/part-002.patchpart > .git/intuition-source.patch
          printf '%s  %s\n' \
            '65975856ab09997a83bc4587639c6f3e49b07f5c5c9fafb283d01c1a2efce920' \
            '.git/intuition-source.patch' | sha256sum --check
          git apply --check .git/intuition-source.patch
          git apply .git/intuition-source.patch

          rm -rf .github/intuition-authoring-patch
          rm -f .github/workflows/intuition-source-export.yml
          rm -f .github/workflows/intuition-source-author-self-hosted.yml
          rm -f .github/workflows/intuition-source-author-pocket4.yml
          rm -f .github/workflows/intuition-source-author-macbook.yml

          mkdir -p "$RUNNER_TEMP/intuition-candidate"
          cp .git/intuition-source.patch "$RUNNER_TEMP/intuition-candidate/source.patch"
          sha256sum .git/intuition-source.patch > "$RUNNER_TEMP/intuition-candidate/source.patch.sha256"
          git diff --binary > "$RUNNER_TEMP/intuition-candidate/applied.patch"
          tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/intuition-candidate/source-tree.tar.gz" .

      - name: Upload exact candidate source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-final-use-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-candidate/
          if-no-files-found: error
          retention-days: 7
