name: Hepta Shared Stem System2 research contracts (DENY_ALL)
on:
  pull_request:
    paths:
      - 'qualification/shared-stem-system2-architecture/**'
      - '.github/workflows/hepta-shared-stem-system2-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-and-cost-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned NumPy required by inherited E6 physical contract tests
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Record exact source and tested code
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          sha256sum qualification/shared-stem-system2-architecture/*.py
      - name: Complete research controls normal and optimized
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s qualification/shared-stem-system2-architecture -p 'test_*.py' -v
          python -O -m unittest discover -s qualification/shared-stem-system2-architecture -p 'test_*.py' -v
      - name: Transparent hypothesis-only 4096-cell weight/forward budgets
        shell: bash
        run: |
          set -euo pipefail
          python qualification/shared-stem-system2-architecture/budget.py --cells 4096
          python qualification/shared-stem-system2-architecture/budget.py --cells 4096 --distinct-inputs
