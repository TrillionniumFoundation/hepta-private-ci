name: Intuition isolated development host
on:
  push:
    branches: [codex/intuition-devhost-20260928]
    paths: [.github/workflows/intuition-development-host.yml]
permissions:
  contents: write
concurrency:
  group: intuition-isolated-development-host
  cancel-in-progress: true
jobs:
  author:
    if: github.ref == 'refs/heads/codex/intuition-devhost-20260928'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      SOURCE_SHA: 989df50d813004a7a2fbf1221fc6f3c8dba6cd5f
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Author scoped formatting and lockfile with the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cd codex-rs
          rustfmt --edition 2024 --config skip_children=true \
            hepta-agentd/src/intuition_policy_service.rs \
            hepta-agentd/src/intuition_policy_admission.rs \
            hepta-agentd/src/intuition_policy_admission_tests.rs \
            hepta-agentd/src/intuition_policy_serving.rs \
            hepta-agentd/src/state.rs \
            hepta-agentd/src/objective_runtime.rs
          cargo metadata --format-version 1 > "$RUNNER_TEMP/intuition-authoring-metadata.json"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/intuition-authoring-locked-metadata.json"
          cd ..
          git diff --check
          git diff --stat
          git diff -- codex-rs/Cargo.lock
      - name: Store unreferenced Git objects for external source review only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          source = os.environ['SOURCE_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'TrillionniumFoundation/hepta-private-ci'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/intuition-devhost-20260928'
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD').decode().strip() == source
          allowed = {
              'codex-rs/Cargo.lock',
              'codex-rs/hepta-agentd/src/intuition_policy_service.rs',
              'codex-rs/hepta-agentd/src/intuition_policy_admission.rs',
              'codex-rs/hepta-agentd/src/intuition_policy_admission_tests.rs',
              'codex-rs/hepta-agentd/src/intuition_policy_serving.rs',
              'codex-rs/hepta-agentd/src/state.rs',
              'codex-rs/hepta-agentd/src/objective_runtime.rs',
          }
          paths = [p.decode() for p in git('diff', '--name-only', '-z').split(b'\0') if p]
          assert paths and set(paths) <= allowed, paths
          assert not git('ls-files', '--others', '--exclude-standard')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'intuition-source-proposal'
          output.mkdir()
          (output / 'source.diff').write_bytes(git('diff', '--binary'))
          token = os.environ['GH_TOKEN']
          def post(kind, data):
              # No refs, contents, PR, checks, status or acceptance endpoints.
              assert kind in {'blobs', 'trees', 'commits'}
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/{kind}',
                  data=json.dumps(data).encode(), method='POST',
                  headers={'Authorization': f'Bearer {token}',
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for path in paths:
              data = pathlib.Path(path).read_bytes().replace(b'\r\n', b'\n')
              assert len(data) <= 2_000_000
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              blob = post('blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert blob['sha'] == expected
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
          tree = post('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries})
          commit = post('commits', {
              'message': 'chore(intuition): synchronize the generated lockfile and scoped Rust formatting\n\nGenerated on an isolated development host; no qualification or acceptance claim. Candidate ref updates require separate source review.',
              'tree': tree['sha'], 'parents': [source]})
          result = {'schema': 'hepta.intuition.source-proposal.v1', 'sourceSha': source,
                    'proposedCommit': commit['sha'], 'tree': tree['sha'], 'files': entries,
                    'workflowRun': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'candidateRefUpdated': False, 'executionQualification': False,
                    'claim': 'Source authoring only. External review must precede an ordinary candidate commit update.'}
          (output / 'proposal.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          print('INTUITION_SOURCE_PROPOSAL=' + commit['sha'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intuition-source-proposal-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-source-proposal/
          if-no-files-found: warn
          retention-days: 7
# This workflow exists only on the disposable development branch, never on the
# candidate. It stores unreferenced source objects, does not update any ref and
# is not qualification. The candidate's qualification remains read-only.
