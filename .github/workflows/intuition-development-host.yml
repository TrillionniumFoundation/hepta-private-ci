name: Intuition isolated development host
on:
  push:
    branches: [codex/intuition-devhost-20260928]
    paths: [.github/workflows/intuition-development-host.yml]
permissions:
  contents: write
concurrency:
  group: intuition-isolated-development-host
  cancel-in-progress: true
jobs:
  author:
    if: github.ref == 'refs/heads/codex/intuition-devhost-20260928'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      SOURCE_SHA: 301cc06cbc80fe339f8f3055db5315d53acfc177
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: ${{ runner.temp }}/intuition-source-authoring-target
    steps:
      - name: Read the isolated source recipe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/intuition-development-edit.py
            /.github/intuition-development-publish.py
            /codex-rs/hepta-intuition/src/production_native.rs
            /scripts/intuition_state.py
            /scripts/tests/test_intuition_state.py
            /docs/modules/intuition.policy/CURRENT_STATE.json
      - name: Read the immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Apply the bounded source recipe and generate documentation projections
        shell: bash
        run: python recipe/.github/intuition-development-edit.py source
      - name: Format only changed Rust sources and test the source-state generator
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --name-only -- '*.rs' | while IFS= read -r file; do
            (cd codex-rs && rustfmt --edition 2024 --config skip_children=true "../$file")
          done
          python scripts/intuition_state.py --check
          python -m unittest discover -s scripts/tests -p 'test_intuition_state.py' -v
          git diff --check
      - name: Exercise the native policy with locked dependencies
        working-directory: source/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/intuition-authoring-locked-metadata.json"
          cargo test --locked -p codex-hepta-intuition --lib
          cargo clippy --locked -p codex-hepta-intuition --lib -- -D warnings
      - name: Propose unreferenced source objects for external review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python recipe/.github/intuition-development-publish.py source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intuition-source-proposal-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intuition-source-proposal/
          if-no-files-found: warn
          retention-days: 7
# This authoring workflow exists only on the disposable development branch.
# It cannot update candidate refs, checks or acceptance. The assistant reviews
# its diff and independently makes an ordinary fast-forward source commit.
# Authoring test output does not replace final immutable source/merge evidence.
