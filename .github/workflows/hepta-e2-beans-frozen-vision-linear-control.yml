name: Hepta E2 Beans frozen Vision Ridge control (DENY_ALL)
on:
  push:
    branches:
      - research/e2-beans-frozen-vision-linear-control-20261015
    paths:
      - 'experiments/shared_stem_cell/e2_beans_frozen_vision_linear_probe.py'
      - 'experiments/shared_stem_cell/e2_beans_vision_probe_independent_score.py'
      - 'experiments/shared_stem_cell/test_e2_beans_frozen_vision_linear_probe.py'
      - 'experiments/shared_stem_cell/E2_BEANS_FROZEN_VISION_LINEAR_CONTROL_20261015.md'
      - '.github/workflows/hepta-e2-beans-frozen-vision-linear-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-linear-control-contract:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install fixed numerical solver
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python -m pip check
      - name: Verify original four-archive audit and heldout label isolation
        run: |
          set -euo pipefail
          export PYTHONPATH=experiments/shared_stem_cell
          python -m unittest discover -s experiments/shared_stem_cell -p test_e2_beans_original_zip_review.py -q
          python -m unittest discover -s experiments/shared_stem_cell -p test_e2_beans_frozen_vision_linear_probe.py -v
          python -O -m unittest discover -s experiments/shared_stem_cell -p test_e2_beans_frozen_vision_linear_probe.py -v
          python -m py_compile experiments/shared_stem_cell/e2_beans_frozen_vision_linear_probe.py \
            experiments/shared_stem_cell/e2_beans_vision_probe_independent_score.py
      - name: Reject false authority and ensure exact math/forecast source
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0,'experiments/shared_stem_cell')
          from e2_beans_frozen_vision_linear_probe import ALPHA, PARAMETER_COUNT, PROBE
          from e2_beans_vision_probe_independent_score import exact_mcnemar
          assert ALPHA == 0.1 and PARAMETER_COUNT == 1155
          assert exact_mcnemar(6,0) == 0.03125
          assert PROBE.endswith('.v1')
          PY
