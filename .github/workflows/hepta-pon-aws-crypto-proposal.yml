name: Hepta PoN AWS crypto source and lock proposal (non-qualifying)

# One-shot source/lock generation only. The artifact must be reviewed and
# committed coherently before the original native qualification can apply.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/hepta-pon-aws-crypto-proposal.yml"
      - "scripts/hepta_pon_aws_crypto_proposal.py"
      - "scripts/hepta_pon_aws_crypto_source.py"
      - "scripts/test_hepta_pon_aws_crypto_proposal.py"
      - "scripts/test_hepta_pon_aws_crypto_source.py"
      - "qa/pon-aws-crypto-proposal-20261028-r9/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed workflow head, full lowercase commit SHA
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: hepta-pon-aws-crypto-proposal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proposal:
    name: Generate actual AWS crypto source and locks; no native qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Reject ambiguous or fork sources before checkout
        id: identity
        timeout-minutes: 2
        run: |
          python3 - <<'PY_SOURCE'
          import json
          import os
          import re
          from pathlib import Path
          repository = "TrillionniumFoundation/hepta-private-ci"
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if os.environ.get("GITHUB_REPOSITORY") != repository:
              raise ValueError("unexpected proposal repository")
          kind = os.environ.get("GITHUB_EVENT_NAME")
          if kind == "workflow_dispatch":
              if "pull_request" in event:
                  raise ValueError("dispatch cannot contain a PR source")
              source = event.get("inputs", {}).get("source_sha")
              if source != os.environ.get("GITHUB_SHA"):
                  raise ValueError("dispatch source must equal the workflow run SHA")
          elif kind == "pull_request":
              if event.get("inputs") or event.get("action") not in {"opened", "synchronize", "reopened"}:
                  raise ValueError("PR source cannot use dispatch inputs or another action")
              pr = event.get("pull_request", {})
              head = pr.get("head", {})
              head_repo = head.get("repo", {})
              if head_repo.get("full_name") != repository or head_repo.get("fork") is not False:
                  raise ValueError("proposal rejects fork and foreign-repository PR sources")
              if pr.get("base", {}).get("repo", {}).get("full_name") != repository:
                  raise ValueError("proposal PR base repository mismatch")
              number = event.get("number")
              if type(number) is not int or number <= 0 or os.environ.get("GITHUB_REF") != f"refs/pull/{number}/merge":
                  raise ValueError("proposal PR event/ref mismatch")
              source = head.get("sha")
          else:
              raise ValueError("proposal requires workflow_dispatch or a restricted pull_request event")
          if not isinstance(source, str) or not re.fullmatch(r"[0-9a-f]{40}", source):
              raise ValueError("source must be one complete lowercase commit SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("source=" + source + "\n")
          PY_SOURCE
      - name: Checkout exact declared source without retained credentials
        id: checkout
        timeout-minutes: 3
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.identity.outputs.source }}
          persist-credentials: false
      - name: Prepare immutable source and original lock receipts
        id: prepare
        timeout-minutes: 2
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.identity.outputs.source }}
        run: |
          python3 scripts/hepta_pon_aws_crypto_proposal.py prepare \
            --source "$EXPECTED_SOURCE_SHA" \
            --output "$RUNNER_TEMP/hepta-pon-aws-crypto-proposal"
      - name: Install the existing pinned metadata toolchain
        timeout-minutes: 8
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        timeout-minutes: 3
        with:
          tool: just@1.51.0
      - name: Install pinned Bazelisk without changing runner security policy
        timeout-minutes: 5
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
      - name: Resolve actual dependencies, format only the provider, and run original Bazel recipe
        id: proposal
        timeout-minutes: 35
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.identity.outputs.source }}
          RUSTUP_TOOLCHAIN: "1.96.0"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          python3 scripts/hepta_pon_aws_crypto_proposal.py run \
            --source "$EXPECTED_SOURCE_SHA" \
            --output "$RUNNER_TEMP/hepta-pon-aws-crypto-proposal"
      - name: Preserve generated bytes, failures and interrupted stage identity
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 3
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.identity.outputs.source }}
          PROPOSAL_STEP_OUTCOME: ${{ steps.proposal.outcome }}
        run: |
          python3 scripts/hepta_pon_aws_crypto_proposal.py finalize \
            --source "$EXPECTED_SOURCE_SHA" \
            --output "$RUNNER_TEMP/hepta-pon-aws-crypto-proposal"
      - name: Retain exact original, prepared, generated source and full command logs
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-pon-aws-crypto-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-pon-aws-crypto-proposal/
          if-no-files-found: warn
          retention-days: 14
      - name: Reject qualification of an uncommitted dependency graph
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
