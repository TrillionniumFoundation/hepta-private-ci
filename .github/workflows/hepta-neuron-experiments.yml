name: Hepta Neuron E0-E4 evidence gate (no model qualification)

on:
  pull_request:
    paths:
      - 'tools/hepta-neuron-experiments/**'
      - '.github/workflows/hepta-neuron-experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

# One candidate at a time: obsolete 600MB+ pretrained downloads must not
# accumulate across rapid research commits on the same PR.
concurrency:
  group: hepta-neuron-e0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provenance-gate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Fail-closed provenance and receipt tests (fixtures only)
        run: python3 -m unittest discover -v -s tools/hepta-neuron-experiments -p 'test_*.py'
      - name: No source mutation
        run: |
          git diff --check
          git diff --exit-code

  real-public-e0-shadow-projection:
    # No privileged credentials, and do not execute same-repository code from forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout exact experiment candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout pinned previously tested HF loader
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: be511bd63aaae8813c415a116d50f01fe54baba5
          path: research-source
          persist-credentials: false
      - name: Checkout pinned existing Stem Q24 projector and Head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d6f35c362289c90427bfbdffd4505d2e535c1b1b
          path: audited-source
          persist-credentials: false
      - name: Verify all three source identities before dependencies
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C research-source rev-parse HEAD)" = be511bd63aaae8813c415a116d50f01fe54baba5
          test "$(git -C audited-source rev-parse HEAD)" = d6f35c362289c90427bfbdffd4505d2e535c1b1b
          python3 --version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned public pretrained CPU inference dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0 transformers==4.57.1 huggingface-hub==0.36.0 tokenizers==0.22.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -c "from safetensors.torch import load_file; import packaging.version"
      - name: Execute exact public pretrained feature and original projection operator
        env:
          PYTHONHASHSEED: "7347"
        run: |
          set -euo pipefail
          python tools/hepta-neuron-experiments/e0_public_shadow.py \
            --research-root "$GITHUB_WORKSPACE/research-source" \
            --audited-root "$GITHUB_WORKSPACE/audited-source" \
            --acquire-public --output "$RUNNER_TEMP/hepta-e0-public-shadow" \
            | tee "$RUNNER_TEMP/hepta-e0-public-shadow.log"
      - name: Upload diagnostic hashes and faults without pretrained tensors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e0-public-pretrained-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hepta-e0-public-shadow/report.json
            ${{ runner.temp }}/hepta-e0-public-shadow/FAILED.json
            ${{ runner.temp }}/hepta-e0-public-shadow.log
          if-no-files-found: warn
          retention-days: 7
      - name: Check source immutability
        if: always()
        run: |
          git diff --check
          git diff --exit-code
