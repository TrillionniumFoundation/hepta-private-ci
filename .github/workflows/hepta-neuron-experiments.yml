name: Hepta Neuron E0-E4 evidence gate (no model qualification)

on:
  pull_request:
    paths:
      - 'tools/hepta-neuron-experiments/**'
      - '.github/workflows/hepta-neuron-experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-gate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Fail-closed provenance and receipt tests (fixtures only)
        run: python3 -m unittest discover -v -s tools/hepta-neuron-experiments -p 'test_*.py'
      - name: No source mutation
        run: |
          git diff --check
          git diff --exit-code
