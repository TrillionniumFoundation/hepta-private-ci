name: HCSN fixed-prior physical sensitivities
on:
  pull_request:
    paths:
      - qualification/hcsn_joint_dde/sensitivities.py
      - qualification/hcsn_joint_dde/test_sensitivities.py
      - qualification/hcsn_joint_dde/model.py
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - .github/workflows/hcsn-joint-sensitivities.yml
permissions:
  contents: read
jobs:
  physical-partials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -B -m unittest qualification.hcsn_joint_dde.test_sensitivities -v
      - run: git diff --exit-code && git diff --cached --exit-code
