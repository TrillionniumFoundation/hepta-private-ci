name: chain-hepta-fixed-point-r21

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/chain-hepta-fixed-point-r21.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: chain-hepta-fixed-point-r21
  cancel-in-progress: false

jobs:
  chain:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 12b54ab7a0dfaf15896bae642b3aa135f5b982c2
      TARGET_BRANCH: ops/hepta-global-gap-closure-controller-20260910-r1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact chain source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and install latest-run arbitration
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:.github/workflows/chain-hepta-fixed-point-r21.yml)" = "$(git hash-object .github/workflows/chain-hepta-fixed-point-r21.yml)"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          paths = (
              Path('.github/workflows/hepta-global-finalizer-r9.yml'),
              Path('.github/workflows/hepta-fixed-point-sealer-r11.yml'),
              Path('.github/workflows/hepta-candidate-publisher-r12.yml'),
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              old = '  cancel-in-progress: false\n'
              new = '  cancel-in-progress: true\n'
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: ambiguous concurrency policy')
                  text = text.replace(old, new, 1)
                  path.write_text(text, encoding='utf-8')
              elif text.count(new) != 1:
                  raise SystemExit(f'{path}: missing latest-run concurrency policy')
          PY
          python3 -m py_compile \
            scripts/hepta-global-finalizer-r7.py \
            scripts/hepta-global-finalizer-r8.py \
            scripts/hepta-global-finalizer-r8-fixed.py \
            scripts/hepta-fixed-point-sealer-r10.py \
            scripts/hepta-fixed-point-sealer-r11.py \
            scripts/hepta-candidate-publisher-r12.py
          git diff --check

      - name: Publish clean chain controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-fixed-point-chain'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/chain-hepta-fixed-point-r21.yml
          git add \
            .github/workflows/hepta-global-finalizer-r9.yml \
            .github/workflows/hepta-fixed-point-sealer-r11.yml \
            .github/workflows/hepta-candidate-publisher-r12.yml
          git diff --cached --check
          git commit --signoff -m 'ci(hepta): latest exact fixed-point run supersedes stale runs'
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Dispatch latest-bound replay, seal and publisher
        shell: bash
        run: |
          set -euo pipefail
          clean_sha="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${clean_sha}"
          gh workflow run hepta-global-finalizer-r9.yml \
            --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
          gh workflow run hepta-fixed-point-sealer-r11.yml \
            --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
          gh workflow run hepta-candidate-publisher-r12.yml \
            --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
