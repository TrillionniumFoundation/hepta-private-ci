name: memory federation convergence bootstrap

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - ".github/workflows/memory-federation-convergence-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memory-federation-convergence-bootstrap
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APPLY_GZ_B64: 
    steps:
      - name: Check out exact bootstrap head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded memory federation convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, os
          payload = base64.b64decode(os.environ["APPLY_GZ_B64"])
          open("/tmp/apply-memory-federation-convergence.py", "wb").write(gzip.decompress(payload))
          PY
          python3 /tmp/apply-memory-federation-convergence.py
          rm .github/workflows/memory-federation-convergence-bootstrap.yml

      - name: Format affected Rust crates
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-memory-extension -p codex-hepta-agentd -p codex-app-server

      - name: Verify patch hygiene
        run: git diff --check

      - name: Test canonical federation contract
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-memory-federation --lib

      - name: Test recovered owner generation fencing
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-memory --lib federation_follows_recovered_owner_and_old_readers_cannot_cross_generation

      - name: Test product discovery and aggregation
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-memory --lib cognitive_runtime_tests

      - name: Test legacy federation regressions
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-memory --lib cognitive_federation_tests

      - name: Test model-input federation integration
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-memory-extension --lib cognitive::federation

      - name: Check Agentd and App Server composition
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-agentd -p codex-app-server

      - name: Strict lint canonical and product crates
        working-directory: codex-rs
        run: |
          cargo clippy --locked -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-memory-extension -p codex-app-server --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-agentd --lib -- -D warnings

      - name: Commit and replay verified change onto current branch
        run: |
          set -euo pipefail
          git config user.name "Hepta Memory Federation CI"
          git config user.email "hepta-memory-federation-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -s -m "fix(memory): fence federation to current owner generation"
          git fetch origin work/product-convergence-20260923
          git rebase origin/work/product-convergence-20260923
          git push origin HEAD:work/product-convergence-20260923
