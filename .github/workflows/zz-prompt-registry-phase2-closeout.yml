# exact-export: validate locally and export reviewed source bytes for Git-data publication
name: Prompt registry phase 2 verified export

on:
  push:
    branches:
      - codex/prompt-registry-full-closeout-20260929
    paths:
      - .github/workflows/zz-prompt-registry-phase2-closeout.yml

permissions:
  contents: read

concurrency:
  group: prompt-registry-phase2-verified-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      EXPECTED_TRIGGER_PARENT: ae491f090f71bd909796eb51aee9f61fe4e3e6b8
      EXPECTED_WORKFLOW_PARENT: 0370f2ee23092735f5a72d5393f3af0eaed4db11
      EXPECTED_DELIVERY_PARENT: 8825996f927ca1cb3e1271ffcce0261ce25b398e
      AUTHOR_BRANCH: ops/prompt-registry-phase2-author-20260930
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact trigger and reviewed transformations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TRIGGER_PARENT"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_WORKFLOW_PARENT"
          test "$(git rev-parse HEAD^^^)" = "$EXPECTED_DELIVERY_PARENT"
          git fetch origin "refs/heads/$AUTHOR_BRANCH:refs/remotes/origin/$AUTHOR_BRANCH"
          git show "refs/remotes/origin/$AUTHOR_BRANCH:.github/scripts/prompt_registry_phase2_20260930.py" > "$RUNNER_TEMP/phase2.py"
          git show "refs/remotes/origin/$AUTHOR_BRANCH:.github/scripts/prompt_registry_phase2_fixups_20260930.py" > "$RUNNER_TEMP/phase2-fixups.py"

      - name: Apply governed capability and compensation closure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/phase2.py"
          python3 "$RUNNER_TEMP/phase2-fixups.py"
          git diff --check

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Prepare native product dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          CODEX_REPO_ROOT="$GITHUB_WORKSPACE" PYTHONPATH=scripts python3 scripts/hepta_ci_v8.py

      - name: Format affected candidate crates with the fixed toolchain
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-prompt-registry \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-agentd \
            -p codex-hepta-intelligence \
            -p codex-hepta-prompt-extension
          cargo fmt \
            -p codex-hepta-prompt-registry \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-agentd \
            -p codex-hepta-intelligence \
            -p codex-hepta-prompt-extension \
            -- --check

      - name: Run governed owner and product regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-prompt-registry
          cargo test --locked -p codex-hepta-prompt-extension --lib
          cargo test --locked -p codex-hepta-agentd --lib

      - name: Compile and strictly lint the complete affected surface
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-hepta-prompt-registry \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-agentd \
            -p codex-hepta-intelligence \
            -p codex-hepta-prompt-extension \
            --all-targets
          cargo clippy --locked \
            -p codex-hepta-prompt-registry \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-agentd \
            -p codex-hepta-intelligence \
            -p codex-hepta-prompt-extension \
            --all-targets --no-deps -- -D warnings

      - name: Build locally committed exact candidate and generated truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git rm .github/workflows/zz-prompt-registry-phase2-closeout.yml
          git add \
            codex-rs/hepta-prompt-registry/src/durable.rs \
            codex-rs/hepta-agentd/src/lib.rs \
            codex-rs/hepta-agentd/src/app_runtime.rs \
            codex-rs/hepta-agentd/src/prompt_runtime.rs \
            codex-rs/hepta-agentd/src/prompt_runtime_tests.rs \
            scripts/hepta-prompt-registry-map.py
          test -n "$(git diff --cached --name-only)"
          git diff --exit-code
          git commit -m 'refactor(prompt.registry): close raw capability surface'

          python3 scripts/hepta-prompt-registry-map.py --write
          git add \
            docs/modules/prompt.registry/IMPLEMENTATION_MAP.json \
            docs/modules/prompt.registry/QUALIFICATION_STATUS.md
          if test -n "$(git diff --cached --name-only)"; then
            git commit -m 'docs(prompt.registry): bind closed-world capability truth'
          fi
          python3 scripts/hepta-prompt-registry-map.py --check
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Export exact final tree delta
        shell: bash
        run: |
          set -euo pipefail
          export_root="$RUNNER_TEMP/prompt-registry-phase2-export"
          mkdir -p "$export_root/files"
          git diff --name-status "$EXPECTED_DELIVERY_PARENT"..HEAD > "$export_root/name-status.txt"
          git diff --binary "$EXPECTED_DELIVERY_PARENT"..HEAD > "$export_root/candidate.patch"
          git rev-parse HEAD > "$export_root/local-head.txt"
          git rev-parse HEAD^{tree} > "$export_root/local-tree.txt"
          git rev-parse "$EXPECTED_DELIVERY_PARENT" > "$export_root/delivery-parent.txt"
          while IFS= read -r path; do
            mkdir -p "$export_root/files/$(dirname "$path")"
            cp "$path" "$export_root/files/$path"
          done < <(git diff --name-only --diff-filter=ACMRT "$EXPECTED_DELIVERY_PARENT"..HEAD)
          tar -C "$export_root" -czf "$RUNNER_TEMP/prompt-registry-phase2-export.tar.gz" .
          sha256sum "$RUNNER_TEMP/prompt-registry-phase2-export.tar.gz" > "$RUNNER_TEMP/prompt-registry-phase2-export.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-phase2-export-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prompt-registry-phase2-export.tar.gz
            ${{ runner.temp }}/prompt-registry-phase2-export.sha256
          if-no-files-found: error
          retention-days: 30
