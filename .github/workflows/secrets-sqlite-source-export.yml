name: Export exact secrets SQLite recovery source

on:
  push:
    branches:
      - codex/secrets-heptabao-sqlite-recovery-20260928
    paths:
      - .github/workflows/secrets-sqlite-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-export
          git archive --format=tar.gz --output=.hepta-export/source.tgz HEAD
          git rev-parse HEAD > .hepta-export/HEAD
          git rev-parse HEAD^{tree} > .hepta-export/TREE
          (cd .hepta-export && sha256sum source.tgz HEAD TREE > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-sqlite-source-${{ github.sha }}
          path: .hepta-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
