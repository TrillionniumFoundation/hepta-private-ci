name: Hepta exact-head Windows link r9

on:
  push:
    branches:
      - ops/exact-head-final-candidate-20260908-r9

permissions:
  contents: read

concurrency:
  group: hepta-exact-head-windows-link-r9
  cancel-in-progress: false

env:
  BASE_SHA: 04f60466394a024c218ce66b1b32d1c42c462985
  SOURCE_SHA: d0f64ecfbbab31a8495c4adc1ec0a987281ade4c
  SOURCE_TREE: b5a1de9094fab07465a0e710e0bc2751887ac77e
  RUST_BACKTRACE: "1"

jobs:
  validate-windows-link:
    name: validate root-visible SQLx consumer
    runs-on: windows-latest
    timeout-minutes: 90
    environment:
      name: bazel
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Retain controller materializer outside the source checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - shell: bash
        run: cp .github/scripts/hepta_final_candidate_r8.py "${RUNNER_TEMP}/hepta_final_candidate_r8.py"

      - name: Checkout immutable source subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind immutable topology and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${SOURCE_TREE}"

      - name: Materialize the complete candidate delta locally
        shell: bash
        run: python3 "${RUNNER_TEMP}/hepta_final_candidate_r8.py"

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: hepta-final-r9-windows-link

      - name: Verify SQLx consumer and exec-link configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"@crates//:sqlx"' codex-rs/hepta-shadow-qualification/BUILD.bazel
          test "$(grep -Fc 'common:windows --@rules_rust//rust/settings:extra_exec_rustc_flag=-Clink-arg=bcryptprimitives.lib' .bazelrc)" -eq 1

      - name: Build root-visible SQLx consumer
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --windows-msvc-host-platform \
            -- \
            build \
            --platforms=//:windows_x86_64_msvc \
            --build_metadata=COMMIT_SHA=${SOURCE_SHA} \
            --build_metadata=TAG_job=hepta_final_r9_windows_link \
            -- \
            //codex-rs/hepta-shadow-qualification:hepta-shadow-qualification-lib

      - name: Final invariants
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Generation::new(/* value */ 1)?' codex-rs/hepta-runtime/src/organs.rs
          test "$(grep -Fc 'walk_error_chain(error, /* depth */ 0' \
            codex-rs/http-client/src/tls_backend_fallback.rs)" -eq 2
          git diff --check
