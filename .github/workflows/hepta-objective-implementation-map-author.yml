name: Hepta objective implementation-map authoring

on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927
    paths:
      - .github/workflows/hepta-objective-implementation-map-author.yml

permissions:
  contents: read

concurrency:
  group: objective-implementation-map-author
  cancel-in-progress: false

jobs:
  author:
    name: Rebind objective implementation map as ordinary source
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Rewrite product-path roles and commit logical map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          path = Path('docs/modules/objective.compiler/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text(encoding='utf-8'))
          operations = row.get('operations')
          if not isinstance(operations, list):
              raise SystemExit('objective implementation map has no operation list')
          by_name = {item.get('operation'): item for item in operations if isinstance(item, dict)}
          if len(by_name) != len(operations):
              raise SystemExit('objective implementation map operation identities are not unique')

          def update(name: str, **fields: object) -> None:
              operation = by_name.get(name)
              if operation is None:
                  raise SystemExit(f'missing existing operation: {name}')
              operation.update(fields)

          def add(operation: dict[str, object]) -> None:
              name = operation['operation']
              if name in by_name:
                  by_name[name].update(operation)
                  return
              operations.append(operation)
              by_name[name] = operation

          update(
              'admit_objective_v1',
              state='source_implemented_lower_level_raw_profile_admission_not_agentd_product_path',
              productRole='lower_level_and_compatibility_entrypoint',
          )
          update(
              'compile_admitted_objective_v1',
              state='source_implemented_lower_level_compile_not_agentd_product_path',
              productRole='lower_level_and_compatibility_entrypoint',
          )
          update(
              'encode_authenticated_objective_function_v1',
              state='source_implemented_compatibility_revalidation_projection',
              productRole='compatibility_revalidation_not_agentd_product_path',
          )

          add({
              'operation': 'validate_admission_profile_v1',
              'nativeSymbol': 'ValidatedAdmissionProfileV1::new',
              'sourcePath': 'codex-rs/hepta-objective/src/validated_admission.rs',
              'inputs': ['ObjectiveAdmissionProfileV1'],
              'outputs': [
                  'opaque generation-local ValidatedAdmissionProfileV1',
                  'profile digest/revision/compiler-contract reuse key',
                  'static source indexes and collision proofs',
              ],
              'state': 'source_implemented_generation_local_static_validation',
              'authority': 'none_static_validation_only',
              'tests': [
                  {
                      'path': 'codex-rs/hepta-objective/src/validated_admission_tests.rs',
                      'symbol': 'validated_profile_builds_indexes_and_rejects_duplicate_targets',
                  },
                  {
                      'path': 'codex-rs/hepta-objective/src/validated_admission_tests.rs',
                      'symbol': 'frozen_profile_reuse_never_caches_authentication_time_or_profile_selection',
                  },
              ],
              'designOperation': 'validate_admission_profile_v1',
              'mappingClass': 'owner_native',
              'delegatedCallees': [],
              'sourcePathExists': True,
              'reuseBoundary': 'static profile validation and indexes only; no authentication, time, revocation, generation, fence or final-use authority',
          })
          add({
              'operation': 'compile_authoritative_objective_v1',
              'nativeSymbol': 'codex_hepta_objective::compile_authoritative_objective_v1',
              'sourcePath': 'codex-rs/hepta-objective/src/validated_admission.rs',
              'inputs': [
                  'ObjectiveSourceEnvelopeV1',
                  'ValidatedAdmissionProfileV1',
                  'fresh ObjectiveAdmissionContextV1',
              ],
              'outputs': ['opaque ProofBearingObjectiveCompileV1'],
              'state': 'source_implemented_canonical_agentd_product_compile',
              'authority': 'deny_all',
              'tests': [
                  {
                      'path': 'codex-rs/hepta-objective/src/validated_admission_tests.rs',
                      'symbol': 'proof_binds_source_profile_context_and_compiler_contract',
                  },
                  {
                      'path': 'codex-rs/hepta-objective/src/validated_admission_tests.rs',
                      'symbol': 'frozen_profile_reuse_never_caches_authentication_time_or_profile_selection',
                  },
              ],
              'designOperation': 'compile_authoritative_objective_v1',
              'mappingClass': 'owner_native',
              'delegatedCallees': [
                  {
                      'path': 'codex-rs/hepta-objective/src/objective_admission.rs',
                      'symbol': 'admit_frozen_objective_v1',
                      'role': 'request_local_authenticated_admission',
                  },
                  {
                      'path': 'codex-rs/hepta-objective/src/compiler.rs',
                      'symbol': 'crate::compiler::compile',
                      'role': 'deterministic_native_compile',
                  },
              ],
              'sourcePathExists': True,
          })
          add({
              'operation': 'encode_proof_bearing_objective_function_v1',
              'nativeSymbol': 'codex_hepta_objective::encode_proof_bearing_objective_function_v1',
              'sourcePath': 'codex-rs/hepta-objective/src/proof_projection.rs',
              'inputs': [
                  'opaque ProofBearingObjectiveCompileV1',
                  'ObjectiveSourceEnvelopeV1',
                  'ValidatedAdmissionProfileV1',
              ],
              'outputs': [
                  'canonical ObjectiveFunctionV1 bytes',
                  'protocol digest and native semantic digest binding',
              ],
              'state': 'source_implemented_canonical_agentd_product_projection',
              'authority': 'none',
              'tests': [
                  {
                      'path': 'codex-rs/hepta-objective/src/proof_projection_tests.rs',
                      'symbol': 'proof_projection_matches_independent_authenticated_recompilation',
                  },
                  {
                      'path': 'codex-rs/hepta-objective/src/proof_projection_tests.rs',
                      'symbol': 'proof_projection_rejects_metadata_intent_and_profile_substitution',
                  },
                  {
                      'path': 'codex-rs/hepta-objective/src/proof_projection_tests.rs',
                      'symbol': 'frozen_profile_does_not_cache_authentication_or_freshness',
                  },
                  {
                      'path': 'codex-rs/hepta-objective/src/proof_projection_tests.rs',
                      'symbol': 'proof_projection_rejects_conflict_but_preserves_explicit_abstain',
                  },
              ],
              'designOperation': 'encode_proof_bearing_objective_function_v1',
              'mappingClass': 'owner_native',
              'delegatedCallees': [
                  {
                      'path': 'codex-rs/hepta-objective/src/objective_function_v1.rs',
                      'symbol': 'encode_validated_profile_objective_function_v1',
                      'role': 'strict_native_source_receipt_and_protocol_projection',
                  },
                  {
                      'path': 'codex-rs/hepta-objective/src/objective_function_v1.rs',
                      'symbol': 'decode_objective_function_v1',
                      'role': 'strict_canonical_wire_revalidation',
                  },
              ],
              'sourcePathExists': True,
          })

          row['canonicalProductOperations'] = [
              'decode_source_envelope_json_v1',
              'validate_structure',
              'validate_admission_profile_v1',
              'compile_authoritative_objective_v1',
              'encode_proof_bearing_objective_function_v1',
              'decode_objective_function_v1',
          ]

          for evidence in row.get('productCallerEvidence', []):
              if not isinstance(evidence, dict):
                  continue
              if evidence.get('path') == 'codex-rs/hepta-agentd/src/objective_runtime.rs':
                  evidence['symbol'] = 'ObjectiveRuntimeHost::open / ObjectiveRuntimeHost::submit'
                  evidence['semantics'] = (
                      'open freezes one owner-local validated profile for the process generation; '
                      'submit authenticates every signed request against current trust, builds a fresh '
                      'admission context and calls the validated intelligence façade before current '
                      'deadline/trust/generation/fence runtime admission'
                  )
              elif evidence.get('path') == 'codex-rs/hepta-intelligence/src/objective_run.rs':
                  evidence['symbol'] = 'compile_and_publish_validated_objective_run_v1'
                  evidence['semantics'] = (
                      'fresh authenticated admission through a generation-local frozen profile -> '
                      'proof-bearing deterministic compile -> strict proof-bound ObjectiveFunctionV1 '
                      'projection -> destination-owned run-start append before runtime consumption'
                  )

          policy = row.setdefault('exactHeadQualificationPolicy', {})
          workflows = set(policy.get('workflows') or [])
          workflows.update({
              '.github/workflows/hepta-objective-admission.yml',
              '.github/workflows/hepta-lane-d-semantic-conformance.yml',
              '.github/workflows/hepta-objective-exact-execution.yml',
              '.github/workflows/hepta-objective-target-measurement.yml',
          })
          policy['workflows'] = sorted(workflows)
          policy['state'] = 'read_only_exact_candidate_receipt_required'
          policy['verifier'] = 'python3 scripts/hepta-objective-qualify-exact.py plus python3 scripts/hepta-implementation-maps.py verify --module objective.compiler'

          row['repositoryControlledGaps'] = [
              'Obtain successful read-only source-head and deterministic synthetic-merge receipts for one final canonical candidate checkout.',
              'Record the staged latency/resource harness on the selected deployment host and qualify its real storage, crash/restart and backpressure policy.',
              'Add a separately versioned durable admission-proof persistence/recovery contract before claiming proof recovery beyond the currently persisted admission/native/protocol identities.',
          ]
          row['externalEvidenceGates'] = [
              'selected deployment-host measurement, storage and resource-policy acceptance',
              'independent semantic and security review',
              'operator acceptance, canary observation, promotion, rollback authority and release approval',
          ]

          product_paths = set(row.get('productCompositionSourceCandidate', {}).get('paths') or [])
          product_paths.update({
              '.github/workflows/hepta-objective-exact-execution.yml',
              '.github/workflows/hepta-objective-target-measurement.yml',
              'codex-rs/hepta-objective/src/validated_admission.rs',
              'codex-rs/hepta-objective/src/validated_admission_tests.rs',
              'codex-rs/hepta-objective/src/proof_projection.rs',
              'codex-rs/hepta-objective/src/proof_projection_tests.rs',
              'codex-rs/hepta-objective/src/objective_admission.rs',
              'codex-rs/hepta-objective/src/objective_admission_tests.rs',
              'codex-rs/hepta-objective/src/objective_function_v1.rs',
              'codex-rs/hepta-intelligence/src/objective_run.rs',
              'codex-rs/hepta-agentd/src/objective_runtime.rs',
              'docs/modules/objective.compiler/TECHNICAL.md',
              'docs/modules/objective.compiler/SEMANTIC_SUPPORT.md',
              'docs/modules/objective.compiler/DELIVERY_EVIDENCE.md',
              'scripts/hepta-objective-qualify-exact.py',
              'scripts/hepta-objective-evidence-project.py',
              'scripts/hepta-objective-target-measure.py',
          })
          product_paths = sorted(product_paths)

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          source_commit = git('log', '-1', '--format=%H', '--', 'codex-rs/hepta-objective')
          row['exactSourceCandidate'] = {
              'commit': source_commit,
              'tree': git('rev-parse', f'{source_commit}^{{tree}}'),
              'roots': ['codex-rs/hepta-objective'],
              'role': 'module_source_identity_not_execution_receipt',
          }
          composition_commit = git('log', '-1', '--format=%H', '--', *product_paths)
          row['productCompositionSourceCandidate'] = {
              'commit': composition_commit,
              'tree': git('rev-parse', f'{composition_commit}^{{tree}}'),
              'paths': product_paths,
              'role': 'product_composition_source_identity_not_execution_receipt',
          }

          exact = row.get('exactSourceEvidence')
          if isinstance(exact, dict) and exact.get('kind') == 'path_blob_manifest_v1':
              entries = exact.get('entries')
              if not isinstance(entries, list):
                  raise SystemExit('invalid exact source evidence entries')
              indexed = {entry.get('path'): entry for entry in entries if isinstance(entry, dict)}
              for source in {
                  'codex-rs/hepta-objective/src/validated_admission.rs',
                  'codex-rs/hepta-objective/src/proof_projection.rs',
              }:
                  indexed[source] = {
                      'path': source,
                      'blobSha': git('rev-parse', f'HEAD:{source}'),
                  }
              exact['entries'] = [indexed[name] for name in sorted(indexed)]

          path.write_text(json.dumps(row, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool docs/modules/objective.compiler/IMPLEMENTATION_MAP.json >/dev/null
          git add docs/modules/objective.compiler/IMPLEMENTATION_MAP.json
          git commit -m 'docs(objective): map frozen profile product path'
      - name: Rebind exact map objects and retire authoring workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module objective.compiler
          git rm .github/workflows/hepta-objective-implementation-map-author.yml
          git add docs/modules/objective.compiler/IMPLEMENTATION_MAP.json
          git commit -m 'docs(objective): rebind implementation-map source objects'
          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-implementation-maps.py verify \
            --module objective.compiler \
            --expected-sha "$sha" \
            --expected-tree "$tree"
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Push only as a fast-forward from the triggering source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BRANCH: work/objective-compiler-production-convergence-20260927
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Capture authoring evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/objective-map-authoring"
          mkdir -p "$out"
          git log -4 --format='%H %T %s' > "$out/commits.txt"
          git status --short > "$out/status.txt"
          git show --stat --oneline HEAD > "$out/final-stat.txt" || true
          printf '%s\n' 'Ordinary documentation/source mapping only; no build, execution, target-host, acceptance, activation or release claim.' > "$out/CLAIM_BOUNDARY.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objective-implementation-map-authoring-${{ github.sha }}
          path: ${{ runner.temp }}/objective-map-authoring
          if-no-files-found: error
          retention-days: 7
