name: Intuition pinned offline development inputs
on:
  push:
    branches: [codex/intuition-policy-production-closure-20260927]
    paths: [.github/workflows/intuition-toolchain-export.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - name: Export only public compiler and dependency bytes, never credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'intuition-dev-inputs'
          New-Item -ItemType Directory -Path $output | Out-Null
          $channel = (Get-Content codex-rs/rust-toolchain.toml | Select-String '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          foreach ($component in @('rustc', 'cargo', 'rust-std', 'rustfmt', 'clippy')) {
            $name = "$component-$channel-x86_64-unknown-linux-gnu.tar.xz"
            $url = "https://static.rust-lang.org/dist/$name"
            Invoke-WebRequest $url -OutFile "$output/$name"
            Invoke-WebRequest "$url.sha256" -OutFile "$output/$name.sha256"
            $expected = ((Get-Content "$output/$name.sha256") -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash "$output/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "compiler component digest mismatch: $name" }
          }
          Push-Location codex-rs
          try {
            cargo metadata --format-version 1 --no-deps > "$output/metadata.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo fetch --target x86_64-unknown-linux-gnu 2> "$output/fetch.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item Cargo.lock "$output/Cargo.lock"
          } finally { Pop-Location }
          $cargoHome = Join-Path $env:USERPROFILE '.cargo'
          $entries = @('registry/index', 'registry/cache', 'git/db', 'git/checkouts') | Where-Object { Test-Path (Join-Path $cargoHome $_) }
          tar -cf "$output/public-dependencies.tar" -C $cargoHome @entries
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content "$output/source-sha.txt"
          'Public build inputs only. Not exact-source qualification, runtime acceptance, or release evidence.' | Set-Content "$output/CLAIM_BOUNDARY.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intuition-offline-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/intuition-dev-inputs/
          if-no-files-found: error
          retention-days: 1
