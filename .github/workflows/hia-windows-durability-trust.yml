name: HIA Windows original durability and trust targets

on:
  push:
    branches:
      - codex/hia-windows-matrix-repairs-20261127-2ac5
    paths:
      - codex-rs/hepta-shadow-qualification/**
      - codex-rs/hepta-operator-acceptance/**
      - codex-rs/hepta-agentd/tests/support/terminal_cell_owner.rs
      - codex-rs/hepta-contracts/src/authority_lease_windows_tests.rs
      - .github/workflows/hia-windows-durability-trust.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-durability-trust:
    name: Four complete original Windows durability and trust targets
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test
      - name: Run every original test in all four affected targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --platforms=//:windows_x86_64_msvc \
            --nocache_test_results \
            --test_verbose_timeout_warnings \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            //codex-rs/hepta-shadow-qualification:hepta-shadow-qualification-tests \
            //codex-rs/hepta-operator-acceptance:hepta-operator-acceptance-tests \
            //codex-rs/hepta-agentd:hepta-agentd-terminal_cell_owner-test \
            //codex-rs/hepta-contracts:hepta-contracts-unit-tests 2>&1 | tee "$RUNNER_TEMP/windows-durability-trust.log"
          if grep -Eq 'FLAKY|test result: FAILED|Attempt #([2-9][0-9]*|1[0-9]+)' "$RUNNER_TEMP/windows-durability-trust.log"; then
            echo "::error::Original target had a failed or retried attempt."
            exit 1
          fi
          grep -Eq '^//codex-rs/hepta-shadow-qualification:hepta-shadow-qualification-tests[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-durability-trust.log"
          grep -Eq '^//codex-rs/hepta-operator-acceptance:hepta-operator-acceptance-tests[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-durability-trust.log"
          grep -Eq '^//codex-rs/hepta-agentd:hepta-agentd-terminal_cell_owner-test[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-durability-trust.log"
          grep -Eq '^//codex-rs/hepta-contracts:hepta-contracts-unit-tests[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-durability-trust.log"
          echo "Four original Windows targets: PASS, retries=0, flaky=0; full matrix remains independent."
      - name: Preserve original execution evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-original-durability-trust-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bazel-execution-logs
            ${{ runner.temp }}/windows-durability-trust.log
          if-no-files-found: error
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
