name: Prompt registry exact-source consumer checks
on:
  push:
    branches: [ops/prompt-registry-author-closeout-20260928]
    paths: ['.github/workflows/prompt-registry-closeout-consumers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumers:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      SOURCE_SHA: b6cdf7d069a84592c610d57f2685096bb1cf0859
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b6cdf7d069a84592c610d57f2685096bb1cf0859
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Test and lint real consumer packages without patching source
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, signal, subprocess, time
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == os.environ['SOURCE_SHA']
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prompt-consumers'
          out.mkdir()
          receipt = {'schema': 'hepta.prompt-registry.consumer-checks.v1', 'sourceSha': sha, 'sourceTree': tree, 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'checks': [], 'productQualified': False, 'accepted': False, 'released': False}
          commands = [
            ('format', ['cargo','fmt','-p','codex-hepta-prompt-optimizer','-p','codex-hepta-prompt-extension','--','--check'], 60, []),
            ('optimizer', ['cargo','test','--locked','-p','codex-hepta-prompt-optimizer','--','--test-threads=1'], 360, []),
            ('extension', ['cargo','test','--locked','-p','codex-hepta-prompt-extension','--','--test-threads=1'], 240, ['cached_prompt_revalidates_owner_withdrawal_before_provider_begin', 'cached_prompt_never_silently_switches_injected_payload']),
            ('lint', ['cargo','clippy','--locked','-p','codex-hepta-prompt-optimizer','-p','codex-hepta-prompt-extension','--all-targets','--no-deps','--','-D','warnings'], 180, []),
          ]
          for name, command, budget, required in commands:
              row = {'name': name, 'command': command, 'state': 'running'}
              receipt['checks'].append(row)
              (out/'receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
              log = out/(name+'.log')
              start = time.monotonic()
              with log.open('w') as stream:
                  child = subprocess.Popen(command, cwd='codex-rs', stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      code = child.wait(timeout=budget)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid, signal.SIGKILL)
                      child.wait()
                      code = 124
              text = log.read_text(errors='replace')
              tests = re.findall(r'^test (\S+) \.\.\. ok$', text, re.MULTILINE)
              conditions = []
              if code == 0 and name in ('optimizer', 'extension') and not tests:
                  conditions.append('no tests executed')
              if code == 0 and any(not any(test.endswith('::'+wanted) or test == wanted for test in tests) for wanted in required):
                  conditions.append('required consumer regression was not executed')
              row.update({'state': 'passed' if code == 0 and not conditions else 'failed', 'exitCode': code, 'postconditionFailures': conditions, 'seconds': time.monotonic()-start, 'completedTests': tests, 'logSha256': hashlib.sha256(log.read_bytes()).hexdigest()})
              (out/'receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
              print(name, code, text[-3500:], flush=True)
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD'], check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == sha
          receipt['allChecksPassed'] = all(c['state'] == 'passed' for c in receipt['checks'])
          (out/'receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          raise SystemExit(0 if receipt['allChecksPassed'] else 1)
          PY
      - name: Retain exact source identity and raw consumer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-consumers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-consumers/
          if-no-files-found: error
          retention-days: 30
