name: Inference boundary source application and native diagnostics
on:
  push:
    branches: [ops/inference-control-boundary-apply-20260929]
permissions:
  contents: read
concurrency:
  group: inference-boundary-apply-20260929
  cancel-in-progress: true
jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Apply hash-locked scoped changes and create a clean candidate
        id: apply
        env:
          PYTHONDONTWRITEBYTECODE: 1
          DESTINATION: codex/inference-control-boundary-capacity-20260929
          BASE: e05a74b234631802ca7ebd6f49f5a96495c45767
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/inference-boundary-apply.log") 2>&1
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, re
          from pathlib import Path
          chunks = sorted(Path('scripts/inference-boundary-payload').glob('*.b64'))
          assert len(chunks) == 4
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          assert len(raw) == 46781
          assert hashlib.sha256(raw).hexdigest() == '8b93a084a722d79dd6f57b4a22d23cfbbae0e3c9d730e3a333d7f5a579817bc2'
          patch = raw.decode('utf-8')
          replacements = {
              '@@ -201,3 +201,4 @@': '@@ -202,3 +202,4 @@',
              '@@ -370,3 +370,4 @@': '@@ -371,3 +371,4 @@',
              '@@ -89,3 +89,7 @@': '@@ -90,3 +90,7 @@',
              '@@ -118,4 +118,43 @@': '@@ -124,4 +128,43 @@',
          }
          for before, after in replacements.items():
              assert patch.count(before) == 1, before
              patch = patch.replace(before, after)
          for target in (
              'scripts/hepta_inference_boundary_native.py',
              'scripts/hepta_inference_capacity.py',
              'scripts/test_hepta_inference_capacity.py',
          ):
              header = f'diff --git a/{target} b/{target}\n'
              marker = f'--- a/{target}\n+++ b/{target}\n'
              assert header not in patch and marker in patch, target
              patch = patch.replace(marker, header + marker, 1)
          target = 'docs/modules/inference.control/WRITER_BOUNDARIES.md'
          section_start = patch.index(f'diff --git a/{target} b/{target}')
          section_end = patch.find('\ndiff --git ', section_start + 1)
          section = patch[section_start:section_end]
          first_hunk = section.index('@@ ')
          header = section[:first_hunk]
          hunks = [value for value in re.split(r'(?=^@@ )', section[first_hunk:], flags=re.MULTILINE) if value]
          hunks.sort(key=lambda value: int(re.search(r'^@@ -(\d+)', value).group(1)))
          section = (header + ''.join(hunks)).rstrip('\n')
          patch = patch[:section_start] + section + patch[section_end:]
          old_native = '\n'.join([
              '@@ -1,2 +1,3 @@',
              "     modules = ['actor_latency', 'actor_mailbox', 'actor_policy', 'actor_observation',",
              "-               'control_actor', 'control_port', 'output_protection', 'unix_output_protector']",
              "+               'actor_record_observation', 'control_actor', 'control_port',",
              "+               'output_protection', 'unix_output_protector']",
              '',
          ])
          new_native = '\n'.join([
              '@@ -50,5 +50,6 @@',
              "     (output / 'core').mkdir()",
              "     (output / 'core/Cargo.toml').write_text(core_manifest)",
              "     modules = ['actor_latency', 'actor_mailbox', 'actor_policy', 'actor_observation',",
              "-               'control_actor', 'control_port', 'output_protection', 'unix_output_protector']",
              "+               'actor_record_observation', 'control_actor', 'control_port',",
              "+               'output_protection', 'unix_output_protector']",
              r'''     wrapper = '#![forbid(unsafe_code)]\n' + ''.join(f'#[path = {path(host / "src" / (name + ".rs"))}]\npub mod {name};\n' for name in modules)''',
              '',
          ])
          assert patch.count(old_native) == 1
          patch = patch.replace(old_native, new_native)
          raw = patch.encode('utf-8')
          assert len(raw) == 47303
          assert hashlib.sha256(raw).hexdigest() == '97d74806bbcf6d773adebdcea02f17ab2f05e03a7562e3a7e0fb17236f864d6b'
          Path(os.environ['RUNNER_TEMP'], 'inference-boundary.patch').write_bytes(raw)
          PY
          git fetch origin "$DESTINATION"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          git checkout -B "$DESTINATION" "$BASE"
          git apply --check --index --recount --verbose "$RUNNER_TEMP/inference-boundary.patch"
          git apply --index --recount "$RUNNER_TEMP/inference-boundary.patch"
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          prefixes = ('codex-rs/hepta-infer-worker-host/src/', 'docs/modules/inference.control/')
          scripts = {
              'scripts/hepta-inference-control-current-state.py',
              'scripts/hepta-inference-control-actor-migrate.py',
              'scripts/hepta-implementation-maps.py',
              'scripts/hepta_inference_boundary_native.py',
              'scripts/hepta_inference_capacity.py',
              'scripts/test_hepta_inference_capacity.py',
              'scripts/test_hepta_inference_current_state.py',
              '.github/workflows/hepta-inference-maintenance.yml',
              '.github/workflows/hepta-inference-readonly-matrix.yml',
          }
          for name in filter(None, changed):
              assert name.startswith(prefixes) or name in scripts, name
              if name.endswith('.rs'):
                  subprocess.run(['rustfmt','--edition','2024','--config','skip_children=true',name], check=True)
          extra = set(subprocess.check_output(['git','diff','--name-only','HEAD','-z']).decode().split('\0')) - set(changed)
          assert not extra, f'formatter touched unrelated files: {extra}'
          PY
          python3 scripts/hepta-inference-control-current-state.py sync
          python3 scripts/hepta-inference-control-current-state.py check
          python3 scripts/hepta-inference-control-actor-migrate.py check
          python3 -m unittest -v scripts.test_hepta_inference_current_state scripts.test_hepta_inference_capacity
          git diff --check
          git add -u
          git config user.name 'ChatGPT engineering'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'feat(inference.control): close observation and qualification gaps'
          candidate="$(git rev-parse HEAD)"
          printf '%s\n' "$candidate" | tee "$RUNNER_TEMP/inference-boundary-candidate-sha.txt"
          printf 'source_sha=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 scripts/hepta-implementation-maps.py verify --module inference.control
          git show --stat --oneline HEAD
      - name: Compile and exercise the original owner, mailbox, record cache and vault sources
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_RELEASE_DEBUG: 0
          CARGO_TERM_COLOR: never
          PYTHONDONTWRITEBYTECODE: 1
          SOURCE_SHA: ${{ steps.apply.outputs.source_sha }}
          TESTED_SHA: ${{ steps.apply.outputs.source_sha }}
          BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
          HEPTA_CI_LANE: boundary-diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          records="$RUNNER_TEMP/inference-boundary-records"
          manifest="$RUNNER_TEMP/inference-boundary-native/Cargo.toml"
          mkdir -p "$records"
          python3 scripts/hepta_inference_boundary_native.py --output "$RUNNER_TEMP/inference-boundary-native"
          rustc -Vv > "$records/toolchain.txt"
          python3 scripts/hepta_ci_exec.py --output "$records/native-tests.json" --minimum-tests 16 -- \
            cargo test --manifest-path "$manifest" --workspace --all-targets --release -- --nocapture
          python3 scripts/hepta_ci_exec.py --output "$records/real-writer-curve.json" --minimum-tests 1 -- \
            cargo test --manifest-path "$manifest" --release -p codex-hepta-infer-worker-host \
            real_writer_mixed_query_terminal_contention_curve -- --ignored --nocapture --test-threads=1
          python3 scripts/hepta_ci_exec.py --output "$records/fifo-curve.json" --minimum-tests 1 -- \
            cargo test --manifest-path "$manifest" --release -p codex-hepta-infer-worker-host \
            mixed_fifo_contention_curve -- --ignored --nocapture --test-threads=1
          python3 scripts/hepta_ci_exec.py --output "$records/clippy.json" -- \
            cargo clippy --manifest-path "$manifest" --workspace --all-targets -- -D warnings
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Upload the validated commit object or fast-forward directly
        env:
          DESTINATION: codex/inference-control-boundary-capacity-20260929
          BASE: e05a74b234631802ca7ebd6f49f5a96495c45767
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          set +e
          output="$(git push origin "HEAD:refs/heads/$DERLINATION" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/inference-boundary-push.log"
          if [ "$status" -eq 0 ]; then
            echo "DESTINATION_PUSHED=$candidate"
            exit 0
          fi
          printf '%s\n' "$output" | grep -Eiq 'workflow|workflows permission|refusing to allow'
          git fetch origin "$DESTINATION"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          echo "CANDIDATE_OBJECT_UPLOADED=$candidate"
          echo "The workflow-file permission rejection is expected; an authorized Git-data ref update must bind this validated object."
      - name: Preserve application, native and candidate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inference-boundary-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inference-boundary-apply.log
            ${{ runner.temp }}/inference-boundary.patch
            ${{ runner.temp }}/inference-boundary-candidate-sha.txt
            ${{ runner.temp }}/inference-boundary-push.log
            ${{ runner.temp }}/inference-boundary-records/
            ${{ runner.temp }}/inference-boundary-native/Cargo.toml
            ${{ runner.temp }}/inference-boundary-native/Cargo.lock
            ${{ runner.temp }}/inference-boundary-native/source-scope.json
            ${{ runner.temp }}/inference-boundary-native/core/Cargo.toml
            ${{ runner.temp }}/inference-boundary-native/host/Cargo.toml
            ${{ runner.temp }}/inference-boundary-native/host/lib.rs
          if-no-files-found: warn
          retention-days: 30
