name: Hepta worker dependency footprint (read-only)

on:
  pull_request:
    paths:
      - "scripts/hepta_worker_dependency_footprint.py"
      - "scripts/test_hepta_worker_dependency_footprint.py"
      - ".github/workflows/hepta-worker-dependency-footprint.yml"
      - "codex-rs/hepta-infer-worker-host/Cargo.toml"
      - "codex-rs/hepta-agentd/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-worker-footprint-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  static-measurement:
    name: Cargo graph only (not CPU/RSS/IPC qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity and test estimator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          python3 -m unittest scripts.test_hepta_worker_dependency_footprint
      - name: Install pinned Rust metadata resolver
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
      - name: Measure resolved dependency edge counterfactual
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/worker-resolve.json"
          python3 ../scripts/hepta_worker_dependency_footprint.py \
            --metadata "$RUNNER_TEMP/worker-resolve.json" \
            --lockfile Cargo.lock \
            --source-sha "$SOURCE_SHA" \
            --platform x86_64-unknown-linux-gnu \
            --output "$RUNNER_TEMP/worker-footprint.json"
      - name: Upload non-authorizing source-bound counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-dependency-footprint-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-footprint.json
          if-no-files-found: warn
          retention-days: 14
