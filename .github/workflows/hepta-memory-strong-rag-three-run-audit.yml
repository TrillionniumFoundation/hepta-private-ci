name: MemoryCell three-run Qwen frozen-reader cross-replay
on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - "scripts/memory_cell/strong_rag_crossrun_audit.py"
      - "scripts/memory_cell/test_strong_rag_crossrun_audit.py"
      - "scripts/memory_cell/data/strong-rag-three-run-replication-20261012.json"
      - "codex-rs/hepta-intelligence-eval/MEMORY_CELL_STRONG_RAG_THREE_RUN_REPLICATION_20261012.md"
      - ".github/workflows/hepta-memory-strong-rag-three-run-audit.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memorycell-three-run-replay-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-answer-cross-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: scripts/memory_cell
      HEPTA_MEMORY_CROSSRUN_ARCHIVES: /tmp/memorycell-three-run-input
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore six original GitHub Actions ZIPs without model weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HEPTA_MEMORY_CROSSRUN_ARCHIVES" /tmp/memorycell-three-run-output
          for item in \
            "11720146105:strongrag-825069-full.zip" \
            "11719787110:strongrag-825069-replay.zip" \
            "11717450320:strongrag-eba9-full.zip" \
            "11716508827:strongrag-eba9-replay.zip" \
            "11696514149:strongrag-c24-full.zip" \
            "11696898778:strongrag-c24-replay.zip"; do
            id="${item%%:*}"
            name="${item#*:}"
            gh api "repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/$id/zip" > "$HEPTA_MEMORY_CROSSRUN_ARCHIVES/$name"
          done
      - name: Test fail-closed archive and prompt consistency checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/memory_cell \
            -p 'test_strong_rag_crossrun_audit.py' -v \
            2>&1 | tee /tmp/memorycell-three-run-output/tests.log
      - name: Verify exact original manifests and compare 336 model answers
        run: |
          set -euo pipefail
          python3 scripts/memory_cell/strong_rag_crossrun_audit.py \
            "$HEPTA_MEMORY_CROSSRUN_ARCHIVES/strongrag-825069-full.zip" \
            "$HEPTA_MEMORY_CROSSRUN_ARCHIVES/strongrag-825069-replay.zip" \
            "$HEPTA_MEMORY_CROSSRUN_ARCHIVES/strongrag-eba9-full.zip" \
            "$HEPTA_MEMORY_CROSSRUN_ARCHIVES/strongrag-eba9-replay.zip" \
            "$HEPTA_MEMORY_CROSSRUN_ARCHIVES/strongrag-c24-full.zip" \
            "$HEPTA_MEMORY_CROSSRUN_ARCHIVES/strongrag-c24-replay.zip" \
            --output /tmp/memorycell-three-run-output/replayed-report.json \
            2>&1 | tee /tmp/memorycell-three-run-output/replay.log
          cmp scripts/memory_cell/data/strong-rag-three-run-replication-20261012.json \
            /tmp/memorycell-three-run-output/replayed-report.json
          git rev-parse HEAD > /tmp/memorycell-three-run-output/auditor-commit.txt
          (cd /tmp/memorycell-three-run-output && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-strong-rag-three-run-cross-replay
          path: /tmp/memorycell-three-run-output
          if-no-files-found: warn
