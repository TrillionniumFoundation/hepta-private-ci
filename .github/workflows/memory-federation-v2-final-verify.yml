name: memory federation full closure qualification

on:
  push:
    branches:
      - main
      - fix/memory-federation-full-closure-20260927
    paths:
      - ".github/workflows/memory-federation-v2-final-verify.yml"
      - ".github/actions/hepta-synthetic-merge/**"
      - "codex-rs/hepta-memory-federation/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/ext/hepta-memory/**"
      - "codex-rs/app-server/**"
      - "docs/modules/memory.federation/**"
      - "qualification/memory-federation/**"
      - "qualification/module-execution-dossiers/detail/memory.federation.md"
      - "qualification/module-execution-dossiers/IMPLEMENTATION_PROFILES.json"
      - "scripts/hepta-implementation-maps.py"
      - "scripts/hepta-memory-federation-state.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/memory-federation-v2-final-verify.yml"
      - ".github/actions/hepta-synthetic-merge/**"
      - "codex-rs/hepta-memory-federation/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/ext/hepta-memory/**"
      - "codex-rs/app-server/**"
      - "docs/modules/memory.federation/**"
      - "qualification/memory-federation/**"
      - "qualification/module-execution-dossiers/detail/memory.federation.md"
      - "qualification/module-execution-dossiers/IMPLEMENTATION_PROFILES.json"
      - "scripts/hepta-implementation-maps.py"
      - "scripts/hepta-memory-federation-state.py"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: memory-federation-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: exact-head contract, product, and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify implementation maps and current state
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-memory-federation-state.py verify

      - name: Check formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-memory-extension -p codex-hepta-agentd -p codex-app-server -- --check

      - name: Test canonical federation contract
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-hepta-memory-federation --lib
          cargo test -p codex-hepta-memory-federation --lib --features legacy-v1

      - name: Test memory product adapter
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory --lib cognitive_runtime_tests

      - name: Test legacy federation regression suite
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory --lib cognitive_federation_tests

      - name: Test model-input federation integration
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory-extension --lib cognitive::federation

      - name: Check Agentd and App Server composition
        working-directory: codex-rs
        run: cargo check -p codex-hepta-agentd -p codex-app-server

      - name: Strict lint canonical and product crates
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-memory-extension -p codex-app-server --all-targets -- -D warnings
          cargo clippy -p codex-hepta-agentd --lib -- -D warnings

      - name: Emit exact immutable execution receipt
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/memory-federation-receipt"
          python3 - <<'PY'
          import json, os, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          receipt = {
              "schema": "hepta.memory-federation-actions-receipt.v1",
              "status": "passed",
              "candidate": {"commit": git("rev-parse", "HEAD"), "tree": git("rev-parse", "HEAD^{tree}")},
              "workflowRunId": os.environ["GITHUB_RUN_ID_VALUE"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT_VALUE"],
              "repositoryControlledQualification": True,
              "physicalTwoHostQualification": False,
              "independentAcceptance": False,
              "activation": False,
              "release": False,
          }
          with open(os.environ["RUNNER_TEMP"] + "/memory-federation-receipt/receipt.json", "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain exact execution receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-federation-exact-${{ github.sha }}
          path: ${{ runner.temp }}/memory-federation-receipt/receipt.json
          if-no-files-found: error
          retention-days: 90

  merge-candidate:
    name: deterministic merge contract and product
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source for merge construction
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current main head
        id: current-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          test -n "$BASE_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Construct deterministic synthetic merge
        id: synthetic
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.current-base.outputs.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Memory Federation CI
          author-email: hepta-memory-federation-ci@users.noreply.github.com
          message: Memory federation synthetic merge

      - name: Verify deterministic merge identity and metadata
        env:
          EXPECTED_SHA: ${{ steps.synthetic.outputs.sha }}
          EXPECTED_TREE: ${{ steps.synthetic.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          python3 scripts/hepta-implementation-maps.py verify --expected-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE"
          python3 scripts/hepta-memory-federation-state.py verify

      - name: Run deterministic merge qualification
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-memory-extension -p codex-hepta-agentd -p codex-app-server -- --check
          cargo test -p codex-hepta-memory-federation --lib
          cargo test -p codex-hepta-memory-federation --lib --features legacy-v1
          cargo test -p codex-hepta-memory --lib cognitive_runtime_tests
          cargo test -p codex-hepta-memory --lib cognitive_federation_tests
          cargo test -p codex-hepta-memory-extension --lib cognitive::federation
          cargo check -p codex-hepta-agentd -p codex-app-server
          cargo clippy -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-memory-extension -p codex-app-server --all-targets -- -D warnings
          cargo clippy -p codex-hepta-agentd --lib -- -D warnings
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
