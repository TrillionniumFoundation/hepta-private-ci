name: control.runtime verified patch application

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/control-runtime-apply-once.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: control-runtime-apply-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retain-conflict-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decode and three-way apply exact staged patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/control-runtime-conflict-bundle"
          mkdir -p "$bundle/conflicts"
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          source = b"".join(Path(".control-runtime-next.patch").read_bytes().split())
          payload = gzip.decompress(base64.b64decode(source, validate=True))
          target = Path(os.environ["RUNNER_TEMP"]) / "control-runtime-next.patch"
          target.write_bytes(payload)
          PY
          echo "edc2303f0b0f22a38eb04af352f6d43c7c821558ad2285f6d94e7e75e40831d9  $RUNNER_TEMP/control-runtime-next.patch" | sha256sum -c -
          cp "$RUNNER_TEMP/control-runtime-next.patch" "$bundle/control-runtime-next.patch"
          git apply --stat "$RUNNER_TEMP/control-runtime-next.patch" > "$bundle/patch-stat.txt"
          set +e
          git apply --3way --whitespace=fix "$RUNNER_TEMP/control-runtime-next.patch" > "$bundle/apply.stdout.txt" 2> "$bundle/apply.stderr.txt"
          apply_status=$?
          set -e
          git status --short > "$bundle/status.txt"
          if test "$apply_status" -eq 0; then
            echo 'clean=true' >> "$GITHUB_OUTPUT"
            git diff --cached --binary > "$bundle/applied.patch"
          else
            echo 'clean=false' >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > "$bundle/conflicted-paths.txt"
            while IFS= read -r path; do
              test -n "$path" || continue
              git checkout --conflict=diff3 -- "$path" || true
              mkdir -p "$bundle/conflicts/$(dirname "$path")"
              cp "$path" "$bundle/conflicts/$path"
              {
                echo "===== $path ====="
                git diff --cc --unified=100 -- "$path" || true
              } >> "$bundle/combined-conflicts.diff"
            done < "$bundle/conflicted-paths.txt"
          fi

      - name: Retain exact decoded patch and conflict files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-runtime-conflict-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/control-runtime-conflict-bundle
          if-no-files-found: error
          retention-days: 7

      - name: Require conflict-free application
        if: steps.apply.outputs.clean != 'true'
        run: |
          echo 'The exact staged patch still has three-way conflicts; inspect the retained private bundle.' >&2
          exit 1
