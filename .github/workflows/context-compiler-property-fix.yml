name: context.compiler source correction disabled

on:
  push:
    branches:
      - codex/context-compiler-provider-closure-final-20260927
    paths:
      - ".github/workflows/context-compiler-property-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-compiler-deterministic-source-correction
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse CI-authored source mutation
        run: |
          echo "Self-modifying CI is disabled. Source corrections require an explicit reviewed commit."
