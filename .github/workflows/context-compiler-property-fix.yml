name: context.compiler deterministic source correction

on:
  push:
    branches:
      - codex/context-compiler-full-closure-review-20260927
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: context-compiler-deterministic-source-correction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[context-source-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/context-compiler-full-closure-review-20260927
          fetch-depth: 0

      - name: Materialize deterministic generated corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-context-compiler/src/provider_closure.rs")
          text = path.read_text()
          import_line = "    use proptest::prelude::*;\n"
          start_marker = "    proptest! {\n"
          end_marker = "\n\n    #[test]\n    fn generated_unicode_control_corpus_keeps_exact_escaped_identity()"

          if import_line in text:
              text = text.replace(import_line, "", 1)
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit("generated-property block markers drifted")

              replacement = r'''    #[test]
              fn generated_segment_maps_are_total_deterministic_and_single_context() {
                  for prefix_len in [0_usize, 1, 2, 17, 255, 2047] {
                      for suffix_len in [0_usize, 1, 3, 31, 511, 2047] {
                          for seed in [0_u64, 1, 7, 0x55aa, u32::MAX as u64, u64::MAX] {
                              let payload = format!("CTX::{seed:016x}::END").into_bytes();
                              let mut request = vec![b'p'; prefix_len];
                              request.extend_from_slice(&payload);
                              request.extend(std::iter::repeat_n(b's', suffix_len));
                              let first = build_segment_map(
                                  &request,
                                  &payload,
                                  digest("generated-payload"),
                              )
                              .expect("generated map");
                              let second = build_segment_map(
                                  &request,
                                  &payload,
                                  digest("generated-payload"),
                              )
                              .expect("deterministic map");
                              assert_eq!(first, second);
                              assert_eq!(
                                  first
                                      .iter()
                                      .filter(|segment| {
                                          segment.kind()
                                              == FinalRequestSegmentKindV2::CanonicalContextBundle
                                      })
                                      .count(),
                                  1
                              );
                              assert_eq!(
                                  first.last().expect("last segment").end_offset(),
                                  request.len() as u64
                              );
                              assert_eq!(
                                  compute_segment_map_digest(&first),
                                  compute_segment_map_digest(&second)
                              );
                          }
                      }
                  }
              }

              #[test]
              fn generated_gap_and_overlap_mutations_fail_closed() {
                  for prefix_len in [2_usize, 3, 17, 255, 511] {
                      for suffix_len in [1_usize, 2, 19, 255, 511] {
                          for seed in [0_u32, 1, 7, 0x55aa, u16::MAX as u32, u32::MAX] {
                              let payload = format!("UNIQUE-CONTEXT-{seed:08x}").into_bytes();
                              let mut request = vec![b'a'; prefix_len];
                              request.extend_from_slice(&payload);
                              request.extend(std::iter::repeat_n(b'z', suffix_len));
                              let valid = build_segment_map(
                                  &request,
                                  &payload,
                                  digest("mutation-payload"),
                              )
                              .expect("valid map");

                              let mut gap = valid.clone();
                              gap[0].end_offset -= 1;
                              assert_eq!(
                                  validate_segment_coverage(&gap, request.len() as u64),
                                  Err(ProviderClosureErrorV2::SegmentCoverageInvalid)
                              );

                              let mut overlap = valid;
                              overlap[1].start_offset -= 1;
                              assert_eq!(
                                  validate_segment_coverage(&overlap, request.len() as u64),
                                  Err(ProviderClosureErrorV2::SegmentCoverageInvalid)
                              );
                          }
                      }
                  }
              }'''
              text = text[:start] + replacement + text[end:]
          elif start_marker in text:
              raise SystemExit("proptest block remains without its import")

          path.write_text(text)
          PY

      - name: Preserve terminal observation after provider-terminal conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-agentd/src/exact_context_delivery.rs")
          text = path.read_text()
          old = "        let provider_terminal = provider_terminal(terminal.terminal)?;\n"
          new = "        let provider_terminal = provider_terminal(terminal.terminal.clone())?;\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("terminal ownership site drifted")
          path.write_text(text)
          PY

      - name: Activate strict V3 authority and product modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path: str, marker: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if addition in text:
                  return
              if text.count(marker) != 1:
                  raise SystemExit(f"{path}: activation marker drifted: {marker!r}")
              file.write_text(text.replace(marker, marker + addition, 1))

          insert_after(
              "codex-rs/hepta-prompt-registry/src/lib.rs",
              "mod admission;\n",
              "mod context_authority;\n",
          )
          insert_after(
              "codex-rs/hepta-prompt-registry/src/lib.rs",
              "pub use admission::VerifiedAdmission;\n",
              "pub use context_authority::PromptContextAuthorityAdmissionV3;\n"
              "pub use context_authority::PromptContextAuthorityErrorV3;\n"
              "pub use context_authority::PromptContextAuthoritySnapshotV3;\n"
              "pub use context_authority::PromptContextAuthoritySuccessorV3;\n"
              "pub use context_authority::prompt_context_authority_verifier_digest_v3;\n",
          )

          insert_after(
              "codex-rs/hepta-intelligence/src/lib.rs",
              "mod prompt_pipeline;\n",
              "mod prompt_product_v3;\n",
          )
          insert_after(
              "codex-rs/hepta-intelligence/src/lib.rs",
              "pub use prompt_pipeline::prepare_prompt_delivery_v1;\n",
              "pub use prompt_product_v3::PreparedPromptDeliveryV3;\n"
              "pub use prompt_product_v3::PromptExactTokenizerV3;\n"
              "pub use prompt_product_v3::PromptExecutionProfileV3;\n"
              "pub use prompt_product_v3::PromptProductV3Error;\n"
              "pub use prompt_product_v3::PromptRegistryCompilationRequestV3;\n"
              "pub use prompt_product_v3::PromptRegistryCompiledContextV3;\n"
              "pub use prompt_product_v3::PromptTokenizerIdentityV3;\n"
              "pub use prompt_product_v3::compile_prompt_registry_v3;\n"
              "pub use prompt_product_v3::observe_prompt_delivery_v3;\n"
              "pub use prompt_product_v3::prepare_prompt_delivery_v3;\n",
          )

          insert_after(
              "codex-rs/ext/hepta-prompt/src/lib.rs",
              "mod exact_body;\n",
              "mod v3;\n",
          )
          insert_after(
              "codex-rs/ext/hepta-prompt/src/lib.rs",
              "pub use exact_body::PromptRuntimeExactAttemptV2;\n",
              "pub use v3::PromptRuntimeContextV3;\n"
              "pub use v3::PromptRuntimeDispatchFutureV3;\n"
              "pub use v3::PromptRuntimeDispatchRecordV3;\n"
              "pub use v3::PromptRuntimeFinalUseFutureV3;\n"
              "pub use v3::PromptRuntimeFinalUseProofV3;\n"
              "pub use v3::PromptRuntimeFinalUseRequestV3;\n"
              "pub use v3::PromptRuntimeHostErrorV3;\n"
              "pub use v3::PromptRuntimeHostV3;\n"
              "pub use v3::PromptRuntimePrepareFutureV3;\n"
              "pub use v3::PromptRuntimePrepareRequestV3;\n"
              "pub use v3::PromptRuntimeRecordFutureV3;\n"
              "pub use v3::PromptRuntimeTerminalRecordV3;\n"
              "pub use v3::PromptRuntimeV3Error;\n"
              "pub use v3::install_prompt_runtime_v3;\n",
          )

          insert_after(
              "codex-rs/hepta-agentd/src/lib.rs",
              "mod prompt_runtime;\n",
              "mod prompt_product_v3;\n",
          )
          insert_after(
              "codex-rs/hepta-agentd/src/lib.rs",
              "pub use prompt_runtime::PromptRuntimeStageDisposition;\n",
              "pub use prompt_product_v3::AgentdPromptProductErrorV3;\n"
              "pub use prompt_product_v3::AgentdPromptProductOwnerV3;\n",
          )
          PY

      - name: Refresh workspace lock and format
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo metadata --format-version 1 > /dev/null
          cargo fmt --all

      - name: Compile strict V3 modules
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-prompt-registry
          cargo check --locked -p codex-hepta-intelligence
          cargo check --locked -p codex-hepta-prompt-extension
          cargo check --locked -p codex-hepta-agentd

      - name: Verify corrected context closure
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-context-compiler
          cargo test --locked -p codex-hepta-prompt-registry --lib
          cargo test --locked -p codex-hepta-intelligence prompt_product_v3 --lib
          cargo test --locked -p codex-hepta-prompt-extension v3 --lib
          cargo test --locked -p codex-hepta-agentd prompt_product_v3 --lib
          cargo test --locked -p codex-hepta-agentd exact_context_delivery --lib

      - name: Commit verified source and lock corrections
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "hepta-ci-bot"
          git config user.email "hepta-ci-bot@users.noreply.github.com"
          git add \
            codex-rs/Cargo.lock \
            codex-rs/hepta-context-compiler/src/provider_closure.rs \
            codex-rs/hepta-agentd/src/exact_context_delivery.rs \
            codex-rs/hepta-prompt-registry/src/lib.rs \
            codex-rs/hepta-intelligence/src/lib.rs \
            codex-rs/ext/hepta-prompt/src/lib.rs \
            codex-rs/hepta-agentd/src/lib.rs
          if git diff --cached --quiet; then
            echo "Source, module registration, and lock are already materialized."
            exit 0
          fi
          git commit -m "fix(context.compiler): activate strict V3 authority modules [context-source-fixed]"
          git push origin HEAD:codex/context-compiler-full-closure-review-20260927
