name: Author prompt.registry production convergence

on:
  push:
    branches:
      - ops/prompt-registry-production-convergence-author-20260929
    paths:
      - scripts/author_prompt_registry_output_gate.py
      - .github/workflows/author-prompt-registry-production-convergence.yml

permissions:
  contents: write

concurrency:
  group: author-prompt-registry-production-convergence
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/prompt-registry-production-convergence-20260929

jobs:
  author-output-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authoring source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: authoring
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Apply output-gate source changes
        run: python3 authoring/scripts/author_prompt_registry_output_gate.py target

      - name: Format and validate focused workspace
        working-directory: target/codex-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --locked -p codex-extension-api -p codex-core --all-targets
          cargo test --locked -p codex-core model_provider_policy --lib -- --test-threads=1

      - name: Verify patch hygiene
        working-directory: target
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Publish source commit
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "14957082+openai@users.noreply.github.com"
          git add \
            codex-rs/ext/extension-api/src/contributors/model_provider_policy.rs \
            codex-rs/core/src/model_provider_policy/lifecycle.rs \
            codex-rs/core/src/model_provider_policy/attempt_owner.rs \
            codex-rs/core/src/model_provider_policy/response_terminal.rs \
            codex-rs/codex-api/src/common.rs \
            codex-rs/core/src/client.rs
          if git diff --cached --quiet; then
            echo "No source changes to publish"
            exit 0
          fi
          git commit -m "prompt.registry: fence provider output before consumer release"
          git push origin HEAD:refs/heads/${TARGET_BRANCH}
