name: Author prompt.registry production convergence

on:
  push:
    branches:
      - ops/prompt-registry-production-convergence-author-20260929
    paths:
      - scripts/author_prompt_registry_output_gate.py
      - .github/workflows/author-prompt-registry-production-convergence.yml

permissions:
  contents: write

concurrency:
  group: author-prompt-registry-production-convergence
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/prompt-registry-production-convergence-20260929

jobs:
  author-output-gate:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      authored_sha: ${{ steps.publish.outputs.authored_sha }}
    steps:
      - name: Checkout authoring source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: authoring
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply output-gate source changes
        run: |
          set -euo pipefail
          if grep -q 'pub struct ModelProviderOutputBatch' \
            target/codex-rs/ext/extension-api/src/contributors/model_provider_policy.rs; then
            echo 'Output-gate source already present; preserving the existing implementation.'
          else
            python3 authoring/scripts/author_prompt_registry_output_gate.py target
          fi

      - name: Format and verify patch hygiene
        working-directory: target
        run: |
          set -euo pipefail
          (cd codex-rs && cargo fmt --all)
          git diff --check
          git status --short

      - name: Publish source commit
        id: publish
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "14957082+openai@users.noreply.github.com"
          git add \
            codex-rs/ext/extension-api/src/contributors/model_provider_policy.rs \
            codex-rs/core/src/model_provider_policy/lifecycle.rs \
            codex-rs/core/src/model_provider_policy/attempt_owner.rs \
            codex-rs/core/src/model_provider_policy/response_terminal.rs \
            codex-rs/codex-api/src/common.rs \
            codex-rs/core/src/client.rs
          if ! git diff --cached --quiet; then
            git commit -m "prompt.registry: fence provider output before consumer release"
            git push origin HEAD:refs/heads/${TARGET_BRANCH}
          fi
          echo "authored_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-output-gate:
    needs: author-output-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout exact authored source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.author-output-gate.outputs.authored_sha }}
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Prepare native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config

      - name: Validate exact authored output gate
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p codex-extension-api --all-targets
          cargo check --locked -p codex-core --lib
          cargo test --locked -p codex-core model_provider_policy --lib -- --test-threads=1
          cargo clippy --locked -p codex-extension-api -p codex-core --lib --no-deps -- -D warnings
