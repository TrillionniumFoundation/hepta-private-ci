name: blocking-ci

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select blocking CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      inference: ${{ steps.scope.outputs.inference }}
      effects: ${{ steps.scope.outputs.effects }}
      lifecycle: ${{ steps.scope.outputs.lifecycle }}
      learning: ${{ steps.scope.outputs.learning }}
      objective: ${{ steps.scope.outputs.objective }}
      native: ${{ steps.scope.outputs.native }}
      derived: ${{ steps.scope.outputs.derived }}
      full_repo: ${{ steps.scope.outputs.full_repo }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select dependency impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.tests.test_hepta_ci_scope scripts.tests.test_hepta_ci_dependencies
          python3 -m unittest -v scripts.test_hepta_readiness_semantics
          args=(--head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--base "$BASE_SHA")
          else
            args+=(--full)
          fi
          python3 scripts/hepta_ci_scope.py "${args[@]}"

      - name: Regression-test scoped fan-in policy
        shell: bash
        run: |
          set -euo pipefail
          NEEDS='{"scope":{"result":"success"},"heavy":{"result":"skipped"}}' \
            ALLOWED_SKIPPED='["heavy"]' \
            python3 .github/scripts/check_ci_results.py
          if NEEDS='{"scope":{"result":"success"},"heavy":{"result":"skipped"}}' \
            python3 .github/scripts/check_ci_results.py; then
            echo "unscoped skipped dependency was incorrectly accepted" >&2
            exit 1
          fi

  hepta-contract-gate:
    name: Hepta contract gate
    needs: scope
    if: needs.scope.outputs.native == 'true' || needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/hepta-contract-gate.yml
    with:
      profile: development
    secrets: inherit

  bazel:
    name: Bazel
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  hepta-scoped:
    name: Hepta scoped native checks
    needs: scope
    if: needs.scope.outputs.native == 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Do not reduce affected-owner/reverse-consumer coverage to fit a small
    # hosted runner. Drop debug artifacts/incremental state instead.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove native Cargo reverse-dependency disk capacity
        shell: bash
        run: |
          set -euo pipefail
          # Hosted Linux image only. Never delete test sources, Cargo cache,
          # Rust toolchains, V8 artifacts, or source dependency records.
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          free_bytes() {
            df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d '[:space:]'
          }
          before="$(free_bytes)"
          target=$((10 * 1024 * 1024 * 1024))
          echo "Scoped native host available bytes before=$before"
          df -h "$GITHUB_WORKSPACE"
          # SDKs preinstalled on the ephemeral Ubuntu image but unrelated to
          # the selected native Rust host-target test graph. Reclaim only when
          # needed and only from this fixed allowlist, never arbitrary paths.
          if (( before < target )); then
            for unused_sdk in /usr/local/lib/android /opt/ghc /usr/share/dotnet; do
              if [[ -d "$unused_sdk" && ! -L "$unused_sdk" ]]; then
                echo "Reclaiming unused hosted image SDK: $unused_sdk"
                sudo rm -rf -- "$unused_sdk"
              fi
              if (( $(free_bytes) >= target )); then
                break
              fi
            done
          fi
          after="$(free_bytes)"
          echo "Scoped native host available bytes after=$after"
          df -h "$GITHUB_WORKSPACE"
          printf 'source=%s\nfree_before_bytes=%s\nfree_after_bytes=%s\nminimum_required_bytes=%s\n' \
            "$(git rev-parse HEAD)" "$before" "$after" "$target" \
            > "$RUNNER_TEMP/hepta-scoped-disk.txt"
          # Fail before any compilation if the environment cannot support
          # the real impacted-owner test graph. Never report green by skipping.
          test "$after" -ge "$target"

      - name: Prepare native test prerequisites with confined Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config apparmor-profiles apparmor-utils
          # Reuse the executable-scoped distro profile proven by owner qualification.
          # Do not change host-wide user namespace security controls.
          before="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          test "$before" = 1
          distro_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -r "$distro_profile"
          sudo install -m 0644 "$distro_profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "$before"
          bwrap --unshare-user --unshare-net --uid 0 --gid 0 \
            --ro-bind / / --dev-bind /dev /dev --proc /proc \
            /bin/true
          printf 'apparmor_userns=%s; confined_bwrap_smoke=passed\n' "$before" \
            >> "$RUNNER_TEMP/hepta-scoped-disk.txt"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - name: Resolve verified V8 artifacts for affected host crates
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Test affected owners and reverse consumers, not a hand-written package list
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEPTA_CI_LANE: source-head
        run: >-
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/impact-test.json" --
          python3 scripts/hepta_ci_dependencies.py --base "$BASE_SHA" --tested "$TESTED_SHA"
          --output "$RUNNER_TEMP/cargo-impact.json" --run

      - name: Retain dependency plan and real command output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-cargo-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cargo-impact.json
            ${{ runner.temp }}/impact-test.json*
            ${{ runner.temp }}/hepta-scoped-disk.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify generated projections when applicable
        if: needs.scope.outputs.derived == 'true'
        run: python3 scripts/hepta-module-docs.py refresh-derived --check

  lightweight:
    name: Lightweight prose and derived checks
    needs: scope
    if: needs.scope.outputs.native != 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify lightweight repository consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/asciicheck.py README.md
          python3 scripts/readme_toc.py README.md
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-docs.py verify --profile development
          test -z "$(git status --porcelain --untracked-files=no)"

  required:
    timeout-minutes: 30
    name: CI required
    if: ${{ always() }}
    needs:
      - scope
      - hepta-contract-gate
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
      - hepta-scoped
      - lightweight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful applicable dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
          NATIVE: ${{ needs.scope.outputs.native }}
          FULL_REPO: ${{ needs.scope.outputs.full_repo }}
        shell: bash
        run: |
          set -euo pipefail
          export ALLOWED_SKIPPED="$(
            python3 - <<'PY'
          import json
          import os
          native = os.environ["NATIVE"] == "true"
          full = os.environ["FULL_REPO"] == "true"
          allowed = []
          if not (native or full):
              allowed.append("hepta-contract-gate")
          if not full:
              allowed += ["bazel", "cargo-deny", "repo-checks", "rust-ci", "sdk"]
          if not (native and not full):
              allowed.append("hepta-scoped")
          if not (not native and not full):
              allowed.append("lightweight")
          print(json.dumps(allowed))
          PY
          )"
          python3 .github/scripts/check_ci_results.py
