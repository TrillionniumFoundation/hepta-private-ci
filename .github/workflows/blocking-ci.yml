name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

# Keep at most one full repository matrix per PR/ref. A synchronize event makes
# every older head non-authoritative, so retaining its cross-platform matrix
# only consumes scarce hosted capacity and can delay the exact current object.
concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # On pull_request, github.sha is the exact synthetic merge object that all
      # reusable workflows test by default. Keep the source head separately for
      # change classification and provenance; never call it the tested commit.
      TESTED_SHA: ${{ github.sha }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      source_head_sha: ${{ steps.identity.outputs.source_head_sha }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      scope_json: ${{ steps.classify.outputs.scope_json }}
      bazel: ${{ steps.classify.outputs.bazel }}
      cargo_deny: ${{ steps.classify.outputs.cargo_deny }}
      rust_ci: ${{ steps.classify.outputs.rust_ci }}
      sdk: ${{ steps.classify.outputs.sdk }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind tested and source identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse "$SOURCE_HEAD_SHA^{commit}")" = "$SOURCE_HEAD_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" "$TESTED_SHA"
          echo "tested_sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$SOURCE_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Self-test validation policy
        run: python3 scripts/hepta-validation-scope.py --self-test
      - name: Classify the source change once
        id: classify
        run: >-
          python3 scripts/hepta-validation-scope.py
          --base "$BASE_SHA"
          --head "$SOURCE_HEAD_SHA"
          --output "$RUNNER_TEMP/hepta-validation-scope.json"
          --github-output "$GITHUB_OUTPUT"

  hepta-contract-gate:
    name: Hepta contract gate
    needs: scope
    uses: ./.github/workflows/hepta-contract-gate.yml
    secrets: inherit

  # Heavy jobs are only skipped when the same-source classifier marks them N/A.
  # Unknown paths and authority/state/execution/promotion changes fail closed to
  # the complete suite.
  bazel:
    name: Bazel
    needs: scope
    if: needs.scope.outputs.bazel == 'true'
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    needs: scope
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    needs: scope
    if: needs.scope.outputs.cargo_deny == 'true'
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    needs: scope
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    needs: scope
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    needs: scope
    if: needs.scope.outputs.rust_ci == 'true'
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    needs: scope
    if: needs.scope.outputs.sdk == 'true'
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    timeout-minutes: 30
    name: CI required
    # This job is the only blocking fan-in. It consumes the concrete results
    # from this exact tested object and emits one immutable evidence bundle.
    if: ${{ always() }}
    needs:
      - scope
      - hepta-contract-gate
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    env:
      TESTED_SHA: ${{ needs.scope.outputs.tested_sha }}
      SOURCE_HEAD_SHA: ${{ needs.scope.outputs.source_head_sha }}
      BASE_SHA: ${{ needs.scope.outputs.base_sha }}
      HEPTA_SCOPE_JSON: ${{ needs.scope.outputs.scope_json }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.scope.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test evidence verifier
        run: python3 scripts/hepta-delivery-evidence.py self-test

      - name: Build exact-tested-object delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TESTED_SHA"
          test -n "$SOURCE_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          python3 scripts/hepta-delivery-evidence.py build \
            --tested-sha "$TESTED_SHA" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --output "$RUNNER_TEMP/hepta-delivery-evidence.json"
          python3 scripts/hepta-delivery-evidence.py verify \
            --input "$RUNNER_TEMP/hepta-delivery-evidence.json" \
            --tested-sha "$TESTED_SHA" \
            --source-head-sha "$SOURCE_HEAD_SHA"

      - name: Retain the single blocking evidence bundle
        if: always() && env.TESTED_SHA != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-delivery-evidence-${{ env.TESTED_SHA }}
          path: ${{ runner.temp }}/hepta-delivery-evidence.json
          if-no-files-found: error
          retention-days: 30
