name: blocking-ci

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select blocking CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      inference: ${{ steps.scope.outputs.inference }}
      effects: ${{ steps.scope.outputs.effects }}
      lifecycle: ${{ steps.scope.outputs.lifecycle }}
      learning: ${{ steps.scope.outputs.learning }}
      objective: ${{ steps.scope.outputs.objective }}
      native: ${{ steps.scope.outputs.native }}
      derived: ${{ steps.scope.outputs.derived }}
      full_repo: ${{ steps.scope.outputs.full_repo }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select dependency impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.tests.test_hepta_ci_scope scripts.tests.test_hepta_ci_dependencies scripts.tests.test_hepta_ci_shards
          python3 -m unittest -v scripts.test_hepta_readiness_semantics
          args=(--head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--base "$BASE_SHA")
          else
            args+=(--full)
          fi
          python3 scripts/hepta_ci_scope.py "${args[@]}"

      - name: Regression-test scoped fan-in policy
        shell: bash
        run: |
          set -euo pipefail
          NEEDS='{"scope":{"result":"success"},"heavy":{"result":"skipped"}}' \
            ALLOWED_SKIPPED='["heavy"]' \
            python3 .github/scripts/check_ci_results.py
          if NEEDS='{"scope":{"result":"success"},"heavy":{"result":"skipped"}}' \
            python3 .github/scripts/check_ci_results.py; then
            echo "unscoped skipped dependency was incorrectly accepted" >&2
            exit 1
          fi

  hepta-contract-gate:
    name: Hepta contract gate
    needs: scope
    if: needs.scope.outputs.native == 'true' || needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/hepta-contract-gate.yml
    with:
      profile: development
    secrets: inherit

  bazel:
    name: Bazel
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  hepta-scoped-plan:
    name: Plan full exact-tree reverse-consumer coverage
    needs: scope
    if: needs.scope.outputs.native == 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify deterministic shard policy regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.tests.test_hepta_ci_shards
      - name: Plan all owners and reverse consumers from exact SHA
        id: plan
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_shards.py --base "$BASE_SHA" --tested "$TESTED_SHA" --max-packages 12 --output "$RUNNER_TEMP/cargo-impact-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Preserve full impact plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-cargo-impact-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-impact-plan.json
          if-no-files-found: error
          retention-days: 14

  hepta-scoped-shard:
    name: Exact reverse-consumer shard ${{ matrix.index }}
    needs: [scope, hepta-scoped-plan]
    if: needs.scope.outputs.native == 'true' && needs.scope.outputs.full_repo != 'true' && needs.hepta-scoped-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.hepta-scoped-plan.outputs.matrix) }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare native test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Execute exact source shard, preserving all original tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SHARD_INDEX: ${{ matrix.index }}
          EXPECTED_PACKAGES: ${{ toJSON(matrix.packages) }}
          HEPTA_CI_LANE: source-head
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_shards.py --action test --base "$BASE_SHA" --tested "$TESTED_SHA" --max-packages 12 --shard-index "$SHARD_INDEX" --expected-packages-json "$EXPECTED_PACKAGES" --output "$RUNNER_TEMP/cargo-impact-shard.json" --record-output "$RUNNER_TEMP/impact-test.json"
          df -h "$RUNNER_TEMP"
      - name: Retain exact shard plan and real test execution receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-cargo-impact-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/cargo-impact-shard.json
            ${{ runner.temp }}/impact-test.json*
          if-no-files-found: error
          retention-days: 14
      - name: Verify immutable exact tested checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  hepta-scoped:
    name: Hepta scoped native checks
    needs: [scope, hepta-scoped-plan, hepta-scoped-shard]
    if: always() && needs.scope.outputs.native == 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every exact-source shard to pass
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.hepta-scoped-plan.result }}
          SHARDS_RESULT: ${{ needs.hepta-scoped-shard.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$SHARDS_RESULT" = success
      - name: Checkout exact candidate for derived projections
        if: needs.scope.outputs.derived == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify generated projections when applicable
        if: needs.scope.outputs.derived == 'true'
        run: python3 scripts/hepta-module-docs.py refresh-derived --check

  lightweight:
    name: Lightweight prose and derived checks
    needs: scope
    if: needs.scope.outputs.native != 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify lightweight repository consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/asciicheck.py README.md
          python3 scripts/readme_toc.py README.md
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-docs.py verify --profile development
          test -z "$(git status --porcelain --untracked-files=no)"

  required:
    timeout-minutes: 30
    name: CI required
    if: ${{ always() }}
    needs:
      - scope
      - hepta-contract-gate
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
      - hepta-scoped
      - lightweight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful applicable dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
          NATIVE: ${{ needs.scope.outputs.native }}
          FULL_REPO: ${{ needs.scope.outputs.full_repo }}
        shell: bash
        run: |
          set -euo pipefail
          export ALLOWED_SKIPPED="$(
            python3 - <<'PY'
          import json
          import os
          native = os.environ["NATIVE"] == "true"
          full = os.environ["FULL_REPO"] == "true"
          allowed = []
          if not (native or full):
              allowed.append("hepta-contract-gate")
          if not full:
              allowed += ["bazel", "cargo-deny", "repo-checks", "rust-ci", "sdk"]
          if not (native and not full):
              allowed.append("hepta-scoped")
          if not (not native and not full):
              allowed.append("lightweight")
          print(json.dumps(allowed))
          PY
          )"
          python3 .github/scripts/check_ci_results.py
