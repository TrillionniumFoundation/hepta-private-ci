name: blocking-ci

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select blocking CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      inference: ${{ steps.scope.outputs.inference }}
      effects: ${{ steps.scope.outputs.effects }}
      lifecycle: ${{ steps.scope.outputs.lifecycle }}
      learning: ${{ steps.scope.outputs.learning }}
      objective: ${{ steps.scope.outputs.objective }}
      native: ${{ steps.scope.outputs.native }}
      native_desktop: ${{ steps.scope.outputs.native_desktop }}
      derived: ${{ steps.scope.outputs.derived }}
      full_repo: ${{ steps.scope.outputs.full_repo }}
      risk: ${{ steps.scope.outputs.risk }}
      require_exact_source: ${{ steps.scope.outputs.require_exact_source }}
      lanes: ${{ steps.scope.outputs.lanes }}
      scoped_timeout_minutes: ${{ steps.scope.outputs.scoped_timeout_minutes }}
      ordinary_feedback_target_minutes: ${{ steps.scope.outputs.ordinary_feedback_target_minutes }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked Python policy-test dependencies
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Select the small CI Python environment
        shell: bash
        run: |
          uv sync --frozen --project scripts --only-group ci
          echo "$GITHUB_WORKSPACE/scripts/.venv/bin" >> "$GITHUB_PATH"

      - name: Select dependency impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.tests.test_hepta_ci_scope scripts.tests.test_hepta_ci_dependencies
          python3 -m unittest -v scripts.test_hepta_readiness_semantics
          args=(--head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--base "$BASE_SHA")
          else
            args+=(--full)
          fi
          python3 scripts/hepta_ci_scope.py "${args[@]}"
          python3 scripts/hepta_ci_risk.py "${args[@]}"

      - name: Validate workflow and module extension boundaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.test_hepta_repository_surface scripts.test_hepta_ci_risk
          python3 scripts/hepta_repository_surface.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Regression-test scoped fan-in policy
        shell: bash
        run: |
          set -euo pipefail
          NEEDS='{"scope":{"result":"success"},"heavy":{"result":"skipped"}}' \
            ALLOWED_SKIPPED='["heavy"]' \
            python3 .github/scripts/check_ci_results.py
          if NEEDS='{"scope":{"result":"success"},"heavy":{"result":"skipped"}}' \
            python3 .github/scripts/check_ci_results.py; then
            echo "unscoped skipped dependency was incorrectly accepted" >&2
            exit 1
          fi

  hepta-contract-gate:
    name: Hepta contract gate
    needs: scope
    if: needs.scope.outputs.native == 'true' || needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/hepta-contract-gate.yml
    with:
      profile: ${{ needs.scope.outputs.require_exact_source == 'true' && 'qualification' || 'development' }}
    secrets: inherit

  bazel:
    name: Bazel
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  native-desktop:
    name: Native desktop Rust checks
    needs: scope
    if: needs.scope.outputs.native_desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-desktop-target
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare desktop build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libudev-dev
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Check actual desktop formatting
        run: >-
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-desktop-records/format.json" --
          cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check
      - name: Run actual desktop tests
        run: >-
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-desktop-records/test.json" --
          just test -p hepta-native --manifest-path ../apps/hepta-native/Cargo.toml --locked --cargo-profile dev-small --retries 0
      - name: Check all desktop targets independently of test outcome
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-desktop-records/clippy.json" --
          cargo clippy --manifest-path apps/hepta-native/Cargo.toml --locked --profile dev-small --all-targets -- -D warnings
      - name: Retain actual desktop command records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-desktop-records/*
          if-no-files-found: error
          retention-days: 30
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  hepta-scoped:
    name: Hepta scoped native checks
    needs: scope
    if: needs.scope.outputs.native == 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.scope.outputs.scoped_timeout_minutes) }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute exact base and candidate reverse dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/hepta_ci_dependencies.py --base "$BASE_SHA"
          --tested "$TESTED_SHA" --output "$RUNNER_TEMP/cargo-impact.json"

      - name: Prepare native test prerequisites before compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - name: Resolve verified V8 artifacts for affected host crates
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Test affected owners and reverse consumers, not a hand-written package list
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEPTA_CI_LANE: source-head
        run: >-
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/impact-test.json" --
          python3 scripts/hepta_ci_dependencies.py --base "$BASE_SHA" --tested "$TESTED_SHA"
          --output "$RUNNER_TEMP/cargo-impact.json" --run

      - name: Retain dependency plan and real command output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-cargo-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cargo-impact.json
            ${{ runner.temp }}/impact-test.json*
          if-no-files-found: error
          retention-days: 14

      - name: Verify generated projections when applicable
        if: needs.scope.outputs.derived == 'true'
        run: python3 scripts/hepta-module-docs.py refresh-derived --check

  lightweight:
    name: Lightweight prose and derived checks
    needs: scope
    if: needs.scope.outputs.native != 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify lightweight repository consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/asciicheck.py README.md
          python3 scripts/readme_toc.py README.md
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_manifest.py --check
          python3 scripts/hepta_architecture_graph.py --check
          python3 scripts/hepta_rust_reachability.py --strict
          python3 scripts/hepta-docs.py verify --profile development
          test -z "$(git status --porcelain --untracked-files=no)"

  required:
    timeout-minutes: 30
    name: CI required
    if: ${{ always() }}
    needs:
      - scope
      - hepta-contract-gate
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
      - hepta-scoped
      - native-desktop
      - lightweight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful applicable dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
          NATIVE: ${{ needs.scope.outputs.native }}
          NATIVE_DESKTOP: ${{ needs.scope.outputs.native_desktop }}
          FULL_REPO: ${{ needs.scope.outputs.full_repo }}
        shell: bash
        run: |
          set -euo pipefail
          export ALLOWED_SKIPPED="$(
            python3 - <<'PY'
          import json
          import os
          native = os.environ["NATIVE"] == "true"
          full = os.environ["FULL_REPO"] == "true"
          desktop = os.environ["NATIVE_DESKTOP"] == "true"
          allowed = []
          if not (native or full):
              allowed.append("hepta-contract-gate")
          if not full:
              allowed += ["bazel", "cargo-deny", "repo-checks", "rust-ci", "sdk"]
          if not (native and not full):
              allowed.append("hepta-scoped")
          if not desktop:
              allowed.append("native-desktop")
          if not (not native and not full):
              allowed.append("lightweight")
          print(json.dumps(allowed))
          PY
          )"
          python3 .github/scripts/check_ci_results.py
