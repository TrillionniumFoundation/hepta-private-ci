name: blocking-ci

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select blocking CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      inference: ${{ steps.scope.outputs.inference }}
      effects: ${{ steps.scope.outputs.effects }}
      lifecycle: ${{ steps.scope.outputs.lifecycle }}
      learning: ${{ steps.scope.outputs.learning }}
      objective: ${{ steps.scope.outputs.objective }}
      native: ${{ steps.scope.outputs.native }}
      derived: ${{ steps.scope.outputs.derived }}
      full_repo: ${{ steps.scope.outputs.full_repo }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select dependency impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.tests.test_hepta_ci_scope scripts.tests.test_hepta_ci_dependencies
          python3 -m unittest -v scripts.test_hepta_readiness_semantics
          args=(--head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--base "$BASE_SHA")
          else
            args+=(--full)
          fi
          python3 scripts/hepta_ci_scope.py "${args[@]}"

      - name: Regression-test scoped fan-in policy
        shell: bash
        run: |
          set -euo pipefail
          NEEDS='{"scope":{"result":"success"},"heavy":{"result":"skipped"}}' \
            ALLOWED_SKIPPED='["heavy"]' \
            python3 .github/scripts/check_ci_results.py
          if NEEDS='{"scope":{"result":"success"},"heavy":{"result":"skipped"}}' \
            python3 .github/scripts/check_ci_results.py; then
            echo "unscoped skipped dependency was incorrectly accepted" >&2
            exit 1
          fi

  hepta-contract-gate:
    name: Hepta contract gate
    needs: scope
    if: needs.scope.outputs.native == 'true' || needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/hepta-contract-gate.yml
    secrets: inherit

  bazel:
    name: Bazel
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    needs: scope
    if: needs.scope.outputs.full_repo == 'true'
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  hepta-scoped:
    name: Hepta scoped native checks
    needs: scope
    if: needs.scope.outputs.native == 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute exact base and candidate reverse dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/hepta_ci_dependencies.py --base "$BASE_SHA"
          --tested "$TESTED_SHA" --output "$RUNNER_TEMP/cargo-impact.json"

      - name: Prepare native test prerequisites before compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - name: Resolve verified V8 artifacts for affected host crates
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Test affected owners and reverse consumers, not a hand-written package list
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEPTA_CI_LANE: source-head
        run: >-
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/impact-test.json" --
          python3 scripts/hepta_ci_dependencies.py --base "$BASE_SHA" --tested "$TESTED_SHA"
          --output "$RUNNER_TEMP/cargo-impact.json" --run

      - name: Retain dependency plan and real command output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-cargo-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cargo-impact.json
            ${{ runner.temp }}/impact-test.json*
          if-no-files-found: error
          retention-days: 14

      - name: Verify generated projections when applicable
        if: needs.scope.outputs.derived == 'true'
        run: python3 scripts/hepta-module-docs.py refresh-derived --check

  lightweight:
    name: Lightweight prose and derived checks
    needs: scope
    if: needs.scope.outputs.native != 'true' && needs.scope.outputs.full_repo != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify lightweight repository consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/asciicheck.py README.md
          python3 scripts/readme_toc.py README.md
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-docs.py verify
          test -z "$(git status --porcelain --untracked-files=no)"

  control-engineering-qualification:
    name: control.engineering required (${{ matrix.lane }})
    needs: scope
    if: ${{ always() && needs.scope.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current pull-request base
        id: control-current-base
        if: github.event_name == 'pull_request'
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENT_BASE_SHA"
          test -n "$BASE_REF"
          CURRENT_BASE="$(git rev-parse "refs/remotes/origin/${BASE_REF}^{commit}")"
          [[ "$CURRENT_BASE" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CURRENT_BASE^{commit}"
          printf 'BASE_SHA=%s\n' "$CURRENT_BASE" >> "$GITHUB_ENV"
          printf 'sha=%s\n' "$CURRENT_BASE" >> "$GITHUB_OUTPUT"

      - name: Construct deterministic base-merge candidate
        id: control-synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.control-current-base.outputs.sha || env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Blocking CI
          author-email: hepta-blocking-ci@users.noreply.github.com
          message: control.engineering required synthetic merge

      - name: Bind exact tested identity
        env:
          TESTED_SHA_VALUE: ${{ steps.control-synthetic.outputs.sha || env.SOURCE_SHA }}
          MERGE_SHA: ${{ steps.control-synthetic.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HEPTA_CI_LANE" = base-merge ]; then
            test -n "$MERGE_SHA"
            test "$TESTED_SHA_VALUE" = "$MERGE_SHA"
          else
            test -z "$MERGE_SHA"
            test "$TESTED_SHA_VALUE" = "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$TESTED_SHA_VALUE"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Prepare strong sandbox and pinned quality tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap libcap-dev
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 -m venv "$RUNNER_TEMP/control-quality-venv"
          "$RUNNER_TEMP/control-quality-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            -r tools/hepta-engineering-control/quality-requirements.txt

      - name: Execute exact required qualification
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_WORKSPACE"
            --repository-full-name "${{ github.repository }}"
            --repository-id "${{ github.repository_id }}"
            --workflow-ref "${{ github.workflow_ref }}"
            --job-name "${{ github.job }}"
            --run-id "${{ github.run_id }}"
            --run-attempt "${{ github.run_attempt }}"
            --source-sha "$SOURCE_SHA"
            --base-sha "$BASE_SHA"
            --event-name "${{ github.event_name }}"
            --lane "$HEPTA_CI_LANE"
            --pull-request-number "${{ github.event.pull_request.number || 0 }}"
            --quality-python "$RUNNER_TEMP/control-quality-venv/bin/python"
            --output "$RUNNER_TEMP/control-engineering-evidence"
          )
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_name }}" = main ]; then
            args+=(--post-merge-main)
          fi
          python3 tools/hepta-engineering-control/required_qualification.py "${args[@]}"

      - name: Retain control.engineering qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-engineering-required-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/control-engineering-evidence/*
          if-no-files-found: warn
          retention-days: 30

  required:
    timeout-minutes: 30
    name: CI required
    if: ${{ always() }}
    needs:
      - scope
      - hepta-contract-gate
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
      - hepta-scoped
      - lightweight
      - control-engineering-qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful applicable dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
          NATIVE: ${{ needs.scope.outputs.native }}
          FULL_REPO: ${{ needs.scope.outputs.full_repo }}
        shell: bash
        run: |
          set -euo pipefail
          export ALLOWED_SKIPPED="$(
            python3 - <<'PY'
          import json
          import os
          native = os.environ["NATIVE"] == "true"
          full = os.environ["FULL_REPO"] == "true"
          allowed = []
          if not (native or full):
              allowed.append("hepta-contract-gate")
          if not full:
              allowed += ["bazel", "cargo-deny", "repo-checks", "rust-ci", "sdk"]
          if not (native and not full):
              allowed.append("hepta-scoped")
          if not (not native and not full):
              allowed.append("lightweight")
          print(json.dumps(allowed))
          PY
          )"
          python3 .github/scripts/check_ci_results.py
