name: Apply memory retrieval formatting

on:
  push:
    branches:
      - work/memory-retrieval-production-convergence-20260926
    paths:
      - .github/workflows/memory-retrieval-format-apply.yml

permissions:
  contents: write

concurrency:
  group: memory-retrieval-format-apply
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply repository formatting
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Verify formatting-only candidate
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --short -- \
            codex-rs/hepta-memory-retrieval/src \
            codex-rs/hepta-memory/src/cognitive_retrieval_adapter.rs \
            codex-rs/hepta-memory/src/cognitive_retrieval_adapter_tests.rs \
            codex-rs/hepta-agentd/src/cognitive_retrieval_learning_tests.rs)"
          unexpected="$(git status --short | grep -vE '^( M|M |MM) (codex-rs/hepta-memory-retrieval/src/|codex-rs/hepta-memory/src/cognitive_retrieval_adapter(_tests)?\.rs$|codex-rs/hepta-agentd/src/cognitive_retrieval_learning_tests\.rs$)' || true)"
          test -z "$unexpected" || { printf '%s\n' "$unexpected"; exit 1; }

      - name: Commit rustfmt output
        run: |
          set -euo pipefail
          git config user.name "hepta-convergence-bot"
          git config user.email "hepta-convergence-bot@users.noreply.github.com"
          git add \
            codex-rs/hepta-memory-retrieval/src \
            codex-rs/hepta-memory/src/cognitive_retrieval_adapter.rs \
            codex-rs/hepta-memory/src/cognitive_retrieval_adapter_tests.rs \
            codex-rs/hepta-agentd/src/cognitive_retrieval_learning_tests.rs
          git commit -m "style(memory.retrieval): apply pinned rustfmt"
          git push origin HEAD:work/memory-retrieval-production-convergence-20260926
