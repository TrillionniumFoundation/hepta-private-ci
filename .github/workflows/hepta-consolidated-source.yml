name: Hepta consolidated source qualification (read-only)

# Do not path-filter a required gate: an irrelevant edit must report a cheap,
# successful scope decision rather than leave the required check pending.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-consolidated-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

jobs:
  qualification:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Recompute ownership on each actual tested tree, not just on the source.
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      HEPTA_CI_LANE: ${{ matrix.lane }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-native-target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Construct the same synthetic merge as the document gate
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Bind tested identity
        env:
          ACTUAL_TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACTUAL_TESTED_SHA"
          echo "TESTED_SHA=$ACTUAL_TESTED_SHA" >> "$GITHUB_ENV"
      - name: Select changed owners and reverse dependencies
        id: scope
        run: |
          python3 scripts/hepta_ci_scope.py             --base "$BASE_SHA" --tested "$TESTED_SHA"             --output "$RUNNER_TEMP/hepta-plan.json"             --github-output "$GITHUB_OUTPUT"
      - name: Exercise selector, command runner and schema semantics
        run: |
          python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_scope.py'
          python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_run.py'
          python3 -m unittest discover -v -s scripts -p 'test_hepta_readiness_key_order.py'
      - name: Check source-owner invariants
        if: steps.scope.outputs.source_owner == 'true'
        run: python3 scripts/hepta_ci_run.py --plan "$RUNNER_TEMP/hepta-plan.json" --stage source-owner --records "$RUNNER_TEMP/hepta-command-records"
      - name: Test affected UI owners
        if: steps.scope.outputs.ui_browser == 'true' || steps.scope.outputs.ui_native == 'true'
        run: python3 scripts/hepta_ci_run.py --plan "$RUNNER_TEMP/hepta-plan.json" --stage ui --records "$RUNNER_TEMP/hepta-command-records"
      - name: Prepare only required native and isolation prerequisites
        if: steps.scope.outputs.rust_required == 'true' || steps.scope.outputs.engineering == 'true' || steps.scope.outputs.os_evidence == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config openssl
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test engineering isolation when affected
        if: steps.scope.outputs.engineering == 'true'
        env:
          HEPTA_REQUIRE_STRONG_SANDBOX: "1"
        run: python3 scripts/hepta_ci_run.py --plan "$RUNNER_TEMP/hepta-plan.json" --stage engineering --records "$RUNNER_TEMP/hepta-command-records"
      - name: Test OS evidence when affected
        if: steps.scope.outputs.os_evidence == 'true'
        run: |
          test -x /usr/bin/openssl
          /usr/bin/openssl version
          python3 scripts/hepta_ci_run.py --plan "$RUNNER_TEMP/hepta-plan.json" --stage os --records "$RUNNER_TEMP/hepta-command-records"
      - name: Install DotSlash for affected native tests
        if: steps.scope.outputs.rust_required == 'true'
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Expose DotSlash at the integration-test path
        if: steps.scope.outputs.rust_required == 'true'
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.scope.outputs.rust_required == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Check affected package formatting without mutation
        if: steps.scope.outputs.rust_required == 'true'
        run: python3 scripts/hepta_ci_run.py --plan "$RUNNER_TEMP/hepta-plan.json" --stage format --records "$RUNNER_TEMP/hepta-command-records"
      - name: Resolve verified sandboxed V8 artifacts for native tests
        if: steps.scope.outputs.rust_required == 'true'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Run native owner tests and required reverse-dependency regression
        if: steps.scope.outputs.rust_required == 'true'
        run: python3 scripts/hepta_ci_run.py --plan "$RUNNER_TEMP/hepta-plan.json" --stage native --records "$RUNNER_TEMP/hepta-command-records"
      - name: Verify unchanged tracked source and record tested identities
        if: always()
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          {
            printf 'Source: `%s`\n\n' "$SOURCE_SHA"
            printf 'Tested commit: `%s`\n\n' "$TESTED_SHA"
            printf 'Tested tree: `%s`\n\n' "$(git rev-parse HEAD^{tree})"
            printf 'Parents: `%s`\n\n' "$(git show -s --format=%P HEAD)"
            printf 'Prior job status: `%s`\n\n' "$PRIOR_STATUS"
            printf 'This is source regression, not deployment or evolution admission.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain scope and executed-command records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-commands-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/hepta-plan.json
            ${{ runner.temp }}/hepta-command-records/*.json
          if-no-files-found: warn
          retention-days: 30
  integration-gate:
    name: Hepta integration gate
    needs: [qualification]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped lanes
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: |
          python3 - <<'PY'
          import os
          result = os.environ['QUALIFICATION_RESULT']
          if result != 'success':
              raise SystemExit('required qualification result: ' + result)
          print('Every applicable exact-source/merge lane completed successfully.')
          PY
