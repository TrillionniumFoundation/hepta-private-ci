name: Hepta consolidated source qualification (read-only)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hepta-consolidated-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engineering-sandbox:
    name: Engineering strong sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEPTA_REQUIRE_STRONG_SANDBOX: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare dedicated sandbox runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Exercise real namespace isolation and candidate evaluation
        run: python3 -m unittest discover -v -s tools/hepta-engineering-control -p 'test_*.py'
  os-evidence:
    name: OS evidence native executor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify native prerequisites and execute RSA and process-lifecycle tests
        working-directory: tools/hepta-os-evidence
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/openssl
          /usr/bin/openssl version
          python3 run_native_tests.py
  qualification:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Explicit owners: testing a dependency does not execute its own tests.
      PACKAGES: >-
        codex-hepta-agent-protocol codex-hepta-agentd
        codex-hepta-authbus codex-hepta-authbus-p1-3-qualification
        codex-hepta-automation codex-hepta-bao-adapter
        codex-hepta-bellman-operator codex-hepta-codex-adapter
        codex-hepta-cognitive-read codex-hepta-cognitive-store
        codex-hepta-cognitive-types codex-hepta-compact-engine
        codex-hepta-context-compiler codex-hepta-control-plane
        codex-hepta-evidence codex-hepta-fleet
        codex-hepta-infer-core codex-hepta-infer-worker-host
        codex-hepta-inferd codex-hepta-intelligence
        codex-hepta-intelligence-eval codex-hepta-intuition
        codex-hepta-kg codex-hepta-learning-artifacts
        codex-hepta-learning-ledger codex-hepta-matrixd
        codex-hepta-memory codex-hepta-memory-federation
        codex-hepta-memory-retrieval codex-hepta-ndu
        codex-hepta-plasticity codex-hepta-shadow-qualification
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and base-merge identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = base-merge ]; then
            git cat-file -e "$BASE_SHA^{commit}"
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no release or selection' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}
      - name: Verify source-identity and owner-scope regressions
        run: |
          python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_source_identity.py'
          python3 -m unittest discover -v -s scripts -p 'test_hepta_lane_d_scope.py'
      - name: Retain original document and source-owner gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-gap-closure.py verify
          python3 -m unittest discover -v -s tools/hepta-engineering-control -p 'test_*.py'
          node --test apps/hepta-browser/test/*.js apps/hepta-native/test/*.js
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Compile and test actual imported packages
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          cargo check --locked "${args[@]}" --all-targets
          just test --locked "${args[@]}"
          cargo clippy --locked "${args[@]}" --all-targets -- -D warnings
      - name: Formatting without source mutation
        if: always()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(--package "$package"); done
          cargo fmt "${args[@]}" -- --check
      - name: Clean tracked source
        if: always()
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
