name: Hepta consolidated source qualification (read-only)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hepta-consolidated-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Bind source and determine regression scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether the shared-core regression gate applies
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # HEAD alone cannot attest the tracked bytes used by the build.
          git diff --quiet
          git diff --cached --quiet
          # A first push or unavailable old commit has no reliable change set.
          # Run the full regression rather than failing or incorrectly skipping it.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- \
            codex-rs/core/ codex-rs/common/ codex-rs/protocol/ \
            codex-rs/Cargo.toml codex-rs/Cargo.lock \
            ':(glob)codex-rs/**/Cargo.toml' ':(glob)codex-rs/**/build.rs' \
            .cargo/ codex-rs/.cargo/ rust-toolchain rust-toolchain.toml \
            codex-rs/rust-toolchain codex-rs/rust-toolchain.toml \
            justfile codex-rs/justfile scripts/hepta_ci_v8.py \
            .github/workflows/hepta-consolidated-source.yml; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            test "$status" -eq 1
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
  engineering-sandbox:
    name: Engineering strong sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEPTA_REQUIRE_STRONG_SANDBOX: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare dedicated sandbox runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Exercise real namespace isolation and candidate evaluation
        run: python3 -m unittest discover -v -s tools/hepta-engineering-control -p 'test_*.py'
  os-evidence:
    name: OS evidence native executor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify native prerequisites and execute RSA and process-lifecycle tests
        working-directory: tools/hepta-os-evidence
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/openssl
          /usr/bin/openssl version
          python3 run_native_tests.py
  qualification:
    needs: change-scope
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A push already tests the merged source. Only PRs need both identities.
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      FULL_WORKSPACE: ${{ needs.change-scope.outputs.required }}
      LANE: ${{ matrix.lane }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Explicit owners: testing a dependency does not execute its own tests.
      PACKAGES: >-
        codex-hepta-agent-protocol codex-hepta-agentd
        codex-hepta-authbus codex-hepta-authbus-p1-3-qualification
        codex-hepta-automation codex-hepta-bao-adapter
        codex-hepta-bellman-operator codex-hepta-codex-adapter
        codex-hepta-cognitive-read codex-hepta-cognitive-store
        codex-hepta-cognitive-types codex-hepta-compact-engine
        codex-hepta-context-compiler codex-hepta-control-plane
        codex-hepta-evidence codex-hepta-fleet
        codex-hepta-infer-core codex-hepta-infer-worker-host
        codex-hepta-inferd codex-hepta-intelligence
        codex-hepta-intelligence-eval codex-hepta-intuition
        codex-hepta-kg codex-hepta-learning-artifacts
        codex-hepta-learning-ledger codex-hepta-matrixd
        codex-hepta-memory codex-hepta-memory-federation
        codex-hepta-memory-retrieval codex-hepta-ndu
        codex-hepta-plasticity codex-hepta-shadow-qualification
        codex-state codex-core codex-app-server
        codex-hepta-matrix-store codex-hepta-memory-extension
        codex-hepta-neuron codex-hepta-prompt-registry codex-hepta-supervisor
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Construct the same synthetic merge as the document gate
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Retain original document and source-owner gates
        shell: bash
        run: |
          set -euo pipefail
          # Global source/merge document and script checks run once in hepta-development-docs.
          python3 scripts/hepta-gap-closure.py verify
          node --test apps/hepta-browser/test/*.js apps/hepta-native/test/*.js
      - name: Formatting without source mutation
        id: format
        if: always()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(--package "$package"); done
          evidence="$RUNNER_TEMP/hepta-qualification-$LANE"
          mkdir -p "$evidence"
          cargo fmt "${args[@]}" -- --check 2>&1 | tee "$evidence/format.log"
      - name: Prepare native owner-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install DotSlash for shell integration tests
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Expose DotSlash at the path used by integration tests
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified sandboxed V8 artifacts for Cargo
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Compile and test actual imported packages
        id: test_suite
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-native-target
        shell: bash
        run: |
          set -euo pipefail
          args=()
          case "$FULL_WORKSPACE" in
            true) ;;  # The full workspace already includes the owner packages.
            false)
              test -n "$PACKAGES"
              for package in $PACKAGES; do args+=(-p "$package"); done
              ;;
            *) echo "Missing or invalid regression scope" >&2; exit 1 ;;
          esac
          evidence="$RUNNER_TEMP/hepta-qualification-$LANE"
          mkdir -p "$evidence"
          just test --locked "${args[@]}" 2>&1 | tee "$evidence/tests.log"
      - name: Strict owner lint
        id: owner_lint
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-native-target
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          evidence="$RUNNER_TEMP/hepta-qualification-$LANE"
          mkdir -p "$evidence"
          cargo clippy --locked "${args[@]}" --all-targets -- -D warnings 2>&1 | tee "$evidence/clippy.log"
      - name: Record exact tested identity and phase results
        if: always()
        env:
          EXPECTED_TESTED_SHA: ${{ matrix.lane == 'source-head' && env.SOURCE_SHA || steps.synthetic.outputs.sha }}
          TEST_OUTCOME: ${{ steps.test_suite.outcome }}
          LINT_OUTCOME: ${{ steps.owner_lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          PRIOR_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RECORD'
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          env = os.environ
          commit = git("rev-parse", "HEAD")
          parents = git("show", "-s", "--format=%P", "HEAD").split()
          tracked_clean = not git("status", "--porcelain", "--untracked-files=no")
          lane = env["LANE"]
          source = env["SOURCE_SHA"]
          base = env["BASE_SHA"]
          lane_valid = (
              (lane == "source-head" and commit == source)
              or (lane == "base-merge" and parents == [base, source])
          )
          identity_valid = tracked_clean and lane_valid and commit == env["EXPECTED_TESTED_SHA"]
          full = env["FULL_WORKSPACE"]
          args = [] if full == "true" else [part for package in env["PACKAGES"].split() for part in ("-p", package)]
          record = {
              "source_sha": source, "base_sha": base, "lane": lane,
              "expected_tested_sha": env["EXPECTED_TESTED_SHA"],
              "tested_sha": commit, "tested_tree": git("rev-parse", "HEAD^{tree}"),
              "parents": parents, "tracked_clean": tracked_clean, "identity_valid": identity_valid,
              "full_workspace": full, "test_command": ["just", "test", "--locked", *args],
              "outcomes": {"tests": env["TEST_OUTCOME"], "clippy": env["LINT_OUTCOME"], "format": env["FORMAT_OUTCOME"]},
              "prior_job_status": env["PRIOR_STATUS"],
              "run_id": env.get("GITHUB_RUN_ID"), "run_attempt": env.get("GITHUB_RUN_ATTEMPT"),
              "runner_os": env.get("RUNNER_OS"), "runner_arch": env.get("RUNNER_ARCH"),
          }
          evidence = Path(env["RUNNER_TEMP"]) / f"hepta-qualification-{lane}"
          evidence.mkdir(parents=True, exist_ok=True)
          text = json.dumps(record, indent=2) + "\n"
          (evidence / "result.json").write_text(text)
          with open(env["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Test execution record; not deployment qualification.\n\n```json\n" + text + "```\n")
          if not identity_valid or full not in ("true", "false"):
              raise SystemExit("Tested identity or scope does not match this lane")
          PY_RECORD
          git diff --check
      - name: Retain source-bound execution logs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-qualification-${{ matrix.lane }}-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-qualification-${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 30
  workspace-regression:
    # Preserve the existing gate name; successful scope calculation is NOT a test pass.
    name: Workspace regression for shared core changes
    needs: [change-scope, qualification]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require completed source and merge qualification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          FULL_WORKSPACE: ${{ needs.change-scope.outputs.required }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          case "$FULL_WORKSPACE" in true|false) ;; *) exit 1 ;; esac
          test "$QUALIFICATION_RESULT" = success
