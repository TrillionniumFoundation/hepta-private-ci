name: Qualify secrets.heptabao SQLite product runtime

on:
  push:
    branches:
      - codex/secrets-heptabao-ops-closure-build-20260929
    paths:
      - ".github/workflows/secrets-ops-qualify-fast.yml"

permissions:
  contents: write

env:
  SOURCE_SHA: b02723360b5cff2700f2886e01ed5758257cd82d
  OUTPUT_BRANCH: codex/secrets-heptabao-sqlite-product-runtime-20260929
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  compile-smoke:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Format and compile the exact source
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter
          cargo check -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-ops-smoke-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/check.log
          if-no-files-found: warn
          retention-days: 7

  qualify-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Format and publish exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git switch --create "$OUTPUT_BRANCH"
          (
            cd codex-rs
            cargo fmt -p codex-hepta-bao-adapter
          )
          git add codex-rs/hepta-bao-adapter/src
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "Hepta secrets ops closure bot"
            git config user.email "hepta-secrets-ops-closure@users.noreply.github.com"
            git commit -m "secrets: format SQLite product runtime"
          fi
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          test -z "$(git status --porcelain)"
      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -- --check 2>&1 | tee "$RUNNER_TEMP/fmt.log"
      - name: Adapter all-target tests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$RUNNER_TEMP/adapter-tests.log"
      - name: SQLite owner tests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-state-sqlite --all-targets 2>&1 | tee "$RUNNER_TEMP/sqlite-tests.log"
      - name: AuthBus tests
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-hepta-authbus --all-targets 2>&1 | tee "$RUNNER_TEMP/authbus-tests.log"
      - name: Exact candidate check
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo check -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo clippy -p codex-hepta-bao-adapter --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Retain exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          cat > "$RUNNER_TEMP/evidence/candidate.json" <<EOF
          {
            "schema": "hepta.secrets-heptabao-sqlite-product-runtime.v1",
            "sourceSha": "$SOURCE_SHA",
            "candidateSha": "${{ steps.candidate.outputs.sha }}",
            "candidateTree": "${{ steps.candidate.outputs.tree }}",
            "branch": "$OUTPUT_BRANCH",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunAttempt": "${{ github.run_attempt }}"
          }
          EOF
          sha256sum "$RUNNER_TEMP/evidence"/* > "$RUNNER_TEMP/evidence/SHA256SUMS"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-ops-qualified-${{ steps.candidate.outputs.sha || env.SOURCE_SHA }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
