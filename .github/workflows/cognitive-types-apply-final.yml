name: cognitive-types-apply-final

on:
  push:
    branches: ['codex/cognitive-types-full-closure-20260927']
    paths:
      - '.github/workflows/cognitive-types-apply-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-types-apply-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    runs-on: macos-15-xlarge
    timeout-minutes: 120
    steps:
      - name: Check out exact staged candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse stale or redirected execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/cognitive-types-full-closure-20260927 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy

      - name: Verify and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cognitive-types-repair/part-*.patch > "$RUNNER_TEMP/cognitive-types-final.patch"
          actual_digest="$(python3 - "$RUNNER_TEMP/cognitive-types-final.patch" <<'PY'
          import hashlib
          import pathlib
          import sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          test "$actual_digest" = '6b75ab829e85a28e316f948abf2ca613a24b954fa519195bea5b3a846439559a'
          git apply --check "$RUNNER_TEMP/cognitive-types-final.patch"
          git apply --index "$RUNNER_TEMP/cognitive-types-final.patch"

      - name: Format affected Rust packages
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            codex-hepta-cognitive-types \
            codex-hepta-cognitive-store \
            codex-hepta-context-compiler \
            codex-hepta-intelligence \
            codex-hepta-memory-retrieval \
            codex-hepta-memory \
            codex-hepta-authbus \
            codex-hepta-agentd
          do
            cargo fmt --manifest-path codex-rs/Cargo.toml --package "$package"
            cargo fmt --manifest-path codex-rs/Cargo.toml --package "$package" -- --check
          done

      - name: Verify registries vectors and traceability
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 -m unittest discover -s qualification/cognitive-types-v1 -p 'test_*.py'
          python3 qualification/cognitive-types-v1/verify_vectors.py
          python3 qualification/cognitive-types-v1/verify_bound_vector.py
          node qualification/cognitive-types-v1/verify_bound_vector.mjs
          python3 qualification/cognitive-types-v2/verify_vectors.py
          python3 qualification/cognitive-types-v1/render_traceability.py --check

      - name: Compile affected product graph
        shell: bash
        run: |
          set -euxo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked --all-targets \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-context-compiler \
            -p codex-hepta-intelligence \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-memory \
            -p codex-hepta-authbus \
            -p codex-hepta-agentd

      - name: Test affected product graph
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-context-compiler \
            -p codex-hepta-intelligence \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-memory \
            -p codex-hepta-authbus \
            -p codex-hepta-agentd
          cargo check --manifest-path codex-rs/hepta-cognitive-types/fuzz/Cargo.toml --all-targets

      - name: Strict lint affected product graph
        shell: bash
        run: |
          set -euxo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --all-targets \
            -p codex-hepta-cognitive-types \
            -p codex-hepta-cognitive-store \
            -p codex-hepta-context-compiler \
            -p codex-hepta-intelligence \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-memory \
            -p codex-hepta-authbus \
            -p codex-hepta-agentd -- -D warnings

      - name: Commit only verified normal source
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/cognitive-types-full-closure-20260927 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          rm -rf .github/cognitive-types-repair
          rm .github/workflows/cognitive-types-apply-final.yml
          git add -A
          git diff --cached --check
          test -z "$(find . -type d -name target -not -path './target' -print -quit)"
          git config user.name 'Tomasrgbsf'
          git config user.email 'tomasbraynt@gmail.com'
          git commit -m 'fix(cognitive.types): close remaining qualification blockers'
          git push origin HEAD:refs/heads/codex/cognitive-types-full-closure-20260927
