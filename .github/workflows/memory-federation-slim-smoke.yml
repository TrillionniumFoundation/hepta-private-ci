name: memory federation isolated smoke

on:
  push:
    branches:
      - "feat/memory-federation-*"
      - "fix/memory-federation-*"
    paths:
      - ".github/workflows/memory-federation-slim-smoke.yml"
      - "codex-rs/hepta-memory-federation/**"
      - "codex-rs/hepta-memory-federation-wire/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/ext/hepta-memory/**"
      - "scripts/memory_federation_full_attestation.py"
      - "scripts/run_memory_federation_qualification.sh"

permissions:
  contents: read

concurrency:
  group: memory-federation-isolated-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Retain exact source for read-only reproduction
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/memory-federation-reproduction"
          git archive --format=tar.gz --output="$RUNNER_TEMP/memory-federation-reproduction/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/memory-federation-reproduction/identity.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/memory-federation-reproduction/source-objects.txt"
          cd "$RUNNER_TEMP/memory-federation-reproduction"
          sha256sum source.tar.gz identity.txt source-objects.txt > SHA256SUMS
      - name: Upload exact source reproduction inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-federation-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/memory-federation-reproduction
          if-no-files-found: error
          retention-days: 7
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential pkg-config libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0 --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run exact qualification matrix
        shell: bash
        run: bash scripts/run_memory_federation_qualification.sh
