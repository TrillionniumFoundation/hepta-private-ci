name: Hepta lockfile refresh diagnostic

on:
  pull_request:
    paths:
      - "codex-rs/**/Cargo.toml"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/hepta-lockfile-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - name: Resolve workspace lockfile
        working-directory: codex-rs
        run: cargo metadata --format-version=1 --all-features >/dev/null
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-resolved-cargo-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: codex-rs/Cargo.lock
          if-no-files-found: error
          retention-days: 1
