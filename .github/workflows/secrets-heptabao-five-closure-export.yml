name: Export secrets.heptabao five-closure worktree

on:
  push:
    branches:
      - codex/secrets-heptabao-five-closure-20260930

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export bounded source worktree
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output=/tmp/secrets-heptabao-five-closure-${GITHUB_SHA}.tar.gz \
            HEAD \
            codex-rs \
            docs/modules/secrets.heptabao \
            docs/lane-a-foundation/secrets.heptabao \
            CALLERS.toml \
            .github/workflows
          sha256sum /tmp/secrets-heptabao-five-closure-${GITHUB_SHA}.tar.gz \
            > /tmp/secrets-heptabao-five-closure-${GITHUB_SHA}.sha256

      - name: Upload exact worktree
        uses: actions/upload-artifact@v4
        with:
          name: secrets-heptabao-five-closure-${{ github.sha }}
          path: |
            /tmp/secrets-heptabao-five-closure-${{ github.sha }}.tar.gz
            /tmp/secrets-heptabao-five-closure-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 1
