name: hcsn-currentstate-n256-authentic-compact-checkpoint

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_authentic_compact_checkpoint/**"
      - ".github/workflows/hcsn-currentstate-n256-authentic-compact-checkpoint.yml"

permissions:
  contents: read

env:
  UNIQUE_EXECUTION_KEY: hcsn-n256-authentic-compact-checkpoint-20261122-c6bc-001

jobs:
  compact-authentic-index256:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify frozen source and synthetic guards
        run: |
          python3 -m qualification.hcsn_currentstate_n256_authentic_compact_checkpoint.verify_source
          python3 -m unittest qualification.hcsn_currentstate_n256_authentic_compact_checkpoint.test_compact
          python3 -O -m unittest qualification.hcsn_currentstate_n256_authentic_compact_checkpoint.test_compact
          python3 -m py_compile qualification/hcsn_currentstate_n256_authentic_compact_checkpoint/*.py
      - name: Transform each archived authentic checkpoint once
        run: |
          timeout --signal=TERM --kill-after=30s 600s \
            python3 -m qualification.hcsn_currentstate_n256_authentic_compact_checkpoint.run
      - name: Upload originals or interruption journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-authentic-compact-checkpoint-001
          path: qualification/hcsn_currentstate_n256_authentic_compact_checkpoint/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 90
