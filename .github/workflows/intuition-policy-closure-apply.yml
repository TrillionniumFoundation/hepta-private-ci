name: Apply intuition.policy contract closure

on:
  push:
    branches:
      - intuition-policy/full-closure-20260927
    paths:
      - scripts/apply-intuition-policy-closure.py.gz.b64
      - .github/workflows/intuition-policy-closure-apply.yml

permissions:
  contents: write

concurrency:
  group: intuition-policy-closure-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - name: Check out closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: intuition-policy/full-closure-20260927
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Decode and verify guarded patcher
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode scripts/apply-intuition-policy-closure.py.gz.b64 | gzip --decompress > /tmp/apply-intuition-policy-closure.py
          test "$(sha256sum /tmp/apply-intuition-policy-closure.py | cut -d' ' -f1)" = "4ea4908db24250bba84a543db914753ab694e442dca390fbeec85d27750d5ab1"
          python3 -m py_compile /tmp/apply-intuition-policy-closure.py
      - name: Apply guarded source edits
        run: python3 /tmp/apply-intuition-policy-closure.py
      - name: Format changed Rust surfaces
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd
      - name: Verify cross-language golden vector
        run: python3 scripts/verify-intuition-policy-golden.py
      - name: Compile closure surfaces
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence -p codex-hepta-agentd --all-targets
      - name: Compile current API without legacy direct selectors
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-intuition --no-default-features --lib
      - name: Run focused tests
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-intuition -p codex-hepta-intelligence
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit compiled closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Intuition Closure Bot"
          git config user.email "hepta-intuition-closure@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat(intuition): split runtime commitments and harden policy API"
          git push origin HEAD:intuition-policy/full-closure-20260927
