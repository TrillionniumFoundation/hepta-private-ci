name: Hepta gap-closure exact source export

on:
  push:
    branches:
      - codex/hepta-gap-closure-full-ci-20260907

permissions:
  contents: write

jobs:
  export:
    name: Export exact candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Archive and bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git archive --format=tar --prefix=hepta-private-ci/ "${GITHUB_SHA}" \
            | gzip -n > "${RUNNER_TEMP}/hepta-private-ci-${GITHUB_SHA}.tar.gz"
          sha256sum "${RUNNER_TEMP}/hepta-private-ci-${GITHUB_SHA}.tar.gz" \
            > "${RUNNER_TEMP}/hepta-private-ci-${GITHUB_SHA}.tar.gz.sha256"

      - name: Materialize verified hosted-runner workflow blob
        id: normalized
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          source = pathlib.Path('.github/workflows/rust-ci-full.yml')
          text = source.read_text(encoding='utf-8')
          text = text.replace(
              'runs-on: ${{ matrix.runs_on || matrix.runner }}',
              'runs-on: ${{ matrix.runner }}',
          )
          text = text.replace('macos-15-xlarge', 'macos-15')
          text = text.replace('windows-x64', 'windows-2025')
          text = text.replace('windows-arm64', 'windows-11-arm')

          lines = text.splitlines()
          normalized = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if line.strip() == 'runs_on:' and index + 2 < len(lines):
                  indent = len(line) - len(line.lstrip())
                  group = lines[index + 1]
                  labels = lines[index + 2]
                  if (
                      group.strip().startswith('group:')
                      and labels.strip().startswith('labels:')
                      and len(group) - len(group.lstrip()) > indent
                      and len(labels) - len(labels.lstrip()) > indent
                  ):
                      index += 3
                      continue
              if line.strip().startswith(
                  (
                      'runner_group:',
                      'runner_labels:',
                      'archive_runner_group:',
                      'archive_runner_labels:',
                  )
              ):
                  index += 1
                  continue
              normalized.append(line)
              index += 1

          output = ('\n'.join(normalized) + '\n').encode('utf-8')
          forbidden = (
              b'runs_on:',
              b'-runners',
              b'windows-x64',
              b'windows-arm64',
              b'macos-15-xlarge',
          )
          for marker in forbidden:
              if marker in output:
                  raise SystemExit(f'private runner marker remains: {marker!r}')
          for marker in (
              b'ubuntu-24.04',
              b'ubuntu-24.04-arm',
              b'windows-2025',
              b'windows-11-arm',
              b'macos-15',
          ):
              if marker not in output:
                  raise SystemExit(f'hosted runner marker missing: {marker!r}')

          git_sha = hashlib.sha1(
              f'blob {len(output)}\0'.encode('ascii') + output
          ).hexdigest()
          payload = json.dumps(
              {
                  'content': base64.b64encode(output).decode('ascii'),
                  'encoding': 'base64',
              },
              separators=(',', ':'),
          ).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hepta-gap-closure-runner-normalizer',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  remote = json.load(response)
          except urllib.error.HTTPError as error:
              body = error.read().decode('utf-8', errors='replace')
              raise SystemExit(
                  f'GitHub API {error.code} creating workflow blob: {body}'
              ) from error
          if remote.get('sha') != git_sha:
              raise SystemExit(
                  f"blob identity mismatch: local={git_sha} remote={remote.get('sha')}"
              )

          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rust-ci-full.hosted.yml'
          target.write_bytes(output)
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'blob_sha={git_sha}\n')
          print(f'HOSTED_WORKFLOW_BLOB_SHA={git_sha}')
          print(f'HOSTED_WORKFLOW_BYTES={len(output)}')
          PY

      - name: Upload exact source and normalized workflow
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-gap-closure-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-private-ci-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/hepta-private-ci-${{ github.sha }}.tar.gz.sha256
            ${{ runner.temp }}/rust-ci-full.hosted.yml
          if-no-files-found: error
          retention-days: 7

      - name: Publish normalized blob identity
        shell: bash
        run: echo "Normalized workflow blob ${{ steps.normalized.outputs.blob_sha }}"
