name: Prompt registry closeout bootstrap
on:
  push:
    branches:
      - codex/prompt-registry-production-closeout-20260929
    paths:
      - scripts/apply-prompt-registry-production-closeout.py
      - .github/workflows/prompt-registry-closeout-bootstrap.yml
permissions:
  contents: write
concurrency:
  group: prompt-registry-closeout-bootstrap
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/prompt-registry-production-closeout-20260929
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply assertion-bound closeout edits
        run: python3 scripts/apply-prompt-registry-production-closeout.py
      - name: Format changed Rust source
        working-directory: codex-rs
        run: >-
          cargo fmt
          -p codex-hepta-agentd
          -p codex-hepta-prompt-registry
          -p codex-hepta-intelligence
      - name: Validate generated facts and scripts
        run: |
          set -euo pipefail
          python3 scripts/hepta-prompt-registry-doc-truth.py --check
          python3 -m py_compile \
            scripts/hepta-prompt-registry-doc-truth.py \
            scripts/hepta-prompt-registry-accept.py \
            scripts/hepta-prompt-registry-aggregate.py \
            scripts/hepta-prompt-registry-qualify.py
          git diff --check
          test ! -e scripts/apply-prompt-registry-production-closeout.py
      - name: Commit exact candidate source
        env:
          BRANCH: codex/prompt-registry-production-closeout-20260929
        run: |
          set -euo pipefail
          git config user.name 'Prompt registry closeout automation'
          git config user.email 'prompt-registry-closeout@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(prompt.registry): close qualification and acceptance evidence gaps'
          git push origin "HEAD:$BRANCH"
