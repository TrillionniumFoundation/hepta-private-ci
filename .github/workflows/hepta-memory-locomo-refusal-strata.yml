name: MemoryCell original LoCoMo refusal and support strata
on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - "scripts/memory_cell/locomo_refusal_attribution.py"
      - "scripts/memory_cell/test_locomo_refusal_attribution.py"
      - "scripts/memory_cell/data/observed-locomo-refusal-strata-38280267308.json"
      - "codex-rs/hepta-intelligence-eval/MEMORY_CELL_LOCOMO_REFUSAL_STRATIFICATION_20261013.md"
      - ".github/workflows/hepta-memory-locomo-refusal-strata.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memorycell-locomo-refusal-${{ github.sha }}
  cancel-in-progress: false
jobs:
  replay-original-32:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch five exact completed original research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/locomo-frozen"
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11728164433/zip > "$RUNNER_TEMP/locomo-frozen/locomo-public-original.zip"
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11729394703/zip > "$RUNNER_TEMP/locomo-frozen/locomo-retrieval-original.zip"
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11728856834/zip > "$RUNNER_TEMP/locomo-frozen/locomo-targets-original.zip"
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11763718022/zip > "$RUNNER_TEMP/locomo-frozen/locomo-qwen-32-original.zip"
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11766482516/zip > "$RUNNER_TEMP/locomo-frozen/locomo-qwen-hosted-scoring.zip"
      - name: Re-check frozen source, original metric, and post-hoc refusal sensitivity
        env:
          PYTHONPATH: scripts/memory_cell
          LOCOMO_FROZEN_ZIPS: ${{ runner.temp }}/locomo-frozen
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/memory_cell -p 'test_locomo_refusal_attribution.py' -v 2>&1 | tee "$RUNNER_TEMP/locomo-frozen-tests.log"
          python3 scripts/memory_cell/locomo_refusal_attribution.py \
            "$LOCOMO_FROZEN_ZIPS/locomo-public-original.zip" \
            "$LOCOMO_FROZEN_ZIPS/locomo-retrieval-original.zip" \
            "$LOCOMO_FROZEN_ZIPS/locomo-targets-original.zip" \
            "$LOCOMO_FROZEN_ZIPS/locomo-qwen-32-original.zip" \
            "$LOCOMO_FROZEN_ZIPS/locomo-qwen-hosted-scoring.zip" \
            --out "$RUNNER_TEMP/observed-locomo-refusal.json"
          diff -u scripts/memory_cell/data/observed-locomo-refusal-strata-38280267308.json "$RUNNER_TEMP/observed-locomo-refusal.json"
          git rev-parse HEAD > "$RUNNER_TEMP/refusal-source-commit.txt"
      - name: Publish source-pinned model-free replay only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memorycell-original-locomo-refusal-${{ github.sha }}
          path: |
            ${{ runner.temp }}/observed-locomo-refusal.json
            ${{ runner.temp }}/locomo-frozen-tests.log
            ${{ runner.temp }}/refusal-source-commit.txt
          if-no-files-found: warn
