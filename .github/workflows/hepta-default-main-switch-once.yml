name: Hepta switch identical default ref to main once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record unavailable administration channel
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository administration is not available to the managed GitHub integration." >&2
          echo "The prior exact-ref probe failed with HTTP 403 before changing repository metadata." >&2
          exit 1
