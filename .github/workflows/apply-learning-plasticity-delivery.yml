name: Apply learning.plasticity delivery patch

on:
  push:
    branches:
      - learning.plasticity/full-convergence-20260927
    paths:
      - "qualification/.delivery/**"
      - ".github/workflows/apply-learning-plasticity-delivery.yml"

permissions:
  contents: write

concurrency:
  group: apply-learning-plasticity-delivery
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged delivery
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply and commit reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mapfile -t PATCHES < <(find qualification/.delivery -maxdepth 1 -type f -name '*.patch' -print | sort)
          test "${#PATCHES[@]}" -gt 0
          git apply --index "${PATCHES[@]}"
          rm -rf qualification/.delivery
          rm -f .github/workflows/apply-learning-plasticity-delivery.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta Delivery Bot"
          git config user.email "hepta-delivery-bot@users.noreply.github.com"
          git commit -m "feat(learning.plasticity): bind generator coverage proof"
          git push origin HEAD:learning.plasticity/full-convergence-20260927
