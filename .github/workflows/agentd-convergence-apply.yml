name: Prompt registry recovery apply

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/agentd-convergence-apply.yml

permissions:
  contents: write

concurrency:
  group: prompt-registry-recovery-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_PARENT: a19e57ca750378fa218eeec15ab659d40c9376d5
      BRANCH: work/product-convergence-20260923
      CARGO_BUILD_JOBS: "2"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require the reviewed exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          test -f scripts/hepta_apply_prompt_registry_recovery.py

      - name: Apply guarded recovery implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_apply_prompt_registry_recovery.py
          git rm -- scripts/hepta_apply_prompt_registry_recovery.py \
            .github/workflows/agentd-convergence-apply.yml
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-prompt-registry
          git diff --check

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Run prompt registry package tests without retries
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-prompt-registry \
            --retries 0 --failure-output immediate

      - name: Check all prompt registry targets
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-prompt-registry --all-targets

      - name: Strict prompt registry lint
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-prompt-registry --all-targets -- -D warnings

      - name: Commit only the qualified guarded recovery patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Hepta convergence bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/hepta-prompt-registry/src/durable.rs \
            codex-rs/hepta-prompt-registry/src/durable_recovery.rs \
            codex-rs/hepta-prompt-registry/src/durable_payloads_tests.rs \
            scripts/hepta_apply_prompt_registry_recovery.py \
            .github/workflows/agentd-convergence-apply.yml
          git diff --cached --check
          git commit -s -m "fix(prompt.registry): fence recovery against backup rollback"
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
