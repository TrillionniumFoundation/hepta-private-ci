name: Hepta objective static-state authoring

on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927
    paths:
      - .github/workflows/hepta-objective-state-author.yml
      - .github/objective-author-payload/**

permissions:
  contents: read

concurrency:
  group: objective-static-state-author
  cancel-in-progress: false

jobs:
  author:
    name: Generate ordinary source before read-only qualification
    runs-on: ubuntu-slim
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFILES'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import tarfile
          from pathlib import Path, PurePosixPath

          parts = sorted(Path('.github/objective-author-payload').glob('objective-state.tar.gz.b64.*'))
          if not parts:
              raise SystemExit('objective authoring payload is missing')
          encoded = ''.join(part.read_text(encoding='ascii').strip() for part in parts)
          archive = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              members = bundle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or 'PAYLOAD_MANIFEST.json' not in names:
                  raise SystemExit('objective authoring payload identity is invalid')
              for member in members:
                  path = PurePosixPath(member.name)
                  if member.name.startswith('/') or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe objective payload member: {member.name!r}')
              manifest_member = bundle.extractfile('PAYLOAD_MANIFEST.json')
              if manifest_member is None:
                  raise SystemExit('objective payload manifest is unreadable')
              manifest = json.loads(manifest_member.read())
              if set(manifest) != set(names) - {'PAYLOAD_MANIFEST.json'}:
                  raise SystemExit('objective payload manifest does not cover exact members')
              for relative, expected in sorted(manifest.items()):
                  source = bundle.extractfile(relative)
                  if source is None:
                      raise SystemExit(f'objective payload member is unreadable: {relative}')
                  content = source.read()
                  if hashlib.sha256(content).hexdigest() != expected:
                      raise SystemExit(f'objective payload digest mismatch: {relative}')
                  path = Path(relative)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
          PYFILES
          git diff --check

      - name: Validate authored recorders and generate static projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 scripts/hepta-objective-target-measure.py --self-test
          python3 -m unittest -v \
            scripts.test_hepta_objective_target_measure \
            scripts.test_hepta_objective_evidence_project
          python3 scripts/hepta-objective-current-state.py sync
          python3 scripts/hepta-objective-current-state.py verify

          python3 - <<'PYMAP'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          path = Path('docs/modules/objective.compiler/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text(encoding='utf-8'))

          product_paths = set(
              row.get('productCompositionSourceCandidate', {}).get('paths') or []
          )
          product_paths.update({
              '.github/workflows/hepta-objective-admission.yml',
              '.github/workflows/hepta-objective-exact-execution.yml',
              '.github/workflows/hepta-objective-target-measurement.yml',
              'docs/modules/objective.compiler/CURRENT_STATE.json',
              'docs/modules/objective.compiler/DELIVERY_EVIDENCE.md',
              'docs/modules/objective.compiler/SEMANTIC_SUPPORT.md',
              'docs/modules/objective.compiler/TECHNICAL.md',
              'docs/readiness/OBJECTIVE_TARGET_HOST_MEASUREMENT.md',
              'qualification/module-execution-dossiers/detail/objective.compiler.md',
              'scripts/hepta-objective-current-state.py',
              'scripts/hepta-objective-evidence-project.py',
              'scripts/test_hepta_objective_evidence_project.py',
              'scripts/hepta-objective-target-measure.py',
              'scripts/test_hepta_objective_target_measure.py',
          })
          product_paths = sorted(product_paths)
          for source in product_paths:
              if not Path(source).is_file():
                  raise SystemExit(f'missing objective product evidence path: {source}')

          row['dynamicQualificationEvidence'] = {
              'schema': 'hepta.objective-evidence-projection.v2',
              'staticManifest': 'docs/modules/objective.compiler/CURRENT_STATE.json',
              'producer': 'scripts/hepta-objective-evidence-project.py',
              'manualPassFieldsForbidden': True,
              'dynamicClaims': [
                  'sourceHeadQualification',
                  'syntheticMergeQualification',
                  'targetHostMeasurement',
              ],
          }
          policy = row.setdefault('exactHeadQualificationPolicy', {})
          policy['state'] = 'read_only_exact_candidate_receipt_required'
          policy['verifier'] = (
              'python3 scripts/hepta-objective-current-state.py verify; '
              'python3 scripts/hepta-objective-qualify-exact.py; '
              'python3 scripts/hepta-objective-evidence-project.py; '
              'python3 scripts/hepta-implementation-maps.py verify --module objective.compiler'
          )
          workflows = set(policy.get('workflows') or [])
          workflows.update({
              '.github/workflows/hepta-objective-admission.yml',
              '.github/workflows/hepta-lane-d-semantic-conformance.yml',
              '.github/workflows/hepta-objective-exact-execution.yml',
              '.github/workflows/hepta-objective-target-measurement.yml',
          })
          policy['workflows'] = sorted(workflows)

          row['repositoryControlledGaps'] = [
              'Obtain successful read-only source-head and deterministic synthetic-merge receipts for one final canonical candidate checkout.',
              'Record staged latency and isolated fixture-process resources on the selected deployment host and qualify its storage, crash/restart and backpressure policy.',
              'Add a separately versioned durable admission-proof persistence/recovery contract before claiming proof recovery beyond the currently persisted admission/native/protocol identities.',
          ]
          row['productCompositionSourceCandidate'] = {
              **row.get('productCompositionSourceCandidate', {}),
              'paths': product_paths,
              'role': 'product_composition_source_identity_not_execution_receipt',
          }

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          indexed = {
              entry.get('path'): entry
              for entry in row.get('sourceObjects', [])
              if isinstance(entry, dict) and isinstance(entry.get('path'), str)
          }
          for source in product_paths:
              indexed[source] = {
                  'path': source,
                  'object': git('hash-object', source),
              }
          row['sourceObjects'] = [indexed[name] for name in sorted(indexed)]
          path.write_text(
              json.dumps(row, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PYMAP

          python3 -m json.tool docs/modules/objective.compiler/IMPLEMENTATION_MAP.json >/dev/null
          git add \
            .github/workflows/hepta-objective-admission.yml \
            .github/workflows/hepta-objective-exact-execution.yml \
            .github/workflows/hepta-objective-target-measurement.yml \
            docs/modules/objective.compiler/CURRENT_STATE.json \
            docs/modules/objective.compiler/DELIVERY_EVIDENCE.md \
            docs/modules/objective.compiler/TECHNICAL.md \
            docs/readiness/OBJECTIVE_TARGET_HOST_MEASUREMENT.md \
            qualification/module-execution-dossiers/detail/objective.compiler.md \
            docs/modules/objective.compiler/IMPLEMENTATION_MAP.json \
            scripts/hepta-objective-current-state.py \
            scripts/hepta-objective-evidence-project.py \
            scripts/hepta-objective-target-measure.py \
            scripts/test_hepta_objective_evidence_project.py \
            scripts/test_hepta_objective_target_measure.py
          git commit -m 'feat(objective): close evidence and host-measurement gaps'

      - name: Bind product-composition candidate after generated docs commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBIND'
          import json
          import subprocess
          from pathlib import Path

          path = Path('docs/modules/objective.compiler/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text(encoding='utf-8'))
          product = row.get('productCompositionSourceCandidate')
          if not isinstance(product, dict) or not isinstance(product.get('paths'), list):
              raise SystemExit('missing objective product composition source paths')

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          commit = git('log', '-1', '--format=%H', '--', *product['paths'])
          product['commit'] = commit
          product['tree'] = git('rev-parse', f'{commit}^{{tree}}')
          path.write_text(json.dumps(row, indent=2, ensure_ascii=False) + '\n')
          PYBIND
          git add docs/modules/objective.compiler/IMPLEMENTATION_MAP.json
          git commit -m 'docs(objective): bind generated product source identity'

      - name: Rebind exact source objects and retire authoring payload
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module objective.compiler
          git rm .github/workflows/hepta-objective-state-author.yml
          git rm -r .github/objective-author-payload
          git add docs/modules/objective.compiler/IMPLEMENTATION_MAP.json
          git commit -m 'docs(objective): rebind static-state source objects'

          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-objective-current-state.py verify
          python3 scripts/hepta-implementation-maps.py verify \
            --module objective.compiler \
            --expected-sha "$sha" \
            --expected-tree "$tree"
          python3 scripts/hepta-objective-target-measure.py --self-test
          python3 -m unittest -v \
            scripts.test_hepta_objective_target_measure \
            scripts.test_hepta_objective_evidence_project
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Push only as a fast-forward from the authored source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BRANCH: work/objective-compiler-production-convergence-20260927
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Capture authoring evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/objective-static-state-authoring"
          mkdir -p "$out"
          git log -5 --format='%H %T %s' > "$out/commits.txt"
          git status --short > "$out/status.txt"
          git show --stat --oneline HEAD > "$out/final-stat.txt" || true
          printf '%s\n' \
            'Ordinary source authoring only; exact execution and host measurement remain read-only qualification artifacts.' \
            > "$out/CLAIM_BOUNDARY.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objective-static-state-authoring-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/objective-static-state-authoring
          if-no-files-found: warn
          retention-days: 14
