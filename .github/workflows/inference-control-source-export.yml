name: Inference control source export

on:
  push:
    branches:
      - work/inference-control-convergence-20260926

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/SOURCE_SHA"
          tar --exclude=.git -czf "$RUNNER_TEMP/hepta-private-ci-source.tar.gz" .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: inference-control-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-private-ci-source.tar.gz
            ${{ runner.temp }}/SOURCE_SHA
          if-no-files-found: error
          retention-days: 1
