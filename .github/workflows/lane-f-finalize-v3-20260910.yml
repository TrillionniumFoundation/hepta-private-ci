name: Lane F direct-child source materialization

on:
  push:
    branches:
      - codex/lane-f-gap-closure-20260910
    paths:
      - .github/workflows/lane-f-finalize-v3-20260910.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: lane-f-direct-child-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_BRANCH: integration/vnext-main-20260811
  EXPECTED_BASE_SHA: 04f60466394a024c218ce66b1b32d1c42c462985

jobs:
  materialize-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize commit-pinned Lane F overlay
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          expected_paths="$(printf '%s\n' \
            .lane-f-bootstrap/part-00 \
            .lane-f-bootstrap/part-01 \
            .lane-f-bootstrap/part-02 \
            .lane-f-bootstrap/part-03 \
            .lane-f-bootstrap/part-04 \
            .lane-f-bootstrap/part-05 \
            .lane-f-bootstrap/part-06)"
          actual_paths="$(find .lane-f-bootstrap -maxdepth 1 -type f -name 'part-*' -printf '%p\n' | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"

          while read -r expected_sha path; do
            test "$(git rev-parse "${GITHUB_SHA}:${path}")" = "$expected_sha"
            test "$(git hash-object "$path")" = "$expected_sha"
          done <<'EOF'
          39a4478bae4242d1f79cbc2da637ae7d2bd9ed24 .lane-f-bootstrap/part-00
          1077022e5c5a6f8b155453b72dcbd70fa8ff7c2a .lane-f-bootstrap/part-01
          d55b80494c4593b4ea08525bd65aa75719de6320 .lane-f-bootstrap/part-02
          decb6ca20b8e162145886833bb8d1d9b4ccb9612 .lane-f-bootstrap/part-03
          c4bdb9c6e31a735872bf23b54d1909a47b32fb38 .lane-f-bootstrap/part-04
          832015c4be6de537bc6da85dbded37fae3a683d2 .lane-f-bootstrap/part-05
          8821fe0a0cb19464c62de3a5654587a770a50b83 .lane-f-bootstrap/part-06
          EOF

          cat \
            .lane-f-bootstrap/part-00 \
            .lane-f-bootstrap/part-01 \
            .lane-f-bootstrap/part-02 \
            .lane-f-bootstrap/part-03 \
            .lane-f-bootstrap/part-04 \
            .lane-f-bootstrap/part-05 \
            .lane-f-bootstrap/part-06 \
            > /tmp/lane-f-overlay.tar.gz
          OVERLAY_SHA256="$(sha256sum /tmp/lane-f-overlay.tar.gz | cut -d' ' -f1)"
          [[ "$OVERLAY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$OVERLAY_SHA256" >> "$GITHUB_OUTPUT"
          tar -xzf /tmp/lane-f-overlay.tar.gz -C .
          test -f scripts/hepta-lane-f.py
          test -f scripts/test_hepta_lane_f.py

      - name: Normalize explicit Prompt Optimizer profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-prompt-optimizer/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          marker = "pub mod local_shadow;\n"
          addition = (
              "pub mod local_shadow;\n"
              "pub use local_shadow::calculate_local_shadow as calculate_shadow_portfolio_v2;\n"
              "\n"
              "/// Stable identity for the compatibility-only original portfolio API.\n"
              "pub const PROMPT_PORTFOLIO_LEGACY_V1_PROFILE: &str =\n"
              '    "hepta.prompt-portfolio.legacy-v1";\n'
              "/// Stable identity for the bounded interaction-aware shadow API.\n"
              "pub const PROMPT_PORTFOLIO_SHADOW_V2_PROFILE: &str =\n"
              '    "hepta.prompt-portfolio.shadow-v2";\n'
          )
          if "PROMPT_PORTFOLIO_SHADOW_V2_PROFILE" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("unexpected prompt optimizer module marker")
              text = text.replace(marker, addition, 1)

          legacy = "pub fn optimize(mut request: OptimizationRequest)"
          if "Compatibility-only legacy V1 optimizer" not in text:
              if text.count(legacy) != 1:
                  raise SystemExit("unexpected legacy optimizer marker")
              text = text.replace(
                  legacy,
                  "/// Compatibility-only legacy V1 optimizer. New shadow composition uses "
                  "[`calculate_shadow_portfolio_v2`].\n" + legacy,
                  1,
              )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate canonical truth and format sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-f.py generate
          python3 scripts/hepta_module_doc_metadata.py --write
          python3 scripts/hepta-docs.py generate-status
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-intelligence
          cargo fmt --manifest-path qualification/lane-f-shadow/Cargo.toml

      - name: Build exact direct-child source topology
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$BASE_BRANCH"
          BASE_SHA="$(git rev-parse "origin/$BASE_BRANCH")"
          test "$BASE_SHA" = "$EXPECTED_BASE_SHA"
          REMOTE_TRIGGER_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$REMOTE_TRIGGER_SHA" = "$GITHUB_SHA"

          rm -rf .lane-f-bootstrap .lane-f-final .lane-f-min
          rm -f .github/workflows/lane-f-bootstrap.yml
          rm -f .github/workflows/lane-f-resume.yml
          rm -f .github/workflows/lane-f-resume-20260910.yml
          rm -f .github/workflows/lane-f-finalize-20260910.yml
          rm -f .github/workflows/lane-f-finalize-v2-20260910.yml
          rm -f .github/workflows/lane-f-finalize-v3-20260910.yml

          git config user.name hepta-lane-f-bot
          git config user.email hepta-lane-f-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          TREE_SHA="$(git write-tree)"
          SOURCE_SHA="$(printf '%s\n\n%s\n' \
            'feat(lane-f): close adaptive-policy source and documentation gaps' \
            'Signed-off-by: Hepta Lane F Bot <hepta-lane-f-bot@users.noreply.github.com>' \
            | git commit-tree "$TREE_SHA" -p "$BASE_SHA")"
          git reset --hard "$SOURCE_SHA"

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$SOURCE_SHA $BASE_SHA"
          test -z "$(git ls-tree -r --name-only "$SOURCE_SHA" | grep -E '^(\.lane-f-(bootstrap|final|min)/|\.github/workflows/lane-f-(bootstrap|resume|finalize))' || true)"
          printf 'base_sha=%s\nsource_sha=%s\ntree_sha=%s\n' \
            "$BASE_SHA" "$SOURCE_SHA" "$TREE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify generated closed world and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-f.py self-test
          python3 -m unittest scripts/test_hepta_lane_f.py
          python3 scripts/hepta-lane-f.py generate --check
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-lane-f.py verify
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Verify Lane F native crates
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-neuron --all-targets
          cargo test --locked -p codex-hepta-intuition --all-targets
          cargo test --locked -p codex-hepta-prompt-optimizer --all-targets
          cargo test --locked -p codex-hepta-plasticity --all-targets
          cargo test --locked -p codex-hepta-intelligence --all-targets
          cargo clippy --locked \
            -p codex-hepta-neuron \
            -p codex-hepta-intuition \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-plasticity \
            -p codex-hepta-intelligence \
            --all-targets -- -D warnings
          cargo fmt \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-intelligence \
            -- --check

      - name: Verify cross-module shadow qualification
        shell: bash
        run: |
          set -euo pipefail
          rm -f qualification/lane-f-shadow/Cargo.lock
          cargo generate-lockfile --manifest-path qualification/lane-f-shadow/Cargo.toml
          cargo test --locked --manifest-path qualification/lane-f-shadow/Cargo.toml
          cargo clippy --locked --manifest-path qualification/lane-f-shadow/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path qualification/lane-f-shadow/Cargo.toml -- --check
          rm -f qualification/lane-f-shadow/Cargo.lock
          test -z "$(git status --porcelain)"

      - name: Verify clean direct-child source integrity
        shell: bash
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          python3 scripts/hepta-repository-integrity.py self-test
          python3 scripts/hepta-repository-integrity.py verify \
            --base "$BASE_SHA" \
            --head "$SOURCE_SHA" \
            --output /tmp/lane-f-repository-integrity.json
          test -z "$(git status --porcelain)"

      - name: Bind deterministic synthetic merge evidence
        id: receipt
        shell: bash
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree_sha }}
          OVERLAY_SHA256: ${{ steps.overlay.outputs.sha256 }}
        run: |
          set -euo pipefail
          MERGE_TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          test "$MERGE_TREE" = "$SOURCE_TREE"
          export GIT_AUTHOR_NAME='Hepta Lane F CI'
          export GIT_AUTHOR_EMAIL='hepta-lane-f-ci@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          MERGE_SHA="$(printf 'Synthetic Lane F verification merge\n' | git commit-tree "$MERGE_TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          test "$(git rev-list --parents -n 1 "$MERGE_SHA")" = "$MERGE_SHA $BASE_SHA $SOURCE_SHA"
          test "$(git rev-parse "$MERGE_SHA^{tree}")" = "$MERGE_TREE"

          EVIDENCE_DIR="$RUNNER_TEMP/lane-f-evidence"
          mkdir -p "$EVIDENCE_DIR"
          export MERGE_SHA MERGE_TREE EVIDENCE_DIR
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "hepta.lane-f-verification-receipt.v2",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "triggerSha": os.environ["GITHUB_SHA"],
              "sourceSha": os.environ["SOURCE_SHA"],
              "sourceTree": os.environ["SOURCE_TREE"],
              "baseSha": os.environ["BASE_SHA"],
              "syntheticMergeSha": os.environ["MERGE_SHA"],
              "syntheticMergeTree": os.environ["MERGE_TREE"],
              "overlaySha256": os.environ["OVERLAY_SHA256"],
              "sourceParentPolicy": "direct_child_of_base",
              "receiptStorage": "external_artifact_only",
              "checks": {
                  "generatedTruthParity": "pass",
                  "moduleDocumentation": "pass",
                  "readiness": "pass",
                  "implementationDossiers": "pass",
                  "technicalClosure": "pass",
                  "algorithmDocumentation": "pass",
                  "cns": "pass",
                  "hnmf": "pass",
                  "neuron": "pass",
                  "intuition": "pass",
                  "promptOptimizer": "pass",
                  "plasticity": "pass",
                  "intelligenceControl": "pass",
                  "shadowVertical": "pass",
                  "repositoryIntegrity": "pass",
                  "strictClippy": "pass",
                  "format": "pass",
                  "syntheticMerge": "pass",
              },
              "capabilityBoundary": {
                  "productionAuthorityGranted": False,
                  "independentAcceptance": False,
                  "operatorAcceptance": False,
                  "productionCanary": False,
                  "selection": False,
                  "promotion": False,
                  "release": False,
              },
          }
          out = Path(os.environ["EVIDENCE_DIR"]) / "VERIFICATION_RECEIPT.json"
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 -m json.tool "$EVIDENCE_DIR/VERIFICATION_RECEIPT.json" >/dev/null
          printf 'merge_sha=%s\nmerge_tree=%s\n' "$MERGE_SHA" "$MERGE_TREE" >> "$GITHUB_OUTPUT"

      - name: Retain exact Lane F verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-lane-f-exact-${{ steps.source.outputs.source_sha }}
          path: ${{ runner.temp }}/lane-f-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Publish clean direct-child PR head and statuses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$REMOTE_SHA" = "$TRIGGER_SHA"
          git push \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${TRIGGER_SHA}" \
            origin "$SOURCE_SHA:refs/heads/${GITHUB_REF_NAME}"

          TARGET_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for CONTEXT in \
            lane-f/generated-truth \
            lane-f/documentation \
            lane-f/native-crates \
            lane-f/shadow-vertical \
            lane-f/repository-integrity \
            lane-f/synthetic-merge \
            lane-f/verified-candidate
          do
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
              -f state=success \
              -f context="$CONTEXT" \
              -f description='Lane F exact direct-child candidate verified fail-closed' \
              -f target_url="$TARGET_URL" >/dev/null
          done
