name: Read exact foundation CodeQL findings

on:
  push:
    branches: [agents/20261021/foundation-codeql-review]
    paths: [.github/workflows/foundation-codeql-read.yml]

permissions:
  contents: read
  checks: read
  security-events: read

jobs:
  retained-findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_SOURCE_SHA: b58d870a2c38ebee0aa0b974d9f03767c888fa7e
      REVIEW_SOURCE_TREE: 5bdd6960c53a0bc9dd034865d9dfa07a3cbc73f5
      REVIEW_CHECK_ID: "118888053804"
    steps:
      - name: Read and bind the existing failing check
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/hepta-private-ci
          test "$GITHUB_REF" = refs/heads/agents/20261021/foundation-codeql-review
          mkdir evidence
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/check-runs/$REVIEW_CHECK_ID" > evidence/check.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          check = json.loads(Path("evidence/check.json").read_text())
          assert check["id"] == int(os.environ["REVIEW_CHECK_ID"])
          assert check["head_sha"] == os.environ["REVIEW_SOURCE_SHA"]
          assert check["name"] == "CodeQL"
          assert check["status"] == "completed" and check["conclusion"] == "failure"
          Path("evidence/source.json").write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": check["head_sha"],
              "check_id": check["id"],
              "annotations_count": check["output"]["annotations_count"],
              "reader_commit": os.environ["GITHUB_SHA"],
              "reader_run_id": os.environ["GITHUB_RUN_ID"],
              "read_only_existing_findings": True,
          }, indent=2) + "\n")
          PY

      - name: Retain every existing annotation without changing alert state
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences --paginate --slurp "repos/$GITHUB_REPOSITORY/check-runs/$REVIEW_CHECK_ID/annotations?per_page=100" > evidence/annotation-pages.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("evidence")
          source = json.loads((root / "source.json").read_text())
          pages = json.loads((root / "annotation-pages.json").read_text())
          assert isinstance(pages, list) and all(isinstance(page, list) for page in pages)
          annotations = [entry for page in pages for entry in page]
          assert len(annotations) == source["annotations_count"]
          (root / "annotations.json").write_text(json.dumps(annotations, indent=2) + "\n")
          print(f"Retained {len(annotations)} existing annotations for the exact source.")
          PY

      - name: Read the source-bound Rust SARIF and retained data-flow paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          from urllib.parse import urlencode

          root = Path("evidence")
          repository = os.environ["GITHUB_REPOSITORY"]
          source = os.environ["REVIEW_SOURCE_SHA"]
          expected_tree = os.environ["REVIEW_SOURCE_TREE"]
          def get(endpoint, name, accept="application/vnd.github+json"):
              destination = root / (name + ".json")
              with destination.open("xb") as stdout, (root / (name + ".stderr.log")).open("xb") as stderr:
                  result = subprocess.run(["gh", "api", "--method", "GET",
                      "--allow-escape-sequences", "-H", "Accept: " + accept, endpoint],
                      stdout=stdout, stderr=stderr, check=False, timeout=90)
              (root / (name + ".exit-code.txt")).write_text(str(result.returncode) + "\n")
              if result.returncode:
                  raise RuntimeError(f"Read failed: {name}; original response retained")
              return json.loads(destination.read_text())

          analyses = {}
          refs = ["refs/pull/2937/merge", "refs/heads/integration/v8-main-convergence-20261020",
                  "refs/pull/2937/head"]
          for ref_number, ref in enumerate(refs):
              for page in range(1, 6):
                  query = urlencode({"ref": ref, "tool_name": "CodeQL", "per_page": 100, "page": page})
                  entries = get(f"repos/{repository}/code-scanning/analyses?{query}",
                                f"analyses-ref-{ref_number}-page-{page}")
                  if not isinstance(entries, list):
                      raise RuntimeError("Unexpected analysis list response")
                  for entry in entries:
                      if entry.get("ref") != ref:
                          raise RuntimeError("Analysis reference changed")
                      analyses[entry["id"]] = entry
                  if len(entries) < 100:
                      break
              else:
                  raise RuntimeError("Analysis listing exceeded the reviewed five-page bound")

          selected = []
          commits = {}
          for entry in analyses.values():
              if entry.get("tool", {}).get("name") != "CodeQL":
                  continue
              environment = json.loads(entry.get("environment") or "{}")
              if environment.get("language") != "rust" and not entry.get("category", "").endswith("language:rust"):
                  continue
              sha = entry["commit_sha"]
              if sha not in commits:
                  commits[sha] = get(f"repos/{repository}/git/commits/{sha}", f"analysis-commit-{sha}")
              commit = commits[sha]
              if commit["sha"] != sha:
                  raise RuntimeError("Analysis commit identity changed")
              exact = sha == source
              same_tree_merge = (commit["tree"]["sha"] == expected_tree
                                 and source in [parent["sha"] for parent in commit["parents"]])
              if not exact and not same_tree_merge:
                  continue
              if commit["tree"]["sha"] != expected_tree or entry.get("error"):
                  raise RuntimeError("Source-bound analysis is incomplete or has a different tree")
              selected.append({"analysis": entry, "exact_source_commit": exact,
                               "same_source_tree_merge": same_tree_merge,
                               "analysis_tree_sha": commit["tree"]["sha"]})
          (root / "selected-analyses.json").write_text(json.dumps(selected, indent=2) + "\n")
          if not 1 <= len(selected) <= 10:
              raise RuntimeError("Expected one to ten source-bound Rust analyses")
          results = []
          for selected_entry in selected:
              entry = selected_entry["analysis"]
              analysis_id = entry["id"]
              sarif = get(f"repos/{repository}/code-scanning/analyses/{analysis_id}",
                          f"rust-analysis-{analysis_id}.sarif", "application/sarif+json")
              if sarif.get("version") != "2.1.0" or not isinstance(sarif.get("runs"), list):
                  raise RuntimeError("Unexpected SARIF response")
              findings = [finding for run in sarif["runs"] for finding in run.get("results", [])]
              results.append({"analysis_id": analysis_id, "commit_sha": entry["commit_sha"],
                              "ref": entry["ref"], "results": len(findings),
                              "results_with_code_flows": sum(bool(f.get("codeFlows")) for f in findings),
                              "read_only": True, "alert_state_changed": False})
          (root / "sarif-summary.json").write_text(json.dumps(results, indent=2) + "\n")
          print(json.dumps(results, indent=2))
          PY

      - name: Read current identities and instances of the forty reviewed alerts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from urllib.parse import quote, urlencode

          root = Path("evidence")
          repository = os.environ["GITHUB_REPOSITORY"]
          def get(endpoint, name):
              with (root / (name + ".json")).open("xb") as stdout, (root / (name + ".stderr.log")).open("xb") as stderr:
                  result = subprocess.run(["gh", "api", "--method", "GET", "--allow-escape-sequences",
                      "-H", "Accept: application/vnd.github+json", endpoint], stdout=stdout,
                      stderr=stderr, check=False, timeout=90)
              (root / (name + ".exit-code.txt")).write_text(str(result.returncode) + "\n")
              if result.returncode:
                  raise RuntimeError(f"Read failed: {name}; original response retained")
              return json.loads((root / (name + ".json")).read_text())

          index_path = ".github/security-reviews/2026-10-21-foundation-codeql/review-index.json"
          response = get(f"repos/{repository}/contents/{index_path}?" + urlencode({"ref": os.environ["GITHUB_SHA"]}),
                         "review-index-content-response")
          if response.get("encoding") != "base64":
              raise RuntimeError("Unexpected review-index encoding")
          data = base64.b64decode(response["content"])
          if hashlib.sha256(data).hexdigest() != "429eb37e44d2c927f7bfc533c337a078a7c9c57928a908e5c24288bb9a6a3198":
              raise RuntimeError("The independently reviewed finding index changed")
          (root / "review-index-approved.json").write_bytes(data)
          index = json.loads(data)
          if index["repository"] != repository or index["source_sha"] != os.environ["REVIEW_SOURCE_SHA"]:
              raise RuntimeError("Reviewed source identity mismatch")
          findings = index["findings"]
          if len(findings) != 40 or len({item["alert_number"] for item in findings}) != 40:
              raise RuntimeError("Expected forty uniquely reviewed findings")
          sarif = json.loads((root / "rust-analysis-1992617134.sarif.json").read_text())
          original = [item for run in sarif["runs"] for item in run.get("results", [])]
          for item in findings:
              finding = original[item["sarif_result_index"]]
              if (finding["properties"]["github/alertNumber"] != item["alert_number"]
                      or finding["ruleId"] != item["rule_id"]
                      or finding.get("partialFingerprints", {}) != item["partial_fingerprints"]):
                  raise RuntimeError("Review is not one-to-one with the original SARIF")

          current_files = {}
          records = []
          for item in findings:
              number = item["alert_number"]
              alert = get(f"repos/{repository}/code-scanning/alerts/{number}", f"alert-{number}")
              if (alert.get("number") != number or alert.get("tool", {}).get("name") != "CodeQL"
                      or alert.get("rule", {}).get("id") != item["rule_id"]):
                  raise RuntimeError(f"Alert identity changed: {number}")
              instances = []
              for page in range(1, 6):
                  batch = get(f"repos/{repository}/code-scanning/alerts/{number}/instances?per_page=100&page={page}",
                              f"alert-{number}-instances-{page}")
                  if not isinstance(batch, list):
                      raise RuntimeError("Unexpected instance list")
                  instances.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise RuntimeError("Alert instances exceeded the reviewed page bound")
              original_matches = [value for value in instances
                  if value.get("commit_sha") == index["source_sha"]
                  and value.get("ref") == index["analysis_ref"]
                  and value.get("location") == item["location"]]
              issues = []
              if len(original_matches) != 1:
                  issues.append("Original source-bound instance is absent or ambiguous")
              checked = []
              for instance in instances:
                  if instance.get("state") != "open":
                      continue
                  if instance.get("location") != item["location"]:
                      issues.append("An open instance has a different location")
                      continue
                  sha = instance.get("commit_sha", "")
                  if len(sha) != 40 or any(c not in "0123456789abcdef" for c in sha):
                      raise RuntimeError("Unexpected open-instance commit")
                  key = (sha, item["path"])
                  if key not in current_files:
                      if len(current_files) >= 200:
                          raise RuntimeError("Current source reads exceeded the reviewed bound")
                      name = "current-source-" + hashlib.sha256((sha + ":" + item["path"]).encode()).hexdigest()
                      content = get(f"repos/{repository}/contents/{quote(item['path'], safe='/')}?" + urlencode({"ref": sha}), name)
                      current_files[key] = content["sha"]
                  blob = current_files[key]
                  if blob != item["source_blob"]:
                      issues.append("An open instance has changed source bytes")
                  checked.append({"ref": instance.get("ref"), "commit_sha": sha, "blob_sha": blob,
                                  "matches_reviewed_source": blob == item["source_blob"]})
              record = {"alert_number": number, "state": alert.get("state"),
                  "existing_dismissed_reason": alert.get("dismissed_reason"),
                  "proposed_reason": item["dismissed_reason"], "original_instance_matches": len(original_matches),
                  "instances": len(instances), "checked_open_instances": checked, "issues": issues,
                  "eligible_for_reviewed_disposition": alert.get("state") == "open" and bool(checked) and not issues,
                  "alert_state_changed": False}
              records.append(record)
              (root / "current-alert-review.json").write_text(json.dumps(records, indent=2) + "\n")
          summary = {"reviewed": len(records), "eligible": sum(value["eligible_for_reviewed_disposition"] for value in records),
              "already_fixed": sum(value["state"] == "fixed" for value in records),
              "already_dismissed": sum(value["state"] == "dismissed" for value in records),
              "with_identity_or_source_issues": sum(bool(value["issues"]) for value in records),
              "source_blobs_read": len(current_files), "alert_state_changed": False}
          (root / "current-alert-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Hash all retained original responses
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("evidence")
          root.mkdir(exist_ok=True)
          inventory = [{"path": path.name, "bytes": path.stat().st_size,
                        "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                       for path in sorted(root.iterdir()) if path.is_file() and path.name != "inventory.json"]
          (root / "inventory.json").write_text(json.dumps(inventory, indent=2) + "\n")
          PY

      - name: Preserve the read-only diagnostic result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-codeql-${{ env.REVIEW_SOURCE_SHA }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
