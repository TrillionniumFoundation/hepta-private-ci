name: Read exact foundation CodeQL findings

on:
  push:
    branches: [agents/20261021/foundation-codeql-review]

permissions:
  contents: read
  checks: read

jobs:
  retained-findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_SOURCE_SHA: b58d870a2c38ebee0aa0b974d9f03767c888fa7e
      REVIEW_CHECK_ID: "118888053804"
    steps:
      - name: Read and bind the existing failing check
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/hepta-private-ci
          test "$GITHUB_REF" = refs/heads/agents/20261021/foundation-codeql-review
          mkdir evidence
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/check-runs/$REVIEW_CHECK_ID" > evidence/check.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          check = json.loads(Path("evidence/check.json").read_text())
          assert check["id"] == int(os.environ["REVIEW_CHECK_ID"])
          assert check["head_sha"] == os.environ["REVIEW_SOURCE_SHA"]
          assert check["name"] == "CodeQL"
          assert check["status"] == "completed" and check["conclusion"] == "failure"
          Path("evidence/source.json").write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": check["head_sha"],
              "check_id": check["id"],
              "annotations_count": check["output"]["annotations_count"],
              "reader_commit": os.environ["GITHUB_SHA"],
              "reader_run_id": os.environ["GITHUB_RUN_ID"],
              "read_only_existing_findings": True,
          }, indent=2) + "\n")
          PY

      - name: Retain every existing annotation without changing alert state
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences --paginate --slurp "repos/$GITHUB_REPOSITORY/check-runs/$REVIEW_CHECK_ID/annotations?per_page=100" > evidence/annotation-pages.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("evidence")
          source = json.loads((root / "source.json").read_text())
          pages = json.loads((root / "annotation-pages.json").read_text())
          assert isinstance(pages, list) and all(isinstance(page, list) for page in pages)
          annotations = [entry for page in pages for entry in page]
          assert len(annotations) == source["annotations_count"]
          (root / "annotations.json").write_text(json.dumps(annotations, indent=2) + "\n")
          inventory = [{"path": path.name, "bytes": path.stat().st_size,
                        "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                       for path in sorted(root.iterdir()) if path.is_file()]
          (root / "inventory.json").write_text(json.dumps(inventory, indent=2) + "\n")
          print(f"Retained {len(annotations)} existing annotations for the exact source.")
          PY

      - name: Preserve the read-only diagnostic result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-codeql-${{ env.REVIEW_SOURCE_SHA }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
