name: Hepta Neuron model trial protocol

on:
  pull_request:
    paths:
      - "scripts/hepta_neuron_model_trials.py"
      - "scripts/hepta_neuron_trial_evidence_gate.py"
      - "scripts/hepta_neuron_physical_receipt_verify.py"
      - "scripts/hepta_neuron_artifact_preflight.py"
      - "scripts/hepta_neuron_materialize_weights.py"
      - "scripts/hepta_neuron_freeze_dataset.py"
      - "scripts/hepta_neuron_physical_smoke.py"
      - ".github/scripts/test_hepta_neuron_physical_smoke.py"
      - ".github/scripts/test_hepta_neuron_physical_receipt_verify.py"
      - ".github/scripts/test_hepta_neuron_model_trials.py"
      - ".github/scripts/test_hepta_neuron_materialize_and_freeze.py"
      - ".github/scripts/test_hepta_neuron_trial_evidence_gate.py"
      - ".github/workflows/hepta-neuron-model-trials.yml"
      - "scripts/hepta_neuron_cpu_benchmark.py"
      - "scripts/hepta_neuron_cpu_benchmark_verify.py"
      - ".github/scripts/test_hepta_neuron_cpu_benchmark.py"
      - ".github/workflows/hepta-neuron-matched-cpu.yml"
      - "scripts/hepta_neuron_real_cohort_preflight.py"
      - "scripts/hepta_neuron_production_baseline_compare.py"
      - "scripts/hepta_neuron_paired_uncertainty.py"
      - ".github/scripts/test_hepta_neuron_paired_uncertainty.py"
      - ".github/scripts/test_hepta_neuron_production_baseline_compare.py"
      - ".github/scripts/test_hepta_neuron_real_cohort_preflight.py"
      - "qualification/neuron-model-trials/**"
  workflow_dispatch:

concurrency:
  group: hepta-neuron-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  diagnostic-protocol-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install isolated signature verification dependency
        run: |
          python3 -m venv /tmp/hepta-neuron-trial-venv
          /tmp/hepta-neuron-trial-venv/bin/python -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.4'
      - name: Strict offline protocol checks (no weights, no production model claims)
        run: |
          /tmp/hepta-neuron-trial-venv/bin/python -m py_compile scripts/hepta_neuron_model_trials.py scripts/hepta_neuron_trial_evidence_gate.py scripts/hepta_neuron_artifact_preflight.py scripts/hepta_neuron_materialize_weights.py scripts/hepta_neuron_freeze_dataset.py scripts/hepta_neuron_physical_smoke.py scripts/hepta_neuron_physical_receipt_verify.py scripts/hepta_neuron_cpu_benchmark.py scripts/hepta_neuron_cpu_benchmark_verify.py scripts/hepta_neuron_real_cohort_preflight.py scripts/hepta_neuron_production_baseline_compare.py scripts/hepta_neuron_paired_uncertainty.py
          /tmp/hepta-neuron-trial-venv/bin/python -m unittest discover -s .github/scripts -p 'test_hepta_neuron*.py' -v
          /tmp/hepta-neuron-trial-venv/bin/python scripts/hepta_neuron_artifact_preflight.py catalog \
            --catalog qualification/neuron-model-trials/upstream-weights.lock.json \
            --output "$RUNNER_TEMP/hepta-neuron-upstream-metadata.json"
          /tmp/hepta-neuron-trial-venv/bin/python scripts/hepta_neuron_physical_receipt_verify.py \
            --directory "$GITHUB_WORKSPACE/qualification/neuron-model-trials/physical-smoke-receipts/run-38095795540" \
            --catalog qualification/neuron-model-trials/upstream-weights.lock.json \
            --expected-run-id 38095795540 \
            --expected-source-sha 5b542e100368f2e1aefeba6de7a156e19af27282 \
            --expected-manifest-sha256 93665176c9f42d7489ea4509217aa58d452a87ee33c5051066e027122f20448e \
            --output "$RUNNER_TEMP/hepta-neuron-public-receipt-replay.json"
          git diff --check
