name: Hepta Neuron model trial protocol

on:
  pull_request:
    paths:
      - 'scripts/hepta_neuron_model_trials.py'
      - '.github/scripts/test_hepta_neuron_model_trials.py'
      - '.github/workflows/hepta-neuron-model-trials.yml'
      - 'qualification/neuron-model-trials/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-protocol-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Strict offline Python protocol checks (no weights or model claims)
        run: |
          python3 -m py_compile scripts/hepta_neuron_model_trials.py
          python3 -m unittest discover -s .github/scripts -p test_hepta_neuron_model_trials.py -v
          git diff --check
