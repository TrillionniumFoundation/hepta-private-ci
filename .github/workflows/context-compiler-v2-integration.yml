name: context.compiler V2 source materialization

on:
  push:
    branches:
      - revision/context-compiler-v2-provider-closure-2026-09-27
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: context-compiler-v2-source-materialization
  cancel-in-progress: true

jobs:
  materialize-source:
    if: ${{ !contains(github.event.head_commit.message || '', '[context-v2-integrated]') }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: revision/context-compiler-v2-provider-closure-2026-09-27
          fetch-depth: 0

      - name: Apply deterministic closure patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_context_compiler_delivery_patch.py
          python3 scripts/_context_compiler_runtime_bridge_patch.py
          python3 scripts/_context_compiler_terminal_bridge_patch.py
          python3 scripts/_context_compiler_observation_patch.py
          python3 scripts/_context_compiler_agentd_patch.py
          python3 scripts/_context_compiler_framing_policy_patch.py
          python3 scripts/_context_compiler_crash_safety_patch.py
          python3 scripts/_context_compiler_property_patch.py

      - name: Format materialized Rust source
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --all

      - name: Reject patch drift and whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain=v1 -- codex-rs)"

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-ci-bot"
          git config user.email "hepta-ci-bot@users.noreply.github.com"
          git add codex-rs
          git commit -m "context.compiler: materialize exact V2 provider closure [context-v2-integrated]"
          git push origin HEAD:revision/context-compiler-v2-provider-closure-2026-09-27

# The resulting source commit is intentionally unqualified. The protected final branch runs
# .github/workflows/context-compiler-qualification.yml against its exact immutable SHA.
