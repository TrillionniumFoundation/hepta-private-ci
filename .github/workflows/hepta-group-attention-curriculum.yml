name: Hepta Group Step-Supervision Pairing (Research)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/group_attention*.py'
      - 'qualification/stem-cell-v1/group_step_supervision.py'
      - 'qualification/stem-cell-v1/group_training.py'
      - 'qualification/stem-cell-v1/group_core.py'
      - 'qualification/stem-cell-v1/test_group_training_attention.py'
      - '.github/workflows/hepta-group-attention-curriculum.yml'

permissions:
  contents: read

concurrency:
  group: group-step-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install real CPU numerical execution dependencies
        run: |
          python -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.1' 'numpy==2.5.4' 'safetensors==0.8.0'
      - name: Run new and original Core/teacher/reviewer CPU checks
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          import torch._dynamo
          import unittest
          names = (
              "test_group_training_attention",
              "test_group_attention_curriculum",
              "test_group_attention_campaign_review",
              "test_group_checkpoint_audit",
              "test_group_training_optimizer",
              "test_group_step_supervision",
              "test_group_training",
          )
          import sys
          sys.path.insert(0, "qualification/stem-cell-v1")
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(x) for x in names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY

  physical-pretrained:
    needs: cpu-regressions
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        seed: [41, 47, 53]
        optimizer: [sgd_v1, adam_v1]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install pinned pretrained CPU stack
        run: |
          python -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.1' 'numpy==2.5.4' 'safetensors==0.8.0'
      - name: Execute and independently audit paired same-init Group training
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python qualification/stem-cell-v1/group_attention_campaign.py --acquire --snapshot "${{ runner.temp }}/granite-step" --output "${{ runner.temp }}/paired-step" --seed "${{ matrix.seed }}" --training-profile "${{ matrix.optimizer }}"
          python -S qualification/stem-cell-v1/group_attention_campaign_review.py "${{ runner.temp }}/paired-step" --output "${{ runner.temp }}/paired-step/independent-review.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: group-step-pretrained-${{ matrix.seed }}-${{ matrix.optimizer }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/paired-step/*.json
            ${{ runner.temp }}/paired-step/*.safetensors
          if-no-files-found: warn
