name: Hepta cosine preserving residual gate
on:
  push:
    branches: ["research/five-causal-experiments-20261013"]
    paths:
      - "scripts/memory_cell/shared_gate_cosine_residual.py"
      - "scripts/memory_cell/shared_gate_cosine_residual_trial.py"
      - "scripts/memory_cell/test_shared_gate_cosine_residual.py"
      - ".github/workflows/hepta-cosine-residual-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cosine-residual-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train-residual-on-fixed-cosine:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install unchanged frozen-feature worker
        run: |
          set -euo pipefail
          mkdir -p /tmp/cosine-residual/checks
          python3 -m venv /tmp/cosine-residual-env
          /tmp/cosine-residual-env/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu > /tmp/cosine-residual/checks/install-torch.log 2>&1
          /tmp/cosine-residual-env/bin/pip install -r scripts/memory_cell/requirements.txt packaging==25.0 cryptography==46.0.4 psutil==7.0.0 regex==2024.11.6 Jinja2==3.1.6 > /tmp/cosine-residual/checks/install-worker.log 2>&1
          /tmp/cosine-residual-env/bin/pip check
          /tmp/cosine-residual-env/bin/pip freeze > /tmp/cosine-residual/checks/environment.txt
      - name: Require residual, cache, crossing and material regressions
        run: |
          set -euo pipefail
          failed=0
          for pattern in test_shared_gate_cosine_residual.py test_shared_gate_similarity.py test_shared_gate_similarity_cache.py test_shared_gate_crossed.py test_shared_question_gate.py test_shared_question_gate_entrypoint.py test_question_evidence_relevance.py test_five_encoder_snapshot.py; do
            name=$(printf '%s' "$pattern" | tr '*' '_')
            if /tmp/cosine-residual-env/bin/python -m unittest discover -s scripts/memory_cell -p "$pattern" -v 2>&1 | tee "/tmp/cosine-residual/checks/$name.log"; then
              printf '%s\tpassed\n' "$pattern" >> /tmp/cosine-residual/checks/suites.tsv
            else
              failed=1
              printf '%s\tfailed\n' "$pattern" >> /tmp/cosine-residual/checks/suites.tsv
            fi
          done
          /tmp/cosine-residual-env/bin/python -m py_compile scripts/memory_cell/shared_gate_cosine_residual.py scripts/memory_cell/shared_gate_cosine_residual_trial.py scripts/memory_cell/test_shared_gate_cosine_residual.py
          /tmp/cosine-residual-env/bin/python scripts/memory_cell/shared_gate_cosine_residual_trial.py --help > /tmp/cosine-residual/checks/real-cli-help.txt
          test "$failed" -eq 0
      - name: Resolve exact completed upstream results once
        id: dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for item in head:38526481788 cross:38526874475 similarity:38529721933; do
            role=${item%%:*}; run=${item##*:}
            gh api "repos/TrillionniumFoundation/hepta-private-ci/actions/runs/${run}" > "/tmp/cosine-residual/checks/${role}-run.json"
            gh api "repos/TrillionniumFoundation/hepta-private-ci/actions/runs/${run}/artifacts?per_page=100" > "/tmp/cosine-residual/checks/${role}-artifacts.json"
          done
          code=0
          /tmp/cosine-residual-env/bin/python scripts/memory_cell/shared_gate_cosine_residual_trial.py dependency \
            --head-run-json /tmp/cosine-residual/checks/head-run.json \
            --head-artifacts-json /tmp/cosine-residual/checks/head-artifacts.json \
            --cross-run-json /tmp/cosine-residual/checks/cross-run.json \
            --cross-artifacts-json /tmp/cosine-residual/checks/cross-artifacts.json \
            --similarity-run-json /tmp/cosine-residual/checks/similarity-run.json \
            --similarity-artifacts-json /tmp/cosine-residual/checks/similarity-artifacts.json \
            --output /tmp/cosine-residual/dependency.json || code=$?
          if test "$code" -ne 0 && test "$code" -ne 3; then exit "$code"; fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path('/tmp/cosine-residual/dependency.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('ready='+str(value['ready']).lower()+'\n')
              if value['ready']:
                  for role in ('heads','crossed','similarity'):
                      out.write(role+'_id='+str(value['origins'][role]['artifact_id'])+'\n')
                      out.write(role+'_sha='+value['origins'][role]['artifact_sha256']+'\n')
          if not value['ready']:
              print('DEFERRED: exact completed feature origins unavailable; no model load or fit.')
          PY
      - name: Acquire exact saved outputs and original TRAIN material
        if: steps.dependency.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_ID: ${{ steps.dependency.outputs.heads_id }}
          CROSS_ID: ${{ steps.dependency.outputs.crossed_id }}
          SIMILARITY_ID: ${{ steps.dependency.outputs.similarity_id }}
          HEAD_SHA: ${{ steps.dependency.outputs.heads_sha }}
          CROSS_SHA: ${{ steps.dependency.outputs.crossed_sha }}
          SIMILARITY_SHA: ${{ steps.dependency.outputs.similarity_sha }}
        run: |
          set -euo pipefail
          gh api "repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/${HEAD_ID}/zip" > /tmp/residual-heads.zip
          gh api "repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/${CROSS_ID}/zip" > /tmp/residual-crossed.zip
          gh api "repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/${SIMILARITY_ID}/zip" > /tmp/residual-similarity.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip > /tmp/residual-original.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11872208169/zip > /tmp/residual-cancelled.zip
          printf '%s  %s\n' "$HEAD_SHA" /tmp/residual-heads.zip | sha256sum -c -
          printf '%s  %s\n' "$CROSS_SHA" /tmp/residual-crossed.zip | sha256sum -c -
          printf '%s  %s\n' "$SIMILARITY_SHA" /tmp/residual-similarity.zip | sha256sum -c -
          printf '%s  %s\n' 07b357cbb3362f4afa4dc1872ab7e28e8a46daaf338f2636fed8d40fbcee76af /tmp/residual-original.zip | sha256sum -c -
          printf '%s  %s\n' 601cd09ae82cc6915121aaf8bb0eac5c1fe7c8b370c9d4a832bc6e5d54b91bac /tmp/residual-cancelled.zip | sha256sum -c -
      - name: Encode only missing TRAIN evidence then fit fixed residual arms
        if: steps.dependency.outputs.ready == 'true'
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/cosine-residual/checks/process-resources.txt \
            /tmp/cosine-residual-env/bin/python scripts/memory_cell/shared_gate_cosine_residual_trial.py run \
            --head-archive /tmp/residual-heads.zip \
            --cross-archive /tmp/residual-crossed.zip \
            --similarity-archive /tmp/residual-similarity.zip \
            --original-archive /tmp/residual-original.zip \
            --cancelled-archive /tmp/residual-cancelled.zip \
            --dependency-json /tmp/cosine-residual/dependency.json \
            --work /tmp/cosine-residual-materials \
            --output /tmp/cosine-residual/study 2>&1 | tee /tmp/cosine-residual/checks/execution.log
      - name: Preserve outcome distinction, exact source and all costs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/cosine-residual/source/memory_cell
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/cosine-residual/study/report.json')
          report=json.loads(path.read_bytes()) if path.is_file() else None
          value={'model_execution_completed':report is not None and report.get('errors')==[],
                 'new_reader_calls':0,'semantic_accuracy':None,'production_accepted':False}
          Path('/tmp/cosine-residual/execution-disposition.json').write_text(json.dumps(value,sort_keys=True))
          print('COSINE_RESIDUAL_DISPOSITION',json.dumps(value,sort_keys=True))
          PY
          git rev-parse HEAD > /tmp/cosine-residual/source/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/cosine-residual/source/tested-tree.txt
          cp scripts/memory_cell/*.py scripts/memory_cell/requirements.txt /tmp/cosine-residual/source/memory_cell/
          cp experiments/shared_stem_cell/execution.py .github/workflows/hepta-cosine-residual-gate.yml /tmp/cosine-residual/source/
          (cd /tmp/cosine-residual && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-cosine-residual-gate-development
          path: /tmp/cosine-residual
          if-no-files-found: error
