name: Apply learning.eval API boundary hotfix

on:
  push:
    branches:
      - fix/learning-eval-full-convergence-20260926
    paths:
      - .github/workflows/learning-eval-api-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: fix/learning-eval-full-convergence-20260926

      - name: Apply exact source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          journal = Path("codex-rs/hepta-intelligence-eval/src/attempt_journal.rs")
          text = journal.read_text()
          old = "pub use anchor::ProductEvaluationAttemptAnchorStoreV1;\n"
          new = old + "pub use anchor::ProductEvaluationAttemptAnchorV1;\n"
          if text.count(old) != 1 or "pub use anchor::ProductEvaluationAttemptAnchorV1;" in text:
              raise SystemExit("unexpected attempt_journal anchor export state")
          journal.write_text(text.replace(old, new, 1))

          lib = Path("codex-rs/hepta-intelligence-eval/src/lib.rs")
          text = lib.read_text()
          replacements = {
              "pub use product_runner::ProductMetricSourceContractV1;\n": (
                  "#[cfg(feature = \"trusted-inprocess-eval\")]\n"
                  "pub use product_runner::ProductMetricSourceContractV1;\n"
                  "#[cfg(not(feature = \"trusted-inprocess-eval\"))]\n"
                  "pub(crate) use product_runner::ProductMetricSourceContractV1;\n"
              ),
              "pub use recorded_runner::RecordedProductEvaluationRunnerV1;\n": (
                  "#[cfg(feature = \"trusted-inprocess-eval\")]\n"
                  "pub use recorded_runner::RecordedProductEvaluationRunnerV1;\n"
                  "#[cfg(not(feature = \"trusted-inprocess-eval\"))]\n"
                  "pub(crate) use recorded_runner::RecordedProductEvaluationRunnerV1;\n"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected lib.rs state for {old.strip()}")
              text = text.replace(old, new, 1)
          lib.write_text(text)

          Path(".github/workflows/learning-eval-api-hotfix.yml").unlink()
          PY
          git diff --check
          grep -F 'pub use anchor::ProductEvaluationAttemptAnchorV1;' codex-rs/hepta-intelligence-eval/src/attempt_journal.rs
          grep -F 'pub(crate) use recorded_runner::RecordedProductEvaluationRunnerV1;' codex-rs/hepta-intelligence-eval/src/lib.rs
          grep -F 'pub(crate) use product_runner::ProductMetricSourceContractV1;' codex-rs/hepta-intelligence-eval/src/lib.rs

      - name: Commit and push correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-ci"
          git config user.email "hepta-ci@users.noreply.github.com"
          git add codex-rs/hepta-intelligence-eval/src/attempt_journal.rs \
            codex-rs/hepta-intelligence-eval/src/lib.rs \
            .github/workflows/learning-eval-api-hotfix.yml
          git commit -m "Fix learning.eval default API boundary exports"
          git push origin HEAD:fix/learning-eval-full-convergence-20260926
