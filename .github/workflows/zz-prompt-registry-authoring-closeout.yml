name: Prompt registry one-shot authoring closeout

on:
  push:
    branches:
      - codex/prompt-registry-full-closeout-20260929
    paths:
      - .github/workflows/zz-prompt-registry-authoring-closeout.yml

permissions:
  contents: write

concurrency:
  group: prompt-registry-one-shot-authoring
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/prompt-registry-full-closeout-20260929
          fetch-depth: 0
      - name: Bind exact authoring trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Prepare native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
      - name: Resolve checksum-verified V8 inputs
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Repair extension serialization and terminal typing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/ext/hepta-prompt/src/lib.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "use tokio::sync::Mutex;\n",
              "use tokio::sync::Mutex;\nuse tokio::sync::Semaphore;\n",
          )

          replace_once(
              """#[derive(Default)]
          struct PromptRuntimeTurnState {
              resolved: Mutex<Option<ResolvedAttachment>>,
              injected: AtomicBool,
          }
          """,
              """struct PromptRuntimeTurnState {
              resolved: Mutex<Option<ResolvedAttachment>>,
              resolve_serial: Semaphore,
              injected: AtomicBool,
          }

          impl Default for PromptRuntimeTurnState {
              fn default() -> Self {
                  Self {
                      resolved: Mutex::new(None),
                      resolve_serial: Semaphore::new(1),
                      injected: AtomicBool::new(false),
                  }
              }
          }
          """,
          )

          replace_once(
              """    async fn resolve(
              &self,
              thread_id: String,
              turn_id: String,
              model_context_window: Option<i64>,
              turn_store: &ExtensionData,
          ) -> ResolvedAttachment {
              let state = turn_store.get_or_init(PromptRuntimeTurnState::default);
              let mut resolved = state.resolved.lock().await;
              let previous = resolved.as_ref().cloned();
              if let Some(value) = previous.as_ref()
                  && !matches!(value, ResolvedAttachment::Ready(_))
              {
                  return value.clone();
              }
              let value = match self
                  .host
                  .prepare(PromptRuntimePrepareRequest {
                      thread_id,
                      turn_id,
                      model_context_window,
                  })
                  .await
              {
                  Ok(Some(attachment)) => match attachment.validate() {
                      Ok(()) => ResolvedAttachment::Ready(attachment),
                      Err(error) => ResolvedAttachment::Failed(PromptRuntimeHostError::new(
                          \"prompt_runtime_attachment_invalid\",
                          error.to_string(),
                      )),
                  },
                  Ok(None) => ResolvedAttachment::None,
                  Err(error) => ResolvedAttachment::Failed(error),
              };
              let value = match (previous, value) {
                  (Some(ResolvedAttachment::Ready(previous)), ResolvedAttachment::Ready(current))
                      if previous != current =>
                  {
                      ResolvedAttachment::Failed(PromptRuntimeHostError::new(
                          \"prompt_runtime_cached_binding_changed\",
                          \"an injected attachment changed; recompile in a fresh turn\",
                      ))
                  }
                  (Some(ResolvedAttachment::Ready(_)), ResolvedAttachment::None) => {
                      ResolvedAttachment::Failed(PromptRuntimeHostError::new(
                          \"prompt_runtime_cached_attachment_removed\",
                          \"the owner no longer exposes the injected attachment\",
                      ))
                  }
                  (_, value) => value,
              };
              *resolved = Some(value.clone());
              value
          }
          """,
              """    async fn resolve(
              &self,
              thread_id: String,
              turn_id: String,
              model_context_window: Option<i64>,
              turn_store: &ExtensionData,
          ) -> ResolvedAttachment {
              let state = turn_store.get_or_init(PromptRuntimeTurnState::default);
              let Ok(_resolve_permit) = state.resolve_serial.acquire().await else {
                  return ResolvedAttachment::Failed(PromptRuntimeHostError::new(
                      \"prompt_runtime_resolution_closed\",
                      \"prompt attachment resolver is unavailable\",
                  ));
              };
              let previous = state.resolved.lock().await.as_ref().cloned();
              if let Some(value) = previous.as_ref()
                  && !matches!(value, ResolvedAttachment::Ready(_))
              {
                  return value.clone();
              }
              let value = match self
                  .host
                  .prepare(PromptRuntimePrepareRequest {
                      thread_id,
                      turn_id,
                      model_context_window,
                  })
                  .await
              {
                  Ok(Some(attachment)) => match attachment.validate() {
                      Ok(()) => ResolvedAttachment::Ready(attachment),
                      Err(error) => ResolvedAttachment::Failed(PromptRuntimeHostError::new(
                          \"prompt_runtime_attachment_invalid\",
                          error.to_string(),
                      )),
                  },
                  Ok(None) => ResolvedAttachment::None,
                  Err(error) => ResolvedAttachment::Failed(error),
              };
              let value = match (previous, value) {
                  (Some(ResolvedAttachment::Ready(previous)), ResolvedAttachment::Ready(current))
                      if previous != current =>
                  {
                      ResolvedAttachment::Failed(PromptRuntimeHostError::new(
                          \"prompt_runtime_cached_binding_changed\",
                          \"an injected attachment changed; recompile in a fresh turn\",
                      ))
                  }
                  (Some(ResolvedAttachment::Ready(_)), ResolvedAttachment::None) => {
                      ResolvedAttachment::Failed(PromptRuntimeHostError::new(
                          \"prompt_runtime_cached_attachment_removed\",
                          \"the owner no longer exposes the injected attachment\",
                      ))
                  }
                  (_, value) => value,
              };
              *state.resolved.lock().await = Some(value.clone());
              value
          }
          """,
          )

          replace_once(
              """struct PromptRuntimeAttemptLease {
              host: PromptRuntimeHost,
              attachment: PromptRuntimeAttachmentV1,
              thread_id: String,
              turn_id: String,
              attempt_id: String,
              request_binding_id: String,
              provider_request_digest: Digest32,
              dispatch_unix_ms: u64,
          }
          """,
              """struct PromptRuntimeAttemptLease {
              host: PromptRuntimeHost,
              attachment: PromptRuntimeAttachmentV1,
              thread_id: String,
              turn_id: String,
              attempt_id: String,
              request_binding_id: String,
              provider_request_digest: Digest32,
              dispatch_unix_ms: u64,
          }

          struct PromptRuntimeTerminalResolution {
              outcome: PromptRuntimeTerminalOutcomeV1,
              terminal_reason_code: Option<String>,
              end_turn: Option<bool>,
              delivery_observation: Option<PromptDeliveryObservationV1>,
          }
          """,
          )

          replace_once(
              """            let (outcome, terminal_reason_code, end_turn, delivery_observation) =
                  self.map_terminal(terminal).map_err(runtime_policy_error)?;
              let record = PromptRuntimeTerminalRecordV1 {
                  compilation_id: self.attachment.compilation_id.clone(),
                  context_attachment_digest: self.attachment.context_attachment_digest,
                  context_payload_digest: self.attachment.context_payload_digest,
                  source_binding_digest: self.attachment.source_binding_digest,
                  thread_id: self.thread_id,
                  turn_id: self.turn_id,
                  attempt_id: self.attempt_id,
                  request_binding_id: self.request_binding_id,
                  provider_request_digest: self.provider_request_digest,
                  outcome,
                  end_turn,
                  terminal_reason_code,
                  delivery_observation,
                  observed_unix_ms,
              };
          """,
              """            let resolution = self.map_terminal(terminal).map_err(runtime_policy_error)?;
              let record = PromptRuntimeTerminalRecordV1 {
                  compilation_id: self.attachment.compilation_id.clone(),
                  context_attachment_digest: self.attachment.context_attachment_digest,
                  context_payload_digest: self.attachment.context_payload_digest,
                  source_binding_digest: self.attachment.source_binding_digest,
                  thread_id: self.thread_id,
                  turn_id: self.turn_id,
                  attempt_id: self.attempt_id,
                  request_binding_id: self.request_binding_id,
                  provider_request_digest: self.provider_request_digest,
                  outcome: resolution.outcome,
                  end_turn: resolution.end_turn,
                  terminal_reason_code: resolution.terminal_reason_code,
                  delivery_observation: resolution.delivery_observation,
                  observed_unix_ms,
              };
          """,
          )

          replace_once(
              """    fn map_terminal(
              &self,
              terminal: ModelProviderTerminal,
          ) -> Result<
              (
                  PromptRuntimeTerminalOutcomeV1,
                  Option<String>,
                  Option<bool>,
                  Option<PromptDeliveryObservationV1>,
              ),
              PromptRuntimeError,
          > {
              match terminal {
                  ModelProviderTerminal::Completed { end_turn, .. } => {
                      let observation = self.delivery_observation(true, None)?;
                      Ok((
                          PromptRuntimeTerminalOutcomeV1::Delivered,
                          None,
                          end_turn,
                          Some(observation),
                      ))
                  }
                  ModelProviderTerminal::Rejected { reason_code } => {
                      let rejection_reason = rejection_reason(&reason_code)?;
                      let observation = self.delivery_observation(false, Some(rejection_reason))?;
                      Ok((
                          PromptRuntimeTerminalOutcomeV1::Rejected,
                          Some(reason_code),
                          None,
                          Some(observation),
                      ))
                  }
                  ModelProviderTerminal::NotDispatched { reason_code } => Ok((
                      PromptRuntimeTerminalOutcomeV1::NotDispatched,
                      Some(reason_code),
                      None,
                      None,
                  )),
                  ModelProviderTerminal::Indeterminate { reason_code, .. } => Ok((
                      PromptRuntimeTerminalOutcomeV1::Indeterminate,
                      Some(reason_code),
                      None,
                      None,
                  )),
                  ModelProviderTerminal::CompletedUnary { .. } => Ok((
                      PromptRuntimeTerminalOutcomeV1::Indeterminate,
                      Some(\"unexpected_unary_terminal_for_turn\".to_owned()),
                      None,
                      None,
                  )),
              }
          }
          """,
              """    fn map_terminal(
              &self,
              terminal: ModelProviderTerminal,
          ) -> Result<PromptRuntimeTerminalResolution, PromptRuntimeError> {
              match terminal {
                  ModelProviderTerminal::Completed { end_turn, .. } => {
                      let observation = self.delivery_observation(true, None)?;
                      Ok(PromptRuntimeTerminalResolution {
                          outcome: PromptRuntimeTerminalOutcomeV1::Delivered,
                          terminal_reason_code: None,
                          end_turn,
                          delivery_observation: Some(observation),
                      })
                  }
                  ModelProviderTerminal::Rejected { reason_code } => {
                      let rejection_reason = rejection_reason(&reason_code)?;
                      let observation = self.delivery_observation(false, Some(rejection_reason))?;
                      Ok(PromptRuntimeTerminalResolution {
                          outcome: PromptRuntimeTerminalOutcomeV1::Rejected,
                          terminal_reason_code: Some(reason_code),
                          end_turn: None,
                          delivery_observation: Some(observation),
                      })
                  }
                  ModelProviderTerminal::NotDispatched { reason_code } => {
                      Ok(PromptRuntimeTerminalResolution {
                          outcome: PromptRuntimeTerminalOutcomeV1::NotDispatched,
                          terminal_reason_code: Some(reason_code),
                          end_turn: None,
                          delivery_observation: None,
                      })
                  }
                  ModelProviderTerminal::Indeterminate { reason_code, .. } => {
                      Ok(PromptRuntimeTerminalResolution {
                          outcome: PromptRuntimeTerminalOutcomeV1::Indeterminate,
                          terminal_reason_code: Some(reason_code),
                          end_turn: None,
                          delivery_observation: None,
                      })
                  }
                  ModelProviderTerminal::CompletedUnary { .. } => {
                      Ok(PromptRuntimeTerminalResolution {
                          outcome: PromptRuntimeTerminalOutcomeV1::Indeterminate,
                          terminal_reason_code: Some(
                              \"unexpected_unary_terminal_for_turn\".to_owned(),
                          ),
                          end_turn: None,
                          delivery_observation: None,
                      })
                  }
              }
          }
          """,
          )

          path.write_text(text)
          PY
      - name: Format fixed candidate
        working-directory: codex-rs
        run: >-
          cargo fmt
          -p codex-hepta-prompt-registry
          -p codex-hepta-prompt-optimizer
          -p codex-hepta-agentd
          -p codex-hepta-intelligence
          -p codex-hepta-prompt-extension
      - name: Verify formatting
        working-directory: codex-rs
        run: >-
          cargo fmt
          -p codex-hepta-prompt-registry
          -p codex-hepta-prompt-optimizer
          -p codex-hepta-agentd
          -p codex-hepta-intelligence
          -p codex-hepta-prompt-extension
          -- --check
      - name: Verify prompt extension
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-prompt-extension -- --test-threads=1
      - name: Verify Agentd prompt path
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-agentd prompt_ -- --nocapture --test-threads=1
      - name: Verify strict product lint
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-prompt-optimizer
          -p codex-hepta-agentd
          -p codex-hepta-intelligence
          -p codex-hepta-prompt-extension
          --all-targets --no-deps -- -D warnings
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add codex-rs
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(prompt.registry): close exact qualification blockers'
          git push origin HEAD:codex/prompt-registry-full-closeout-20260929
