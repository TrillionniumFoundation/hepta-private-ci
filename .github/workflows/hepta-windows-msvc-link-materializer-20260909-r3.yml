name: Hepta Windows MSVC rules_rust materializer 20260909 r3

on:
  push:
    branches:
      - ops/hepta-windows-msvc-link-materializer-20260909-r3

permissions:
  contents: write

concurrency:
  group: hepta-windows-msvc-link-materializer-20260909-r3
  cancel-in-progress: false

jobs:
  qualify-and-amend:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve bounded materializer and bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          expected_head=05981ed1adfb931a87a47b0606f1cedaa69f123b
          expected_parent=04f60466394a024c218ce66b1b32d1c42c462985
          materializer="$(cygpath -u "${RUNNER_TEMP}")/hepta_windows_msvc_link_materialize_20260909_r3.py"
          cp .github/scripts/hepta_windows_msvc_link_materialize_20260909_r3.py "${materializer}"
          printf 'MATERIALIZER=%s\n' "${materializer}" >> "${GITHUB_ENV}"
          printf 'CANDIDATE_HEAD=%s\n' "${expected_head}" >> "${GITHUB_ENV}"

          git fetch --no-tags origin \
            +refs/heads/codex/hepta-all-gap-closure-20260908:refs/remotes/origin/hepta-exact-candidate
          test "$(git rev-parse refs/remotes/origin/hepta-exact-candidate)" = "${expected_head}"
          git checkout --detach "${expected_head}"
          git config core.autocrlf false
          git reset --hard "${expected_head}"
          git clean -ffdx
          test "$(git rev-parse HEAD^)" = "${expected_parent}"
          test "$(git rev-list --count "${expected_parent}"..HEAD)" = 1
          test -z "$(git status --porcelain)"

      - name: Prepare Bazel CI from the unmodified candidate
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-windows-msvc-link-materializer-r3

      - name: Resolve fully patched rules_rust source
        shell: bash
        run: |
          set -euo pipefail
          bazel query @rules_rust//rust/settings:extra_rustc_flag >/dev/null
          source="$(OUTPUT_BASE="${BAZEL_OUTPUT_BASE}" python - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["OUTPUT_BASE"]) / "external"
          candidates = sorted(root.glob("**/rust/private/rustc.bzl"))
          matches = []
          for path in candidates:
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  continue
              if (
                  "rules_rust" in path.as_posix()
                  and "def _add_user_link_flags(ret, linker_input):" in text
                  and "def _make_link_flags_windows(make_link_flags_args, flavor_msvc, use_direct_driver):" in text
              ):
                  matches.append(path)
          if len(matches) != 1:
              print(f"expected one effective rules_rust source, found {len(matches)}", file=sys.stderr)
              for path in candidates:
                  print(path.as_posix(), file=sys.stderr)
              raise SystemExit(1)
          print(matches[0].as_posix())
          PY
          )"
          test -n "${source}"
          test -f "$(cygpath -u "${source}")"
          printf 'RULES_RUST_EFFECTIVE_SOURCE=%s\n' "${source}" >> "${GITHUB_ENV}"
          printf 'effective rules_rust source: %s\n' "${source}"

      - name: Materialize function-scoped MSVC link repair
        shell: bash
        run: |
          set -euo pipefail
          python "${MATERIALIZER}"
          python -m py_compile "${MATERIALIZER}"
          bash -n .github/scripts/run-bazel-ci.sh
          git diff --check

          workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
          check_root="$(cygpath -u "${RUNNER_TEMP}")/rules-rust-patch-check"
          rm -rf "${check_root}"
          mkdir -p "${check_root}/rust/private"
          cp "$(cygpath -u "${RULES_RUST_EFFECTIVE_SOURCE}")" \
            "${check_root}/rust/private/rustc.bzl"
          (
            cd "${check_root}"
            git init -q
            git apply --check \
              "${workspace}/patches/rules_rust_windows_msvc_user_link_flags.patch"
            git apply \
              "${workspace}/patches/rules_rust_windows_msvc_user_link_flags.patch"
            grep -F 'def _normalize_windows_msvc_direct_user_link_flag(flag):' \
              rust/private/rustc.bzl
            grep -F '_add_windows_user_link_flags(ret, linker_input, flavor_msvc, use_direct_driver)' \
              rust/private/rustc.bzl
          )

          changed="$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            .github/scripts/run-bazel-ci.sh \
            MODULE.bazel \
            patches/BUILD.bazel \
            patches/rules_rust_windows_msvc_user_link_flags.patch | sort)"
          test "${changed}" = "${expected}"

          bazel shutdown || true
          output_base="$(cygpath -u "${BAZEL_OUTPUT_BASE}")"
          rm -rf "${output_base}"
          mkdir -p "${output_base}"

      - name: Qualify representative native MSVC links
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --platforms=//:windows_x86_64_msvc \
            --skip_incompatible_explicit_targets \
            --test_tag_filters=-argument-comment-lint \
            --test_output=errors \
            --build_metadata=COMMIT_SHA=${CANDIDATE_HEAD} \
            -- \
            //codex-rs/hepta-types:all \
            //codex-rs/uds:all \
            //codex-rs/hepta-agentd:all

          ./scripts/check-module-bazel-lock.sh
          git diff --check
          observed="$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u)"
          unexpected="$(printf '%s\n' "${observed}" | grep -Ev '^(.github/scripts/run-bazel-ci.sh|MODULE.bazel|MODULE.bazel.lock|patches/BUILD.bazel|patches/rules_rust_windows_msvc_user_link_flags.patch)$' || true)"
          test -z "${unexpected}"

      - name: Atomically amend exact single-parent candidate
        shell: bash
        run: |
          set -euo pipefail
          expected_head=05981ed1adfb931a87a47b0606f1cedaa69f123b
          expected_parent=04f60466394a024c218ce66b1b32d1c42c462985
          candidate_ref=refs/heads/codex/hepta-all-gap-closure-20260908

          test "$(git rev-parse HEAD)" = "${expected_head}"
          test "$(git rev-parse HEAD^)" = "${expected_parent}"
          git diff --check
          git add \
            .github/scripts/run-bazel-ci.sh \
            MODULE.bazel \
            MODULE.bazel.lock \
            patches/BUILD.bazel \
            patches/rules_rust_windows_msvc_user_link_flags.patch
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          git config user.name hepta-gap-materializer
          git config user.email hepta-gap-materializer@users.noreply.github.com
          git commit --amend --signoff \
            -m "fix(windows): bind MSVC libraries into rules_rust links" \
            -m "Generate the user-link normalization patch from the fully patched rules_rust source, scope the call-site change to the Windows linker function, propagate trusted VsDevCmd library roots into target and exec Rustc links, and preserve the immutable single-parent candidate."

          test "$(git rev-parse HEAD^)" = "${expected_parent}"
          test "$(git rev-list --count "${expected_parent}"..HEAD)" = 1
          git push \
            --force-with-lease="${candidate_ref}:${expected_head}" \
            origin "HEAD:${candidate_ref}"
          git rev-parse HEAD HEAD^{tree}
