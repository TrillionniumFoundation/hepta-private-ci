name: Queue durable listing qualification

on:
  push:
    branches:
      - codex/hia-queue-listing-20261128-03da85
    paths:
      - codex-rs/ext/queue/**
      - .github/workflows/queue-durable-listing-qualification.yml

permissions:
  contents: read

jobs:
  qualify:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-test
      - name: Run all original and added queue tests
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --remote-download-toplevel \
            -- \
            test \
            --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings \
            --test_output=all \
            --cache_test_results=no \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            //codex-rs/ext/queue:queue-unit-tests \
            //codex-rs/ext/queue:queue-queue_service-test
      - name: Bind the exact source, binary, and complete test identities
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          expected = {"queue-queue_service-test": ["caller_abort_after_core_started_keeps_exact_authority_until_persistence","capacity_rejection_preserves_the_admitted_client_identity","completion_panic_retains_exact_authority_in_settlement_guardian","conflicting_queued_client_ids_fail_closed_before_core_submission","core_error_after_started_never_releases_ambiguous_dispatch","corrupt_rollout_blocks_queue_replay_and_preserves_the_item","duplicate_queued_client_ids_dispatch_to_core_once","editing_reordering_and_deleting_preserve_queue_identity","exact_and_legacy_bindings_for_the_same_turn_join_once","exact_reconcile_conflicting_payload_fails_before_second_admission","exact_reconcile_is_one_idempotent_queue_admission","exact_reconcile_rejects_expected_digest_drift_without_a_row","explicitly_started_rejected_queue_messages_remain_durable","externally_changed_queues_dispatch_independently_and_retry_failed_wakes","interrupted_turns_pause_queued_messages_but_failed_turns_drain_them","invalid_head_is_skipped_and_a_live_user_turn_is_accepted","invalid_local_attachments_do_not_mutate_queue","legacy_client_id_without_payload_digest_is_readable_but_cannot_join","listing_consistency::completed_turn_listing_waits_for_durable_queue_completion","local_attachments_are_snapshotted_before_enqueue_and_update","non_user_input_cannot_enter_the_user_message_queue","persisted_admission_reconciles_compressed_rollout","persisted_client_id_with_conflicting_payload_fails_closed_from_compressed_rollout","queued_input_and_unique_event_ids_round_trip","queued_text_limit_counts_characters_and_ignores_non_text_items","queued_text_limit_is_enforced_across_all_input_items","raw_queue_store_enqueue_cannot_bypass_reconcile_reservation","registered_queue_lifecycle_starts_messages_in_fifo_order","rejected_queue_messages_remain_durable_and_block_followups","reserved_to_persisted_legacy_row_deletion_emits_queue_changed","resumed_idle_dispatches_input_without_a_loaded_manager","rollout_flush_before_dispatch_db_completion_recovers_without_resubmit","same_client_id_bound_to_two_turns_is_ambiguous_and_fails_closed","starting_a_selected_item_preserves_the_remaining_queue","starting_a_selected_item_while_active_leaves_it_queued","two_queue_services_across_state_runtimes_submit_one_exact_binding"], "queue-unit-tests": ["service::tests::controlled_interrupt_can_recover_from_idle_state","service::tests::duplicate_turn_start_without_recovery_binding_fails_closed","service::tests::orphan_or_mismatched_replay_binding_fails_closed","service::tests::recovery_binding_allows_only_warning_until_matching_restart","service::tests::recovery_binding_rejects_history_and_wrong_restart_id","service::tests::replay_applied_binding_allows_same_turn_recovery_boundary"]}
          evidence = {"head": os.environ["GITHUB_SHA"], "runner_os": os.environ["RUNNER_OS"], "runner_arch": os.environ["RUNNER_ARCH"], "targets": {}, "files": {}}
          for target, names in expected.items():
              root = pathlib.Path("bazel-testlogs/codex-rs/ext/queue") / target
              log_data = (root / "test.log").read_bytes()
              log = log_data.decode("utf-8")
              cases = re.findall(r"^test ([^\r\n]+) \.\.\. (ok|FAILED|ignored)\r?$", log, re.MULTILINE)
              assert sorted(name for name, result in cases) == names, (target, cases)
              assert all(result == "ok" for name, result in cases), (target, cases)
              assert f"test result: ok. {len(names)} passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;" in log, log
              binary = pathlib.Path("bazel-bin/codex-rs/ext/queue") / (target + "-bin")
              binary_data = binary.read_bytes()
              evidence["targets"][target] = {"tests": cases, "test_log_bytes": len(log_data), "test_log_sha256": hashlib.sha256(log_data).hexdigest(), "binary": binary.as_posix(), "binary_bytes": len(binary_data), "binary_sha256": hashlib.sha256(binary_data).hexdigest()}
          for name in ["codex-rs/ext/queue/src/service.rs", "codex-rs/ext/queue/tests/queue_service.rs", "codex-rs/ext/queue/tests/queue_service/listing_consistency.rs", "codex-rs/ext/queue/BUILD.bazel", "codex-rs/Cargo.toml", "codex-rs/Cargo.lock", "MODULE.bazel", "MODULE.bazel.lock"]:
              path = pathlib.Path(name)
              data = path.read_bytes()
              assert data == subprocess.check_output(["git", "show", os.environ["GITHUB_SHA"] + ":" + name]), name
              evidence["files"][name] = {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          out = pathlib.Path("queue-native-evidence")
          out.mkdir()
          (out / "source-and-tests.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Upload native queue evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: queue-native-evidence-${{ matrix.target }}
          path: queue-native-evidence
          if-no-files-found: error
