name: Native NDU R24 exact conditional-risk elimination
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-ndu/research/native_stem_abcd/conditional_elimination/**'
      - '.github/workflows/hepta-native-ndu-conditional-r24.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Exact rational/multiprecision diagnostics
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Exact-head all widths tests, certificates, archived tensor witness and read-only audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/codex-rs/hepta-ndu/research/native_stem_abcd"
          SRC="$ROOT/conditional_elimination"
          OUT="$RUNNER_TEMP/ndu-r24"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/HEAD.txt"
          python -m pip freeze > "$OUT/ENVIRONMENT.txt"
          export PYTHONPATH="$SRC:$ROOT/centered_interval:$ROOT/width4_interval:$ROOT/localized_bounds"
          (cd "$SRC" && python -m unittest -v test_eliminate) 2>&1 | tee "$OUT/TESTS_NEW.log"
          (cd "$ROOT/centered_interval" && python -m unittest -v test_centered) 2>&1 | tee "$OUT/TESTS_PARENT_R22.log"
          (cd "$ROOT/localized_bounds" && python -m unittest -v test_r23) 2>&1 | tee "$OUT/TESTS_PARENT_R23.log"
          for N in 2 3 4; do
            python "$SRC/bnb.py" --width "$N" --out "$OUT/w$N" 2>&1 | tee "$OUT/w$N.log"
          done
          python "$SRC/audit.py" --root "$OUT" --out "$OUT/verified" 2>&1 | tee "$OUT/AUDIT.log"
          python "$SRC/witness.py" --input "$SRC/WITNESS_INPUT.csv" --out "$OUT/witness" 2>&1 | tee "$OUT/WITNESS.log"
          (cd "$SRC" && R24_EVIDENCE="$OUT" R24_WITNESS_INPUT="$SRC/WITNESS_INPUT.csv" python -O -m unittest -v test_tamper) 2>&1 | tee "$OUT/TAMPER.log"
      - name: Retain negative proofs and all CPU logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ndu-conditional-r24-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndu-r24
          retention-days: 14
          if-no-files-found: warn
