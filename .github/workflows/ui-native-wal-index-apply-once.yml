name: ui.native WAL and retirement-index source applicator

on:
  push:
    branches: [work/ui-native-qualified-integration-20260928]
    paths:
      - .ci/ui-native-wal-index/source.patch.gz
      - .github/workflows/ui-native-wal-index-apply-once.yml
  pull_request:
    branches: [work/ui-native-qualified-integration-20260928]
    paths:
      - .ci/ui-native-wal-index-trigger/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-native-wal-index-source-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TARGET_BRANCH: work/ui-native-qualified-integration-20260928
  TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  apply-test-publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - id: source
        name: Verify immutable input and apply reviewed source patch
        env:
          PATCH_BLOB_SHA: cf8d5267cbcde61455849e24be9eac9d1a8d14f3
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/ui-native-wal-index-diagnostics"
          rm -rf "$diagnostics"
          mkdir -p "$diagnostics"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          if [[ ! -f .ci/ui-native-wal-index/source.patch.gz ]]; then
            echo 'one-shot source patch already consumed'
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'apply=true' >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD:.ci/ui-native-wal-index/source.patch.gz)" = "$PATCH_BLOB_SHA"
          sha256sum .ci/ui-native-wal-index/source.patch.gz > "$diagnostics/capsule.sha256"
          gzip -dc .ci/ui-native-wal-index/source.patch.gz > /tmp/ui-native-wal-index.patch
          sha256sum /tmp/ui-native-wal-index.patch > "$diagnostics/decoded-patch.sha256"
          cp /tmp/ui-native-wal-index.patch "$diagnostics/source.patch"
          if ! git apply --check --verbose --whitespace=error-all /tmp/ui-native-wal-index.patch \
              > "$diagnostics/apply-check.stdout" \
              2> "$diagnostics/apply-check.stderr"; then
            cat "$diagnostics/apply-check.stderr" >&2
            exit 1
          fi
          git apply --index --whitespace=error-all /tmp/ui-native-wal-index.patch
          git diff --cached --check
          python3 - <<'PYTHON'
          import subprocess

          paths = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'],
              text=True,
              encoding='utf-8',
              errors='strict',
          ).splitlines()
          required = {
              'apps/hepta-native/src/journal.rs',
              'apps/hepta-native/src/journal_storage.rs',
              'apps/hepta-native/src/retirement.rs',
          }
          if not required.issubset(paths):
              raise SystemExit(f'missing required source paths: {sorted(required - set(paths))}')
          unexpected = [
              path for path in paths
              if not path.startswith('apps/hepta-native/')
              and not path.startswith('docs/modules/ui.native/')
          ]
          if unexpected:
              raise SystemExit(f'unexpected patch paths: {unexpected}')
          print('\n'.join(paths))
          PYTHON

      - name: Install pinned Rust and Linux native prerequisites
        if: steps.source.outputs.apply == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libssl-dev desktop-file-utils \
            xvfb xauth dbus-x11 gnome-keyring xdotool x11-utils \
            python3-cryptography fonts-noto-cjk
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Format and create a local immutable source commit
        if: steps.source.outputs.apply == 'true'
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          git add apps/hepta-native docs/modules/ui.native
          git rm .ci/ui-native-wal-index/source.patch.gz
          git rm .github/workflows/ui-native-wal-index-apply-once.yml
          git diff --cached --check
          python3 - <<'PYTHON'
          import subprocess

          paths = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'],
              text=True,
              encoding='utf-8',
              errors='strict',
          ).splitlines()
          if not paths:
              raise SystemExit('empty source commit')
          allowed_exact = {
              '.ci/ui-native-wal-index/source.patch.gz',
              '.github/workflows/ui-native-wal-index-apply-once.yml',
          }
          unexpected = [
              path for path in paths
              if path not in allowed_exact
              and not path.startswith('apps/hepta-native/')
              and not path.startswith('docs/modules/ui.native/')
          ]
          if unexpected:
              raise SystemExit(f'unexpected staged paths: {unexpected}')
          PYTHON
          git config user.name 'hepta-native-source-bot'
          git config user.email 'hepta-native-source-bot@users.noreply.github.com'
          git commit -m 'feat(ui.native): bound durable history lookup and journal writes' \
            -m 'Add a content-addressed retirement disk index, exact active-operation index, checksummed fsynced WAL, bounded checkpointing and recovery tests without weakening Prepared/Invoking durability or unknown-result replay fences. Remove the consumed source capsule and one-shot publisher.'

      - name: Verify exact committed source
        if: steps.source.outputs.apply == 'true'
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
          cargo +1.95.0 check --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features
          cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_hepta_ui_native*.py' -v

      - name: Publish only the verified source commit
        if: steps.source.outputs.apply == 'true'
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Retain failure diagnostics without publishing source
        if: failure()
        run: |
          set +e
          diagnostics="$RUNNER_TEMP/ui-native-wal-index-diagnostics"
          mkdir -p "$diagnostics"
          git rev-parse HEAD HEAD^{tree} > "$diagnostics/identity.txt"
          git status --short > "$diagnostics/status.txt"
          git diff --binary > "$diagnostics/working.patch"
          git diff --cached --binary > "$diagnostics/staged.patch"
          git log -1 --format=fuller > "$diagnostics/head.txt"
          sha256sum "$diagnostics"/*.patch > "$diagnostics/patches.sha256" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: ui-native-wal-index-failure-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-native-wal-index-diagnostics
          if-no-files-found: error
          retention-days: 7
