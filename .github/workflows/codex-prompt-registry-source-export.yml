name: Codex prompt registry strict V4 apply

on:
  push:
    branches:
      - codex/prompt-registry-remediation-20260927

permissions:
  contents: write

concurrency:
  group: prompt-registry-strict-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[prompt-registry-apply]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply reviewed strict V4 storage patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-prompt-registry-schema-v4.py
          git diff --check

      - name: Commit applied storage contract
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex-rs/hepta-prompt-registry/src/durable.rs \
            codex-rs/hepta-prompt-registry/src/durable_payloads.rs
          git commit -m "prompt.registry: apply strict V4 storage contract [prompt-registry-apply]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
