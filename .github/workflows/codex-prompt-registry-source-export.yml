name: Codex prompt registry remediation apply

on:
  push:
    branches:
      - codex/prompt-registry-remediation-20260927

permissions:
  contents: write

concurrency:
  group: prompt-registry-remediation-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[prompt-registry-apply]') }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact-anchor source migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-prompt-registry-v4-remediation.py
          python3 scripts/apply-prompt-runtime-closure.py
          python3 scripts/apply-prompt-publisher-factor-anchor.py
          python3 scripts/apply-prompt-publisher-closure.py
          python3 scripts/apply-prompt-publisher-lifecycle.py
          if [[ -f scripts/apply-prompt-registry-operations.py ]]; then
            python3 scripts/apply-prompt-registry-operations.py
          fi
          python3 scripts/apply-prompt-registry-schema-v4.py
          git diff --check
      - name: Commit applied source migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs docs qualification
          git commit -m "prompt.registry: apply strict V4 storage contract [prompt-registry-apply]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
