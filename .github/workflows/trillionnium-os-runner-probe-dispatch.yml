name: Trillionnium OS external runner inventory dispatcher

on:
  push:
    branches:
      - ops/trillionnium-os-runner-probe-20260906
    paths:
      - .github/workflows/trillionnium-os-runner-probe-dispatch.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: trillionnium-os-runner-probe-dispatch-20260906
  cancel-in-progress: false

jobs:
  dispatch-reviewed-probes:
    name: Dispatch existing default-branch read-only runner probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify isolated dispatcher identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/hepta-private-ci
          test "$GITHUB_REF" = refs/heads/ops/trillionnium-os-runner-probe-20260906
          test "$GITHUB_SHA" = "${{ github.sha }}"
      - name: Dispatch reviewed no-checkout probes from the default branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REF: integration/vnext-main-20260811
          REASON: trillionnium-os-promoted-main-968968046d69d000f1f9fe03683e92aa7903cf99
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows"
          body=$(printf '{"ref":"%s","inputs":{"reason":"%s"}}' "$TARGET_REF" "$REASON")
          for workflow in \
            self-hosted-desktop-availability.yml \
            self-hosted-fleet-availability.yml
          do
            response="${RUNNER_TEMP}/${workflow}.response"
            code=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$body" \
              --output "$response" \
              --write-out '%{http_code}' \
              "${api}/${workflow}/dispatches")
            test "$code" = 204
            test ! -s "$response"
            printf 'dispatched=%s ref=%s reason=%s http=%s\n' \
              "$workflow" "$TARGET_REF" "$REASON" "$code"
          done
