name: Apply memory retrieval closure patch

# One-shot source carrier. The PR workflow executes from an isolated carrier branch,
# verifies the exact current target SHA, and fast-forwards the target only after every
# repository-controlled source gate passes. It never promotes production claims.
on:
  pull_request:
    branches:
      - chatgpt/memory-retrieval-full-closure-20260929
    paths:
      - .github/workflows/memory-retrieval-apply-closure.yml
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: memory-retrieval-direct-apply-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: chatgpt/memory-retrieval-full-closure-20260929
  TARGET_SHA: ${{ github.event.pull_request.base.sha }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 150
    steps:
      - name: Check out exact unchanged target
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact target identity and patch transport
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          test -f .github/patches/memory-retrieval-phase1a.patch
          test -f .github/patches/memory-retrieval-phase1b.patch
          test -f .github/patches/memory-retrieval-phase2.patch
          git apply --check --verbose --whitespace=error-all \
            .github/patches/memory-retrieval-phase1a.patch
          git apply --check --verbose --whitespace=error-all \
            .github/patches/memory-retrieval-phase1b.patch
          git apply --check --verbose --whitespace=error-all \
            .github/patches/memory-retrieval-phase2.patch

      - name: Apply exact reviewed source closure
        shell: bash
        run: |
          set -euxo pipefail
          git apply --index --verbose --whitespace=error-all \
            .github/patches/memory-retrieval-phase1a.patch
          git apply --index --verbose --whitespace=error-all \
            .github/patches/memory-retrieval-phase1b.patch
          git apply --index --verbose --whitespace=error-all \
            .github/patches/memory-retrieval-phase2.patch
          python3 scripts/validate_memory_retrieval_closure.py \
            --stamp-observation "$TARGET_SHA" "$(git rev-parse "$TARGET_SHA^{tree}")"
          git add -A
          git diff --cached --check

      - name: Install pinned Python formatter
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.22"
          enable-cache: false

      - name: Prepare native build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev protobuf-compiler

      - name: Format and validate complete source closure
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/format.py
          git add -A
          git diff --cached --check
          python3 scripts/format.py --check
          python3 scripts/validate_memory_retrieval_closure.py

      - name: Validate locked Cargo graph
        working-directory: codex-rs
        shell: bash
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Test retrieval core and typed lifecycle
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-memory-retrieval

      - name: Test durable memory migration
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-memory

      - name: Compile Agentd product path
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-agentd --no-run

      - name: Test operations durability
        working-directory: codex-rs
        shell: bash
        run: cargo test --locked -p codex-hepta-operations

      - name: Run strict all-target Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          cargo clippy --locked --all-targets \
            -p codex-hepta-memory-retrieval \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-operations \
            -- -D warnings

      - name: Commit verified source and remove one-shot transport
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/patches/memory-retrieval-phase1a.patch
          rm .github/patches/memory-retrieval-phase1b.patch
          rm .github/patches/memory-retrieval-phase2.patch
          rm .github/workflows/memory-retrieval-apply-closure.yml
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git config user.name memory-retrieval-source-bot
          git config user.email memory-retrieval-source-bot@users.noreply.github.com
          git commit -m "fix(memory-retrieval): close exact-head source blockers"

      - name: Fast-forward only the unchanged target branch
        shell: bash
        run: |
          set -euxo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
