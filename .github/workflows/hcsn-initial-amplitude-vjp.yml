name: HCSN bounded initial-amplitude VJP
on:
  pull_request:
    paths:
      - qualification/hcsn_initial_vjp/**
      - qualification/hcsn_joint_dde/model.py
      - qualification/hcsn_joint_dde/torch_physical.py
      - qualification/hcsn_boundary_audit/refractory_transport.py
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - qualification/hcsn_graded/model.py
      - qualification/hcsn_graded/spatial.py
      - .github/workflows/hcsn-initial-amplitude-vjp.yml
permissions:
  contents: read
jobs:
  initial-amplitudes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Bind current source and retained development arrays
        run: |
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          destination = Path(os.environ['RUNNER_TEMP'])
          original = Path('qualification/hcsn_initial_vjp/evidence/NUMPY001-ORIGINALS.tar.gz')
          assert hashlib.sha256(original.read_bytes()).hexdigest() == '85e543dc770257e5470af867415d6d1f55e859fac116f37204fc0e5a6bb2348e'
          prefix = 'qualification/hcsn_initial_vjp/evidence/numpy001/'
          with tarfile.open(original) as archive:
              expected = archive.extractfile(prefix+'ARRAYS.npz').read()
              result = json.loads(archive.extractfile(prefix+'RESULT.json').read())
          assert hashlib.sha256(expected).hexdigest() == result['arrays_sha256']
          (destination/'initial-expected.npz').write_bytes(expected)
          pinned = json.loads(Path('qualification/hcsn_initial_vjp/evidence/native001/SOURCE.json').read_text())
          pinned['source_commit'] = os.environ['CANDIDATE_COMMIT']
          pinned['source_sha256'] = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in pinned['source_sha256']}
          pinned['expected_arrays_sha256'] = result['arrays_sha256']
          (destination/'initial-source.json').write_text(json.dumps(pinned,indent=2,sort_keys=True)+'\n')
          PY
      - run: python -B -m qualification.hcsn_initial_vjp.native_probe --source-manifest "$RUNNER_TEMP/initial-source.json" --expected-arrays "$RUNNER_TEMP/initial-expected.npz" --output "$RUNNER_TEMP/initial-amplitudes"
      - run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: initial-amplitude-originals
          path: |
            ${{ runner.temp }}/initial-amplitudes
            ${{ runner.temp }}/initial-source.json
          if-no-files-found: error
