name: Apply runtime supervisor Stage A+B repair

on:
  push:
    branches:
      - fix/runtime-supervisor-remediation-20260927
    paths:
      - ".github/workflows/hepta-supervisor-stage-ab-apply.yml"

permissions:
  contents: write

concurrency:
  group: runtime-supervisor-stage-b-hosted-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'hosted Stage B remediation trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact trigger
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and apply the registered Stage B transformation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          import base64
          import bz2
          import hashlib
          from pathlib import Path

          encoded = b"".join(
              Path(path).read_bytes()
              for path in (
                  ".github/runtime-supervisor-stage-b.py.bz2.b64.00",
                  ".github/runtime-supervisor-stage-b.py.bz2.b64.01",
              )
          )
          payload = bz2.decompress(base64.b64decode(encoded))
          expected = "a870d15e6629c9f417baaa902380eb893b9edb97ef438a2e6a333e4c935a2feb"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"Stage B payload digest mismatch: {actual}")
          Path(".github/runtime-supervisor-stage-b.py").write_bytes(payload)
          PY
          python3 .github/runtime-supervisor-stage-b.py
          rm .github/runtime-supervisor-stage-b.py
          git diff --check

      - name: Reject transformed paths outside runtime.supervisor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          changed = []
          for line in subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.append(path)
          unexpected = [
              path for path in changed
              if path != ".github/runtime-supervisor-stage-b.py"
              and not path.startswith("codex-rs/hepta-supervisor/")
          ]
          if unexpected:
              raise SystemExit(f"unexpected transformed paths: {unexpected}")
          if not any(path.startswith("codex-rs/hepta-supervisor/") for path in changed):
              raise SystemExit("Stage B transformation changed no supervisor source")
          PY

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Format and execute focused lineage tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-supervisor
          cargo fmt --package codex-hepta-supervisor -- --check
          cargo test --locked -p codex-hepta-supervisor --lib restart_lineage::tests
          cargo test --locked -p codex-hepta-supervisor --lib \
            main_recovery_fault_contains_owned_companion_before_returning

      - name: Execute complete default and production libraries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-supervisor --lib
          cargo test --locked -p codex-hepta-supervisor \
            --features production-authority --lib

      - name: Execute strict default and production lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-supervisor --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-supervisor --all-targets \
            --features production-authority -- -D warnings

      - name: Commit only the verified Stage B source
        shell: bash
        env:
          BRANCH: fix/runtime-supervisor-remediation-20260927
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/hepta-supervisor
          git diff --cached --quiet && { echo "no verified source changes"; exit 1; }
          git commit -m "runtime.supervisor: bind durable restart lineage"
          git push origin "HEAD:${BRANCH}"
