# Registered on the preceding commit; this second push activates the one-time repair.
name: Apply runtime supervisor Stage A repair

on:
  push:
    branches:
      - fix/runtime-supervisor-remediation-20260927
    paths:
      - ".github/runtime-supervisor-stage-a.py"
      - ".github/workflows/hepta-supervisor-stage-a-apply.yml"

permissions:
  contents: write

concurrency:
  group: runtime-supervisor-stage-a-apply
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage A remediation trigger')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact trigger
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed source transformation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 .github/runtime-supervisor-stage-a.py
          rm .github/runtime-supervisor-stage-a.py
          rm .github/workflows/hepta-supervisor-stage-a-apply.yml
          git diff --check

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Format and execute focused plus complete library tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p codex-hepta-supervisor --lib main_recovery_fault_contains_owned_companion_before_returning
          cargo test --locked -p codex-hepta-supervisor --lib
          cargo clippy --locked -p codex-hepta-supervisor --all-targets -- -D warnings

      - name: Commit only the verified repair
        shell: bash
        env:
          BRANCH: fix/runtime-supervisor-remediation-20260927
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex-rs/hepta-supervisor/src/recovery.rs \
            codex-rs/hepta-supervisor/src/matrix.rs \
            codex-rs/hepta-supervisor/src/matrix_containment_tests.rs \
            .github/runtime-supervisor-stage-a.py \
            .github/workflows/hepta-supervisor-stage-a-apply.yml
          git commit -m "runtime.supervisor: contain companion after recovery faults"
          git push origin "HEAD:${BRANCH}"
