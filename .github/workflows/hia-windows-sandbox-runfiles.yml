name: HIA Windows original sandbox runfiles targets

on:
  push:
    branches:
      - codex/hia-windows-sandbox-runfiles-20261127-2ac5
      - codex/hia-windows-sandbox-runfiles-resolved-20261127-2ac5
      - codex/hia-windows-sandbox-bundle-20261127-2ac5
    paths:
      - defs.bzl
      - workspace_root_test_launcher.bat.tpl
      - codex-rs/cli/BUILD.bazel
      - codex-rs/exec-server/BUILD.bazel
      - .github/workflows/hia-windows-sandbox-runfiles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-sandbox-runfiles:
    name: Three complete original Windows sandbox consumer targets
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test
      - name: Run every original test in all three sandbox consumer targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --platforms=//:windows_x86_64_msvc \
            --nocache_test_results \
            --test_verbose_timeout_warnings \
            --test_env=SBX_DEBUG=1 \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            //codex-rs/cli:cli-sandbox_cloud_config-test \
            //codex-rs/exec-server:exec-server-file_system_windows-test \
            //codex-rs/core:core-all-test 2>&1 | tee "$RUNNER_TEMP/windows-sandbox-runfiles.log"
          if grep -Eq 'FLAKY|test result: FAILED|Attempt #([2-9][0-9]*|1[0-9]+)' "$RUNNER_TEMP/windows-sandbox-runfiles.log"; then
            echo "::error::Original target had a failed or retried attempt."
            exit 1
          fi
          grep -Eq '^//codex-rs/cli:cli-sandbox_cloud_config-test[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-sandbox-runfiles.log"
          grep -Eq '^//codex-rs/exec-server:exec-server-file_system_windows-test[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-sandbox-runfiles.log"
          grep -Eq '^//codex-rs/core:core-all-test[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-sandbox-runfiles.log"
          echo "Three original Windows targets: PASS, retries=0, flaky=0; full matrix remains independent."
      - name: Preserve original execution evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-original-sandbox-runfiles-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bazel-execution-logs
            ${{ runner.temp }}/windows-sandbox-runfiles.log
          if-no-files-found: error
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
