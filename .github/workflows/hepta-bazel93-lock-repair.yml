name: Hepta Bazel 9.3 lock repair
on:
  push:
    branches: [repair/pon-bazel93-lock-20261009]
    paths: [.github/workflows/hepta-bazel93-lock-repair.yml]
permissions:
  contents: read
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        source: [head, main-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORIGINAL_HEAD: 7c36a1066019a8843178eebe25256b020c0feea1
      ORIGINAL_BASE: 78fdb0cf8537e3a84fc6e0a849707559c80881e8
      TESTED: ${{ matrix.source == 'head' && '7c36a1066019a8843178eebe25256b020c0feea1' || 'da4ed2f6b90085bb926554fde8ef4731bff2cf5f' }}
      USE_BAZEL_VERSION: 9.3.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TESTED }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check fixed source and actual main merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED"
          test "$(cat .bazelversion)" = "$USE_BAZEL_VERSION"
          if test "$TESTED" != "$ORIGINAL_HEAD"; then
            test "$(git show -s --format=%P HEAD)" = "$ORIGINAL_BASE $ORIGINAL_HEAD"
            test "$(git rev-parse HEAD^{tree})" = "$(git merge-tree --write-tree "$ORIGINAL_BASE" "$ORIGINAL_HEAD")"
          fi
          mkdir -p "$RUNNER_TEMP/lock-repair/original" "$RUNNER_TEMP/lock-repair/candidate"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/lock-repair/source.txt"
          cp MODULE.bazel MODULE.bazel.lock .bazelversion "$RUNNER_TEMP/lock-repair/original/"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: false
          repository-cache: false
      - name: Generate through original command and recheck strict unchanged lock
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lock-repair"
          bazel --version | tee "$out/bazel-version.txt"
          test "$(cat "$out/bazel-version.txt")" = 'bazel 9.3.0'
          bazel mod deps --lockfile_mode=update 2>&1 | tee "$out/generate.log"
          cp MODULE.bazel.lock "$out/candidate/"
          bazel mod deps --lockfile_mode=error 2>&1 | tee "$out/strict.log"
          cmp MODULE.bazel.lock "$out/candidate/MODULE.bazel.lock"
          test "$(git diff --name-only)" = 'MODULE.bazel.lock'
          git diff --exit-code -- MODULE.bazel .bazelversion codex-rs/Cargo.lock
          git diff -- MODULE.bazel.lock > "$out/lock.patch"
          sha256sum MODULE.bazel.lock > "$out/candidate.sha256"
          git hash-object MODULE.bazel.lock > "$out/candidate.blob"
          printf 'generated-and-strictly-rechecked\n' > "$out/outcome.txt"
      - name: Retain original, generated bytes and every failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lock-repair-${{ matrix.source }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lock-repair
          if-no-files-found: error
          retention-days: 30
  retain-blob:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lock-repair-*-${{ github.run_id }}
          path: candidates
      - name: Compare both results and retain only an immutable Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          roots = sorted(Path('candidates').glob('lock-repair-*'))
          assert len(roots) == 2
          expected = {
              '7c36a1066019a8843178eebe25256b020c0feea1',
              'da4ed2f6b90085bb926554fde8ef4731bff2cf5f',
          }
          assert {p.joinpath('source.txt').read_text().splitlines()[0] for p in roots} == expected
          values = []
          for root in roots:
              assert root.joinpath('outcome.txt').read_text() == 'generated-and-strictly-rechecked\n'
              assert root.joinpath('bazel-version.txt').read_text().strip() == 'bazel 9.3.0'
              path = root / 'candidate/MODULE.bazel.lock'
              assert path.is_file() and not path.is_symlink()
              assert 0 < path.stat().st_size <= 10 * 1024 * 1024
              raw = path.read_bytes()
              parsed = json.loads(raw)
              assert type(parsed.get('lockFileVersion')) is int
              assert parsed['registryFileHashes'] and parsed['moduleExtensions']
              digest = hashlib.sha256(raw).hexdigest()
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert digest == root.joinpath('candidate.sha256').read_text().split()[0]
              assert blob == root.joinpath('candidate.blob').read_text().strip()
              values.append(raw)
          assert values[0] == values[1], 'head and actual merge generated different locks'
          request = urllib.request.Request(
              'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/git/blobs',
              data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(values[0]).decode()}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == blob
          record = {'blob': blob, 'sha256': digest, 'bytes': len(values[0]), 'lockFileVersion': parsed['lockFileVersion'], 'source_heads': sorted(expected), 'branch_changed': False, 'acceptance_granted': False}
          Path('blob.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n')
          print(json.dumps(record, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lock-candidate-blob-${{ github.run_id }}
          path: blob.json
          if-no-files-found: error
          retention-days: 30
