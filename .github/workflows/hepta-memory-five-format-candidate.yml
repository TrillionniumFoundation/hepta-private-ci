name: MemoryCell five-file AST-preserving format candidate
on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - .github/workflows/hepta-memory-five-format-candidate.yml
permissions:
  contents: read
jobs:
  inspect-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Format exactly five diagnosed files and preserve their Python AST
        run: |
          set -euo pipefail
          python3 -m pip install --user uv==0.8.22
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/memorycell-five-format/candidates
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          names = [
              'locomo_handoff_upload_audit.py',
              'source_probe_exposure.py',
              'test_locomo_handoff_upload_audit.py',
              'test_source_margin_sparse_admission.py',
              'test_source_probe_exposure.py',
          ]
          files = ['scripts/memory_cell/' + name for name in names]
          for name in files:
              p = Path(name)
              if p.is_symlink() or not p.is_file() or not 0 < p.stat().st_size < 200000:
                  raise ValueError('invalid bounded source: ' + name)
          Path('/tmp/memorycell-five-format/before-ast.json').write_text(json.dumps({
              name: ast.dump(ast.parse(Path(name).read_text())) for name in files
          }, sort_keys=True))
          Path('/tmp/memorycell-five-format/files.json').write_text(json.dumps(files))
          PY
          uv run --frozen --project scripts ruff format             scripts/memory_cell/locomo_handoff_upload_audit.py             scripts/memory_cell/source_probe_exposure.py             scripts/memory_cell/test_locomo_handoff_upload_audit.py             scripts/memory_cell/test_source_margin_sparse_admission.py             scripts/memory_cell/test_source_probe_exposure.py
          python3 - <<'PY'
          import ast, json, shutil, subprocess
          from pathlib import Path
          root = Path('/tmp/memorycell-five-format')
          before = json.loads((root/'before-ast.json').read_text())
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if not changed or changed - set(before):
              raise ValueError('formatter changed files outside exact allowlist or changed nothing')
          for name, old in before.items():
              after = ast.dump(ast.parse(Path(name).read_text()))
              if after != old:
                  raise ValueError('formatter changed executable AST: ' + name)
              target = root/'candidates'/name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          (root/'changed.json').write_text(json.dumps(sorted(changed)))
          PY
          git diff --check
          git diff --binary --             scripts/memory_cell/locomo_handoff_upload_audit.py             scripts/memory_cell/source_probe_exposure.py             scripts/memory_cell/test_locomo_handoff_upload_audit.py             scripts/memory_cell/test_source_margin_sparse_admission.py             scripts/memory_cell/test_source_probe_exposure.py             > /tmp/memorycell-five-format/format.patch
          git fetch --no-tags --depth=1 origin 78fdb0cf8537e3a84fc6e0a849707559c80881e8
          just fmt --check --base 78fdb0cf8537e3a84fc6e0a849707559c80881e8             > /tmp/memorycell-five-format/repository-format.log 2>&1
          git rev-parse HEAD > /tmp/memorycell-five-format/checked-source-sha.txt
      - name: Execute source-exposure tests with pinned CPU PyTorch
        run: |
          set -euo pipefail
          python3 -m venv /tmp/memorycell-five-test
          /tmp/memorycell-five-test/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/memorycell-five-test/bin/python -m unittest -v             test_source_write_probe_exposure             test_source_write_likelihood_exposure             test_source_margin_sparse_admission             test_source_probe_exposure             test_locomo_handoff_upload_audit             2>&1 | tee /tmp/memorycell-five-format/scoped-tests.log
      - name: Preserve exact changed files and all failure evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/memorycell-five-format
          git rev-parse HEAD > /tmp/memorycell-five-format/checked-source-sha.txt
          (cd /tmp/memorycell-five-format && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memorycell-five-format-candidate
          path: /tmp/memorycell-five-format
          if-no-files-found: error
