name: Prompt registry product qualification closeout author

on:
  push:
    branches: [ops/prompt-registry-product-qualification-author-20260928]
    paths:
      - '.github/workflows/prompt-registry-product-qualification-author.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: prompt-registry-product-qualification-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      EXPECTED_TARGET: b6cdf7d069a84592c610d57f2685096bb1cf0859
      TARGET_BRANCH: codex/prompt-registry-product-qualification-closeout-20260928
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b6cdf7d069a84592c610d57f2685096bb1cf0859
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply bounded structural layout correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path

          canonical = Path('codex-rs/hepta-intelligence/src/canonical.rs')
          text = canonical.read_text(encoding='utf-8')
          replacements = [
              (
                  '    Ready(IntelligenceHostEnvelopeV1),\n',
                  '    Ready(Box<IntelligenceHostEnvelopeV1>),\n',
              ),
              (
                  '    Ok(CanonicalRunOutcomeV1::Ready(IntelligenceHostEnvelopeV1 {\n',
                  '    Ok(CanonicalRunOutcomeV1::Ready(Box::new(IntelligenceHostEnvelopeV1 {\n',
              ),
              (
                  '        authority: AuthorityPosture::DENY_ALL,\n    }))\n}\n\nfn run_stage',
                  '        authority: AuthorityPosture::DENY_ALL,\n    })))\n}\n\nfn run_stage',
              ),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, f'unexpected canonical replacement count for {old!r}'
              text = text.replace(old, new, 1)
          canonical.write_text(text, encoding='utf-8')

          runner = Path('codex-rs/hepta-agentd/src/intelligence_product_runner.rs')
          text = runner.read_text(encoding='utf-8')
          old = (
              '            CanonicalRunOutcomeV1::Ready(envelope) => {\n'
              '                let mut oracle = FileBackedFreshnessOracleV1::new(\n'
          )
          new = (
              '            CanonicalRunOutcomeV1::Ready(envelope) => {\n'
              '                let envelope = *envelope;\n'
              '                let mut oracle = FileBackedFreshnessOracleV1::new(\n'
          )
          assert text.count(old) == 1, 'unexpected Agentd ready-arm replacement count'
          runner.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format and verify the exact product surface
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-intelligence -p codex-hepta-agentd
          cargo check --locked \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-agentd \
            -p codex-hepta-intelligence \
            -p codex-hepta-prompt-extension \
            --all-targets
          cargo clippy --locked \
            -p codex-hepta-prompt-optimizer \
            -p codex-hepta-agentd \
            -p codex-hepta-intelligence \
            -p codex-hepta-prompt-extension \
            --all-targets --no-deps -- -D warnings

      - name: Commit and fast-forward the dedicated closeout branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            codex-rs/hepta-intelligence/src/canonical.rs \
            codex-rs/hepta-agentd/src/intelligence_product_runner.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'perf(intelligence): box canonical ready envelope at product boundary'
          python3 scripts/hepta-prompt-registry-map.py --check
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Dispatch independent prompt registry qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              'https://api.github.com/repos/'
              + os.environ['GITHUB_REPOSITORY']
              + '/actions/workflows/hepta-prompt-registry-qualification.yml/dispatches'
          )
          request = urllib.request.Request(
              url,
              data=json.dumps({'ref': os.environ['TARGET_BRANCH']}).encode(),
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 204
          PY
