name: channel.matrix source export

on:
  push:
    branches:
      - codex/channel-matrix-full-closure-20260927
    paths:
      - .github/workflows/channel-matrix-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/channel-matrix-source
          tar -czf /tmp/channel-matrix-source/channel-matrix-source.tgz \
            .github/workflows/channel-matrix-*.yml \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            codex-rs/rust-toolchain.toml \
            codex-rs/hepta-matrix-protocol \
            codex-rs/hepta-matrix-store \
            codex-rs/hepta-matrix-sdk \
            codex-rs/hepta-matrixd \
            codex-rs/state/src/sqlite.rs \
            docs/modules/channel.matrix \
            scripts/channel_matrix_evidence.py \
            scripts/verify_channel_matrix_candidate.py \
            scripts/tests/test_channel_matrix_evidence.py
          sha256sum /tmp/channel-matrix-source/channel-matrix-source.tgz \
            > /tmp/channel-matrix-source/channel-matrix-source.tgz.sha256
          git rev-parse HEAD > /tmp/channel-matrix-source/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: channel-matrix-source-${{ github.sha }}
          path: /tmp/channel-matrix-source
          if-no-files-found: error
          retention-days: 1
