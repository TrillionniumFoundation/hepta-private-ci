name: HPCA Routed Content Contract
on:
  pull_request:
    paths:
      - qualification/hpca_routed_content_v1/**
      - .github/workflows/hpca-routed-content-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5
      - run: python -m unittest discover -s qualification/hpca_routed_content_v1 -p 'test_*.py' -v
      - name: No native inference qualification from contract tests
        run: |
          python -m py_compile qualification/hpca_routed_content_v1/*.py
          git diff --exit-code
