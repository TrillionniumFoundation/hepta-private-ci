name: Hepta retrieval V3 source and native validation
on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
permissions:
  contents: read
concurrency:
  group: retrieval-v3-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source:
    if: contains(github.event.head_commit.message, '[retrieval-v3-materialize]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      main_sha: ${{ steps.publish.outputs.main_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply data-only allowlisted patches without running candidate code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/hepta-private-ci
          test "$GITHUB_REF" = refs/heads/work/memory-retrieval-hardening-20260927
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git config core.hooksPath /dev/null
          mkdir -p "$RUNNER_TEMP/retrieval-v3"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, zlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'retrieval-v3'
          def apply(patch, size, digest):
              if len(patch) != size or hashlib.sha256(patch).hexdigest() != digest:
                  raise SystemExit('patch byte identity mismatch')
              rows = subprocess.check_output(['git','apply','--numstat','-z','-'], input=patch)
              paths = []
              for row in rows.split(b'\0'):
                  if not row: continue
                  added, removed, path = row.decode().split('\t')
                  if not added.isdigit() or not removed.isdigit(): raise SystemExit('binary patch')
                  allowed = ('codex-rs/hepta-agentd/', 'codex-rs/hepta-memory/', 'codex-rs/hepta-learning-ledger/', 'codex-rs/hepta-infer-core/', 'codex-rs/hepta-infer-worker-host/')
                  if not path.startswith(allowed) or '..' in pathlib.PurePosixPath(path).parts or '\\' in path:
                      raise SystemExit('path outside reviewed module closure')
                  if not (path.endswith('.rs') or path == 'codex-rs/hepta-agentd/Cargo.toml'):
                      raise SystemExit('unexpected patch file kind')
                  paths.append(path)
              if any(line.startswith((b'new file mode ',b'old mode ',b'new mode ')) and line != b'new file mode 100644' for line in patch.splitlines()):
                  raise SystemExit('non-regular file or mode change')
              subprocess.run(['git','apply','--index','--check','-'], input=patch, check=True)
              subprocess.run(['git','apply','--index','-'], input=patch, check=True)
              return paths
          encoded = b''.join(pathlib.Path(f'scripts/patches/memory_retrieval_assertion_delivery_v2.part{i:02d}').read_bytes() for i in range(17))
          old = json.loads(base64.b64decode(encoded, validate=True))
          first = zlib.decompress(base64.b64decode(old['patch_zlib_base64'], validate=True))
          paths = apply(first, 40174, '62a9878fbb406ab6683669391fb81bca6a8e47cd3aa559e5f05c11c7da17e868')
          encoded = b''.join(pathlib.Path(f'scripts/patches/memory_retrieval_v3_delta.part{i}').read_bytes().strip() for i in range(2))
          second = gzip.decompress(base64.b64decode(encoded, validate=True))
          paths += apply(second, 74929, 'f8ac4f94a183aea5bdc8291f52e26a8bf73a6c4cd55a8e67a8abd964d73e41f1')
          (out/'reviewed-v2.patch').write_bytes(first)
          (out/'reviewed-v3-delta.patch').write_bytes(second)
          (out/'rust-paths.txt').write_text('\n'.join(sorted(set(p for p in paths if p.endswith('.rs'))))+'\n')
          (out/'input.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'paths':sorted(set(paths)),'native_tests_passed':False,'activation':False,'release':False})+'\n')
          PY
      - name: Format source using pinned formatter only
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          printf 'skip_children = true\n' > "$RUNNER_TEMP/retrieval-v3/rustfmt.toml"
          mapfile -t files < "$RUNNER_TEMP/retrieval-v3/rust-paths.txt"
          rustfmt +1.95.0 --edition 2024 --config-path "$RUNNER_TEMP/retrieval-v3/rustfmt.toml" "${files[@]}"
          git add -- "${files[@]}"
          git diff --cached --check
          test -z "$(git diff --name-only)"
      - name: Commit source, then observe exact source objects without executing repository scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f -- .github/workflows/hepta-memory-retrieval-assertion-delivery.yml .github/workflows/hepta-memory-retrieval-land-v3.yml
          git ls-files -z 'scripts/patches/memory_retrieval_assertion_delivery_v*' 'scripts/patches/memory_retrieval_v3_delta.part*' | xargs -0 -r git rm -f --
          git commit -m 'feat(memory.retrieval): separate durable publication, bind native consumption, and inherit request budgets'
          python3 - <<'PY'
          import json, pathlib, subprocess
          path = pathlib.Path('docs/modules/memory.retrieval/IMPLEMENTATION_MAP.json')
          mapping = json.loads(path.read_text())
          if mapping.get('module') != 'memory.retrieval': raise SystemExit('wrong module map')
          for field in ('productionImplementation','productExecutionProved','independentAcceptance','activation','release'):
              if mapping['claimBoundary'][field] is not False: raise SystemExit('cannot advance claims')
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          docs = subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD','--','docs/modules/memory.retrieval'], text=True).splitlines()
          paths = sorted(set(mapping['observedSourcePaths']) | set(docs) | {'codex-rs','scripts','.github/workflows','MODULE.bazel','MODULE.bazel.lock'})
          objects, missing = [], []
          for source in paths:
              if not source or source.startswith(('/',':')) or '..' in pathlib.PurePosixPath(source).parts or '\\' in source or '\0' in source:
                  raise SystemExit('unsafe source map input')
              if source == str(path) or str(path).startswith(source.rstrip('/')+'/'): continue
              result = subprocess.run(['git','rev-parse','--verify',f'{head}:{source}'], capture_output=True, text=True)
              if result.returncode: missing.append(source)
              else: objects.append({'path':source,'object':result.stdout.strip()})
          mapping['observedAtHead'] = {'commit':head,'tree':tree}
          mapping['observedSourcePaths'] = paths
          mapping['sourceObjects'] = objects
          mapping['observedMissingPaths'] = missing
          path.write_text(json.dumps(mapping, indent=2)+'\n')
          PY
          git add -- docs/modules/memory.retrieval/IMPLEMENTATION_MAP.json
          git commit -m 'docs(memory.retrieval): bind V3 source objects without promoting qualification'
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-v3/identity.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/retrieval-v3/source.tar.gz"
          test -z "$(git status --porcelain)"
      - name: Fast-forward only after checking current remote head
        id: publish
        env:
          WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          header=$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" ls-remote --heads origin work/memory-retrieval-hardening-20260927 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" fetch origin main
          echo "main_sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/work/memory-retrieval-hardening-20260927
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-v3-source-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-v3/
          retention-days: 30
          if-no-files-found: error
  native:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge, current-main]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact tested commit and ordered parents
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          MAIN_SHA: ${{ needs.source.outputs.main_sha }}
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retrieval-v3-native"
          case "$LANE" in
            source-head) test "$(git rev-parse HEAD)" = "$SOURCE_SHA" ;;
            current-main) git checkout --detach "$MAIN_SHA" ;;
            base-merge)
              git config user.name qualification
              git config user.email qualification@localhost
              git checkout --detach "$MAIN_SHA"
              git -c core.hooksPath=/dev/null merge --no-ff --no-edit "$SOURCE_SHA"
              test "$(git show -s --format=%P HEAD)" = "$MAIN_SHA $SOURCE_SHA"
              ;;
          esac
          git show -s --format='%H%n%T%n%P' HEAD | tee "$RUNNER_TEMP/retrieval-v3-native/tested-object.txt"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Native ledger and inference tests
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-learning-ledger -p codex-hepta-infer-core 2>&1 | tee "$RUNNER_TEMP/retrieval-v3-native/ledger-native.log"
      - name: Full retrieval product package tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_v8.py
          just test --locked -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-infer-worker-host 2>&1 | tee "$RUNNER_TEMP/retrieval-v3-native/product.log"
      - name: Strict all-target Clippy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo clippy --locked --all-targets -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-learning-ledger -p codex-hepta-infer-core -p codex-hepta-infer-worker-host -- -D warnings 2>&1 | tee "$RUNNER_TEMP/retrieval-v3-native/clippy.log"
      - name: Formatting and candidate verifier tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_hepta_memory_retrieval_*.py' -v 2>&1 | tee "$RUNNER_TEMP/retrieval-v3-native/contracts.log"
          just fmt-check 2>&1 | tee "$RUNNER_TEMP/retrieval-v3-native/format.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-v3-native-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-v3-native/
          retention-days: 30
          if-no-files-found: error
