name: HIA pinned D-Bus Ruff format diagnostic (research only)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind diagnostic commit and original parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Install the repository's pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Print formatter's exact changes and require zero drift
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff --version
          uv run --frozen --project scripts ruff format --diff scripts/tests/test_hepta_architecture_pinned_dbus.py
          uv run --frozen --project scripts ruff format --check scripts/tests/test_hepta_architecture_pinned_dbus.py
