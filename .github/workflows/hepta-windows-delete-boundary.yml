name: Hepta Windows deletion boundary diagnostics

on:
  pull_request:
    paths:
      - codex-rs/windows-sandbox-rs/**
      - codex-rs/utils/windows-private-state/**
      - .github/workflows/hepta-windows-delete-boundary.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-windows-delete-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-boundary:
    name: Native Windows deletion boundary (${{ matrix.lane }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    defaults:
      run:
        shell: bash
        working-directory: hepta
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      TESTED_SHA: ${{ matrix.lane == 'source-head' && github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
      RUSTUP_TOOLCHAIN: "1.96.0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      NO_COLOR: "1"
    steps:
      - name: Prepare diagnostic output and exact Windows checkout
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/windows-delete-boundary"
          mkdir -p "$RUNNER_TEMP/windows-delete-boundary"
          printf 'Three existing native Windows deletion-boundary regressions, four native private-state mechanism probes, five read-only owner-descriptor controls, all eight current ACL unit controls, a test-only full-restriction token candidate, and three read-only same-handle local-NTFS controls. Real remote-device rejection remains a C2b acceptance gap. AccessCheck output is diagnostic; original deletion assertions determine success. Candidate success does not admit a production sandbox. Mechanism and descriptor control success does not establish Windows private-state owner support, parent or volume admission, power-loss durability, whole-project or PoN qualification.\n' > "$RUNNER_TEMP/windows-delete-boundary/SCOPE.txt"
          git config --global core.autocrlf false
          git config --global core.longpaths true
          printf 'CARGO_TARGET_DIR=%s/windows-delete-boundary-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TESTED_SHA }}
          path: hepta
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: "1.96.0"
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Bind exact Windows source and retain native test evidence
        id: source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-delete-boundary"
          rustc -vV > "$RUNNER_TEMP/windows-delete-boundary/rustc.txt"
          cargo --version > "$RUNNER_TEMP/windows-delete-boundary/cargo.txt"
          just --version > "$RUNNER_TEMP/windows-delete-boundary/just.txt"
          cargo nextest --version > "$RUNNER_TEMP/windows-delete-boundary/nextest.txt"
          cat > "$RUNNER_TEMP/windows-delete-boundary/check.py" <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.hepta_ci_exec import git, observed_test_counts
          out = Path(os.environ["RUNNER_TEMP"]) / "windows-delete-boundary"
          def save(name, value):
              (out / name).write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          probes = {
              "private-relative-rename": ("private_state_native_probe::relative_open_and_rename_remain_bound_to_held_root", "relative_rename_complete"),
              "private-held-sharing": ("private_state_native_probe::sharing_denies_directory_replacement_and_held_input_mutation", "sharing_complete"),
              "private-no-reparse": ("private_state_native_probe::rejects_reparse_paths_hardlinks_and_non_leaf_names", "reparse_complete"),
              "private-native-flush": ("private_state_native_probe::file_and_directory_flush_results_are_distinct", "flush_complete"),
          }
          operations = {
              "private-relative-rename": {'held_root_relative_rename': True, 'renamed_source_is_absent': False},
              "private-held-sharing": {'held_directory_rename_attack': False, 'held_input_write_attack': False, 'held_input_rename_attack': False},
              "private-no-reparse": {'root_leaf_reparse': False, 'root_ancestor_reparse': False, 'held_root_child_reparse': False, 'multiple_links_rejected': False, 'invalid_leaf_rejected': False},
              "private-native-flush": {'file_FlushFileBuffers_before_rename': True, 'held_root_relative_rename': True, 'file_FlushFileBuffers_after_rename': True, 'directory_FlushFileBuffers': True, 'directory_native_normal_flush': True, 'read_only_file_flush_negative_control': False},
          }
          acl_selectors = (
              "acl::tests::complete_denies_compare_mapped_masks_and_require_every_right",
              "acl::tests::complete_denies_require_effective_recursive_scope_and_precede_allows",
              "acl::tests::complete_denies_accept_native_effective_and_inherit_only_components",
              "acl::tests::complete_denies_do_not_borrow_missing_scope_from_another_sid",
              "acl::tests::complete_denies_require_all_rights_in_each_split_scope",
              "acl::tests::complete_file_denies_need_effective_rights_but_no_inheritance",
              "acl::tests::partial_read_deny_is_repaired_before_native_file_data_access",
              "acl::tests::deny_ace_update_failure_is_an_error",
          )
          owner_selectors = (
              "security::tests::native_owner_only_readback_is_valid_for_file_and_directory",
              "security::tests::native_rejects_existing_unsafe_dacls_without_repair",
              "security::tests::native_rejects_wrong_expected_sid_and_unsafe_object_shapes",
              "security::tests::native_readback_parser_rejects_altered_forms_and_every_truncation",
              "security::tests::native_unqueryable_thread_token_never_falls_back_to_process_user",
          )
          required = ("partial-delete-deny", "broad-identity-delete", "legacy-delete-boundary", *probes, "acl-unit-controls", "private-owner-descriptor", "full-restriction-candidate", "private-local-ntfs")
          if sys.argv[1] == "tests":
              name, minimum = sys.argv[2], int(sys.argv[3])
              assert name in required, "unknown native test receipt"
              code, log_code = map(int, sys.argv[4].split())
              raw = (out / (name + ".log")).read_bytes()
              text = raw.decode("utf-8", errors="replace")
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              passed, failed = observed_test_counts(text)
              ok = code == log_code == 0 and passed >= minimum and failed == 0 and re.search(r"Summary[^\n]*?\d+ tests? run:", text) is not None
              proof = {}
              if name in probes:
                  selector, stage = probes[name]
                  records, malformed = [], False
                  for payload in re.findall(r"^HEPTA_PRIVATE_STATE_NATIVE_PROBE (.+)$", text, re.MULTILINE):
                      try:
                          records.append(json.loads(payload))
                      except ValueError:
                          malformed = True
                  scopes = bool(records) and all(isinstance(row, dict) and row.get("owner_supported") is False and row.get("power_loss_qualified") is False for row in records)
                  completed = scopes and any(row.get("stage") == stage for row in records)
                  observed = {stage: bool(scopes and any(row.get("stage") == stage and isinstance(row.get("result"), dict) and row["result"].get("ok") is expected for row in records)) for stage, expected in operations[name].items()}
                  named = re.search(r"^test " + re.escape(selector) + r" \.\.\. ok\s*$", text, re.MULTILINE) is not None
                  runs = re.findall(r"Summary[^\n]*?(\d+) tests? run:", text)
                  ok = ok and minimum == passed == 1 and runs[-1:] == ["1"] and named and completed and all(observed.values()) and not malformed
                  proof = {"test_selector": selector, "completion_stage": stage, "exact_test_name_observed": named, "completion_observed": bool(completed), "required_operation_results_observed": observed, "probe_record_count": len(records), "malformed_probe_record": malformed, "owner_supported": False, "power_loss_qualified": False}
              elif name == "acl-unit-controls":
                  observed = {selector: re.search(r"^test " + re.escape(selector) + r" \.\.\. ok\s*$", text, re.MULTILINE) is not None for selector in acl_selectors}
                  ok = ok and minimum == len(acl_selectors) and all(observed.values())
                  proof = {"test_filter": "test(/^acl::tests::/)", "required_test_names_observed": observed}
              elif name == "private-owner-descriptor":
                  observed = {selector: re.search(r"^test " + re.escape(selector) + r" \.\.\. ok\s*$", text, re.MULTILINE) is not None for selector in owner_selectors}
                  runs = re.findall(r"Summary[^\n]*?(\d+) tests? run:", text)
                  ok = ok and minimum == passed == len(owner_selectors) and runs[-1:] == [str(len(owner_selectors))] and all(observed.values())
                  proof = {"test_package": "codex-utils-windows-private-state", "required_test_names_observed": observed, "owner_supported": False, "power_loss_qualified": False}
              elif name == "private-local-ntfs":
                  selectors = (
                      "native_local_ntfs_file_and_directory_report_same_volume",
                      "native_nondisk_handle_is_rejected",
                      "native_volume_observation_stays_bound_to_renamed_held_object",
                  )
                  observed = {selector: re.search(r"^test " + re.escape(selector) + r" \.\.\. ok\s*$", text, re.MULTILINE) is not None for selector in selectors}
                  runs = re.findall(r"Summary[^\n]*?(\d+) tests? run:", text)
                  records, malformed = [], False
                  for payload in re.findall(r"^HEPTA_LOCAL_NTFS_OBSERVATION (.+)$", text, re.MULTILINE):
                      try:
                          records.append(json.loads(payload))
                      except ValueError:
                          malformed = True
                  expected_stages = {"local_ntfs_complete", "nondisk_complete", "held_binding_complete"}
                  scopes = all(isinstance(row, dict) and set(row) == {"stage", "owner_supported", "trusted_parent", "power_loss_qualified"} and row.get("owner_supported") is False and row.get("trusted_parent") is False and row.get("power_loss_qualified") is False and isinstance(row.get("stage"), str) for row in records)
                  completed = len(records) == 3 and scopes and {row["stage"] for row in records} == expected_stages
                  ok = ok and minimum == passed == 3 and runs == ["3"] and all(observed.values()) and completed and not malformed
                  proof = {"test_target": "native_volume", "required_test_names_observed": observed, "completion_observed": completed, "owner_supported": False, "trusted_parent": False, "power_loss_qualified": False, "remote_device_native_executed": False}
              elif name == "full-restriction-candidate":
                  selector = "token::tests::full_restriction::native_full_restriction_preserves_reads_and_refuses_parent_delete"
                  named = re.search(r"^test " + re.escape(selector) + r" \.\.\. ok\s*$", text, re.MULTILINE) is not None
                  runs = re.findall(r"Summary[^\n]*?(\d+) tests? run:", text)
                  records, malformed = [], False
                  for payload in re.findall(r"^HEPTA_FULL_RESTRICTION_CANDIDATE (.+)$", text, re.MULTILINE):
                      try:
                          records.append(json.loads(payload))
                      except ValueError:
                          malformed = True
                  record = records[0] if len(records) == 1 and isinstance(records[0], dict) else {}
                  completed = len(records) == 1 and set(record) == {"stage", "readonly_controls", "explicit_read_execute", "production_admitted"} and record.get("stage") == "original_operations_complete" and record.get("readonly_controls") is True and record.get("explicit_read_execute") is True and record.get("production_admitted") is False
                  ok = ok and minimum == passed == 1 and runs[-1:] == ["1"] and named and completed and not malformed
                  proof = {"test_selector": selector, "exact_test_name_observed": named, "candidate_completion_observed": completed, "production_admitted": False}
              save(name + ".json", {"returncode": code, "logging_returncode": log_code, "minimum_tests": minimum, "observed_passed_tests": passed, "observed_failed_tests": failed, "log_sha256": hashlib.sha256(raw).hexdigest(), "status": "passed" if ok else "failed", **proof})
              sys.exit(0 if ok else 1)
          phase = sys.argv[2]
          result = {"scope": "three native Windows deletion regressions, four private-state mechanism probes, five read-only descriptor controls, eight current ACL controls, one test-only full-restriction candidate and three read-only local-NTFS controls; real remote-device rejection is untested; no Windows owner support, production sandbox admission or power-loss qualification", "production_sandbox_admitted": False, "windows_private_state_owners_supported": False, "power_loss_qualified": False, "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "status": "running"}
          save("result.json", result)
          assert sys.argv[1] == "source" and phase in {"before", "after"}
          if phase == "before":
              for name in required:
                  (out / (name + ".json")).unlink(missing_ok=True)
          assert os.name == "nt", "this evidence requires native Windows execution"
          assert "host: x86_64-pc-windows-msvc" in (out / "rustc.txt").read_text().splitlines()
          assert "release: 1.96.0" in (out / "rustc.txt").read_text().splitlines()
          assert re.fullmatch(r"just 1\.51\.0\s*", (out / "just.txt").read_text())
          assert re.match(r"cargo-nextest 0\.9\.103(?:\s|$)", (out / "nextest.txt").read_text())
          source, tested, base, lane = (os.environ[key] for key in ("SOURCE_SHA", "TESTED_SHA", "BASE_SHA", "HEPTA_CI_LANE"))
          assert all(re.fullmatch(r"[0-9a-f]{40}", value) for value in (source, tested, base))
          head, tree, parents = git("rev-parse", "HEAD"), git("rev-parse", "HEAD^{tree}"), git("show", "-s", "--format=%P", "HEAD").split()
          assert head == tested
          assert git("cat-file", "-t", source) == "commit"
          assert git("cat-file", "-t", base) == "commit"
          if lane == "source-head":
              assert tested == source
          else:
              assert lane == "base-merge" and parents == [base, source]
              assert tree == git("merge-tree", "--write-tree", base, source)
          assert not git("diff", "--cached", "--raw", "--no-ext-diff", "--no-textconv", "HEAD", "--")
          assert not git("ls-files", "--others", "--exclude-standard", "-z")
          assert not any(row and (row[0] == "S" or row[0].islower()) for row in git("ls-files", "-v", "-z").split("\0"))
          manifest, placeholders = [], 0
          for row in git("ls-tree", "--full-tree", "-r", "-z", "HEAD").split("\0"):
              if not row:
                  continue
              metadata, relative = row.split("\t", 1)
              mode, kind, expected = metadata.split()
              assert kind == "blob" and mode in {"100644", "100755", "120000"}
              path = Path(relative)
              if path.is_symlink():
                  assert mode == "120000"
                  data = os.fsencode(os.readlink(path))
              else:
                  assert path.is_file()
                  data = path.read_bytes()
                  placeholders += int(mode == "120000")
              # NTFS does not represent Git executable bits; bind tree modes and
              # exact blob bytes, including Git's Windows symlink placeholders.
              assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data, usedforsecurity=False).hexdigest() == expected, relative
              manifest.append([relative, mode, hashlib.sha256(data).hexdigest()])
          snapshot = {"source_sha": source, "base_sha": base, "tested_sha": head, "tree": tree, "parents": parents, "lane": lane, "tracked_files": len(manifest), "tracked_bytes_sha256": hashlib.sha256(json.dumps(manifest, separators=(",", ":")).encode()).hexdigest(), "symlink_placeholders": placeholders}
          save("source-" + phase + ".json", snapshot)
          result["source"] = snapshot
          if phase == "after":
              assert snapshot == json.loads((out / "source-before.json").read_text())
              result["tests"] = {name: json.loads((out / (name + ".json")).read_text()) for name in required}
              result["status"] = "passed" if all(value["status"] == "passed" for value in result["tests"].values()) else "failed"
          save("result.json", result)
          assert result["status"] != "failed"
          PY
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" source before
      - name: Run all five read-only native owner-descriptor controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-utils-windows-private-state --lib --test-threads 1 --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/private-owner-descriptor.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests private-owner-descriptor 5 "$codes"
      - name: Run three read-only same-handle native local-NTFS controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-utils-windows-private-state --test native_volume --test-threads 1 --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/private-local-ntfs.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests private-local-ntfs 3 "$codes"
      - name: Run test-only full-restriction token candidate with original destructive controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(=token::tests::full_restriction::native_full_restriction_preserves_reads_and_refuses_parent_delete)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/full-restriction-candidate.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests full-restriction-candidate 1 "$codes"
      - name: Run original partial delete-deny repair regression
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(=token::tests::partial_delete_deny_is_repaired_before_native_workspace_writes)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/partial-delete-deny.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests partial-delete-deny 1 "$codes"
      - name: Run original broad-identity deletion regression
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(=token::tests::workspace_capabilities_deny_writes_and_deletes_under_broad_identity_aces)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/broad-identity-delete.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests broad-identity-delete 1 "$codes"
      - name: Run original restricted-process deletion boundary
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(=unified_exec::tests::legacy_workspace_write_delete_is_limited_to_writable_roots)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/legacy-delete-boundary.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests legacy-delete-boundary 1 "$codes"
      - name: Probe held-root relative open and rename
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(=private_state_native_probe::relative_open_and_rename_remain_bound_to_held_root)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/private-relative-rename.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests private-relative-rename 1 "$codes"
      - name: Probe held-root and input sharing boundaries
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(=private_state_native_probe::sharing_denies_directory_replacement_and_held_input_mutation)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/private-held-sharing.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests private-held-sharing 1 "$codes"
      - name: Probe native reparse and hardlink rejection
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(=private_state_native_probe::rejects_reparse_paths_hardlinks_and_non_leaf_names)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/private-no-reparse.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests private-no-reparse 1 "$codes"
      - name: Probe separate native file and directory flushes
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(=private_state_native_probe::file_and_directory_flush_results_are_distinct)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/private-native-flush.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests private-native-flush 1 "$codes"
      - name: Run all current native ACL unit controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          just test --locked -p codex-windows-sandbox --lib -E 'test(/^acl::tests::/)' --no-capture 2>&1 | tee "$RUNNER_TEMP/windows-delete-boundary/acl-unit-controls.log"
          codes="${PIPESTATUS[*]}"
          set -e
          python "$RUNNER_TEMP/windows-delete-boundary/check.py" tests acl-unit-controls 8 "$codes"
      - name: Require unchanged source and all eleven completed Windows result receipts
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: python "$RUNNER_TEMP/windows-delete-boundary/check.py" source after
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-windows-delete-boundary-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-delete-boundary/
          if-no-files-found: error
          retention-days: 14
