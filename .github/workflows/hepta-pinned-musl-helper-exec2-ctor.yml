name: Hepta pinned original Exec 2 with same-ABI helper
permissions:
  contents: read
  actions: read
concurrency:
  group: hepta-pinned-musl-helper-exec2-ctor-20261104
  cancel-in-progress: false
jobs:
  exec-controls:
    name: Original Exec 2 (${{ matrix.source }}, ${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source:
        - head
        - prospective-merge
        platform:
        - gnu
        - musl
    env:
      EXPECTED_HEAD: a6d8ce20bf8f5b6991d2dc5ef7313812944db060
      EXPECTED_BASE: 3a81000aae08c658276958d678874aca4db5eedd
      EXPECTED_MERGE: 3795641fafad34e3a3735bb74c2f1d2377b0b1f6
      EXPECTED_TREE: 1da8b039da9ccf72b2290af6af74dc6315a819b3
      SOURCE_KIND: ${{ matrix.source }}
      BAZEL_PLATFORM: ${{ matrix.platform == 'gnu' && '//:local_linux' || '@rules_rs//rs/platforms:x86_64-unknown-linux-musl'
        }}
      # Preserve the original runner selector group; only the two Exec invocations below are scheduled.
      NORMAL_GROUP: remaining29
    steps:
    - name: Fetch the exact harness and its bounded ancestry
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        fetch-depth: 32
        persist-credentials: false
    - name: Check out the exact tested source with bounded history
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ matrix.source == 'head' && env.EXPECTED_HEAD || env.EXPECTED_MERGE }}
        fetch-depth: 32
        persist-credentials: false
    - name: Bind the harness and the exact tested source before execution
      id: source
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/normal-bazel"
        python3 - <<'PYSOURCE'
        import hashlib, json, os, re, subprocess
        from pathlib import Path
        def git(*args):
            return subprocess.check_output(['git', '--no-replace-objects', *args]).decode().strip()
        for key in ['EXPECTED_HEAD', 'EXPECTED_BASE', 'EXPECTED_MERGE', 'EXPECTED_TREE']:
            assert re.fullmatch(r'[0-9a-f]{40}', os.environ[key]), 'bind every immutable source identity before publication'
        tested = git('rev-parse', 'HEAD')
        expected = os.environ['EXPECTED_HEAD'] if os.environ['SOURCE_KIND'] == 'head' else os.environ['EXPECTED_MERGE']
        assert tested == expected
        assert git('rev-parse', 'HEAD^{tree}') == os.environ['EXPECTED_TREE']
        if os.environ['SOURCE_KIND'] == 'prospective-merge':
            assert git('show', '-s', '--format=%P', 'HEAD').split() == [os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD']]
            assert git('merge-tree', '--write-tree', os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD']) == os.environ['EXPECTED_TREE']
        harness = os.environ['GITHUB_SHA']
        required_objects = {'harness': harness, 'candidate': os.environ['EXPECTED_HEAD'],
            'base': os.environ['EXPECTED_BASE'], 'tested': tested,
            'dependency_declaration': 'dc69725d957c79d8737eb5fbedfe6f213252317a'}
        for label, revision in required_objects.items():
            assert git('cat-file', '-t', revision) == 'commit', 'bounded checkout omitted required object: ' + label
        merge_base = git('merge-base', os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD'])
        assert merge_base == os.environ['EXPECTED_BASE'], 'expected base must remain the common ancestor in each bounded checkout'
        workflow = '.github/workflows/hepta-pinned-musl-helper-exec2-ctor.yml'
        assert os.environ['GITHUB_EVENT_NAME'] == 'push'
        assert os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'this harness admits only its first push attempt'
        assert os.environ['GITHUB_REF'] == 'refs/heads/test/hepta-musl-helper-exec2-ctor-20261104'
        assert os.environ['GITHUB_REPOSITORY'] == 'TrillionniumFoundation/hepta-private-ci'
        assert git('show', '-s', '--format=%P', harness) == os.environ['EXPECTED_HEAD']
        assert git('diff-tree', '--no-commit-id', '--name-status', '-r', harness) == 'A\t' + workflow
        source = subprocess.check_output(['git', 'show', harness + ':' + workflow])
        assert git('status', '--porcelain', '--untracked-files=normal') == ''
        subprocess.run(['git', 'diff', '--exit-code', 'dc69725d957c79d8737eb5fbedfe6f213252317a', tested,
            '--', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion'], check=True)
        record = {'schema': 'hepta-scoped-musl-helper-exec2-bazel-v1', 'tested_commit': tested,
            'tested_tree': os.environ['EXPECTED_TREE'], 'source_kind': os.environ['SOURCE_KIND'],
            'candidate': os.environ['EXPECTED_HEAD'], 'base': os.environ['EXPECTED_BASE'],
            'prospective_merge': os.environ['EXPECTED_MERGE'], 'harness_commit': harness,
            'workflow_sha256': hashlib.sha256(source).hexdigest(), 'bazel_platform': os.environ['BAZEL_PLATFORM'],
            'checkout_fetch_depth': 32, 'required_git_objects': required_objects,
            'observed_merge_base': merge_base, 'is_shallow_repository': git('rev-parse', '--is-shallow-repository'),
            'normal_group': os.environ['NORMAL_GROUP'],
            'selected_native_cases': ['exec_discovery', 'exec_fs'],
            'scope': 'Only original Exec discovery 1 and Exec filesystem 1; metadata pre/post; no replay of the 132 completed native entries'}
        (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/source-before.json').write_text(json.dumps(record, indent=2) + '\n')
        print(json.dumps(record))
        PYSOURCE
    - name: Prepare the existing Bazel toolchain and repository cache
      id: prepare
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ matrix.platform == 'gnu' && 'x86_64-unknown-linux-gnu' || 'x86_64-unknown-linux-musl' }}
        cache-scope: bazel-test
    - name: Import the already verified fixed dependency artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: '13245890316'
        run-id: '41664243615'
        repository: TrillionniumFoundation/hepta-private-ci
        github-token: ${{ github.token }}
        merge-multiple: true
        digest-mismatch: error
        path: ${{ runner.temp }}/normal-bazel-distdir
    - name: Recheck the fixed metadata and complete dependency bytes
      id: dependency
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYDEPENDENCY'
        import base64, hashlib, json, os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'
        assert sorted(path.name for path in root.iterdir()) == ['source.json', 'transfer.json', 'v5.1.0.tar.gz']
        metadata = (root / 'source.json').read_bytes()
        assert hashlib.sha256(metadata).hexdigest() == '7d88fc6db323947a11d1638fe95185e9c733c337a1d1e7b50cdcf487e29ce56e'
        source = json.loads(metadata)
        assert 'https://github.com/aws/aws-lc/archive/refs/tags/v5.1.0.tar.gz' in [source.get('url')] + source.get('urls', [])
        expected = 'a6bf6adfc5f9bba559d28554b7d3581b15f2813f03bc9f2ae19f0d915e97dadf'
        assert source['integrity'].startswith('sha256-')
        assert base64.b64decode(source['integrity'][7:], validate=True).hex() == expected
        archive = root / 'v5.1.0.tar.gz'
        assert archive.stat().st_size == 145542555
        with archive.open('rb') as stream:
            actual = hashlib.file_digest(stream, 'sha256').hexdigest()
        assert actual == expected
        transfer = json.loads((root / 'transfer.json').read_text())
        assert transfer['workflow_commit'] == '4a78bf9314197ef5a8ea97f67134fdac6795589f'
        assert transfer['workflow_run_id'] == '41664243615'
        assert transfer['declaration_source_commit'] == 'dc69725d957c79d8737eb5fbedfe6f213252317a'
        assert transfer['verified'] is True and transfer['source_sha256'] == expected and transfer['source_bytes'] == 145542555
        report = {'artifact_id': 13245890316, 'sha256': actual, 'bytes': archive.stat().st_size,
            'fixed_metadata_sha256': hashlib.sha256(metadata).hexdigest(), 'verified': True}
        (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/dependency-import.json').write_text(json.dumps(report, indent=2) + '\n')
        print(json.dumps(report))
        PYDEPENDENCY
        test "$(cat .bazelversion)" = '9.3.0'
        bazel --version | tee "$RUNNER_TEMP/normal-bazel/bazel-version.txt"
        test "$(cat "$RUNNER_TEMP/normal-bazel/bazel-version.txt")" = 'bazel 9.3.0'
    - name: Write the scoped native runner outside the tested source
      id: runner
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/normal-bazel/run-target.py" <<'PYCONTROL'
        import hashlib, json, os, re, shutil, subprocess, sys, urllib.parse
        from pathlib import Path
        def check_bep_completion(events, target, result_id, result, verdict):
            summary_events = [row for row in events if row.get('id', {}).get('testSummary', {}).get('label') == target]
            verdict['bazel_test_summaries'] = summary_events
            assert len(summary_events) == 1, 'expected one overall test summary for the exact target'
            summary_id = summary_events[0]['id']['testSummary']
            summary = summary_events[0]['testSummary']
            assert summary_id.get('configuration') == result_id.get('configuration'), 'summary and attempt must use the same configured target'
            assert summary['overallStatus'] == 'PASSED'
            assert all(summary.get(key) == 1 for key in ('totalRunCount', 'runCount', 'attemptCount')), 'expected exactly one test execution and one attempt in the overall summary'
            cache = {'cached_locally': result.get('cachedLocally', False),
                'cached_remotely': result.get('executionInfo', {}).get('cachedRemotely', False),
                'total_cached_test_actions': summary.get('totalNumCached', 0)}
            verdict['bazel_test_cache'] = cache
            assert cache['cached_locally'] is False and cache['cached_remotely'] is False, 'an actual uncached test execution is required'
            assert cache['total_cached_test_actions'] == 0, 'the overall summary must contain zero cached test actions'


        cases = {'default_profile': ('//codex-rs/hepta-agentd:hepta-agentd-unit-tests',
                             '//codex-rs/hepta-agentd:hepta-agentd-unit-tests-bin',
                             ['runtime::tests::product_write_profile_fails_closed_when_cognitive_store_is_unavailable']),
         'default_writer': ('//codex-rs/hepta-agentd:hepta-agentd-cognitive_store_product_writer-test',
                            '//codex-rs/hepta-agentd:hepta-agentd-cognitive_store_product_writer-test',
                            ['agentd_product_host_recovers_exact_cut_into_fenced_writer_generation']),
         'qualification_unit': ('//codex-rs/hepta-agentd:hepta-agentd-cognitive-write-qualification-test',
                                '//codex-rs/hepta-agentd:hepta-agentd-cognitive-write-qualification-test-bin',
                                ['runtime::tests::qualification_host_binds_one_local_turn_and_replays_exactly_once',
                                 'runtime::tests::qualification_prepare_takes_over_expired_registry_head_without_evidence',
                                 'runtime::tests::qualification_prepare_quarantines_expired_registry_attempt_with_h7_evidence']),
         'qualification_product': ('//codex-rs/hepta-agentd:hepta-agentd-cognitive-product-qualification-test',
                                   '//codex-rs/hepta-agentd:hepta-agentd-cognitive-product-qualification-test-bin',
                                   ['real_agentd_remember_recall_correct_and_forget_revalidate_physical_sends']),
         'infer': ('//codex-rs/hepta-infer-worker-host:hepta-infer-worker-host-unit-tests',
                   '//codex-rs/hepta-infer-worker-host:hepta-infer-worker-host-unit-tests-bin',
                   ['native_app_server::tests::real_agentd_worker_accepts_fresh_context_and_rejects_final_use_tombstone',
                    'native_app_server::tests::pq_final_use::real_agentd_turn_start_consumes_explicit_pq_config_and_external_mldsa_grant',
                    'smollm_neural_read::driver::failure::tests::real_socket_timeout_retains_original_errno_and_both_deadlines_before_shutdown',
                    'smollm_neural_read::driver::failure::tests::real_socket_success_eof_multiple_frames_and_json_decode_keep_distinct_causes',
                    'smollm_neural_read::driver::failure::tests::original_cancellation_sends_no_frame_and_is_recorded_without_io_error',
                    'smollm_neural_read::driver::session::owner::tests::two_preborn_owners_preserve_parallel_children_and_third_refuses_before_birth',
                    'smollm_neural_read::driver::session::owner::tests::denied_or_panicked_prebirth_thread_request_keeps_bounded_roots_without_a_child',
                    'smollm_neural_read::driver::session::owner::tests::cleanup_panic_after_drop_retains_exact_child_and_held_directory_in_failed_slot',
                    'smollm_neural_read::driver::session::owner::tests::foreground_and_drop_never_wait_for_a_held_cleanup_payload',
                    'smollm_neural_read::driver::session::owner::tests::cancellation_or_original_startup_expiry_prevents_child_birth',
                    'smollm_neural_read::driver::session::owner::tests::readiness_expiry_uses_original_budget_and_keeps_unborn_reservation_closed',
                    'smollm_neural_read::driver::session::owner::tests::exact_supervisor_exit_without_original_worker_receipt_stays_closed',
                    'smollm_neural_read::driver::session::owner::tests::contended_root_reservation_starts_two_original_children_without_retrying_birth',
                    'smollm_neural_read::driver::session::owner::tests::root_contention_preserves_original_deadline_and_cancellation_before_reservation',
                    'smollm_neural_read::driver::session::owner::tests::poisoned_roots_never_wait_or_reserve_an_owner',
                    'smollm_neural_read::driver::session::owner::tests::root_contention_attempt_cap_refuses_without_waiting_for_a_longer_startup_window',
                    'smollm_neural_read::driver::session::tests::terminal_unload_requires_successful_supervisor_and_original_child_receipt',
                    'smollm_neural_read::driver::session::tests::dropped_cold_session_retries_stop_when_socket_appears_and_retains_reaper',
                    'smollm_neural_read::driver::session::tests::dropped_session_does_not_extend_its_expired_stop_window',
                    'smollm_neural_read::driver::session::tests::cancelled_read_sends_no_frame_and_uncertain_exchange_blocks_successor',
                    'smollm_neural_read::driver::session::tests::ready_published_after_original_startup_window_cannot_be_adopted',
                    'smollm_neural_read::driver::session::tests::cancelled_original_startup_cannot_adopt_an_already_published_ready',
                    'test_process::tests::requires_the_exact_original_case_and_one_pass',
                    'test_process::tests::rejects_successful_zero_case_and_ignored_case_runs',
                    'test_process::tests::rejects_multiple_cases_and_failed_or_missing_completion']),
         'exec_discovery': ('//codex-rs/exec-server:exec-server-capability_discovery-test',
                            '//codex-rs/exec-server:exec-server-capability_discovery-test',
                            ['sandboxed_discovery_batches_roots_without_combining_different_permissions']),
         'exec_fs': ('//codex-rs/exec-server:exec-server-file_system_unix-test',
                     '//codex-rs/exec-server:exec-server-file_system_unix-test',
                     ['sandboxed_file_system_helper_finds_bwrap_on_preserved_path']),
         'supervisord': ('//codex-rs/hepta-agentd:hepta-agentd-supervisord_product_e2e-test',
                         '//codex-rs/hepta-agentd:hepta-agentd-supervisord_product_e2e-test',
                         ['supervisord_child_entry',
                          'five_real_agents_survive_daemon_restart_and_isolate_one_agent_release_changes'])}
        case_arguments = {'default_profile': ['runtime::tests::product_write_profile_fails_closed_when_cognitive_store_is_unavailable',
                             '--exact',
                             '--nocapture'],
         'default_writer': [],
         'qualification_unit': [],
         'qualification_product': ['real_agentd_remember_recall_correct_and_forget_revalidate_physical_sends',
                                   '--exact',
                                   '--nocapture'],
         'infer': ['native_app_server::tests::real_agentd_worker_accepts_fresh_context_and_rejects_final_use_tombstone',
                   'native_app_server::tests::pq_final_use::real_agentd_turn_start_consumes_explicit_pq_config_and_external_mldsa_grant',
                   'smollm_neural_read::driver::failure::tests::real_socket_timeout_retains_original_errno_and_both_deadlines_before_shutdown',
                   'smollm_neural_read::driver::failure::tests::real_socket_success_eof_multiple_frames_and_json_decode_keep_distinct_causes',
                   'smollm_neural_read::driver::failure::tests::original_cancellation_sends_no_frame_and_is_recorded_without_io_error',
                   'smollm_neural_read::driver::session::owner::tests::two_preborn_owners_preserve_parallel_children_and_third_refuses_before_birth',
                   'smollm_neural_read::driver::session::owner::tests::denied_or_panicked_prebirth_thread_request_keeps_bounded_roots_without_a_child',
                   'smollm_neural_read::driver::session::owner::tests::cleanup_panic_after_drop_retains_exact_child_and_held_directory_in_failed_slot',
                   'smollm_neural_read::driver::session::owner::tests::foreground_and_drop_never_wait_for_a_held_cleanup_payload',
                   'smollm_neural_read::driver::session::owner::tests::cancellation_or_original_startup_expiry_prevents_child_birth',
                   'smollm_neural_read::driver::session::owner::tests::readiness_expiry_uses_original_budget_and_keeps_unborn_reservation_closed',
                   'smollm_neural_read::driver::session::owner::tests::exact_supervisor_exit_without_original_worker_receipt_stays_closed',
                   'smollm_neural_read::driver::session::owner::tests::contended_root_reservation_starts_two_original_children_without_retrying_birth',
                   'smollm_neural_read::driver::session::owner::tests::root_contention_preserves_original_deadline_and_cancellation_before_reservation',
                   'smollm_neural_read::driver::session::owner::tests::poisoned_roots_never_wait_or_reserve_an_owner',
                   'smollm_neural_read::driver::session::owner::tests::root_contention_attempt_cap_refuses_without_waiting_for_a_longer_startup_window',
                   'smollm_neural_read::driver::session::tests::terminal_unload_requires_successful_supervisor_and_original_child_receipt',
                   'smollm_neural_read::driver::session::tests::dropped_cold_session_retries_stop_when_socket_appears_and_retains_reaper',
                   'smollm_neural_read::driver::session::tests::dropped_session_does_not_extend_its_expired_stop_window',
                   'smollm_neural_read::driver::session::tests::cancelled_read_sends_no_frame_and_uncertain_exchange_blocks_successor',
                   'smollm_neural_read::driver::session::tests::ready_published_after_original_startup_window_cannot_be_adopted',
                   'smollm_neural_read::driver::session::tests::cancelled_original_startup_cannot_adopt_an_already_published_ready',
                   'test_process::tests::requires_the_exact_original_case_and_one_pass',
                   'test_process::tests::rejects_successful_zero_case_and_ignored_case_runs',
                   'test_process::tests::rejects_multiple_cases_and_failed_or_missing_completion',
                   '--exact',
                   '--nocapture'],
         'exec_discovery': ['sandboxed_discovery_batches_roots_without_combining_different_permissions',
                            '--exact',
                            '--nocapture'],
         'exec_fs': ['sandboxed_file_system_helper_finds_bwrap_on_preserved_path', '--exact', '--nocapture'],
         'supervisord': []}
        expected_counts = {'default_profile': 1, 'default_writer': 1, 'qualification_unit': 3, 'qualification_product': 1, 'infer': 25, 'exec_discovery': 1, 'exec_fs': 1, 'supervisord': 2}
        expected_timeouts = {'default_profile': 300, 'default_writer': 900, 'qualification_unit': 300, 'qualification_product': 900, 'infer': 300, 'exec_discovery': 300, 'exec_fs': 300, 'supervisord': 900}
        allowed_groups = {'feature-parity': ['default_profile', 'default_writer', 'qualification_unit', 'qualification_product'], 'remaining29': ['infer', 'exec_discovery', 'exec_fs', 'supervisord']}
        assert {key: len(value[2]) for key, value in cases.items()} == expected_counts
        assert sum(expected_counts.values()) == 35
        assert all(len(value[2]) == len(set(value[2])) for value in cases.values())
        assert all(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_:]*', name) for value in cases.values() for name in value[2])
        case = sys.argv[1]
        assert case in allowed_groups[os.environ['NORMAL_GROUP']], 'case outside this isolated normal group'
        target, binary_target, expected = cases[case]
        root = Path(os.environ['RUNNER_TEMP']) / 'normal-bazel' / case
        root.mkdir()
        platform = '--platforms=' + os.environ['BAZEL_PLATFORM']
        command = ['bazel', 'test', '--jobs=2', '--cache_test_results=no', '--test_output=all', '--flaky_test_attempts=1',
            '--distdir=' + str(Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'), platform,
            '--build_event_json_file=' + str(root / 'build-events.jsonl')]
        command += ['--test_arg=' + value for value in case_arguments[case]]
        command.append(target)
        (root / 'command.json').write_text(json.dumps({'argv': command, 'cwd': os.getcwd(),
            'expected_tests': expected, 'original_test_budgets_unchanged': True,
            'sandbox_flags_present': {key: key in os.environ for key in ('CODEX_SANDBOX', 'CODEX_SANDBOX_NETWORK_DISABLED')}}, indent=2) + '\n')
        with (root / 'bazel.log').open('wb') as log:
            child = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
            for line in child.stdout:
                log.write(line)
                sys.stdout.buffer.write(line)
                sys.stdout.buffer.flush()
            code = child.wait()
        (root / 'native.exit').write_text(str(code) + '\n')
        verdict = {'result': 'FAIL', 'target': target, 'native_exit': code, 'expected_count': len(expected)}
        try:
            events = [json.loads(line) for line in (root / 'build-events.jsonl').read_text().splitlines() if line.strip()]
            results = [row for row in events if row.get('id', {}).get('testResult', {}).get('label') == target]
            assert len(results) == 1, 'expected one unsharded test attempt; retain every other outcome as failure'
            result_id = results[0]['id']['testResult']
            verdict['bazel_test_result_id'] = result_id
            assert all(result_id.get(key) == 1 for key in ('run', 'shard', 'attempt')), 'expected run 1, shard 1, attempt 1'
            result = results[0]['testResult']
            verdict['bazel_test_status'] = result['status']
            logs = [value['uri'] for value in result.get('testActionOutput', []) if value.get('name') == 'test.log']
            assert len(logs) == 1
            location = urllib.parse.urlparse(logs[0])
            assert location.scheme == 'file' and location.netloc in ('', 'localhost')
            path = Path(urllib.parse.unquote(location.path))
            shutil.copyfile(path, root / 'original-test.log')
            text = (root / 'original-test.log').read_text().replace('\r', '')
            names = re.findall(r'^test ([A-Za-z_][A-Za-z0-9_:]*) \.\.\.', text, re.M)
            summaries = re.findall(r'^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;', text, re.M)
            verdict.update({'observed_names': names, 'native_summaries': summaries})
            query = ['bazel', 'cquery', '--output=files', platform, binary_target]
            with (root / 'binary-query.stderr').open('wb') as error:
                found = subprocess.run(query, stdout=subprocess.PIPE, stderr=error, check=False)
            (root / 'binary-query.stdout').write_bytes(found.stdout)
            assert found.returncode == 0
            binaries = []
            for line in found.stdout.decode().splitlines():
                binary = Path(line)
                if not binary.is_file():
                    continue
                with binary.open('rb') as stream:
                    if stream.read(4) != b'\x7fELF':
                        continue
                    stream.seek(0)
                    digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                binaries.append({'path': str(binary.resolve()), 'bytes': binary.stat().st_size, 'sha256': digest})
            assert len(binaries) == 1, 'expected one actual library test ELF'
            (root / 'binary-identities.json').write_text(json.dumps(binaries, indent=2) + '\n')
            completions = [row for row in events if row.get('id', {}).get('targetCompleted', {}).get('label') == target]
            assert len(completions) == 1, 'one configured target completion required'
            completed_id = completions[0]['id']['targetCompleted']
            completed = completions[0]['completed']
            assert completed_id.get('configuration') == result_id.get('configuration')
            verdict['original_bazel_timeout'] = {
                'seconds': completed.get('testTimeoutSeconds'), 'duration': completed.get('testTimeout'),
                'expected_seconds': expected_timeouts[case]}
            assert completed.get('success') is True
            assert int(completed['testTimeoutSeconds']) == expected_timeouts[case]
            assert completed['testTimeout'] == str(expected_timeouts[case]) + 's'
            check_bep_completion(events, target, result_id, result, verdict)
            running = re.findall(r'^running (\d+) tests?$', text, re.M)
            assert running == [str(len(expected))], 'original native count required'
            assert len(names) == len(set(names)), 'duplicate native names'
            assert 'Skipping test' not in text, 'guard returned before execution'
            assert sorted(names) == sorted(expected), (names, expected)
            assert len(summaries) == 1
            outcome, passed, failed, ignored, measured, filtered = summaries[0]
            verdict.update({'observed_names': names, 'passed': int(passed), 'failed': int(failed), 'ignored': int(ignored), 'filtered': int(filtered)})
            assert outcome == 'ok' and int(passed) == len(expected) and int(failed) == int(ignored) == int(measured) == 0
            if case in ('default_writer', 'supervisord'):
                assert int(filtered) == 0
            assert code == 0 and result['status'] == 'PASSED'
            verdict['result'] = 'PASS'
        except Exception as error:
            verdict['reader_error'] = str(error)
        finally:
            (root / 'result.json').write_text(json.dumps(verdict, indent=2) + '\n')
            print(json.dumps(verdict))
        sys.exit(0 if verdict['result'] == 'PASS' else 1)
