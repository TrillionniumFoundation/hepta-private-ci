                assert parser.normalized_label(file['owner']) == label
                short = PurePosixPath(file['short_path'])
                assert not short.is_absolute() and '..' not in short.parts and str(short) == file['short_path']
            helper_file = by_label[HELPER]['files'][0]
            root = by_label[case['target']]
            runfiles = root['default_runfiles'] + root['data_runfiles']
            assert runfiles and all(item == helper_file for item in runfiles), 'test runfiles do not declare exactly this configured helper'
            run_env = root['run_environment']
            assert isinstance(run_env, dict) and isinstance(run_env.get('inherited'), list), 'test RunEnvironmentInfo is absent'
            assert not any(name in run_env['inherited'] for name in (RUNFILE_ENV, RUNFILE_ENV.replace('-', '_'))), 'inherited environment could replace the declared helper'
            assert run_env['helper'] == '_main/' + helper_file['short_path'], 'CARGO_BIN_EXE does not reference the declared runfile'
            return {'test': root['files'][0], 'helper': helper_file,
                    'runfile_key': run_env['helper'], 'declared_runfile_occurrences': len(runfiles),
                    'run_environment_provider': 'RunEnvironmentInfo', 'inherited_environment_names': run_env['inherited']}


        def stat_identity(value):
            return {key: getattr(value, key) for key in ('st_dev', 'st_ino', 'st_mode', 'st_size', 'st_mtime_ns', 'st_ctime_ns')}


        def elf_identity(relative, triple):
            relative = normalize_path(relative)
            output_tree = Path('bazel-out').resolve(strict=True)
            actual = Path(relative).resolve(strict=True)
            assert actual.is_relative_to(output_tree) and actual.is_file(), 'helper escaped configured output tree'
            fd = os.open(actual, os.O_RDONLY | os.O_NOFOLLOW)
            try:
                before = os.fstat(fd)
                assert stat.S_ISREG(before.st_mode) and before.st_mode & 0o111 and before.st_size >= 64
                header = os.pread(fd, 64, 0)
                assert header[:7] == b'\x7fELF\x02\x01\x01', 'expected ELF64 little endian'
                fields = struct.unpack('<16sHHIQQQIHHHHHH', header)
                _, kind, machine, version, _, phoff, _, _, ehsize, phentsize, phnum, _, _, _ = fields
                assert kind in (2, 3) and machine == 62 and version == 1 and ehsize == 64
                assert phentsize == 56 and 0 < phnum < 256 and phoff >= 64 and phoff + phnum * phentsize <= before.st_size
                interpreters = []
                for index in range(phnum):
                    remaining_work()
                    ph = struct.unpack('<IIQQQQQQ', os.pread(fd, phentsize, phoff + index * phentsize))
                    ptype, _, offset, _, _, size, _, _ = ph
                    if ptype == 3:
                        assert 1 < size <= 4096 and offset + size <= before.st_size
                        raw = os.pread(fd, size, offset)
                        assert len(raw) == size and raw[-1:] == b'\0' and b'\0' not in raw[:-1]
                        interpreters.append(raw[:-1].decode('ascii'))
                assert len(interpreters) <= 1, 'ambiguous PT_INTERP'
                interpreter = interpreters[0] if interpreters else None
                allowed = {None, '/lib/ld-musl-x86_64.so.1'} if triple.endswith('-musl') else {
                    None, '/lib64/ld-linux-x86-64.so.2', '/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2'}
                assert interpreter in allowed, 'ELF loader contradicts configured target ABI'
                digest = hashlib.sha256()
                count = 0
                while True:
                    remaining_work()
                    chunk = os.read(fd, 1024 * 1024)
                    if not chunk:
                        break
                    digest.update(chunk)
                    count += len(chunk)
                after = os.fstat(fd)
                assert stat_identity(before) == stat_identity(after) and count == before.st_size, 'ELF changed while hashing'
                assert stat_identity(actual.stat()) == stat_identity(after), 'ELF path changed during inspection'
                return {'configured_path': relative, 'path': str(actual), 'bytes': count, 'sha256': digest.hexdigest(),
                        'stat': stat_identity(after), 'elf_machine': machine, 'elf_type': kind, 'pt_interp': interpreter,
                        'configured_target_triple': triple, 'executed': False}
            finally:
                os.close(fd)


        def stop_client_group(process):
            # Popen creates this query's session. Never signal another Bazel server,
            # another process group, or an existing test/build task.
            for sig, grace in ((signal.SIGINT, 30), (signal.SIGTERM, 10), (signal.SIGKILL, 5)):
                if process.poll() is not None:
                    break
                try:
                    os.killpg(process.pid, sig)
                except ProcessLookupError:
                    pass
                available = max(0.01, min(grace, PHASE_END - time.monotonic()))
                try:
                    process.wait(timeout=available)
                except subprocess.TimeoutExpired:
                    pass
            return process.poll()


        def run_query(command, directory, name):
            remaining_work()
            started = time.monotonic()
            dump(directory / (name + '-command.json'), {'argv': command, 'cwd': os.getcwd(), 'tests_executed': 0,
                'phase_seconds': PHASE_SECONDS, 'stop_reserve_seconds': STOP_RESERVE_SECONDS,
                'remaining_work_seconds': remaining_work()})
            process = None
            record = {'exit': None, 'deadline_expired': False, 'client_stop_confirmed': False}
            try:
                with (directory / (name + '.stdout')).open('xb') as out, (directory / (name + '.stderr')).open('xb') as err:
                    process = subprocess.Popen(command, stdout=out, stderr=err, start_new_session=True)
                    try:
                        record['exit'] = process.wait(timeout=remaining_work())
                    except subprocess.TimeoutExpired:
                        record['deadline_expired'] = True
                        # Stop the alarm before using its reserved client-cleanup interval.
                        signal.setitimer(signal.ITIMER_REAL, 0)
                        record['exit'] = stop_client_group(process)
            except BaseException as error:
                record['interrupted'] = type(error).__name__ + ': ' + str(error)
                record['deadline_expired'] = isinstance(error, (TimeoutError, subprocess.TimeoutExpired))
                raise
            finally:
                if process is not None and process.poll() is None:
                    signal.setitimer(signal.ITIMER_REAL, 0)
                    record['exit'] = stop_client_group(process)
                if process is not None:
                    record['exit'] = process.poll()
                    record['client_stop_confirmed'] = process.poll() is not None
                record['elapsed_seconds'] = time.monotonic() - started
                for stream in ('stdout', 'stderr'):
                    path = directory / (name + '.' + stream)
                    if path.exists():
                        record[stream] = {'bytes': path.stat().st_size}
                        try:
                            raw = bounded_bytes(path)
                            record[stream]['sha256'] = sha(raw)
                        except TimeoutError:
                            record[stream]['hash_pending_reason'] = 'phase deadline; original bytes retained'
                dump(directory / (name + '-result.json'), record)
            assert record['exit'] == 0 and not record['deadline_expired'] and record['client_stop_confirmed'], 'configured analysis failed or timed out; preserve original ' + name + ' output'
            return bounded_bytes(directory / (name + '.stdout'))


        def main():
            global PHASE_END, WORK_END
            begun = time.monotonic()
            PHASE_END = begun + PHASE_SECONDS
            WORK_END = PHASE_END - STOP_RESERVE_SECONDS
            assert __debug__
            phase = sys.argv[1]
            assert phase in ('pre', 'post') and len(sys.argv) == 2
            base = Path(os.environ['RUNNER_TEMP']) / 'normal-bazel'
            directory = base / 'exec_helper' / phase
            directory.mkdir(parents=True, exist_ok=False)
            signal.signal(signal.SIGALRM, deadline_alarm)
            signal.setitimer(signal.ITIMER_REAL, remaining_work())
            verdict = {'schema': 'hepta-exec-helper-metadata-v1', 'phase': phase, 'result': 'FAIL',
                       'tests_executed': 0, 'native_or_helper_invocations': 0, 'cases': {}}
            try:
                before = source_identity()
                verdict['source_before'] = before
                parser, cases = load_originals(base)
                platform = os.environ['BAZEL_PLATFORM']
                triples = {'//:local_linux': 'x86_64-unknown-linux-gnu',
                           '@rules_rs//rs/platforms:x86_64-unknown-linux-musl': 'x86_64-unknown-linux-musl'}
                triple = triples[platform]
                formatter = directory / 'runfiles.cquery.bzl'
                formatter.write_text(FORMATTER)
                previous = None
                if phase == 'post':
                    previous = json.loads(bounded_bytes(base / 'exec_helper/pre/result.json'))
                    assert previous['result'] == 'PASS' and previous['source_after'] == before
                for key, case in cases.items():
                    item = {'result': 'FAIL', 'case': case, 'triple': triple}
                    verdict['cases'][key] = item
                    folder = directory / key
                    folder.mkdir()
                    try:
                        remaining_work()
                        flags = ['--jobs=2', '--cache_test_results=no', '--test_output=all', '--flaky_test_attempts=1',
                                 '--distdir=' + str(Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'), '--platforms=' + platform]
                        flags += ['--test_arg=' + arg for arg in case['arguments']]
                        # Both tools inspect configured dependencies reached through the original test root.
                        pattern = '(^|@)//codex-rs/exec-server:(' + HELPER_NAME + '|' + case['target'].split(':')[-1] + ')$'
                        expression = 'filter("' + pattern + '", deps(' + case['target'] + '))'
                        if phase == 'pre':
                            command = ['bazel', 'aquery', *flags, '--output=jsonproto', '--include_artifacts=true',
                                       '--include_commandline=true', '--include_param_files=true',
                                       'mnemonic("^(Rustc|TestRunner)$", ' + expression + ')']
                            graph = json.loads(run_query(command, folder, 'aquery'))
                            item['configured'] = inspect_graph(graph, case, triple, parser)
                        else:
                            item['configured'] = previous['cases'][key]['configured']
                        command = ['bazel', 'cquery', *flags, '--output=starlark', '--starlark:file=' + str(formatter), expression]
                        item['runfiles'] = inspect_cquery(run_query(command, folder, 'cquery'), case, item['configured'], parser)
                        if phase == 'post':
                            assert item['runfiles'] == previous['cases'][key]['runfiles'], 'configured runfiles changed after native step'
                            item['helper_elf'] = elf_identity(item['runfiles']['helper']['path'], triple)
                            item['test_elf'] = elf_identity(item['runfiles']['test']['path'], triple)
                            native = json.loads(bounded_bytes(base / key / 'binary-identities.json'))
                            expected = [{'path': item['test_elf']['path'], 'bytes': item['test_elf']['bytes'], 'sha256': item['test_elf']['sha256']}]
                            assert native == expected, 'post-analysis test ELF differs from original native identity record'
                        item['result'] = 'PASS'
                    except Exception as error:
                        item['reader_error'] = type(error).__name__ + ': ' + str(error)
                remaining_work()
                verdict['source_after'] = source_identity()
                assert verdict['source_after'] == before
                assert all(item['result'] == 'PASS' for item in verdict['cases'].values()), 'one or more helper metadata checks failed'
                verdict['result'] = 'PASS'
            except Exception as error:
                verdict['reader_error'] = type(error).__name__ + ': ' + str(error)
            finally:
                signal.setitimer(signal.ITIMER_REAL, 0)
                verdict['phase_limit_seconds'] = PHASE_SECONDS
                verdict['work_limit_seconds'] = PHASE_SECONDS - STOP_RESERVE_SECONDS
                verdict['client_stop_reserve_seconds'] = STOP_RESERVE_SECONDS
                verdict['elapsed_seconds'] = time.monotonic() - begun
                dump(directory / 'result.json', verdict)
                print(json.dumps(verdict, sort_keys=True))
            return 0 if verdict['result'] == 'PASS' else 1


        if __name__ == '__main__':
            sys.exit(main())
        PYEXECPROOF
    - name: Inspect each original Exec root for the ordinary same-target helper and declared runfile
      id: helper_configured
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome
        == 'success' && steps.runner.outcome == 'success' && steps.configuration_reader.outcome == 'success' && steps.helper_reader.outcome
        == 'success' }}
      shell: bash
      timeout-minutes: 6
      run: |
        python3 "$RUNNER_TEMP/normal-bazel/verify-exec-helper.py" pre
    - name: Run the original namespace-aware discovery positive case
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome
        == 'success' && steps.runner.outcome == 'success' && steps.helper_configured.outcome == 'success' }}
      shell: bash
      run: python3 "$RUNNER_TEMP/normal-bazel/run-target.py" exec_discovery
      id: original_exec_discovery
    - name: Run the original preserved-PATH filesystem positive case
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome
        == 'success' && steps.runner.outcome == 'success' && steps.helper_configured.outcome == 'success' }}
      shell: bash
      run: python3 "$RUNNER_TEMP/normal-bazel/run-target.py" exec_fs
      id: original_exec_fs
    - name: Read back each configured helper and original test ELF after the native outcomes
      id: helper_elf
      if: ${{ !cancelled() && steps.helper_configured.outcome == 'success' }}
      shell: bash
      timeout-minutes: 6
      run: |
        python3 "$RUNNER_TEMP/normal-bazel/verify-exec-helper.py" post
    - name: Retain the exact source state after every outcome
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/normal-bazel"
        git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/normal-bazel/source-after.txt"
        git status --porcelain --untracked-files=normal > "$RUNNER_TEMP/normal-bazel/source-after-status.txt"
        expected="$EXPECTED_HEAD"
        if [ "$SOURCE_KIND" = prospective-merge ]; then expected="$EXPECTED_MERGE"; fi
        test "$(git rev-parse HEAD)" = "$expected"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        test ! -s "$RUNNER_TEMP/normal-bazel/source-after-status.txt"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: normal-bazel-musl-helper-exec2-ctor-${{ matrix.source }}-${{ matrix.platform }}-${{ env.EXPECTED_HEAD
          }}
        path: ${{ runner.temp }}/normal-bazel/
        if-no-files-found: error
        retention-days: 30
