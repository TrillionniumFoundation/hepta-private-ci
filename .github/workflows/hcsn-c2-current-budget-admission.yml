name: hcsn-c2-current-budget-admission

on:
  pull_request:
    paths:
      - "qualification/hcsn_differentiable/replay_v1/current_budget_admission_v1/**"
      - ".github/workflows/hcsn-c2-current-budget-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-budget-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled admission fixtures
        run: >-
          python3 -m unittest
          qualification.hcsn_differentiable.replay_v1.current_budget_admission_v1.test_budget_contract
          -v
      - name: Optimized admission fixtures
        run: >-
          python3 -O -m unittest
          qualification.hcsn_differentiable.replay_v1.current_budget_admission_v1.test_budget_contract
          -v
      - name: Compile source
        run: >-
          python3 -m py_compile
          qualification/hcsn_differentiable/replay_v1/current_budget_admission_v1/*.py
      - name: Verify exact source and inherited originals
        run: >-
          python3 -m
          qualification.hcsn_differentiable.replay_v1.current_budget_admission_v1.verify_frozen_sources
