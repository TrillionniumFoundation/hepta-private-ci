name: MemoryCell one-shot repository format repair
on:
  push:
    branches:
      - "codex/memory-cell-evidence-20261008"
    paths:
      - ".github/workflows/hepta-memory-format-repair-once.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: hepta-memory-once-format
  cancel-in-progress: false
jobs:
  format-validate-and-forward:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/memory-cell-evidence-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      BASE: 78fdb0cf8537e3a84fc6e0a849707559c80881e8
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: ./.github/actions/setup-ci
      - name: Format only changed MemoryCell Python without changing syntax
        run: |
          set -euo pipefail
          python3 -m pip install --user uv==0.8.22
          export PATH="$HOME/.local/bin:$PATH"
          git fetch --no-tags --depth=1 origin "$BASE"
          mkdir -p /tmp/format-repair
          python3 - <<'PY'
          import ast, json, subprocess
          from pathlib import Path
          base = "78fdb0cf8537e3a84fc6e0a849707559c80881e8"
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD", "--", "scripts/memory_cell"],
              text=True,
          ).splitlines()
          paths = sorted(p for p in paths if p.endswith(".py") and Path(p).is_file())
          if not paths or len(paths) > 400:
              raise ValueError("invalid bounded formatter source census")
          snapshot = {p: ast.dump(ast.parse(Path(p).read_text(encoding="utf-8")))
                      for p in paths}
          Path("/tmp/format-repair/ast-before.json").write_text(json.dumps(snapshot, sort_keys=True))
          Path("/tmp/format-repair/paths.json").write_text(json.dumps(paths))
          subprocess.run(["uv", "run", "--frozen", "--project", "scripts",
                          "ruff", "format", *paths], check=True)
          for p, original in snapshot.items():
              after = ast.dump(ast.parse(Path(p).read_text(encoding="utf-8")))
              if after != original:
                  raise ValueError(f"formatter changed executable AST: {p}")
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if not changed or set(changed) - set(paths):
              raise ValueError("unexpected change or no Python format fix")
          Path("/tmp/format-repair/changed.json").write_text(json.dumps(changed, sort_keys=True))
          PY
          just fmt --check --base "$BASE" 2>&1 | tee /tmp/format-repair/format.log
      - name: Execute the complete pinned Python regression suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11669174727/zip > /tmp/format-repair/input.zip
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          data = Path("/tmp/format-repair/input.zip").read_bytes()
          if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != "23e9d44b8d2dbe756c7c33031e18853c83326458a37925d4d368881145bf142b":
              raise ValueError("locked original dataset archive changed")
          with zipfile.ZipFile("/tmp/format-repair/input.zip") as archive:
              env = archive.read("environment.txt")
              if not env or len(env) > 65536:
                  raise ValueError("invalid locked environment")
              Path("/tmp/format-repair/requirements.txt").write_bytes(env)
          PY
          python3 -m venv /tmp/memory-format-py
          /tmp/memory-format-py/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/memory-format-py/bin/pip install -r /tmp/format-repair/requirements.txt
          /tmp/memory-format-py/bin/pip freeze > /tmp/format-repair/freeze.txt
          diff -u /tmp/format-repair/requirements.txt /tmp/format-repair/freeze.txt
          /tmp/memory-format-py/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/format-repair/tests.log
      - name: Commit only AST-identical formatting and remove this temporary workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/hepta-memory-format-repair-once.yml
          git add -u -- scripts/memory_cell
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          formatted = set(json.loads(Path("/tmp/format-repair/changed.json").read_text()))
          actual = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          expected = formatted | {".github/workflows/hepta-memory-format-repair-once.yml"}
          if actual != expected:
              raise ValueError("staged changes differ from checked AST-equivalent formatting")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style(memory-cell): apply checked AST-equivalent Python formatting"
          git rev-parse HEAD > /tmp/format-repair/committed-sha.txt
          if ! git push origin HEAD:refs/heads/codex/memory-cell-evidence-20261008; then
              git push origin "HEAD:refs/heads/codex/memory-format-candidate-${GITHUB_RUN_ID}"
              echo "Source branch moved; preserve validated candidate without force" >&2
              exit 1
          fi
      - name: Preserve formatter and test evidence
        if: always()
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/format-repair/observed-head.txt
          (cd /tmp/format-repair && find . -type f ! -name SHA256SUMS ! -name input.zip -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          rm -f /tmp/format-repair/input.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-format-ast-and-regressions
          path: /tmp/format-repair
          if-no-files-found: error
