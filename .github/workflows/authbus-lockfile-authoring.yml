name: AuthBus one-shot lockfile authoring

on:
  push:
    branches:
      - auth-authbus-boundary-convergence-20260928
    paths:
      - "codex-rs/hepta-authbus/Cargo.toml"
      - "codex-rs/hepta-authbus/src/legacy_replay.rs"
      - "codex-rs/hepta-authbus/src/lib.rs"
      - "codex-rs/hepta-authbus/src/signed.rs"
      - "codex-rs/hepta-bao-adapter/Cargo.toml"
      - "codex-rs/hepta-bao-adapter/src/durable_authbus.rs"
      - "codex-rs/hepta-operations/src/authbus_handle.rs"
      - ".github/workflows/authbus-lockfile-authoring.yml"

permissions:
  contents: write

concurrency:
  group: authbus-lockfile-authoring-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  author-lockfile:
    name: Author and verify Cargo.lock once
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout triggering branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Author lockfile and compile affected packages
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo check -p codex-hepta-authbus --all-targets --all-features
          cargo check -p codex-hepta-operations --all-targets
          cargo check -p codex-hepta-bao-adapter --all-targets
          cd ..
          changed="$(git diff --name-only)"
          test -z "$changed" || test "$changed" = "codex-rs/Cargo.lock"

      - name: Commit only for the still-current branch head
        shell: bash
        env:
          TARGET_BRANCH: auth-authbus-boundary-convergence-20260928
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if test "$remote_head" != "$GITHUB_SHA"; then
            echo "A newer candidate exists; its queued run owns lockfile authoring."
            exit 0
          fi
          test "$(git diff --name-only)" = "codex-rs/Cargo.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(auth.authbus): refresh locked operation composition"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
