name: Hepta Lane E compile remediation materializer

on:
  push:
    branches:
      - codex/lane-e-gap-closure-r23-20260911
    paths:
      - .github/workflows/hepta-lane-e-compile-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: hepta-lane-e-compile-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: codex/lane-e-gap-closure-r23-20260911

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.95.0
          rustc --version --verbose

      - name: Materialize narrow Default implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-intelligence-eval/src/holdout_journal.rs")
          text = path.read_text(encoding="utf-8")
          old = """#[derive(Clone, Debug, Default)]
          pub struct FinalHoldoutJournalV1 {
              registry: FinalHoldoutRegistry,
              records: Vec<FinalHoldoutJournalRecordV1>,
              head_digest: Digest32,
          }

          impl FinalHoldoutJournalV1 {
          """
          new = """#[derive(Clone, Debug)]
          pub struct FinalHoldoutJournalV1 {
              registry: FinalHoldoutRegistry,
              records: Vec<FinalHoldoutJournalRecordV1>,
              head_digest: Digest32,
          }

          impl Default for FinalHoldoutJournalV1 {
              fn default() -> Self {
                  Self {
                      registry: FinalHoldoutRegistry::default(),
                      records: Vec::new(),
                      head_digest: Digest32::ZERO,
                  }
              }
          }

          impl FinalHoldoutJournalV1 {
          """
          if text.count(old) != 1:
              raise SystemExit(f"expected one target block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-intelligence-eval
          git diff --check

      - name: Commit and push remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/hepta-intelligence-eval/src/holdout_journal.rs
          git commit -m "fix(lane-e): initialize holdout journal at zero digest"
          git push origin HEAD:refs/heads/codex/lane-e-gap-closure-r23-20260911

      - name: Capture next exact Lane E compilation
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets
