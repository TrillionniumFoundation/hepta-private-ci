name: Windows consumer durability and SSHSIG qualification

on:
  push:
    branches:
      - codex/hia-windows-consumers-20261128-03da85
    paths:
      - codex-rs/hepta-operator-acceptance/**
      - codex-rs/hepta-shadow-qualification/**
      - .github/workflows/windows-consumer-qualification.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - name: Preserve exact repository source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test
      - name: Diagnose system OpenSSH fixture startup
        shell: pwsh
        run: |
          @'
          import ctypes, hashlib, json, os, pathlib, subprocess, tempfile
          buffer = ctypes.create_unicode_buffer(32768)
          count = ctypes.windll.kernel32.GetSystemDirectoryW(buffer, len(buffer))
          assert 0 < count < len(buffer)
          keygen = pathlib.Path(buffer.value) / "OpenSSH" / "ssh-keygen.exe"
          selected = ("SYSTEMROOT", "WINDIR", "USERPROFILE", "HOMEDRIVE", "HOMEPATH", "PROGRAMDATA", "USERNAME")
          results = []
          cases = [("inherited", dict(os.environ)), ("no_profile", {k:v for k,v in os.environ.items() if k.upper() not in ("USERPROFILE", "HOMEDRIVE", "HOMEPATH")}), ("no_programdata", {k:v for k,v in os.environ.items() if k.upper() != "PROGRAMDATA"}), ("bazel_minimal", {k:v for k,v in os.environ.items() if k.upper() in ("SYSTEMROOT", "WINDIR", "COMSPEC", "TEMP", "TMP", "PATH")})]
          cases.append(("bazel_plus_programdata", {k:v for k,v in os.environ.items() if k.upper() in ("SYSTEMROOT", "WINDIR", "COMSPEC", "TEMP", "TMP", "PATH", "PROGRAMDATA")}))
          with tempfile.TemporaryDirectory(prefix="hepta-openssh-startup-") as temporary:
              for label, env in cases:
                  result = subprocess.run([str(keygen), "-v", "-t", "ed25519", "-N", "", "-f", str(pathlib.Path(temporary) / label)], env=env, capture_output=True, timeout=10)
                  results.append({"label":label, "returncode":result.returncode, "stderr":result.stderr.decode("utf-8", "replace"), "stdout":result.stdout.decode("utf-8", "replace"), "environment_present":{key:any(k.upper()==key for k in env) for key in selected}})
          print(json.dumps({"keygen_sha256":hashlib.sha256(keygen.read_bytes()).hexdigest(), "startup":results}, sort_keys=True))
          '@ | python -
      - name: Run both complete Windows consumer targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'ProgramData inherited: %s; PROGRAMDATA inherited: %s\n' "${ProgramData+yes}" "${PROGRAMDATA+yes}"
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --platforms=//:windows_x86_64_msvc \
            --skip_incompatible_explicit_targets \
            --test_tag_filters=-argument-comment-lint \
            --test_verbose_timeout_warnings \
            --test_output=all \
            --cache_test_results=no \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            //codex-rs/hepta-operator-acceptance:hepta-operator-acceptance-tests \
            //codex-rs/hepta-shadow-qualification:hepta-shadow-qualification-tests
      - name: Bind complete original test identities, captured sources, and binaries
        shell: pwsh
        run: |
          @'
          import ctypes, hashlib, json, os, pathlib, re, subprocess
          expected = {"hepta-operator-acceptance:hepta-operator-acceptance-tests":["ceremony::tests::v1_paths_are_exact_and_sidecar_is_a_strict_child","durable::windows::directory_sync_tests::directory_flush_preserves_the_native_missing_path_error","durable::windows::directory_sync_tests::directory_flush_rejects_regular_files_and_junctions","durable::windows::directory_sync_tests::writable_directory_handle_flushes_and_read_only_handle_reports_denial","durable::windows::tests::hardlinked_artifacts_are_rejected_before_reading_or_hashing","durable::windows::tests::hardlinks_added_after_open_are_rejected","durable::windows::tests::path_replacement_after_open_is_rejected","g5_trust::tests::exact_head_and_predecessor_binding_is_required","g5_trust::tests::expiry_is_half_open_and_never_creates_acceptance","g5_trust::tests::fresh_head_scoped_challenge_reaches_ready_without_authority","g5_trust::tests::independently_signed_challenge_is_verified_but_not_accepted","g5_trust::tests::policy_and_revocation_files_must_be_canonical","g5_trust::tests::revocation_digest_change_invalidates_existing_challenge","g5_trust::tests::revocation_is_external_and_fail_closed_before_challenge_issuance","manifest_inventory::tests::manifest_parser_requires_sorted_safe_unique_paths","manifest_inventory::tests::verified_manifest_rejects_extra_files_and_hardlinks","preflight::tests::every_missing_or_wrong_formal_environment_pin_is_rejected","sshsig::tests::actual_openssh_framing_boundaries_match_without_widening_the_envelope","sshsig::tests::actual_openssh_signatures_match_for_both_hashes_and_all_bindings","sshsig::tests::captured_signature_verification_does_not_reopen_mutable_oracle_files","tests::durable_time_watermark_rejects_clock_rollback","tests::exact_challenge_boundary_accepts_only_operator_acceptance","tests::exact_replay_returns_same_receipt_and_conflicting_claim_fails","tests::final_consumption_at_expiry_creates_no_claim_or_receipt","tests::read_only_lock_never_creates_missing_state","tests::receipt_repeated_authority_must_match_exact_boundary","tests::unknown_or_noncanonical_stored_json_is_rejected","tests::validity_window_is_half_open_and_policy_bounded","trust::tests::sshsig_verifies_only_exact_namespace_against_pinned_policy","trust::tests::trust_policy_digest_is_external_and_fail_closed","trust::tests::trust_policy_pins_store_principal_fingerprint_and_allowed_signers","trust::tests::weak_ed25519_public_key_is_rejected_before_openssh"],"hepta-shadow-qualification:hepta-shadow-qualification-tests":["child_tests::drains_and_bounds_stderr_while_hashing_the_full_stream","child_tests::persists_inbound_wire_before_rejecting_invalid_json","driver_tests::app_and_mcp_fsm_persist_before_every_sample_write","driver_tests::failed_pipe_write_keeps_durable_pre_send_and_poisoned_fsm","durable::windows::tests::directory_flush_preserves_the_native_missing_path_error","durable::windows::tests::directory_flush_rejects_regular_files_and_junctions","durable::windows::tests::writable_directory_handle_flushes_and_read_only_handle_reports_denial","importer_tests::imports_exactly_four_artifacts_and_writes_a_checkpoint","importer_tests::inventories_all_broken_samples_before_checkpointing_failure","lane_e_closure_tests::lane_e_causal_candidate_chain_is_digest_bound_and_deny_all","loopback_tests::persists_exact_http_requests_and_responses","observer_tests::rejects_noncanonical_input_before_writing_an_artifact","observer_tests::rejects_out_of_order_or_incomplete_runs_without_minting_tokens","observer_tests::returns_tokens_only_after_four_private_durable_pairs","oracle_tests::loads_the_embedded_frozen_oracle","oracle_tests::rejects_nonofficial_or_mutated_oracle_bytes","product_receipts_tests::validates_exact_row_and_rejects_index_drift","report_tests::inventories_import_semantic_duplicate_and_missing_failures","report_tests::writes_an_exact_report_with_no_authority","request_tests::parses_the_frozen_app_server_pair","request_tests::parses_the_frozen_mcp_pair","request_tests::rejects_noncanonical_or_multiline_requests","runtime_tests::creates_private_surface_layouts_and_strict_configs","runtime_tests::rejects_an_unpinned_product_binary","sealer_tests::rejects_a_checkpoint_changed_before_sealing","sealer_tests::seals_a_complete_checkpoint_with_every_gate_disabled","sealer_tests::seals_a_failed_checkpoint_without_losing_failures","semantic_verifier_tests::normalizes_dynamic_identity_and_matches_oracle_bytes","semantic_verifier_tests::rejects_semantic_or_identity_divergence","session_tests::extracts_only_bounded_dynamic_identifiers","session_tests::requires_an_explicit_response_result","transport_tests::detects_transport_artifact_changes_after_capture","trial_tests::rejects_an_unbounded_trial_before_creating_runtime_state","value_learning_tests::objective_to_ndu_to_independent_learning_ledger_is_replayable_and_revocable"]}
          source_pins = {".bazelrc":{"bytes":14167,"sha256":"7023e252d79fe23bbc5fdc96f0e01d85d4f3e85b924e456966ee98beb78a0a66"},"codex-rs/hepta-operator-acceptance/src/durable.rs":{"bytes":14980,"sha256":"972d8372b9170b2a6697e1ecea4f8cd90383d4e1b22ce7002677e9381e409f98"},"codex-rs/hepta-operator-acceptance/src/durable_windows.rs":{"bytes":4089,"sha256":"70603dc4a1263ec430fedfd2b8c9f4da5747c7c5e69aa741fe7335a59621de19"},"codex-rs/hepta-operator-acceptance/src/durable_windows_sync_tests.rs":{"bytes":2058,"sha256":"1d15efce4a9637a0158ec0d251b15e6487d426fcbfde4fa9ee665067c11d5174"},"codex-rs/hepta-operator-acceptance/src/g5_trust.rs":{"bytes":33177,"sha256":"1c13345f3e49e17a4d7acd5f2a905872eb417698315345ab48bac1ffa35f93be"},"codex-rs/hepta-operator-acceptance/src/g5_trust_tests.rs":{"bytes":14747,"sha256":"5da1dfbf4a290d39a1730f855237e144af197f194e8a1077332dd192a283ae42"},"codex-rs/hepta-operator-acceptance/src/lib.rs":{"bytes":15460,"sha256":"1810ba92797051b341bcbd41e2572df91bec25ec9752f33f83345395535cdcd7"},"codex-rs/hepta-operator-acceptance/src/sshsig.rs":{"bytes":6659,"sha256":"d8c24c66cce70862ce7239b0ad60bffdb67106558f43ca5b533c7f444ea3c51d"},"codex-rs/hepta-operator-acceptance/src/sshsig_tests.rs":{"bytes":13745,"sha256":"6739af4f6aac005e5083df6b21b50aeff3086cc460096d50502d00030935bcb8"},"codex-rs/hepta-operator-acceptance/src/test_support.rs":{"bytes":1456,"sha256":"00d160e91e4c279ae4f2c65c395ff19c532f14dd74ce68f4097a918e5959e703"},"codex-rs/hepta-operator-acceptance/src/trust.rs":{"bytes":14947,"sha256":"9a34ab7288d213b72b1444225bbda1855bda697bfc60f2487375756722e6dd53"},"codex-rs/hepta-operator-acceptance/src/trust_tests.rs":{"bytes":9105,"sha256":"996a21791336000b06d0d234a461267fd5c8831786cf5351212f49ab8f68b3a2"},"codex-rs/hepta-shadow-qualification/src/durable.rs":{"bytes":5551,"sha256":"f4cc1f71b97b464479bc600810b55a8206997693abeaeaf03235315d5bbf718b"},"codex-rs/hepta-shadow-qualification/src/durable_windows.rs":{"bytes":1220,"sha256":"f1e7f4f9fad69facb99e6852cca5a2a2303bdf36e4e3a5a98b3af6cb3f065e8a"},"codex-rs/hepta-shadow-qualification/src/durable_windows_tests.rs":{"bytes":2058,"sha256":"1d15efce4a9637a0158ec0d251b15e6487d426fcbfde4fa9ee665067c11d5174"}}
          prefix_pins = {"trust_tests.rs":{"bytes":3871,"sha256":"5713ed91884101b068511595ad63ee61326732365d962ecd0a41ac4908ba5bfa"},"g5_trust_tests.rs":{"bytes":9202,"sha256":"a02e71a4062e11353d210263a8de6393c4af2114a081dedd6271d5a10b69d02b"}}
          evidence = {"head": os.environ["GITHUB_SHA"], "runner_os": os.environ["RUNNER_OS"], "runner_arch": os.environ["RUNNER_ARCH"], "targets": {}, "files": {}}
          for label, names in expected.items():
              package, target = label.split(":")
              path = pathlib.Path("bazel-testlogs/codex-rs") / package / target / "test.log"
              data = path.read_bytes()
              log = data.decode("utf-8")
              cases = re.findall(r"^test ([^\r\n]+) \.\.\. (ok|FAILED|ignored)\r?$", log, re.MULTILINE)
              assert sorted(name for name, result in cases) == names, (label, cases)
              assert all(result == "ok" for name, result in cases), (label, cases)
              summaries = re.findall(r"test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; (\d+) filtered out;", log)
              assert summaries and sum(int(passed) for passed, filtered in summaries) == len(names), (label, summaries)
              assert all(int(passed) + int(filtered) == len(names) for passed, filtered in summaries), (label, summaries)
              binary_target = target + "-bin" if package == "hepta-operator-acceptance" else target
              binary = pathlib.Path("bazel-bin/codex-rs") / package / (binary_target + ".exe")
              raw = binary.read_bytes()
              evidence["targets"][label] = {"tests": cases, "test_log_bytes": len(data), "test_log_sha256": hashlib.sha256(data).hexdigest(), "binary": binary.as_posix(), "binary_bytes": len(raw), "binary_sha256": hashlib.sha256(raw).hexdigest()}
          paths = list(source_pins) + ["codex-rs/hepta-operator-acceptance/BUILD.bazel", "codex-rs/hepta-shadow-qualification/BUILD.bazel", "codex-rs/Cargo.toml", "codex-rs/Cargo.lock", "MODULE.bazel", "MODULE.bazel.lock"]
          for name in paths:
              data = pathlib.Path(name).read_bytes()
              assert data == subprocess.check_output(["git", "show", os.environ["GITHUB_SHA"] + ":" + name]), name
              pin = {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
              if name in source_pins:
                  assert pin == source_pins[name], (name, pin)
              evidence["files"][name] = pin
          for name, pin in prefix_pins.items():
              data = pathlib.Path("codex-rs/hepta-operator-acceptance/src", name).read_bytes().split(b"struct TrustFixture {", 1)[0]
              assert {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()} == pin, name
          evidence["original_test_prefixes"] = prefix_pins
          buffer = ctypes.create_unicode_buffer(32768)
          count = ctypes.windll.kernel32.GetSystemDirectoryW(buffer, len(buffer))
          assert 0 < count < len(buffer)
          keygen = pathlib.Path(buffer.value) / "OpenSSH" / "ssh-keygen.exe"
          keygen_data = keygen.read_bytes()
          evidence["openssh_oracle"] = {"path": str(keygen), "bytes": len(keygen_data), "sha256": hashlib.sha256(keygen_data).hexdigest(), "paired_comparisons": 90}
          out = pathlib.Path("windows-consumer-native-evidence")
          out.mkdir()
          (out / "source-and-tests.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, sort_keys=True))
          '@ | python -
      - name: Upload native Windows consumer evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-consumer-native-evidence
          path: windows-consumer-native-evidence
          if-no-files-found: error
