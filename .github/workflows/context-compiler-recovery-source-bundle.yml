name: context-compiler-recovery-source-bundle

on:
  push:
    branches:
      - codex/context-compiler-recovery-bundle-20260928
    paths:
      - .github/workflows/context-compiler-recovery-source-bundle.yml
      - scripts/apply_context_compiler_*.py
      - scripts/refresh_context_compiler_current_state.py
      - scripts/generate_context_compiler_module_docs.py
      - codex-rs/**
      - docs/modules/context.compiler/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: context-compiler-recovery-source-bundle-${{ github.sha }}
  cancel-in-progress: false

jobs:
  materialize-recovery-source-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev pkg-config

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt

      - name: Install cargo-deny
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-deny@0.19.0

      - name: Materialize direct V3 and recovery source ephemerally
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/context-recovery-bundle/logs"
          status=0
          {
            python3 -B scripts/apply_context_compiler_v3_source.py
            python3 -B scripts/apply_context_compiler_current_closure.py
            python3 -B scripts/apply_context_compiler_v3_interface_fix.py
            python3 -B scripts/apply_context_compiler_v3_regressions.py
            python3 -B scripts/apply_context_compiler_recovery_activation.py
            python3 -B scripts/apply_context_compiler_recovery_cleanup.py
            python3 -B scripts/apply_context_compiler_agentd_recovery_v2.py
            python3 -B scripts/apply_context_compiler_recovery_tests.py
            python3 -B scripts/apply_context_compiler_recovery_test_cleanup.py
            python3 -B scripts/apply_context_compiler_qualification_closure.py
          } 2>&1 | tee "$RUNNER_TEMP/context-recovery-bundle/logs/materialize.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/context-recovery-bundle/materialize.exit"

      - name: Register deterministic property-test dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          workspace = Path('codex-rs/Cargo.toml')
          text = workspace.read_text(encoding='utf-8')
          if 'proptest = ' not in text:
              anchor = 'pretty_assertions = "1.4.1"\n'
              if anchor not in text:
                  raise SystemExit('workspace dependency anchor drifted')
              text = text.replace(anchor, anchor + 'proptest = "1.9.0"\n', 1)
          workspace.write_text(text, encoding='utf-8')
          crate = Path('codex-rs/hepta-context-compiler/Cargo.toml')
          text = crate.read_text(encoding='utf-8')
          if '[dev-dependencies]' not in text:
              text = text.rstrip() + '\n\n[dev-dependencies]\nproptest = { workspace = true }\n'
          elif 'proptest' not in text.split('[dev-dependencies]', 1)[1]:
              text = text.replace('[dev-dependencies]\n', '[dev-dependencies]\nproptest = { workspace = true }\n', 1)
          crate.write_text(text, encoding='utf-8')
          PY

      - name: Format, resolve, and regenerate canonical truth
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            cd codex-rs
            cargo fmt --all
            cargo metadata --format-version 1 > /dev/null
            cd ..
            python3 -B scripts/refresh_context_compiler_current_state.py
            python3 -B scripts/apply_context_compiler_recovery_state.py
            python3 -B scripts/generate_context_compiler_module_docs.py --write
            python3 -B scripts/generate_context_compiler_module_docs.py --check
            python3 -B scripts/test_context_compiler_state.py
            python3 -B scripts/test_context_compiler_candidate.py
            python3 -B scripts/test_context_compiler_execution.py
          } 2>&1 | tee "$RUNNER_TEMP/context-recovery-bundle/logs/normalize.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/context-recovery-bundle/normalize.exit"

      - name: Verify default V3 and legacy compatibility profiles
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            cargo test --locked \
              -p codex-hepta-prompt-registry \
              -p codex-hepta-context-compiler \
              -p codex-hepta-intelligence \
              -p codex-extension-api \
              -p codex-core \
              -p codex-api \
              -p codex-hepta-agentd \
              -p codex-hepta-prompt-extension
            cargo test --locked -p codex-hepta-intelligence --features legacy-prompt-context-v1
            cargo test --locked -p codex-hepta-agentd --features legacy-prompt-context-v1
            cargo test --locked -p codex-api context_slot
            cargo test --locked -p codex-hepta-intelligence prompt_product_v3
            cargo test --locked -p codex-hepta-agentd registry_race_tests
            cargo test --locked -p codex-hepta-agentd exact_context_delivery
            cargo clippy --locked \
              -p codex-hepta-prompt-registry \
              -p codex-hepta-context-compiler \
              -p codex-hepta-intelligence \
              -p codex-extension-api \
              -p codex-core \
              -p codex-api \
              -p codex-hepta-agentd \
              -p codex-hepta-prompt-extension \
              --all-targets --all-features -- -D warnings
            cargo deny --locked check bans licenses sources
          } 2>&1 | tee "$RUNNER_TEMP/context-recovery-bundle/logs/verify.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/context-recovery-bundle/verify.exit"

      - name: Verify expected direct-source reachability
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            git diff --check
            test -n "$(git status --porcelain=v1 --untracked-files=all)"
            test -f codex-rs/hepta-context-compiler/src/v2/recovery.rs
            grep -Fq 'mod context_authority;' codex-rs/hepta-prompt-registry/src/lib.rs
            grep -Fq 'mod prompt_product_v3;' codex-rs/hepta-intelligence/src/lib.rs
            grep -Fq 'mod prompt_product_v3;' codex-rs/hepta-agentd/src/lib.rs
            grep -Fq 'compile_and_stage_v3' codex-rs/hepta-agentd/src/prompt_runtime.rs
            grep -Fq 'mod recovery;' codex-rs/hepta-context-compiler/src/v2.rs
          } 2>&1 | tee "$RUNNER_TEMP/context-recovery-bundle/logs/reachability.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/context-recovery-bundle/reachability.exit"

      - name: Export complete ordinary-source candidate
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_IMAGE: ${{ runner.image }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'context-recovery-bundle'
          files_root = out / 'files'
          files_root.mkdir(parents=True, exist_ok=True)

          def names(args):
              raw = subprocess.check_output(args)
              return [p.decode('utf-8') for p in raw.split(b'\0') if p]

          deleted = sorted(set(names(['git', 'diff', '--diff-filter=D', '--name-only', '-z', 'HEAD'])))
          changed = set(names(['git', 'diff', '--diff-filter=ACMRTUXB', '--name-only', '-z', 'HEAD']))
          changed.update(names(['git', 'ls-files', '--others', '--exclude-standard', '-z']))
          changed = sorted(path for path in changed if path not in deleted)

          digests = {}
          for name in changed:
              source = pathlib.Path(name)
              target = files_root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              digests[name] = hashlib.sha256(source.read_bytes()).hexdigest()

          for name, value in (
              ('changed-paths.json', changed),
              ('deleted-paths.json', deleted),
              ('file-sha256.json', digests),
          ):
              (out / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with (out / 'materialized.patch').open('wb') as handle:
              subprocess.run(['git', 'diff', '--binary', 'HEAD'], stdout=handle, check=True)
          subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              stdout=(out / 'status.txt').open('wb'), check=True,
          )
          metadata = {
              'source_commit': os.environ['SOURCE_SHA'],
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'workflow_ref': os.environ.get('WORKFLOW_REF', ''),
              'workflow_sha': os.environ.get('WORKFLOW_SHA', ''),
              'run_id': os.environ['RUN_ID'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'runner_image': os.environ.get('RUNNER_IMAGE', ''),
              'runner_os': os.environ.get('RUNNER_OS', ''),
              'runner_arch': os.environ.get('RUNNER_ARCH', ''),
              'rustc': subprocess.check_output(['rustc', '-Vv'], text=True),
              'cargo': subprocess.check_output(['cargo', '-V'], text=True).strip(),
              'changed_paths': changed,
              'deleted_paths': deleted,
          }
          (out / 'bundle-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          find "$RUNNER_TEMP/context-recovery-bundle" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/context-recovery-bundle/artifact-files.sha256"

      - name: Upload immutable source bundle and verification logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: context-recovery-source-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-recovery-bundle
          if-no-files-found: error
          retention-days: 14

      - name: Require successful materialization and verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/context-recovery-bundle/materialize.exit")" = 0
          test "$(cat "$RUNNER_TEMP/context-recovery-bundle/normalize.exit")" = 0
          test "$(cat "$RUNNER_TEMP/context-recovery-bundle/verify.exit")" = 0
          test "$(cat "$RUNNER_TEMP/context-recovery-bundle/reachability.exit")" = 0
