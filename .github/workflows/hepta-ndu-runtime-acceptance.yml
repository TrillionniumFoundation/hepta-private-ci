name: NDU recovery and operational acceptance
on:
  push:
    branches: [work/utility-ndu-recovery-observability-20260928]
    paths:
      - .github/workflows/hepta-ndu-runtime-acceptance.yml
      - scripts/ndu-bootstrap-*.b64
      - scripts/ndu-epoch-archive-*.b64
      - scripts/hepta*ndu*.py
      - scripts/test_hepta_ndu*.py
      - codex-rs/hepta-ndu/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-agent-protocol/**
      - docs/modules/utility.ndu/**
permissions:
  contents: read
concurrency:
  group: ndu-recovery-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
      base: ${{ steps.source.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Commit normalized actual source and exact object inventory
        id: source
        env:
          REQUEST_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          BASE=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$BASE" HEAD
          # Bootstrap patches are consumed, removed, and committed as actual
          # source. Later pushes work without a patch or a fixed predecessor.
          if test -f scripts/ndu-bootstrap-01.b64; then
            cat scripts/ndu-bootstrap-0{1,2,3,4}.b64 | base64 --decode | gzip -d > "$RUNNER_TEMP/ndu.patch"
            echo '6d75d61ce7ad5ea9622d8990fa30a7cebe031fc16b5b586581535dd8747afc93'"  $RUNNER_TEMP/ndu.patch" | sha256sum -c -
            # Workflow changes are published by the authorized connector, not
            # by a job token. Verify their exact reviewed bytes before excluding
            # those two paths from the already checksum-verified source patch.
            test "$(git hash-object .github/workflows/hepta-ndu-evidence-publication.yml)" = 702a56e52aa6aeba09e8b737fb56d696888c94ca
            test "$(git hash-object .github/workflows/hepta-ndu-recursion.yml)" = 77cee8bece4bd75fbfb146f56ab67c9c65719597
            EXCLUDES=(--exclude=.github/workflows/hepta-ndu-evidence-publication.yml --exclude=.github/workflows/hepta-ndu-recursion.yml)
            git apply --check --index "${EXCLUDES[@]}" "$RUNNER_TEMP/ndu.patch"
            git apply --index "${EXCLUDES[@]}" "$RUNNER_TEMP/ndu.patch"
            git rm scripts/ndu-bootstrap-0{1,2,3,4}.b64
          fi
          if test -f scripts/ndu-epoch-archive-01.b64; then
            cat scripts/ndu-epoch-archive-*.b64 | base64 --decode | gzip -d > "$RUNNER_TEMP/ndu-epoch-archive.patch"
            echo '41b314a3a130d98e799cfaa966837d1c698cb40fb5228702a35a6842d6090e45  '"$RUNNER_TEMP/ndu-epoch-archive.patch" | sha256sum -c -
            git apply --check --index "$RUNNER_TEMP/ndu-epoch-archive.patch"
            git apply --index "$RUNNER_TEMP/ndu-epoch-archive.patch"
            git rm scripts/ndu-epoch-archive-*.b64
          fi
          (cd codex-rs && cargo fmt --package codex-hepta-ndu --package codex-hepta-agent-protocol --package codex-hepta-agentd)
          for test in source_policy map_integrity mounted_filesystem qualification evidence observer; do
            python3 "scripts/test_hepta_ndu_$test.py"
          done
          git add -A
          python3 scripts/hepta_ndu_map_integrity.py --rebind-index --candidate-branch "$GITHUB_REF_NAME" --baseline-main "$BASE"
          git add docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
          git diff --cached --check
          git config user.name hepta-ndu-remediation
          git config user.email qualification@invalid
          if ! git diff --cached --quiet; then
            git commit -s -m 'feat(ndu): materialize bounded epoch archive and retention semantics'
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/hepta-ndu-implementation-map-closed-world.py --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})"
          git merge-base --is-ancestor "$REQUEST_SHA" HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ndu-source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ndu-source/IDENTITY"
          printf '%s\n' "$REQUEST_SHA" "$BASE" > "$RUNNER_TEMP/ndu-source/TRIGGER_AND_BASE"
          git archive HEAD | gzip -n > "$RUNNER_TEMP/ndu-source/source.tar.gz"
          (cd "$RUNNER_TEMP/ndu-source" && sha256sum source.tar.gz IDENTITY TRIGGER_AND_BASE > SHA256SUMS)
      - name: Publish exact descendant without rewriting any branch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = work/utility-ndu-recovery-observability-20260928
          if [ "$(git rev-parse HEAD)" != "$REQUEST_SHA" ]; then
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-runtime-source-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/ndu-source/
          if-no-files-found: error
          retention-days: 30
  qualify:
    needs: prepare
    name: NDU ${{ matrix.lane }} / ${{ matrix.suite }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
        suite: [source, core, callers, product, lint, host]
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source or deterministic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
          checksum: true
      - name: Execute independent suite
        run: python3 scripts/hepta-ndu-qualification.py --suite '${{ matrix.suite }}' --lane '${{ matrix.lane }}' --output '${{ runner.temp }}/ndu-${{ matrix.lane }}-${{ matrix.suite }}'
      - name: Retain every command log and exact candidate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-runtime-${{ matrix.lane }}-${{ matrix.suite }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-${{ matrix.lane }}-${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: [prepare, qualify]
    runs-on: ubuntu-22.04
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ndu-runtime-*-*-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-evidence
      - name: Independently revalidate all twelve native suites and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
          export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
          export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
          export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
          MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
          python3 scripts/hepta_ndu_evidence.py aggregate --root "$RUNNER_TEMP/ndu-evidence" --source "$SOURCE_SHA" --base "$BASE_SHA" --merge "$MERGE" --output "$RUNNER_TEMP/ndu-evidence/aggregate.json"
          python3 scripts/hepta_ndu_evidence.py seal --root "$RUNNER_TEMP/ndu-evidence"
          python3 scripts/hepta_ndu_evidence.py verify --root "$RUNNER_TEMP/ndu-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-qualified-evidence-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-evidence/
          if-no-files-found: error
          retention-days: 30
