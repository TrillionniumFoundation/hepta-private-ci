name: Hepta knowledge.graph qualification repair (temporary)

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - .github/workflows/hepta-kg-repair-temporary.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-kg-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          # Keep production registry mutation private.  Cross-crate tests receive
          # a feature-gated fixture capability instead of widening product APIs.
          manifest = Path("codex-rs/hepta-prompt-registry/Cargo.toml")
          text = manifest.read_text()
          if "[features]" not in text:
              text = text.replace(
                  "[lints]\nworkspace = true\n",
                  "[features]\ndefault = []\nfixture = []\n\n[lints]\nworkspace = true\n",
                  1,
              )
          manifest.write_text(text)

          registry = Path("codex-rs/hepta-prompt-registry/src/lib.rs")
          text = registry.read_text()
          text = text.replace(
              "#[cfg(test)]\n    pub(crate) fn admit_factor(",
              "#[cfg(any(test, feature = \"fixture\"))]\n    pub(crate) fn admit_factor(",
              1,
          )
          text = text.replace(
              "#[cfg(test)]\n    pub(crate) fn revoke_factor(",
              "#[cfg(any(test, feature = \"fixture\"))]\n    pub(crate) fn revoke_factor(",
              1,
          )
          marker = "\n#[cfg(test)]\n#[path = \"lib_tests.rs\"]\nmod tests;\n"
          if marker not in text:
              raise SystemExit("prompt registry test marker not found")
          fixture = r'''

          /// Test-only owner fixture. Enabling this Cargo feature does not grant
          /// production mutation authority; it only exposes deterministic setup
          /// operations to dependent-crate tests.
          #[cfg(feature = "fixture")]
          pub mod fixture {
              use super::*;

              #[derive(Clone, Debug, Eq, PartialEq)]
              pub struct PromptRegistryFixture {
                  registry: PromptRegistry,
              }

              impl PromptRegistryFixture {
                  pub fn new(maximum_records: usize) -> Result<Self, Error> {
                      PromptRegistry::new(maximum_records).map(|registry| Self { registry })
                  }

                  pub fn register_factor(
                      &mut self,
                      factor: PromptFactor,
                  ) -> Result<RegistryReceipt, Error> {
                      self.registry.register_factor(factor)
                  }

                  pub fn admit_factor(
                      &mut self,
                      factor_id: &StableId,
                      reviewer_id: &StableId,
                      evidence_digest: Digest32,
                  ) -> Result<RegistryReceipt, Error> {
                      self.registry
                          .admit_factor(factor_id, reviewer_id, evidence_digest)
                  }

                  pub fn register_factor_relation(
                      &mut self,
                      relation: PromptFactorRelation,
                  ) -> Result<RegistryReceipt, Error> {
                      self.registry.register_factor_relation(relation)
                  }

                  pub fn revoke_factor(
                      &mut self,
                      factor_id: &StableId,
                  ) -> Result<RegistryReceipt, Error> {
                      self.registry.revoke_factor(factor_id)
                  }

                  #[must_use]
                  pub fn factor_graph_source_v1(&self) -> PromptFactorGraphSourceV1 {
                      self.registry.factor_graph_source_v1()
                  }

                  #[must_use]
                  pub const fn revision(&self) -> Revision {
                      self.registry.revision()
                  }
              }
          }
          '''
          if "pub mod fixture" not in text:
              text = text.replace(marker, fixture + marker, 1)
          registry.write_text(text)

          for path in [
              "codex-rs/hepta-kg/Cargo.toml",
              "codex-rs/hepta-prompt-optimizer/Cargo.toml",
          ]:
              file = Path(path)
              text = file.read_text()
              dev = "codex-hepta-prompt-registry = { path = \"../hepta-prompt-registry\", features = [\"fixture\"] }"
              if dev not in text:
                  if "[dev-dependencies]" in text:
                      text = text.replace("[dev-dependencies]\n", f"[dev-dependencies]\n{dev}\n", 1)
                  else:
                      text += f"\n[dev-dependencies]\n{dev}\n"
              file.write_text(text)

          for path in [
              "codex-rs/hepta-kg/src/prompt_factor_tests.rs",
              "codex-rs/hepta-prompt-optimizer/src/graph_tests.rs",
          ]:
              file = Path(path)
              text = file.read_text()
              text = text.replace(
                  "use codex_hepta_prompt_registry::PromptRegistry;",
                  "use codex_hepta_prompt_registry::fixture::PromptRegistryFixture;",
              )
              text = text.replace("PromptRegistry::new(", "PromptRegistryFixture::new(")
              text = text.replace("&mut PromptRegistry,", "&mut PromptRegistryFixture,")
              text = text.replace("-> PromptRegistry {", "-> PromptRegistryFixture {")
              # Fill the new governed semantic metadata in older dependent fixtures.
              needle = "semantic_version: id(\"v1\"),\n                content_digest:"
              if needle in text:
                  text = text.replace(
                      needle,
                      "semantic_version: id(\"v1\"),\n"
                      "                semantic_purpose: \"verify before mutating\".to_owned(),\n"
                      "                authority_class: \"registered_prompt_factor\".to_owned(),\n"
                      "                eligible_objective_dimensions: vec![id(\"dimension:truth\")],\n"
                      "                content_digest:",
                  )
              needle = "semantic_version: id(\"semantic:v1\"),\n            content_digest:"
              if needle in text:
                  text = text.replace(
                      needle,
                      "semantic_version: id(\"semantic:v1\"),\n"
                      "            semantic_purpose: \"verify before mutating\".to_owned(),\n"
                      "            authority_class: \"registered_prompt_factor\".to_owned(),\n"
                      "            eligible_objective_dimensions: vec![id(\"dimension:truth\")],\n"
                      "            content_digest:",
                  )
              file.write_text(text)

          replace_once(
              "codex-rs/hepta-memory/src/cognitive_kg_history_tests.rs",
              "                reason: reason.to_string(),\n                valid_from_unix_seconds: 100,",
              "                reason: reason.to_string(),\n                citations: Vec::new(),\n                valid_from_unix_seconds: 100,",
          )

          delivery = Path("codex-rs/hepta-memory/tests/kg_delivery_consistency.rs")
          text = delivery.read_text()
          anchor = "    let second_draft = correction(\"The second correction wins or rolls back.\");\n\n    let (first_result, second_result) = tokio::join!("
          replacement = (
              "    let second_draft = correction(\"The second correction wins or rolls back.\");\n"
              "    let first_facts = KgFactSetDraft::default();\n"
              "    let second_facts = KgFactSetDraft::default();\n\n"
              "    let (first_result, second_result) = tokio::join!("
          )
          if anchor not in text:
              raise SystemExit("delivery consistency join anchor not found")
          text = text.replace(anchor, replacement, 1)
          first = text.find("&KgFactSetDraft::default(),", text.find("let (first_result"))
          if first < 0:
              raise SystemExit("first temporary fact set not found")
          text = text[:first] + "&first_facts," + text[first + len("&KgFactSetDraft::default(),"):]
          second = text.find("&KgFactSetDraft::default(),", first)
          if second < 0:
              raise SystemExit("second temporary fact set not found")
          text = text[:second] + "&second_facts," + text[second + len("&KgFactSetDraft::default(),"):]
          delivery.write_text(text)

          replace_once(
              "codex-rs/hepta-kg/src/incremental.rs",
              "    Ok(generation.get() % every_generations == 0)",
              "    Ok(generation.get().is_multiple_of(every_generations))",
          )

          guard = Path("scripts/hepta_kg_legacy_guard.py")
          text = guard.read_text()
          old = '''    for line in output.splitlines():
                  path = line.split(":", 1)[0]
                  if not path.startswith("codex-rs/hepta-kg/"):
                      raise LegacyGuardError(f"legacy-v1 Rust cfg escaped codex-hepta-kg: {line}")
          '''
          new = '''    cfg_pattern = re.compile(r"\\bcfg(?:_attr)?\\s*\\([^)]*legacy-v1")
              for line in output.splitlines():
                  path, _, source_line = line.partition(":")
                  if not cfg_pattern.search(source_line):
                      continue
                  if not path.startswith("codex-rs/hepta-kg/"):
                      raise LegacyGuardError(f"legacy-v1 Rust cfg escaped codex-hepta-kg: {line}")
          '''
          # Account for the script's actual four-space indentation.
          old = old.replace("              ", "")
          new = new.replace("          ", "")
          if old not in text:
              raise SystemExit("legacy guard loop not found")
          guard.write_text(text.replace(old, new, 1))
          PY

      - name: Format affected Rust crates
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-kg --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer --package codex-hepta-memory \
            --package codex-hepta-agentd

      - name: Verify repaired qualification surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_kg_legacy_guard.py
          python3 -m unittest discover -s scripts -p 'test_hepta_kg_*.py' -v
          cd codex-rs
          cargo test -p codex-hepta-kg -p codex-hepta-prompt-optimizer --no-fail-fast
          cargo clippy -p codex-hepta-kg --all-targets -- -D warnings

      - name: Commit bounded repairs and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/hepta-kg-source-export-temporary.yml \
            .github/workflows/hepta-kg-source-export-macos-temporary.yml \
            .github/workflows/hepta-kg-repair-temporary.yml
          git diff --check
          test -n "$(git status --porcelain)"
          git config user.name "Hepta KG repair"
          git config user.email "hepta-kg-ci@users.noreply.github.com"
          git add -A
          git commit -s -m "fix(knowledge.graph): restore exact-head qualification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
