name: Inference worker materializer diagnostic

on:
  push:
    branches:
      - automation/inference-worker-materialize-final-20260930
    paths:
      - .github/workflows/inference-worker-materializer-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-materializer-diagnostic
  cancel-in-progress: true

env:
  SOURCE_SHA: 3a4d0e6bb7018c77e9443a38855d69146542febe
  STAGING_BRANCH: automation/inference-worker-materialize-final-20260930
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  diagnose:
    name: Diagnose reviewed materializer
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out exact authoritative source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Run materializer and persist exact probe
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/inference-worker-materializer.log"
          {
            echo "source_sha=$SOURCE_SHA"
            echo "python=$(python3 --version 2>&1)"
            echo "working_tree=$(git rev-parse HEAD)"
            echo "--- materializer output ---"
          } > "$log"
          set +e
          python3 .github/materialization/inference-worker-runtime-closure/apply.py >> "$log" 2>&1
          status=$?
          set -e
          echo "--- materializer_exit_status=$status ---" >> "$log"

          if [[ "$status" -eq 0 ]]; then
            python3 - <<'PY' >> "$log" 2>&1
          from pathlib import Path

          tests = Path("codex-rs/hepta-infer-core/src/native_control_tests.rs").read_text(encoding="utf-8")
          native = Path("codex-rs/hepta-infer-core/src/native_control.rs").read_text(encoding="utf-8")
          checks = {
              "observed_fixture": '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: observed,
              };''',
              "old_output_fixture": '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: old_output,
              };''',
              "legacy_json_anchor": '''    let mut json = serde_json::to_value(event).unwrap();
              json["Observe"]["output"]''',
              "idempotency_anchor": '''        if record.observation.as_ref() == Some(&output)
                  && usage_units.is_none_or(|usage| record.observed_usage_units == Some(usage))
              {
                  return Ok(record.clone());
              }''',
          }
          for name, needle in checks.items():
              haystack = native if name == "idempotency_anchor" else tests
              print(f"probe.{name}.count={haystack.count(needle)}")
          print("probe.native_tests_event_observe_count=" + str(tests.count("let event = Event::Observe")))
          PY
          fi
          cat "$log"

          diagnostic="$RUNNER_TEMP/inference-worker-materializer-${GITHUB_RUN_ID}.log"
          cp "$log" "$diagnostic"
          git reset --hard
          git clean -fd
          git fetch origin "refs/heads/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          git checkout -B "$STAGING_BRANCH" "origin/$STAGING_BRANCH"
          mkdir -p diagnostics
          cp "$diagnostic" "diagnostics/inference-worker-materializer-${GITHUB_RUN_ID}.log"
          git config user.name hepta-inference-diagnostics
          git config user.email hepta-inference-diagnostics@users.noreply.github.com
          git add "diagnostics/inference-worker-materializer-${GITHUB_RUN_ID}.log"
          git commit -m "ci(inference.worker): persist materializer diagnostic ${GITHUB_RUN_ID}"
          git push origin "HEAD:$STAGING_BRANCH"
          exit "$status"
