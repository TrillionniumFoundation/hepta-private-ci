name: context-compiler-source-promotion

on:
  push:
    branches:
      - codex/context-compiler-v3-materialize-isolated-20260928

permissions:
  actions: read
  contents: write

concurrency:
  group: context-compiler-source-promotion-isolated
  cancel-in-progress: true

jobs:
  promote-ordinary-source:
    if: ${{ contains(github.event.head_commit.message, '[promote-context-source]') }}
    runs-on: ubuntu-slim
    timeout-minutes: 90
    env:
      ARTIFACT_ID: '10943028187'
      ARTIFACT_RUN_ID: '36351835045'
      ARTIFACT_SOURCE_SHA: f6f88157da5b1834bd16a2b5c8dd63a61f7c5cfb
      ARTIFACT_SOURCE_TREE: b5141cdc7b3168caba8d84029747b81501e4ac5a
      ARTIFACT_SHA256: 2409320a2b6f20fea33a0a41f198387ae96372fce9f194ce1df1cae63e8feb9b
      REVIEWED_BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
      WORK_BRANCH: codex/context-compiler-v3-materialize-isolated-20260928
      INTEGRATION_BRANCH: codex/context-compiler-v3-closure-20260928
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact materialization input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify isolated materialization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$WORK_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e .github/workflows/context-compiler-v3-remediation.yml
          test "$(git cat-file -t "$ARTIFACT_SOURCE_SHA")" = commit
          test "$(git rev-parse "$ARTIFACT_SOURCE_SHA^{tree}")" = "$ARTIFACT_SOURCE_TREE"
          test "$(git cat-file -t "$REVIEWED_BASE_SHA")" = commit
          git merge-base --is-ancestor "$REVIEWED_BASE_SHA" HEAD
          git merge-base --is-ancestor "$ARTIFACT_SOURCE_SHA" HEAD

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt

      - name: Download and verify immutable source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/context-source"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/context-source.zip"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$RUNNER_TEMP/context-source.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/context-source.zip" -d "$RUNNER_TEMP/context-source"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "context-source"
          metadata = json.loads((root / "bundle-metadata.json").read_text())
          if metadata["run_id"] != os.environ["ARTIFACT_RUN_ID"]:
              raise SystemExit("artifact run identity mismatch")
          if metadata["source_commit"] != os.environ["ARTIFACT_SOURCE_SHA"]:
              raise SystemExit("artifact source identity mismatch")
          if metadata.get("source_tree") not in (None, os.environ["ARTIFACT_SOURCE_TREE"]):
              raise SystemExit("artifact source tree mismatch")
          if (root / "materialize.exit").read_text().strip() != "0":
              raise SystemExit("source materialization did not pass")
          if (root / "normalize.exit").read_text().strip() != "0":
              raise SystemExit("source normalization did not pass")
          expected = json.loads((root / "file-sha256.json").read_text())
          changed = json.loads((root / "changed-paths.json").read_text())
          if sorted(changed) != sorted(expected):
              raise SystemExit("artifact path inventory mismatch")
          for relative in changed:
              source = root / "files" / relative
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual != expected[relative]:
                  raise SystemExit(f"artifact file digest mismatch: {relative}")
          PY

      - name: Overlay reviewed direct source
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "context-source"
          for relative in json.loads((root / "changed-paths.json").read_text()):
              source = root / "files" / relative
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          for relative in json.loads((root / "deleted-paths.json").read_text()):
              Path(relative).unlink(missing_ok=True)
          PY

      - name: Close V3 compile and recovery graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path

          pipeline = Path("codex-rs/hepta-intelligence/src/prompt_pipeline.rs")
          text = pipeline.read_text()
          old = "fn prompt_payload_bundle_digest("
          new = "pub(crate) fn prompt_payload_bundle_digest("
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("prompt payload digest visibility anchor missing")
              pipeline.write_text(text.replace(old, new, 1))

          delivery = Path("codex-rs/hepta-intelligence/src/prompt_delivery.rs")
          text = delivery.read_text()
          import_line = "use crate::prompt_pipeline::prompt_payload_bundle_digest;\n"
          if import_line not in text:
              anchor = "use crate::prompt_pipeline::prepare_prompt_delivery_v1;\n"
              if text.count(anchor) != 1:
                  raise SystemExit("prompt delivery import anchor missing")
              delivery.write_text(text.replace(anchor, anchor + import_line, 1))
          PY
          python3 -B scripts/apply_context_compiler_recovery_activation.py
          python3 -B scripts/apply_context_compiler_agentd_recovery.py
          python3 -B scripts/apply_context_compiler_agentd_recovery_v2.py
          python3 -B scripts/apply_context_compiler_recovery_tests.py
          python3 -B scripts/apply_context_compiler_recovery_test_cleanup.py
          python3 -B scripts/apply_context_compiler_recovery_cleanup.py
          python3 -B scripts/apply_context_compiler_qualification_closure.py

      - name: Generate canonical current-state projections
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          for relative in (
              "docs/modules/context.compiler/CURRENT_STATE.json",
              "docs/modules/context.compiler/MODULE_MANIFEST.json",
          ):
              path = Path(relative)
              value = json.loads(path.read_text())
              value["integrationBranch"] = os.environ["INTEGRATION_BRANCH"]
              path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n")

          provenance = {
              "schema": "hepta.context-compiler.source-bundle-provenance.v1",
              "artifactId": int(os.environ["ARTIFACT_ID"]),
              "artifactRunId": int(os.environ["ARTIFACT_RUN_ID"]),
              "artifactArchiveSha256": os.environ["ARTIFACT_SHA256"],
              "artifactSourceCommit": os.environ["ARTIFACT_SOURCE_SHA"],
              "artifactSourceTree": os.environ["ARTIFACT_SOURCE_TREE"],
              "reviewedBaseCommit": os.environ["REVIEWED_BASE_SHA"],
              "artifactMaterializationExit": 0,
              "artifactNormalizationExit": 0,
              "artifactVerificationWasPassing": False,
              "interpretation": "The immutable bundle supplied reviewed source bytes only. Qualification is performed after ordinary-source composition on the final immutable commit and deterministic synthetic merge.",
          }
          path = Path("qualification/context-compiler/SOURCE_BUNDLE_PROVENANCE.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(provenance, indent=2) + "\n")
          PY
          python3 -B scripts/refresh_context_compiler_current_state.py
          python3 -B scripts/apply_context_compiler_recovery_state.py
          python3 -B scripts/generate_context_compiler_module_docs.py --write
          python3 -B scripts/generate_context_compiler_module_docs.py --check
          python3 -B scripts/test_context_compiler_state.py
          python3 -B scripts/test_context_compiler_candidate.py
          python3 -B scripts/test_context_compiler_execution.py
          git diff --check

      - name: Retire all source writers and commit ordinary source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/apply_context_compiler_v3_source.py \
            scripts/apply_context_compiler_v3_core.py \
            scripts/apply_context_compiler_full_closure.py \
            scripts/apply_context_compiler_hardening.py \
            scripts/apply_context_compiler_current_closure.py \
            scripts/apply_context_compiler_v3_interface_fix.py \
            scripts/apply_context_compiler_v3_regressions.py \
            scripts/apply_context_compiler_recovery_activation.py \
            scripts/apply_context_compiler_recovery_cleanup.py \
            scripts/apply_context_compiler_agentd_recovery.py \
            scripts/apply_context_compiler_agentd_recovery_v2.py \
            scripts/apply_context_compiler_recovery_tests.py \
            scripts/apply_context_compiler_recovery_test_cleanup.py \
            scripts/apply_context_compiler_qualification_closure.py \
            scripts/apply_context_compiler_recovery_state.py \
            scripts/refresh_context_compiler_current_state.py \
            scripts/remediate_context_compiler_closure.py \
            .github/context-compiler-materialize-v3.trigger \
            .github/workflows/context-compiler-v3-source-bundle.yml \
            .github/workflows/context-compiler-source-promotion.yml
          git add --all
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name context-compiler-source-promoter
          git config user.email context-compiler-source-promoter@users.noreply.github.com
          git commit -m "feat(context.compiler): materialize direct V3 recovery source [context-source-fixed] [v3-materialized]"
          git push origin "HEAD:$WORK_BRANCH"
