name: Hepta Matrix SDK security prerequisites (hard gate)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qualification/matrix-security/**'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/deny.toml'
      - 'codex-rs/rust-toolchain.toml'
      - 'codex-rs/hepta-matrix-sdk/**'
      - 'codex-rs/hepta-matrixd/Cargo.toml'
      - 'codex-rs/third_party/matrix-sdk-sqlite-*/**'
      - '.github/workflows/hepta-matrix-security-qualification.yml'

permissions:
  contents: read

concurrency:
  group: matrix-security-prerequisites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-waiver-crypto-migration:
    name: Verify Matrix dependency graph without advisory waivers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Bind exact tested revision
        run: git rev-parse HEAD HEAD^{tree}
      - name: Contract and anti-bypass tests
        run: |
          python3 -m compileall -q qualification/matrix-security
          python3 -m unittest discover -v -s qualification/matrix-security -p 'test_*.py'
      - name: Record lock graph and unresolved security blockers
        if: always()
        run: |
          python3 qualification/matrix-security/matrix_dependency_gate.py \
            --root . --output "$RUNNER_TEMP/hepta-matrix-security-prerequisites.json"
      - name: Preserve read-only audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-matrix-security-prerequisites-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-matrix-security-prerequisites.json
          if-no-files-found: error
          retention-days: 14
      # This MUST fail while Matrix 0.18, anymap2, or any security waiver
      # remains. It supplements rather than substitutes global cargo-deny.
      - name: Non-waivable dependency security gate
        run: python3 qualification/matrix-security/matrix_dependency_gate.py --root . --require-safe
      - name: Ensure checkout was not modified
        if: always()
        run: |
          git diff --check
          git diff --exit-code
  pinned-upstream-source-probe:
    name: Fixed upstream source manifest (candidate only, no execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Read-only checkout of exact upstream revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: matrix-org/matrix-rust-sdk
          ref: b3c07ea6ba6e8e46e30811c0500b04505c4be9f9
          persist-credentials: false
          path: upstream
      - name: Inspect fixed manifests without compiling upstream code
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/matrix-security/upstream_source_probe.py \
            --root . --upstream upstream \
            --expected-sha b3c07ea6ba6e8e46e30811c0500b04505c4be9f9 \
            --output "$RUNNER_TEMP/hepta-matrix-upstream-probe.json"
      - name: Preserve candidate compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-matrix-upstream-compat-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-matrix-upstream-probe.json
          if-no-files-found: error
          retention-days: 14
      - name: No tracked repo mutations
        if: always()
        run: |
          git diff --check
          git diff --exit-code

  minimal-anymap-backport-source-probe:
    name: Minimal signed-release anymap3 backport (read-only source check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Read upstream 0.19.1 signed release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: matrix-org/matrix-rust-sdk
          ref: b18166c68bb958a21f0bca8b2d8320cb53583362
          path: upstream-release
          fetch-depth: 1
          persist-credentials: false
      - name: Read exact upstream anymap3 migration and its parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: matrix-org/matrix-rust-sdk
          ref: 9c5fdd2cf5be1b7b8b20541e56d7a109db968534
          path: upstream-anymap-commit
          fetch-depth: 2
          persist-credentials: false
      - name: Verify only upstream source hunks apply to published release
        run: |
          python3 qualification/matrix-security/minimal_backport_probe.py \
            --release upstream-release --migration upstream-anymap-commit \
            --output "$RUNNER_TEMP/hepta-matrix-minimal-backport.json"
      - name: Upload exact-commit source compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-matrix-minimal-anymap3-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-matrix-minimal-backport.json
          if-no-files-found: warn
          retention-days: 14
      - name: Source tracked files unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code

  disposable-cargo-resolution-probe:
    name: Disposable pinned SDK Cargo resolver (${{ matrix.sqlite_arm }}, diagnostic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        sqlite_arm: [retain_legacy_sqlite_patch, use_upstream_sqlite]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      STAGE: ${{ runner.temp }}/hepta-matrix-stage-${{ matrix.sqlite_arm }}
      RESOLVE_ARM: ${{ matrix.sqlite_arm }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Stage exact source in disposable detached worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git worktree add --detach "$STAGE" "$SOURCE_SHA"
          python3 qualification/matrix-security/staged_resolution_probe.py --source . --stage "$STAGE" --sha "$SOURCE_SHA" --sqlite-arm "$RESOLVE_ARM" --output "$RUNNER_TEMP/hepta-matrix-resolution-stage.json"
      - name: Install candidate upstream minimum Rust compiler
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Resolve pinned matrix-sdk Git graph without compiling external source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 480 cargo +1.96.0 metadata --manifest-path "$STAGE/codex-rs/Cargo.toml" --format-version=1 > "$RUNNER_TEMP/hepta-matrix-metadata.json" 2> "$RUNNER_TEMP/hepta-matrix-metadata-stderr.log"
          result=$?
          set -e
          CARGO_RESOLUTION_STATUS="$result" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          status=int(os.environ['CARGO_RESOLUTION_STATUS'])
          data={}
          if status==0:
              data=json.loads((root/'hepta-matrix-metadata.json').read_text())
          pkgs=data.get('packages',[])
          names=('matrix-sdk','matrix-sdk-base','matrix-sdk-crypto','matrix-sdk-sqlite','anymap2','anymap3','libsqlite3-sys')
          versions={name:sorted(x['version'] for x in pkgs if x['name']==name) for name in names}
          out={'schema':'hepta.matrix-sdk-resolution-result.v2',
               'sqlite_arm':os.environ['RESOLVE_ARM'],
               'status_code':status,'cargo_resolution_completed':status==0,
               'exact_upstream_sha':'b3c07ea6ba6e8e46e30811c0500b04505c4be9f9',
               'versions':versions,
               'no_anymap2':status==0 and not versions['anymap2'],
               'fixed_crypto_observed':status==0 and bool(versions['matrix-sdk-crypto']) and all(tuple(map(int,v.split('.'))) >= (0,19,0) for v in versions['matrix-sdk-crypto']),
               'production_authorized':False,'cargo_deny_verified':False,
               'hepta_e2ee_wal_recovery_verified':False}
          (root/'hepta-matrix-resolution-result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          if [ "$result" != 0 ]; then
            echo "Pinned candidate resolver failed (not waived): exit $result"
            tail -n 90 "$RUNNER_TEMP/hepta-matrix-metadata-stderr.log"
          fi
          # Diagnostic only. This job never relaxes the separate hard gate.
      - name: Upload immutable research diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-matrix-cargo-resolution-${{ github.run_id }}-${{ matrix.sqlite_arm }}
          path: |
            ${{ runner.temp }}/hepta-matrix-resolution-stage.json
            ${{ runner.temp }}/hepta-matrix-resolution-result.json
            ${{ runner.temp }}/hepta-matrix-metadata-stderr.log
          if-no-files-found: warn
          retention-days: 14
      - name: Restore isolation and assert source clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -e "$STAGE"; then git worktree remove --force "$STAGE"; fi
          git diff --check
          git diff --exit-code
