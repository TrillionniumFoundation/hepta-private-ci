name: Hepta objective source convergence author

# Exact-parent retrigger: this workflow was introduced on the preceding head,
# so this source-only change schedules the first run against a stable parent.
on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927
    paths:
      - .github/workflows/hepta-objective-source-convergence-author.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: objective-source-convergence-author-${{ github.ref }}
  cancel-in-progress: false

jobs:
  author:
    if: github.ref == 'refs/heads/work/objective-compiler-production-convergence-20260927'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      TARGET_BRANCH: work/objective-compiler-production-convergence-20260927
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Apply bounded source convergence
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc \
            .github/objective-preview/hepta-objective-source-convergence-preview.py.gz \
            > "${RUNNER_TEMP}/objective-source-convergence.py"
          python3 -m py_compile "${RUNNER_TEMP}/objective-source-convergence.py"
          python3 "${RUNNER_TEMP}/objective-source-convergence.py" --root "${GITHUB_WORKSPACE}"
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Verify contract and source graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.test_hepta_objective_contract_consistency
          python3 scripts/hepta-objective-contract-consistency.py self-test
          python3 scripts/hepta-objective-contract-consistency.py verify
          (
            cd codex-rs
            cargo test --locked -p codex-hepta-objective -- --nocapture
            cargo test --locked -p codex-hepta-objective \
              --features qualification-legacy-compile -- --nocapture
            cargo test --locked --no-run \
              -p codex-hepta-objective \
              -p codex-hepta-learning-ledger \
              -p codex-hepta-intelligence \
              -p codex-hepta-agentd
            cargo test --locked -p codex-hepta-learning-ledger run_start -- --nocapture
            cargo test --locked -p codex-hepta-intelligence objective_run -- --nocapture
            cargo test --locked -p codex-hepta-agentd objective_runtime -- --nocapture
            cargo check --locked -p codex-hepta-objective \
              --all-targets --features qualification-legacy-compile
            cargo clippy --locked \
              -p codex-hepta-objective \
              -p codex-hepta-learning-ledger \
              -p codex-hepta-intelligence \
              -p codex-hepta-agentd \
              --all-targets --no-deps -- -D warnings
          )

      - name: Regenerate implementation map and create immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module objective.compiler
          git diff --check
          git config user.name "hepta-objective-source-author"
          git config user.email "hepta-objective-source-author@users.noreply.github.com"
          git add \
            codex-rs/hepta-objective \
            codex-rs/hepta-intelligence/src/objective_run.rs \
            codex-rs/hepta-learning-ledger/src/lib.rs \
            codex-rs/hepta-learning-ledger/src/run_start.rs \
            docs/modules/objective.compiler/IMPLEMENTATION_MAP.json
          test -n "$(git diff --cached --name-only)"
          git commit --no-gpg-sign -m "refactor(objective): seal indexed proof-bound publication"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-implementation-maps.py verify \
            --module objective.compiler \
            --expected-sha "${CANDIDATE_SHA}" \
            --expected-tree "${CANDIDATE_TREE}"
          python3 scripts/hepta-objective-contract-consistency.py verify \
            --expected-sha "${CANDIDATE_SHA}" \
            --expected-tree "${CANDIDATE_TREE}"
          test -z "$(git status --porcelain)"
          printf 'CANDIDATE_SHA=%s\nCANDIDATE_TREE=%s\n' \
            "${CANDIDATE_SHA}" "${CANDIDATE_TREE}" >> "${GITHUB_ENV}"

      - name: Publish only if branch still names the exact authoring parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "${CANDIDATE_SHA}"
          printf 'Published candidate `%s` / tree `%s`.\n' \
            "${CANDIDATE_SHA}" "${CANDIDATE_TREE}" >> "${GITHUB_STEP_SUMMARY}"
