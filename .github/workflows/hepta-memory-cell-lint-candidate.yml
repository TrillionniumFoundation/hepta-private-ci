name: Memory Cell scoped lint candidate
on:
  pull_request:
    paths:
      - '.github/workflows/hepta-memory-cell-lint-candidate.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'codex/memory-cell-evidence-20261008' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-ci
      - name: Apply narrowly scoped diagnostics and tensor-loop cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('codex-rs/hepta-intelligence-eval')
          for name in ['model.rs', 'report.rs']:
              path = root / 'examples/memory_cell_lab' / name
              s = path.read_text()
              s = s.replace('for head in 0..2 {', 'for (head, head_probabilities) in p.iter().enumerate() {')
              s = s.replace('for class in 0..CLASSES {', 'for (class, probability) in head_probabilities.iter().enumerate() {')
              s = s.replace('p[head][class]', '*probability')
              if name == 'report.rs':
                  s = s.replace('use super::data::CLASSES;\n', '').replace('{CLASSES, Episode, Split}', '{Episode, Split}')
              path.write_text(s)
          path = root / 'tests/memory_cell_lab.rs'
          s = path.read_text().replace('data::parse(&data::smoke_corpus()).unwrap()', 'data::parse(&data::smoke_corpus()).unwrap_or_else(|error| panic!("invalid smoke corpus: {error}"))')
          s = s.replace('assert_eq!(shared.parameters(), static_cells.parameters());', 'assert_eq!(shared.parameters(), static_cells.parameters());\n    assert_eq!(model::argmax(&[0.1, 0.9]), 1);')
          path.write_text(s)
          path = root / 'tests/memory_cell_faults.rs'
          s = path.read_text().replace('.unwrap()', '.unwrap_or_else(|error| panic!("memory-cell fixture failed: {error}"))')
          s = s.replace('.expect("Linux flock and child-process execution required")', '.unwrap_or_else(|error| panic!("Linux flock and child-process execution required: {error}"))')
          path.write_text(s)
          path = root / 'tests/memory_cell_transport.rs'
          s = path.read_text().replace('    let root = std::env::temp_dir()', '    assert_eq!(bundle.parameters(), 320);\n    let root = std::env::temp_dir()')
          path.write_text(s)
          path = root / 'tests/memory_cell_controls.rs'
          s = path.read_text().replace('        assert_eq!(a.bundle, b.bundle);', '''        assert_eq!(a.bundle, b.bundle);
                  assert_eq!(a.name, b.name);
                  assert_eq!(a.training_micros > 0, a.bundle.is_some());
                  if let Some(bundle) = &a.bundle {
                      assert_eq!(model::Bundle::decode(&bundle.encode()).unwrap(), *bundle);
                  }
                  assert!(controls::predict(a, &rows, &rows[128].query).unwrap().ops_estimate > 0);''')
          path.write_text(s)
          for path in (root / 'examples/memory_cell_lab').glob('*.rs'):
              path.write_text(path.read_text().replace('use std::fs::{self};', 'use std::fs;'))
          PY
      - name: Format and require strict scoped Clippy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --base "$BASE"
          just fix -p codex-hepta-intelligence-eval --test memory_cell_lab --test memory_cell_controls --test memory_cell_transfer --test memory_cell_faults --test memory_cell_transport
          just fmt --base "$BASE"
          cd codex-rs
          cargo clippy -p codex-hepta-intelligence-eval --test memory_cell_lab --test memory_cell_controls --test memory_cell_transfer --test memory_cell_faults --test memory_cell_transport -- -D warnings
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex-rs/hepta-intelligence-eval/examples/ codex-rs/hepta-intelligence-eval/tests/memory_cell_*.rs
          git commit -m 'fix(learning.eval): remove strict-lint failures without weakening test or runtime checks'
          git push origin "HEAD:refs/heads/codex/memory-cell-lint-${GITHUB_RUN_ID}"
          echo "REVIEW_CANDIDATE_SHA=$(git rev-parse HEAD)"
