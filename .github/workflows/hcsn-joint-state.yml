name: HCSN persistent DDE state qualification

on:
  pull_request:
    paths:
      - qualification/hcsn_joint_dde/**
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - qualification/hcsn_boundary_audit/refractory_transport.py
      - .github/workflows/hcsn-joint-state.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-dde-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run common source and cold-process continuation
        run: python -B -m qualification.hcsn_joint_dde.qualify_state --output "${RUNNER_TEMP}/hcsn-state"
      - name: Require clean source tree
        run: git diff --exit-code && git diff --cached --exit-code && test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hcsn-cold-state-originals
          path: ${{ runner.temp }}/hcsn-state
          if-no-files-found: error
