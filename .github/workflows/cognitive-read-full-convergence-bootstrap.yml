name: Cognitive read deterministic hardening materializer

on:
  push:
    branches:
      - work/cognitive-read-full-convergence-20260926

permissions:
  contents: write

concurrency:
  group: cognitive-read-deterministic-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore(cognitive.read): rerun deterministic hardening' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and validate asserted source migration
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee "${RUNNER_TEMP}/cognitive-read-hardening.log") 2>&1
          set -euxo pipefail
          python3 scripts/cognitive-read-agentd-hardening.py
          python3 tests/test_cognitive_read_agentd_hardening.py
          python3 scripts/verify-cognitive-read-constants.py
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          git diff --check
          git status --short

      - name: Retain hardening diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-hardening-${{ github.sha }}
          path: ${{ runner.temp }}/cognitive-read-hardening.log
          if-no-files-found: error
          retention-days: 30

      - name: Reject incomplete materialization
        if: steps.materialize.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Commit complete materialized source
        if: steps.materialize.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'hepta-ci-convergence'
          git config user.email 'hepta-ci-convergence@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'hardening script produced no source changes' >&2
            exit 1
          fi
          git commit -m 'fix(cognitive.read): apply deterministic Agentd convergence hardening'
          git push origin "HEAD:${GITHUB_REF_NAME}"
