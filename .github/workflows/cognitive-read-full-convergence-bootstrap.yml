name: Cognitive read source hardening

on:
  push:
    branches:
      - work/cognitive-read-full-convergence-20260926

permissions:
  contents: write

concurrency:
  group: cognitive-read-source-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ endsWith(github.event.head_commit.message, 'launch agentd hardening') }}"
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Apply asserted source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cognitive-read-agentd-hardening.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
      - name: Verify workspace feature policy
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_cargo_workspace_manifests.py
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-ci-convergence'
          git config user.email 'hepta-ci-convergence@users.noreply.github.com'
          git add codex-rs/hepta-agentd scripts/cognitive-read-agentd-hardening.py
          git commit -m 'feat(cognitive.read): harden Agentd product path'
          git push origin "HEAD:${GITHUB_REF_NAME}"
