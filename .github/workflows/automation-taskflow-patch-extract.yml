name: Automation TaskFlow patch extraction

on:
  push:
    branches:
      - codex/automation-taskflow-final-convergence-20260928
    paths:
      - .github/workflows/automation-taskflow-patch-extract.yml

permissions:
  contents: read

concurrency:
  group: automation-taskflow-patch-extraction
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Decode retained patch and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/automation-taskflow-diagnostic"
          mkdir -p "$output"
          cat scripts/automation_taskflow_patch_parts/part-*.b64 \
            | tr -d '\r\n\t ' \
            > "$output/final.patch.gz.b64"
          base64 --decode "$output/final.patch.gz.b64" \
            > "$output/final.patch.gz"
          gzip --decompress --stdout "$output/final.patch.gz" \
            > "$output/final.patch"
          git apply --stat "$output/final.patch" > "$output/STAT.txt"
          git apply --numstat "$output/final.patch" > "$output/NUMSTAT.txt"
          git archive --format=tar.gz --output="$output/source.tar.gz" HEAD
          git rev-parse HEAD > "$output/COMMIT"
          git rev-parse HEAD^{tree} > "$output/TREE"
          sha256sum \
            "$output/final.patch.gz.b64" \
            "$output/final.patch.gz" \
            "$output/final.patch" \
            "$output/source.tar.gz" \
            > "$output/SHA256SUMS"
          test -z "$(git status --porcelain=v1)"

      - name: Retain decoded diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-taskflow-final-diagnostic
          path: ${{ runner.temp }}/automation-taskflow-diagnostic
          if-no-files-found: error
          retention-days: 1
