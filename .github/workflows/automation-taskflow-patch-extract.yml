name: Automation TaskFlow patch extraction

on:
  push:
    branches:
      - codex/automation-taskflow-final-convergence-20260928
    paths:
      - .github/workflows/automation-taskflow-patch-extract.yml

permissions:
  contents: read

concurrency:
  group: automation-taskflow-patch-extraction
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Decode retained patch without modifying source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/automation-taskflow-patch"
          cat scripts/automation_taskflow_patch_parts/part-*.b64 \
            | tr -d '\r\n\t ' \
            > "$RUNNER_TEMP/automation-taskflow-patch/final.patch.gz.b64"
          base64 --decode \
            "$RUNNER_TEMP/automation-taskflow-patch/final.patch.gz.b64" \
            > "$RUNNER_TEMP/automation-taskflow-patch/final.patch.gz"
          gzip --decompress --stdout \
            "$RUNNER_TEMP/automation-taskflow-patch/final.patch.gz" \
            > "$RUNNER_TEMP/automation-taskflow-patch/final.patch"
          sha256sum \
            "$RUNNER_TEMP/automation-taskflow-patch/final.patch.gz.b64" \
            "$RUNNER_TEMP/automation-taskflow-patch/final.patch.gz" \
            "$RUNNER_TEMP/automation-taskflow-patch/final.patch" \
            > "$RUNNER_TEMP/automation-taskflow-patch/SHA256SUMS"
          git apply --stat "$RUNNER_TEMP/automation-taskflow-patch/final.patch" \
            > "$RUNNER_TEMP/automation-taskflow-patch/STAT.txt"
          git apply --numstat "$RUNNER_TEMP/automation-taskflow-patch/final.patch" \
            > "$RUNNER_TEMP/automation-taskflow-patch/NUMSTAT.txt"
          git status --porcelain=v1 | test ! -s /dev/stdin

      - name: Retain decoded diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-taskflow-final-patch
          path: ${{ runner.temp }}/automation-taskflow-patch
          if-no-files-found: error
          retention-days: 1
