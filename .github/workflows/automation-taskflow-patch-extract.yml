name: Automation TaskFlow patch extraction

on:
  push:
    branches:
      - codex/automation-taskflow-final-convergence-20260928
    paths:
      - .github/workflows/automation-taskflow-patch-extract.yml

permissions:
  contents: read

concurrency:
  group: automation-taskflow-patch-extraction
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct retained patch and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/automation-taskflow-diagnostic"
          mkdir -p "$output"
          python3 - "$output" <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          parts = sorted(Path("scripts/automation_taskflow_patch_parts").glob("part-*.b64"))
          raw_parts = [b"".join(path.read_bytes().split()) for path in parts]
          damaged = b"".join(raw_parts)
          expected_base64 = "a04af6a109f356e64eabd6833d1bf63f100878b366caabbce524e000df00a461"
          expected_gzip = "a3d15ffcff878254ddc7a01fdef4e28a26ef3ae6e1cbfba9d91fda031e68e510"
          expected_patch = "f9b9d8d95f745571ea891a3c8ca91387187fd929d62037d92eddc59a204fab73"
          alphabet = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          start = sum(len(part) for part in raw_parts[:4])
          stop = start + len(raw_parts[4])
          positions = [stop, *range(start, stop)]
          repaired = None
          for position in positions:
              prefix = damaged[:position]
              suffix = damaged[position:]
              for value in alphabet:
                  candidate = prefix + bytes((value,)) + suffix
                  if hashlib.sha256(candidate).hexdigest() == expected_base64:
                      repaired = candidate
                      (output / "REPAIR.txt").write_text(
                          f"inserted_offset={position}\ninserted_ascii={chr(value)}\n",
                          encoding="utf-8",
                      )
                      break
              if repaired is not None:
                  break
          if repaired is None:
              raise SystemExit("unable to reconstruct the retained patch from its fixed digest")
          compressed = base64.b64decode(repaired, validate=True)
          if hashlib.sha256(compressed).hexdigest() != expected_gzip:
              raise SystemExit("reconstructed gzip digest mismatch")
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != expected_patch:
              raise SystemExit("reconstructed patch digest mismatch")
          (output / "final.patch.gz.b64").write_bytes(repaired)
          (output / "final.patch.gz").write_bytes(compressed)
          (output / "final.patch").write_bytes(patch)
          PY
          git apply --check --whitespace=error-all "$output/final.patch"
          git apply --stat "$output/final.patch" > "$output/STAT.txt"
          git apply --numstat "$output/final.patch" > "$output/NUMSTAT.txt"
          git archive --format=tar.gz --output="$output/source.tar.gz" HEAD
          git rev-parse HEAD > "$output/COMMIT"
          git rev-parse HEAD^{tree} > "$output/TREE"
          sha256sum \
            "$output/final.patch.gz.b64" \
            "$output/final.patch.gz" \
            "$output/final.patch" \
            "$output/source.tar.gz" \
            > "$output/SHA256SUMS"
          test -z "$(git status --porcelain=v1)"

      - name: Retain decoded diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-taskflow-final-diagnostic
          path: ${{ runner.temp }}/automation-taskflow-diagnostic
          if-no-files-found: error
          retention-days: 1
