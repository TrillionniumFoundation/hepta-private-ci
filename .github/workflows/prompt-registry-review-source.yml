name: Prompt registry exact-source review export

on:
  push:
    branches: [codex/prompt-registry-remediation-20260927]
    paths: [.github/workflows/prompt-registry-review-source.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prompt-source"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/prompt-source/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/prompt-source/identity.txt"
          cd "$RUNNER_TEMP/prompt-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-source-only-${{ github.sha }}
          path: |
            ${{ runner.temp }}/prompt-source/source.tar.gz
            ${{ runner.temp }}/prompt-source/identity.txt
            ${{ runner.temp }}/prompt-source/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

# Source-only export avoids duplicating the repository in a Git bundle.
