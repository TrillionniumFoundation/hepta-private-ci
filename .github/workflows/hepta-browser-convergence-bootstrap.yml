name: Hepta Browser convergence bootstrap

on:
  push:
    branches:
      - codex/browser-servo-full-convergence-20260927
    paths:
      - .github/workflows/hepta-browser-convergence-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: hepta-browser-convergence-bootstrap
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ADVANCED_BASE: 331b81d385a88837e252bd80fda8b8ac35ea4191
      ADVANCED_HEAD: bf2cd257f28fe60025c268733d8aa2d3923b8680
      TARGET_BRANCH: codex/browser-servo-full-convergence-20260927
    steps:
      - name: Check out exact convergence branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source and historical closure
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$ADVANCED_BASE^{commit}"
          git cat-file -e "$ADVANCED_HEAD^{commit}"
          git diff --quiet
          git diff --cached --quiet

      - name: Three-way merge only the Browser cross-owner call path
        shell: bash
        run: |
          set -euo pipefail
          files=(
            codex-rs/hepta-agent-protocol/Cargo.toml
            codex-rs/hepta-agent-protocol/src/lib.rs
            codex-rs/hepta-agentd/Cargo.toml
            codex-rs/hepta-agentd/src/client.rs
            codex-rs/hepta-agentd/src/config.rs
            codex-rs/hepta-agentd/src/control.rs
            codex-rs/hepta-agentd/src/lib.rs
            codex-rs/hepta-agentd/src/main.rs
            codex-rs/hepta-agentd/src/runtime.rs
            codex-rs/hepta-agentd/src/state.rs
            codex-rs/hepta-agentd/src/state_control.rs
          )
          git diff --binary "$ADVANCED_BASE" "$ADVANCED_HEAD" -- "${files[@]}" > "$RUNNER_TEMP/browser-agentd.patch"
          test -s "$RUNNER_TEMP/browser-agentd.patch"
          if ! git apply --3way --index --verbose "$RUNNER_TEMP/browser-agentd.patch"; then
            git status --short
            git diff --cc || true
            exit 1
          fi

      - name: Repair current diagnostic caller and workflow branch bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          branch = "codex/browser-servo-full-convergence-20260927"
          old = "codex/browser-servo-product-closure-20260919"
          for name in (
              ".github/workflows/hepta-browser-agentd-composition.yml",
              ".github/workflows/hepta-browser-servo-worker-dev.yml",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace(old, branch), encoding="utf-8")

          caller = Path("codex-rs/hepta-agentd/src/bin/hepta-agentd-browser.rs")
          text = caller.read_text(encoding="utf-8")
          marker = "    reconciliation_verifying_key: Option<String>,\n"
          additions = (
              "    reconciliation_minimum_observer_generation: Option<u64>,\n"
              "    reconciliation_minimum_observed_at_unix_ms: Option<u64>,\n"
              "    reconciliation_current_frontier_digest: Option<String>,\n"
              "    reconciliation_max_future_skew_ms: Option<u64>,\n"
          )
          if additions not in text:
              if marker not in text:
                  raise SystemExit("diagnostic caller config marker changed")
              text = text.replace(marker, marker + additions, 1)
          literal = (
              "        reconciliation_verifying_key: config\n"
              "            .reconciliation_verifying_key\n"
              "            .as_deref()\n"
              "            .map(|value| parse_digest(value, \"reconciliation_verifying_key\"))\n"
              "            .transpose()?,\n"
          )
          literal_additions = (
              "        reconciliation_minimum_observer_generation: config\n"
              "            .reconciliation_minimum_observer_generation,\n"
              "        reconciliation_minimum_observed_at_unix_ms: config\n"
              "            .reconciliation_minimum_observed_at_unix_ms,\n"
              "        reconciliation_current_frontier_digest: config\n"
              "            .reconciliation_current_frontier_digest\n"
              "            .as_deref()\n"
              "            .map(|value| parse_digest(value, \"reconciliation_current_frontier_digest\"))\n"
              "            .transpose()?,\n"
              "        reconciliation_max_future_skew_ms: config\n"
              "            .reconciliation_max_future_skew_ms,\n"
          )
          if literal_additions not in text:
              if literal not in text:
                  raise SystemExit("diagnostic caller reconciliation literal changed")
              text = text.replace(literal, literal + literal_additions, 1)
          caller.write_text(text, encoding="utf-8")
          PY

      - name: Make Browser source tests blocking in CI required
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/blocking-ci.yml")
          text = path.read_text(encoding="utf-8")
          if "  browser-servo-source:" not in text:
              anchor = "\n  required:\n"
              job = (
                  "  browser-servo-source:\n"
                  "    name: Browser Servo source gate\n"
                  "    runs-on: ubuntu-24.04\n"
                  "    timeout-minutes: 20\n"
                  "    steps:\n"
                  "      - name: Checkout exact candidate\n"
                  "        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2\n"
                  "        with:\n"
                  "          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n"
                  "          fetch-depth: 0\n"
                  "          persist-credentials: false\n"
                  "      - name: Run complete Browser owner and protocol tests\n"
                  "        shell: bash\n"
                  "        run: |\n"
                  "          set -euo pipefail\n"
                  "          node --test apps/hepta-browser/test/*.test.js\n"
                  "          node --check apps/hepta-browser/src/*.js\n"
                  "          for script in apps/hepta-browser/scripts/*.js; do node --check \"$script\"; done\n"
                  "          git diff --check\n"
                  "          test -z \"$(git status --porcelain --untracked-files=no)\"\n"
              )
              if anchor not in text:
                  raise SystemExit("blocking CI required anchor changed")
              text = text.replace(anchor, "\n" + job + anchor, 1)
          need = "      - lightweight\n"
          if "      - browser-servo-source\n" not in text:
              if need not in text:
                  raise SystemExit("blocking CI needs anchor changed")
              text = text.replace(need, need + "      - browser-servo-source\n", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Resolve current workspace lock for the merged Agentd boundary
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p codex-hepta-agentd --lib --bin hepta-agentd-browser
          cargo check --locked -p codex-hepta-agentd --lib --bin hepta-agentd-browser

      - name: Run complete Browser JavaScript suite
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/hepta-browser/test/*.test.js
          node --check apps/hepta-browser/src/*.js
          for script in apps/hepta-browser/scripts/*.js; do node --check "$script"; done

      - name: Run Agentd Browser tests, formatting and strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-agent-protocol --package codex-hepta-agentd -- --check
          cargo test --locked -p codex-hepta-agentd browser_servo --lib
          cargo clippy --locked -p codex-hepta-agentd --lib --bin hepta-agentd-browser --no-deps -- -D warnings

      - name: Commit converged cross-owner source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal | grep '^??' || true)"
          git config user.name "hepta-browser-convergence"
          git config user.email "hepta-browser-convergence@users.noreply.github.com"
          git add \
            codex-rs/Cargo.lock \
            codex-rs/hepta-agent-protocol \
            codex-rs/hepta-agentd \
            .github/workflows/blocking-ci.yml \
            .github/workflows/hepta-browser-agentd-composition.yml \
            .github/workflows/hepta-browser-servo-worker-dev.yml
          git commit -m "browser.servo: compose persistent Agentd owner and required tests"
          git push origin "HEAD:$TARGET_BRANCH"
