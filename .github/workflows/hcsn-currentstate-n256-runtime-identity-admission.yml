name: hcsn-currentstate-n256-runtime-identity-admission

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "qualification/hcsn_currentstate_n256_runtime_identity_admission/**"
      - ".github/workflows/hcsn-currentstate-n256-runtime-identity-admission.yml"

permissions:
  contents: read

concurrency:
  group: hcsn-n256-runtime-identity-admission-20261121-c6bc-001
  cancel-in-progress: false

jobs:
  readonly-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install exact declared metadata set
        run: python -m pip install --disable-pip-version-check -r qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/requirements.txt
      - name: Verify frozen zero-numerical source
        run: |
          python -m qualification.hcsn_currentstate_n256_runtime_identity_admission.verify_source
          python -m unittest qualification.hcsn_currentstate_n256_runtime_identity_admission.test_source -v
          python -O -m unittest qualification.hcsn_currentstate_n256_runtime_identity_admission.test_source -v
      - name: Record exact runtime admission without numerical imports
        run: python -m qualification.hcsn_currentstate_n256_runtime_identity_admission.probe --output "$RUNNER_TEMP/hcsn-n256-runtime-identity-admission"
      - name: Publish admission receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-runtime-identity-admission-20261121-c6bc-001
          path: ${{ runner.temp }}/hcsn-n256-runtime-identity-admission
          if-no-files-found: error
          retention-days: 90

