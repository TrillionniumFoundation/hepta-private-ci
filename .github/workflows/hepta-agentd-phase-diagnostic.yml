# Private diagnostic overlay: remove all 23 Rust diagnostic paths before main integration.
name: Temporary Agentd phase diagnostic

on:
  push:
    branches:
      - integration/hepta-rust-validation-20261117-59d82
    paths:
      - .github/workflows/hepta-agentd-phase-diagnostic.yml

permissions:
  contents: read

jobs:
  complete-agentd-diagnostic:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.event_name == 'push' && github.ref == 'refs/heads/integration/hepta-rust-validation-20261117-59d82' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out the exact diagnostic push
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare existing namespace and helper prerequisites
        uses: ./.github/actions/setup-ci

      - name: Install the original Linux native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake protobuf-compiler libssl-dev libcap-dev pkg-config bubblewrap

      - name: Install fixed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.12.14

      - name: Install fixed Rust and maintenance components
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Install original just and nextest versions
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest@0.9.103

      - name: Install the fixed formatter environment manager
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3
          enable-cache: false

      - name: Allocate independent diagnostic paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agentd-phase-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "HEPTA_VALIDATION_OUTPUT=$RUNNER_TEMP/agentd-phase-records-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - name: Resolve the original verified V8 pair
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Run complete Agentd with the private diagnostic compiler cfg
        run: python3 .github/scripts/validate_agentd_phase_diagnostic.py

      - name: Retain original logs, failed JUnit and full source snapshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: agentd-phase-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HEPTA_VALIDATION_OUTPUT }}
            !${{ env.HEPTA_VALIDATION_OUTPUT }}/helpers/bin/**
          if-no-files-found: error
          retention-days: 14
