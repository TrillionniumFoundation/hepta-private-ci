name: Hepta retrieval publication and vector closure
on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
permissions:
  contents: read
concurrency:
  group: retrieval-publication-vector-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    name: Apply publication/vector closure and refresh map
    if: contains(github.event.head_commit.message, '[retrieval-publication-vector-v2]')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact transformer and branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: work/memory-retrieval-hardening-20260927
          TRANSFORM_SHA256: 263cee9253f608e353dc11985b4beef7e87e0ce6490ef7def37ed51904e017cd
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TrillionniumFoundation/hepta-private-ci'
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(shasum -a 256 scripts/hepta_memory_retrieval_publication_vector.py | awk '{print $1}')" = "$TRANSFORM_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          compile(
              Path("scripts/hepta_memory_retrieval_publication_vector.py").read_text(),
              "scripts/hepta_memory_retrieval_publication_vector.py",
              "exec",
          )
          PY
      - name: Apply exact source and documentation transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_memory_retrieval_publication_vector.py --root .
          python3 - <<'PY'
          import subprocess
          expected = {
              "codex-rs/hepta-agentd/src/cognitive_context.rs",
              "codex-rs/hepta-agentd/src/cognitive_context_hnmf_tests.rs",
              "codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap.rs",
              "codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap_tests.rs",
              "codex-rs/hepta-learning-ledger/src/model.rs",
              "docs/modules/memory.retrieval/TECHNICAL.md",
              "docs/modules/memory.retrieval/API.md",
              "docs/modules/memory.retrieval/PROCESS_BOOTSTRAP.md",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected write set: {sorted(actual)}")
          PY
          git add -- codex-rs/hepta-agentd/src/cognitive_context.rs codex-rs/hepta-agentd/src/cognitive_context_hnmf_tests.rs codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap.rs codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap_tests.rs codex-rs/hepta-learning-ledger/src/model.rs docs/modules/memory.retrieval/TECHNICAL.md docs/modules/memory.retrieval/API.md docs/modules/memory.retrieval/PROCESS_BOOTSTRAP.md
          git diff --cached --check
          test -z "$(git diff --name-only)"
      - name: Commit exact source increment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(memory.retrieval): fence publication records and reject unowned Vector'
      - name: Install pinned formatter
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Format only changed Rust sources
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.95.0 rustfmt --edition 2024 --config-path codex-rs/rustfmt.toml codex-rs/hepta-agentd/src/cognitive_context.rs codex-rs/hepta-agentd/src/cognitive_context_hnmf_tests.rs codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap.rs codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap_tests.rs codex-rs/hepta-learning-ledger/src/model.rs
          git diff --check
          test -z "$(git ls-files --others --exclude-standard)"
          python3 - <<'PY'
          import subprocess
          allowed = {
              "codex-rs/hepta-agentd/src/cognitive_context.rs",
              "codex-rs/hepta-agentd/src/cognitive_context_hnmf_tests.rs",
              "codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap.rs",
              "codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap_tests.rs",
              "codex-rs/hepta-learning-ledger/src/model.rs",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          if not actual <= allowed:
              raise SystemExit(f"formatter write set mismatch: {sorted(actual)}")
          PY
          if ! git diff --quiet; then
            git add -- codex-rs/hepta-agentd/src/cognitive_context.rs codex-rs/hepta-agentd/src/cognitive_context_hnmf_tests.rs codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap.rs codex-rs/hepta-agentd/src/cognitive_retrieval_bootstrap_tests.rs codex-rs/hepta-learning-ledger/src/model.rs
            git commit -m 'style(memory.retrieval): format publication and Vector closure'
          fi
      - name: Refresh exact implementation observation without advancing claims
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          name = "retrieval_refresh"
          spec = importlib.util.spec_from_file_location(
              name, root / "scripts/hepta_memory_retrieval_refresh_map.py"
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[name] = module
          spec.loader.exec_module(module)
          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          docs = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", head, "--", "docs/modules/memory.retrieval"],
              text=True,
          ).splitlines()
          module.INPUTS = tuple(dict.fromkeys(
              tuple(module.INPUTS) + tuple(path for path in docs if path != module.MAP)
          ))
          before = json.loads((root / module.MAP).read_text())
          mapping = module.refresh(root, head)
          assert mapping["sourceBase"] == before["sourceBase"]
          for field in (
              "productionImplementation",
              "productExecutionProved",
              "independentAcceptance",
              "activation",
              "release",
          ):
              assert mapping["claimBoundary"][field] is False
          (root / module.MAP).write_text(json.dumps(mapping, indent=2) + "\n")
          PY
          git add -- docs/modules/memory.retrieval/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(memory.retrieval): observe publication/vector closure without advancing claims'
          fi
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Publish non-force commits
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: work/memory-retrieval-hardening-20260927
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin "$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    name: Publication/vector native (${{ matrix.candidate }})
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        candidate: [source-head, base-merge]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and current main
        env:
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          echo "SOURCE_SHA=$EXPECTED_HEAD" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_ENV"
      - name: Construct ordered-parent merge candidate
        if: matrix.candidate == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: '1067'
          author-name: Hepta retrieval qualification
          author-email: hepta-qualification@example.invalid
          message: Retrieval publication/vector ordered-parent qualification
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --component rust-src
      - name: Prepare repository build inputs
        run: python3 scripts/hepta_ci_v8.py
      - name: Exact candidate package tests
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/retrieval-publication-vector/package.json"
          --minimum-tests 10 --timeout-seconds 5400 --
          just test --locked
          -p codex-hepta-memory-retrieval
          -p codex-hepta-memory
          -p codex-hepta-agentd
          -p codex-hepta-learning-ledger
      - name: Strict all-target Clippy
        if: '!cancelled()'
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/retrieval-publication-vector/clippy.json"
          --timeout-seconds 3600 --
          cargo clippy --locked
          -p codex-hepta-memory-retrieval
          -p codex-hepta-memory
          -p codex-hepta-agentd
          -p codex-hepta-learning-ledger
          --all-targets -- -D warnings
      - name: Repository formatting and clean source
        if: '!cancelled()'
        working-directory: codex-rs
        run: |
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/retrieval-publication-vector/format.json" -- just fmt-check
          cd ..
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-publication-vector-${{ matrix.candidate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-publication-vector/
          retention-days: 30
          if-no-files-found: error
