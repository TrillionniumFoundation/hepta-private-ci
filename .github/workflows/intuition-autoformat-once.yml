name: Intuition branch autoformat once

on:
  push:
    branches:
      - codex/intuition-policy-production-closure-20260927
    paths:
      - ".github/workflows/intuition-autoformat-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intuition-autoformat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intuition-policy-production-closure-20260927
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Format intuition product surfaces
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-intuition --package codex-hepta-intelligence --package codex-hepta-agentd
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "Hepta Intuition Formatter"
          git config user.email "hepta-intuition-ci@users.noreply.github.com"
          git add codex-rs/hepta-intuition codex-rs/hepta-intelligence codex-rs/hepta-agentd
          git commit -m "style(intuition): apply rustfmt to product surfaces"
          git push origin HEAD:codex/intuition-policy-production-closure-20260927
