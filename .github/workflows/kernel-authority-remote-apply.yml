name: Kernel authority exact remote apply

on:
  push:
    branches: [automation/kernel-authority-remaining-four-20260929]
    paths:
      - '.github/workflows/kernel-authority-remote-apply.yml'
      - '.kernel-authority-staging/full.part*'

permissions:
  contents: write

concurrency:
  group: kernel-authority-exact-remote-apply-arm
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout immutable staging payload
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: staging
          persist-credentials: false
      - name: Checkout exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 0
          path: target
          persist-credentials: true
      - name: Verify, apply, validate and fast-forward
        shell: bash
        env:
          EXPECTED_HEAD: 0b4e14d786e962306be424792d15f9d2c2078134
          PATCH_SHA256: 3f177e1a86f77d0282630d88da77fbb5c9d152b4c6bfb088292768625cda9038
          PATCH_GZIP_SHA256: a36e308baf5e34ee08ce7063b48e928a24fdcfc7bdf14a6574e9851188186a50
          TARGET_BRANCH: work/kernel-authority-convergence-20260925
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cat staging/.kernel-authority-staging/full.part* | base64 --decode > patch.gz
          printf '%s  %s\n' "$PATCH_GZIP_SHA256" patch.gz | sha256sum --check --strict
          gzip --decompress --stdout patch.gz > patch.diff
          printf '%s  %s\n' "$PATCH_SHA256" patch.diff | sha256sum --check --strict

          cd target
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git apply --index --check ../patch.diff
          git apply --index ../patch.diff
          git diff --cached --check

          cat > ../expected-files <<'EOF'
          .github/workflows/kernel-authority-production-closure.yml
          CALLERS.toml
          codex-rs/hepta-agentd/src/authority_feed_clock.rs
          codex-rs/hepta-agentd/src/automation_authority_bootstrap.rs
          codex-rs/hepta-agentd/src/automation_effect_host.rs
          codex-rs/hepta-agentd/src/config.rs
          codex-rs/hepta-agentd/src/lib.rs
          codex-rs/hepta-agentd/src/runtime.rs
          codex-rs/hepta-agentd/tests/authority_effect_process_restart.rs
          codex-rs/hepta-contracts/src/authority_trust.rs
          codex-rs/hepta-contracts/src/authority_trust_tests.rs
          codex-rs/hepta-contracts/src/final_use.rs
          codex-rs/hepta-contracts/src/lib.rs
          codex-rs/hepta-fleet/src/authority_port.rs
          qa/b4-no-bypass/KERNEL_AUTHORITY_BOUNDARIES.json
          qa/b4-no-bypass/KERNEL_AUTHORITY_EXTENSION_API.json
          qualification/kernel-authority/port_acceptance.py
          qualification/kernel-authority/test_port_acceptance.py
          EOF
          git diff --cached --name-only | LC_ALL=C sort > ../actual-files
          LC_ALL=C sort -o ../expected-files ../expected-files
          cmp ../expected-files ../actual-files

          python3 -B -m unittest discover -s qualification/kernel-authority -p 'test_*.py' -v
          python3 -B -m unittest discover -s qa/b4-no-bypass -p 'test_kernel_authority*.py' -v
          python3 -B scripts/verify_hepta_callers.py

          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'feat(kernel.authority): close production trust and recovery gaps' \
            -m 'Retain one authority owner while binding Agentd and Fleet production trust, make revocation recovery two-phase and anti-rollback strict, reopen exact product-process evidence in the port matrix, and repair the bounded signed-feed recovery fixture.'
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
