name: Kernel authority exact-head Rust diagnostic

on:
  push:
    branches: [automation/kernel-authority-remaining-four-20260929]
    paths:
      - '.github/workflows/kernel-authority-remote-apply.yml'

permissions:
  contents: read

concurrency:
  group: kernel-authority-exact-head-rust-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-slim
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      RUST_MIN_STACK: 8388608
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout immutable target head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: d98cf4f4d98a9e6858b103ffc4668a86b304ee49
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d98cf4f4d98a9e6858b103ffc4668a86b304ee49
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Verify product-process contract parser
        run: python3 -B qualification/kernel-authority/test_product_process_recovery.py
      - name: Verify formatting
        working-directory: codex-rs
        run: cargo fmt --check -p codex-hepta-agentd -p codex-hepta-contracts -p codex-hepta-fleet
      - name: Strict product-process Clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-agentd --test authority_effect_process_restart -- -D warnings
      - name: Execute two-product-process recovery
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-agentd --test authority_effect_process_restart -- --nocapture
      - name: Preserve read-only checkout
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
