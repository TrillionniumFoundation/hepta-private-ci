name: Kernel authority exact source remote apply

on:
  push:
    branches: [automation/kernel-authority-remaining-four-20260929]
    paths:
      - '.github/workflows/kernel-authority-remote-apply.yml'
      - '.kernel-authority-staging/source.part*'

permissions:
  contents: write

concurrency:
  group: kernel-authority-exact-source-remote-apply-ubuntu24
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable staging payload
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: staging
          persist-credentials: false
      - name: Checkout exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 1
          path: target
          persist-credentials: true
      - name: Verify, apply, validate and fast-forward source
        shell: bash
        env:
          EXPECTED_HEAD: 0b4e14d786e962306be424792d15f9d2c2078134
          SOURCE_PART00_BLOB: 7aaad68b29270c24f885e2964811b621a232108a
          SOURCE_PART01_BLOB: ed56bd2d1003eae92da2d0d8eb2a64a0bede4f72
          TARGET_BRANCH: work/kernel-authority-convergence-20260925
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/staging"
          test "$(git hash-object .kernel-authority-staging/source.part00)" = "$SOURCE_PART00_BLOB"
          test "$(git hash-object .kernel-authority-staging/source.part01)" = "$SOURCE_PART01_BLOB"
          cat .kernel-authority-staging/source.part00 \
              .kernel-authority-staging/source.part01 \
            | base64 --decode > "$GITHUB_WORKSPACE/source.patch.gz"
          gzip --test "$GITHUB_WORKSPACE/source.patch.gz"
          gzip --decompress --stdout "$GITHUB_WORKSPACE/source.patch.gz" \
            > "$GITHUB_WORKSPACE/source.patch"
          sha256sum "$GITHUB_WORKSPACE/source.patch.gz" "$GITHUB_WORKSPACE/source.patch"

          cd "$GITHUB_WORKSPACE/target"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git apply --index --check "$GITHUB_WORKSPACE/source.patch"
          git apply --index "$GITHUB_WORKSPACE/source.patch"
          git diff --cached --check

          cat > "$GITHUB_WORKSPACE/expected-files" <<'EOF'
          CALLERS.toml
          codex-rs/hepta-agentd/src/authority_feed_clock.rs
          codex-rs/hepta-agentd/src/automation_authority_bootstrap.rs
          codex-rs/hepta-agentd/src/automation_effect_host.rs
          codex-rs/hepta-agentd/src/config.rs
          codex-rs/hepta-agentd/src/lib.rs
          codex-rs/hepta-agentd/src/runtime.rs
          codex-rs/hepta-agentd/tests/authority_effect_process_restart.rs
          codex-rs/hepta-contracts/src/authority_trust.rs
          codex-rs/hepta-contracts/src/authority_trust_tests.rs
          codex-rs/hepta-contracts/src/final_use.rs
          codex-rs/hepta-contracts/src/lib.rs
          codex-rs/hepta-fleet/src/authority_port.rs
          qa/b4-no-bypass/KERNEL_AUTHORITY_BOUNDARIES.json
          qa/b4-no-bypass/KERNEL_AUTHORITY_EXTENSION_API.json
          qualification/kernel-authority/port_acceptance.py
          qualification/kernel-authority/test_port_acceptance.py
          EOF
          git diff --cached --name-only | LC_ALL=C sort > "$GITHUB_WORKSPACE/actual-files"
          LC_ALL=C sort -o "$GITHUB_WORKSPACE/expected-files" "$GITHUB_WORKSPACE/expected-files"
          cmp "$GITHUB_WORKSPACE/expected-files" "$GITHUB_WORKSPACE/actual-files"

          python3 -B -m unittest discover -s qualification/kernel-authority -p 'test_*.py' -v
          python3 -B -m unittest discover -s qa/b4-no-bypass -p 'test_kernel_authority*.py' -v
          python3 -B scripts/verify_hepta_callers.py

          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'feat(kernel.authority): close production trust and recovery gaps' \
            -m 'Retain one authority owner while binding Agentd and Fleet production trust, make revocation recovery two-phase and anti-rollback strict, reopen exact product-process evidence in the port matrix, and repair the bounded signed-feed recovery fixture.'
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
