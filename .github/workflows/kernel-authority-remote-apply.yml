name: Kernel authority target-capacity workflow lint

on:
  push:
    branches: [automation/kernel-authority-remaining-four-20260929]
    paths:
      - '.github/workflows/kernel-authority-remote-apply.yml'

permissions:
  contents: read

concurrency:
  group: kernel-authority-target-capacity-actionlint
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout immutable target head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: d98cf4f4d98a9e6858b103ffc4668a86b304ee49
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d98cf4f4d98a9e6858b103ffc4668a86b304ee49
          test -z "$(git status --porcelain)"
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint" -version
      - name: Lint target capacity workflow
        run: "$HOME/go/bin/actionlint" -verbose .github/workflows/kernel-authority-target-capacity.yml
