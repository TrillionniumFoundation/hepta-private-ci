name: Hepta blocker autofix (temporary)

on:
  push:
    branches:
      - "codex/hepta-blocker-autofix-20260907"

permissions:
  contents: write

concurrency:
  group: hepta-blocker-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact helper candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply deterministic blocker fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_required(path: str, old: str, new: str, *, count: int | None = None) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"{path}: required source pattern not found: {old!r}")
              occurrences = text.count(old)
              if count is not None and occurrences != count:
                  raise SystemExit(
                      f"{path}: expected {count} occurrences of {old!r}, found {occurrences}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          # Standalone Bazel integration test imports pretty_assertions directly.
          replace_required(
              "codex-rs/hepta-shadow-qualification/BUILD.bazel",
              '        "//codex-rs/hepta-types",\n'
              '        "@crates//:tempfile",\n',
              '        "//codex-rs/hepta-types",\n'
              '        "@crates//:pretty_assertions",\n'
              '        "@crates//:tempfile",\n',
              count=1,
          )

          replacements: dict[str, list[tuple[str, str, int | None]]] = {
              "codex-rs/hepta-contracts/src/authbus_b2.rs": [
                  ("validate_text(value, label, 512)", "validate_text(value, label, /*max_bytes*/ 512)", 1),
                  (
                      'validate_text(&self.reason_code, "decision reason code", 128)?;',
                      'validate_text(&self.reason_code, "decision reason code", /*max_bytes*/ 128)?;',
                      1,
                  ),
                  (
                      'validate_text(&self.provider_id, "provider id", 512)?;',
                      'validate_text(&self.provider_id, "provider id", /*max_bytes*/ 512)?;',
                      1,
                  ),
                  (
                      'validate_text(reason, "provider status reason code", 128)?;',
                      'validate_text(reason, "provider status reason code", /*max_bytes*/ 128)?;',
                      1,
                  ),
                  (
                      'validate_text(&self.operation_kind, "operation kind", 128)?;',
                      'validate_text(&self.operation_kind, "operation kind", /*max_bytes*/ 128)?;',
                      1,
                  ),
                  (
                      'validate_text(&self.operation, "attenuated operation", 128)?;',
                      'validate_text(&self.operation, "attenuated operation", /*max_bytes*/ 128)?;',
                      1,
                  ),
                  (
                      'validate_text(&self.audience, "attenuated audience", 512)?;',
                      'validate_text(&self.audience, "attenuated audience", /*max_bytes*/ 512)?;',
                      1,
                  ),
                  (
                      'validate_text(self.peer.as_str(), "peer principal", 512)?;',
                      'validate_text(self.peer.as_str(), "peer principal", /*max_bytes*/ 512)?;',
                      1,
                  ),
                  (
                      'validate_text(self.owner.as_str(), "advertisement owner", 512)?;',
                      'validate_text(self.owner.as_str(), "advertisement owner", /*max_bytes*/ 512)?;',
                      1,
                  ),
                  (
                      'validate_text(&self.provider_id, "advertised provider", 512)?;',
                      'validate_text(&self.provider_id, "advertised provider", /*max_bytes*/ 512)?;',
                      1,
                  ),
                  (
                      'validate_text(model, "advertised model", 512)?;',
                      'validate_text(model, "advertised model", /*max_bytes*/ 512)?;',
                      1,
                  ),
              ],
              "codex-rs/hepta-contracts/src/authbus_b1.rs": [
                  ("validate_text(value, label, 512)", "validate_text(value, label, /*max_bytes*/ 512)", 1),
              ],
              "codex-rs/hepta-contracts/src/authbus.rs": [
                  (
                      'validate_text(&self.backend, "secret backend", 128)?;',
                      'validate_text(&self.backend, "secret backend", /*max_bytes*/ 128)?;',
                      1,
                  ),
                  (
                      'validate_lowercase_hex(&self.candidate.commit, "candidate commit", 40)?;',
                      'validate_lowercase_hex(&self.candidate.commit, "candidate commit", /*expected_len*/ 40)?;',
                      1,
                  ),
                  (
                      'validate_lowercase_hex(&self.candidate.tree, "candidate tree", 40)?;',
                      'validate_lowercase_hex(&self.candidate.tree, "candidate tree", /*expected_len*/ 40)?;',
                      1,
                  ),
                  (
                      'validate_lowercase_hex(expected_commit, "expected candidate commit", 40)?;',
                      'validate_lowercase_hex(expected_commit, "expected candidate commit", /*expected_len*/ 40)?;',
                      1,
                  ),
                  (
                      'validate_lowercase_hex(expected_tree, "expected candidate tree", 40)?;',
                      'validate_lowercase_hex(expected_tree, "expected candidate tree", /*expected_len*/ 40)?;',
                      1,
                  ),
              ],
              "codex-rs/hepta-fleet/src/release.rs": [
                  (
                      "self.install_release_bundle(release_id, source_program, args, None, Vec::new())",
                      "self.install_release_bundle(\n"
                      "            release_id,\n"
                      "            source_program,\n"
                      "            args,\n"
                      "            /*source_matrixd*/ None,\n"
                      "            /*matrixd_args*/ Vec::new(),\n"
                      "        )",
                      1,
                  ),
                  ("set_mode(&agentd_program, 0o555)?;", "set_mode(&agentd_program, /*mode*/ 0o555)?;", 1),
                  ("set_mode(&matrixd_program, 0o555)?;", "set_mode(&matrixd_program, /*mode*/ 0o555)?;", 1),
                  ("set_mode(&manifest, 0o444)?;", "set_mode(&manifest, /*mode*/ 0o444)?;", 1),
                  ("set_mode(&bin_root, 0o555)?;", "set_mode(&bin_root, /*mode*/ 0o555)?;", 1),
                  ("set_mode(&staging, 0o555)?;", "set_mode(&staging, /*mode*/ 0o555)?;", 1),
                  ("set_mode(&path, 0o444)?;", "set_mode(&path, /*mode*/ 0o444)?;", 1),
                  (
                      "validate_physical_directory(catalog_root, false)?;",
                      "validate_physical_directory(catalog_root, /*immutable*/ false)?;",
                      1,
                  ),
                  (
                      "validate_physical_directory(&release_root, true)?;",
                      "validate_physical_directory(&release_root, /*immutable*/ true)?;",
                      1,
                  ),
                  (
                      "validate_physical_directory(&bin_root, true)?;",
                      "validate_physical_directory(&bin_root, /*immutable*/ true)?;",
                      1,
                  ),
                  (
                      "validate_immutable_regular_file(&manifest_path, false)?;",
                      "validate_immutable_regular_file(&manifest_path, /*executable*/ false)?;",
                      1,
                  ),
                  (
                      "validate_immutable_regular_file(&program, true)?;",
                      "validate_immutable_regular_file(&program, /*executable*/ true)?;",
                      1,
                  ),
                  ("let _ = set_mode(path, 0o755);", "let _ = set_mode(path, /*mode*/ 0o755);", 1),
                  (
                      'let _ = set_mode(&path.join("bin"), 0o755);',
                      'let _ = set_mode(&path.join("bin"), /*mode*/ 0o755);',
                      1,
                  ),
                  (
                      "let _ = set_mode(&path.join(AGENTD_RELEASE_PROGRAM), 0o755);",
                      "let _ = set_mode(&path.join(AGENTD_RELEASE_PROGRAM), /*mode*/ 0o755);",
                      1,
                  ),
                  (
                      "let _ = set_mode(&path.join(MATRIXD_RELEASE_PROGRAM), 0o755);",
                      "let _ = set_mode(&path.join(MATRIXD_RELEASE_PROGRAM), /*mode*/ 0o755);",
                      1,
                  ),
                  (
                      "let _ = set_mode(&path.join(RELEASE_MANIFEST_FILE), 0o644);",
                      "let _ = set_mode(&path.join(RELEASE_MANIFEST_FILE), /*mode*/ 0o644);",
                      1,
                  ),
              ],
              "codex-rs/hepta-operator-acceptance/src/durable.rs": [
                  ("open_sidecar_lock(root, true)", "open_sidecar_lock(root, /*create*/ true)", 1),
                  ("open_sidecar_lock(root, false)", "open_sidecar_lock(root, /*create*/ false)", 1),
              ],
              "codex-rs/hepta-wire/src/envelope.rs": [
                  ("read_u16(encoded, 4)?", "read_u16(encoded, /*start*/ 4)?", 1),
                  ("read_u16(encoded, 6)?", "read_u16(encoded, /*start*/ 6)?", 1),
                  ("read_u16(encoded, 8)?", "read_u16(encoded, /*start*/ 8)?", 1),
                  ("read_u64(encoded, 10)?", "read_u64(encoded, /*start*/ 10)?", 1),
              ],
              "codex-rs/hepta-operator-acceptance/src/g5_main.rs": [
                  ("parse_common(&arguments, 2)?", "parse_common(&arguments, /*start*/ 2)?", 2),
              ],
              "codex-rs/hepta-operations/src/ledger.rs": [
                  ("Revision::new(1)", "Revision::new(/*value*/ 1)", 1),
              ],
              "codex-rs/hepta-cognitive-store/src/lib.rs": [
                  ("LogicalSequence::new(1)", "LogicalSequence::new(/*value*/ 1)", 1),
              ],
              "codex-rs/hepta-ndu/src/preference.rs": [
                  ("Revision::new(1)", "Revision::new(/*value*/ 1)", 1),
              ],
              "codex-rs/hepta-intelligence-eval/src/ope.rs": [
                  ("checked_add(result, 1)", "checked_add(result, /*right*/ 1)", 1),
              ],
              "codex-rs/hepta-prompt-registry/src/lib.rs": [
                  ("Revision::new(1)", "Revision::new(/*value*/ 1)", 1),
                  ("self.ensure_capacity(1)?;", "self.ensure_capacity(/*additional*/ 1)?;", 2),
              ],
              "codex-rs/codex-api/src/sse/responses.rs": [
                  (
                      "process_responses_event_with_diagnostics(event, false)",
                      "process_responses_event_with_diagnostics(event, /*redact_provider_diagnostics*/ false)",
                      1,
                  ),
              ],
              "codex-rs/model-provider/src/provider_effect.rs": [
                  (
                      "self.lookup_http(key, None).await",
                      "self.lookup_http(key, /*payload_sha256*/ None).await",
                      1,
                  ),
              ],
          }

          for path, items in replacements.items():
              for old, new, count in items:
                  replace_required(path, old, new, count=count)

          # Release-only Rust paths intentionally fail closed without this root.
          # The CI fixture is runner-local, empty, private, and never weakens
          # production behavior or introduces a repository-owned authority root.
          release_anchor = "      - name: bazel build verify-release-build targets\n"
          release_setup = """      - name: Prepare fail-closed release lockdown root
                  shell: bash
                  run: |
                    set -euo pipefail
                    if [[ "${RUNNER_OS}" == "Windows" ]]; then
                      mkdir_root="$(cygpath -u "${RUNNER_TEMP}")/hepta-lockdown-root"
                      lockdown_root="$(cygpath -m "${RUNNER_TEMP}")/hepta-lockdown-root"
                    else
                      mkdir_root="${RUNNER_TEMP}/hepta-lockdown-root"
                      lockdown_root="${mkdir_root}"
                    fi
                    rm -rf "${mkdir_root}"
                    mkdir -p "${mkdir_root}"
                    chmod 700 "${mkdir_root}" || true
                    printf 'HEPTA_LOCKDOWN_ROOT=%s\\n' "${lockdown_root}" >> "${GITHUB_ENV}"

                - name: bazel build verify-release-build targets
          """
          replace_required(
              ".github/workflows/bazel.yml",
              release_anchor,
              release_setup,
              count=1,
          )
          PY

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -F '@crates//:pretty_assertions' codex-rs/hepta-shadow-qualification/BUILD.bazel
          grep -F 'HEPTA_LOCKDOWN_ROOT' .github/workflows/bazel.yml
          grep -R --line-number --fixed-strings '/*max_bytes*/' \
            codex-rs/hepta-contracts/src/authbus.rs \
            codex-rs/hepta-contracts/src/authbus_b1.rs \
            codex-rs/hepta-contracts/src/authbus_b2.rs

      - name: Restore repository workflow and commit only product fixes
        env:
          ORIGINAL_HEAD: 9676c7ded9ece436a72e31c9a1eb226241f55f44
        shell: bash
        run: |
          set -euo pipefail
          git show "${ORIGINAL_HEAD}:.github/workflows/hepta-gap-closure.yml" \
            > .github/workflows/hepta-gap-closure.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo "No blocker fixes were produced." >&2
            exit 1
          fi
          git config user.name "hepta-ci-bot"
          git config user.email "hepta-ci-bot@users.noreply.github.com"
          git commit -m "fix: close release and Bazel blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
