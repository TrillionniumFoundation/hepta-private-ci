name: Hepta V8 source-gap closure

on:
  pull_request:
    paths:
      - "codex-rs/hepta-*/**"
      - "apps/hepta-control-ui/**"
      - "tools/hepta-engineering-control/**"
      - "scripts/hepta-gap-closure.py"
      - "scripts/hepta_source_registry_closure.py"
      - "scripts/test_hepta_gap_closure.py"
      - "qualification/gap-closure/**"
      - "docs/readiness/GAP_CLOSURE_IMPLEMENTATION.md"
      - ".github/workflows/hepta-gap-closure.yml"

permissions:
  contents: read

concurrency:
  group: hepta-v8-gap-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-head:
    name: Verify exact source head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      REPOSITORY_ID: ${{ github.repository_id }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact event source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind event base and source objects
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD^{commit})" = "$SOURCE_SHA"
          test "$(git rev-parse --verify "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test "$(git rev-parse --verify "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"

      - name: Set up repository CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Verify closed-world source inventory
        run: |
          set -euo pipefail
          python3 scripts/hepta-gap-closure.py verify
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          python3 -m unittest -v scripts/test_hepta_gap_closure.py

      - name: Check selected Rust package formatting
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            codex-hepta-objective
            codex-hepta-ndu
            codex-hepta-learning-ledger
            codex-hepta-learning-artifacts
            codex-hepta-bellman-operator
            codex-hepta-intelligence-eval
            codex-hepta-neuron
            codex-hepta-intuition
            codex-hepta-prompt-registry
            codex-hepta-prompt-optimizer
            codex-hepta-plasticity
            codex-hepta-infer-worker-host
          )
          for package in "${packages[@]}"; do
            cargo fmt --package "$package" -- --check
          done

      - name: Check selected packages without changing the lockfile
        working-directory: codex-rs
        run: |
          cargo check --locked \
            --package codex-hepta-objective \
            --package codex-hepta-ndu \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-infer-worker-host \
            --all-targets

      - name: Run focused Rust tests
        working-directory: codex-rs
        run: |
          cargo test --locked \
            --package codex-hepta-objective \
            --package codex-hepta-ndu \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-infer-worker-host
          cargo test --locked --package codex-hepta-shadow-qualification value_learning

      - name: Run strict selected-package Clippy
        working-directory: codex-rs
        run: |
          cargo clippy --locked \
            --package codex-hepta-objective \
            --package codex-hepta-ndu \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-infer-worker-host \
            --all-targets -- -D warnings

      - name: Run control UI tests
        run: node --test apps/hepta-control-ui/test/*.test.js

      - name: Run engineering-control tests
        working-directory: tools/hepta-engineering-control
        run: python3 -m unittest -v test_hepta_engineering_control.py

      - name: Emit and verify exact source receipt outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/hepta-gap-closure"
          receipt="$receipt_dir/source-identity.json"
          mkdir -p "$receipt_dir"
          identity_args=(
            --kind source-head
            --repository-id "$REPOSITORY_ID"
            --repository "$GITHUB_REPOSITORY"
            --base "$BASE_SHA"
            --source "$SOURCE_SHA"
            --expected "$SOURCE_SHA"
            --workflow-path .github/workflows/hepta-gap-closure.yml
            --event-name "$GITHUB_EVENT_NAME"
            --event-path "$GITHUB_EVENT_PATH"
          )
          python3 scripts/hepta-gap-closure.py identity-receipt \
            "${identity_args[@]}" \
            --output "$receipt"
          python3 scripts/hepta-gap-closure.py identity-verify \
            "${identity_args[@]}" \
            --input "$receipt"

      - name: Retain exact source receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-gap-closure-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-gap-closure/source-identity.json
          if-no-files-found: error
          retention-days: 7

      - name: Require unmodified source checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  merge-candidate:
    name: Verify exact actual-base synthetic merge
    if: github.event_name == 'pull_request'
    needs: source-head
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      REPOSITORY_ID: ${{ github.repository_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact event source for merge construction
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Construct actual-base synthetic merge
        id: synthetic
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD^{commit})" = "$SOURCE_SHA"
          test "$(git rev-parse --verify "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test "$(git rev-parse --verify "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"
          merge_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$merge_tree" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME="Hepta Gap Closure CI"
          export GIT_AUTHOR_EMAIL="hepta-gap-closure-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          merge_sha="$(
            printf 'Synthetic gap-closure merge for PR %s\n' "$PR_NUMBER" |
              git commit-tree "$merge_tree" -p "$BASE_SHA" -p "$SOURCE_SHA"
          )"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git show -s --format=%P "$merge_sha")" = "$BASE_SHA $SOURCE_SHA"
          test "$(git rev-parse --verify "$merge_sha^{tree}")" = "$merge_tree"
          git checkout --detach "$merge_sha"
          test "$(git rev-parse --verify HEAD^{commit})" = "$merge_sha"
          printf 'sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Emit and verify exact synthetic-merge receipt
        env:
          EXPECTED_SHA: ${{ steps.synthetic.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_SHA"
          receipt_dir="$RUNNER_TEMP/hepta-gap-closure"
          receipt="$receipt_dir/merge-identity.json"
          mkdir -p "$receipt_dir"
          identity_args=(
            --kind merge-candidate
            --repository-id "$REPOSITORY_ID"
            --repository "$GITHUB_REPOSITORY"
            --base "$BASE_SHA"
            --source "$SOURCE_SHA"
            --expected "$EXPECTED_SHA"
            --workflow-path .github/workflows/hepta-gap-closure.yml
            --event-name "$GITHUB_EVENT_NAME"
            --event-path "$GITHUB_EVENT_PATH"
          )
          python3 scripts/hepta-gap-closure.py identity-receipt \
            "${identity_args[@]}" \
            --output "$receipt"
          python3 scripts/hepta-gap-closure.py identity-verify \
            "${identity_args[@]}" \
            --input "$receipt"

      - name: Retain exact merge receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-gap-closure-merge-${{ steps.synthetic.outputs.sha }}
          path: ${{ runner.temp }}/hepta-gap-closure/merge-identity.json
          if-no-files-found: error
          retention-days: 7

      - name: Require unmodified merge checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
