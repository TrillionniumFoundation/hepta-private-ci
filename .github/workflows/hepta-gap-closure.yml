name: Hepta blocker source materializer (temporary)

on:
  push:
    branches:
      - "codex/hepta-blocker-autofix-20260907"

permissions:
  contents: write

concurrency:
  group: hepta-blocker-source-materializer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply deterministic source fixes and export patched Bazel workflow
        shell: bash
        run: |
          set -euo pipefail
          git show dccfb3382c400c12c2d81f7ab472504aa7504c65:.github/workflows/hepta-gap-closure.yml > /tmp/full-helper.yml
          awk '
            /^          python3 - <<'\''PY'\''$/ { capture = 1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/full-helper.yml > /tmp/apply-blocker-fixes.py
          python3 - <<'PY'
          from pathlib import Path

          script = Path('/tmp/apply-blocker-fixes.py')
          text = script.read_text(encoding='utf-8')
          start = text.index('    occurrences = text.count(old)\n')
          end = text.index('    target.write_text', start)
          script.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
          python3 /tmp/apply-blocker-fixes.py
          git diff --check
          grep -F '@crates//:pretty_assertions' codex-rs/hepta-shadow-qualification/BUILD.bazel
          grep -F 'HEPTA_LOCKDOWN_ROOT' .github/workflows/bazel.yml

          artifact_root="${RUNNER_TEMP}/hepta-blocker-artifact"
          rm -rf "${artifact_root}"
          mkdir -p "${artifact_root}"
          cp .github/workflows/bazel.yml "${artifact_root}/bazel.yml"

          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            [[ "${path}" == .github/* ]] && continue
            git add -- "${path}"
          done < <(git diff --name-only)

          if ! git diff --cached --quiet; then
            git config user.name "hepta-ci-bot"
            git config user.email "hepta-ci-bot@users.noreply.github.com"
            git commit -m "fix: close Bazel and cross-platform source blockers"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload patched Bazel workflow
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-patched-bazel-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-blocker-artifact/bazel.yml
          if-no-files-found: error
          retention-days: 1
