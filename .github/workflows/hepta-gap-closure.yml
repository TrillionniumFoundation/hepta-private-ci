name: Hepta blocker helper bootstrap (temporary)

on:
  push:
    branches:
      - "codex/hepta-blocker-autofix-20260907"

permissions:
  contents: write

concurrency:
  group: hepta-blocker-helper-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Restore and repair the deterministic blocker helper
        shell: bash
        run: |
          set -euo pipefail
          git show dccfb3382c400c12c2d81f7ab472504aa7504c65:.github/workflows/hepta-gap-closure.yml > /tmp/helper.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/helper.yml')
          text = source.read_text(encoding='utf-8')
          start = text.index("              occurrences = text.count(old)\n")
          end = text.index("              target.write_text", start)
          Path('.github/workflows/hepta-gap-closure.yml').write_text(
              text[:start] + text[end:], encoding='utf-8'
          )
          extra = Path('.github/workflows/hepta-blocker-helper-repair.yml')
          if extra.exists():
              extra.unlink()
          PY
          git diff --check
          git add -A
          git config user.name "hepta-ci-bot"
          git config user.email "hepta-ci-bot@users.noreply.github.com"
          git commit -m "ci: bootstrap repaired temporary blocker helper"
          git push origin "HEAD:${GITHUB_REF_NAME}"
