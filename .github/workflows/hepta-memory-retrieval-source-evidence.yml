name: Hepta memory retrieval exact source evidence

on:
  push:
    branches:
      - work/memory-retrieval-hardening-20260927
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: memory-retrieval-source-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout exact object without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive tracked bytes and immutable identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/retrieval-source"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-source/identity.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/retrieval-source/source.tar.gz"
          (
            cd "$RUNNER_TEMP/retrieval-source"
            sha256sum source.tar.gz identity.txt > SHA256SUMS
          )
          printf '%s\n' 'source-archive-only; no native-test, product-execution, independent-acceptance or release claim' > "$RUNNER_TEMP/retrieval-source/CLAIM_BOUNDARY.txt"
      - name: Retain source without treating archival as qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-exact-source-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-source/
          retention-days: 30
          if-no-files-found: error
