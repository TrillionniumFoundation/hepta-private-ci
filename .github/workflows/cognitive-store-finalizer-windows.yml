name: Cognitive store one-shot finalizer

on:
  push:
    branches:
      - codex/cognitive-store-full-closure-20260927
    paths:
      - '.github/workflows/cognitive-store-finalizer-windows.yml'
      - 'scripts/finalize_cognitive_store_candidate.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-store-one-shot-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/cognitive-store-full-closure-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ github.sha }}") { throw "checkout drift" }
          if (git status --porcelain) { throw "dirty checkout" }

      - name: Finalize and publish clean candidate
        shell: pwsh
        run: |
          $env:PYTHONUNBUFFERED = "1"
          python scripts/finalize_cognitive_store_candidate.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\cognitive-finalizer.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-finalizer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cognitive-finalizer.log
          if-no-files-found: warn
          retention-days: 7
