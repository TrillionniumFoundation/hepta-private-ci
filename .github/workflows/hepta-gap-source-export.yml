name: Hepta gap source export

on:
  push:
    branches:
      - codex/hepta-maintenance-20260912
    paths:
      - .github/workflows/hepta-gap-source-export.yml

permissions:
  contents: read

concurrency:
  group: hepta-maintenance-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export immutable source objects without credentials
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          out="${RUNNER_TEMP}/hepta-maintenance-source"
          mkdir -p "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/IDENTITY"
          git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin/ refs/tags/ > "$out/REFS"
          git bundle create "$out/repository.bundle" --all
          git bundle verify "$out/repository.bundle"
          (cd "$out" && sha256sum repository.bundle IDENTITY REFS > SHA256SUMS)
          git diff --exit-code

      - name: Upload read-only reconciliation input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-maintenance-source-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-maintenance-source
          if-no-files-found: error
          retention-days: 3
