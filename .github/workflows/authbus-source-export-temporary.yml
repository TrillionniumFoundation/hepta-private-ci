name: Temporary AuthBus source export

on:
  push:
    branches:
      - work/authbus-correctness-closure-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/hepta-authbus-source.tar.gz" .
          git rev-parse HEAD > "$RUNNER_TEMP/source-head.txt"
      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: authbus-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-authbus-source.tar.gz
            ${{ runner.temp }}/source-head.txt
          if-no-files-found: error
          retention-days: 1
