name: Bootstrap memory retrieval convergence

on:
  push:
    branches:
      - work/memory-retrieval-production-convergence-20260926
    paths:
      - scripts/bootstrap_memory_retrieval_convergence.py
      - .github/workflows/bootstrap-memory-retrieval-convergence.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-memory-retrieval-convergence
  cancel-in-progress: true

jobs:
  apply-semantic-convergence:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out exact bootstrap source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply exact semantic patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/bootstrap_memory_retrieval_convergence.py
          python3 scripts/bootstrap_memory_retrieval_convergence.py
          git diff --check
          ! git grep -n 'contradiction_group_digest\|contradiction_group_digests' -- \
            codex-rs/hepta-memory-retrieval/src \
            codex-rs/hepta-memory/src/cognitive_retrieval_adapter.rs \
            codex-rs/hepta-memory/src/cognitive_retrieval_adapter_tests.rs
          test -n "$(git status --short)"

      - name: Commit source candidate
        run: |
          set -euo pipefail
          git config user.name "hepta-convergence-bot"
          git config user.email "hepta-convergence-bot@users.noreply.github.com"
          git add \
            codex-rs/hepta-memory-retrieval/src \
            codex-rs/hepta-memory/src/cognitive_retrieval_adapter.rs \
            codex-rs/hepta-memory/src/cognitive_retrieval_adapter_tests.rs \
            codex-rs/hepta-agentd/src/cognitive_retrieval_learning_tests.rs
          git commit -m "fix(memory.retrieval): close admission and contradiction semantics" \
            -m "Bind contradiction evidence to proposition and polarity, admit by score and OOD before safety evaluation and HNMF settling, make zero activation/zero-weight edges inert, and compute activation-weighted confidence. Add regression and property coverage for same-side evidence, poison candidates, ordering, resource counts and policy bounds. This commit is a source candidate pending the separate Rust qualification lanes."
          git push origin HEAD:work/memory-retrieval-production-convergence-20260926
