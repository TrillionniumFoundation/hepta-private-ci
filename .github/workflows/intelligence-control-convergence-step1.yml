name: Intelligence Control Convergence Step 1

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/intelligence_control_convergence_step1.py
      - .github/workflows/intelligence-control-convergence-step1.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-convergence-step1
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply canonical legality and evidence patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 scripts/intelligence_control_convergence_step1.py

      - name: Remove one-shot convergence machinery
        run: |
          rm scripts/intelligence_control_convergence_step1.py
          rm .github/workflows/intelligence-control-convergence-step1.yml

      - name: Validate traceability JSON
        run: python3 -m json.tool docs/modules/intelligence.control/TEST_TRACEABILITY.json >/dev/null

      - name: Format modified intelligence source
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-intelligence

      - name: Verify formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-intelligence -- --check

      - name: Run canonical intelligence library tests
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-intelligence --lib --retries 0

      - name: Check all intelligence targets
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-intelligence --all-targets

      - name: Run strict intelligence Clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-intelligence --all-targets -- -D warnings

      - name: Commit exact tested candidate
        env:
          TARGET_BRANCH: work/product-convergence-20260923
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${GITHUB_SHA}"
          git config user.name "ProfHepta"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -s -m "fix(intelligence): close canonical legal selection boundary"
          git push origin "HEAD:${TARGET_BRANCH}"
