name: secrets.heptabao read-only exact-source qualification

on:
  push:
    branches:
      - "codex/secrets-heptabao-*"
    paths:
      - codex-rs/hepta-bao-adapter/**
      - codex-rs/hepta-types/**
      - codex-rs/hepta-contracts/**
      - codex-rs/http-client/**
      - CALLERS.toml
      - scripts/verify_hepta_callers.py
      - .github/actions/hepta-synthetic-merge/**
      - codex-rs/hepta-authbus/**
      - codex-rs/state/sqlite/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - docs/modules/secrets.heptabao/**
      - docs/lane-a-foundation/secrets.heptabao/**
      - docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json
      - scripts/generate_secrets_heptabao_module.py
      - scripts/*secrets*heptabao*
      - .ci/secrets-heptabao*
      - .hepta-bootstrap/**
      - .hepta-staging/**
      - .github/workflows/**
  pull_request:
    paths:
      - codex-rs/hepta-bao-adapter/**
      - codex-rs/hepta-types/**
      - codex-rs/hepta-contracts/**
      - codex-rs/http-client/**
      - CALLERS.toml
      - scripts/verify_hepta_callers.py
      - .github/actions/hepta-synthetic-merge/**
      - codex-rs/hepta-authbus/**
      - codex-rs/state/sqlite/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - docs/modules/secrets.heptabao/**
      - docs/lane-a-foundation/secrets.heptabao/**
      - docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json
      - scripts/generate_secrets_heptabao_module.py
      - scripts/*secrets*heptabao*
      - .ci/secrets-heptabao*
      - .hepta-bootstrap/**
      - .hepta-staging/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-read-only-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  exact-source:
    if: github.event_name != 'pull_request' || startsWith(github.event.pull_request.head.ref, 'codex/secrets-heptabao-')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require frozen branch and pristine exact source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_BRANCH" == codex/secrets-heptabao-* ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify immutable candidate tree
        id: immutable
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 codex-rs/hepta-bao-adapter/qa/verify_candidate_immutability.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Execute all native source lanes
        id: native
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 codex-rs/hepta-bao-adapter/qa/qualify.py \
            --expected-sha "$CANDIDATE_SHA" \
            --candidate-role source-head \
            --output "${RUNNER_TEMP}/secrets-source"

      - name: Execute Python contract regressions
        id: python
        continue-on-error: true
        shell: bash
        run: |
          python3 -m unittest discover \
            -s codex-rs/hepta-bao-adapter/qa \
            -p 'test_*.py'

      - name: Build immutable source artifact and readiness receipt
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IMMUTABLE_OUTCOME: ${{ steps.immutable.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/secrets-source"
          mkdir -p "$evidence"
          git archive --format=tar.gz --output "$evidence/exact-source.tar.gz" HEAD
          args=(
            --output "$evidence/readiness-manifest.json"
            --candidate-role source-head
            --source-head-sha "$CANDIDATE_SHA"
            --workflow-sha "${GITHUB_WORKFLOW_SHA:-$CANDIDATE_SHA}"
            --workflow-run-id "${GITHUB_RUN_ID}"
            --attempt-id "${GITHUB_RUN_ATTEMPT}"
            --product-caller-manifest docs/modules/secrets.heptabao/PRODUCT_CALLER_MANIFEST_V1.json
            --native-receipt "$evidence/receipt.json"
            --artifact "$evidence/exact-source.tar.gz"
          )
          if [[ "$IMMUTABLE_OUTCOME" == success && "$NATIVE_OUTCOME" == success && "$PYTHON_OUTCOME" == success ]]; then
            args+=(--qualified)
          fi
          python3 codex-rs/hepta-bao-adapter/qa/build_readiness_manifest.py "${args[@]}"
          cat "$evidence/readiness-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-source-${{ github.event.pull_request.head.sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secrets-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Require pristine source after qualification
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enforce source qualification
        if: always()
        shell: bash
        env:
          IMMUTABLE_OUTCOME: ${{ steps.immutable.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
        run: |
          test "$IMMUTABLE_OUTCOME" = success
          test "$NATIVE_OUTCOME" = success
          test "$PYTHON_OUTCOME" = success
