name: secrets.heptabao read-only exact-source qualification

on:
  push:
    branches:
      - codex/secrets-heptabao-production-qualified-20260930
    paths:
      - codex-rs/hepta-bao-adapter/**
      - codex-rs/hepta-authbus/**
      - codex-rs/state/sqlite/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - docs/modules/secrets.heptabao/**
      - docs/lane-a-foundation/secrets.heptabao/**
      - docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json
      - scripts/generate_secrets_heptabao_module.py
      - codex-rs/hepta-bao-adapter/qa/validate_build_contract.py
      - .github/workflows/secrets-heptabao-five-closure-qualified.yml
      - .github/workflows/secrets-heptabao-candidate-attestation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-read-only-source-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Require pristine exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute all native source lanes
        id: native
        continue-on-error: true
        shell: bash
        run: |
          python3 codex-rs/hepta-bao-adapter/qa/qualify.py \
            --expected-sha "${GITHUB_SHA}" \
            --candidate-role source-head \
            --output "${RUNNER_TEMP}/secrets-source"

      - name: Execute Python contract regressions
        id: python
        continue-on-error: true
        shell: bash
        run: |
          python3 -m unittest discover \
            -s codex-rs/hepta-bao-adapter/qa \
            -p 'test_*.py'

      - name: Build immutable source artifact and readiness receipt
        if: always()
        shell: bash
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/secrets-source"
          mkdir -p "$evidence"
          git archive --format=tar.gz \
            --output "$evidence/exact-source.tar.gz" HEAD
          args=(
            --output "$evidence/readiness-manifest.json"
            --candidate-role source-head
            --source-head-sha "${GITHUB_SHA}"
            --artifact "$evidence/exact-source.tar.gz"
          )
          if [[ "$NATIVE_OUTCOME" == success && "$PYTHON_OUTCOME" == success ]]; then
            args+=(--qualified)
          fi
          python3 codex-rs/hepta-bao-adapter/qa/build_readiness_manifest.py \
            "${args[@]}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "secrets-source"
          path = root / "readiness-manifest.json"
          receipt = json.loads(path.read_text(encoding="utf-8"))
          receipt["laneOutcomes"] = {
              "native": os.environ["NATIVE_OUTCOME"],
              "python": os.environ["PYTHON_OUTCOME"],
          }
          path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat "$evidence/readiness-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-source-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secrets-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Require pristine source after qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enforce source qualification
        if: always()
        shell: bash
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
        run: |
          test "$NATIVE_OUTCOME" = success
          test "$PYTHON_OUTCOME" = success
