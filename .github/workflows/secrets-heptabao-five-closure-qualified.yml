name: Qualify materialized secrets.heptabao five-closure

on:
  push:
    branches:
      - codex/secrets-heptabao-five-closure-qualified-20260930
    paths:
      - codex-rs/hepta-bao-adapter/**
      - codex-rs/hepta-authbus/**
      - codex-rs/state/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - docs/modules/secrets.heptabao/**
      - docs/lane-a-foundation/secrets.heptabao/**
      - docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json
      - scripts/generate_secrets_heptabao_module.py
      - .github/workflows/secrets-heptabao-five-closure-qualified.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-five-closure-qualified-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  exact-source:
    runs-on: ubuntu-slim
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            rustc --version --verbose
            cargo --version --verbose
            uname -a
            sha256sum codex-rs/Cargo.lock
          } | tee "${RUNNER_TEMP}/candidate-identity.log"

      - name: Verify canonical manifest projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json"),
              *sorted(Path("docs/modules/secrets.heptabao").glob("*.json")),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"validated {len(paths)} canonical JSON documents")
          PY
          git diff --exit-code -- \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/modules/secrets.heptabao/IMPLEMENTATION_MAP.json \
            docs/modules/secrets.heptabao/CAPABILITY_MATRIX.json \
            docs/modules/secrets.heptabao/NONCLAIMS.json \
            docs/modules/secrets.heptabao/SOURCE_ANCHORS.json

      - name: Rust formatting
        working-directory: codex-rs
        run: |
          cargo fmt \
            -p codex-hepta-bao-adapter \
            -p codex-hepta-authbus \
            -p codex-state-sqlite \
            -- --check

      - name: Rust all-target check
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-bao-adapter --all-targets

      - name: Rust focused tests
        working-directory: codex-rs
        run: |
          cargo test --locked \
            -p codex-hepta-bao-adapter \
            -p codex-state-sqlite \
            --all-targets \
            -- --test-threads=2

      - name: AuthBus authority and admission tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2
          cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2

      - name: Strict Clippy
        working-directory: codex-rs
        run: |
          cargo clippy --locked \
            -p codex-hepta-bao-adapter \
            -p codex-state-sqlite \
            --all-targets \
            -- -D warnings

      - name: Python qualification regressions
        run: |
          python3 -m unittest discover \
            -s codex-rs/hepta-bao-adapter/qa \
            -p 'test_*.py'

      - name: Require clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short --untracked-files=all)"

      - name: Retain candidate identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-qualified-identity-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-identity.log
          if-no-files-found: warn
          retention-days: 14
