name: hcsn-currentstate-n256-uniformization-roster-resolved-hold

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_uniformization_roster_resolved_hold/**"
      - ".github/workflows/hcsn-currentstate-n256-uniformization-roster-resolved-hold.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-roster-resolved-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled roster HOLD tests
        run: python3 -m unittest qualification.hcsn_currentstate_n256_uniformization_roster_resolved_hold.test_roster_hold -v
      - name: Optimized roster HOLD tests
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_uniformization_roster_resolved_hold.test_roster_hold -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_uniformization_roster_resolved_hold/*.py
      - name: Verify exact frozen source and HOLD
        run: python3 -m qualification.hcsn_currentstate_n256_uniformization_roster_resolved_hold.verify_source
