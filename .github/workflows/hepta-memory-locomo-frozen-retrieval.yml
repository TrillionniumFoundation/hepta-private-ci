name: MemoryCell frozen LoCoMo family-separated retrieval baseline
on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - "scripts/memory_cell/locomo_frozen_retrieval.py"
      - "scripts/memory_cell/test_locomo_frozen_retrieval.py"
      - ".github/workflows/hepta-memory-locomo-frozen-retrieval.yml"
      - "codex-rs/hepta-intelligence-eval/MEMORY_CELL_LOCOMO_FROZEN_RETRIEVAL.md"
permissions:
  contents: read
  actions: read
concurrency:
  group: memorycell-locomo-frozen-retrieval-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: scripts/memory_cell
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Frozen read controls and original family partition tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/memory_cell -p 'test_locomo_frozen_retrieval.py' -v
          python3 -m unittest discover -s scripts/memory_cell -p 'test_external_locomo_pilot.py' -v
          python3 -m unittest discover -s scripts/memory_cell -p 'test_external_family_population.py' -v
          python3 -m py_compile scripts/memory_cell/locomo_frozen_retrieval.py
      - name: Download only pinned published LoCoMo input bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from urllib.request import urlopen
          from external_family_population import SOURCE_PINS
          revision='3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376'
          url=f'https://raw.githubusercontent.com/snap-research/locomo/{revision}/data/locomo10.json'
          with urlopen(url, timeout=90) as stream:
              data=stream.read(32*1024*1024+1)
          if len(data)>32*1024*1024 or sha256(data).hexdigest()!=SOURCE_PINS['locomo']:
              raise ValueError('pinned original LoCoMo bytes differ')
          Path('/tmp/lo-original.json').write_bytes(data)
          PY
      - name: Seal original source families, then export gold-free histories
        run: |
          set -euo pipefail
          python3 scripts/memory_cell/external_locomo_pilot.py \
            /tmp/lo-original.json /tmp/lo-pilot --source-commit "$SOURCE_COMMIT"
          python3 scripts/memory_cell/locomo_frozen_retrieval.py stage \
            /tmp/lo-pilot/public /tmp/lo-original.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          from locomo_frozen_retrieval import canonical, strict_json, write_once
          root=Path('/tmp/lo-pilot')
          public=strict_json((root/'public/population.json').read_bytes())
          all_targets=strict_json((root/'targets/targets.json').read_bytes())
          for split in ('selection','evaluation'):
              expected={r['question_id'] for r in public['splits'][split]}
              if len(expected)!=16 or not expected.issubset(all_targets):
                  raise ValueError('unregistered split target census')
              directory=Path('/tmp/lo-private-'+split)
              directory.mkdir()
              write_once(directory/'targets.json',canonical({k:all_targets[k] for k in sorted(expected)})+b'\n')
          if any('target' in p.name.lower() for p in (root/'public').iterdir()):
              raise ValueError('target artifact entered public reader input')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: locomo-reader-public-${{ github.sha }}
          path: /tmp/lo-pilot/public
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: locomo-target-selection-${{ github.sha }}
          path: /tmp/lo-private-selection
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: locomo-target-evaluation-${{ github.sha }}
          path: /tmp/lo-private-evaluation
          if-no-files-found: error
  retrieve:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: locomo-reader-public-${{ github.sha }}
          path: /tmp/lo-public
      - name: Freeze all 720 label-blind source decisions
        run: |
          set -euo pipefail
          test "$(find /tmp/lo-public -maxdepth 1 -type f | wc -l)" -eq 3
          python3 scripts/memory_cell/locomo_frozen_retrieval.py retrieve \
            /tmp/lo-public /tmp/lo-retrieval
          (cd /tmp/lo-retrieval && find . -type f ! -name SHA256SUMS \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: locomo-frozen-decisions-${{ github.sha }}
          path: /tmp/lo-retrieval
          if-no-files-found: error
  select:
    needs: [publish, retrieve]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: locomo-reader-public-${{ github.sha }}
          path: /tmp/lo-public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: locomo-frozen-decisions-${{ github.sha }}
          path: /tmp/lo-retrieval
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: locomo-target-selection-${{ github.sha }}
          path: /tmp/lo-select-target
      - name: Use selection labels only; freeze policy before eval job
        run: |
          set -euo pipefail
          mkdir -p /tmp/lo-frozen
          python3 scripts/memory_cell/locomo_frozen_retrieval.py score-selection \
            /tmp/lo-public /tmp/lo-retrieval /tmp/lo-select-target/targets.json \
            /tmp/lo-frozen/selection-policy.json
          (cd /tmp/lo-frozen && sha256sum selection-policy.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: locomo-source-selected-policy-${{ github.sha }}
          path: /tmp/lo-frozen
          if-no-files-found: error
  evaluate:
    needs: [publish, retrieve, select]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: locomo-reader-public-${{ github.sha }}
          path: /tmp/lo-public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: locomo-frozen-decisions-${{ github.sha }}
          path: /tmp/lo-retrieval
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: locomo-source-selected-policy-${{ github.sha }}
          path: /tmp/lo-frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: locomo-target-evaluation-${{ github.sha }}
          path: /tmp/lo-eval-target
      - name: Score original annotated support on held-out source families
        run: |
          set -euo pipefail
          mkdir -p /tmp/lo-scored
          (cd /tmp/lo-frozen && sha256sum -c SHA256SUMS)
          python3 scripts/memory_cell/locomo_frozen_retrieval.py score-evaluation \
            /tmp/lo-public /tmp/lo-retrieval /tmp/lo-frozen/selection-policy.json \
            /tmp/lo-eval-target/targets.json /tmp/lo-scored/report.json
          (cd /tmp/lo-scored && sha256sum report.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: locomo-heldout-retrieval-coverage-${{ github.sha }}
          path: /tmp/lo-scored
          if-no-files-found: error
