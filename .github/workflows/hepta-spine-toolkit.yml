name: Hepta qualification runtime action test
on:
  push:
    branches: [work/spine-toolkit-20260913]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: runtime
        uses: ./.github/actions/hepta-qualified-python
      - name: Verify following steps use the staged interpreter
        run: |
          set -euo pipefail
          python3 -I -S -c 'import sqlite3,sys; assert sqlite3.sqlite_version == "3.51.3"; print(sys.executable,sqlite3.sqlite_version)'
          git diff --exit-code
      - name: Install isolation tool without host policy changes
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          test "$(id -u)" -ne 0
          command -v bwrap
          test -x /usr/bin/python3
      - name: Execute existing strong isolation cases, reject any skip
        working-directory: tools/hepta-engineering-control
        env:
          HEPTA_REQUIRE_STRONG_SANDBOX: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -S - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, unittest
          import test_candidate_sandbox_hardening as tests
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(tests.CandidateSandboxStrongIsolation)
          if suite.countTestCases() != 2:
              raise SystemExit('unexpected strong-boundary inventory')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          root = pathlib.Path.cwd()
          receipt = {
              'scope':'existing_candidate_sandbox_component_only_not_full_integrated_candidate',
              'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'tests_started':result.testsRun,
              'failures':len(result.failures),
              'errors':len(result.errors),
              'skipped':len(result.skipped),
              'passed':result.wasSuccessful() and result.testsRun == 2 and not result.skipped,
              'source_digests':{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ['test_candidate_sandbox_hardening.py','control_engineering_v2/candidate.py','control_engineering_v2/control_plane.py']},
              'production_qualified':False,
              'authority_granted':False,
          }
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'strong-boundary.json').write_text(json.dumps(receipt,indent=2)+'\n')
          raise SystemExit(0 if receipt['passed'] else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualified-python-${{ github.sha }}-${{ matrix.os }}
          path: |
            ${{ steps.runtime.outputs.receipt }}
            ${{ runner.temp }}/strong-boundary.json
          if-no-files-found: error
          retention-days: 30
