name: Hepta qualification runtime action test
on:
  push:
    branches: [work/spine-toolkit-20260913]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: runtime
        uses: ./.github/actions/hepta-qualified-python
      - name: Verify following steps use the staged interpreter
        run: |
          set -euo pipefail
          python3 -I -S -c 'import sqlite3,sys; assert sqlite3.sqlite_version == "3.51.3"; print(sys.executable,sqlite3.sqlite_version)'
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualified-python-${{ github.sha }}-${{ matrix.os }}
          path: ${{ steps.runtime.outputs.receipt }}
          if-no-files-found: error
          retention-days: 30
