name: NDU cryptographic fixture hardening

on:
  push:
    branches: [work/utility-ndu-abcd-convergence-20260928]
    paths: [.github/workflows/hepta-ndu-codeql-fixture-hardening.yml]

permissions:
  contents: write

concurrency:
  group: ndu-codeql-fixture-hardening
  cancel-in-progress: false

jobs:
  sync-current-main:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge current main and restore exact-source hardening workflow
        shell: bash
        env:
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          git fetch --no-tags origin main
          BASE=$(git rev-parse refs/remotes/origin/main)
          git config user.name hepta-ndu-remediation
          git config user.email qualification@invalid
          git merge --no-edit "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          git show "$REQUEST_SHA^:.github/workflows/hepta-ndu-codeql-fixture-hardening.yml" \
            > .github/workflows/hepta-ndu-codeql-fixture-hardening.yml
          sed -i '/^# baseline-sync-main: /d' \
            .github/workflows/hepta-ndu-codeql-fixture-hardening.yml
          awk -v base="$BASE" \
            'NR == 1 { print; print "# baseline-sync-main: " base; next } { print }' \
            .github/workflows/hepta-ndu-codeql-fixture-hardening.yml \
            > .github/workflows/hepta-ndu-codeql-fixture-hardening.yml.tmp
          mv .github/workflows/hepta-ndu-codeql-fixture-hardening.yml.tmp \
            .github/workflows/hepta-ndu-codeql-fixture-hardening.yml
          rm -f .github/workflows/ndu-sync-main-and-retrigger-once.yml
          git add -A
          git diff --cached --check
          git commit -s -m 'ci(ndu): merge current main before fixture hardening'
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:$GITHUB_REF_NAME"
