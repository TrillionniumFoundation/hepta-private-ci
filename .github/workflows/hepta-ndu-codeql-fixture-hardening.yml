name: NDU cryptographic fixture hardening

on:
  push:
    branches: [work/utility-ndu-abcd-convergence-20260928]
    paths: [.github/workflows/hepta-ndu-codeql-fixture-hardening.yml]

permissions:
  contents: write

concurrency:
  group: ndu-codeql-fixture-hardening
  cancel-in-progress: false

jobs:
  sync-current-main:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/utility-ndu-abcd-convergence-20260928
          fetch-depth: 0
      - name: Restore exact-source hardening workflow on current remote head
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=work/utility-ndu-abcd-convergence-20260928
          ORIGINAL=3d34d1d62bd5cf0861c376d71882957dcf42cf8b
          git fetch --no-tags origin main "$BRANCH"
          git reset --hard "refs/remotes/origin/$BRANCH"
          BASE=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$BASE" HEAD
          git cat-file -e "$ORIGINAL^{commit}"
          git config user.name hepta-ndu-remediation
          git config user.email qualification@invalid
          git show "$ORIGINAL:.github/workflows/hepta-ndu-codeql-fixture-hardening.yml" \
            > .github/workflows/hepta-ndu-codeql-fixture-hardening.yml
          sed -i '/^# baseline-sync-main: /d' \
            .github/workflows/hepta-ndu-codeql-fixture-hardening.yml
          awk -v base="$BASE" \
            'NR == 1 { print; print "# baseline-sync-main: " base; next } { print }' \
            .github/workflows/hepta-ndu-codeql-fixture-hardening.yml \
            > .github/workflows/hepta-ndu-codeql-fixture-hardening.yml.tmp
          mv .github/workflows/hepta-ndu-codeql-fixture-hardening.yml.tmp \
            .github/workflows/hepta-ndu-codeql-fixture-hardening.yml
          rm -f .github/workflows/ndu-sync-main-and-retrigger-once.yml
          git add -A
          git diff --cached --check
          git commit -s -m 'ci(ndu): restore final fixture hardening on current head'
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:$BRANCH"
