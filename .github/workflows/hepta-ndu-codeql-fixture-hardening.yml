name: NDU cryptographic fixture materialization

on:
  push:
    branches:
      - work/utility-ndu-abcd-convergence-20260928
    paths:
      - .github/workflows/hepta-ndu-codeql-fixture-hardening.yml

permissions:
  contents: write

concurrency:
  group: ndu-cryptographic-fixture-materialization
  cancel-in-progress: false

jobs:
  materialize-runtime-fixtures:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize validated runtime-derived fixtures
        shell: bash
        env:
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=work/utility-ndu-abcd-convergence-20260928
          fixture_commit=9710c7275ea0836bebcb64030a33e3c3f0b6457a
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          git fetch --no-tags origin main work/utility-ndu-recovery-observability-20260928
          test "$(git rev-parse refs/remotes/origin/$branch)" = "$REQUEST_SHA"
          git cat-file -e "$fixture_commit^{commit}"
          git checkout "$fixture_commit" -- \
            codex-rs/hepta-agentd/src/ndu_owner_tests.rs \
            codex-rs/hepta-agentd/tests/ndu_process_e2e.rs \
            codex-rs/hepta-contracts/src/final_use_control.rs
          cd codex-rs
          cargo fmt --package codex-hepta-contracts --package codex-hepta-agentd
          cargo test --locked -p codex-hepta-contracts --lib final_use_control::tests
          cargo test --locked -p codex-hepta-agentd --lib ndu_owner_tests
          cargo test --locked -p codex-hepta-agentd --test ndu_process_e2e --no-run
          cd ..
          git add \
            codex-rs/hepta-agentd/src/ndu_owner_tests.rs \
            codex-rs/hepta-agentd/tests/ndu_process_e2e.rs \
            codex-rs/hepta-contracts/src/final_use_control.rs
          base=$(git rev-parse refs/remotes/origin/main)
          python3 scripts/hepta_ndu_map_integrity.py \
            --rebind-index \
            --candidate-branch "$branch" \
            --baseline-main "$base"
          git add docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
          python3 scripts/test_hepta_ndu_map_integrity.py
          python3 scripts/test_hepta_ndu_source_policy.py
          git diff --cached --check
          git config user.name hepta-ndu-remediation
          git config user.email qualification@invalid
          git commit -s -m 'test(ndu): derive cryptographic fixture material at runtime'
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/hepta-ndu-implementation-map-closed-world.py \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          git push origin "HEAD:$branch"
