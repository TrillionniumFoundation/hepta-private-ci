name: Secrets optimization native qualification

on:
  push:
    branches: [codex/secrets-heptabao-verified-integration-20260928]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-optimization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        role: [source-head, synthetic-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize deterministic merge without updating remote refs
        if: matrix.role == 'synthetic-merge'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hepta qualification'
          git config user.email 'hepta-qualification@users.noreply.github.com'
          base=$(git rev-parse origin/main)
          tree=$(git merge-tree --write-tree "$base" "$GITHUB_SHA")
          export GIT_AUTHOR_DATE='2026-09-28T00:00:00Z' GIT_COMMITTER_DATE='2026-09-28T00:00:00Z'
          merge=$(printf '%s\n' 'Synthetic secrets qualification; no activation authority' | git commit-tree "$tree" -p "$base" -p "$GITHUB_SHA")
          git checkout --detach "$merge"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - name: Non-native regression and manifest checks
        id: nonnative
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/optimization
          python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*.py' -v 2>&1 | tee .hepta-evidence/optimization/python.log
          python3 scripts/generate_secrets_heptabao_module.py
      - name: Exact candidate native qualification
        id: native
        continue-on-error: true
        env:
          ROLE: ${{ matrix.role }}
        run: python3 codex-rs/hepta-bao-adapter/qa/qualify.py --expected-sha "$(git rev-parse HEAD)" --candidate-role "$ROLE" --output .hepta-evidence/optimization/native
      - name: Preserve source identity and diagnostic formatting patch
        if: always()
        env:
          ROLE: ${{ matrix.role }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/optimization
          git rev-parse HEAD HEAD^{tree} > .hepta-evidence/optimization/candidate.txt
          printf '%s\n' "$GITHUB_SHA" "$ROLE" > .hepta-evidence/optimization/source.txt
          (cd codex-rs && rustc -Vv && cargo -V) > .hepta-evidence/optimization/toolchain.txt
          git status --porcelain --untracked-files=no > .hepta-evidence/optimization/tracked-status-before-diagnostic.txt
          (cd codex-rs && cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite)
          git diff --binary > .hepta-evidence/optimization/format-diagnostic.patch
          git restore --worktree .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secrets-optimization-${{ matrix.role }}-${{ github.sha }}
          path: .hepta-evidence/optimization
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve every gate failure
        if: always()
        env:
          NATIVE: ${{ steps.native.outcome }}
          NONNATIVE: ${{ steps.nonnative.outcome }}
        run: test "$NATIVE" = success && test "$NONNATIVE" = success
