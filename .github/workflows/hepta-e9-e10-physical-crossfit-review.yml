name: Hepta E9-E10 real-model crossfit and negative route review (DENY_ALL)
on:
  pull_request:
    paths:
      - 'qualification/shared-stem-system2-architecture/e9_*.py'
      - 'qualification/shared-stem-system2-architecture/e10_*.py'
      - 'qualification/shared-stem-system2-architecture/test_e9_*.py'
      - 'qualification/shared-stem-system2-architecture/test_e10_*.py'
      - 'qualification/shared-stem-system2-architecture/E9_E10_*.md'
      - 'qualification/shared-stem-system2-architecture/observations/E9_*.json'
      - 'qualification/shared-stem-system2-architecture/observations/E10_*.json'
      - '.github/workflows/hepta-e9-e10-physical-crossfit-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-physical-crossfit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: qualification/shared-stem-system2-architecture
      ROOT: qualification/shared-stem-system2-architecture
      OUTPUT: /tmp/hepta-e9-e10-audit
      PHYSICAL: /tmp/hepta-e9-original-physical-11908591037.zip
      HISTORICAL: /tmp/hepta-e9-original-historical-11886761368.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind exact current source before any artifact IO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT"
          git rev-parse HEAD | tee "$OUTPUT/head.txt"
          python --version | tee "$OUTPUT/python.txt"
          sha256sum "$ROOT"/e9_*.py "$ROOT"/e10_*.py "$ROOT"/test_e9_*.py "$ROOT"/test_e10_*.py \
            | tee "$OUTPUT/source-sha256.txt"
      - name: Fetch ONLY ORIGINAL physical pretrained probability ZIP first (no label ZIP yet)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$HISTORICAL"
          curl --fail --location --retry 2 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11908591037/zip' \
            -o "$PHYSICAL"
          echo "d8e2af397d7ea862245fae0337588ab491dd70e8a8a9a42879e4a7f2d4be3afa  $PHYSICAL" | sha256sum -c -
          python "$ROOT/e9_crossfit.py" prepare --physical "$PHYSICAL" --output "$OUTPUT/prelabel.json"
          sha256sum "$OUTPUT/prelabel.json" > "$OUTPUT/prelabel.sha256"
      - name: Source-bound historical label extraction to four TRAIN-ONLY manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "$OUTPUT/prelabel.sha256"
          curl --fail --location --retry 2 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11886761368/zip' \
            -o "$HISTORICAL"
          echo "e5d945c655112139fce51b989023abd5111c9e7ab28d9bd4e8a771b86dd95f9d  $HISTORICAL" | sha256sum -c -
          PRE=$(cut -d' ' -f1 "$OUTPUT/prelabel.sha256")
          python "$ROOT/e9_crossfit.py" train-labels \
            --historical "$HISTORICAL" --prelabel "$OUTPUT/prelabel.json" \
            --prelabel-sha256 "$PRE" --output-prefix "$OUTPUT/train"
          rm -- "$HISTORICAL"
          test ! -e "$HISTORICAL"
          sha256sum "$OUTPUT"/train-fold*.json > "$OUTPUT/train-only-sha256.txt"
      - name: Fit each source-group fold using ONLY its 96 train labels; seal choices before holdout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$HISTORICAL"
          PRE=$(cut -d' ' -f1 "$OUTPUT/prelabel.sha256")
          for fold in 0 1 2 3; do
            TRAIN="$OUTPUT/train-fold$fold.json"
            TRAIN_SHA=$(sha256sum "$TRAIN" | cut -d' ' -f1)
            python "$ROOT/e9_crossfit.py" fit \
              --prelabel "$OUTPUT/prelabel.json" --prelabel-sha256 "$PRE" \
              --train "$TRAIN" --train-sha256 "$TRAIN_SHA" --fold "$fold" \
              --output "$OUTPUT/fit$fold.json"
          done
          sha256sum "$OUTPUT"/fit*.json > "$OUTPUT/pre-holdout-sealed-choices.sha256"
          test ! -e "$HISTORICAL"
      - name: Only AFTER training fold seals, recover original held-out label archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "$OUTPUT/pre-holdout-sealed-choices.sha256"
          curl --fail --location --retry 2 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11886761368/zip' \
            -o "$HISTORICAL"
          echo "e5d945c655112139fce51b989023abd5111c9e7ab28d9bd4e8a771b86dd95f9d  $HISTORICAL" | sha256sum -c -
      - name: Compute original source-group-out-of-fold REAL model route score
        shell: bash
        run: |
          set -euo pipefail
          PRE=$(cut -d' ' -f1 "$OUTPUT/prelabel.sha256")
          python "$ROOT/e9_crossfit.py" evaluate \
            --prelabel "$OUTPUT/prelabel.json" --prelabel-sha256 "$PRE" \
            --fits "$OUTPUT/fit0.json" "$OUTPUT/fit1.json" "$OUTPUT/fit2.json" "$OUTPUT/fit3.json" \
            --historical "$HISTORICAL" --output "$OUTPUT/four-fold-crossfit.json"
      - name: Independent original-ZIP model/label/training-choice/score recomputation
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/e9_independent_review.py" \
            --historical "$HISTORICAL" --physical "$PHYSICAL" \
            --prelabel "$OUTPUT/prelabel.json" --scored "$OUTPUT/four-fold-crossfit.json" \
            --fits "$OUTPUT/fit0.json" "$OUTPUT/fit1.json" "$OUTPUT/fit2.json" "$OUTPUT/fit3.json" \
            --output "$OUTPUT/independent-original-zip-review.json"
          python "$ROOT/e10_paired_pareto.py" \
            --original "$ROOT/observations/E7_ORIGINAL_PHYSICAL_RETROSPECTIVE_20261015.json" \
            --independent "$ROOT/observations/E7_INDEPENDENT_SECOND_ALGORITHM_20261015.json" \
            --output "$OUTPUT/exact-paired-four-hypotheses-pareto.json"
          sha256sum "$OUTPUT"/*.json > "$OUTPUT/review-receipt-sha256.txt"
      - name: E9 E10 adversarial tests both normal and -O with ORIGINAL pinned ZIPs
        shell: bash
        env:
          HEPTA_E9_PHYSICAL: /tmp/hepta-e9-original-physical-11908591037.zip
          HEPTA_E9_HISTORICAL: /tmp/hepta-e9-original-historical-11886761368.zip
        run: |
          set -euo pipefail
          python -W error::ResourceWarning -m unittest discover -s "$ROOT" -p 'test_e9_*.py' -v \
            > "$OUTPUT/test-e9-normal.log" 2>&1 || { tail -100 "$OUTPUT/test-e9-normal.log"; exit 1; }
          python -O -W error::ResourceWarning -m unittest discover -s "$ROOT" -p 'test_e9_*.py' -v \
            > "$OUTPUT/test-e9-optimized.log" 2>&1 || { tail -100 "$OUTPUT/test-e9-optimized.log"; exit 1; }
          python -W error::ResourceWarning -m unittest discover -s "$ROOT" -p 'test_e10_*.py' -v \
            > "$OUTPUT/test-e10-normal.log" 2>&1 || { tail -100 "$OUTPUT/test-e10-normal.log"; exit 1; }
          python -O -W error::ResourceWarning -m unittest discover -s "$ROOT" -p 'test_e10_*.py' -v \
            > "$OUTPUT/test-e10-optimized.log" 2>&1 || { tail -100 "$OUTPUT/test-e10-optimized.log"; exit 1; }
          for file in "$OUTPUT"/test-*.log; do tail -6 "$file"; done
      - name: Always retain source/hash/negative and failed attempts; no weights/ZIPs exported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-e9-e10-original-fourfold-negative-${{ github.run_id }}
          path: /tmp/hepta-e9-e10-audit/
          retention-days: 14
          if-no-files-found: warn
