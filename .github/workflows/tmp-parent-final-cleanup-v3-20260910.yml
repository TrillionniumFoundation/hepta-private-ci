name: tmp-parent-final-cleanup-v3-20260910

on:
  push:
    branches:
      - codex/hepta-all-gap-closure-20260908
    paths:
      - .github/workflows/tmp-parent-final-cleanup-v3-20260910.yml

permissions:
  contents: write

concurrency:
  group: tmp-parent-final-cleanup-v3-20260910
  cancel-in-progress: false

jobs:
  clean-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Construct committed clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/hepta-all-gap-closure-20260908"
          carrier="$(git rev-parse HEAD)"
          find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -delete
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): seal clean parent workflow set'
          test "$(git rev-parse HEAD^)" = "$carrier"
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -quit)"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify committed parent candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          git show --check --oneline --no-renames HEAD
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish without overwriting a newer head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/hepta-all-gap-closure-20260908
