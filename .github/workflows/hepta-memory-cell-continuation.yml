name: MemoryCell owner and benchmark continuation
on:
  pull_request:
    paths:
      - ".github/workflows/hepta-memory-cell-continuation.yml"
      - "scripts/memory_cell/**"
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-bellman-operator/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-intelligence-eval/**"
permissions:
  contents: read
concurrency:
  group: memory-cell-continuation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retain exact source
        run: |
          mkdir -p /tmp/memory-cell-source
          git archive --format=tar.gz HEAD AGENTS.md justfile defs.bzl codex-rs docs scripts .github > /tmp/memory-cell-source/owner-inputs.tar.gz
          git rev-parse HEAD > /tmp/memory-cell-source/tested-commit.txt
          sha256sum /tmp/memory-cell-source/owner-inputs.tar.gz > /tmp/memory-cell-source/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-cell-owner-source-inputs
          path: /tmp/memory-cell-source
          if-no-files-found: error
  native-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [locomo, longmemeval]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned CPU model environment
        run: |
          python3 -m venv /tmp/mcell-python
          /tmp/mcell-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/mcell-python/bin/pip install -r scripts/memory_cell/requirements.txt
      - name: Native adapters and leakage/ablation tests
        run: /tmp/mcell-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v
      - name: Stage public pinned model and data inputs
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_XET: "1"
        run: /tmp/mcell-python/bin/python scripts/memory_cell/prepare.py native /tmp/mcell-inputs
      - name: Execute original-format public benchmark pilot
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          HEPTA_MEMORY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          BENCHMARK: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcell-native
          cp /tmp/mcell-inputs/staging.json /tmp/mcell-native/staging.json
          git rev-parse HEAD > /tmp/mcell-native/tested-commit.txt
          /tmp/mcell-python/bin/pip freeze > /tmp/mcell-native/python-lock.txt
          /tmp/mcell-python/bin/python scripts/memory_cell/run_native.py /tmp/mcell-inputs "/tmp/mcell-native/$BENCHMARK" "$BENCHMARK" --qa-limit 16
          find /tmp/mcell-native -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > /tmp/mcell-native/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-native-model-evidence-${{ matrix.kind }}
          path: /tmp/mcell-native
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.kind == 'locomo'
        with:
          name: memory-cell-laya-training-pairs
          path: /tmp/mcell-native/locomo/laya-pairs.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.kind == 'locomo'
        with:
          name: memory-cell-trained-native-circuit
          path: /tmp/mcell-native/locomo/native-export
          if-no-files-found: error
  native-owner:
    needs: native-models
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-cell-trained-native-circuit
          path: /tmp/circuit
      - name: Test actual Neuron and execute trained parameters through the owner
        run: |
          set -euo pipefail
          just test -p codex-hepta-neuron
          cd codex-rs
          cargo run -p codex-hepta-neuron --example memory_cell_owner -- /tmp/circuit /tmp/neuron-owner-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-native-owner-evidence
          path: /tmp/neuron-owner-evidence
          if-no-files-found: warn
  training-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest
      - name: Compile and test the actual owning crates
        run: just test -p codex-hepta-learning-artifacts -p codex-hepta-intelligence-eval -p codex-hepta-bellman-operator -p codex-hepta-infer-worker-host
      - name: Test source-admitted candidate owner boundaries
        if: ${{ !cancelled() }}
        run: just test -p codex-hepta-agentd --test terminal_cell_owner
      - name: Exercise concrete serving authority and process cancellation
        if: ${{ !cancelled() }}
        run: just test -p codex-hepta-agentd --lib memory_serving_process::tests
      - name: Test selected serving against the actual fleet revocation owner
        if: ${{ !cancelled() }}
        run: just test -p codex-hepta-agentd --lib shared_memory_training::selected::service::fleet::tests
      - name: Stage real pretrained worker model
        if: ${{ !cancelled() }}
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_XET: "1"
        run: |
          python3 -m venv /tmp/mcell-python
          /tmp/mcell-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/mcell-python/bin/pip install -r scripts/memory_cell/requirements.txt
          /tmp/mcell-python/bin/python scripts/memory_cell/prepare.py native /tmp/mcell-inputs
          PYTHONPATH=scripts/memory_cell /tmp/mcell-python/bin/python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          from pretrained import file_inventory
          from native import digest
          print('HEPTA_MEMORY_BASE_DIGEST=' + digest(file_inventory(Path('/tmp/mcell-inputs/reader'))))
          PY
          echo "HEPTA_MEMORY_PROGRAM=$GITHUB_WORKSPACE/scripts/memory_cell/owner_worker.py" >> "$GITHUB_ENV"
      - name: Real cognitive-store to ledger to offline LoRA to candidate and revocation
        if: ${{ !cancelled() }}
        env:
          HEPTA_MEMORY_PYTHON: /tmp/mcell-python/bin/python
          HEPTA_MEMORY_MODEL_DIR: /tmp/mcell-inputs/reader
          HEPTA_MEMORY_EVIDENCE_DIR: /tmp/training-owner-evidence
        run: just test -p codex-hepta-agentd --test terminal_cell_owner --run-ignored all actual_pretrained_worker_consumes_cognitive_and_learning_owner_job
      - name: Run trained adapter through the actual native serving consumer
        if: ${{ !cancelled() }}
        env:
          HEPTA_MEMORY_PYTHON: /tmp/mcell-python/bin/python
          HEPTA_MEMORY_MODEL_DIR: /tmp/mcell-inputs/reader
          HEPTA_MEMORY_EVIDENCE_DIR: /tmp/training-owner-evidence
          HEPTA_MEMORY_SERVING_PROGRAM: ${{ github.workspace }}/scripts/memory_cell/serving_worker.py
        run: just test -p codex-hepta-agentd --lib --run-ignored all real_pretrained_adapter_runs_through_native_effect_consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-training-owner-evidence
          path: /tmp/training-owner-evidence
          if-no-files-found: warn
  laya-pretrained:
    needs: native-models
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-cell-laya-training-pairs
          path: /tmp/laya-pairs
      - name: Install and stage the pinned Laya checkpoint
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_XET: "1"
        run: |
          python3 -m venv /tmp/mcell-python
          /tmp/mcell-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/mcell-python/bin/pip install -r scripts/memory_cell/requirements.txt
          /tmp/mcell-python/bin/python scripts/memory_cell/prepare.py laya /tmp/laya-inputs
      - name: Train actual Laya scorer tensors and retain held-out outputs
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONPATH: scripts/memory_cell
        run: |
          /tmp/mcell-python/bin/python - <<'PY'
          import json
          from pathlib import Path
          import torch
          from laya_backend import train_and_measure
          torch.set_num_threads(2)
          train_and_measure(Path('/tmp/laya-inputs/laya'), Path('/tmp/laya-inputs/laya_common.py'), json.loads(Path('/tmp/laya-pairs/laya-pairs.json').read_text()), Path('/tmp/laya-evidence'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-laya-pretrained-evidence
          path: /tmp/laya-evidence
          if-no-files-found: warn

  source-format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Check formatting and retain the exact formatter diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install uv==0.8.22
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --base "$BASE"
          git diff --binary > /tmp/memory-cell-format.patch
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-format-diagnostics
          path: /tmp/memory-cell-format.patch
          if-no-files-found: warn
