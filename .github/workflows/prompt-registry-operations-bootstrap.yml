name: Prompt registry operational closure bootstrap

# Re-run on the current exact PR head after the predecessor was cancelled by later pushes.
on:
  push:
    branches: [codex/prompt-registry-remediation-20260927]
    paths:
      - "scripts/apply-prompt-registry-operations.py"
      - ".github/workflows/prompt-registry-operations-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: prompt-registry-operations-bootstrap-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --quiet
          git diff --cached --quiet

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Normalize reviewed bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-prompt-registry-operations.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "use std::fs::OpenOptions;\n": "#[cfg(unix)]\nuse std::fs::OpenOptions;\n",
              "use std::io::Write;\n": "#[cfg(unix)]\nuse std::io::Write;\n",
              "use std::time::SystemTime;\n": "#[cfg(unix)]\nuse std::time::SystemTime;\n",
              "use std::time::UNIX_EPOCH;\n": "#[cfg(unix)]\nuse std::time::UNIX_EPOCH;\n",
              '"codex-rs/hepta-prompt-registry/src/durable.rs::tests",': '"codex-rs/hepta-prompt-registry/src/durable.rs",',
              '"codex-rs/hepta-prompt-registry/src/durable_maintenance.rs::tests",': '"codex-rs/hepta-prompt-registry/src/durable_maintenance.rs",',
              '"codex-rs/hepta-prompt-registry/src/lib_tests.rs::final_use"': '"codex-rs/hepta-prompt-registry/src/lib_tests.rs"',
              '"codex-rs/hepta-prompt-registry/src/lib_tests.rs::relation"': '"codex-rs/hepta-prompt-registry/src/lib_tests.rs"',
              '"codex-rs/hepta-prompt-registry/src/lib_tests.rs::admission"': '"codex-rs/hepta-prompt-registry/src/lib_tests.rs"',
              '"codex-rs/hepta-prompt-registry/src/v2_tests.rs::delivery"': '"codex-rs/hepta-prompt-registry/src/v2_tests.rs"',
              '"codex-rs/hepta-prompt-registry/src/v2_tests.rs::compatible"': '"codex-rs/hepta-prompt-registry/src/v2_tests.rs"',
              '"codex-rs/hepta-prompt-registry/src/v2_tests.rs::dereference"': '"codex-rs/hepta-prompt-registry/src/v2_tests.rs"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing reviewed bootstrap anchor: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply bounded operational closure
        run: python3 scripts/apply-prompt-registry-operations.py

      - name: Format and test prompt registry
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-prompt-registry
          cargo test --locked -p codex-hepta-prompt-registry -- --nocapture --test-threads=1
          cargo test --locked -p codex-hepta-prompt-registry operational_ -- --ignored --nocapture --test-threads=1
          cargo clippy --locked -p codex-hepta-prompt-registry --all-targets --no-deps -- -D warnings

      - name: Validate generated Python and documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          compile(
              Path("scripts/hepta-prompt-registry-map.py").read_text(encoding="utf-8"),
              "scripts/hepta-prompt-registry-map.py",
              "exec",
          )
          PY
          python3 scripts/hepta-prompt-registry-map.py
          python3 scripts/hepta-implementation-maps.py migrate --module prompt.registry
          git checkout -- docs/modules/prompt.registry/IMPLEMENTATION_MAP.json
          git diff --check

      - name: Commit operational closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "prompt.registry: add operational checkpoint and qualification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
