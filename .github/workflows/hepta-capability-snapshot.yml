name: Hepta capability snapshot source qualification
on:
  push:
    branches: [work/mature-spine-native-20260913]
  pull_request:
    paths:
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-runtime/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - .github/workflows/hepta-capability-snapshot.yml
permissions:
  contents: read
concurrency:
  group: hepta-capability-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Capability and existing spine (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '7689281ad3926b3ec92fcd1646413821b8c5654b' }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number || 'source-probe' }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Compile, test and lint the existing spine plus capability entrypoint
        working-directory: codex-rs
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          args=(-p codex-hepta-control-plane -p codex-hepta-runtime -p codex-hepta-intelligence)
          record="$RUNNER_TEMP/capability-records"
          mkdir -p "$record"
          rustc -vV > "$record/rust-version.txt"
          python3 -S ../scripts/hepta_ci_exec.py --output "$record/check.json" -- cargo check --locked "${args[@]}" --all-targets
          python3 -S ../scripts/hepta_ci_exec.py --output "$record/test.json" -- just test --locked "${args[@]}" --run-ignored all 2>&1 | tee "$record/test.log"
          python3 -S ../scripts/hepta_ci_exec.py --output "$record/clippy.json" -- cargo clippy --locked "${args[@]}" --all-targets -- -D warnings
          python3 -S ../scripts/hepta_ci_exec.py --output "$record/format.json" -- cargo fmt --package codex-hepta-control-plane --package codex-hepta-runtime --package codex-hepta-intelligence -- --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capability-source-records-${{ env.SOURCE_SHA }}-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capability-records
          if-no-files-found: error
          retention-days: 30
