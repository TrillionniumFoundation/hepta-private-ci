name: Hepta Windows fixture diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/hepta-agentd-windows-fixtures.yml"
      - "codex-rs/hepta-agentd/src/*test*.rs"
      - "codex-rs/ext/queue/tests/queue_service.rs"

permissions:
  contents: read

concurrency:
  group: hepta-windows-fixtures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Exact-head Windows Agentd and queue fixtures
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - name: Checkout exact candidate without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Prepare existing Windows Bazel toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test
      - name: Run actual fixture targets and retain all test output
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-windows-fixtures"
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --platforms=//:windows_x86_64_msvc \
            --test_tag_filters=-argument-comment-lint \
            --test_output=all \
            --nocache_test_results \
            --build_metadata=COMMIT_SHA="$EXPECTED_HEAD" \
            -- \
            //codex-rs/hepta-agentd:hepta-agentd-unit-tests \
            //codex-rs/ext/queue:queue-queue_service-test \
            2>&1 | tee "$RUNNER_TEMP/hepta-windows-fixtures/test-output.log"
      - name: Verify unchanged tracked source
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
      - name: Preserve test output and execution evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-windows-fixtures-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/hepta-windows-fixtures
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: warn
