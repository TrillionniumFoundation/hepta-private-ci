name: Hepta exact Bazel lock reconciliation

on:
  push:
    branches:
      - dot/bazel-lock-reconcile-20261022
    paths:
      - .github/workflows/hepta-bazel-lock-reconcile-20261022.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-exact-bazel-lock-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-commit-lock:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/dot/bazel-lock-reconcile-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact isolated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and isolate write target
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          remote_sha="$(git ls-remote origin refs/heads/dot/bazel-lock-reconcile-20261022 | cut -f1)"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: exact-lock-reconcile-20261022

      - name: Generate and verify actual Bazel lock postimage
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .hepta-lock-candidate
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          set +e
          just bazel-lock-update > .hepta-lock-candidate/update.log 2>&1
          update_result=$?
          printf '%s\n' "$update_result" > .hepta-lock-candidate/update.exit
          if test "$update_result" -eq 0; then
            ./scripts/check-module-bazel-lock.sh > .hepta-lock-candidate/verify.log 2>&1
            verify_result=$?
          else
            verify_result=125
          fi
          printf '%s\n' "$verify_result" > .hepta-lock-candidate/verify.exit
          set -e
          sha256sum MODULE.bazel.lock > .hepta-lock-candidate/MODULE.bazel.lock.sha256
          git hash-object MODULE.bazel.lock > .hepta-lock-candidate/MODULE.bazel.lock.git-blob
          git diff --stat -- MODULE.bazel.lock > .hepta-lock-candidate/diff.stat
          git diff --numstat -- MODULE.bazel.lock > .hepta-lock-candidate/diff.numstat
          test "$update_result" -eq 0
          test "$verify_result" -eq 0
          git diff --check
          other_changes="$(git diff --name-only -- . ':!MODULE.bazel.lock')"
          if test -n "$other_changes"; then
            echo 'Bazel lock refresh modified unrelated tracked files' >&2
            printf '%s\n' "$other_changes" >&2
            exit 1
          fi

      - name: Publish only exact generated lock after source lease
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: dot/bazel-lock-reconcile-20261022
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if git diff --quiet -- MODULE.bazel.lock; then
            echo 'Regenerated lock is identical to existing source' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'hepta-lock-qualification[bot]'
          git config user.email 'hepta-lock-qualification[bot]@users.noreply.github.com'
          git add -- MODULE.bazel.lock
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'MODULE.bazel.lock'
          git commit -m 'build(bazel): reconcile exact-source crate extension lock'
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Lock postimage commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Lock Git blob: $(git hash-object MODULE.bazel.lock)" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain lock-generation diagnostics and exact postimage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-bazel-exact-lock-${{ github.sha }}
          path: |
            .hepta-lock-candidate/
            MODULE.bazel.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
