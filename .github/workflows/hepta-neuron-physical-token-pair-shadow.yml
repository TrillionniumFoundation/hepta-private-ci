name: Hepta physical token paired Head research (no promotion)

on:
  pull_request:
    paths:
      - "qualification/neuron-shared-encoder/**"
      - ".github/workflows/hepta-neuron-physical-token-pair-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-real-token-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  modernbert-public-token-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKEN_CAPTURE_MAX_LENGTH: "168"
      TOKEN_CAPTURE_BATCH: "8"
      SOURCE_SHA256: "1f1a463eebd130288445f5b7bf39377c0775c7cfc00a9cca4da87637a19eeff2"
      SOURCE_ARTIFACT_ID: "11881847060"
      SOURCE_RUN_ID: "38534349397"
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: qualification/neuron-shared-encoder
    steps:
      - name: Checkout exact PR SHA with no persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install isolated pinned CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hepta-token-real-env"
          PY="$RUNNER_TEMP/hepta-token-real-env/bin/python"
          "$PY" -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          "$PY" -m pip install --disable-pip-version-check 'transformers==4.57.1' 'huggingface-hub==0.36.0' 'numpy==2.2.6' 'safetensors==0.7.0' 'pytest==9.0.2' 'cryptography==46.0.4'
          "$PY" -c 'import torch,safetensors,transformers,huggingface_hub; print(torch.__version__, transformers.__version__)'

      - name: Run all local shadow gates before real-weight acquisition
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-token-real-env/bin/python"
          "$PY" -m pytest -q -p no:cacheprovider tests/test_physical_token_pair_v1.py tests/test_stage_modernbert_public_v1.py tests/test_physical_token_reviewer_v1.py tests/test_physical_token_capture_profile_v1.py tests/test_tokenizer_length_preflight_v1.py tests/test_token_stream_binding_v2.py tests/test_paired_holdout_effect_v1.py
          "$PY" -m compileall -q neuron_shared_encoder/physical_token_pair_v1.py neuron_shared_encoder/stage_modernbert_public_v1.py neuron_shared_encoder/physical_token_reviewer_v1.py neuron_shared_encoder/tokenizer_length_preflight_v1.py neuron_shared_encoder/token_stream_binding_v2.py neuron_shared_encoder/paired_holdout_effect_v1.py

      - name: Retrieve exact original public AG News source artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/hepta-original-public.zip"
          echo "${SOURCE_SHA256}  $RUNNER_TEMP/hepta-original-public.zip" | sha256sum --check

      - name: Preflight original full-token inputs with pinned small tokenizer before large weights
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-token-real-env/bin/python"
          "$PY" -m neuron_shared_encoder.tokenizer_length_preflight_v1 \
            --source-zip "$RUNNER_TEMP/hepta-original-public.zip" \
            --source-sha256 "$SOURCE_SHA256" \
            --tokenizer-destination "$RUNNER_TEMP/hepta-pinned-tokenizer-only" \
            --receipt "$RUNNER_TEMP/hepta-token-budget-preflight.json" \
            --max-length "${TOKEN_CAPTURE_MAX_LENGTH}" --batch "${TOKEN_CAPTURE_BATCH}"
          "$PY" - <<'PYGATE'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'hepta-token-budget-preflight.json').read_text())
          assert r['schema'] == 'hepta.neuron.tokenizer-only-length-preflight.shadow.v2'
          assert r['full_joint_untruncated_row_count'] == 128
          assert r['capture_max_length'] == int(os.environ['TOKEN_CAPTURE_MAX_LENGTH'])
          assert r['capture_batch'] == int(os.environ['TOKEN_CAPTURE_BATCH'])
          assert len(r['per_cell']) == 2
          assert all(c['input_rows'] == 64 and
                     c['maximum_untruncated_tokens'] <= r['capture_max_length']
                     for c in r['per_cell'])
          assert r['model_weights_downloaded_by_this_step'] is False
          assert r['pretrained_encoder_forward_verified'] is False
          assert r['production_admission'] == 'BLOCKED'
          print('TOKENIZER_BUDGET_ONLY_NO_MODEL_FORWARD_OR_PRODUCTION')
          PYGATE

      - name: Explicitly download and SHA-pin immutable ModernBERT assets
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-token-real-env/bin/python"
          "$PY" -m neuron_shared_encoder.stage_modernbert_public_v1 \
            --source-zip "$RUNNER_TEMP/hepta-original-public.zip" \
            --source-sha256 "$SOURCE_SHA256" \
            --destination "$RUNNER_TEMP/hepta-pinned-modernbert" \
            --receipt "$RUNNER_TEMP/hepta-modernbert-acquisition.json"
          BUNDLE_SHA="$($PY -c 'import json,sys; print(json.load(open(sys.argv[1]))["bundle_sha256"])' "$RUNNER_TEMP/hepta-modernbert-acquisition.json")"
          echo "HEPTA_BUNDLE_SHA256=$BUNDLE_SHA" >> "$GITHUB_ENV"

      - name: Real token Encoder → equal-parameter paired training → sealed Packed replay
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-token-real-env/bin/python"
          "$PY" -m neuron_shared_encoder.physical_token_pair_v1 \
            --source-zip "$RUNNER_TEMP/hepta-original-public.zip" \
            --source-sha256 "$SOURCE_SHA256" \
            --checkpoint-dir "$RUNNER_TEMP/hepta-pinned-modernbert" \
            --bundle-sha256 "$HEPTA_BUNDLE_SHA256" \
            --tokenizer-preflight "$RUNNER_TEMP/hepta-token-budget-preflight.json" \
            --output "$RUNNER_TEMP/hepta-real-token-pair" \
            --max-length "$TOKEN_CAPTURE_MAX_LENGTH" --encoder-batch "$TOKEN_CAPTURE_BATCH" --steps 20 --seeds 11 23 47
          "$PY" - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'hepta-real-token-pair' / 'report.json').read_text())
          assert r['schema'] == 'hepta.neuron.real-token-paired-retrospective.v1'
          assert r['real_model_encoder_forward_observed'] is True
          assert r['distinct_holdout_cases'] == 32 and len(r['runs']) == 3
          assert r['no_independent_future_or_ood_window_verified'] is True
          assert r['production_admission'] == 'BLOCKED' and r['selection_authorized'] is False
          assert all(x['all_32_holdout_rows_for_both_arms_verified'] and x['max_packed_delta'] < 1e-5 for x in r['runs'])
          assert len(list((Path(os.environ['RUNNER_TEMP'])/'hepta-real-token-pair').rglob('head.safetensors'))) == 12
          print('REAL_PRETRAINED_TOKEN_RESEARCH_PASS_ONLY_NOT_PRODUCTION')
          PY

      - name: Independently re-encode and replay sealed Heads with NumPy
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/hepta-token-real-env/bin/python"
          "$PY" -m neuron_shared_encoder.physical_token_reviewer_v1 \
            --source-zip "$RUNNER_TEMP/hepta-original-public.zip" \
            --source-sha256 "$SOURCE_SHA256" \
            --checkpoint-dir "$RUNNER_TEMP/hepta-pinned-modernbert" \
            --bundle-sha256 "$HEPTA_BUNDLE_SHA256" \
            --tokenizer-preflight "$RUNNER_TEMP/hepta-token-budget-preflight.json" \
            --producer "$RUNNER_TEMP/hepta-real-token-pair" \
            --output "$RUNNER_TEMP/hepta-token-independent-review.json" \
            --max-length "$TOKEN_CAPTURE_MAX_LENGTH" --batch "$TOKEN_CAPTURE_BATCH"
          "$PY" - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'hepta-token-independent-review.json').read_text())
          assert r['schema'] == 'hepta.neuron.token-pair-independent-numerical-review.v1'
          assert r['checked_head_checkpoints'] == 12
          assert r['checked_holdout_cases_per_seed'] == 32
          assert r['training_seeds'] == [11, 23, 47]
          paired = r['paired_original_case_descriptive_effect']
          assert paired['schema'] == 'hepta.neuron.paired-original-case-retrospective.v1'
          assert paired['original_holdout_cases'] == 32
          assert paired['repeated_train_seeds'] == [11, 23, 47]
          assert set(paired['paired_token_minus_pooled']) == {'accuracy', 'brier', 'nll'}
          assert paired['three_training_seeds_are_not_independent_cases'] is True
          assert paired['model_winner_selected'] is False
          assert paired['prospective_future_outcome_verified'] is False
          assert paired['production_admission'] == 'BLOCKED'
          assert r['independent_numeric_replay_all_metrics_passed'] is True
          assert r['real_pretrained_encoder_forward_reobserved'] is True
          assert r['production_admission'] == 'BLOCKED'
          assert r['selection_authorized'] is False
          assert r['verified_prospective_future_NDU'] is False
          assert r['original_observer_independently_signed'] is False
          print('FRESH_FORWARD_NUMPY_REPLAY_RESEARCH_ONLY')
          PY

      - name: Retain only small Head weights and research receipts, never source/model/tokens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-real-token-research-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-modernbert-acquisition.json
            ${{ runner.temp }}/hepta-token-budget-preflight.json
            ${{ runner.temp }}/hepta-token-independent-review.json
            ${{ runner.temp }}/hepta-real-token-pair
          if-no-files-found: warn
          retention-days: 14
