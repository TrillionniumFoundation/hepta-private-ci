name: Final all-branches convergence R2

on:
  push:
    branches:
      - ops/final-all-branches-convergence-20260908
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: final-all-branches-convergence-r2
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CANDIDATE_BRANCH: integration/final-all-branches-main-tree-r2-20260908
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build one canonical history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-convergence-bot'
          git config user.email 'hepta-convergence-bot@users.noreply.github.com'
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          canonical=origin/main
          if git show-ref --verify --quiet refs/remotes/origin/codex/hepta-v9-blocker-closure-20260908; then
            canonical=origin/codex/hepta-v9-blocker-closure-20260908
          elif git show-ref --verify --quiet refs/remotes/origin/codex/hepta-w0-seven-lanes-handoff-20260908; then
            canonical=origin/codex/hepta-w0-seven-lanes-handoff-20260908
          fi
          git checkout -B "$CANDIDATE_BRANCH" "$canonical"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-ff -X ours origin/main -m 'merge: retain current main lineage in final convergence R2'
          fi
          mkdir -p .convergence
          printf 'branch\tsha\tmode\n' > .convergence/report.tsv
          priority=(
            codex/hepta-final-gap-closure-r3-20260908
            integration/hepta-w0-internal-closure-20260908
            codex/hepta-w0-seven-lanes-handoff-20260908
            reviewer/ci-governance-simplification-20260908
            codex/hepta-bao-connect-20260908
            codex/hepta-v9-blocker-closure-20260908
          )
          for branch in "${priority[@]}"; do
            ref="refs/remotes/origin/$branch"
            git show-ref --verify --quiet "$ref" || continue
            sha=$(git rev-parse "$ref")
            if git merge-base --is-ancestor "$sha" HEAD; then
              printf '%s\t%s\talready-contained\n' "$branch" "$sha" >> .convergence/report.tsv
            else
              git merge --no-ff -X ours "$ref" -m "merge: integrate priority branch $branch"
              printf '%s\t%s\tcontent-merge\n' "$branch" "$sha" >> .convergence/report.tsv
            fi
          done
          if [[ -e .g1/trillionnium_os_external_evidence ]]; then
            git rm -r .g1/trillionnium_os_external_evidence
            git commit -m 'chore: keep external OS evidence outside the Hepta main tree'
          fi
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | grep -v '^main$' | grep -v "^${CANDIDATE_BRANCH}$" | sort -u)
          for branch in "${branches[@]}"; do
            ref="refs/remotes/origin/$branch"
            sha=$(git rev-parse "$ref")
            if git merge-base --is-ancestor "$sha" HEAD; then
              grep -Fq "$branch"$'\t' .convergence/report.tsv || printf '%s\t%s\talready-contained\n' "$branch" "$sha" >> .convergence/report.tsv
            else
              git merge --no-ff -s ours "$ref" -m "archive: absorb superseded branch $branch without changing canonical tree"
              printf '%s\t%s\thistory-merge\n' "$branch" "$sha" >> .convergence/report.tsv
            fi
          done
          python3 - <<'PY'
          import csv, json, subprocess
          from pathlib import Path
          rows=list(csv.DictReader(Path('.convergence/report.tsv').open(),delimiter='\t'))
          p=Path('docs/archive'); p.mkdir(parents=True,exist_ok=True)
          payload={'schema':1,'generated_by':'final-all-branches-convergence-r2.yml','pre_qualification_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'branches':rows}
          (p/'branch-convergence-20260908.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add docs/archive/branch-convergence-20260908.json
          git commit -m 'docs: record final branch convergence ancestry R2'
          failed=0
          while IFS= read -r branch; do
            [[ "$branch" == HEAD || "$branch" == main || "$branch" == "$CANDIDATE_BRANCH" ]] && continue
            sha=$(git rev-parse "refs/remotes/origin/$branch")
            git merge-base --is-ancestor "$sha" HEAD || { echo "::error::unabsorbed $branch $sha"; failed=1; }
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort -u)
          test "$failed" -eq 0

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Repair current rustls/hyper source-chain classification only when reproduced
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          if cargo test --locked -p codex-http-client --lib -- --test-threads=1; then
            exit 0
          fi
          cd ..
          python3 - <<'PY'
          import re
          from pathlib import Path
          paths=[
            Path('codex-rs/http-client/src/tls_backend_fallback.rs'),
            Path('codex-rs/http-client/src/route_aware_client_pool.rs'),
            Path('codex-rs/http-client/src/transport.rs'),
          ]
          changed=[]
          for path in paths:
            if not path.exists(): continue
            original=path.read_text()
            text=original
            for ident in ('error','source','cause','current','err'):
              text=text.replace(f'{ident}.to_string().to_ascii_lowercase()',f'format!("{{0}} {{0:?}}", {ident}).to_ascii_lowercase()')
              text=text.replace(f'{ident}.to_string().to_lowercase()',f'format!("{{0}} {{0:?}}", {ident}).to_lowercase()')
              text=re.sub(rf'let\s+(?P<n>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*{ident}\.to_string\(\);',lambda m:f'let {m.group("n")} = format!("{{0}} {{0:?}}", {ident});',text)
            if text != original:
              path.write_text(text)
              changed.append(str(path))
          if not changed:
            raise SystemExit('TLS failure reproduced but no supported classifier expression was found')
          print('debug-inclusive error-chain classification:', *changed)
          PY
          cd codex-rs
          cargo fmt --all
          cargo test --locked -p codex-http-client --lib -- --test-threads=1
          cd ..
          git add codex-rs/http-client
          git commit -m 'fix(http): classify nested rustls certificate and protocol errors'

      - name: Full source qualification
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all -- --check
          for package in codex-hepta-contracts codex-hepta-bao-adapter codex-hepta-supervisor codex-hepta-ndu codex-hepta-neuron codex-hepta-learning-ledger codex-hepta-intelligence-eval codex-hepta-plasticity codex-hepta-shadow-qualification; do
            cargo test --locked -p "$package" --all-targets
          done
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cd ..
          for script in scripts/verify_pre_coding_readiness.py scripts/verify_implementation_dossiers.py scripts/verify_technical_closure.py scripts/verify_implementation_contracts.py scripts/verify_paper_evidence.py scripts/verify_adaptive_algorithm_sources.py; do
            [[ -f "$script" ]] && python3 "$script"
          done

      - name: Push R2 candidate and open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$CANDIDATE_BRANCH" --json number --jq '.[0].number // empty')
          body='Final R2 convergence candidate. Every remote branch head is recorded as ancestry; current product branches are content-integrated, historical/backup/controller branches are history-integrated without rolling the canonical tree backward. The shared HTTP TLS blocker is reproduced before any change and repaired only if present. This head is pushed only after full format, focused Hepta, workspace check, Clippy, workspace tests and repository-native verification pass.'
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title 'merge: converge every branch into the single main tree (R2)' --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$CANDIDATE_BRANCH" --title 'merge: converge every branch into the single main tree (R2)' --body "$body"
          fi
