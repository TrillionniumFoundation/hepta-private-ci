name: control.runtime exact source export

on:
  push:
    branches:
      - codex/control-runtime-convergence-v1
    paths:
      - .github/workflows/control-runtime-export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Package exact branch source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf control-runtime-source.tar.gz \
            codex-rs/hepta-control-plane \
            codex-rs/agentd \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            codex-rs/rust-toolchain.toml \
            docs/modules/control.runtime \
            docs/readiness/CONTROL_RUNTIME_EXECUTION.md \
            docs/readiness/CONTROL_RUNTIME_CONVERGENCE.md \
            qualification/module-execution-dossiers/detail/control.runtime.md \
            .github/workflows/control-runtime-qualification.yml \
            .github/workflows/control-runtime-exact-candidate.yml 2>/dev/null || \
          tar -czf control-runtime-source.tar.gz \
            codex-rs/hepta-control-plane \
            codex-rs/agentd \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            docs/modules/control.runtime \
            docs/readiness/CONTROL_RUNTIME_EXECUTION.md \
            docs/readiness/CONTROL_RUNTIME_CONVERGENCE.md \
            qualification/module-execution-dossiers/detail/control.runtime.md
      - uses: actions/upload-artifact@v4
        with:
          name: control-runtime-exact-source
          path: control-runtime-source.tar.gz
          if-no-files-found: error
          retention-days: 1
