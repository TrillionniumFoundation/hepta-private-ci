name: MemoryCell token source normalization
on:
  pull_request:
    paths:
      - '.github/workflows/hepta-memory-token-format.yml'
permissions:
  contents: read
  actions: read
jobs:
  normalize:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 2
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-external-span-e2e
          run-id: 37919555733
          github-token: ${{ github.token }}
          path: /tmp/format-reference
      - name: Normalize explicit Python files and remove this temporary writer
        env:
          BASELINE: c265a129b027e106ccc85a25a0d99b0836439ed6
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 29cd58233e6834f9e20daa69454cd510bafbe598
          git fetch --no-tags --depth=1 origin "$BASELINE"
          python3 -m venv /tmp/source-format
          /tmp/source-format/bin/pip install "$(grep -E '^uv==[0-9.]+$' /tmp/format-reference/environment.txt)"
          mkdir /tmp/source-result
          python3 - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          names = ['token_evidence.py', 'test_token_evidence.py', 'task_answer_learning.py', 'test_task_answer_learning.py', 'token_task_trial.py', 'test_token_task_trial.py']
          Path('/tmp/source-result/before.json').write_text(json.dumps({n: hashlib.sha256(ast.dump(ast.parse(Path('scripts/memory_cell', n).read_text())).encode()).hexdigest() for n in names}))
          PY
          PATH="/tmp/source-format/bin:$PATH" just fmt --base "$BASELINE"
          python3 - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          before = json.loads(Path('/tmp/source-result/before.json').read_text())
          for n, expected in before.items():
              actual = hashlib.sha256(ast.dump(ast.parse(Path('scripts/memory_cell', n).read_text())).encode()).hexdigest()
              assert actual == expected, n
          Path('/tmp/source-result/ast-identical.json').write_text(json.dumps(before, indent=2))
          PY
          git rm .github/workflows/hepta-memory-token-format.yml
          git add scripts/memory_cell/token_*.py scripts/memory_cell/test_token_*.py scripts/memory_cell/task_answer_learning.py scripts/memory_cell/test_task_answer_learning.py
          git diff --cached --check
          git diff --cached > /tmp/source-result/format.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory-cell): normalize token-task source with identical ASTs and remove temporary writer'
          git push origin "HEAD:refs/heads/codex/memory-token-format-${GITHUB_RUN_ID}"
          git rev-parse HEAD | tee /tmp/source-result/commit.txt
          git rev-parse HEAD^{tree} > /tmp/source-result/tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-token-source-normalization
          path: /tmp/source-result
          if-no-files-found: warn
