name: MemoryCell strict-native rank-direction audit
on:
  push:
    branches: ["codex/memory-cell-evidence-20261008"]
    paths:
      - "scripts/memory_cell/stem_pinned_rank_direction.py"
      - "scripts/memory_cell/test_stem_pinned_rank_direction.py"
      - ".github/workflows/hepta-memory-stem-rank-direction.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-stem-rank-direction-${{ github.sha }}
  cancel-in-progress: false
jobs:
  pinned-label-free-rank-audit:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run no-model fail-closed geometry regressions
        run: |
          set -euo pipefail
          mkdir -p /tmp/stem-rank-direction
          git rev-parse HEAD > /tmp/stem-rank-direction/auditing-commit.txt
          git rev-parse HEAD^{tree} > /tmp/stem-rank-direction/auditing-tree.txt
          python3 -m unittest -v test_stem_pinned_rank_direction 2>&1 | tee /tmp/stem-rank-direction/tests.log
          python3 -m compileall -q scripts/memory_cell/stem_pinned_rank_direction.py scripts/memory_cell/test_stem_pinned_rank_direction.py
      - name: Fetch byte-pinned successful STRICT source model artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11702192907/zip > /tmp/stem-strict-cb9e983.zip
          printf '%s  %s\n' be3393f448993451c7860e8867e28a79f5fb7f95d5773f79ed55b30d12a84776 /tmp/stem-strict-cb9e983.zip | sha256sum -c -
      - name: Recompute 576 rank direction boundaries against original report
        run: |
          set -euo pipefail
          python3 scripts/memory_cell/stem_pinned_rank_direction.py \
            --strict-zip /tmp/stem-strict-cb9e983.zip \
            --out /tmp/stem-rank-direction/report.json \
            2>&1 | tee /tmp/stem-rank-direction/audit.log
      - name: Retain audit code and all success/failure evidence hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/stem-rank-direction/source
          cp scripts/memory_cell/stem_pinned_rank_direction.py /tmp/stem-rank-direction/source/
          cp scripts/memory_cell/test_stem_pinned_rank_direction.py /tmp/stem-rank-direction/source/
          cp scripts/memory_cell/stem_audit_archive.py /tmp/stem-rank-direction/source/
          cp .github/workflows/hepta-memory-stem-rank-direction.yml /tmp/stem-rank-direction/source/
          (cd /tmp/stem-rank-direction && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-stem-pinned-rank-direction
          path: /tmp/stem-rank-direction
          if-no-files-found: error
