name: Hepta native Rust

on:
  pull_request:
    paths:
      - "apps/hepta-native/**"
      - "codex-rs/hepta-native-gateway/**"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/hepta-native-rust.yml"
  push:
    branches: [main]
    paths:
      - "apps/hepta-native/**"
      - "codex-rs/hepta-native-gateway/**"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/hepta-native-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-native-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/hepta-native
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libssl-dev \
            desktop-file-utils

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Clippy authenticated native gateway
        working-directory: codex-rs
        run: cargo clippy -p codex-hepta-native-gateway --all-targets -- -D warnings

      - name: Test authenticated native gateway
        working-directory: codex-rs
        run: cargo test -p codex-hepta-native-gateway

      - name: Headless product smoke contract
        run: cargo run --bin hepta-native -- --self-test

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Smoke release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./target/release/hepta-native --self-test

      - name: Smoke release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\\target\\release\\hepta-native.exe --self-test

      - name: Package unsigned macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          app="dist/Hepta Native.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Helpers"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp target/release/hepta-native "$app/Contents/MacOS/hepta-native"
          cp target/release/hepta-native-updater "$app/Contents/Helpers/hepta-native-updater"
          cp target/release/hepta-native-credential "$app/Contents/Helpers/hepta-native-credential"
          plutil -lint "$app/Contents/Info.plist"
          archive="$RUNNER_TEMP/hepta-native-${RUNNER_OS}-${RUNNER_ARCH}-unsigned.tar.gz"
          tar -C dist -czf "$archive" "Hepta Native.app"
          mv "$archive" dist/

      - name: Package unsigned Linux application directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          appdir="dist/HeptaNative.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications"
          cp target/release/hepta-native "$appdir/usr/bin/"
          cp target/release/hepta-native-updater "$appdir/usr/bin/"
          cp target/release/hepta-native-credential "$appdir/usr/bin/"
          cp packaging/linux/hepta-native.desktop "$appdir/usr/share/applications/"
          desktop-file-validate "$appdir/usr/share/applications/hepta-native.desktop"
          archive="$RUNNER_TEMP/hepta-native-${RUNNER_OS}-${RUNNER_ARCH}-unsigned.tar.gz"
          tar -C dist -czf "$archive" "HeptaNative.AppDir"
          mv "$archive" dist/

      - name: Package unsigned development artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force `
            -Path target/release/hepta-native.exe,target/release/hepta-native-updater.exe,target/release/hepta-native-credential.exe `
            -DestinationPath "dist/hepta-native-$env:RUNNER_OS-$env:RUNNER_ARCH-unsigned.zip"

      - name: Smoke packaged macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: '"dist/Hepta Native.app/Contents/MacOS/hepta-native" --self-test'

      - name: Smoke packaged Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: ./dist/HeptaNative.AppDir/usr/bin/hepta-native --self-test

      - name: Smoke packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist/smoke -ErrorAction SilentlyContinue
          Expand-Archive -Force "dist/hepta-native-$env:RUNNER_OS-$env:RUNNER_ARCH-unsigned.zip" dist/smoke
          .\\dist\\smoke\\hepta-native.exe --self-test

      - name: Write merge-candidate qualification receipt (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HEPTA_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEPTA_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("target/release")
          binaries = ["hepta-native", "hepta-native-updater", "hepta-native-credential"]
          digests = {}
          for name in binaries:
              path = root / name
              digests[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {
              "schema": "hepta.ui-native-qualification-receipt.v1",
              "candidate_class": "merge_candidate" if os.environ.get("GITHUB_EVENT_NAME") == "pull_request" else "exact_head",
              "checked_out_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_head_sha": os.environ["HEPTA_SOURCE_HEAD_SHA"],
              "base_sha": os.environ.get("HEPTA_BASE_SHA", ""),
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "unsigned_development_artifact": True,
              "production_signing_observed": False,
              "independent_accessibility_acceptance": False,
              "release_authority": False,
              "binary_sha256": digests,
          }
          pathlib.Path("dist/qualification-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Write merge-candidate qualification receipt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HEPTA_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEPTA_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          @'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("target/release")
          binaries = ["hepta-native.exe", "hepta-native-updater.exe", "hepta-native-credential.exe"]
          digests = {}
          for name in binaries:
              path = root / name
              digests[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {
              "schema": "hepta.ui-native-qualification-receipt.v1",
              "candidate_class": "merge_candidate" if os.environ.get("GITHUB_EVENT_NAME") == "pull_request" else "exact_head",
              "checked_out_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_head_sha": os.environ["HEPTA_SOURCE_HEAD_SHA"],
              "base_sha": os.environ.get("HEPTA_BASE_SHA", ""),
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "unsigned_development_artifact": True,
              "production_signing_observed": False,
              "independent_accessibility_acceptance": False,
              "release_authority": False,
              "binary_sha256": digests,
          }
          pathlib.Path("dist/qualification-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          '@ | python -

      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@v4
        with:
          name: hepta-native-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: apps/hepta-native/dist/*
          if-no-files-found: error

  source-head:
    name: native-source-head-ubuntu
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hepta-native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Linux native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libssl-dev \
            desktop-file-utils

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Exact-head identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Format exact head
        run: cargo fmt --check

      - name: Clippy exact head
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test exact head
        run: cargo test --all-targets

      - name: Clippy authenticated native gateway exact head
        working-directory: codex-rs
        run: cargo clippy -p codex-hepta-native-gateway --all-targets -- -D warnings

      - name: Test authenticated native gateway exact head
        working-directory: codex-rs
        run: cargo test -p codex-hepta-native-gateway

      - name: Headless exact-head product smoke
        run: cargo run --bin hepta-native -- --self-test
