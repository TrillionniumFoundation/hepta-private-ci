name: Hepta native Rust

on:
  pull_request:
    paths:
      - "apps/hepta-native/**"
      - "codex-rs/hepta-native-gateway/**"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/hepta-native-rust.yml"
  push:
    branches: [main]
    paths:
      - "apps/hepta-native/**"
      - "codex-rs/hepta-native-gateway/**"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/hepta-native-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-native-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/hepta-native
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libssl-dev \
            desktop-file-utils

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Format (diagnostic until compile closure)
        continue-on-error: true
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Clippy authenticated native gateway
        working-directory: codex-rs
        run: cargo clippy -p codex-hepta-native-gateway --all-targets -- -D warnings

      - name: Test authenticated native gateway
        working-directory: codex-rs
        run: cargo test -p codex-hepta-native-gateway

      - name: Headless product smoke contract
        run: cargo run --bin hepta-native -- --self-test

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Smoke release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./target/release/hepta-native --self-test

      - name: Smoke release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\\target\\release\\hepta-native.exe --self-test

      - name: Package unsigned macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          app="dist/Hepta Native.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Helpers"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp target/release/hepta-native "$app/Contents/MacOS/hepta-native"
          cp target/release/hepta-native-updater "$app/Contents/Helpers/hepta-native-updater"
          cp target/release/hepta-native-credential "$app/Contents/Helpers/hepta-native-credential"
          plutil -lint "$app/Contents/Info.plist"
          archive="$RUNNER_TEMP/hepta-native-${RUNNER_OS}-${RUNNER_ARCH}-unsigned.tar.gz"
          tar -C dist -czf "$archive" "Hepta Native.app"
          mv "$archive" dist/

      - name: Package unsigned Linux application directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          appdir="dist/HeptaNative.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications"
          cp target/release/hepta-native "$appdir/usr/bin/"
          cp target/release/hepta-native-updater "$appdir/usr/bin/"
          cp target/release/hepta-native-credential "$appdir/usr/bin/"
          cp packaging/linux/hepta-native.desktop "$appdir/usr/share/applications/"
          desktop-file-validate "$appdir/usr/share/applications/hepta-native.desktop"
          archive="$RUNNER_TEMP/hepta-native-${RUNNER_OS}-${RUNNER_ARCH}-unsigned.tar.gz"
          tar -C dist -czf "$archive" "HeptaNative.AppDir"
          mv "$archive" dist/

      - name: Package unsigned development artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force `
            -Path target/release/hepta-native.exe,target/release/hepta-native-updater.exe,target/release/hepta-native-credential.exe `
            -DestinationPath "dist/hepta-native-$env:RUNNER_OS-$env:RUNNER_ARCH-unsigned.zip"

      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@v4
        with:
          name: hepta-native-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: apps/hepta-native/dist/*
          if-no-files-found: error
