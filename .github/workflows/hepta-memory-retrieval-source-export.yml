name: Hepta retrieval exact source export

on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]

permissions:
  contents: read

jobs:
  export:
    if: contains(github.event.head_commit.message, '[retrieval-source-export-v1]')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/retrieval-source-export"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-source-export/identity.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/retrieval-source-export/source.tar.gz"
          shasum -a 256 "$RUNNER_TEMP/retrieval-source-export/source.tar.gz" > "$RUNNER_TEMP/retrieval-source-export/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrieval-source-export-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-source-export/
          retention-days: 1
          if-no-files-found: error
