name: Hepta final convergence report

on:
  push:
    branches:
      - ops/hepta-final-convergence-controller-20260909-r1

concurrency:
  group: hepta-final-convergence-report-r1
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    env:
      HEPTA_PR_NUMBER: '480'
      HEPTA_CONTROLLER_BRANCH: ops/hepta-final-convergence-controller-20260909-r1
      HEPTA_AUDIT_OUT: ${{ runner.temp }}/hepta-final-convergence-audit
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      blocker_count: ${{ steps.result.outputs.blocker_count }}
      eligible: ${{ steps.result.outputs.eligible }}
      head_sha: ${{ steps.result.outputs.head_sha }}
      merge_sha: ${{ steps.result.outputs.merge_sha }}
    steps:
      - name: Check out exact controller source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind controller identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$HEPTA_CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/scripts/hepta_final_convergence_audit.py
          python3 -m py_compile .github/scripts/hepta_final_convergence_audit.py

      - name: Execute read-only live audit
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/hepta_final_convergence_audit.py

      - name: Extract bounded outputs
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          packet = json.loads((Path(os.environ['HEPTA_AUDIT_OUT']) / 'audit.json').read_text())
          print(f"blocker_count={packet['blockerCount']}")
          print(f"eligible={str(packet['eligibleForConvergenceStaging']).lower()}")
          print(f"head_sha={packet['pullRequest']['headSha']}")
          print(f"merge_sha={packet['pullRequest']['prospectiveMergeSha'] or ''}")
          PY

      - name: Upload immutable audit packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-final-convergence-report-${{ github.sha }}
          path: ${{ env.HEPTA_AUDIT_OUT }}
          if-no-files-found: error
          retention-days: 30

  report:
    if: always() && needs.audit.result != 'cancelled'
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: '480'
      CONTROLLER_SHA: ${{ github.sha }}
    steps:
      - name: Download exact audit packet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-final-convergence-report-${{ github.sha }}
          path: ${{ runner.temp }}/audit

      - name: Create or update bounded PR checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPOSITORY']
          pr_number = int(os.environ['PR_NUMBER'])
          packet = json.loads((Path(os.environ['RUNNER_TEMP']) / 'audit' / 'audit.json').read_text())
          marker = '<!-- hepta-final-convergence-audit-v1 -->'
          blockers = packet['blockers']
          lines = [
              marker,
              '## Live final-convergence audit',
              '',
              f"- Observed: `{packet['observedAt']}`",
              f"- Controller: `{os.environ['CONTROLLER_SHA']}`",
              f"- Base: `{packet['pullRequest']['baseRef']}@{packet['pullRequest']['baseSha']}`",
              f"- Head: `{packet['pullRequest']['headRef']}@{packet['pullRequest']['headSha']}`",
              f"- Head tree: `{packet['pullRequest']['headTree']}`",
              f"- Prospective merge: `{packet['pullRequest']['prospectiveMergeSha']}`",
              f"- Branches observed: `{packet['branches']['branchCount']}`",
              f"- Branches with unresolved unique content: `{len(packet['branches']['unresolvedBranches'])}`",
              f"- Open authoritative readiness facts: `{packet['readiness']['openAuthorityFindingCount']}`",
              f"- Fresh eligible approvals: `{len(packet['reviews']['eligibleApprovals'])}/{packet['reviews']['requiredApprovalCount']}`",
              f"- Active unresolved review threads: `{packet['reviews']['unresolvedThreadCount']}`",
              f"- Total blockers: `{packet['blockerCount']}`",
              f"- Eligible for convergence staging: `{str(packet['eligibleForConvergenceStaging']).lower()}`",
              '',
              '### Blocker classes',
              '',
          ]
          if blockers:
              for index, blocker in enumerate(blockers[:80], 1):
                  lines.append(f"{index}. `{blocker['class']}` — {blocker['reason']}")
              if len(blockers) > 80:
                  lines.append(f"- … `{len(blockers) - 80}` additional blockers are retained in the artifact.")
          else:
              lines.append('None. This audit permits only a separately reviewed history-convergence staging transaction.')
          lines += [
              '',
              'This checkpoint is read-only. It does not merge, delete refs, approve itself, manufacture external evidence, or promote deployment/release authority.',
          ]
          body = '\n'.join(lines)

          def request(method: str, url: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url,
                  method=method,
                  data=data,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'hepta-final-convergence-report-v1',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          comments = []
          page = 1
          while True:
              batch = request('GET', f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}')
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          existing = next((item for item in comments if marker in (item.get('body') or '')), None)
          if existing:
              request('PATCH', existing['url'], {'body': body})
          else:
              request('POST', f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments', {'body': body})
          PY

  gate:
    if: always()
    needs: [audit, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce zero-blocker condition
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.audit.outputs.eligible }}" = true
          test "${{ needs.audit.outputs.blocker_count }}" = 0
