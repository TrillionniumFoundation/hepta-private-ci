name: Hepta Stem V13 original same-process cost-only CPU (DENY_ALL)

on:
  push:
    branches: [research/stem-complete-cost-only-v13-20261017]
    paths:
      - 'qualification/stem-optimal-v13/**'
      - '.github/workflows/hepta-stem-cost-only-paired-v13.yml'
  pull_request:
    paths:
      - 'qualification/stem-optimal-v13/**'
      - '.github/workflows/hepta-stem-cost-only-paired-v13.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-stem-v13-cost-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  V13: qualification/stem-optimal-v13
  PYTHONPATH: qualification/stem-optimal-v13:qualification/stem-optimal-v10:qualification/stem-optimal-v8:qualification/stem-optimal-v5:qualification/stem-optimal-v4:qualification/stem-optimal-v1

jobs:
  source-negative-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Torch NumPy for actual synthetic CPU arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 packaging==25.0
      - name: Exact SHA source contract, arithmetic, negative authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m py_compile "$V13/cost_only_v13.py" "$V13/independent_cost_v13.py" "$V13/test_cost_v13.py"
          python -m unittest discover -s "$V13" -p 'test_*.py' -v
          python -O -m unittest discover -s "$V13" -p 'test_*.py' -v

  physically-run-complete-original-model:
    needs: source-negative-tests
    if: github.event_name == 'push' && github.ref_name == 'research/stem-complete-cost-only-v13-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        candidate: [granite47, granite97]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch original six-member research manifest identity and selected prelabel inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python qualification/stem-optimal-v5/download_original_zip_v5.py \
            --manifest qualification/stem-optimal-v5/ORIGINAL_PAIR_V5.json \
            --output-dir "$RUNNER_TEMP/original" \
            --role source_v3 --role source_v4 --role cheap_v4 --role '${{ matrix.candidate }}'
      - name: Install same frozen research original pretrained FP32 CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.57.1 huggingface_hub==0.36.0 safetensors==0.6.2 numpy==2.2.6 packaging==25.0
      - name: Strict complete-pretrained load and actually paid 8 vs 32 in-resident model pairs
        shell: bash
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/physical"
          python "$V13/cost_only_v13.py" \
            --manifest qualification/stem-optimal-v5/ORIGINAL_PAIR_V5.json \
            --zip-dir "$RUNNER_TEMP/original" \
            --materials qualification/stem-optimal-v1/MODEL_MATERIALS.json \
            --candidate '${{ matrix.candidate }}' \
            --output "$RUNNER_TEMP/physical/cost-${{ matrix.candidate }}.json"
          (cd "$RUNNER_TEMP/physical" && sha256sum 'cost-${{ matrix.candidate }}.json' > 'cost-${{ matrix.candidate }}.sha256')
      - uses: actions/upload-artifact@v4
        with:
          name: stem-v13-physical-cost-${{ matrix.candidate }}-denyall
          path: |
            ${{ runner.temp }}/physical/cost-${{ matrix.candidate }}.json
            ${{ runner.temp }}/physical/cost-${{ matrix.candidate }}.sha256
          if-no-files-found: error
          retention-days: 7

  independent-model-free-cost-review:
    needs: physically-run-complete-original-model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: stem-v13-physical-cost-*-denyall
          merge-multiple: true
          path: ${{ runner.temp }}/physical
      - name: Verify two exact original SHA sidecars and reacquire the entire original evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          (cd "$RUNNER_TEMP/physical" && sha256sum --check cost-granite47.sha256 cost-granite97.sha256)
          python qualification/stem-optimal-v5/download_original_zip_v5.py \
            --manifest qualification/stem-optimal-v5/ORIGINAL_PAIR_V5.json \
            --output-dir "$RUNNER_TEMP/original" \
            --role source_v3 --role cheap_v4 --role granite47 --role granite97
      - name: Recalculate all phase/counterbalanced timing receipts without model or labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reviews"
          for model in granite47 granite97; do
            python "$V13/independent_cost_v13.py" \
              --report "$RUNNER_TEMP/physical/cost-$model.json" \
              --manifest qualification/stem-optimal-v5/ORIGINAL_PAIR_V5.json \
              --model-zip "$RUNNER_TEMP/original/$model.zip" \
              --source-zip "$RUNNER_TEMP/original/source_v3.zip" \
              --cheap-zip "$RUNNER_TEMP/original/cheap_v4.zip" \
              --output "$RUNNER_TEMP/reviews/review-$model.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: stem-v13-independent-cost-review-denyall
          path: ${{ runner.temp }}/reviews/review-*.json
          retention-days: 7
          if-no-files-found: error
