name: Native NDU Stem numerical research

on:
  pull_request:
    paths:
      - "codex-rs/hepta-ndu/research/native_stem_abcd/**"
      - ".github/workflows/hepta-native-ndu-stem-abcd.yml"
  workflow_dispatch:
    inputs:
      full_sweep:
        description: "Run the complete 22-run CPU research sweep"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  numerical-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test complete finite-law equations and shared-weight Jacobians
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-ndu-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-ndu-evidence/SOURCE_SHA.txt"
          python -m pip freeze > "$RUNNER_TEMP/native-ndu-evidence/ENVIRONMENT.txt"
          cd codex-rs/hepta-ndu/research/native_stem_abcd
          python -m compileall -q .
          python -m unittest -v 2>&1 | tee "$RUNNER_TEMP/native-ndu-evidence/TESTS.log"
      - name: Optional full numerical comparison
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sweep }}
        shell: bash
        run: |
          set -euo pipefail
          python codex-rs/hepta-ndu/research/native_stem_abcd/sweep.py \
            --out "$RUNNER_TEMP/native-ndu-evidence/sweep"
      - name: Preserve source-bound logs and numerical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ndu-stem-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ndu-evidence
          if-no-files-found: error
          retention-days: 14
