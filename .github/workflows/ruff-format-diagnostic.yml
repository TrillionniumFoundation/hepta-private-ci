name: Ruff format diff diagnostic

on:
  pull_request:
    paths:
      - "scripts/tests/test_hepta_ci_scope.py"
      - ".github/workflows/ruff-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Emit exact Ruff formatter diff (diagnostic only)
        shell: bash
        run: |
          set +e
          uv run --frozen --project scripts ruff format --diff scripts/tests/test_hepta_ci_scope.py
          status=$?
          echo "ruff_format_diff_exit=$status"
          exit 0
