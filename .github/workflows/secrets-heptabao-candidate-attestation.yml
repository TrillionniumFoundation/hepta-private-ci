name: secrets.heptabao read-only candidate attestation

on:
  pull_request:
    paths:
      - "codex-rs/hepta-bao-adapter/**"
      - "codex-rs/hepta-authbus/**"
      - "codex-rs/state/sqlite/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/secrets.heptabao/**"
      - "docs/lane-a-foundation/secrets.heptabao/**"
      - "docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json"
      - "scripts/generate_secrets_heptabao_module.py"
      - "scripts/*secrets*heptabao*"
      - ".ci/secrets-heptabao*"
      - ".hepta-bootstrap/**"
      - ".hepta-staging/**"
      - ".github/actions/hepta-synthetic-merge/action.yml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-attestation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  attest:
    if: github.event.pull_request.head.ref == 'codex/secrets-heptabao-frozen-closure-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Verify source candidate
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 codex-rs/hepta-bao-adapter/qa/verify_candidate_immutability.py
          python3 codex-rs/hepta-bao-adapter/qa/qualify.py \
            --expected-sha "$EXPECTED_SHA" \
            --candidate-role source-head \
            --output "$RUNNER_TEMP/secrets-source"
          python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*.py'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "lock=$(sha256sum codex-rs/Cargo.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manifest=$(sha256sum docs/modules/secrets.heptabao/MODULE_MANIFEST_V1.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Construct deterministic synthetic merge
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta secrets attestation
          author-email: hepta-secrets-attestation@users.noreply.github.com
          message: Synthetic secrets.heptabao attestation merge

      - name: Verify deterministic merge candidate
        id: merge-metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 codex-rs/hepta-bao-adapter/qa/verify_candidate_immutability.py
          python3 codex-rs/hepta-bao-adapter/qa/qualify.py \
            --expected-sha "$EXPECTED_SHA" \
            --candidate-role synthetic-merge \
            --output "$RUNNER_TEMP/secrets-merge"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "lock=$(sha256sum codex-rs/Cargo.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manifest=$(sha256sum docs/modules/secrets.heptabao/MODULE_MANIFEST_V1.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build source and merge readiness receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 codex-rs/hepta-bao-adapter/qa/build_readiness_manifest.py \
            --candidate-role synthetic-merge \
            --source-head-sha "${{ steps.source.outputs.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --deterministic-merge-sha "${{ steps.merge.outputs.sha }}" \
            --github-merge-sha "${{ github.event.pull_request.merge_commit_sha }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --attempt-id "${{ github.run_attempt }}" \
            --qualified \
            --output "$RUNNER_TEMP/secrets-merge/readiness-manifest.json"

      - name: Build joint external candidate attestation
        shell: bash
        run: |
          set -euo pipefail
          python3 codex-rs/hepta-bao-adapter/qa/test_candidate_attestation.py
          python3 codex-rs/hepta-bao-adapter/qa/attest_candidate.py \
            --source-receipt "$RUNNER_TEMP/secrets-source/receipt.json" \
            --merge-receipt "$RUNNER_TEMP/secrets-merge/receipt.json" \
            --source-lock-sha256 "${{ steps.source.outputs.lock }}" \
            --source-manifest-sha256 "${{ steps.source.outputs.manifest }}" \
            --merge-lock-sha256 "${{ steps.merge-metadata.outputs.lock }}" \
            --merge-manifest-sha256 "${{ steps.merge-metadata.outputs.manifest }}" \
            --provider-evidence codex-rs/hepta-bao-adapter/qa/evidence/dynamic-contract-probe-20260925.json \
            --output .hepta-evidence/secrets-candidate-attestation.json

      - name: Retain source merge and joint receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-evidence/source .hepta-evidence/merge
          cp -a "$RUNNER_TEMP/secrets-source/." .hepta-evidence/source/ 2>/dev/null || true
          cp -a "$RUNNER_TEMP/secrets-merge/." .hepta-evidence/merge/ 2>/dev/null || true

      - name: Upload exact candidate attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-candidate-attestation-${{ steps.source.outputs.sha }}-${{ steps.merge.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hepta-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
