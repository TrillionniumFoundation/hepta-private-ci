name: a32 native Rustfmt diagnostic

# LOCAL REVIEW DRAFT. Source manifest deliberately rejects until root freezes it.
# No PR, workflow_call, dispatch, schedule, resolver, build, cache, or publication.
on:
  push:
    branches: [diagnostic/a32-native-rustfmt-20261022]

permissions:
  contents: read

concurrency:
  group: a32-native-rustfmt-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_NET_OFFLINE: "true"
  CARGO_TERM_COLOR: never
  PYTHONUTF8: "1"

jobs:
  native-rustfmt:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/a32-native-rustfmt-20261022'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize failure evidence and canonical checkout bytes
        id: bootstrap
        run: |
          mkdir -p "$RUNNER_TEMP/a32-native-rustfmt"
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          keys = ('GITHUB_SHA', 'GITHUB_REF', 'GITHUB_REPOSITORY', 'GITHUB_EVENT_NAME', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion')
          p = Path(os.environ['RUNNER_TEMP']) / 'a32-native-rustfmt' / 'job-input.json'
          p.write_text(json.dumps({k: os.environ.get(k) for k in keys}, indent=2) + '\n')
          PY
          git config --global core.autocrlf false
      - name: Check out immutable event source without persistent credentials
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify reviewed product tree and exact diagnostic input before installing Rust
        id: preflight
        run: |
          python3 -I .github/scripts/a32_native_rustfmt.py \
            --repo "$GITHUB_WORKSPACE" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$(git --no-replace-objects rev-parse HEAD^{tree})" \
            --artifact-root "$RUNNER_TEMP/a32-native-rustfmt" \
            --out "$RUNNER_TEMP/a32-native-rustfmt/preflight" \
            --verify-only
      - name: Install only exact native Rust and rustfmt
        id: toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Check input and collect genuine formatting artifacts without publishing
        id: rustfmt
        run: |
          python3 -I .github/scripts/a32_native_rustfmt.py \
            --repo "$GITHUB_WORKSPACE" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$(git --no-replace-objects rev-parse HEAD^{tree})" \
            --artifact-root "$RUNNER_TEMP/a32-native-rustfmt" \
            --out "$RUNNER_TEMP/a32-native-rustfmt/payload"
      - name: Record all step outcomes even when input or generated checks fail
        id: outcomes
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'a32-native-rustfmt'
          root.mkdir(parents=True, exist_ok=True)
          (root / 'step-results.json').write_text(json.dumps(json.loads(os.environ['STEP_RESULTS']), indent=2) + '\n')
          PY
      - name: Preserve artifacts for exact source, run and attempt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a32-rustfmt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a32-native-rustfmt/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
