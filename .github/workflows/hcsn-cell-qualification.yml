name: HCSN Cell numerical qualification

on:
  pull_request:
    paths:
      - "qualification/hcsn/**"
      - ".github/workflows/hcsn-cell-qualification.yml"

permissions:
  contents: read

jobs:
  cell-values-gradients-and-budget-accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: qualification
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.3"
      - name: Install the pinned CPU research runtime
        run: |
          python -m pip install -r qualification/hcsn/requirements.txt mpmath==1.3.0
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Record source and runtime
        run: |
          mkdir -p "$RUNNER_TEMP/hx-cell"
          git rev-parse HEAD > "$RUNNER_TEMP/hx-cell/SOURCE_HEAD.txt"
          python -m pip freeze > "$RUNNER_TEMP/hx-cell/RUNTIME.txt"
      - name: Run every kernel, Cell and budget-accounting test
        run: |
          python -m unittest discover -s qualification/hcsn/tests -t qualification -v \
            > "$RUNNER_TEMP/hx-cell/STDOUT.txt" \
            2> "$RUNNER_TEMP/hx-cell/STDERR.txt"
      - name: Verify source stayed unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hx-cell-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hx-cell
          if-no-files-found: error
