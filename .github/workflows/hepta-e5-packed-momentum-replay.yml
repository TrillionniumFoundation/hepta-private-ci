name: Hepta E5 Packed momentum clean-restart study
on:
  pull_request:
    paths:
      - "experiments/shared_stem_cell/e5_packed_momentum_replay.py"
      - "experiments/shared_stem_cell/test_e5_packed_momentum_replay.py"
      - "experiments/shared_stem_cell/E5_PACKED_MOMENTUM_REPLAY.md"
      - ".github/workflows/hepta-e5-packed-momentum-replay.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-checkpoint-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install --only-binary=:all: 'numpy==2.2.6'
          python -m py_compile experiments/shared_stem_cell/e5_packed_momentum_replay.py
          python -m unittest discover -s experiments/shared_stem_cell -p test_e5_packed_momentum_replay.py -v
