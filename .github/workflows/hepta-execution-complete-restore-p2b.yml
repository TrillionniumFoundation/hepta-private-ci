name: Hepta Execution P2b (complete recovery; no tools)

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-evidence/**'
      - '.github/workflows/hepta-execution-complete-restore-p2b.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-execution-complete-p2b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  complete-intent:
    name: Original Evidence complete intent (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tested commit and prospective merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet && git diff --cached --quiet
          if [ '${{ matrix.lane }}' = base-merge ]; then
            test -n "$BASE_SHA"
            git cat-file -e "$BASE_SHA^{commit}"
            tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            merge="$(printf '%s\n' 'Qualified synthetic merge only' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            test "$(git show -s --format=%P "$merge")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$merge"
            test "$(git rev-parse HEAD^{tree})" = "$tree"
          fi
          printf 'source=%s base=%s tested=%s tree=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Verify locked source and final schema
        run: python3 scripts/verify_cargo_lock.py

      - name: Exact Rustfmt and toolchain identity
        working-directory: codex-rs
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt -p codex-hepta-contracts -p codex-hepta-evidence -- --check

      - name: Compile every original owner target under immutable lock
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-contracts -p codex-hepta-evidence --all-targets

      - name: Exact unsigned P1 envelope regression
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-contracts --lib execution_contract_v1

      - name: Original P2a SQLite and reopen regressions
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-evidence --lib execution_preparation_v1

      - name: New complete-intent atomic/crash/tamper regressions
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-evidence --lib execution_complete_v1

      - name: Preserve original provider-effect evidence semantics
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-evidence --lib provider_effect

      - name: Strict lint of both original Rust owners
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-contracts -p codex-hepta-evidence --all-targets -- -D warnings

      - name: Verify original source stays clean
        run: |
          git diff --check
          git diff --quiet
          git diff --cached --quiet
