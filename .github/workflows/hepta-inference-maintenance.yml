name: Hepta inference maintenance

on:
  push:
    branches:
      - main
      - work/architecture-scalability-convergence-20260918
    paths:
      - 'codex-rs/hepta-infer-core/**'
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/rust-toolchain*'
      - 'scripts/hepta_ci_exec.py'
      - 'scripts/hepta_laya*'
      - 'scripts/hepta_retrieval_wire.py'
      - 'scripts/tests/test_hepta_laya*'
      - 'scripts/tests/test_hepta_retrieval_wire.py'
      - 'scripts/tests/test_hepta_multiscale_ci.py'
      - '.github/workflows/hepta-inference-maintenance.yml'
  pull_request:
    paths:
      - 'codex-rs/hepta-infer-core/**'
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/rust-toolchain*'
      - 'scripts/hepta_ci_exec.py'
      - 'scripts/hepta_laya*'
      - 'scripts/hepta_retrieval_wire.py'
      - 'scripts/tests/test_hepta_laya*'
      - 'scripts/tests/test_hepta_retrieval_wire.py'
      - 'scripts/tests/test_hepta_multiscale_ci.py'
      - '.github/workflows/hepta-inference-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  owner-regression:
    name: Inference maintenance owner regression (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GitHub prospective merge identity
        if: matrix.lane == 'base-merge'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          merge_sha="$(gh api "repos/$REPO/git/ref/pull/$PR_NUMBER/merge" --jq '.object.sha')"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          observation="$(gh api "repos/$REPO/git/commits/$merge_sha")"
          mapfile -t parents < <(jq -r '.parents[].sha' <<<"$observation")
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_SHA"
          test "${parents[1]}" = "$SOURCE_SHA"
          merge_tree="$(jq -er '.tree.sha' <<<"$observation")"
          test "$merge_tree" = "$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          printf 'GITHUB_PROSPECTIVE_MERGE_SHA=%s\n' "$merge_sha" >> "$GITHUB_ENV"
          printf 'GITHUB_PROSPECTIVE_MERGE_TREE=%s\n' "$merge_tree" >> "$GITHUB_ENV"
      - name: Construct deterministic prospective merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt
      - name: Install existing repository test entry point
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Bind tested identity and retain reproducible input
        env:
          CANDIDATE: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          printf 'TESTED_SHA=%s\nHEPTA_CI_LANE=%s\n' "$CANDIDATE" "$LANE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hepta-inference-records"
          printf 'source=%s\nbase=%s\ntested=%s\ntree=%s\nlane=%s\ngithub_merge=%s\ngithub_merge_tree=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$CANDIDATE" "$(git rev-parse HEAD^{tree})" "$LANE" \
            "${GITHUB_PROSPECTIVE_MERGE_SHA:-}" "${GITHUB_PROSPECTIVE_MERGE_TREE:-}" \
            > "$RUNNER_TEMP/hepta-inference-records/identity.txt"
          git archive --format=tar "$CANDIDATE" | gzip -1 > "$RUNNER_TEMP/hepta-inference-records/source-input.tar.gz"
          rustc --version --verbose > "$RUNNER_TEMP/hepta-inference-records/toolchain.txt"
          cargo --version >> "$RUNNER_TEMP/hepta-inference-records/toolchain.txt"
          cargo fmt --version >> "$RUNNER_TEMP/hepta-inference-records/toolchain.txt"
          just --version >> "$RUNNER_TEMP/hepta-inference-records/toolchain.txt"
          cargo nextest --version >> "$RUNNER_TEMP/hepta-inference-records/toolchain.txt"
      # Execute both identities independently. No same-tree skip is a pass;
      # each lane must produce its own tests, lint and format execution records.
      - name: Verify actual execution-record and scope regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/runner.json" --minimum-tests 1 -- python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_exec*.py'
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/controls-scope.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_ci_scope scripts.tests.test_hepta_repository_controls
      - name: Run real subprocess and binary-protocol regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/laya-process.json" --minimum-tests 64 -- python3 -m unittest -v scripts.tests.test_hepta_laya_process scripts.tests.test_hepta_laya_deadline scripts.tests.test_hepta_retrieval_wire
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/ci-wiring.json" --minimum-tests 9 -- python3 -m unittest -v scripts.tests.test_hepta_multiscale_ci
      - name: Run actual owner tests without unrelated product prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/owner.json" --minimum-tests 112 -- just test --locked -p codex-hepta-infer-core -p codex-hepta-types --retries 0
      - name: Measure retained-history growth and durable replay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/maintenance-scale.json" --minimum-tests 1 -- just test --locked -p codex-hepta-infer-core --run-ignored only --no-capture --test-threads 1 --retries 0 -E 'test(semantic_journal_retained_history_curve)'
      - name: Check strict owner lint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/clippy.json" -- cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-types --all-targets -- -D warnings
      - name: Check owner formatting without modifying tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/format.json" -- cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-infer-core --package codex-hepta-types -- --check
      - name: Retain formatting suggestion separately from the tested checkout
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          proposal="$RUNNER_TEMP/hepta-format-proposal"
          git worktree add --detach "$proposal" "$TESTED_SHA"
          trap 'git worktree remove --force "$proposal"' EXIT
          cargo fmt --manifest-path "$proposal/codex-rs/Cargo.toml" --all > "$RUNNER_TEMP/hepta-inference-records/format-proposal.log" 2>&1
          git -C "$proposal" diff --binary > "$RUNNER_TEMP/hepta-inference-records/format-proposal.patch"
      - name: Verify the tested source is unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain real command evidence and source input
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-inference-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-inference-records/*
          if-no-files-found: error
          retention-days: 14
