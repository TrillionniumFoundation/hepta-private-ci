name: Hepta inference maintenance

on:
  push:
    branches:
      - main
      - work/architecture-scalability-convergence-20260918
    paths:
      - 'codex-rs/hepta-infer-core/**'
      - 'codex-rs/hepta-infer-worker-host/**'
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/rust-toolchain*'
      - 'docs/modules/inference.control/**'
      - 'qualification/module-execution-dossiers/detail/inference.control*'
      - 'scripts/hepta-inference-control-current-state.py'
      - 'scripts/hepta-inference-control-actor-migrate.py'
      - 'scripts/hepta-implementation-maps.py'
      - 'scripts/hepta_ci_candidate.py'
      - 'scripts/hepta_ci_exec.py'
      - '.github/workflows/hepta-inference-maintenance.yml'
  pull_request:
    paths:
      - 'codex-rs/hepta-infer-core/**'
      - 'codex-rs/hepta-infer-worker-host/**'
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/rust-toolchain*'
      - 'docs/modules/inference.control/**'
      - 'qualification/module-execution-dossiers/detail/inference.control*'
      - 'scripts/hepta-inference-control-current-state.py'
      - 'scripts/hepta-inference-control-actor-migrate.py'
      - 'scripts/hepta-implementation-maps.py'
      - 'scripts/hepta_ci_candidate.py'
      - 'scripts/hepta_ci_exec.py'
      - '.github/workflows/hepta-inference-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-inference-maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  owner-regression:
    name: Inference control qualification (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Verify GitHub prospective merge identity
        if: matrix.lane == 'base-merge'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          merge_sha="$(gh api "repos/$REPO/git/ref/pull/$PR_NUMBER/merge" --jq '.object.sha')"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          observation="$(gh api "repos/$REPO/git/commits/$merge_sha")"
          mapfile -t parents < <(jq -r '.parents[].sha' <<<"$observation")
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_SHA"
          test "${parents[1]}" = "$SOURCE_SHA"
          merge_tree="$(jq -er '.tree.sha' <<<"$observation")"
          test "$merge_tree" = "$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          printf 'GITHUB_PROSPECTIVE_MERGE_SHA=%s\n' "$merge_sha" >> "$GITHUB_ENV"
          printf 'GITHUB_PROSPECTIVE_MERGE_TREE=%s\n' "$merge_tree" >> "$GITHUB_ENV"

      - name: Construct deterministic prospective merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Inference CI
          author-email: hepta-inference-ci@users.noreply.github.com
          message: Synthetic inference.control merge

      - name: Bind tested identity and retain reproducible input
        env:
          CANDIDATE: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'TESTED_SHA=%s\nHEPTA_CI_LANE=%s\nCANDIDATE_TREE=%s\n' \
            "$CANDIDATE" "$LANE" "$candidate_tree" >> "$GITHUB_ENV"
          records="$RUNNER_TEMP/hepta-inference-records/$LANE"
          mkdir -p "$records/commands" "$records/evidence"
          printf 'RECORDS_DIR=%s\n' "$records" >> "$GITHUB_ENV"
          printf 'source=%s\nbase=%s\ntested=%s\ntree=%s\nlane=%s\ngithub_merge=%s\ngithub_merge_tree=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$CANDIDATE" "$candidate_tree" "$LANE" \
            "${GITHUB_PROSPECTIVE_MERGE_SHA:-}" "${GITHUB_PROSPECTIVE_MERGE_TREE:-}" \
            > "$records/identity.txt"
          git archive --format=tar "$CANDIDATE" | gzip -1 > "$records/source-input.tar.gz"
          rustc --version --verbose > "$records/toolchain.txt"
          cargo --version >> "$records/toolchain.txt"
          cargo fmt --version >> "$records/toolchain.txt"

      - name: Validate exact candidate plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/00-candidate.json" \
            -- python3 scripts/hepta_ci_candidate.py \
              --source "$SOURCE_SHA" \
              --tested "$TESTED_SHA" \
              --base "$BASE_SHA" \
              --lane "$HEPTA_CI_LANE"

      - name: Verify generated current state
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/01-current-state.json" \
            -- python3 scripts/hepta-inference-control-current-state.py check

      - name: Verify unique-writer product migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/01b-actor-migration.json" \
            -- python3 scripts/hepta-inference-control-actor-migrate.py check

      - name: Verify repository implementation maps
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/02-implementation-maps.json" \
            -- python3 scripts/hepta-implementation-maps.py verify

      - name: Verify actual execution-record and scope regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/03-runner.json" \
            --minimum-tests 1 \
            -- python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_exec*.py'
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/04-controls-scope.json" \
            --minimum-tests 1 \
            -- python3 -m unittest -v \
              scripts.tests.test_hepta_ci_scope \
              scripts.tests.test_hepta_repository_controls

      - name: Verify pinned Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/05-cargo-metadata.json" \
            -- cargo metadata --locked --manifest-path codex-rs/Cargo.toml --format-version 1

      - name: Test core types and real native host
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/06-tests.json" \
            --minimum-tests 1 \
            -- cargo test --locked --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-infer-core \
              -p codex-hepta-infer-worker-host \
              -p codex-hepta-types

      - name: Strict lint core types and real native host
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/07-clippy.json" \
            -- cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-infer-core \
              -p codex-hepta-infer-worker-host \
              -p codex-hepta-types \
              --all-targets --all-features -- -D warnings

      - name: Measure post-compaction growth and maintenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/08-maintenance-scale.json" \
            --minimum-tests 1 \
            -- cargo test --locked --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-infer-core post_compaction_multi_generation_curve \
              -- --ignored --nocapture --test-threads=1

      - name: Check owner formatting without modifying tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/09-format.json" \
            -- cargo fmt --manifest-path codex-rs/Cargo.toml \
              --package codex-hepta-infer-core \
              --package codex-hepta-infer-worker-host \
              --package codex-hepta-types \
              -- --check

      - name: Emit exact candidate evidence receipt
        if: always()
        env:
          CHECK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find "$RECORDS_DIR/commands" -maxdepth 1 -type f -name '*.json' -print | sort)
          test "${#records[@]}" -gt 0
          args=()
          for record in "${records[@]}"; do
            args+=(--command-record "$record")
          done
          python3 scripts/hepta-inference-control-current-state.py evidence \
            --lane "$HEPTA_CI_LANE" \
            --source-sha "$SOURCE_SHA" \
            --tested-sha "$TESTED_SHA" \
            --base-sha "$BASE_SHA" \
            --candidate-tree "$CANDIDATE_TREE" \
            --check-run-url "$CHECK_RUN_URL" \
            "${args[@]}" \
            --output "$RECORDS_DIR/evidence/receipt.json"

      - name: Retain formatting suggestion separately from tested checkout
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          proposal="$RUNNER_TEMP/hepta-format-proposal-${{ matrix.lane }}"
          git worktree add --detach "$proposal" "$TESTED_SHA"
          trap 'git worktree remove --force "$proposal"' EXIT
          cargo fmt --manifest-path "$proposal/codex-rs/Cargo.toml" --all \
            > "$RECORDS_DIR/format-proposal.log" 2>&1
          git -C "$proposal" diff --binary > "$RECORDS_DIR/format-proposal.patch"

      - name: Verify tested source remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retain command evidence and source input
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-inference-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ env.RECORDS_DIR }}/*
          if-no-files-found: error
          retention-days: 30

  native-host:
    name: Inference native-host qualification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Bind native-host tested identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          records="$RUNNER_TEMP/hepta-inference-records/native-host"
          mkdir -p "$records/commands" "$records/evidence"
          printf 'TESTED_SHA=%s\nCANDIDATE_TREE=%s\nRECORDS_DIR=%s\n' \
            "$SOURCE_SHA" "$candidate_tree" "$records" >> "$GITHUB_ENV"
          git archive --format=tar "$SOURCE_SHA" | gzip -1 > "$records/source-input.tar.gz"
          rustc --version --verbose > "$records/toolchain.txt"
          cargo --version >> "$records/toolchain.txt"

      - name: Verify current state and owner mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/00-current-state.json" \
            -- python3 scripts/hepta-inference-control-current-state.py check
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/00b-actor-migration.json" \
            -- python3 scripts/hepta-inference-control-actor-migrate.py check
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/01-implementation-maps.json" \
            -- python3 scripts/hepta-implementation-maps.py verify

      - name: Run native host and all binary targets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/02-native-host.json" \
            --minimum-tests 1 \
            -- cargo test --locked --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-infer-worker-host --all-targets --all-features

      - name: Run durable crash fault and tamper matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/03-durable-faults.json" \
            --minimum-tests 1 \
            -- cargo test --locked --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-infer-core \
              every_compaction_failpoint_reopens_a_complete_generation \
              -- --nocapture --test-threads=1
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/04-checkpoint-tamper.json" \
            --minimum-tests 1 \
            -- cargo test --locked --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-infer-core checkpoint_tampering_is_rejected_on_reopen \
              -- --nocapture --test-threads=1

      - name: Strict native-host lint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py \
            --output "$RECORDS_DIR/commands/05-clippy.json" \
            -- cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-infer-core \
              -p codex-hepta-infer-worker-host \
              --all-targets --all-features -- -D warnings

      - name: Emit native-host evidence receipt
        if: always()
        env:
          CHECK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find "$RECORDS_DIR/commands" -maxdepth 1 -type f -name '*.json' -print | sort)
          test "${#records[@]}" -gt 0
          args=()
          for record in "${records[@]}"; do
            args+=(--command-record "$record")
          done
          python3 scripts/hepta-inference-control-current-state.py evidence \
            --lane native-host \
            --source-sha "$SOURCE_SHA" \
            --tested-sha "$TESTED_SHA" \
            --base-sha "$BASE_SHA" \
            --candidate-tree "$CANDIDATE_TREE" \
            --check-run-url "$CHECK_RUN_URL" \
            "${args[@]}" \
            --output "$RECORDS_DIR/evidence/receipt.json"

      - name: Verify native-host source remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retain native-host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-inference-${{ github.run_id }}-${{ github.run_attempt }}-native-host
          path: ${{ env.RECORDS_DIR }}/*
          if-no-files-found: error
          retention-days: 30

  inference-control-required:
    name: Inference control required
    if: always()
    needs:
      - owner-regression
      - native-host
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every inference.control qualification lane
        env:
          OWNER_RESULT: ${{ needs.owner-regression.result }}
          HOST_RESULT: ${{ needs.native-host.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_RESULT" = success
          test "$HOST_RESULT" = success
