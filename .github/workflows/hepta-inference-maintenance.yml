name: Hepta inference maintenance

on:
  push:
    branches:
      - main
      - work/architecture-scalability-convergence-20260918
    paths:
      - 'codex-rs/hepta-infer-core/**'
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/rust-toolchain*'
      - 'scripts/hepta_ci_exec.py'
      - '.github/workflows/hepta-inference-maintenance.yml'
  pull_request:
    paths:
      - 'codex-rs/hepta-infer-core/**'
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/rust-toolchain*'
      - 'scripts/hepta_ci_exec.py'
      - '.github/workflows/hepta-inference-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  owner-regression:
    name: Inference maintenance owner regression (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GitHub prospective merge identity
        if: matrix.lane == 'base-merge'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          merge_sha="$(gh api "repos/$REPO/git/ref/pull/$PR_NUMBER/merge" --jq '.object.sha')"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          observation="$(gh api "repos/$REPO/git/commits/$merge_sha")"
          mapfile -t parents < <(jq -r '.parents[].sha' <<<"$observation")
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_SHA"
          test "${parents[1]}" = "$SOURCE_SHA"
          merge_tree="$(jq -er '.tree.sha' <<<"$observation")"
          test "$merge_tree" = "$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          printf 'GITHUB_PROSPECTIVE_MERGE_SHA=%s\n' "$merge_sha" >> "$GITHUB_ENV"
          printf 'GITHUB_PROSPECTIVE_MERGE_TREE=%s\n' "$merge_tree" >> "$GITHUB_ENV"
      - name: Construct deterministic prospective merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Bind tested identity and retain reproducible input
        env:
          CANDIDATE: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          printf 'TESTED_SHA=%s\nHEPTA_CI_LANE=%s\n' "$CANDIDATE" "$LANE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hepta-inference-records"
          printf 'source=%s\nbase=%s\ntested=%s\ntree=%s\nlane=%s\ngithub_merge=%s\ngithub_merge_tree=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$CANDIDATE" "$(git rev-parse HEAD^{tree})" "$LANE" \
            "${GITHUB_PROSPECTIVE_MERGE_SHA:-}" "${GITHUB_PROSPECTIVE_MERGE_TREE:-}" \
            > "$RUNNER_TEMP/hepta-inference-records/identity.txt"
          git archive --format=tar "$CANDIDATE" | gzip -1 > "$RUNNER_TEMP/hepta-inference-records/source-input.tar.gz"
          rustc --version --verbose > "$RUNNER_TEMP/hepta-inference-records/toolchain.txt"
          cargo --version >> "$RUNNER_TEMP/hepta-inference-records/toolchain.txt"
          cargo fmt --version >> "$RUNNER_TEMP/hepta-inference-records/toolchain.txt"
      - name: Select exact-tree native execution
        id: execution
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_candidate.py \
            --source "$SOURCE_SHA" \
            --tested "$TESTED_SHA" \
            --base "$BASE_SHA" \
            --lane "$LANE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify actual execution-record and scope regressions
        if: steps.execution.outputs.run_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/runner.json" --minimum-tests 1 -- python3 -m unittest discover -v -s scripts -p 'test_hepta_ci_exec*.py'
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/controls-scope.json" --minimum-tests 1 -- python3 -m unittest -v scripts.tests.test_hepta_ci_scope scripts.tests.test_hepta_repository_controls
      - name: Run actual owner tests without unrelated product prerequisites
        if: steps.execution.outputs.run_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/owner.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-types
      - name: Measure post-compaction growth and maintenance
        if: steps.execution.outputs.run_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/maintenance-scale.json" --minimum-tests 1 -- cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core post_compaction_multi_generation_curve -- --ignored --nocapture --test-threads=1
      - name: Check owner formatting without modifying tested source
        if: steps.execution.outputs.run_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-inference-records/format.json" -- cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-infer-core --package codex-hepta-types -- --check
      - name: Retain formatting suggestion separately from the tested checkout
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          proposal="$RUNNER_TEMP/hepta-format-proposal"
          git worktree add --detach "$proposal" "$TESTED_SHA"
          trap 'git worktree remove --force "$proposal"' EXIT
          cargo fmt --manifest-path "$proposal/codex-rs/Cargo.toml" --all > "$RUNNER_TEMP/hepta-inference-records/format-proposal.log" 2>&1
          git -C "$proposal" diff --binary > "$RUNNER_TEMP/hepta-inference-records/format-proposal.patch"
      - name: Verify the tested source is unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain real command evidence and source input
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-inference-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-inference-records/*
          if-no-files-found: error
          retention-days: 14

  materialize-authoritative:
    name: Materialize authoritative inference.worker stage 1
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1183 && github.event.pull_request.head.ref == 'codex/inference-worker-authoritative-20260929' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MATERIALIZATION_BASE: c3b3aaa9887e15bf18b1572f259b6893ddbe2b68
      MATERIALIZATION_PATCH_SHA256: a4be02dea1d771a4467f0bb05cb4be7122ab71b4d54c79506c778785e55a85a3
      MATERIALIZATION_BRANCH: codex/inference-worker-authoritative-20260929
    steps:
      - name: Check out exact authoritative transfer head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and verify immutable reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$MATERIALIZATION_BASE" HEAD)" = "$MATERIALIZATION_BASE"
          LC_ALL=C cat .github/materialization/inference-worker-stage1/part* \
            | base64 --decode > "$RUNNER_TEMP/inference-worker-stage1.patch"
          printf '%s  %s\n' "$MATERIALIZATION_PATCH_SHA256" "$RUNNER_TEMP/inference-worker-stage1.patch" \
            | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/inference-worker-stage1.patch"
          git apply "$RUNNER_TEMP/inference-worker-stage1.patch"

      - name: Format only the reviewed Rust surface
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 \
            codex-rs/hepta-infer-core/src/native_control.rs \
            codex-rs/hepta-infer-core/src/native_control_tests.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/driver.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/resources.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/resources_tests.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local_tests.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs \
            codex-rs/hepta-infer-worker-host/src/native_recovery.rs \
            codex-rs/hepta-infer-worker-host/src/native_run_control.rs \
            codex-rs/hepta-infer-worker-host/src/native_run_control_tests.rs
          git diff --check

      - name: Run durable inference core tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-core

      - name: Run authoritative local worker tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-worker-host \
            --features experimental-local-model

      - name: Restore registered workflow and verify exact final tree surface
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$MATERIALIZATION_BASE" -- .github/workflows/hepta-inference-maintenance.yml
          rm -rf .github/materialization/inference-worker-stage1
          rm -f .github/workflows/inference-worker-authoritative-materialize.yml
          python3 - <<'PYVERIFY'
          import subprocess
          expected = sorted([
              'codex-rs/hepta-infer-core/src/native_control.rs',
              'codex-rs/hepta-infer-core/src/native_control_tests.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local/driver.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local/resources.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local/resources_tests.rs',
              'codex-rs/hepta-infer-worker-host/src/experimental_local_tests.rs',
              'codex-rs/hepta-infer-worker-host/src/native_app_server.rs',
              'codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs',
              'codex-rs/hepta-infer-worker-host/src/native_recovery.rs',
              'codex-rs/hepta-infer-worker-host/src/native_run_control.rs',
              'codex-rs/hepta-infer-worker-host/src/native_run_control_tests.rs',
          ])
          actual = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', 'c3b3aaa9887e15bf18b1572f259b6893ddbe2b68', '--'],
              text=True,
          ).splitlines()))
          if actual != expected:
              raise SystemExit(f'unexpected final tree surface: {actual!r}')
          PYVERIFY
          git diff --check

      - name: Commit and push verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-inference-materializer
          git config user.email hepta-inference-materializer@users.noreply.github.com
          git add -A
          git commit -m 'inference.worker: bind peak resources and durable usage'
          git push origin "HEAD:$MATERIALIZATION_BRANCH"

