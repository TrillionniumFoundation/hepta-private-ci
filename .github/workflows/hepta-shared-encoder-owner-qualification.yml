name: Hepta shared Encoder owner qualification (read-only)

on:
  push:
    branches:
      - qualification/shared-encoder-owner-native-20261018
      # Independent exact-SHA qualification for the user-namespace repair.
      - qualification/shared-encoder-owner-userns-20261018

permissions:
  contents: read

concurrency:
  group: hepta-shared-encoder-owner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Native owner compile, test, fmt, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SOURCE_SHA: ${{ github.sha }}
      CODEX_REPO_ROOT: ${{ github.workspace }}
      PYTHONPATH: scripts
    steps:
      - name: Checkout exact immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and hosted runner preconditions
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/qualification/shared-encoder-owner-native-20261018|refs/heads/qualification/shared-encoder-owner-userns-20261018) ;;
            *) echo "::error::Unexpected native owner qualification ref: $GITHUB_REF"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/hepta-owner-evidence"
          printf 'source=%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/hepta-owner-evidence/source.txt"
          git rev-parse 'HEAD^{tree}' >> "$RUNNER_TEMP/hepta-owner-evidence/source.txt"

      - name: Install native test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          # Native App Server integration uses bubblewrap user namespaces.
          # GitHub-hosted Ubuntu 24.04 can restrict these through AppArmor.
          # These settings apply only to this ephemeral CI runner, never a
          # production host or an untrusted third-party machine.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          if ! unshare --user --map-root-user true; then
            echo "::error::Native App Server test runner lacks unprivileged user namespaces"
            exit 1
          fi
          rustc --version
          cargo --version

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash

      - name: Resolve verified V8 artifacts for owner dependencies
        shell: bash
        run: python3 scripts/hepta_ci_v8.py

      - name: Check Rustfmt for precise owner package
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-infer-worker-host -- --check 2>&1 | tee "$RUNNER_TEMP/hepta-owner-evidence/fmt.log"

      - name: Build exact-source Codex executable for real Agentd integration
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p codex-cli --bin codex 2>&1 | tee "$RUNNER_TEMP/hepta-owner-evidence/codex-cli-build.log"
          test -x target/debug/codex
          target/debug/codex --version 2>&1 | tee "$RUNNER_TEMP/hepta-owner-evidence/codex-cli-version.log"
          printf 'HEPTA_TEST_CODEX_BIN=%s\n' "$GITHUB_WORKSPACE/codex-rs/target/debug/codex" >> "$GITHUB_ENV"

      - name: Run actual owner Rust unit and integration tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-infer-worker-host 2>&1 | tee "$RUNNER_TEMP/hepta-owner-evidence/owner-test.log"

      - name: Run owner Clippy correctness lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-infer-worker-host --all-targets -- -D clippy::correctness 2>&1 | tee "$RUNNER_TEMP/hepta-owner-evidence/clippy.log"

      - name: Preserve actual qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-encoder-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-owner-evidence/
          if-no-files-found: error
          retention-days: 14
