name: Hepta r7 format render

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/hepta-r7-format-render.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install repository-pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"

      - name: Render exact Ruff-formatted executor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          uv run --frozen --project scripts ruff format scripts/hepta-global-finalizer-r7.py
          uv run --frozen --project scripts ruff format --check scripts/hepta-global-finalizer-r7.py
          python3 -m py_compile scripts/hepta-global-finalizer-r7.py
          git diff --check
          mkdir -p "${RUNNER_TEMP}/hepta-r7-formatted/scripts"
          cp scripts/hepta-global-finalizer-r7.py \
            "${RUNNER_TEMP}/hepta-r7-formatted/scripts/hepta-global-finalizer-r7.py"
          git diff -- scripts/hepta-global-finalizer-r7.py > \
            "${RUNNER_TEMP}/hepta-r7-formatted/FORMAT.patch"

      - name: Upload exact formatted executor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-r7-formatted-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-r7-formatted
          if-no-files-found: error
          retention-days: 1
