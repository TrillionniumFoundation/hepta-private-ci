name: channel.matrix repository qualification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/channel-matrix-preserve-unknown.yml'
      - '.github/workflows/channel-matrix-materialize.yml'
      - '.github/workflows/channel-matrix-protected-production.yml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/rust-toolchain.toml'
      - 'codex-rs/.config/nextest.toml'
      - 'codex-rs/hepta-contracts/**'
      - 'codex-rs/hepta-matrix-protocol/**'
      - 'codex-rs/hepta-matrix-store/**'
      - 'codex-rs/hepta-matrix-sdk/**'
      - 'codex-rs/hepta-matrixd/**'
      - 'codex-rs/hepta-supervisor/src/matrix.rs'
      - 'codex-rs/hepta-operations/**'
      - 'codex-rs/state/**'
      - 'docs/modules/channel.matrix/**'
      - 'scripts/*channel_matrix*'
      - 'scripts/tests/test_channel_matrix*'
      - 'scripts/verify_channel_matrix_candidate.py'
      - 'tests/fixtures/run-hermetic-synapse.sh'
      - 'justfile'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: channel-matrix-repository-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REQUESTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  GITHUB_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
  FINAL_MERGE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
  EVENT_KIND: ${{ github.event_name == 'push' && 'main_push' || github.event_name }}
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  source-head:
    name: Matrix source-head contract
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact-candidate prerequisites
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3 libsqlite3-dev binutils
          mkdir -p "$RUNNER_TEMP/matrix-source-head"
      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve immutable identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          base="$REQUESTED_BASE_SHA"
          if test -z "$base"; then base="$(git rev-parse origin/main)"; fi
          test "$(git rev-parse "$base^{commit}")" = "$base"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Bind tracked source provenance and exact bytes
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matrix-source-head"
          python3 scripts/verify_channel_matrix_candidate.py --expected-sha "$SOURCE_SHA" --output "$evidence/candidate.json"
          python3 scripts/channel_matrix_evidence_v2.py snapshot --expected-sha "$SOURCE_SHA" --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA" --lane source-head --output "$evidence/source.json"
          python3 scripts/channel_matrix_source_provenance.py --expected-sha "$SOURCE_SHA" --stage source-head --output "$evidence/source-provenance.json"
      - name: Execute locked source-head qualification
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/matrix-source-head"
          result=0
          for label in compile api-compile-fail focused-tests clippy format; do
            python3 scripts/channel_matrix_evidence_v2.py run --directory "$evidence" --label "$label" || result=1
          done
          python3 scripts/channel_matrix_evidence_v2.py snapshot --expected-sha "$SOURCE_SHA" --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA" --lane source-head --output "$evidence/source-after.json" || result=1
          python3 scripts/channel_matrix_status.py --directory "$evidence" || result=1
          python3 scripts/channel_matrix_qualification.py --directory "$evidence" || result=1
          if test "$result" -eq 0; then job_status=success; else job_status=failure; fi
          python3 scripts/channel_matrix_evidence_v2.py manifest --directory "$evidence" --job-status "$job_status" || result=1
          exit "$result"
      - name: Retain source-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-matrix-source-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/matrix-source-head/
          if-no-files-found: error
          retention-days: 30

  deterministic-merge:
    name: Matrix deterministic-merge contract
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact-candidate prerequisites
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3 libsqlite3-dev binutils
          mkdir -p "$RUNNER_TEMP/matrix-base-merge"
      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Materialize deterministic base merge
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          base="$REQUESTED_BASE_SHA"
          if test -z "$base"; then base="$(git rev-parse origin/main)"; fi
          tree="$(git merge-tree --write-tree "$base" "$SOURCE_SHA")"
          export GIT_AUTHOR_NAME='channel.matrix exact candidate'
          export GIT_AUTHOR_EMAIL='channel-matrix@invalid'
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          merge="$(printf '%s\n' 'channel.matrix deterministic merge candidate' | git commit-tree "$tree" -p "$base" -p "$SOURCE_SHA")"
          git checkout --detach "$merge"
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "MERGE_SHA=$merge" >> "$GITHUB_ENV"
      - name: Bind tracked merge provenance and exact bytes
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/matrix-base-merge"
          python3 scripts/verify_channel_matrix_candidate.py --expected-sha "$MERGE_SHA" --output "$evidence/candidate.json"
          python3 scripts/channel_matrix_evidence_v2.py snapshot --expected-sha "$MERGE_SHA" --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA" --lane base-merge --output "$evidence/source.json"
          python3 scripts/channel_matrix_source_provenance.py --expected-sha "$MERGE_SHA" --stage base-merge --output "$evidence/source-provenance.json"
      - name: Execute locked merge qualification
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/matrix-base-merge"
          result=0
          for label in compile api-compile-fail focused-tests clippy format; do
            python3 scripts/channel_matrix_evidence_v2.py run --directory "$evidence" --label "$label" || result=1
          done
          python3 scripts/channel_matrix_evidence_v2.py snapshot --expected-sha "$MERGE_SHA" --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA" --lane base-merge --output "$evidence/source-after.json" || result=1
          python3 scripts/channel_matrix_status.py --directory "$evidence" || result=1
          python3 scripts/channel_matrix_qualification.py --directory "$evidence" || result=1
          if test "$result" -eq 0; then job_status=success; else job_status=failure; fi
          python3 scripts/channel_matrix_evidence_v2.py manifest --directory "$evidence" --job-status "$job_status" || result=1
          exit "$result"
      - name: Retain deterministic-merge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-matrix-base-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/matrix-base-merge/
          if-no-files-found: error
          retention-days: 30

  paired-acceptance:
    name: Matrix paired repository receipt
    if: needs.source-head.result == 'success' && needs.deterministic-merge.result == 'success'
    needs: [source-head, deterministic-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Download source-head evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: channel-matrix-source-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pair/source-head
      - name: Download deterministic-merge evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: channel-matrix-base-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pair/base-merge
      - name: Require one exact paired receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pair/result"
          python3 scripts/channel_matrix_pair_acceptance_v2.py --source-head "$RUNNER_TEMP/pair/source-head" --base-merge "$RUNNER_TEMP/pair/base-merge" --output "$RUNNER_TEMP/pair/result/paired-qualification.json"
          sha256sum "$RUNNER_TEMP/pair/result/paired-qualification.json" > "$RUNNER_TEMP/pair/result/paired-qualification.sha256"
      - name: Retain paired receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-matrix-paired-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pair/result/
          if-no-files-found: error
          retention-days: 30

  readiness:
    name: Matrix readiness manifest
    if: always()
    needs: [source-head, deterministic-merge, paired-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve base, workflow and GitHub merge identities
        run: |
          set -euo pipefail
          base="$REQUESTED_BASE_SHA"
          if test -z "$base"; then base="$(git rev-parse origin/main)"; fi
          workflow_sha="$(git rev-parse "$SOURCE_SHA:.github/workflows/channel-matrix-preserve-unknown.yml")"
          if test -n "$PR_NUMBER"; then
            git fetch --no-tags origin "+refs/pull/$PR_NUMBER/merge:refs/remotes/pull/$PR_NUMBER/merge" || true
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "WORKFLOW_SHA=$workflow_sha" >> "$GITHUB_ENV"
      - name: Download source-head evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: channel-matrix-source-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readiness/source-head
      - name: Download deterministic-merge evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: channel-matrix-base-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readiness/base-merge
      - name: Download paired repository receipt
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: channel-matrix-paired-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readiness/paired
      - name: Generate one non-mixable readiness manifest
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/readiness/result"
          python3 scripts/channel_matrix_readiness.py --source-head "$RUNNER_TEMP/readiness/source-head" --base-merge "$RUNNER_TEMP/readiness/base-merge" --paired "$RUNNER_TEMP/readiness/paired/paired-qualification.json" --event-kind "$EVENT_KIND" --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA" --github-merge-sha "$GITHUB_MERGE_SHA" --final-merge-sha "$FINAL_MERGE_SHA" --workflow-sha "$WORKFLOW_SHA" --output "$RUNNER_TEMP/readiness/result/readiness-manifest.json"
          status=$?
          if test -f "$RUNNER_TEMP/readiness/result/readiness-manifest.json"; then
            sha256sum "$RUNNER_TEMP/readiness/result/readiness-manifest.json" > "$RUNNER_TEMP/readiness/result/readiness-manifest.sha256"
          fi
          exit "$status"
      - name: Retain readiness manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-matrix-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readiness/result/
          if-no-files-found: error
          retention-days: 30

  candidate-required:
    name: Matrix repository qualification required
    if: always()
    needs: [source-head, deterministic-merge, paired-acceptance, readiness]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both lanes, paired receipt and readiness manifest
        env:
          SOURCE_RESULT: ${{ needs.source-head.result }}
          MERGE_RESULT: ${{ needs.deterministic-merge.result }}
          PAIR_RESULT: ${{ needs.paired-acceptance.result }}
          READINESS_RESULT: ${{ needs.readiness.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$MERGE_RESULT" = success
          test "$PAIR_RESULT" = success
          test "$READINESS_RESULT" = success
