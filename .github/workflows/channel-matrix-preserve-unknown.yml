name: channel.matrix exact candidate

on:
  push:
    branches:
      - codex/channel-matrix-full-closure-20260927
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/channel-matrix-preserve-unknown.yml'
      - '.github/workflows/channel-matrix-closure-apply.yml'
      - '.matrix-staging/channel_matrix_apply.part*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: channel-matrix-exact-closure-apply
  cancel-in-progress: false

jobs:
  apply-verified-closure:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/channel-matrix-full-closure-20260927') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/channel-matrix-full-closure-20260927'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      STAGING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize and apply closed-scope patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STAGING_SHA"
          cat .matrix-staging/channel_matrix_apply.part* | base64 --decode > "$RUNNER_TEMP/channel_matrix_apply.py.gz"
          echo '6be88c59e74ef4d6f16231c0ba13dadfe542c69b3e060c10719bb7b7245d90a2  '"$RUNNER_TEMP/channel_matrix_apply.py.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/channel_matrix_apply.py.gz" > "$RUNNER_TEMP/channel_matrix_apply.py"
          echo '8832745814d7b33f52ee4a11c2d780133db34b21b18d204412e92bd6c43fd8bc  '"$RUNNER_TEMP/channel_matrix_apply.py" | sha256sum --check --strict
          python3 "$RUNNER_TEMP/channel_matrix_apply.py"
          git diff --check
          python3 -m compileall -q \
            scripts/channel_matrix_evidence.py \
            scripts/channel_matrix_qualification.py \
            scripts/channel_matrix_pair_acceptance.py \
            scripts/tests/test_channel_matrix_qualification.py \
            scripts/tests/test_channel_matrix_pair_acceptance.py
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' -v

      - name: Update lockfile and verify affected Rust owners
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo check -p codex-hepta-operations --all-targets
          cargo fmt --package codex-state --package codex-hepta-operations
          cargo fmt --package codex-state --package codex-hepta-operations -- --check
          cargo clippy --locked --no-deps -p codex-hepta-operations --all-targets -- -D warnings

      - name: Commit verified closure candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .matrix-staging
          git rm .github/workflows/channel-matrix-closure-apply.yml
          git add \
            .github/workflows/channel-matrix-preserve-unknown.yml \
            codex-rs/Cargo.lock \
            codex-rs/hepta-operations/Cargo.toml \
            codex-rs/hepta-operations/src/destination_dedupe.rs \
            codex-rs/hepta-operations/src/durable_store.rs \
            codex-rs/state/src/lib.rs \
            codex-rs/state/src/sqlite.rs \
            scripts/channel_matrix_evidence.py \
            scripts/channel_matrix_qualification.py \
            scripts/channel_matrix_pair_acceptance.py \
            scripts/tests/test_channel_matrix_qualification.py \
            scripts/tests/test_channel_matrix_pair_acceptance.py
          git diff --cached --check
          test -z "$(git status --porcelain | grep '^??' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'channel.matrix: close exact-candidate qualification' \
            -m 'Route durable SQLite owners through the state shim, eliminate strict clippy failures, bind transitive source bytes, generate per-test scenario executions from nextest JUnit, and add a non-skipping paired source/merge acceptance receipt without granting release authority.'
          final=$(git rev-parse HEAD)
          echo "final_sha=$final" >> "$GITHUB_OUTPUT"
          git format-patch -1 --stdout > "$RUNNER_TEMP/channel-matrix-closure.patch"
          git bundle create "$RUNNER_TEMP/channel-matrix-closure.bundle" HEAD

      - name: Retain independently replayable closure result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-matrix-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/channel-matrix-closure.patch
            ${{ runner.temp }}/channel-matrix-closure.bundle
          if-no-files-found: error
          retention-days: 30

      - name: Publish validated immutable reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote origin refs/heads/codex/channel-matrix-full-closure-20260927 | cut -f1)
          test "$remote" = "$STAGING_SHA"
          validated_ref="refs/heads/codex/channel-matrix-closure-validated-$STAGING_SHA"
          existing=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote origin "$validated_ref" | cut -f1)
          test -z "$existing" || test "$existing" = "$FINAL_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:$validated_ref"
          echo "FINAL_COMMIT=$FINAL_SHA"
          echo "VALIDATED_REF=$validated_ref"
