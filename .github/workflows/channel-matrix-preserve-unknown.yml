name: channel.matrix final send closure

on:
  push:
    branches:
      - codex/channel-matrix-convergence-20260925
    paths:
      - .github/workflows/channel-matrix-preserve-unknown.yml

permissions:
  contents: write

concurrency:
  group: channel-matrix-final-closure-${{ github.ref }}
  cancel-in-progress: false

env:
  BRANCH_NAME: codex/channel-matrix-convergence-20260925
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind trigger identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --quiet
          git diff --cached --quiet
          mkdir -p "$RUNNER_TEMP/channel-matrix-closure"

      - name: Prepare native Matrix prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Expose DotSlash
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash

      - name: Decode and apply bounded closure patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = gzip.decompress(
              base64.b64decode(
                  Path("scripts/channel_matrix_full_patch.py.gz.b64").read_bytes()
              )
          )
          target = Path("scripts/channel_matrix_preserve_unknown_patch.py")
          target.write_bytes(payload)
          target.chmod(0o755)
          PY
          python3 scripts/channel_matrix_preserve_unknown_patch.py apply
          git diff --check

      - name: Refresh Cargo lock and format exact owners
        shell: bash
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_v8.py
          cd codex-rs
          cargo metadata --format-version 1 >"$RUNNER_TEMP/channel-matrix-closure/cargo-metadata.json"
          cargo fmt \
            --package codex-hepta-matrix-store \
            --package codex-hepta-matrix-sdk \
            --package codex-hepta-matrixd
          cargo fmt \
            --package codex-hepta-matrix-store \
            --package codex-hepta-matrix-sdk \
            --package codex-hepta-matrixd \
            -- --check
          cd ..
          git diff --check

      - name: Test durable state machine
        working-directory: codex-rs
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/channel-matrix-target
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-matrix-store --test indeterminate_rejection \
            2>&1 | tee "$RUNNER_TEMP/channel-matrix-closure/matrix-store-test.log"

      - name: Test SDK authorization and reconciliation
        working-directory: codex-rs
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/channel-matrix-target
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-matrix-sdk --test durable_transport \
            2>&1 | tee "$RUNNER_TEMP/channel-matrix-closure/matrix-sdk-test.log"

      - name: Test matrixd owner and strict lint
        working-directory: codex-rs
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/channel-matrix-target
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-matrixd --lib \
            2>&1 | tee "$RUNNER_TEMP/channel-matrix-closure/matrixd-test.log"
          cargo clippy --locked \
            -p codex-hepta-matrix-store \
            -p codex-hepta-matrix-sdk \
            -p codex-hepta-matrixd \
            --all-targets -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/channel-matrix-closure/clippy.log"

      - name: Commit source and executable documentation
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Matrix CI"
          git config user.email "hepta-matrix-ci@users.noreply.github.com"
          git add \
            codex-rs/Cargo.lock \
            codex-rs/hepta-matrix-sdk \
            codex-rs/hepta-matrix-store \
            codex-rs/hepta-matrixd/src/final_use.rs \
            docs/modules/channel.matrix/*.md \
            scripts/verify_channel_matrix_candidate.py
          git diff --cached --check
          git commit -s -m "channel.matrix: persist final-use entry evidence"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          echo "sha=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Bind implementation map to tested source and retire one-shot machinery
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/channel_matrix_preserve_unknown_patch.py refresh-map \
            --source-commit "$SOURCE_COMMIT"
          python3 scripts/hepta-module-docs.py refresh-derived
          rm .github/workflows/channel-matrix-preserve-unknown.yml
          rm scripts/channel_matrix_preserve_unknown_patch.py
          rm scripts/channel_matrix_full_patch.py.gz.b64
          git add -A
          git diff --cached --check
          git commit -s -m "docs(channel.matrix): bind durable send closure to source"

      - name: Verify exact final candidate and construct receipt
        shell: bash
        run: |
          set -euo pipefail
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/verify_channel_matrix_candidate.py \
            --expected-sha "$FINAL_COMMIT" \
            --output "$RUNNER_TEMP/channel-matrix-closure/exact-candidate.json"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          SOURCE_COMMIT="${{ steps.source.outputs.sha }}" \
          FINAL_COMMIT="$FINAL_COMMIT" \
          FINAL_TREE="$FINAL_TREE" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "channel-matrix-closure"
          logs = {}
          for item in sorted(root.glob("*.log")):
              logs[item.name] = hashlib.sha256(item.read_bytes()).hexdigest()
          qualification = {
              "schema": "hepta.channel-matrix-closure-receipt.v1",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "final_commit": os.environ["FINAL_COMMIT"],
              "final_tree": os.environ["FINAL_TREE"],
              "cargo_lock_sha256": hashlib.sha256(
                  Path("codex-rs/Cargo.lock").read_bytes()
              ).hexdigest(),
              "migration_0008_sha256": hashlib.sha256(
                  Path(
                      "codex-rs/hepta-matrix-store/migrations/"
                      "0008_matrix_authority_entry.sql"
                  ).read_bytes()
              ).hexdigest(),
              "configuration": {
                  "matrix_store_test": "indeterminate_rejection",
                  "matrix_sdk_test": "durable_transport",
                  "matrixd_test": "lib",
                  "strict_clippy": True,
              },
              "log_sha256": logs,
              "external_qualification": {
                  "real_synapse_executed": False,
                  "encrypted_room_rotation": False,
                  "authenticated_backup_restore": False,
                  "sustained_capacity": False,
                  "independent_acceptance": False,
              },
          }
          config_bytes = json.dumps(
              qualification["configuration"], sort_keys=True, separators=(",", ":")
          ).encode()
          qualification["configuration_sha256"] = hashlib.sha256(config_bytes).hexdigest()
          receipt = root / "closure-receipt.json"
          receipt.write_text(json.dumps(qualification, indent=2) + "\n")
          payloads = [receipt, root / "exact-candidate.json", *sorted(root.glob("*.log"))]
          digest = hashlib.sha256()
          for payload in payloads:
              digest.update(payload.name.encode())
              digest.update(b"\0")
              digest.update(payload.read_bytes())
              digest.update(b"\0")
          (root / "artifact-payload.sha256").write_text(digest.hexdigest() + "\n")
          PY

      - name: Push reviewed branch without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git push \
            --force-with-lease="refs/heads/$BRANCH_NAME:${{ github.sha }}" \
            origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Retain exact source, logs, and payload digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-matrix-final-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel-matrix-closure
          if-no-files-found: warn
          retention-days: 30
