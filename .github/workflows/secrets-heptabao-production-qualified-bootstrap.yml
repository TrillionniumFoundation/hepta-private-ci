name: Materialize and qualify exact secrets.heptabao candidate

on:
  push:
    branches:
      - codex/secrets-heptabao-production-qualified-20260930
    paths:
      - .github/workflows/secrets-heptabao-production-qualified-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-production-qualified-bootstrap
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FEATURES: bao-https-client authbus-admission durable-leases durable-operations final-use-consumer registered-final-use-host sqlite-owner sqlite-product-runtime

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/secrets-heptabao-production-qualified-20260930
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Materialize bounded closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/close_secrets_heptabao_candidate.py
          python3 scripts/generate_secrets_heptabao_module.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-bao-adapter \
            -p codex-hepta-authbus \
            -p codex-state-sqlite
          git diff --check

      - name: Commit one source candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta qualification bot"
          git config user.email "hepta-qualification@users.noreply.github.com"
          git add \
            codex-rs/hepta-bao-adapter \
            docs/modules/secrets.heptabao \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            scripts/generate_secrets_heptabao_module.py \
            .github/workflows/secrets-heptabao-five-closure-qualified.yml
          if git diff --cached --quiet; then
            echo "materializer produced no change" >&2
            exit 1
          fi
          git commit -m "fix(secrets): bind exact candidate qualification"
          git push origin HEAD:codex/secrets-heptabao-production-qualified-20260930
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/secrets-evidence/logs"

      - name: Verify canonical manifests
        id: manifests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/generate_secrets_heptabao_module.py
          git diff --exit-code -- \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/modules/secrets.heptabao/IMPLEMENTATION_MAP.json \
            docs/modules/secrets.heptabao/CAPABILITY_MATRIX.json \
            docs/modules/secrets.heptabao/NONCLAIMS.json \
            docs/modules/secrets.heptabao/SOURCE_ANCHORS.json \
            |& tee "$RUNNER_TEMP/secrets-evidence/logs/manifests.log"

      - name: Rust formatting
        id: formatting
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite -- --check \
            |& tee "$RUNNER_TEMP/secrets-evidence/logs/format.log"

      - name: Strict Clippy
        id: clippy
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite \
            --all-targets --features "$FEATURES" -- -D warnings \
            |& tee "$RUNNER_TEMP/secrets-evidence/logs/clippy.log"

      - name: All-target tests and feature matrix
        id: tests
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite \
            --all-targets --features "$FEATURES" -- --test-threads=2 \
            |& tee "$RUNNER_TEMP/secrets-evidence/logs/all-target-tests.log"
          cargo test --locked -p codex-hepta-bao-adapter --no-default-features --all-targets \
            -- --test-threads=2 |& tee "$RUNNER_TEMP/secrets-evidence/logs/no-default-features.log"

      - name: AuthBus authority schema
        id: authbus
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2 \
            |& tee "$RUNNER_TEMP/secrets-evidence/logs/authbus-authority.log"
          cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2 \
            |& tee "$RUNNER_TEMP/secrets-evidence/logs/authbus-operation.log"

      - name: Qualification and crash regressions
        id: qa
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*.py' \
            |& tee "$RUNNER_TEMP/secrets-evidence/logs/python-qa.log"

      - name: Build exact readiness receipt
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          MANIFESTS: ${{ steps.manifests.outcome }}
          FORMATTING: ${{ steps.formatting.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          AUTHBUS: ${{ steps.authbus.outcome }}
          QA: ${{ steps.qa.outcome }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          qualified=false
          if [[ "$MANIFESTS" == success && "$FORMATTING" == success && "$CLIPPY" == success && "$TESTS" == success && "$AUTHBUS" == success && "$QA" == success ]]; then
            qualified=true
          fi
          args=(--output "$RUNNER_TEMP/secrets-evidence/readiness-manifest.json")
          if [[ "$qualified" == true ]]; then args+=(--qualified); fi
          python3 codex-rs/hepta-bao-adapter/qa/build_readiness_manifest.py "${args[@]}"
          git archive --format=tar.gz --output "$RUNNER_TEMP/secrets-evidence/exact-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/secrets-evidence/exact-source.tar.gz" > "$RUNNER_TEMP/secrets-evidence/artifact-sha256.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "secrets-evidence"
          manifest = json.loads((root / "readiness-manifest.json").read_text())
          digest = (root / "artifact-sha256.txt").read_text().split()[0]
          manifest["artifact_hashes"] = {"exact-source.tar.gz": digest}
          manifest["lane_outcomes"] = {
              "documentation_manifest_consistency": os.environ["MANIFESTS"],
              "format": os.environ["FORMATTING"],
              "strict_clippy": os.environ["CLIPPY"],
              "all_target_tests_and_feature_matrix": os.environ["TESTS"],
              "authbus_schema": os.environ["AUTHBUS"],
              "crash_recovery_and_qa": os.environ["QA"],
          }
          (root / "readiness-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
          cat "$RUNNER_TEMP/secrets-evidence/readiness-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-readiness-${{ steps.candidate.outputs.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secrets-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce all source lanes
        if: always()
        shell: bash
        env:
          MANIFESTS: ${{ steps.manifests.outcome }}
          FORMATTING: ${{ steps.formatting.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          AUTHBUS: ${{ steps.authbus.outcome }}
          QA: ${{ steps.qa.outcome }}
        run: |
          set -euo pipefail
          for result in "$MANIFESTS" "$FORMATTING" "$CLIPPY" "$TESTS" "$AUTHBUS" "$QA"; do
            test "$result" = success
          done
