name: Hepta Stem / Original Evidence Owner Convergence (qualification only)

on:
  # Exact P0 candidate push checks complement, never replace, protected PR CI.
  push:
    branches:
      - security/hepta-original-neuron-effect-and-metrics-gates-20261015
      - integration/hepta-secure-original-shared-arc-batch-20261015
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-neuron/**"
      # All actual transitive owners of the original signed Worker qualify.
      # An isolated Context, Control or provider seam change cannot skip
      # the affected Rust/Cargo/Clippy review.
      - "codex-rs/hepta-context-compiler/**"
      - "codex-rs/hepta-control-plane/**"
      - "codex-rs/hepta-cell-roles/**"
      - "codex-rs/hepta-automation/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-evidence/**"
      - ".github/workflows/hepta-architecture-convergence.yml"
      - "codex-rs/hepta-agentd/src/neuron_runtime.rs"
      - "codex-rs/hepta-agentd/src/neuron_runtime_tests.rs"
      - "codex-rs/hepta-agentd/src/neuron_ndu_read.rs"
      - "codex-rs/hepta-agentd/src/neuron_effect_bootstrap.rs"
      - "codex-rs/hepta-agentd/tests/signed_neuron_public_contract.rs"
      - "codex-rs/hepta-evidence/src/metrics_group_commit.rs"
      - "codex-rs/hepta-evidence/src/metrics_sink.rs"
      - "codex-rs/hepta-agentd/src/neuron_production_bootstrap.rs"
      - "codex-rs/hepta-agentd/src/neuron_production_bootstrap_tests.rs"
      - "codex-rs/hepta-agentd/src/lib.rs"
      - "codex-rs/hepta-infer-worker-host/src/batched_neuron.rs"
      - "codex-rs/hepta-infer-worker-host/src/batched_neuron_tests.rs"
      - "codex-rs/hepta-infer-worker-host/src/original_evidence_neuron.rs"
      - "codex-rs/hepta-infer-worker-host/src/model_worker.rs"
      - "codex-rs/hepta-infer-worker-host/src/stem_original_batch_preview.rs"
      - "codex-rs/hepta-infer-worker-host/src/stem_original_batch_preview_tests.rs"
      - "codex-rs/hepta-infer-worker-host/src/lib.rs"
      - "codex-rs/hepta-infer-worker-host/tests/original_control_non_test_gate.rs"
      - ".github/workflows/hepta-stem-original-owner-qualification.yml"

permissions:
  contents: read

concurrency:
  group: hepta-stem-original-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-owner-source-proof:
    name: Original Evidence/CNS unchanged, Stem authority remains denied
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact immutable original source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          # Exact original #2145 source blobs, not newly substituted owners.
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-worker-host/src/batched_neuron.rs)" = "29237eab79b17c0e4d09fbf356d02420f8b3f515"
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-worker-host/src/original_evidence_neuron.rs)" = "b5e28a719038c1a158ce31c347d0ab8dd3ae2844"
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-worker-host/src/model_worker.rs)" = "9fe42424b3fd63a91705ddb42559f29c69bd1c89"
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-core/src/neuron_feature.rs)" = "b8e380656fb7e4f3faaafe6181f25b4e603d132b"
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-core/Cargo.toml)" = "d89bf7c4764cdaaa4b040a447a295965ea0142c5"
          # Original Control/CNS denial remains an explicit required gate.
          grep -Fq 'pub fn require_original_control_v1()' codex-rs/hepta-infer-worker-host/src/original_evidence_neuron.rs
          grep -Fq 'UnverifiedOriginalControl' codex-rs/hepta-infer-worker-host/src/original_evidence_neuron.rs
          grep -Fq 'pub mod batched_neuron;' codex-rs/hepta-infer-worker-host/src/lib.rs
          grep -Fq 'pub mod original_evidence_neuron;' codex-rs/hepta-infer-worker-host/src/lib.rs
          git diff --check
          git diff --exit-code

  native-original-plus-stem-core:
    name: Actual immutable Arc reuse, digest separation, Rust fmt/test/Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The shared execution-evidence wrapper rejects empty source/test SHA and
    # missing source-head lane even after a successful cargo test. The exact
    # checkout below is the same PR head, NEVER GitHub's synthetic PR merge.
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      HEPTA_CI_LANE: source-head
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout exact current PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require candidate source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Install pinned Rust 1.95.0
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Verify old and integrated Stem Core Rust formatting
        run: cargo +1.95.0 fmt --package codex-hepta-infer-core -- --check
      - name: Require original signed Worker Rust formatting
        run: cargo +1.95.0 fmt --package codex-hepta-infer-worker-host -- --check
      - name: Test genuine original/new source digests and borrowed Arc contracts
        run: cargo +1.95.0 test --locked -p codex-hepta-infer-core --lib
      - name: Strict inference-core Clippy without ignored warnings
        run: cargo +1.95.0 clippy --locked -p codex-hepta-infer-core --all-targets -- -D warnings
      - name: Execute original Context Delivery provider-evidence regressions
        # YAML plain scalars cannot contain `:: `; a quoted block is required.
        # The prior bare command caused zero-job workflow-parse failures.
        run: |
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-context-delivery.json" --minimum-tests 25 -- cargo +1.95.0 test --locked -p codex-hepta-context-compiler --lib v2::tests:: -- --nocapture
      - name: Strict Context Delivery provider-verifier Clippy
        run: cargo +1.95.0 clippy --locked -p codex-hepta-context-compiler --all-targets -- -D warnings
      - name: Strict original Worker Clippy including bridge tests
        run: cargo +1.95.0 clippy --locked -p codex-hepta-infer-worker-host --all-targets -- -D warnings
      # cargo test exits 0 for a filter that matches ZERO tests. Count actual
      # executed tests; fixture-only source matches are not qualification.
      - name: Require eight executed Stem / original signed Batch ABI tests
        run: |
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-stem-preview.json" --minimum-tests 8 -- cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib stem_original_batch_preview::tests:: -- --test-threads=1
      - name: Require 50 executed original Worker signed/native Batch regressions
        run: |
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-worker-batch.json" --minimum-tests 50 -- cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib batched_neuron::tests:: -- --test-threads=1
      - name: Require executed shared Arc mutation/nonce denial
        run: python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-shared-arc.json" --minimum-tests 1 -- cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib shared_arc_enqueue_ -- --test-threads=1
      - name: Require executed two-Cell one-physical-batch signed receipts
        run: python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-native-batch.json" --minimum-tests 1 -- cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib typed_stem_original_shared_native_batch_executes_one_backend_with_two_signed_receipts -- --test-threads=1
      - name: Verify original signed Worker remains compilable
        run: cargo +1.95.0 check --locked -p codex-hepta-infer-worker-host --lib
      - name: Require actual non-test product library to DENY unverified original Control/CNS
        run: python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-worker-product-denial.json" --minimum-tests 1 -- cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --test original_control_non_test_gate -- --test-threads=1
      - name: Verify original Evidence writer Rust formatting
        run: cargo +1.95.0 fmt --package codex-hepta-evidence -- --check
      - name: Require 34 executed original Evidence WAL/group-commit regressions
        run: |
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-evidence-journal.json" --minimum-tests 34 -- cargo +1.95.0 test --locked -p codex-hepta-evidence --lib metrics_group_commit::tests:: -- --test-threads=1
      - name: Require 20 executed durable Metrics sink and restart regressions
        run: |
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-evidence-sink.json" --minimum-tests 20 -- cargo +1.95.0 test --locked -p codex-hepta-evidence --lib metrics_sink::tests:: -- --test-threads=1
      - name: Strict original Evidence writer all-target Clippy
        run: cargo +1.95.0 clippy --locked -p codex-hepta-evidence --all-targets -- -D warnings
      - name: Verify Neuron external signed-NDU gate Rust formatting
        run: cargo +1.95.0 fmt --package codex-hepta-neuron -- --check
      - name: Compile original non-test Neuron runtime
        run: cargo +1.95.0 check --locked -p codex-hepta-neuron --lib
      - name: Run external production Neuron denial through non-test library
        run: cargo +1.95.0 test --locked -p codex-hepta-neuron --test public_ndu_tick_non_test_denial -- --nocapture --test-threads=1
      - name: Preserve original Neuron reference mechanism regression
        run: "cargo +1.95.0 test --locked -p codex-hepta-neuron --lib runtime::tests::"
      - name: Strict Neuron all-target Clippy on external-denial change
        run: cargo +1.95.0 clippy --locked -p codex-hepta-neuron --all-targets -- -D warnings
      - name: Verify Agentd original Evidence bootstrap Rust formatting
        run: cargo +1.95.0 fmt --package codex-hepta-agentd -- --check
      - name: Exercise Agentd signed Neuron telemetry gates
        run: "cargo +1.95.0 test --locked -p codex-hepta-agentd --lib neuron_runtime::tests::"
      - name: Verify actual durable Evidence writer cold reopen
        run: "cargo +1.95.0 test --locked -p codex-hepta-agentd --lib neuron_production_bootstrap::tests::"
      - name: Require two executed non-test Agentd signed-boundary regressions
        run: python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-agentd-external.json" --minimum-tests 2 -- cargo +1.95.0 test --locked -p codex-hepta-agentd --test signed_neuron_public_contract -- --nocapture --test-threads=1
      - name: Require ten original durable Evidence and Intent recovery regressions
        run: "python3 ../scripts/hepta_ci_exec.py --output \"$RUNNER_TEMP/hepta-original-neuron-bootstrap.json\" --minimum-tests 11 -- cargo +1.95.0 test --locked -p codex-hepta-agentd --lib neuron_production_bootstrap::tests:: -- --nocapture --test-threads=1"
      - name: Require six original Agentd signed metrics readiness regressions
        run: python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/hepta-original-agentd-metrics.json" --minimum-tests 6 -- cargo +1.95.0 test --locked -p codex-hepta-agentd --lib agentd_ -- --nocapture --test-threads=1
      - name: Strict Agentd all-target Clippy
        run: cargo +1.95.0 clippy --locked -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Check source integrity after compiler and formatter
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
