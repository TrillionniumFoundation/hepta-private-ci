name: Hepta Stem / Original Evidence Owner Convergence (qualification only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-evidence/**"
      - "codex-rs/hepta-infer-worker-host/src/batched_neuron.rs"
      - "codex-rs/hepta-infer-worker-host/src/batched_neuron_group.rs"
      - "codex-rs/hepta-infer-worker-host/src/batched_neuron_group_tests.rs"
      - "codex-rs/hepta-infer-worker-host/src/batched_neuron_tests.rs"
      - "codex-rs/hepta-infer-worker-host/src/original_evidence_neuron.rs"
      - "codex-rs/hepta-infer-worker-host/src/model_worker.rs"
      - "codex-rs/hepta-infer-worker-host/src/stem_original_batch_preview.rs"
      - "codex-rs/hepta-infer-worker-host/src/stem_original_batch_preview_tests.rs"
      - "codex-rs/hepta-infer-worker-host/src/lib.rs"
      - ".github/workflows/hepta-stem-original-owner-qualification.yml"

permissions:
  contents: read

concurrency:
  group: hepta-stem-original-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-owner-source-proof:
    name: Original Evidence/CNS unchanged, Stem authority remains denied
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact immutable original source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          # Exact original #2145 source blobs, not newly substituted owners.
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-worker-host/src/batched_neuron.rs)" = "3db3c41b645910fde7d55c294c7371198327ee03"
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-worker-host/src/original_evidence_neuron.rs)" = "5c473b4714056bb0a3911be7b82853d71b07aac3"
          test "$(git rev-parse HEAD:codex-rs/hepta-evidence/src/metrics_group_commit.rs)" = "e7b42c6d5e4084243da55858576e830ac604a626"
          test "$(git rev-parse HEAD:codex-rs/hepta-evidence/src/metrics_sink.rs)" = "2b1091fe45b05a66bdce89a6a5fe1df41a4ea537"
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-worker-host/src/model_worker.rs)" = "b62d0d9430c51beb505558457855a5922ca89006"
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-core/src/neuron_feature.rs)" = "b8e380656fb7e4f3faaafe6181f25b4e603d132b"
          test "$(git rev-parse HEAD:codex-rs/hepta-infer-core/Cargo.toml)" = "d89bf7c4764cdaaa4b040a447a295965ea0142c5"
          # Original Control/CNS denial remains an explicit required gate.
          grep -Fq 'pub fn require_original_control_v1()' codex-rs/hepta-infer-worker-host/src/original_evidence_neuron.rs
          grep -Fq 'UnverifiedOriginalControl' codex-rs/hepta-infer-worker-host/src/original_evidence_neuron.rs
          grep -Fq 'pub mod batched_neuron;' codex-rs/hepta-infer-worker-host/src/lib.rs
          grep -Fq 'pub mod original_evidence_neuron;' codex-rs/hepta-infer-worker-host/src/lib.rs
          # No standalone signed aggregate issuer/executor exists today:
          # normal libraries must NEVER execute physical multi-member batch.
          grep -Fq '#[cfg(not(test))]' codex-rs/hepta-infer-worker-host/src/batched_neuron.rs
          grep -Fq 'fn execute_native_batch(' codex-rs/hepta-infer-worker-host/src/batched_neuron.rs
          grep -Fq 'result: Err(BatchWorkerErrorV1::BatchUnsupported)' codex-rs/hepta-infer-worker-host/src/batched_neuron.rs
          grep -Fq '#[cfg(test)]' codex-rs/hepta-infer-worker-host/src/batched_neuron.rs
          # A non-test caller must not bypass the top-level denial by
          # invoking InferenceWorker's old crate-local physical Batch method.
          python3 - <<'PY'
          from pathlib import Path
          import re
          worker = Path("codex-rs/hepta-infer-worker-host/src/model_worker.rs").read_text()
          for method in ("can_run_neuron_feature_batch", "run_neuron_features_batch_receipts"):
              pattern = r"(?m)^\s*#\[cfg\(test\)\]\s*\n\s*pub\(crate\) fn " + method + r"\("
              if re.search(pattern, worker) is None:
                  raise SystemExit(f"missing test-only fence on original Worker: {method}")
          PY
          git diff --check
          git diff --exit-code

  native-original-plus-stem-core:
    name: Actual immutable Arc reuse, digest separation, Rust fmt/test/Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout exact current PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require candidate source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Install pinned Rust 1.95.0
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Verify old and integrated Stem Core Rust formatting
        run: cargo +1.95.0 fmt --package codex-hepta-infer-core -- --check
      - name: Require exact original Worker Rust formatting
        run: cargo +1.95.0 fmt --package codex-hepta-infer-worker-host -- --check
      - name: Require exact original Evidence actor and WAL Rust formatting
        run: cargo +1.95.0 fmt --package codex-hepta-evidence -- --check
      - name: Test genuine original/new source digests and borrowed Arc contracts
        run: cargo +1.95.0 test --locked -p codex-hepta-infer-core --lib
      - name: Strict inference-core Clippy without ignored warnings
        run: cargo +1.95.0 clippy --locked -p codex-hepta-infer-core --all-targets -- -D warnings
      - name: Strict original Evidence actor Clippy without waivers
        run: cargo +1.95.0 clippy --locked -p codex-hepta-evidence --all-targets -- -D warnings
      - name: Single verified WAL traversal joins entire committed cohort
        run: cargo +1.95.0 test --locked -p codex-hepta-evidence --lib bounded_committed_cohort_memberships_match_individual_wal_readbacks
      - name: Original actor read-only cohort observation excludes unflushed staging
        run: cargo +1.95.0 test --locked -p codex-hepta-evidence --lib original_actor_bounded_cohort_readback_never_flushes_uncommitted_rows
      - name: Strict original Worker Clippy including bridge tests
        run: cargo +1.95.0 clippy --locked -p codex-hepta-infer-worker-host --all-targets -- -D warnings
      - name: Run typed Stem to original signed Batch ABI parity tests
        run: "cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib stem_original_batch_preview::tests::"
      - name: Prove actual original Worker Arc sharing and one native backend batch
        run: cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib shared_arc_enqueue_
      - name: Prove typed Stem-to-original signed Native Batch invokes one test backend
        run: cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib typed_stem_original_shared_native_batch_executes_one_backend_with_two_signed_receipts
      - name: Exercise exact independently signed native cohort plus per-Head nonce claim
        run: cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib original_native_group_
      - name: Verify original queued cohort proposal only accepts current CNS signed members
        run: cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --lib original_pending_group_
      - name: Verify original signed Worker remains compilable
        run: cargo +1.95.0 check --locked -p codex-hepta-infer-worker-host --lib
      - name: Run original Control/CNS denial in a NON-TEST linked Worker library
        run: cargo +1.95.0 test --locked -p codex-hepta-infer-worker-host --test original_control_non_test_gate
      - name: Check source integrity after compiler and formatter
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
