name: context-compiler-qualification

on:
  pull_request:
    paths:
      - .github/workflows/context-compiler-qualification.yml
      - .github/actions/**
      - codex-rs/codex-api/**
      - codex-rs/core/**
      - codex-rs/ext/extension-api/**
      - codex-rs/ext/hepta-prompt/**
      - codex-rs/hepta-codex-adapter/**
      - codex-rs/hepta-context-compiler/**
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-prompt-registry/**
      - codex-rs/hepta-prompt-optimizer/**
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-types/**
      - codex-rs/Cargo.*
      - codex-rs/rust-toolchain.toml
      - codex-rs/justfile
      - MODULE.bazel*
      - docs/modules/context.compiler/**
      - qualification/context-compiler/**
      - qualification/module-execution-dossiers/detail/context.compiler.md
      - scripts/context_compiler_*.py
      - scripts/test_context_compiler_*.py
      - scripts/generate_context_compiler_module_docs.py
  push:
    branches:
      - main
      - codex/context-compiler-full-closure-review-20260927
      - codex/context-compiler-v3-closure-20260928
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional full base commit OID; otherwise resolve main once
        required: false
        type: string
  schedule:
    - cron: '23 18 * * *'

permissions:
  contents: write

concurrency:
  group: context-compiler-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-slim
    outputs:
      source: ${{ steps.identity.outputs.source }}
      base: ${{ steps.identity.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        shell: bash
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pul_request.base.sha }}
          INPUT_BASE: ${{ inputs.base_sha }}
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          BASE="${PR_BASE:-${INPUT_BASE:-}}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse refs/remotes/origin/main)"
            if [ "$BASE" = "$SOURCE" ]; then
              BASE="$(git rev-parse "$SOURCE^1")"
            fi
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$BASE")" = commit
          test "$(git cat-file -t "$SOURCE")" = commit
          test "$BASE" != "$SOURCE"
          printf 'source=%s\nbase=%s\n' "$SOURCE" "$BASE" >> "$GITHUB_OUTPUT"
      - name: Reject source-writing context qualification machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path

          retired = (
              Path('.github/workflows/context-compiler-source-promotion.yml'),
              Path('.github/workflows/context-compiler-v3-source-bundle.yml'),
          )
          forbidden = (
              'contents:' + ' write',
              'persist-credentials:' + ' true',
              'git ' + 'push',
              'git ' + 'commit',
              'apply_context_' + 'compiler_',
              'remediate_context_' + 'compiler_',
          )
          offenders = [f'{path}: retired source writer still present' for path in retired if path.exists()]
          for path in sorted(Path('.github/workflows').glob('context-compiler*.yml')):
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                if token in text:
                  offenders.append(f'{path}: forbidden source-writing token {token!r}')
          if offenders:
              raise SystemExit('source-writing context workflow detected:\n' + '\n'.join(offenders))
          PY

  source-snapshot:
    needs: identity
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.identity.outputs.source }}
          fetch-depth: 1
          persist-credentials: false
      - name: Export immutable tracked source for review, not qualification
        shell: bash
        env:
          SOURCE: ${{ needs.identity.outputs.source }}
          BASE: ${{ needs.identity.outputs.base }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_IMAGE: ${{ runner.os }}-${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p "$RUNNER_TEMP/context-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/context-source/source.tar.gz" "$SOURCE"
          printf '%s\n' "$SOURCE" > "$RUNNER_TEMP/context-source/source-sha.txt"
          printf '%s\n' "$BASE" > "$RUNNER_TEMP/context-source/base-sha.txt"
          printf '%s\n' "$(git rev-parse HEAT_^{tree})" > "$RUNNER_TEMP/context-source/source-tree.txt"
          printf '%s\n' "$WORKFLOW_REF" > "$RUNNER_TEMP/context-source/workflow-ref.txt"
          printf '%s\n' "$WORKFLOW_SHA" > "$RUNNER_TEMP/context-source/workflow-sha.txt"
          printf '%s\n' "$RUN_ID" > "$RUNNER_TEMP/context-source/run-id.txt"
          printf '%s\n' "$RUN_ATTEMPT" > "$RUNNER_TEMP/context-source/run-attempt.txt"
          printf '%s\n' "$RUNNER_IMAGE" > "$RUNNER_TEMP/context-source/runner-image.txt"
          printf '%s\n' "$RUNNER_OS/$RUNNER_ARCH" > "$RUNNER_TEMP/context-source/runner-platform.txt"
          sha256sum "$RUNNER_TEMP/context-source/source.tar.gz" > "$RUNNER_TEMP/context-source/archive-sha256.txt"
          find "$RUNNER_TEMP/context-source" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/context-source/artifact-files.sha256"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: context-source-${{ needs.identity.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-source
          if-no-files-found: error
          retention-days: 7

  qualification:
    needs: identity
    name: context.compiler (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
      QUALIFICATION_HEAD_SHA: ${{ needs.identity.outputs.source }}
      QUALIFICATION_BASE_SHA: ${{ needs.identity.outputs.base }}
      QUALIFICATION_WORKFLOW_REF: ${{ github.workflow_ref }}
      QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_RUN_ID: ${{ github.run_id }}
      QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.identity.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct exact immutable candidate
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/context-evidence"
          python3 -B scripts/context_compiler_candidate.py \
            --source "$QUALIFICATION_HEAD_SHA" --base "$QUALIFICATION_BASE_SHA" \
            --lane "$LANE" --record "$RUNNER_TEMP/context-evidence/candidate.json"
      - name: Real-Git identity and execution-summary regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_context_compiler_*.py' -v
      - name: Prepare isolated CI build roots
        shell: bash
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/context-compiler-build"
          mkdir -p "$build_root/cargo" "$build_root/target" "$build_root/bazel"
          {
            echo "CARGO_HOME=$build_root/cargo"
            echo "CARGO_TARGET_DIR=$build_root/target"
            echo "BAZELISK_HOME=$build_root/bazel"
          } >> "$GITHUB_ENV"
      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends build-essential libcap-dev pkg-config ca-certificates curl git
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt
      - name: Install repository test and dependency tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest,cargo-deny@0.19.0
      - name: Prepare Bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: context-compiler-qualification
      - name: Execute checked source without repair or write-back
        shell: bash
        env:
          QUALIFICATION_RUNNER_IMAGE: ${{ runner.os }}-${{ runner.arch }}
          QUALIFICATION_RUNNER_OS: ${{ runner.os }}
          QUALIFICATION_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 -B scripts/context_compiler_execution.py \
            --candidate-record "$RUNNER_TEMP/context-evidence/candidate.json" \
            --output-dir "$RUNNER_TEMP/context-evidence"
      - name: Bind artifact attestation to immutable execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/context-evidence" ]; then
            find "$RUNNER_TEMP/context-evidence" -type f -print0 | sort -z | xargs -0 sha256sum \
              > "$RUNNER_TEMP/context-evidence/artifact-files.sha256"
          fi
      - name: Retain candidate, partial failures and command receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: context-compiler-${{ needs.identity.outputs.source }}-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-evidence
          if-no-files-found: error
          retention-days: 90

  required:
    name: Context compiler required
    if: always()
    needs: [identity, qualification]
    runs-on: ubuntu-slim
    steps:
      - name: Require both candidate lanes
        env:
          IDENTITY_RESULT: ${{ needs.identity.result }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: |
          set -euo pipefail
          test "$IDENTITY_RESULT" = success
          test "$QUALIFICATION_RESULT" = success

  finalize-generated-truth:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/context-compiler-v3-closure-20260928'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      SOURCE_SHA: bedf77652f74b62c1e5d6bb3b2119893e581cecc
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Generate exact truth and restore read-only workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          state_path = Path("docs/modules/context.compiler/CURRENT_STATE.json")
          state = json.loads(state_path.read_text())
          state["runtimeSourceAnchor"] = source_sha
          state["runtimeSourceTree"] = subprocess.check_output(
              ["git", "rev-parse", f"{source_sha}^{{tree}}"], text=True
          ).strip()
          for item in state["runtimeSourceFiles"]:
              source_blob = subprocess.check_output(
                  ["git", "rev-parse", f"{source_sha}:{item['path']}"], text=True
              ).strip()
              head_blob = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{item['path']}"], text=True
              ).strip()
              if head_blob != source_blob:
                  raise SystemExit(f"runtime source changed after anchor: {item['path']}")
              item["blobSha"] = source_blob
          state_path.write_text(json.dumps(state, indent=2) + "\\n")
          PY
          python3 -B scripts/generate_context_compiler_module_docs.py --write
          python3 -B scripts/generate_context_compiler_module_docs.py --check
          python3 -B -m unittest discover -s scripts -p 'test_context_compiler_*.py' -q
          git checkout "$SOURCE_SHA" -- .github/workflows/context-compiler-qualification.yml
          git rm -f \
            .github/workflows/context-compiler-finalize-generated-truth.yml \
            .github/workflows/context-compiler-finalize-generated-truth-arm.yml
          git add \
            .github/workflows/context-compiler-qualification.yml \
            docs/modules/context.compiler/CURRENT_STATE.json \
            docs/modules/context.compiler/CURRENT_PRODUCT_PATH.md \
            docs/modules/context.compiler/IMPLEMENTATION_MAP.json \
            docs/modules/context.compiler/MODULE_MANIFEST.json \
            docs/modules/context.compiler/TECHNICAL.md \
            qualification/module-execution-dossiers/detail/context.compiler.md
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/context-compiler-finalize-generated-truth-arm.yml',
              '.github/workflows/context-compiler-finalize-generated-truth.yml',
              '.github/workflows/context-compiler-qualification.yml',
              'docs/modules/context.compiler/CURRENT_PRODUCT_PATH.md',
              'docs/modules/context.compiler/CURRENT_STATE.json',
              'docs/modules/context.compiler/IMPLEMENTATION_MAP.json',
              'docs/modules/context.compiler/MODULE_MANIFEST.json',
              'docs/modules/context.compiler/TECHNICAL.md',
              'qualification/module-execution-dossiers/detail/context.compiler.md',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected finalization paths: {sorted(actual ^ expected)}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs(context.compiler): bind lifecycle closure truth" \
            -m "Bind all six generated projections to bedf77652f74b62c1e5d6bb3b2119893e581cecc / 0cf89e840cf882a350376bbab06c8c34e4ea2520 after lifecycle, capacity, metrics, consumer-trace and regression closure. Generator check and all 61 Python regressions pass. Restore the qualification workflow to read-only and remove transient finalizers. This grants no authenticated App Server ingress, external security consumption, independent provider evidence, selected-host acceptance, activation or release."
          git push origin "HEAD:${HEAD_BRANCH}"

