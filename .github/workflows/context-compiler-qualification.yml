name: context-compiler-qualification

on:
  pull_request:
    paths:
      - .github/workflows/context-compiler-qualification.yml
      - .github/actions/**
      - codex-rs/codex-api/**
      - codex-rs/core/**
      - codex-rs/ext/extension-api/**
      - codex-rs/ext/hepta-prompt/**
      - codex-rs/hepta-codex-adapter/**
      - codex-rs/hepta-context-compiler/**
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-prompt-registry/**
      - codex-rs/hepta-prompt-optimizer/**
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-types/**
      - codex-rs/Cargo.*
      - codex-rs/rust-toolchain.toml
      - codex-rs/justfile
      - MODULE.bazel*
      - docs/modules/context.compiler/**
      - qualification/module-execution-dossiers/detail/context.compiler.md
      - scripts/context_compiler_*.py
      - scripts/test_context_compiler_*.py
      - scripts/generate_context_compiler_module_docs.py
  push:
    branches:
      - main
      - codex/context-compiler-full-closure-review-20260927
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional full base commit OID; otherwise resolve main once
        required: false
        type: string
  schedule:
    - cron: '23 18 * * *'

permissions:
  contents: read

concurrency:
  group: context-compiler-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.identity.outputs.source }}
      base: ${{ steps.identity.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        shell: bash
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base_sha }}
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          BASE="${PR_BASE:-${INPUT_BASE:-}}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse refs/remotes/origin/main)"
            if [ "$BASE" = "$SOURCE" ]; then
              BASE="$(git rev-parse "$SOURCE^1")"
            fi
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$BASE")" = commit
          test "$(git cat-file -t "$SOURCE")" = commit
          test "$BASE" != "$SOURCE"
          printf 'source=%s\nbase=%s\n' "$SOURCE" "$BASE" >> "$GITHUB_OUTPUT"

  source-snapshot:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.identity.outputs.source }}
          fetch-depth: 1
          persist-credentials: false
      - name: Export immutable tracked source for review, not qualification
        shell: bash
        env:
          SOURCE: ${{ needs.identity.outputs.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p "$RUNNER_TEMP/context-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/context-source/source.tar.gz" "$SOURCE"
          printf '%s\n' "$SOURCE" > "$RUNNER_TEMP/context-source/source-sha.txt"
          sha256sum "$RUNNER_TEMP/context-source/source.tar.gz" > "$RUNNER_TEMP/context-source/archive-sha256.txt"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: context-source-${{ needs.identity.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-source
          if-no-files-found: error
          retention-days: 7

  qualification:
    needs: identity
    name: context.compiler (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
      QUALIFICATION_HEAD_SHA: ${{ needs.identity.outputs.source }}
      QUALIFICATION_BASE_SHA: ${{ needs.identity.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.identity.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct exact immutable candidate
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/context-evidence"
          python3 -B scripts/context_compiler_candidate.py \
            --source "$QUALIFICATION_HEAD_SHA" --base "$QUALIFICATION_BASE_SHA" \
            --lane "$LANE" --record "$RUNNER_TEMP/context-evidence/candidate.json"
      - name: Real-Git identity and execution-summary regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_context_compiler_*.py' -v
      - name: Prepare shared CI build roots
        uses: ./.github/actions/setup-ci-build
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev pkg-config
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt
      - name: Install repository test and dependency tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest,cargo-deny@0.19.0
      - name: Prepare Bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: context-compiler-qualification
      - name: Execute checked source without repair or write-back
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/context_compiler_execution.py \
            --candidate-record "$RUNNER_TEMP/context-evidence/candidate.json" \
            --output-dir "$RUNNER_TEMP/context-evidence"
      - name: Retain candidate, partial failures and command receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: context-compiler-${{ needs.identity.outputs.source }}-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-evidence
          if-no-files-found: error
          retention-days: 90

  required:
    name: Context compiler required
    if: always()
    needs: [identity, qualification]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both candidate lanes
        env:
          IDENTITY_RESULT: ${{ needs.identity.result }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: |
          set -euo pipefail
          test "$IDENTITY_RESULT" = success
          test "$QUALIFICATION_RESULT" = success
