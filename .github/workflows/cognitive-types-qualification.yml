name: cognitive-types-qualification
on:
  pull_request:
    branches: [main]
    paths: ['codex-rs/**', 'scripts/cognitive_types_*.py', 'scripts/hepta_ci_exec.py', 'scripts/hepta-hnmf.py', 'qualification/**', 'docs/modules/cognitive.types/**', '.github/workflows/cognitive-types-qualification.yml', 'MODULE.bazel*', 'justfile']
  push:
    branches: [main, 'codex/cognitive-types-production-hardening-20260926']
    paths: ['codex-rs/**', 'scripts/cognitive_types_*.py', 'scripts/hepta_ci_exec.py', 'scripts/hepta-hnmf.py', 'qualification/**', 'docs/modules/cognitive.types/**', '.github/workflows/cognitive-types-qualification.yml', 'MODULE.bazel*', 'justfile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cognitive-types-qualification-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  resolve:
    runs-on: macos-15
    outputs:
      source: ${{ steps.identity.outputs.source }}
      base: ${{ steps.identity.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main
          echo "base=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact source for reproducible investigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cognitive-source"
          git rev-parse HEAD > "$RUNNER_TEMP/cognitive-source/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/cognitive-source/source-tree.txt"
          git archive --format=tar HEAD codex-rs scripts .github docs/modules/cognitive.types qualification justfile > "$RUNNER_TEMP/cognitive-source/source.tar"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cognitive-types-source-${{ steps.identity.outputs.source }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cognitive-source
          if-no-files-found: error
          retention-days: 7
  qualify:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
        suite: [types, consumers, contracts]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source }}
      BASE_SHA: ${{ needs.resolve.outputs.base }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cognitive-target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct fixed ordered-parent merge without modifying source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ "$HEPTA_CI_LANE" = base-merge ]; then
            git fetch --no-tags origin "$BASE_SHA"
            tree=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=qualification GIT_AUTHOR_EMAIL=qualification@invalid
            export GIT_COMMITTER_NAME=qualification GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' GIT_COMMITTER_DATE='2000-01-01T00:00:00Z'
            tested=$(printf 'cognitive.types deterministic merge\n' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")
            git checkout --detach "$tested"
          fi
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install pinned Rust and test runner
        if: matrix.suite != 'contracts'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - if: matrix.suite != 'contracts'
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest@0.9.145
      - if: matrix.suite == 'contracts'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22.16.0'
      - name: Retain toolchain identity
        if: matrix.suite != 'contracts'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cognitive-tools"
          rustc --version --verbose > "$RUNNER_TEMP/cognitive-tools/rustc.txt"
          cargo --version >> "$RUNNER_TEMP/cognitive-tools/rustc.txt"
          cargo nextest --version >> "$RUNNER_TEMP/cognitive-tools/rustc.txt"
          just --version >> "$RUNNER_TEMP/cognitive-tools/rustc.txt"
      - name: Execute every required command with exact-source records
        run: python3 scripts/cognitive_types_qualification.py --suite '${{ matrix.suite }}' --output "$RUNNER_TEMP/cognitive-evidence"
      - name: Retain receipts and raw logs, including failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cognitive-types-${{ matrix.lane }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cognitive-evidence
            ${{ runner.temp }}/cognitive-tools
          if-no-files-found: error
          retention-days: 90
