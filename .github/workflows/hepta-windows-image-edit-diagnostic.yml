name: Windows image-edit launch diagnostics

on:
  push:
    branches: ["codex/windows-image-edit-observer-20261109-898e"]

permissions:
  contents: read

concurrency:
  group: hepta-windows-image-edit-diagnostic-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_SHA: a57b229c7faddd22091312f506db34733ca496ae
  TESTED_SHA: a57b229c7faddd22091312f506db34733ca496ae
  SOURCE_TREE: ffa81bcfd50e27eab692da3fb548a4d3df438a92
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  diagnostic-owner:
    runs-on: windows-latest
    # Preserve the original job ceiling. Strict preparation consumes this budget.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        group:
          - appserver-image-edit
          - windows-runner-typed-error
    steps:
      - name: Preserve original Windows source bytes before checkout
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Checkout the independent observer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: observer
          persist-credentials: false
      - name: Checkout the exact diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Install the original native compiler
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
      - name: Install the original test runners
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Install the existing V8 artifact resolver
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Check existing receipt guards and strict-preparation failure controls
        shell: pwsh
        run: |
          python -m unittest discover -s observer/.github/scripts -p test_windows_fixture_followup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s observer/.github/scripts -p test_windows_image_edit_diagnostic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the strict owner and execute its exact original case
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "hepta-windows-image-edit-${{ matrix.group }}-target"
          python observer/.github/scripts/windows_fixture_followup.py --source-root "$env:GITHUB_WORKSPACE/source" --expected-head "$env:SOURCE_SHA" --expected-tree "$env:SOURCE_TREE" --expected-observer-head "${{ github.sha }}" --group-id "${{ matrix.group }}" --output "$env:RUNNER_TEMP/hepta-windows-image-edit-${{ matrix.group }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve every original output and source binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-image-edit-${{ matrix.group }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-windows-image-edit-${{ matrix.group }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
