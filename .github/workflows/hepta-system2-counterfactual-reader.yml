name: Hepta System2 counterfactual multihop frozen Reader
on:
  push:
    branches: ["codex/system2-fbsde-ablation-20261011"]
    paths:
      - "scripts/memory_cell/system2_multihop_counterfactual.py"
      - "scripts/memory_cell/system2_multihop_counterfactual_trial.py"
      - "scripts/memory_cell/test_system2_multihop_counterfactual.py"
      - "scripts/memory_cell/system2_counterfactual_scorer_audit.py"
      - "scripts/memory_cell/test_system2_counterfactual_scorer_audit.py"
      - "codex-rs/hepta-ndu/research/SYSTEM2_COUNTERFACTUAL_READER.md"
      - "codex-rs/hepta-ndu/research/SYSTEM2_COUNTERFACTUAL_SCORER_AUDIT.md"
      - ".github/workflows/hepta-system2-counterfactual-reader.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: system2-counterfactual-${{ github.sha }}
  cancel-in-progress: false
jobs:
  frozen-reader-counterfactual:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HEPTA_MEMORY_TESTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned offline frozen Reader environment
        run: |
          set -euo pipefail
          mkdir -p /tmp/system2-counterfactual
          python3 -m venv /tmp/system2-python
          /tmp/system2-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu > /tmp/system2-counterfactual/install-torch.log 2>&1
          /tmp/system2-python/bin/pip install -r scripts/memory_cell/requirements.txt cryptography==46.0.4 ruff==0.15.8 > /tmp/system2-counterfactual/install-deps.log 2>&1
          /tmp/system2-python/bin/pip freeze > /tmp/system2-counterfactual/environment.txt
      - name: Full MemoryCell regression and scoped static checks
        run: |
          set -euo pipefail
          /tmp/system2-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v > /tmp/system2-counterfactual/regression.log 2>&1 || { tail -100 /tmp/system2-counterfactual/regression.log; exit 1; }
          tail -5 /tmp/system2-counterfactual/regression.log
          /tmp/system2-python/bin/ruff check --select F,E9 scripts/memory_cell/system2_multihop_counterfactual.py scripts/memory_cell/system2_multihop_counterfactual_trial.py scripts/memory_cell/test_system2_multihop_counterfactual.py scripts/memory_cell/system2_counterfactual_scorer_audit.py scripts/memory_cell/test_system2_counterfactual_scorer_audit.py > /tmp/system2-counterfactual/lint.log 2>&1 || { cat /tmp/system2-counterfactual/lint.log; exit 1; }
          cat /tmp/system2-counterfactual/lint.log
      - name: Check useful-answer yield and abstention scorer before model access
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/memory_cell /tmp/system2-python/bin/python scripts/memory_cell/system2_counterfactual_scorer_audit.py /tmp/system2-counterfactual/scorer-preflight > /tmp/system2-counterfactual/scorer-preflight.log 2>&1 || { tail -80 /tmp/system2-counterfactual/scorer-preflight.log; exit 1; }
          cat /tmp/system2-counterfactual/scorer-preflight.log
      - name: Stage previously pinned Reader weights only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip > /tmp/old-reader-inputs.zip
          printf '%s  %s\n' 07b357cbb3362f4afa4dc1872ab7e28e8a46daaf338f2636fed8d40fbcee76af /tmp/old-reader-inputs.zip | sha256sum -c -
          PYTHONPATH=scripts/memory_cell /tmp/system2-python/bin/python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path, PurePosixPath
          from native import digest
          from pretrained import file_inventory
          from stem_cell_trial import READER
          with zipfile.ZipFile('/tmp/old-reader-inputs.zip') as z:
              if z.namelist()!=['memory-inputs.tar.gz']:
                  raise ValueError('unexpected historic model archive')
              z.extractall('/tmp')
          with tarfile.open('/tmp/memory-inputs.tar.gz','r:gz') as t:
              entries=t.getmembers()
              if (len(entries)>10000 or len({m.name for m in entries})!=len(entries)
                      or sum(m.size for m in entries)>2*1024**3):
                  raise ValueError('historic tar size/identity bound')
              for m in entries:
                  path=PurePosixPath(m.name)
                  if (path.is_absolute() or '..' in path.parts or not path.parts
                          or path.parts[0]!='memory-inputs' or not (m.isfile() or m.isdir())):
                      raise ValueError('unsafe historic tar member')
              reader=[m for m in entries if m.name.startswith('memory-inputs/reader/')]
              if not reader:
                  raise ValueError('missing frozen Reader')
              t.extractall('/tmp',members=reader,filter='data')
          directory=Path('/tmp/memory-inputs/reader')
          if digest(file_inventory(directory)) != READER:
              raise ValueError('Reader inventory drift')
          Path('/tmp/system2-counterfactual/reader-pin.txt').write_text(READER+'\n')
          PY
      - name: Seal 160 frozen Reader answers before synthetic scoring
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/system2-counterfactual/resources.txt /tmp/system2-python/bin/python scripts/memory_cell/system2_multihop_counterfactual_trial.py /tmp/memory-inputs/reader /tmp/system2-counterfactual/native --development > /tmp/system2-counterfactual/execution.log 2>&1 || { tail -100 /tmp/system2-counterfactual/execution.log; exit 1; }
          tail -1 /tmp/system2-counterfactual/execution.log
      - name: Audit sealed neural answers for real yield and appropriate refusal
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/memory_cell /tmp/system2-python/bin/python scripts/memory_cell/system2_counterfactual_scorer_audit.py /tmp/system2-counterfactual/reader-yield --sealed-reader-run /tmp/system2-counterfactual/native > /tmp/system2-counterfactual/reader-yield.log 2>&1 || { tail -80 /tmp/system2-counterfactual/reader-yield.log; exit 1; }
          cat /tmp/system2-counterfactual/reader-yield.log
      - name: Preserve exact generating source, raw answers and partial failures
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/system2-counterfactual/source
          git rev-parse HEAD > /tmp/system2-counterfactual/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/system2-counterfactual/tested-tree.txt
          cp scripts/memory_cell/system2_multihop_counterfactual.py scripts/memory_cell/system2_multihop_counterfactual_trial.py scripts/memory_cell/test_system2_multihop_counterfactual.py .github/workflows/hepta-system2-counterfactual-reader.yml codex-rs/hepta-ndu/research/SYSTEM2_COUNTERFACTUAL_READER.md /tmp/system2-counterfactual/source/
          cp scripts/memory_cell/system2_counterfactual_scorer_audit.py scripts/memory_cell/test_system2_counterfactual_scorer_audit.py codex-rs/hepta-ndu/research/SYSTEM2_COUNTERFACTUAL_SCORER_AUDIT.md /tmp/system2-counterfactual/source/
          (cd /tmp/system2-counterfactual && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-system2-counterfactual-reader
          path: /tmp/system2-counterfactual
          if-no-files-found: error
