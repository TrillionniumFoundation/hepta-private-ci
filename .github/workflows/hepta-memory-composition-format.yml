name: MemoryCell isolated composition formatter
on:
  pull_request:
    paths:
      - '.github/workflows/hepta-memory-composition-format.yml'
permissions:
  contents: read
jobs:
  format-candidate:
    if: github.event.pull_request.number == 1452 && github.head_ref == 'codex/memory-cell-evidence-20261008' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: ./.github/actions/setup-ci
      - name: Prepare a reviewed formatter-only branch, not main or the PR ref
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install uv==0.8.22
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          root = Path('scripts/memory_cell')
          files = list(root.glob('composition_*.py')) + list(root.glob('test_composition_*.py'))
          Path('/tmp/composition-before.json').write_text(json.dumps({str(p): ast.dump(ast.parse(p.read_text())) for p in files}))
          PY
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --base "$BASE"
          python3 - <<'PY'
          import ast, json, subprocess
          from pathlib import Path
          before = json.loads(Path('/tmp/composition-before.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if set(changed) - set(before):
              raise ValueError('out-of-scope formatter change')
          for name, prior in before.items():
              if ast.dump(ast.parse(Path(name).read_text())) != prior:
                  raise ValueError('formatter changed executable Python AST')
          if changed:
              subprocess.run(['git', 'add', '--', *changed], check=True)
          PY
          git rm .github/workflows/hepta-memory-composition-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory-cell): format composition sources and remove temporary writer workflow'
          git push origin "HEAD:refs/heads/codex/memory-composition-format-${GITHUB_RUN_ID}"
          echo "REVIEW_CANDIDATE_SHA=$(git rev-parse HEAD)"
