name: Inference owner source preparation
on:
  pull_request:
    paths:
      - qualification/inference-worker-staging/**
      - .github/workflows/hepta-inference-owner-preparation.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/inference-worker-hardening-20260927'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and apply bounded reviewed source bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-owner-preparation"
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = pathlib.Path('qualification/inference-worker-staging/local-owner.patch.b64').read_bytes()
          # Undo one identified transfer duplication, then require the exact original bytes.
          assert hashlib.sha1(b'blob ' + str(len(encoded)).encode() + b'\0' + encoded).hexdigest() == '63e564a9524a04bd33a1757d4c681f10c994d2f9'
          encoded = encoded.replace(b'BrMeGGGr', b'BrMeGGr')
          assert hashlib.sha1(b'blob ' + str(len(encoded)).encode() + b'\0' + encoded).hexdigest() == 'a6d25d0d088d4a2ba2627904c5a95c40b87c87da'
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'a8bc1a454a75b82c788ebfc8d366c84eb1c1a131ae6fc812ba9cdb408358ffde'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-N', 'codex-rs/hepta-infer-core/src/local_control.rs', 'codex-rs/hepta-infer-core/src/local_journal.rs', 'codex-rs/hepta-infer-core/src/local_control_tests.rs'], check=True)
          PY
      - name: Format actual owner sources
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-infer-core
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Test actual prepared control owner
        working-directory: codex-rs
        run: |
          set -o pipefail
          just test --locked --lib -p codex-hepta-infer-core --retries 0 --test-threads=1 2>&1 | tee "$RUNNER_TEMP/local-owner-preparation/test.log"
      - name: Strict control-owner lint
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo clippy --locked -p codex-hepta-infer-core --all-targets --no-deps -- -D warnings 2>&1 | tee "$RUNNER_TEMP/local-owner-preparation/clippy.log"
      - name: Retain source objects without creating a commit or moving a ref
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('.')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-owner-preparation'
          allowed = ['durable_control.rs', 'native_control.rs', 'local_control.rs', 'local_journal.rs', 'local_control_tests.rs']
          paths = ['codex-rs/hepta-infer-core/src/' + name for name in allowed]
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(paths), changed
          manifest = {'preparation_input_head': os.environ['SOURCE_SHA'], 'qualification': False, 'objects': []}
          for path in paths:
              raw = (root / path).read_bytes()
              digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/git/blobs', data=json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == digest
              destination = out / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)
              manifest['objects'].append({'path': path, 'sha': digest, 'sha256': hashlib.sha256(raw).hexdigest(), 'mode': '100644', 'type': 'blob'})
          (out / 'objects.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (out / 'formatted.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          junit = root / 'codex-rs/target/nextest/local/junit.xml'
          if junit.is_file():
              (out / 'control.xml').write_bytes(junit.read_bytes())
          PY
      - name: Retain preparation evidence, not final-candidate qualification
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-owner-preparation-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/local-owner-preparation/
          retention-days: 3
          if-no-files-found: error
