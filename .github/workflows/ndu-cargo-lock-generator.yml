name: ndu-cargo-lock-generator

on:
  push:
    branches:
      - codex/ndu-cargo-lockgen-current-20261020
  workflow_dispatch:

concurrency:
  group: ndu-cargo-lock-generator::${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message || '', '[lockgen]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Generate Cargo.lock with Cargo 1.95
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo +1.95.0 generate-lockfile
      - name: Commit generated Cargo.lock only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- codex-rs/Cargo.lock; then
            echo "Cargo.lock already matches Cargo 1.95 resolution."
            exit 0
          fi
          git diff --stat -- codex-rs/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock
          git commit -m "ci(lockgen): refresh Cargo.lock with Cargo 1.95 [lockgen]"
          git push origin HEAD:codex/ndu-cargo-lockgen-current-20261020
