name: Rust toolchain upgrade qualification

on:
  push:
    branches: [codex/rust-1.99-upgrade-20261004]
    paths:
      - .github/workflows/rust-toolchain-upgrade.yml
      - .github/scripts/verify_rust_toolchain_locks.py
      - MODULE.bazel
      - flake.nix
  workflow_dispatch:
    inputs:
      phase:
        description: Generate reviewed lock artifacts first; qualify committed locks afterward
        type: choice
        options: [locks, compatibility]
        default: locks
        required: true

permissions:
  contents: read

concurrency:
  group: rust-toolchain-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  locks:
    if: github.event_name == 'push' || inputs.phase == 'locks'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
      - name: Record exact input source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/rust-toolchain-locks"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/rust-toolchain-locks/source.txt"
          cp MODULE.bazel.lock "$RUNNER_TEMP/rust-toolchain-locks/MODULE.bazel.lock.before"
          cp flake.lock "$RUNNER_TEMP/rust-toolchain-locks/flake.lock.before"
      - name: Generate Bazel lock with the repository's pinned Bazel
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run_bazel_with_buildbuddy.py mod deps --lockfile_mode=update
          python3 .github/scripts/run_bazel_with_buildbuddy.py mod deps --lockfile_mode=error
      - name: Install official Nix without a daemon or credential configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            https://releases.nixos.org/nix/nix-2.35.2/install \
            --output "$RUNNER_TEMP/nix-install"
          sh "$RUNNER_TEMP/nix-install" --no-daemon --yes --no-channel-add
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Refresh only the Rust overlay input and evaluate all Nix systems
        shell: bash
        run: |
          set -euo pipefail
          nix flake update rust-overlay
          for system in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin; do
            nix eval --no-write-lock-file --raw ".#packages.${system}.codex-rs.drvPath"
            nix eval --no-write-lock-file --raw ".#devShells.${system}.default.drvPath"
          done
      - name: Verify official Rust archive hashes and bind generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rust-toolchain-locks"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            https://static.rust-lang.org/dist/channel-rust-1.99.0.toml \
            --output "$output/channel-rust-1.99.0.toml"
          python3 .github/scripts/verify_rust_toolchain_locks.py "$output"
          cp MODULE.bazel.lock flake.lock "$output/"
          git diff --binary -- MODULE.bazel.lock flake.lock > "$output/generated-locks.patch"
          (cd "$output" && sha256sum MODULE.bazel.lock flake.lock MODULE.bazel.lock.before flake.lock.before generated-locks.patch source.txt receipt.json channel-rust-1.99.0.toml > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-toolchain-locks-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-toolchain-locks/
          if-no-files-found: error
          retention-days: 7

  committed-locks:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'compatibility'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
      - name: Reject old toolchain facts before compatibility execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          facts = json.loads(Path("MODULE.bazel.lock").read_text())["facts"]["@@rules_rs+//rs/toolchains:module_extension.bzl%toolchains"]
          assert facts and all(re.search(r"-1\.99\.0(?:-|\.tar\.xz$)", name) for name in facts), "reviewed Rust 1.99 locks must be committed first"
          PY
          python3 .github/scripts/run_bazel_with_buildbuddy.py mod deps --lockfile_mode=error
          git diff --exit-code

  cargo-compatibility:
    needs: committed-locks
    uses: ./.github/workflows/rust-ci-full.yml
    secrets: inherit

  bazel-compatibility:
    needs: committed-locks
    uses: ./.github/workflows/bazel.yml
    with:
      qualify_native_windows: true
    secrets: inherit

  v8-compatibility:
    needs: committed-locks
    uses: ./.github/workflows/v8-canary.yml
    secrets: inherit

  native-desktop:
    needs: committed-locks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare existing native desktop prerequisites
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hepta-desktop-target" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libudev-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.99.0"
          components: rustfmt,clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Check native desktop formatting
        run: cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check
      - name: Run existing native desktop tests
        run: just test -p hepta-native --manifest-path ../apps/hepta-native/Cargo.toml --locked --cargo-profile dev-small --retries 0
      - name: Check every native desktop target
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path apps/hepta-native/Cargo.toml --locked --profile dev-small --all-targets -- -D clippy::correctness -D clippy::await_holding_lock -D clippy::await_holding_invalid_type
      - uses: ./.github/actions/check-clean-worktree
        if: always() && !cancelled()
