name: knowledge.graph A-B-C exact candidate execution

on:
  push:
    branches: [work/kg-abc-closure-20260928]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kg-abc-execution-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  bind:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.bind.outputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare committed source and validate its complete observation
        id: bind
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          OWN_BRANCH: work/kg-abc-closure-20260928
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$OWN_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$OWN_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          git config user.name 'Hepta KG candidate preparation'
          git config user.email 'hepta-kg-ci@users.noreply.github.com'
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          (
            cd codex-rs
            cargo fmt --package codex-hepta-kg --package codex-hepta-memory \
              --package codex-hepta-agentd --package codex-hepta-prompt-registry \
              --package codex-hepta-prompt-optimizer
          )
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          roots = (
              'codex-rs/hepta-kg/', 'codex-rs/hepta-memory/',
              'codex-rs/hepta-agentd/', 'codex-rs/hepta-prompt-registry/',
              'codex-rs/hepta-prompt-optimizer/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z'], text=True
          ).split('\0')
          for path in filter(None, changed):
              if not path.startswith(roots) or not path.endswith('.rs'):
                  raise SystemExit(f'formatter changed an unowned path: {path}')
          guide = Path('docs/modules/knowledge.graph/TECHNICAL.md')
          marker = '## Indexed query budget and writer selection (2026-09-28)'
          section = (
              '\n\n' + marker + '\n\n'
              'The current indexed-query support-work ceiling, failure semantics, '
              'reference-equivalence tests and candidate acceptance boundary are '
              'specified in [QUERY_BUDGET_20260928.md](QUERY_BUDGET_20260928.md). '
              'Compact `revision_facts_v1` persistence is not incremental '
              'recalculation. The runtime writer remains complete and bounded; '
              'see [writer selection and target-host qualification]'
              '(../../../qualification/knowledge-graph/WRITER_SELECTION.md). '
              'These documents describe candidate source and requirements, '
              'not successful execution or release receipts.\n'
          )
          text = guide.read_text()
          if marker not in text:
              guide.write_text(text.rstrip() + section)
          elif section.strip() not in text:
              raise SystemExit('existing query-budget guide section has drifted')
          PY
          python3 scripts/hepta_kg_documentation_sync.py --check
          git diff --check
          git add -u -- codex-rs/hepta-kg codex-rs/hepta-memory \
            codex-rs/hepta-agentd codex-rs/hepta-prompt-registry \
            codex-rs/hepta-prompt-optimizer docs/modules/knowledge.graph/TECHNICAL.md
          if ! git diff --cached --quiet; then
            git commit \
              -m 'fix(knowledge.graph): format scoped candidate and link current contracts' \
              -m 'Preparation only; native execution remains required.' \
              -m 'Signed-off-by: ChatGPT <noreply@openai.com>'
          fi
          python3 - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          spec = importlib.util.spec_from_file_location(
              'kg_maps', 'scripts/hepta-implementation-maps.py'
          )
          maps = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(maps)
          path = Path('docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json')
          original = path.read_text()
          row = json.loads(original, object_pairs_hook=maps.unique_keys)
          assert row['module'] == 'knowledge.graph'
          assert row['declaredRoots'] == ['codex-rs/hepta-kg']
          # Observe the whole current evidence cut, not merely conditional kernel
          # object changes. The map-only commit below must change no mapped path.
          anchor = maps.current_source_base()
          row['sourceBase'] = anchor
          row['observedAtHead'] = anchor
          row['observedSourcePaths'] = sorted(
              set(row['observedSourcePaths'])
              | set(row['declaredRoots'])
              | set(row['resolvedRoots'])
              | set(row['compositionRoots'])
              | {row['technicalGuide']}
          )
          row['sourceObjects'] = maps.current_source_objects(row)
          row['observedSourcePaths'] = sorted(
              set(row['observedSourcePaths'])
              | {item['path'] for item in row['sourceObjects']}
          )
          assert row['productionImplementation'] is False
          for key in (
              'productionImplementation', 'productExecutionProved',
              'independentAcceptance', 'activation', 'release',
          ):
              assert row['claimBoundary'][key] is False
          print('KG source observation:', json.dumps(anchor, sort_keys=True))
          path.write_text(json.dumps(row, indent=2) + '\n')
          PY
          git diff --check
          git add docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --name-only)" = \
              'docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json'
            git commit \
              -m 'docs(knowledge.graph): bind complete immutable closure observation' \
              -m 'Signed-off-by: ChatGPT <noreply@openai.com>'
          fi
          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          git diff --exit-code
          git diff --cached --exit-code
          # Ordinary push to the authorized draft only, never merge or force.
          # Persist source even when qualification finds a blocker, so native
          # diagnostics can inspect exactly the same reviewable commit.
          test "$(git ls-remote origin "refs/heads/$OWN_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/$OWN_BRANCH"
          test "$(git ls-remote origin "refs/heads/$OWN_BRANCH" | cut -f1)" = "$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          python3 scripts/hepta_knowledge_graph_map_verify.py \
            --expected-sha "$candidate" --expected-tree "$tree"

  execution:
    needs: bind
    # A failed identity gate must not suppress native diagnostics. It still
    # fails bind and the aggregate qualification gate; there is no green bypass.
    if: ${{ always() && needs.bind.outputs.candidate != '' }}
    name: KG ${{ matrix.profile }} (${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: kernel
            lane: source-head
            runner: macos-14
          - profile: kernel
            lane: base-merge
            runner: macos-14
          - profile: product
            lane: source-head
            runner: ubuntu-22.04
          - profile: product
            lane: base-merge
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.bind.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Construct deterministic pinned-base merge
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ needs.bind.outputs.candidate }}
          pr-number: '1142'
          author-name: Hepta KG CI
          author-email: hepta-kg-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Retain actual tested identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-evidence"
          git diff --exit-code
          git diff --cached --exit-code
          {
            printf 'source=%s\nbase=%s\n' "$SOURCE_SHA" "$BASE_SHA"
            git rev-parse HEAD HEAD^{tree}
          } | tee "$RUNNER_TEMP/kg-evidence/identity.txt"
      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" \
            --profile minimal --component rustfmt --component clippy
      - name: Prepare real product sandbox prerequisites
        if: matrix.profile == 'product'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Resolve repository-verified V8 product artifacts
        if: matrix.profile == 'product'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Verify synchronized knowledge.graph documentation
        run: python3 scripts/hepta_kg_documentation_sync.py --check
      - name: Execute complete profile without suppressing later checks
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
        run: |
          python3 scripts/hepta_kg_current_candidate_runner.py \
            --profile '${{ matrix.profile }}' --lane '${{ matrix.lane }}' \
            --evidence "$RUNNER_TEMP/kg-evidence" \
            --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA"
      - name: Ensure tests did not change tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Audit complete current-candidate execution inventory
        if: always()
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
          PROFILE: ${{ matrix.profile }}
          LANE: ${{ matrix.lane }}
        run: |
          python3 scripts/hepta_kg_execution_audit.py \
            --directory "$RUNNER_TEMP/kg-evidence" --profile "$PROFILE" \
            --lane "$LANE" --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA"
      - name: Preserve observed results, not acceptance claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-abc-${{ matrix.profile }}-${{ matrix.lane }}-${{ needs.bind.outputs.candidate }}
          path: ${{ runner.temp }}/kg-evidence
          if-no-files-found: error

  qualification:
    needs: [bind, execution]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require successful binding and all four native lanes
        env:
          BIND_RESULT: ${{ needs.bind.result }}
          EXECUTION_RESULT: ${{ needs.execution.result }}
          CANDIDATE: ${{ needs.bind.outputs.candidate }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE"
          test "$BIND_RESULT" = success
          test "$EXECUTION_RESULT" = success
          printf 'Exact-candidate checks succeeded for %s; independent acceptance and release are separate gates.\n' "$CANDIDATE"
