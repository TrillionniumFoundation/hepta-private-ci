name: knowledge.graph A-B-C exact candidate execution

on:
  push:
    branches: [work/kg-abc-execution-20260927]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kg-abc-execution-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  bind:
    runs-on: macos-14
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.bind.outputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Synchronize knowledge.graph docs and bind implementation map
        id: bind
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          OWN_BRANCH: work/kg-abc-execution-20260927
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$OWN_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$OWN_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          python3 scripts/hepta_kg_documentation_sync.py --apply
          python3 - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          spec = importlib.util.spec_from_file_location(
              'kg_maps', 'scripts/hepta-implementation-maps.py'
          )
          maps = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(maps)
          path = Path('docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text(), object_pairs_hook=maps.unique_keys)
          assert row['module'] == 'knowledge.graph'
          assert row['declaredRoots'] == ['codex-rs/hepta-kg']
          extra = {
              '.github/workflows/hepta-kg-abc-execution.yml',
              'scripts/hepta_knowledge_graph_map_verify.py',
              'scripts/hepta_kg_current_candidate_runner.py',
              'scripts/hepta_kg_documentation_sync.py',
              'scripts/hepta_kg_evidence.py',
              'scripts/test_hepta_kg_measurement.py',
              'scripts/hepta_kg_execution_audit.py',
              'scripts/test_hepta_kg_execution_audit.py',
              'qualification/knowledge-graph/EXECUTION_20260927.md',
              'qualification/knowledge-graph/EXECUTION_POSTFLIGHT_20260927.md',
              'qualification/knowledge-graph/QUERY_CLOSURE_20260927.md',
              'qualification/knowledge-graph/TARGET_HOST.md',
              'qualification/knowledge-graph/WRITER_SELECTION_20260927.md',
          }
          existing = {item['path'] for item in row['sourceObjects']}
          row['sourceObjects'].extend(
              {'path': item} for item in sorted(extra - existing)
          )
          candidate = maps.current_source_base()
          current_objects = maps.current_source_objects(row)
          changed = current_objects != row['sourceObjects']
          if not changed:
              try:
                  maps.verify_source_identity(
                      row, row['resolvedRoots'], candidate
                  )
              except maps.SourceDrift:
                  changed = True
          if changed:
              row['sourceBase'] = candidate
              row['observedAtHead'] = candidate
              row['sourceObjects'] = current_objects
              row['observedSourcePaths'] = sorted(
                  set(row['observedSourcePaths'])
                  | {item['path'] for item in current_objects}
              )
              path.write_text(json.dumps(row, indent=2) + '\n')
          assert row['productionImplementation'] is False
          for key in (
              'productExecutionProved',
              'independentAcceptance',
              'activation',
              'release',
          ):
              assert row['claimBoundary'][key] is False
          PY
          git diff --check
          git add \
            docs/modules/knowledge.graph/TECHNICAL.md \
            docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json \
            qualification/module-execution-dossiers/detail/knowledge.graph.md \
            qualification/knowledge-graph/WRITER_SELECTION_20260927.md
          if ! git diff --cached --quiet; then
            unexpected="$(git diff --cached --name-only | grep -Ev '^(docs/modules/knowledge\.graph/(TECHNICAL\.md|IMPLEMENTATION_MAP\.json)|qualification/module-execution-dossiers/detail/knowledge\.graph\.md|qualification/knowledge-graph/WRITER_SELECTION_20260927\.md)$' || true)"
            test -z "$unexpected"
            git config user.name 'Hepta KG candidate binding'
            git config user.email 'hepta-kg-ci@users.noreply.github.com'
            git commit \
              -m 'docs(knowledge.graph): synchronize runtime and writer decision' \
              -m 'Signed-off-by: ChatGPT <noreply@openai.com>'
            git push origin "HEAD:refs/heads/$OWN_BRANCH"
          fi
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  execution:
    needs: bind
    name: KG ${{ matrix.profile }} (${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: kernel
            lane: source-head
            runner: macos-14
          - profile: kernel
            lane: base-merge
            runner: macos-14
          - profile: product
            lane: source-head
            runner: ubuntu-22.04
          - profile: product
            lane: base-merge
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.bind.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Construct existing deterministic pinned-base merge
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ needs.bind.outputs.candidate }}
          pr-number: '1110'
          author-name: Hepta KG CI
          author-email: hepta-kg-ci@users.noreply.github.com
          message: Synthetic merge

      - name: Retain actual tested identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-evidence"
          git diff --exit-code
          git diff --cached --exit-code
          {
            printf 'source=%s\nbase=%s\n' "$SOURCE_SHA" "$BASE_SHA"
            git rev-parse HEAD HEAD^{tree}
          } | tee "$RUNNER_TEMP/kg-evidence/identity.txt"

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" \
            --profile minimal --component rustfmt --component clippy

      - name: Prepare real product sandbox prerequisites
        if: matrix.profile == 'product'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve repository-verified V8 product artifacts
        if: matrix.profile == 'product'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Verify synchronized knowledge.graph documentation
        run: python3 scripts/hepta_kg_documentation_sync.py --check

      - name: Execute complete profile without suppressing later checks
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
        run: |
          python3 scripts/hepta_kg_current_candidate_runner.py \
            --profile '${{ matrix.profile }}' \
            --lane '${{ matrix.lane }}' \
            --evidence "$RUNNER_TEMP/kg-evidence" \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA"

      - name: Ensure tests did not change tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Audit complete current-candidate execution inventory
        if: always()
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
          PROFILE: ${{ matrix.profile }}
          LANE: ${{ matrix.lane }}
        run: |
          python3 scripts/hepta_kg_execution_audit.py \
            --directory "$RUNNER_TEMP/kg-evidence" \
            --profile "$PROFILE" \
            --lane "$LANE" \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA"

      - name: Preserve observed results, not acceptance claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-abc-${{ matrix.profile }}-${{ matrix.lane }}-${{ needs.bind.outputs.candidate }}
          path: ${{ runner.temp }}/kg-evidence
          if-no-files-found: error
