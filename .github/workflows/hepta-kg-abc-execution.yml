name: knowledge.graph A-B-C exact candidate execution

on:
  push:
    branches: [work/kg-abc-evidence-hardening-20260928]
    paths:
      - "codex-rs/hepta-kg/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/hepta-prompt-optimizer/**"
      - "docs/modules/knowledge.graph/**"
      - "scripts/hepta_kg_*.py"
      - "scripts/hepta_kg_*.sh"
      - "scripts/hepta_knowledge_graph_map_verify.py"
      - ".github/actions/hepta-synthetic-merge/**"
      - ".github/workflows/hepta-kg-abc-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kg-abc-execution-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  execution:
    name: KG ${{ matrix.profile }} (${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: kernel
            lane: source-head
            runner: macos-14
          - profile: kernel
            lane: base-merge
            runner: macos-14
          - profile: product
            lane: source-head
            runner: ubuntu-24.04
          - profile: product
            lane: base-merge
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current default-branch base
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          base_sha="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
          test -n "$base_sha"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Construct deterministic current-base merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.identity.outputs.base }}
          source-sha: ${{ steps.identity.outputs.source }}
          pr-number: "1169"
          author-name: Hepta KG CI
          author-email: hepta-kg-ci@users.noreply.github.com
          message: Synthetic merge

      - name: Retain actual tested identity
        shell: bash
        env:
          RESOLVED_SOURCE_SHA: ${{ steps.identity.outputs.source }}
          RESOLVED_BASE_SHA: ${{ steps.identity.outputs.base }}
          SYNTHETIC_SHA: ${{ steps.synthetic.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-evidence"
          expected="$RESOLVED_SOURCE_SHA"
          if [[ "${{ matrix.lane }}" == base-merge ]]; then
            expected="$SYNTHETIC_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --exit-code
          git diff --cached --exit-code
          {
            printf 'source=%s\nbase=%s\n' "$RESOLVED_SOURCE_SHA" "$RESOLVED_BASE_SHA"
            printf 'lane=%s\nprofile=%s\n' '${{ matrix.lane }}' '${{ matrix.profile }}'
            git rev-parse HEAD HEAD^{tree}
            git rev-list --parents -n 1 HEAD
          } | tee "$RUNNER_TEMP/kg-evidence/identity.txt"

      - name: Set up repository Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" \
            --profile minimal --component rustfmt --component clippy

      - name: Prepare real product sandbox and protobuf prerequisites
        if: matrix.profile == 'product'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bubblewrap libcap-dev pkg-config protobuf-compiler
          command -v protoc
          protoc --version | tee "$RUNNER_TEMP/kg-evidence/protoc-version.txt"
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve repository-verified V8 product artifacts
        if: matrix.profile == 'product'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Execute complete profile without suppressing later evidence steps
        id: profile
        continue-on-error: true
        env:
          RESOLVED_SOURCE_SHA: ${{ steps.identity.outputs.source }}
          RESOLVED_BASE_SHA: ${{ steps.identity.outputs.base }}
        run: |
          python3 scripts/hepta_kg_current_candidate_runner.py \
            --profile '${{ matrix.profile }}' --lane '${{ matrix.lane }}' \
            --evidence "$RUNNER_TEMP/kg-evidence" \
            --source-sha "$RESOLVED_SOURCE_SHA" --base-sha "$RESOLVED_BASE_SHA"

      - name: Measure public operation boundaries
        id: measurement
        if: always()
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p codex-hepta-kg --test operation_measurement \
            -- --exact public_operation_boundaries_emit_nonzero_regression_metrics \
            --nocapture 2>&1 | tee "$RUNNER_TEMP/kg-evidence/operation-metrics.log"

      - name: Bind contracts to exact execution evidence
        id: contract
        if: always()
        continue-on-error: true
        env:
          RESOLVED_SOURCE_SHA: ${{ steps.identity.outputs.source }}
          RESOLVED_BASE_SHA: ${{ steps.identity.outputs.base }}
          PROFILE: ${{ matrix.profile }}
          LANE: ${{ matrix.lane }}
        run: |
          python3 scripts/hepta_kg_contract_evidence.py \
            --evidence "$RUNNER_TEMP/kg-evidence" \
            --profile "$PROFILE" --lane "$LANE" \
            --source-sha "$RESOLVED_SOURCE_SHA" --base-sha "$RESOLVED_BASE_SHA" \
            --tested-sha "$(git rev-parse HEAD)" \
            --tested-tree "$(git rev-parse HEAD^{tree})"

      - name: Audit complete current-candidate execution inventory
        id: audit
        if: always()
        continue-on-error: true
        env:
          RESOLVED_SOURCE_SHA: ${{ steps.identity.outputs.source }}
          RESOLVED_BASE_SHA: ${{ steps.identity.outputs.base }}
          PROFILE: ${{ matrix.profile }}
          LANE: ${{ matrix.lane }}
        run: |
          python3 scripts/hepta_kg_execution_audit.py \
            --directory "$RUNNER_TEMP/kg-evidence" --profile "$PROFILE" \
            --lane "$LANE" --source-sha "$RESOLVED_SOURCE_SHA" \
            --base-sha "$RESOLVED_BASE_SHA"

      - name: Ensure tests did not change tracked source
        id: clean
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Preserve observed results, not acceptance claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-abc-${{ matrix.profile }}-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/kg-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Require every profile evidence boundary
        if: always()
        env:
          PROFILE_OUTCOME: ${{ steps.profile.outcome }}
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          set -euo pipefail
          test "$PROFILE_OUTCOME" = success
          test "$MEASUREMENT_OUTCOME" = success
          test "$CONTRACT_OUTCOME" = success
          test "$AUDIT_OUTCOME" = success
          test "$CLEAN_OUTCOME" = success

  evidence:
    name: KG C evidence and claim-boundary audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Execute every evidence audit
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/kg-evidence-audit"
          mkdir -p "$evidence"
          : > "$evidence/results.tsv"
          failures=0
          run_check() {
            local name="$1"
            shift
            local log="$evidence/${name}.log"
            set +e
            "$@" > >(tee "$log") 2>&1
            local code=$?
            set -e
            if [[ $code -eq 0 ]]; then
              printf '%s\tpassed\t0\n' "$name" >> "$evidence/results.tsv"
            else
              printf '%s\tfailed\t%s\n' "$name" "$code" >> "$evidence/results.tsv"
              failures=$((failures + 1))
            fi
          }
          run_check split_status python3 scripts/hepta_kg_status.py --check
          run_check documentation_sync python3 scripts/hepta_kg_documentation_sync.py --check
          run_check implementation_map \
            python3 scripts/hepta_knowledge_graph_map_verify.py \
              --expected-sha "$(git rev-parse HEAD)" \
              --expected-tree "$(git rev-parse HEAD^{tree})"
          run_check legacy_guard python3 scripts/hepta_kg_legacy_guard.py
          run_check evidence_unit_tests \
            bash -lc 'python3 -m unittest discover -s scripts -p "test_hepta_kg_*.py" -v'
          run_check repository_clean \
            bash -lc 'git diff --exit-code && git diff --cached --exit-code && test -z "$(git status --porcelain --untracked-files=no)"'
          if [[ $failures -ne 0 ]]; then
            printf '%s evidence audit(s) failed; execution lanes were not suppressed.\n' "$failures" >&2
            exit 1
          fi

      - name: Preserve C evidence audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-abc-evidence-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/kg-evidence-audit
          if-no-files-found: error
          retention-days: 30

  qualification:
    needs: [execution, evidence]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all read-only A-B-C evidence lanes
        env:
          EXECUTION_RESULT: ${{ needs.execution.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
        run: |
          set -euo pipefail
          test "$EXECUTION_RESULT" = success
          test "$EVIDENCE_RESULT" = success
          printf 'Exact-candidate A-B-C evidence succeeded for %s; independent acceptance, activation and release remain separate gates.\n' "$SOURCE_SHA"
