name: knowledge.graph A-B-C exact candidate execution

on:
  push:
    branches: [work/kg-abc-evidence-hardening-20260928]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kg-abc-execution-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.bind.outputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bind immutable source observation or accept map-only successor
        id: bind
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          OWN_BRANCH: work/kg-abc-evidence-hardening-20260928
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$OWN_BRANCH"
          test "$GITHUB_REPOSITORY" = 'TrillionniumFoundation/hepta-private-ci'
          test "$GITHUB_SERVER_URL" = 'https://github.com'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

          ORIGIN_URL="https://github.com/$GITHUB_REPOSITORY.git"
          authoritative_git() {
            env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
              GIT_TERMINAL_PROMPT=0 git "$@"
          }
          git config --local remote.origin.pushurl "$ORIGIN_URL"
          test "$(authoritative_git remote get-url --push origin)" = "$ORIGIN_URL"
          remote_head() {
            authoritative_git ls-remote "$ORIGIN_URL" "refs/heads/$OWN_BRANCH" \
              | awk '{print $1}'
          }
          test "$(remote_head)" = "$SOURCE_SHA"

          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          if python3 scripts/hepta_knowledge_graph_map_verify.py \
              --expected-sha "$candidate" --expected-tree "$tree"; then
            echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'Hepta KG candidate preparation'
          git config user.email 'hepta-kg-ci@users.noreply.github.com'
          python3 - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          spec = importlib.util.spec_from_file_location(
              'kg_maps', 'scripts/hepta-implementation-maps.py'
          )
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load implementation-map tooling')
          maps = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(maps)

          path = Path('docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text(), object_pairs_hook=maps.unique_keys)
          if row.get('module') != 'knowledge.graph':
              raise SystemExit('unexpected implementation map')
          if row.get('declaredRoots') != ['codex-rs/hepta-kg']:
              raise SystemExit('unexpected knowledge.graph root')
          anchor = maps.current_source_base()
          row['sourceBase'] = anchor
          row['observedAtHead'] = anchor
          row['observedSourcePaths'] = sorted(
              set(row.get('observedSourcePaths', []))
              | set(row.get('declaredRoots', []))
              | set(row.get('resolvedRoots', []))
              | set(row.get('compositionRoots', []))
              | {
                  row['technicalGuide'],
                  '.github/workflows/hepta-kg-abc-execution.yml',
                  'codex-rs/hepta-kg/tests/operation_measurement.rs',
                  'codex-rs/hepta-kg/tests/query_acceptance.rs',
                  'codex-rs/hepta-kg/tests/query_resource_contract.rs',
                  'codex-rs/hepta-memory/tests/kg_delivery_consistency.rs',
                  'docs/modules/knowledge.graph/ACCEPTANCE_EXTENSION_20260928.md',
                  'docs/modules/knowledge.graph/QUERY_BUDGET_20260928.md',
                  'scripts/hepta_kg_contract_evidence.py',
                  'scripts/hepta_kg_current_candidate_runner.py',
                  'scripts/hepta_kg_execution_audit.py',
                  'scripts/hepta_knowledge_graph_map_verify.py',
                  'scripts/test_hepta_kg_contract_evidence.py',
                  'scripts/test_hepta_kg_execution_audit.py',
              }
          )
          row['sourceObjects'] = maps.current_source_objects(row)
          row['observedSourcePaths'] = sorted(
              set(row['observedSourcePaths'])
              | {item['path'] for item in row['sourceObjects']}
          )
          if row.get('productionImplementation') is not False:
              raise SystemExit('map must not advance production implementation')
          boundary = row.get('claimBoundary', {})
          for key in (
              'productionImplementation', 'productExecutionProved',
              'independentAcceptance', 'activation', 'release',
          ):
              if boundary.get(key) is not False:
                  raise SystemExit(f'map must not advance {key}')
          path.write_text(json.dumps(row, indent=2) + '\n')
          PY

          git diff --check
          git add docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json
          test "$(git diff --cached --name-only)" = \
            'docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json'
          git commit \
            -m 'docs(knowledge.graph): bind delivery-closure source observation' \
            -m 'Map-only successor; no execution or release claim is advanced.' \
            -m 'Signed-off-by: ChatGPT <noreply@openai.com>'
          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          git diff --exit-code
          git diff --cached --exit-code
          python3 scripts/hepta_knowledge_graph_map_verify.py \
            --expected-sha "$candidate" --expected-tree "$tree"

          test "$(remote_head)" = "$SOURCE_SHA"
          authoritative_git push origin "HEAD:refs/heads/$OWN_BRANCH"
          test "$(remote_head)" = "$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

  execution:
    needs: bind
    if: ${{ always() && needs.bind.outputs.candidate != '' }}
    name: KG ${{ matrix.profile }} (${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: kernel
            lane: source-head
            runner: macos-14
          - profile: kernel
            lane: base-merge
            runner: macos-14
          - profile: product
            lane: source-head
            runner: ubuntu-22.04
          - profile: product
            lane: base-merge
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.bind.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Construct deterministic pinned-base merge
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ needs.bind.outputs.candidate }}
          pr-number: '1169'
          author-name: Hepta KG CI
          author-email: hepta-kg-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Retain actual tested identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-evidence"
          git diff --exit-code
          git diff --cached --exit-code
          {
            printf 'source=%s\nbase=%s\n' "$SOURCE_SHA" "$BASE_SHA"
            git rev-parse HEAD HEAD^{tree}
          } | tee "$RUNNER_TEMP/kg-evidence/identity.txt"
      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" \
            --profile minimal --component rustfmt --component clippy
      - name: Prepare real product sandbox and protobuf prerequisites
        if: matrix.profile == 'product'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bubblewrap libcap-dev pkg-config protobuf-compiler
          command -v protoc
          protoc --version | tee "$RUNNER_TEMP/kg-evidence/protoc-version.txt"
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Resolve repository-verified V8 product artifacts
        if: matrix.profile == 'product'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Verify synchronized knowledge.graph documentation
        run: python3 scripts/hepta_kg_documentation_sync.py --check
      - name: Execute complete profile without suppressing later checks
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
        run: |
          python3 scripts/hepta_kg_current_candidate_runner.py \
            --profile '${{ matrix.profile }}' --lane '${{ matrix.lane }}' \
            --evidence "$RUNNER_TEMP/kg-evidence" \
            --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA"
      - name: Measure public operation boundaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-kg --test operation_measurement \
            -- --exact public_operation_boundaries_emit_nonzero_regression_metrics \
            --nocapture 2>&1 | tee "$RUNNER_TEMP/kg-evidence/operation-metrics.log"
      - name: Test delivery-evidence validator
        run: |
          python3 -m unittest discover -s scripts \
            -p test_hepta_kg_contract_evidence.py -v
      - name: Bind contracts to exact execution evidence
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
          PROFILE: ${{ matrix.profile }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          python3 scripts/hepta_kg_contract_evidence.py \
            --evidence "$RUNNER_TEMP/kg-evidence" \
            --profile "$PROFILE" --lane "$LANE" \
            --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA" \
            --tested-sha "$(git rev-parse HEAD)" \
            --tested-tree "$(git rev-parse HEAD^{tree})"
      - name: Ensure tests did not change tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Audit complete current-candidate execution inventory
        if: always()
        env:
          SOURCE_SHA: ${{ needs.bind.outputs.candidate }}
          PROFILE: ${{ matrix.profile }}
          LANE: ${{ matrix.lane }}
        run: |
          python3 scripts/hepta_kg_execution_audit.py \
            --directory "$RUNNER_TEMP/kg-evidence" --profile "$PROFILE" \
            --lane "$LANE" --source-sha "$SOURCE_SHA" --base-sha "$BASE_SHA"
      - name: Preserve observed results, not acceptance claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kg-abc-${{ matrix.profile }}-${{ matrix.lane }}-${{ needs.bind.outputs.candidate }}
          path: ${{ runner.temp }}/kg-evidence
          if-no-files-found: error

  qualification:
    needs: [bind, execution]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require successful binding and all four native lanes
        env:
          BIND_RESULT: ${{ needs.bind.result }}
          EXECUTION_RESULT: ${{ needs.execution.result }}
          CANDIDATE: ${{ needs.bind.outputs.candidate }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE"
          test "$BIND_RESULT" = success
          test "$EXECUTION_RESULT" = success
          printf 'Exact-candidate checks succeeded for %s; independent acceptance and release are separate gates.\n' "$CANDIDATE"
