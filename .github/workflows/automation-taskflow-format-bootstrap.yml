name: Automation TaskFlow rustfmt bootstrap

on:
  push:
    branches:
      - work/automation-taskflow-full-closure-2026-09-27
    paths:
      - "codex-rs/hepta-automation/**"
      - "codex-rs/hepta-agentd/src/automation.rs"
      - ".github/workflows/automation-taskflow-format-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-taskflow-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message || '', '[automation-format]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: stable
          components: rustfmt

      - name: Format Rust workspace
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Commit formatting when needed
        shell: bash
        env:
          TARGET_BRANCH: work/automation-taskflow-full-closure-2026-09-27
        run: |
          set -euo pipefail
          if git diff --quiet -- codex-rs; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "hepta-automation-ci"
          git config user.email "hepta-automation-ci@users.noreply.github.com"
          git add codex-rs
          git commit -m "chore(automation): apply rustfmt [automation-format]"
          git push origin "HEAD:${TARGET_BRANCH}"
