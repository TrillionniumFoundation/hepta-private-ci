name: Learning artifacts repair materialization

on:
  push:
    branches: ['codex/learning-artifacts-repair-materialize-20260930']

permissions:
  contents: read

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: clippy,rustfmt
      - name: Apply deterministic source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          closure = Path('scripts/hepta-lane-e-closure.py')
          text = closure.read_text(encoding='utf-8')
          old = 'from hepta_lane_e_closure_v2 import verify_workflow\n'
          new = 'from hepta_lane_e_closure_v2 import verify_workflows as verify_workflow\n'
          if text.count(old) != 1:
              raise SystemExit('legacy closure import did not match exactly once')
          closure.write_text(text.replace(old, new), encoding='utf-8')
          qualification = Path('scripts/hepta_artifact_qualification.py')
          text = qualification.read_text(encoding='utf-8')
          old = ', "--retries", "0", "--no-fail-fast"],'
          new = ', "--retries", "0"],'
          if text.count(old) != 1:
              raise SystemExit('qualification nextest command did not match exactly once')
          qualification.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Format learning artifacts
        id: format
        continue-on-error: true
        run: cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-learning-artifacts
      - name: Reconcile lockfile and compile all targets
        id: compile
        continue-on-error: true
        run: cargo check --manifest-path codex-rs/Cargo.toml -p codex-hepta-learning-artifacts --all-targets
      - name: Refresh implementation source seals
        id: seals
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git add codex-rs/Cargo.lock codex-rs/hepta-learning-artifacts scripts/hepta-lane-e-closure.py scripts/hepta_artifact_qualification.py
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          map_path = Path('docs/modules/learning.artifacts/IMPLEMENTATION_MAP.json')
          value = json.loads(map_path.read_text(encoding='utf-8'))
          root_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          def object_at(path: str) -> str:
              return subprocess.check_output(['git', 'rev-parse', f'{root_tree}:{path}'], text=True).strip()
          seen = set()
          for entry in value.get('sourceObjects', []):
              path = entry['path']
              if path in seen:
                  raise SystemExit(f'duplicate source object: {path}')
              seen.add(path)
              entry['object'] = object_at(path)
          for operation in value.get('operations', []):
              operation['sourceBlob'] = object_at(operation['sourcePath'])
          map_path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/modules/learning.artifacts/IMPLEMENTATION_MAP.json
      - name: Verify repaired formatting and lockfile
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-learning-artifacts -- --check
          cargo check --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-learning-artifacts --all-targets
          python3 -m unittest discover -s scripts -p 'test_hepta_artifact_*.py' -v
      - name: Materialize ordinary-source patch
        if: always()
        shell: bash
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SEALS_OUTCOME: ${{ steps.seals.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/materialized"
          mkdir -p "$root/files"
          git diff --name-only --diff-filter=ACMRT > "$root/paths.txt"
          while IFS= read -r path; do
            test -n "$path"
            mkdir -p "$root/files/$(dirname "$path")"
            cp "$path" "$root/files/$path"
          done < "$root/paths.txt"
          git diff --binary > "$root/repair.patch"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'materialized'
          status = {key: os.environ[key] for key in ('FORMAT_OUTCOME','COMPILE_OUTCOME','SEALS_OUTCOME','VERIFY_OUTCOME')}
          (root / 'status.json').write_text(json.dumps(status, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload materialized patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-artifacts-repair-${{ github.sha }}
          path: ${{ runner.temp }}/materialized
          if-no-files-found: error
          retention-days: 3
