name: Learning operator portable dependency sources
on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths: ['.github/workflows/learning-operator-local-tools.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Vendor locked dependency source without credentials or project data
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/operator-dependencies"
          cargo vendor --locked --versioned-dirs "$RUNNER_TEMP/operator-vendor" > "$RUNNER_TEMP/operator-dependencies/config.toml"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/operator-dependencies/vendor.tar.gz" operator-vendor
          sha256sum "$RUNNER_TEMP/operator-dependencies/vendor.tar.gz" > "$RUNNER_TEMP/operator-dependencies/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-operator-locked-dependencies
          path: ${{ runner.temp }}/operator-dependencies/
          if-no-files-found: error
          retention-days: 1
