# Research-only physical-source Jobs are observable on the one *trusted*
# same-repository PR branch or explicit workflow_dispatch. Fork PRs and
# ordinary pushes cannot run them (avoids doubled multi-GB downloads).
# No secrets, mutable model revisions, production authority or artifact promotion.
name: Hepta Equal-Size Stem P0/P1 source and physical-byte gates (DENY_ALL)
on:
  pull_request:
    paths:
      - "qualification/stem-replacement-p0/**"
      - ".github/workflows/hepta-stem-equal-size-p0.yml"
  push:
    branches:
      - "research/ettin400-equal-size-p0-20261016"
    paths:
      - "qualification/stem-replacement-p0/**"
      - ".github/workflows/hepta-stem-equal-size-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stem-equal-size-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile and execute original-source, physical-byte, adversarial tests
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python -m py_compile gate.py test_gate.py preflight.py test_preflight.py source_bytes.py review_bytes.py test_source_bytes.py physical_forward.py test_physical_forward.py runtime_snapshot.py test_runtime_snapshot.py runtime_compat.py test_runtime_compat.py
          python -m unittest -q test_gate test_preflight test_source_bytes test_physical_forward test_runtime_snapshot
      - name: Optimized-mode source and physical-byte guards
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python -O -m unittest -q test_gate test_preflight test_source_bytes test_physical_forward test_runtime_snapshot
      - name: Reject promotion and arbitrary code execution
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python - <<'PY'
          import gate, preflight, source_bytes
          assert gate.AUTHORITY == 'DENY_ALL'
          assert len(gate.MODELS) == 4
          assert preflight.SCHEMA.endswith('.v2')
          assert not any(hasattr(gate, s) for s in ('load_model','select_model','promote_model'))
          print('source_test_only=true genuine_pretrained_model_forward=false promotion=false')
          PY
  runtime-interface-smoke:
    needs: source-fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install exact CPU runtime without pretrained weights
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0"
          python -m pip install --only-binary=:all: "transformers==4.57.6" "numpy==2.2.6" "safetensors==0.8.0" "huggingface_hub==0.36.0"
          python -m pip install --no-deps "laya==0.3.20"
          python -m pip check
      - name: Real tiny Torch/ModernBERT CPU interface and Laya 0.3.20 signature
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python -m unittest -q test_runtime_compat
          python -O -m unittest -q test_runtime_compat
          python runtime_compat.py --out "$RUNNER_TEMP/runtime-compat.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"runtime-compat.json").read_text())
          assert r["authority"]=="DENY_ALL" and r["disposition"]=="HOLD_NO_GO"
          assert r["torch"]["real_torch_weights_only_roundtrip"] is True
          assert r["modernbert"]["real_tiny_modernbert_forward"] is True
          assert r["laya"]["laya_import_and_signature_valid"] is True
          assert r["real_pretrained_encoder_forward_verified"] is False
          assert r["production_promotion_permitted"] is False
          print("real_tiny_cpu_runtime=true original_400m_421m_weights_loaded=false promotion=false")
          PY
  hub-metadata-only:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/ettin400-equal-size-p0-20261016')
    needs: source-fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify private research HEAD before external downloads
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          test "$PR_HEAD_SHA" = "$CHECKED_SHA"
          test "$(git status --porcelain)" = ""
          echo "research_sha_bound=true fork_pr_model_download=false"
      - name: Exact metadata client version
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: "huggingface_hub==0.36.0"
          python -m pip check
      - name: Pin four complete original Hub identities without model download
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python preflight.py --out "$RUNNER_TEMP/four-metadata.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'four-metadata.json').read_text())
          assert len(r['models'])==4 and r['disposition']=='HOLD_NO_GO'
          assert r['all_original_weights_downloaded'] is False
          for x in r['models']:
              assert x['selected_source_inventory'] and x['snapshot_weight_bytes_checked'] is False
              assert x['production_promotion_permitted'] is False
          print('metadata_only=true four_sources=true original_weights_downloaded=false')
          PY
  physical-primary-source-bytes:
    # Genuine model checkpoint bytes; NO arbitrary .bin deserialization, Python
    # model import, inference or producer-published weight artifacts.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/ettin400-equal-size-p0-20261016')
    needs: [hub-metadata-only, runtime-interface-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [ettin400, laya421]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify private research HEAD before external downloads
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          test "$PR_HEAD_SHA" = "$CHECKED_SHA"
          test "$(git status --porcelain)" = ""
          echo "research_sha_bound=true fork_pr_model_download=false"
      - name: Install fixed Hub/Xet file transport only
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: "huggingface_hub==0.36.0"
          python -m pip check
      - name: Download pinned bytes and independently re-hash in a separate process
        env:
          STEM_MODEL: ${{ matrix.model }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python source_bytes.py --model "$STEM_MODEL" \
            --stage "$RUNNER_TEMP/hepta-source-$STEM_MODEL" \
            --out "$RUNNER_TEMP/hepta-producer-$STEM_MODEL.json"
          python review_bytes.py \
            --receipt "$RUNNER_TEMP/hepta-producer-$STEM_MODEL.json" \
            --stage "$RUNNER_TEMP/hepta-source-$STEM_MODEL" \
            --out "$RUNNER_TEMP/hepta-reviewed-$STEM_MODEL.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          model=os.environ['STEM_MODEL']
          p=Path(os.environ['RUNNER_TEMP']) / ('hepta-reviewed-'+model+'.json')
          r=json.loads(p.read_text())
          assert r['independently_rehashed_exact_physical_bytes'] is True
          assert r['actual_model_forward_verified'] is False
          assert r['issuer_signature_verified'] is False
          assert r['production_promotion_permitted'] is False
          assert r['disposition']=='HOLD_NO_GO'
          print(f'{model}: independently verified on-disk source hashes, NOT model loading/inference')
          PY
      - name: Safely load only byte-verified original models and execute genuine CPU forward
        env:
          STEM_MODEL: ${{ matrix.model }}
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0"
          python -m pip install --only-binary=:all: "transformers==4.57.6" "numpy==2.2.6" "safetensors==0.8.0"
          if [ "$STEM_MODEL" = "laya421" ]; then
            python -m pip install --no-deps "laya==0.3.20"
          fi
          python -m pip check
          cd qualification/stem-replacement-p0
          python physical_forward.py --model "$STEM_MODEL" \
            --stage "$RUNNER_TEMP/hepta-source-$STEM_MODEL" \
            --receipt "$RUNNER_TEMP/hepta-producer-$STEM_MODEL.json" \
            --out "$RUNNER_TEMP/hepta-forward-$STEM_MODEL.json"
          python - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          model = os.environ["STEM_MODEL"]
          doc = json.loads((Path(os.environ["RUNNER_TEMP"]) / ("hepta-forward-"+model+".json")).read_text())
          assert doc["isolated_allowlist_runtime_snapshot_verified"] is True
          assert doc["real_forward_on_fixed_unlabeled_probe"] is True
          assert doc["output"]["original_cpu_base_forward_calls"] == 1
          assert doc["output"]["actual_tensor_values_loaded"] > 0
          assert doc["heldout_human_task_score"] is None
          assert doc["equal_head_training_budget_verified"] is False
          assert doc["publisher_signature_verified"] is False
          assert doc["production_promotion_permitted"] is False
          assert doc["disposition"] == "HOLD_NO_GO"
          print(f"{model}: genuine CPU forward observed; no accuracy or production claim")
          PYVERIFY
      - name: Retain physical model research receipts (no weights or human labels)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-physical-${{ matrix.model }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/hepta-reviewed-${{ matrix.model }}.json
            ${{ runner.temp }}/hepta-forward-${{ matrix.model }}.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
