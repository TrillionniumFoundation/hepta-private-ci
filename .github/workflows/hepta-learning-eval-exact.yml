name: Hepta learning.eval exact trees

on:
  push:
    branches:
      - main
      - fix/learning-eval-full-convergence-20260926
    paths:
      - 'codex-rs/hepta-intelligence-eval/**'
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/hepta-learning-ledger/**'
      - 'codex-rs/Cargo.*'
      - 'scripts/*learning*eval*'
      - 'scripts/hepta-nextest-require.py'
      - 'scripts/test_hepta_nextest_require.py'
      - 'scripts/*rust_identifiers*'
      - 'docs/modules/learning.eval/**'
      - 'qualification/lane-e/**'
      - '.github/workflows/hepta-learning-eval-exact.yml'
  pull_request:
    paths:
      - 'codex-rs/hepta-intelligence-eval/**'
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/hepta-learning-ledger/**'
      - 'codex-rs/Cargo.*'
      - 'scripts/*learning*eval*'
      - 'scripts/hepta-nextest-require.py'
      - 'scripts/test_hepta_nextest_require.py'
      - 'scripts/*rust_identifiers*'
      - 'docs/modules/learning.eval/**'
      - 'qualification/lane-e/**'
      - '.github/workflows/hepta-learning-eval-exact.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: learning-eval-exact-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  qualify-exact:
    name: exact-${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["head"]') }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TESTED_SHA: ${{ matrix.kind == 'merge' && github.sha || (github.event.pull_request.head.sha || github.sha) }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      TREE_KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.TESTED_SHA }}

      - name: Test exact-evidence and required-filter recorders
        run: |
          set -euo pipefail
          python3 scripts/test_hepta_learning_eval_exact.py -v
          python3 scripts/test_hepta_nextest_require.py -v
          python3 scripts/test_hepta_learning_eval_exact_entry.py -v

      - name: Install qualification tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103,cargo-llvm-cov@0.9.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,llvm-tools-preview

      - name: Qualify exact immutable tree
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-commit "$TESTED_SHA" --candidate-commit "$SOURCE_SHA" --kind "$TREE_KIND")
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base-commit "$BASE_SHA")
          fi
          python3 scripts/hepta-learning-eval-exact-entry.py "${args[@]}"

      - name: Retain passed or failed exact-tree evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-eval-exact-${{ matrix.kind }}-${{ env.TESTED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hepta-evidence/learning-eval/${{ matrix.kind }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Attest successful exact-tree evidence
        if: success() && github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: .hepta-evidence/learning-eval/${{ matrix.kind }}/convergence.json
