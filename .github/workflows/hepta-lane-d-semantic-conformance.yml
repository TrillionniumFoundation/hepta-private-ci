name: Hepta Lane D semantic conformance

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-lane-d-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Verify Python and JSON semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-lane-d-semantic-conformance.py
          python3 scripts/hepta-lane-d-semantic-conformance.py self-test
          python3 scripts/hepta-lane-d-semantic-conformance.py verify
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          EXPECTED_TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-implementation-maps.py verify --profile development \
            --expected-sha "${EXPECTED_SHA}" \
            --expected-tree "${EXPECTED_TREE}"

      - name: Verify bounded change policy
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-d-semantic-conformance.py \
            verify-changes --base "${BASE_SHA}"

      - name: Reject whitespace and generated drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

  rust-package-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          rustc --version
          cargo --version

      - name: Verify Cargo lockfile integrity
        run: python3 scripts/verify_cargo_lock.py

      - name: Formatting
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # Keep this lane scoped to its three owners. Formatting each package
          # separately also avoids Windows command-line expansion of --all.
          for package in codex-hepta-objective codex-hepta-ndu codex-hepta-control-plane; do
            cargo fmt --package "$package" -- --check
          done

      - name: Compile Lane D packages
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-hepta-objective \
            -p codex-hepta-ndu \
            -p codex-hepta-control-plane \
            --all-targets

      - name: Execute Lane D package tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-objective
          cargo test --locked -p codex-hepta-ndu
          cargo test --locked -p codex-hepta-control-plane

      - name: Strict Lane D lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p codex-hepta-objective \
            -p codex-hepta-ndu \
            -p codex-hepta-control-plane \
            --all-targets -- -D warnings

      - name: Clean tracked state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
