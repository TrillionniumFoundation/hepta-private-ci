name: Hepta Lane D semantic conformance

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - codex-rs/hepta-objective/**
      - codex-rs/hepta-ndu/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-agentd/src/cognitive_context.rs
      - codex-rs/hepta-agentd/src/cognitive_context_tests.rs
      - codex-rs/hepta-contracts/CALLERS.toml
      - docs/contracts/OBJECTIVE_ERRORS.json
      - docs/readiness/OBJECTIVE_COMPILER_EXECUTION.md
      - docs/readiness/NDU_SYSTEM_EXECUTION.md
      - docs/readiness/CONTROL_RUNTIME_EXECUTION.md
      - docs/readiness/LANE_D_MATURITY.json
      - docs/delivery/LANE_D_WORK_PACKAGE_OVERLAY.json
      - docs/governance/MODULE_IMPLEMENTATION_BASELINE.md
      - docs/modules/objective.compiler/IMPLEMENTATION_MAP.json
      - docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
      - docs/modules/control.runtime/IMPLEMENTATION_MAP.json
      - docs/modules/control.runtime/TECHNICAL.md
      - qualification/module-execution-dossiers/detail/objective.compiler.md
      - qualification/module-execution-dossiers/detail/utility.ndu.md
      - qualification/module-execution-dossiers/detail/control.runtime.md
      - scripts/hepta-lane-d-semantic-conformance.py
      - scripts/test_hepta_lane_d_scope.py
      - scripts/verify_cargo_lock.py
      - scripts/test_verify_cargo_lock.py
      - .github/workflows/hepta-lane-d-semantic-conformance.yml

permissions:
  contents: read

concurrency:
  group: hepta-lane-d-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Verify Python and JSON semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-lane-d-semantic-conformance.py
          python3 scripts/hepta-lane-d-semantic-conformance.py self-test
          python3 scripts/hepta-lane-d-semantic-conformance.py verify

      - name: Verify bounded change policy
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-d-semantic-conformance.py \
            verify-changes --base "${BASE_SHA}"

      - name: Reject whitespace and generated drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

  rust-package-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          rustc --version
          cargo --version

      - name: Verify Cargo lockfile integrity
        run: python3 scripts/verify_cargo_lock.py

      - name: Formatting
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Compile Lane D packages
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-hepta-objective \
            -p codex-hepta-ndu \
            -p codex-hepta-control-plane \
            --all-targets

      - name: Execute Lane D package tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-objective
          cargo test --locked -p codex-hepta-ndu
          cargo test --locked -p codex-hepta-control-plane

      - name: Strict Lane D lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p codex-hepta-objective \
            -p codex-hepta-ndu \
            -p codex-hepta-control-plane \
            --all-targets -- -D warnings

      - name: Clean tracked state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

  control-runtime-profile:
    name: Control runtime named-host profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact host and source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          {
            git rev-parse HEAD HEAD^{tree}
            uname -a
            lscpu
            rustc -vV
            cargo -vV
          } | tee "$RUNNER_TEMP/control-runtime-host.txt"

      - name: Measure bounded planner and journal reopen
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-control-plane \
            planner_named_host_profile --release -- --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/control-runtime-profile.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-runtime-profile-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/control-runtime-host.txt
            ${{ runner.temp }}/control-runtime-profile.txt
          if-no-files-found: error
          retention-days: 30

