name: Apply scoped Clippy closure v9

on:
  push:
    branches:
      - ops/final-blocker-closure-v9-20260908

permissions:
  contents: write

concurrency:
  group: hepta-clippy-autofix-v9
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.head_commit.message == 'ops apply scoped clippy closure v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ops/final-blocker-closure-v9-20260908
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply audited state-machine lint closure
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/clippy-v9.patch.gz.b64" <<'PATCH'
          
          PATCH
          base64 --decode "$RUNNER_TEMP/clippy-v9.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/clippy-v9.patch"
          git apply --check "$RUNNER_TEMP/clippy-v9.patch"
          git apply "$RUNNER_TEMP/clippy-v9.patch"
          (cd codex-rs && cargo fmt --all && cargo fmt --all -- --check)
          git diff --check
          git status --short

      - name: Commit audited closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-blocker-closure-bot"
          git config user.email "hepta-blocker-closure-bot@users.noreply.github.com"
          git add codex-rs
          git commit -m "fix: scope state-machine lint expectations and name fence types"
          git push origin HEAD:ops/final-blocker-closure-v9-20260908
