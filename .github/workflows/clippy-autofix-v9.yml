name: Clippy autofix v9

on:
  push:
    branches:
      - ops/final-blocker-closure-v9-20260908

permissions:
  contents: write

concurrency:
  group: hepta-clippy-autofix-v9
  cancel-in-progress: false

jobs:
  autofix:
    if: github.event.head_commit.message == 'ops: launch clippy autofix v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ops/final-blocker-closure-v9-20260908
          fetch-depth: 0
          persist-credentials: true

      - name: Configure repository CI prerequisites
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Configure verified sandbox rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Apply only machine-applicable Clippy repairs
        id: fix
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/clippy-autofix-v9"
          cd codex-rs
          set +e
          cargo clippy --fix --locked --workspace --all-targets \
            --allow-dirty --allow-staged -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/clippy-autofix-v9/clippy-fix.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/clippy-autofix-v9/clippy-fix.rc"
          cargo fmt --all
          cd ..
          git diff --check

      - name: Commit machine-applicable repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-blocker-closure-bot"
          git config user.email "hepta-blocker-closure-bot@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No machine-applicable source changes were produced."
          else
            git commit -m "fix: apply machine-applicable clippy repairs"
            git push origin HEAD:ops/final-blocker-closure-v9-20260908
          fi
          git status --short > "$RUNNER_TEMP/clippy-autofix-v9/status.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/clippy-autofix-v9/HEAD"

      - name: Upload autofix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clippy-autofix-v9-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clippy-autofix-v9/
          if-no-files-found: warn
          retention-days: 30
