name: intelligence.control qualification host

on:
  pull_request:
    paths:
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-prompt-optimizer/**"
      - "codex-rs/ext/hepta-prompt/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-context-compiler/**"
      - "codex-rs/hepta-supervisor/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-operations/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/modules/intelligence.control/**"
      - ".github/workflows/hepta-intelligence-qualification-host.yml"
      - "scripts/hepta_ci_v8.py"
      - "scripts/hepta-intelligence-measure-process*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-control-qualification-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  qualification-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind source and qualification-host identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          root="$RUNNER_TEMP/intelligence-qualification-host"
          mkdir -p "$root"
          {
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            uname -a
            lscpu
            free -b
            rustc -Vv
            cargo -V
            python3 --version
          } > "$root/host.txt" 2>&1

      - name: Prepare native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify process measurement failure and timeout handling
        run: python3 scripts/hepta-intelligence-measure-process-tests.py

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: |
          sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash
          python3 scripts/hepta_ci_v8.py

      - name: Compile exact release qualification probes
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-qualification-target
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intelligence-qualification-host"
          compile_probe() {
            local package="$1"
            local crate_name="$2"
            local label="$3"
            local json="$root/${label}-build.jsonl"
            local log="$root/${label}-build.log"
            cargo test --release --locked -p "$package" --lib --no-run \
              --message-format=json-render-diagnostics > "$json" 2> "$log"
            python3 - "$json" "$root/${label}-test-binary" "$crate_name" <<'PY'
          import json, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          crate_name = sys.argv[3]
          candidates = []
          for line in source.read_text().splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if value.get("reason") != "compiler-artifact":
                  continue
              target = value.get("target", {})
              profile = value.get("profile", {})
              executable = value.get("executable")
              if (
                  executable
                  and profile.get("test") is True
                  and target.get("name") == crate_name
                  and "lib" in target.get("kind", [])
              ):
                  candidates.append(executable)
          candidates = sorted(set(candidates))
          if len(candidates) != 1:
              raise SystemExit(
                  f"expected one {crate_name} library test binary, observed {candidates}"
              )
          destination.write_text(candidates[0] + "\n")
          PY
          }
          compile_integration_probe() {
            local package="$1"
            local target_name="$2"
            local label="$3"
            local json="$root/${label}-build.jsonl"
            local log="$root/${label}-build.log"
            cargo test --release --locked -p "$package" --test "$target_name" --no-run \
              --message-format=json-render-diagnostics > "$json" 2> "$log"
            python3 - "$json" "$root/${label}-test-binary" "$target_name" <<'PY'
          import json, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          target_name = sys.argv[3]
          candidates = []
          for line in source.read_text().splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if value.get("reason") != "compiler-artifact":
                  continue
              target = value.get("target", {})
              profile = value.get("profile", {})
              executable = value.get("executable")
              if (
                  executable
                  and profile.get("test") is True
                  and target.get("name") == target_name
                  and "test" in target.get("kind", [])
              ):
                  candidates.append(executable)
          candidates = sorted(set(candidates))
          if len(candidates) != 1:
              raise SystemExit(
                  f"expected one {target_name} integration test binary, observed {candidates}"
              )
          destination.write_text(candidates[0] + "\n")
          PY
          }
          compile_probe codex-hepta-agentd codex_hepta_agentd agentd
          compile_probe codex-hepta-intelligence codex_hepta_intelligence intelligence
          compile_probe codex-hepta-prompt-optimizer codex_hepta_prompt_optimizer prompt-optimizer
          compile_probe codex-hepta-prompt-extension codex_hepta_prompt_extension prompt-extension
          compile_integration_probe codex-hepta-intelligence canonical_candidate_closure intelligence-candidate
          compile_probe codex-hepta-operations codex_hepta_operations operations
          compile_probe codex-hepta-infer-worker-host codex_hepta_infer_worker_host infer-worker
          compile_probe codex-hepta-supervisor codex_hepta_supervisor supervisor
          printf 'AGENTD_TEST_BINARY=%s\n' "$(cat "$root/agentd-test-binary")" >> "$GITHUB_ENV"
          printf 'INTELLIGENCE_TEST_BINARY=%s\n' "$(cat "$root/intelligence-test-binary")" >> "$GITHUB_ENV"
          printf 'PROMPT_OPTIMIZER_TEST_BINARY=%s\n' "$(cat "$root/prompt-optimizer-test-binary")" >> "$GITHUB_ENV"
          printf 'PROMPT_EXTENSION_TEST_BINARY=%s\n' "$(cat "$root/prompt-extension-test-binary")" >> "$GITHUB_ENV"
          printf 'INTELLIGENCE_CANDIDATE_TEST_BINARY=%s\n' "$(cat "$root/intelligence-candidate-test-binary")" >> "$GITHUB_ENV"
          printf 'OPERATIONS_TEST_BINARY=%s\n' "$(cat "$root/operations-test-binary")" >> "$GITHUB_ENV"
          printf 'INFER_WORKER_TEST_BINARY=%s\n' "$(cat "$root/infer-worker-test-binary")" >> "$GITHUB_ENV"
          printf 'SUPERVISOR_TEST_BINARY=%s\n' "$(cat "$root/supervisor-test-binary")" >> "$GITHUB_ENV"

      - name: Execute crash recovery, saturation and prompt provenance matrix
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-qualification-target
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intelligence-qualification-host"
          run_probe() {
            local executable="$1"
            local filter="$2"
            shift 2
            local log_filter="${filter//:/-}"
            local output="$root/${log_filter}.log"
            timeout 180 "$executable" "$filter" "$@" --nocapture --test-threads=1 > "$output" 2>&1
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$output"
          }
          run_probe "$AGENTD_TEST_BINARY" explicit_hard_timeout_terminates_a_real_child_process
          run_probe "$AGENTD_TEST_BINARY" installed_canonical_factory_contains_actual_work_after_caller_detaches
          run_probe "$AGENTD_TEST_BINARY" aborted_owner_work_retains_its_budget_until_computation_finishes
          run_probe "$AGENTD_TEST_BINARY" single_slot_alternates_instead_of_starving_new_work
          run_probe "$AGENTD_TEST_BINARY" replay_verification_uses_current_time_not_frozen_event_time
          run_probe "$AGENTD_TEST_BINARY" guard_rejects_rollback_and_same_epoch_drift_and_survives_reopen
          run_probe "$AGENTD_TEST_BINARY" rollback_lock_and_parent_links_fail_without_mutating_target
          run_probe "$PROMPT_OPTIMIZER_TEST_BINARY" canonical::tests::provenance::enumerated_owner_rejects_binding_mutation_and_valid_output_graft_before_pricing --exact
          run_probe "$PROMPT_OPTIMIZER_TEST_BINARY" canonical::tests::provenance::priced_owner_rejects_utility_mutation_and_valid_output_graft_before_selection --exact
          run_probe "$PROMPT_OPTIMIZER_TEST_BINARY" canonical::tests::provenance::selected_owner_preserves_wait_and_stale_semantics_but_rejects_public_mutations --exact
          run_probe "$PROMPT_EXTENSION_TEST_BINARY" resolve_tests::concurrent_resolve_initializes_once_and_caches_ready_none_and_failure --exact
          run_probe "$PROMPT_EXTENSION_TEST_BINARY" resolve_tests::cancelled_initializer_allows_waiting_resolve_to_retry_without_overlap --exact
          run_probe "$OPERATIONS_TEST_BINARY" child_process_kill_matrix_preserves_durable_effect_semantics
          run_probe "$OPERATIONS_TEST_BINARY" acknowledgement_loss_stays_indeterminate_until_terminal_observer
          run_probe "$OPERATIONS_TEST_BINARY" exact_claim_freezes_the_adopted_intent_generation
          run_probe "$OPERATIONS_TEST_BINARY" exact_claim_recovers_only_an_unused_expired_lease
          run_probe "$OPERATIONS_TEST_BINARY" exact_claim::clock_tests
          run_probe "$OPERATIONS_TEST_BINARY" newer_generation_adopts_unsettled_dispatch_and_fences_predecessor
          run_probe "$INFER_WORKER_TEST_BINARY" intelligence_prompt_substitution_fails_before_provider_contact
          run_probe "$SUPERVISOR_TEST_BINARY" restart_drains_one_agent_and_spawns_a_new_generation
          run_probe "$SUPERVISOR_TEST_BINARY" unexpected_running_exit_uses_durable_restart_budget_and_backoff
          run_probe "$SUPERVISOR_TEST_BINARY" restart_journal_round_trips_and_rejects_clock_rollback_with_full_budget

      - name: Execute semantic quality conformance matrix
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-qualification-target
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intelligence-qualification-host"
          : > "$root/semantic-quality.jsonl"
          run_quality_probe() {
            local executable="$1"
            local filter="$2"
            local log_filter="${filter//:/-}"
            local output="$root/quality-${log_filter}.log"
            timeout 180 "$executable" "$filter" --nocapture --test-threads=1 > "$output" 2>&1
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$output"
            printf '{"test":"%s","status":"passed"}\n' "$filter" >> "$root/semantic-quality.jsonl"
          }
          run_quality_probe "$AGENTD_TEST_BINARY" actual_stage_outputs_fill_templates_but_reject_substitution
          run_quality_probe "$AGENTD_TEST_BINARY" utility_universe_rejects_foreign_and_missing_candidates
          run_quality_probe "$AGENTD_TEST_BINARY" signed_input_cannot_install_host_trust_or_change_actual_context
          run_quality_probe "$INTELLIGENCE_CANDIDATE_TEST_BINARY" final_gate_rehashes_every_envelope_dependency
          run_quality_probe "$INTELLIGENCE_TEST_BINARY" membership_gate_rejects_mutated_legal_support

      - name: Measure strict signature verification and real hard-timeout exit
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-qualification-target
          HEPTA_INTELLIGENCE_SIGNATURE_PROFILE_ITERATIONS: "2000"
          HEPTA_INTELLIGENCE_SIGNATURE_PROFILE_OUTPUT: ${{ runner.temp }}/intelligence-qualification-host/signature-profile.json
          HEPTA_INTELLIGENCE_HARD_KILL_SAMPLES: "9"
          HEPTA_INTELLIGENCE_HARD_KILL_OUTPUT: ${{ runner.temp }}/intelligence-qualification-host/hard-kill-profile.json
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intelligence-qualification-host"
          timeout 180 "$AGENTD_TEST_BINARY" qualification_authority_signature_verification_profile \
            --ignored --nocapture --test-threads=1 > "$root/signature-profile.log" 2>&1
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$root/signature-profile.log"
          timeout 180 "$AGENTD_TEST_BINARY" explicit_hard_timeout_terminates_a_real_child_process \
            --nocapture --test-threads=1 > "$root/hard-kill-profile.log" 2>&1
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$root/hard-kill-profile.log"
          test -s "$HEPTA_INTELLIGENCE_SIGNATURE_PROFILE_OUTPUT"
          test -s "$HEPTA_INTELLIGENCE_HARD_KILL_OUTPUT"

      - name: Measure canonical real-owner latency CPU and RSS
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-qualification-target
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intelligence-qualification-host"
          filter=signed_evaluation_completes_existing_owner_preparation_and_run_admission
          timeout 180 "$AGENTD_TEST_BINARY" "$filter" --nocapture --test-threads=1 > "$root/warmup.log" 2>&1
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$root/warmup.log"
          printf 'sample,elapsed_seconds,user_cpu_seconds,system_cpu_seconds,max_rss_kib\n' > "$root/samples.csv"
          for sample in $(seq 1 9); do
            output="$root/sample-${sample}.log"
            timing="$root/sample-${sample}.time"
            python3 ../scripts/hepta-intelligence-measure-process.py \
              --sample "$sample" --timeout 180 --output "$output" --timing "$timing" \
              --metadata "$root/sample-${sample}-measurement.json" -- \
              "$AGENTD_TEST_BINARY" "$filter" --nocapture --test-threads=1
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$output"
            cat "$timing" >> "$root/samples.csv"
          done
          python3 - "$root" "$SOURCE_SHA" <<'PY'
          import csv, json, math, pathlib, statistics, sys
          root = pathlib.Path(sys.argv[1])
          rows = list(csv.DictReader((root / "samples.csv").open()))
          if [row["sample"] for row in rows] != [str(value) for value in range(1, 10)]:
              raise SystemExit("expected nine distinct ordered process samples")
          measurements = [
              json.loads((root / f"sample-{index}-measurement.json").read_text())
              for index in range(1, 10)
          ]
          for index, measurement in enumerate(measurements, 1):
              if (
                  measurement.get("schema") != "hepta.intelligence-control.process-measurement.v1"
                  or type(measurement.get("sample")) is not int
                  or measurement.get("sample") != index
                  or type(measurement.get("elapsedNanoseconds")) is not int
                  or measurement["elapsedNanoseconds"] <= 0
                  or measurement.get("timingMethod") != measurements[0]["timingMethod"]
              ):
                  raise SystemExit("inconsistent process measurement metadata")
          signature = json.loads((root / "signature-profile.json").read_text())
          hard_kill = json.loads((root / "hard-kill-profile.json").read_text())
          if signature.get("schema") != "hepta.intelligence-control.signature-profile.v1":
              raise SystemExit("unexpected signature profile schema")
          if hard_kill.get("schema") != "hepta.intelligence-control.hard-kill-profile.v1":
              raise SystemExit("unexpected hard-kill profile schema")
          for profile, expected in ((signature, 2000), (hard_kill, 9)):
              samples = profile.get("samplesNanos")
              if (
                  not isinstance(samples, list)
                  or len(samples) != expected
                  or any(type(value) is not int or value <= 0 for value in samples)
              ):
                  raise SystemExit("invalid or incomplete nanosecond profile")
          def distribution(values):
              values = sorted(values)
              if not values:
                  raise SystemExit("qualification distribution is empty")
              def percentile(value):
                  return values[max(0, math.ceil(value * len(values)) - 1)]
              return {
                  "p50": percentile(0.50),
                  "p95": percentile(0.95),
                  "p99": percentile(0.99),
                  "mean": statistics.fmean(values),
                  "maximum": max(values),
              }
          elapsed = [float(row["elapsed_seconds"]) for row in rows]
          user_cpu = [float(row["user_cpu_seconds"]) for row in rows]
          system_cpu = [float(row["system_cpu_seconds"]) for row in rows]
          rss = [int(row["max_rss_kib"]) for row in rows]
          if (
              any(not math.isfinite(value) or value <= 0 for value in elapsed)
              or any(not math.isfinite(value) or value < 0 for value in user_cpu + system_cpu)
              or any(value <= 0 for value in rss)
              or any(
                  abs(wall - measurement["elapsedNanoseconds"] / 1_000_000_000) > 1e-9
                  for wall, measurement in zip(elapsed, measurements)
              )
          ):
              raise SystemExit("invalid or mismatched process measurement")
          cpu_percent = [
              100.0 * (user + system) / wall
              for wall, user, system in zip(elapsed, user_cpu, system_cpu)
          ]
          signature_micros = [value / 1_000.0 for value in signature["samplesNanos"]]
          hard_kill_millis = [value / 1_000_000.0 for value in hard_kill["samplesNanos"]]
          result = {
              "schema": "hepta.intelligence-control.qualification-host.v2",
              "sourceCommit": sys.argv[2],
              "sampleCount": len(rows),
              "timingMethod": measurements[0]["timingMethod"],
              "elapsedSeconds": distribution(elapsed),
              "userCpuSeconds": distribution(user_cpu),
              "systemCpuSeconds": distribution(system_cpu),
              "processCpuPercent": distribution(cpu_percent),
              "maximumResidentSetKiB": distribution(rss),
              "strictSignatureVerificationMicros": distribution(signature_micros),
              "hardKillSpawnToExit70Millis": distribution(hard_kill_millis),
              "rawEvidence": {
                  "samplesCsv": "samples.csv",
                  "processMeasurements": [f"sample-{index}-measurement.json" for index in range(1, 10)],
                  "signatureProfile": "signature-profile.json",
                  "hardKillProfile": "hard-kill-profile.json",
              },
              "claimBoundary": {
                  "githubHostedQualificationHost": True,
                  "productionTargetHostAcceptance": False,
                  "modelQualityOrLongitudinalEfficacy": False,
                  "independentSemanticSecurityAcceptance": False,
                  "activationPromotionOrRelease": False,
              },
          }
          (root / "metrics.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Summarize qualification-host evidence
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/intelligence-qualification-host"
          {
            printf 'Source: `%s`\n\n' "$SOURCE_SHA"
            printf 'This is GitHub-hosted qualification-host evidence, not a production target-host acceptance receipt.\n\n'
            if test -f "$root/metrics.json"; then
              printf '```json\n'
              cat "$root/metrics.json"
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain raw qualification-host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-control-qualification-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intelligence-qualification-host/**
          if-no-files-found: error
          retention-days: 30
