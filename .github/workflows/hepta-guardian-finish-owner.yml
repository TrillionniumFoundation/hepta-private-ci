name: Guardian normal finish-owner regressions

on:
  pull_request:
    branches:
      - "agents/20261022/organ-owner-ci-convergence"
    paths:
      - "codex-rs/core/src/guardian/review_session.rs"
      - "codex-rs/core/src/guardian/review_session_completion_tests.rs"
      - ".github/workflows/hepta-guardian-finish-owner.yml"

permissions:
  contents: read

concurrency:
  group: guardian-finish-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  original-finish-owner:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agents/20261022/guardian-normal-finish-owner'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout the exact candidate without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install original Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev bubblewrap
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt,rust-src
      - name: Restore original dependency downloads
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: guardian-finish-owner-cargo-${{ matrix.target }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-dev-
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Configure original verified V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Require unchanged source and real loopback availability
        id: prepared
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check HEAD
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$RUNNER_TEMP/guardian-finish-owner"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/guardian-finish-owner/source.txt"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import socket
          config = Path("codex-rs/.config/nextest.toml").read_bytes()
          if hashlib.sha256(config).hexdigest() != "78b998d1fcb16dfef6b243a4b18748c1b28ce2d5a28d57f1f477adf0546e5ac6":
              raise SystemExit("original nextest local/JUnit configuration changed")
          if "CODEX_SANDBOX_NETWORK_DISABLED" in os.environ:
              raise SystemExit("original network skip condition is present; cannot qualify")
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              listener.listen(1)
              with socket.create_connection(listener.getsockname(), timeout=5) as client:
                  connection, _ = listener.accept()
                  with connection:
                      client.sendall(b"loopback")
                      if connection.recv(8) != b"loopback":
                          raise SystemExit("loopback preflight failed")
          PY
      - name: Run all three deterministic original finish-owner regressions
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          # Nextest 0.9.103: workspace_root / store.dir / profile / junit.path.
          # The original local profile inherits junit.xml; Cargo's target dir is separate.
          junit="$PWD/target/nextest/local/junit.xml"
          previous="$RUNNER_TEMP/guardian-finish-owner/finish-owner.previous.junit.xml"
          test ! -L "$junit"
          if [ -e "$junit" ]; then
            test -f "$junit"
            test ! -e "$previous"
            test ! -L "$previous"
            mv "$junit" "$previous"
          fi
          test ! -e "$junit"
          set +e
          just test --locked -p codex-core --lib -E 'test(guardian::review_session::completion_tests::)' --no-tests fail --retries 0 --success-output immediate 2>&1 | tee "$RUNNER_TEMP/guardian-finish-owner/finish-owner.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/guardian-finish-owner/finish-owner.exit"
          test -f "$junit"
          test ! -L "$junit"
          cp "$junit" "$RUNNER_TEMP/guardian-finish-owner/finish-owner.junit.xml"
          exit "$status"
      - name: Run original deadline, cancellation and turn-correlation regressions
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          # Nextest 0.9.103: workspace_root / store.dir / profile / junit.path.
          # The original local profile inherits junit.xml; Cargo's target dir is separate.
          junit="$PWD/target/nextest/local/junit.xml"
          previous="$RUNNER_TEMP/guardian-finish-owner/original-ordering.previous.junit.xml"
          test ! -L "$junit"
          if [ -e "$junit" ]; then
            test -f "$junit"
            test ! -e "$previous"
            test ! -L "$previous"
            mv "$junit" "$previous"
          fi
          test ! -e "$junit"
          set +e
          just test --locked -p codex-core --lib -E 'test(guardian::review_session::tests::wait_for_guardian_review_) | test(guardian::review_session::tests::run_before_review_deadline) | test(=guardian::review_session::tests::run_review_on_reused_session_waits_for_submitted_turn) | test(=guardian::review_session::tests::run_review_removes_trunk_when_event_stream_is_broken)' --no-tests fail --retries 0 --success-output immediate 2>&1 | tee "$RUNNER_TEMP/guardian-finish-owner/original-ordering.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/guardian-finish-owner/original-ordering.exit"
          test -f "$junit"
          test ! -L "$junit"
          cp "$junit" "$RUNNER_TEMP/guardian-finish-owner/original-ordering.junit.xml"
          exit "$status"
      - name: Run the original prompt-cache and persisted-reminder HTTP regression
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          # Nextest 0.9.103: workspace_root / store.dir / profile / junit.path.
          # The original local profile inherits junit.xml; Cargo's target dir is separate.
          junit="$PWD/target/nextest/local/junit.xml"
          previous="$RUNNER_TEMP/guardian-finish-owner/original-http.previous.junit.xml"
          test ! -L "$junit"
          if [ -e "$junit" ]; then
            test -f "$junit"
            test ! -e "$previous"
            test ! -L "$previous"
            mv "$junit" "$previous"
          fi
          test ! -e "$junit"
          set +e
          just test --locked -p codex-core --lib -E 'test(=guardian::tests::guardian_reuses_prompt_cache_key_and_appends_prior_reviews)' --no-tests fail --retries 0 --success-output immediate 2>&1 | tee "$RUNNER_TEMP/guardian-finish-owner/original-http.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/guardian-finish-owner/original-http.exit"
          test -f "$junit"
          test ! -L "$junit"
          cp "$junit" "$RUNNER_TEMP/guardian-finish-owner/original-http.junit.xml"
          exit "$status"
      - name: Require all 19 expected tests, no skips and immutable tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check HEAD
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ["RUNNER_TEMP"]) / "guardian-finish-owner"
          original_prefix = "guardian::review_session::tests::"
          completion_prefix = "guardian::review_session::completion_tests::"
          expected = {
              "finish-owner": {
                  completion_prefix + "normal_finish_owner_blocks_reuse_and_fork_before_followup_reminder",
                  completion_prefix + "cancel_after_turn_complete_does_not_reuse_or_retire_finish_owner",
                  completion_prefix + "expired_deadline_does_not_complete_or_retire_normal_finish_owner",
              },
              "original-ordering": {
                  original_prefix + "wait_for_guardian_review_ignores_prior_turn_completion",
                  original_prefix + "wait_for_guardian_review_ignores_prior_turn_errors",
                  original_prefix + "wait_for_guardian_review_preserves_structured_session_error",
                  original_prefix + "wait_for_guardian_review_ignores_prior_turn_aborts",
                  original_prefix + "wait_for_guardian_review_timeout_drains_expected_turn_after_stale_terminal_event",
                  original_prefix + "wait_for_guardian_review_cancel_drains_expected_turn_after_stale_terminal_event",
                  original_prefix + "run_before_review_deadline_times_out_before_future_completes",
                  original_prefix + "run_before_review_deadline_rejects_ready_result_after_deadline",
                  original_prefix + "run_before_review_deadline_aborts_before_polling_ready_result",
                  original_prefix + "run_before_review_deadline_aborts_when_cancelled",
                  original_prefix + "run_before_review_deadline_with_cancel_cancels_token_on_timeout",
                  original_prefix + "run_before_review_deadline_with_cancel_cancels_token_on_abort",
                  original_prefix + "run_before_review_deadline_with_cancel_preserves_token_on_success",
                  original_prefix + "run_review_on_reused_session_waits_for_submitted_turn",
                  original_prefix + "run_review_removes_trunk_when_event_stream_is_broken",
              },
              "original-http": {
                  "guardian::tests::guardian_reuses_prompt_cache_key_and_appends_prior_reviews",
              },
          }
          result = {"source_sha": os.environ["SOURCE_SHA"], "suites": {}}
          for suite, names in expected.items():
              if (root / f"{suite}.exit").read_text().strip() != "0":
                  raise SystemExit(f"{suite}: actual test command failed")
              cases = ET.parse(root / f"{suite}.junit.xml").findall(".//testcase")
              actual = [case.get("name") for case in cases]
              if len(actual) != len(names) or set(actual) != names:
                  raise SystemExit(f"{suite}: expected test selection was not executed exactly once")
              if any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped")):
                  raise SystemExit(f"{suite}: expected test did not pass")
              if "Skipping test" in (root / f"{suite}.log").read_text(errors="replace"):
                  raise SystemExit(f"{suite}: original test skipped internally")
              result["suites"][suite] = {"passed_tests": len(cases), "names": sorted(names)}
          (root / "verification.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PY
      - name: Retain actual source identity, tests and output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardian-finish-owner-${{ matrix.target }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guardian-finish-owner/
          if-no-files-found: error
          retention-days: 14
