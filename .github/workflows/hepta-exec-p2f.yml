name: Hepta Exec P2f original Evidence cold no-effect qualification

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-evidence/tests/exec_server_cold_p2f.rs'
      - 'codex-rs/hepta-evidence/src/execution_*'
      - 'codex-rs/hepta-contracts/src/exec_server_start_p2c*'
      - 'qualification/codex-exec-p2e/corpus.json'
      - 'qualification/codex-exec-p2f/**'
      - '.github/workflows/hepta-exec-p2f.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-exec-p2f-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-effect:
    name: Original Evidence and P2c cold denial (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout exact source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify frozen parent or exact prospective two-parent merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor c8b559d09141c331ca27096fda93a079d62677d9 HEAD
          if [ '${{ matrix.lane }}' = base-merge ]; then
            test -n "$BASE_SHA"
            tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            merge="$(printf '%s\n' 'P2f no-effect qualification only' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            test "$(git show -s --format=%P "$merge")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$merge"
            test "$(git rev-parse HEAD^{tree})" = "$tree"
          fi
          printf 'source=%s base=%s tested=%s tree=%s\n' "$SOURCE_SHA" "$BASE_SHA" \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          git diff --quiet
          git diff --cached --quiet

      - name: Original lock integrity and real Rust formatting
        run: |
          set -euo pipefail
          python3 scripts/verify_cargo_lock.py
          cd codex-rs
          rustc --version --verbose
          cargo fmt -p codex-hepta-evidence -p codex-hepta-contracts -- --check

      - name: Native original owner and read-only contract regressions
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-evidence -p codex-hepta-contracts --all-targets
          cargo test --locked -p codex-hepta-contracts --lib execution_contract_v1
          cargo test --locked -p codex-hepta-contracts --lib exec_server_start_p2c
          cargo test --locked -p codex-hepta-evidence --lib
          cargo test --locked -p codex-hepta-evidence --test exec_server_cold_p2f
          cargo clippy --locked -p codex-hepta-evidence -p codex-hepta-contracts --all-targets -- -D warnings

      - name: Exact source and generated-drift refusal
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet
          git diff --cached --quiet
