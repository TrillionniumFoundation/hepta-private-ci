name: Materialize learning.artifacts convergence candidate from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: materialize-learning-artifacts-convergence-pr
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/learning-artifacts-convergence-20260929' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Execute the reviewed static-source materialization and native gates
        env:
          TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          source = Path('.github/workflows/materialize-learning-artifacts-final-fixes.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          scripts: list[str] = []
          index = 0
          while index < len(lines):
              if lines[index] != '        run: |':
                  index += 1
                  continue
              index += 1
              body: list[str] = []
              while index < len(lines):
                  line = lines[index]
                  if line and not line.startswith('          '):
                      break
                  body.append(line[10:] if line.startswith('          ') else '')
                  index += 1
              scripts.append('\n'.join(body) + '\n')

          if len(scripts) != 2:
              raise SystemExit(f'expected exactly two materializer scripts, found {len(scripts)}')
          script = Path('/tmp/learning-artifacts-materialize-and-qualify.sh')
          script.write_text(scripts[0], encoding='utf-8')
          subprocess.run(['bash', str(script)], cwd='.', env=os.environ.copy(), check=True)
          PY
      - name: Commit and push the static source candidate
        env:
          TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/learning-artifacts-convergence-20260929
          test "$(git rev-parse FETCH_HEAD)" = "$TRIGGER_SHA"
          git config user.name 'learning.artifacts candidate materializer'
          git config user.email 'artifact-candidate@users.noreply.github.com'
          rm .github/workflows/materialize-learning-artifacts-final-fixes.yml
          rm .github/workflows/materialize-learning-artifacts-pr.yml
          git add -A
          git diff --cached --check
          git commit -m 'learning.artifacts: seal preflight-safe convergence candidate'
          git push origin HEAD:codex/learning-artifacts-convergence-20260929
