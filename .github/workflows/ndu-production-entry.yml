name: NDU production entry remediation and exact qualification
on:
  push:
    branches: [codex/utility-ndu-production-hardening-20260926]
    paths:
      - ".github/ndu-production-entry*"
      - ".github/workflows/ndu-production-entry.yml"
permissions:
  contents: read
concurrency:
  group: ndu-production-entry-remediation
  cancel-in-progress: true
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      source_tree: ${{ steps.publish.outputs.source_tree }}
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TARGET_BRANCH: codex/utility-ndu-production-hardening-20260926
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply digest-bound reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path, PurePosixPath
          manifest = json.loads(Path('.github/ndu-production-entry-manifest.json').read_text())
          assert manifest['schema'] == 'hepta.ndu.bounded-repair.v1'
          assert manifest['parts'] == [f'.github/ndu-production-entry.patch.xz.b64.{i}' for i in range(5)]
          encoded = ''.join(Path(path).read_text() for path in manifest['parts'])
          if len(encoded) != 25104:
              raise SystemExit('unexpected transport length')
          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != manifest['compressedBytes'] or hashlib.sha256(compressed).hexdigest() != manifest['compressedSha256']:
              raise SystemExit('compressed patch identity mismatch')
          decoder = lzma.LZMADecompressor(memlimit=64 * 1024 * 1024)
          patch = decoder.decompress(compressed, max_length=100001)
          if not decoder.eof or decoder.unused_data or len(patch) != manifest['patchBytes'] or hashlib.sha256(patch).hexdigest() != manifest['patchSha256']:
              raise SystemExit('bounded patch identity mismatch')
          paths = manifest['paths']
          if len(paths) != len(set(paths)) or any(PurePosixPath(p).is_absolute() or '..' in PurePosixPath(p).parts for p in paths):
              raise SystemExit('unsafe or duplicate reviewed source path')
          patch_path = Path(os.environ['RUNNER_TEMP']) / 'ndu-production-entry.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0'))
          if changed != set(paths):
              raise SystemExit('patch source inventory mismatch')
          PY
          (
            cd codex-rs
            cargo fmt --package codex-hepta-ndu --package codex-hepta-agentd --package codex-hepta-agent-protocol
          )
      - name: Register explicit evidence and commit a source candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from hepta_ndu_map_integrity import evidence_paths
          manifest = json.loads(Path('.github/ndu-production-entry-manifest.json').read_text())
          primary_path = Path('docs/modules/utility.ndu/IMPLEMENTATION_MAP.json')
          extension_path = Path('docs/modules/utility.ndu/IMPLEMENTATION_MAP_EXTENSIONS.json')
          primary = json.loads(primary_path.read_text())
          extension = json.loads(extension_path.read_text())
          previous_names = {op['operation'] for mapping in (primary, extension) for op in mapping['operations']}
          if any(op['operation'] in previous_names for op in manifest['operations']):
              raise SystemExit('duplicate operation during explicit registration')
          extension['operations'].extend(manifest['operations'])
          extension['supportingSources'] = sorted(set(extension['supportingSources']) | set(manifest['supportingSources']))
          extension_path.write_text(json.dumps(extension, indent=2) + '\n')
          subprocess.run(['git', 'add', '--', *manifest['paths'], str(extension_path)], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          paths = evidence_paths(Path.cwd(), primary, extension)
          if not {entry['path'] for entry in primary['sourceObjects']} <= paths:
              raise SystemExit('repair may not remove existing source evidence')
          primary['sourceObjects'] = [
              {'path': p, 'object': subprocess.check_output(['git', 'rev-parse', f'{tree}:{p}'], text=True).strip()}
              for p in sorted(paths)
          ]
          primary_path.write_text(json.dumps(primary, indent=2) + '\n')
          subprocess.run(['git', 'add', '--', str(primary_path)], check=True)
          allowed = set(manifest['paths']) | {str(primary_path), str(extension_path)}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')) - {''}
          if not changed or not changed <= allowed:
              raise SystemExit(f'unexpected staged changes: {sorted(changed - allowed)}')
          if subprocess.check_output(['git', 'diff', '--name-only']) or subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard']):
              raise SystemExit('unexpected unstaged or untracked changes')
          PY
          git diff --cached --check
          git config user.name hepta-qualification
          git config user.email qualification@invalid
          git commit -m 'fix(ndu): compose production trust and qualify real filesystem faults with bound restore policy'
          mkdir -p "$RUNNER_TEMP/ndu-production-entry"
          python3 scripts/test_hepta_ndu_qualification.py 2>&1 | tee "$RUNNER_TEMP/ndu-production-entry/qualification-tests.log"
          python3 scripts/test_hepta_ndu_map_integrity.py 2>&1 | tee "$RUNNER_TEMP/ndu-production-entry/map-tests.log"
          python3 scripts/test_hepta_ndu_mounted_filesystem.py 2>&1 | tee "$RUNNER_TEMP/ndu-production-entry/mounted-orchestrator-tests.log"
          python3 scripts/hepta-ndu-implementation-map-closed-world.py \
            --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})" \
            | tee "$RUNNER_TEMP/ndu-production-entry/closed-world.json"
      - name: Publish exact source without overwriting concurrent work
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Retain source and publication evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ndu-production-entry"
          mkdir -p "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/source-identity.txt"
          git status --porcelain > "$out/checkout-status.txt"
          git ls-remote origin "refs/heads/$TARGET_BRANCH" > "$out/published-ref.txt"
          git show --stat --format=fuller HEAD > "$out/commit.txt"
          git archive --format=tar.gz -o "$out/source.tar.gz" HEAD \
            codex-rs/hepta-ndu codex-rs/hepta-agentd codex-rs/hepta-agent-protocol \
            codex-rs/hepta-contracts codex-rs/hepta-control-plane codex-rs/hepta-types \
            codex-rs/hepta-intelligence codex-rs/hepta-intelligence-eval \
            codex-rs/hepta-learning-artifacts codex-rs/hepta-learning-ledger \
            codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/rust-toolchain.toml codex-rs/rustfmt.toml \
            scripts docs/modules docs/readiness/NDU_SYSTEM_EXECUTION.md docs/learning/NDU_FBSDE_SPEC.md justfile \
            .github/workflows/hepta-ndu-recursion.yml
          sha256sum "$out/source.tar.gz" > "$out/source.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ndu-production-entry-source-${{ github.sha }}
          path: ${{ runner.temp }}/ndu-production-entry
          if-no-files-found: error
          retention-days: 30
  qualify:
    needs: repair
    name: NDU exact published ${{ matrix.lane }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    env:
      SOURCE_SHA: ${{ needs.repair.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.repair.outputs.source_tree }}
      BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind published source or deterministic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Execute all six suites without failure short-circuit
        shell: bash
        run: |
          set -uo pipefail
          out='${{ runner.temp }}/ndu-exact-${{ matrix.lane }}'
          mkdir -p "$out"
          failed=0
          for suite in source core callers product lint host; do
            if python3 scripts/hepta-ndu-qualification.py --suite "$suite" \
              --lane '${{ matrix.lane }}' --output "$out/$suite"; then
              printf '%s %s\n' "$suite" 0 >> "$out/suite-exits.txt"
            else
              code=$?
              printf '%s %s\n' "$suite" "$code" >> "$out/suite-exits.txt"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ndu-exact-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ndu-exact-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 30
