name: Hepta memory retrieval reviewed runtime increment
on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
    paths:
      - scripts/hepta_memory_retrieval_ab_patch.py
      - .github/workflows/hepta-memory-retrieval-runtime-increment.yml
permissions:
  contents: read
concurrency:
  group: retrieval-native-binding-materialization-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
jobs:
  prepare:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Apply and format reviewed source without write credentials
        shell: bash
        env:
          PATCH_BLOB: 513364b640842394b8b0b22cb3f4a8068cfb1972
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git hash-object scripts/hepta_memory_retrieval_ab_patch.py)" = "$PATCH_BLOB"
          mkdir -p "$RUNNER_TEMP/retrieval-patch"
          python3 -m unittest discover -s scripts/tests -p 'test_hepta_memory_retrieval*.py'
          python3 scripts/hepta_memory_retrieval_ab_patch.py apply
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff HEAD --check
          python3 scripts/hepta_memory_retrieval_ab_patch.py manifest "$RUNNER_TEMP/retrieval-patch/changes.json"
          git diff HEAD --full-index > "$RUNNER_TEMP/retrieval-patch/source.patch"
          rustc -Vv > "$RUNNER_TEMP/retrieval-patch/rustc.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrieval-native-binding-data-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-patch/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve pinned formatter dependencies for offline reproduction
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/retrieval-formatter"
          mkdir -p "$out"
          formatter="$(rustup which --toolchain 1.95.0 rustfmt)"
          cp "$formatter" "$out/rustfmt"
          for library in "$(dirname "$formatter")"/../lib/librustc_driver* "$(dirname "$formatter")"/../lib/libLLVM*; do
            if test -f "$library"; then cp -L "$library" "$out/"; fi
          done
          (cd "$out"; sha256sum rustfmt lib* > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrieval-complete-formatter-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-formatter/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: prepare
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      # No checkout, candidate code, shell fragments from artifacts, package
      # manager or cache in this write-scoped job. Rust contents remain data.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: retrieval-native-binding-data-${{ github.run_id }}
          path: ${{ runner.temp }}/source-data
      - name: Publish exact data with preimage and unchanged-parent checks
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path
          REPO = "TrillionniumFoundation/hepta-private-ci"
          BRANCH = "work/memory-retrieval-hardening-20260927"
          ROOT = "codex-rs/hepta-agentd/src/"
          ALLOWED = {ROOT + name for name in (
              "cognitive_context.rs", "cognitive_retrieval_bootstrap.rs",
              "cognitive_retrieval_context.rs", "cognitive_retrieval_learning.rs",
              "cognitive_retrieval_learning_tests.rs", "cognitive_retrieval_provider_core.rs",
              "cognitive_retrieval_provider_tests.rs", "cognitive_retrieval_transport.rs",
              "cognitive_retrieval_transport_tests.rs", "retrieval_delivery.rs",
              "retrieval_delivery_tests.rs", "retrieval_executor.rs", "retrieval_executor_tests.rs")}
          ALLOWED.add("codex-rs/hepta-learning-ledger/src/retrieval_preparation.rs")
          path = Path(os.environ["RUNNER_TEMP"]) / "source-data" / "changes.json"
          if path.is_symlink() or not path.is_file() or not 0 < path.stat().st_size <= 2_000_000:
              raise SystemExit("invalid source-data size or type")
          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result: raise SystemExit("duplicate source-data key")
                  result[key] = value
              return result
          data = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=pairs)
          if not isinstance(data, dict) or set(data) != {"base", "patch_blob", "changes"}:
              raise SystemExit("source-data shape mismatch")
          if data["patch_blob"] != "513364b640842394b8b0b22cb3f4a8068cfb1972":
              raise SystemExit("unexpected reviewed source transform")
          base = os.environ["EXPECTED_BASE"]
          if not re.fullmatch(r"[0-9a-f]{40}", base) or data["base"] != base:
              raise SystemExit("source identity mismatch")
          entries = data["changes"]
          if not isinstance(entries, list) or len(entries) != len(ALLOWED):
              raise SystemExit("invalid source-data entry count")
          if any(not isinstance(entry, dict) for entry in entries):
              raise SystemExit("invalid source-data entry")
          if {entry.get("path") for entry in entries} != ALLOWED:
              raise SystemExit("source path outside exact allowlist")
          for entry in entries:
              if set(entry) != {"path", "before", "after", "content"}:
                  raise SystemExit("unexpected source-data fields")
              if not isinstance(entry["content"], str) or len(entry["content"].encode("utf-8")) > 500_000:
                  raise SystemExit("source content exceeds bound")
              if not isinstance(entry["before"], str) or not re.fullmatch(r"[0-9a-f]{40}", entry["before"]):
                  raise SystemExit("invalid preimage identity")
              raw = entry["content"].encode("utf-8")
              if entry["after"] != hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest():
                  raise SystemExit("postimage differs from generated source")
          def api(method, endpoint, payload=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + endpoint,
                  data=None if payload is None else json.dumps(payload).encode(), method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          ref = "/git/ref/heads/" + urllib.parse.quote(BRANCH, safe="/")
          if api("GET", ref)["object"]["sha"] != base:
              raise SystemExit("branch advanced: refusing to overwrite concurrent work")
          for entry in entries:
              existing = api("GET", "/contents/" + entry["path"] + "?ref=" + base)
              if existing.get("type") != "file" or existing.get("sha") != entry["before"]:
                  raise SystemExit("preimage changed: " + entry["path"])
          parent = api("GET", "/git/commits/" + base)
          tree = api("POST", "/git/trees", {"base_tree": parent["tree"]["sha"], "tree": [
              {"path": entry["path"], "mode": "100644", "type": "blob", "content": entry["content"]}
              for entry in entries]})
          commit = api("POST", "/git/commits", {
              "message": "fix(memory.retrieval): bind prepared facts to native owners and propagate request deadlines\n\nSeparate tag-10 preparation from publication/start/outcome, validate native identity and ordered candidates, reconcile durable owners, and bound frontier I/O by the request deadline. Add worker-exit diagnostics and regressions. No target-host or independent acceptance claim.",
              "tree": tree["sha"], "parents": [base]})
          api("PATCH", "/git/refs/heads/" + urllib.parse.quote(BRANCH, safe="/"), {"sha": commit["sha"], "force": False})
          if api("GET", ref)["object"]["sha"] != commit["sha"]:
              raise SystemExit("post-publication ref changed; inspect before qualification")
          print("PUBLISHED_SOURCE_SHA=" + commit["sha"])
          print("PUBLISHED_TREE_SHA=" + tree["sha"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("source_sha=" + commit["sha"] + "\n")
          PY
  qualify:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      TESTED_SHA: ${{ needs.publish.outputs.source_sha }}
      HEPTA_CI_LANE: source-head
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Execute actual core tests and strict Clippy on published source
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/retrieval-native"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || exit 1
          git show -s --format='%H%n%T%n%P' HEAD > "$out/identity.txt"
          rustc -Vv > "$out/rustc.txt"
          failed=0
          for package in codex-hepta-memory-retrieval codex-hepta-learning-ledger codex-hepta-infer-core; do
            python3 scripts/hepta_ci_exec.py --output "$out/$package-tests.json" --minimum-tests 1 --timeout-seconds 1800 -- just test --locked -p "$package" --all-targets || failed=1
          done
          python3 scripts/hepta_ci_exec.py --output "$out/clippy.json" --timeout-seconds 1200 -- cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-memory-retrieval -p codex-hepta-learning-ledger -p codex-hepta-infer-core --all-targets -- -D warnings || failed=1
          python3 scripts/hepta_ci_exec.py --output "$out/format.json" --timeout-seconds 120 -- cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check || failed=1
          test -z "$(git status --porcelain --untracked-files=all)" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-binding-tests-${{ needs.publish.outputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-native/
          retention-days: 30
          if-no-files-found: error
