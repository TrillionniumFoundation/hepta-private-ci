name: Kernel evidence one-shot native maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: kernel-evidence-one-shot-native-maintenance
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/kernel-evidence-production-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
      EXPECTED_PARENT: 5b943dec177f384551b853e7aa7a41482a85221e
      TARGET_BRANCH: fix/kernel-evidence-production-closure
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Admit only the explicitly authorized one-shot source
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          if test "$(git rev-parse HEAD^)" != "$EXPECTED_PARENT"; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log -1 --format=%B | grep -Fq '[kernel-evidence-native-maintenance]'
          echo 'apply=true' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        if: steps.admit.outputs.apply == 'true'
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Refresh workspace lock metadata without upgrading external pins
        if: steps.admit.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kernel-evidence-maintenance"
          mkdir -p "$output"
          git rev-parse HEAD HEAD^{tree} > "$output/source.txt"
          cp codex-rs/Cargo.lock "$output/Cargo.lock.before"
          cargo update --manifest-path codex-rs/Cargo.toml --workspace 2>&1 | tee "$output/lock-update.log"
          python3 - "$output/Cargo.lock.before" <<'PY'
          import sys, tomllib
          from pathlib import Path
          def external_pins(path):
              with Path(path).open('rb') as stream:
                  packages = tomllib.load(stream)['package']
              return {(p['name'], p['version'], p['source'], p.get('checksum'))
                      for p in packages if 'source' in p}
          before = external_pins(sys.argv[1])
          after = external_pins('codex-rs/Cargo.lock')
          if before != after:
              raise SystemExit(f'external pin change requires review: removed={before-after!r}; added={after-before!r}')
          PY
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 --no-deps > "$output/metadata.json"
      - name: Apply native formatting only within the evidence integration scope
        if: steps.admit.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kernel-evidence-maintenance"
          cargo fmt --manifest-path codex-rs/Cargo.toml --all 2>&1 | tee "$output/format.log"
          python3 - <<'PY'
          import subprocess
          allowed_roots = ('codex-rs/hepta-evidence/', 'codex-rs/hepta-agentd/', 'codex-rs/hepta-agent-protocol/')
          allowed_files = {'codex-rs/Cargo.lock', 'codex-rs/state/src/lib.rs', 'codex-rs/state/src/sqlite_evidence_runtime.rs'}
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, changed):
              if path in allowed_files or (path.startswith(allowed_roots) and path.endswith('.rs')):
                  continue
              subprocess.run(['git', 'restore', '--', path], check=True)
          PY
          git diff --check
          git diff --binary > "$output/changes.patch"
          git diff --stat > "$output/changes.stat"
          git status --porcelain > "$output/working-tree.txt"
      - name: Commit exact native output with fast-forward fencing
        if: steps.admit.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kernel-evidence-maintenance"
          if git diff --quiet; then
            git rev-parse HEAD > "$output/result-commit.txt"
            exit 0
          fi
          git fetch origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- codex-rs/Cargo.lock codex-rs/hepta-evidence codex-rs/hepta-agentd codex-rs/hepta-agent-protocol codex-rs/state/src/lib.rs codex-rs/state/src/sqlite_evidence_runtime.rs
          git commit -s -m 'fix(kernel.evidence): commit native formatting and workspace lock metadata [kernel-evidence-closure] [kernel-evidence-status-sync]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree} > "$output/result-commit.txt"
          printf '%s\n' 'Native formatting and lock metadata only. No tests, qualification, deployment, acceptance or release are claimed.' > "$output/SCOPE.txt"
      - name: Retain exact maintenance output even on failure
        if: always() && steps.admit.outputs.apply == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-evidence-one-shot-maintenance-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-evidence-maintenance/
          if-no-files-found: error
          retention-days: 14
