# Materialize the digest-pinned final-hardening patch after strict native repair.
name: Apply secrets.heptabao final hardening v2

on:
  push:
    branches:
      - codex/secrets-heptabao-final-hardening-20260928
    paths:
      - ".github/workflows/hepta-bootstrap-apply-secrets-final-hardening-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-bootstrap-secrets-final-hardening-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact-base hardening source
        shell: bash
        run: |
          set -euo pipefail
          base="074de71f0feb032cc1b61c49da1aa0a8af00ea86"
          shopt -s nullglob
          parts=(.hepta-bootstrap/secrets-final-hardening/part-*)
          test "${#parts[@]}" -eq 8
          bundle="$RUNNER_TEMP/secrets-final-hardening.patch.gz.b64"
          patch="$RUNNER_TEMP/secrets-final-hardening.patch"
          fixup_bundle=".hepta-bootstrap/secrets-final-hardening/fixup-v2.patch.gz.b64"
          fixup="$RUNNER_TEMP/secrets-final-hardening-fixup-v2.patch"
          source_root="$RUNNER_TEMP/secrets-final-source"
          changed="$RUNNER_TEMP/secrets-final-paths.txt"
          cat "${parts[@]}" > "$bundle"
          git merge-base --is-ancestor "$base" HEAD
          echo "565ccaad2b2aa61b8d18c4fea808046fa75afe10fe4ccdafff5ead902e876360  $bundle" | sha256sum -c -
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          echo "367195ea3bfc989ff4b6331e4a07720c9c4e0d3d77123c0419f41efeec209114  $patch" | sha256sum -c -
          echo "bf96aeca6b1f4e11cdb96ebf182ebf7d91f4ec3b336dc932e2479229a140fc68  $fixup_bundle" | sha256sum -c -
          base64 --decode "$fixup_bundle" | gzip --decompress > "$fixup"
          echo "7b256cbc822082e4466387121a0ac8be465a0e5c233fb73aebab62bf26f3944e  $fixup" | sha256sum -c -

          git worktree add --detach "$source_root" "$base"
          git -C "$source_root" apply --check --index "$patch"
          git -C "$source_root" apply --index "$patch"
          git -C "$source_root" apply --check --index "$fixup"
          git -C "$source_root" apply --index "$fixup"
          git -C "$source_root" diff --cached --check
          git -C "$source_root" diff --cached --name-only --diff-filter=ACMRTUXB > "$changed"
          test "$(wc -l < "$changed")" -eq 26
          test -z "$(git -C "$source_root" diff --cached --name-only --diff-filter=D)"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/hepta-secrets-recovery.yml|codex-rs/hepta-bao-adapter/*|docs/modules/secrets.heptabao/*|docs/lane-a-foundation/secrets.heptabao/*|docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json|scripts/generate_secrets_heptabao_module.py)
                ;;
              *)
                echo "final-hardening source touches unapproved path: $path" >&2
                exit 1
                ;;
            esac
            mkdir -p "$(dirname "$path")"
            cp -a "$source_root/$path" "$path"
          done < "$changed"
          git worktree remove --force "$source_root"
          git diff --check
          git status --short > "$RUNNER_TEMP/applied-status.txt"

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify projections and non-native regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py
          python3 -m unittest discover -s codex-rs/hepta-bao-adapter/qa -p 'test_*.py' -v

      - name: Format and execute native qualification
        shell: bash
        run: |
          set -euo pipefail
          {
            cd codex-rs
            cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
            cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- --test-threads=2
            cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- -D warnings
            cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2
            cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2
          } 2>&1 | tee "$RUNNER_TEMP/native-qualification.log"

      - name: Reverify generated truth after formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py
          git diff --check

      - name: Retain qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-final-hardening-v2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-qualification.log
            ${{ runner.temp }}/applied-status.txt
            ${{ runner.temp }}/secrets-final-paths.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Commit qualified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hepta-bootstrap/secrets-final-hardening
          rm -f .github/workflows/hepta-bootstrap-apply-secrets-final-hardening.yml
          rm -f .github/workflows/hepta-bootstrap-apply-secrets-final-hardening-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta secrets hardening bot"
          git config user.email "hepta-secrets-hardening@users.noreply.github.com"
          git commit -m "secrets: harden phases migration capacity and diagnostics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
