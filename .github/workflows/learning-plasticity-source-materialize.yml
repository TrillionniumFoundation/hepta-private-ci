name: One-shot learning plasticity source materializer

on:
  push:
    branches:
      - feat/learning-plasticity-product-closure-20260928
    paths:
      - ".github/workflows/learning-plasticity-source-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-plasticity-source-materialize-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  materialize:
    name: Materialize reviewed runtime closure into normal source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact candidate and authenticate every reviewed part
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object scripts/.learning_plasticity_runtime_materializer.part00)" = "0a3e77db906b659595d28bfaf3d61764365df928"
          test "$(git hash-object scripts/.learning_plasticity_runtime_materializer.part01)" = "a36d920b0e85769b92ff275d9fe01477d2459ede"
          test "$(git hash-object scripts/.learning_plasticity_runtime_materializer.part02)" = "2c86ef886003b445b7662fcb6ed38cf2bb52be24"
          test "$(git hash-object scripts/.learning_plasticity_runtime_materializer.part03)" = "b518613b3449d8ede3b37c584ffee9bf5d09e4ed"
          test "$(git hash-object scripts/.learning_plasticity_runtime_materializer.part04)" = "d1f3cf81123598219e8c439b4e532ac73bdccc78"
          test "$(git hash-object scripts/.learning_plasticity_runtime_materializer.part05)" = "fbc5941c6d3ba44299b724bcdbb4742ce2403775"
          cat scripts/.learning_plasticity_runtime_materializer.part{00..05} \
            > scripts/materialize_learning_plasticity_runtime_closure.py
          python3 -m py_compile scripts/materialize_learning_plasticity_runtime_closure.py

      - name: Materialize exact source, recovery contract, and qualification driver
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_learning_plasticity_runtime_closure.py
          test "$(sha256sum codex-rs/hepta-agentd/src/plasticity_runtime.rs | awk '{print $1}')" = \
            "8bb9e10d29181dc0eaa97a1f805eba13e3aead92b1217bf7d59c063efd13f29b"
          test "$(sha256sum docs/modules/learning.plasticity/RUNTIME_RESOURCE_RECOVERY.md | awk '{print $1}')" = \
            "d3f591894eb9570f91ee03b98cc0b81b8373aad892c988f4cccfa496af514970"
          test "$(sha256sum scripts/qualify_learning_plasticity.py | awk '{print $1}')" = \
            "eac4db744a4d95990e824d9c46bac386b3aebdc8aa79f23aac392809acb96685"
          python3 -m py_compile scripts/qualify_learning_plasticity.py
          python3 scripts/test_learning_plasticity_grammar_contract.py

      - name: Format and compile the authored Agentd source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml --package codex-hepta-agentd
          cargo fmt --manifest-path Cargo.toml --package codex-hepta-agentd -- --check
          cargo check --locked --all-targets -p codex-hepta-agentd

      - name: Exercise resource, lifecycle, replay, and process recovery regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd --lib \
            plasticity_runtime::tests -- --test-threads=1
          cargo test --locked -p codex-hepta-agentd --lib \
            agentd_lifetime_owner_submits_restarts_and_reconciles_idempotently \
            -- --test-threads=1
          cargo test --locked -p codex-hepta-agentd \
            --test plasticity_process_e2e -- --test-threads=1

      - name: Enforce strict Agentd lint
        working-directory: codex-rs
        run: cargo clippy --locked --all-targets -p codex-hepta-agentd -- -D warnings

      - name: Publish normal source and remove every authoring-only path
        shell: bash
        run: |
          set -euo pipefail
          git show 4325a520da597972aa5930ec1293882bd62d904c:.github/workflows/learning-plasticity-exact-qualification.yml \
            > .github/workflows/learning-plasticity-exact-qualification.yml
          rm -f scripts/materialize_learning_plasticity_runtime_closure.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm scripts/.learning_plasticity_runtime_materializer.part{00..05}
          git rm .github/workflows/learning-plasticity-runtime-materialize.yml
          git rm .github/workflows/learning-plasticity-source-materialize.yml
          git add \
            .github/workflows/learning-plasticity-exact-qualification.yml \
            codex-rs/hepta-agentd/src/plasticity_runtime.rs \
            docs/modules/learning.plasticity/RUNTIME_RESOURCE_RECOVERY.md \
            docs/modules/learning.plasticity/DEVELOPER_QUICKSTART.md \
            scripts/qualify_learning_plasticity.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(plasticity): bound runtime resources and lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
