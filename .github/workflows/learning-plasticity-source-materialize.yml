name: One-shot learning plasticity source materializer

on:
  push:
    branches:
      - feat/learning-plasticity-product-closure-20260928
    paths:
      - ".github/workflows/learning-plasticity-source-materialize.yml"

permissions:
  contents: write

concurrency:
  group: learning-plasticity-source-materialize-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  materialize:
    name: Materialize and qualify P0 closure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Authenticate and extract reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat .authoring/learning-plasticity-p0.tar.gz.b64.part{00..02} \
            > /tmp/learning-plasticity-p0.tar.gz.b64
          test "$(sha256sum /tmp/learning-plasticity-p0.tar.gz.b64 | cut -d' ' -f1)" = \
            "83f5b4b50b24a8c61156c63baec1c9cbc04e404e44642ebd47e48ee2ab1675b6"
          base64 --decode /tmp/learning-plasticity-p0.tar.gz.b64 \
            > /tmp/learning-plasticity-p0.tar.gz
          test "$(sha256sum /tmp/learning-plasticity-p0.tar.gz | cut -d' ' -f1)" = \
            "2a5478e206eff0834eec4131717635183e29f30729a5b129ea4774c56cbe0b0d"
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/learning-plasticity-p0.tar.gz')
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
          PY
          tar --no-same-owner --no-same-permissions -xzf \
            /tmp/learning-plasticity-p0.tar.gz -C .
          sha256sum -c <<'EOF'
          2104dc357151bf41b5a87515966d6e19474d6b79ad62d24de4e3910c285c0034  codex-rs/hepta-agentd/Cargo.toml
          c048a80ffa880947b2e837bc9894db72adb86e6a9cd33958adbd6589b1ab6d12  codex-rs/hepta-agentd/src/plasticity_coordination.rs
          61892d34b0215f0fcc45c4f2f614c778932aa623b8f6af1003b09a905a89807a  codex-rs/hepta-agentd/src/plasticity_iteration_coordinator.rs
          fcae76680705c58d89d557eb02119c36d34b78a57e9f4e8e5a5f9eab2a037c15  codex-rs/hepta-agentd/src/plasticity_storage_security.rs
          863fd99269534e5793c49c0f00a8242c7c0a816b112d51be06cf2da83d2c2d34  codex-rs/hepta-agentd/src/plasticity_topology_iteration_coordinator.rs
          cc40a473c1ae4f21bfd888f14c00778ba28253e4849dfed6c97e3e8227674f9f  codex-rs/hepta-plasticity/src/generator_coverage_v1.rs
          a0a0f0a7df553f4d689b7acbeb5d1218a92a385f94dd4b282529069e650b61f6  codex-rs/hepta-plasticity/src/lib.rs
          3d7137733cca25cb9ac8eec1fbe79f0717775ff0d6b29e590cc165a61109c9fe  codex-rs/hepta-plasticity/src/topology_coverage_v1.rs
          EOF

      - name: Format and compile exact source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-agentd
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-agentd -- --check
          cargo check --locked --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-agentd

      - name: Exercise coverage, coordination and storage regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-plasticity --lib -- --test-threads=1
          cargo test --locked -p codex-hepta-agentd --lib plasticity_ -- --test-threads=1

      - name: Enforce strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --no-deps --all-targets \
            -p codex-hepta-plasticity \
            -p codex-hepta-agentd -- -D warnings

      - name: Commit and push ordinary source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .authoring/learning-plasticity-p0.tar.gz.b64.part00 \
            .authoring/learning-plasticity-p0.tar.gz.b64.part01 \
            .authoring/learning-plasticity-p0.tar.gz.b64.part02 \
            .github/workflows/learning-plasticity-p0-materialize.yml \
            .github/workflows/learning-plasticity-source-materialize.yml \
            /tmp/learning-plasticity-p0.tar.gz.b64 \
            /tmp/learning-plasticity-p0.tar.gz
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "fix(plasticity): close coverage and coordinator P0 gaps"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git push origin "HEAD:${TARGET_BRANCH}"

# Direct remediation trigger: materialize reviewed source and remove this one-shot workflow.
