name: MemoryCell pairwise-source Shadow Head
on:
  push:
    branches:
      - "codex/memory-cell-evidence-20261008"
    paths:
      - "scripts/memory_cell/stem_pairwise_shadow.py"
      - "scripts/memory_cell/test_stem_pairwise_shadow.py"
      - "scripts/memory_cell/stem_native_pairwise_shadow.py"
      - "scripts/memory_cell/test_stem_native_pairwise_shadow.py"
      - "scripts/memory_cell/stem_native_matched_objectives.py"
      - "scripts/memory_cell/test_stem_native_matched_objectives.py"
      - ".github/workflows/hepta-memory-stem-pairwise-shadow.yml"
permissions:
  contents: read
concurrency:
  group: stem-pairwise-source-${{ github.sha }}
  cancel-in-progress: false
jobs:
  bounded-research-shadow:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact CPU-only PyTorch and static verifier
        run: |
          set -euo pipefail
          python3 -m venv /tmp/stem-pairwise-env
          /tmp/stem-pairwise-env/bin/pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/stem-pairwise-env/bin/pip install --disable-pip-version-check ruff==0.15.8
          mkdir -p /tmp/stem-pairwise-receipt
          /tmp/stem-pairwise-env/bin/pip freeze > /tmp/stem-pairwise-receipt/environment.txt
      - name: Native Head mechanics without model downloads or eval gold
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/stem-pairwise-receipt/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/stem-pairwise-receipt/tested-tree.txt
          /tmp/stem-pairwise-env/bin/python -m unittest -v test_stem_pairwise_shadow test_stem_native_pairwise_shadow test_stem_native_matched_objectives 2>&1 | tee /tmp/stem-pairwise-receipt/tests.log
          /tmp/stem-pairwise-env/bin/python -m compileall -q scripts/memory_cell/stem_pairwise_shadow.py scripts/memory_cell/test_stem_pairwise_shadow.py scripts/memory_cell/stem_native_pairwise_shadow.py scripts/memory_cell/test_stem_native_pairwise_shadow.py scripts/memory_cell/stem_native_matched_objectives.py scripts/memory_cell/test_stem_native_matched_objectives.py
          /tmp/stem-pairwise-env/bin/ruff check --select F,E9 scripts/memory_cell/stem_pairwise_shadow.py scripts/memory_cell/test_stem_pairwise_shadow.py scripts/memory_cell/stem_native_pairwise_shadow.py scripts/memory_cell/test_stem_native_pairwise_shadow.py scripts/memory_cell/stem_native_matched_objectives.py scripts/memory_cell/test_stem_native_matched_objectives.py 2>&1 | tee /tmp/stem-pairwise-receipt/lint.log
      - name: Retain source, every failing log, and file checksums
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/stem-pairwise-receipt/source
          cp scripts/memory_cell/stem_pairwise_shadow.py scripts/memory_cell/test_stem_pairwise_shadow.py /tmp/stem-pairwise-receipt/source/
          cp scripts/memory_cell/stem_native_pairwise_shadow.py scripts/memory_cell/test_stem_native_pairwise_shadow.py /tmp/stem-pairwise-receipt/source/
          cp scripts/memory_cell/stem_native_matched_objectives.py scripts/memory_cell/test_stem_native_matched_objectives.py /tmp/stem-pairwise-receipt/source/
          cp .github/workflows/hepta-memory-stem-pairwise-shadow.yml /tmp/stem-pairwise-receipt/source/
          (cd /tmp/stem-pairwise-receipt && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-stem-pairwise-shadow-contract
          path: /tmp/stem-pairwise-receipt
          if-no-files-found: error
