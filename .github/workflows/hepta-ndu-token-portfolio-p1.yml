name: Hepta NDU Merton P1 research contracts
on:
  pull_request:
    paths:
      - 'experiments/ndu_tree_fbsde_gates/merton/token_portfolio_p1/**'
      - '.github/workflows/hepta-ndu-token-portfolio-p1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python contract tests, normal
        run: |
          python3 -W error::ResourceWarning -m unittest discover -s experiments/ndu_tree_fbsde_gates/merton/token_portfolio_p1 -p 'test_*.py' -v
      - name: Python contract tests, optimized
        run: |
          python3 -O -W error::ResourceWarning -m unittest discover -s experiments/ndu_tree_fbsde_gates/merton/token_portfolio_p1 -p 'test_*.py' -v
      - name: Compile source
        run: |
          python3 -m compileall -q experiments/ndu_tree_fbsde_gates/merton/token_portfolio_p1
