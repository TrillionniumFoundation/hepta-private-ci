name: Hepta automation.taskflow convergence

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/apply_automation_taskflow_convergence_20260925.py
      - .github/workflows/hepta-automation-taskflow-convergence.yml

permissions:
  contents: write

concurrency:
  group: automation-taskflow-convergence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[automation-taskflow-materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out current canonical candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref_name }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Materialize bounded owner changes
        run: python3 scripts/apply_automation_taskflow_convergence_20260925.py

      - name: Format and verify the exact diff
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-automation \
            --package codex-hepta-agentd
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-automation \
            --package codex-hepta-agentd \
            -- --check
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Run focused negative regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-automation \
            v1_store_migrates_atomically_to_dispatch_outcome_schema
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-automation \
            durable_recovery_cursor_rotates_past_a_long_running_occurrence
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-automation \
            exact_pending_lookup_is_not_limited_by_the_discovery_page
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-automation \
            exhausted_version_space_rejects_same_version_successor

      - name: Run complete affected owner suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-automation \
            --features taskflow-structural-qualification
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-agentd --lib

      - name: Run strict lint
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-automation \
            -p codex-hepta-agentd \
            --all-targets \
            --features codex-hepta-automation/taskflow-structural-qualification \
            -- -D warnings

      - name: Run TaskFlow Bazel qualification
        shell: bash
        run: |
          set -euo pipefail
          bazel test --test_output=errors \
            //codex-rs/hepta-automation:hepta-automation-taskflow-kernel-qualification-test \
            //codex-rs/hepta-automation:hepta-automation-taskflow-step-qualification-test

      - name: Commit the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_automation_taskflow_convergence_20260925.py
          rm -f .github/workflows/hepta-automation-taskflow-convergence.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name 'Hepta Convergence Bot'
          git config user.email 'hepta-convergence@users.noreply.github.com'
          git commit -m 'fix(automation.taskflow): make recovery fair and migrations real [automation-taskflow-materialized]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
