name: intuition-policy-core-bootstrap

on:
  push:
    branches:
      - codex/intuition-policy-production-closure-20260926
    paths:
      - .github/workflows/intuition-policy-core-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intuition-policy-core-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize and apply contract patch
        shell: bash
        run: |
          cat <<'PATCH_B64' | base64 --decode | gzip --decompress > /tmp/apply_intuition_core.py
          
          PATCH_B64
          python /tmp/apply_intuition_core.py
      - name: Format current intuition owners
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-intuition -p codex-hepta-intelligence
      - name: Check current intuition owners
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-intuition -p codex-hepta-intelligence --all-targets
      - name: Test intuition policy
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-intuition
      - name: Test authenticated intuition consumer
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-intelligence intuition_qualification
      - name: Strict clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-intuition -p codex-hepta-intelligence --all-targets -- -D warnings
      - name: Commit qualified core closure
        shell: bash
        run: |
          rm .github/workflows/intuition-policy-core-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(intuition): separate current policy commitments"
          git push origin HEAD:${GITHUB_REF_NAME}
