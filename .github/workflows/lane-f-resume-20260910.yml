name: Lane F re-entrant closure runner

on:
  push:
    branches: [codex/lane-f-gap-closure-20260910]
    paths: [.github/workflows/lane-f-resume-20260910.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lane-f-reentrant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize bootstrap payload when present
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.lane-f-bootstrap/part-*' >/dev/null; then
            cat .lane-f-bootstrap/part-* > /tmp/lane-f-overlay.tar.gz
            echo 'a5743f201c82118e390fff7128f9304ccae82f1c33fdc2d41c7349d7a266d2bc  /tmp/lane-f-overlay.tar.gz' | sha256sum -c -
            tar -xzf /tmp/lane-f-overlay.tar.gz -C .
            python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/hepta-prompt-optimizer/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'pub mod local_shadow;\n'
          addition = '''pub mod local_shadow;
pub use local_shadow::calculate_local_shadow as calculate_shadow_portfolio_v2;

/// Compatibility-only original portfolio profile.
pub const PROMPT_PORTFOLIO_LEGACY_V1_PROFILE: &str = "hepta.prompt-portfolio.legacy-v1";
/// Bounded interaction-aware shadow profile.
pub const PROMPT_PORTFOLIO_SHADOW_V2_PROFILE: &str = "hepta.prompt-portfolio.shadow-v2";
'''
          if 'PROMPT_PORTFOLIO_SHADOW_V2_PROFILE' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('unexpected prompt optimizer module marker')
              text = text.replace(marker, addition, 1)
          legacy = 'pub fn optimize(mut request: OptimizationRequest)'
          if 'Compatibility-only legacy V1 optimizer' not in text:
              text = text.replace(legacy, '/// Compatibility-only legacy V1 optimizer. New shadow composition uses [`calculate_shadow_portfolio_v2`].\n' + legacy, 1)
          path.write_text(text, encoding='utf-8')
          PY
            python3 scripts/hepta-lane-f.py generate
            python3 scripts/hepta_module_doc_metadata.py --write
            python3 scripts/hepta-docs.py generate-status
            cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-neuron --package codex-hepta-intuition --package codex-hepta-prompt-optimizer --package codex-hepta-plasticity --package codex-hepta-intelligence
            (cd codex-rs && cargo test -p codex-hepta-intelligence --all-targets --no-run)
          fi
      - name: Commit ordinary source candidate and remove bootstrap controls
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lane-f-bootstrap
          rm -f .github/workflows/lane-f-bootstrap.yml .github/workflows/lane-f-resume.yml .github/workflows/lane-f-resume-20260910.yml
          git config user.name hepta-lane-f-bot
          git config user.email hepta-lane-f-bot@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'feat(lane-f): close adaptive-policy source and documentation gaps'
          fi
      - name: Validate Lane F exact candidate before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-f.py self-test
          python3 -m unittest scripts/test_hepta_lane_f.py
          python3 scripts/hepta-lane-f.py generate --check
          python3 scripts/hepta_module_doc_metadata.py
          python3 scripts/hepta-lane-f.py verify
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          (cd codex-rs && cargo test --locked -p codex-hepta-neuron --all-targets && cargo test --locked -p codex-hepta-intuition --all-targets && cargo test --locked -p codex-hepta-prompt-optimizer --all-targets && cargo test --locked -p codex-hepta-plasticity --all-targets && cargo test --locked -p codex-hepta-intelligence --all-targets && cargo clippy --locked -p codex-hepta-neuron -p codex-hepta-intuition -p codex-hepta-prompt-optimizer -p codex-hepta-plasticity -p codex-hepta-intelligence --all-targets -- -D warnings && cargo fmt --package codex-hepta-neuron --package codex-hepta-intuition --package codex-hepta-prompt-optimizer --package codex-hepta-plasticity --package codex-hepta-intelligence -- --check)
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Publish verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}
