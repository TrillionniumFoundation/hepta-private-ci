name: Hepta objective exact execution

on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927
    paths:
      - codex-rs/hepta-objective/**
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-learning-ledger/**
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - docs/modules/objective.compiler/**
      - qualification/module-execution-dossiers/detail/objective.compiler.md
      - scripts/hepta-objective-current-state.py
      - scripts/hepta-objective-qualify-exact.py
      - scripts/test_hepta_objective_qualify_exact.py
      - scripts/hepta-objective-target-measure.py
      - scripts/test_hepta_objective_target_measure.py
      - scripts/hepta-objective-evidence-project.py
      - scripts/hepta-objective-release-gate.py
      - scripts/test_hepta_objective_release_gate.py
      - scripts/test_hepta_objective_evidence_project.py
      - .github/workflows/hepta-objective-exact-execution.yml
      - .github/workflows/hepta-objective-target-measurement.yml
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full immutable source commit; checkout uses this value
        required: true
        type: string
      merge_base:
        description: Full immutable main commit used for the synthetic merge
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_commit || github.sha }}
  QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  # macOS exposes /tmp through a symlinked /var path. The product fixtures
  # require a canonical, short owner path so Unix sockets and private checkpoint
  # parent validation exercise the intended boundary rather than host aliases.
  TMPDIR: /private/tmp

# Branch pushes are a moving development signal: only the newest branch head is
# useful. Manual dispatches bind immutable source/base identities and are never
# cancelled by a later development push or a different manual candidate.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('objective-exact-manual-{0}-{1}', inputs.source_commit, inputs.merge_base) || format('objective-exact-push-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable source and merge base
        env:
          REQUESTED_MERGE_BASE: ${{ inputs.merge_base }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ -n "$REQUESTED_MERGE_BASE" ]]; then
            BASE="$REQUESTED_MERGE_BASE"
          else
            BASE="$(git rev-parse origin/main)"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$BASE^{commit}")" = "$BASE"
          printf 'MERGE_BASE_SHA=%s\n' "$BASE" >> "$GITHUB_ENV"
          printf 'Source: %s\nMerge base: %s\n' "$SOURCE_SHA" "$BASE" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify static state and recorder failure semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-objective-current-state.py verify
          python3 scripts/hepta-objective-release-gate.py verify-source
          python3 -m unittest -v scripts.test_hepta_objective_qualify_exact
          python3 -m unittest -v scripts.test_hepta_objective_target_measure
          python3 -m unittest -v scripts.test_hepta_objective_evidence_project
          python3 -m unittest -v scripts.test_hepta_objective_release_gate
      - name: Qualify source and deterministic merge without source writes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-objective-qualify-exact.py \
            --source-commit "$SOURCE_SHA" \
            --merge-base "$MERGE_BASE_SHA" \
            --out "$RUNNER_TEMP/objective-exact-evidence" \
            --command-timeout 1800
      - name: Project the observed execution receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/objective-exact-evidence/receipt.json"
          if [[ -f "$receipt" ]]; then
            python3 scripts/hepta-objective-evidence-project.py \
              --source-commit "$SOURCE_SHA" \
              --source-tree "$(git rev-parse HEAD^{tree})" \
              --current-state docs/modules/objective.compiler/CURRENT_STATE.json \
              --exact-execution "$receipt" \
              --output "$RUNNER_TEMP/objective-exact-evidence/evidence-projection.json"
          fi
      - name: Preserve observed failures and partial execution as evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objective-exact-execution-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/objective-exact-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Verify the source checkout was not mutated
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
