name: learning.artifacts operational closure materializer

on:
  push:
    branches:
      - codex/learning-artifacts-operational-closure-20260929

permissions:
  contents: write

concurrency:
  group: learning-artifacts-operational-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Apply bounded source closure and refresh source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/apply_learning_artifacts_consumer_closure.py
          git add \
            codex-rs/hepta-learning-artifacts/Cargo.toml \
            codex-rs/hepta-learning-artifacts/REFERENCE_HOST_PROTOCOL.md \
            codex-rs/hepta-learning-artifacts/src/lib.rs \
            codex-rs/hepta-learning-artifacts/src/owner_service.rs \
            codex-rs/hepta-learning-artifacts/src/pinned.rs \
            codex-rs/hepta-learning-artifacts/src/owner/operational_metrics.rs \
            codex-rs/hepta-learning-artifacts/src/owner/publication_coordination.rs \
            .github/workflows/hepta-learning-artifacts-qualification.yml
          tree=$(git write-tree)
          python3 scripts/hepta_artifact_source_binding.py \
            --tree "$tree" --write \
            --include codex-rs/hepta-learning-artifacts/Cargo.toml \
            --include codex-rs/hepta-learning-artifacts/src/lib.rs \
            --include codex-rs/hepta-learning-artifacts/src/pinned.rs \
            --include codex-rs/hepta-learning-artifacts/src/owner/request_identity.rs \
            --include codex-rs/hepta-learning-artifacts/src/owner/operational_metrics.rs \
            --include codex-rs/hepta-learning-artifacts/src/owner/publication_coordination.rs \
            --include codex-rs/hepta-learning-artifacts/REFERENCE_HOST_PROTOCOL.md
          git add docs/modules/learning.artifacts/IMPLEMENTATION_MAP.json
          if git diff --cached --quiet; then
            echo 'source closure already materialized'
            exit 0
          fi
          git config user.name 'learning.artifacts materializer'
          git config user.email 'learning-artifacts-materializer@users.noreply.github.com'
          git commit -m 'learning.artifacts: close pinned withdrawal and refresh source binding'
          git push origin "HEAD:${GITHUB_REF_NAME}"
