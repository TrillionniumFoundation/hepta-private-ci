name: cognitive-types-repair-v2-tests

on:
  push:
    branches:
      - codex/cognitive-types-production-hardening-20260926
    paths:
      - .github/workflows/cognitive-types-repair-v2-tests.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/cognitive-types-production-hardening-20260926
          fetch-depth: 0
          persist-credentials: true

      - name: Migrate hardened receipt tests through checked constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-cognitive-store/src/v2_tests.rs")
          text = path.read_text()

          old = '''    let write_intent = intent(&store, "intent:image:1", &value);
              store
                  .append_admitted(&Verifier, value, write_intent)
                  .unwrap_or_else(|error| panic!("append: {error}"));
              let image = store
                  .export_image()
                  .unwrap_or_else(|error| panic!("export: {error}"));

              let mut wrong_intent = image.clone();
              wrong_intent.journal[0].receipt.intent_id = id("intent:image:forged");
              wrong_intent.image_digest = wrong_intent.compute_image_digest();
              assert!(matches!(
                  wrong_intent.validate(),
                  Err(CognitiveStoreV2Error::JournalReceiptMismatch(_))
              ));

              let mut wrong_record = image;
              wrong_record.journal[0].receipt.record_digest = digest("forged-record");
              wrong_record.image_digest = wrong_record.compute_image_digest();
              assert!(matches!(
                  wrong_record.validate(),
                  Err(CognitiveStoreV2Error::JournalRecordMismatch(_))
              ));'''

          new = '''    let write_intent = intent(&store, "intent:image:1", &value);
              store
                  .append_admitted(&Verifier, value, write_intent.clone())
                  .unwrap_or_else(|error| panic!("append: {error}"));
              let image = store
                  .export_image()
                  .unwrap_or_else(|error| panic!("export: {error}"));
              let original_receipt = image.journal[0].receipt.clone();
              let record_id = original_receipt
                  .record_id()
                  .cloned()
                  .unwrap_or_else(|| panic!("committed receipt record id"));
              let record_digest = original_receipt
                  .record_digest()
                  .unwrap_or_else(|| panic!("committed receipt record digest"));
              let committed_frontier = original_receipt
                  .committed_frontier()
                  .unwrap_or_else(|| panic!("committed receipt frontier"));
              let disposition = original_receipt
                  .disposition()
                  .unwrap_or_else(|| panic!("committed receipt disposition"));

              let forged_intent = MemoryWriteIntentV1::new(
                  id("intent:image:forged"),
                  write_intent.candidate_digest(),
                  write_intent.expected_snapshot().clone(),
                  write_intent.writer_fence_digest(),
                  write_intent.authorization_digest(),
              )
              .unwrap_or_else(|error| panic!("valid forged intent: {error}"));
              let mut wrong_intent = image.clone();
              wrong_intent.journal[0].receipt = MemoryWriteReceiptV1::committed(
                  &forged_intent,
                  original_receipt.snapshot_key().clone(),
                  record_id.clone(),
                  record_digest,
                  committed_frontier,
                  disposition,
              )
              .unwrap_or_else(|error| panic!("valid forged-intent receipt: {error}"));
              wrong_intent.image_digest = wrong_intent.compute_image_digest();
              assert!(matches!(
                  wrong_intent.validate(),
                  Err(CognitiveStoreV2Error::JournalReceiptMismatch(_))
              ));

              let mut wrong_record = image;
              wrong_record.journal[0].receipt = MemoryWriteReceiptV1::committed(
                  &write_intent,
                  original_receipt.snapshot_key().clone(),
                  record_id,
                  digest("forged-record"),
                  committed_frontier,
                  disposition,
              )
              .unwrap_or_else(|error| panic!("valid forged-record receipt: {error}"));
              wrong_record.image_digest = wrong_record.compute_image_digest();
              assert!(matches!(
                  wrong_record.validate(),
                  Err(CognitiveStoreV2Error::JournalRecordMismatch(_))
              ));'''

          if text.count(old) != 1:
              raise SystemExit("expected exactly one receipt-tampering test block")
          text = text.replace(old, new)

          old = '''    assert_eq!(
                  result.shadow_receipt.record_digest,
                  result.write_receipt.record_digest
              );
              assert_eq!(
                  result.shadow_receipt.snapshot_vector_digest,
                  result.write_receipt.snapshot_key.vector_digest
              );'''
          new = '''    assert_eq!(
                  result.write_receipt.record_digest(),
                  Some(result.shadow_receipt.record_digest)
              );
              assert_eq!(
                  result.shadow_receipt.snapshot_vector_digest,
                  result.write_receipt.snapshot_key().vector_digest
              );'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one canonical-shadow accessor block")
          path.write_text(text.replace(old, new))
          PY

          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Commit repair and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cognitive-types-repair-v2-tests.yml
          git add codex-rs/hepta-cognitive-store/src/v2_tests.rs
          git commit -m "test(cognitive.types): migrate store tamper checks to hardened receipts"
          git push origin HEAD:codex/cognitive-types-production-hardening-20260926
