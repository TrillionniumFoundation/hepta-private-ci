name: Qualify the two archived WAL Rust inputs across the original daemon formatter scope
on:
  push:
    branches: ["diagnostic/daemon-fmt-candidate-2909-20261123"]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
  BASE: b8e8c6e82abc1479c573f61a5e17d28d581e6cad
jobs:
  fixed_base:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Restore exact product sources and verify all previous and current routing decisions
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/daemon-fmt-candidate-2909.py "$RUNNER_TEMP/wal-candidate-probe.py"
          git checkout --quiet --detach bd4a1979d627a7e934d8aee4ba7bfc8f4d116c9f
          mkdir -p "$RUNNER_TEMP/daemon-candidate-scope"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          python3 scripts/test_hepta_format_scope.py |& tee "$RUNNER_TEMP/daemon-candidate-scope/formatter-tests.log"
          python3 "$RUNNER_TEMP/wal-candidate-probe.py"
      - name: Check the complete original fixed-base formatter scope before running the write-mode entry point
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/daemon-candidate-scope"
          set +e
          timeout --kill-after=10s 600s just fmt --base "$BASE" --check > "$out/full-check.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$out/full-check.exit"
          git status --porcelain --untracked-files=all > "$out/after-check.status"
          test ! -s "$out/after-check.status"
          if [ "$code" != 0 ]; then
            tail -c 5000 "$out/full-check.log"
            exit "$code"
          fi
          set +e
          timeout --kill-after=10s 600s just fmt --base "$BASE" > "$out/full-original.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$out/full-original.exit"
          git status --porcelain --untracked-files=all > "$out/after-original.status"
          git diff --exit-code -- AUDIT/2026-10-20-agent-continuation/cell_p0 "$GITHUB_WORKSPACE/scripts/format_provenance"
          exit "$code"
      - if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: daemon-format-candidate-owner-and-full-scope
          path: ${{ runner.temp }}/daemon-candidate-scope
          if-no-files-found: error
