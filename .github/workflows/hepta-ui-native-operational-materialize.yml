name: ui.native scoped source materialization

on:
  push:
    branches: [work/ui-native-operational-closure-20260927]
    paths:
      - .github/ui-native-operational-bootstrap/**
      - .github/workflows/hepta-ui-native-operational-materialize.yml

permissions:
  contents: read

concurrency:
  group: ui-native-operational-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/work/ui-native-operational-closure-20260927'
    runs-on: macos-15
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      BRANCH: work/ui-native-operational-closure-20260927
      SOURCE_PARENT: 33fecc526481ab3782429d8d948c8c373244eeab
      PATCH_SHA256: 1ed8411faada5287de8cf2e4b6800684205e6825eee0270a118588968e029dd0
      GZIP_SHA256: 9c959aeb70bbc8ad14f6b091eadac3e7a69e36aabe09351e6524429af9f70ef7
      FOLLOWUP_SHA256: eecd3c43e72e8d48e2ef572f0f93ef383763fdeaf52a2eefbd18dce3806a4902
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable source and patch objects
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-bootstrap-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor "$SOURCE_PARENT" HEAD
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/native-bootstrap-evidence/patch-verification.log"
          import gzip, hashlib, os, subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['SOURCE_PARENT'], 'HEAD'], text=True).splitlines()
          assert changed and all(p.startswith('.github/ui-native-operational-bootstrap/') or p == '.github/workflows/hepta-ui-native-operational-materialize.yml' for p in changed), changed
          expected_blobs = [
              'dfe6df8346252949743fd9ac7b274b30b08b74b7',
              'af6edd00bc8b53b7681f7138490cdad802eec5e6',
              '1866b052bbfe63dd31b45927ce6290b5cc69c210',
              '20cd033d4fddda4727702fa5cf56a25a3011a69e',
              '7c1a3aa351b58c71456166b3ed0821488bb5200d',
              'fa78b1aec75398a06b4bc80da1805a2f2ef50923',
              '0c1fd0bc2df7748d50f8aa58fda5ee77d0397c7c',
              '33297172450728d6b26571223bd0b8c8e3bb0008',
              '515c59951e89c39bd82c9dd4c7689d5fb01ff19c',
              '9296ccc4b824bca1bffc373fa5d8101b617ed18d',
          ]
          pieces = []
          for index, expected in enumerate(expected_blobs):
              path = f'.github/ui-native-operational-bootstrap/patch.{index:02d}'
              resolved = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              assert resolved == expected, (path, resolved, expected)
              data = subprocess.check_output(['git', 'cat-file', 'blob', resolved])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
              print(path, len(data), actual, flush=True)
              assert actual == expected
              pieces.append(data)
          compressed = b''.join(pieces)
          print('gzip_sha256', hashlib.sha256(compressed).hexdigest(), flush=True)
          assert hashlib.sha256(compressed).hexdigest() == os.environ['GZIP_SHA256']
          patch = gzip.decompress(compressed)
          print('patch_sha256', len(patch), hashlib.sha256(patch).hexdigest(), flush=True)
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          followup = subprocess.check_output(['git', 'cat-file', 'blob', 'HEAD:.github/ui-native-operational-bootstrap/review-followup.patch'])
          print('followup_sha256', len(followup), hashlib.sha256(followup).hexdigest(), flush=True)
          assert hashlib.sha256(followup).hexdigest() == os.environ['FOLLOWUP_SHA256']
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'native-reviewed.patch').write_bytes(patch)
          (temp / 'native-followup.patch').write_bytes(followup)
          PY
          git switch -C "$BRANCH"
          git apply --index --check "$RUNNER_TEMP/native-reviewed.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/native-reviewed.patch"
          git apply --index --check "$RUNNER_TEMP/native-followup.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/native-followup.patch"
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(changed) == 26, changed
          prefixes = ('apps/hepta-native/', 'codex-rs/hepta-private-state/', 'docs/modules/ui.native/', 'scripts/hepta_ui_native_', 'scripts/test_hepta_ui_native_')
          assert all(p.startswith(prefixes) for p in changed), changed
          PY
      - name: Install committed formatting toolchain
        id: toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Format source and commit the exact candidate
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-native-gateway -p codex-hepta-contracts -p codex-hepta-private-state
          git add -- apps/hepta-native codex-rs/hepta-native-gateway codex-rs/hepta-contracts codex-rs/hepta-private-state
          git diff --cached --check
          git config user.name 'ui.native candidate maintenance'
          git config user.email 'ui-native-candidate@users.noreply.github.com'
          git commit -m 'fix(ui.native): bind confirmations, invalidate stale views and archive unknown observations' -m "Reviewed patch SHA256: $PATCH_SHA256; follow-up SHA256: $FOLLOWUP_SHA256. Rustfmt 1.95.0 applied. Source changes are not qualification or release evidence."
          git rev-parse HEAD > "$RUNNER_TEMP/native-source-commit.txt"
          HEPTA_UI_NATIVE_WRITE_BRANCH="$BRANCH" python3 apps/hepta-native/tools/prepare_current_source.py --write-fingerprints
          HEPTA_UI_NATIVE_WRITE_BRANCH="$BRANCH" python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          git add -- apps/hepta-native/CURRENT_SOURCE.json docs/modules/ui.native/IMPLEMENTATION_MAP.json qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          git commit -m 'chore(ui.native): bind operational candidate metadata without promoting claims'
          python3 apps/hepta-native/tools/prepare_current_source.py
          test -z "$(git status --porcelain)"
      - name: Fast-forward only the isolated candidate branch
        id: published
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED"
          git push origin "HEAD:refs/heads/$BRANCH"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/native-bootstrap-evidence/identity.txt"
          git archive HEAD | gzip -n > "$RUNNER_TEMP/native-bootstrap-evidence/source.tar.gz"
          cp "$RUNNER_TEMP/native-source-commit.txt" "$RUNNER_TEMP/native-bootstrap-evidence/"
      - name: Python and native regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_hepta_ui_native_*.py' -v 2>&1 | tee "$RUNNER_TEMP/native-bootstrap-evidence/python-tests.log"
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/native-bootstrap-evidence/rust-tests.log"
      - name: Strict native formatting and Clippy
        if: ${{ !cancelled() && steps.published.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
          cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/native-bootstrap-evidence/clippy.log"
      - name: Retain results without qualification promotion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-operational-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/native-bootstrap-evidence
          if-no-files-found: warn
          retention-days: 7
