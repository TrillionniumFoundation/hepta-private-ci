name: ui.native scoped source materialization

on:
  push:
    branches: [work/ui-native-operational-closure-20260927]
    paths:
      - .github/ui-native-operational-bootstrap/**
      - .github/workflows/hepta-ui-native-operational-materialize.yml

permissions:
  contents: read

concurrency:
  group: ui-native-operational-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/work/ui-native-operational-closure-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      BRANCH: work/ui-native-operational-closure-20260927
      SOURCE_PARENT: 33fecc526481ab3782429d8d948c8c373244eeab
      PATCH_SHA256: 1ed8411faada5287de8cf2e4b6800684205e6825eee0270a118588968e029dd0
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Check source parent and reviewed patch bytes
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          git switch -C "$BRANCH"
          cat .github/ui-native-operational-bootstrap/patch.{00..09} | gzip -d > "$RUNNER_TEMP/native-reviewed.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/native-reviewed.patch" | sha256sum -c -
          git apply --index --check "$RUNNER_TEMP/native-reviewed.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/native-reviewed.patch"
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(changed) == 26, changed
          prefixes = ('apps/hepta-native/', 'codex-rs/hepta-private-state/', 'docs/modules/ui.native/', 'scripts/hepta_ui_native_', 'scripts/test_hepta_ui_native_')
          assert all(p.startswith(prefixes) for p in changed), changed
          PY
      - name: Install committed formatting toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Format source and commit the exact candidate
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-native-gateway -p codex-hepta-contracts -p codex-hepta-private-state
          git add -- apps/hepta-native codex-rs/hepta-native-gateway codex-rs/hepta-contracts codex-rs/hepta-private-state
          git diff --cached --check
          git config user.name 'ui.native candidate maintenance'
          git config user.email 'ui-native-candidate@users.noreply.github.com'
          git commit -m 'fix(ui.native): bind confirmations, invalidate stale views and archive unknown observations' -m "Reviewed patch SHA256: $PATCH_SHA256. Rustfmt 1.95.0 applied. Source changes are not qualification or release evidence."
          git rev-parse HEAD > "$RUNNER_TEMP/native-source-commit.txt"
          HEPTA_UI_NATIVE_WRITE_BRANCH="$BRANCH" python3 apps/hepta-native/tools/prepare_current_source.py --write-fingerprints
          HEPTA_UI_NATIVE_WRITE_BRANCH="$BRANCH" python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          git add -- apps/hepta-native/CURRENT_SOURCE.json docs/modules/ui.native/IMPLEMENTATION_MAP.json qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          git commit -m 'chore(ui.native): bind operational candidate metadata without promoting claims'
          python3 apps/hepta-native/tools/prepare_current_source.py
          test -z "$(git status --porcelain)"
      - name: Fast-forward only the isolated candidate branch
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED"
          git push origin "HEAD:refs/heads/$BRANCH"
          git config --local --unset-all http.https://github.com/.extraheader || true
          mkdir -p "$RUNNER_TEMP/native-bootstrap-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/native-bootstrap-evidence/identity.txt"
          git archive HEAD | gzip -n > "$RUNNER_TEMP/native-bootstrap-evidence/source.tar.gz"
          cp "$RUNNER_TEMP/native-source-commit.txt" "$RUNNER_TEMP/native-bootstrap-evidence/"
      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libssl-dev
      - name: Python and native regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_hepta_ui_native_*.py' -v 2>&1 | tee "$RUNNER_TEMP/native-bootstrap-evidence/python-tests.log"
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/native-bootstrap-evidence/rust-tests.log"
      - name: Strict native formatting and Clippy
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
          cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/native-bootstrap-evidence/clippy.log"
      - name: Retain results without qualification promotion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-operational-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/native-bootstrap-evidence
          if-no-files-found: warn
          retention-days: 7
