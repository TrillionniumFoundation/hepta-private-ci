name: runtime.fleet focused qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"
      - "docs/modules/runtime.fleet/**"
      - "qualification/module-execution-dossiers/detail/runtime.fleet.md"
      - ".github/workflows/runtime-fleet-focused.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"
      - "docs/modules/runtime.fleet/**"
      - "qualification/module-execution-dossiers/detail/runtime.fleet.md"
      - ".github/workflows/runtime-fleet-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-fleet-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: runtime.fleet exact-source qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check

      - name: Run focused Rust qualification
        id: focused
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-fleet-evidence"
          status=0

          cargo fmt --all -- --check \
            2>&1 | tee "$RUNNER_TEMP/runtime-fleet-evidence/fmt.log"
          fmt_status=${PIPESTATUS[0]}
          if [ "$fmt_status" -ne 0 ]; then status="$fmt_status"; fi

          cargo test -p codex-hepta-fleet --lib \
            2>&1 | tee "$RUNNER_TEMP/runtime-fleet-evidence/test.log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ] && [ "$status" -eq 0 ]; then status="$test_status"; fi

          cargo clippy -p codex-hepta-fleet --all-targets -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/runtime-fleet-evidence/clippy.log"
          clippy_status=${PIPESTATUS[0]}
          if [ "$clippy_status" -ne 0 ] && [ "$status" -eq 0 ]; then status="$clippy_status"; fi

          printf '{"head":"%s","fmt":%s,"test":%s,"clippy":%s}\n' \
            "$(git rev-parse HEAD)" \
            "$fmt_status" \
            "$test_status" \
            "$clippy_status" \
            > "$RUNNER_TEMP/runtime-fleet-evidence/command-record.json"

          tar -czf "$RUNNER_TEMP/runtime-fleet-evidence/runtime-fleet-source.tgz" \
            hepta-fleet \
            hepta-supervisor/Cargo.toml \
            hepta-supervisor/src/daemon.rs \
            Cargo.toml \
            Cargo.lock

          exit "$status"

      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-fleet-exact-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/runtime-fleet-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Assert tracked source remains clean
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=no)"

  synthetic-merge:
    name: runtime.fleet synthetic-merge qualification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve current base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse "refs/remotes/origin/${BASE_REF}^{commit}")"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Construct deterministic synthetic merge
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.base.outputs.sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: runtime.fleet CI
          author-email: runtime-fleet-ci@users.noreply.github.com
          message: Synthetic runtime.fleet merge

      - name: Verify merge candidate
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha }}"
          cargo fmt --all -- --check
          cargo test -p codex-hepta-fleet --lib
          cargo clippy -p codex-hepta-fleet --all-targets -- -D warnings
          git diff --check
