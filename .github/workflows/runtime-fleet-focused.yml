name: runtime.fleet focused qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"
      - "docs/modules/runtime.fleet/**"
      - "qualification/module-execution-dossiers/detail/runtime.fleet*.md"
      - "scripts/runtime_fleet_*.py"
      - ".github/workflows/runtime-fleet-focused.yml"
  push:
    branches: [main]
    paths:
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"
      - "docs/modules/runtime.fleet/**"
      - "scripts/runtime_fleet_*.py"
      - ".github/workflows/runtime-fleet-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-fleet-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: runtime.fleet ${{ matrix.kind }} qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-source","synthetic-merge"]' || '["exact-source"]') }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Select pinned toolchain
        run: echo "RUSTUP_TOOLCHAIN=1.95.0" >> "$GITHUB_ENV"
      - name: Construct fixed qualification tree
        env:
          KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          if [ "$KIND" = synthetic-merge ]; then
            tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            export GIT_AUTHOR_NAME='runtime.fleet qualification'
            export GIT_AUTHOR_EMAIL='runtime-fleet-ci@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            merge="$(printf 'Deterministic runtime.fleet qualification\nbase %s\nsource %s\n' "$BASE_SHA" "$SOURCE_SHA" | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            git checkout --detach "$merge"
          fi
      - name: Execute all commands and retain bound receipts
        env:
          KIND: ${{ matrix.kind }}
        run: >-
          python3 scripts/runtime_fleet_qualify.py
          --kind "$KIND" --source "$SOURCE_SHA" --base "$BASE_SHA"
          --output "$RUNNER_TEMP/runtime-fleet-evidence"
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-fleet-${{ matrix.kind }}-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-fleet-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Assert source tree remains clean
        if: always()
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
