name: Memory Cell experimental evidence
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-intelligence-eval/examples/memory_cell_lab*'
      - 'codex-rs/hepta-intelligence-eval/examples/memory_cell_lab/**'
      - 'codex-rs/hepta-intelligence-eval/tests/memory_cell_*'
      - '.github/workflows/hepta-memory-cell-lab.yml'
permissions:
  contents: read
concurrency:
  group: memory-cell-lab-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile the exact dependency-free lab and test targets
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          mkdir -p /tmp/hepta-memory-cell-bin
          rustc --edition=2024 -O codex-rs/hepta-intelligence-eval/examples/memory_cell_lab.rs -o /tmp/hepta-memory-cell-bin/lab
          for source in codex-rs/hepta-intelligence-eval/tests/memory_cell_*.rs; do
            rustc --edition=2024 --test "$source" -o "/tmp/hepta-memory-cell-bin/$(basename "$source" .rs)"
          done
      - name: Execute native tests and explicit synthetic smoke
        shell: bash
        run: |
          set -euo pipefail
          for test in /tmp/hepta-memory-cell-bin/memory_cell_*; do "$test" --nocapture; done
          /tmp/hepta-memory-cell-bin/lab smoke /tmp/hepta-memory-cell-evidence
          git rev-parse HEAD > /tmp/hepta-memory-cell-evidence/source-head.txt
          rustc --version --verbose > /tmp/hepta-memory-cell-evidence/toolchain.txt
          sha256sum /tmp/hepta-memory-cell-bin/lab /tmp/hepta-memory-cell-evidence/* > /tmp/hepta-memory-cell-sha256.txt
          cp /tmp/hepta-memory-cell-sha256.txt /tmp/hepta-memory-cell-evidence/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-lab-evidence
          path: /tmp/hepta-memory-cell-evidence
          if-no-files-found: warn
