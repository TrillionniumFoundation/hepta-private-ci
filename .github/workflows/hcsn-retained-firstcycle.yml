name: HCSN retained first-cycle math evidence
on:
  pull_request:
    paths:
      - 'qualification/hcsn_firstcycle_review/**'
      - '.github/workflows/hcsn-retained-firstcycle.yml'
permissions:
  contents: read
jobs:
  retained-math-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Verify original retained states, references and arithmetic only
        run: python -m qualification.hcsn_firstcycle_review.verify_retained
      - name: Check clean executing source
        run: git diff --exit-code
