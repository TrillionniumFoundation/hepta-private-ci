name: MemoryCell exact factorial receipt
on:
  pull_request:
    paths:
      - ".github/workflows/hepta-memory-factorial-receipt.yml"
      - "scripts/memory_cell/factorial_receipt.py"
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Await only the exact already-started model run, never substitute another
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          url = 'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/runs/37932675437'
          for _ in range(90):
              request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urlopen(request, timeout=30) as response:
                  run = json.load(response)
              if run['head_sha'] != '71c6329b4bcf7febdfd6d97db1557f605ad1f0e1':
                  raise ValueError('model source changed')
              if run['status'] == 'completed':
                  if run['conclusion'] != 'success':
                      raise ValueError('exact model run failed: ' + str(run['conclusion']))
                  break
              time.sleep(15)
          else:
              raise ValueError('model run not terminal within audit bound')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-token-task-factorial
          run-id: 37932675437
          github-token: ${{ github.token }}
          path: /tmp/model-evidence
      - name: Verify original answer census and separate answerability strata
        run: |
          set -euo pipefail
          mkdir /tmp/factorial-receipt
          python3 scripts/memory_cell/factorial_receipt.py /tmp/model-evidence 71c6329b4bcf7febdfd6d97db1557f605ad1f0e1 /tmp/factorial-receipt/receipt.json
          git rev-parse HEAD > /tmp/factorial-receipt/auditor-commit.txt
          sha256sum /tmp/factorial-receipt/* > /tmp/factorial-receipt/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-factorial-conditional-receipt
          path: /tmp/factorial-receipt
          if-no-files-found: warn
