name: tmp-lane-e-r5-hardening

on:
  push:
    branches:
      - tmp/hepta-lane-e-r5-hardening-20260910
    paths:
      - .github/workflows/tmp-lane-e-r5-hardening.yml

permissions:
  contents: write

concurrency:
  group: tmp-lane-e-r5-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"

      - name: Merge exact and wildcard temporary-workflow defenses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          script_path = Path("scripts/hepta-lane-e-closure.py")
          text = script_path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one replacement, found {count}: {old[:100]!r}"
                  )
              text = text.replace(old, new)

          replace_once("import sys\n", "import sys\nimport tempfile\n")
          replace_once(
              'TEMPORARY_WORKFLOW_GLOB = "tmp-lane-e-*.yml"\n',
              '''FORBIDDEN_TEMPORARY_WORKFLOWS = (\n    ".github/workflows/hepta-lane-e-review-fixups.yml",\n    ".github/workflows/hepta-lane-e-materialize-generated.yml",\n    ".github/workflows/hepta-lane-e-close-review-blockers.yml",\n    ".github/workflows/hepta-lane-e-round4-closure.yml",\n)\nFORBIDDEN_TEMPORARY_WORKFLOW_GLOBS = (\n    ".github/workflows/tmp-lane-e-*.yml",\n)\n''',
          )
          replace_once(
              "def verify_workflow(findings: Findings) -> None:\n",
              '''def find_forbidden_temporary_workflows(root: Path) -> list[str]:\n    matches: set[str] = set()\n    for relative_path in FORBIDDEN_TEMPORARY_WORKFLOWS:\n        path = root / relative_path\n        if path.is_file():\n            matches.add(relative_path)\n    for pattern in FORBIDDEN_TEMPORARY_WORKFLOW_GLOBS:\n        for path in root.glob(pattern):\n            if path.is_file():\n                matches.add(path.relative_to(root).as_posix())\n    return sorted(matches)\n\n\ndef verify_workflow(findings: Findings) -> None:\n''',
          )
          replace_once(
              '''    temporary_workflows = sorted(WORKFLOW_PATH.parent.glob(TEMPORARY_WORKFLOW_GLOB))\n    findings.require(\n        not temporary_workflows,\n        "temporary_workflow_present",\n        "temporary Lane E workflows must not remain in the candidate: "\n        + ", ".join(path.name for path in temporary_workflows),\n    )\n''',
              '''    temporary_workflows = find_forbidden_temporary_workflows(ROOT)\n    findings.require(\n        not temporary_workflows,\n        "temporary_workflow_present",\n        "temporary Lane E workflows must not remain in the candidate: "\n        + ", ".join(temporary_workflows),\n    )\n''',
          )
          replace_once(
              "    return findings.items\n\n\ndef verify() -> Findings:\n",
              '''    with tempfile.TemporaryDirectory() as directory:\n        fixture_root = Path(directory)\n        hostile_paths = set(FORBIDDEN_TEMPORARY_WORKFLOWS)\n        hostile_paths.add(".github/workflows/tmp-lane-e-hostile.yml")\n        allowed_paths = {\n            ".github/workflows/hepta-lane-e-gap-closure.yml",\n            ".github/workflows/tmp-lane-x-hostile.yml",\n            ".github/workflows/hepta-lane-e-materialize-generated.yaml",\n        }\n        for relative_path in hostile_paths | allowed_paths:\n            path = fixture_root / relative_path\n            path.parent.mkdir(parents=True, exist_ok=True)\n            path.write_text("name: hostile-fixture\\n", encoding="utf-8")\n        detected = set(find_forbidden_temporary_workflows(fixture_root))\n        findings.require(\n            detected == hostile_paths,\n            "self_test_temporary_workflow_detection",\n            "temporary-workflow detector mismatch: "\n            f"expected={sorted(hostile_paths)!r}, detected={sorted(detected)!r}",\n        )\n    return findings.items\n\n\ndef verify() -> Findings:\n''',
          )
          script_path.write_text(text, encoding="utf-8")

          matrix_path = Path("docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json")
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          if matrix.get("baseCommit") != "6303bceab938c25d645e220a32f91701e2c31701":
              raise SystemExit("unexpected Lane E baseCommit")
          matrix["candidateBranch"] = "dynamic_exact_pr_head"
          matrix["sourceIdentityPolicy"] = (
              "single_direct_child_exact_ci_head_tree_and_ordered_parent_"
              "synthetic_merge_required"
          )
          matrix["repositoryClosureState"] = (
              "source_implemented_exact_head_qualification_required"
          )
          matrix_path.write_text(
              json.dumps(matrix, indent=2, ensure_ascii=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f qualification/lane-e/EXACT_HEAD_TRIGGER.md
          rm .github/workflows/tmp-lane-e-r5-hardening.yml
          uv run --frozen --project scripts ruff format scripts/hepta-lane-e-closure.py
          uv run --frozen --project scripts ruff format --check scripts
          git diff --check

      - name: Verify Lane E and the complete readiness closed world
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py self-test
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-technical-closure.py self-test
          python3 scripts/hepta-technical-closure.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          python3 -m json.tool docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json >/dev/null
          python3 -m json.tool docs/modules/MODULE_DOCS.json >/dev/null
          python3 -m json.tool qualification/lane-e/TEST_TRACEABILITY.json >/dev/null
          python3 -m json.tool qualification/module-execution-dossiers/DETAILS.json >/dev/null
          git diff --check

      - name: Publish clean hardened tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/tmp-lane-e-r5-hardening.yml \
            docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json \
            qualification/lane-e/EXACT_HEAD_TRIGGER.md \
            scripts/hepta-lane-e-closure.py \
            | sort)"
          test "$actual" = "$expected"
          test ! -e .github/workflows/tmp-lane-e-r5-hardening.yml
          test ! -e qualification/lane-e/EXACT_HEAD_TRIGGER.md
          git diff --check
          git config user.name hepta-lane-e-r5-hardening-bot
          git config user.email hepta-lane-e-r5-hardening-bot@users.noreply.github.com
          git add -A -- \
            .github/workflows/tmp-lane-e-r5-hardening.yml \
            docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json \
            qualification/lane-e/EXACT_HEAD_TRIGGER.md \
            scripts/hepta-lane-e-closure.py
          git commit -m "test(lane-e): harden temporary-workflow closure"
          git push origin HEAD:refs/heads/tmp/hepta-lane-e-r5-hardening-20260910
