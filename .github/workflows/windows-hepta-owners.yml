name: Windows Hepta owner regressions

on:
  pull_request:
    paths:
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/hepta-shadow-qualification/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/.config/nextest.toml"
      - "scripts/run-nextest.py"
      - "justfile"
      - ".github/workflows/windows-hepta-owners.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-hepta-owners-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owners:
    name: Complete Windows agentd, registry, and shadow owners
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CODEX_CI_PROFILE: ci-test
      CODEX_CI_TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@3f2778ee6a28c53e512b95bbcf7b2120993da70d # 1.96.1
        with:
          targets: x86_64-pc-windows-msvc

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103

      - name: Configure original verified sandbox V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Retain original source and toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-hepta-owners"
          cat > "$RUNNER_TEMP/windows-hepta-owners/source.py" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ["GITHUB_WORKSPACE"])
          output = Path(os.environ["RUNNER_TEMP"]) / "windows-hepta-owners"

          def git(*args):
              return subprocess.check_output(["git", "-C", str(root), *args])

          def identity(data):
              return {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          if git("status", "--porcelain", "--untracked-files=no"):
              raise RuntimeError("tracked source changed")
          files = {}
          for entry in git("ls-files", "--stage", "-z").split(b"\0"):
              if not entry:
                  continue
              header, raw_name = entry.split(b"\t", 1)
              mode, blob, stage = header.decode().split()
              if stage != "0":
                  raise RuntimeError("unmerged source")
              name = raw_name.decode()
              path = root / name
              data = os.fsencode(os.readlink(path)) if path.is_symlink() else path.read_bytes()
              files[name] = {"git_mode": mode, "git_blob": blob, **identity(data)}
          snapshot = {
              "head": git("rev-parse", "HEAD").decode().strip(),
              "tree": git("rev-parse", "HEAD^{tree}").decode().strip(),
              "index": identity(git("ls-files", "--stage", "-z")),
              "files": files,
          }
          destination = output / ("source-" + sys.argv[1] + ".json")
          destination.write_text(json.dumps(snapshot, indent=2) + "\n")
          if sys.argv[1] == "after":
              before = json.loads((output / "source-before.json").read_text())
              if snapshot != before:
                  raise RuntimeError("source, index, or candidate changed during validation")
          print(json.dumps({"head": snapshot["head"], "tree": snapshot["tree"], "files": len(files)}))
          PY
          python "$RUNNER_TEMP/windows-hepta-owners/source.py" before
          rustc -Vv > "$RUNNER_TEMP/windows-hepta-owners/rustc.txt"
          cargo -V > "$RUNNER_TEMP/windows-hepta-owners/cargo.txt"
          cargo nextest --version > "$RUNNER_TEMP/windows-hepta-owners/nextest.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          output = Path(os.environ["RUNNER_TEMP"]) / "windows-hepta-owners"
          for name, expected in (
              ("rustc.txt", ["rustc", "1.96.1"]),
              ("cargo.txt", ["cargo", "1.96.1"]),
              ("nextest.txt", ["cargo-nextest", "0.9.103"]),
          ):
              if (output / name).read_text().split()[:2] != expected:
                  raise RuntimeError("the original tool version differs: " + name)
          original = Path("codex-rs/.config/nextest.toml").read_text()
          settings = tomllib.loads(original)
          assert "store" not in settings
          store = str(output / "nextest")
          configured = original + "\n[store]\ndir = " + json.dumps(store) + "\n"
          actual = tomllib.loads(configured)
          assert actual.pop("store") == {"dir": store}
          assert actual == settings
          (output / "original-nextest.toml").write_text(original)
          (output / "nextest.toml").write_text(configured)
          PY

      - name: List every original test in all three owners
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo nextest list --locked --target "$CODEX_CI_TARGET" \
            --cargo-profile "$CODEX_CI_PROFILE" --profile default --message-format json \
            --config-file "$RUNNER_TEMP/windows-hepta-owners/nextest.toml" \
            -p codex-hepta-agentd -p codex-hepta-prompt-registry \
            -p codex-hepta-shadow-qualification \
            > "$RUNNER_TEMP/windows-hepta-owners/test-list.json"

      - name: Run complete original owners with the unchanged CI test policy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked --target "$CODEX_CI_TARGET" \
            --cargo-profile "$CODEX_CI_PROFILE" --profile default \
            --config-file "$RUNNER_TEMP/windows-hepta-owners/nextest.toml" \
            -p codex-hepta-agentd -p codex-hepta-prompt-registry \
            -p codex-hepta-shadow-qualification \
            2>&1 | tee "$RUNNER_TEMP/windows-hepta-owners/tests.log"

      - name: Retain actual results and verify complete source preservation
        if: always()
        shell: python
        run: |
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tomllib
          import xml.etree.ElementTree as ET

          output = Path(os.environ["RUNNER_TEMP"]) / "windows-hepta-owners"
          junit = output / "nextest/default/junit.xml"
          subprocess.run([sys.executable, str(output / "source.py"), "after"], check=True)
          original_text = (output / "original-nextest.toml").read_text()
          source_config = Path(os.environ["GITHUB_WORKSPACE"]) / "codex-rs/.config/nextest.toml"
          assert original_text == source_config.read_text()
          original = tomllib.loads(original_text)
          actual_config = tomllib.loads((output / "nextest.toml").read_text())
          assert actual_config.pop("store") == {"dir": str(output / "nextest")}
          assert actual_config == original
          if not junit.is_file():
              raise RuntimeError("the complete Windows test result is missing")
          shutil.copyfile(junit, output / "junit.xml")
          inventory = json.loads((output / "test-list.json").read_text())
          expected = []
          original_ignored = []
          owners = set()
          for binary, suite in inventory["rust-suites"].items():
              owners.add(suite["package-name"])
              if suite["status"] != "listed":
                  raise RuntimeError("an owner binary was not listed")
              for name, case in suite["testcases"].items():
                  if case["ignored"]:
                      original_ignored.append((binary, name))
                  elif case["filter-match"]["status"] != "matches":
                      raise RuntimeError("an original owner test was filtered")
                  else:
                      expected.append((binary, name))
          if owners != {
              "codex-hepta-agentd", "codex-hepta-prompt-registry",
              "codex-hepta-shadow-qualification",
          }:
              raise RuntimeError("the complete owner inventory differs")
          cases = list(ET.parse(junit).getroot().iter("testcase"))
          actual = [(case.get("classname"), case.get("name")) for case in cases if case.find("skipped") is None]
          skipped = [(case.get("classname"), case.get("name")) for case in cases if case.find("skipped") is not None]
          if any(case not in original_ignored for case in skipped):
              raise RuntimeError("an ordinary owner test was skipped")
          if not expected or Counter(actual) != Counter(expected):
              raise RuntimeError("listed tests and actual executions differ")
          if any(case.find(tag) is not None for case in cases for tag in ("failure", "error")):
              raise RuntimeError("an original Windows owner test failed or did not execute")
          summary = {"passed": True, "tests": len(actual), "cases": sorted(actual),
                     "original_ignored": sorted(original_ignored), "xml_skipped": sorted(skipped)}
          (output / "complete-owner-results.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps({"passed": True, "tests": len(actual), "original_ignored": len(original_ignored)}))

      - name: Retain complete Windows regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-hepta-owners-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/windows-hepta-owners
          if-no-files-found: error
          retention-days: 14
