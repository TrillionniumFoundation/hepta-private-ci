name: PR 456 publisher startup probe

on:
  push:
    branches:
      - ops/pr456-followup-publisher-20260907-r1

permissions:
  contents: read

jobs:
  probe:
    name: Confirm hosted workflow startup
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record immutable probe
        shell: bash
        run: |
          set -euo pipefail
          echo "head=${GITHUB_SHA}"
          echo "This probe performs no checkout, write, target contact, evidence transition, or release action."
