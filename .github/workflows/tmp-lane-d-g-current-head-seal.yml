name: tmp-lane-d-g-current-head-seal

on:
  push:
    branches:
      - ops/lane-f-final-source-export-20260910
    paths:
      - .github/workflows/tmp-lane-d-g-current-head-seal.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out carrier and fetch all refs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Discover, qualify and publish Lane D and G
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          latest_lane() {
            local lane="$1"
            git for-each-ref --sort=-committerdate --format='%(refname:strip=3)' refs/remotes/origin/codex |
              grep -Ei "lane-${lane}.*20260910|20260910.*lane-${lane}" | head -n 1 || true
          }

          normalize_tree() {
            local dir="$1" lane="$2"
            (
              cd "${dir}"
              python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          path = root / "qualification/module-execution-dossiers/NATIVE_BINDINGS.json"
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              rows = data.get("observations")
              if not isinstance(rows, list) or len(rows) != 40:
                  raise SystemExit("native source ledger is not exactly 40 modules")
              seen: set[str] = set()
              for row in rows:
                  module = row.get("module")
                  source_path = row.get("path")
                  if not isinstance(module, str) or module in seen:
                      raise SystemExit(f"invalid native binding module {module!r}")
                  seen.add(module)
                  if not isinstance(source_path, str):
                      raise SystemExit(f"missing source path for {module}")
                  source = root / source_path
                  if not source.is_file():
                      raise SystemExit(f"missing source {source_path}")
                  payload = source.read_bytes()
                  row["blobSha"] = hashlib.sha1(
                      f"blob {len(payload)}\0".encode("ascii") + payload,
                      usedforsecurity=False,
                  ).hexdigest()
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
              find .github/workflows -maxdepth 1 -type f \
                \( -iname "tmp-lane-${lane}-*.yml" -o -iname "tmp-lane-${lane}-*.yaml" \) -delete
              python3 scripts/hepta-readiness.py generate-status || true
              python3 scripts/hepta-implementation-dossiers.py generate-status || true
              python3 scripts/hepta-algorithm-docs.py generate-status || true
              python3 scripts/hepta-cns.py generate-status || true
              python3 scripts/hepta-docs.py generate-status || true
              git add -A
              git diff --cached --check
              if git diff --cached --quiet; then
                git commit --allow-empty -m "chore(lane-${lane}): current-head qualification seal"
              else
                git commit -m "chore(lane-${lane}): normalize current-head qualification truth"
              fi
              test -z "$(git status --porcelain)"

              python3 scripts/hepta-readiness.py self-test
              python3 scripts/hepta-readiness.py generate-status --check
              python3 scripts/hepta-readiness.py verify
              python3 scripts/hepta-implementation-dossiers.py self-test
              python3 scripts/hepta-implementation-dossiers.py generate-status --check
              python3 scripts/hepta-implementation-dossiers.py verify
              python3 qualification/module-execution-dossiers/implementation_contracts.py self-test
              python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
              python3 scripts/hepta-module-docs.py self-test
              python3 scripts/hepta-module-docs.py verify
              git diff --check
              test -z "$(git status --porcelain)"
            )
          }

          test_lane_d() {
            local dir="$1"
            (
              cd "${dir}"
              cargo metadata --manifest-path codex-rs/Cargo.toml --no-deps --format-version 1 > /tmp/lane-d-metadata.json
              python3 - <<'PY' > /tmp/lane-d-packages.txt
          import json
          from pathlib import Path
          root = Path.cwd().resolve()
          roots = [(root / p).resolve() for p in [
              "codex-rs/hepta-objective",
              "codex-rs/hepta-ndu",
              "codex-rs/hepta-control-plane",
          ]]
          data = json.loads(Path("/tmp/lane-d-metadata.json").read_text(encoding="utf-8"))
          names = sorted({
              p["name"] for p in data["packages"]
              if any((candidate / "Cargo.toml") == Path(p["manifest_path"]).resolve()
                     or candidate in Path(p["manifest_path"]).resolve().parents
                     for candidate in roots)
          })
          if not names:
              raise SystemExit("no Lane D Rust packages discovered")
          print("\n".join(names))
          PY
              while IFS= read -r package; do
                cargo test --manifest-path codex-rs/Cargo.toml -p "${package}" --all-targets --locked
              done < /tmp/lane-d-packages.txt
            )
          }

          test_lane_g() {
            local dir="$1"
            (
              cd "${dir}"
              if [[ -d tools/hepta-engineering-control ]]; then
                python3 -m unittest discover -s tools/hepta-engineering-control -p 'test_*.py'
                python3 -m compileall -q tools/hepta-engineering-control
              fi
              if [[ -f scripts/hepta-hnmf.py ]]; then
                python3 scripts/hepta-hnmf.py self-test
                python3 scripts/hepta-hnmf.py verify
              fi
            )
          }

          for lane in d g; do
            branch="$(latest_lane "${lane}")"
            if [[ -z "${branch}" ]]; then
              echo "NO_CURRENT_LANE_${lane^^}_BRANCH"
              continue
            fi
            worktree="${RUNNER_TEMP}/lane-${lane}"
            git worktree add --detach "${worktree}" "refs/remotes/origin/${branch}"
            git -C "${worktree}" switch -C "seal-${lane}"
            original="$(git -C "${worktree}" rev-parse HEAD)"
            normalize_tree "${worktree}" "${lane}"
            if [[ "${lane}" == d ]]; then
              test_lane_d "${worktree}"
            else
              test_lane_g "${worktree}"
            fi
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            test "$(git rev-parse refs/remotes/origin/${branch})" = "${original}"
            git -C "${worktree}" push origin "HEAD:refs/heads/${branch}"
            git worktree remove --force "${worktree}"
          done
