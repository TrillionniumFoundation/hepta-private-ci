name: PR463 exact expiry-race materializer
on:
  push:
    branches:
      - ops/pr463-expiry-materializer-20260908
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-final-gap-closure-r2-20260908
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact lease and patch source
        shell: bash
        env:
          EXPECTED_HEAD: 388cb4fa499a9eac31fece703f51e8060c65cfa3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.g1/trillionnium_os_external_evidence/trusted_executor.py')
          s=src.read_text()
          old='''    owner_pid,prior_subreaper,baseline=_enter_descendant_containment()\n    cmd=f"/proc/self/fd/{harness.fd}"; proc=None; clean=False\n    try: proc=subprocess.Popen([cmd],executable=cmd,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,cwd=cwd,env=env,close_fds=True,pass_fds=(harness.fd,),start_new_session=True)\n'''
          new='''    owner_pid,prior_subreaper,baseline=_enter_descendant_containment()\n    if clock()>=authority_expiry:\n        _restore_descendant_containment(prior_subreaper,True)\n        return {"exit_code":-1,"stdout":b"","stderr":b"","failure":"authorization_expired_before_target_contact","leader_reaped":True,"cleanup_confirmed":True,"escaped_descendants_absence_proven":True,"target_contact_performed":False}\n    cmd=f"/proc/self/fd/{harness.fd}"; proc=None; clean=False\n    try: proc=subprocess.Popen([cmd],executable=cmd,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,cwd=cwd,env=env,close_fds=True,pass_fds=(harness.fd,),start_new_session=True)\n'''
          if s.count(old)!=1: raise SystemExit('source anchor mismatch')
          src.write_text(s.replace(old,new,1))

          test=Path('.g1/trillionnium_os_external_evidence/tests/test_trusted_executor.py')
          s=test.read_text()
          anchor='''    def test_authority_expiry_bounds_running_harness(self):\n        self.prepare(sleep_seconds=1,expiry_seconds=.25); started=time.monotonic(); clock=lambda:NOW+timedelta(seconds=time.monotonic()-started)\n        with self.assertRaisesRegex(ExecutionError,"authorization_expired"): execute(NONCE,config=self.config,now=NOW,clock=clock)\n        self.assertLess(time.monotonic()-started,1.5); self.assertTrue(self.result()["target_contact_performed"])\n\n'''
          addition='''    def test_containment_setup_crossing_expiry_never_launches_harness(self):\n        self.prepare(expiry_seconds=.25); clock_now=[NOW]\n        original_enter=trusted_executor._enter_descendant_containment\n        def enter_then_expire():\n            state=original_enter(); clock_now[0]=NOW+timedelta(seconds=.3); return state\n        with mock.patch.object(trusted_executor,"_enter_descendant_containment",side_effect=enter_then_expire), mock.patch.object(trusted_executor.subprocess,"Popen",wraps=trusted_executor.subprocess.Popen) as popen:\n            with self.assertRaisesRegex(ExecutionError,"authorization_expired_before_target_contact"): execute(NONCE,config=self.config,now=NOW,clock=lambda:clock_now[0])\n        popen.assert_not_called(); result=self.result(); self.assertFalse(result["target_contact_performed"]); self.assertEqual(result["failure"],"authorization_expired_before_target_contact")\n        with self.assertRaises(ReplayError): execute(NONCE,config=self.config,now=NOW)\n\n    def test_containment_setup_delay_still_launches_when_authority_is_valid(self):\n        self.prepare(expiry_seconds=2); clock_now=[NOW]\n        original_enter=trusted_executor._enter_descendant_containment\n        def enter_with_valid_delay():\n            state=original_enter(); clock_now[0]=NOW+timedelta(seconds=.1); return state\n        with mock.patch.object(trusted_executor,"_enter_descendant_containment",side_effect=enter_with_valid_delay), mock.patch.object(trusted_executor.subprocess,"Popen",wraps=trusted_executor.subprocess.Popen) as popen:\n            result=execute(NONCE,config=self.config,now=NOW,clock=lambda:clock_now[0])\n        self.assertEqual(popen.call_count,1); self.assertTrue(result["target_contact_performed"]); self.assertEqual(result["status"],"CAPTURE_COMPLETE_PENDING_INDEPENDENT_REVIEW")\n\n'''
          if s.count(anchor)!=1: raise SystemExit('test anchor mismatch')
          s=s.replace(anchor,anchor+addition,1)
          positive='self.prepare(close_output=True,sleep_seconds=.05,expiry_seconds=1,delayed_marker=True)'
          if s.count(positive)!=1: raise SystemExit('positive expiry fixture anchor mismatch')
          test.write_text(s.replace(positive,'self.prepare(close_output=True,sleep_seconds=.05,expiry_seconds=5,delayed_marker=True)',1))
          PY
          git diff --check
      - name: Run complete external-evidence qualification
        shell: bash
        working-directory: .g1/trillionnium_os_external_evidence
        run: |
          set -euo pipefail
          python3 -m py_compile trusted_executor.py admission_service.py tests/test_trusted_executor.py tests/test_admission_service.py
          python3 -m unittest discover -s tests -v
      - name: Commit and push exact fast-forward successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "388cb4fa499a9eac31fece703f51e8060c65cfa3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .g1/trillionnium_os_external_evidence/trusted_executor.py .g1/trillionnium_os_external_evidence/tests/test_trusted_executor.py
          git diff --cached --check
          git commit -m "fix(executor): recheck authority immediately before launch"
          git push origin HEAD:codex/hepta-final-gap-closure-r2-20260908
