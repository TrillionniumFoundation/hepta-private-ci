          PY_OUT

      - name: Upload candidate execution record
        if: ${{ always() && steps.check_01.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hnmf-${{ github.job }}-${{ matrix.candidate }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hnmf-candidate.json
          if-no-files-found: error

  qualification-required:
    name: HNMF qualification required
    if: ${{ always() }}
    needs: [canonical-contracts, contract-reference, adversarial-reference, deterministic-reference, canonical-consumers, shared-experience-owner]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable candidate checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_REQUIRED'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          bad = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          if bad:
              raise SystemExit(f"HNMF qualification incomplete: {bad}")
          print("PASS_HNMF_ALL_APPLICABLE_CANDIDATES")
          PY_REQUIRED
