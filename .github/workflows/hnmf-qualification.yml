  shared-experience-owner:
    name: shared-experience owner bridge (${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head", "synthetic-merge"]' || '["exact-head"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        id: check_01
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && matrix.candidate == 'exact-head' && github.event.pull_request.head.sha || github.sha }}

      - name: Record and verify immutable candidate identity
        id: identity
        env:
