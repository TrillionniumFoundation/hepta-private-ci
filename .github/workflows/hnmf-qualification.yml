        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY_OUT'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "hnmf-candidate.json")
          receipt = json.loads(path.read_text())
          receipt["checks"] = {key: {"outcome": val["outcome"], "conclusion": val["conclusion"]}
                               for key, val in json.loads(os.environ["CHECK_OUTCOMES"]).items()}
