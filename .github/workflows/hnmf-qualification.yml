name: hnmf-qualification

on:
  pull_request:
    paths:
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-cognitive-read/**"
      - "codex-rs/hepta-cognitive-store/**"
      - "codex-rs/hepta-memory-retrieval/**"
      - "codex-rs/hepta-compact-engine/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-memory/src/shared_experience.rs"
      - "codex-rs/hepta-memory/src/shared_experience_tests.rs"
      - "codex-rs/hepta-agentd/tests/cognitive_store_product_writer.rs"
      - "codex-rs/hepta-agentd/src/intelligence_product*.rs"
      - "docs/contracts/CONTRACTS.json"
      - "docs/contracts/PROTOCOL_SCHEMAS.json"
      - "docs/modules/cognitive.types/IMPLEMENTATION_MAP.json"
      - "docs/hnmf/**"
      - "qualification/cognitive-types-v1/**"
      - "qualification/cognitive-types-v2/**"
      - "qualification/hnmf-reference/**"
      - "qualification/hnmf-contract-reference/**"
      - "qualification/hnmf-adversarial-reference/**"
      - "scripts/hepta-hnmf.py"
      - ".github/workflows/hnmf-qualification.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-cognitive-read/**"
      - "codex-rs/hepta-cognitive-store/**"
      - "codex-rs/hepta-memory-retrieval/**"
      - "codex-rs/hepta-compact-engine/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-memory/src/shared_experience.rs"
      - "codex-rs/hepta-memory/src/shared_experience_tests.rs"
      - "codex-rs/hepta-agentd/tests/cognitive_store_product_writer.rs"
      - "codex-rs/hepta-agentd/src/intelligence_product*.rs"
      - "docs/contracts/CONTRACTS.json"
      - "docs/contracts/PROTOCOL_SCHEMAS.json"
      - "docs/modules/cognitive.types/IMPLEMENTATION_MAP.json"
      - "docs/hnmf/**"
      - "qualification/cognitive-types-v1/**"
      - "qualification/cognitive-types-v2/**"
      - "qualification/hnmf-reference/**"
      - "qualification/hnmf-contract-reference/**"
      - "qualification/hnmf-adversarial-reference/**"
      - "scripts/hepta-hnmf.py"
      - ".github/workflows/hnmf-qualification.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: hnmf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-contracts:
    name: canonical cognitive.types (${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head", "synthetic-merge"]' || '["exact-head"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        id: check_01
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && matrix.candidate == 'exact-head' && github.event.pull_request.head.sha || github.sha }}

      - name: Record and verify immutable candidate identity
        id: identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          CANDIDATE_KIND: ${{ matrix.candidate }}
        run: python3 qualification/cognitive-types-v1/verify_candidate.py

      - name: Verify HNMF closed-world registry
        id: check_02
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: |
          python3 -m unittest discover -s qualification/cognitive-types-v1 -p 'test_*.py'
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify

      - name: Verify cognitive.types cross-language V1 vectors
        id: check_03
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: python3 qualification/cognitive-types-v1/verify_vectors.py

      - name: Verify cognitive.types shared-experience V2 vectors
        id: check_04
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: python3 qualification/cognitive-types-v2/verify_vectors.py

      - name: Show Rust toolchain identity
        id: check_05
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: |
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Check canonical cognitive.types formatting
        id: check_06
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-cognitive-types -- --check

      - name: Check canonical cognitive.types all targets
        id: check_07
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo check --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types --all-targets

      - name: Lint canonical cognitive.types
        id: check_08
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types --all-targets -- -D warnings

      - name: Test canonical cognitive.types
        id: check_09
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types

      - name: Run bounded canonical decoder fuzz smoke
        id: check_10
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: >-
          cargo test --manifest-path codex-rs/Cargo.toml --locked
          -p codex-hepta-cognitive-types
          bounded_arbitrary_byte_decoder_smoke_covers_all_registered_contracts

      - name: Check canonical cognitive.types fuzz harness
        id: check_11
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo check --manifest-path codex-rs/hepta-cognitive-types/fuzz/Cargo.toml --all-targets


      - name: Preserve candidate and actual check outcomes
        if: ${{ always() && steps.check_01.outcome == 'success' }}
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY_OUT'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "hnmf-candidate.json")
          receipt = json.loads(path.read_text())
          receipt["checks"] = {key: {"outcome": val["outcome"], "conclusion": val["conclusion"]}
                               for key, val in json.loads(os.environ["CHECK_OUTCOMES"]).items()}
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY_OUT

      - name: Upload candidate execution record
        if: ${{ always() && steps.check_01.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hnmf-${{ github.job }}-${{ matrix.candidate }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hnmf-candidate.json
          if-no-files-found: error

  contract-reference:
    name: HNMF contract reference (${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head", "synthetic-merge"]' || '["exact-head"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        id: check_01
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && matrix.candidate == 'exact-head' && github.event.pull_request.head.sha || github.sha }}

      - name: Record and verify immutable candidate identity
        id: identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          CANDIDATE_KIND: ${{ matrix.candidate }}
        run: python3 qualification/cognitive-types-v1/verify_candidate.py

      - name: Check formatting
        id: check_02
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo fmt --manifest-path qualification/hnmf-contract-reference/Cargo.toml -- --check

      - name: Check all targets
        id: check_03
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo check --manifest-path qualification/hnmf-contract-reference/Cargo.toml --all-targets --locked

      - name: Lint strictly
        id: check_04
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo clippy --manifest-path qualification/hnmf-contract-reference/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        id: check_05
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo test --manifest-path qualification/hnmf-contract-reference/Cargo.toml --locked


      - name: Preserve candidate and actual check outcomes
        if: ${{ always() && steps.check_01.outcome == 'success' }}
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY_OUT'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "hnmf-candidate.json")
          receipt = json.loads(path.read_text())
          receipt["checks"] = {key: {"outcome": val["outcome"], "conclusion": val["conclusion"]}
                               for key, val in json.loads(os.environ["CHECK_OUTCOMES"]).items()}
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY_OUT

      - name: Upload candidate execution record
        if: ${{ always() && steps.check_01.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hnmf-${{ github.job }}-${{ matrix.candidate }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hnmf-candidate.json
          if-no-files-found: error

  adversarial-reference:
    name: HNMF adversarial reference (${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head", "synthetic-merge"]' || '["exact-head"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        id: check_01
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && matrix.candidate == 'exact-head' && github.event.pull_request.head.sha || github.sha }}

      - name: Record and verify immutable candidate identity
        id: identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          CANDIDATE_KIND: ${{ matrix.candidate }}
        run: python3 qualification/cognitive-types-v1/verify_candidate.py

      - name: Check formatting
        id: check_02
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo fmt --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml -- --check

      - name: Check all targets
        id: check_03
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo check --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --all-targets --locked

      - name: Lint strictly
        id: check_04
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo clippy --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        id: check_05
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo test --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --locked


      - name: Preserve candidate and actual check outcomes
        if: ${{ always() && steps.check_01.outcome == 'success' }}
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY_OUT'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "hnmf-candidate.json")
          receipt = json.loads(path.read_text())
          receipt["checks"] = {key: {"outcome": val["outcome"], "conclusion": val["conclusion"]}
                               for key, val in json.loads(os.environ["CHECK_OUTCOMES"]).items()}
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY_OUT

      - name: Upload candidate execution record
        if: ${{ always() && steps.check_01.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hnmf-${{ github.job }}-${{ matrix.candidate }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hnmf-candidate.json
          if-no-files-found: error

  deterministic-reference:
    name: HNMF deterministic reference (${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head", "synthetic-merge"]' || '["exact-head"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
