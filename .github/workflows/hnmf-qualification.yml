name: hnmf-qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-cognitive-types/**"
      - "docs/contracts/CONTRACTS.json"
      - "docs/contracts/PROTOCOL_SCHEMAS.json"
      - "docs/modules/cognitive.types/IMPLEMENTATION_MAP.json"
      - "docs/hnmf/**"
      - "qualification/cognitive-types-v1/**"
      - "qualification/hnmf-reference/**"
      - "qualification/hnmf-contract-reference/**"
      - "qualification/hnmf-adversarial-reference/**"
      - "scripts/hepta-hnmf.py"
      - ".github/workflows/hnmf-qualification.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-cognitive-types/**"
      - "docs/contracts/CONTRACTS.json"
      - "docs/contracts/PROTOCOL_SCHEMAS.json"
      - "docs/modules/cognitive.types/IMPLEMENTATION_MAP.json"
      - "docs/hnmf/**"
      - "qualification/cognitive-types-v1/**"
      - "qualification/hnmf-reference/**"
      - "qualification/hnmf-contract-reference/**"
      - "qualification/hnmf-adversarial-reference/**"
      - "scripts/hepta-hnmf.py"
      - ".github/workflows/hnmf-qualification.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: hnmf-qualification-${{ github.event.pull_request.number || github.ref }}
  # PR evidence belongs to the latest exact candidate; never cancel main.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  reference-closure:
    name: HNMF reference closure (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Construct canonical prospective merge
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta HNMF CI
          author-email: hepta-hnmf-ci@users.noreply.github.com
          message: HNMF synthetic merge

      - name: Bind tested candidate identity
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD HEAD^{tree}

      - name: Verify HNMF closed-world registry
        run: |
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify

      - name: Verify cognitive.types cross-language V1 vectors
        run: python3 qualification/cognitive-types-v1/verify_vectors.py

      - name: Show Rust toolchain identity
        run: |
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Check canonical cognitive.types formatting
        run: cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-cognitive-types -- --check

      - name: Check canonical cognitive.types all targets
        run: cargo check --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types --all-targets

      - name: Lint canonical cognitive.types
        run: cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types --all-targets -- -D warnings

      - name: Test canonical cognitive.types
        run: cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types

      - name: Run bounded canonical decoder fuzz smoke
        run: >-
          cargo test --manifest-path codex-rs/Cargo.toml --locked
          -p codex-hepta-cognitive-types
          bounded_arbitrary_byte_decoder_smoke_covers_all_registered_contracts

      - name: Check canonical cognitive.types fuzz harness
        run: cargo check --manifest-path codex-rs/hepta-cognitive-types/fuzz/Cargo.toml --all-targets

      - name: Check multimodal contract reference formatting
        run: cargo fmt --manifest-path qualification/hnmf-contract-reference/Cargo.toml -- --check

      - name: Check multimodal contract reference targets
        run: cargo check --manifest-path qualification/hnmf-contract-reference/Cargo.toml --all-targets --locked

      - name: Lint multimodal contract reference
        run: cargo clippy --manifest-path qualification/hnmf-contract-reference/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test multimodal contract reference
        run: cargo test --manifest-path qualification/hnmf-contract-reference/Cargo.toml --locked

      - name: Check adversarial runtime reference formatting
        run: cargo fmt --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml -- --check

      - name: Check adversarial runtime reference targets
        run: cargo check --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --all-targets --locked

      - name: Lint adversarial runtime reference
        run: cargo clippy --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test adversarial runtime reference
        run: cargo test --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --locked

      - name: Check deterministic runtime reference formatting
        run: cargo fmt --manifest-path qualification/hnmf-reference/Cargo.toml -- --check

      - name: Check deterministic runtime reference targets
        run: cargo check --manifest-path qualification/hnmf-reference/Cargo.toml --all-targets --locked

      - name: Lint deterministic runtime reference with frozen legacy exemptions
        run: >-
          cargo clippy --manifest-path qualification/hnmf-reference/Cargo.toml
          --all-targets --locked -- -D warnings
          -A clippy::if_same_then_else
          -A clippy::field_reassign_with_default
          -A clippy::assertions_on_constants

      - name: Test deterministic runtime reference
        run: cargo test --manifest-path qualification/hnmf-reference/Cargo.toml --locked
