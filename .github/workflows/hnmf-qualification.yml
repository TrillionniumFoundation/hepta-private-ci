        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: >-
          cargo fmt --manifest-path codex-rs/Cargo.toml
          --package codex-hepta-memory
          --package codex-hepta-agentd -- --check

      - name: Check owner bridge
        id: check_03
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: >-
          cargo check --manifest-path codex-rs/Cargo.toml --locked --all-targets
          -p codex-hepta-memory
          -p codex-hepta-agentd

      - name: Lint owner bridge strictly
        id: check_04
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: >-
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --all-targets
          -p codex-hepta-memory
          -p codex-hepta-agentd -- -D warnings

      - name: Test shared-experience owner
        id: check_05
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: >-
          cargo test --manifest-path codex-rs/Cargo.toml --locked
          -p codex-hepta-memory shared_experience

      - name: Test Agentd product writer canonical binding
        id: check_06
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: >-
          cargo test --manifest-path codex-rs/Cargo.toml --locked
          -p codex-hepta-agentd --test cognitive_store_product_writer

      - name: Test actual Agentd canonical context consumption
        id: canonical_context
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-agentd --lib canonical_recall_tests

      - name: Preserve candidate and actual check outcomes
        if: ${{ always() && steps.check_01.outcome == 'success' }}
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY_OUT'
          import json, os, pathlib
