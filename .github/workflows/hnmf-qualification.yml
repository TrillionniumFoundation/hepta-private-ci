      - name: Check consumer formatting
        id: check_02
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: >-
          cargo fmt --manifest-path codex-rs/Cargo.toml
          --package codex-hepta-cognitive-read
          --package codex-hepta-cognitive-store
          --package codex-hepta-memory-retrieval
          --package codex-hepta-compact-engine
          --package codex-hepta-intelligence -- --check

      - name: Check canonical consumers
        id: check_03
        if: ${{ !cancelled() && steps.check_01.outcome == 'success' }}
        run: >-
          cargo check --manifest-path codex-rs/Cargo.toml --locked --all-targets
          -p codex-hepta-cognitive-read
          -p codex-hepta-cognitive-store
          -p codex-hepta-memory-retrieval
          -p codex-hepta-compact-engine
          -p codex-hepta-intelligence

