name: Hepta NDU v5 learned factorial (development only)
on:
  pull_request:
    paths:
      - 'experiments/multimodal_output_portfolio/v5/**'
      - '.github/workflows/ndu-v5-factorial-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learned-factorial:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact proposed source revision
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          printf 'verified-source-head=%s\n' "$EXPECTED_SOURCE_SHA"
      - name: Verify independent train/inference, utility and observed risk regressions
        working-directory: experiments/multimodal_output_portfolio/v5
        run: |
          python3 -m unittest discover -v -p 'test_*.py'
          python3 -m compileall -q factorial.py test_factorial.py audit_development.py independent_observer.py test_independent_observer.py audit_independent.py
          python3 -m json.tool SOURCE_LOCK.json > /dev/null
          python3 -m json.tool AUDIT_LOCK.json > /dev/null
          python3 audit_development.py
          python3 audit_independent.py
          python3 -m compileall -q factorial_credit_gate.py test_factorial_credit_gate.py
          python3 factorial_credit_gate.py
