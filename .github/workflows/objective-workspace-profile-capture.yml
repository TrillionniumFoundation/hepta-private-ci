name: Capture exact Objective workspace profile

on:
  push:
    branches: [qualification/private-ci-objective-workspace-profile-20261104-gpt6]

permissions:
  contents: read

concurrency:
  group: objective-workspace-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - name: Checkout exact profile capture source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - name: Install exact original compiler
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
      - name: Capture original locked no-deps metadata and full member profile
        run: python3 qualification/objective-workspace-profile-20261104/capture.py --output "$RUNNER_TEMP/objective-workspace-profile"
      - name: Retain every outcome
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: objective-workspace-profile-${{ github.sha }}
          path: ${{ runner.temp }}/objective-workspace-profile
          if-no-files-found: error
          retention-days: 14
      - name: Checkout retained formatter evidence
        if: always()
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0ed8a94285f747ecd3a3707d9034d72882bf2c4b
          path: original-proof
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: qualification/core-fixture-metadata-20261104/first-format-original
      - name: Verify original failed formatter log reconstruction
        if: always()
        run: python3 original-proof/qualification/core-fixture-metadata-20261104/first-format-original/verify.py
