name: ui.native current-source convergence

on:
  push:
    branches: [work/ui-native-current-source-20260925]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-native-current-source-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  candidate:
    name: bind committed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      base: ${{ steps.identity.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'work/ui-native-current-source-20260925' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind canonical exact head and current main
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin             refs/heads/work/ui-native-current-source-20260925:refs/remotes/origin/work/ui-native-current-source-20260925             refs/heads/main:refs/remotes/origin/main
          candidate=$(git rev-parse HEAD)
          if test "$EVENT_NAME" = push; then
            test "$candidate" = "$EVENT_SHA"
          else
            test "$candidate" = "$(git rev-parse refs/remotes/origin/work/ui-native-current-source-20260925)"
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify committed source identity and locks
        run: |
          set -euo pipefail
          python3 apps/hepta-native/tools/prepare_current_source.py --prepare
          python3 apps/hepta-native/tools/prepare_current_source.py
          cargo +1.95.0 metadata --manifest-path apps/hepta-native/Cargo.toml --locked --format-version 1 >/dev/null
          cargo +1.95.0 metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 >/dev/null
          python3 apps/hepta-native/tools/package_unsigned.py --self-test
          test -z "$(git status --porcelain)"
      - name: Verify registries and implementation maps
        run: |
          set -euo pipefail
          python3 scripts/test_hepta_module_registry.py
          python3 scripts/hepta-implementation-maps.py verify --require-current-source
          test -z "$(git status --porcelain)"

  qualify:
    needs: candidate
    name: native-${{ matrix.os }}-${{ matrix.source }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        source: [head, merge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: apps/hepta-native/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.candidate.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact head or deterministic synthetic merge
        env:
          CANDIDATE: ${{ needs.candidate.outputs.candidate }}
          BASE: ${{ needs.candidate.outputs.base }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          if test "$SOURCE" = merge; then
            tree=$(git merge-tree --write-tree "$BASE" "$CANDIDATE")
            export GIT_AUTHOR_NAME=native-qualification
            export GIT_AUTHOR_EMAIL=native-qualification@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
            export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            merge=$(printf '%s\n' 'deterministic ui.native qualification merge' |
              git commit-tree "$tree" -p "$BASE" -p "$CANDIDATE")
            git checkout --detach "$merge"
          fi
          python3 apps/hepta-native/tools/prepare_current_source.py
          test -z "$(git status --porcelain)"
          mkdir -p native-evidence
          {
            printf 'candidate=%s\n' "$CANDIDATE"
            printf 'base=%s\n' "$BASE"
            printf 'source=%s\n' "$SOURCE"
            printf 'checkout=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
          } > native-evidence/source.txt
      - name: Install Linux native dependencies
        id: linux_deps
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libssl-dev desktop-file-utils
      - name: Install pinned Rust toolchain
        id: toolchain
        continue-on-error: true
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify locked dependency graphs
        id: locks
        if: always() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: |
          cargo +1.95.0 metadata --manifest-path apps/hepta-native/Cargo.toml --locked --format-version 1 >/dev/null
          cargo +1.95.0 metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Strict app format
        id: app_format
        if: always() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
      - name: Strict owner-package format
        id: owner_format
        if: always() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: |
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-native-gateway \
            -p codex-hepta-contracts \
            -p codex-hepta-private-state -- --check
      - name: Strict app Clippy
        id: app_lint
        if: always() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: |
          cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml \
            --locked --all-targets --all-features -- -D warnings
      - name: Strict owner-package Clippy
        id: owner_lint
        if: always() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: |
          cargo +1.95.0 clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-native-gateway \
            -p codex-hepta-contracts \
            -p codex-hepta-private-state \
            --all-targets --all-features --no-deps -- -D warnings
      - name: Native application tests
        id: app_tests
        if: always() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: |
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml \
            --locked --all-targets
      - name: Gateway and authority owner tests
        id: owner_tests
        if: always() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: |
          cargo +1.95.0 test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-native-gateway \
            -p codex-hepta-contracts \
            -p codex-hepta-private-state --all-targets --all-features
      - name: Build release product binaries
        id: release
        if: always() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          start=$(python3 -c 'import time; print(time.monotonic_ns())')
          cargo +1.95.0 build --manifest-path apps/hepta-native/Cargo.toml \
            --locked --release --bins
          end=$(python3 -c 'import time; print(time.monotonic_ns())')
          echo "elapsed_ms=$(( (end-start)/1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Release-binary self and crash qualification
        id: faults
        if: always() && steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          binary=apps/hepta-native/target/release/hepta-native
          if test "$RUNNER_OS" = Windows; then binary="${binary}.exe"; fi
          "$binary" --self-test > native-evidence/self-test.json
          "$binary" --qualification-e2e > native-evidence/faults.json
      - name: Create deterministic unsigned platform package
        id: package
        if: always() && steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            macOS) platform=macos ;;
            Windows) platform=windows ;;
            *) exit 2 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) architecture=x86_64 ;;
            ARM64) architecture=aarch64 ;;
            *) architecture=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]') ;;
          esac
          start=$(python3 -c 'import time; print(time.monotonic_ns())')
          python3 apps/hepta-native/tools/package_unsigned.py \
            --platform "$platform" --architecture "$architecture" \
            --release-dir apps/hepta-native/target/release \
            --out-dir native-package > native-evidence/package-output.json
          end=$(python3 -c 'import time; print(time.monotonic_ns())')
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "architecture=$architecture" >> "$GITHUB_OUTPUT"
          echo "elapsed_ms=$(( (end-start)/1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Smoke the packaged main binary
        id: packaged_smoke
        if: always() && steps.package.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) binary='native-package/extracted/HeptaNative.AppDir/usr/bin/hepta-native' ;;
            macOS) binary='native-package/extracted/Hepta Native.app/Contents/MacOS/hepta-native' ;;
            Windows) binary='native-package/extracted/HeptaNative/hepta-native.exe' ;;
            *) exit 2 ;;
          esac
          start=$(python3 -c 'import time; print(time.monotonic_ns())')
          "$binary" --self-test > native-evidence/packaged-self-test.json
          "$binary" --qualification-e2e > native-evidence/packaged-faults.json
          end=$(python3 -c 'import time; print(time.monotonic_ns())')
          echo "elapsed_ms=$(( (end-start)/1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Record actual outcomes and measurements
        if: always()
        env:
          LINUX_DEPS: ${{ steps.linux_deps.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          LOCKS: ${{ steps.locks.outcome }}
          APP_FORMAT: ${{ steps.app_format.outcome }}
          OWNER_FORMAT: ${{ steps.owner_format.outcome }}
          APP_LINT: ${{ steps.app_lint.outcome }}
          OWNER_LINT: ${{ steps.owner_lint.outcome }}
          APP_TESTS: ${{ steps.app_tests.outcome }}
          OWNER_TESTS: ${{ steps.owner_tests.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          FAULTS: ${{ steps.faults.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          PACKAGED_SMOKE: ${{ steps.packaged_smoke.outcome }}
          RELEASE_MS: ${{ steps.release.outputs.elapsed_ms }}
          PACKAGE_MS: ${{ steps.package.outputs.elapsed_ms }}
          SMOKE_MS: ${{ steps.packaged_smoke.outputs.elapsed_ms }}
        run: |
          mkdir -p native-evidence
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          checks = {name: os.environ.get(name, '') for name in [
              'LINUX_DEPS', 'TOOLCHAIN', 'LOCKS', 'APP_FORMAT', 'OWNER_FORMAT',
              'APP_LINT', 'OWNER_LINT', 'APP_TESTS', 'OWNER_TESTS', 'RELEASE',
              'FAULTS', 'PACKAGE', 'PACKAGED_SMOKE']}
          artifacts = {}
          for path in sorted(Path('native-package').glob('*.zip')):
              artifacts[path.name] = {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          receipt = {
              'schema': 'hepta.ui.native.candidate-checks.v2',
              'runnerOs': os.environ['RUNNER_OS'],
              'runnerArch': os.environ['RUNNER_ARCH'],
              'checks': checks,
              'measurements': {
                  'releaseBuildMs': os.environ.get('RELEASE_MS', ''),
                  'packageMs': os.environ.get('PACKAGE_MS', ''),
                  'packagedSmokeMs': os.environ.get('SMOKE_MS', ''),
                  'artifacts': artifacts,
              },
              'physicalHostAcceptance': False,
              'accessibilityAcceptance': False,
              'productionSigningObserved': False,
              'releaseAuthorized': False,
          }
          Path('native-evidence/results.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          if test -f native-package/package-receipt.json; then
            cp native-package/package-receipt.json native-evidence/package-receipt.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-native-${{ matrix.os }}-${{ matrix.source }}-${{ needs.candidate.outputs.candidate }}
          path: |
            native-evidence/
            native-package/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Enforce every applicable qualification gate
        if: always()
        env:
          LINUX_DEPS: ${{ steps.linux_deps.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          LOCKS: ${{ steps.locks.outcome }}
          APP_FORMAT: ${{ steps.app_format.outcome }}
          OWNER_FORMAT: ${{ steps.owner_format.outcome }}
          APP_LINT: ${{ steps.app_lint.outcome }}
          OWNER_LINT: ${{ steps.owner_lint.outcome }}
          APP_TESTS: ${{ steps.app_tests.outcome }}
          OWNER_TESTS: ${{ steps.owner_tests.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          FAULTS: ${{ steps.faults.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          PACKAGED_SMOKE: ${{ steps.packaged_smoke.outcome }}
        run: |
          set -euo pipefail
          test "$TOOLCHAIN" = success
          test "$LOCKS" = success
          test "$APP_FORMAT" = success
          test "$OWNER_FORMAT" = success
          test "$APP_LINT" = success
          test "$OWNER_LINT" = success
          test "$APP_TESTS" = success
          test "$OWNER_TESTS" = success
          test "$RELEASE" = success
          test "$FAULTS" = success
          test "$PACKAGE" = success
          test "$PACKAGED_SMOKE" = success
          if test "$RUNNER_OS" = Linux; then test "$LINUX_DEPS" = success; fi
