name: Hepta RustSec lock resolver (read-only)
on:
  push:
    branches:
      - dot/hepta-rustsec-lock-resolve-20261021

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve compatible patched TLS dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/dot/hepta-rustsec-lock-resolve-20261021'
    steps:
      - name: Checkout immutable solver candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Resolve patched TLS and root store versions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.46
          cargo update -p rustls-webpki --precise 0.103.16
          cargo update -p webpki-roots --precise 1.0.10
          cargo update -p webpki-root-certs --precise 1.0.10
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --stat -- Cargo.lock
      - name: Emit a chunked, integrity-checkable lockfile for review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          raw = Path("codex-rs/Cargo.lock").read_bytes()
          data = base64.b64encode(raw).decode("ascii")
          print(f"HEPTA_LOCK_LENGTH:{len(raw)}")
          print(f"HEPTA_LOCK_SHA256:{hashlib.sha256(raw).hexdigest()}")
          for i in range(0, len(data), 2000):
              print(f"HEPTA_LOCK_CHUNK:{i//2000:05d}:{data[i:i+2000]}")
          print("HEPTA_LOCK_END")
          PY
