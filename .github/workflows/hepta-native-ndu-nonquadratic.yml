name: Native NDU nonquadratic Stem research

on:
  pull_request:
    paths:
      - "codex-rs/hepta-ndu/research/native_stem_abcd/nonquadratic/**"
      - ".github/workflows/hepta-native-ndu-nonquadratic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonquadratic-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test, execute and independently audit complete experiment
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/codex-rs/hepta-ndu/research/native_stem_abcd/nonquadratic"
          OUTPUT="$RUNNER_TEMP/ndu-nonquadratic"
          mkdir -p "$OUTPUT"
          git rev-parse HEAD > "$OUTPUT/SOURCE_SHA.txt"
          python -m pip freeze > "$OUTPUT/ENVIRONMENT.txt"
          cd "$SOURCE"
          python -m compileall -q .
          python -m unittest -v 2>&1 | tee "$OUTPUT/TESTS.log"
          python experiment.py sweep --out "$OUTPUT/runs" 2>&1 | tee "$OUTPUT/SWEEP.log"
          python audit/verify.py --source "$SOURCE" --runs "$OUTPUT/runs" \
            --out "$OUTPUT/verified" 2>&1 | tee "$OUTPUT/AUDIT.log"
          NDU_R5_SOURCE="$SOURCE" NDU_R5_RUNS="$OUTPUT/runs" \
            python audit/test_tamper.py 2>&1 | tee "$OUTPUT/TAMPER.log"
      - name: Preserve complete raw results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ndu-nonquadratic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndu-nonquadratic
          if-no-files-found: error
          retention-days: 14
