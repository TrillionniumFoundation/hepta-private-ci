name: channel.matrix bootstrap export

on:
  push:
    branches: [codex/channel-matrix-convergence-20260925]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: channel-matrix-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply staged local patch atomically
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: apply
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          patch_dir=.github/channel-matrix-local-patch
          if [ ! -d "$patch_dir" ]; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$patch_dir"/part-* > "$RUNNER_TEMP/channel-matrix-local.patch"

          # Prefer exact index/worktree application. The reviewed patch records
          # old blob identities, so the three-way fallback still fails closed
          # on semantic drift rather than guessing around a conflict.
          if git apply --check --index --whitespace=nowarn \
              "$RUNNER_TEMP/channel-matrix-local.patch"; then
            git apply --index --whitespace=nowarn \
              "$RUNNER_TEMP/channel-matrix-local.patch"
          elif git apply --reverse --check --whitespace=nowarn \
              "$RUNNER_TEMP/channel-matrix-local.patch"; then
            echo "reviewed patch is already present; removing staging payload"
          else
            git apply --3way --index --whitespace=nowarn \
              "$RUNNER_TEMP/channel-matrix-local.patch"
          fi

          git rm -r "$patch_dir"
          (
            cd codex-rs
            cargo fmt --all
          )
          git add -A
          git diff --cached --check
          git config user.name 'channel.matrix convergence bot'
          git config user.email 'channel-matrix@users.noreply.github.com'
          git commit -m 'channel.matrix: materialize reviewed closure patch'
          git push origin "HEAD:${TARGET_REF}"
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Reject unapplied staging payload from external forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/channel-matrix-local-patch ]; then
            echo 'channel.matrix staging patch must be materialized on its trusted source branch' >&2
            exit 1
          fi

      - name: Resolve minimal lock delta and execute scoped checks
        id: checks
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/channel-matrix-bootstrap"
          mkdir -p "$out"
          cp codex-rs/Cargo.lock "$out/Cargo.lock.before"
          status=0
          (
            cd codex-rs
            cargo check \
              -p codex-hepta-matrix-protocol \
              -p codex-hepta-matrix-store \
              -p codex-hepta-matrix-sdk \
              -p codex-hepta-matrixd
          ) >"$out/cargo-check.log" 2>&1 || status=$?
          cp codex-rs/Cargo.lock "$out/Cargo.lock"
          git diff -- codex-rs/Cargo.lock > "$out/Cargo.lock.patch"
          if [ "$status" -eq 0 ]; then
            (
              cd codex-rs
              cargo test --no-fail-fast \
                -p codex-hepta-matrix-protocol \
                -p codex-hepta-matrix-store \
                -p codex-hepta-matrix-sdk \
                -p codex-hepta-matrixd
            ) >"$out/cargo-test.log" 2>&1 || status=$?
          else
            : >"$out/cargo-test.log"
          fi
          (
            cd codex-rs
            cargo fmt --all -- --check
          ) >"$out/cargo-fmt.log" 2>&1 || status=$?
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' \
            >"$out/python-tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/check-status.txt"
          exit 0

      - name: Record exact tested source and workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/channel-matrix-bootstrap"
          test -d "$out"
          git status --short > "$out/status.txt"
          git rev-parse HEAD > "$out/source-sha.txt"
          git rev-parse HEAD^{tree} > "$out/source-tree.txt"
          tar --exclude=.git --exclude=target --exclude='*.zip' --exclude='*.tgz' \
            -czf "$out/workspace.tgz" .
          (
            cd "$out"
            shasum -a 256 Cargo.lock.before Cargo.lock Cargo.lock.patch \
              cargo-check.log cargo-test.log cargo-fmt.log python-tests.log \
              check-status.txt source-sha.txt source-tree.txt status.txt \
              workspace.tgz > SHA256SUMS
          )

      - name: Upload exact workspace, minimal lock and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channel-matrix-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel-matrix-bootstrap/
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified scoped lockfile on direct branch runs
        if: github.event_name != 'pull_request'
        id: lock
        env:
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "$RUNNER_TEMP/channel-matrix-bootstrap/check-status.txt")"
          if [ "$status" -ne 0 ] || git diff --quiet -- codex-rs/Cargo.lock; then
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add codex-rs/Cargo.lock
          git diff --cached --check
          git config user.name 'channel.matrix convergence bot'
          git config user.email 'channel-matrix@users.noreply.github.com'
          git commit -m 'channel.matrix: refresh verified scoped lockfile'
          git push origin "HEAD:${TARGET_REF}"
          echo 'committed=true' >> "$GITHUB_OUTPUT"

      - name: Propagate scoped check result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "$RUNNER_TEMP/channel-matrix-bootstrap/check-status.txt")"
          if [ "$status" -ne 0 ]; then
            echo "Scoped Matrix checks failed with status $status" >&2
            exit "$status"
          fi
