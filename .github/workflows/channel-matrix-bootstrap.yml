name: channel.matrix bootstrap export

on:
  push:
    branches:
      - codex/channel-matrix-full-closure-20260927
    paths:
      - '.github/workflows/channel-matrix-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: channel-matrix-registered-repair
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/channel-matrix-full-closure-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: ea6c1e7324d4456e3d1d10620afcf8dcb3c849f8
      STAGING_SHA: ${{ github.sha }}
      BRANCH: codex/channel-matrix-full-closure-20260927
      ORIGINAL_BOOTSTRAP_SHA: c80500c39690e67b7812539ccd4d408f1ed37a9d
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify isolated staging commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STAGING_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort > "$RUNNER_TEMP/staging-paths"
          printf '%s\n' \
            .github/channel-matrix-repair.py \
            .github/workflows/channel-matrix-bootstrap.yml \
            > "$RUNNER_TEMP/expected-staging-paths"
          diff -u "$RUNNER_TEMP/expected-staging-paths" "$RUNNER_TEMP/staging-paths"

      - name: Apply source repair
        run: python3 .github/channel-matrix-repair.py

      - name: Validate operation store and qualification tooling
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --package codex-hepta-operations
          cargo check -p codex-hepta-operations
          cargo clippy --locked -p codex-hepta-operations --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-operations
          cargo fmt --package codex-hepta-operations -- --check
          cd ..
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' -v
          git diff --check

      - name: Restore read-only bootstrap and commit verified result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "$ORIGINAL_BOOTSTRAP_SHA:.github/workflows/channel-matrix-bootstrap.yml" \
            > .github/workflows/channel-matrix-bootstrap.yml
          git rm .github/channel-matrix-repair.py
          git rm .github/workflows/channel-matrix-hardening-apply.yml
          git add \
            .github/workflows/channel-matrix-bootstrap.yml \
            .github/workflows/channel-matrix-preserve-unknown.yml \
            codex-rs/Cargo.lock \
            codex-rs/hepta-operations/Cargo.toml \
            codex-rs/hepta-operations/src/destination_dedupe.rs \
            codex-rs/hepta-operations/src/durable_store.rs \
            codex-rs/hepta-operations/src/lib.rs \
            codex-rs/hepta-operations/src/sqlite.rs \
            scripts/channel_matrix_evidence.py
          git diff --cached --check
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/final-paths"
          while IFS= read -r path; do
            case "$path" in
              .github/channel-matrix-repair.py|\
              .github/workflows/channel-matrix-bootstrap.yml|\
              .github/workflows/channel-matrix-hardening-apply.yml|\
              .github/workflows/channel-matrix-preserve-unknown.yml|\
              codex-rs/Cargo.lock|\
              codex-rs/hepta-operations/Cargo.toml|\
              codex-rs/hepta-operations/src/destination_dedupe.rs|\
              codex-rs/hepta-operations/src/durable_store.rs|\
              codex-rs/hepta-operations/src/lib.rs|\
              codex-rs/hepta-operations/src/sqlite.rs|\
              scripts/channel_matrix_evidence.py) ;;
              *) echo "unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/final-paths"
          for required in \
            .github/workflows/channel-matrix-bootstrap.yml \
            .github/workflows/channel-matrix-preserve-unknown.yml \
            codex-rs/hepta-operations/src/destination_dedupe.rs \
            codex-rs/hepta-operations/src/durable_store.rs \
            codex-rs/hepta-operations/src/sqlite.rs \
            scripts/channel_matrix_evidence.py; do
            grep -Fx "$required" "$RUNNER_TEMP/final-paths" >/dev/null
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'channel.matrix: close exact-candidate qualification gaps' \
            -m 'Route durable operation stores through the repository SQLite policy shim, bind transitive source inputs into evidence, retain exact nextest JUnit cases, and remove temporary mutation workflows after validation.'

          final="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote" = "$STAGING_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$BRANCH"
          echo "FINAL_COMMIT=$final"
