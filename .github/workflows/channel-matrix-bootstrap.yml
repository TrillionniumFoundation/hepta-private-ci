name: channel.matrix bootstrap export

on:
  push:
    branches: [codex/channel-matrix-convergence-20260925]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: channel-matrix-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize reviewed source patch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: materialize
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/channel-matrix-bootstrap"
          mkdir -p "$out"
          : > "$out/patch-apply.log"
          patch_dir=.github/channel-matrix-local-patch
          if [ ! -d "$patch_dir" ]; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          orig_baseline="$RUNNER_TEMP/channel-matrix-existing-orig.txt"
          find . -name '*.orig' -print | sort > "$orig_baseline"
          for part in "$patch_dir"/part-*; do
            candidate="$RUNNER_TEMP/$(basename "$part").patch"
            cat "$part" > "$candidate"
            printf '\n' >> "$candidate"
            status=0
            patch -p1 -N < "$candidate" >>"$out/patch-apply.log" 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              reject_list="$RUNNER_TEMP/rejects-$(basename "$part").txt"
              find . -name '*.rej' -print | sort > "$reject_list"
              if [ ! -s "$reject_list" ]; then
                cat "$out/patch-apply.log" >&2
                exit "$status"
              fi
              while IFS= read -r reject; do
                case "$reject" in
                  ./docs/modules/channel.matrix/*.rej)
                    printf 'prose drift retained for current-source rewrite: %s\n' \
                      "$reject" >>"$out/patch-apply.log"
                    ;;
                  *)
                    cat "$out/patch-apply.log" >&2
                    cat "$reject" >&2
                    exit "$status"
                    ;;
                esac
              done < "$reject_list"
              while IFS= read -r reject; do
                rm -f "$reject"
              done < "$reject_list"
            fi

            orig_after="$RUNNER_TEMP/channel-matrix-orig-after.txt"
            find . -name '*.orig' -print | sort > "$orig_after"
            comm -13 "$orig_baseline" "$orig_after" | while IFS= read -r backup; do
              test -n "$backup" && rm -f "$backup"
            done
          done

          git rm -r "$patch_dir"
          git add -A
          git diff --cached --check
          git config user.name 'channel.matrix convergence bot'
          git config user.email 'channel-matrix@users.noreply.github.com'
          git commit -m 'channel.matrix: materialize reviewed closure patch'
          git push origin "HEAD:${TARGET_REF}"
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Reject staged source from external forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .github/channel-matrix-local-patch

      - name: Repair audited crash-cut fixtures and scoped formatting
        if: github.event_name != 'pull_request'
        env:
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/hepta-matrix-sdk/tests/durable_transport.rs')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  """    let (future, _) = authorizer
                  .authority()
                  .with_verified_use_at_frontier(token, &request.binding, || transport.send(&first))?;
              drop(future);""",
                  """    authorizer
                  .authority()
                  .with_verified_use_at_frontier(token, &request.binding, || ())?;""",
              ),
              (
                  """    let (future, frontier) = authorizer
                  .authority()
                  .with_verified_use_at_frontier(token, &request.binding, || transport.send(&second))?;""",
                  """    let (_, frontier) = authorizer
                  .authority()
                  .with_verified_use_at_frontier(token, &request.binding, || ())?;""",
              ),
              ("revocation_revision: frontier.revision,", "revocation_revision: frontier.revocation_revision,"),
              ("""        || transport.send(&claimed),
              );""", """        || (),
              );"""),
              ("""    drop(future);
              assert!(transport.txn_ids()?.is_empty());
              let durable_second""", """    assert!(transport.txn_ids()?.is_empty());
              let durable_second"""),
              (
                  "final-use nonce has been consumed and adapter entry returned a\n    // lazy future, but Matrix has not durably recorded the claim and the\n    // future has never been polled.",
                  "final-use nonce has been consumed, but no sealed adapter future is\n    // constructed and Matrix has not durably recorded the authority claim.",
              ),
              (
                  "the exact authority claim is durable, but the lazy network future\n    // is still dropped before its first poll.",
                  "the exact authority claim is durable, but the process stops before\n    // constructing or polling a sealed network future.",
              ),
          )
          changed = False
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
                  changed = True
              elif count != 0:
                  raise SystemExit(f'ambiguous audited replacement count {count}: {old[:80]!r}')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY
          (
            cd codex-rs
            cargo fmt \
              --package codex-hepta-matrix-protocol \
              --package codex-hepta-matrix-store \
              --package codex-hepta-matrix-sdk \
              --package codex-hepta-matrixd
          )
          if git diff --quiet -- \
              codex-rs/hepta-matrix-protocol \
              codex-rs/hepta-matrix-store \
              codex-rs/hepta-matrix-sdk \
              codex-rs/hepta-matrixd; then
            exit 0
          fi
          git add \
              codex-rs/hepta-matrix-protocol \
              codex-rs/hepta-matrix-store \
              codex-rs/hepta-matrix-sdk \
              codex-rs/hepta-matrixd
          git diff --cached --check
          git config user.name 'channel.matrix convergence bot'
          git config user.email 'channel-matrix@users.noreply.github.com'
          git commit -m 'channel.matrix: repair crash-cut fixtures and normalize format'
          git push origin "HEAD:${TARGET_REF}"

      - name: Execute scoped native and migration checks
        id: checks
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/channel-matrix-bootstrap"
          mkdir -p "$out"
          cp codex-rs/Cargo.lock "$out/Cargo.lock.before"
          status=0
          (
            cd codex-rs
            cargo check \
              -p codex-hepta-matrix-protocol \
              -p codex-hepta-matrix-store \
              -p codex-hepta-matrix-sdk \
              -p codex-hepta-matrixd
          ) >"$out/cargo-check.log" 2>&1 || status=$?
          cp codex-rs/Cargo.lock "$out/Cargo.lock"
          git diff -- codex-rs/Cargo.lock > "$out/Cargo.lock.patch"
          if [ "$status" -eq 0 ]; then
            (
              cd codex-rs
              cargo test --no-fail-fast \
                -p codex-hepta-matrix-protocol \
                -p codex-hepta-matrix-store \
                -p codex-hepta-matrix-sdk \
                -p codex-hepta-matrixd
            ) >"$out/cargo-test.log" 2>&1 || status=$?
          else
            : >"$out/cargo-test.log"
          fi
          (
            cd codex-rs
            cargo fmt \
              --package codex-hepta-matrix-protocol \
              --package codex-hepta-matrix-store \
              --package codex-hepta-matrix-sdk \
              --package codex-hepta-matrixd \
              -- --check
          ) >"$out/cargo-fmt.log" 2>&1 || status=$?
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' \
            >"$out/python-tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/check-status.txt"
          exit 0

      - name: Record exact workspace and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/channel-matrix-bootstrap"
          mkdir -p "$out"
          git status --short > "$out/status.txt"
          git rev-parse HEAD > "$out/source-sha.txt"
          git rev-parse HEAD^{tree} > "$out/source-tree.txt"
          for file in Cargo.lock.before Cargo.lock Cargo.lock.patch \
              cargo-check.log cargo-test.log cargo-fmt.log python-tests.log \
              check-status.txt patch-apply.log; do
            test -e "$out/$file" || : > "$out/$file"
          done
          tar --exclude=.git --exclude=target --exclude='*.zip' --exclude='*.tgz' \
            -czf "$out/workspace.tgz" .
          (
            cd "$out"
            shasum -a 256 Cargo.lock.before Cargo.lock Cargo.lock.patch \
              cargo-check.log cargo-test.log cargo-fmt.log python-tests.log \
              check-status.txt patch-apply.log source-sha.txt source-tree.txt \
              status.txt workspace.tgz > SHA256SUMS
          )

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channel-matrix-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel-matrix-bootstrap/
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified scoped lockfile
        if: github.event_name != 'pull_request'
        env:
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "$RUNNER_TEMP/channel-matrix-bootstrap/check-status.txt")"
          if [ "$status" -ne 0 ] || git diff --quiet -- codex-rs/Cargo.lock; then
            exit 0
          fi
          git add codex-rs/Cargo.lock
          git diff --cached --check
          git config user.name 'channel.matrix convergence bot'
          git config user.email 'channel-matrix@users.noreply.github.com'
          git commit -m 'channel.matrix: refresh verified scoped lockfile'
          git push origin "HEAD:${TARGET_REF}"

      - name: Propagate scoped result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/channel-matrix-bootstrap/check-status.txt"
          test -s "$status_file"
          status="$(cat "$status_file")"
          if [ "$status" -ne 0 ]; then
            echo "Scoped Matrix checks failed with status $status" >&2
            exit "$status"
          fi
