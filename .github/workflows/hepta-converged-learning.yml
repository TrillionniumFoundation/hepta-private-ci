name: Hepta converged learning qualification (read-only)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence-eval/**"
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-shadow-qualification/**"
      - "tools/hepta-engineering-control/**"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - ".github/workflows/hepta-converged-learning.yml"

permissions:
  contents: read

concurrency:
  group: hepta-converged-learning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Converged learning ARM (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and actual-base merge identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" != "$BASE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}
      - name: Select exact-tree native execution
        id: execution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_candidate.py \
            --source "$SOURCE_SHA" \
            --tested "$(git rev-parse HEAD)" \
            --base "$BASE_SHA" \
            --lane "${{ matrix.lane }}" \
            --github-output "$GITHUB_OUTPUT"
          # Measure only affected ledger inputs, not unrelated learning edits.
          set +e
          git diff --quiet "$BASE_SHA" HEAD -- codex-rs/hepta-learning-ledger/ codex-rs/hepta-types/ codex-rs/Cargo.toml codex-rs/Cargo.lock .github/workflows/hepta-converged-learning.yml
          ledger_diff=$?
          set -e
          case "$ledger_diff" in
            0) echo 'measure_ledger=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'measure_ledger=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$ledger_diff" ;;
          esac
      - name: Verify Cargo lockfile integrity
        run: python3 scripts/verify_cargo_lock.py
      - name: Formatting without tested-source mutation
        id: formatting
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cargo fmt --package codex-hepta-learning-ledger --package codex-hepta-learning-artifacts --package codex-hepta-intelligence-eval --package codex-hepta-neuron --package codex-hepta-ndu --package codex-hepta-shadow-qualification -- --check >"$RUNNER_TEMP/hepta-learning-rustfmt.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/hepta-learning-rustfmt.txt"
          exit "$status"
      - name: Retain actionable formatting diagnostics
        if: always() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-learning-rustfmt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-learning-rustfmt.txt
          if-no-files-found: error
          retention-days: 7
      - name: Install pinned repository test tools
        if: steps.execution.outputs.run_native == 'true'
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve Cargo lockfile exactly or expose resolver drift
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo metadata --locked --format-version=1 >/dev/null
          locked_status=$?
          set -e
          if [ "$locked_status" -eq 0 ]; then
            exit 0
          fi
          echo "::error::Cargo.lock differs from the exact candidate manifests"
          set +e
          cargo metadata --offline --format-version=1 >/dev/null
          offline_status=$?
          set -e
          git diff -- Cargo.lock
          git checkout -- Cargo.lock
          if [ "$offline_status" -ne 0 ]; then
            echo "::warning::offline resolver could not fully materialize cached dependencies; source checkout restored"
          fi
          exit "$locked_status"
      - name: Original and added component regressions
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-learning-ledger -p codex-hepta-learning-artifacts -p codex-hepta-intelligence-eval -p codex-hepta-neuron -p codex-hepta-ndu
      - name: Real-file cross-crate qualification
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-shadow-qualification --test durable_learning_roundtrip
      - name: Strict selected-package Clippy
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-learning-ledger -p codex-hepta-learning-artifacts -p codex-hepta-intelligence-eval -p codex-hepta-neuron -p codex-hepta-ndu -p codex-hepta-shadow-qualification --all-targets -- -D warnings
      - name: Measure bounded long-horizon file behavior
        id: ledger_measure
        if: steps.execution.outputs.run_native == 'true' && steps.execution.outputs.measure_ledger == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hepta-long-horizon-measurement"
          mkdir -p "$out"
          { git rev-parse HEAD HEAD^{tree}; rustc --version; uname -sm; } > "$out/environment.txt"
          cargo build --locked --release -p codex-hepta-learning-ledger --example long_horizon_scale
          sha256sum target/release/examples/long_horizon_scale > "$out/binary.sha256"
          timeout 180s target/release/examples/long_horizon_scale 10000 "$RUNNER_TEMP/hepta-long-horizon-data" | tee "$out/measurements.jsonl"
      - name: Retain real-file measurements
        if: always() && steps.ledger_measure.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-long-horizon-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-long-horizon-measurement/
          if-no-files-found: error
          retention-days: 7
      - name: Unmodified source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
