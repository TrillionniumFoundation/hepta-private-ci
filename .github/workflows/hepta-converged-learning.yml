name: Hepta converged learning qualification (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/architecture-scalability-convergence-20260918
    paths:
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence-eval/**"
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-shadow-qualification/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain*"
      - "tools/hepta-engineering-control/**"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - ".github/scripts/check_ci_results.py"
      - ".github/workflows/hepta-converged-learning.yml"
  pull_request:
    paths:
      - "codex-rs/hepta-learning-ledger/**"
      - "codex-rs/hepta-learning-artifacts/**"
      - "codex-rs/hepta-intelligence-eval/**"
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-shadow-qualification/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain*"
      - "tools/hepta-engineering-control/**"
      - "scripts/verify_cargo_lock.py"
      - "scripts/test_verify_cargo_lock.py"
      - ".github/scripts/check_ci_results.py"
      - ".github/workflows/hepta-converged-learning.yml"

permissions:
  contents: read

concurrency:
  group: hepta-converged-learning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  formatting:
    name: Converged learning formatting (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","synthetic-merge"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.lane == 'source-head' && env.SOURCE_SHA || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact formatting candidate
        env:
          EXPECTED_SHA: ${{ matrix.lane == 'source-head' && env.SOURCE_SHA || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            test "$(git show -s --format=%P HEAD)" = "$BASE_SHA $SOURCE_SHA"
            test "$(git rev-parse HEAD^{tree})" = "$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          fi
      - name: Formatting without tested-source mutation
        id: formatting
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cargo fmt --package codex-hepta-learning-ledger --package codex-hepta-learning-artifacts --package codex-hepta-intelligence-eval --package codex-hepta-neuron --package codex-hepta-ndu --package codex-hepta-shadow-qualification -- --check >"$RUNNER_TEMP/hepta-learning-rustfmt.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/hepta-learning-rustfmt.txt"
          exit "$status"
      - name: Retain actionable formatting diagnostics
        if: always() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-learning-rustfmt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-learning-rustfmt.txt
          if-no-files-found: error
          retention-days: 7
      - name: Unmodified source
        if: always()
        run: |
          git diff --check
          git diff --exit-code

  qualification:
    name: Converged learning ARM (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","synthetic-merge"]' || '["source-head"]') }}
    steps:
      - name: Checkout exact candidate without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.lane == 'source-head' && env.SOURCE_SHA || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and GitHub prospective merge identities
        env:
          EXPECTED_SHA: ${{ matrix.lane == 'source-head' && env.SOURCE_SHA || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            # Retain the historical lane name, but test GitHub's actual merge
            # commit and independently reconstruct its exact tree and parents.
            test "$(git show -s --format=%P HEAD)" = "$BASE_SHA $SOURCE_SHA"
            test "$(git rev-parse HEAD^{tree})" = "$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          else
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
              BASE_SHA="$(git rev-parse "$SOURCE_SHA^")"
              printf 'BASE_SHA=%s\n' "$BASE_SHA" >> "$GITHUB_ENV"
            fi
          fi
          git rev-parse HEAD HEAD^{tree}
      - name: Select exact-tree native execution
        id: execution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_candidate.py \
            --source "$SOURCE_SHA" \
            --tested "$(git rev-parse HEAD)" \
            --base "$BASE_SHA" \
            --lane "${{ matrix.lane }}"
          # This qualification intentionally executes both exact source and the
          # actual GitHub merge candidate. Tree equality may share immutable
          # metadata checks elsewhere, but it is not a process-execution receipt.
          echo 'run_native=true' >> "$GITHUB_OUTPUT"
          set +e
          git diff --quiet "$BASE_SHA" HEAD -- codex-rs/hepta-learning-ledger/ codex-rs/hepta-types/ codex-rs/Cargo.toml codex-rs/Cargo.lock .github/workflows/hepta-converged-learning.yml
          ledger_diff=$?
          set -e
          case "$ledger_diff" in
            0) echo 'measure_ledger=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'measure_ledger=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$ledger_diff" ;;
          esac
      - name: Source candidate and evidence-binding regressions without activation
        if: steps.execution.outputs.run_native == 'true'
        run: python3 -m unittest discover -v -s tools/hepta-engineering-control -p 'test_*.py'
      - name: Verify Cargo lockfile integrity
        run: python3 scripts/verify_cargo_lock.py
      - name: Install pinned repository test tools
        if: steps.execution.outputs.run_native == 'true'
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve Cargo lockfile exactly or expose resolver drift
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo metadata --locked --format-version=1 >/dev/null
          locked_status=$?
          set -e
          if [ "$locked_status" -eq 0 ]; then
            exit 0
          fi
          echo "::error::Cargo.lock differs from the exact candidate manifests"
          set +e
          cargo metadata --offline --format-version=1 >/dev/null
          offline_status=$?
          set -e
          git diff -- Cargo.lock
          git checkout -- Cargo.lock
          if [ "$offline_status" -ne 0 ]; then
            echo "::warning::offline resolution incomplete; source checkout restored"
          fi
          exit "$locked_status"
      - name: Original and added component regressions
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-learning-ledger -p codex-hepta-learning-artifacts -p codex-hepta-intelligence-eval -p codex-hepta-neuron -p codex-hepta-ndu
      - name: Real-file cross-crate qualification
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-shadow-qualification --test durable_learning_roundtrip
      - name: Measure bounded long-horizon file behavior
        id: ledger_measure
        if: steps.execution.outputs.run_native == 'true' && steps.execution.outputs.measure_ledger == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hepta-long-horizon-measurement"
          mkdir -p "$out"
          { git rev-parse HEAD HEAD^{tree}; rustc --version; uname -sm; } > "$out/environment.txt"
          cargo build --locked --release -p codex-hepta-learning-ledger --example target_host_qualification
          binary=target/release/examples/target_host_qualification
          sha256sum "$binary" > "$out/binary.sha256"
          # Run the real segmented writer/recovery harness at increasing retained
          # histories. Each run measures append, rotation, indexed lookup, exact
          # reopen and historical idempotent retry against durable files.
          : > "$out/measurements.jsonl"
          for records in 100 1000 10000 100000; do
            data="$RUNNER_TEMP/hepta-long-horizon-data-$records"
            mkdir -p "$data"
            HEPTA_TARGET_HOST_ID="github-arm-${{ matrix.lane }}-$records" \
            HEPTA_LEDGER_RECORDS="$records" \
            HEPTA_LEDGER_SEGMENT_RECORDS=128 \
            HEPTA_LEDGER_QUAL_ROOT="$data" \
              timeout 600s "$binary" | python3 -c \
                'import json,sys; print(json.dumps(json.load(sys.stdin), sort_keys=True))' \
                | tee -a "$out/measurements.jsonl"
          done
      - name: Retain real-file measurements
        if: always() && steps.ledger_measure.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-long-horizon-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/hepta-long-horizon-measurement/
          if-no-files-found: error
          retention-days: 7
      - name: Strict selected-package Clippy
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-learning-ledger -p codex-hepta-learning-artifacts -p codex-hepta-intelligence-eval -p codex-hepta-neuron -p codex-hepta-ndu -p codex-hepta-shadow-qualification --all-targets -- -D warnings
      - name: Unmodified source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  qualification-result:
    name: Converged learning result
    if: ${{ always() }}
    needs: [formatting, qualification]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Require format and behavior lanes
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_NEEDS: '["formatting","qualification"]'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 .github/scripts/check_ci_results.py
