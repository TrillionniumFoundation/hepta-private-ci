name: Neuron exact repair once
# Two-phase bounded closure: expose the exact candidate, then validate and finalize it.

on:
  push:
    branches:
      - codex/neuron-runtime-durable-closure-v1
    paths:
      - '.github/workflows/neuron-exact-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neuron-exact-repair-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and publish the bounded candidate
        id: candidate
        env:
          BRANCH: codex/neuron-runtime-durable-closure-v1
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/neuron-runtime-closure.patch.gz.b64
          test "$(wc -c < "$payload" | tr -d ' ')" -eq 10460
          PAYLOAD="$payload" OUTPUT="$RUNNER_TEMP/neuron-runtime-closure.patch" python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          payload = Path(os.environ['PAYLOAD']).read_bytes()
          decoded = gzip.decompress(base64.b64decode(payload, validate=True))
          digest = hashlib.sha256(decoded).hexdigest()
          expected = 'cdb08028134c553c07abd8404e0d05046657c2233c847f23235abcab23fb2d55'
          if digest != expected:
              raise SystemExit(f'patch digest mismatch: {digest}')
          Path(os.environ['OUTPUT']).write_bytes(decoded)
          PY
          git apply --check "$RUNNER_TEMP/neuron-runtime-closure.patch"
          git apply "$RUNNER_TEMP/neuron-runtime-closure.patch"
          grep -F 'codex-hepta-neuron = { path = "../hepta-neuron" }' \
            codex-rs/hepta-infer-worker-host/Cargo.toml
          test -f docs/modules/neuron.runtime/GAP_ANALYSIS.md
          python3 - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          allowed = {
              'codex-rs/hepta-neuron/src/sparse.rs',
              'codex-rs/hepta-neuron/src/runtime_v2.rs',
              'codex-rs/hepta-neuron/src/runtime_v2_lifecycle.rs',
              'codex-rs/hepta-neuron/src/runtime_v2_tests.rs',
              'docs/modules/neuron.runtime/README.md',
              'docs/modules/neuron.runtime/TECHNICAL.md',
              'docs/modules/neuron.runtime/V2_DEVELOPMENT.md',
              'docs/modules/neuron.runtime/V2_RUNBOOK.md',
              'docs/modules/neuron.runtime/GAP_ANALYSIS.md',
              'qualification/module-execution-dossiers/detail/neuron.runtime.md',
          }
          unexpected = sorted(changed.difference(allowed))
          if unexpected:
              raise SystemExit('unexpected repair paths: ' + ', '.join(unexpected))
          required = {
              'codex-rs/hepta-neuron/src/sparse.rs',
              'codex-rs/hepta-neuron/src/runtime_v2.rs',
              'codex-rs/hepta-neuron/src/runtime_v2_lifecycle.rs',
              'codex-rs/hepta-neuron/src/runtime_v2_tests.rs',
              'docs/modules/neuron.runtime/V2_DEVELOPMENT.md',
              'docs/modules/neuron.runtime/GAP_ANALYSIS.md',
          }
          missing = sorted(required.difference(changed))
          if missing:
              raise SystemExit('required paths unchanged: ' + ', '.join(missing))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(neuron): stage canonical checkpoint closure'
          candidate_head="$(git rev-parse HEAD)"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "head=$candidate_head" >> "$GITHUB_OUTPUT"

      - name: Validate the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          {
            cd codex-rs
            cargo fmt --package codex-hepta-neuron
            cargo metadata --locked --format-version 1 --no-deps >/dev/null
            packages=(
              -p codex-hepta-neuron
              -p codex-hepta-infer-core
              -p codex-hepta-infer-worker-host
              -p codex-hepta-agentd
              -p codex-hepta-intelligence
            )
            cargo check --locked "${packages[@]}" --all-targets
            cargo test --locked "${packages[@]}"
            cargo clippy --locked "${packages[@]}" --all-targets --no-deps -- -D warnings
            cargo fmt --package codex-hepta-neuron -- --check
            cd ..
            PYTHONPATH=scripts/neuron python3 -m unittest discover \
              -s scripts/neuron -p 'test_*.py'
            python3 -m json.tool docs/modules/neuron.runtime/IMPLEMENTATION_MAP.json >/dev/null
            git diff --check
          } 2>&1 | tee "$RUNNER_TEMP/neuron-runtime-validation.log"

      - name: Retain exact validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuron-runtime-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/neuron-runtime-validation.log
          if-no-files-found: warn
          retention-days: 14

      - name: Finalize only the validated closure
        env:
          BRANCH: codex/neuron-runtime-durable-closure-v1
          CANDIDATE_HEAD: ${{ steps.candidate.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/neuron-exact-repair-once.yml \
            .github/neuron-runtime-closure.patch.gz.b64
          git add -A
          git commit -m 'chore(neuron): finalize validated runtime closure'
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$CANDIDATE_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"