name: Native NDU nonproduct symmetry certificate
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-ndu/research/native_stem_abcd/nonproduct_symmetry/**'
      - '.github/workflows/hepta-native-ndu-nonproduct-symmetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate-and-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Reproduce exact rational proof and 64 fresh fits
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/codex-rs/hepta-ndu/research/native_stem_abcd/nonproduct_symmetry"
          OUT="$RUNNER_TEMP/native-ndu-nonproduct-r17"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/SOURCE_SHA.txt"
          python -m pip freeze > "$OUT/ENVIRONMENT.txt"
          cd "$SRC"
          python -m unittest -v test_math 2>&1 | tee "$OUT/MATH_TESTS.log"
          python certificate.py > "$OUT/CERTIFICATE.json"
          python run.py sweep --out "$OUT/runs" 2>&1 | tee "$OUT/SWEEP.log"
          python audit.py --runs "$OUT/runs" --out "$OUT/verified" 2>&1 | tee "$OUT/AUDIT.log"
          R17_RUNS="$OUT/runs" python -O -m unittest -v test_tamper 2>&1 | tee "$OUT/TAMPER.log"
      - name: Retain all source and negative outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-r17-nonproduct-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ndu-nonproduct-r17
          if-no-files-found: error
          retention-days: 14
