name: cognitive-types-one-shot-repair

on:
  push:
    branches:
      - 'codex/cognitive-types-full-closure-20260927'
    paths:
      - '.github/workflows/cognitive-types-working-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cognitive-types-one-shot-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Refuse stale or redirected execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/cognitive-types-full-closure-20260927 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Repair logical-identity validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-cognitive-types/src/hnmf_learning.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "use std::collections::BTreeMap;\nuse std::collections::BTreeSet;",
              "use std::cmp::Ordering;\nuse std::collections::BTreeMap;\nuse std::collections::BTreeSet;",
          )

          replace_once(
              '        ensure_strict_order(&self.selected_events, "selectedEvents")?;\n'
              '        ensure_strict_order(&self.active_nodes, "activeNodes")?;\n'
              '        ensure_strict_order(&self.activation_paths, "activationPaths")?;\n'
              '        ensure_strict_order(&self.contradictions, "contradictions")?;',
              '        ensure_strict_order_by(&self.selected_events, "selectedEvents", |left, right| {\n'
              '            (&left.event_id, left.revision).cmp(&(&right.event_id, right.revision))\n'
              '        })?;\n'
              '        ensure_strict_order_by(&self.active_nodes, "activeNodes", |left, right| {\n'
              '            left.node_id.cmp(&right.node_id)\n'
              '        })?;\n'
              '        ensure_strict_order_by(&self.activation_paths, "activationPaths", |left, right| {\n'
              '            (&left.source_node_id, &left.target_node_id, left.relation).cmp(&(\n'
              '                &right.source_node_id,\n'
              '                &right.target_node_id,\n'
              '                right.relation,\n'
              '            ))\n'
              '        })?;\n'
              '        ensure_strict_order_by(&self.contradictions, "contradictions", |left, right| {\n'
              '            (&left.left_node_id, &left.right_node_id)\n'
              '                .cmp(&(&right.left_node_id, &right.right_node_id))\n'
              '        })?;',
          )

          replace_once(
              '        ensure_strict_order(&self.weight_proposals, "weightProposals")?;\n'
              '        ensure_strict_order(&self.threshold_proposals, "thresholdProposals")?;',
              '        ensure_strict_order_by(&self.weight_proposals, "weightProposals", |left, right| {\n'
              '            (&left.source_node_id, &left.target_node_id, left.relation).cmp(&(\n'
              '                &right.source_node_id,\n'
              '                &right.target_node_id,\n'
              '                right.relation,\n'
              '            ))\n'
              '        })?;\n'
              '        ensure_strict_order_by(\n'
              '            &self.threshold_proposals,\n'
              '            "thresholdProposals",\n'
              '            |left, right| left.node_id.cmp(&right.node_id),\n'
              '        )?;',
          )

          replace_once(
              '        ensure_strict_order(&self.nodes, "topologyNodes")?;\n'
              '        ensure_strict_order(&self.edges, "topologyEdges")?;',
              '        ensure_strict_order_by(&self.nodes, "topologyNodes", |left, right| {\n'
              '            left.node_id.cmp(&right.node_id)\n'
              '        })?;\n'
              '        ensure_strict_order_by(&self.edges, "topologyEdges", |left, right| {\n'
              '            (&left.source_node_id, &left.target_node_id, left.relation).cmp(&(\n'
              '                &right.source_node_id,\n'
              '                &right.target_node_id,\n'
              '                right.relation,\n'
              '            ))\n'
              '        })?;',
          )

          replace_once(
              '        ensure_strict_order(&self.retired_synapses, "retiredSynapses")?;',
              '        ensure_strict_order_by(&self.retired_synapses, "retiredSynapses", |left, right| {\n'
              '            (&left.source_node_id, &left.target_node_id, left.relation).cmp(&(\n'
              '                &right.source_node_id,\n'
              '                &right.target_node_id,\n'
              '                right.relation,\n'
              '            ))\n'
              '        })?;',
          )

          replace_once(
              'fn ensure_strict_order<T: Ord>(values: &[T], field: &\'static str) -> Result<(), HnmfContractError> {\n'
              '    if values.windows(2).any(|pair| pair[0] >= pair[1]) {\n'
              '        return Err(HnmfContractError::Invalid(field));\n'
              '    }\n'
              '    Ok(())\n'
              '}',
              'fn ensure_strict_order<T: Ord>(values: &[T], field: &\'static str) -> Result<(), HnmfContractError> {\n'
              '    ensure_strict_order_by(values, field, Ord::cmp)\n'
              '}\n\n'
              'fn ensure_strict_order_by<T, F>(\n'
              '    values: &[T],\n'
              '    field: &\'static str,\n'
              '    mut compare: F,\n'
              ') -> Result<(), HnmfContractError>\n'
              'where\n'
              '    F: FnMut(&T, &T) -> Ordering,\n'
              '{\n'
              '    for pair in values.windows(2) {\n'
              '        match compare(&pair[0], &pair[1]) {\n'
              '            Ordering::Less => {}\n'
              '            Ordering::Equal => {\n'
              '                return Err(HnmfContractError::DuplicateIdentity { field });\n'
              '            }\n'
              '            Ordering::Greater => {\n'
              '                return Err(HnmfContractError::NonCanonicalOrder { field });\n'
              '            }\n'
              '        }\n'
              '    }\n'
              '    Ok(())\n'
              '}',
          )

          path.write_text(text)
          PY

          # The bootstrap workflow must not survive into the repaired candidate.
          rm .github/workflows/cognitive-types-working-copy.yml

      - name: Verify cross-language vectors
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/cognitive-types-v1/verify_vectors.py
          python3 qualification/cognitive-types-v2/verify_vectors.py

      - name: Format and compile canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-cognitive-types -- --check
          cargo check --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types --all-targets

      - name: Strict lint canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types --all-targets -- -D warnings

      - name: Test canonical contracts and negative vectors
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-cognitive-types bounded_arbitrary_byte_decoder_smoke_covers_all_registered_contracts
          cargo check --manifest-path codex-rs/hepta-cognitive-types/fuzz/Cargo.toml --all-targets

      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          git status --short
          git config user.name "Tomasrgbsf"
          git config user.email "tomasbraynt@gmail.com"
          git add codex-rs/hepta-cognitive-types/src/hnmf_learning.rs
          git add -u .github/workflows/cognitive-types-working-copy.yml
          git commit -m "fix(cognitive.types): enforce logical identity uniqueness"
          git push origin HEAD:refs/heads/codex/cognitive-types-full-closure-20260927
