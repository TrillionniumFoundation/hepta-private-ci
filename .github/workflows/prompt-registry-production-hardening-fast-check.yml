name: Prompt registry production hardening fast check

on:
  push:
    branches: [ops/prompt-registry-production-hardening-author-20260929]
    paths:
      - .github/workflows/prompt-registry-production-hardening-fast-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/prompt-registry-production-hardening-20260929
      TARGET_SHA: 8e801ed8711107d08d4e4a279db41b28617d2d7a
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact target and apply reviewed patch
        shell: bash
        env:
          AUTHOR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${AUTHOR_SHA}/.github/patches/prompt-registry-production-hardening-stage-a.patch.gz.b64" \
            | base64 --decode | gzip --decompress > "$RUNNER_TEMP/stage-a.patch"
          git apply --check "$RUNNER_TEMP/stage-a.patch"
          git apply "$RUNNER_TEMP/stage-a.patch"
          git diff --check
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Format and check focused crates
        working-directory: codex-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked -p codex-hepta-prompt-extension --all-targets
          cargo check --locked -p codex-hepta-agentd --all-targets
