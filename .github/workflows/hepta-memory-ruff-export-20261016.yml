name: MemoryCell exact Ruff repair exporter
on:
  push:
    branches:
      - "research/memorycell-ruff-diagnostics-20261016"
permissions:
  contents: read
concurrency:
  group: memory-ruff-exact-20261016
  cancel-in-progress: false
jobs:
  format-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source revision and pinned formatter
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install ruff==0.15.8
          mkdir -p /tmp/memory-ruff-export/original /tmp/memory-ruff-export/formatted
          ruff --version > /tmp/memory-ruff-export/ruff-version.txt
          git rev-parse HEAD > /tmp/memory-ruff-export/diagnostic-head.txt
          git rev-parse HEAD^ > /tmp/memory-ruff-export/source-base.txt
      - name: Export exact AST-preserving source formatting
        run: |
          set -euo pipefail
          cat > /tmp/memory-ruff-files.txt <<'EOF'
          scripts/memory_cell/deno_binary_git_source_gate.py
          scripts/memory_cell/deno_lossy_projection_proof.py
          scripts/memory_cell/matched_structured_rag_gate.py
          scripts/memory_cell/ten_project_source_closure.py
          scripts/memory_cell/test_deno_binary_git_source_gate.py
          scripts/memory_cell/test_deno_lossy_projection_proof.py
          scripts/memory_cell/test_ten_project_source_closure.py
          EOF
          while IFS= read -r file; do
            test -f "$file"
            mkdir -p "/tmp/memory-ruff-export/original/$(dirname "$file")"
            cp "$file" "/tmp/memory-ruff-export/original/$file"
          done < /tmp/memory-ruff-files.txt
          xargs -r ruff format < /tmp/memory-ruff-files.txt
          xargs -r ruff format --check < /tmp/memory-ruff-files.txt
          python3 - <<'PY'
          import ast
          import hashlib
          from pathlib import Path
          import subprocess
          root = Path('/tmp/memory-ruff-export')
          source_files = sorted((root / 'original/scripts/memory_cell').glob('*.py'))
          assert len(source_files) == 7
          for old in source_files:
              relative = old.relative_to(root / 'original')
              new = Path(relative)
              before, after = old.read_bytes(), new.read_bytes()
              if ast.dump(ast.parse(before), include_attributes=False) != ast.dump(
                  ast.parse(after), include_attributes=False
              ):
                  raise ValueError('formatter altered Python AST: ' + str(relative))
              expected = hashlib.sha1(
                  b'blob ' + str(len(before)).encode() + b'\0' + before
              ).hexdigest()
              check = subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD^:' + relative.as_posix()], text=True
              ).strip()
              if expected != check:
                  raise ValueError('original Git file blob changed: ' + str(relative))
              dest = root / 'formatted' / relative
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(after)
          PY
          git diff -- scripts/memory_cell/deno_binary_git_source_gate.py scripts/memory_cell/deno_lossy_projection_proof.py scripts/memory_cell/matched_structured_rag_gate.py scripts/memory_cell/ten_project_source_closure.py scripts/memory_cell/test_deno_binary_git_source_gate.py scripts/memory_cell/test_deno_lossy_projection_proof.py scripts/memory_cell/test_ten_project_source_closure.py > /tmp/memory-ruff-export/ruff.patch
          test -s /tmp/memory-ruff-export/ruff.patch
          (cd /tmp/memory-ruff-export && find formatted original -type f -print0 | sort -z | xargs -0 sha256sum > FORMAT-SHA256SUMS)
      - name: Archive exact formatter source and diagnostic patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-ruff-ast-preserving-20261016
          path: /tmp/memory-ruff-export/
          if-no-files-found: error
