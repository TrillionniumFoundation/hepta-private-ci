name: Hepta Windows private storage qualification

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "research/wsp-windows-fixtures-*"
      - "research/wsp-dependency-*"
    paths:
      - ".github/workflows/hepta-windows-durable-fixtures.yml"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/utils/path-utils/**"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/hepta-bao-adapter/**"
      - "codex-rs/state/src/sqlite*"
      - "codex-rs/third_party/libsqlite3-sys-0.39.1/**"
      - "qualification/ci-remediation/windows-sqlite-owner-vfs-20261124/**"
      - "codex-rs/hepta-automation/src/store.rs"
      - "codex-rs/hepta-matrix-store/src/store.rs"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/src/cognitive_retrieval_learning_tests.rs"
      - "codex-rs/hepta-authbus/src/authority_schema_tests.rs"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: hepta-windows-durable-fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Set the runner-local target directory
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$env:RUNNER_TEMP/hepta-durable-target" >> $env:GITHUB_ENV'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Resolve the repository toolchain
        id: toolchain
        shell: pwsh
        run: |
          python -c 'import pathlib,tomllib; print("channel=" + tomllib.loads(pathlib.Path("codex-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"])' >> $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Qualify the actual bundled Windows SQLite owner VFS
        working-directory: codex-rs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hepta-sqlite-owner-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $qualification = Resolve-Path '../qualification/ci-remediation/windows-sqlite-owner-vfs-20261124'
          $probe = Join-Path $qualification 'native-probe'
          git rev-parse HEAD | Set-Content -Encoding utf8 (Join-Path $evidence 'source-head.txt')
          rustc -Vv | Set-Content -Encoding utf8 (Join-Path $evidence 'rustc.txt')
          Copy-Item (Join-Path $probe 'Cargo.lock') (Join-Path $evidence 'probe-Cargo.lock')
          cargo metadata --locked --manifest-path (Join-Path $probe 'Cargo.toml') --format-version 1 | Set-Content -Encoding utf8 (Join-Path $evidence 'dependency-metadata.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          just test --manifest-path (Join-Path $probe 'Cargo.toml') --config-file (Join-Path $probe 'nextest.toml') --locked --lib --success-output immediate --failure-output immediate 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'native-owner-vfs.log')
          $nativeExit = $LASTEXITCODE
          python (Join-Path $qualification 'probe_receipt.py') --evidence $evidence --test-exit $nativeExit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit $nativeExit
      - name: Preserve early SQLite owner VFS qualification
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-sqlite-owner-vfs-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-sqlite-owner-evidence
          if-no-files-found: error
      - name: Qualify native private handles against synthetic attacks
        if: success() || failure()
        working-directory: codex-rs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hepta-durable-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $evidence 'head.txt')
          rustc -vV | Set-Content (Join-Path $evidence 'rustc.txt')
          just test -p codex-utils-path --lib --locked windows_private::tests:: --success-output immediate --failure-output immediate 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'native-primitives.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify private registry ownership and post-rename poisoning
        if: success() || failure()
        working-directory: codex-rs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hepta-durable-evidence'
          just test -p codex-hepta-prompt-registry --lib --locked durable::windows_tests:: 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'registry-native.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload primitive evidence before consumer builds
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-windows-primitives-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-durable-evidence/head.txt
            ${{ runner.temp }}/hepta-durable-evidence/rustc.txt
            ${{ runner.temp }}/hepta-durable-evidence/native-primitives.log
            ${{ runner.temp }}/hepta-durable-evidence/registry-native.log
          if-no-files-found: error
          retention-days: 14
      - name: Verify native SQLite source identity and immutable cold images
        if: success() || failure()
        working-directory: codex-rs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hepta-durable-evidence'
          just test -p codex-state --lib --locked -E 'test(sqlite_recovery::)' --success-output immediate --failure-output immediate 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'sqlite-recovery.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify cognitive current-cut recovery and ordinary private store behavior
        if: success() || failure()
        working-directory: codex-rs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hepta-durable-evidence'
          just test -p codex-hepta-memory --lib --locked -E 'test(cognitive_store::recovery::) | test(cognitive_store_tests::)' --success-output immediate --failure-output immediate 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'cognitive-recovery.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real directory flushes and copied-file schema validation
        if: success() || failure()
        working-directory: codex-rs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hepta-durable-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $evidence 'head.txt')
          rustc -vV | Set-Content (Join-Path $evidence 'rustc.txt')
          just test -p codex-hepta-intelligence -p codex-hepta-agentd -p codex-hepta-authbus -p codex-hepta-bao-adapter --lib --locked -E 'test(evaluated_shadow::tests::) | test(outcome_credit_v2::tests::) | test(cognitive_retrieval_learning::tests::) | test(authority_schema::tests::) | test(lease_lifecycle::tests::)' 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise prompt delivery and final-use owners on native storage
        if: success() || failure()
        working-directory: codex-rs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hepta-durable-evidence'
          just test -p codex-hepta-intelligence -p codex-hepta-agentd --lib --locked -E 'test(prompt_delivery::tests::) | test(prompt_runtime::tests::)' 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'prompt-consumers.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the changed native backend with scoped Clippy fixes
        if: success() || failure()
        working-directory: codex-rs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hepta-durable-evidence'
          just fix -p codex-utils-path -p codex-hepta-prompt-registry -p codex-hepta-contracts -p codex-hepta-bao-adapter -p codex-state -p codex-hepta-memory --locked 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'native-clippy.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'native-clippy-diff.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload exact-source results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-windows-durable-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-durable-evidence
          if-no-files-found: error
          retention-days: 14
