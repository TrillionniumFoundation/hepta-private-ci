name: cognitive-types-semantic-merge

on:
  push:
    branches:
      - codex/cognitive-types-full-closure-20260927
    paths:
      - .github/workflows/cognitive-types-semantic-merge.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/cognitive-types-full-closure-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Apply convergence delta with the common main base
        shell: bash
        run: |
          set -euo pipefail
          base=a126987b84737dbc2ee2592442a314117bddb4a2
          convergence=e3043fd1f69e95400f17dbdb85afce29ab619ba0
          paths=(
            codex-rs/hepta-cognitive-read/src/authoritative.rs
            codex-rs/hepta-cognitive-read/src/lib.rs
            codex-rs/hepta-cognitive-store/src/v2.rs
            codex-rs/hepta-cognitive-types/src/hnmf.rs
            codex-rs/hepta-cognitive-types/src/hnmf_learning.rs
            codex-rs/hepta-cognitive-types/src/lib.rs
            codex-rs/hepta-cognitive-types/src/wire.rs
          )
          git diff --binary "$base" "$convergence" -- "${paths[@]}" > "$RUNNER_TEMP/convergence.patch"
          git apply --3way --index "$RUNNER_TEMP/convergence.patch" || {
            echo '--- unmerged paths ---'
            git diff --name-only --diff-filter=U || true
            echo '--- conflict markers ---'
            grep -R -n -C 8 -E '^(<<<<<<<|=======|>>>>>>>)' "${paths[@]}" || true
            exit 1
          }
          git diff --check --cached

      - name: Commit semantic merge and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cognitive-types-semantic-merge.yml
          git add codex-rs/hepta-cognitive-read/src/authoritative.rs \
                  codex-rs/hepta-cognitive-read/src/lib.rs \
                  codex-rs/hepta-cognitive-store/src/v2.rs \
                  codex-rs/hepta-cognitive-types/src/hnmf.rs \
                  codex-rs/hepta-cognitive-types/src/hnmf_learning.rs \
                  codex-rs/hepta-cognitive-types/src/lib.rs \
                  codex-rs/hepta-cognitive-types/src/wire.rs
          git commit -m 'merge(cognitive.types): reconcile hardened contracts with consumers'
          git push origin HEAD:codex/cognitive-types-full-closure-20260927
