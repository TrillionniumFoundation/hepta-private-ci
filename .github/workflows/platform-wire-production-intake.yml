name: Platform wire production composition intake

on:
  workflow_dispatch:
    inputs:
      expected_source_sha: {description: Exact candidate SHA, required: true, type: string}
      observation_run_id: {description: Successful registered observation run, required: true, type: string}
      observation_workflow_path: {description: Registered producer workflow, required: true, type: string}
      observation_artifact: {description: Registered observation artifact, required: true, type: string}
      plan_sha256: {description: Registered production-plan SHA-256, required: true, type: string}

permissions: {contents: read, actions: read}
concurrency:
  group: platform-wire-production-${{ inputs.expected_source_sha }}
  cancel-in-progress: false

jobs:
  validate:
    environment: platform-wire-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      OBSERVATION_RUN_ID: ${{ inputs.observation_run_id }}
      OBSERVATION_WORKFLOW_PATH: ${{ inputs.observation_workflow_path }}
      OBSERVATION_ARTIFACT: ${{ inputs.observation_artifact }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      INPUT_DIR: ${{ runner.temp }}/platform-wire-production/input
      RECORDS: ${{ runner.temp }}/platform-wire-production/evidence
      REGISTRY: docs/modules/platform.wire/PRODUCTION_PRODUCERS.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 0}

      - name: Verify exact source and producer run
        id: setup
        env: {GH_TOKEN: '${{ github.token }}', REPOSITORY: '${{ github.repository }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$INPUT_DIR" "$RECORDS"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ && "$OBSERVATION_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA" && test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$OBSERVATION_WORKFLOW_PATH" != ".github/workflows/platform-wire-production-intake.yml"
          python3 scripts/platform_wire_production_gate.py --self-test
          python3 scripts/platform_wire_status.py self-test
          python3 - <<'PY'
          import json, os, re, urllib.request
          def get(path):
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPOSITORY']}{path}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"hepta-platform-wire-production"})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          run_id=int(os.environ["OBSERVATION_RUN_ID"]); source=os.environ["SOURCE_SHA"]
          run=get(f"/actions/runs/{run_id}")
          if run.get("head_sha")!=source or run.get("status")!="completed" or run.get("conclusion")!="success" or run.get("event")!="workflow_dispatch" or run.get("path")!=os.environ["OBSERVATION_WORKFLOW_PATH"] or run.get("repository",{}).get("full_name")!=os.environ["REPOSITORY"]: raise SystemExit("producer run identity rejected")
          attempt=run.get("run_attempt")
          if type(attempt) is not int or attempt<1: raise SystemExit("producer attempt rejected")
          rows=get(f"/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts",[]); matches=[x for x in rows if x.get("name")==os.environ["OBSERVATION_ARTIFACT"]]
          if len(matches)!=1: raise SystemExit("exactly one selected artifact required")
          a=matches[0]; digest=a.get("digest")
          if type(a.get("size_in_bytes")) is not int or not 1<=a["size_in_bytes"]<=20971520 or a.get("expired") is not False or not isinstance(digest,str) or re.fullmatch(r"sha256:[0-9a-f]{64}",digest) is None or a.get("workflow_run",{}).get("head_sha")!=source: raise SystemExit("artifact metadata rejected")
          meta={"run":run_id,"attempt":attempt,"artifact_id":a["id"],"artifact_digest":digest.removeprefix("sha256:")}
          open(os.path.join(os.environ["RECORDS"],"producer.json"),"w").write(json.dumps(meta,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write(f"OBSERVATION_RUN_ATTEMPT={attempt}\nOBSERVATION_RUN_IDENTITY=github-actions:{os.environ['REPOSITORY']}:{run_id}:{attempt}\n")
          PY

      - name: Download exact registered artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.observation_run_id }}
          name: ${{ inputs.observation_artifact }}
          path: ${{ env.INPUT_DIR }}
          github-token: ${{ github.token }}

      - name: Validate closed production observations
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$INPUT_DIR" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "production-observations.json production-plan.json "
          test "$(find "$INPUT_DIR" -mindepth 1 ! -type f -print -quit)" = ""
          test "$(stat -c %s "$INPUT_DIR/production-plan.json")" -le 262144
          test "$(stat -c %s "$INPUT_DIR/production-observations.json")" -le 16777216
          python3 scripts/platform_wire_production_gate.py \
            --registry "$REGISTRY" --producer-workflow-path "$OBSERVATION_WORKFLOW_PATH" \
            --artifact-name "$OBSERVATION_ARTIFACT" --producer-run-identity "$OBSERVATION_RUN_IDENTITY" \
            --plan "$INPUT_DIR/production-plan.json" --plan-sha256 "$PLAN_SHA256" \
            --report "$INPUT_DIR/production-observations.json" --source-sha "$SOURCE_SHA" > "$RECORDS/check.json"

      - name: Emit source-bound production receipt
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECORDS"
          python3 - <<'PY'
          from datetime import datetime,timezone
          import hashlib,json,os
          from pathlib import Path
          R=Path(os.environ["RECORDS"]); I=Path(os.environ["INPUT_DIR"]); errors=[]
          for n in ("SETUP_OUTCOME","DOWNLOAD_OUTCOME","VALIDATION_OUTCOME"):
              if os.environ.get(n)!="success":errors.append(f"{n}={os.environ.get(n)}")
          def load(p,limit):
              b=p.read_bytes()
              if not b or len(b)>limit or p.is_symlink():raise ValueError(p.name)
              return json.loads(b),hashlib.sha256(b).hexdigest()
          meta={}; check={}; plan_sha=report_sha=None
          try:meta,_=load(R/"producer.json",65536)
          except Exception as e:errors.append(f"producer:{e}")
          try:
              check,_=load(R/"check.json",4194304); _,plan_sha=load(I/"production-plan.json",262144); _,report_sha=load(I/"production-observations.json",16777216)
          except Exception as e:errors.append(f"evidence:{e}")
          ok=not errors; source=os.environ["SOURCE_SHA"]
          p={"schema":"hepta.platform-wire.receipt.v2","kind":"platform-wire-production","source_sha":source,"tested_sha":source,"status":"passed" if ok else "failed","errors":errors,"workflow":os.environ["GITHUB_WORKFLOW"],"workflow_ref":os.environ["GITHUB_WORKFLOW_REF"],"run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"event":os.environ["GITHUB_EVENT_NAME"],"generated_at":datetime.now(timezone.utc).isoformat(),"environment":"platform-wire-production","observation_run_id":(int(os.environ["OBSERVATION_RUN_ID"]) if os.environ["OBSERVATION_RUN_ID"].isdigit() else 0),"observation_workflow_path":os.environ["OBSERVATION_WORKFLOW_PATH"],"observation_artifact":os.environ["OBSERVATION_ARTIFACT"],"scenario_count":0,"independent_acceptance":False,"activation":False,"release":False}
          if ok:p.update(observation_artifact_digest=meta["artifact_digest"],plan_sha256=plan_sha,report_sha256=report_sha,host_profile=check["host_profile"],deployment_profile=check["deployment_profile"],runner_identity=check["runner_identity"],toolchain=check["toolchain"],observation_run_identity=check["run_identity"],deployment_id=check["deployment_id"],candidate_artifact_sha256=check["candidate_artifact_sha256"],gateway_artifact_sha256=check["gateway_artifact_sha256"],provider_artifact_sha256=check["provider_artifact_sha256"],configuration_sha256=check["configuration_sha256"],scenario_count=check["scenario_count"],transport=check["transport"],scenarios=check["scenarios"])
          (R/"platform-wire-production.json").write_text(json.dumps(p,indent=2,sort_keys=True)+"\n")
          PY
          python3 scripts/platform_wire_status.py validate-receipt --path "$RECORDS/platform-wire-production.json" --kind platform-wire-production
          python3 scripts/platform_wire_status.py render --production "$RECORDS/platform-wire-production.json" --format json --output "$RECORDS/status.json"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-wire-production-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.RECORDS }}/
            ${{ env.INPUT_DIR }}/production-plan.json
            ${{ env.INPUT_DIR }}/production-observations.json
          if-no-files-found: error
          retention-days: 180
