name: intuition.policy Export Immutable Carrier

on:
  push:
    branches: [codex/intuition-policy-final-use-recovery-20260929]
    paths:
      - ".github/workflows/intuition-carrier-export.yml"

permissions:
  contents: read

concurrency:
  group: intuition-carrier-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stage immutable carrier blobs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/intuition-carrier"
          mkdir -p "$out"
          cp .github/intuition-authoring-patch/READY "$out/"
          cp .github/intuition-authoring-patch/part-000.b64 "$out/"
          cp .github/intuition-authoring-patch/part-001.b64 "$out/"
          cp .github/intuition-authoring-patch/part-002.b64 "$out/"
          git rev-parse HEAD > "$out/carrier-head.txt"
          python3 - "$out" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          rows = []
          for path in sorted(root.iterdir()):
              if path.name == "files.sha256":
                  continue
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          (root / "files.sha256").write_text("".join(rows), encoding="utf-8")
          PY

      - name: Upload immutable carrier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intuition-immutable-carrier-${{ github.sha }}
          path: ${{ runner.temp }}/intuition-carrier/
          if-no-files-found: error
          retention-days: 3
