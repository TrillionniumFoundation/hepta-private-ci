name: Hepta E20 original Reader output-decision/Brier bounds (DENY_ALL)
on:
  pull_request:
    paths:
      - 'qualification/shared-stem-system2-architecture/e20_*.py'
      - 'qualification/shared-stem-system2-architecture/test_e20_*.py'
      - 'qualification/shared-stem-system2-architecture/E20_OUTPUT_BRIER_AND_DECISION_20261015.md'
      - '.github/workflows/hepta-e20-original-reader-brier-and-decision.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-reader-output-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        source_profile: [source_head, synthetic_merge]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: qualification/shared-stem-system2-architecture
      ROOT: qualification/shared-stem-system2-architecture
      OUTPUT: /tmp/hepta-e20-original
      HEPTA_E20_ORIGINAL_MULTIRC_ARCHIVE: /tmp/hepta-e20-original/multirc-original-11946621518.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_profile == 'source_head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze exact source ref and original numeric source SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT"
          git rev-parse HEAD | tee "$OUTPUT/source-head.txt"
          if [[ '${{ matrix.source_profile }}' == 'source_head' && '${{ github.event_name }}' == 'pull_request' ]]; then
            test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          fi
          python --version
          sha256sum "$ROOT"/e20_*.py "$ROOT"/test_e20_*.py | tee "$OUTPUT/numeric-source-sha256.txt"
      - name: Reacquire only exact original pretrained public Reader artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11946621518/zip' \
            -o "$HEPTA_E20_ORIGINAL_MULTIRC_ARCHIVE"
          echo "1a9b485b6b1ee28c952934069b2cd4d765a17742655f3f3cb3339d3ca672ad17  $HEPTA_E20_ORIGINAL_MULTIRC_ARCHIVE" | sha256sum -c -
          sha256sum "$HEPTA_E20_ORIGINAL_MULTIRC_ARCHIVE" | tee "$OUTPUT/original-model-zip-sha256.txt"
      - name: Real original archive test suite normal and optimized
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s "$ROOT" -p 'test_e20_*.py' -v > "$OUTPUT/tests-normal.log" 2>&1 \
            || { cat "$OUTPUT/tests-normal.log"; exit 1; }
          python -O -m unittest discover -s "$ROOT" -p 'test_e20_*.py' -v > "$OUTPUT/tests-optimized.log" 2>&1 \
            || { cat "$OUTPUT/tests-optimized.log"; exit 1; }
          tail -7 "$OUTPUT/tests-normal.log"
          tail -7 "$OUTPUT/tests-optimized.log"
      - name: Create-only BLIND archived original Reader precision and paid-arithmetic receipt
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/e20_quality_certificate.py" \
            --archive "$HEPTA_E20_ORIGINAL_MULTIRC_ARCHIVE" \
            --output "$OUTPUT/sealed-pre-human-output-quality.json"
          sha256sum "$OUTPUT/sealed-pre-human-output-quality.json" \
            > "$OUTPUT/sealed-pre-human-output-quality.sha256"
      - name: Separate process recompute all source predictions and historical human envelopes
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cut -d ' ' -f1 "$OUTPUT/sealed-pre-human-output-quality.sha256")"
          python "$ROOT/e20_independent_quality_review.py" \
            --archive "$HEPTA_E20_ORIGINAL_MULTIRC_ARCHIVE" \
            --blind "$OUTPUT/sealed-pre-human-output-quality.json" \
            --blind-sha256 "$SHA" \
            --output "$OUTPUT/independent-original-human-numeric-envelope.json"
          sha256sum "$OUTPUT/independent-original-human-numeric-envelope.json" \
            > "$OUTPUT/independent-original-human-numeric-envelope.sha256"
      - name: Retain raw sanitized evidence and every failure, never upload original ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-e20-original-output-envelope-${{ matrix.source_profile }}
          path: |
            /tmp/hepta-e20-original/*.json
            /tmp/hepta-e20-original/*.txt
            /tmp/hepta-e20-original/*.sha256
            /tmp/hepta-e20-original/*.log
          retention-days: 14
          if-no-files-found: warn
