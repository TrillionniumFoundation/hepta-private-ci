name: MemoryCell token ranking and answer learning
on:
  pull_request:
    paths:
      - 'scripts/memory_cell/token_*.py'
      - 'scripts/memory_cell/task_answer_learning.py'
      - 'scripts/memory_cell/test_token_*.py'
      - 'scripts/memory_cell/test_task_answer_learning.py'
      - '.github/workflows/hepta-memory-token-task.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-token-task-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  factorial:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-external-span-e2e
          run-id: 37919555733
          github-token: ${{ github.token }}
          path: /tmp/prior-environment
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-masked-span-execution
          run-id: 37926451871
          github-token: ${{ github.token }}
          path: /tmp/reference
      - name: Locked package environment and complete regression suite
        run: |
          set -euo pipefail
          mkdir -p /tmp/token-evidence
          (cd /tmp/reference && sha256sum -c SHA256SUMS)
          python3 -m venv /tmp/token-python
          /tmp/token-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/token-python/bin/pip install -r /tmp/prior-environment/environment.txt
          /tmp/token-python/bin/pip freeze > /tmp/token-evidence/environment.txt
          diff -u /tmp/prior-environment/environment.txt /tmp/token-evidence/environment.txt
          /tmp/token-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/token-evidence/tests.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-native-staged-inputs
          run-id: 37862780268
          github-token: ${{ github.token }}
          path: /tmp
      - name: Stage exact original data and pretrained model inventories
        run: |
          set -euo pipefail
          tar -C /tmp -xzf /tmp/memory-inputs.tar.gz
          /tmp/token-python/bin/python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from urllib.request import urlopen
          from huggingface_hub import snapshot_download
          from span_supervision import SQUAD_REVISION, MAX_BYTES, load_corpus
          from relevance_ranker import RANKER_ID, RANKER_REVISION
          from pretrained import file_inventory
          from native import digest
          pins = json.loads(Path('/tmp/prior-environment/external-input-pins.json').read_text())
          old = json.loads(Path('/tmp/reference/experiment/preregistered.json').read_text())
          root = Path('/tmp/external'); root.mkdir()
          for split in ('train', 'dev'):
              name = f'{split}-v2.0.json'
              with urlopen(f'https://raw.githubusercontent.com/rajpurkar/SQuAD-explorer/{SQUAD_REVISION}/dataset/{name}', timeout=90) as response:
                  raw = response.read(MAX_BYTES + 1)
              if len(raw) > MAX_BYTES or hashlib.sha256(raw).hexdigest() != pins[split]['sha256']:
                  raise ValueError('external byte drift')
              (root / name).write_bytes(raw)
              load_corpus(root / name, split)
          snapshot_download(RANKER_ID, revision=RANKER_REVISION, local_dir='/tmp/token-ranker',
              allow_patterns=['config.json', 'model.safetensors', 'tokenizer.json', 'tokenizer_config.json', 'special_tokens_map.json', 'vocab.txt'], token=False)
          if file_inventory(Path('/tmp/token-ranker')) != old['ranker_inventory']:
              raise ValueError('paired encoder drift')
          if digest(file_inventory(Path('/tmp/memory-inputs/reader'))) != old['generator_inventory']:
              raise ValueError('reader drift')
          Path('/tmp/token-evidence/pins.json').write_text(json.dumps(pins, indent=2))
          PY
      - name: Actual pretrained token-head and answer-LoRA factorial execution
        env:
          HEPTA_MEMORY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/token-evidence/resources.txt /tmp/token-python/bin/python scripts/memory_cell/token_task_trial.py /tmp/memory-inputs /tmp/token-ranker /tmp/external /tmp/reference/experiment /tmp/token-evidence/experiment 2>&1 | tee /tmp/token-evidence/execution.log
      - name: Retain model results and require repository formatting
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          PATH="/tmp/token-python/bin:$PATH" just fmt --check --base "$BASE"
      - name: Source and evidence inventory including failures
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/token-evidence/source
          git rev-parse HEAD > /tmp/token-evidence/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/token-evidence/tested-tree.txt
          cp scripts/memory_cell/token_*.py scripts/memory_cell/task_answer_learning.py scripts/memory_cell/test_token_*.py scripts/memory_cell/test_task_answer_learning.py /tmp/token-evidence/source/
          PATH="/tmp/token-python/bin:$PATH" uv run --frozen --project scripts ruff format --diff scripts/memory_cell/token_*.py scripts/memory_cell/task_answer_learning.py scripts/memory_cell/test_token_*.py scripts/memory_cell/test_task_answer_learning.py > /tmp/token-evidence/format.patch || true
          cat /tmp/token-evidence/format.patch
          (cd /tmp/token-evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-token-task-factorial
          path: /tmp/token-evidence
          if-no-files-found: error
