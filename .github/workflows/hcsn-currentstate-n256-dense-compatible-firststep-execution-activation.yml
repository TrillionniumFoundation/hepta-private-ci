name: hcsn-currentstate-n256-dense-compatible-firststep-execution-activation

on:
  pull_request:
    types: [opened]
    paths:
      - "qualification/hcsn_currentstate_n256_dense_compatible_firststep_execution/EXECUTION_OPEN.json"

permissions:
  contents: read

concurrency:
  group: hcsn-n256-dense-compatible-firststep-hosted-20261121-c06d-001
  cancel-in-progress: false

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UNIQUE_EXECUTION_KEY: hcsn-n256-dense-compatible-firststep-hosted-20261121-c06d-001
      ADMITTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_OUTPUT: ${{ runner.temp }}/hcsn-n256-dense-compatible-firststep-001
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install exact frozen numerical runtime
        run: python -m pip install --disable-pip-version-check -r qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/requirements.txt
      - name: Verify exact activation and executable source
        run: |
          python -m qualification.hcsn_currentstate_n256_dense_compatible_firststep_execution.verify_source
          python -m unittest qualification.hcsn_currentstate_n256_dense_compatible_firststep_execution.test_source -v
          python -O -m unittest qualification.hcsn_currentstate_n256_dense_compatible_firststep_execution.test_source -v
      - name: Execute unique admitted child
        run: python -m qualification.hcsn_currentstate_n256_dense_compatible_firststep_execution.launcher
      - name: Publish complete PASS or RED originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-dense-compatible-firststep-hosted-20261121-c06d-001
          path: ${{ runner.temp }}/hcsn-n256-dense-compatible-firststep-001
          if-no-files-found: error
          retention-days: 90
