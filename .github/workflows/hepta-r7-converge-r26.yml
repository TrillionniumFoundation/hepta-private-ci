name: hepta-r7-converge-r26

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/hepta-r7-converge-r26.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: hepta-r7-converge-r26
  cancel-in-progress: true

jobs:
  converge:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET_BRANCH: ops/hepta-global-gap-closure-controller-20260910-r1
      TARGET_CANDIDATE: integration/hepta-all-gap-closure-20260910-r7
      FINALIZER: scripts/hepta-global-finalizer-r7.py
      HELPER: scripts/hepta-final-projection-repair-v2.py
      PATCHER: scripts/patch-global-finalizer-r24.py
      R7_WORKFLOW: .github/workflows/hepta-global-finalizer-r7.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact controller source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Converge controller and smoke-test candidate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          python3 -m py_compile "${HELPER}"

          integrated=true
          grep -Fq 'def finalize_generated_state()' "${FINALIZER}" || integrated=false
          grep -Fq 'hepta-final-projection-repair-v2.py' "${FINALIZER}" || integrated=false
          grep -Fq 'scripts/hepta-final-projection-repair-v2.py' "${R7_WORKFLOW}" || integrated=false
          grep -Fq '${RUNNER_TEMP}/hepta-r7-executor/hepta-final-projection-repair-v2.py' "${R7_WORKFLOW}" || integrated=false
          if [[ "${integrated}" != true ]]; then
            test -f "${PATCHER}"
            python3 -m py_compile "${PATCHER}"
            python3 "${PATCHER}"
          fi
          python3 -m py_compile "${FINALIZER}" "${HELPER}"
          grep -Fq 'cancel-in-progress: true' "${R7_WORKFLOW}"

          candidate_dir="${RUNNER_TEMP}/hepta-r26-candidate"
          git fetch --force origin \
            "refs/heads/${TARGET_CANDIDATE}:refs/remotes/origin/${TARGET_CANDIDATE}"
          candidate_sha="$(git rev-parse "origin/${TARGET_CANDIDATE}^{commit}")"
          git worktree add --detach "${candidate_dir}" "${candidate_sha}"
          cp "${HELPER}" "${candidate_dir}/hepta-final-projection-repair-v2.py"
          cd "${candidate_dir}"
          python3 -m py_compile hepta-final-projection-repair-v2.py
          set +e
          python3 hepta-final-projection-repair-v2.py \
            > "${RUNNER_TEMP}/hepta-r26-helper.log" 2>&1
          helper_rc=$?
          set -e
          cat "${RUNNER_TEMP}/hepta-r26-helper.log"
          if [[ "${helper_rc}" -ne 0 ]]; then
            if [[ -f qualification/global-gap-closure-final-r7/FINAL_PROJECTION_REPAIR.json ]]; then
              cat qualification/global-gap-closure-final-r7/FINAL_PROJECTION_REPAIR.json
            fi
            exit "${helper_rc}"
          fi
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-technical-closure.py verify
          python3 \
            qualification/module-execution-dossiers/implementation_contracts.py \
            verify-repository
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path(
                  'qualification/global-gap-closure-final-r7/'
                  'FINAL_PROJECTION_REPAIR.json'
              ).read_text(encoding='utf-8')
          )
          assert receipt['passed'] is True
          assert receipt['authorityGranted'] is False
          assert receipt['selfCertificationAllowed'] is False
          native = json.loads(
              Path(
                  'qualification/module-execution-dossiers/NATIVE_BINDINGS.json'
              ).read_text(encoding='utf-8')
          )
          assert native['moduleCoverage'] == 40
          assert len(native['observations']) == 40
          PY
          git diff --check

      - name: Publish clean exact controller
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          git config user.name 'hepta-global-finalizer-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/hepta-r7-converge-r26.yml \
            .github/workflows/verify-and-dispatch-r25.yml \
            .github/workflows/patch-global-finalizer-r24.yml \
            .github/workflows/patch-global-finalizer-r23.yml \
            .github/workflows/patch-global-finalizer-r22.yml \
            .github/workflows/patch-global-finalizer-r21.yml \
            .github/workflows/patch-global-finalizer-r20.yml \
            scripts/patch-global-finalizer-r24.py \
            scripts/patch-global-finalizer-r19.py \
            scripts/hepta-final-projection-repair.py
          git add "${FINALIZER}" "${HELPER}" "${R7_WORKFLOW}"
          git diff --cached --check
          git commit --signoff -m 'fix(hepta): activate verified final projection reconciliation'
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          clean_sha="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${clean_sha}"
          echo "controller_sha=${clean_sha}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch and bind latest r7 run
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          controller_sha='${{ steps.publish.outputs.controller_sha }}'
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run hepta-global-finalizer-r7.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TARGET_BRANCH}" \
            --field target_branch="${TARGET_CANDIDATE}" \
            --field shard_count='8'
          run_id=''
          for attempt in $(seq 1 90); do
            run_id="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow hepta-global-finalizer-r7.yml \
              --branch "${TARGET_BRANCH}" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha == "'"${controller_sha}"'") | .databaseId' \
              | head -n1)"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 2
          done
          test -n "${run_id}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "bound r7 run ${run_id} to controller ${controller_sha}, dispatch after ${before}"

      - name: Observe exact r7 to terminal state
        id: observe
        shell: bash
        run: |
          set +e
          run_id='${{ steps.dispatch.outputs.run_id }}'
          gh run watch "${run_id}" \
            --repo "${GITHUB_REPOSITORY}" \
            --exit-status \
            --interval 20
          rc=$?
          set -e
          conclusion="$(gh run view "${run_id}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json conclusion \
            --jq '.conclusion')"
          echo "conclusion=${conclusion}" >> "${GITHUB_OUTPUT}"
          echo "watch_rc=${rc}" >> "${GITHUB_OUTPUT}"

      - name: Download terminal r7 evidence
        if: always() && steps.dispatch.outputs.run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hepta-r26-r7-artifacts"
          gh run download '${{ steps.dispatch.outputs.run_id }}' \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/hepta-r26-r7-artifacts" || true
          gh run view '${{ steps.dispatch.outputs.run_id }}' \
            --repo "${GITHUB_REPOSITORY}" \
            --log-failed \
            > "${RUNNER_TEMP}/hepta-r26-r7-failed.log" 2>&1 || true
          find "${RUNNER_TEMP}/hepta-r26-r7-artifacts" -maxdepth 3 -type f -print
          tail -n 400 "${RUNNER_TEMP}/hepta-r26-r7-failed.log" || true

      - name: Verify final candidate closure receipt
        if: steps.observe.outputs.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/heads/${TARGET_CANDIDATE}:refs/remotes/origin/${TARGET_CANDIDATE}"
          receipt_sha="$(git rev-parse "origin/${TARGET_CANDIDATE}^{commit}")"
          status_file="${RUNNER_TEMP}/hepta-r26-status.json"
          git show "origin/${TARGET_CANDIDATE}:qualification/global-gap-closure-final-r7/STATUS.json" \
            > "${status_file}"
          python3 - "${status_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert status['repositoryInternalValidationPassed'] is True
          assert status['repositoryInternalGapsClosed'] is True
          assert status['externalAuthorityGatesRetained'] is True
          assert status['authorityGranted'] is False
          assert status['productionActivation'] is False
          assert status['modelInvocationAuthority'] is False
          assert status['providerDispatchAuthority'] is False
          assert status['productionWriterAuthorityAdded'] is False
          assert status['selection'] is False
          assert status['promotion'] is False
          assert status['release'] is False
          assert status['observedPackageShards'] == status['expectedShards'] == 8
          assert status['canonicalHeptaPackageCount'] > 0
          PY
          echo "qualified candidate receipt commit: ${receipt_sha}"

      - name: Enforce terminal success
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.observe.outputs.conclusion }}' = success
          test '${{ steps.observe.outputs.watch_rc }}' = 0
