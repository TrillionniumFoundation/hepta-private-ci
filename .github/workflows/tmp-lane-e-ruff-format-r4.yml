name: tmp-lane-e-ruff-format-r4

on:
  push:
    branches:
      - tmp/hepta-lane-e-doc-sync-20260910
    paths:
      - .github/workflows/tmp-lane-e-ruff-format-r4.yml

permissions:
  contents: write

concurrency:
  group: tmp-lane-e-ruff-format-r4
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"

      - name: Format and verify Lane E closure script
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format scripts/hepta-lane-e-closure.py
          uv run --frozen --project scripts ruff format --check scripts
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          python3 -m json.tool docs/lane-e/LANE_E_IMPLEMENTATION_MATRIX.json >/dev/null
          python3 -m json.tool qualification/lane-e/TEST_TRACEABILITY.json >/dev/null
          rm .github/workflows/tmp-lane-e-ruff-format-r4.yml
          git diff --check

      - name: Publish clean formatted tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-lane-e-format-bot
          git config user.email hepta-lane-e-format-bot@users.noreply.github.com
          git add scripts/hepta-lane-e-closure.py .github/workflows/tmp-lane-e-ruff-format-r4.yml
          test -n "$(git diff --cached --name-only)"
          git commit -m "style(lane-e): apply repository Python formatting"
          git push origin HEAD:refs/heads/tmp/hepta-lane-e-doc-sync-20260910
