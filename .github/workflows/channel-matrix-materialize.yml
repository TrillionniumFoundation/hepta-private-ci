name: channel.matrix native regression convergence

on:
  push:
    branches: [codex/channel-matrix-full-closure-20260927]
    paths: [.github/workflows/channel-matrix-materialize.yml]

permissions:
  contents: write

concurrency:
  group: channel-matrix-native-regression-convergence
  cancel-in-progress: false

jobs:
  apply-reviewed-fix:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/channel-matrix-full-closure-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.sha }}
      STAGED_PARENT: d54df28e41bc395cf0948373a679c5aea4609adf
      PATCH_PATH: .github/channel-matrix-native-regression-fix.patch
      PATCH_SHA256: c83af4135c76372f23af8ecb924a8e835ac93c6022a166944a4f5c022f54c5b3
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Apply exact reviewed native-regression fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "$STAGED_PARENT"
          test "$(sha256sum "$PATCH_PATH" | cut -d' ' -f1)" = "$PATCH_SHA256"
          git apply --check "$PATCH_PATH"
          git apply --index "$PATCH_PATH"
          git checkout HEAD^ -- .github/workflows/channel-matrix-materialize.yml
          git rm "$PATCH_PATH"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/channel-matrix-native-regression-fix.patch
          .github/workflows/channel-matrix-materialize.yml
          codex-rs/hepta-matrix-sdk/tests/durable_transport.rs
          EOF
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git diff --cached --check
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' -v

      - name: Commit and fast-forward the Matrix branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'channel.matrix: align crash-cut regressions with typed fenced sender' \
            -m 'Use monotonic observation time, current content pinning, opaque fenced claims and durable authority witnesses. This commit does not claim homeserver, encryption, restore, capacity or independent acceptance.'
          git diff --exit-code
          git diff --cached --exit-code
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/channel-matrix-full-closure-20260927 | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/channel-matrix-full-closure-20260927
