name: channel.matrix bounded source publication

on:
  workflow_dispatch:
  push:
    branches: [codex/channel-matrix-full-closure-20260927]
    paths: [.github/workflows/channel-matrix-materialize.yml]

permissions:
  contents: write

concurrency:
  group: channel-matrix-bounded-source-publication
  cancel-in-progress: false

jobs:
  publish-reviewed-source:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/channel-matrix-full-closure-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact reviewed Matrix source without changing other owners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matrix-authoring-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor 40ce2dd0443f6e49c3b6d9e8ee738f8ebde1b8f8 HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          baseline = '40ce2dd0443f6e49c3b6d9e8ee738f8ebde1b8f8'
          workflow = '.github/workflows/channel-matrix-materialize.yml'
          changed = set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'], text=True).splitlines())
          if not changed.issubset({workflow}):
              raise SystemExit('source changed since reviewed publication baseline; reconcile instead of overwriting')
          directory = root / '.github/channel-matrix-optimization'
          pieces = sorted(directory.iterdir())
          if [p.name for p in pieces] != [f'part-{i:03}' for i in range(1, 7)]:
              raise SystemExit('optimization payload inventory mismatch')
          if any(not p.is_file() or p.is_symlink() for p in pieces):
              raise SystemExit('optimization payload must use regular files')
          packed = base64.b64decode(''.join(p.read_text().strip() for p in pieces), validate=True)
          if hashlib.sha256(packed).hexdigest() != 'db8756ec846404f24fc98459a9e7403fda999b1042aba83cb747595ae70d65fe':
              raise SystemExit('optimization transport hash mismatch')
          payload = lzma.decompress(packed, memlimit=256*1024*1024)
          if len(payload) != 98523 or hashlib.sha256(payload).hexdigest() != '124b26fa3db2b9358e9c27795e1c565678a96efa25d1f7538b8a0d8c1c529231':
              raise SystemExit('reviewed source patch mismatch')
          allowed = {
              '.github/channel-matrix-local-patch/part-001',
              '.github/workflows/channel-matrix-preserve-unknown.yml',
              'codex-rs/hepta-matrix-sdk/src/outbound_v2/mod.rs',
              'codex-rs/hepta-matrix-sdk/tests/durable_transport.rs',
              'codex-rs/hepta-matrix-sdk/tests/final_poll_regressions.rs',
              'codex-rs/hepta-matrix-sdk/tests/final_poll_regressions/optimization.rs',
              'codex-rs/hepta-matrix-sdk/tests/pending_poll_regressions.rs',
              'docs/modules/channel.matrix/CONTINUATION_VALIDATION.md',
              'docs/modules/channel.matrix/IMPLEMENTATION_MAP.json',
              'docs/modules/channel.matrix/OPERATIONS_RUNBOOK.md',
              'docs/modules/channel.matrix/OPTIMIZATION_CONTRACT.md',
              'docs/modules/channel.matrix/QUALIFICATION_MATRIX.md',
              'docs/modules/channel.matrix/TECHNICAL.md',
              'scripts/channel_matrix_diagnostics.py',
              'scripts/channel_matrix_evidence.py',
              'scripts/channel_matrix_status.py',
              'scripts/tests/test_channel_matrix_candidate_guard.py',
              'scripts/tests/test_channel_matrix_diagnostics.py',
              'scripts/tests/test_channel_matrix_status.py',
              'scripts/verify_channel_matrix_candidate.py',
          }
          text = payload.decode('utf-8')
          headers = re.findall(r'^diff --git a/(\S+) b/(\S+)$', text, re.M)
          if len(headers) != len(allowed) or any(a != b for a, b in headers) or {a for a,b in headers} != allowed:
              raise SystemExit('reviewed source inventory mismatch')
          if re.search(r'^(?:new file mode|old mode|new mode) (?:120000|160000)$', text, re.M) or 'GIT binary patch' in text:
              raise SystemExit('non-source patch mode rejected')
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'matrix-reviewed.patch'
          patch.write_bytes(payload)
          subprocess.run(['git','apply','--index','--check',str(patch)], check=True)
          subprocess.run(['git','apply','--index',str(patch)], check=True)
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != allowed:
              raise SystemExit('applied source inventory mismatch')
          subprocess.run(['git','rm','-r','.github/channel-matrix-optimization'], check=True)
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'matrix-authoring-evidence'
          (evidence/'reviewed-patch.sha256').write_text(hashlib.sha256(payload).hexdigest()+'\n')
          (evidence/'parent.txt').write_text(os.environ['EXPECTED_SHA']+'\n')
          PY
      - name: Execute Python and SQLite regressions on the source tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/matrix-authoring-evidence/tested-tree.txt"
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' -v 2>&1 | tee "$RUNNER_TEMP/matrix-authoring-evidence/python-tests.log"
      - name: Commit and fast-forward the Matrix branch only
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'channel.matrix: materialize diagnostics, exact evidence and typed-entry regressions' -m 'Python/SQLite source execution is not native, homeserver, encryption, restore or independent acceptance. Qualification remains read-only and separately gated.'
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/matrix-authoring-evidence/tested-tree.txt")"
          git diff --exit-code
          git diff --cached --exit-code
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/channel-matrix-full-closure-20260927 | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/channel-matrix-full-closure-20260927
          head=$(git rev-parse HEAD)
          printf '%s\n' "$head" > "$RUNNER_TEMP/matrix-authoring-evidence/source-head.txt"
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "Published source $head. Native and target qualification remain independent." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact published candidate without mutation
        if: steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_channel_matrix_candidate.py --expected-sha "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/matrix-authoring-evidence/candidate.json" 2>&1 | tee "$RUNNER_TEMP/matrix-authoring-evidence/candidate.log"
      - name: Read-only locked native probe
        if: steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo check --locked -p codex-hepta-matrix-protocol -p codex-hepta-matrix-store -p codex-hepta-matrix-sdk -p codex-hepta-matrixd --all-targets > "$RUNNER_TEMP/matrix-authoring-evidence/locked-check.log" 2>&1
      - name: Retain source publication and failed qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-matrix-source-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/matrix-authoring-evidence/
          if-no-files-found: error
          retention-days: 14
