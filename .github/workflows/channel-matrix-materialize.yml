name: channel.matrix documentation contract

on:
  pull_request:
    paths:
      - 'docs/modules/channel.matrix/**'
      - 'codex-rs/hepta-matrix-store/migrations/**'
      - 'scripts/channel_matrix_docs.py'
      - 'scripts/channel_matrix_migrations.py'
      - 'scripts/tests/test_channel_matrix_doc*.py'
      - '.github/workflows/channel-matrix-materialize.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: channel-matrix-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Matrix documentation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify generated status, migration inventory and documentation policy
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/channel_matrix_docs.py --check
          python3 scripts/channel_matrix_migrations.py --check
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix_doc*.py' -v
