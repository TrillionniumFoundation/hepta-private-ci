name: channel.matrix documentation consistency

on:
  pull_request:
    paths:
      - 'docs/modules/channel.matrix/**'
      - 'codex-rs/hepta-matrix-store/migrations/**'
      - 'scripts/tests/test_channel_matrix_documentation.py'
      - '.github/workflows/channel-matrix-materialize.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: channel-matrix-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Matrix documentation consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify migration floor, rollback contract, and read-only publication policy
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix_documentation.py' -v
