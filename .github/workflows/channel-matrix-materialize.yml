name: channel.matrix migration-13 documentation convergence

on:
  push:
    branches: [codex/channel-matrix-full-closure-20260927]
    paths: [.github/workflows/channel-matrix-materialize.yml]

permissions:
  contents: write

concurrency:
  group: channel-matrix-migration13-doc-convergence
  cancel-in-progress: false

jobs:
  apply-reviewed-docs:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/channel-matrix-full-closure-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.sha }}
      SOURCE_PARENT: 02759de4e26cf65a2c6498a3d397fa503998af3d
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Apply exact migration-13 documentation contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('docs/modules/channel.matrix')

          def replace(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected preimage count for {path}: {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              root / 'OPTIMIZATION_CONTRACT.md',
              '''Migration compatibility is **12**, including stable-transaction terminal proof
          across attempts. Startup/rollback documentation must not approve an older
          binary that only understands migration 11.
          ''',
              '''Migration compatibility is **13**. This includes migration 12
          stable-transaction terminal proof across attempts and migration 13 monotone
          inbox-recovery scheduling, bounded retry classification and quarantine guards.
          Startup/rollback documentation must not approve a binary that understands only
          migrations 1-12.
          ''')

          runbook = root / 'OPERATIONS_RUNBOOK.md'
          replace(runbook,
              'store/migrations 1-12 and their exact schema/invariants verified',
              'store/migrations 1-13 and their exact schema/invariants verified')
          replace(runbook,
              '''Roll out with a canary Agent and bounded room set. Require current exact-head and synthetic-merge receipts plus applicable real homeserver qualification before promotion. Roll back only to a binary compatible with migrations 1-12, including canonical pins, entered-use proofs, parked legacy holds and migration-12 cross-attempt terminal qualification; otherwise roll forward. Keep matrixd and agentd as one paired release and verify both program digests.
          ''',
              '''Roll out with a canary Agent and bounded room set. Require current exact-head and synthetic-merge receipts plus applicable real homeserver qualification before promotion. Roll back only to a binary compatible with migrations 1-13, including canonical pins, entered-use proofs, parked legacy holds, migration-12 cross-attempt terminal qualification and migration-13 recovery scheduling/quarantine state; otherwise roll forward. Keep matrixd and agentd as one paired release and verify both program digests.
          ''')
          replace(runbook,
              '''python3 scripts/channel_matrix_diagnostics.py --database /private/matrix_1.sqlite3 --transaction EXACT_TXN_ID
          python3 scripts/channel_matrix_diagnostics.py --database /private/matrix_1.sqlite3 --format prometheus
          ''',
              '''python3 scripts/channel_matrix_diagnostics.py --database /private/matrix_1.sqlite3 --transaction EXACT_TXN_ID
          python3 scripts/channel_matrix_diagnostics.py --database /private/matrix_1.sqlite3 --event EXACT_EVENT_ID
          python3 scripts/channel_matrix_diagnostics.py --database /private/matrix_1.sqlite3 --format prometheus --check
          ''')

          schema = root / 'STORAGE_SCHEMA.md'
          replace(schema,
              '''- Stable-transaction terminal qualification across retry attempts: `0012_matrix_terminal_any_entered_attempt.sql`
          - Writer: one exact per-Agent `hepta-matrixd` process generation
          ''',
              '''- Stable-transaction terminal qualification across retry attempts: `0012_matrix_terminal_any_entered_attempt.sql`
          - Monotone inbox recovery scheduling and quarantine: `0013_matrix_inbox_recovery.sql`
          - Writer: one exact per-Agent `hepta-matrixd` process generation
          ''')
          replace(schema,
              '| `matrix_dispatch_attempt_events` | complete append-only attempt lifecycle | event sequence |\n',
              '| `matrix_dispatch_attempt_events` | complete append-only attempt lifecycle | event sequence |\n| `matrix_inbox_recovery` | bounded recovery scheduling, retry classification and monotone quarantine for an existing inbox event | event ID |\n')
          replace(schema,
              'exact normalized SQL for every dispatch/claim/content/use-proof/legacy/terminal-qualification object from migrations 6-12;',
              'exact normalized SQL for every dispatch/claim/content/use-proof/legacy/terminal-qualification/recovery object from migrations 6-13;')
          replace(schema,
              '- all 76 required tables, indexes, views and triggers;',
              '- all 76 foundational required tables, indexes, views and triggers, plus every exact dispatch/recovery object parsed from migrations 6-13;')
          replace(schema,
              '''`matrix_inbox_recovery` references the original inbox event; it retains attempt
          count, last start, next due time, running/ready/retry/quarantined disposition and
          closed-set failure class. Update triggers reject identity/attempt/time rollback
          and quarantine reset. Deletion is forbidden. This is mutable operational
          scheduling, not append-only execution evidence. Exact store-open schema checking
          includes this migration. [Migration inventory](MIGRATIONS.md) is generated and
          verified against committed SQL filenames.
          ''',
              '''`matrix_inbox_recovery` references the original inbox event; it retains attempt
          count, last start, next due time, running/ready/retry/quarantined disposition and
          closed-set failure class. Update triggers reject identity/attempt/time rollback
          and quarantine reset. Deletion is forbidden. This is mutable operational
          scheduling, not append-only execution evidence. Exact store-open schema checking
          includes this migration, so a binary compatible only through migration 12 is not
          a valid startup or rollback target. [Migration inventory](MIGRATIONS.md) is
          generated and verified against committed SQL filenames.
          ''')

          recovery = root / 'FAILURE_AND_RECOVERY.md'
          replace(recovery, 'verifies migrations 1-12, exact schema SQL',
                           'verifies migrations 1-13, exact schema SQL')
          replace(recovery,
              '''8. Accepted/indeterminate dispatches remain unresolved until authenticated sync supplies matching server evidence. If a later attempt is merely claimed when the echo arrives, migration 12 qualifies the stable transaction with the earlier matching entered-use proof and closes the current claim without another effect.
          ''',
              '''8. Accepted/indeterminate dispatches remain unresolved until authenticated sync supplies matching server evidence. If a later attempt is merely claimed when the echo arrives, migration 12 qualifies the stable transaction with the earlier matching entered-use proof and closes the current claim without another effect.
          9. Migration 13 preserves each pending inbox event identity while recording bounded recovery attempts, next-due time, closed-set failure class and monotone quarantine. Restart never manufactures a replacement event or clears quarantine by inference.
          ''')
          replace(recovery,
              '''Binary rollback is allowed only when the predecessor understands every committed migration and durable record. Migrations 6-12 dispatch, claim, witness, canonical-content, entered-use, legacy-hold, remediation and cross-attempt terminal semantics cannot be ignored by an older sender. Otherwise keep the current store owner and roll forward. Release rollback retains stable transaction identities, current redaction/revocation frontiers, parked legacy holds and unresolved effects.
          ''',
              '''Binary rollback is allowed only when the predecessor understands every committed migration and durable record. Migrations 6-13 dispatch, claim, witness, canonical-content, entered-use, legacy-hold, remediation, cross-attempt terminal and inbox-recovery scheduling semantics cannot be ignored by an older runtime. Otherwise keep the current store owner and roll forward. Release rollback retains stable transaction identities, current redaction/revocation frontiers, parked legacy holds, recovery/quarantine state and unresolved effects.
          ''')

          replace(
              root / 'TECHNICAL.md',
              '''The schema compatibility floor for startup/rollback is migration **12**,
          including cross-attempt terminal qualification. A binary compatible only with
          migrations 1-11 is not a qualified rollback target.

          ## 18. Recovery isolation and executable qualification ledger
          ''',
              '''The schema compatibility floor for startup/rollback is migration **13**,
          including migration-12 cross-attempt terminal qualification and migration-13
          monotone inbox-recovery scheduling/quarantine. A binary compatible only with
          migrations 1-12 is not a qualified rollback target.

          ## 19. Recovery isolation and executable qualification ledger
          ''')
          PY
          git add docs/modules/channel.matrix/OPTIMIZATION_CONTRACT.md \
                  docs/modules/channel.matrix/OPERATIONS_RUNBOOK.md \
                  docs/modules/channel.matrix/STORAGE_SCHEMA.md \
                  docs/modules/channel.matrix/FAILURE_AND_RECOVERY.md \
                  docs/modules/channel.matrix/TECHNICAL.md
          git checkout HEAD^ -- .github/workflows/channel-matrix-materialize.yml
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/workflows/channel-matrix-materialize.yml
          docs/modules/channel.matrix/FAILURE_AND_RECOVERY.md
          docs/modules/channel.matrix/OPERATIONS_RUNBOOK.md
          docs/modules/channel.matrix/OPTIMIZATION_CONTRACT.md
          docs/modules/channel.matrix/STORAGE_SCHEMA.md
          docs/modules/channel.matrix/TECHNICAL.md
          EOF
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git diff --cached --check
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' -v

      - name: Create exact reviewed documentation commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'channel.matrix: align migration-13 startup and rollback contracts' \
            -m 'Synchronize readiness, recovery, storage and diagnostics documentation with the committed migration inventory. This does not grant native, target, operator, activation or release acceptance.'
          final=$(git rev-parse HEAD)
          echo "FINAL_COMMIT=$final"
          git diff --exit-code
          git diff --cached --exit-code
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/channel-matrix-full-closure-20260927 | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/channel-matrix-full-closure-20260927
