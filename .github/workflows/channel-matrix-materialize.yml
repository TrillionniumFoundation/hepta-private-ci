name: channel.matrix isolated reviewed materialization

on:
  push:
    branches:
      - codex/channel-matrix-materialize-once-20260930
    paths:
      - '.github/workflows/channel-matrix-materialize.yml'

permissions:
  contents: read

concurrency:
  group: channel-matrix-isolated-reviewed-materialization
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}
  OPS_PAYLOAD_SHA256: 3ad03651989919489dfc3e4171b2fccad252e948247ecc7ab1ee15810aea11e9
  CLOSURE_PAYLOAD_SHA256: 6be88c59e74ef4d6f16231c0ba13dadfe542c69b3e060c10719bb7b7245d90a2
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    name: Materialize reviewed ordinary source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed payloads
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat .matrix-staging/channel-matrix-ops-evidence.part* \
            | base64 --decode > "$RUNNER_TEMP/ops.tar.gz"
          echo "$OPS_PAYLOAD_SHA256  $RUNNER_TEMP/ops.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ops.tar.gz"
          cat .matrix-staging/channel_matrix_apply.part* \
            | base64 --decode > "$RUNNER_TEMP/closure.py.gz"
          echo "$CLOSURE_PAYLOAD_SHA256  $RUNNER_TEMP/closure.py.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/closure.py.gz" > .matrix-staging/apply.py
          python3 .matrix-staging/apply.py
          rm -f \
            .github/channel-matrix-repair.py \
            .github/workflows/channel-matrix-bootstrap.yml \
            .github/workflows/channel-matrix-closure-apply.yml \
            .github/workflows/channel-matrix-hardening-apply.yml \
            .github/workflows/channel-matrix-ops-evidence-finalize.yml \
            .github/workflows/channel-matrix-source-export.yml \
            scripts/channel_matrix_full_patch.py.gz.b64
          rm -rf .matrix-staging
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.github/workflows').glob('channel-matrix*.yml'):
              text = path.read_text(encoding='utf-8')
              for token in ('contents: write', 'git push', 'git commit', 'clippy --fix'):
                  if token in text:
                      raise SystemExit(f'{path}: forbidden token {token}')
          PY
          git diff --check

      - name: Run repository-controlled regressions
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' -v

      - name: Package exact tree
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/materialized"
          mkdir -p "$out"
          git diff --name-only --diff-filter=ACMRT -z "$SOURCE_SHA" -- \
            | tar --null -T - -cf "$out/tree.tar"
          git diff --name-only --diff-filter=D "$SOURCE_SHA" -- \
            | LC_ALL=C sort > "$out/deletions.txt"
          git diff --binary --full-index "$SOURCE_SHA" -- > "$out/materialized.patch"
          git diff --name-status "$SOURCE_SHA" -- > "$out/name-status.txt"
          python3 - "$out" <<'PY'
          import hashlib, json, os, stat, subprocess, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          names = subprocess.check_output(
              ['git','diff','--name-only','--diff-filter=ACMRT',os.environ['SOURCE_SHA'],'--'],
              text=True,
          ).splitlines()
          files=[]
          for name in names:
              path=Path(name); data=path.read_bytes()
              files.append({'path':name,'mode':'100755' if path.stat().st_mode & stat.S_IXUSR else '100644','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          row={'schema':'hepta.channel-matrix-reviewed-materialization.v1','sourceCommit':os.environ['SOURCE_SHA'],'files':files,'deletions':(out/'deletions.txt').read_text().splitlines(),'payloads':{'ops':os.environ['OPS_PAYLOAD_SHA256'],'closure':os.environ['CLOSURE_PAYLOAD_SHA256']},'authorityGranted':False,'activation':False,'release':False}
          (out/'manifest.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum "$out/tree.tar" "$out/materialized.patch" > "$out/digests.txt"

      - name: Upload reviewed materialization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-matrix-reviewed-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/materialized/
          if-no-files-found: error
          retention-days: 30
