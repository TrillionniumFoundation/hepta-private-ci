name: ACT-3 procedural qualification

on:
  push:
    branches:
      - research/act3-stop-diagnosis-20261110
      - research/act3-cold-state-20261110
      - research/act3-cold-qualification-20261110
      - research/act3-tool-families-20261110
      - research/act3-browser-20261110
      - research/act3-composite-20261110
      - research/act3-procedural-replay-20261110

permissions:
  contents: read

concurrency:
  group: act3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controlled-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Bind exact source and dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act3-records"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/act3-records/source.txt"
          python3 -m venv "$RUNNER_TEMP/act3-venv"
          "$RUNNER_TEMP/act3-venv/bin/pip" install numpy==2.3.5
          "$RUNNER_TEMP/act3-venv/bin/python" --version > "$RUNNER_TEMP/act3-records/python.txt"
          "$RUNNER_TEMP/act3-venv/bin/pip" freeze > "$RUNNER_TEMP/act3-records/packages.txt"
      - name: Replay the pinned panel and diagnose termination
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/act3-venv/bin/python" -m unittest discover -s scripts/act2_learning -p test_diagnose.py -v > "$RUNNER_TEMP/act3-records/diagnostic-tests.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/diagnose.py --archive qualification/act2-learning-20261110/run2 --output "$RUNNER_TEMP/act3-records/diagnostic.json" > "$RUNNER_TEMP/act3-records/diagnostic.log" 2>&1
      - name: Check original owning formatter
        run: |
          set -euo pipefail
          git config --local credential.helper '!gh auth git-credential'
          git fetch --no-tags --depth=1 origin 0584b3344f70ed51d9e09224e105bfa4d1a4635f
          just fmt --base 0584b3344f70ed51d9e09224e105bfa4d1a4635f --check > "$RUNNER_TEMP/act3-records/formatter.log" 2>&1
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/act3-records/source-after.txt"
      - name: Test recurrent state and owner binding rejections
        if: github.ref_name != 'research/act3-stop-diagnosis-20261110'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/test_continuation.py --model qualification/act2-learning-20261110/run2/B4_gru-seed-700.npz -v > "$RUNNER_TEMP/act3-records/continuation-tests.log" 2>&1
      - name: Qualify original recurrent state across actual process death
        if: github.ref_name != 'research/act3-stop-diagnosis-20261110' && github.ref_name != 'research/act3-cold-state-20261110'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/qualify_continuation.py --models qualification/act2-learning-20261110/run2 --include-long-task --output "$RUNNER_TEMP/act3-records/continuation" > "$RUNNER_TEMP/act3-records/continuation.log" 2>&1
      - name: Qualify real filesystem effects and retained bytes
        if: github.ref_name == 'research/act3-tool-families-20261110' || github.ref_name == 'research/act3-browser-20261110' || github.ref_name == 'research/act3-composite-20261110' || github.ref_name == 'research/act3-procedural-replay-20261110'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/act3-venv/bin/python" -m unittest discover -s scripts/act2_learning -p test_file_family.py -v > "$RUNNER_TEMP/act3-records/filesystem-tests.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/qualify_families.py --archive qualification/act2-learning-20261110/run2 --families filesystem --output "$RUNNER_TEMP/act3-records/filesystem" > "$RUNNER_TEMP/act3-records/filesystem.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/audit_families.py "$RUNNER_TEMP/act3-records/filesystem" > "$RUNNER_TEMP/act3-records/filesystem-audit.json"
      - name: Install the pinned real browser runtime
        if: github.ref_name == 'research/act3-browser-20261110' || github.ref_name == 'research/act3-composite-20261110' || github.ref_name == 'research/act3-procedural-replay-20261110'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/act3-venv/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/act3-venv/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/act3-venv/bin/pip" freeze > "$RUNNER_TEMP/act3-records/browser-packages.txt"
      - name: Require actual DOM and owner effects without skipping
        if: github.ref_name == 'research/act3-browser-20261110' || github.ref_name == 'research/act3-composite-20261110' || github.ref_name == 'research/act3-procedural-replay-20261110'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/test_family_qualification.py --archive qualification/act2-learning-20261110/run2 -v > "$RUNNER_TEMP/act3-records/family-failure-tests.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/browser_family.py --output "$RUNNER_TEMP/act3-records/browser-engineering.json" > "$RUNNER_TEMP/act3-records/browser-engineering.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" -m unittest discover -s scripts/act2_learning -p test_browser_family.py -v > "$RUNNER_TEMP/act3-records/browser-tests.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/qualify_families.py --archive qualification/act2-learning-20261110/run2 --families browser --output "$RUNNER_TEMP/act3-records/browser-panel" > "$RUNNER_TEMP/act3-records/browser-panel.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/audit_families.py "$RUNNER_TEMP/act3-records/browser-panel" > "$RUNNER_TEMP/act3-records/browser-audit.json"
      - name: Require mixed filesystem and browser effects
        if: github.ref_name == 'research/act3-composite-20261110' || github.ref_name == 'research/act3-procedural-replay-20261110'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/act3-venv/bin/python" -m unittest discover -s scripts/act2_learning -p test_composite_family.py -v > "$RUNNER_TEMP/act3-records/composite-tests.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/qualify_families.py --archive qualification/act2-learning-20261110/run2 --families composition --output "$RUNNER_TEMP/act3-records/composite-panel" > "$RUNNER_TEMP/act3-records/composite-panel.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/audit_families.py "$RUNNER_TEMP/act3-records/composite-panel" > "$RUNNER_TEMP/act3-records/composite-audit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: act3-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/act3-records
          if-no-files-found: error
          retention-days: 30
