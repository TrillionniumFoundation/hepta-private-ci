name: Inference worker reviewed source materialization

on:
  workflow_dispatch:
  push:
    branches:
      - codex/inference-worker-authoritative-20260929
    paths:
      - .github/workflows/inference-worker-authoritative-qualification.yml
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/inference-worker-authoritative-qualification.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-reviewed-source-materialization
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BRANCH_NAME: codex/inference-worker-authoritative-20260929
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  materialize:
    name: Materialize reviewed inference.worker source
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'codex/inference-worker-authoritative-20260929'
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Check out exact setup commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact input head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply reviewed runtime closure patch
        run: python3 .github/materialization/inference-worker-runtime-closure/apply.py

      - name: Complete historical fixtures and monotonic observation metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-infer-core/src/native_control_tests.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: observed,
              };''': '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: observed,
                  observed_at_unix_ms: 0,
                  usage_units: None,
              };''',
              '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: old_output,
              };''': '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: old_output,
                  observed_at_unix_ms: 0,
                  usage_units: None,
              };''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one historical Observe fixture: {old!r}")
              text = text.replace(old, new, 1)
          anchor = '''    let mut json = serde_json::to_value(event).unwrap();
              json["Observe"]["output"]'''
          replacement = '''    let mut json = serde_json::to_value(event).unwrap();
              json["Observe"]
                  .as_object_mut()
                  .unwrap()
                  .remove("observed_at_unix_ms");
              json["Observe"]
                  .as_object_mut()
                  .unwrap()
                  .remove("usage_units");
              json["Observe"]["output"]'''
          if text.count(anchor) != 1:
              raise SystemExit("legacy Observe JSON anchor drifted")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          path = Path("codex-rs/hepta-infer-core/src/native_control.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        if record.observation.as_ref() == Some(&output)
                  && usage_units.is_none_or(|usage| record.observed_usage_units == Some(usage))
              {
                  return Ok(record.clone());
              }'''
          new = '''        if record.observation.as_ref() == Some(&output)
                  && usage_units.is_none_or(|usage| record.observed_usage_units == Some(usage))
                  && record.last_observed_at_unix_ms == Some(observed_at_unix_ms)
              {
                  return Ok(record.clone());
              }'''
          if text.count(old) != 1:
              raise SystemExit("observation idempotency anchor drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format exact Rust surfaces
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 \
            codex-rs/hepta-infer-core/src/native_control.rs \
            codex-rs/hepta-infer-core/src/native_control_tests.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/driver.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local_tests.rs \
            codex-rs/hepta-infer-worker-host/src/native_recovery.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs
          git diff --check

      - name: Refresh generated document projection
        run: python3 scripts/hepta-module-docs.py refresh-derived

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Test durable inference core
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-core

      - name: Test hosted worker default profile
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-worker-host

      - name: Test experimental local profile
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-worker-host --features experimental-local-model

      - name: Check and lint exact targets
        working-directory: codex-rs
        run: |
          cargo check --locked -p codex-hepta-infer-core --all-targets
          cargo check --locked -p codex-hepta-infer-worker-host --all-targets
          cargo check --locked -p codex-hepta-infer-worker-host --features experimental-local-model --all-targets
          cargo clippy --locked -p codex-hepta-infer-core --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p codex-hepta-infer-worker-host --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p codex-hepta-infer-worker-host --features experimental-local-model --all-targets --no-deps -- -D warnings

      - name: Verify source and documentation projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify
          python3 -m unittest discover -v -s scripts/tests -p 'test_inference_worker_*.py'
          git diff --check

      - name: Install read-only qualification and remove materializers
        shell: bash
        run: |
          set -euo pipefail
          git show b8a4f0a625ae2c56747a7abdf5a3d70a2fa50761:.github/workflows/inference-worker-authoritative-qualification.yml > .github/workflows/inference-worker-authoritative-qualification.yml
          rm -rf .github/materialization/inference-worker-runtime-closure
          rm -f .github/workflows/inference-worker-runtime-closure-materialize.yml
          rm -rf .github/materialization/inference-worker-stage1
          rm -rf .github/materialization/inference-worker-stage2
          rm -f .github/workflows/inference-worker-authoritative-materialize.yml
          rm -f .github/workflows/inference-worker-qualification.yml
          git diff --check

      - name: Commit and push reviewed source
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name hepta-inference-materializer
          git config user.email hepta-inference-materializer@users.noreply.github.com
          git add -A
          git commit -m 'inference.worker: persist usage age and interrupt hung local runs'
          git push origin "HEAD:$BRANCH_NAME"
