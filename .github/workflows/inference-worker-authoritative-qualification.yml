name: Inference worker final source materialization

on:
  push:
    branches:
      - automation/inference-worker-materialize-final-20260930
    paths:
      - .github/workflows/inference-worker-authoritative-qualification.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-final-source-materialization
  cancel-in-progress: true

env:
  SOURCE_SHA: 3a4d0e6bb7018c77e9443a38855d69146542febe
  TARGET_BRANCH: codex/inference-worker-authoritative-20260929
  EXPECTED_TARGET_SHA: 3a4d0e6bb7018c77e9443a38855d69146542febe
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    name: Materialize reviewed inference.worker source
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Check out exact authoritative candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Bind exact input and target heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Apply reviewed runtime closure patch
        shell: bash
        run: |
          set -uo pipefail
          python3 --version
          set +e
          python3 .github/materialization/inference-worker-runtime-closure/apply.py 2>&1 | tee "$RUNNER_TEMP/inference-worker-materializer.log"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '## inference.worker materializer'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/inference-worker-materializer.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" -eq 0

          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-infer-core/src/native_control_tests.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: observed,
              };''': '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: observed,
                  observed_at_unix_ms: 0,
                  usage_units: None,
              };''',
              '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: old_output,
              };''': '''    let event = Event::Observe {
                  request_id: "r1".to_string(),
                  output: old_output,
                  observed_at_unix_ms: 0,
                  usage_units: None,
              };''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one historical Observe fixture: {old!r}")
              text = text.replace(old, new, 1)
          anchor = '''    let mut json = serde_json::to_value(event).unwrap();
              json["Observe"]["output"]'''
          replacement = '''    let mut json = serde_json::to_value(event).unwrap();
              json["Observe"]
                  .as_object_mut()
                  .unwrap()
                  .remove("observed_at_unix_ms");
              json["Observe"]
                  .as_object_mut()
                  .unwrap()
                  .remove("usage_units");
              json["Observe"]["output"]'''
          if text.count(anchor) != 1:
              raise SystemExit("legacy Observe JSON anchor drifted")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          path = Path("codex-rs/hepta-infer-core/src/native_control.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        if record.observation.as_ref() == Some(&output)
                  && usage_units.is_none_or(|usage| record.observed_usage_units == Some(usage))
              {
                  return Ok(record.clone());
              }'''
          new = '''        if record.observation.as_ref() == Some(&output)
                  && usage_units.is_none_or(|usage| record.observed_usage_units == Some(usage))
                  && record.last_observed_at_unix_ms == Some(observed_at_unix_ms)
              {
                  return Ok(record.clone());
              }'''
          if text.count(old) != 1:
              raise SystemExit("observation idempotency anchor drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Refresh derived documentation and validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived
          if command -v rustfmt >/dev/null 2>&1; then
            rustfmt --edition 2024 \
              codex-rs/hepta-infer-core/src/native_control.rs \
              codex-rs/hepta-infer-core/src/native_control_tests.rs \
              codex-rs/hepta-infer-worker-host/src/experimental_local.rs \
              codex-rs/hepta-infer-worker-host/src/experimental_local/driver.rs \
              codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs \
              codex-rs/hepta-infer-worker-host/src/experimental_local_tests.rs \
              codex-rs/hepta-infer-worker-host/src/native_recovery.rs \
              codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs
          fi
          git diff --check

      - name: Install read-only authoritative qualification
        shell: bash
        run: |
          set -euo pipefail
          git show b8a4f0a625ae2c56747a7abdf5a3d70a2fa50761:.github/workflows/inference-worker-authoritative-qualification.yml > .github/workflows/inference-worker-authoritative-qualification.yml
          rm -rf .github/materialization/inference-worker-runtime-closure
          rm -f .github/workflows/inference-worker-runtime-closure-materialize.yml
          rm -rf .github/materialization/inference-worker-stage1
          rm -rf .github/materialization/inference-worker-stage2
          rm -f .github/workflows/inference-worker-authoritative-materialize.yml
          rm -f .github/workflows/inference-worker-qualification.yml
          git diff --check
          grep -Fq 'contents: read' .github/workflows/inference-worker-authoritative-qualification.yml
          ! grep -Eq 'git push|contents: write|apply\.py' .github/workflows/inference-worker-authoritative-qualification.yml

      - name: Commit ordinary source to authoritative branch
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"
          git config user.name hepta-inference-materializer
          git config user.email hepta-inference-materializer@users.noreply.github.com
          git add -A
          git commit -m 'inference.worker: materialize runtime closure as ordinary source'
          git push origin "HEAD:$TARGET_BRANCH"
