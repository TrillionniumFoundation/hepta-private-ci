name: Inference worker authoritative qualification

on:
  push:
    branches:
      - main
      - codex/inference-worker-authoritative-20260929
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.lock"
      - "scripts/hepta_ci_exec.py"
      - "scripts/inference_worker_command_receipt.py"
      - "scripts/run_inference_worker_qualification_lane.sh"
      - "scripts/test_inference_worker_command_receipt.py"
      - ".github/actions/hepta-synthetic-merge/**"
      - ".github/workflows/inference-worker-authoritative-qualification.yml"
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.lock"
      - "scripts/hepta_ci_exec.py"
      - "scripts/inference_worker_command_receipt.py"
      - "scripts/run_inference_worker_qualification_lane.sh"
      - "scripts/test_inference_worker_command_receipt.py"
      - ".github/actions/hepta-synthetic-merge/**"
      - ".github/workflows/inference-worker-authoritative-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-worker-authoritative-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  receipt_generator:
    name: Qualification receipt generator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source candidate
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Exercise command and aggregate receipt semantics
        run: python3 -m unittest -v scripts/test_inference_worker_command_receipt.py
      - name: Assert unchanged source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  qualification:
    name: source-head + base-merge / ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package:
          - codex-hepta-infer-core
          - codex-hepta-infer-worker-host
          - codex-hepta-agentd
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current target base
        id: base
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "refs/remotes/origin/${BASE_REF}^{commit}")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base_sha^{commit}"
          printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          printf 'BASE_SHA=%s\n' "$base_sha" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103

      - name: Verify workspace graph
        run: python3 scripts/hepta_workspace.py

      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Run exact source-head lane
        id: source
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          scripts/run_inference_worker_qualification_lane.sh \
            "$PACKAGE" source-head "$SOURCE_SHA" "$BASE_SHA" "$SOURCE_SHA" \
            "$RUNNER_TEMP/inference-worker-command-records/source-head"

      - name: Restore exact source before synthetic merge
        if: always()
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          git reset --hard "$SOURCE_SHA"
          git clean -fdx

      - name: Construct deterministic synthetic merge
        id: merge
        if: always()
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.base.outputs.sha }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: "0"
          author-name: Hepta inference worker qualification
          author-email: hepta-inference-worker-ci@users.noreply.github.com
          message: Synthetic inference.worker qualification merge

      - name: Run exact base-merge lane
        id: merge_lane
        if: always()
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.package }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        shell: bash
        run: |
          scripts/run_inference_worker_qualification_lane.sh \
            "$PACKAGE" base-merge "$SOURCE_SHA" "$BASE_SHA" "$MERGE_SHA" \
            "$RUNNER_TEMP/inference-worker-command-records/base-merge"

      - name: Retain exact command receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-command-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.package }}
          path: ${{ runner.temp }}/inference-worker-command-records/**
          if-no-files-found: error
          retention-days: 30

      - name: Require both exact lanes
        if: always()
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          MERGE_RESULT: ${{ steps.merge_lane.outcome }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$MERGE_RESULT" = success

  aggregate:
    name: Exact inference.worker qualification aggregate
    if: always()
    needs:
      - receipt_generator
      - qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current target base
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "refs/remotes/origin/${BASE_REF}^{commit}")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'BASE_SHA=%s\n' "$base_sha" >> "$GITHUB_ENV"

      - name: Download all command receipts
        id: download
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: inference-worker-command-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/inference-worker-command-receipts
          merge-multiple: false

      - name: Build exact aggregate
        if: always()
        env:
          GENERATOR_RESULT: ${{ needs.receipt_generator.result }}
          MATRIX_RESULT: ${{ needs.qualification.result }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          aggregate_result=0
          python3 scripts/inference_worker_command_receipt.py aggregate \
            --receipt-dir "$RUNNER_TEMP/inference-worker-command-receipts" \
            --source-sha "$SOURCE_SHA" \
            --base-sha "$BASE_SHA" \
            --expected-lane source-head \
            --expected-lane base-merge \
            --expected-package codex-hepta-infer-core \
            --expected-package codex-hepta-infer-worker-host \
            --expected-package codex-hepta-agentd \
            --output "$RUNNER_TEMP/inference-worker-qualification-aggregate.json" \
            || aggregate_result=$?
          test -f "$RUNNER_TEMP/inference-worker-qualification-aggregate.json"
          test "$GENERATOR_RESULT" = success
          test "$MATRIX_RESULT" = success
          test "$DOWNLOAD_RESULT" = success
          test "$aggregate_result" -eq 0

      - name: Retain aggregate receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-worker-qualification-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inference-worker-qualification-aggregate.json
          if-no-files-found: error
          retention-days: 30
