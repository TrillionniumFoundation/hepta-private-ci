name: Inference worker final source materialization

on:
  push:
    branches:
      - automation/inference-worker-materialize-final-20260930
    paths:
      - .github/workflows/inference-worker-authoritative-qualification.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-final-source-materialization
  cancel-in-progress: true

env:
  SOURCE_SHA: 3a4d0e6bb7018c77e9443a38855d69146542febe
  TARGET_BRANCH: codex/inference-worker-authoritative-20260929
  EXPECTED_TARGET_SHA: 3a4d0e6bb7018c77e9443a38855d69146542febe
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    name: Materialize ordinary inference.worker source
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Check out exact authoritative candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Bind immutable source and target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET_SHA"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Materialize reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/materialization/inference-worker-runtime-closure/apply.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          tests_path = Path("codex-rs/hepta-infer-core/src/native_control_tests.rs")
          tests = tests_path.read_text(encoding="utf-8")
          for output_name in ("observed", "old_output"):
              pattern = re.compile(
                  rf'''let event = Event::Observe \{{\s*
                  request_id:\s*"r1"\.to_string\(\),\s*
                  output:\s*{output_name},\s*
                  \}};''',
                  re.MULTILINE,
              )
              replacement = f'''let event = Event::Observe {{
                  request_id: "r1".to_string(),
                  output: {output_name},
                  observed_at_unix_ms: 0,
                  usage_units: None,
              }};'''
              tests, count = pattern.subn(replacement, tests, count=1)
              if count != 1:
                  raise SystemExit(
                      f"native_control_tests.rs: expected one {output_name} Observe fixture, found {count}"
                  )

          legacy = re.compile(
              r'''(?m)^(    let mut json = serde_json::to_value\(event\)\.unwrap\(\);\n)(    json\["Observe"\]\["output"\])'''
          )
          legacy_replacement = r'''\1    json["Observe"]
                  .as_object_mut()
                  .unwrap()
                  .remove("observed_at_unix_ms");
              json["Observe"]
                  .as_object_mut()
                  .unwrap()
                  .remove("usage_units");
\2'''
          tests, count = legacy.subn(legacy_replacement, tests, count=1)
          if count != 1:
              raise SystemExit(
                  f"native_control_tests.rs: expected one legacy Observe JSON projection, found {count}"
              )
          tests_path.write_text(tests, encoding="utf-8")

          native_path = Path("codex-rs/hepta-infer-core/src/native_control.rs")
          native = native_path.read_text(encoding="utf-8")
          condition = re.compile(
              r'''(?m)(        if record\.observation\.as_ref\(\) == Some\(&output\)\n            && usage_units\.is_none_or\(\|usage\| record\.observed_usage_units == Some\(usage\)\))(\n        \{)'''
          )
          native, count = condition.subn(
              r'''\1
            && record.last_observed_at_unix_ms == Some(observed_at_unix_ms)\2''',
              native,
              count=1,
          )
          if count != 1:
              raise SystemExit(
                  f"native_control.rs: expected one observation idempotency condition, found {count}"
              )
          native_path.write_text(native, encoding="utf-8")
          PY
          git diff --check

      - name: Refresh generated documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived
          git diff --check

      - name: Install read-only qualification and remove materializers
        shell: bash
        run: |
          set -euo pipefail
          git show b8a4f0a625ae2c56747a7abdf5a3d70a2fa50761:.github/workflows/inference-worker-authoritative-qualification.yml > .github/workflows/inference-worker-authoritative-qualification.yml
          rm -rf .github/materialization/inference-worker-runtime-closure
          rm -f .github/workflows/inference-worker-runtime-closure-materialize.yml
          rm -rf .github/materialization/inference-worker-stage1
          rm -rf .github/materialization/inference-worker-stage2
          rm -f .github/workflows/inference-worker-authoritative-materialize.yml
          rm -f .github/workflows/inference-worker-qualification.yml
          grep -Fq 'contents: read' .github/workflows/inference-worker-authoritative-qualification.yml
          ! grep -Eq 'git push|contents: write|apply\.py' .github/workflows/inference-worker-authoritative-qualification.yml
          git diff --check

      - name: Commit ordinary source to authoritative branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET_SHA"
          git config user.name hepta-inference-materializer
          git config user.email hepta-inference-materializer@users.noreply.github.com
          git add -A
          git commit -m 'inference.worker: materialize runtime closure as ordinary source'
          git push origin "HEAD:$TARGET_BRANCH"
