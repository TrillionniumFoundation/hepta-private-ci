name: Inference worker final source materialization

on:
  push:
    branches:
      - automation/inference-worker-materialize-final-20260930
    paths:
      - .github/workflows/inference-worker-authoritative-qualification.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-final-source-materialization
  cancel-in-progress: true

env:
  # One-shot source authoring is pinned to the immutable reviewed candidate.
  SOURCE_SHA: 3a4d0e6bb7018c77e9443a38855d69146542febe
  TARGET_BRANCH: codex/inference-worker-authoritative-20260929
  EXPECTED_TARGET_SHA: 3a4d0e6bb7018c77e9443a38855d69146542febe
  STAGING_BRANCH: automation/inference-worker-materialize-final-20260930
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    name: Materialize ordinary inference.worker source
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Check out exact authoritative candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Bind immutable source and target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET_SHA"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Materialize reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          git show "origin/$STAGING_BRANCH:.github/materialization/inference-worker-finalize.py" > "$RUNNER_TEMP/inference-worker-finalize.py"
          python3 .github/materialization/inference-worker-runtime-closure/apply.py
          python3 "$RUNNER_TEMP/inference-worker-finalize.py"
          git diff --check

      - name: Refresh generated documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived
          git diff --check

      - name: Install read-only qualification and remove materializers
        shell: bash
        run: |
          set -euo pipefail
          git show b8a4f0a625ae2c56747a7abdf5a3d70a2fa50761:.github/workflows/inference-worker-authoritative-qualification.yml > .github/workflows/inference-worker-authoritative-qualification.yml
          rm -rf .github/materialization/inference-worker-runtime-closure
          rm -f .github/workflows/inference-worker-runtime-closure-materialize.yml
          rm -rf .github/materialization/inference-worker-stage1
          rm -rf .github/materialization/inference-worker-stage2
          rm -f .github/workflows/inference-worker-authoritative-materialize.yml
          rm -f .github/workflows/inference-worker-qualification.yml
          grep -Fq 'contents: read' .github/workflows/inference-worker-authoritative-qualification.yml
          ! grep -Eq 'git push|git commit|contents: write|apply\.py' .github/workflows/inference-worker-authoritative-qualification.yml
          test ! -e .github/materialization/inference-worker-runtime-closure
          test ! -e .github/materialization/inference-worker-stage1
          test ! -e .github/materialization/inference-worker-stage2
          git diff --check

      - name: Package immutable ordinary-source payload
        shell: bash
        env:
          PAYLOAD_DIR: ${{ runner.temp }}/inference-worker-materialized-source
        run: |
          set -euo pipefail
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR/files"
          git add -A
          git diff --cached --check
          git diff --cached --name-status > "$PAYLOAD_DIR/manifest.tsv"
          git diff --cached --name-only --diff-filter=D > "$PAYLOAD_DIR/deleted-paths.txt"
          git diff --cached --name-only --diff-filter=ACMRTUXB -z > "$PAYLOAD_DIR/changed-paths.z"
          git diff --cached --binary --full-index > "$PAYLOAD_DIR/materialized-source.patch"
          git write-tree > "$PAYLOAD_DIR/expected-tree.txt"
          printf '%s\n' "$SOURCE_SHA" > "$PAYLOAD_DIR/source-head.txt"
          printf '%s\n' "$EXPECTED_TARGET_SHA" > "$PAYLOAD_DIR/expected-target-head.txt"
          printf '%s\n' "$GITHUB_SHA" > "$PAYLOAD_DIR/materializer-workflow-head.txt"
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path.cwd().resolve()
          payload = Path(os.environ["PAYLOAD_DIR"]).resolve()
          raw_paths = (payload / "changed-paths.z").read_bytes().split(b"\0")
          for raw_path in raw_paths:
              if not raw_path:
                  continue
              relative = Path(os.fsdecode(raw_path))
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"unsafe materialized path: {relative}")
              source = root / relative
              if not source.is_file():
                  raise SystemExit(f"materialized file missing: {relative}")
              destination = payload / "files" / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY
          find "$PAYLOAD_DIR" -type f ! -name payload-sha256.txt -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$PAYLOAD_DIR/payload-sha256.txt"
          test -s "$PAYLOAD_DIR/manifest.tsv"
          test -s "$PAYLOAD_DIR/materialized-source.patch"

      - name: Publish immutable blobs, tree and commit without updating a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_DIR: ${{ runner.temp }}/inference-worker-materialized-source
          COMMIT_MESSAGE: "inference.worker: materialize runtime closure as ordinary source"
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET_SHA"
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source_sha = os.environ["SOURCE_SHA"]
          expected_target_sha = os.environ["EXPECTED_TARGET_SHA"]
          payload = Path(os.environ["PAYLOAD_DIR"])

          def git(*args: str, binary: bool = False):
              result = subprocess.run(
                  ["git", *args],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              return result.stdout if binary else result.stdout.decode("utf-8").strip()

          def api(method: str, suffix: str, body=None):
              url = f"https://api.github.com/repos/{repository}/{suffix}"
              data = None if body is None else json.dumps(body, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "hepta-inference-materializer",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"GitHub API {method} {suffix} failed: {error.code}: {detail}") from error

          target_ref = api("GET", f"git/ref/heads/{os.environ['TARGET_BRANCH']}")
          if target_ref["object"]["sha"] != expected_target_sha:
              raise SystemExit("authoritative target moved during materialization")

          changed_raw = git("diff", "--cached", "--name-only", "--diff-filter=ACMRTUXB", "-z", binary=True)
          changed = [os.fsdecode(path) for path in changed_raw.split(b"\0") if path]
          deleted_raw = git("diff", "--cached", "--name-only", "--diff-filter=D", "-z", binary=True)
          deleted = [os.fsdecode(path) for path in deleted_raw.split(b"\0") if path]
          entries = []

          for path in changed:
              index_line = git("ls-files", "-s", "--", path)
              mode, local_blob_sha, stage_and_path = index_line.split(maxsplit=2)
              stage = stage_and_path.split("\t", 1)[0]
              if stage != "0":
                  raise SystemExit(f"nonzero index stage for {path}: {stage}")
              content = Path(path).read_bytes()
              remote_blob = api(
                  "POST",
                  "git/blobs",
                  {
                      "content": base64.b64encode(content).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              if remote_blob["sha"] != local_blob_sha:
                  raise SystemExit(
                      f"blob identity mismatch for {path}: local={local_blob_sha} remote={remote_blob['sha']}"
                  )
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": local_blob_sha})

          for path in deleted:
              original = git("ls-tree", source_sha, "--", path)
              if not original:
                  raise SystemExit(f"deleted path absent from source tree: {path}")
              metadata, observed_path = original.split("\t", 1)
              mode, object_type, _old_sha = metadata.split()
              if observed_path != path or object_type != "blob":
                  raise SystemExit(f"unsupported deleted entry: {original}")
              entries.append({"path": path, "mode": mode, "type": object_type, "sha": None})

          expected_tree = git("write-tree")
          base_tree = git("rev-parse", f"{source_sha}^{{tree}}")
          remote_tree = api(
              "POST",
              "git/trees",
              {"base_tree": base_tree, "tree": entries},
          )
          if remote_tree["sha"] != expected_tree:
              raise SystemExit(
                  f"tree identity mismatch: local={expected_tree} remote={remote_tree['sha']}"
              )

          remote_commit = api(
              "POST",
              "git/commits",
              {
                  "message": os.environ["COMMIT_MESSAGE"],
                  "tree": expected_tree,
                  "parents": [source_sha],
              },
          )
          if remote_commit["tree"]["sha"] != expected_tree:
              raise SystemExit("remote commit does not bind the expected tree")
          (payload / "remote-commit-sha.txt").write_text(remote_commit["sha"] + "\n", encoding="utf-8")
          (payload / "remote-tree-sha.txt").write_text(expected_tree + "\n", encoding="utf-8")
          print(f"remote_commit_sha={remote_commit['sha']}")
          print(f"remote_tree_sha={expected_tree}")
          PY

      - name: Retain immutable ordinary-source payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inference-worker-materialized-source-${{ github.sha }}
          path: ${{ runner.temp }}/inference-worker-materialized-source
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
