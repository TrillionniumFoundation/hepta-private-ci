name: Inference worker exact-head source export

on:
  push:
    branches:
      - automation/inference-worker-materialize-final-20260930
    paths:
      - .github/workflows/inference-worker-authoritative-qualification.yml

permissions:
  contents: read

concurrency:
  group: inference-worker-exact-head-source-export
  cancel-in-progress: true

env:
  SOURCE_SHA: 7626ccb14444403a3a27cca7200c5f29b2b392ab

jobs:
  export:
    name: Export exact-head inference.worker source
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Bind immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Stage bounded source slice
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/inference-worker-source"
          mkdir -p "$out"
          for path in \
            codex-rs/hepta-infer-core/src/native_control.rs \
            codex-rs/hepta-infer-core/src/native_control_tests.rs \
            codex-rs/hepta-infer-worker-host/Cargo.toml \
            codex-rs/hepta-infer-worker-host/src/experimental_local.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/authority.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/driver.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/resources.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local_tests.rs \
            docs/modules/inference.worker/TECHNICAL.md \
            docs/modules/inference.worker/RECOVERY_AND_OPERATIONS.md \
            docs/modules/inference.worker/LOCAL_MODEL_RECOVERY.md \
            docs/modules/inference.worker/CURRENT_STATUS.json \
            docs/modules/inference.worker/IMPLEMENTATION_MAP.json
          do
            mkdir -p "$out/$(dirname "$path")"
            cp "$path" "$out/$path"
          done
          printf '%s\n' "$SOURCE_SHA" > "$out/SOURCE_SHA"
          find "$out" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Retain exact source slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inference-worker-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/inference-worker-source
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
