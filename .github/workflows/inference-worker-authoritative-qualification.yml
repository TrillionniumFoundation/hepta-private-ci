name: Inference worker authoritative qualification

on:
  push:
    branches:
      - codex/inference-worker-authoritative-20260929
    paths:
      - .github/materialization/inference-worker-runtime-closure/**
      - .github/workflows/inference-worker-runtime-closure-materialize.yml
      - .github/workflows/inference-worker-authoritative-qualification.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-runtime-closure-materialize
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}
  BRANCH_NAME: codex/inference-worker-authoritative-20260929
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  materialize:
    name: Materialize durable usage, interrupts, and event-sequence proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact setup commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact input head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply reviewed runtime closure patch
        run: python3 .github/materialization/inference-worker-runtime-closure/apply.py

      - name: Format exact Rust surfaces
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 \
            codex-rs/hepta-infer-core/src/native_control.rs \
            codex-rs/hepta-infer-core/src/native_control_tests.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/driver.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local/durable.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local_tests.rs \
            codex-rs/hepta-infer-worker-host/src/native_recovery.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs
          git diff --check

      - name: Refresh generated document projection
        run: python3 scripts/hepta-module-docs.py refresh-derived

      - name: Prepare native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Expose DotSlash for integration tests
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash

      - name: Resolve verified sandboxed V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Test durable inference core
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-core

      - name: Test authoritative worker including local profile
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-worker-host --features experimental-local-model

      - name: Exercise real Agentd App Server event sequence
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-infer-worker-host \
            --features experimental-local-model \
            real_agentd_worker_accepts_fresh_context_and_rejects_final_use_tombstone \
            -- --nocapture --test-threads=1

      - name: Check all targets
        working-directory: codex-rs
        run: |
          cargo check --locked -p codex-hepta-infer-core --all-targets
          cargo check --locked -p codex-hepta-infer-worker-host \
            --features experimental-local-model --all-targets

      - name: Strict Clippy
        working-directory: codex-rs
        run: |
          cargo clippy --locked -p codex-hepta-infer-core \
            --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p codex-hepta-infer-worker-host \
            --features experimental-local-model \
            --all-targets --no-deps -- -D warnings

      - name: Verify source and documentation projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify
          python3 -m unittest discover -v -s scripts/tests \
            -p 'test_inference_worker_*.py'
          git diff --check

      - name: Restore qualification workflow and remove one-shot materializers
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_SHA^:.github/workflows/inference-worker-authoritative-qualification.yml" \
            > .github/workflows/inference-worker-authoritative-qualification.yml
          rm -rf .github/materialization/inference-worker-runtime-closure
          rm -f .github/workflows/inference-worker-runtime-closure-materialize.yml
          rm -rf .github/materialization/inference-worker-stage1
          rm -rf .github/materialization/inference-worker-stage2
          rm -f .github/workflows/inference-worker-authoritative-materialize.yml
          git diff --check

      - name: Commit and push verified closure
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name hepta-inference-materializer
          git config user.email hepta-inference-materializer@users.noreply.github.com
          git add -A
          git commit -m 'inference.worker: persist usage age and interrupt hung local runs'
          git push origin "HEAD:$BRANCH_NAME"
