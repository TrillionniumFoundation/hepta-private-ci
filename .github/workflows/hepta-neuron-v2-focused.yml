name: Hepta Neuron V2 focused native qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-agentd/src/test_support.rs"
      - "codex-rs/cli/Cargo.toml"
      - "codex-rs/cli/src/codex.rs"
      - "codex-rs/cli/src/main.rs"
      - "codex-rs/cli/src/hepta.rs"
      - ".github/workflows/hepta-neuron-v2-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-neuron-v2-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust-owner:
    name: Shared feature V2 and gated Cell head / Rust owner tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact PR candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind source identity and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          rustc --version --verbose
          cargo --version
          cargo fmt --version

      - name: Check exact-owner formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-infer-core --package codex-hepta-infer-worker-host -- --check

      - name: Compile all targets from the locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets

      - name: Prove actual CLI crate roots own the recursion bound
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps",
              "--format-version", "1", "--manifest-path", "codex-rs/Cargo.toml",
          ]))
          packages = [pkg for pkg in metadata["packages"] if pkg["name"] == "codex-cli"]
          if len(packages) != 1:
              raise SystemExit("expected a single codex-cli package")
          binaries = {
              target["name"]: Path(target["src_path"]).name
              for target in packages[0]["targets"] if "bin" in target["kind"]
          }
          expected = {
              "codex": "codex.rs", "codex-cli": "codex.rs",
              "hepta": "hepta.rs", "logs_client": "logs_client.rs",
          }
          if binaries != expected:
              raise SystemExit(f"unexpected CLI binary roots: {binaries!r}")
          source_dir = Path("codex-rs/cli/src")
          common = (source_dir / "main.rs").read_text(encoding="utf-8")
          if any(line.lstrip().startswith("#![") for line in common.splitlines()):
              raise SystemExit("included main.rs must not carry crate-level inner attributes")
          for name in ("codex", "hepta"):
              root = (source_dir / f"{name}.rs").read_text(encoding="utf-8")
              if not root.startswith('#![recursion_limit = "256"]') or 'include!("main.rs");' not in root:
                  raise SystemExit(f"{name}: missing crate-root recursion bound")
          print("verified exact CLI crate roots and recursion bounds")
          PY
      - name: Build real Codex executable for Agentd E2E
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-cli --bin codex
          test -x codex-rs/target/debug/codex

      - name: Execute original and V2 Rust regression tests
        shell: bash
        env:
          HEPTA_TEST_CODEX_EXECUTABLE: ${{ github.workspace }}/codex-rs/target/debug/codex
        run: |
          set -euo pipefail
          test -x "$HEPTA_TEST_CODEX_EXECUTABLE"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core --lib
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-worker-host --lib

      - name: Strict safety lints
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets -- -D clippy::correctness -D clippy::await_holding_lock -D clippy::await_holding_invalid_type

      - name: Preserve tested working tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
