name: hepta-ndu-fbsde-short-horizon-shadow

on:
  pull_request:
    paths:
      - "qualification/ndu-fbsde-short-horizon-shadow-20261018/**"
      - "qualification/cell-fast-path-actionir-p0/**"
      - ".github/workflows/hepta-ndu-fbsde-short-horizon-shadow.yml"

permissions:
  contents: read

jobs:
  fbsde-shadow-contract:
    name: fbsde-short-horizon-shadow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile contracts
        run: |
          python -m py_compile qualification/cell-fast-path-actionir-p0/cell_fast_path_actionir.py
          python -m py_compile qualification/ndu-fbsde-short-horizon-shadow-20261018/fbsde_short_horizon.py
      - name: Run contract tests
        run: |
          export PYTHONPATH=qualification/cell-fast-path-actionir-p0:qualification/ndu-fbsde-short-horizon-shadow-20261018
          python -m unittest discover -s qualification/ndu-fbsde-short-horizon-shadow-20261018 -p 'test_*.py' -v
