name: NDU walltime unique JSON fail-closed regression (HOLD)

on:
  push:
    branches:
      - dot/hia-ndu-json-unique-evidence-20261105
  pull_request:
    paths:
      - .github/workflows/ndu-walltime-unique-json-regression.yml
      - experiments/multimodal_output_portfolio/joint_hepta_20261029/v3/ndu_walltime/runtime.py
      - experiments/multimodal_output_portfolio/joint_hepta_20261029/v3/ndu_walltime/test_runtime.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout and execute adversarial native subprocess tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 --version
          git rev-parse HEAD
          sha256sum experiments/multimodal_output_portfolio/joint_hepta_20261029/v3/ndu_walltime/{runtime,test_runtime}.py
          python3 -B -m unittest experiments.multimodal_output_portfolio.joint_hepta_20261029.v3.ndu_walltime.test_runtime -v
          test -z "$(git status --porcelain)"
