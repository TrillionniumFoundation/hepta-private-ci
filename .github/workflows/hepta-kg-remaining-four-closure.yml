name: knowledge.graph remaining-four closure

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928

permissions:
  contents: write

concurrency:
  group: kg-remaining-four-${{ github.sha }}
  cancel-in-progress: false

jobs:
  close-labelled:
    name: close (${{ matrix.runner_name }})
    if: startsWith(github.event.head_commit.message, 'kg remaining-four closure')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_name: rog
            platform: linux
            runs_on: '["self-hosted","linux","x64","rog"]'
          - runner_name: pocket4
            platform: linux
            runs_on: '["self-hosted","linux","x64","pocket4"]'
          - runner_name: macbook-pro
            platform: macos
            runs_on: '["self-hosted","macOS","ARM64","macbook"]'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Execute fenced closure
        shell: bash
        run: bash .github/kg-run-finalize.sh '${{ matrix.platform }}' '${{ matrix.runner_name }}'

  close-gpu-group:
    name: close (trillionnium-android-gpu)
    if: startsWith(github.event.head_commit.message, 'kg remaining-four closure')
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Execute fenced closure
        shell: bash
        run: bash .github/kg-run-finalize.sh linux

  close-hosted:
    name: close (${{ matrix.runner_name }})
    if: startsWith(github.event.head_commit.message, 'kg remaining-four closure')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_name: hosted-linux-x64
            platform: linux
            runs_on: ubuntu-24.04
          - runner_name: hosted-linux-arm64
            platform: linux
            runs_on: ubuntu-24.04-arm
          - runner_name: hosted-macos-arm64
            platform: macos
            runs_on: macos-15
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Execute fenced closure
        shell: bash
        run: bash .github/kg-run-finalize.sh '${{ matrix.platform }}'
