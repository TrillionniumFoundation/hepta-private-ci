name: knowledge.graph remaining-five executor

on:
  push:
    branches:
      - ops/kg-remaining-five-executor-20260929

permissions:
  contents: write

concurrency:
  group: kg-remaining-five-executor
  cancel-in-progress: true

jobs:
  close-hosted:
    name: close (hosted-linux-x64)
    if: startsWith(github.event.head_commit.message, 'kg remaining-four closure')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Execute fenced closure and preserve diagnostics
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/kg-finalize.log"
          set +e
          bash .github/kg-run-finalize.sh linux 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            cp "$log" "$RUNNER_TEMP/kg-finalize-full.log"
            git reset --hard "$GITHUB_SHA"
            git clean -fdx
            mkdir -p qualification/evidence/knowledge.graph
            {
              printf 'executor_sha=%s\n' "$GITHUB_SHA"
              printf 'run_id=%s\n' "$GITHUB_RUN_ID"
              printf 'runner_os=%s\n' "$RUNNER_OS"
              printf 'runner_arch=%s\n' "$RUNNER_ARCH"
              printf 'exit_status=%s\n\n' "$status"
              tail -n 4000 "$RUNNER_TEMP/kg-finalize-full.log"
            } > qualification/evidence/knowledge.graph/finalizer-failure.log
            git config user.name "Hepta Knowledge Graph Bot"
            git config user.email "hepta-kg-bot@users.noreply.github.com"
            git add qualification/evidence/knowledge.graph/finalizer-failure.log
            git commit -m "chore(knowledge.graph): capture finalizer failure diagnostics"
            git push origin "HEAD:ops/kg-remaining-five-executor-20260929"
            exit "$status"
          fi
