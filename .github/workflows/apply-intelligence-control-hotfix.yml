name: Apply intelligence.control qualification hotfix

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - scripts/intelligence-control-hotfix.patch
      - .github/workflows/apply-intelligence-control-hotfix.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact reviewed patch and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check scripts/intelligence-control-hotfix.patch
          git apply scripts/intelligence-control-hotfix.patch
          rm scripts/intelligence-control-hotfix.patch
          rm .github/workflows/apply-intelligence-control-hotfix.yml
          git add -A
          git diff --cached --check
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "fix(intelligence.control): close native qualification blockers" -m "Restore the real Agentd test-host readiness transition, bind the final-use source-order assertion to the current authorized turn-start helper, and keep AuthBus strict Clippy exceptions local and auditable."
          git push origin "HEAD:${GITHUB_REF_NAME}"
