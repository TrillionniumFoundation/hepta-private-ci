name: hepta-stem-v21-original-source-plan-parity
on:
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/v21_original_plan_rebuilder.py'
      - 'qualification/stem-cell-v1/test_v21_original_plan_rebuilder.py'
      - 'qualification/stem-cell-v1/V21_ORIGINAL_SOURCE_PLAN_RECEIPT_20261016.json'
      - 'qualification/stem-cell-v1/STEM_V21_ORIGINAL_SOURCE_PLAN_PARITY.md'
      - '.github/workflows/hepta-stem-v21-original-source-plan-parity.yml'
  push:
    branches:
      - research/stem-v21-original-request-parity-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only compilation and adversarial contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=qualification/stem-cell-v1
          python -m compileall -q qualification/stem-cell-v1/v21_original_plan_rebuilder.py qualification/stem-cell-v1/test_v21_original_plan_rebuilder.py
          python -m unittest discover -s qualification/stem-cell-v1 -p 'test_v21_original_plan_rebuilder.py' -v
          python -O -m unittest discover -s qualification/stem-cell-v1 -p 'test_v21_original_plan_rebuilder.py' -v
      - name: Review sanitized historical digest receipt only
        shell: bash
        run: |
          set -euo pipefail
          python qualification/stem-cell-v1/v21_original_plan_rebuilder.py \
            --public-receipt qualification/stem-cell-v1/V21_ORIGINAL_SOURCE_PLAN_RECEIPT_20261016.json
          python - <<'PY'
          from pathlib import Path
          f=Path('.github/workflows/hepta-stem-v21-original-source-plan-parity.yml').read_text()
          for forbidden in ('upload-artifact@','download-artifact@','huggingface_hub','HF_TOKEN','model.generate('):
              if forbidden in f.split('      - name: Review sanitized historical digest receipt only')[0]:
                  raise SystemExit('Unexpected private model/source access in source-only workflow')
          if 'contents: read' not in f:raise SystemExit('Workflow must be read-only')
          PY
