name: Materialize secrets.heptabao SQLite runtime source

on:
  push:
    branches:
      - codex/secrets-heptabao-ops-closure-build-20260929
    paths:
      - ".github/workflows/secrets-ops-materialize.yml"

permissions:
  contents: write

env:
  SOURCE_SHA: f169cc9f4874c7956e6ff638609fdef1b362883b
  OUTPUT_BRANCH: codex/secrets-heptabao-sqlite-product-runtime-source-20260929

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply bounded patch and push source branch
        shell: bash
        run: |
          set -euo pipefail
          cp .ci/secrets-heptabao-ops.patch.gz.b64 "$RUNNER_TEMP/ops.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/ops.patch.gz.b64" | gzip --decompress --stdout > "$RUNNER_TEMP/ops.patch"
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          git switch --create "$OUTPUT_BRANCH"
          git apply --index "$RUNNER_TEMP/ops.patch"
          git diff --cached --check
          git config user.name "Hepta secrets ops closure bot"
          git config user.email "hepta-secrets-ops-closure@users.noreply.github.com"
          git commit -m "secrets: stage SQLite product runtime and recovery worker"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          test -z "$(git status --porcelain)"
