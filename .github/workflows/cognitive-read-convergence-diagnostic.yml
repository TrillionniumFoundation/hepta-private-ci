name: Cognitive read convergence diagnostic

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-read-convergence-diagnostic-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose cognitive.read convergence payload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assemble reviewed convergence helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import lzma
          import os
          from pathlib import Path

          parts = sorted(Path('.github/scripts').glob('cognitive_read_converge.py.xz.b64.*'))
          if not parts:
              raise SystemExit('missing cognitive.read convergence payload')
          encoded = b''.join(
              path.read_bytes().replace(b'\n', b'').replace(b'\r', b'')
              for path in parts
          )
          decoded = base64.b64decode(encoded, validate=True)
          target = Path(os.environ['RUNNER_TEMP']) / 'cognitive_read_converge.py'
          target.write_bytes(lzma.decompress(decoded))
          print(target)
          PY
          python3 -m py_compile "$RUNNER_TEMP/cognitive_read_converge.py"

      - name: Execute transformation and retain traceback
        id: patch
        shell: bash
        run: |
          set +e
          python3 "$RUNNER_TEMP/cognitive_read_converge.py" patch \
            > "$RUNNER_TEMP/cognitive-read-converge.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/cognitive-read-converge.exit-code"
          cat "$RUNNER_TEMP/cognitive-read-converge.log"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Retain diagnostic payload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-convergence-diagnostic-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cognitive_read_converge.py
            ${{ runner.temp }}/cognitive-read-converge.log
            ${{ runner.temp }}/cognitive-read-converge.exit-code
          if-no-files-found: error
          retention-days: 7

      - name: Enforce transformation result
        if: always()
        shell: bash
        run: test '${{ steps.patch.outputs.code }}' = '0'
