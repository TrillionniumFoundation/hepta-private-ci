name: hcsn-currentstate-n256-tail1159-intent

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_tail1159_intent/**"
      - ".github/workflows/hcsn-currentstate-n256-tail1159-intent.yml"

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify fail-closed source without authentic execution
        run: |
          python3 -m qualification.hcsn_currentstate_n256_tail1159_intent.verify_source
          python3 -O -m qualification.hcsn_currentstate_n256_tail1159_intent.verify_source
          python3 -m unittest qualification.hcsn_currentstate_n256_tail1159_intent.test_intent -v
          python3 -O -m unittest qualification.hcsn_currentstate_n256_tail1159_intent.test_intent -v
          python3 -m py_compile qualification/hcsn_currentstate_n256_tail1159_intent/*.py
