name: Neuron storage regression (read-only)
on:
  push:
    branches: [codex/neuron-runtime-durable-closure-v1]
    paths:
      - 'codex-rs/hepta-neuron/**'
      - '.github/workflows/neuron-storage-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        candidate: [source-head, synthetic-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze and construct candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neuron-storage"
          source=$(git rev-parse HEAD)
          base=a126987b84737dbc2ee2592442a314117bddb4a2
          if [ "$CANDIDATE" = synthetic-merge ]; then
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            git -c user.name=neuron-storage-ci -c user.email=qualification@invalid.local merge --no-ff --no-edit "$base"
          fi
          printf 'source=%s\nbase=%s\ncandidate=%s\ntree=%s\n' "$source" "$base" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee "$RUNNER_TEMP/neuron-storage/identity.txt"
      - name: Install repository runners
        run: |
          set -euo pipefail
          command -v just >/dev/null || cargo install --locked just
          cargo nextest --version || cargo install --locked cargo-nextest
      - name: Compile and execute real Neuron tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee "$RUNNER_TEMP/neuron-storage/toolchain.txt"
          cargo check --locked -p codex-hepta-neuron --all-targets 2>&1 | tee "$RUNNER_TEMP/neuron-storage/check.log"
          just test --locked -p codex-hepta-neuron 2>&1 | tee "$RUNNER_TEMP/neuron-storage/tests.log"
      - name: Lint and formatting diagnostics
        if: always()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-neuron --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/neuron-storage/clippy.log"
          cargo fmt --package codex-hepta-neuron -- --check 2>&1 | tee "$RUNNER_TEMP/neuron-storage/format.log"
      - name: Retain exact evidence and formatting proposal without writing a branch
        if: always()
        shell: bash
        env:
          LANE_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/neuron-storage"
          printf 'lane_status=%s\nactivation=false\nindependent_acceptance=false\nrelease=false\n' "$LANE_STATUS" > "$RUNNER_TEMP/neuron-storage/result.txt"
          (cd codex-rs && cargo fmt --package codex-hepta-neuron) || true
          git diff --binary -- codex-rs/hepta-neuron > "$RUNNER_TEMP/neuron-storage/format-proposal.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuron-storage-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neuron-storage/
          retention-days: 90
          if-no-files-found: error
