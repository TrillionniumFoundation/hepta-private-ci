name: platform.types one-shot exact-candidate repair

on:
  push:
    branches:
      - codex/platform-types-production-convergence-20260925
    paths:
      - .github/workflows/platform-types-convergence-repair.yml

permissions:
  contents: write

concurrency:
  group: platform-types-one-shot-exact-candidate-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair source, lock, evidence, and remove migration workflow
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BRANCH: codex/platform-types-production-convergence-20260925
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned native toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Apply guarded implementation, evidence, and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          def insert_before_once(path: str, marker: str, addition: str, sentinel: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if sentinel in text:
                  raise SystemExit(f"{path}: insertion already present")
              if text.count(marker) != 1:
                  raise SystemExit(f"{path}: insertion anchor drifted")
              file.write_text(text.replace(marker, addition + marker), encoding="utf-8")

          def append_once(path: str, addition: str, sentinel: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if sentinel in text:
                  raise SystemExit(f"{path}: append already present")
              file.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")

          replace_once(
              "codex-rs/hepta-wire/src/platform_manifest_json.rs",
              ".set(index.checked_add(1).ok_or_else(|| StrictJsonError::InvalidValue(field))?);",
