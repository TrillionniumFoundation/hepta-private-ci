name: platform.types one-shot exact-candidate repair

on:
  push:
    branches:
      - codex/platform-types-production-convergence-20260925
    paths:
      - .github/workflows/platform-types-convergence-repair.yml

permissions:
  contents: write

concurrency:
  group: platform-types-one-shot-exact-candidate-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair source, lock, evidence, and remove migration workflow
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BRANCH: codex/platform-types-production-convergence-20260925
      RUSTUP_TOOLCHAIN: "1.96.0"
      PYTHONPATH: scripts
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_RETRY: "20"
      CARGO_HTTP_TIMEOUT: "600"
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_HTTP_LOW_SPEED_LIMIT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned native toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Apply guarded source and documentation patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/platform_types_apply_closure_repair.py")
          text = path.read_text(encoding="utf-8")
          old = """    replace_once(
                  \"codex-rs/hepta-wire/src/platform_manifest_json.rs\",
                  \".set(index.checked_add(1).ok_or_else(|| StrictJsonError::InvalidValue(field))?);\",
                  \".set(index.checked_add(1).ok_or(StrictJsonError::InvalidValue(field))?);\",
              )
          """
          new = """    replace_once(
                  \"codex-rs/hepta-wire/src/platform_manifest_json.rs\",
                  '''                depth = depth.checked_add(1).ok_or_else(|| {
                              PlatformManifestWireError::Wire(PlatformTypesWireError::DepthExceeded)
                          })?;''',
                  '''                depth = depth.checked_add(1).ok_or(
                              PlatformManifestWireError::Wire(PlatformTypesWireError::DepthExceeded),
                          )?;''',
              )
          """
          if text.count(old) != 1:
              raise SystemExit("platform manifest repair anchor drifted")
          text = text.replace(old, new)

          start = text.index("def repair_rama_manifest() -> None:\n")
          end = text.index("\n\ndef repair_registry_indexes() -> None:", start)
          replacement = '''def repair_rama_manifest() -> None:
              replace_once(
                  "codex-rs/network-proxy/Cargo.toml",
                  """rama-core = { version = "=0.3.0-alpha.4" }
rama-http = { version = "=0.3.0-alpha.4" }
rama-http-backend = { version = "=0.3.0-alpha.4", features = ["tls"] }
rama-net = { version = "=0.3.0-alpha.4", features = ["http", "tls"] }
rama-socks5 = { version = "=0.3.0-alpha.4" }
rama-tcp = { version = "=0.3.0-alpha.4", features = ["http"] }
rama-tls-rustls = { version = "=0.3.0-alpha.4", features = ["http"] }""",
                  """# Rama 0.3.0 is a single coherent release train. Exact direct
# constraints prevent a future lock refresh from mixing private support APIs.
rama-core = { version = "=0.3.0" }
rama-error = "=0.3.0"
rama-http = { version = "=0.3.0" }
rama-http-backend = { version = "=0.3.0", features = ["tls"] }
rama-macros = "=0.3.0"
rama-net = { version = "=0.3.0", features = ["http", "tls"] }
rama-socks5 = { version = "=0.3.0" }
rama-tcp = { version = "=0.3.0", features = ["http"] }
rama-tls-rustls = { version = "=0.3.0", features = ["http"] }
rama-utils = "=0.3.0"""",
              )
              replace_once(
                  "codex-rs/network-proxy/Cargo.toml",
                  'rama-unix = { version = "=0.3.0-alpha.4" }',
                  'rama-unix = { version = "=0.3.0" }',
              )
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          guard_path = Path("scripts/platform_types_rama_lock_guard.py")
          guard = guard_path.read_text(encoding="utf-8")
          if guard.count('EXPECTED_VERSION = "0.3.0-alpha.4"') != 1:
              raise SystemExit("Rama lock guard version anchor drifted")
          guard = guard.replace(
              '"""Reject incoherent Rama prerelease selections in platform.types qualification."""',
              '"""Reject incoherent Rama release selections in platform.types qualification."""',
          ).replace(
              'EXPECTED_VERSION = "0.3.0-alpha.4"',
              'EXPECTED_VERSION = "0.3.0"',
          )
          guard_path.write_text(guard, encoding="utf-8")

          Path("scripts/test_platform_types_rama_lock_guard.py").write_text(
              '''"""Regression tests for exact Rama release graph enforcement."""

from __future__ import annotations

import tempfile
import unittest
from pathlib import Path

from platform_types_rama_lock_guard import (
    EXPECTED_VERSION,
    REQUIRED_PACKAGES,
    RamaLockError,
    validate,
)

WRONG_VERSION = "0.3.0-alpha.4"


def manifest_text(*, wrong_error: bool = False, omit_utils: bool = False) -> str:
    rows = ["[dependencies]"]
    for package in REQUIRED_PACKAGES:
        if package == "rama-unix":
            continue
        if omit_utils and package == "rama-utils":
            continue
        version = WRONG_VERSION if wrong_error and package == "rama-error" else EXPECTED_VERSION
        rows.append(f'{package} = "={version}"')
    rows.extend(
        [
            "",
            "[target.'cfg(target_family = \\\"unix\\\")'.dependencies]",
            f'rama-unix = "={EXPECTED_VERSION}"',
        ]
    )
    return "\\n".join(rows) + "\\n"


def lock_text(*, wrong_error: bool = False) -> str:
    rows = ["version = 4", ""]
    for package in REQUIRED_PACKAGES:
        version = WRONG_VERSION if wrong_error and package == "rama-error" else EXPECTED_VERSION
        rows.extend(
            [
                "[[package]]",
                f'name = "{package}"',
                f'version = "{version}"',
                "",
            ]
        )
    return "\\n".join(rows)


class RamaLockGuardTests(unittest.TestCase):
    def validate_fixture(self, manifest: str, lock: str) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            manifest_path = root / "Cargo.toml"
            lock_path = root / "Cargo.lock"
            manifest_path.write_text(manifest, encoding="utf-8")
            lock_path.write_text(lock, encoding="utf-8")
            validate(manifest_path, lock_path)

    def test_coherent_exact_release_graph_passes(self):
        self.validate_fixture(manifest_text(), lock_text())

    def test_mixed_support_crate_version_is_rejected(self):
        with self.assertRaises(RamaLockError):
            self.validate_fixture(manifest_text(), lock_text(wrong_error=True))

    def test_missing_direct_constraint_is_rejected(self):
        with self.assertRaises(RamaLockError):
            self.validate_fixture(manifest_text(omit_utils=True), lock_text())


if __name__ == "__main__":
    unittest.main()
''',
              encoding="utf-8",
          )
          PY
          python3 scripts/platform_types_apply_closure_repair.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all

      - name: Regenerate the authoritative Cargo lock
        run: |
          set -euo pipefail
          original_lock="$(mktemp)"
          cp codex-rs/Cargo.lock "$original_lock"
          converged=false

          # Rama 0.3.0 requires Rust 1.96 and Tokio 1.52. Restore the exact
          # input lock before every attempt so no partial solver result survives.
          for attempt in 1 2 3 4 5; do
            echo "Cargo lock convergence attempt ${attempt}/5"
            cp "$original_lock" codex-rs/Cargo.lock

            if cargo update --manifest-path codex-rs/Cargo.toml \
                 --package rama-core@0.3.0-alpha.4 --precise 0.3.0 \
              && cargo update --manifest-path codex-rs/Cargo.toml \
                 --package tokio --precise 1.52.0 \
              && cargo metadata --manifest-path codex-rs/Cargo.toml \
                 --locked --no-deps >/dev/null; then
              converged=true
              break
            fi

            echo "Lock convergence attempt ${attempt} failed; restoring the canonical input lock." >&2
            cp "$original_lock" codex-rs/Cargo.lock
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 15))"
            fi
          done

          if [ "$converged" != true ]; then
            echo "Cargo lock convergence failed after five clean attempts." >&2
            exit 1
          fi

      - name: Verify focused repairs before publishing
        run: |
          set -euo pipefail
          python3 scripts/platform_types_rama_lock_guard.py
          python3 -m unittest \
            scripts/test_platform_types_rama_lock_guard.py \
            scripts/test_platform_types_rustdoc_api.py
          python3 scripts/platform_types_public_api.py
          python3 scripts/platform_types_implementation_map.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          cargo check --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-types -p codex-hepta-wire -p codex-network-proxy --all-targets
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-types -p codex-hepta-wire --all-targets
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-types -p codex-hepta-wire -p codex-network-proxy \
            --all-targets -- -D warnings
          cargo run --release --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-types --bin platform-types-registry-bench -- \
            50000 /tmp/platform-types-registry-benchmark.json
          python3 -c 'import json, pathlib; value=json.loads(pathlib.Path("/tmp/platform-types-registry-benchmark.json").read_text()); assert value["schema"] == "hepta.platform-types.registry-lookup-benchmark.v1"; assert [row["entryCount"] for row in value["cases"]] == [8, 256]'
          git diff --check

      - name: Commit only after exact-head race check
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$GITHUB_SHA"
          rm .github/workflows/platform-types-convergence-repair.yml
          rm scripts/platform_types_apply_closure_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(platform.types): close exact-candidate qualification gaps"
          git push origin "HEAD:$BRANCH"

# API retrigger v6: migrate the incoherent Rama alpha graph to Rama 0.3.0.
