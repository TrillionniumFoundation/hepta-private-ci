name: platform.types one-shot exact-candidate repair

on:
  push:
    branches:
      - codex/platform-types-production-convergence-20260925
    paths:
      - .github/workflows/platform-types-convergence-repair.yml

permissions:
  contents: write

concurrency:
  group: platform-types-one-shot-exact-candidate-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair source, lock, evidence, and remove migration workflow
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BRANCH: codex/platform-types-production-convergence-20260925
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned native toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Apply guarded source and documentation patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/platform_types_apply_closure_repair.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all

      - name: Regenerate the authoritative Cargo lock
        run: |
          set -euo pipefail
          for package in rama-error rama-macros rama-utils; do
            cargo update --manifest-path codex-rs/Cargo.toml \
              --package "$package" --precise 0.3.0-alpha.4
          done
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps >/dev/null

      - name: Verify focused repairs before publishing
        run: |
          set -euo pipefail
          python3 scripts/platform_types_rama_lock_guard.py
          python3 -m unittest \
            scripts/test_platform_types_rama_lock_guard.py \
            scripts/test_platform_types_rustdoc_api.py
          python3 scripts/platform_types_public_api.py
          python3 scripts/platform_types_implementation_map.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          cargo check --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-types -p codex-hepta-wire -p codex-network-proxy --all-targets
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-types -p codex-hepta-wire --all-targets
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-types -p codex-hepta-wire -p codex-network-proxy \
            --all-targets -- -D warnings
          cargo run --release --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-types --bin platform-types-registry-bench -- \
            50000 /tmp/platform-types-registry-benchmark.json
          python3 -c 'import json, pathlib; value=json.loads(pathlib.Path("/tmp/platform-types-registry-benchmark.json").read_text()); assert value["schema"] == "hepta.platform-types.registry-lookup-benchmark.v1"; assert [row["entryCount"] for row in value["cases"]] == [8, 256]'
          git diff --check

      - name: Commit only after exact-head race check
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$GITHUB_SHA"
          rm .github/workflows/platform-types-convergence-repair.yml
          rm scripts/platform_types_apply_closure_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(platform.types): close exact-candidate qualification gaps"
          git push origin "HEAD:$BRANCH"
