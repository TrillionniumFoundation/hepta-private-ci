          Path("scripts/platform_types_rama_lock_guard.py").write_text(r'''#!/usr/bin/env python3
"""Reject incoherent Rama prerelease selections in platform.types qualification."""

from __future__ import annotations

import argparse
import sys
import tomllib
from pathlib import Path
from typing import Any

EXPECTED_VERSION = "0.3.0-alpha.4"
REQUIRED_PACKAGES = (
    "rama-core",
    "rama-error",
    "rama-http",
    "rama-http-backend",
    "rama-macros",
    "rama-net",
    "rama-socks5",
    "rama-tcp",
    "rama-tls-rustls",
    "rama-unix",
    "rama-utils",
)


class RamaLockError(RuntimeError):
    """The manifest or selected Cargo graph mixes Rama generations."""


def _read_toml(path: Path) -> dict[str, Any]:
    try:
        with path.open("rb") as stream:
            value = tomllib.load(stream)
    except (OSError, tomllib.TOMLDecodeError) as error:
        raise RamaLockError(f"cannot read {path}: {error}") from error
    if not isinstance(value, dict):
        raise RamaLockError(f"TOML object required: {path}")
    return value


def _dependency_versions(value: Any) -> dict[str, set[str]]:
    found: dict[str, set[str]] = {}

    def visit(node: Any) -> None:
        if not isinstance(node, dict):
            return
        dependencies = node.get("dependencies")
        if isinstance(dependencies, dict):
            for name, declaration in dependencies.items():
                version: str | None = None
                if isinstance(declaration, str):
                    version = declaration
                elif isinstance(declaration, dict) and isinstance(
                    declaration.get("version"), str
                ):
                    version = declaration["version"]
                if version is not None:
                    found.setdefault(str(name), set()).add(version)
        for child in node.values():
            visit(child)

    visit(value)
    return found


def validate(manifest_path: Path, lock_path: Path) -> None:
    manifest = _read_toml(manifest_path)
    lock = _read_toml(lock_path)
    declared = _dependency_versions(manifest)
    errors: list[str] = []
    exact = f"={EXPECTED_VERSION}"
    for package in REQUIRED_PACKAGES:
        versions = declared.get(package, set())
        if versions != {exact}:
            errors.append(
                f"manifest {package} must be pinned exactly to {exact}; found {sorted(versions)}"
            )

    selected: dict[str, set[str]] = {}
    packages = lock.get("package")
    if not isinstance(packages, list):
        errors.append("Cargo.lock package array is missing")
    else:
        for row in packages:
            if not isinstance(row, dict):
                continue
            name = row.get("name")
            version = row.get("version")
            if isinstance(name, str) and isinstance(version, str):
                selected.setdefault(name, set()).add(version)
        for package in REQUIRED_PACKAGES:
            versions = selected.get(package, set())
            if versions != {EXPECTED_VERSION}:
                errors.append(
                    f"lock {package} must select only {EXPECTED_VERSION}; found {sorted(versions)}"
                )

    if errors:
        raise RamaLockError("; ".join(errors))


def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument(
        "--manifest",
        type=Path,
        default=Path("codex-rs/network-proxy/Cargo.toml"),
    )
    parser.add_argument("--lock", type=Path, default=Path("codex-rs/Cargo.lock"))
    args = parser.parse_args()
    try:
        validate(args.manifest, args.lock)
    except RamaLockError as error:
        print(f"platform.types Rama lock guard failed: {error}", file=sys.stderr)
        return 1
    print(
        "platform.types Rama lock guard: coherent "
        f"({len(REQUIRED_PACKAGES)} packages at {EXPECTED_VERSION})"
    )
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''', encoding="utf-8")

          Path("scripts/test_platform_types_rama_lock_guard.py").write_text(r'''"""Regression tests for exact Rama prerelease graph enforcement."""

from __future__ import annotations

import tempfile
import unittest
from pathlib import Path

from platform_types_rama_lock_guard import (
    EXPECTED_VERSION,
    REQUIRED_PACKAGES,
    RamaLockError,
    validate,
)


def manifest_text(*, stable_error: bool = False, omit_utils: bool = False) -> str:
    rows = ["[dependencies]"]
    for package in REQUIRED_PACKAGES:
        if package == "rama-unix":
            continue
        if omit_utils and package == "rama-utils":
            continue
        version = "0.3.0" if stable_error and package == "rama-error" else EXPECTED_VERSION
        rows.append(f'{package} = "={version}"')
    rows.extend(
        [
            "",
            "[target.'cfg(target_family = \"unix\")'.dependencies]",
            f'rama-unix = "={EXPECTED_VERSION}"',
        ]
    )
    return "\n".join(rows) + "\n"


def lock_text(*, stable_error: bool = False) -> str:
    rows = ["version = 4", ""]
    for package in REQUIRED_PACKAGES:
        version = "0.3.0" if stable_error and package == "rama-error" else EXPECTED_VERSION
        rows.extend(
            [
                "[[package]]",
                f'name = "{package}"',
                f'version = "{version}"',
                "",
            ]
        )
    return "\n".join(rows)


class RamaLockGuardTests(unittest.TestCase):
    def validate_fixture(self, manifest: str, lock: str) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            manifest_path = root / "Cargo.toml"
            lock_path = root / "Cargo.lock"
            manifest_path.write_text(manifest, encoding="utf-8")
            lock_path.write_text(lock, encoding="utf-8")
            validate(manifest_path, lock_path)

    def test_coherent_exact_prerelease_graph_passes(self):
        self.validate_fixture(manifest_text(), lock_text())

    def test_stable_support_crate_is_rejected(self):
        with self.assertRaises(RamaLockError):
            self.validate_fixture(manifest_text(), lock_text(stable_error=True))

    def test_missing_direct_constraint_is_rejected(self):
        with self.assertRaises(RamaLockError):
            self.validate_fixture(manifest_text(omit_utils=True), lock_text())


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")

          Path("codex-rs/hepta-types/src/bin/platform-types-registry-bench.rs").write_text(r'''use std::env;
use std::error::Error;
use std::fs;
use std::hint::black_box;
use std::io;
use std::path::PathBuf;
use std::time::Instant;

use codex_hepta_types::{
    ContractRegistryV1, MAX_REGISTRY_ENTRIES_V1, RegistryDefinitionV1,
    RegistryKindV1, StableId,
};

#[derive(Clone, Copy)]
struct BenchmarkResult {
    entry_count: usize,
    identity_elapsed_ns: u128,
    digest_elapsed_ns: u128,
}

fn invalid_input(message: impl Into<String>) -> io::Error {
    io::Error::new(io::ErrorKind::InvalidInput, message.into())
}

fn parse_arguments() -> Result<(u64, PathBuf), Box<dyn Error>> {
    let mut arguments = env::args().skip(1);
    let iterations = arguments
        .next()
        .ok_or(invalid_input("iterations argument is required"))?
        .parse::<u64>()?;
    if iterations == 0 {
        return Err(invalid_input("iterations must be positive").into());
    }
    let output = arguments
        .next()
        .map(PathBuf::from)
        .ok_or(invalid_input("output path argument is required"))?;
    if arguments.next().is_some() {
        return Err(invalid_input("unexpected extra benchmark arguments").into());
    }
    Ok((iterations, output))
}

fn benchmark_case(
    entry_count: usize,
    iterations: u64,
) -> Result<BenchmarkResult, Box<dyn Error>> {
    let entries = (0..entry_count)
        .map(|index| {
            let id = StableId::new(&format!("schema:benchmark-{index}"))?;
            RegistryDefinitionV1::new(
                RegistryKindV1::Schema,
                id,
                1,
                &format!("field=value-{index}:u64"),
            )
        })
        .collect::<Result<Vec<_>, _>>()?;
    let target = entries[entry_count / 2].clone();
    let target_id = target.id().clone();
    let target_digest = target.digest();
    let registry = ContractRegistryV1::new(entries)?;

    let identity_started = Instant::now();
    for _ in 0..iterations {
        let Some(resolved) = registry.resolve(RegistryKindV1::Schema, &target_id, 1) else {
            return Err(invalid_input("identity lookup unexpectedly failed").into());
        };
        black_box(resolved);
    }
    let identity_elapsed_ns = identity_started.elapsed().as_nanos();

    let digest_started = Instant::now();
    for _ in 0..iterations {
        let Some(resolved) =
            registry.resolve_digest(RegistryKindV1::Schema, target_digest)
        else {
            return Err(invalid_input("digest lookup unexpectedly failed").into());
        };
        black_box(resolved);
    }
    let digest_elapsed_ns = digest_started.elapsed().as_nanos();

    Ok(BenchmarkResult {
        entry_count,
        identity_elapsed_ns,
        digest_elapsed_ns,
    })
}

fn main() -> Result<(), Box<dyn Error>> {
    let (iterations, output) = parse_arguments()?;
    let results = [8, MAX_REGISTRY_ENTRIES_V1]
        .into_iter()
        .map(|entry_count| benchmark_case(entry_count, iterations))
        .collect::<Result<Vec<_>, _>>()?;
    let divisor = u128::from(iterations);
    let rows = results
        .iter()
        .map(|result| {
            format!(
                "    {{\"entryCount\":{},\"identityElapsedNs\":{},\"identityNsPerLookup\":{},\"digestElapsedNs\":{},\"digestNsPerLookup\":{}}}",
                result.entry_count,
                result.identity_elapsed_ns,
                result.identity_elapsed_ns / divisor,
                result.digest_elapsed_ns,
                result.digest_elapsed_ns / divisor,
            )
        })
        .collect::<Vec<_>>()
        .join(",\n");
    let document = format!(
        "{{\n  \"schema\": \"hepta.platform-types.registry-lookup-benchmark.v1\",\n  \"schemaVersion\": 1,\n  \"iterationsPerLookup\": {iterations},\n  \"acceptanceThreshold\": null,\n  \"cases\": [\n{rows}\n  ]\n}}\n"
    );
    if let Some(parent) = output.parent() {
        fs::create_dir_all(parent)?;
    }
    fs::write(&output, document)?;
    println!(
        "platform.types registry benchmark: {} iterations, {} cases, output={}",
        iterations,
        results.len(),
        output.display()
    );
    Ok(())
}
''', encoding="utf-8")

