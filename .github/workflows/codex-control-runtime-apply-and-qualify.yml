name: Codex control runtime apply and qualify

on:
  push:
    branches:
      - codex/control-runtime-production-hardening-20260927
    paths:
      - ".github/codex-patches/control-runtime-request-integrity/**"
      - ".github/workflows/codex-control-runtime-apply-and-qualify.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-control-runtime-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Resolve patch input
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          PARTS=(.github/codex-patches/control-runtime-request-integrity/*.b64)
          if [ ! -e "${PARTS[0]}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "${PARTS[@]}" | base64 --decode > "$RUNNER_TEMP/control-runtime.patch"
          git apply --check "$RUNNER_TEMP/control-runtime.patch"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Apply source patch
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: git apply "$RUNNER_TEMP/control-runtime.patch"

      - name: Install pinned Rust
        if: steps.patch.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Format changed packages
        if: steps.patch.outputs.present == 'true'
        working-directory: codex-rs
        run: |
          cargo fmt --package codex-hepta-control-plane
          cargo fmt --package codex-hepta-agent-protocol
          cargo fmt --package codex-hepta-agentd

      - name: Locked focused compilation
        if: steps.patch.outputs.present == 'true'
        working-directory: codex-rs
        run: |
          cargo check --locked --all-targets \
            -p codex-hepta-control-plane \
            -p codex-hepta-agent-protocol \
            -p codex-hepta-agentd

      - name: Focused regression tests
        if: steps.patch.outputs.present == 'true'
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-ndu --lib preference::tests::damped_preference_update_emits_local_solver_receipts
          cargo test --locked -p codex-hepta-control-plane --lib planner
          cargo test --locked -p codex-hepta-agent-protocol --lib cognitive_context
          cargo test --locked -p codex-hepta-agentd --lib cognitive_context

      - name: Strict focused lint
        if: steps.patch.outputs.present == 'true'
        working-directory: codex-rs
        run: |
          cargo clippy --locked --all-targets \
            -p codex-hepta-control-plane \
            -p codex-hepta-agent-protocol \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Commit exact qualified source
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/codex-patches/control-runtime-request-integrity
          git diff --check
          git add codex-rs .github/codex-patches
          git config user.name hepta-control-runtime-qualification
          git config user.email qualification@invalid
          git commit -m "control.runtime: bind authenticated requests through final use"
          git push origin HEAD:codex/control-runtime-production-hardening-20260927
