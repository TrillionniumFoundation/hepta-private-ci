name: context-compiler-v3-source-bundle

on:
  push:
    branches:
      - codex/context-compiler-v3-closure-20260928
    paths:
      - .github/workflows/context-compiler-v3-source-bundle.yml
      - scripts/apply_context_compiler_v3_source.py
      - scripts/apply_context_compiler_current_closure.py
      - scripts/apply_context_compiler_v3_interface_fix.py
      - scripts/apply_context_compiler_v3_regressions.py
      - scripts/refresh_context_compiler_current_state.py
      - scripts/generate_context_compiler_module_docs.py
      - codex-rs/**
      - docs/modules/context.compiler/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: context-compiler-v3-source-bundle-${{ github.sha }}
  cancel-in-progress: false

jobs:
  materialize-source-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.95.0 --component rustfmt --component clippy
          rustup default 1.95.0
          rustc -Vv
          cargo -V

      - name: Materialize reviewed V3 source in ephemeral checkout
        id: materialize
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/context-v3-bundle/logs"
          status=0
          {
            python3 -B scripts/apply_context_compiler_v3_source.py
            python3 -B scripts/apply_context_compiler_current_closure.py
            python3 -B scripts/apply_context_compiler_v3_interface_fix.py
            python3 -B scripts/apply_context_compiler_v3_regressions.py
          } 2>&1 | tee "$RUNNER_TEMP/context-v3-bundle/logs/materialize.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/context-v3-bundle/materialize.exit"

      - name: Register deterministic property-test dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          workspace = Path('codex-rs/Cargo.toml')
          text = workspace.read_text(encoding='utf-8')
          if 'proptest = ' not in text:
              text = text.replace(
                  'pretty_assertions = "1.4.1"\n',
                  'pretty_assertions = "1.4.1"\nproptest = "1.9.0"\n',
                  1,
              )
          workspace.write_text(text, encoding='utf-8')
          crate = Path('codex-rs/hepta-context-compiler/Cargo.toml')
          text = crate.read_text(encoding='utf-8')
          if '[dev-dependencies]' not in text:
              text = text.rstrip() + '\n\n[dev-dependencies]\nproptest = { workspace = true }\n'
          elif 'proptest' not in text.split('[dev-dependencies]', 1)[1]:
              text = text.replace(
                  '[dev-dependencies]\n',
                  '[dev-dependencies]\nproptest = { workspace = true }\n',
                  1,
              )
          crate.write_text(text, encoding='utf-8')
          PY

      - name: Format, resolve, and refresh generated truth
        id: normalize
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            cd codex-rs
            cargo fmt --all
            cargo metadata --format-version 1 > /dev/null
            cd ..
            python3 -B scripts/refresh_context_compiler_current_state.py
            python3 -B scripts/generate_context_compiler_module_docs.py --write
            python3 -B scripts/generate_context_compiler_module_docs.py --check
            python3 -B scripts/test_context_compiler_state.py
            python3 -B scripts/test_context_compiler_candidate.py
            python3 -B scripts/test_context_compiler_execution.py
          } 2>&1 | tee "$RUNNER_TEMP/context-v3-bundle/logs/normalize.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/context-v3-bundle/normalize.exit"

      - name: Compile and test default V3 and explicit legacy profiles
        id: verify
        working-directory: codex-rs
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            cargo test --locked \
              -p codex-hepta-prompt-registry \
              -p codex-hepta-context-compiler \
              -p codex-hepta-intelligence \
              -p codex-extension-api \
              -p codex-core \
              -p codex-hepta-agentd \
              -p codex-hepta-prompt-extension
            cargo test --locked -p codex-hepta-intelligence --features legacy-prompt-context-v1
            cargo test --locked -p codex-hepta-agentd --features legacy-prompt-context-v1
            cargo clippy --locked \
              -p codex-hepta-prompt-registry \
              -p codex-hepta-context-compiler \
              -p codex-hepta-intelligence \
              -p codex-extension-api \
              -p codex-core \
              -p codex-hepta-agentd \
              -p codex-hepta-prompt-extension \
              --all-targets --all-features -- -D warnings
          } 2>&1 | tee "$RUNNER_TEMP/context-v3-bundle/logs/verify.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/context-v3-bundle/verify.exit"

      - name: Export complete ordinary-source candidate
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_IMAGE: ${{ runner.image }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'context-v3-bundle'
          files_root = out / 'files'
          files_root.mkdir(parents=True, exist_ok=True)

          def names(args):
              raw = subprocess.check_output(args)
              return [p.decode('utf-8') for p in raw.split(b'\0') if p]

          deleted = sorted(set(names(['git', 'diff', '--diff-filter=D', '--name-only', '-z', 'HEAD'])))
          changed = set(names(['git', 'diff', '--diff-filter=ACMRTUXB', '--name-only', '-z', 'HEAD']))
          changed.update(names(['git', 'ls-files', '--others', '--exclude-standard', '-z']))
          changed = sorted(path for path in changed if path not in deleted)

          digests = {}
          for name in changed:
              source = pathlib.Path(name)
              target = files_root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              digests[name] = hashlib.sha256(source.read_bytes()).hexdigest()

          (out / 'changed-paths.json').write_text(
              json.dumps(changed, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'deleted-paths.json').write_text(
              json.dumps(deleted, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'file-sha256.json').write_text(
              json.dumps(digests, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          with (out / 'materialized.patch').open('wb') as handle:
              subprocess.run(['git', 'diff', '--binary', 'HEAD'], stdout=handle, check=True)
          subprocess.run(['git', 'status', '--porcelain=v1', '--untracked-files=all'],
                         stdout=(out / 'status.txt').open('wb'), check=True)
          metadata = {
              'source_commit': os.environ['SOURCE_SHA'],
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'workflow_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'runner_image': os.environ.get('RUNNER_IMAGE', ''),
              'runner_os': os.environ.get('RUNNER_OS', ''),
              'runner_arch': os.environ.get('RUNNER_ARCH', ''),
              'rustc': subprocess.check_output(['rustc', '-Vv'], text=True),
              'cargo': subprocess.check_output(['cargo', '-V'], text=True).strip(),
              'changed_paths': changed,
              'deleted_paths': deleted,
          }
          (out / 'bundle-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          find "$RUNNER_TEMP/context-v3-bundle" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/context-v3-bundle/artifact-files.sha256"

      - name: Upload immutable source bundle and verification logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: context-v3-source-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-v3-bundle
          if-no-files-found: error
          retention-days: 14

      - name: Require successful materialization and source verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/context-v3-bundle/materialize.exit")" = 0
          test "$(cat "$RUNNER_TEMP/context-v3-bundle/normalize.exit")" = 0
          test "$(cat "$RUNNER_TEMP/context-v3-bundle/verify.exit")" = 0
