name: Evaluate secrets.heptabao phase-three payload

on:
  push:
    branches:
      - codex/secrets-heptabao-phase3-eval
    paths:
      - ".hepta-bootstrap/run-secrets-phase3-eval"
      - ".github/workflows/hepta-evaluate-secrets-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-phase3-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-for-review:
    # Internal branch only: this job never runs pull-request code.
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 30
    steps:
      - name: Check out exact evaluation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Reconstruct the exact stored payload
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = codex/secrets-heptabao-phase3-eval
          git fetch --no-tags origin 96ff7270d83f235bb013b26bf6c324f5dfd758cd
          bundle="$RUNNER_TEMP/secrets-phase3.patch.gz.b64"
          patch="$RUNNER_TEMP/secrets-phase3.patch"
          : > "$bundle"
          for part in 00 01 02 03; do
            git show "96ff7270d83f235bb013b26bf6c324f5dfd758cd:.hepta-bootstrap/secrets-phase3/part-$part" >> "$bundle"
          done
          test "$(wc -c < "$bundle")" -eq 28000
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          sha256sum "$bundle" "$patch"
          grep '^diff --git ' "$patch" | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' | sort -u
          cp "$patch" "$RUNNER_TEMP/secrets-phase3.review.patch"

      - name: Apply with a real three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --index "$RUNNER_TEMP/secrets-phase3.review.patch"
          git diff --cached --check
          git diff --cached --stat

      - name: Commit isolated evaluation result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .hepta-bootstrap/run-secrets-phase3-eval
          rm -f .github/workflows/hepta-evaluate-secrets-phase3.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta remediation bot"
          git config user.email "hepta-remediation@users.noreply.github.com"
          git commit -m "secrets: evaluate stored phase-three durable-owner payload"
          git push origin "HEAD:${GITHUB_REF_NAME}"
