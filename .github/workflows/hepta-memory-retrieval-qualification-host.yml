name: Hepta memory retrieval qualification host

on:
  pull_request:
    paths: &retrieval_paths
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain*"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-memory-retrieval/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-learning-ledger/**"
      - "qualification/memory-retrieval/**"
      - "docs/modules/memory.retrieval/**"
      - "scripts/hepta-implementation-maps.py"
      - "scripts/verify_memory_retrieval_slo.py"
      - ".github/workflows/hepta-memory-retrieval-qualification-host.yml"
  push:
    branches: [main]
    paths: *retrieval_paths
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hepta-memory-retrieval-qualification-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  promotion-governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect production claim promotion
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          value = json.loads(Path("docs/modules/memory.retrieval/IMPLEMENTATION_MAP.json").read_text())
          boundary = value.get("claimBoundary", {})
          promoted = bool(value.get("productionImplementation")) or any(
              bool(boundary.get(name))
              for name in ("productionImplementation", "productExecutionProved", "independentAcceptance", "activation", "release")
          )
          print(f"promoted={'true' if promoted else 'false'}")
          PY

      - name: Require non-draft independently approved promotion
        if: steps.promotion.outputs.promoted == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.payload.pull_request.draft) {
              core.setFailed('memory.retrieval production claim promotion is forbidden from a draft PR');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const author = context.payload.pull_request.user.login;
            const latest = new Map();
            for (const review of reviews) {
              if (review.user?.login) latest.set(review.user.login, review.state);
            }
            const approved = [...latest.entries()].some(([login, state]) => login !== author && state === 'APPROVED');
            if (!approved) core.setFailed('memory.retrieval production claim promotion requires a current non-author APPROVED review');

  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind source and host identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          printf 'tree=%s\n' "$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/memory-retrieval-target-host"
          {
            printf 'source_commit=%s\n' "$SOURCE_SHA"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            uname -a
            lscpu
            free -b
            rustc -Vv
            cargo -V
            /usr/bin/time --version
          } > "$RUNNER_TEMP/memory-retrieval-target-host/host.txt" 2>&1

      - name: Require exact source-map freshness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$SOURCE_SHA" \
            --expected-tree "${{ steps.source.outputs.tree }}"

      - name: Format, package tests and strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p codex-hepta-memory-retrieval --all-targets
          cargo test --locked -p codex-hepta-memory --lib cognitive_retrieval
          cargo test --locked -p codex-hepta-agentd --lib cognitive_context
          cargo clippy --locked -p codex-hepta-memory-retrieval --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-agentd --lib -- -D warnings

      - name: SQLite owner retrieval and revalidation probe
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v \
            cargo test --release --locked -p codex-hepta-memory \
            target_host_owner_retrieval_reports_latency_percentiles \
            -- --ignored --nocapture --test-threads=1 \
            > "$RUNNER_TEMP/memory-retrieval-target-host/sqlite-owner.log" 2>&1

      - name: HNMF 512-candidate four-step probe
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v \
            cargo test --release --locked -p codex-hepta-memory-retrieval \
            target_host_hnmf_reports_latency_percentiles_at_candidate_ceiling \
            -- --ignored --nocapture --test-threads=1 \
            > "$RUNNER_TEMP/memory-retrieval-target-host/hnmf-512.log" 2>&1

      - name: HNMF 4096-node 32768-synapse structural probe
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v \
            cargo test --release --locked -p codex-hepta-memory-retrieval \
            target_host_hnmf_validates_full_structural_ceiling \
            -- --ignored --nocapture --test-threads=1 \
            > "$RUNNER_TEMP/memory-retrieval-target-host/hnmf-structural.log" 2>&1

      - name: Enforce checked-in SLO thresholds
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_memory_retrieval_slo.py \
            --thresholds qualification/memory-retrieval/BASELINES/github-hosted-v1.json \
            --log "$RUNNER_TEMP/memory-retrieval-target-host/sqlite-owner.log" \
            --log "$RUNNER_TEMP/memory-retrieval-target-host/hnmf-512.log" \
            --log "$RUNNER_TEMP/memory-retrieval-target-host/hnmf-structural.log" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "${{ steps.source.outputs.tree }}" \
            --output "$RUNNER_TEMP/memory-retrieval-target-host/qualification-receipt.json"
          (cd "$RUNNER_TEMP/memory-retrieval-target-host" && sha256sum * > SHA256SUMS)

      - name: Summarize measurement lines
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Source: `%s`\n\n' "$SOURCE_SHA"
            printf 'Tree: `%s`\n\n' "${{ steps.source.outputs.tree }}"
            printf 'This is GitHub-hosted qualification evidence, not a named production-host acceptance receipt.\n\n'
            grep -h 'hepta.memory-retrieval.target-host.v1' "$RUNNER_TEMP"/memory-retrieval-target-host/*.log || true
            test ! -f "$RUNNER_TEMP/memory-retrieval-target-host/qualification-receipt.json" || cat "$RUNNER_TEMP/memory-retrieval-target-host/qualification-receipt.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain raw qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-exact-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-retrieval-target-host/**
          if-no-files-found: error
          retention-days: 90

  synthetic-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build deterministic ordered-parent synthetic merge
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          MERGE_SHA="$(printf 'memory.retrieval ordered-parent qualification\n' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$SOURCE_SHA"
          printf 'synthetic_merge=%s\nsynthetic_tree=%s\n' "$MERGE_SHA" "$TREE" | tee synthetic-merge-receipt.txt

      - name: Qualify synthetic merge
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p codex-hepta-memory-retrieval --all-targets
          cargo test --locked -p codex-hepta-agentd --lib cognitive_context
          cargo clippy --locked -p codex-hepta-memory-retrieval --all-targets -- -D warnings

      - name: Retain synthetic-merge receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-synthetic-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: synthetic-merge-receipt.txt
          if-no-files-found: error
          retention-days: 90
