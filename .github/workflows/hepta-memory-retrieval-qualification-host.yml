name: Hepta memory retrieval qualification host

# Deliberately unfiltered: contract, toolchain and transitive dependency changes
# must not bypass the owner/retrieval structural probes.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hepta-memory-retrieval-qualification-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HEPTA_CI_LANE: source-head
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  qualification-host:
    # This check intentionally cannot satisfy the separate production-E2E
    # "Memory retrieval target-host" promotion gate.
    name: Memory retrieval structural probes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Bind source and host identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/memory-retrieval-target-host"
          {
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'ordered_parents=%s\n' "$(git show -s --format=%P HEAD)"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            uname -a
            lscpu
            free -b
            (cd codex-rs && rustc -Vv && cargo -V)
            /usr/bin/time --version
          } > "$RUNNER_TEMP/memory-retrieval-target-host/host.txt" 2>&1
      - name: Execute all three explicit release-mode structural probes
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while read -r package probe label; do
            python3 scripts/hepta_ci_exec.py \
              --minimum-tests 1 \
              --output "$RUNNER_TEMP/memory-retrieval-target-host/$label.json" -- \
              /usr/bin/time -v just test --release --locked -p "$package" \
              --run-ignored only --no-capture -E "test($probe)" || failed=1
          done <<'PROBES'
          codex-hepta-memory target_host_owner_retrieval_reports_latency_percentiles sqlite-owner
          codex-hepta-memory-retrieval target_host_hnmf_reports_latency_percentiles_at_candidate_ceiling hnmf-512
          codex-hepta-memory-retrieval target_host_hnmf_validates_full_structural_ceiling hnmf-structural
          PROBES
          exit "$failed"
      - name: Content-bind retained raw evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/memory-retrieval-target-host"
          test -d "$directory"
          (cd "$directory" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          {
            printf 'Source: `%s`\n\n' "$SOURCE_SHA"
            printf 'Structural microbenchmarks only. No complete Agentd E2E SLO, independent acceptance, activation or release is proved.\n\n'
            grep -h 'hepta.memory-retrieval.target-host.v1' "$directory"/*.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw qualification-host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-qualification-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-retrieval-target-host/**
          if-no-files-found: error
          retention-days: 90
