name: Hepta memory retrieval qualification host

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-memory-retrieval-qualification-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  qualification-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Bind source and host identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/memory-retrieval-target-host"
          {
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            uname -a
            lscpu
            free -b
            rustc -Vv
            cargo -V
            /usr/bin/time --version
          } > "$RUNNER_TEMP/memory-retrieval-target-host/host.txt" 2>&1

      - name: SQLite owner retrieval and revalidation probe
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v just test --release --locked -p codex-hepta-memory \
            --run-ignored ignored-only --no-tests fail --no-capture \
            -E 'test(target_host_owner_retrieval_reports_latency_percentiles)' \
            > "$RUNNER_TEMP/memory-retrieval-target-host/sqlite-owner.log" 2>&1

      - name: Native receipt and assignment regressions
        shell: bash
        run: |
          set -euo pipefail
          just test --release --locked --no-tests fail -p codex-hepta-memory-retrieval \
            > "$RUNNER_TEMP/memory-retrieval-target-host/native-regressions.log" 2>&1
          just test --release --locked --no-tests fail -p codex-hepta-learning-ledger -E 'test(/retrieval/)' \
            > "$RUNNER_TEMP/memory-retrieval-target-host/ledger-regressions.log" 2>&1

      - name: SQLite owner adapter and revalidation regressions
        shell: bash
        run: |
          set -euo pipefail
          just test --release --locked --no-tests fail -p codex-hepta-memory -E 'test(/cognitive_retrieval/)' \
            > "$RUNNER_TEMP/memory-retrieval-target-host/owner-regressions.log" 2>&1

      - name: Native all-target strict lint and formatting
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --release --locked --all-targets -p codex-hepta-memory-retrieval -- -D warnings \
            > "$RUNNER_TEMP/memory-retrieval-target-host/native-clippy.log" 2>&1
          cargo fmt -p codex-hepta-memory-retrieval -p codex-hepta-agentd -- --check \
            > "$RUNNER_TEMP/memory-retrieval-target-host/formatting.log" 2>&1

      - name: HNMF 512-candidate four-step probe
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v just test --release --locked -p codex-hepta-memory-retrieval \
            --run-ignored ignored-only --no-tests fail --no-capture \
            -E 'test(target_host_hnmf_reports_latency_percentiles_at_candidate_ceiling)' \
            > "$RUNNER_TEMP/memory-retrieval-target-host/hnmf-512.log" 2>&1

      - name: HNMF 4096-node 32768-synapse structural probe
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v just test --release --locked -p codex-hepta-memory-retrieval \
            --run-ignored ignored-only --no-tests fail --no-capture \
            -E 'test(target_host_hnmf_validates_full_structural_ceiling)' \
            > "$RUNNER_TEMP/memory-retrieval-target-host/hnmf-structural.log" 2>&1

      - name: HNMF ranking and receipt validation with outside support
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v just test --release --locked -p codex-hepta-memory-retrieval \
            --run-ignored ignored-only --no-tests fail --no-capture \
            -E 'test(target_host_hnmf_ranking_reports_outside_support_latency)' \
            > "$RUNNER_TEMP/memory-retrieval-target-host/hnmf-outside-support.log" 2>&1

      - name: Summarize measurement lines
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Source: `%s`\n\n' "$SOURCE_SHA"
            printf 'This is GitHub-hosted qualification-host evidence, not a production target-host acceptance receipt.\n\n'
            grep -h 'hepta.memory-retrieval.target-host.v1' "$RUNNER_TEMP"/memory-retrieval-target-host/*.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain raw qualification-host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-qualification-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-retrieval-target-host/**
          if-no-files-found: error
          retention-days: 30

  agentd-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Bind Agentd source and host identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/memory-retrieval-agentd"
          {
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            uname -a
            lscpu
            free -b
            rustc -Vv
            cargo -V
          } > "$RUNNER_TEMP/memory-retrieval-agentd/host.txt" 2>&1

      - name: Agentd context and delivery regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v just test --locked -p codex-hepta-agentd --lib --no-tests fail \
            -E 'test(/cognitive_context|cognitive_retrieval_learning|retrieval_mode|cognitive_retrieval_process/)' \
            > "$RUNNER_TEMP/memory-retrieval-agentd/regressions.log" 2>&1

      - name: Retain raw Agentd composition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-agentd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-retrieval-agentd/**
          if-no-files-found: error
          retention-days: 30
