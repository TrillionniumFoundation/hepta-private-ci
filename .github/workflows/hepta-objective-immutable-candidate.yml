name: Hepta objective immutable candidate

on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: objective-immutable-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-evidence:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record immutable source and execution identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/objective-source-evidence"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/objective-source-evidence/source.tar.gz"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'objective-source-evidence'
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          record = {
              'schema': 'hepta.objective.immutable-source-evidence.v1',
              'sourceCommit': git('rev-parse', 'HEAD'),
              'sourceTree': git('rev-parse', 'HEAD^{tree}'),
              'workflowCommit': os.environ['GITHUB_SHA'],
              'workflowRef': os.environ['GITHUB_WORKFLOW_REF'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runnerImage': os.environ.get('ImageOS', 'unknown'),
              'runnerImageVersion': os.environ.get('ImageVersion', 'unknown'),
              'archiveSha256': hashlib.sha256((out / 'source.tar.gz').read_bytes()).hexdigest(),
              'qualification': 'not_executed_by_source_archive_job',
              'accepted': False, 'activated': False, 'released': False,
          }
          (out / 'source.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Preserve exact source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objective-immutable-source-${{ github.sha }}
          path: ${{ runner.temp }}/objective-source-evidence
          if-no-files-found: error
          retention-days: 7
