name: MemoryCell masked spans and actual answer transfer
on:
  pull_request:
    paths:
      - "scripts/memory_cell/masked_span*.py"
      - "scripts/memory_cell/test_masked_span*.py"
      - "scripts/memory_cell/selector_end_to_end.py"
      - ".github/workflows/hepta-memory-masked-span.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-masked-span-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  locked-execution:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-external-span-e2e
          run-id: 37919555733
          github-token: ${{ github.token }}
          path: /tmp/previous-span
      - name: Install exact previously observed worker package versions
        run: |
          set -euo pipefail
          mkdir -p /tmp/masked-evidence
          python3 -m venv /tmp/masked-python
          /tmp/masked-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/masked-python/bin/pip install -r /tmp/previous-span/environment.txt
          /tmp/masked-python/bin/pip freeze > /tmp/masked-evidence/environment.txt
          diff -u /tmp/previous-span/environment.txt /tmp/masked-evidence/environment.txt
          /tmp/masked-python/bin/python --version > /tmp/masked-evidence/python-version.txt
          cp /tmp/previous-span/external-input-pins.json /tmp/masked-evidence/previous-input-pins.json
      - name: Entire regression suite without pretrained model substitutes in the execution step
        run: |
          set -euo pipefail
          /tmp/masked-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/masked-evidence/tests.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-native-staged-inputs
          run-id: 37862780268
          github-token: ${{ github.token }}
          path: /tmp
      - name: Verify unchanged external datasets and every model file against prior execution
        run: |
          set -euo pipefail
          tar -C /tmp -xzf /tmp/memory-inputs.tar.gz
          /tmp/masked-python/bin/python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from urllib.request import urlopen
          from huggingface_hub import snapshot_download
          from span_supervision import SQUAD_REVISION, SQUAD_BLOBS, MAX_BYTES, load_corpus
          from relevance_ranker import RANKER_ID, RANKER_REVISION
          from pretrained import file_inventory
          from native import digest
          old = json.loads(Path('/tmp/previous-span/experiment/preregistered.json').read_text())
          pins = json.loads(Path('/tmp/previous-span/external-input-pins.json').read_text())
          root = Path('/tmp/masked-inputs'); root.mkdir()
          for split in ('train', 'dev'):
              name = f'{split}-v2.0.json'
              url = f'https://raw.githubusercontent.com/rajpurkar/SQuAD-explorer/{SQUAD_REVISION}/dataset/{name}'
              with urlopen(url, timeout=90) as response:
                  raw = response.read(MAX_BYTES + 1)
              if len(raw) > MAX_BYTES or hashlib.sha256(raw).hexdigest() != pins[split]['sha256']:
                  raise ValueError('external dataset byte drift')
              (root / name).write_bytes(raw)
              load_corpus(root / name, split)
          snapshot_download(RANKER_ID, revision=RANKER_REVISION, local_dir='/tmp/masked-ranker',
              allow_patterns=['config.json', 'model.safetensors', 'tokenizer.json', 'tokenizer_config.json', 'special_tokens_map.json', 'vocab.txt'], token=False)
          if file_inventory(Path('/tmp/masked-ranker')) != old['ranker_inventory']:
              raise ValueError('ranker full inventory drift')
          if digest(file_inventory(Path('/tmp/memory-inputs/reader'))) != old['generator_inventory']:
              raise ValueError('generator inventory drift')
          staging = json.loads(Path('/tmp/memory-inputs/staging.json').read_text())
          for name in ('locomo', 'longmemeval'):
              raw = Path('/tmp/memory-inputs', name + '.json').read_bytes()
              if hashlib.sha256(raw).hexdigest() != old['dataset_sha256'][name] or staging[name]['sha256'] != old['dataset_sha256'][name]:
                  raise ValueError('native dataset drift')
          Path('/tmp/masked-evidence/input-verification.json').write_text(json.dumps(dict(
              reference_run=37919555733, reference_source=old['source_commit'],
              packages_match=True, original_external_bytes_match=True,
              native_bytes_match=True, ranker_inventory_match=True,
              reader_inventory_match=True, production_accepted=False), indent=2))
          PY
      - name: Real frozen encoder, masked evidence gradients, same generator and zero-update native transfer
        env:
          HEPTA_MEMORY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/masked-evidence/resources.txt /tmp/masked-python/bin/python scripts/memory_cell/selector_end_to_end.py /tmp/memory-inputs /tmp/masked-ranker /tmp/masked-inputs /tmp/masked-evidence/experiment --training-profile external-span-masked-evidence-only-v1 2>&1 | tee /tmp/masked-evidence/execution.log
      - name: Recompute the complete answer census and actual evidence delivery
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          /tmp/masked-python/bin/python scripts/memory_cell/masked_span_audit.py /tmp/masked-evidence/experiment "$EXPECTED_SOURCE" | tee /tmp/masked-evidence/execution-check.log
          /tmp/masked-python/bin/python scripts/memory_cell/masked_span_reference.py /tmp/masked-evidence/experiment "$EXPECTED_SOURCE" /tmp/memory-inputs /tmp/masked-inputs | tee /tmp/masked-evidence/publisher-reference-check.log
      - name: Require repository formatting after preserving any completed model result
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          PATH="/tmp/masked-python/bin:$PATH" just fmt --check --base "$BASE"
      - name: Retain exact source, receipts, failed steps and formatting diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/masked-evidence/source
          git rev-parse HEAD > /tmp/masked-evidence/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/masked-evidence/tested-tree.txt
          cp scripts/memory_cell/masked_span*.py scripts/memory_cell/test_masked_span*.py scripts/memory_cell/selector_end_to_end.py /tmp/masked-evidence/source/
          PATH="/tmp/masked-python/bin:$PATH" uv run --frozen --project scripts ruff format --diff scripts/memory_cell/masked_span*.py scripts/memory_cell/test_masked_span*.py scripts/memory_cell/selector_end_to_end.py > /tmp/masked-evidence/format.patch || true
          cat /tmp/masked-evidence/format.patch
          (cd /tmp/masked-evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-masked-span-execution
          path: /tmp/masked-evidence
          if-no-files-found: error
