name: Hepta Lane F shadow qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-prompt-optimizer/**"
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "docs/modules/learning.plasticity/**"
      - "scripts/hepta-plasticity-exact-head.py"
      - "scripts/test_plasticity_mutation_grammar_contract.py"
      - "qualification/lane-f-shadow/**"
      - ".github/workflows/hepta-lane-f-shadow-qualification.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-prompt-optimizer/**"
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-intelligence/**"
      - "codex-rs/hepta-agentd/**"
      - "docs/modules/learning.plasticity/**"
      - "scripts/hepta-plasticity-exact-head.py"
      - "scripts/test_plasticity_mutation_grammar_contract.py"
      - "qualification/lane-f-shadow/**"
      - ".github/workflows/hepta-lane-f-shadow-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-f-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: Deterministic authority-free vertical
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and clean tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Generate and verify exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          printf '/qualification/lane-f-shadow/Cargo.lock\n' >> .git/info/exclude
          cp codex-rs/Cargo.lock qualification/lane-f-shadow/Cargo.lock
          cp qualification/lane-f-shadow/Cargo.lock "$RUNNER_TEMP/lane-f-seed.lock"
          cargo metadata --format-version 1 --manifest-path qualification/lane-f-shadow/Cargo.toml >/dev/null
          python3 qualification/lane-f-shadow/verify_lock.py \
            "$RUNNER_TEMP/lane-f-seed.lock" \
            qualification/lane-f-shadow/Cargo.lock

      - name: Record exact-head contract, tests, lint and format
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEPTA_CI_LANE: source-head
        shell: bash
        run: |
          set -euo pipefail
          RECEIPTS="$RUNNER_TEMP/learning-plasticity-exact-head"
          mkdir -p "$RECEIPTS"
          trap 'rm -f qualification/lane-f-shadow/Cargo.lock' EXIT
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/grammar-contract.json" -- \
            python3 scripts/test_plasticity_mutation_grammar_contract.py
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/cargo-test.json" --minimum-tests 1 -- \
            cargo test --locked --manifest-path qualification/lane-f-shadow/Cargo.toml
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/cargo-clippy.json" -- \
            cargo clippy --locked --manifest-path qualification/lane-f-shadow/Cargo.toml --all-targets -- -D warnings
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/cargo-fmt.json" -- \
            cargo fmt --manifest-path qualification/lane-f-shadow/Cargo.toml -- --check
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/git-diff-check.json" -- \
            bash -lc 'git diff --check && test -z "$(git status --porcelain --untracked-files=no)"'
          rm qualification/lane-f-shadow/Cargo.lock
          trap - EXIT
          python3 scripts/hepta-plasticity-exact-head.py \
            --lane source-head \
            --source-sha "$SOURCE_SHA" \
            --tested-sha "$TESTED_SHA" \
            --receipt-dir "$RECEIPTS" \
            --output-json "$RECEIPTS/exact-head-status.json" \
            --output-md "$RECEIPTS/exact-head-status.md"

      - name: Retain exact-head evidence page
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-plasticity-exact-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/learning-plasticity-exact-head
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  synthetic-merge:
    name: Deterministic vertical on merge candidate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build deterministic merge commit
        id: merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME="Hepta Lane F Shadow CI"
          export GIT_AUTHOR_EMAIL="hepta-lane-f-shadow-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SHA="$(printf 'Synthetic Lane F shadow merge for PR %s\n' "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$SHA"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Select exact-tree native execution
        id: execution
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_ci_candidate.py \
            --source "$SOURCE_SHA" \
            --tested "${{ steps.merge.outputs.sha }}" \
            --base "$BASE_SHA" \
            --lane synthetic-merge \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate and verify exact dependency lock
        if: steps.execution.outputs.run_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha }}"
          printf '/qualification/lane-f-shadow/Cargo.lock\n' >> .git/info/exclude
          cp codex-rs/Cargo.lock qualification/lane-f-shadow/Cargo.lock
          cp qualification/lane-f-shadow/Cargo.lock "$RUNNER_TEMP/lane-f-seed.lock"
          cargo metadata --format-version 1 --manifest-path qualification/lane-f-shadow/Cargo.toml >/dev/null
          python3 qualification/lane-f-shadow/verify_lock.py \
            "$RUNNER_TEMP/lane-f-seed.lock" \
            qualification/lane-f-shadow/Cargo.lock

      - name: Record merge-candidate contract, tests, lint and format
        if: steps.execution.outputs.run_native == 'true'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ steps.merge.outputs.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEPTA_CI_LANE: base-merge
        shell: bash
        run: |
          set -euo pipefail
          RECEIPTS="$RUNNER_TEMP/learning-plasticity-synthetic-merge"
          mkdir -p "$RECEIPTS"
          trap 'rm -f qualification/lane-f-shadow/Cargo.lock' EXIT
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/grammar-contract.json" -- \
            python3 scripts/test_plasticity_mutation_grammar_contract.py
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/cargo-test.json" --minimum-tests 1 -- \
            cargo test --locked --manifest-path qualification/lane-f-shadow/Cargo.toml
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/cargo-clippy.json" -- \
            cargo clippy --locked --manifest-path qualification/lane-f-shadow/Cargo.toml --all-targets -- -D warnings
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/cargo-fmt.json" -- \
            cargo fmt --manifest-path qualification/lane-f-shadow/Cargo.toml -- --check
          python3 scripts/hepta_ci_exec.py \
            --output "$RECEIPTS/git-diff-check.json" -- \
            bash -lc 'git diff --check && test -z "$(git status --porcelain --untracked-files=no)"'
          rm qualification/lane-f-shadow/Cargo.lock
          trap - EXIT
          python3 scripts/hepta-plasticity-exact-head.py \
            --lane base-merge \
            --source-sha "$SOURCE_SHA" \
            --tested-sha "$TESTED_SHA" \
            --receipt-dir "$RECEIPTS" \
            --output-json "$RECEIPTS/exact-head-status.json" \
            --output-md "$RECEIPTS/exact-head-status.md"

      - name: Retain merge-candidate evidence page
        if: steps.execution.outputs.run_native == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-plasticity-synthetic-merge-${{ steps.merge.outputs.sha }}
          path: ${{ runner.temp }}/learning-plasticity-synthetic-merge
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
