name: Hepta Lane F shadow qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-intuition/**"
      - "codex-rs/hepta-prompt-optimizer/**"
      - "codex-rs/hepta-plasticity/**"
      - "codex-rs/hepta-intelligence/**"
      - "qualification/lane-f-shadow/**"
      - ".github/workflows/hepta-lane-f-shadow-qualification.yml"
  push:
    branches:
      - "codex/lane-f-gap-closure-20260910"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-f-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: Deterministic authority-free vertical
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and clean tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Prepare exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cp codex-rs/Cargo.lock qualification/lane-f-shadow/Cargo.lock
          if ! grep -q '^name = "lane-f-shadow-qualification"$' qualification/lane-f-shadow/Cargo.lock; then
            cat >> qualification/lane-f-shadow/Cargo.lock <<'EOF'

[[package]]
name = "lane-f-shadow-qualification"
version = "0.1.0"
dependencies = [
 "codex-hepta-intelligence",
 "codex-hepta-intuition",
 "codex-hepta-neuron",
 "codex-hepta-plasticity",
 "codex-hepta-prompt-optimizer",
 "codex-hepta-types",
]
EOF
          fi

      - name: Test and lint standalone vertical
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path qualification/lane-f-shadow/Cargo.toml
          cargo clippy --locked --manifest-path qualification/lane-f-shadow/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path qualification/lane-f-shadow/Cargo.toml -- --check
          rm qualification/lane-f-shadow/Cargo.lock
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  synthetic-merge:
    name: Deterministic vertical on merge candidate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build deterministic merge commit
        id: merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME="Hepta Lane F Shadow CI"
          export GIT_AUTHOR_EMAIL="hepta-lane-f-shadow-ci@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SHA="$(printf 'Synthetic Lane F shadow merge for PR %s\n' "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$SHA"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha }}"
          cp codex-rs/Cargo.lock qualification/lane-f-shadow/Cargo.lock
          if ! grep -q '^name = "lane-f-shadow-qualification"$' qualification/lane-f-shadow/Cargo.lock; then
            cat >> qualification/lane-f-shadow/Cargo.lock <<'EOF'

[[package]]
name = "lane-f-shadow-qualification"
version = "0.1.0"
dependencies = [
 "codex-hepta-intelligence",
 "codex-hepta-intuition",
 "codex-hepta-neuron",
 "codex-hepta-plasticity",
 "codex-hepta-prompt-optimizer",
 "codex-hepta-types",
]
EOF
          fi

      - name: Test merge candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path qualification/lane-f-shadow/Cargo.toml
          cargo clippy --locked --manifest-path qualification/lane-f-shadow/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path qualification/lane-f-shadow/Cargo.toml -- --check
          rm qualification/lane-f-shadow/Cargo.lock
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
