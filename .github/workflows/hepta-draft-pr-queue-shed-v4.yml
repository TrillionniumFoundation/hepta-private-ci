name: Hepta draft PR queue shed v4

on:
  push:
    branches: [ops/hepta-stale-actions-cleanup-20260906]
    paths: [.github/workflows/hepta-draft-pr-queue-shed-v4.yml]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  shed-draft-queue:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Force-cancel only queued or pending runs for open draft PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          KEEP_PR: "328"
          KEEP_HEAD: 52c246a935578dffed009c35efeb7a05727ef4e6
        run: |
          set -euo pipefail
          test "$REPO" = TrillionniumFoundation/hepta-private-ci
          test "$ACTOR" = ProfHepta
          test "$REF_NAME" = ops/hepta-stale-actions-cleanup-20260906
          python3 -I - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          repo = os.environ["REPO"]
          keep_pr = int(os.environ["KEEP_PR"])
          keep_head = os.environ["KEEP_HEAD"]
          own = int(os.environ["RUN_ID"])
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hepta-draft-pr-queue-shed-v4",
          }

          def api(method, path):
              req = urllib.request.Request(root + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      value = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      value = raw.decode("utf-8", "replace")[:512]
                  return error.code, value

          cache = {}
          def get_pr(number):
              if number not in cache:
                  status, value = api("GET", f"/pulls/{number}")
                  if status != 200 or not isinstance(value, dict):
                      raise RuntimeError(f"PR {number} read failed: HTTP {status}")
                  cache[number] = value
              return cache[number]

          def assert_keep():
              cache.pop(keep_pr, None)
              value = get_pr(keep_pr)
              if value.get("state") != "open" or value.get("head", {}).get("sha") != keep_head:
                  raise RuntimeError("protected PR #328 changed")

          assert_keep()
          inventory = {}
          initial = {}
          for wanted in ("queued", "pending"):
              for page in range(1, 21):
                  query = urllib.parse.urlencode({"status": wanted, "per_page": 100, "page": page})
                  status, value = api("GET", f"/actions/runs?{query}")
                  if status != 200 or not isinstance(value, dict):
                      raise RuntimeError(f"list {wanted} page {page}: HTTP {status}")
                  initial.setdefault(wanted, value.get("total_count"))
                  rows = value.get("workflow_runs", [])
                  if not isinstance(rows, list):
                      raise RuntimeError("workflow_runs is not a list")
                  for row in rows:
                      if isinstance(row, dict) and isinstance(row.get("id"), int):
                          inventory[row["id"]] = row
                  if len(rows) < 100:
                      break
              else:
                  raise RuntimeError(f"{wanted} inventory exceeded 2000")

          selected = []
          for run_id, run in sorted(inventory.items()):
              if run_id == own or run.get("head_sha") == keep_head:
                  continue
              if run.get("head_branch") == "ops/hepta-stale-actions-cleanup-20260906":
                  continue
              if run.get("event") != "pull_request":
                  continue
              refs = run.get("pull_requests")
              if not isinstance(refs, list) or len(refs) != 1:
                  continue
              number = refs[0].get("number")
              if not isinstance(number, int) or number == keep_pr:
                  continue
              live = get_pr(number)
              if live.get("state") != "open" or live.get("draft") is not True:
                  continue
              live_head = live.get("head", {}).get("sha")
              if live_head != run.get("head_sha"):
                  continue
              selected.append({
                  "run_id": run_id,
                  "workflow": run.get("name"),
                  "run_status": run.get("status"),
                  "pr": number,
                  "head": live_head,
                  "reason": "open-draft-pr-queued-or-pending",
              })

          if len(selected) > 500:
              raise RuntimeError(f"draft selection exceeded safety ceiling: {len(selected)}")

          results, failures = [], []
          for index, row in enumerate(selected, 1):
              if index == 1 or index % 20 == 0:
                  assert_keep()
                  cache.pop(row["pr"], None)
                  live = get_pr(row["pr"])
                  if (
                      live.get("state") != "open"
                      or live.get("draft") is not True
                      or live.get("head", {}).get("sha") != row["head"]
                  ):
                      raise RuntimeError(f"draft PR {row['pr']} changed during queue shed")
              status, value = api("POST", f"/actions/runs/{row['run_id']}/force-cancel")
              result = {**row, "http_status": status, "response": value}
              results.append(result)
              if status not in (202, 409):
                  failures.append(result)
              time.sleep(0.02)
          assert_keep()

          final = {}
          for wanted in ("queued", "pending"):
              query = urllib.parse.urlencode({"status": wanted, "per_page": 1})
              status, value = api("GET", f"/actions/runs?{query}")
              if status != 200 or not isinstance(value, dict):
                  raise RuntimeError(f"final {wanted} count failed")
              final[wanted] = value.get("total_count")

          receipt = {
              "schema": "org.trillionnium.hepta.draft-pr-queue-shed.v4",
              "repository": repo,
              "control_run": own,
              "protected_pr": keep_pr,
              "protected_head": keep_head,
              "initial": initial,
              "selected": len(selected),
              "results": results,
              "hard_failures": failures,
              "final_immediate": final,
              "selection": "queued|pending pull_request run; exactly one live PR; PR open+draft; run head equals live head; PR #328 excluded",
              "in_progress_runs_cancelled": False,
              "ready_pr_runs_cancelled": False,
              "closed_pr_runs_cancelled_by_this_phase": False,
              "checkout": False,
              "self_hosted": False,
              "target_contact": False,
              "evidence_credit": False,
              "public_release": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "hepta-draft-pr-queue-shed-v4.json"
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps({"initial": initial, "selected": len(selected), "failures": len(failures), "final": final}, sort_keys=True))
          if failures:
              raise SystemExit("some draft-run force-cancellations failed")
          PY

      - name: Upload queue-shed receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-draft-pr-queue-shed-v4-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-draft-pr-queue-shed-v4.json
          if-no-files-found: error
          retention-days: 14
