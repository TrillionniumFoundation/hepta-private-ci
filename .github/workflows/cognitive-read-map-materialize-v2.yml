# One-shot exact-map convergence workflow. It deletes both materializers after success.
name: Cognitive read implementation-map materializer v2

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
    paths:
      - .github/workflows/cognitive-read-map-materialize-v2.yml

permissions:
  contents: write

concurrency:
  group: cognitive-read-map-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Stage the reviewed source observation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'hepta-ci-convergence'
          git config user.email 'hepta-ci-convergence@users.noreply.github.com'
          observed_commit="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse HEAD^{tree})"
          OBSERVED_COMMIT="$observed_commit" OBSERVED_TREE="$observed_tree" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('docs/modules/cognitive.read/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text(encoding='utf-8'))
          baseline = {
              'commit': 'a126987b84737dbc2ee2592442a314117bddb4a2',
              'tree': 'a22fd0074c45ae6f3cef2092cd6e273bf9c26c30',
          }
          row['sourceBase'] = dict(baseline)
          row['observedAtHead'] = {
              'commit': os.environ['OBSERVED_COMMIT'],
              'tree': os.environ['OBSERVED_TREE'],
          }
          observed = row.get('observedImplementationBase')
          if isinstance(observed, dict):
              observed['commit'] = baseline['commit']
              observed['interpretation'] = (
                  'reviewed main baseline; exact source objects and observedAtHead bind '
                  'the current convergence candidate without granting execution authority'
              )

          reliability_tests = [
              'codex-rs/hepta-cognitive-read/src/ids_tests.rs',
              'codex-rs/hepta-cognitive-read/src/property_tests.rs',
              'codex-rs/hepta-cognitive-read/src/mutation_tests.rs',
              'codex-rs/hepta-cognitive-read/src/fuzz_tests.rs',
              'codex-rs/hepta-cognitive-read/src/golden_vectors.rs',
              'codex-rs/hepta-cognitive-read/src/contract_docs_tests.rs',
          ]
          for operation in row.get('operations', []):
              if operation.get('operation') == 'read_ids_v1':
                  operation['tests'] = reliability_tests

          extra_paths = {
              '.github/actions/hepta-synthetic-merge/action.yml',
              '.github/actions/setup-ci/action.yml',
              '.github/scripts/verify_cargo_workspace_manifests.py',
              '.github/workflows/cognitive-read-qualification.yml',
              'codex-rs/Cargo.lock',
              'codex-rs/Cargo.toml',
              'codex-rs/hepta-agentd/BUILD.bazel',
              'codex-rs/hepta-agentd/Cargo.toml',
              'codex-rs/hepta-agentd/src/app_runtime.rs',
              'codex-rs/hepta-agentd/src/cognitive_context.rs',
              'codex-rs/hepta-agentd/src/cognitive_context_metrics.rs',
              'codex-rs/hepta-agentd/src/lib.rs',
              'codex-rs/hepta-agentd/src/runtime.rs',
              'codex-rs/hepta-agentd/src/runtime_tests.rs',
              'codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs',
              'codex-rs/hepta-cognitive-read/BUILD.bazel',
              'codex-rs/hepta-cognitive-read/Cargo.toml',
              'codex-rs/hepta-cognitive-read/examples/cognitive_read_bench.rs',
              'codex-rs/hepta-cognitive-read/src/authoritative.rs',
              'codex-rs/hepta-cognitive-read/src/authoritative_tests.rs',
              'codex-rs/hepta-cognitive-read/src/contract_docs_tests.rs',
              'codex-rs/hepta-cognitive-read/src/fuzz_tests.rs',
              'codex-rs/hepta-cognitive-read/src/golden_vectors.rs',
              'codex-rs/hepta-cognitive-read/src/ids.rs',
              'codex-rs/hepta-cognitive-read/src/ids_tests.rs',
              'codex-rs/hepta-cognitive-read/src/lib.rs',
              'codex-rs/hepta-cognitive-read/src/mutation_tests.rs',
              'codex-rs/hepta-cognitive-read/src/property_tests.rs',
              'codex-rs/hepta-cognitive-read/src/transient.rs',
              'docs/modules/cognitive.read/CONTRACT_LIMITS.md',
              'docs/modules/cognitive.read/OPERATIONS.md',
              'docs/modules/cognitive.read/TECHNICAL.md',
              'qualification/cognitive-read/golden/cognitive_read_vectors.json',
              'scripts/emit-cognitive-read-qualification.py',
              'scripts/hepta-implementation-maps.py',
              'scripts/verify-cognitive-read-constants.py',
              'scripts/verify-cognitive-read-map.py',
          }
          objects = {
              entry['path']: entry
              for entry in row.get('sourceObjects', [])
              if isinstance(entry, dict) and isinstance(entry.get('path'), str)
          }
          for source_path in extra_paths:
              objects.setdefault(source_path, {'path': source_path, 'object': '0' * 40})
          row['sourceObjects'] = [objects[key] for key in sorted(objects)]
          path.write_text(json.dumps(row, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git diff --check
          git add docs/modules/cognitive.read/IMPLEMENTATION_MAP.json
          git commit -m 'chore(cognitive.read): stage exact source observation'

      - name: Generate and verify the exact implementation map
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module cognitive.read
          python3 scripts/verify-cognitive-read-constants.py
          git diff --check
          test -n "$(git status --porcelain -- docs/modules/cognitive.read/IMPLEMENTATION_MAP.json)"

      - name: Seal the map and remove one-shot writers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cognitive-read-map-materialize.yml
          git rm .github/workflows/cognitive-read-map-materialize-v2.yml
          git add docs/modules/cognitive.read/IMPLEMENTATION_MAP.json
          git commit -m 'docs(cognitive.read): bind exact converged source map'
          candidate="$(git rev-parse HEAD)"
          python3 scripts/verify-cognitive-read-constants.py
          python3 scripts/verify-cognitive-read-map.py --expected-sha "$candidate"
          git diff --check HEAD~2..HEAD
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
