name: memory federation v3 bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/memory-federation-v3-bootstrap.yml"
      - "qualification/memory-federation/bootstrap_v3.py"
      - "codex-rs/hepta-memory-federation-wire/**"
      - "codex-rs/hepta-memory/src/cognitive_federation_profile.rs"
      - "docs/modules/memory.federation/WIRE_V1.md"
      - "qualification/memory-federation/V3_PRODUCTION_CLOSURE.md"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: memory-federation-v3-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/memory-federation-v3-production-closure-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out writable feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed integration patch
        run: python3 qualification/memory-federation/bootstrap_v3.py

      - name: Format integrated Rust sources
        working-directory: codex-rs
        run: >-
          cargo fmt
          -p codex-hepta-memory-federation
          -p codex-hepta-memory-federation-wire
          -p codex-hepta-memory
          -p codex-hepta-agentd
          -p codex-hepta-memory-extension
          -p codex-app-server

      - name: Resolve lockfile and compile focused products
        working-directory: codex-rs
        run: |
          cargo check -p codex-hepta-memory-federation-wire
          cargo check -p codex-hepta-memory -p codex-hepta-agentd -p codex-app-server

      - name: Run focused contract and product tests
        working-directory: codex-rs
        run: |
          cargo test -p codex-hepta-memory-federation --lib
          cargo test -p codex-hepta-memory-federation --features legacy-v1 --lib
          cargo test -p codex-hepta-memory-federation-wire --all-targets
          cargo test -p codex-hepta-memory --lib cognitive_runtime_tests
          cargo test -p codex-hepta-memory-extension --lib cognitive::federation

      - name: Commit integrated source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Memory Federation Bootstrap"
          git config user.email "hepta-memory-federation-bootstrap@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "memory.federation: integrate v3 production closure"
          fi

      - name: Rebind implementation map and generated projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module memory.federation
          python3 scripts/hepta-module-docs.py refresh-derived
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs(memory-federation): bind v3 source and projections"
          fi
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta-module-docs.py refresh-derived --check
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Push integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_HEAD_REF}"
