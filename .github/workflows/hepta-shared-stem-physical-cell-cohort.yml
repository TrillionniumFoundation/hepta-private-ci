name: hepta-shared-stem-physical-cell-cohort (DENY_ALL)

on:
  pull_request:
    paths:
      - "qualification/stem-cell-v1/shared_stem_cell_population.py"
      - "qualification/stem-cell-v1/shared_stem_population_review.py"
      - "qualification/stem-cell-v1/test_shared_stem_cell_population.py"
      - "qualification/stem-cell-v1/P1_SHARED_STEM_PHYSICAL_CELL_COHORT.md"
      - "qualification/stem-cell-v1/P1_LOCAL_PHYSICAL_OBSERVATIONS_20261015.json"
      - ".github/workflows/hepta-shared-stem-physical-cell-cohort.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-source-locked-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned CPU torch without downloading any pretrained weights
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Bind source commit and exact tested file digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stem-population"
          git rev-parse HEAD | tee "$RUNNER_TEMP/stem-population/source-sha.txt"
          git hash-object qualification/stem-cell-v1/shared_stem_cell_population.py \
            qualification/stem-cell-v1/shared_stem_population_review.py \
            qualification/stem-cell-v1/test_shared_stem_cell_population.py \
            qualification/stem-cell-v1/P1_SHARED_STEM_PHYSICAL_CELL_COHORT.md \
            > "$RUNNER_TEMP/stem-population/source-blobs.txt"
      - name: Verify local observation source blobs are exactly this Git worktree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json,subprocess
          from pathlib import Path
          base=Path('qualification/stem-cell-v1')
          note=json.loads((base/'P1_LOCAL_PHYSICAL_OBSERVATIONS_20261015.json').read_text())
          if note.get('authority')!='DENY_ALL' or note.get('production_authorized') is not False:
              raise ValueError('local evidence grants impossible research authority')
          for name,original in note['source_git_blob_sha1'].items():
              filename=Path('.github/workflows')/name if name.endswith('.yml') else base/name
              actual=subprocess.check_output(['git','hash-object',str(filename)],text=True).strip()
              if actual!=original:
                  raise ValueError(f'local observed research source identity changed: {name}')
          print('research source byte hashes match original local observation; not model efficacy')
          PYCODE
      - name: Run all physically computed tensor, audit, boundary and negative-budget regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s qualification/stem-cell-v1 \
            -p 'test_shared_stem_cell_population.py' -v \
            2>&1 | tee "$RUNNER_TEMP/stem-population/unit-tests.log"
          python -O -m unittest discover -s qualification/stem-cell-v1 \
            -p 'test_shared_stem_cell_population.py' -v \
            2>&1 | tee "$RUNNER_TEMP/stem-population/unit-tests-optimized.log"
          python -m compileall -q qualification/stem-cell-v1/shared_stem_cell_population.py \
            qualification/stem-cell-v1/shared_stem_population_review.py \
            qualification/stem-cell-v1/test_shared_stem_cell_population.py
      - name: Physically execute each matched cohort in independent OS processes, independently audit
        shell: bash
        run: |
          set -euo pipefail
          for n in 64 256 1024 4096; do
            for mode in repeated distinct two_scopes; do
              python qualification/stem-cell-v1/shared_stem_cell_population.py \
                --cells "$n" --distribution "$mode" --cache-bytes 33554432 \
                --seed 7347 --steps 2 \
                --output "$RUNNER_TEMP/stem-population/${n}-${mode}.json"
            done
            python qualification/stem-cell-v1/shared_stem_population_review.py \
              --repeated "$RUNNER_TEMP/stem-population/${n}-repeated.json" \
              --distinct "$RUNNER_TEMP/stem-population/${n}-distinct.json" \
              --two-scopes "$RUNNER_TEMP/stem-population/${n}-two_scopes.json" \
              --output "$RUNNER_TEMP/stem-population/${n}-audit.json"
          done
          for budget in 0 1536 6144; do
            for mode in repeated distinct two_scopes; do
              python qualification/stem-cell-v1/shared_stem_cell_population.py \
                --cells 256 --distribution "$mode" --cache-bytes "$budget" \
                --seed 7347 --steps 2 \
                --output "$RUNNER_TEMP/stem-population/256-${budget}-${mode}.json"
            done
            python qualification/stem-cell-v1/shared_stem_population_review.py \
              --repeated "$RUNNER_TEMP/stem-population/256-${budget}-repeated.json" \
              --distinct "$RUNNER_TEMP/stem-population/256-${budget}-distinct.json" \
              --two-scopes "$RUNNER_TEMP/stem-population/256-${budget}-two_scopes.json" \
              --output "$RUNNER_TEMP/stem-population/256-${budget}-audit.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-shared-stem-physical-cell-cohort-deny-all
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stem-population/
