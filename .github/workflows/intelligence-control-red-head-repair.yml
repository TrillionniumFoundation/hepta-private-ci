name: intelligence-control red-head repair

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/intelligence-control-red-head-repair.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-red-head-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out exact canonical candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/product-convergence-20260923
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse a moved candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply structural repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "codex-rs/hepta-agentd/src/runtime_tests.rs",
              "use crate::AgentdMethod;\n",
              "use crate::AgentdError;\nuse crate::AgentdMethod;\n",
          )

          replace_once(
              "codex-rs/hepta-agentd/src/cognitive_context.rs",
              '''#[cfg(test)]
          pub(crate) async fn revalidate(
              store: &CognitiveStore,
              owner: &AgentId,
              snapshot_digest: &str,
              read_digest: &str,
              omitted_records: u64,
              items: &[CognitiveContextItem],
              plan: Option<&CognitiveContextPlan>,
              ranker: Option<&std::sync::Arc<crate::PinnedCognitiveRanker>>,
          ) -> Result<CognitiveContextRevalidation, CognitiveContextError> {
              revalidate_with_retrieval_context(
                  store,
                  owner,
                  snapshot_digest,
                  read_digest,
                  omitted_records,
                  items,
                  plan,
                  ranker,
                  1,
                  None,
              )
              .await
          }

          pub(crate) async fn revalidate_with_retrieval_context(
              store: &CognitiveStore,
              owner: &AgentId,
              snapshot_digest: &str,
              read_digest: &str,
              omitted_records: u64,
              items: &[CognitiveContextItem],
              plan: Option<&CognitiveContextPlan>,
              ranker: Option<&std::sync::Arc<crate::PinnedCognitiveRanker>>,
              body_generation: u64,
              current_retrieval: Option<&std::sync::Arc<dyn crate::CurrentMemoryRetrievalContext>>,
          ) -> Result<CognitiveContextRevalidation, CognitiveContextError> {
          ''',
              '''pub(crate) struct CognitiveRevalidationRequest<'a> {
              snapshot_digest: &'a str,
              read_digest: &'a str,
              omitted_records: u64,
              items: &'a [CognitiveContextItem],
              plan: Option<&'a CognitiveContextPlan>,
              body_generation: u64,
          }

          impl<'a> CognitiveRevalidationRequest<'a> {
              pub(crate) const fn new(
                  snapshot_digest: &'a str,
                  read_digest: &'a str,
                  omitted_records: u64,
                  items: &'a [CognitiveContextItem],
                  plan: Option<&'a CognitiveContextPlan>,
                  body_generation: u64,
              ) -> Self {
                  Self {
                      snapshot_digest,
                      read_digest,
                      omitted_records,
                      items,
                      plan,
                      body_generation,
                  }
              }
          }

          #[cfg(test)]
          pub(crate) async fn revalidate(
              store: &CognitiveStore,
              owner: &AgentId,
              snapshot_digest: &str,
              read_digest: &str,
              omitted_records: u64,
              items: &[CognitiveContextItem],
              plan: Option<&CognitiveContextPlan>,
              ranker: Option<&std::sync::Arc<crate::PinnedCognitiveRanker>>,
          ) -> Result<CognitiveContextRevalidation, CognitiveContextError> {
              revalidate_with_retrieval_context(
                  store,
                  owner,
                  CognitiveRevalidationRequest::new(
                      snapshot_digest,
                      read_digest,
                      omitted_records,
                      items,
                      plan,
                      1,
                  ),
                  ranker,
                  None,
              )
              .await
          }

          pub(crate) async fn revalidate_with_retrieval_context(
              store: &CognitiveStore,
              owner: &AgentId,
              request: CognitiveRevalidationRequest<'_>,
              ranker: Option<&std::sync::Arc<crate::PinnedCognitiveRanker>>,
              current_retrieval: Option<&std::sync::Arc<dyn crate::CurrentMemoryRetrievalContext>>,
          ) -> Result<CognitiveContextRevalidation, CognitiveContextError> {
              let CognitiveRevalidationRequest {
                  snapshot_digest,
                  read_digest,
                  omitted_records,
                  items,
                  plan,
                  body_generation,
              } = request;
          ''',
          )

          replace_once(
              "codex-rs/hepta-agentd/src/state_control.rs",
              '''                let result = crate::cognitive_context::revalidate_with_retrieval_context(
                              store.as_ref(),
                              &self.identity.agent_id,
                              &snapshot_digest,
                              &read_digest,
                              omitted_records,
                              &items,
                              plan.as_ref(),
                              self.cognitive_ranker.get(),
                              self.identity.spawn_generation,
                              self.cognitive_retrieval_context.get(),
                          )
          ''',
              '''                let request = crate::cognitive_context::CognitiveRevalidationRequest::new(
                              &snapshot_digest,
                              &read_digest,
                              omitted_records,
                              &items,
                              plan.as_ref(),
                              self.identity.spawn_generation,
                          );
                          let result = crate::cognitive_context::revalidate_with_retrieval_context(
                              store.as_ref(),
                              &self.identity.agent_id,
                              request,
                              self.cognitive_ranker.get(),
                              self.cognitive_retrieval_context.get(),
                          )
          ''',
          )

          tests = Path("codex-rs/hepta-agentd/src/cognitive_context_hnmf_tests.rs")
          text = tests.read_text()
          for variable, provider in (("accepted", "stable"), ("rejected", "changed")):
              old = f'''    let {variable} = crate::cognitive_context::revalidate_with_retrieval_context(
                  &store,
                  &owner,
                  &snapshot.snapshot_digest,
                  &snapshot.read_digest,
                  snapshot.omitted_records,
                  &snapshot.items,
                  snapshot.plan.as_ref(),
                  None,
                  1,
                  Some(&{provider}),
              )
          '''
              new = f'''    let request = crate::cognitive_context::CognitiveRevalidationRequest::new(
                  &snapshot.snapshot_digest,
                  &snapshot.read_digest,
                  snapshot.omitted_records,
                  &snapshot.items,
                  snapshot.plan.as_ref(),
                  1,
              );
              let {variable} = crate::cognitive_context::revalidate_with_retrieval_context(
                  &store,
                  &owner,
                  request,
                  None,
                  Some(&{provider}),
              )
          '''
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"HNMF {provider}: expected one replacement, found {count}")
              text = text.replace(old, new, 1)
          tests.write_text(text)

          replace_once(
              "codex-rs/hepta-agentd/src/plasticity_host.rs",
              '''/// Actual Agentd host callsite. It recomputes owner-store frontiers immediately
          /// before the product adapter runs, so a stale Observer signature cannot be
          /// transplanted across artifact/ledger changes.
          pub fn propose_agentd_plasticity_v1(
              mut request: ParameterPlasticityProductRequestV1,
              artifacts: &ArtifactRegistry,
              ledger: &DurableLedger,
              owner_evidence_resolver: &dyn PlasticityOwnerEvidenceResolverV1,
              owner_evidence_policy: &PlasticityOwnerEvidencePolicyV1,
              verifier: &LearningEvidenceVerifierV1,
              writer: &mut AnchoredPlasticityWriterV1,
              anchor_store: &mut AgentdPlasticityAnchorStoreV1,
              now: u64,
          ) -> Result<ParameterPlasticityProductReceiptV1, AgentdPlasticityHostErrorV1> {
          ''',
              '''/// Immutable current-owner inputs required for one parameter-plasticity call.
          pub struct AgentdPlasticityOwnerContextV1<'a> {
              pub artifacts: &'a ArtifactRegistry,
              pub ledger: &'a DurableLedger,
              pub evidence_resolver: &'a dyn PlasticityOwnerEvidenceResolverV1,
              pub evidence_policy: &'a PlasticityOwnerEvidencePolicyV1,
              pub verifier: &'a LearningEvidenceVerifierV1,
          }

          /// Exclusive writer/anchor pair retained by the long-lived Agentd owner.
          pub struct AgentdPlasticityCommitContextV1<'a> {
              pub writer: &'a mut AnchoredPlasticityWriterV1,
              pub anchor_store: &'a mut AgentdPlasticityAnchorStoreV1,
          }

          /// Actual Agentd host callsite. It recomputes owner-store frontiers immediately
          /// before the product adapter runs, so a stale Observer signature cannot be
          /// transplanted across artifact/ledger changes.
          pub fn propose_agentd_plasticity_v1(
              mut request: ParameterPlasticityProductRequestV1,
              owners: AgentdPlasticityOwnerContextV1<'_>,
              commit: AgentdPlasticityCommitContextV1<'_>,
              now: u64,
          ) -> Result<ParameterPlasticityProductReceiptV1, AgentdPlasticityHostErrorV1> {
              let AgentdPlasticityOwnerContextV1 {
                  artifacts,
                  ledger,
                  evidence_resolver: owner_evidence_resolver,
                  evidence_policy: owner_evidence_policy,
                  verifier,
              } = owners;
              let AgentdPlasticityCommitContextV1 {
                  writer,
                  anchor_store,
              } = commit;
          ''',
          )

          replace_once(
              "codex-rs/hepta-agentd/src/plasticity_runtime.rs",
              "use crate::AgentdPlasticityAnchorStoreV1;\n",
              "use crate::AgentdPlasticityAnchorStoreV1;\nuse crate::AgentdPlasticityCommitContextV1;\nuse crate::AgentdPlasticityOwnerContextV1;\n",
          )
          replace_once(
              "codex-rs/hepta-agentd/src/plasticity_runtime.rs",
              '''                    let result = propose_agentd_plasticity_v1(
                                      *request,
                                      &self.artifacts,
                                      &self.ledger,
                                      self.owner_evidence_resolver.as_ref(),
                                      &self.owner_evidence_policy,
                                      &self.verifier,
                                      &mut self.parameter_writer,
                                      &mut self.parameter_anchor_store,
                                      now,
                                  )
          ''',
              '''                    let owners = AgentdPlasticityOwnerContextV1 {
                                      artifacts: &self.artifacts,
                                      ledger: &self.ledger,
                                      evidence_resolver: self.owner_evidence_resolver.as_ref(),
                                      evidence_policy: &self.owner_evidence_policy,
                                      verifier: &self.verifier,
                                  };
                                  let commit = AgentdPlasticityCommitContextV1 {
                                      writer: &mut self.parameter_writer,
                                      anchor_store: &mut self.parameter_anchor_store,
                                  };
                                  let result = propose_agentd_plasticity_v1(*request, owners, commit, now)
          ''',
          )

          replace_once(
              "codex-rs/hepta-agentd/src/lib.rs",
              "pub use plasticity_host::AgentdPlasticityAnchorStoreV1;\n",
              "pub use plasticity_host::AgentdPlasticityAnchorStoreV1;\npub use plasticity_host::AgentdPlasticityCommitContextV1;\npub use plasticity_host::AgentdPlasticityOwnerContextV1;\n",
          )
          replace_once(
              "codex-rs/hepta-agentd/src/lib.rs",
              "pub use plasticity_runtime::PlasticityRuntimeBootstrapV1;\n",
              "pub use plasticity_learning_producer::AgentdLearningPlasticityProducerV1;\npub use plasticity_runtime::PlasticityRuntimeBootstrapV1;\n",
          )

          producer = Path("codex-rs/hepta-agentd/src/plasticity_learning_producer.rs")
          text = producer.read_text()
          for old, new, expected in (
              ("pub(crate) struct AgentdLearningPlasticityProducerV1", "pub struct AgentdLearningPlasticityProducerV1", 1),
              ("    pub(crate) fn new(", "    pub fn new(", 1),
              ("    pub(crate) async fn submit_parameter(", "    pub async fn submit_parameter(", 1),
              ("    pub(crate) async fn submit_topology(", "    pub async fn submit_topology(", 1),
          ):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"producer replacement {old!r}: found {count}")
              text = text.replace(old, new, expected)
          producer.write_text(text)

          state = Path("codex-rs/hepta-agentd/src/state.rs")
          text = state.read_text()
          text = text.replace("    plasticity_runtime: std::sync::OnceLock<\n", "    _plasticity_runtime: std::sync::OnceLock<\n", 1)
          text = text.replace("            plasticity_runtime: std::sync::OnceLock::new(),\n", "            _plasticity_runtime: std::sync::OnceLock::new(),\n", 1)
          if text.count("self.plasticity_runtime") != 3:
              raise SystemExit("state plasticity runtime reference count drifted")
          text = text.replace("self.plasticity_runtime", "self._plasticity_runtime")
          text = text.replace(
              "    pub(crate) async fn submit_parameter_plasticity_v1(\n",
              "    #[cfg(test)]\n    pub(crate) async fn submit_parameter_plasticity_v1(\n",
              1,
          )
          text = text.replace(
              "    pub(crate) async fn submit_topology_plasticity_v1(\n",
              "    #[cfg(test)]\n    pub(crate) async fn submit_topology_plasticity_v1(\n",
              1,
          )
          state.write_text(text)
          PY

      - name: Format repaired source
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-agentd

      - name: Verify provider regressions
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-agentd --lib -E 'test(intelligence_ingress)' --retries 0 --test-threads 2

      - name: Verify strict Agentd lint
        working-directory: codex-rs
        run: cargo clippy --locked --no-deps -p codex-hepta-agentd --lib --tests -- -D warnings

      - name: Commit only verified source repairs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add codex-rs/hepta-agentd/src
          git diff --cached --exit-code && exit 0 || true
          git config user.name "Hepta Intelligence Repair"
          git config user.email "hepta-intelligence-repair@users.noreply.github.com"
          git commit -s -m "fix(agentd): restore intelligence provider qualification"
          git fetch origin work/product-convergence-20260923
          test "$(git rev-parse origin/work/product-convergence-20260923)" = "$GITHUB_SHA"
          git push origin HEAD:work/product-convergence-20260923
