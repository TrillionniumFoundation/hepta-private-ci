name: Kernel authority Agentd time migration

on:
  push:
    branches:
      - work/kernel-authority-convergence-20260925
    paths:
      - '.github/workflows/kernel-authority-agentd-time-migration.yml'

permissions:
  contents: write

concurrency:
  group: kernel-authority-agentd-time-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 0
          persist-credentials: true

      - name: Bind Agentd effect ownership to protected authority time
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/hepta-agentd/src/automation_effect_host.rs')
          text = path.read_text(encoding='utf-8')

          execute_old = (
              "        command_id: &str,\n"
              "        now_ms: u64,\n"
              "    ) -> Result<TaskFlowStepReceipt, AgentdError> {"
          )
          execute_new = (
              "        command_id: &str,\n"
              "        _untrusted_now_ms: u64,\n"
              "    ) -> Result<TaskFlowStepReceipt, AgentdError> {"
          )
          if execute_old in text:
              if text.count(execute_old) != 1:
                  raise SystemExit('execute time parameter anchor is ambiguous')
              text = text.replace(execute_old, execute_new, 1)
          elif text.count(execute_new) != 1:
              raise SystemExit('execute protected-time signature is missing or duplicated')

          reconcile_old = (
              "        attempt: u32,\n"
              "        now_ms: u64,\n"
              "    ) -> Result<AgentdAutomationEffectReconcileOutcome, AgentdError> {"
          )
          reconcile_new = (
              "        attempt: u32,\n"
              "        _untrusted_now_ms: u64,\n"
              "    ) -> Result<AgentdAutomationEffectReconcileOutcome, AgentdError> {"
          )
          if reconcile_old in text:
              if text.count(reconcile_old) != 1:
                  raise SystemExit('reconcile time parameter anchor is ambiguous')
              text = text.replace(reconcile_old, reconcile_new, 1)
          elif text.count(reconcile_new) != 1:
              raise SystemExit('reconcile protected-time signature is missing or duplicated')

          fence_anchor = '        let fence = self.current_fence(&run, now_ms)?;'
          protected_fence = (
              '        let now_ms = self.protected_effect_now_ms()?;\n'
              + fence_anchor
          )
          protected_count = text.count(protected_fence)
          if protected_count == 0:
              if text.count(fence_anchor) != 2:
                  raise SystemExit('effect fence time anchors drifted')
              text = text.replace(fence_anchor, protected_fence)
          elif protected_count != 2:
              raise SystemExit('protected effect fence anchors are incomplete or duplicated')

          refresh_anchor = '    fn refresh_revocations(&self) -> Result<(), AgentdError> {'
          helper_marker = '    fn protected_effect_now_ms(&self) -> Result<u64, AgentdError> {'
          helper = ''.join([
              '    /// Compatibility callers may still transport a wall-clock sample, but\n',
              '    /// final effect ownership, TaskFlow lease validation and durable settlement\n',
              '    /// are always evaluated against the protected authority clock.\n',
              '    fn protected_effect_now_ms(&self) -> Result<u64, AgentdError> {\n',
              '        self.authority_trust.now_unix_ms().map_err(|error| {\n',
              '            AgentdError::Protocol(format!(\n',
              '                "sample protected automation effect clock: {error}"\n',
              '            ))\n',
              '        })\n',
              '    }\n\n',
          ])
          if helper_marker not in text:
              if text.count(refresh_anchor) != 1:
                  raise SystemExit('revocation refresh anchor drifted')
              text = text.replace(refresh_anchor, helper + refresh_anchor, 1)
          elif text.count(helper_marker) != 1:
              raise SystemExit('protected effect clock helper is duplicated')

          stale_call_old = (
              '                "agentd-product-effect-dispatch",\n'
              '                now_ms + 5,\n'
          )
          stale_call_new = (
              '                "agentd-product-effect-dispatch",\n'
              '                // Deliberately stale transport time: the host must sample protected time.\n'
              '                1,\n'
          )
          if stale_call_old in text:
              if text.count(stale_call_old) != 1:
                  raise SystemExit('Agentd protected-time product test anchor is ambiguous')
              text = text.replace(stale_call_old, stale_call_new, 1)
          elif text.count(stale_call_new) != 1:
              raise SystemExit('Agentd protected-time product test is missing or duplicated')

          path.write_text(text, encoding='utf-8')
          PY
          cd codex-rs
          cargo fmt -p codex-hepta-agentd
          cargo test --locked -p codex-hepta-agentd host_dispatches_exact_wire_payload_once -- --nocapture
          cd ..
          git diff --check

      - name: Commit source migration and bind immutable source anchor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kernel-authority-migration'
          git config user.email 'kernel-authority-migration@users.noreply.github.com'

          if ! git diff --exit-code --quiet -- codex-rs/hepta-agentd/src/automation_effect_host.rs; then
            git add codex-rs/hepta-agentd/src/automation_effect_host.rs
            test "$(git diff --cached --name-only)" = 'codex-rs/hepta-agentd/src/automation_effect_host.rs'
            git commit -m 'fix(kernel-authority): use protected time for Agentd effects'
          fi

          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          SOURCE_COMMIT="$source_commit" SOURCE_TREE="$source_tree" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('qualification/kernel-authority/status_manifest.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          value['sourceAnchor'] = {
              'commit': os.environ['SOURCE_COMMIT'],
              'tree': os.environ['SOURCE_TREE'],
          }
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/kernel_authority_status.py write
          python3 scripts/kernel_authority_status.py check
          python3 qualification/kernel-authority/generate_status.py --check
          python3 qa/b4-no-bypass/test_kernel_authority_extension_api.py
          python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py
          git diff --check

      - name: Retire migration authority and publish generated truth
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/kernel-authority-agentd-time-migration.yml
          git add \
            qualification/kernel-authority/status_manifest.json \
            docs/modules/kernel.authority/IMPLEMENTATION_MAP.json \
            docs/modules/kernel.authority/CURRENT_STATE.json \
            docs/modules/kernel.authority/CURRENT_STATE.md \
            docs/modules/kernel.authority/CURRENT_IMPLEMENTATION.md \
            docs/modules/kernel.authority/TRACEABILITY.md \
            docs/modules/kernel.authority/STATUS.md \
            qualification/module-execution-dossiers/detail/kernel.authority.status.json
          git diff --cached --check
          git commit -m 'docs(kernel-authority): rebind generated truth after protected-time migration'
          git push origin HEAD:work/kernel-authority-convergence-20260925
