name: Kernel authority verified-head migration

on:
  push:
    branches:
      - work/kernel-authority-convergence-20260925
    paths:
      - '.github/workflows/kernel-authority-agentd-time-migration.yml'

permissions:
  contents: write

concurrency:
  group: kernel-authority-verified-head-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse a moved branch
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply verified-head and evidence closure
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/kernel_authority_verified_head_migration.py
          python3 - <<'PY'
          from pathlib import Path

          trust_path = Path('codex-rs/hepta-contracts/src/authority_trust.rs')
          trust = trust_path.read_text(encoding='utf-8')
          old = '''    fn head_at(&self, now_unix_ms: u64) -> Result<FinalUseRevocations, FinalUseError> {
                  if now_unix_ms < self.issued_at_unix_ms || now_unix_ms >= self.expires_at_unix_ms {
                      return Err(FinalUseError::InvalidTrust);
                  }
                  Ok(self.head.clone())
              }'''
          new = '''    fn head_at(
                  &self,
                  now_unix_ms: u64,
                  maximum_uncertainty_ms: u64,
              ) -> Result<FinalUseRevocations, FinalUseError> {
                  let definitely_live_after = self
                      .issued_at_unix_ms
                      .saturating_add(maximum_uncertainty_ms);
                  let possibly_expired_at = now_unix_ms.saturating_add(maximum_uncertainty_ms);
                  if now_unix_ms < definitely_live_after
                      || possibly_expired_at >= self.expires_at_unix_ms
                  {
                      return Err(FinalUseError::InvalidTrust);
                  }
                  Ok(self.head.clone())
              }'''
          if old not in trust:
              raise SystemExit('verified-head uncertainty function anchor drifted')
          trust = trust.replace(old, new, 1)
          old_call = '    let head = verified_head.head_at(now_unix_ms)?;'
          new_call = '''    let head = verified_head.head_at(
                  now_unix_ms,
                  bundle.clock.maximum_uncertainty_ms(),
              )?;'''
          if trust.count(old_call) != 2:
              raise SystemExit('verified-head uncertainty call anchors drifted')
          trust = trust.replace(old_call, new_call)
          trust_path.write_text(trust, encoding='utf-8')

          tests_path = Path('codex-rs/hepta-contracts/src/authority_trust_tests.rs')
          tests = tests_path.read_text(encoding='utf-8')
          import_anchor = 'use super::*;\nuse ed25519_dalek::Signer;\n'
          explicit_imports = '''use super::*;
          use crate::final_use_control::FinalUseRevocationFeedVerifier;
          use crate::final_use_control::FinalUseRevocationUpdate;
          use crate::final_use_control::SignedFinalUseRevocationUpdate;
          use ed25519_dalek::Signer;
          '''
          if tests.count(import_anchor) != 1:
              raise SystemExit('verified-head test import anchor drifted')
          tests = tests.replace(import_anchor, explicit_imports, 1)
          if tests.count('clock_at(4_000),') != 1:
              raise SystemExit('uncertainty boundary test anchor drifted')
          tests = tests.replace('clock_at(4_000),', 'clock_at(2_995),', 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY
          cd codex-rs
          cargo fmt -p codex-hepta-contracts -p codex-hepta-agentd
          cargo fmt --check -p codex-hepta-contracts -p codex-hepta-agentd
          cargo test --locked -p codex-hepta-contracts --lib -- --nocapture
          cargo test --locked -p codex-hepta-agentd host_dispatches_exact_wire_payload_once -- --nocapture
          cd ..
          python3 -m unittest discover -s qualification/kernel-authority -p 'test_*.py' -v
          python3 qa/b4-no-bypass/test_kernel_authority_extension_api.py -v
          python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py -v
          git diff --check

      - name: Commit source closure and bind generated truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kernel-authority-migration'
          git config user.email 'kernel-authority-migration@users.noreply.github.com'

          git add \
            codex-rs/hepta-contracts/src/authority_trust.rs \
            codex-rs/hepta-contracts/src/authority_trust_tests.rs \
            codex-rs/hepta-agentd/src/automation_effect_host.rs \
            qualification/kernel-authority/runtime_qualification.py \
            qualification/kernel-authority/test_runtime_qualification.py \
            qa/b4-no-bypass/KERNEL_AUTHORITY_EXTENSION_API.json \
            .github/workflows/kernel-authority-convergence.yml \
            .github/workflows/kernel-authority-production-closure.yml \
            .github/workflows/kernel-authority-status.yml

          expected="$(
            printf '%s\n' \
              '.github/workflows/kernel-authority-convergence.yml' \
              '.github/workflows/kernel-authority-production-closure.yml' \
              '.github/workflows/kernel-authority-status.yml' \
              'codex-rs/hepta-agentd/src/automation_effect_host.rs' \
              'codex-rs/hepta-contracts/src/authority_trust.rs' \
              'codex-rs/hepta-contracts/src/authority_trust_tests.rs' \
              'qa/b4-no-bypass/KERNEL_AUTHORITY_EXTENSION_API.json' \
              'qualification/kernel-authority/runtime_qualification.py' \
              'qualification/kernel-authority/test_runtime_qualification.py'
          )"
          observed="$(git diff --cached --name-only | sort)"
          test "$observed" = "$(printf '%s\n' "$expected" | sort)"
          git diff --cached --check
          git commit -m 'fix(kernel-authority): require authenticated production recovery heads'

          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          SOURCE_COMMIT="$source_commit" SOURCE_TREE="$source_tree" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('qualification/kernel-authority/status_manifest.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          value['sourceAnchor'] = {
              'commit': os.environ['SOURCE_COMMIT'],
              'tree': os.environ['SOURCE_TREE'],
          }
          value['productionTrustBundle']['verifiedRevocationHeadRequired'] = True
          for operation in value['operations']:
              if operation['operation'] == 'final_use_control':
                  operation['state'] = (
                      'source_implemented_independent_approval_signed_feed_'
                      'typed_verified_recovery_head_and_receipt_bound_convergence_'
                      'transport_external'
                  )
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

          python3 scripts/kernel_authority_status.py write
          python3 scripts/kernel_authority_status.py check
          python3 qualification/kernel-authority/generate_status.py --check
          python3 qa/b4-no-bypass/test_kernel_authority_extension_api.py -v
          python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py -v
          git diff --check

      - name: Retire migration and publish immutable projections
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/kernel-authority-agentd-time-migration.yml \
            .github/scripts/kernel_authority_verified_head_migration.py
          git add \
            qualification/kernel-authority/status_manifest.json \
            docs/modules/kernel.authority/IMPLEMENTATION_MAP.json \
            docs/modules/kernel.authority/CURRENT_STATE.json \
            docs/modules/kernel.authority/CURRENT_STATE.md \
            docs/modules/kernel.authority/CURRENT_IMPLEMENTATION.md \
            docs/modules/kernel.authority/TRACEABILITY.md \
            docs/modules/kernel.authority/STATUS.md \
            qualification/module-execution-dossiers/detail/kernel.authority.status.json
          git diff --cached --check
          git commit -m 'docs(kernel-authority): rebind truth after verified-head closure'
          git push origin HEAD:work/kernel-authority-convergence-20260925
