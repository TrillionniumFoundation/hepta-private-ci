name: Runtime Agentd source publication

# This temporary publisher applies one reviewed, content-addressed source tree.
# The published source restores the ordinary formatting workflow from BASE_SHA;
# complete Linux/macOS, process, product and merge-candidate qualification runs
# against the resulting exact head rather than against this carrier.
on:
  push:
    branches:
      - work/runtime-agentd-production-closure-20260928

permissions:
  contents: write

concurrency:
  group: runtime-agentd-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      BASE_SHA: 3f6b49355947c3cddaaa89198cbf17b66d46c2fa
      PATCH_SHA256: 60b54679710d460f3be18a74a7760d034fbf281afa387f9107fbda1212d617eb
      PATCH_GLOB: .github/runtime-agentd-source.patch.b64.part*
      TARGET_BRANCH: work/runtime-agentd-production-closure-20260928
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Checkout immutable carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 128
          persist-credentials: true

      - name: Verify scope and apply the exact patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          unexpected=$(git diff --name-only "$BASE_SHA" HEAD | grep -Ev '^(\.github/runtime-agentd-source\.patch\.b64\.part[0-9]+|\.github/workflows/runtime-agentd-apply-instance-patch\.yml|\.github/workflows/runtime-agentd-format-repair\.yml)$' || true)
          test -z "$unexpected"
          cat $PATCH_GLOB | tr -d '\n' | base64 -d > "$RUNNER_TEMP/runtime-agentd-source.patch.gz"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/runtime-agentd-source.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/runtime-agentd-source.patch.gz" > "$RUNNER_TEMP/runtime-agentd-source.patch"
          git apply --check "$RUNNER_TEMP/runtime-agentd-source.patch"
          git apply "$RUNNER_TEMP/runtime-agentd-source.patch"
          python3 -c 'from pathlib import Path; p=Path("codex-rs/hepta-agentd/src/neuron_runtime_tests.rs"); t=p.read_text(encoding="utf-8"); n="\n    fn compare_and_swap(\n"; r="\n    fn admit_new_anchor(\n        &self,\n        _expected: Option<JournalAnchor>,\n    ) -> Result<(), WitnessStoreError> {\n        Ok(())\n    }\n\n    fn compare_and_swap(\n"; assert t.count(n) == 1, "expected exactly one StubWitness insertion point"; p.write_text(t.replace(n, r, 1), encoding="utf-8")'
          rm .github/runtime-agentd-instance.patch.gz
          rm .github/runtime-agentd-source.patch.b64.part*
          rm .github/workflows/runtime-agentd-apply-instance-patch.yml
          git show "$BASE_SHA:.github/workflows/runtime-agentd-format-repair.yml" > .github/workflows/runtime-agentd-format-repair.yml
          git diff --check

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, rust-src

      - name: Format changed Rust packages
        working-directory: codex-rs
        run: cargo fmt --manifest-path Cargo.toml --package codex-hepta-agentd --package codex-hepta-infer-worker-host

      - name: Verify source, authority and dependency contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -B -m unittest discover -s scripts/qualification -p 'test_agentd_exact_head.py' -v
          python3 -B -m unittest scripts.qualification.test_runtime_agentd_current_status -v
          python3 -B -m unittest scripts.qualification.test_runtime_agentd_dependency_boundary -v
          python3 -B -m unittest scripts.test_hepta_agentd_trust_boundary -v
          python3 -B scripts/qualification/runtime_agentd_dependency_boundary.py --repository .
          python3 -B scripts/hepta_agentd_trust_boundary.py
          cargo metadata --locked --manifest-path codex-rs/Cargo.toml --format-version 1 --no-deps > "$RUNNER_TEMP/cargo-metadata.json"

      - name: Execute isolated lifecycle and metrics cores
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          rustc --edition=2024 --test codex-rs/hepta-agentd/src/runtime_codex_lifecycle_core.rs -o "$out/lifecycle"
          "$out/lifecycle"
          rustc --edition=2024 --test codex-rs/hepta-agentd/src/runtime_codex_metrics.rs -o "$out/metrics"
          "$out/metrics"

      - name: Publish reviewed source for exact-head qualification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(find .github -maxdepth 1 -name 'runtime-agentd-source.patch.b64.part*' -print -quit)"
          test ! -e .github/runtime-agentd-instance.patch.gz
          test ! -e .github/workflows/runtime-agentd-apply-instance-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'runtime.agentd: own instances and bound maintenance'
          git push origin HEAD:"$TARGET_BRANCH"
