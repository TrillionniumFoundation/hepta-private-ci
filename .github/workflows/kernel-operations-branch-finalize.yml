name: Kernel operations durable branch finalizer

on:
  push:
    branches:
      - work/kernel-operations-durable-v1-20260917
    paths:
      - scripts/kernel_operations_branch_finalize.py
      - .github/workflows/kernel-operations-branch-finalize.yml

permissions:
  contents: write

concurrency:
  group: kernel-operations-durable-branch-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Synchronize durable truth registries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kernel_operations_branch_finalize.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-operations
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 --no-deps >/dev/null
          git diff --check

      - name: Commit generated lock, formatting and truth updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hepta kernel operations finalizer'
          git config user.email 'hepta-kernel-operations@users.noreply.github.com'
          git add -A
          git commit -m 'chore(kernel.operations): synchronize durable source truth and lock'
          test "$(git rev-parse HEAD^)" = "${{ github.sha }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify final committed branch state
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lane_a_foundation.py self-test
          python3 scripts/verify_lane_a_foundation.py verify
          python3 -m unittest qualification/module-execution-dossiers/test_lane_a_foundation.py
          (cd qualification/module-execution-dossiers && python3 -m unittest test_implementation_contracts.py)
          (cd codex-rs && cargo test --locked -p codex-hepta-operations)
          (cd codex-rs && cargo clippy --locked -p codex-hepta-operations --all-targets --all-features -- -D warnings)
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
