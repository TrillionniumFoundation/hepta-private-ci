name: Hepta AMCN Reader capacity 24-64 negative gate
on:
  push:
    branches: ["research/amcn-causal-three-axis-20261015"]
    paths: ["qualification/amcn-v1/amcn_reader_capacity_denial.py", "qualification/amcn-v1/test_amcn_reader_capacity_denial.py", "qualification/amcn-v1/ORIGINAL_READER_CAPACITY_24_64_NEGATIVE.json", ".github/workflows/hepta-amcn-reader-capacity-negative.yml"]
  pull_request:
    branches: ["research/amcn-typed-budget-20261014"]
permissions:
  contents: read
jobs:
  negative-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          PYTHONPATH=qualification/amcn-v1 python3 -m unittest discover -s qualification/amcn-v1 -p test_amcn_reader_capacity_denial.py -v
          python3 qualification/amcn-v1/amcn_reader_capacity_denial.py qualification/amcn-v1/ORIGINAL_READER_CAPACITY_24_64_NEGATIVE.json
