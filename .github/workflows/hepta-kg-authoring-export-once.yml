name: Hepta knowledge.graph one-shot authoring closure

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - .github/workflows/hepta-kg-authoring-export-once.yml

permissions:
  contents: write

concurrency:
  group: hepta-kg-authoring-export-once-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  close:
    name: Validate, bind and commit ordinary source once
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "work/kg-abc-evidence-hardening-20260928"
          git diff --exit-code
          git diff --cached --exit-code
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"

      - name: Prepare native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev pkg-config protobuf-compiler
          python3 scripts/hepta_ci_v8.py

      - name: Materialize reviewed compile fix and formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-kg/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          anchor = "pub use resource::measure_generation_v2;\n"
          insertion = (
              "pub(crate) use resource::measure_query_edge_bytes_v2;\n"
              "pub(crate) use resource::measure_query_result_base_bytes_v2;\n"
          )
          if insertion not in text:
              if anchor not in text:
                  raise SystemExit("knowledge.graph resource export anchor is missing")
              path.write_text(text.replace(anchor, insertion + anchor, 1), encoding="utf-8")
          PY
          cd codex-rs
          cargo fmt --package codex-hepta-kg --package codex-hepta-memory \
            --package codex-hepta-prompt-registry --package codex-hepta-prompt-optimizer \
            --package codex-hepta-agentd
          cargo fmt --package codex-hepta-kg --package codex-hepta-memory \
            --package codex-hepta-prompt-registry --package codex-hepta-prompt-optimizer \
            --package codex-hepta-agentd -- --check

      - name: Validate kernel and prepared publication
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test --locked -p codex-hepta-kg -- --nocapture
          cargo test --locked -p codex-hepta-memory \
            --test kg_prepared_and_plans -- --nocapture --test-threads=1
          cargo clippy --locked -p codex-hepta-kg -p codex-hepta-memory \
            --no-deps --all-targets -- -D warnings

      - name: Commit exact ordinary source and remove authoring seam
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/kg-abc-evidence-hardening-20260928
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git diff --check
          if git diff --name-only | grep -E '(^|/)(.*\.patch\.(gz\.)?b64|.*\.patch$)' ; then
            echo "encoded or tracked patch payload is not an authoring result" >&2
            exit 1
          fi
          rm -f .github/workflows/hepta-kg-authoring-export-once.yml
          rm -f scripts/test_hepta_kg_authoring_export_once.py
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git diff --cached --name-only
          git commit -s -m "fix(knowledge.graph): close source formatting and query exports"
          printf 'source_commit=%s\nsource_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            | tee "$RUNNER_TEMP/kg-source-identity.txt"

      - name: Regenerate exact source metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module knowledge.graph
          python3 scripts/hepta_kg_documentation_sync.py --apply
          python3 scripts/hepta_kg_status.py --apply
          git add \
            docs/modules/knowledge.graph \
            qualification/knowledge-graph \
            qualification/module-execution-dossiers/detail/knowledge.graph.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -s -m "docs(knowledge.graph): bind exact source observation"
          fi

      - name: Verify final immutable metadata head
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_kg_status.py --check
          python3 scripts/hepta_kg_documentation_sync.py --check
          python3 scripts/hepta_knowledge_graph_map_verify.py \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push exact fast-forward result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/kg-abc-evidence-hardening-20260928
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:work/kg-abc-evidence-hardening-20260928
