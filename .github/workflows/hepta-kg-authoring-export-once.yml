name: Hepta knowledge.graph one-shot authoring export

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - .github/workflows/hepta-kg-authoring-export-once.yml

permissions:
  contents: read

concurrency:
  group: hepta-kg-authoring-export-once-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  export:
    name: Export formatted ordinary-source patch
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev pkg-config protobuf-compiler
          python3 scripts/hepta_ci_v8.py

      - name: Materialize reviewed compile fix and format source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-kg/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          anchor = "pub use resource::measure_generation_v2;\n"
          insertion = (
              "pub(crate) use resource::measure_query_edge_bytes_v2;\n"
              "pub(crate) use resource::measure_query_result_base_bytes_v2;\n"
          )
          if insertion not in text:
              if anchor not in text:
                  raise SystemExit("knowledge.graph resource export anchor is missing")
              text = text.replace(anchor, insertion + anchor, 1)
              path.write_text(text, encoding="utf-8")
          PY
          cd codex-rs
          cargo fmt --package codex-hepta-kg --package codex-hepta-memory \
            --package codex-hepta-prompt-registry --package codex-hepta-prompt-optimizer \
            --package codex-hepta-agentd

      - name: Validate focused source and strict lint
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/kg-authoring"
          mkdir -p "$root/logs"
          failures=0
          run_check() {
            local name="$1"
            shift
            set +e
            (cd codex-rs && "$@") 2>&1 | tee "$root/logs/${name}.log"
            local status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$name" "$status" >> "$root/results.tsv"
            if [[ $status -ne 0 ]]; then failures=$((failures + 1)); fi
          }
          : > "$root/results.tsv"
          run_check kg cargo test --locked -p codex-hepta-kg -- --nocapture
          run_check prepared cargo test --locked -p codex-hepta-memory \
            --test kg_prepared_and_plans -- --nocapture --test-threads=1
          run_check lint cargo clippy --locked \
            -p codex-hepta-kg -p codex-hepta-memory \
            --no-deps --all-targets -- -D warnings
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          test "$failures" -eq 0

      - name: Export exact changed files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kg-authoring"
          mkdir -p "$root/tree"
          git diff --name-only --diff-filter=ACMRT -z > "$root/paths.zlist"
          while IFS= read -r -d '' path; do
            mkdir -p "$root/tree/$(dirname "$path")"
            cp -- "$path" "$root/tree/$path"
          done < "$root/paths.zlist"
          git diff --binary > "$root/authoring.patch"
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_blob=$(git rev-parse HEAD:.github/workflows/hepta-kg-authoring-export-once.yml)"
            echo "changed_paths=$(tr '\0' '\n' < "$root/paths.zlist" | wc -l)"
            echo "validation_failures=${{ steps.validate.outputs.failures }}"
          } > "$root/manifest.txt"
          sha256sum "$root/authoring.patch" > "$root/authoring.patch.sha256"
          cat "$root/manifest.txt"
          tr '\0' '\n' < "$root/paths.zlist"

      - name: Upload immutable authoring artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-graph-authoring-${{ github.sha }}
          path: ${{ runner.temp }}/kg-authoring
          if-no-files-found: error
          retention-days: 7

      - name: Enforce validation result
        if: always()
        shell: bash
        run: test "${{ steps.validate.outputs.failures }}" = "0"
