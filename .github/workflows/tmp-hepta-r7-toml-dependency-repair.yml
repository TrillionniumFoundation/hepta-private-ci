name: Temporary r7 structural dependency repair

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/tmp-hepta-r7-toml-dependency-repair.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: tmp-hepta-r7-toml-dependency-repair
  cancel-in-progress: false

jobs:
  patch-test-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch, test, self-clean, publish, and dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: TrillionniumFoundation/hepta-private-ci
          CONTROLLER_REF: ops/hepta-global-gap-closure-controller-20260910-r1
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${CONTROLLER_REF}"
          python3 scripts/tmp-hepta-r7-toml-dependency-repair.py
          python3 -m py_compile scripts/hepta-global-finalizer-r7.py
          python3 - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path("scripts/hepta-global-finalizer-r7.py")
          spec = importlib.util.spec_from_file_location("hepta_r7_structural_test", path)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load patched r7 executor")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          manifest = '''
          [package]
          name = "probe"
          version = "0.0.0"

          [dependencies]
          serde = "1"
          renamed = { package = "codex-renamed", path = "../renamed" }

          [dependencies.codex-protocol]
          path = "../protocol"

          [target.'cfg(windows)'.dependencies.codex-target]
          path = "../target"

          [target.'cfg(unix)'.dev-dependencies]
          codex-dev = { path = "../dev" }

          [target.'cfg(unix)'.build-dependencies.codex-build]
          path = "../build"
          '''
          observed = module.dependency_sections(manifest)
          expected = {
              "serde",
              "renamed",
              "codex-renamed",
              "codex-protocol",
              "codex-target",
              "codex-dev",
              "codex-build",
          }
          if not expected.issubset(observed):
              raise SystemExit(
                  f"structural dependency parser missed entries: {sorted(expected - observed)!r}"
              )
          duplicate_probe = Path("/tmp/hepta-r7-dependency-probe.toml")
          duplicate_probe.write_text(manifest, encoding="utf-8")
          if module.add_dependency(duplicate_probe, "codex-protocol", Path("../protocol")):
              raise SystemExit("table-form dependency was incorrectly duplicated")
          if module.add_dependency(duplicate_probe, "codex-renamed", Path("../renamed")):
              raise SystemExit("renamed package dependency was incorrectly duplicated")
          if duplicate_probe.read_text(encoding="utf-8") != manifest:
              raise SystemExit("idempotence probe mutated a complete manifest")
          PY
          rm scripts/tmp-hepta-r7-toml-dependency-repair.py
          rm .github/workflows/tmp-hepta-r7-toml-dependency-repair.yml
          git config user.name 'Hepta Blocker Remediator'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit --signoff -m 'fix(hepta): make r7 dependency repair TOML-structural'
          git fetch --no-tags origin "${CONTROLLER_REF}"
          git rebase "origin/${CONTROLLER_REF}"
          git push origin "HEAD:refs/heads/${CONTROLLER_REF}"
          expected="$(git rev-parse HEAD)"
          observed="$(git ls-remote origin "refs/heads/${CONTROLLER_REF}" | cut -f1)"
          test "${observed}" = "${expected}"
          gh workflow run hepta-global-finalizer-r7.yml \
            --repo "${REPOSITORY}" \
            --ref "${CONTROLLER_REF}" \
            -f target_branch=integration/hepta-all-gap-closure-20260910-r7 \
            -f shard_count=8
