name: compact.engine atomic remediation apply

on:
  push:
    branches: [fix/compact-engine-current-main-convergence-20260925]
    paths:
      - ".github/workflows/compact-engine-remediation-apply.yml"

permissions:
  contents: write

concurrency:
  group: compact-engine-remediation-apply
  cancel-in-progress: false

jobs:
  apply-verified-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/compact-engine-current-main-convergence-20260925
          fetch-depth: 0
          persist-credentials: true
      - name: Bind exact starting source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bb398d7d6c71e80ce61cadf99d3ea0dbba663d63"
          test -z "$(git status --porcelain)"
      - name: Apply bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d > "$RUNNER_TEMP/compact-engine-remediation.patch" <<'PATCH_B64'

PATCH_B64
          git apply --check "$RUNNER_TEMP/compact-engine-remediation.patch"
          git apply "$RUNNER_TEMP/compact-engine-remediation.patch"
          rm .github/workflows/compact-engine-remediation-apply.yml
          git diff --check
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Check locked source
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets
      - name: Install repository test runners
        run: cargo install --locked just cargo-nextest
      - name: Test focused product path
        run: just test --locked -p codex-hepta-compact-engine -p codex-hepta-agentd
      - name: Strict Clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Commit verified source directly to convergence branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "compact.engine remediation"
          git config user.email "compact-engine-remediation@invalid.example"
          git add \
            codex-rs/hepta-compact-engine/src/durable.rs \
            codex-rs/hepta-compact-engine/src/product_e2e_tests.rs \
            codex-rs/hepta-memory/src/cognitive_store_recovery.rs \
            codex-rs/hepta-agentd/tests/cognitive_store_product_writer.rs \
            .github/workflows/compact-engine-remediation-apply.yml
          git commit -m "fix(compact.engine): close generation and exact-cut recovery"
          git push origin HEAD:fix/compact-engine-current-main-convergence-20260925
