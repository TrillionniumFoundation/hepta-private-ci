name: Hepta Neuron native Replay source bridge (diagnostic)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-agentd/src/shared_terminal_cell.rs"
      - "codex-rs/hepta-agentd/src/neuron_runtime.rs"
      - "codex-rs/hepta-agentd/src/neuron_runtime_tests.rs"
      - "codex-rs/hepta-agentd/src/lib.rs"
      - "codex-rs/hepta-agentd/tests/terminal_cell_owner.rs"
      - "qualification/neuron-model-trials/NATIVE_OBSERVATION_REPLAY_SOURCE.md"
      - ".github/workflows/hepta-neuron-native-replay-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-owner-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout experimental source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust with rustfmt and Clippy
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Check rustfmt for Agentd owner
        run: cargo fmt --package codex-hepta-agentd -- --check
      - name: Check real Agentd integration crate
        run: cargo check --locked -p codex-hepta-agentd --lib --tests
      - name: Run durable owner, SQLite Memory and Ledger integration
        run: cargo test --locked -p codex-hepta-agentd --test terminal_cell_owner clean_agent_recall_replay_training_load_and_source_withdrawal -- --exact
      - name: Check strict correctness
        run: cargo clippy --locked -p codex-hepta-agentd --lib -- -D clippy::correctness
      - name: Check source hygiene
        working-directory: ${{ github.workspace }}
        run: |
          git diff --check
          git diff --exit-code
