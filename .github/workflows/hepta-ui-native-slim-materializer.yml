name: ui.native lightweight source materializer

on:
  push:
    branches: [work/ui-native-integration-convergence-20260927]
    paths:
      - .github/workflows/hepta-ui-native-slim-materializer.yml
      - .github/materializers/ui-native-convergence.patch.gz.b64

permissions:
  contents: write

concurrency:
  group: ui-native-integration-convergence-executor-20260927
  cancel-in-progress: true

env:
  CANDIDATE_BRANCH: work/ui-native-integration-convergence-20260927
  ANCESTOR_SHA: 709aab0b61f2484b7f5c1efadee96fb14fc5cd31
  PATCH_B64_SHA256: 791b6eb7a6e5be1e486c5f3051be2369bfd546e59d95b56b282a2dbb191bb40b
  PATCH_GZ_SHA256: 62bc3642ee05a21714e9950d16fad74c5dbe990314b39dc001513179158bd0f0
  PATCH_SHA256: 94c62379e1dcfe220040a21c3db5febcc140e5c3a5d4fef4158e667f7487263c

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/ui-native-integration-convergence-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Bind lineage, input blobs and content-addressed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$CANDIDATE_BRANCH"
          git merge-base --is-ancestor "$ANCESTOR_SHA" HEAD
          test -z "$(git status --porcelain)"

          test "$(git hash-object .github/workflows/hepta-ui-native-current-source.yml)" = ce2f593ce909163987855066be3f4fdf7778541b
          test "$(git hash-object .github/workflows/hepta-ui-native-projections.yml)" = ab58c4d4b5350d61273d8b109fb856aa316781c4
          test "$(git hash-object .github/workflows/hepta-ui-native-remediation-format.yml)" = 0c84c81e2d8a49107a7f35ac42dc59bbfe9b8771
          test "$(git hash-object .github/workflows/hepta-ui-native-remediation.yml)" = 6b9f8eaa462dd2de07bde40efb97f5cd76c74ee5
          test "$(git hash-object apps/hepta-native/DEVELOPMENT.md)" = 295211fc3ab746a6fb1a48692b3a55828b92fbba
          test "$(git hash-object apps/hepta-native/src/ui.rs)" = cae6c07c507025678d927a008fe417c35b72cc06
          test "$(git hash-object apps/hepta-native/src/ui/update_views.rs)" = a60677308d8e0fe9458f510acb2b8bf451205f17
          test "$(git hash-object apps/hepta-native/tools/prepare_current_source.py)" = 14b8a968953d4073a91156731018872c6da59525
          test "$(git hash-object docs/modules/MODULE_DOCS.json)" = f37d88bc0021f2c28b28d941b83fb8b1dd330a9f
          test "$(git hash-object docs/modules/kernel.authority/TECHNICAL.md)" = 52ffbf87abc8d30cdb918a95323ca657b7ac8280
          test "$(git hash-object docs/modules/ui.native/TECHNICAL.md)" = 41fc8b410f58d41051f1198781a44048129b5fac

          patch_b64=.github/materializers/ui-native-convergence.patch.gz.b64
          echo "$PATCH_B64_SHA256  $patch_b64" | sha256sum -c -
          base64 --decode "$patch_b64" > /tmp/ui-native-convergence.patch.gz
          echo "$PATCH_GZ_SHA256  /tmp/ui-native-convergence.patch.gz" | sha256sum -c -
          gzip -dc /tmp/ui-native-convergence.patch.gz > /tmp/ui-native-convergence.patch
          echo "$PATCH_SHA256  /tmp/ui-native-convergence.patch" | sha256sum -c -
          git apply --check /tmp/ui-native-convergence.patch
          git apply /tmp/ui-native-convergence.patch
          git diff --check

      - name: Format with pinned Rust 1.95
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
            source "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-native-gateway \
            -p codex-hepta-contracts \
            -p codex-hepta-private-state
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check

      - name: Verify static safety and release boundaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/hepta_ui_native_release_gates.py
          python3 -m py_compile \
            apps/hepta-native/tools/prepare_current_source.py \
            scripts/hepta_ui_native_release_gates.py \
            scripts/test_hepta_ui_native_release_gates.py
          python3 scripts/hepta_ui_native_release_gates.py audit
          python3 -m unittest -v scripts.test_hepta_ui_native_release_gates
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/test_hepta_module_registry.py
          ! grep -R '"releaseAuthorized"[[:space:]]*:[[:space:]]*true' docs/modules/ui.native/RELEASE_GATES.json
          test "$(grep -c '^WRITE_BRANCHES = {BRANCH}$' apps/hepta-native/tools/prepare_current_source.py)" = 1
          git diff --check

      - name: Commit source closure and retire one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ui-native-convergence
          git config user.email ui-native-convergence@users.noreply.github.com
          git rm --ignore-unmatch \
            .github/workflows/hepta-ui-native-fix-materializer.yml \
            .github/workflows/hepta-ui-native-slim-materializer.yml \
            .github/materializers/hepta-ui-native-integration-converge.yml.txt \
            .github/materializers/ui-native-convergence.patch.gz.b64 \
            scripts/hepta_ui_native_converge.py
          git add --all
          git diff --cached --check
          git commit -m 'fix(ui.native): converge supervised runtime and candidate truth'

      - name: Regenerate identities against committed source
        shell: bash
        env:
          HEPTA_UI_NATIVE_WRITE_BRANCH: work/ui-native-integration-convergence-20260927
        run: |
          set -euo pipefail
          python3 apps/hepta-native/tools/prepare_current_source.py --write-fingerprints
          python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          python3 scripts/hepta-module-docs.py refresh-derived
          python3 scripts/hepta-module-docs.py refresh-indexes
          git add --all
          git diff --cached --check
          git commit -m 'docs(ui.native): bind convergence identities to exact source'

      - name: Verify clean candidate and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/hepta-native/tools/prepare_current_source.py
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta-module-docs.py refresh-indexes --check
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/test_hepta_module_registry.py
          python3 scripts/hepta_ui_native_release_gates.py audit
          python3 -m unittest discover -s scripts -p 'test_hepta_ui_native_*.py' -v
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
