name: Ubuntu ARM64 repository-integrity exact workflow qualification
on:
  push:
    branches: [ci/gha-repository-integrity-arm-20261016]
    paths: [.github/workflows/gha-qualify-repository-integrity-arm.yml]
permissions:
  contents: read
jobs:
  guarded-checkout:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
  exact-repository-integrity:
    uses: ./.github/workflows/hepta-repository-integrity.yml
  wrapper-source-safety:
    name: Verify wrapper safe checkout and actual integrity self-test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run actual integrity self-test and keep checkout clean
        run: |
          set -euo pipefail
          python3 scripts/hepta-repository-integrity.py self-test
          git diff --check
          git diff --exit-code
