name: Kernel evidence native source delivery

on:
  push:
    branches: [work/kernel-evidence-ad-integration-20260928]

permissions:
  contents: write

jobs:
  reviewed-delivery:
    if: contains(github.event.head_commit.message, '[kernel-evidence-native-delivery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Format directly committed source and synchronize metadata
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kernel-evidence-delivery"
          mkdir -p "$out"
          branch=work/kernel-evidence-ad-integration-20260928
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' 'Runtime repairs are already committed. This lane does not execute a source-repair generator.' > "$out/source-boundary.txt"
          python3 -m venv "$RUNNER_TEMP/kernel-evidence-format-env"
          "$RUNNER_TEMP/kernel-evidence-format-env/bin/pip" install 'black==23.11.0' > "$out/black-install.log" 2>&1
          "$RUNNER_TEMP/kernel-evidence-format-env/bin/python" -m black scripts/kernel_evidence_integration_sync.py scripts/kernel_evidence_compile_repair_20260928.py scripts/tests/test_kernel_evidence_publication_epoch_sql.py > "$out/python-format.log" 2>&1
          (cd codex-rs && cargo fmt -p codex-hepta-evidence -p codex-hepta-agentd -p codex-hepta-agent-protocol -p codex-state) > "$out/rust-format.log" 2>&1
          python3 - <<'PY'
          import subprocess
          allowed = ('codex-rs/hepta-evidence/', 'codex-rs/hepta-agentd/', 'codex-rs/hepta-agent-protocol/', 'codex-rs/state/')
          scripts = {'scripts/kernel_evidence_integration_sync.py', 'scripts/kernel_evidence_compile_repair_20260928.py', 'scripts/tests/test_kernel_evidence_publication_epoch_sql.py'}
          for path in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines():
              if path not in scripts and not path.startswith(allowed):
                  raise SystemExit(f'out-of-scope source mutation: {path}')
          PY
          git diff --check
          git diff --binary > "$out/reviewed-source.patch"
          git add -- codex-rs/hepta-evidence codex-rs/hepta-agentd codex-rs/hepta-agent-protocol codex-rs/state scripts/kernel_evidence_integration_sync.py scripts/kernel_evidence_compile_repair_20260928.py scripts/tests/test_kernel_evidence_publication_epoch_sql.py
          if ! git diff --cached --quiet; then
            git commit -s -m 'style(kernel.evidence): format directly delivered publication sources [kernel-evidence-closure] [kernel-evidence-status-sync]'
          fi
          source="$(git rev-parse HEAD)"
          printf '%s\n' "$source" "$(git rev-parse HEAD^{tree})" > "$out/source-anchor.txt"
          python3 scripts/kernel_evidence_integration_sync.py metadata "$source" > "$out/metadata-sync.log" 2>&1
          python3 - <<'PY'
          import subprocess
          allowed = {
              'qualification/kernel-evidence/STATUS_SOURCE.json',
              'qualification/kernel-evidence/TRACEABILITY.md',
              'qualification/kernel-evidence/RELEASE_DASHBOARD.md',
              'qualification/module-execution-dossiers/detail/kernel.evidence.md',
              'docs/modules/kernel.evidence/TECHNICAL.md',
              'docs/modules/MODULE_DOCS.json',
              'docs/lane-a-foundation/kernel.evidence/CURRENT_IMPLEMENTATION.md',
              'docs/lane-a-foundation/kernel.evidence/STORE_V1.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed - allowed:
              raise SystemExit(f'out-of-scope document mutation: {changed - allowed}')
          PY
          git diff --check
          git add -- qualification/kernel-evidence/STATUS_SOURCE.json qualification/kernel-evidence/TRACEABILITY.md qualification/kernel-evidence/RELEASE_DASHBOARD.md qualification/module-execution-dossiers/detail/kernel.evidence.md docs/modules/kernel.evidence/TECHNICAL.md docs/modules/MODULE_DOCS.json docs/lane-a-foundation/kernel.evidence/CURRENT_IMPLEMENTATION.md docs/lane-a-foundation/kernel.evidence/STORE_V1.md
          if ! git diff --cached --quiet; then
            git commit -s -m 'docs(kernel.evidence): synchronize guide, store protocol and canonical inventory [kernel-evidence-closure] [kernel-evidence-status-sync]'
          fi
          documentation="$(git rev-parse HEAD)"
          printf '%s\n' "$documentation" "$(git rev-parse HEAD^{tree})" > "$out/documentation-anchor.txt"
          python3 scripts/kernel_evidence_integration_sync.py map "$documentation"
          git add -- docs/modules/kernel.evidence/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -s -m 'docs(kernel.evidence): bind guarded publication map to current source and guide [kernel-evidence-closure] [kernel-evidence-status-sync]'
          fi
          python3 scripts/kernel_evidence_status.py verify > "$out/status-verify.log" 2>&1
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD HEAD^{tree} > "$out/delivered-identity.txt"
          git log -3 --format='%H %s' > "$out/delivered-commits.txt"
          git archive --format=tar.gz HEAD > "$out/delivered-source.tar.gz"
      - name: Execute scoped native and SQL diagnostics from delivered source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kernel-evidence-delivery"
          probe="$RUNNER_TEMP/kernel-evidence-lock-native"
          mkdir -p "$probe/src"
          cp codex-rs/hepta-agentd/src/evidence_publication_process_lock*.rs "$probe/src/"
          cat > "$probe/Cargo.toml" <<'TOML'
          [package]
          name = "kernel-evidence-exact-lock-probe"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [dependencies]
          libc = "=0.2.186"
          [dev-dependencies]
          tempfile = "=3.27.0"
          TOML
          printf '%s\n' '#[path = "evidence_publication_process_lock.rs"]' 'mod publication_process_lock;' > "$probe/src/lib.rs"
          sha256sum codex-rs/hepta-agentd/src/evidence_publication_process_lock*.rs codex-rs/hepta-evidence/src/identity_assignment.rs scripts/tests/test_kernel_evidence_publication_epoch_sql.py > "$out/probe-source-sha256.txt"
          failures=0
          run_check() {
            local name="$1"; shift
            printf '%q ' "$@" > "$out/$name.command"
            printf '\n' >> "$out/$name.command"
            set +e
            "$@" > "$out/$name.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$out/$name.exit"
            tail -n 40 "$out/$name.log"
            if [ "$rc" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          rustc --version --verbose > "$out/rustc.txt"
          run_check identity-compile rustc --edition=2024 --test codex-rs/hepta-evidence/src/identity_assignment.rs -o "$out/identity-tests"
          if [ "$(cat "$out/identity-compile.exit")" = 0 ]; then
            run_check identity-tests "$out/identity-tests" --nocapture
          fi
          run_check publication-epoch-sql python3 -m unittest discover -s scripts/tests -p test_kernel_evidence_publication_epoch_sql.py -v
          run_check native-lock-tests cargo test --manifest-path "$probe/Cargo.toml" -- --nocapture
          if [ -f "$probe/Cargo.lock" ]; then cp "$probe/Cargo.lock" "$out/lock-probe-Cargo.lock"; fi
          test -z "$(git status --porcelain)"
          test "$failures" -eq 0
      - name: Retain delivery and execution identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kernel-evidence-delivery"
          mkdir -p "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/final-identity.txt"
          printf '%s\n' 'Source delivery and scoped tests only. Full repository qualification, independent acceptance and deployment are not implied.' > "$out/CLAIM_BOUNDARY.txt"
          (cd "$out" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kernel-evidence-native-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-evidence-delivery
          if-no-files-found: error
          retention-days: 14
