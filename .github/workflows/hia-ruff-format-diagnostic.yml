name: HIA pinned Ruff exact formatter diagnostic (research)

on:
  push:
    branches:
      - dot/hia-macos-ruff-exact-diagnostic-20261102

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Print exact pinned formatter diff and fail on drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv run --frozen --project scripts ruff --version
          uv run --frozen --project scripts ruff format --diff scripts/tests/test_hepta_bazel_macos_resource_caps.py
          uv run --frozen --project scripts ruff format --check scripts/tests/test_hepta_bazel_macos_resource_caps.py
