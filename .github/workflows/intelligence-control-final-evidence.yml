name: intelligence.control final recovery qualification

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/workflows/intelligence-control-final-evidence.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-final-recovery-qualification
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  finalize:
    name: Commit permanent recovery tests
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intelligence-control-product-closure-20260926
          fetch-depth: 0
          persist-credentials: true

      - name: Add exact authenticated recovery tests and truth facts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          learning = Path("codex-rs/hepta-agentd/src/intelligence_learning.rs")
          text = learning.read_text()
          marker = "persisted_evidence_binding_rejects_signed_identity_substitution"
          if marker not in text:
              insertion = r'''

              fn recovery_test_evidence() -> SignedLearningEvidenceV1 {
                  SignedLearningEvidenceV1 {
                      evidence_id: StableId::new("evidence.recovery").expect("evidence id"),
                      principal_id: StableId::new("principal.generator").expect("principal id"),
                      role: LearningEvidenceRoleV1::Generator,
                      trust_digest: Digest32::of_bytes(b"recovery-trust"),
                      scope_digest: Digest32::of_bytes(b"recovery-scope"),
                      objective_digest: Digest32::of_bytes(b"recovery-objective"),
                      authority_epoch: 7,
                      issued_at: 100,
                      expires_at: 200,
                      payload_digest: Digest32::of_bytes(b"recovery-payload"),
                      signature: [9; 64],
                  }
              }

              fn recovery_test_binding(
                  evidence: &SignedLearningEvidenceV1,
              ) -> VerifiedEvidenceBindingPayloadV1 {
                  VerifiedEvidenceBindingPayloadV1 {
                      principal_id: evidence.principal_id.to_string(),
                      controller_id: "controller.generator".to_string(),
                      credential_chain_digest: Digest32::of_bytes(b"credential-chain").to_string(),
                      signing_key_digest: Digest32::of_bytes(b"signing-key").to_string(),
                      scope_digest: evidence.scope_digest.to_string(),
                      authority_epoch: evidence.authority_epoch,
                      authentication_digest: learning_evidence_digest_v1(evidence).to_string(),
                  }
              }

              fn recovery_test_principal() -> AuthenticatedPrincipalV1 {
                  AuthenticatedPrincipalV1 {
                      principal_id: StableId::new("principal.generator").expect("principal id"),
                      credential_chain_digest: Digest32::of_bytes(b"credential-chain"),
                      signing_key_digest: Digest32::of_bytes(b"signing-key"),
                      scope_digest: Digest32::of_bytes(b"recovery-scope"),
                      authority_epoch: 7,
                      authenticated_at: 100,
                      expires_at: 200,
                  }
              }

              fn recovery_test_decision_payload() -> DecisionPayloadV1 {
                  let evidence = recovery_test_evidence();
                  let binding = recovery_test_binding(&evidence);
                  let candidate = StableId::new("candidate.one").expect("candidate id");
                  let candidates = vec![candidate.clone()];
                  DecisionPayloadV1 {
                      expected_ledger_predecessor: Digest32::of_bytes(b"ledger-predecessor")
                          .to_string(),
                      record_id: "run.recovery".to_string(),
                      episode_id: "episode.recovery".to_string(),
                      run_snapshot_digest: Digest32::of_bytes(b"run-snapshot").to_string(),
                      objective_digest: evidence.objective_digest.to_string(),
                      policy_digest: Digest32::of_bytes(b"policy").to_string(),
                      candidate_ids: vec![candidate.to_string()],
                      selected_candidate_id: candidate.to_string(),
                      selected_propensity_raw: ProbabilityQ32::ONE.raw(),
                      completeness: CompletenessPayloadV1 {
                          set_id: "candidate-set.recovery".to_string(),
                          state_digest: Digest32::of_bytes(b"candidate-state").to_string(),
                          generator_id: evidence.principal_id.to_string(),
                          generator_code_digest: Digest32::of_bytes(b"generator-code").to_string(),
                          grammar_digest: Digest32::of_bytes(b"candidate-grammar").to_string(),
                          hard_filter_digest: Digest32::of_bytes(b"hard-filter").to_string(),
                          truncation_digest: Digest32::of_bytes(b"truncation").to_string(),
                          candidates_digest:
                              codex_hepta_learning_ledger::candidate_ids_digest_v2(&candidates)
                                  .to_string(),
                          candidate_count: 1,
                          omitted_count_bound: 0,
                          canonical_order_digest:
                              codex_hepta_learning_ledger::candidate_order_digest_v2(&candidates)
                                  .to_string(),
                          complete_for_generator: true,
                      },
                      support_digest: Digest32::of_bytes(b"support").to_string(),
                      decision_digest: Digest32::of_bytes(b"decision").to_string(),
                      evidence: EvidencePayloadV1::from_typed(&evidence),
                      evidence_binding: binding,
                      now: 150,
                  }
              }

              #[test]
              fn persisted_evidence_binding_rejects_signed_identity_substitution() {
                  let evidence = recovery_test_evidence();
                  let binding = recovery_test_binding(&evidence);
                  binding.require_evidence(&evidence).expect("exact evidence");

                  let mut changed = evidence.clone();
                  changed.signature[0] ^= 1;
                  assert!(binding.require_evidence(&changed).is_err());

                  let mut changed = evidence.clone();
                  changed.principal_id =
                      StableId::new("principal.substituted").expect("principal id");
                  assert!(binding.require_evidence(&changed).is_err());

                  let mut changed = evidence.clone();
                  changed.scope_digest = Digest32::of_bytes(b"other-scope");
                  assert!(binding.require_evidence(&changed).is_err());

                  let mut changed = evidence;
                  changed.authority_epoch += 1;
                  assert!(binding.require_evidence(&changed).is_err());
              }

              #[test]
              fn persisted_principal_binding_rejects_key_and_credential_substitution() {
                  let evidence = recovery_test_evidence();
                  let binding = recovery_test_binding(&evidence);
                  let principal = recovery_test_principal();
                  binding
                      .require_principal(&principal)
                      .expect("exact principal");

                  let mut changed = principal.clone();
                  changed.credential_chain_digest = Digest32::of_bytes(b"other-chain");
                  assert!(binding.require_principal(&changed).is_err());

                  let mut changed = principal.clone();
                  changed.signing_key_digest = Digest32::of_bytes(b"other-key");
                  assert!(binding.require_principal(&changed).is_err());

                  let mut changed = principal.clone();
                  changed.scope_digest = Digest32::of_bytes(b"other-scope");
                  assert!(binding.require_principal(&changed).is_err());

                  let mut changed = principal;
                  changed.authority_epoch += 1;
                  assert!(binding.require_principal(&changed).is_err());
              }

              #[test]
              fn exact_destination_observation_binds_controller_identity() {
                  let payload = recovery_test_decision_payload();
                  let exact = expected_persisted_event(&LearningPayloadV1::Decision(payload.clone()))
                      .expect("exact persisted event");
                  let mut substituted = payload;
                  substituted.evidence_binding.controller_id =
                      "controller.substituted".to_string();
                  let substituted =
                      expected_persisted_event(&LearningPayloadV1::Decision(substituted))
                          .expect("substituted persisted event");
                  assert_ne!(exact, substituted);
              }
          '''
              end = text.rfind("\n}")
              if end < 0:
                  raise SystemExit("missing intelligence_learning test module close")
              text = text[:end] + insertion + text[end:]
              learning.write_text(text)

          status = Path("scripts/hepta-intelligence-control-status.py")
          text = status.read_text()
          if '"exactLearningEvidenceBindingPresent"' not in text:
              anchor = '''    "restartReconciliationPresent": (\n        "learning",\n        "reconcile_unsettled",\n    ),\n'''
              addition = anchor + '''    "exactLearningEvidenceBindingPresent": (\n        "learning",\n        "VerifiedEvidenceBindingPayloadV1",\n    ),\n    "exactDestinationEventObservationPresent": (\n        "learning",\n        "record.event == expected",\n    ),\n'''
              if text.count(anchor) != 1:
                  raise SystemExit("restart fact anchor drift")
              text = text.replace(anchor, addition, 1)
          if marker not in text:
              anchor = '    "evidence_payload_rejects_role_substitution",\n'
              addition = anchor + '''    "persisted_evidence_binding_rejects_signed_identity_substitution",\n    "persisted_principal_binding_rejects_key_and_credential_substitution",\n    "exact_destination_observation_binds_controller_identity",\n'''
              if text.count(anchor) != 1:
                  raise SystemExit("required-test anchor drift")
              text = text.replace(anchor, addition, 1)
          if '"exactAuthenticatedRecoveryPresent"' not in text:
              anchor = '''            "restartReconciliationPresent": facts[\n                "restartReconciliationPresent"\n            ],\n'''
              addition = anchor + '''            "exactAuthenticatedRecoveryPresent": facts[\n                "exactLearningEvidenceBindingPresent"\n            ]\n            and facts["exactDestinationEventObservationPresent"],\n'''
              if text.count(anchor) != 1:
                  raise SystemExit("status-matrix anchor drift")
              text = text.replace(anchor, addition, 1)
          requirement_anchor = '''                    "restartReconciliationPresent",\n                    "daemonLearningReconcilerPresent",\n                    "physicalTerminalBindingPresent",\n'''
          requirement_addition = '''                    "restartReconciliationPresent",\n                    "exactLearningEvidenceBindingPresent",\n                    "exactDestinationEventObservationPresent",\n                    "daemonLearningReconcilerPresent",\n                    "physicalTerminalBindingPresent",\n'''
          if "exactLearningEvidenceBindingPresent" not in text[text.find('"requirement": "durable_decision_outcome_closure"'):]:
              if text.count(requirement_anchor) != 1:
                  raise SystemExit("traceability source-fact anchor drift")
              text = text.replace(requirement_anchor, requirement_addition, 1)
          names_anchor = '''                    "evidence_payload",\n                    "decision_outcome",\n                    "learning_runtime_policy",\n'''
          names_addition = '''                    "evidence_payload",\n                    "persisted_evidence_binding",\n                    "persisted_principal_binding",\n                    "exact_destination_observation",\n                    "decision_outcome",\n                    "learning_runtime_policy",\n'''
          if "persisted_evidence_binding" not in text[text.find('"requirement": "durable_decision_outcome_closure"'):]:
              if text.count(names_anchor) != 1:
                  raise SystemExit("traceability test-name anchor drift")
              text = text.replace(names_anchor, names_addition, 1)
          status.write_text(text)

          additions = {
              "docs/modules/intelligence.control/RESTART_RECONCILIATION.md": (
                  "## Exact authenticated destination observation",
                  """## Exact authenticated destination observation\n\nVersion 2 learning outbox payloads freeze the already verified principal, controller, credential-chain digest, signing-key digest, scope, authority epoch and signature-derived authentication digest. Restart observation reconstructs the complete `AuthenticatedDecisionRecordV2` or `AuthenticatedOutcomeRecordV2` and acknowledges only exact event equality. A changed signature, principal, controller, credential chain, key, scope or epoch cannot be mistaken for an already applied event; replay also re-verifies current evidence and rejects binding drift.\n""",
              ),
              "docs/modules/intelligence.control/TECHNICAL.md": (
                  "### Exact authenticated learning recovery",
                  """### Exact authenticated learning recovery\n\nThe durable Decision/Outcome sidecar uses schema version 2 and records the complete verified evidence identity at enqueue time. Destination-first restart reconciliation compares the full persisted V2 ledger event, including controller and authentication digest, before acknowledging prior application. If no exact event exists, the original immutable payload may be replayed only after fresh final-use authority and renewed evidence verification; identity drift is terminally rejected rather than normalized into success.\n""",
              ),
              "docs/modules/intelligence.control/PRODUCT_CLOSURE.md": (
                  "## Exact learning identity closure",
                  """## Exact learning identity closure\n\nProduct Decision/Outcome recovery no longer recognizes semantic lookalikes. The outbox freezes verified principal/controller/credential/key/scope/epoch/authentication identity, reconstructs the exact V2 ledger event during destination observation, and re-verifies that same binding before replay. Dedicated default-profile tests cover signature, principal, credential-chain, key, scope, epoch and controller substitution.\n""",
              ),
          }
          for raw_path, (doc_marker, block) in additions.items():
              path = Path(raw_path)
              value = path.read_text()
              if doc_marker not in value:
                  path.write_text(value.rstrip() + "\n\n" + block)
          PY
          (cd codex-rs && cargo fmt --all)
          python3 scripts/hepta-intelligence-control-status.py --write-tracked
          git diff --check

      - name: Commit permanent candidate and remove this workflow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/intelligence-control-final-evidence.yml
          git add --all
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(intelligence): fence authenticated recovery identity"
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/intelligence-control-product-closure-20260926

  qualification:
    name: intelligence.control final (${{ matrix.lane }})
    needs: finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    env:
      SOURCE_SHA: ${{ needs.finalize.outputs.sha }}
    steps:
      - name: Check out exact committed candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current main base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git rev-parse refs/remotes/origin/main^{commit})"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Construct deterministic merge candidate
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.base.outputs.sha }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: 1022
          author-name: Hepta Intelligence CI
          author-email: hepta-intelligence-ci@users.noreply.github.com
          message: intelligence.control final synthetic merge

      - name: Bind exact candidate identity
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          MERGE_SHA: ${{ steps.synthetic.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.lane }}" = base-merge ]; then
            test -n "$MERGE_SHA"
            test "$TESTED_SHA" = "$MERGE_SHA"
          else
            test -z "$MERGE_SHA"
            test "$TESTED_SHA" = "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA" >> "$GITHUB_ENV"

      - name: Prepare native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Expose DotSlash for integration tests
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash

      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Verify generated stable truth
        run: |
          set -euo pipefail
          python3 scripts/hepta-intelligence-control-status.py --check-tracked
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Check formatting
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/fmt.json"
          -- cargo fmt --all -- --check

      - name: Test canonical intelligence package
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/intelligence-tests.json"
          -- cargo test --locked -p codex-hepta-intelligence --lib

      - name: Test Agentd default product profile
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-default-tests.json"
          -- cargo test --locked -p codex-hepta-agentd --lib

      - name: Test explicitly classified qualification-only learning surface
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-qualification-tests.json"
          -- cargo test --locked -p codex-hepta-agentd --lib
          --features qualification-legacy-learning-write

      - name: Compile all Agentd targets
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-all-targets.json"
          -- cargo check --locked -p codex-hepta-agentd --all-targets

      - name: Strict lint intelligence product packages
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/clippy.json"
          -- cargo clippy --locked -p codex-hepta-intelligence
          -p codex-hepta-agentd --all-targets -- -D warnings

      - name: Generate exact executed truth
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intelligence-exact-status/${{ matrix.lane }}"
          python3 scripts/hepta-intelligence-control-status.py \
            --source-head "$TESTED_SHA" \
            --execution-status passed \
            --lane "${{ matrix.lane }}" \
            --output-dir "$output"
          python3 - "$output" "$TESTED_SHA" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          for name in ("IMPLEMENTATION_MAP.json", "TEST_TRACEABILITY.json"):
              value = json.loads((root / name).read_text())
              assert value["sourceIdentity"]["commit"] == expected
              assert value["sourceIdentity"]["executionStatus"] == "passed"
          PY
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Retain exact qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-control-final-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/intelligence-command-records/*
            ${{ runner.temp }}/intelligence-exact-status/${{ matrix.lane }}/*
          if-no-files-found: error
          retention-days: 30
