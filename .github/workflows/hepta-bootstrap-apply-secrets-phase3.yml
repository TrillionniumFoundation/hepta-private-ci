name: Apply secrets.heptabao SQLite owner phase

on:
  push:
    branches:
      - codex/secrets-heptabao-convergence
    paths:
      - ".hepta-bootstrap/secrets-phase3/**"
      - ".github/workflows/hepta-bootstrap-apply-secrets-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-bootstrap-secrets-phase3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate phase-three patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.hepta-bootstrap/secrets-phase3/part-*)
          test "${#parts[@]}" -eq 4
          bundle="$RUNNER_TEMP/secrets-phase3.patch.gz.b64"
          patch="$RUNNER_TEMP/secrets-phase3.patch"
          cat "${parts[@]}" > "$bundle"
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          echo "bundle_sha256=$(sha256sum "$bundle" | awk '{print $1}')"
          echo "patch_sha256=$(sha256sum "$patch" | awk '{print $1}')"
          git apply --stat "$patch"
          git apply --numstat "$patch" | while IFS=$'\t' read -r _added _deleted path; do
            case "$path" in
              codex-rs/hepta-bao-adapter/*|codex-rs/hepta-authbus/*|codex-rs/state/sqlite/*|codex-rs/Cargo.toml|codex-rs/Cargo.lock|docs/modules/secrets.heptabao/*|docs/lane-a-foundation/secrets.heptabao/*|docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json|qualification/module-execution-dossiers/*|scripts/*|.github/workflows/lane-a-foundation.yml)
                ;;
              *)
                echo "phase-three patch touches unapproved path: $path" >&2
                exit 1
                ;;
            esac
          done
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo "Phase-three patch is already present."
          else
            echo "Phase-three patch neither applies nor is already present." >&2
            exit 1
          fi

      - name: Format and execute phase-three qualification
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py --write
          python3 scripts/generate_secrets_heptabao_module.py
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
          cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- --test-threads=2
          cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2

      - name: Commit qualified SQLite-owner phase
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hepta-bootstrap/secrets-phase3
          rm -f .github/workflows/hepta-bootstrap-apply-secrets-phase3.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta SQLite owner bot"
          git config user.email "hepta-sqlite-owner@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No phase-three changes remain."
            exit 0
          fi
          git commit -m "secrets: add SQLite production owner and migration contract"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
