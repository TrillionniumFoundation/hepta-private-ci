name: Hepta durable learning roundtrip (read-only)

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
    inputs:
      source_sha:
        description: Source commit; defaults to the pull request head or invoking commit.
        required: false
        type: string
      base_sha:
        description: Comparison commit; defaults to the pull request base or invoking commit.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source commit; leave empty to qualify this workflow's commit.
        required: false
        type: string
      base_sha:
        description: Comparison commit; leave empty to use this workflow's commit.
        required: false
        type: string

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # A main dispatch qualifies one source, without inventing a merge.
        lane: ${{ fromJSON((inputs.base_sha || github.event.pull_request.base.sha || github.sha) == (inputs.source_sha || github.event.pull_request.head.sha || github.sha) && '["source-head"]' || '["source-head","synthetic-merge"]') }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.sha }}
      CANDIDATE_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact Git candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          if [ "$CANDIDATE_LANE" = synthetic-merge ]; then
            test "$SOURCE_SHA" != "$BASE_SHA"
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only, no selection' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          printf 'source=%s\ntarget=%s\n' "$SOURCE_SHA" "$BASE_SHA"
          git rev-parse HEAD HEAD^{tree}
      - name: Install repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Locked compilation
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-shadow-qualification -p codex-hepta-learning-ledger -p codex-hepta-learning-artifacts --all-targets
      - name: Durable cross-crate roundtrip
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-shadow-qualification --test durable_learning_roundtrip
      - name: Ledger and artifact regressions
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-learning-ledger -p codex-hepta-learning-artifacts
      - name: Strict lint
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-shadow-qualification -p codex-hepta-learning-ledger -p codex-hepta-learning-artifacts --all-targets -- -D clippy::correctness -D clippy::await_holding_lock -D clippy::await_holding_invalid_type
      - name: Check formatting
        if: always()
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-shadow-qualification --package codex-hepta-learning-artifacts -- --check
      - name: Unmodified tracked source
        if: always()
        run: |
          git diff --check
          git diff --exit-code
