name: context.compiler bounded remediation

on:
  push:
    branches:
      - codex/context-compiler-full-closure-review-20260927
    paths:
      - .github/workflows/context-compiler-one-shot-remediation.yml

permissions:
  contents: write

concurrency:
  group: context-compiler-one-shot-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: codex/context-compiler-full-closure-review-20260927
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/context-compiler-full-closure-review-20260927
          fetch-depth: 0

      - name: Configure commit identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-context-remediation"
          git config user.email "hepta-context-remediation@users.noreply.github.com"

      - name: Apply bounded deterministic corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          branch = "codex/context-compiler-full-closure-review-20260927"

          provider = Path("codex-rs/hepta-context-compiler/src/provider_closure.rs")
          text = provider.read_text(encoding="utf-8")
          import_line = "    use proptest::prelude::*;\n"
          start_marker = "    proptest! {\n"
          end_marker = "\n\n    #[test]\n    fn generated_unicode_control_corpus_keeps_exact_escaped_identity()"
          replacement = r'''    #[test]
          fn generated_segment_maps_are_total_deterministic_and_single_context() {
              for prefix_len in [0_usize, 1, 2, 17, 255, 2047] {
                  for suffix_len in [0_usize, 1, 3, 31, 511, 2047] {
                      for seed in [0_u64, 1, 7, 0x55aa, u32::MAX as u64, u64::MAX] {
                          let payload = format!("CTX::{seed:016x}::END").into_bytes();
                          let mut request = vec![b'p'; prefix_len];
                          request.extend_from_slice(&payload);
                          request.extend(std::iter::repeat_n(b's', suffix_len));
                          let first = build_segment_map(
                              &request,
                              &payload,
                              digest("generated-payload"),
                          )
                          .expect("generated map");
                          let second = build_segment_map(
                              &request,
                              &payload,
                              digest("generated-payload"),
                          )
                          .expect("deterministic map");
                          assert_eq!(first, second);
                          assert_eq!(
                              first
                                  .iter()
                                  .filter(|segment| {
                                      segment.kind()
                                          == FinalRequestSegmentKindV2::CanonicalContextBundle
                                  })
                                  .count(),
                              1
                          );
                          assert_eq!(
                              first.last().expect("last segment").end_offset(),
                              request.len() as u64
                          );
                          assert_eq!(
                              compute_segment_map_digest(&first),
                              compute_segment_map_digest(&second)
                          );
                      }
                  }
              }
          }

          #[test]
          fn generated_gap_and_overlap_mutations_fail_closed() {
              for prefix_len in [2_usize, 3, 17, 255, 511] {
                  for suffix_len in [1_usize, 2, 19, 255, 511] {
                      for seed in [0_u32, 1, 7, 0x55aa, u16::MAX as u32, u32::MAX] {
                          let payload = format!("UNIQUE-CONTEXT-{seed:08x}").into_bytes();
                          let mut request = vec![b'a'; prefix_len];
                          request.extend_from_slice(&payload);
                          request.extend(std::iter::repeat_n(b'z', suffix_len));
                          let valid = build_segment_map(
                              &request,
                              &payload,
                              digest("mutation-payload"),
                          )
                          .expect("valid map");

                          let mut gap = valid.clone();
                          gap[0].end_offset -= 1;
                          assert_eq!(
                              validate_segment_coverage(&gap, request.len() as u64),
                              Err(ProviderClosureErrorV2::SegmentCoverageInvalid)
                          );

                          let mut overlap = valid;
                          overlap[1].start_offset -= 1;
                          assert_eq!(
                              validate_segment_coverage(&overlap, request.len() as u64),
                              Err(ProviderClosureErrorV2::SegmentCoverageInvalid)
                          );
                      }
                  }
              }
          }'''
          if import_line in text:
              text = text.replace(import_line, "", 1)
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit("generated property block markers drifted")
              text = text[:start] + replacement + text[end:]
          elif "fn generated_segment_maps_are_total_deterministic_and_single_context()" not in text:
              raise SystemExit("property corpus is neither source nor materialized form")
          provider.write_text(text, encoding="utf-8")

          exact = Path("codex-rs/hepta-agentd/src/exact_context_delivery.rs")
          text = exact.read_text(encoding="utf-8")
          old = "        let provider_terminal = provider_terminal(terminal.terminal)?;\n"
          new = "        let provider_terminal = provider_terminal(terminal.terminal.clone())?;\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("provider terminal ownership site drifted")
          exact.write_text(text, encoding="utf-8")

          manifest_path = Path("docs/modules/context.compiler/MODULE_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["integrationBranch"] = branch
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          qualification = Path(".github/workflows/context-compiler-qualification.yml")
          text = qualification.read_text(encoding="utf-8")
          for stale in (
              "codex/context-compiler-provider-closure-final-20260927",
              "context-compiler-v3-full-closure",
          ):
              text = text.replace(stale, branch)
          if branch not in text:
              raise SystemExit("qualification workflow is not bound to the integration branch")
          qualification.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate manifest-owned truth artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_context_compiler_module_docs.py
          python3 scripts/generate_context_compiler_module_docs.py --check

      - name: Refresh lock and format
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo metadata --format-version 1 > /dev/null
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Verify focused closure
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-context-compiler
          cargo test --locked -p codex-hepta-intelligence prompt_delivery --lib
          cargo test --locked -p codex-hepta-prompt-extension exact_body --lib
          cargo test --locked -p codex-hepta-agentd exact_context_delivery --lib
          cargo check --locked \
            -p codex-api \
            -p codex-core \
            -p codex-hepta-context-compiler \
            -p codex-hepta-intelligence \
            -p codex-hepta-prompt-extension \
            -p codex-hepta-agentd

      - name: Materialize verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm -f \
            .github/workflows/context-compiler-one-shot-remediation.yml \
            .github/workflows/context-compiler-property-fix.yml
          git add \
            .github/workflows/context-compiler-qualification.yml \
            codex-rs/Cargo.lock \
            codex-rs/hepta-context-compiler/src/provider_closure.rs \
            codex-rs/hepta-agentd/src/exact_context_delivery.rs \
            docs/modules/context.compiler/MODULE_MANIFEST.json \
            docs/modules/context.compiler/TECHNICAL.md \
            docs/modules/context.compiler/IMPLEMENTATION_MAP.json \
            qualification/module-execution-dossiers/detail/context.compiler.md
          git commit -m "fix(context.compiler): materialize bounded closure corrections"
          git push origin HEAD:${TARGET_BRANCH}