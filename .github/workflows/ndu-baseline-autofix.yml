name: NDU exact-head regression repair

on:
  push:
    branches:
      - codex/utility-ndu-production-hardening-20260926
    paths:
      - ".github/workflows/ndu-baseline-autofix.yml"

permissions:
  contents: write

concurrency:
  group: ndu-exact-head-regression-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/utility-ndu-production-hardening-20260926
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed protocol and host repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          # A zero journal head is the canonical genesis state. It must be bound
          # into the admission digest, not rejected as an absent identity.
          replace_exact(
              "codex-rs/hepta-agent-protocol/src/ndu.rs",
              "            require_digest(expected_head)?;\n            bytes.extend_from_slice(expected_head);\n",
              "            bytes.extend_from_slice(expected_head);\n",
              expected=2,
          )
          replace_exact(
              "codex-rs/hepta-agent-protocol/src/ndu.rs",
              "            *request = Box::new(NduControlRequestV1::Outcome {\n                identity: nonzero(9),\n            });\n",
              "            **request = NduControlRequestV1::Outcome {\n                identity: nonzero(9),\n            };\n",
          )

          # Preserve the JSON wire shape while reducing the in-memory enum
          # variant. Box<T> is serde-transparent here and the consumer borrows it.
          replace_exact(
              "codex-rs/hepta-agent-protocol/src/lib.rs",
              "    AutomationExecuteEffect {\n        intent: AuthorizedEffectIntent,\n        wire_payload_hex: String,\n        signed_grant: SignedFinalUseGrant,\n        command_id: String,\n    },\n",
              "    AutomationExecuteEffect {\n        intent: AuthorizedEffectIntent,\n        wire_payload_hex: String,\n        signed_grant: Box<SignedFinalUseGrant>,\n        command_id: String,\n    },\n",
          )
          replace_exact(
              "codex-rs/hepta-agent-protocol/src/lib.rs",
              "            method: AgentdMethod::AutomationExecuteEffect {\n                intent,\n                wire_payload_hex,\n                signed_grant,\n                command_id,\n            },\n",
              "            method: AgentdMethod::AutomationExecuteEffect {\n                intent,\n                wire_payload_hex,\n                signed_grant: Box::new(signed_grant),\n                command_id,\n            },\n",
          )
          replace_exact(
              "codex-rs/hepta-agent-protocol/src/lib.rs",
              "                plan: snapshot.plan.clone(),\n",
              "                plan: snapshot.plan,\n",
          )
          replace_exact(
              "codex-rs/hepta-agent-protocol/src/lib.rs",
              "        let cancel = AgentdRequest::run_cancel(\n            14,\n            3,\n            snapshot.run_id.clone(),\n            2,\n",
              "        let cancel = AgentdRequest::run_cancel(\n            14,\n            3,\n            snapshot.run_id,\n            2,\n",
          )

          # util-linux cannot reliably infer a synthetic tmpfs source from only
          # the target on hosted runners. Supply the exact source/type for a real
          # remount; no mock errno or skipped read-only observation is accepted.
          replace_exact(
              "scripts/hepta-ndu-mounted-filesystem.py",
              "                command(privilege + [\"mount\", \"-o\", \"remount,ro\", str(mount)])\n",
              "                command(privilege + [\"mount\", \"-t\", \"tmpfs\", \"-o\", \"remount,ro\", \"ndu-qualification\", str(mount)])\n",
          )
          replace_exact(
              "scripts/hepta-ndu-mounted-filesystem.py",
              "                command(privilege + [\"mount\", \"-o\", \"remount,rw\", str(mount)])\n",
              "                command(privilege + [\"mount\", \"-t\", \"tmpfs\", \"-o\", \"remount,rw\", \"ndu-qualification\", str(mount)])\n",
          )
          PY

      - name: Canonically format touched Rust packages
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-agent-protocol --package codex-hepta-agentd

      - name: Verify protocol tests and strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agent-protocol --lib
          cargo clippy --locked --all-targets --no-deps -p codex-hepta-agent-protocol -- -D warnings

      - name: Verify deadline and production-bootstrap regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd --lib external_deadline_is_rechecked_at_mutation_entry_without_effect
          cargo test --locked -p codex-hepta-agentd --lib production_bootstrap_uses_one_clock_and_external_authority_frontier_through_restart

      - name: Verify mounted-filesystem qualification contract tests
        run: python3 scripts/test_hepta_ndu_mounted_filesystem.py

      - name: Commit exact repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "hepta-qualification"
          git config user.email "qualification@invalid"
          git rm .github/workflows/ndu-baseline-autofix.yml
          git add \
            codex-rs/hepta-agent-protocol/src/lib.rs \
            codex-rs/hepta-agent-protocol/src/ndu.rs \
            scripts/hepta-ndu-mounted-filesystem.py
          git commit -m "fix(ndu): restore product lint and mounted-host qualification"
          git push origin HEAD:codex/utility-ndu-production-hardening-20260926
