name: Hepta objective source convergence preview

on:
  push:
    branches:
      - work/objective-compiler-production-convergence-20260927
    paths:
      - .github/objective-preview/hepta-objective-source-convergence-preview.py.gz
      - .github/workflows/hepta-objective-source-convergence-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: objective-source-convergence-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply source convergence in detached checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          gzip -dc \
            .github/objective-preview/hepta-objective-source-convergence-preview.py.gz \
            > "${RUNNER_TEMP}/objective-source-convergence-preview.py"
          python3 -m py_compile "${RUNNER_TEMP}/objective-source-convergence-preview.py"
          python3 "${RUNNER_TEMP}/objective-source-convergence-preview.py" \
            --root "${GITHUB_WORKSPACE}"
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Verify canonical contract after transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            scripts.test_hepta_objective_contract_consistency
          python3 scripts/hepta-objective-contract-consistency.py self-test
          python3 scripts/hepta-objective-contract-consistency.py verify

      - name: Compile and test objective product graph
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-objective -- --nocapture
          cargo test --locked -p codex-hepta-objective \
            --features qualification-legacy-compile -- --nocapture
          cargo test --locked --no-run \
            -p codex-hepta-objective \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-intelligence \
            -p codex-hepta-agentd
          cargo test --locked -p codex-hepta-learning-ledger run_start -- --nocapture
          cargo test --locked -p codex-hepta-intelligence objective_run -- --nocapture
          cargo test --locked -p codex-hepta-agentd objective_runtime -- --nocapture
          cargo check --locked -p codex-hepta-objective \
            --all-targets --features qualification-legacy-compile
          cargo clippy --locked \
            -p codex-hepta-objective \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-intelligence \
            -p codex-hepta-agentd \
            --all-targets --no-deps -- -D warnings

      - name: Retain exact reviewed patch and complete changed files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/objective-source-convergence"
          mkdir -p "${out}/files"
          git diff --binary > "${out}/source-convergence.patch"
          git diff --name-only > "${out}/CHANGED_FILES.txt"
          while IFS= read -r path; do
            test -n "${path}" || continue
            mkdir -p "${out}/files/$(dirname "${path}")"
            cp "${path}" "${out}/files/${path}"
          done < "${out}/CHANGED_FILES.txt"
          printf '%s\n' \
            "sourceCommit=$(git rev-parse HEAD)" \
            "sourceTree=$(git rev-parse HEAD^{tree})" \
            "patchSha256=$(sha256sum "${out}/source-convergence.patch" | cut -d' ' -f1)" \
            > "${out}/IDENTITY.txt"

      - name: Upload source convergence preview
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: objective-source-convergence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/objective-source-convergence
          if-no-files-found: error
          retention-days: 3
