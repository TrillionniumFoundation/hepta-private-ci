name: Materialize secrets.heptabao manifest projections

on:
  push:
    branches:
      - codex/secrets-heptabao-convergence
    paths:
      - "docs/modules/secrets.heptabao/MODULE_MANIFEST_V1.json"
      - "scripts/generate_secrets_heptabao_module.py"
      - ".github/workflows/secrets-heptabao-manifest-materialize.yml"

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-manifest-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Generate canonical projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py --write
          python3 scripts/generate_secrets_heptabao_module.py

      - name: Commit generated projections
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/modules/secrets.heptabao/IMPLEMENTATION_MAP.json \
            docs/modules/secrets.heptabao/CAPABILITY_MATRIX.json \
            docs/modules/secrets.heptabao/NONCLAIMS.json \
            docs/modules/secrets.heptabao/SOURCE_ANCHORS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Hepta manifest projection bot"
          git config user.email "hepta-manifest-projection@users.noreply.github.com"
          git commit -m "secrets: materialize manifest projections [skip ci]"
          git push origin "HEAD:${BRANCH}"
