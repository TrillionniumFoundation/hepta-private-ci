name: Memory cell V7 final fix and format

on:
  push:
    branches:
      - research/memory-cell-v7-owner-integration-20261027
    paths:
      - qualification/memory-cell-v7/FINALIZE_REQUEST.json

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: memory-v7-rust-1.95-finalize-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            memory-v7-rust-1.95-finalize-${{ hashFiles('codex-rs/Cargo.lock') }}-
            memory-v7-rust-1.95-daemon-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Verify tested source, fix and format without running tests
        run: python3 -B qualification/memory-cell-v7/ci_finalize.py
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: memory-v7-rust-1.95-finalize-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-v7-finalize-${{ github.sha }}
          path: memory-v7-finalize-output/
          if-no-files-found: error
          retention-days: 30
