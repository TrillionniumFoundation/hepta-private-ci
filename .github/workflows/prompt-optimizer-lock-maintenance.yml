name: Prompt optimizer one-shot lockfile repair

on:
  push:
    branches: [work/prompt-optimizer-convergence-20260928]
    paths: [.github/workflows/prompt-optimizer-lock-maintenance.yml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/work/prompt-optimizer-convergence-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Repair only the known manifest-lock mismatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object codex-rs/Cargo.lock)" = cd6650b68a815d69038166b7de50c2857f358641
          python3 - <<'PY'
          import pathlib
          import tomllib
          path = pathlib.Path('codex-rs/Cargo.lock')
          original = path.read_text()
          start = original.index('name = "codex-hepta-prompt-optimizer"\n')
          end = original.index('\n[[package]]', start)
          before = original[start:end]
          assert ' "serde",' not in before and ' "serde_json",' not in before
          after = before.replace(' "ed25519-dalek",\n', ' "ed25519-dalek",\n "serde",\n "serde_json",\n')
          assert after != before
          updated = original[:start] + after + original[end:]
          old = tomllib.loads(original)
          new = tomllib.loads(updated)
          expected = next(p for p in old['package'] if p['name'] == 'codex-hepta-prompt-optimizer')
          expected['dependencies'] = sorted(expected['dependencies'] + ['serde', 'serde_json'])
          assert old == new, 'any unrelated lockfile change is forbidden'
          manifest = tomllib.loads(pathlib.Path('codex-rs/hepta-prompt-optimizer/Cargo.toml').read_text())
          assert {'serde', 'serde_json'} <= set(manifest['dependencies'])
          path.write_text(updated)
          PY
          git diff --check
          test "$(git diff --numstat -- codex-rs/Cargo.lock)" = "$(printf '2\t0\tcodex-rs/Cargo.lock')"
          rm .github/workflows/prompt-optimizer-lock-maintenance.yml
          git add -- codex-rs/Cargo.lock .github/workflows/prompt-optimizer-lock-maintenance.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --signoff -m 'fix(prompt): lock serde dependencies without changing dependency versions'
          git push origin HEAD:refs/heads/work/prompt-optimizer-convergence-20260928
