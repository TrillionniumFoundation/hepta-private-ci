name: Hepta organ implementation (read-only)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-control-plane/**"
      - "codex-rs/hepta-runtime/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-wire/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - ".github/workflows/hepta-organ-implementation.yml"

permissions:
  contents: read

concurrency:
  group: hepta-organ-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  neuron:
    name: ${{ matrix.profile.name }} (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
        profile:
          - name: Neuron
            packages: codex-hepta-neuron
          - name: Hierarchy and live consumer
            packages: codex-hepta-control-plane codex-hepta-runtime
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PACKAGES: ${{ matrix.profile.packages }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind source and optional synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ '${{ matrix.lane }}' = synthetic-merge ]; then
            TREE=$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            MERGE=$(printf '%s\n' 'Qualification only; no selection or release' | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")
            test "$(git show -s --format=%P "$MERGE")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$MERGE"
          fi
          git rev-parse HEAD HEAD^{tree}
          printf 'Explicit test owners: %s\n' "$PACKAGES"

      - name: Export tracked source for local reproduction
        if: matrix.profile.name == 'Hierarchy and live consumer'
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/hepta-organ-source"
          mkdir -p "$snapshot"
          git archive --format=tar.gz HEAD > "$snapshot/source.tar.gz"
          git ls-tree -rz HEAD > "$snapshot/tree.nul"
          git cat-file commit HEAD > "$snapshot/commit.object"
          {
            printf 'source=%s\nbase=%s\n' "$SOURCE_SHA" "$BASE_SHA"
            git rev-parse HEAD 'HEAD^{tree}'
          } > "$snapshot/identity.txt"
          (cd "$snapshot" && sha256sum source.tar.gz tree.nul commit.object identity.txt > SHA256SUMS)

      - name: Retain exact tracked source
        if: matrix.profile.name == 'Hierarchy and live consumer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-organ-source-${{ matrix.lane }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/hepta-organ-source
          if-no-files-found: error
          retention-days: 3

      - name: Install pinned repository test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Locked all-target compilation
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          cargo check --locked "${args[@]}" --all-targets

      - name: Regression tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          just test --locked "${args[@]}"

      - name: Strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          cargo clippy --locked "${args[@]}" --all-targets -- -D warnings

      - name: Formatting check without source mutation
        if: always()
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(--package "$package"); done
          cargo fmt "${args[@]}" -- --check

      - name: Preserve exact source state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
