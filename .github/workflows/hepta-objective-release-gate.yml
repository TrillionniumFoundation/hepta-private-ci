name: Hepta objective release gate

on:
  pull_request:
    paths:
      - docs/modules/objective.compiler/CURRENT_STATE.json
      - docs/modules/objective.compiler/RELEASE_POLICY.json
      - qualification/objective.compiler/receipts/**
      - scripts/hepta-objective-release-gate.py
      - scripts/test_hepta_objective_release_gate.py
      - scripts/hepta-objective-release-surface.py
      - scripts/test_hepta_objective_release_surface.py
      - scripts/hepta-objective-protected-release-verify.py
      - ".github/workflows/*objective*.yml"
      - ".github/workflows/*objective*.yaml"
  push:
    branches: [main]
    paths:
      - docs/modules/objective.compiler/CURRENT_STATE.json
      - docs/modules/objective.compiler/RELEASE_POLICY.json
      - qualification/objective.compiler/receipts/**
      - scripts/hepta-objective-release-gate.py
      - scripts/test_hepta_objective_release_gate.py
      - scripts/hepta-objective-release-surface.py
      - scripts/test_hepta_objective_release_surface.py
      - scripts/hepta-objective-protected-release-verify.py
      - ".github/workflows/*objective*.yml"
      - ".github/workflows/*objective*.yaml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA bound by the external receipt artifact
        required: true
        type: string
      receipt_run_id:
        description: Same-repository workflow run retaining the receipt artifact
        required: true
        type: string
      receipt_artifact_name:
        description: Exact external receipt artifact name from that run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-objective-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-truth:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fail-closed source truth and read-only release surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-objective-release-gate.py \
            scripts/hepta-objective-release-surface.py \
            scripts/hepta-objective-protected-release-verify.py
          python3 -m unittest -v \
            scripts.test_hepta_objective_release_gate \
            scripts.test_hepta_objective_release_surface
          python3 scripts/hepta-objective-release-surface.py verify
          python3 scripts/hepta-objective-release-gate.py verify-source
          git diff --check
          test -z "$(git status --porcelain)"

  protected-release-readiness:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: objective-production-release
    timeout-minutes: 15
    steps:
      - name: Check out protected trusted verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Check out candidate as inert data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate external receipt run identity
        shell: bash
        env:
          RECEIPT_RUN_ID: ${{ inputs.receipt_run_id }}
        run: |
          set -euo pipefail
          [[ "$RECEIPT_RUN_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download external receipts as inert data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.receipt_artifact_name }}
          run-id: ${{ inputs.receipt_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/objective-release-receipts

      - name: Verify receipt chain with protected verifier only
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "${#CANDIDATE_SHA}" = 40
          python3 trusted/scripts/hepta-objective-protected-release-verify.py \
            --trusted-root trusted \
            --candidate-root candidate \
            --candidate-sha "${CANDIDATE_SHA}" \
            --receipts-root "${RUNNER_TEMP}/objective-release-receipts" \
            --output "${RUNNER_TEMP}/objective-release-readiness.json"
          test -z "$(git -C trusted status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"

      - name: Retain protected release-readiness receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: objective-release-readiness-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/objective-release-readiness.json
          if-no-files-found: error
          retention-days: 90
