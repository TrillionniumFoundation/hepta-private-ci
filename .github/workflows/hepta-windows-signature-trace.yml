name: Windows original signature metadata diagnostic only

on:
  push:
    branches:
      - codex/windows-native-followup-20261027
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  original-signature-metadata:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Verify missing or partial native facts fail collection
        shell: pwsh
        run: |
          python -m unittest discover -s .github/scripts -p test_windows_signature_trace.py
          exit $LASTEXITCODE
      - name: Collect only the two original signature metadata traces
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "hepta-signature-trace-target"
          python .github/scripts/windows_signature_trace.py --expected-head "${{ github.sha }}" --output "$env:RUNNER_TEMP/hepta-signature-native-trace"
          exit $LASTEXITCODE
      - name: Preserve failures and metadata without functional qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-signature-trace-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-signature-native-trace/
          if-no-files-found: error
          retention-days: 14
