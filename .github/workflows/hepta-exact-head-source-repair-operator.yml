name: Hepta exact-head source repair operator

on:
  push:
    branches:
      - ops/exact-head-repair-20260908-r1

permissions:
  contents: write

concurrency:
  group: hepta-exact-head-source-repair-operator
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 04f60466394a024c218ce66b1b32d1c42c462985
      SOURCE_SHA: d7ca90d721d37e1707a17e8f4c71c16d105d8c74
      EXPECTED_CANDIDATE_HEAD: 5758446f0d8a3d2f01fb38e3aceeaa42405e13ef
      CANDIDATE_BRANCH: codex/hepta-all-gap-closure-20260908
      RESULT_BRANCH: ops/exact-head-repair-result-20260908-r1
    steps:
      - name: Checkout immutable source subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d7ca90d721d37e1707a17e8f4c71c16d105d8c74
          fetch-depth: 2
          persist-credentials: true

      - name: Bind source, parent, and live candidate refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git fetch --no-tags origin \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})" = "${EXPECTED_CANDIDATE_HEAD}"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          test ! -e .github/workflows/hepta-exact-head-blocker-materializer.yml

      - name: Apply six field-complete local Clippy expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path("codex-rs/ext/hepta-memory/src/extension.rs"),
                  "pub fn install_with_turn_writer<C, F>(\n",
                  "#[expect(\n"
                  "    clippy::too_many_arguments,\n"
                  "    reason = \"the host installation seam keeps each independently validated writer and lifecycle authority input explicit\"\n"
                  ")]\n"
                  "pub fn install_with_turn_writer<C, F>(\n",
              ),
              (
                  Path("codex-rs/ext/hepta-memory/src/local_replay.rs"),
                  "fn replay_binding_digest(\n",
                  "#[expect(\n"
                  "    clippy::too_many_arguments,\n"
                  "    reason = \"the replay digest must bind every authority, generation, checkpoint, operation, witness, and source-runtime field independently\"\n"
                  ")]\n"
                  "fn replay_binding_digest(\n",
              ),
              (
                  Path("codex-rs/ext/hepta-memory/src/local_runtime.rs"),
                  "fn binding_digest(\n",
                  "#[expect(\n"
                  "    clippy::too_many_arguments,\n"
                  "    reason = \"the runtime digest deliberately commits each lease, epoch, generation, host-read, and disposition field separately\"\n"
                  ")]\n"
                  "fn binding_digest(\n",
              ),
              (
                  Path("codex-rs/ext/hepta-memory/src/local_witness.rs"),
                  "    pub fn with_policy(\n",
                  "    #[expect(\n"
                  "        clippy::too_many_arguments,\n"
                  "        reason = \"the witness constructor preserves explicit host-owned policy, store, revision, checkpoint, lease, and executor bindings\"\n"
                  "    )]\n"
                  "    pub fn with_policy(\n",
              ),
              (
                  Path("codex-rs/hepta-supervisor/src/signed_intent.rs"),
                  "    pub fn new(\n",
                  "    #[expect(\n"
                  "        clippy::too_many_arguments,\n"
                  "        reason = \"a signed supervisor intent must expose every release, revision, lifecycle, epoch, transition, and status field before hashing\"\n"
                  "    )]\n"
                  "    pub fn new(\n",
              ),
              (
                  Path("codex-rs/hepta-supervisor/src/supervisor.rs"),
                  "    pub fn apply_production_grant(\n",
                  "    #[expect(\n"
                  "        clippy::too_many_arguments,\n"
                  "        reason = \"production admission keeps the grant, signed envelope, verifier, epoch, wall clock, and monotonic clock explicit\"\n"
                  "    )]\n"
                  "    pub fn apply_production_grant(\n",
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one anchor in {path}")
              if new in text:
                  raise SystemExit(f"expectation already present in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          expected="$({
            printf '%s\n' \
              codex-rs/ext/hepta-memory/src/extension.rs \
              codex-rs/ext/hepta-memory/src/local_replay.rs \
              codex-rs/ext/hepta-memory/src/local_runtime.rs \
              codex-rs/ext/hepta-memory/src/local_witness.rs \
              codex-rs/hepta-supervisor/src/signed_intent.rs \
              codex-rs/hepta-supervisor/src/supervisor.rs
          } | sort)"
          actual="$(git diff --name-only | sort)"
          test "${actual}" = "${expected}"
          git diff --check

      - name: Validate formatting and the three affected Rust packages
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --no-deps \
            -p codex-hepta-memory-extension --lib -- -D warnings
          cargo clippy --locked --no-deps \
            -p codex-hepta-supervisor --lib -- -D warnings
          cargo clippy --locked --no-deps \
            -p codex-hepta-agentd --all-targets \
            --features qualification-cognitive-write -- -D warnings
          cargo test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            runtime::tests::qualification_ -- --nocapture --test-threads=1
          cargo test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            --test cognitive_product_e2e -- --nocapture --test-threads=1

      - name: Create an immutable-base single-parent result commit
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            codex-rs/ext/hepta-memory/src/extension.rs
            codex-rs/ext/hepta-memory/src/local_replay.rs
            codex-rs/ext/hepta-memory/src/local_runtime.rs
            codex-rs/ext/hepta-memory/src/local_witness.rs
            codex-rs/hepta-supervisor/src/signed_intent.rs
            codex-rs/hepta-supervisor/src/supervisor.rs
          )
          git add -- "${paths[@]}"
          tree_sha="$(git write-tree)"
          export GIT_AUTHOR_NAME='Hepta Source Repair Operator'
          export GIT_AUTHOR_EMAIL='actions@users.noreply.github.com'
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
          new_sha="$(printf '%s\n' \
            'fix(hepta): publish lint-clean single-parent blocker closure' \
            '' \
            'Materialize six local field-complete Clippy expectations without weakening repository-wide lint policy.' \
            | git commit-tree "${tree_sha}" -p "${BASE_SHA}")"

          test "$(git show -s --format=%P "${new_sha}")" = "${BASE_SHA}"
          test "$(git show -s --format=%T "${new_sha}")" = "${tree_sha}"
          if git cat-file -e "${new_sha}:.github/workflows/hepta-exact-head-blocker-materializer.yml" 2>/dev/null; then
            echo 'temporary materializer leaked into source tree' >&2
            exit 1
          fi
          git push origin "${new_sha}:refs/heads/${RESULT_BRANCH}"
          printf 'NEW_SOURCE_SHA=%s\n' "${new_sha}" | tee -a "${GITHUB_STEP_SUMMARY}"
