name: Hepta Lane D one-shot finalizer

on:
  push:
    branches:
      - codex/hepta-lane-d-final-gap-closure-20260910-r2
  pull_request:
    paths:
      - .github/workflows/hepta-lane-d-finalizer.yml
      - .hepta-tools/hepta-lane-d-finalize.py.gz
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-lane-d-finalizer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[lane-d-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply deterministic Lane D hardening
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .hepta-tools/hepta-lane-d-finalize.py.gz > scripts/hepta-lane-d-finalize.py
          chmod 755 scripts/hepta-lane-d-finalize.py
          python3 scripts/hepta-lane-d-finalize.py

      - name: Canonical Rust formatting
        working-directory: codex-rs
        shell: bash
        run: cargo fmt --all

      - name: Verify hardened source and documents
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-lane-d-semantic-conformance.py
          python3 scripts/hepta-lane-d-semantic-conformance.py self-test
          python3 scripts/hepta-lane-d-semantic-conformance.py verify
          git diff --check

      - name: Commit exact repair and self-remove
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -f scripts/hepta-lane-d-finalize.py
          rm -f .hepta-tools/hepta-lane-d-finalize.py.gz
          rm -f .github/workflows/hepta-lane-d-finalizer.yml
          git add -A
          git config user.name "Hepta Lane D Finalizer"
          git config user.email "noreply@openai.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(lane-d): close integrity, readiness and formatting blockers [lane-d-finalized]"
          git push origin "HEAD:${BRANCH}"
