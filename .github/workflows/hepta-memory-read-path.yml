name: MemoryCell reviewed evidence and frozen read sessions
on:
  pull_request:
    paths:
      - 'scripts/memory_cell/reviewed_bundle.py'
      - 'scripts/memory_cell/memory_curriculum.py'
      - 'scripts/memory_cell/frozen*.py'
      - 'scripts/memory_cell/test_reviewed_bundle.py'
      - 'scripts/memory_cell/test_memory_curriculum.py'
      - 'scripts/memory_cell/test_frozen*.py'
      - '.github/workflows/hepta-memory-read-path.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-read-path-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: scripts/memory_cell
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-external-span-e2e
          run-id: 37919555733
          github-token: ${{ github.token }}
          path: /tmp/reference-environment
      - name: Locked regressions; fixtures are separate from the actual model process
        run: |
          set -euo pipefail
          mkdir /tmp/read-path-result
          python3 -m venv /tmp/read-path-python
          /tmp/read-path-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/read-path-python/bin/pip install -r /tmp/reference-environment/environment.txt
          /tmp/read-path-python/bin/pip freeze > /tmp/read-path-result/environment.txt
          diff -u /tmp/reference-environment/environment.txt /tmp/read-path-result/environment.txt
          /tmp/read-path-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/read-path-result/tests.log
      - name: Stage only the already registered public reader
        run: |
          set -euo pipefail
          /tmp/read-path-python/bin/python scripts/memory_cell/bundle_assets.py stage 135M /tmp/session-reader
          cp /tmp/session-reader/inventory.json /tmp/read-path-result/inventory.json
      - name: Actual frozen reader, committed state, reopen and current withdrawal
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          set -euo pipefail
          INVENTORY_SHA=$(sha256sum /tmp/session-reader/inventory.json | cut -d ' ' -f1)
          /usr/bin/time -v -o /tmp/read-path-result/resources.txt /tmp/read-path-python/bin/python scripts/memory_cell/frozen_session_probe.py /tmp/session-reader/reader /tmp/session-reader/inventory.json /tmp/read-path-result/probe --inventory-sha "$INVENTORY_SHA" --source-commit "$(git rev-parse HEAD)" 2>&1 | tee /tmp/read-path-result/probe.log
      - name: Required repository formatting remains separate from model execution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          PATH="/tmp/read-path-python/bin:$PATH" just fmt --check --base "$BASE"
      - name: Retain exact source, raw results and failures
        if: always()
        run: |
          mkdir -p /tmp/read-path-result/source
          cp scripts/memory_cell/reviewed_bundle.py scripts/memory_cell/memory_curriculum.py scripts/memory_cell/frozen*.py /tmp/read-path-result/source/
          git rev-parse HEAD > /tmp/read-path-result/tested-commit.txt
          (cd /tmp/read-path-result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-reviewed-frozen-read-path
          path: /tmp/read-path-result
          if-no-files-found: error
