name: Hepta isolated native dependency diagnostic

on:
  push:
    branches: [codex/evolution-build-diagnostic-20260914]

permissions:
  contents: read

jobs:
  resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Bind exact committed source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/resolution" "$RUNNER_TEMP/tool-bundle/bin"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/resolution/source-identity.txt"
      - name: Fetch public dependencies without changing the lockfile
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fetch --locked --target x86_64-unknown-linux-gnu 2>&1 | tee "$RUNNER_TEMP/resolution/fetch.log"
          git diff --exit-code -- Cargo.lock
      - name: Retain only public compiler tools and dependency sources
        if: always()
        working-directory: codex-rs
        run: |
          set -eu
          sysroot=$(rustc --print sysroot)
          for tool in rustc cargo clippy-driver cargo-clippy; do
            test ! -f "$sysroot/bin/$tool" || cp "$sysroot/bin/$tool" "$RUNNER_TEMP/tool-bundle/bin/"
          done
          cp "$(command -v just)" "$RUNNER_TEMP/tool-bundle/bin/just"
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/tool-bundle/bin/cargo-nextest"
          rustc -vV > "$RUNNER_TEMP/resolution/compiler-identity.txt"
          tar -czf "$RUNNER_TEMP/resolution/compiler-bin.tar.gz" -C "$RUNNER_TEMP/tool-bundle" bin
          paths=""
          test ! -d "$HOME/.cargo/registry" || paths="$paths registry"
          test ! -d "$HOME/.cargo/git" || paths="$paths git"
          if test -n "$paths"; then
            tar -czf "$RUNNER_TEMP/resolution/public-dependencies.tar.gz" -C "$HOME/.cargo" $paths
          fi
          sha256sum "$RUNNER_TEMP/resolution/"*.gz > "$RUNNER_TEMP/resolution/SHA256SUMS"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-native-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}/resolution/
          if-no-files-found: error
          retention-days: 1
