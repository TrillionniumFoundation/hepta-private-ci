name: tmp-seven-lane-refresh-after-seals

on:
  push:
    branches:
      - ops/lane-f-final-source-export-20260910
    paths:
      - .github/workflows/tmp-seven-lane-refresh-after-seals.yml

permissions:
  contents: write

env:
  FOUNDATION_BRANCH: codex/hepta-all-gap-closure-20260908
  CANDIDATE_BRANCH: integration/hepta-seven-lane-gap-closure-20260910-r2

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Wait for current-head seals
        shell: bash
        run: sleep 600

      - name: Check out current convergence candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0

      - name: Merge settled heads, normalize and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          original="$(git rev-parse HEAD)"
          test "${original}" = "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          latest_matching() {
            local pattern="$1"
            git for-each-ref --sort=-committerdate --format='%(refname:strip=3)' refs/remotes/origin/codex |
              grep -Ei "${pattern}" | head -n 1 || true
          }

          declare -a branches=(
            "${FOUNDATION_BRANCH}"
            'codex/hepta-native-source-closed-world-20260909'
            'codex/lane-a-gap-closure-20260910'
            'codex/hepta-lane-b-gap-closure-20260910'
            'codex/lane-c-full-gap-closure-20260910'
            'codex/hepta-lane-e-gap-closure-20260910'
            'codex/lane-f-gap-closure-20260910'
          )
          for lane in d g; do
            branch="$(latest_matching "lane-${lane}.*20260910|20260910.*lane-${lane}")"
            [[ -n "${branch}" ]] && branches+=("${branch}")
          done

          declare -A seen=()
          for branch in "${branches[@]}"; do
            [[ -n "${seen[${branch}]:-}" ]] && continue
            seen["${branch}"]=1
            ref="refs/remotes/origin/${branch}"
            git rev-parse --verify "${ref}^{commit}"
            if git merge-base --is-ancestor "${ref}" HEAD; then
              continue
            fi
            if git merge --no-ff --no-edit "${ref}"; then
              continue
            fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            safe=1
            for file in "${conflicts[@]}"; do
              case "${file}" in
                docs/STATUS.md|qualification/module-execution-dossiers/NATIVE_BINDINGS.json|qualification/convergence/SEVEN_LANE_SOURCE_HEADS.json)
                  git checkout --ours -- "${file}"
                  git add "${file}"
                  ;;
                *)
                  echo "UNRESOLVED_SOURCE_CONFLICT ${branch} ${file}" >&2
                  safe=0
                  ;;
              esac
            done
            if [[ "${safe}" != 1 ]]; then
              git merge --abort || true
              exit 81
            fi
            git commit --no-edit
          done

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          bindings = root / "qualification/module-execution-dossiers/NATIVE_BINDINGS.json"
          data = json.loads(bindings.read_text(encoding="utf-8"))
          rows = data.get("observations")
          if not isinstance(rows, list) or len(rows) != 40:
              raise SystemExit("native source ledger is not exactly 40 modules")
          seen: set[str] = set()
          for row in rows:
              module = row.get("module")
              source_path = row.get("path")
              if not isinstance(module, str) or module in seen:
                  raise SystemExit(f"invalid native module {module!r}")
              seen.add(module)
              if not isinstance(source_path, str):
                  raise SystemExit(f"missing source path for {module}")
              source = root / source_path
              if not source.is_file():
                  raise SystemExit(f"missing source {source_path}")
              payload = source.read_bytes()
              row["blobSha"] = hashlib.sha1(
                  f"blob {len(payload)}\0".encode("ascii") + payload,
                  usedforsecurity=False,
              ).hexdigest()
          bindings.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          receipt = root / "qualification/convergence/SEVEN_LANE_SOURCE_HEADS.json"
          sources=[]
          branches=[
              ("foundation", "codex/hepta-all-gap-closure-20260908"),
              ("native-source", "codex/hepta-native-source-closed-world-20260909"),
              ("lane-a", "codex/lane-a-gap-closure-20260910"),
              ("lane-b", "codex/hepta-lane-b-gap-closure-20260910"),
              ("lane-c", "codex/lane-c-full-gap-closure-20260910"),
              ("lane-e", "codex/hepta-lane-e-gap-closure-20260910"),
              ("lane-f", "codex/lane-f-gap-closure-20260910"),
          ]
          for role, branch in branches:
              try:
                  sha=subprocess.check_output(["git","rev-parse",f"refs/remotes/origin/{branch}"], text=True).strip()
              except subprocess.CalledProcessError:
                  continue
              sources.append({"role":role,"branch":branch,"sha":sha})
          receipt.parent.mkdir(parents=True, exist_ok=True)
          receipt.write_text(json.dumps({"schema":"hepta.seven-lane-source-heads.v1","sources":sources}, indent=2)+"\n", encoding="utf-8")
          PY

          find .github/workflows -maxdepth 1 -type f \( -name 'tmp-*.yml' -o -name 'tmp-*.yaml' \) -delete
          python3 scripts/hepta-readiness.py generate-status || true
          python3 scripts/hepta-implementation-dossiers.py generate-status || true
          python3 scripts/hepta-algorithm-docs.py generate-status || true
          python3 scripts/hepta-cns.py generate-status || true
          python3 scripts/hepta-docs.py generate-status || true
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'chore(convergence): refresh sealed source heads'
          fi
          test -z "$(git status --porcelain)"

          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          if [[ -f scripts/hepta-lane-b-truth.py ]]; then
            python3 scripts/hepta-lane-b-truth.py verify
            python3 scripts/hepta-lane-b-docs.py verify
          fi
          git diff --check
          test -z "$(git status --porcelain)"

          git fetch origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})" = "${original}"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
