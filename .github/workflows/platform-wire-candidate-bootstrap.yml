name: Platform wire candidate bootstrap

on:
  push:
    branches:
      - fix/platform-wire-protocol-completion-20260917
    paths:
      - "codex-rs/hepta-wire/**"
      - "codex-rs/hepta-codex-adapter/**"
      - "codex-rs/hepta-shadow-qualification/tests/cross_language_wire_fault.rs"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/platform-wire-candidate-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: platform-wire-candidate-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/platform-wire-protocol-completion-20260917
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Hepta Wire Candidate Bot"
          git config user.email "hepta-wire-candidate@users.noreply.github.com"
      - name: Resolve minimal lockfile delta and format candidate sources
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo check -p codex-hepta-wire -p codex-hepta-codex-adapter
          cargo fmt --package codex-hepta-wire --package codex-hepta-codex-adapter
      - name: Run focused protocol and product-source tests
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-wire
          cargo test --locked -p codex-hepta-codex-adapter
          cargo test --locked -p codex-hepta-shadow-qualification --test cross_language_wire_fault
      - name: Run focused clippy
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-wire -p codex-hepta-codex-adapter --all-targets -- -D warnings
      - name: Commit generated lockfile and formatting only when needed
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- codex-rs/Cargo.lock codex-rs/hepta-wire codex-rs/hepta-codex-adapter; then
            git add codex-rs/Cargo.lock codex-rs/hepta-wire codex-rs/hepta-codex-adapter
            git commit -m "chore(platform.wire): refresh lockfile and formatting"
            git push origin HEAD:fix/platform-wire-protocol-completion-20260917
          fi
