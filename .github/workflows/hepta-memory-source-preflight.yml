name: MemoryCell source-write coverage before model training
on:
  push:
    branches:
      - "codex/memory-cell-evidence-20261008"
    paths:
      - "scripts/memory_cell/source_write_schedule.py"
      - "scripts/memory_cell/test_source_write_schedule.py"
      - "scripts/memory_cell/test_source_schedule_interleave.py"
      - "scripts/memory_cell/source_write_coverage.py"
      - "scripts/memory_cell/experience_memory.py"
      - ".github/workflows/hepta-memory-source-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repository-format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Require unchanged repository-wide format gate
        env:
          BASE: 78fdb0cf8537e3a84fc6e0a849707559c80881e8
        run: |
          set -euo pipefail
          mkdir -p /tmp/write-preflight-format
          python3 -m pip install uv==0.8.22
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --check --base "$BASE" 2>&1 | tee /tmp/write-preflight-format/format.log
      - name: Preserve exact Python format diff when the required gate fails
        if: failure()
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format --diff \
            scripts/memory_cell/source_write_coverage.py \
            scripts/memory_cell/test_source_write_coverage.py \
            scripts/memory_cell/test_pretrained.py \
            scripts/memory_cell/stem_two_window_reader_trial.py \
            > /tmp/write-preflight-format/exact-ruff.diff 2>&1 || true
          cat /tmp/write-preflight-format/exact-ruff.diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-write-preflight-format
          path: /tmp/write-preflight-format
          if-no-files-found: warn
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Read only the existing frozen source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/write-preflight
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11669174727/zip > /tmp/write-source.zip
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          raw = Path('/tmp/write-source.zip').read_bytes()
          assert len(raw) < 64 * 1024 * 1024
          assert hashlib.sha256(raw).hexdigest() == '23e9d44b8d2dbe756c7c33031e18853c83326458a37925d4d368881145bf142b'
          with zipfile.ZipFile('/tmp/write-source.zip') as z:
              for name, destination, limit in (
                  ('environment.txt', '/tmp/write-preflight/environment.txt', 65536),
                  ('observations/sources.json', '/tmp/write-preflight/sources.json', 4 * 1024 * 1024),
              ):
                  assert z.namelist().count(name) == 1 and z.getinfo(name).file_size <= limit
                  Path(destination).write_bytes(z.read(name))
          PY
          python3 -m venv /tmp/preflight-python
          /tmp/preflight-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/preflight-python/bin/pip install -r /tmp/write-preflight/environment.txt
          /tmp/preflight-python/bin/pip freeze > /tmp/write-preflight/actual-environment.txt
          diff -u /tmp/write-preflight/environment.txt /tmp/write-preflight/actual-environment.txt
      - name: Full inherited regression suite, independent of the formatting job
        run: |
          set -euo pipefail
          /tmp/preflight-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/write-preflight/tests.log
      - name: Measure actual pinned-tokenizer exposure without loading a model
        run: |
          set -euo pipefail
          /tmp/preflight-python/bin/python scripts/memory_cell/source_write_schedule.py /tmp/write-preflight/sources.json /tmp/write-preflight/result --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 2>&1 | tee /tmp/write-preflight/preflight.log
      - name: Pre-register and compare both source-only two-hop schedules
        run: |
          set -euo pipefail
          /tmp/preflight-python/bin/python scripts/memory_cell/source_write_schedule.py /tmp/write-preflight/sources.json /tmp/write-preflight/twohop-original --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --curriculum source_two_hop 2>&1 | tee /tmp/write-preflight/twohop-original.log
          /tmp/preflight-python/bin/python scripts/memory_cell/source_write_schedule.py /tmp/write-preflight/sources.json /tmp/write-preflight/twohop-interleave --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --curriculum source_two_hop --strategy direct_interleave 2>&1 | tee /tmp/write-preflight/twohop-interleave.log
          /tmp/preflight-python/bin/python - <<'PY'
          import json
          from pathlib import Path
          from native import digest
          root = Path('/tmp/write-preflight')
          old = json.loads((root / 'twohop-original/preflight.json').read_text())
          new = json.loads((root / 'twohop-interleave/preflight.json').read_text())
          for key in ('source_sha256', 'source_documents_digest', 'source_supervision_digest', 'source_example_ids', 'tokenizer_revision', 'tokenizer_files_digest', 'curriculum'):
              assert old[key] == new[key], key
          a, b = old['schedule'], new['schedule']
          assert (a['maximum_steps'], a['token_ceiling']) == (b['maximum_steps'], b['token_ceiling']) == (128, 65536)
          assert a['planned_input_tokens'] <= 65536 and b['planned_input_tokens'] <= 65536
          assert b['strategy'] == 'direct_interleave' and b['source_only_order_intervention'] is True
          assert b['original_groups_digest'] == a['groups_digest']
          report = dict(schema='hepta.source-only.schedule-interleave-preflight.v1',
              generating_commit=(root / 'tested-commit.txt').read_text().strip() if (root / 'tested-commit.txt').exists() else None,
              original_schedule_sha256=digest(a), interleaved_schedule_sha256=digest(b),
              original_coverage=old['curriculum_coverage']['by_kind'],
              interleaved_coverage=new['curriculum_coverage']['by_kind'],
              original_input_tokens=a['planned_input_tokens'],
              interleaved_input_tokens=b['planned_input_tokens'],
              identical_source_examples=True, task_quality_measured=False,
              new_model_calls=0, independent_review=False, production_accepted=False)
          (root / 'strategy-comparison.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({k:v for k,v in report.items() if k not in ('original_coverage','interleaved_coverage')}))
          PY
      - name: Preserve source and diagnostics, not tokenizer or model bytes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/write-preflight/source
          cp scripts/memory_cell/source_write_schedule.py scripts/memory_cell/source_write_coverage.py scripts/memory_cell/test_source_write_schedule.py scripts/memory_cell/test_source_schedule_interleave.py scripts/memory_cell/experience_memory.py /tmp/write-preflight/source/
          git rev-parse HEAD > /tmp/write-preflight/tested-commit.txt
          rm -rf /tmp/write-preflight/result/tokenizer /tmp/write-preflight/twohop-original/tokenizer /tmp/write-preflight/twohop-interleave/tokenizer
          (cd /tmp/write-preflight && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-source-write-preflight
          path: /tmp/write-preflight
          if-no-files-found: error
