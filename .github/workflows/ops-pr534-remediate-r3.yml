---
name: ops-pr534-remediate-r3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out remediation carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore immutable candidate
        env:
          SOURCE_COMMIT: b5d9e1e0136de0a40e32546e3236a2ca88768e21
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - uses: ./.github/actions/setup-ci

      - name: Install formatter prerequisites
        run: |
          set -euo pipefail
          corepack enable
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded blocker repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          allowlist = Path('.github/blob-size-allowlist.txt')
          text = allowlist.read_text(encoding='utf-8')
          comment = '# Immutable, content-addressed qualification receipts retained for audit.\n'
          paths = [
              'qualification/global-gap-closure-final-r6/STATUS.json',
              'qualification/global-gap-closure-final-r8/receipts/PREPARE.json',
          ]
          if comment not in text:
              text = text.rstrip() + '\n\n' + comment
          for path in paths:
              if path not in text.splitlines():
                  text += path + '\n'
          allowlist.write_text(text, encoding='utf-8')

          codespell = Path('.github/workflows/codespell.yml')
          text = codespell.read_text(encoding='utf-8')
          old = '        with:\n          ignore_words_file: .codespellignore\n'
          new = (
              '        with:\n'
              '          # Load the repository policy; an empty action-level skip prevents\n'
              '          # the action default from overriding .codespellrc.\n'
              '          config: .codespellrc\n'
              '          ignore_words_file: .codespellignore\n'
              '          skip: ""\n'
          )
          if old not in text:
              raise SystemExit('unexpected codespell workflow shape')
          codespell.write_text(text.replace(old, new, 1), encoding='utf-8')

          lane = Path('scripts/hepta-lane-b-truth.py')
          text = lane.read_text(encoding='utf-8')
          anchor = 'globals().update({name: getattr(CORE, name) for name in dir(CORE) if not name.startswith("__")})\n\n\n'
          insertion = '''globals().update({name: getattr(CORE, name) for name in dir(CORE) if not name.startswith("__")})

# Functions imported from the core retain the core module's globals. Keep the
# public compatibility hook used by unit fixtures synchronized without changing
# the production root or weakening any path/symbol validation.
_CORE_VERIFY_MAPPING = CORE.verify_mapping


def verify_mapping(
    label: str,
    mapping: dict[str, Any],
    implementation_roots: list[str],
) -> None:
    previous_root = CORE.ROOT
    CORE.ROOT = ROOT
    try:
        _CORE_VERIFY_MAPPING(label, mapping, implementation_roots)
    finally:
        CORE.ROOT = previous_root


'''
          if anchor not in text:
              raise SystemExit('unexpected Lane B wrapper shape')
          lane.write_text(text.replace(anchor, insertion, 1), encoding='utf-8')
          PY

      - name: Apply canonical repository formatting
        run: |
          set -euo pipefail
          just fmt
          pnpm run format:fix

      - name: Materialize one-parent candidate
        id: candidate
        env:
          BASE_COMMIT: 04f60466394a024c218ce66b1b32d1c42c462985
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          TREE="$(git write-tree)"
          export GIT_AUTHOR_NAME='hepta-convergence-bot'
          export GIT_AUTHOR_EMAIL='hepta-convergence-bot@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          CANDIDATE="$(printf '%s\n' 'fix(convergence): close exact-tree CI blockers' | git commit-tree "$TREE" -p "$BASE_COMMIT")"
          git checkout --detach "$CANDIDATE"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Verify repaired exact tree
        env:
          BASE_COMMIT: 04f60466394a024c218ce66b1b32d1c42c462985
          SOURCE_COMMIT: ${{ steps.candidate.outputs.sha }}
          HEPTA_LANE_B_INTEGRATION_BASE_SHA: 04f60466394a024c218ce66b1b32d1c42c462985
          HEPTA_LANE_B_INTEGRATION_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          just fmt-check
          pnpm run format
          python3 scripts/check_blob_size.py \
            --base "$BASE_COMMIT" \
            --head "$SOURCE_COMMIT" \
            --max-bytes 512000 \
            --allowlist .github/blob-size-allowlist.txt
          python3 scripts/hepta-lane-b-truth.py self-test
          python3 -m unittest scripts/test_hepta_lane_b_truth.py
          python3 scripts/hepta-lane-b-truth.py verify
          python3 scripts/hepta-lane-b-docs.py verify
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish one-parent candidate
        env:
          BRANCH: ops/pr534-remediate-r3-20260911
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git push --force origin "$CANDIDATE:refs/heads/$BRANCH"
