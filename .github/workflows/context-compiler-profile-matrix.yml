name: context-compiler-profile-matrix

on:
  pull_request:
    paths:
      - .github/workflows/context-compiler-profile-matrix.yml
      - codex-rs/codex-api/**
      - codex-rs/core/**
      - codex-rs/app-server/**
      - codex-rs/ext/hepta-prompt/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-context-compiler/**
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-prompt-registry/**
      - codex-rs/Cargo.*
      - codex-rs/rust-toolchain.toml
      - qualification/context-compiler/FAILPOINT_MATRIX.json
      - scripts/context_compiler_candidate.py
      - scripts/context_compiler_external_acceptance.py
      - scripts/test_context_compiler_external_acceptance.py
      - scripts/test_context_compiler_single_owner.py
  push:
    branches:
      - main
      - codex/context-compiler-v3-closure-20260928
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional full base commit OID; otherwise resolve main once
        required: false
        type: string
  schedule:
    - cron: '41 18 * * *'

permissions:
  contents: read

concurrency:
  group: context-compiler-profile-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-slim
    outputs:
      source: ${{ steps.identity.outputs.source }}
      base: ${{ steps.identity.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        shell: bash
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base_sha }}
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          BASE="${PR_BASE:-${INPUT_BASE:-}}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse refs/remotes/origin/main)"
            if [ "$BASE" = "$SOURCE" ]; then
              BASE="$(git rev-parse "$SOURCE^1")"
            fi
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$SOURCE")" = commit
          test "$(git cat-file -t "$BASE")" = commit
          test "$SOURCE" != "$BASE"
          printf 'source=%s\nbase=%s\n' "$SOURCE" "$BASE" >> "$GITHUB_OUTPUT"
      - name: Source topology and external-acceptance regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/test_context_compiler_single_owner.py
          python3 -B scripts/test_context_compiler_external_acceptance.py

  profile:
    needs: identity
    name: context.compiler ${{ matrix.lane }} / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
        profile:
          - default-v3
          - no-default-features
          - legacy-compatibility
          - all-features
          - downstream-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: '3'
      SOURCE_SHA: ${{ needs.identity.outputs.source }}
      BASE_SHA: ${{ needs.identity.outputs.base }}
      LANE: ${{ matrix.lane }}
      PROFILE: ${{ matrix.profile }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.identity.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/context-profile"
          python3 -B scripts/context_compiler_candidate.py \
            --source "$SOURCE_SHA" \
            --base "$BASE_SHA" \
            --lane "$LANE" \
            --record "$RUNNER_TEMP/context-profile/candidate.json"
      - name: Prepare isolated build roots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/context-profile-build"
          mkdir -p "$root/cargo" "$root/target"
          {
            echo "CARGO_HOME=$root/cargo"
            echo "CARGO_TARGET_DIR=$root/target"
          } >> "$GITHUB_ENV"
      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcap-dev pkg-config ca-certificates git
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt
      - name: Execute exact feature and consumer profile
        id: execute
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/context-profile"
          log="$evidence/profile.log"
          case "$PROFILE" in
            default-v3)
              command=(cargo check --locked \
                -p codex-hepta-prompt-registry \
                -p codex-hepta-context-compiler \
                -p codex-hepta-intelligence \
                -p codex-hepta-prompt-extension \
                -p codex-hepta-agentd)
              ;;
            no-default-features)
              command=(cargo check --locked --no-default-features \
                -p codex-hepta-intelligence \
                -p codex-hepta-agentd)
              ;;
            legacy-compatibility)
              command=(cargo check --locked --no-default-features \
                -p codex-hepta-intelligence \
                -p codex-hepta-agentd \
                --features codex-hepta-intelligence/legacy-prompt-context-v1,codex-hepta-agentd/legacy-prompt-context-v1)
              ;;
            all-features)
              command=(cargo check --locked --all-features \
                -p codex-hepta-prompt-registry \
                -p codex-hepta-context-compiler \
                -p codex-hepta-intelligence \
                -p codex-hepta-prompt-extension \
                -p codex-hepta-agentd)
              ;;
            downstream-consumer)
              command=(cargo check --locked \
                -p codex-api \
                -p codex-core \
                -p codex-app-server \
                -p codex-hepta-prompt-extension \
                -p codex-hepta-agentd)
              ;;
            *)
              echo "unknown profile: $PROFILE" >&2
              exit 2
              ;;
          esac
          printf '%q ' "${command[@]}" > "$evidence/command.txt"
          printf '\n' >> "$evidence/command.txt"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          "${command[@]}" > "$log" 2>&1
          command_exit=$?
          python3 -B ../scripts/context_compiler_candidate.py \
            --root .. \
            --record "$evidence/candidate.json" \
            --verify > "$evidence/candidate-verify.log" 2>&1
          candidate_verify_exit=$?
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat "$log"
          cat "$evidence/candidate-verify.log"
          if [ "$command_exit" -ne 0 ]; then
            exit_code="$command_exit"
          else
            exit_code="$candidate_verify_exit"
          fi
          printf '%s\n' "$exit_code" > "$evidence/exit-code.txt"
          STARTED_AT="$started_at" FINISHED_AT="$finished_at" \
          COMMAND_EXIT="$command_exit" CANDIDATE_VERIFY_EXIT="$candidate_verify_exit" \
          EXIT_CODE="$exit_code" python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess

          evidence = Path(os.environ["RUNNER_TEMP"]) / "context-profile"
          candidate = json.loads((evidence / "candidate.json").read_text())
          command = (evidence / "command.txt").read_text().strip()
          log = (evidence / "profile.log").read_bytes()
          candidate_verify_log = (evidence / "candidate-verify.log").read_bytes()
          command_exit_code = int(os.environ["COMMAND_EXIT"])
          candidate_verify_exit_code = int(os.environ["CANDIDATE_VERIFY_EXIT"])
          exit_code = int(os.environ["EXIT_CODE"])

          def version(argv):
              completed = subprocess.run(argv, text=True, capture_output=True, check=False)
              return {
                  "command": " ".join(argv),
                  "exitCode": completed.returncode,
                  "output": (completed.stdout + completed.stderr).strip()[:4096],
              }

          payload = []
          for relative in (
              "candidate.json",
              "profile.log",
              "candidate-verify.log",
              "command.txt",
              "exit-code.txt",
          ):
              data = (evidence / relative).read_bytes()
              payload.append(
                  {
                      "path": relative,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )
          payload_digest = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          receipt = {
              "schema": "hepta.context-compiler-profile-execution.v1",
              "status": "passed" if exit_code == 0 else "failed",
              "profile": os.environ["PROFILE"],
              "lane": os.environ["LANE"],
              "sourceCommit": candidate["sourceHeadSha"],
              "sourceTree": subprocess.check_output(
                  ["git", "rev-parse", f"{candidate['sourceHeadSha']}^{{tree}}"], text=True
              ).strip(),
              "baseCommit": candidate["baseSha"],
              "testedCommit": candidate["testedHeadSha"],
              "testedTree": candidate["testedTreeSha"],
              "orderedParents": candidate["parents"],
              "workflowRef": os.environ["WORKFLOW_REF"],
              "workflowSha": os.environ["WORKFLOW_SHA"],
              "runId": os.environ["RUN_ID"],
              "runAttempt": os.environ["RUN_ATTEMPT"],
              "runner": {
                  "name": os.environ.get("RUNNER_NAME"),
                  "os": os.environ.get("RUNNER_OS"),
                  "arch": os.environ.get("RUNNER_ARCH"),
                  "environment": os.environ.get("RUNNER_ENVIRONMENT"),
                  "platform": platform.platform(),
              },
              "command": command,
              "commandExitCode": command_exit_code,
              "candidateVerificationExitCode": candidate_verify_exit_code,
              "exitCode": exit_code,
              "startedAt": os.environ["STARTED_AT"],
              "finishedAt": os.environ["FINISHED_AT"],
              "logSha256": hashlib.sha256(log).hexdigest(),
              "logBytes": len(log),
              "candidateVerificationLogSha256": hashlib.sha256(candidate_verify_log).hexdigest(),
              "candidateVerificationLogBytes": len(candidate_verify_log),
              "toolchain": {
                  "rustc": version(["rustc", "-Vv"]),
                  "cargo": version(["cargo", "--version"]),
                  "git": version(["git", "--version"]),
                  "python": version(["python3", "--version"]),
              },
              "evidencePayload": payload,
              "payloadCanonicalSha256": payload_digest,
              "independentAcceptance": False,
              "activation": False,
              "release": False,
          }
          unsigned = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receiptSha256"] = hashlib.sha256(unsigned).hexdigest()
          (evidence / "profile-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n"
          )
          PY
          exit "$exit_code"
      - name: Bind complete artifact manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/context-profile"
          manifest="$evidence/artifact-files.sha256"
          temporary="$evidence/artifact-files.sha256.tmp"
          find "$evidence" -type f \
            ! -name 'artifact-files.sha256' \
            ! -name 'artifact-files.sha256.tmp' \
            -print0 | sort -z | xargs -0 sha256sum > "$temporary"
          mv "$temporary" "$manifest"
      - name: Retain immutable profile evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: context-profile-${{ needs.identity.outputs.source }}-${{ matrix.lane }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-profile
          if-no-files-found: error
          retention-days: 90

  required:
    name: Context compiler profile matrix required
    if: always()
    needs: [identity, profile]
    runs-on: ubuntu-slim
    steps:
      - name: Require every immutable profile lane
        env:
          IDENTITY_RESULT: ${{ needs.identity.result }}
          PROFILE_RESULT: ${{ needs.profile.result }}
        run: |
          set -euo pipefail
          test "$IDENTITY_RESULT" = success
          test "$PROFILE_RESULT" = success
