name: Runtime supervisor remediation diagnostics

on:
  push:
    branches:
      - fix/runtime-supervisor-stage-bcd-20260927
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux process prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$channel" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/runtime-supervisor-diagnostics-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Generate exact rustfmt patch
        id: format
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-supervisor-diagnostics"
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-supervisor
          git diff --binary -- codex-rs/hepta-supervisor > "$RUNNER_TEMP/runtime-supervisor-diagnostics/rustfmt.patch"
          git diff --check > "$RUNNER_TEMP/runtime-supervisor-diagnostics/rustfmt-diff-check.log" 2>&1
          git diff --stat > "$RUNNER_TEMP/runtime-supervisor-diagnostics/rustfmt.stat"
          git reset --hard HEAD
      - name: Compile and test supervisor library
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-supervisor --lib --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/runtime-supervisor-diagnostics/test.log"
      - name: Check all supervisor targets
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-supervisor --all-targets --features production-authority 2>&1 | tee "$RUNNER_TEMP/runtime-supervisor-diagnostics/check.log"
      - name: Run strict supervisor clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-supervisor --no-deps --all-targets --features production-authority -- -D warnings 2>&1 | tee "$RUNNER_TEMP/runtime-supervisor-diagnostics/clippy.log"
      - name: Record exact outcomes
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          TEST: ${{ steps.test.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-supervisor-diagnostics"
          printf 'sha=%s\nformat=%s\ntest=%s\ncheck=%s\nclippy=%s\n' \
            "$GITHUB_SHA" "$FORMAT" "$TEST" "$CHECK" "$CLIPPY" \
            > "$RUNNER_TEMP/runtime-supervisor-diagnostics/outcomes.txt"
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-supervisor-remediation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-supervisor-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failure semantics
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          TEST: ${{ steps.test.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          set -euo pipefail
          test "$FORMAT" = success
          test "$TEST" = success
          test "$CHECK" = success
          test "$CLIPPY" = success
