name: Export learning.plasticity source

on:
  push:
    branches:
      - learning.plasticity/full-convergence-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build source archive
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/hepta-private-ci-source.tar.gz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hepta-private-ci-source-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-private-ci-source.tar.gz
          if-no-files-found: error
          retention-days: 1
