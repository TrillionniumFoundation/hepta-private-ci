name: Hepta Stem Matrix Safe Security Convergence (shadow)

on:
  pull_request:
    paths:
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/third_party/matrix-sdk-0.19.1/**'
      - 'codex-rs/third_party/sqlx-sqlite-0.9.0/**'
      - 'codex-rs/hepta-matrix-sdk/**'
      - 'codex-rs/hepta-matrixd/**'
      - 'codex-rs/hepta-matrix-store/**'
      - 'codex-rs/core-plugins/**'
      - 'codex-rs/hepta-infer-worker-host/**'
      - 'codex-rs/rust-toolchain.toml'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.github/workflows/hepta-stem-matrix-security-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact reviewed source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Install exact migrated Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt
      - name: Prove native locked dependency graph resolves without changing source
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.96.0 metadata --locked --format-version 1 --no-deps > /dev/null
          cargo +1.96.0 fmt --all -- --check
      - name: Fail on unreviewed generated lock or source drift
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

  cargo-deny-no-waivers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - uses: ./.github/actions/setup-ci-build
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
      - name: Enforce RustSec over the COMPLETE locked graph
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246
        with:
          rust-version: 1.96.0
          manifest-path: ./codex-rs/Cargo.toml
      - name: Never mutate Cargo.lock or add advisory exceptions
        if: always()
        run: |
          git diff --check
          git diff --exit-code

  native-stem-matrix-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install 1.96 and native Clippy
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Qualified owners use the SAME frozen lock graph
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.96.0 test --locked -p codex-hepta-infer-core -p codex-hepta-matrix-sdk -p codex-hepta-matrixd --lib
          cargo +1.96.0 test --locked -p codex-core-plugins -p codex-skills -p codex-external-agent-migration --lib
          cargo +1.96.0 test --locked -p codex-hepta-infer-worker-host --lib 'model_worker::tests::' -- --nocapture
      - name: Strict native ownership lint
        working-directory: codex-rs
        run: |
          cargo +1.96.0 clippy --locked -p codex-hepta-infer-core -p codex-hepta-infer-worker-host -p codex-hepta-matrix-sdk -p codex-hepta-matrixd -p codex-core-plugins --all-targets -- -D warnings
      - name: No unreviewed generated tree
        if: always()
        run: |
          git diff --check
          git diff --exit-code
