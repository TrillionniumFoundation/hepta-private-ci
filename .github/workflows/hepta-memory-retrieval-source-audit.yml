name: Memory retrieval source audit bundle

on:
  push:
    branches: [work/memory-retrieval-semantic-product-convergence-20260926]
    paths: [.github/workflows/hepta-memory-retrieval-source-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact tracked source without credentials or runtime state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/retrieval-source-audit"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/retrieval-source-audit/source.tar.gz"
          git bundle create "$RUNNER_TEMP/retrieval-source-audit/source.bundle" HEAD
          printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/retrieval-source-audit/identity.txt"
          (cd "$RUNNER_TEMP/retrieval-source-audit" && sha256sum source.tar.gz source.bundle identity.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-source-${{ github.sha }}
          path: ${{ runner.temp }}/retrieval-source-audit/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Export locked dependency source inputs for offline native verification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/retrieval-cargo-inputs"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          # Only public dependency source/cache/index data, never credentials,
          # config, tokens, executables, build outputs or runtime databases.
          roots=()
          for dir in registry/cache registry/index registry/src git/db git/checkouts; do
            if test -d "$cargo_home/$dir"; then roots+=("$dir"); fi
          done
          test "${#roots[@]}" -gt 0
          tar -C "$cargo_home" -czf "$RUNNER_TEMP/retrieval-cargo-inputs/cargo-inputs.tar.gz" "${roots[@]}"
          cp Cargo.lock "$RUNNER_TEMP/retrieval-cargo-inputs/Cargo.lock"
          printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/retrieval-cargo-inputs/identity.txt"
          (cd "$RUNNER_TEMP/retrieval-cargo-inputs" && sha256sum cargo-inputs.tar.gz Cargo.lock identity.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-cargo-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/retrieval-cargo-inputs/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
