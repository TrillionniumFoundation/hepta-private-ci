name: Learning plasticity review snapshot

on:
  push:
    branches:
      - feat/learning-plasticity-product-closure-20260928
    paths:
      - ".github/workflows/learning-plasticity-review-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-plasticity-review-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Export exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz --output="$RUNNER_TEMP/export/hepta-private-ci-${{ github.sha }}.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/export/hepta-private-ci-${{ github.sha }}.tar.gz" > "$RUNNER_TEMP/export/hepta-private-ci-${{ github.sha }}.tar.gz.sha256"

      - name: Retain source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-plasticity-review-source-${{ github.sha }}
          path: ${{ runner.temp }}/export
          if-no-files-found: error
          retention-days: 1
