name: Hepta VERIFY-1 engineering validation

on:
  push:
    branches:
      - research/verify1-risk-cell-20261108-771b
      - research/verify2-*
    paths:
      - experiments/verification_cell_verify1/**
      - .github/workflows/**
      - .github/actions/**
      - scripts/**
      - qualification/verify2-*/**
  pull_request:
    paths:
      - experiments/verification_cell_verify1/**
      - .github/workflows/**
      - .github/actions/**
      - scripts/**
      - qualification/verify2-*/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engineering:
    name: VERIFY-1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      VERIFY_REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Prepare bounded experiment dependencies and output paths
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.4.2'
          printf 'VERIFY1_RECORDS=%s/verify1-records\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'VERIFY1_OUTPUT=%s/verify1-experiment\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'VERIFY2_DISPATCH_OUTPUT=%s/verify2-dispatch\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'VERIFY5_OBSERVATION_OUTPUT=%s/verify5-observation\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Bind source and execute counterexamples
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY1_RECORDS"
          git rev-parse HEAD > "$VERIFY1_RECORDS/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$VERIFY1_RECORDS/source-tree.txt"
          test "$(git rev-parse HEAD)" = "$VERIFY_REVIEWED_SHA"
          git diff --check
          python -B -m unittest discover -s experiments/verification_cell_verify1 -t . -v 2>&1 | tee "$VERIFY1_RECORDS/tests.log"
      - name: Run bounded real SQLite effects
        run: |
          set -euo pipefail
          python -B -m experiments.verification_cell_verify1.experiment --output "$VERIFY1_OUTPUT" --groups 3 2>&1 | tee "$VERIFY1_RECORDS/experiment.log"
          git diff --exit-code
      - name: Run bounded checker dispatch and terminal labels
        run: |
          set -euo pipefail
          python -B -m experiments.verification_cell_verify1.dispatch_smoke --output "$VERIFY2_DISPATCH_OUTPUT" 2>&1 | tee "$VERIFY1_RECORDS/dispatch.log"
          git diff --exit-code
      - name: Run paid observations and four policy controls
        run: |
          set -euo pipefail
          python -B -m experiments.verification_cell_verify1.observation_smoke --output "$VERIFY5_OBSERVATION_OUTPUT" 2>&1 | tee "$VERIFY1_RECORDS/observation.log"
          python -B -m experiments.verification_cell_verify1.observation_audit --input "$VERIFY5_OBSERVATION_OUTPUT" --output "$VERIFY1_RECORDS/observation-audit.json" 2>&1 | tee "$VERIFY1_RECORDS/observation-audit.log"
          git diff --exit-code
      - name: Preserve all receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify1-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/verify1-records
            ${{ runner.temp }}/verify1-experiment
            ${{ runner.temp }}/verify2-dispatch
            ${{ runner.temp }}/verify5-observation
          if-no-files-found: error
