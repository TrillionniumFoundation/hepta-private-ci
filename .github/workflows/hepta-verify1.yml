name: Hepta VERIFY-1 engineering validation

on:
  push:
    branches:
      - research/verify1-risk-cell-20261108-771b
    paths:
      - experiments/verification_cell_verify1/**
      - .github/workflows/hepta-verify1.yml
  pull_request:
    paths:
      - experiments/verification_cell_verify1/**
      - .github/workflows/hepta-verify1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engineering:
    name: VERIFY-1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      VERIFY1_RECORDS: ${{ runner.temp }}/verify1-records
      VERIFY1_OUTPUT: ${{ runner.temp }}/verify1-experiment
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Bind source and execute counterexamples
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY1_RECORDS"
          git rev-parse HEAD > "$VERIFY1_RECORDS/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$VERIFY1_RECORDS/source-tree.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          python -B -m unittest discover -s experiments/verification_cell_verify1 -t . -v 2>&1 | tee "$VERIFY1_RECORDS/tests.log"
      - name: Run bounded real SQLite effects
        run: |
          set -euo pipefail
          python -B -m experiments.verification_cell_verify1.experiment --output "$VERIFY1_OUTPUT" --groups 3 2>&1 | tee "$VERIFY1_RECORDS/experiment.log"
          git diff --exit-code
      - name: Preserve all receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify1-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/verify1-records
            ${{ runner.temp }}/verify1-experiment
          if-no-files-found: error
