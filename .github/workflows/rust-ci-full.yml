name: ui-native-cross-platform-probe
on:
  push:
    branches:
      - "**full-ci**"
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5344d19e03551505e6a903f3820e448a9faa0a31
          persist-credentials: false
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "5344d19e03551505e6a903f3820e448a9faa0a31"
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5344d19e03551505e6a903f3820e448a9faa0a31
          persist-credentials: false
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "5344d19e03551505e6a903f3820e448a9faa0a31"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5344d19e03551505e6a903f3820e448a9faa0a31
          persist-credentials: false
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "5344d19e03551505e6a903f3820e448a9faa0a31"
