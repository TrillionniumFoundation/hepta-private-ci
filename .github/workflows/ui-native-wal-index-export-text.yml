name: ui.native WAL patch and source export

on:
  push:
    branches: [work/ui-native-full-convergence-20260929]
    paths:
      - .github/workflows/ui-native-wal-index-export-text.yml
      - .ci/ui-native-wal-index/source.patch.gz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact source and available reviewed patch bytes
        env:
          PATCH_BLOB_SHA: cf8d5267cbcde61455849e24be9eac9d1a8d14f3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.ci/ui-native-wal-index/source.patch.gz)" = "$PATCH_BLOB_SHA"
          out="$RUNNER_TEMP/ui-native-wal-index-export"
          mkdir -p "$out"
          git cat-file blob "$PATCH_BLOB_SHA" > "$out/source.patch.gz"
          set +e
          gzip -dc "$out/source.patch.gz" > "$out/source.patch" 2> "$out/gzip.stderr"
          gzip_status=$?
          set -e
          test -s "$out/source.patch"
          printf 'gzip_status=%s\n' "$gzip_status" > "$out/decode-status.txt"
          grep '^diff --git ' "$out/source.patch" > "$out/diff-paths.txt" || true
          git archive --format=tar.gz --output="$out/current-source.tar.gz" HEAD \
            apps/hepta-native docs/modules/ui.native \
            .github/workflows/ui-native-wal-index-apply-once.yml \
            .github/workflows/ui-native-wal-index-export-text.yml
          git rev-parse HEAD HEAD^{tree} > "$out/identity.txt"
          sha256sum "$out/source.patch.gz" "$out/source.patch" "$out/current-source.tar.gz" > "$out/sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-wal-index-export-${{ github.sha }}
          path: ${{ runner.temp }}/ui-native-wal-index-export
          if-no-files-found: error
          retention-days: 3
