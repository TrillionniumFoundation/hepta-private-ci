name: ACT3 old TRAIN skill completion advisory

on:
  push:
    branches:
      - codex/act3-skill-completion-qualification-20261112-5fe4

permissions:
  contents: read

concurrency:
  group: act3-skill-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  skill-completion-advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Build pinned Python probe environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act3-skill-completion-setup"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m venv "$RUNNER_TEMP/act3-skill-completion-venv"
          "$RUNNER_TEMP/act3-skill-completion-venv/bin/pip" install numpy==2.3.5
          "$RUNNER_TEMP/act3-skill-completion-venv/bin/pip" freeze > "$RUNNER_TEMP/act3-skill-completion-setup/packages.txt"
      - name: Verify TRAIN boundaries and run the frozen advisory probe
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/act3-skill-completion-venv/bin/python" scripts/act2_learning/qualify_skill_completion.py --output "$RUNNER_TEMP/act3-skill-completion"
          just fmt --base dc7db9c5215303b2d45754f24af047ab52ec1040 --check > "$RUNNER_TEMP/act3-skill-completion/formatter-check.log" 2>&1
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: act3-skill-completion-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/act3-skill-completion
            ${{ runner.temp }}/act3-skill-completion-setup
          if-no-files-found: error
          retention-days: 30
