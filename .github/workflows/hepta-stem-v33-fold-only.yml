name: Hepta Stem V33 strictly fold-disjoint mmBERT Cell OOF (DENY_ALL)
on:
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/v33_fold_disjoint_training.py'
      - 'qualification/stem-cell-v1/v33_independent_numpy_review.py'
      - 'qualification/stem-cell-v1/test_v33_fold_only_contract.py'
      - 'qualification/stem-cell-v1/STEM_V33_FOLD_ONLY_RESEARCH.md'
      - '.github/workflows/hepta-stem-v33-fold-only.yml'
  push:
    branches:
      - research/stem-v33-strict-fold-preprocess-20261017
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU research dependencies
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'numpy==2.3.5' 'safetensors==0.7.0'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Run exact-source and fail-closed preprocessing checks
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git hash-object qualification/stem-cell-v1/v32_original_cell_learning.py)" = ae642d3a22949b026814610d5685502cfdd1ae22
          python -m py_compile qualification/stem-cell-v1/v33_fold_disjoint_training.py qualification/stem-cell-v1/v33_independent_numpy_review.py qualification/stem-cell-v1/test_v33_fold_only_contract.py
          cd qualification/stem-cell-v1
          python -m unittest -q test_v33_fold_only_contract
          python -O -m unittest -q test_v33_fold_only_contract
  physical-original-fold-disjoint:
    needs: source-contract
    if: github.event_name == 'push' && github.ref_name == 'research/stem-v33-strict-fold-preprocess-20261017' && github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact CPU original-feature runtime
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'numpy==2.3.5' 'safetensors==0.7.0'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Fetch original publisher archive with token only on first-hop GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          status="$(curl --fail --silent --show-error --retry 2 --proto '=https' --max-redirs 0 \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            --dump-header "$RUNNER_TEMP/headers" --output /dev/null --write-out '%{http_code}' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11890616195/zip')"
          test "$status" = '302'
          location="$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' "$RUNNER_TEMP/headers" | tr -d '\r')"
          case "$location" in https://*) ;; *) exit 1 ;; esac
          curl --fail --location --silent --show-error --retry 2 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/original.zip" "$location"
          unset location
          echo '0f3c8c2ceb22b61cabb8a08ca06d2fb0a9a7f4681e9f1af45138cf7979a0e1c7  '"$RUNNER_TEMP/original.zip" | sha256sum -c -
      - name: Stage original 64 TRAIN features; never keep CAL or BLIND labels
        run: |
          set -euo pipefail
          umask 077
          python qualification/stem-cell-v1/v32_original_cell_learning.py stage \
            --archive "$RUNNER_TEMP/original.zip" --out "$RUNNER_TEMP/stage"
          echo '69bdb09bb235c9cf490da400e239c5d9fabe8e13327cb255721090ea47d2e096  '"$RUNNER_TEMP/stage/train-source.json" | sha256sum -c -
          echo '2530b62d48b593cebeeb783c3ee754f8229b924558340dd09fb7160c6d1e3cc3  '"$RUNNER_TEMP/stage/train-features.safetensors" | sha256sum -c -
          rm -f "$RUNNER_TEMP/original.zip"
          test ! -e "$RUNNER_TEMP/original.zip"
      - name: Physically train and independently check 48 Head states and 60 original source predictions
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          umask 077
          cd qualification/stem-cell-v1
          python v33_fold_disjoint_training.py --source "$RUNNER_TEMP/stage" \
            --output "$RUNNER_TEMP/public-A.json" --private "$RUNNER_TEMP/private-A.json"
          python v33_independent_numpy_review.py --source "$RUNNER_TEMP/stage" \
            --public "$RUNNER_TEMP/public-A.json" --private "$RUNNER_TEMP/private-A.json" \
            --output "$RUNNER_TEMP/review-A.json"
          python -O v33_fold_disjoint_training.py --source "$RUNNER_TEMP/stage" \
            --output "$RUNNER_TEMP/public-B.json" --private "$RUNNER_TEMP/private-B.json"
          python -O v33_independent_numpy_review.py --source "$RUNNER_TEMP/stage" \
            --public "$RUNNER_TEMP/public-B.json" --private "$RUNNER_TEMP/private-B.json" \
            --output "$RUNNER_TEMP/review-B.json"
          cmp "$RUNNER_TEMP/review-A.json" "$RUNNER_TEMP/review-B.json"
          echo '2ecf2255789bd4c6d9cbb2d0f6035cc3176169bbad9947f1c126bd1fdd2c16be  '"$RUNNER_TEMP/review-A.json" | sha256sum -c -
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((root/'private-A.json').read_text())
          b=json.loads((root/'private-B.json').read_text())
          assert len(a['records'])==len(b['records'])==12
          for x,y in zip(a['records'],b['records']):
              for field in ('seed','fold','normalizer_sha256','fitted_case_ids','held_case_ids','weights_sha256','logits_sha256'):
                  assert x[field]==y[field],field
          review=json.loads((root/'review-A.json').read_text())
          assert review['checkpoint_count']==48
          assert review['source_bound_model_prediction_count']==60
          assert review['physical_head_optimizer_updates_paid']==1440
          assert review['normalized_withheld_groups_used'] is False
          assert review['independent_source_time_windows']==0
          assert review['authority']=='DENY_ALL' and review['production_authorized'] is False
          print('Real strictly fold-only Head research: HOLD/DENY_ALL')
          PY
      - name: Publish sanitized independent review, not features, source, labels or weights
        uses: actions/upload-artifact@v4
        with:
          name: stem-v33-fold-only-original-NO_GO-${{ github.sha }}
          path: ${{ runner.temp }}/review-A.json
          retention-days: 7
          if-no-files-found: error
