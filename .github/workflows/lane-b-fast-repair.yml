name: Lane B fast mechanical repair

on:
  push:
    branches:
      - ops/lane-b-fast-repair-20260910-r2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ops/lane-b-fast-repair-20260910-r2
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Normalize generated Rust and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [
              Path("codex-rs/hepta-fleet/src/bin/hepta-fleet-leased.rs"),
              Path("codex-rs/hepta-infer-core/src/bin/hepta-infer-control.rs"),
              Path("codex-rs/hepta-infer-worker-host/src/bin/hepta-infer-worker.rs"),
              Path("codex-rs/hepta-automation/src/bin/hepta-taskflow-runtime.rs"),
              Path("codex-rs/hepta-matrixd/src/bin/hepta-matrix-send-observer.rs"),
          ]
          for path in paths:
              output = []
              for line in path.read_text(encoding="utf-8").splitlines(keepends=True):
                  match = re.match(r"^(\s*)fn\s+([^()]*)\((.*)$", line)
                  if match:
                      indent, raw_name, tail = match.groups()
                      name = raw_name.strip()
                      if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", name):
                          name = re.sub(r"[^A-Za-z0-9_]+", "_", name).strip("_")
                          if not name or name[0].isdigit():
                              name = "test_" + name
                          line = f"{indent}fn {name}({tail}"
                  output.append(line)
              path.write_text("".join(output), encoding="utf-8")
          manifest = Path("codex-rs/hepta-automation/Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          expected = "path = \"src/lib.rs\"\ntest = false\ndoctest = false"
          if expected not in text:
              raise SystemExit("expected hepta-automation lib setting absent")
          manifest.write_text(text.replace(expected, "path = \"src/lib.rs\"\ntest = true\ndoctest = false", 1), encoding="utf-8")
          PY
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          rm .github/workflows/lane-b-fast-repair.yml
          git diff --check
          git config user.name "Hepta Lane B Repair"
          git config user.email "hepta-lane-b-repair@users.noreply.github.com"
          git add -A
          git commit -m "fix(lane-b): normalize Rust sources and test discovery"
          git push origin HEAD:refs/heads/ops/lane-b-fast-repair-20260910-r2
