name: HCSN saved-state continuation retained arithmetic
on:
  pull_request:
    paths:
      - 'qualification/hcsn_currentstate_resume/**'
      - 'scripts/verify_hcsn_saved_continuation.py'
      - '.github/workflows/hcsn-saved-continuation-retained.yml'
permissions:
  contents: read
jobs:
  retained-saved-continuation-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retained continuation evidence only
        run: python scripts/verify_hcsn_saved_continuation.py
      - name: Check clean executing source
        run: git diff --exit-code
