name: Learning operator exact-source diagnostics

on:
  pull_request:
    branches: [main]
    paths: &learning_operator_paths
      - '.github/workflows/learning-operator-diagnostics.yml'
      - '.github/workflows/learning-operator-remaining-convergence.yml'
      - 'scripts/learning_operator_remaining_convergence.py'
      - 'scripts/hepta-learning-operator-*.py'
      - 'codex-rs/hepta-bellman-operator/**'
      - 'codex-rs/hepta-learning-ledger/**'
      - 'codex-rs/hepta-learning-artifacts/**'
      - 'codex-rs/hepta-agentd/**'
      - 'docs/modules/learning.operator/**'
      - 'qualification/lane-e/**'
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths: *learning_operator_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-operator-exact-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  transformed-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: D:\t\learning-operator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Materialize deterministic transformed candidate
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts
          (
            set -euxo pipefail
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            python scripts/learning_operator_remaining_convergence.py
            python -m py_compile \
              scripts/learning_operator_remaining_convergence.py \
              scripts/hepta-learning-operator-contract.py \
              scripts/hepta-learning-operator-receipt.py \
              scripts/hepta-implementation-maps.py
            cargo fmt --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-learning-ledger \
              -p codex-hepta-bellman-operator \
              -p codex-hepta-learning-artifacts \
              -p codex-hepta-agentd
            python scripts/hepta-learning-operator-contract.py verify
            git diff --check
            git status --short > .ci-artifacts/transformed-status.txt
            tar --exclude=.git --exclude=target --exclude=codex-rs/target \
              --exclude=.ci-artifacts \
              -czf .ci-artifacts/learning-operator-transformed-source.tar.gz .
          ) 2>&1 | tee .ci-artifacts/transform.log
      - name: Upload transformed source and transform log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-operator-transformed-${{ env.SOURCE_SHA }}
          path: .ci-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Stop after transform failure
        if: steps.transform.outcome == 'failure'
        shell: bash
        run: exit 1
      - name: Locked compile and focused tests
        id: rust
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euxo pipefail
            cargo check --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-learning-ledger \
              -p codex-hepta-bellman-operator \
              -p codex-hepta-learning-artifacts \
              -p codex-hepta-agentd
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-learning-ledger dataset_receipt_v4 -- --nocapture
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator sensor_core_v2::tests -- --nocapture
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator tabular_v2::tests -- --nocapture
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator world_model_v2::tests -- --nocapture
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-learning-artifacts pinned_tests -- --nocapture
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-agentd --lib \
              immutable_candidate_supports_concurrent_current_reads_and_metrics -- --nocapture
            cargo fmt --manifest-path codex-rs/Cargo.toml \
              -p codex-hepta-learning-ledger \
              -p codex-hepta-bellman-operator \
              -p codex-hepta-learning-artifacts \
              -p codex-hepta-agentd -- --check
            git diff --check
          ) 2>&1 | tee .ci-artifacts/rust.log
      - name: Upload Rust evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-operator-windows-rust-${{ env.SOURCE_SHA }}
          path: .ci-artifacts/rust.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop after compile or test failure
        if: steps.rust.outcome == 'failure'
        shell: bash
        run: exit 1
