name: Learning operator authoritative exact-source writer

# One-shot use of the already-established diagnostics workflow identity. The
# trigger commit may change only this file and must descend from the reviewed
# convergence trigger. The job materializes source, updates the dependency lock,
# qualifies the candidate, rewrites this file back to a read-only verifier,
# removes all temporary writers, and pushes a normal fast-forward.

on:
  push:
    branches: [codex/learning-operator-full-convergence-20260926]
    paths: ['.github/workflows/learning-operator-diagnostics.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: learning-operator-authoritative-exact-source-writer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/learning-operator-full-convergence-20260926
      EXPECTED_PARENT: aee2b220480ba78fe01d87bd567019bc4a1395cb
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Prove trigger and materialize source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/learning-operator-diagnostics.yml"
          python3 scripts/learning_operator_remaining_convergence.py

          python3 - <<'PY'
          from pathlib import Path

          dataset = Path("codex-rs/hepta-bellman-operator/src/dataset_bound.rs")
          text = dataset.read_text()
          for marker in (
              "impl VerifiedTabularOperatorPlanV2 {\n",
              "impl VerifiedWorldModelDatasetV2 {\n",
          ):
              gated = '#[cfg(feature = "qualification-unverified-input")]\n' + marker
              if gated not in text:
                  if marker not in text:
                      raise SystemExit(f"missing compatibility marker: {marker}")
                  text = text.replace(marker, gated, 1)
          dataset.write_text(text)

          maps = Path("scripts/hepta-implementation-maps.py")
          text = maps.read_text()
          replacements = [
              (
                  "def verify(\n    *,\n    require_current_source: bool = True,\n    expected_sha: str | None = None,\n    expected_tree: str | None = None,\n):",
                  "def verify(\n    *,\n    require_current_source: bool = True,\n    expected_sha: str | None = None,\n    expected_tree: str | None = None,\n    selected_modules: list[str] | None = None,\n):",
              ),
              (
                  "        ids = [module[\"id\"] for module in modules]\n        if len(set(ids)) != len(ids):\n            raise ValueError(\"duplicate module identity\")\n        lanes = lane_by_module()",
                  "        ids = [module[\"id\"] for module in modules]\n        if len(set(ids)) != len(ids):\n            raise ValueError(\"duplicate module identity\")\n        if selected_modules is not None:\n            requested = set(selected_modules)\n            unknown = sorted(requested.difference(ids))\n            if unknown:\n                raise ValueError(\"unknown selected modules: \" + \", \".join(unknown))\n            modules = [module for module in modules if module[\"id\"] in requested]\n            if not modules:\n                raise ValueError(\"selected module set must be nonempty\")\n        lanes = lane_by_module()",
              ),
              (
                  "        help=\"rebind only this module (repeatable; migrate only)\",",
                  "        help=\"select this module (repeatable; migrate or verify)\",",
              ),
              (
                  "    if args.modules is not None and args.command != \"migrate\":\n        parser.error(\"--module applies only to migrate\")",
                  "    if args.modules is not None and args.command not in {\"migrate\", \"verify\"}:\n        parser.error(\"--module applies only to migrate or verify\")",
              ),
              (
                  "                expected_sha=args.expected_sha,\n                expected_tree=args.expected_tree,\n            ),",
                  "                expected_sha=args.expected_sha,\n                expected_tree=args.expected_tree,\n                selected_modules=args.modules,\n            ),",
              ),
          ]
          if "selected_modules: list[str] | None = None" not in text:
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit("implementation-map verifier marker missing")
                  text = text.replace(old, new, 1)
              maps.write_text(text)
          PY

          # Resolve the exact lock-file change before enforcing --locked. The
          # subsequent qualification uses only the resulting checked-in lock.
          cargo check --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          python3 scripts/hepta-learning-operator-contract.py verify
          git diff --check

      - name: Qualify materialized source
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-agentd
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --no-deps \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-learning-artifacts --all-targets -- -D warnings
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --no-deps \
            -p codex-hepta-agentd --lib -- -D warnings \
            -A clippy::too-many-arguments -A clippy::large-enum-variant
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-learning-ledger dataset_receipt_v4 -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator sensor_core_v2::tests -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator tabular_v2::tests -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator world_model_v2::tests -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-learning-artifacts pinned_tests -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-agentd --lib \
            immutable_candidate_supports_concurrent_current_reads_and_metrics -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-bellman-operator loaded_tests -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-shadow-qualification tabular_reload -- --nocapture
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff --check

      - name: Install final read-only exact-source verifier
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/learning-operator-diagnostics.yml <<'YAML'
          name: Learning operator exact-source diagnostics

          on:
            pull_request:
              branches: [main]
              paths: &learning_operator_paths
                - '.github/workflows/learning-operator-diagnostics.yml'
                - 'scripts/hepta-learning-operator-*.py'
                - 'codex-rs/hepta-bellman-operator/**'
                - 'codex-rs/hepta-learning-ledger/**'
                - 'codex-rs/hepta-learning-artifacts/**'
                - 'codex-rs/hepta-agentd/**'
                - 'codex-rs/hepta-shadow-qualification/**'
                - 'docs/modules/learning.operator/**'
                - 'qualification/lane-e/**'
            push:
              branches: [main, codex/learning-operator-full-convergence-20260926]
              paths: *learning_operator_paths

          permissions:
            contents: read

          concurrency:
            group: learning-operator-exact-source-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}
            cancel-in-progress: true

          jobs:
            exact-source:
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-24.04, windows-2025]
              runs-on: ${{ matrix.os }}
              timeout-minutes: 100
              env:
                CARGO_BUILD_JOBS: 2
                CARGO_PROFILE_DEV_DEBUG: 0
                CARGO_PROFILE_TEST_DEBUG: 0
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
                  with:
                    fetch-depth: 0
                - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
                  with:
                    toolchain: 1.95.0
                    components: rustfmt,clippy
                - name: Verify exact checked-in source
                  shell: bash
                  run: |
                    set -euo pipefail
                    test ! -e scripts/learning_operator_remaining_convergence.py
                    test ! -e .github/workflows/learning-operator-remaining-convergence.yml
                    python3 scripts/hepta-learning-operator-contract.py verify --require-receipt
                    python3 scripts/hepta-implementation-dossiers.py verify
                    python3 scripts/hepta-lane-e-closure.py verify
                    cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
                    git diff --check
                - name: Compile and test exact source
                  shell: bash
                  run: |
                    set -euo pipefail
                    cargo check --manifest-path codex-rs/Cargo.toml --locked \
                      -p codex-hepta-learning-ledger \
                      -p codex-hepta-bellman-operator \
                      -p codex-hepta-learning-artifacts \
                      -p codex-hepta-agentd
                    cargo test --manifest-path codex-rs/Cargo.toml --locked \
                      -p codex-hepta-learning-ledger dataset_receipt_v4 -- --nocapture
                    cargo test --manifest-path codex-rs/Cargo.toml --locked \
                      -p codex-hepta-bellman-operator sensor_core_v2::tests -- --nocapture
                    cargo test --manifest-path codex-rs/Cargo.toml --locked \
                      -p codex-hepta-bellman-operator tabular_v2::tests -- --nocapture
                    cargo test --manifest-path codex-rs/Cargo.toml --locked \
                      -p codex-hepta-bellman-operator world_model_v2::tests -- --nocapture
                    cargo test --manifest-path codex-rs/Cargo.toml --locked \
                      -p codex-hepta-agentd --lib \
                      immutable_candidate_supports_concurrent_current_reads_and_metrics -- --nocapture
                - name: Strict lint on Linux
                  if: runner.os == 'Linux'
                  shell: bash
                  run: |
                    set -euo pipefail
                    cargo clippy --manifest-path codex-rs/Cargo.toml --locked --no-deps \
                      -p codex-hepta-learning-ledger \
                      -p codex-hepta-bellman-operator \
                      -p codex-hepta-learning-artifacts --all-targets -- -D warnings
                    cargo clippy --manifest-path codex-rs/Cargo.toml --locked --no-deps \
                      -p codex-hepta-agentd --lib -- -D warnings \
                      -A clippy::too-many-arguments -A clippy::large-enum-variant
          YAML
          git rm -f --ignore-unmatch \
            .github/workflows/learning-operator-remaining-convergence.yml \
            scripts/learning_operator_remaining_convergence.py \
            .github/workflows/learning-operator-final-convergence.yml \
            .github/workflows/learning-operator-source-apply.yml \
            .github/workflows/learning-operator-authoritative-dispatch.yml

      - name: Commit exact source candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add -A
          git commit \
            -m "feat(learning.operator): materialize V4 exact-source qualification" \
            -m "Materialize the row-committed type-state path, bounded sensor/tabular/world-model V2 implementations, V2 runtime pins, concurrent immutable ranker reads, telemetry, migration policy and operations documentation; retain deny-all authority and no activation claim." \
            -m "Signed-off-by: OpenAI <openai@users.noreply.github.com>"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "workflow_blob=$(git rev-parse HEAD:.github/workflows/learning-operator-diagnostics.yml)" >> "$GITHUB_OUTPUT"

      - name: Qualify deterministic current-main synthetic merge
        id: synthetic
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='${{ steps.source.outputs.sha }}'
          MAIN_SHA="$(git rev-parse origin/main)"
          MERGE_TREE="$(git merge-tree --write-tree "$MAIN_SHA" "$SOURCE_SHA")"
          export GIT_AUTHOR_NAME="Hepta deterministic qualification"
          export GIT_AUTHOR_EMAIL="qualification@hepta.invalid"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="2000-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          SYNTHETIC_SHA="$(printf '%s\n' 'learning.operator deterministic synthetic merge v1' | git commit-tree "$MERGE_TREE" -p "$MAIN_SHA" -p "$SOURCE_SHA")"
          rm -rf /tmp/learning-operator-synthetic
          git worktree add --detach /tmp/learning-operator-synthetic "$SYNTHETIC_SHA"
          (
            cd /tmp/learning-operator-synthetic
            python3 scripts/hepta-learning-operator-contract.py verify
            cargo check --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-learning-ledger \
              -p codex-hepta-bellman-operator \
              -p codex-hepta-learning-artifacts \
              -p codex-hepta-agentd
            cargo test --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-bellman-operator sensor_core_v2::tests -- --nocapture
          )
          git worktree remove --force /tmp/learning-operator-synthetic
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$SYNTHETIC_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$MERGE_TREE" >> "$GITHUB_OUTPUT"

      - name: Bind evidence and push fast-forward
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='${{ steps.source.outputs.sha }}'
          SOURCE_TREE='${{ steps.source.outputs.tree }}'
          mkdir -p qualification/lane-e
          rustc -Vv > qualification/lane-e/learning-operator-rustc.txt
          python3 - <<PY
          import json
          from pathlib import Path
          payload = {
              "schema": "hepta.learning-operator-test-artifact.v1",
              "sourceSha": "$SOURCE_SHA",
              "sourceTree": "$SOURCE_TREE",
              "gates": {
                  "exactSourceCompile": "pass",
                  "strictClippy": "pass",
                  "v4Ledger": "pass",
                  "sensorCoreV2": "pass",
                  "tabularV2": "pass",
                  "worldModelV2": "pass",
                  "concurrentRanker": "pass",
                  "separateProcessReloadRollback": "pass",
                  "laneEClosure": "pass",
                  "currentMainSyntheticMerge": "pass"
              },
              "crossPlatformAndSecurity": "resolved only by exact-head PR workflows; never inferred here",
              "externalAcceptance": "unissued"
          }
          Path("qualification/lane-e/learning-operator-test-artifact.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY
          python3 scripts/hepta-implementation-maps.py migrate \
            --module learning.operator --module learning.eval
          python3 scripts/hepta-learning-operator-receipt.py \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-blob '${{ steps.source.outputs.workflow_blob }}' \
            --main-sha '${{ steps.synthetic.outputs.main_sha }}' \
            --synthetic-sha '${{ steps.synthetic.outputs.sha }}' \
            --synthetic-tree '${{ steps.synthetic.outputs.tree }}' \
            --target "$(rustc -vV | sed -n 's/^host: //p')" \
            --rustc-file qualification/lane-e/learning-operator-rustc.txt \
            --test-artifact qualification/lane-e/learning-operator-test-artifact.json
          git add -A
          git commit \
            -m "docs(learning.operator): bind frozen qualification evidence" \
            -m "Bind source, workflow, dependency lock, compiler target, synthetic merge and test artifact evidence while keeping independent acceptance, future efficacy, canary, promotion, activation and release unissued." \
            -m "Signed-off-by: OpenAI <openai@users.noreply.github.com>"
          python3 scripts/hepta-learning-operator-contract.py verify --require-receipt
          python3 scripts/hepta-implementation-maps.py verify \
            --module learning.operator --module learning.eval \
            --expected-sha "$SOURCE_SHA" --expected-tree "$SOURCE_TREE"
          python3 scripts/hepta-implementation-dossiers.py verify
          python3 scripts/hepta-lane-e-closure.py verify
          git diff --exit-code
          git push origin HEAD:"$TARGET_BRANCH"
