name: MemoryCell temporary source loss formatter candidate
on:
  push:
    branches:
      - "codex/memory-cell-source-loss-20261011"
    paths:
      - ".github/workflows/hepta-memory-source-loss-formatter.yml"
permissions:
  contents: read
jobs:
  isolated-ast-preserving-format:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/memory-cell-source-loss-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Format only three test modules into an isolated review branch
        run: |
          set -euo pipefail
          python3 -m pip install 'ruff==0.15.13'
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          names = [
              'scripts/memory_cell/test_source_completion_hf.py',
              'scripts/memory_cell/test_source_completion_loss.py',
              'scripts/memory_cell/test_source_completion_writer.py',
          ]
          Path('/tmp/memory-source-loss-asts.json').write_text(json.dumps({
              name: ast.dump(ast.parse(Path(name).read_text())) for name in names
          }))
          PY
          ruff format scripts/memory_cell/test_source_completion_hf.py scripts/memory_cell/test_source_completion_loss.py scripts/memory_cell/test_source_completion_writer.py
          python3 - <<'PY'
          import ast, json, subprocess
          from pathlib import Path
          before = json.loads(Path('/tmp/memory-source-loss-asts.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if set(changed) - set(before):
              raise ValueError('out-of-scope formatter mutation')
          for name, prior in before.items():
              if ast.dump(ast.parse(Path(name).read_text())) != prior:
                  raise ValueError('formatter changed executable Python AST')
          if not changed:
              raise ValueError('no formatter diff to review')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "codex/memory-source-loss-formatted-${GITHUB_RUN_ID}"
          git add scripts/memory_cell/test_source_completion_hf.py scripts/memory_cell/test_source_completion_loss.py scripts/memory_cell/test_source_completion_writer.py
          git commit -m 'style(memory-cell): AST-identical Ruff source-loss test formatting'
          git push origin "HEAD:refs/heads/codex/memory-source-loss-formatted-${GITHUB_RUN_ID}"
          echo "REVIEW_CANDIDATE_SHA=$(git rev-parse HEAD)"
