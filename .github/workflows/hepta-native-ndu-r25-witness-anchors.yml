name: Native NDU R25 witness and fixed residual anchors
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-ndu/research/native_stem_abcd/witness_anchors/**'
      - '.github/workflows/hepta-native-ndu-r25-witness-anchors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Pin numeric dependency for original dyadic tensor identities
        run: python -m pip install numpy==2.3.5
      - name: Portable mathematical checks and source identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/codex-rs/hepta-ndu/research/native_stem_abcd"
          SRC="$ROOT/witness_anchors"
          OUT="$RUNNER_TEMP/r25"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/HEAD.txt"
          python -m pip freeze > "$OUT/ENVIRONMENT.txt"
          export PYTHONPATH="$SRC:$ROOT/conditional_elimination:$ROOT/centered_interval:$ROOT/width4_interval"
          python -m compileall -q "$SRC"
          (cd "$SRC"; python -m unittest -v test_portable) 2>&1 | tee "$OUT/PORTABLE.log"
          sha256sum "$SRC"/*.py > "$OUT/SOURCE_SHA256.txt"
          echo "Historical 10.8MB R21 ZIP and 3 full R25 proof trees are contained in the separately archived conversation evidence, not Git." > "$OUT/FULL_PROOF_REPLAY_PREREQUISITES.txt"
          echo "This hosted lane is source/math smoke only; a pass is NOT a successful replay of the 3 archive-bound global certificates." >> "$OUT/FULL_PROOF_REPLAY_PREREQUISITES.txt"
      - name: Archive source-only checks including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-r25-math-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r25
          if-no-files-found: error
          retention-days: 14
