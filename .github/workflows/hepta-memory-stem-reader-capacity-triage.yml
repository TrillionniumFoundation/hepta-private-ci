name: MemoryCell strict-run Reader evidence triage
on:
  push:
    branches: ["codex/memory-cell-evidence-20261008"]
    paths:
      - "scripts/memory_cell/stem_oct12_reader_capacity_triage.py"
      - "scripts/memory_cell/test_stem_oct12_reader_capacity_triage.py"
      - ".github/workflows/hepta-memory-stem-reader-capacity-triage.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memorycell-reader-capacity-triage-${{ github.sha }}
  cancel-in-progress: false
jobs:
  immutable-reader-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run source-only anti-promotion tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/oct12-reader-triage
          git rev-parse HEAD > /tmp/oct12-reader-triage/auditor-commit.txt
          git rev-parse HEAD^{tree} > /tmp/oct12-reader-triage/auditor-tree.txt
          python3 -m unittest -v test_stem_oct12_reader_capacity_triage \
            2>&1 | tee /tmp/oct12-reader-triage/tests.log
          python3 -m compileall -q \
            scripts/memory_cell/stem_oct12_reader_capacity_triage.py \
            scripts/memory_cell/test_stem_oct12_reader_capacity_triage.py
      - name: Get exactly the previously completed strict original ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11726530850/zip \
            > /tmp/oct12-strict-original.zip
          printf '%s  %s\n' \
            07b0f15ec150cc9817db6bfc9b4bae1e2c06a5296ca2ba3c4c7895da18b99e2f \
            /tmp/oct12-strict-original.zip | sha256sum -c -
      - name: Compare all 32 original Reader conditions without rerunning models
        run: |
          set -euo pipefail
          python3 scripts/memory_cell/stem_oct12_reader_capacity_triage.py \
            --zip /tmp/oct12-strict-original.zip \
            --output /tmp/oct12-reader-triage/verified-triage.json \
            2>&1 | tee /tmp/oct12-reader-triage/triage.log
      - name: Save exact audited source, every failure, and member hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/oct12-reader-triage/source
          cp scripts/memory_cell/stem_oct12_reader_capacity_triage.py \
            scripts/memory_cell/test_stem_oct12_reader_capacity_triage.py \
            scripts/memory_cell/stem_audit_archive.py \
            scripts/memory_cell/stem_oct12_strict_nonpromotion.py \
            .github/workflows/hepta-memory-stem-reader-capacity-triage.yml \
            /tmp/oct12-reader-triage/source/
          (cd /tmp/oct12-reader-triage && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memorycell-reader-capacity-triage
          path: /tmp/oct12-reader-triage
          if-no-files-found: error
