name: hepta combined dependency lock

on:
  pull_request:
    paths:
      - .github/workflows/hepta-dependency-union-lock.yml
      - qualification/dependency-union-20261103/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/third_party/**
      - MODULE.bazel
      - MODULE.bazel.lock
      - patches/**

permissions:
  contents: read

concurrency:
  group: dependency-union-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.head_ref == 'integration/private-ci-dependency-closure-20261103-gpt6'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: combined-dependency-lock
      - name: Check the committed combined lock and require identical regeneration
        run: python3 qualification/dependency-union-20261103/generate_lock.py --require-committed --output "$RUNNER_TEMP/dependency-union-lock"
      - name: Retain exact generated bytes and unmodified source inputs
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dependency-union-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dependency-union-lock
          if-no-files-found: error
          retention-days: 7
