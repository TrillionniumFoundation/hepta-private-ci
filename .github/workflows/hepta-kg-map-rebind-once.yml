name: Rebind knowledge.graph map once

on:
  push:
    branches:
      - work/kg-abc-execution-20260927
    paths:
      - ".github/workflows/hepta-kg-map-rebind-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-kg-map-rebind-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebind:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rebind exact knowledge.graph source evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module knowledge.graph
          git diff --check
          test -n "$(git status --porcelain -- docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json)"

      - name: Commit generated map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta KG CI"
          git config user.email "hepta-kg-ci@users.noreply.github.com"
          git add docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json
          git commit -m "docs(knowledge.graph): rebind exact candidate source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
