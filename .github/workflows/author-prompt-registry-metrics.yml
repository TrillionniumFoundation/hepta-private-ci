name: Author prompt.registry full-operation metrics

on:
  push:
    branches:
      - ops/prompt-registry-production-convergence-author-20260929
    paths:
      - ops/trigger-prompt-registry-metrics

permissions:
  contents: write

concurrency:
  group: author-prompt-registry-metrics
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/prompt-registry-production-convergence-20260929

jobs:
  author-metrics:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      authored_sha: ${{ steps.publish.outputs.authored_sha }}
    steps:
      - name: Checkout authoring source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: authoring
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Require versioned GC-age predecessor
        working-directory: target
        run: |
          set -euo pipefail
          test -f codex-rs/hepta-prompt-registry/src/durable_gc_age.rs
          grep -q 'PromptRegistryGcPolicyV1' codex-rs/hepta-prompt-registry/src/durable.rs

      - name: Apply full-operation metrics source changes
        run: |
          set -euo pipefail
          if grep -q 'pub mutation_attempts: u64' \
            target/codex-rs/hepta-prompt-registry/src/durable_io.rs; then
            echo 'Full-operation metrics already present; preserving the existing implementation.'
          else
            python3 authoring/scripts/author_prompt_registry_metrics.py target
          fi

      - name: Format and verify patch hygiene
        working-directory: target
        run: |
          set -euo pipefail
          (cd codex-rs && cargo fmt --all)
          git diff --check
          git status --short

      - name: Publish metrics commit
        id: publish
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "14957082+openai@users.noreply.github.com"
          git add \
            codex-rs/hepta-prompt-registry/src/durable.rs \
            codex-rs/hepta-prompt-registry/src/durable_gc_age.rs \
            codex-rs/hepta-prompt-registry/src/durable_io.rs \
            codex-rs/hepta-prompt-registry/src/durable_maintenance.rs
          if ! git diff --cached --quiet; then
            git commit -m "prompt.registry: measure full mutation and reclaim costs"
            git push origin HEAD:refs/heads/${TARGET_BRANCH}
          fi
          echo "authored_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-metrics:
    needs: author-metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout exact authored source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.author-metrics.outputs.authored_sha }}
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Validate exact authored metrics
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p codex-hepta-prompt-registry --all-targets
          cargo test --locked -p codex-hepta-prompt-registry -- --test-threads=1
          cargo clippy --locked -p codex-hepta-prompt-registry --all-targets --no-deps -- -D warnings
