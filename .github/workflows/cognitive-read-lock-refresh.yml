name: Cognitive read source preparation

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
    paths:
      - .github/workflows/cognitive-read-lock-refresh.yml
      - scripts/prepare-cognitive-read-source.py
      - scripts/prepare-cognitive-read-durable-handoff.py
      - scripts/apply-cognitive-read-selected-cut.py
      - scripts/apply-cognitive-read-durable-handoff.py
      - scripts/cognitive_read_delivery_gates.py
      - codex-rs/hepta-memory/src/lane_c_snapshot.rs
      - codex-rs/hepta-memory/src/lane_c_selected_snapshot.rs
      - codex-rs/hepta-agentd/src/client.rs
      - codex-rs/hepta-agentd/src/lib.rs
      - codex-rs/hepta-agentd/src/cognitive_context.rs
      - codex-rs/hepta-agentd/src/cognitive_context_final_use.rs
      - codex-rs/hepta-agentd/src/cognitive_retrieval_delivery_tests.rs
      - codex-rs/hepta-infer-core/src/native_control.rs
      - codex-rs/hepta-infer-core/src/cognitive_delivery.rs
      - codex-rs/hepta-infer-worker-host/src/native_app_server.rs
      - codex-rs/hepta-infer-worker-host/src/native_run_control.rs
  workflow_dispatch:

# This is an explicitly scoped SOURCE AUTHORING job, not qualification.
# The cognitive-read-qualification workflow remains read-only and unchanged.
permissions:
  contents: read

concurrency:
  group: cognitive-read-source-preparation-${{ github.ref }}
  # A superseded authoring candidate may not hold the latest one in the queue.
  # The remote SHA checks and non-force push still reject concurrent authors.
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/work/cognitive-read-production-convergence-20260927'
    # Source authoring remains on a GitHub-hosted runner. The repository's
    # self-hosted target machines are not exposed to branch-authored code, and
    # qualification/target-host acceptance remain separate workflows.
    runs-on: macos-15-xlarge
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SOURCE_BRANCH: work/cognitive-read-production-convergence-20260927
    steps:
      - name: Check out exact authored source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Prepare ordinary source and map commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/prepare-cognitive-read-durable-handoff.py --expected-sha "$GITHUB_SHA"
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$RUNNER_TEMP/cognitive-read-preparation"
          git diff --binary "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/cognitive-read-preparation/source.patch"
          git log --format=fuller "$GITHUB_SHA"..HEAD > "$RUNNER_TEMP/cognitive-read-preparation/commits.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/cognitive-read-preparation/prepared-head.txt"
          # A concurrent author is never overwritten. No force push or lease
          # overrides are used; qualification must run on the resulting HEAD.
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          {
            echo '## Source preparation, not qualification'
            echo "Authored input: $GITHUB_SHA"
            echo "Prepared head: $(git rev-parse HEAD)"
            echo 'Selected owner integration and the durable read-request handoff are authored only through existing owners.'
            echo 'Preparation verifies exact source shape, formats reviewed paths and refreshes the immutable map without replaying selected-cut edits.'
            echo 'No package, product, acceptance, activation or release pass is claimed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain source-authoring patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-source-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/cognitive-read-preparation
          if-no-files-found: warn
          retention-days: 7
