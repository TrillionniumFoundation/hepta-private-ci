name: Cognitive read lock refresh

on:
  push:
    branches:
      - work/cognitive-read-production-convergence-20260927
    paths:
      - .github/workflows/cognitive-read-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-read-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Repair evidence gate and refresh locked Rust candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/cognitive_read_evidence.py")
          body = path.read_text(encoding="utf-8")
          old = '''            runner_lines = log.read_text(errors="replace").splitlines()
            first_line = runner_lines[0].strip() if runner_lines else ""
'''
          new = '''            runner_lines = log.read_text(errors="replace").splitlines()
            first_line = runner_lines[0].strip() if len(runner_lines) == 1 else ""
'''
          if body.count(old) != 1:
              raise SystemExit("pinned nextest gate source shape drifted")
          path.write_text(body.replace(old, new), encoding="utf-8")
          PY
          python3 -m unittest scripts/test_cognitive_read_native_gate.py
          cargo metadata \
            --manifest-path codex-rs/Cargo.toml \
            --format-version=1 \
            --all-features \
            --filter-platform x86_64-unknown-linux-gnu >/dev/null
          cargo metadata \
            --manifest-path codex-rs/Cargo.toml \
            --format-version=1 \
            --all-features \
            --filter-platform aarch64-unknown-linux-gnu >/dev/null
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check
          mkdir -p "$RUNNER_TEMP/cognitive-read-refresh"
          git diff --binary > "$RUNNER_TEMP/cognitive-read-refresh/refresh.patch"
          git diff --name-only > "$RUNNER_TEMP/cognitive-read-refresh/changed-files.txt"
          while IFS= read -r path; do
            test -n "$path" || continue
            mkdir -p "$RUNNER_TEMP/cognitive-read-refresh/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/cognitive-read-refresh/$path"
          done < "$RUNNER_TEMP/cognitive-read-refresh/changed-files.txt"
          test -s "$RUNNER_TEMP/cognitive-read-refresh/refresh.patch"

      - name: Upload refresh payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-read-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/cognitive-read-refresh
          if-no-files-found: error
          retention-days: 7
