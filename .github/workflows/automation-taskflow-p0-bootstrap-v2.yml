name: automation-taskflow-p0-bootstrap-v2

on:
  push:
    branches:
      - work/automation-taskflow-v19-runtime-closure
    paths:
      - .github/workflows/automation-taskflow-p0-bootstrap-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-taskflow-p0-qualification
  cancel-in-progress: true

jobs:
  qualify-p0:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out latest work branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-v19-runtime-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582

      - name: Normalize exact automation source metadata
        shell: bash
        env:
          P0_SOURCE_SHA: fdcc0a457fdf608ef186e7ff4e7608a9720521ff
        run: |
          set -euo pipefail
          git config user.name "Hepta Automation CI"
          git config user.email "hepta-automation-ci@users.noreply.github.com"
          python3 scripts/apply_automation_taskflow_p0_wrapper.py metadata \
            --source-sha "$P0_SOURCE_SHA"
          rm -f qualification/automation-taskflow-p0-diagnostic.txt
          git diff --check
          git add -A \
            docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json \
            qualification/automation-taskflow-p0-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs(automation): normalize schema-v19 source observation [automation-p0-v2]"
            git push origin HEAD:work/automation-taskflow-v19-runtime-closure
          fi

      - name: Rebind every affected implementation observation atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          affected: list[str] = []
          for path in sorted((root / "docs/modules").glob("*/IMPLEMENTATION_MAP.json")):
              row = json.loads(path.read_text(encoding="utf-8"))
              observed = row.get("observedAtHead")
              if not isinstance(observed, dict):
                  continue
              commit = observed.get("commit")
              if not isinstance(commit, str) or commit == head:
                  continue
              paths = row.get("observedSourcePaths", row.get("resolvedRoots", []))
              if isinstance(paths, str):
                  paths = [paths]
              if not isinstance(paths, list) or not paths:
                  continue
              command = ["git", "diff", "--quiet", commit, head, "--", *paths]
              completed = subprocess.run(command, check=False)
              if completed.returncode == 1:
                  module = row.get("module")
                  if not isinstance(module, str) or not module:
                      raise SystemExit(f"invalid module identity in {path}")
                  affected.append(module)
              elif completed.returncode != 0:
                  raise SystemExit(f"cannot compare observed source for {path}")

          print(json.dumps({"affectedModules": affected}, sort_keys=True))
          if affected:
              command = ["python3", "scripts/hepta-implementation-maps.py", "migrate"]
              for module in affected:
                  command.extend(["--module", module])
              subprocess.run(command, check=True)
          PY
          git diff --check
          git add docs/modules/*/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(lane-b): rebind affected exact source observations"
            git push origin HEAD:work/automation-taskflow-v19-runtime-closure
          fi

      - name: Generate and commit Lane B truth from clean observations
        shell: bash
        run: |
          set -uo pipefail
          LOG="qualification/automation-taskflow-p0-diagnostic.txt"
          TMP_LOG="$(mktemp)"
          set +e
          python3 scripts/hepta-lane-b-truth.py generate > "$TMP_LOG" 2>&1
          truth_status=$?
          set -e
          if [ "$truth_status" -ne 0 ]; then
            {
              echo "candidate_head=$(git rev-parse HEAD)"
              echo "truth_status=$truth_status"
              cat "$TMP_LOG"
              echo "--- git status ---"
              git status --short
              echo "--- diff check ---"
              git diff --check || true
            } > "$LOG"
            git add "$LOG"
            git commit -m "ci(automation): record generated-truth diagnostic" || true
            git push origin HEAD:work/automation-taskflow-v19-runtime-closure
            exit 1
          fi
          rm -f "$LOG"
          git diff --check
          git add -A \
            qualification/lane-b/LANE_B_NATIVE_CLOSURE.md \
            qualification/lane-b/TEST_TRACEABILITY.json \
            qualification/lane-b/IMPLEMENTATION_TRUTH.json \
            qualification/automation-taskflow-p0-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs(automation): regenerate Lane B truth [automation-p0-v2]"
            git push origin HEAD:work/automation-taskflow-v19-runtime-closure
          fi

      - name: Verify P0 truth and privileged callers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_automation_taskflow_schema.py
          python3 -m unittest scripts/test_automation_taskflow_schema.py
          python3 scripts/verify_hepta_callers.py self-test
          python3 scripts/verify_hepta_callers.py verify
          python3 scripts/hepta-lane-b-truth.py self-test
          python3 -m unittest scripts/test_hepta_lane_b_truth.py
          python3 scripts/hepta-lane-b-truth.py verify
          git diff --check

      - name: Format compile and strict lint P0 owners
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd -- --check
          cargo check -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd
          cargo clippy -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd --all-targets -- -D warnings

      - name: Test durable TaskFlow and Agentd product effect path
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-hepta-operations
          cargo test -p codex-hepta-automation --test durable_causal_chain
          cargo test -p codex-hepta-automation
          cargo test -p codex-hepta-automation --features taskflow-structural-qualification
          cargo test -p codex-hepta-agentd --lib automation_effect_host
          cargo test -p codex-hepta-agentd --lib automation

      - name: Assert qualified branch is clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
