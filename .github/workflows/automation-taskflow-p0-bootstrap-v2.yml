name: automation-taskflow-p0-bootstrap-v2

on:
  push:
    branches:
      - work/automation-taskflow-v19-runtime-closure
    paths:
      - .github/workflows/automation-taskflow-p0-bootstrap-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-taskflow-p0-diagnostic
  cancel-in-progress: true

jobs:
  diagnose-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out latest work branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-v19-runtime-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Capture metadata and truth diagnostics
        shell: bash
        env:
          P0_SOURCE_SHA: fdcc0a457fdf608ef186e7ff4e7608a9720521ff
        run: |
          set -uo pipefail
          git config user.name "Hepta Automation CI"
          git config user.email "hepta-automation-ci@users.noreply.github.com"
          mkdir -p qualification
          LOG="qualification/automation-taskflow-p0-diagnostic.txt"
          : > "$LOG"
          {
            echo "candidate_head=$(git rev-parse HEAD)"
            echo "source_sha=$P0_SOURCE_SHA"
            echo "--- metadata ---"
          } >> "$LOG"

          set +e
          python3 scripts/apply_automation_taskflow_p0_wrapper.py metadata \
            --source-sha "$P0_SOURCE_SHA" >> "$LOG" 2>&1
          metadata_status=$?
          echo "metadata_status=$metadata_status" >> "$LOG"

          truth_status=99
          if [ "$metadata_status" -eq 0 ]; then
            echo "--- lane-b truth generate ---" >> "$LOG"
            python3 scripts/hepta-lane-b-truth.py generate >> "$LOG" 2>&1
            truth_status=$?
          else
            echo "truth generation skipped after metadata failure" >> "$LOG"
          fi
          echo "truth_status=$truth_status" >> "$LOG"
          echo "--- git status ---" >> "$LOG"
          git status --short >> "$LOG" 2>&1
          echo "--- diff check ---" >> "$LOG"
          git diff --check >> "$LOG" 2>&1
          diff_status=$?
          echo "diff_status=$diff_status" >> "$LOG"
          set -e

          git add "$LOG"
          git commit -m "ci(automation): record P0 metadata diagnostic"
          git push origin HEAD:work/automation-taskflow-v19-runtime-closure
