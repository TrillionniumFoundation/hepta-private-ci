name: Intelligence remediation workspace

on:
  push:
    branches: [codex/intelligence-control-remediation-20260927]

permissions:
  contents: read

jobs:
  source-workspace:
    name: Exact intelligence source workspace
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/intelligence-workspace"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/intelligence-workspace/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/intelligence-workspace/identity.txt"
          sha256sum "$RUNNER_TEMP/intelligence-workspace/source.tar.gz" > "$RUNNER_TEMP/intelligence-workspace/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-source-${{ github.sha }}
          path: ${{ runner.temp }}/intelligence-workspace/*
          if-no-files-found: error
          retention-days: 3
