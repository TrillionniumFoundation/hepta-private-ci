name: Temporary intuition lock refresh

on:
  push:
    branches:
      - fix/intuition-policy-production-closure
    paths:
      - codex-rs/hepta-intuition/Cargo.toml
      - .github/workflows/intuition-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: temporary-intuition-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh lock graph without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 > /dev/null
          if git diff --quiet -- codex-rs/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git diff --check -- codex-rs/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock
          git commit -m "chore: refresh lockfile for intuition qualification"
          git push origin HEAD:fix/intuition-policy-production-closure
