name: Hepta Maintained YAML Dependency Security Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'qualification/security/check_yaml_lock_migration.py'
      - 'qualification/security/test_yaml_lock_migration.py'
      - '.github/workflows/hepta-serde-yaml-security-migration.yml'

permissions:
  contents: read

jobs:
  lock-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install pinned Rust and check version
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cargo +1.95.0 --version
          python3 --version
      - name: Offline adversarial audit of the migration gate
        run: |
          PYTHONPATH=qualification/security python3 -m unittest discover \
            -s qualification/security -p 'test_yaml_lock_migration.py' -v
      - name: Produce old Cargo.lock from exact pre-PR base
        run: |
          git show HEAD^1:codex-rs/Cargo.lock > "${RUNNER_TEMP}/cargo-lock-before.toml"
          test -s "${RUNNER_TEMP}/cargo-lock-before.toml"
      - name: Resolve exact maintained YAML shim without touching production lock
        run: |
          # This only generates a candidate lock in the CI checkout.
          # It does not commit or overwrite the protected target branch.
          cargo +1.95.0 update --manifest-path codex-rs/Cargo.toml --workspace
          test -s codex-rs/Cargo.lock
      - name: Verify exactly scoped removal of archived unsafe YAML dependency
        run: |
          python3 qualification/security/check_yaml_lock_migration.py \
            --before "${RUNNER_TEMP}/cargo-lock-before.toml" \
            --after codex-rs/Cargo.lock \
            --manifest codex-rs/Cargo.toml \
            --output "${RUNNER_TEMP}/yaml-lock-migration-evidence.json"
          cargo +1.95.0 metadata --locked --no-deps --format-version 1 \
            --manifest-path codex-rs/Cargo.toml > "${RUNNER_TEMP}/yaml-cargo-metadata.json"
      - name: Test real YAML consumer crates with generated candidate lock
        working-directory: codex-rs
        run: |
          cargo +1.95.0 test --locked \
            -p codex-skills -p codex-skills-extension \
            -p codex-core-plugins -p codex-external-agent-migration --lib
          cargo +1.95.0 clippy --locked \
            -p codex-skills -p codex-skills-extension \
            -p codex-core-plugins -p codex-external-agent-migration \
            --all-targets -- -D warnings
      - name: Export exact audited Cargo.lock bytes for controlled branch commit
        # The only emitted bytes are the public dependency lock manifest.
        # No token, env value, model weight, source file or credential is read.
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          raw = Path("codex-rs/Cargo.lock").read_bytes()
          encoded = base64.b64encode(raw).decode("ascii")
          print(f"HEPTA_YAML_LOCK_BEGIN|{len(raw)}|{hashlib.sha256(raw).hexdigest()}")
          for offset in range(0, len(encoded), 3072):
              print(f"HEPTA_YAML_LOCK_CHUNK|{offset//3072:06d}|{encoded[offset:offset+3072]}")
          print(f"HEPTA_YAML_LOCK_END|{len(raw)}|{hashlib.sha256(raw).hexdigest()}")
          PY
      - name: Retain candidate lock and audit as non-production artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yaml-lock-candidate-${{ github.sha }}
          path: |
            codex-rs/Cargo.lock
            ${{ runner.temp }}/yaml-lock-migration-evidence.json
          if-no-files-found: warn
          retention-days: 14
