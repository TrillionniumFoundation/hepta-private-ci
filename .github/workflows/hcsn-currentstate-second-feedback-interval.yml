name: hcsn-currentstate-second-feedback-interval

on:
  pull_request:
    paths:
      - ".github/workflows/hcsn-currentstate-second-feedback-interval.yml"
      - "qualification/hcsn_currentstate_second_feedback_interval/**"
      - "qualification/hcsn_currentstate_hit_delay_reset_interval/**"
      - "qualification/hcsn_currentstate_scheduled_reset_interval/**"
      - "qualification/hcsn_currentstate_augmented_selector_interval/**"
      - "qualification/hcsn_currentstate_n256_non_substochastic_signed_interval/**"

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assertions-enabled second-feedback fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_second_feedback_interval.test_second_feedback
      - name: Optimized-mode second-feedback fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_second_feedback_interval.test_second_feedback
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_second_feedback_interval/*.py
      - name: Verify frozen source and fail-closed gates
        run: python3 qualification/hcsn_currentstate_second_feedback_interval/verify_source.py
