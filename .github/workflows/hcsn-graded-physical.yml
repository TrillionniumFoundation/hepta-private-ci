name: HCSN graded physical derivatives and replay
on:
  pull_request:
    paths:
      - qualification/hcsn_joint_dde/sensitivities.py
      - qualification/hcsn_joint_dde/graded_sensitivities.py
      - qualification/hcsn_joint_dde/test_graded_sensitivities.py
      - qualification/hcsn_joint_dde/torch_physical.py
      - qualification/hcsn_joint_dde/native_gradient_probe.py
      - qualification/hcsn_graded/model.py
      - qualification/hcsn_graded/spatial.py
      - .github/workflows/hcsn-graded-physical.yml
permissions:
  contents: read
jobs:
  graded-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -B -m unittest qualification.hcsn_joint_dde.test_sensitivities qualification.hcsn_joint_dde.test_graded_sensitivities -v
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -B -m qualification.hcsn_joint_dde.native_gradient_probe probe --geometry graded --output "$RUNNER_TEMP/graded-physical"
      - run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: graded-physical-original-replay
          path: ${{ runner.temp }}/graded-physical
          if-no-files-found: error
