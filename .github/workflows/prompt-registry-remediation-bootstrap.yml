name: prompt.registry remediation bootstrap

on:
  push:
    branches:
      - codex/prompt-registry-full-remediation-v4
    paths:
      - .github/workflows/prompt-registry-remediation-bootstrap.yml
      - scripts/.prompt_registry_remediation_bootstrap.py.gz

permissions:
  contents: write

concurrency:
  group: prompt-registry-remediation-bootstrap
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Materialize deterministic remediation program
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc scripts/.prompt_registry_remediation_bootstrap.py.gz > scripts/.prompt_registry_remediation_bootstrap.py
          chmod 0755 scripts/.prompt_registry_remediation_bootstrap.py
          sha256sum scripts/.prompt_registry_remediation_bootstrap.py
          test "$(sha256sum scripts/.prompt_registry_remediation_bootstrap.py | cut -d' ' -f1)" = "6accc7018a21a1cf8ede4d6bc1e39775fc84c788b92317c57b1ad8e22b236aff"
      - name: Apply deterministic prompt.registry remediation
        run: python3 scripts/.prompt_registry_remediation_bootstrap.py
      - name: Remove bootstrap payload
        run: rm -f scripts/.prompt_registry_remediation_bootstrap.py.gz
      - name: Format changed Rust packages
        run: cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-prompt-registry --package codex-hepta-prompt-optimizer
      - name: Refresh exact source identities
        run: |
          python3 scripts/hepta-prompt-registry-implementation-map.py
          python3 scripts/hepta-prompt-registry-implementation-map.py --check
          python3 scripts/hepta-prompt-registry-validate.py
          git diff --check
      - name: Compile V4 registry and graph tests
        working-directory: codex-rs
        run: cargo test -p codex-hepta-prompt-registry -p codex-hepta-prompt-optimizer --no-run
      - name: Commit remediation source
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "bootstrap produced no changes" >&2
            exit 1
          }
          git commit -m "prompt.registry: establish V4 durable relation baseline"
          git push origin HEAD:codex/prompt-registry-full-remediation-v4
