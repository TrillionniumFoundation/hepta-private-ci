      - name: Apply deterministic prompt.registry remediation
        run: python3 scripts/.prompt_registry_remediation_bootstrap.py
      - name: Format changed Rust packages
        run: |
          cargo fmt --manifest-path codex-rs/Cargo.toml             --package codex-hepta-prompt-registry             --package codex-hepta-prompt-optimizer
      - name: Refresh exact source identities
        run: |
          python3 scripts/hepta-prompt-registry-implementation-map.py
          python3 scripts/hepta-prompt-registry-implementation-map.py --check
          python3 scripts/hepta-prompt-registry-validate.py
          git diff --check
      - name: Compile V4 registry and graph tests
        working-directory: codex-rs
        run: cargo test -p codex-hepta-prompt-registry -p codex-hepta-prompt-optimizer --no-run
      - name: Commit remediation source
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "bootstrap produced no changes" >&2
            exit 1
          }
          git commit -m "prompt.registry: establish V4 durable relation baseline"
          git push origin HEAD:codex/prompt-registry-full-remediation-v4
