name: Apply context.compiler foundation closure

on:
  push:
    branches:
      - work/context-compiler-v2-closure-20260927
    paths:
      - scripts/apply-context-compiler-foundation.py.gz.b64
      - codex-rs/hepta-context-compiler/src/product.rs
      - codex-rs/hepta-intelligence/src/prompt_delivery_v3.rs
      - codex-rs/hepta-intelligence/src/prompt_delivery_v3_tests.rs
      - .github/workflows/context-compiler-foundation-apply.yml

permissions:
  contents: write

concurrency:
  group: context-compiler-foundation-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on:
      group: trillionnium-android-gpu
      labels: [self-hosted, linux, x64]
    timeout-minutes: 90
    steps:
      - name: Check out closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/context-compiler-v2-closure-20260927
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Decode and verify guarded patcher
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode scripts/apply-context-compiler-foundation.py.gz.b64 | gzip --decompress > /tmp/apply-context-compiler-foundation.py
          test "$(sha256sum /tmp/apply-context-compiler-foundation.py | cut -d' ' -f1)" = "79cb899f1318ec54f2a3c31575ff6bbbb0578d966f520fde5cf292e2898e1b5e"
          python3 -m py_compile /tmp/apply-context-compiler-foundation.py
      - name: Apply guarded source edits
        run: python3 /tmp/apply-context-compiler-foundation.py
      - name: Format closure crates
        working-directory: codex-rs
        run: |
          cargo fmt --package codex-hepta-context-compiler
          cargo fmt --package codex-hepta-intelligence
      - name: Check closure crates
        working-directory: codex-rs
        run: |
          cargo check --locked -p codex-hepta-context-compiler --all-targets
          cargo check --locked -p codex-hepta-intelligence --all-targets
      - name: Strict lint closure crates
        working-directory: codex-rs
        run: |
          cargo clippy --locked -p codex-hepta-context-compiler --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-intelligence --all-targets -- -D warnings
      - name: Test closure crates
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-context-compiler
          cargo test --locked -p codex-hepta-intelligence
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit foundation closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Context Compiler Closure Bot"
          git config user.email "hepta-context-compiler-closure@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat(context.compiler): bind typed serialization and product V3"
          git push origin HEAD:work/context-compiler-v2-closure-20260927
