name: hcsn-currentstate-n256-fp64-input-conversion

on:
  pull_request:
    paths:
      - ".github/workflows/hcsn-currentstate-n256-fp64-input-conversion.yml"
      - "qualification/hcsn_currentstate_n256_fp64_input_conversion/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assertions-enabled fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_fp64_input_conversion.test_fp64_exact
      - name: Optimized-mode fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_fp64_input_conversion.test_fp64_exact
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_fp64_input_conversion/*.py
      - name: Verify frozen source and zero-execution ledger
        run: python3 qualification/hcsn_currentstate_n256_fp64_input_conversion/verify_source.py
