name: Hepta Core Response Stream Windows API Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codex-rs/core/src/client.rs'
      - 'codex-rs/core/src/client_tests.rs'
      - '.github/workflows/hepta-core-response-map-contract.yml'

permissions:
  contents: read

jobs:
  response-stream-test-compilation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Assert codex-core formatting without Windows workspace argument overflow
        run: cargo +1.95.0 fmt -p codex-core -- --check
      - name: Compile codex-core including test targets on actual host OS
        run: cargo +1.95.0 check --locked -p codex-core --tests
