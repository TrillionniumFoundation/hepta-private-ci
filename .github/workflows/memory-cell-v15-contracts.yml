name: Memory cell V15 reference contracts

on:
  push:
    branches:
      - research/memory-cell-v15-20261104
      - research/memory-v15-native-transfer-20261105-728b
    paths:
      - 'qualification/memory-cell-v15/**.py'
      - 'qualification/memory-cell-v15/requirements.txt'
      - 'qualification/memory-cell-v15/device_qualification/**'
      - 'qualification/memory-cell-v15/native-transfer/**'
      - '.github/workflows/memory-cell-v15-contracts.yml'

permissions:
  contents: read

concurrency:
  group: memory-v15-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: qualification/memory-cell-v15
      - name: Install the recorded reference dependency
        run: |
          python3 -m venv /tmp/memory-v15-env
          /tmp/memory-v15-env/bin/python -m pip install -r qualification/memory-cell-v15/requirements.txt
      - name: Run actual bounded protocol checks
        timeout-minutes: 3
        run: /tmp/memory-v15-env/bin/python qualification/memory-cell-v15/verify.py
      - name: Independently verify the preserved two-host signatures and results
        run: |
          /tmp/memory-v15-env/bin/python qualification/memory-cell-v15/device_qualification/verify_receipts.py \
            --output qualification/memory-cell-v15/device_qualification/review_checks.json
      - name: Install the pinned native transition toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Compare native migration transitions with signed reference requests
        timeout-minutes: 3
        run: |
          native=qualification/memory-cell-v15/native-transfer
          evidence=/tmp/memory-v15-native
          mkdir -p "$evidence"
          /tmp/memory-v15-env/bin/python "$native/differential.py" generate "$evidence"
          rustfmt +1.95.0 --check --edition 2024 "$native/transfer.rs" "$native/runner.rs"
          rustc +1.95.0 --version > "$evidence/rustc.txt"
          rustc +1.95.0 --edition=2024 -Dwarnings -O "$native/runner.rs" -o "$evidence/runner"
          "$evidence/runner" < "$evidence/commands.txt" > "$evidence/actual.txt"
          /tmp/memory-v15-env/bin/python "$native/differential.py" compare "$evidence" --actual "$evidence/actual.txt"
      - name: Preserve exact-source check receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-v15-reference-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification/memory-cell-v15/evidence/checks.json
            qualification/memory-cell-v15/evidence/checks.log
            qualification/memory-cell-v15/device_qualification/review_checks.json
            /tmp/memory-v15-native/*.txt
            /tmp/memory-v15-native/*.json
          if-no-files-found: error
          retention-days: 30
