name: Kernel authority status projections

on:
  push:
    branches:
      - main
      - work/kernel-authority-convergence-20260925
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'CALLERS.toml'
      - 'CODEOWNERS'
      - 'MODULES.toml'
      - 'codex-rs/**'
      - 'docs/**'
      - 'qualification/**'
      - 'qa/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'CALLERS.toml'
      - 'CODEOWNERS'
      - 'MODULES.toml'
      - 'codex-rs/**'
      - 'docs/**'
      - 'qualification/**'
      - 'qa/**'
      - 'scripts/**'
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-authority-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Generated truth and closed API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify canonical generated status projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kernel_authority_status.py check
          python3 qualification/kernel-authority/generate_status.py --check
      - name: Verify closed authority API inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/b4-no-bypass/test_kernel_authority_extension_api.py -v
          python3 qa/b4-no-bypass/test_kernel_authority_closed_world.py -v
      - name: Verify qualification regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/kernel-authority -p 'test_*.py' -v
      - name: Verify clean source identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
