name: intelligence.control native diagnostics

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-infer-worker-host/**'
      - 'codex-rs/hepta-operations/**'
      - 'codex-rs/hepta-learning-ledger/**'
      - 'scripts/hepta-intelligence-*.py'
      - '.github/workflows/hepta-intelligence-*.yml'

permissions:
  contents: read

concurrency:
  group: intelligence-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEPTA_CI_LANE: source-head
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  native-diagnostics:
    # Supplementary source diagnostics, not a substitute for Linux source-head,
    # synthetic-merge or selected target-host qualification.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain reproducible committed source before native diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          out="$RUNNER_TEMP/intelligence-diagnostic-source"
          mkdir -p "$out"
          git archive --format=tar.gz --output="$out/source.tar.gz" HEAD
          git cat-file commit HEAD > "$out/commit.txt"
          git rev-parse HEAD > "$out/source-sha.txt"
          git rev-parse HEAD^{tree} > "$out/source-tree.txt"
          printf '%s\n' "$BASE_SHA" > "$out/base-sha.txt"
          (cd "$out" && shasum -a 256 source.tar.gz commit.txt source-sha.txt source-tree.txt base-sha.txt > SHA256SUMS)
      - name: Retain credential-free source identity with the diagnostic run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-diagnostic-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intelligence-diagnostic-source/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Bind exact diagnostic source and install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          printf 'TESTED_SHA=%s\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/intelligence-diagnostic-target" >> "$GITHUB_ENV"
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$VERSION" --profile minimal --component rustfmt --component clippy
      - name: Diagnose formatting without suppressing failure
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/fmt.json"
          -- cargo fmt --all -- --check
      - name: Execute canonical and operation-owner regressions
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/owner-tests.json"
          -- cargo test --locked -p codex-hepta-intelligence -p codex-hepta-operations
      - name: Install DotSlash
        if: ${{ !cancelled() }}
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Resolve verified native V8 prerequisites
        if: ${{ !cancelled() }}
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Execute default Agentd intelligence regressions
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/agentd-tests.json"
          -- cargo test --locked -p codex-hepta-agentd --lib intelligence_
      - name: Compile all default Agentd targets
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/agentd-check.json"
          -- cargo check --locked -p codex-hepta-agentd --all-targets
      - name: Preserve strict lint diagnostics
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/clippy.json"
          -- cargo clippy --locked -p codex-hepta-intelligence
          -p codex-hepta-operations -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Produce formatter patch outside the executed checkout
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          work="$RUNNER_TEMP/intelligence-format-worktree"
          git worktree add --detach "$work" "$SOURCE_SHA"
          (cd "$work/codex-rs" && cargo fmt --all)
          mkdir -p "$RUNNER_TEMP/intelligence-diagnostic-records"
          git -C "$work" diff --binary > "$RUNNER_TEMP/intelligence-diagnostic-records/format.patch"
          git -C "$work" diff --stat
          cat "$RUNNER_TEMP/intelligence-diagnostic-records/format.patch"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
      - name: Retain command records including every failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intelligence-diagnostic-records/*
          if-no-files-found: error
          retention-days: 14

  materialize-reviewed-closure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/intelligence-control-product-closure-20260926'
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and materialize reviewed closure as an isolated commit
        shell: bash
        env:
          EXPECTED_SOURCE_PARENT: 64580d8bcb0785567569d55f7993a26daf2ac4df
          EXPECTED_PATCH_SHA256: 851c60e292318b61cbee37e753c0bcdc5f93388cf1757b2a4edf7e95245c4f92
          MATERIALIZED_BRANCH: codex/intelligence-control-closure-materialized-20260929
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_PARENT" HEAD
          unexpected="$({
            git diff --name-only "$EXPECTED_SOURCE_PARENT"..HEAD \
              | grep -Ev '^\.github/(intelligence-control-closure\.patch\.part-[0-9][0-9]|workflows/intelligence-control-apply-closure\.yml|workflows/hepta-intelligence-diagnostics\.yml)$'
          } || true)"
          test -z "$unexpected" || {
            printf 'unexpected transport commit paths:\n%s\n' "$unexpected" >&2
            exit 1
          }
          cat .github/intelligence-control-closure.patch.part-* > "$RUNNER_TEMP/intelligence-control-closure.patch"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$RUNNER_TEMP/intelligence-control-closure.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/intelligence-control-closure.patch"
          git apply --index "$RUNNER_TEMP/intelligence-control-closure.patch"
          git rm -f .github/intelligence-control-closure.patch.part-* \
            .github/workflows/intelligence-control-apply-closure.yml
          git checkout "$EXPECTED_SOURCE_PARENT" -- .github/workflows/hepta-intelligence-diagnostics.yml
          git diff --cached --check
          python3 scripts/hepta-intelligence-control-status.py --check-tracked
          python3 scripts/hepta-intelligence-control-status-tests.py
          python3 scripts/hepta-intelligence-acceptance.py --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(intelligence-control): close qualification and recovery gaps"
          final_sha="$(git rev-parse HEAD)"
          git push --force origin "HEAD:refs/heads/${MATERIALIZED_BRANCH}"
          printf 'materialized_sha=%s\n' "$final_sha"
