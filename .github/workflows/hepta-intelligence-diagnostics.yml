name: intelligence.control native diagnostics

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-operations/**'
      - 'codex-rs/hepta-learning-ledger/**'
      - 'scripts/hepta-intelligence-*.py'
      - '.github/workflows/hepta-intelligence-*.yml'

permissions:
  contents: read

concurrency:
  group: intelligence-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEPTA_CI_LANE: source-head
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  native-diagnostics:
    # Supplementary source diagnostics, not a substitute for Linux source-head,
    # synthetic-merge or selected target-host qualification.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact diagnostic source and install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          printf 'TESTED_SHA=%s\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/intelligence-diagnostic-target" >> "$GITHUB_ENV"
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$VERSION" --profile minimal --component rustfmt --component clippy
      - name: Diagnose formatting without suppressing failure
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/fmt.json"
          -- cargo fmt --all -- --check
      - name: Execute canonical and operation-owner regressions
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/owner-tests.json"
          -- cargo test --locked -p codex-hepta-intelligence -p codex-hepta-operations
      - name: Install DotSlash
        if: ${{ !cancelled() }}
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Resolve verified native V8 prerequisites
        if: ${{ !cancelled() }}
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Execute default Agentd intelligence regressions
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/agentd-tests.json"
          -- cargo test --locked -p codex-hepta-agentd --lib intelligence_
      - name: Compile all default Agentd targets
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/agentd-check.json"
          -- cargo check --locked -p codex-hepta-agentd --all-targets
      - name: Preserve strict lint diagnostics
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-diagnostic-records/clippy.json"
          -- cargo clippy --locked -p codex-hepta-intelligence
          -p codex-hepta-operations -p codex-hepta-agentd --all-targets -- -D warnings
      - name: Produce formatter patch outside the executed checkout
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          work="$RUNNER_TEMP/intelligence-format-worktree"
          git worktree add --detach "$work" "$SOURCE_SHA"
          (cd "$work/codex-rs" && cargo fmt --all)
          mkdir -p "$RUNNER_TEMP/intelligence-diagnostic-records"
          git -C "$work" diff --binary > "$RUNNER_TEMP/intelligence-diagnostic-records/format.patch"
          git -C "$work" diff --stat
          cat "$RUNNER_TEMP/intelligence-diagnostic-records/format.patch"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
      - name: Retain command records including every failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intelligence-diagnostic-records/*
          if-no-files-found: error
          retention-days: 14

  offline-authoring-inputs:
    # Input export only, never a source-head/merge pass or an automatic edit.
    # Bounded to the current remediation PR; no credentials or .git/config leave CI.
    if: github.event.pull_request.number == 1022
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact committed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          out="$RUNNER_TEMP/intelligence-inputs"
          mkdir -p "$out"
          git archive --format=tar.gz --output="$out/source.tar.gz" HEAD
          printf '%s\n' "$SOURCE_SHA" > "$out/source-sha.txt"
          git rev-parse HEAD^{tree} > "$out/source-tree.txt"
          shasum -a 256 "$out/source.tar.gz" > "$out/source.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-authoring-source-${{ github.run_id }}
          path: ${{ runner.temp }}/intelligence-inputs/source*
          compression-level: 0
          retention-days: 3
      - name: Export pinned Linux compiler independently of lock resolution
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$VERSION" --profile minimal --component rustfmt --component clippy
          rustup toolchain install "$VERSION-x86_64-unknown-linux-gnu" --force-non-host --profile minimal --component rustfmt --component clippy
          out="$RUNNER_TEMP/intelligence-inputs"
          tar -C "$HOME/.rustup/toolchains/$VERSION-x86_64-unknown-linux-gnu" -czf "$out/compiler.tar.gz" .
          shasum -a 256 "$out/compiler.tar.gz" > "$out/compiler.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-authoring-compiler-${{ github.run_id }}
          path: ${{ runner.temp }}/intelligence-inputs/compiler*
          compression-level: 0
          retention-days: 3
      - name: Diagnose lock repair in an isolated unqualified worktree
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/intelligence-input-worktree"
          out="$RUNNER_TEMP/intelligence-inputs"
          git worktree add --detach "$work" "$SOURCE_SHA"
          printf '%s\n' 'Unqualified dependency repair suggestion; original exact-source checks are unchanged.' > "$out/lock-SCOPE.txt"
          (cd "$work/codex-rs" && cargo update --workspace) > "$out/lock-resolution.log" 2>&1
          git -C "$work" diff --binary -- codex-rs/Cargo.lock > "$out/lock.patch"
          cp "$work/codex-rs/Cargo.lock" "$out/Cargo.lock"
          (cd "$work/codex-rs" && cargo vendor --locked --versioned-dirs "$out/vendor") > "$out/offline-config.toml" 2> "$out/vendor.log"
          tar -C "$out" -czf "$out/dependencies.tar.gz" vendor offline-config.toml Cargo.lock
          shasum -a 256 "$out/dependencies.tar.gz" > "$out/dependencies.sha256"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intelligence-authoring-lock-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/intelligence-inputs/lock*
            ${{ runner.temp }}/intelligence-inputs/Cargo.lock
            ${{ runner.temp }}/intelligence-inputs/vendor.log
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: intelligence-authoring-dependencies-${{ github.run_id }}
          path: ${{ runner.temp }}/intelligence-inputs/dependencies*
          compression-level: 0
          retention-days: 3
