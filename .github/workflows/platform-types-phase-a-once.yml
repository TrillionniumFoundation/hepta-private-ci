name: platform.types phase A one-shot convergence

on:
  push:
    branches:
      - codex/platform-types-full-convergence-20260925
    paths:
      - scripts/platform_types_phase_a.py
      - .github/workflows/platform-types-phase-a-once.yml

permissions:
  contents: write

concurrency:
  group: platform-types-phase-a-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/platform-types-full-convergence-20260925
          fetch-depth: 0

      - name: Apply deterministic phase-A patch
        run: |
          set +e
          rm -rf .hepta-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/platform_types_phase_a.py")
          text = path.read_text(encoding="utf-8")
          old = '''for json_path, key in (
              ("docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json", "modules"),
              ("docs/lane-a-foundation/PROTOCOL_REGISTRY_V1.json", "protocols"),
          ):
              value = load_json(json_path)
              rows = value[key]
              by_name = {row["module"]: row for row in rows}
              if set(by_name) != set(expected_modules) or len(rows) != len(expected_modules):
                  raise RuntimeError(f"{json_path}: unexpected Lane-A module set")
              value[key] = [by_name[name] for name in expected_modules]
              save_json(json_path, value)
          '''
          new = '''matrix_path = "docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json"
          matrix_value = load_json(matrix_path)
          matrix_rows = matrix_value["modules"]
          matrix_by_name = {row["module"]: row for row in matrix_rows}
          if set(matrix_by_name) != set(expected_modules) or len(matrix_rows) != len(expected_modules):
              raise RuntimeError(f"{matrix_path}: unexpected Lane-A module set")
          matrix_value["modules"] = [matrix_by_name[name] for name in expected_modules]
          save_json(matrix_path, matrix_value)

          protocol_path = "docs/lane-a-foundation/PROTOCOL_REGISTRY_V1.json"
          protocol_value = load_json(protocol_path)
          protocol_rows = protocol_value["protocols"]
          module_rank = {module: index for index, module in enumerate(expected_modules)}
          if {row["module"] for row in protocol_rows} != set(expected_modules):
              raise RuntimeError(f"{protocol_path}: unexpected Lane-A protocol module set")
          protocol_value["protocols"] = sorted(
              enumerate(protocol_rows),
              key=lambda item: (module_rank[item[1]["module"]], item[0]),
          )
          protocol_value["protocols"] = [row for _, row in protocol_value["protocols"]]
          save_json(protocol_path, protocol_value)
          '''
          if old not in text:
              raise SystemExit("phase-A protocol-order patch anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 -u scripts/platform_types_phase_a.py > phase-a.log 2>&1
          code=$?
          cat phase-a.log
          if [ "$code" -ne 0 ]; then
            mkdir -p .hepta-diagnostics
            cp phase-a.log .hepta-diagnostics/platform-types-phase-a.log
            git config user.name "Hepta Platform Types Convergence"
            git config user.email "hepta-platform-types@users.noreply.github.com"
            git add -f .hepta-diagnostics/platform-types-phase-a.log
            git commit -s -m "chore(platform.types): retain phase-A failure diagnostic"
            git push origin HEAD:codex/platform-types-full-convergence-20260925
            exit "$code"
          fi
          rm -f phase-a.log

      - name: Verify generated cross-language bindings
        run: |
          set -euo pipefail
          python3 codex-rs/hepta-types/bindings/generate_bindings.py --check
          python3 codex-rs/hepta-types/bindings/verify_generated.py
          node codex-rs/hepta-types/bindings/verify_generated.mjs
          python3 codex-rs/hepta-types/conformance/verify_vectors.py
          node --input-type=module < codex-rs/hepta-types/conformance/verify_vectors.ts
          python3 codex-rs/hepta-types/conformance/verify_rejections.py
          node codex-rs/hepta-types/conformance/verify_rejections.mjs

      - name: Verify Lane A truth and regressions
        run: |
          set +e
          {
            python3 scripts/verify_lane_a_foundation.py self-test
            python3 scripts/verify_lane_a_foundation.py verify
            python3 -m unittest qualification/module-execution-dossiers/test_lane_a_foundation.py
            (cd qualification/module-execution-dossiers && python3 -m unittest test_implementation_contracts.py)
            python3 scripts/hepta-implementation-maps.py verify
          } > lane-a.log 2>&1
          code=$?
          cat lane-a.log
          if [ "$code" -ne 0 ]; then
            mkdir -p .hepta-diagnostics
            cp lane-a.log .hepta-diagnostics/platform-types-lane-a.log
            git config user.name "Hepta Platform Types Convergence"
            git config user.email "hepta-platform-types@users.noreply.github.com"
            git add -f .hepta-diagnostics/platform-types-lane-a.log
            git commit -s -m "chore(platform.types): retain Lane A failure diagnostic"
            git push origin HEAD:codex/platform-types-full-convergence-20260925
            exit "$code"
          fi
          rm -f lane-a.log

      - name: Verify platform.types native package
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-types --all-targets
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-types --all-targets -- -D warnings
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-types -- --check

      - name: Commit verified phase-A result
        env:
          BRANCH: codex/platform-types-full-convergence-20260925
        run: |
          set -euo pipefail
          rm -rf .hepta-diagnostics
          rm scripts/platform_types_phase_a.py
          rm .github/workflows/platform-types-phase-a-once.yml
          git diff --check
          git config user.name "Hepta Platform Types Convergence"
          git config user.email "hepta-platform-types@users.noreply.github.com"
          git add -A
          git commit -s -m "fix(platform.types): close binding and Lane A truth blockers"
          git push origin "HEAD:${BRANCH}"
