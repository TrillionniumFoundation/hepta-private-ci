name: Hepta multimodal shared stem research contracts
on:
  push:
    branches: ["research/multimodal-stem-bridge-20261014"]
    paths:
      - "experiments/shared_stem_cell/multimodal_*.py"
      - "experiments/shared_stem_cell/test_multimodal_*.py"
      - "experiments/shared_stem_cell/MULTIMODAL_STEM_V0.md"
      - "experiments/shared_stem_cell/MULTIMODAL_ALIGNMENT_V1.md"
      - "experiments/shared_stem_cell/PINNED_ENCODER_INGRESS_V2.md"
      - ".github/workflows/hepta-multimodal-stem-contract.yml"
  pull_request:
    paths:
      - "experiments/shared_stem_cell/multimodal_*.py"
      - "experiments/shared_stem_cell/test_multimodal_*.py"
      - "experiments/shared_stem_cell/MULTIMODAL_STEM_V0.md"
      - "experiments/shared_stem_cell/MULTIMODAL_ALIGNMENT_V1.md"
      - "experiments/shared_stem_cell/PINNED_ENCODER_INGRESS_V2.md"
      - ".github/workflows/hepta-multimodal-stem-contract.yml"
permissions:
  contents: read
concurrency:
  group: multimodal-stem-${{ github.sha }}
  cancel-in-progress: false
jobs:
  reference-mechanics-only:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin CPU-only head test dependencies
        run: |
          set -euo pipefail
          python3 -m venv /tmp/hepta-multimodal-stem-venv
          /tmp/hepta-multimodal-stem-venv/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/hepta-multimodal-stem-venv/bin/pip install numpy==1.26.4 safetensors==0.6.2 cryptography==46.0.4 psutil==7.0.0 packaging==25.0
          /tmp/hepta-multimodal-stem-venv/bin/python -c 'import numpy, packaging.version, cryptography, psutil, safetensors.torch; print("MULTIMODAL_IMPORT_PREFLIGHT_OK")'
          /tmp/hepta-multimodal-stem-venv/bin/pip check
          /tmp/hepta-multimodal-stem-venv/bin/pip freeze > /tmp/hepta-multimodal-stem-environment.txt
      - name: Test frozen projection, feature reuse, scope fencing and local learning
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/shared_stem_cell /tmp/hepta-multimodal-stem-venv/bin/python -m unittest discover -s experiments/shared_stem_cell -p 'test_multimodal_*.py' -v
          /tmp/hepta-multimodal-stem-venv/bin/python -m py_compile experiments/shared_stem_cell/multimodal_bridge.py experiments/shared_stem_cell/multimodal_head.py experiments/shared_stem_cell/multimodal_alignment.py experiments/shared_stem_cell/multimodal_alignment_contract.py experiments/shared_stem_cell/multimodal_alignment_evaluator.py experiments/shared_stem_cell/multimodal_real_encoder.py experiments/shared_stem_cell/multimodal_real_encoder_evaluator.py experiments/shared_stem_cell/test_multimodal_real_encoder.py experiments/shared_stem_cell/test_multimodal_bridge.py experiments/shared_stem_cell/test_multimodal_head.py experiments/shared_stem_cell/test_multimodal_alignment.py
      - name: Require fail-closed offline pretrained ingress CLI surfaces
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/shared_stem_cell /tmp/hepta-multimodal-stem-venv/bin/python experiments/shared_stem_cell/multimodal_real_encoder.py --help > /tmp/encoder-train-cli-help.txt
          PYTHONPATH=experiments/shared_stem_cell /tmp/hepta-multimodal-stem-venv/bin/python experiments/shared_stem_cell/multimodal_real_encoder_evaluator.py --help > /tmp/encoder-future-cli-help.txt
          if grep -q future_targets /tmp/encoder-train-cli-help.txt; then echo 'train CLI exposes held-out future target mode' >&2; exit 1; fi
      - name: Emit source-disjoint toy alignment evidence with independent evaluator
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-multimodal-stem-artifact/toy
          PYTHONPATH=experiments/shared_stem_cell /tmp/hepta-multimodal-stem-venv/bin/python - <<'PYTOY'
          from pathlib import Path
          import subprocess, sys
          from test_multimodal_alignment import study
          from multimodal_alignment_contract import canonical, sha, load_pinned_document, write_new
          root = Path('experiments/shared_stem_cell')
          output = Path('/tmp/hepta-multimodal-stem-artifact/toy')
          examples = dict(zip(('train', 'future', 'targets'), study()))
          pins = {}
          for name, rows in examples.items():
              path = output/(name+'.jsonl')
              path.write_bytes(b''.join(canonical(row) for row in rows))
              pins[name] = sha(path.read_bytes())
          def run(*args):
              subprocess.run([sys.executable, str(root/args[0]), *args[1:]], check=True, timeout=60)
          run('multimodal_alignment.py', 'fit', '--train', str(output/'train.jsonl'),
              '--train-sha256', pins['train'], '--output', str(output/'fit.json'))
          fit = sha((output/'fit.json').read_bytes())
          run('multimodal_alignment.py', 'predict', '--fit', str(output/'fit.json'),
              '--fit-sha256', fit, '--future-inputs', str(output/'future.jsonl'),
              '--future-inputs-sha256', pins['future'], '--output', str(output/'predictions.json'))
          pred = sha((output/'predictions.json').read_bytes())
          run('multimodal_alignment_evaluator.py', '--predictions', str(output/'predictions.json'),
              '--predictions-sha256', pred, '--future-targets', str(output/'targets.jsonl'),
              '--future-targets-sha256', pins['targets'], '--output', str(output/'evaluation.json'))
          report = load_pinned_document(output/'evaluation.json', sha((output/'evaluation.json').read_bytes()))
          assert report['arms']['fitted']['mean_cosine'] > 0.999, 'toy fitted geometric control failed'
          assert report['arms']['rotated_target_control']['mean_cosine'] < -0.99, 'toy negative control failed'
          write_new(output/'disposition.json', {'schema':'hepta.stem-alignment.toy-disposition.v1',
              'model_weights_loaded':False,'real_multimodal_competence':False,
              'independent_semantic_utility':False,'production_accepted':False,
              'train_source_sha256':pins['train'],'future_source_sha256':pins['future'],
              'target_source_sha256':pins['targets'],'fit_artifact_sha256':fit,
              'predictions_sha256':pred,'evaluation_sha256':sha((output/'evaluation.json').read_bytes())})
          PYTOY
      - name: Preserve exact source identity
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-multimodal-stem-artifact
          git rev-parse HEAD > /tmp/hepta-multimodal-stem-artifact/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/hepta-multimodal-stem-artifact/source-tree.txt
          cp /tmp/hepta-multimodal-stem-environment.txt /tmp/hepta-multimodal-stem-artifact/environment.txt || true
          sha256sum experiments/shared_stem_cell/multimodal_bridge.py experiments/shared_stem_cell/multimodal_head.py experiments/shared_stem_cell/multimodal_alignment.py experiments/shared_stem_cell/multimodal_alignment_contract.py experiments/shared_stem_cell/multimodal_alignment_evaluator.py experiments/shared_stem_cell/multimodal_real_encoder.py experiments/shared_stem_cell/multimodal_real_encoder_evaluator.py experiments/shared_stem_cell/test_multimodal_real_encoder.py experiments/shared_stem_cell/test_multimodal_bridge.py experiments/shared_stem_cell/test_multimodal_head.py experiments/shared_stem_cell/test_multimodal_alignment.py experiments/shared_stem_cell/MULTIMODAL_STEM_V0.md experiments/shared_stem_cell/MULTIMODAL_ALIGNMENT_V1.md experiments/shared_stem_cell/PINNED_ENCODER_INGRESS_V2.md .github/workflows/hepta-multimodal-stem-contract.yml > /tmp/hepta-multimodal-stem-artifact/source-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: multimodal-stem-contracts-not-model-quality
          path: /tmp/hepta-multimodal-stem-artifact
          if-no-files-found: error
