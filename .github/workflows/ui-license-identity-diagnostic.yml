# Fixed source-head diagnostic only; never main/base-merge qualification.
name: ui-license-identity source diagnostic
on:
  push:
    branches: [dot/ui-license-identity-diagnostic-20261006]
permissions:
  contents: read
concurrency:
  group: ui-license-identity-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dot/ui-license-identity-diagnostic-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
      TESTED_SHA: ${{ github.sha }}
      HEPTA_CI_LANE: source-head
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify clean exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$RUNNER_TEMP/ui-license-identity-records"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Run only license identity regressions on Node 22
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = 22
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/ui-license-identity-records/command.json" --timeout-seconds 120 -- node --test --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/ui-license-identity-records/tests.xml" apps/hepta-control-ui/test/robrix-source-identity.test.mjs
      - name: Require exactly three passing tests and retain counts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCOUNT'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ['RUNNER_TEMP']) / 'ui-license-identity-records'
          record = json.loads((root / 'command.json').read_text())
          cases = list(ET.parse(root / 'tests.xml').getroot().iter('testcase'))
          names = [case.get('name') for case in cases]
          counts = {'names': names, 'tests': len(cases), 'failed': sum(c.find('failure') is not None or c.find('error') is not None for c in cases), 'skipped': sum(c.find('skipped') is not None for c in cases)}
          counts.update(source_sha=record['source_sha'], before=record['before'], after=record['after'], qualification=False)
          (root / 'counts.json').write_text(json.dumps(counts, indent=2) + '\n')
          assert record['status'] == 'passed' and record['exit_code'] == 0, record
          assert sorted(names) == sorted([
              'editing a shipped license invalidates source identity and restoring it recovers identity',
              'adding and removing nested shipped licenses changes the complete source inventory',
              'missing shipped-license directory fails closed',
          ]), names
          assert counts['tests'] == 3 and counts['failed'] == 0 and counts['skipped'] == 0, counts
          assert record['before'] == record['after'] and record['source_sha'] == os.environ['SOURCE_SHA'], record
          PYCOUNT
      - name: Verify source remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Retain diagnostic receipts only
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-license-identity-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-license-identity-records/
          if-no-files-found: error
          retention-days: 7
