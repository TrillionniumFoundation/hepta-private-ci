name: Platform wire exact source and merge

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-*/**'
      - 'codex-rs/Cargo.*'
      - 'docs/lane-a-foundation/**'
      - 'docs/modules/platform.wire/**'
      - 'scripts/*wire*'
      - 'scripts/*lane_a*'
      - '.github/workflows/*wire*'
      - '.github/workflows/lane-a-foundation.yml'
      - 'docs/modules/MODULES.json'
  push:
    branches: [codex/platform-wire-final-convergence-20260925]
    paths:
      - 'codex-rs/hepta-*/**'
      - 'codex-rs/Cargo.*'
      - 'docs/lane-a-foundation/**'
      - 'docs/modules/platform.wire/**'
      - 'scripts/*wire*'
      - 'scripts/*lane_a*'
      - '.github/workflows/*wire*'
      - '.github/workflows/lane-a-foundation.yml'
      - 'docs/modules/MODULES.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-wire-exact-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    name: Wire ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable parent tuple
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "RECORDS=$RUNNER_TEMP/wire-$HEPTA_CI_LANE-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Construct deterministic ordered merge
        if: matrix.lane == 'synthetic-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number || '0' }}
          author-name: Hepta Wire CI
          author-email: hepta-wire-ci@users.noreply.github.com
          message: Synthetic platform.wire merge
      - name: Install repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustup default "$toolchain"
      - name: Execute actual commands and retain identity-bound evidence
        id: execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECORDS"
          status=0
          record() {
            local name="$1" minimum="$2"
            shift 2
            python3 scripts/hepta_ci_exec.py --output "$RECORDS/$name.json" --minimum-tests "$minimum" -- "$@" || status=1
          }
          record path-tests 6 python3 -m unittest discover -s scripts -p test_generate_lane_a_workflow_paths.py
          record path-drift 0 python3 scripts/generate_lane_a_workflow_paths.py check
          record lane-truth 0 python3 scripts/verify_lane_a_foundation.py verify
          record status-tests 0 python3 scripts/platform_wire_status.py self-test
          record wire 41 cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-wire --all-targets
          record ports 8 cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-context-compiler -p codex-hepta-codex-adapter --lib wire::tests
          record cross-runtime 2 cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-shadow-qualification --test cross_runtime_wire_session
          record gateway 1 cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-native-gateway --lib http_accept
          record strict-clippy 0 cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-wire -p codex-hepta-codex-adapter --all-targets --no-deps -- -D warnings
          record clean-diff 0 git diff --exit-code
          echo "$status" > "$RECORDS/exit-code"
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          root = Path(os.environ['RECORDS'])
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          source, base = os.environ['SOURCE_SHA'], os.environ['BASE_SHA']
          receipt = {
              'schema': 'hepta.platform-wire.exact-execution.v1',
              'source_commit': source, 'source_tree': git('rev-parse', source+'^{tree}'),
              'base_commit': base, 'base_tree': git('rev-parse', base+'^{tree}'),
              'tested_commit': git('rev-parse', 'HEAD'), 'tested_tree': git('rev-parse', 'HEAD^{tree}'),
              'tested_parents': git('show', '-s', '--format=%P', 'HEAD').split(),
              'lane': os.environ['HEPTA_CI_LANE'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runner_image': os.environ.get('ImageOS'), 'runner_image_version': os.environ.get('ImageVersion'),
              'runner': platform.platform(),
              'rustc': subprocess.check_output(['rustc', '--version', '--verbose'], text=True),
              'cargo': subprocess.check_output(['cargo', '--version'], text=True),
              'file_sha256': files,
              'status': 'passed' if (root/'exit-code').read_text().strip() == '0' else 'failed',
              'independent_acceptance': False, 'activation': False, 'release': False,
          }
          (root/'execution.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY
          exit "$status"
      - name: Retain command records and raw logs even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wire-${{ matrix.lane }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ env.RECORDS }}
          if-no-files-found: warn
          retention-days: 90
      - name: Reject any source mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
