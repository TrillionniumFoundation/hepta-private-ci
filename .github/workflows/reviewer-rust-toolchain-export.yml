name: Reviewer Rust toolchain export

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/reviewer-rust-toolchain-export.yml

permissions:
  contents: read

jobs:
  export:
    name: Export Rust 1.95 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup run 1.95.0 rustc --version
          rustup run 1.95.0 cargo --version
          rustup run 1.95.0 rustfmt --version
          rustup run 1.95.0 clippy-driver --version

      - name: Pack relocatable toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustup toolchain list -v | awk '$1 ~ /^1\.95\.0-/ {print $NF; exit}')"
          test -d "$toolchain/bin"
          tar -C "$(dirname "$toolchain")" -czf "$RUNNER_TEMP/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz" "$(basename "$toolchain")"
          sha256sum "$RUNNER_TEMP/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz" > "$RUNNER_TEMP/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz.sha256"

      - name: Upload toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewer-rust-1.95.0-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
