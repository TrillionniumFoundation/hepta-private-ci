name: Hepta pinned normal feature parity

on:
  push:
    branches:
      - test/hepta-normal-feature-parity-20261103

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-pinned-normal-feature-parity-20261103
  cancel-in-progress: false

jobs:
  normal-controls:
    name: Original feature-profile Bazel controls (${{ matrix.source }}, ${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [head, prospective-merge]
        platform: [gnu, musl]
    env:
      EXPECTED_HEAD: '51782f433497e69301b9fbed2395fda771a1cbae'
      EXPECTED_BASE: '3a81000aae08c658276958d678874aca4db5eedd'
      EXPECTED_MERGE: '785478805f64bf9b708eb0abafd8213eab67471a'
      EXPECTED_TREE: '4beb6d9655e929164af45c0abba961f04a0c5f80'
      SOURCE_KIND: ${{ matrix.source }}
      BAZEL_PLATFORM: ${{ matrix.platform == 'gnu' && '//:local_linux' || '@rules_rs//rs/platforms:x86_64-unknown-linux-musl' }}
    steps:
      - name: Fetch the exact harness and its bounded ancestry
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - name: Check out the exact tested source with bounded history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.source == 'head' && env.EXPECTED_HEAD || env.EXPECTED_MERGE }}
          fetch-depth: 32
          persist-credentials: false
      - name: Bind the harness and the exact tested source before execution
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normal-bazel"
          python3 - <<'PYSOURCE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args]).decode().strip()
          for key in ['EXPECTED_HEAD', 'EXPECTED_BASE', 'EXPECTED_MERGE', 'EXPECTED_TREE']:
              assert re.fullmatch(r'[0-9a-f]{40}', os.environ[key]), 'bind every immutable source identity before publication'
          tested = git('rev-parse', 'HEAD')
          expected = os.environ['EXPECTED_HEAD'] if os.environ['SOURCE_KIND'] == 'head' else os.environ['EXPECTED_MERGE']
          assert tested == expected
          assert git('rev-parse', 'HEAD^{tree}') == os.environ['EXPECTED_TREE']
          if os.environ['SOURCE_KIND'] == 'prospective-merge':
              assert git('show', '-s', '--format=%P', 'HEAD').split() == [os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD']]
              assert git('merge-tree', '--write-tree', os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD']) == os.environ['EXPECTED_TREE']
          harness = os.environ['GITHUB_SHA']
          required_objects = {'harness': harness, 'candidate': os.environ['EXPECTED_HEAD'],
              'base': os.environ['EXPECTED_BASE'], 'tested': tested,
              'dependency_declaration': 'dc69725d957c79d8737eb5fbedfe6f213252317a'}
          for label, revision in required_objects.items():
              assert git('cat-file', '-t', revision) == 'commit', 'bounded checkout omitted required object: ' + label
          merge_base = git('merge-base', os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD'])
          assert merge_base == os.environ['EXPECTED_BASE'], 'expected base must remain the common ancestor in each bounded checkout'
          workflow = '.github/workflows/hepta-pinned-normal-feature-parity.yml'
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          assert os.environ['GITHUB_REF'] == 'refs/heads/test/hepta-normal-feature-parity-20261103'
          assert os.environ['GITHUB_REPOSITORY'] == 'TrillionniumFoundation/hepta-private-ci'
          assert git('show', '-s', '--format=%P', harness) == os.environ['EXPECTED_HEAD']
          assert git('diff-tree', '--no-commit-id', '--name-status', '-r', harness) == 'A\t' + workflow
          source = subprocess.check_output(['git', 'show', harness + ':' + workflow])
          assert git('status', '--porcelain', '--untracked-files=normal') == ''
          subprocess.run(['git', 'diff', '--exit-code', 'dc69725d957c79d8737eb5fbedfe6f213252317a', tested,
              '--', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion'], check=True)
          record = {'schema': 'hepta-scoped-feature-parity-bazel-v1', 'tested_commit': tested,
              'tested_tree': os.environ['EXPECTED_TREE'], 'source_kind': os.environ['SOURCE_KIND'],
              'candidate': os.environ['EXPECTED_HEAD'], 'base': os.environ['EXPECTED_BASE'],
              'prospective_merge': os.environ['EXPECTED_MERGE'], 'harness_commit': harness,
              'workflow_sha256': hashlib.sha256(source).hexdigest(), 'bazel_platform': os.environ['BAZEL_PLATFORM'],
              'checkout_fetch_depth': 32, 'required_git_objects': required_objects,
              'observed_merge_base': merge_base, 'is_shallow_repository': git('rev-parse', '--is-shallow-repository'),
              'scope': 'Seven configured Rustc roots plus six original normal Agentd native entries: default profile 1, default writer 1, qualification unit 3, and qualification process 1; no other native targets or ignored model cases'}
          (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/source-before.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record))
          PYSOURCE
      - name: Prepare the existing Bazel toolchain and repository cache
        id: prepare
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.platform == 'gnu' && 'x86_64-unknown-linux-gnu' || 'x86_64-unknown-linux-musl' }}
          cache-scope: bazel-test
      - name: Import the already verified fixed dependency artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '13245890316'
          run-id: '41664243615'
          repository: TrillionniumFoundation/hepta-private-ci
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/normal-bazel-distdir
      - name: Recheck the fixed metadata and complete dependency bytes
        id: dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDEPENDENCY'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'
          assert sorted(path.name for path in root.iterdir()) == ['source.json', 'transfer.json', 'v5.1.0.tar.gz']
          metadata = (root / 'source.json').read_bytes()
          assert hashlib.sha256(metadata).hexdigest() == '7d88fc6db323947a11d1638fe95185e9c733c337a1d1e7b50cdcf487e29ce56e'
          source = json.loads(metadata)
          assert 'https://github.com/aws/aws-lc/archive/refs/tags/v5.1.0.tar.gz' in [source.get('url')] + source.get('urls', [])
          expected = 'a6bf6adfc5f9bba559d28554b7d3581b15f2813f03bc9f2ae19f0d915e97dadf'
          assert source['integrity'].startswith('sha256-')
          assert base64.b64decode(source['integrity'][7:], validate=True).hex() == expected
          archive = root / 'v5.1.0.tar.gz'
          assert archive.stat().st_size == 145542555
          with archive.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert actual == expected
          transfer = json.loads((root / 'transfer.json').read_text())
          assert transfer['workflow_commit'] == '4a78bf9314197ef5a8ea97f67134fdac6795589f'
          assert transfer['workflow_run_id'] == '41664243615'
          assert transfer['declaration_source_commit'] == 'dc69725d957c79d8737eb5fbedfe6f213252317a'
          assert transfer['verified'] is True and transfer['source_sha256'] == expected and transfer['source_bytes'] == 145542555
          report = {'artifact_id': 13245890316, 'sha256': actual, 'bytes': archive.stat().st_size,
              'fixed_metadata_sha256': hashlib.sha256(metadata).hexdigest(), 'verified': True}
          (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/dependency-import.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PYDEPENDENCY
          test "$(cat .bazelversion)" = '9.3.0'
          bazel --version | tee "$RUNNER_TEMP/normal-bazel/bazel-version.txt"
          test "$(cat "$RUNNER_TEMP/normal-bazel/bazel-version.txt")" = 'bazel 9.3.0'
      - name: Write the scoped native runner outside the tested source
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/normal-bazel/run-target.py" <<'PYCONTROL'
          import hashlib, json, os, re, shutil, subprocess, sys, urllib.parse
          from pathlib import Path
          def check_bep_completion(events, target, result_id, result, verdict):
              summary_events = [row for row in events if row.get('id', {}).get('testSummary', {}).get('label') == target]
              verdict['bazel_test_summaries'] = summary_events
              assert len(summary_events) == 1, 'expected one overall test summary for the exact target'
              summary_id = summary_events[0]['id']['testSummary']
              summary = summary_events[0]['testSummary']
              assert summary_id.get('configuration') == result_id.get('configuration'), 'summary and attempt must use the same configured target'
              assert summary['overallStatus'] == 'PASSED'
              assert all(summary.get(key) == 1 for key in ('totalRunCount', 'runCount', 'attemptCount')), 'expected exactly one test execution and one attempt in the overall summary'
              cache = {'cached_locally': result.get('cachedLocally', False),
                  'cached_remotely': result.get('executionInfo', {}).get('cachedRemotely', False),
                  'total_cached_test_actions': summary.get('totalNumCached', 0)}
              verdict['bazel_test_cache'] = cache
              assert cache['cached_locally'] is False and cache['cached_remotely'] is False, 'an actual uncached test execution is required'
              assert cache['total_cached_test_actions'] == 0, 'the overall summary must contain zero cached test actions'
          
          
          cases = {'default_profile': ('//codex-rs/hepta-agentd:hepta-agentd-unit-tests',
                               '//codex-rs/hepta-agentd:hepta-agentd-unit-tests-bin',
                               ['runtime::tests::product_write_profile_fails_closed_when_cognitive_store_is_unavailable']),
           'default_writer': ('//codex-rs/hepta-agentd:hepta-agentd-cognitive_store_product_writer-test',
                              '//codex-rs/hepta-agentd:hepta-agentd-cognitive_store_product_writer-test',
                              ['agentd_product_host_recovers_exact_cut_into_fenced_writer_generation']),
           'qualification_unit': ('//codex-rs/hepta-agentd:hepta-agentd-cognitive-write-qualification-test',
                                  '//codex-rs/hepta-agentd:hepta-agentd-cognitive-write-qualification-test-bin',
                                  ['runtime::tests::qualification_host_binds_one_local_turn_and_replays_exactly_once',
                                   'runtime::tests::qualification_prepare_takes_over_expired_registry_head_without_evidence',
                                   'runtime::tests::qualification_prepare_quarantines_expired_registry_attempt_with_h7_evidence']),
           'qualification_product': ('//codex-rs/hepta-agentd:hepta-agentd-cognitive-product-qualification-test',
                                     '//codex-rs/hepta-agentd:hepta-agentd-cognitive-product-qualification-test-bin',
                                     ['real_agentd_remember_recall_correct_and_forget_revalidate_physical_sends'])}
          expected_counts = {'default_profile': 1, 'default_writer': 1, 'qualification_unit': 3, 'qualification_product': 1}
          assert {key: len(value[2]) for key, value in cases.items()} == expected_counts
          assert sum(expected_counts.values()) == 6
          assert all(len(value[2]) == len(set(value[2])) for value in cases.values())
          assert all(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_:]*', name) for value in cases.values() for name in value[2])
          case = sys.argv[1]
          target, binary_target, expected = cases[case]
          root = Path(os.environ['RUNNER_TEMP']) / 'normal-bazel' / case
          root.mkdir()
          platform = '--platforms=' + os.environ['BAZEL_PLATFORM']
          command = ['bazel', 'test', '--jobs=2', '--cache_test_results=no', '--test_output=all', '--flaky_test_attempts=1',
              '--distdir=' + str(Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'), platform,
              '--build_event_json_file=' + str(root / 'build-events.jsonl')]
          if case in ('default_profile', 'qualification_product'):
              command += ['--test_arg=' + name for name in expected]
              command += ['--test_arg=--exact', '--test_arg=--nocapture']
          command.append(target)
          (root / 'command.json').write_text(json.dumps({'argv': command, 'cwd': os.getcwd(),
              'expected_tests': expected, 'original_test_budgets_unchanged': True,
              'sandbox_flags_present': {key: key in os.environ for key in ('CODEX_SANDBOX', 'CODEX_SANDBOX_NETWORK_DISABLED')}}, indent=2) + '\n')
          with (root / 'bazel.log').open('wb') as log:
              child = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              for line in child.stdout:
                  log.write(line)
                  sys.stdout.buffer.write(line)
                  sys.stdout.buffer.flush()
              code = child.wait()
          (root / 'native.exit').write_text(str(code) + '\n')
          verdict = {'result': 'FAIL', 'target': target, 'native_exit': code, 'expected_count': len(expected)}
          try:
              events = [json.loads(line) for line in (root / 'build-events.jsonl').read_text().splitlines() if line.strip()]
              results = [row for row in events if row.get('id', {}).get('testResult', {}).get('label') == target]
              assert len(results) == 1, 'expected one unsharded test attempt; retain every other outcome as failure'
              result_id = results[0]['id']['testResult']
              verdict['bazel_test_result_id'] = result_id
              assert all(result_id.get(key) == 1 for key in ('run', 'shard', 'attempt')), 'expected run 1, shard 1, attempt 1'
              result = results[0]['testResult']
              verdict['bazel_test_status'] = result['status']
              logs = [value['uri'] for value in result.get('testActionOutput', []) if value.get('name') == 'test.log']
              assert len(logs) == 1
              location = urllib.parse.urlparse(logs[0])
              assert location.scheme == 'file' and location.netloc in ('', 'localhost')
              path = Path(urllib.parse.unquote(location.path))
              shutil.copyfile(path, root / 'original-test.log')
              text = (root / 'original-test.log').read_text().replace('\r', '')
              names = re.findall(r'^test ([A-Za-z_][A-Za-z0-9_:]*) \.\.\.', text, re.M)
              summaries = re.findall(r'^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;', text, re.M)
              verdict.update({'observed_names': names, 'native_summaries': summaries})
              query = ['bazel', 'cquery', '--output=files', platform, binary_target]
              with (root / 'binary-query.stderr').open('wb') as error:
                  found = subprocess.run(query, stdout=subprocess.PIPE, stderr=error, check=False)
              (root / 'binary-query.stdout').write_bytes(found.stdout)
              assert found.returncode == 0
              binaries = []
              for line in found.stdout.decode().splitlines():
                  binary = Path(line)
                  if not binary.is_file():
                      continue
                  with binary.open('rb') as stream:
                      if stream.read(4) != b'\x7fELF':
                          continue
                      stream.seek(0)
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  binaries.append({'path': str(binary.resolve()), 'bytes': binary.stat().st_size, 'sha256': digest})
              assert len(binaries) == 1, 'expected one actual library test ELF'
              (root / 'binary-identities.json').write_text(json.dumps(binaries, indent=2) + '\n')
              check_bep_completion(events, target, result_id, result, verdict)
              running = re.findall(r'^running (\d+) tests?$', text, re.M)
              assert running == [str(len(expected))], 'original native count required'
              assert len(names) == len(set(names)), 'duplicate native names'
              assert 'Skipping test' not in text, 'guard returned before execution'
              assert sorted(names) == sorted(expected), (names, expected)
              assert len(summaries) == 1
              outcome, passed, failed, ignored, measured, filtered = summaries[0]
              verdict.update({'observed_names': names, 'passed': int(passed), 'failed': int(failed), 'ignored': int(ignored), 'filtered': int(filtered)})
              assert outcome == 'ok' and int(passed) == len(expected) and int(failed) == int(ignored) == int(measured) == 0
              if case == 'default_writer':
                  assert int(filtered) == 0
              assert code == 0 and result['status'] == 'PASSED'
              verdict['result'] = 'PASS'
          except Exception as error:
              verdict['reader_error'] = str(error)
          finally:
              (root / 'result.json').write_text(json.dumps(verdict, indent=2) + '\n')
              print(json.dumps(verdict))
          sys.exit(0 if verdict['result'] == 'PASS' else 1)
          PYCONTROL
      - name: Write the seven-root configuration reader outside the tested source
        id: configuration_reader
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/normal-bazel/check-features.py" <<'PYFEATURES'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path
          
          
          def normalized_label(label):
              # Only normalize the main repository spellings. Never strip an external name.
              for prefix in ('@@//', '@//'):
                  if label.startswith(prefix):
                      return '//' + label[len(prefix):]
              return label
          
          
          def feature_values(vector):
              features = []
              for index, argument in enumerate(vector):
                  value = argument[len('--cfg='):] if argument.startswith('--cfg=') else (
                      argument if index and vector[index - 1] == '--cfg' else '')
                  match = re.fullmatch(r'feature="([^"]+)"', value)
                  if match:
                      features.append(match.group(1))
              return features
          
          
          def rustc_command_arguments(action):
              arguments = action.get('arguments', [])
              assert arguments and all(isinstance(value, str) for value in arguments), 'missing action arguments'
              parameters = {}
              for parameter in action.get('paramFiles', []):
                  path = parameter.get('execPath')
                  values = parameter.get('arguments', [])
                  assert isinstance(path, str) and path and path not in parameters, 'missing or duplicate parameter-file identity'
                  assert isinstance(values, list) and all(isinstance(value, str) for value in values)
                  parameters[path] = values
              consumed = {}
          
              def consume(path, role):
                  assert path in parameters, 'referenced parameter file is absent from aquery: ' + path
                  previous = consumed.get(path)
                  assert previous is None or previous['role'] == role, 'parameter file reused across wrapper and Rustc roles'
                  consumed[path] = {'role': role, 'references': 1 if previous is None else previous['references'] + 1}
                  return parameters[path]
          
              # The pinned wrapper patch expands only argv[1], once. Its values are
              # literal, including values beginning with @ or --wrapper-args=.
              expanded = list(arguments)
              if len(expanded) > 1 and expanded[1].startswith('--wrapper-args='):
                  wrapper_path = expanded[1][len('--wrapper-args='):]
                  wrapper_arguments = consume(wrapper_path, 'wrapper')
                  assert '--' not in wrapper_arguments, 'wrapper response file contains the child boundary'
                  expanded = [expanded[0], *wrapper_arguments, *expanded[2:]]
              basename = lambda value: value.replace('\\', '/').rsplit('/', 1)[-1]
              assert basename(expanded[0]) in ('process_wrapper', 'process_wrapper.exe'), 'expected the pinned process wrapper'
              assert '--' in expanded, 'missing wrapper/child boundary'
              boundary = expanded.index('--')
              wrapper = expanded[1:boundary]
              wrapper_flags = {
                  '--subst', '--stable-status-file', '--volatile-status-file', '--env-file',
                  '--out-dir', '--arg-file', '--touch-file', '--copy-output', '--stdout-file',
                  '--stderr-file', '--captured-exit-code-file', '--output-file',
                  '--rustc-output-format', '--require-explicit-unstable-features',
              }
              link_search_files = []
              index = 0
              while index < len(wrapper):
                  flag = wrapper[index]
                  assert flag in wrapper_flags and index + 1 < len(wrapper), 'unexpected or incomplete wrapper option'
                  value = wrapper[index + 1]
                  if flag == '--arg-file':
                      # These seven roots have no build.rs or lint-config input. The
                      # pinned rule propagates only dependency .linksearchpaths here;
                      # the pinned producer writes -L entries, not feature cfg flags.
                      assert value.endswith('.linksearchpaths'), 'uninspected dynamic compiler-flags input'
                      if value in parameters:
                          assert all(item.startswith('-L') for item in consume(value, 'link-search')), 'link-search input contains non-link arguments'
                      link_search_files.append({'path': value, 'included_in_param_files': value in parameters})
                  index += 2
              child = expanded[boundary + 1:]
              assert child and basename(child[0]) in ('rustc', 'rustc.exe'), 'expected an actual Rustc child command'
          
              def expand_rustc(vector, stack=()):
                  result = []
                  for argument in vector:
                      if argument.startswith('@'):
                          path = argument[1:]
                          assert path not in stack, 'cyclic Rustc parameter-file reference'
                          result.extend(expand_rustc(consume(path, 'rustc'), (*stack, path)))
                      else:
                          result.append(argument)
                  return result
          
              rustc_arguments = expand_rustc(child[1:])
              assert '--' not in rustc_arguments, 'unexpected Rustc option terminator'
              assert set(consumed) == set(parameters), 'aquery contains an unreferenced parameter file'
              return {'rustc_executable': child[0], 'rustc_arguments': rustc_arguments,
                  'parameter_files': [{'exec_path': path, 'argument_count': len(parameters[path]), **consumed[path]}
                                      for path in sorted(parameters)],
                  'dependency_link_search_files': link_search_files}
          
          
          def inspect_actions(graph, expected):
              targets = {str(item['id']): normalized_label(item['label']) for item in graph.get('targets', [])}
              configurations = {str(item['id']): item for item in graph.get('configuration', [])}
              observed = []
              for action in graph.get('actions', []):
                  label = targets.get(str(action.get('targetId')))
                  assert action.get('mnemonic') == 'Rustc' and label in expected, 'unexpected configured root action'
                  binding = rustc_command_arguments(action)
                  arguments = binding['rustc_arguments']
                  features = sorted(set(feature_values(arguments)))
                  sources = sorted(set(value for value in arguments if value.endswith('.rs')))
                  source_suffix = expected[label]['source']
                  source_path = arguments[0].replace('\\', '/') if arguments else ''
                  source_present = source_path == source_suffix or source_path.endswith('/' + source_suffix)
                  configuration = configurations.get(str(action.get('configurationId')), {})
                  observed.append({
                      'label': label,
                      'features': features,
                      'expected_features': expected[label]['features'],
                      'rustc_sources': sources,
                      'expected_source': source_suffix,
                      'expected_source_present': source_present,
                      'configuration_id': action.get('configurationId'),
                      'configuration_checksum': configuration.get('checksum'),
                      'configuration_mnemonic': configuration.get('mnemonic'),
                      'configuration_is_tool': configuration.get('isTool', False),
                      'execution_platform': action.get('executionPlatform'),
                      'rustc_executable': binding['rustc_executable'],
                      'parameter_files': binding['parameter_files'],
                      'dependency_link_search_files': binding['dependency_link_search_files'],
                      'feature_source': 'expanded configured Rustc child argv; dependency link-search files recorded separately',
                      'rustc_argument_vector_sha256': hashlib.sha256(json.dumps(arguments, separators=(',', ':')).encode()).hexdigest(),
                  })
              return observed
          
          
          def validate_actions(observed, expected):
              assert {item['label'] for item in observed} == set(expected), 'all seven root labels must have an actual Rustc action'
              assert all(item['features'] == item['expected_features'] for item in observed), 'configured feature closure differs'
              assert all(item['expected_source_present'] for item in observed), 'configured action did not bind the expected crate source'
          
          
          def source_identity():
              def git(*args):
                  return subprocess.check_output(['git', '--no-replace-objects', *args]).decode().strip()
              return {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                      'status': git('status', '--porcelain', '--untracked-files=normal')}
          
          
          def main():
              prefix = '//codex-rs/hepta-agentd:'
              normal = ['default', 'production-cognitive-write']
              qualification = ['production-cognitive-write', 'qualification-cognitive-write']
              expected = {
                  prefix + 'hepta-agentd': {'features': normal, 'source': 'codex-rs/hepta-agentd/src/lib.rs'},
                  prefix + 'codex-hepta-agentd': {'features': normal, 'source': 'codex-rs/hepta-agentd/src/main.rs'},
                  prefix + 'hepta-agentd-cognitive_product_e2e-test': {'features': normal, 'source': 'codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs'},
                  prefix + 'hepta-agentd-cognitive-write-qualification-lib': {'features': qualification, 'source': 'codex-rs/hepta-agentd/src/lib.rs'},
                  prefix + 'hepta-agentd-cognitive-write-qualification-test-bin': {'features': qualification, 'source': 'codex-rs/hepta-agentd/src/lib.rs'},
                  prefix + 'hepta-agentd-cognitive-product-qualification-bin': {'features': qualification, 'source': 'codex-rs/hepta-agentd/src/main.rs'},
                  prefix + 'hepta-agentd-cognitive-product-qualification-test-bin': {'features': qualification, 'source': 'codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs'},
              }
              root = Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/configured_features'
              root.mkdir()
              before = source_identity()
              assert before['status'] == ''
              assert before['commit'] == (os.environ['EXPECTED_HEAD'] if os.environ['SOURCE_KIND'] == 'head' else os.environ['EXPECTED_MERGE'])
              assert before['tree'] == os.environ['EXPECTED_TREE']
              command = ['bazel', 'aquery', '--jobs=2',
                  '--distdir=' + str(Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'),
                  '--platforms=' + os.environ['BAZEL_PLATFORM'], '--output=jsonproto',
                  '--include_artifacts=false', '--include_commandline=true', '--include_param_files=true',
                  'mnemonic("Rustc", set(' + ' '.join(expected) + '))']
              (root / 'command.json').write_text(json.dumps({'argv': command, 'cwd': os.getcwd(),
                  'expected_roots': expected, 'source_before': before, 'tests_executed': 0,
                  'sandbox_flags_present': {key: key in os.environ for key in ('CODEX_SANDBOX', 'CODEX_SANDBOX_NETWORK_DISABLED')}}, indent=2) + '\n')
              started = time.monotonic()
              with (root / 'aquery.stdout').open('wb') as output, (root / 'aquery.stderr').open('wb') as error:
                  completed = subprocess.run(command, stdout=output, stderr=error, check=False)
              (root / 'analysis.exit').write_text(str(completed.returncode) + '\n')
              raw = (root / 'aquery.stdout').read_bytes()
              error_bytes = (root / 'aquery.stderr').read_bytes()
              verdict = {'result': 'FAIL', 'analysis_exit': completed.returncode, 'elapsed_seconds': time.monotonic() - started,
                  'source_before': before, 'source_after': source_identity(), 'expected_roots': expected, 'tests_executed': 0,
                  'stdout_bytes': len(raw), 'stdout_sha256': hashlib.sha256(raw).hexdigest(),
                  'stderr_bytes': len(error_bytes), 'stderr_sha256': hashlib.sha256(error_bytes).hexdigest()}
              try:
                  assert completed.returncode == 0, 'Bazel configured analysis failed; preserve raw stdout/stderr'
                  verdict['actions'] = inspect_actions(json.loads(raw), expected)
                  validate_actions(verdict['actions'], expected)
                  assert verdict['source_after'] == before
                  verdict['result'] = 'PASS'
              except Exception as error:
                  verdict['reader_error'] = str(error)
              finally:
                  (root / 'result.json').write_text(json.dumps(verdict, indent=2) + '\n')
                  print(json.dumps(verdict))
              return 0 if verdict['result'] == 'PASS' else 1
          
          
          if __name__ == '__main__':
              sys.exit(main())
          PYFEATURES
      - name: Inspect the seven actual configured Rustc feature closures
        id: configured
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome == 'success' && steps.runner.outcome == 'success' && steps.configuration_reader.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/normal-bazel/check-features.py"
      - name: Run only the original default product fail-closed unit case
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome == 'success' && steps.runner.outcome == 'success' && steps.configuration_reader.outcome == 'success' && steps.configured.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/normal-bazel/run-target.py" default_profile
      - name: Run the complete original default writer recovery target
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome == 'success' && steps.runner.outcome == 'success' && steps.configuration_reader.outcome == 'success' && steps.configured.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/normal-bazel/run-target.py" default_writer
      - name: Run the original three qualification unit cases with their existing wrapper prefix
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome == 'success' && steps.runner.outcome == 'success' && steps.configuration_reader.outcome == 'success' && steps.configured.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/normal-bazel/run-target.py" qualification_unit
      - name: Run only the original single-Agent local cognitive lifecycle case
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome == 'success' && steps.runner.outcome == 'success' && steps.configuration_reader.outcome == 'success' && steps.configured.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/normal-bazel/run-target.py" qualification_product
      - name: Retain the exact source state after every outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normal-bazel"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/normal-bazel/source-after.txt"
          git status --porcelain --untracked-files=normal > "$RUNNER_TEMP/normal-bazel/source-after-status.txt"
          expected="$EXPECTED_HEAD"
          if [ "$SOURCE_KIND" = prospective-merge ]; then expected="$EXPECTED_MERGE"; fi
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          test ! -s "$RUNNER_TEMP/normal-bazel/source-after-status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: normal-bazel-feature-parity-${{ matrix.source }}-${{ matrix.platform }}-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/normal-bazel/
          if-no-files-found: error
          retention-days: 30
