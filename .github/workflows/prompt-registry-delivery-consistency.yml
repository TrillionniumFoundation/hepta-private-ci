name: Prompt registry delivery consistency

on:
  push:
    branches: [codex/prompt-registry-delivery-consistency-20260928]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-registry-delivery-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export exact tracked source, never a generated worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/prompt-source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/prompt-source/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/prompt-source/identity.txt"
          sha256sum "$RUNNER_TEMP/prompt-source/source.tar.gz" > "$RUNNER_TEMP/prompt-source/archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-source-${{ github.sha }}
          path: ${{ runner.temp }}/prompt-source/
          if-no-files-found: error
          retention-days: 7
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [exact-head, base-merge]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and deterministic mainline merge
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base=$(git rev-parse refs/remotes/origin/main)
          if test "$LANE" = base-merge; then
            git config user.name "Prompt registry qualification"
            git config user.email "qualification@users.noreply.github.com"
            export GIT_AUTHOR_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            git checkout --detach "$base"
            git merge --no-ff --no-edit "$GITHUB_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/prompt-evidence"
          printf 'source=%s\nbase=%s\ntested=%s\ntree=%s\nlane=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$base" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            "$LANE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/prompt-evidence/identity.txt"
          test ! -e scripts/apply-prompt-registry-operations.py
          git diff --exit-code
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Execute checks and preserve each exit status
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/prompt-evidence"
          failed=0
          check() {
            local name="$1"; shift
            "$@" > "$evidence/$name.log" 2>&1
            local code=$?
            printf '%s\t%s\n' "$name" "$code" >> "$evidence/results.tsv"
            tail -n 40 "$evidence/$name.log"
            if test "$code" -ne 0; then failed=1; fi
          }
          check format cargo fmt --package codex-hepta-prompt-registry -- --check
          check registry cargo test --locked -p codex-hepta-prompt-registry -- --test-threads=1
          check optimizer cargo test --locked -p codex-hepta-prompt-optimizer -- --test-threads=1
          check agentd cargo test --locked -p codex-hepta-agentd prompt_ -- --test-threads=1
          check all-targets cargo check --locked -p codex-hepta-prompt-registry -p codex-hepta-prompt-optimizer -p codex-hepta-agentd --all-targets
          check lint cargo clippy --locked -p codex-hepta-prompt-registry -p codex-hepta-prompt-optimizer --all-targets --no-deps -- -D warnings
          check profiles cargo test --locked -p codex-hepta-prompt-registry operational_ -- --ignored --nocapture --test-threads=1
          check unchanged git diff --exit-code
          exit "$failed"
      - name: Retain exact-candidate evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-delivery-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-evidence/
          if-no-files-found: error
          retention-days: 30
