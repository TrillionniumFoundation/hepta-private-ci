name: Cell experiments engineering integrity

on:
  pull_request:
    paths:
      - "scripts/cell_experiments/**"
      - "scripts/hepta_cells/**"
      - "sdk/python/src/**"
      - "sdk/python/pyproject.toml"
      - "sdk/python/uv.lock"
      - "qualification/cell-experiments-v2-20261116/task-fixtures/**"
      - ".github/workflows/cell-experiments.yml"
  push:
    paths:
      - "scripts/cell_experiments/**"
      - "scripts/hepta_cells/**"
      - "sdk/python/src/**"
      - "sdk/python/pyproject.toml"
      - "sdk/python/uv.lock"
      - "qualification/cell-experiments-v2-20261116/task-fixtures/**"
      - ".github/workflows/cell-experiments.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cell-experiments-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-integrity:
    name: Engineering integrity (Python 3.12; no learning qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts:sdk/python/src
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned CPU numerical test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/cell-integrity-venv"
          # This CPU test profile is distinct from the CUDA research runtime.
          "$RUNNER_TEMP/cell-integrity-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
          "$RUNNER_TEMP/cell-integrity-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            numpy==2.3.5 transformers==4.57.3 peft==0.18.0 \
            tokenizers==0.22.2 accelerate==1.16.0 safetensors==0.7.0 \
            huggingface-hub==0.36.2 pydantic==2.13.4
      - name: Run every experiment integrity test
        run: |
          for module in data coding_sft campaign adoption composition interaction; do
            test -f "scripts/cell_experiments/test_${module}.py"
          done
          # Discovery also includes test_sequence.py and later test modules.
          # The top-level directory preserves package-relative imports.
          "$RUNNER_TEMP/cell-integrity-venv/bin/python" -m unittest discover \
            --start-directory scripts/cell_experiments \
            --top-level-directory scripts --pattern 'test_*.py' --verbose
      - name: Record the scope of this check
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Engineering integrity only

          Test outcomes are recorded in the test step above. This job checks
          numerical updates, record integrity, budgets, and control flow using
          authored fixtures and mocked model/process ports. The repository
          contract tests also execute reviewed function subsets and check
          whether candidate assertions reject incorrect outputs. A pinned CPU
          Torch/Transformers/PEFT profile executes the real tiny tensor updates
          and adapter-switch tests with locally constructed random models. It
          retains NumPy 2.3.5 and is distinct from the CUDA research profile.
          This job does not run the language-model campaign or download weights.

          Scientific learning and independent-confirmation gates remain BLOCKED.
          No native CellOwner adoption, external-teacher trajectory evidence,
          HEPLCP FinalUse, production eligibility, or settlement is established.
          EOF
