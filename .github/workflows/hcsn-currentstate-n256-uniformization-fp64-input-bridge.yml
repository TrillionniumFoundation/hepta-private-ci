name: hcsn-currentstate-n256-uniformization-fp64-input-bridge

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_uniformization_fp64_input_bridge/**"
      - ".github/workflows/hcsn-currentstate-n256-uniformization-fp64-input-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assertions-enabled bounded fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_uniformization_fp64_input_bridge.test_bridge
      - name: Optimized-mode bounded fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_uniformization_fp64_input_bridge.test_bridge
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_uniformization_fp64_input_bridge/*.py
      - name: Verify frozen source and fail-closed gates
        run: python3 qualification/hcsn_currentstate_n256_uniformization_fp64_input_bridge/verify_source.py
