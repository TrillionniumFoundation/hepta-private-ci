name: Capture learning operator verification findings

on:
  push:
    branches:
      - codex/learning-operator-full-convergence-20260926
    paths:
      - .github/workflows/learning-operator-verify-diagnostic.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/learning-operator-full-convergence-20260926
          fetch-depth: 0
      - name: Capture verifier output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/lane-e
          set +e
          python3 scripts/hepta-lane-e-closure.py verify > qualification/lane-e/latest-verify.json
          status=$?
          set -e
          python3 -m json.tool qualification/lane-e/latest-verify.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('qualification/lane-e/latest-verify.json')
          data = json.loads(path.read_text())
          data['capturedSourceSha'] = '${{ github.sha }}'
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
          rm .github/workflows/learning-operator-verify-diagnostic.yml
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add qualification/lane-e/latest-verify.json .github/workflows/learning-operator-verify-diagnostic.yml
          git commit -m "test(lane-e): capture exact verification findings"
          git push origin HEAD:codex/learning-operator-full-convergence-20260926
          exit 0
