name: Hepta E3 original Granite97 DINOv2 physical-and-score (DENY_ALL)
on:
  push:
    branches: ["research/e3-required-physical-score-pr-20261015"]
    paths:
      - "experiments/shared_stem_cell/e3_scienceqa_*.py"
      - "experiments/shared_stem_cell/e3_granite_dino_real.py"
      - "experiments/shared_stem_cell/test_e3_scienceqa_real.py"
      - "experiments/shared_stem_cell/E3_REAL_GRANITE_DINO.md"
      - ".github/workflows/hepta-e3-granite-dino-scienceqa.yml"
  pull_request:
    paths:
      - "experiments/shared_stem_cell/e3_scienceqa_*.py"
      - "experiments/shared_stem_cell/e3_granite_dino_real.py"
      - "experiments/shared_stem_cell/test_e3_scienceqa_real.py"
      - "experiments/shared_stem_cell/E3_REAL_GRANITE_DINO.md"
      - ".github/workflows/hepta-e3-granite-dino-scienceqa.yml"
permissions:
  contents: read
concurrency:
  group: hepta-e3-granite-dino-${{ github.sha }}
  cancel-in-progress: true
jobs:
  e3-physical-required-not-contract-only:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'TrillionniumFoundation/hepta-private-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: experiments/shared_stem_cell
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned stock PyTorch, HF, dataset and media dependencies
        run: |
          set -euo pipefail
          python3 -m venv /tmp/e3-venv
          /tmp/e3-venv/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/e3-venv/bin/pip install numpy==1.26.4 transformers==4.57.1 \
            safetensors==0.6.2 huggingface-hub==0.35.3 tokenizers==0.22.1 \
            datasets==3.6.0 pyarrow==19.0.1 Pillow==11.3.0 psutil==7.0.0 packaging==25.0
          /tmp/e3-venv/bin/pip check
          /tmp/e3-venv/bin/pip freeze > /tmp/e3-environment.txt
          /tmp/e3-venv/bin/python -c 'import numpy, pyarrow; assert numpy.__version__ == "1.26.4" and pyarrow.__version__ == "19.0.1"; from transformers import AutoImageProcessor, Dinov2Model, AutoModel; from huggingface_hub import HfApi; from datasets import load_dataset; print("STOCK_PRETRAINED_API_PREFLIGHT_OK")'
      - name: Execute original mechanistic and negative-contract tests
        run: |
          set -euo pipefail
          P=/tmp/e3-venv/bin/python
          "$P" -m compileall -q experiments/shared_stem_cell/e3_*.py experiments/shared_stem_cell/test_e3_scienceqa_real.py
          "$P" -m unittest discover -s experiments/shared_stem_cell -p 'test_e3_scienceqa_real.py' -v 2>&1 | tee /tmp/e3-local-test.log
          grep -q 'Ran 27 tests' /tmp/e3-local-test.log
          grep -q '^OK$' /tmp/e3-local-test.log
          "$P" -O -m unittest discover -s experiments/shared_stem_cell -p 'test_e3_scienceqa_real.py' -q 2>&1 | tee /tmp/e3-optimized-test.log
      - name: Stage source-only ScienceQA and create separate held-label seal
        run: |
          set -euo pipefail
          /tmp/e3-venv/bin/python experiments/shared_stem_cell/e3_scienceqa_stage.py --output /tmp/e3-scienceqa
          /tmp/e3-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/e3-scienceqa')
          s=json.loads((p/'source-seals.json').read_bytes())
          assert s['dataset_revision']=='b9984af01798586705cee1fbdfa80a6dcbef04f1'
          assert (p/'private_labels'/'test_labels.jsonl').is_file()
          assert (p/'inputs'/'fit_labels.jsonl').is_file()
          assert (p/'inputs'/'sources.jsonl').is_file()
          # The next process receives no held target path; raw source media
          # and private targets are never included in uploaded artifacts.
          PY
      - name: Physically run exact Granite97 and DINOv2 weights; fit and seal held predictions
        run: |
          set -euo pipefail
          P=/tmp/e3-venv/bin/python
          read -r SRC FIT < <("$P" - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/e3-scienceqa/source-seals.json').read_text())
          print(s['source_sha256'],s['fit_labels_sha256'])
          PY
          )
          "$P" experiments/shared_stem_cell/e3_granite_dino_real.py \
             --sources /tmp/e3-scienceqa/inputs/sources.jsonl --source-sha256 "$SRC" \
             --fit-labels /tmp/e3-scienceqa/inputs/fit_labels.jsonl --fit-labels-sha256 "$FIT" \
             --images /tmp/e3-scienceqa/images --output /tmp/e3-original-model
          test -s /tmp/e3-original-model/sealed-predictions.json
          sha256sum /tmp/e3-original-model/sealed-predictions.json > /tmp/e3-prediction-seal-before-label.txt
      - name: Independently reopen original test targets only AFTER model predictions seal
        run: |
          set -euo pipefail
          P=/tmp/e3-venv/bin/python
          test -s /tmp/e3-prediction-seal-before-label.txt
          read -r SRC HELD < <("$P" - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/e3-scienceqa/source-seals.json').read_text())
          print(s['source_sha256'],s['private_test_labels_sha256'])
          PY
          )
          PRED=$(cut -d' ' -f1 /tmp/e3-prediction-seal-before-label.txt)
          "$P" experiments/shared_stem_cell/e3_scienceqa_review.py \
            --sources /tmp/e3-scienceqa/inputs/sources.jsonl --source-sha256 "$SRC" \
            --heldout-labels /tmp/e3-scienceqa/private_labels/test_labels.jsonl \
            --heldout-labels-sha256 "$HELD" \
            --predictions /tmp/e3-original-model/sealed-predictions.json \
            --predictions-sha256 "$PRED" --output /tmp/e3-original-review.json
          "$P" - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/e3-original-review.json').read_text())
          assert p['original_heldout_cases']==64
          assert p['stem_winner'] is None and p['authority']=='DENY_ALL'
          for arm in p['arms'].values():
              assert arm['cases']==64
          print('REAL MODEL DESCRIPTIVE E3 REVIEW COMPLETED, NEVER A PRODUCTION SELECTION')
          PY
      - name: Fail closed unless original pretrained forward AND held-label readout completed
        run: |
          set -euo pipefail
          /tmp/e3-venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/e3-scienceqa')
          pred_path = Path('/tmp/e3-original-model/sealed-predictions.json')
          score_path = Path('/tmp/e3-original-review.json')
          seal_path = Path('/tmp/e3-prediction-seal-before-label.txt')
          source = json.loads((root / 'source-seals.json').read_bytes())
          raw = pred_path.read_bytes()
          got_sha = hashlib.sha256(raw).hexdigest()
          stored_sha = seal_path.read_text().split()[0]
          pred = json.loads(raw)
          score = json.loads(score_path.read_bytes())
          assert len(got_sha) == 64 and got_sha == stored_sha == score['sealed_predictions_sha256']
          assert pred['source_sha256'] == source['source_sha256'] == score['source_sha256']
          assert score['holdout_targets_sha256'] == source['private_test_labels_sha256']
          assert pred['fit_labels_sha256'] == source['fit_labels_sha256']
          for name in ('physical_text_forward_batches', 'physical_vision_forward_batches'):
              assert type(pred.get(name)) is int and pred[name] > 0, name
          assert pred['stem_model']['repo'] == 'ibm-granite/granite-embedding-97m-multilingual-r2'
          assert pred['vision_model']['repo'] == 'facebook/dinov2-small'
          assert pred['fit']['private_cell_head_parameters'] == 769
          assert pred['fit']['train_cases'] == 96
          assert pred['fit']['calibration_cases'] == 32
          assert pred['fit']['holdout_cases'] == score['original_heldout_cases'] == 64
          assert pred['held_labels_visible_to_inference'] is False
          assert pred['production_accepted'] is False
          assert score['production_accepted'] is False
          assert score['stem_winner'] is None and score['authority'] == 'DENY_ALL'
          assert score['statistical_selection_authorized'] is False
          assert len(score['arms']) == 8
          assert all(v['cases'] == 64 for v in score['arms'].values())
          out = {
              'schema': 'hepta.e3.physical-and-score-required.v1',
              'exact_source_sha': '${{ github.sha }}',
              'source_sha256': source['source_sha256'],
              'sealed_predictions_sha256': got_sha,
              'physical_text_forward_batches': pred['physical_text_forward_batches'],
              'physical_vision_forward_batches': pred['physical_vision_forward_batches'],
              'heldout_cases': 64,
              'completed_original_pretrained_stage_and_scoring': True,
              'signed_model_origin_authenticated': False,
              'natural_visual_necessity_adjudicated': False,
              'stem_winner': None,
              'authority': 'DENY_ALL',
          }
          p = Path('/tmp/e3-physical-verified.json')
          with p.open('x', encoding='utf-8') as f:
              json.dump(out, f, sort_keys=True, separators=(',', ':'))
              f.write('\n')
          print('E3_PHYSICAL_AND_SCORE_REQUIRED_PASS: native model origin remains unsigned')
          PY
      - name: Retain immutable source and available failure evidence without raw media or weights
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/e3-safe-evidence
          git rev-parse HEAD > /tmp/e3-safe-evidence/source-head.txt
          git rev-parse HEAD^{tree} > /tmp/e3-safe-evidence/source-tree.txt
          cp /tmp/e3-environment.txt /tmp/e3-safe-evidence/versions.txt || true
          cp /tmp/e3-local-test.log /tmp/e3-safe-evidence/offline-tests.txt || true
          cp /tmp/e3-optimized-test.log /tmp/e3-safe-evidence/optimized-tests.txt || true
          cp /tmp/e3-prediction-seal-before-label.txt /tmp/e3-safe-evidence/predictions-before-labels.sha256 || true
          cp /tmp/e3-scienceqa/source-seals.json /tmp/e3-safe-evidence/source-seals.json || true
          cp /tmp/e3-original-model/sealed-predictions.json /tmp/e3-safe-evidence/sealed-source-bound-predictions.json || true
          cp /tmp/e3-original-review.json /tmp/e3-safe-evidence/independent-descriptive-review.json || true
          cp /tmp/e3-physical-verified.json /tmp/e3-safe-evidence/physical-completed-or-absent.json || true
          sha256sum experiments/shared_stem_cell/e3_scienceqa_contract.py \
            experiments/shared_stem_cell/e3_scienceqa_stage.py \
            experiments/shared_stem_cell/e3_granite_dino_real.py \
            experiments/shared_stem_cell/e3_scienceqa_review.py \
            experiments/shared_stem_cell/test_e3_scienceqa_real.py \
            experiments/shared_stem_cell/E3_REAL_GRANITE_DINO.md \
            .github/workflows/hepta-e3-granite-dino-scienceqa.yml \
            > /tmp/e3-safe-evidence/source-blobs-SHA256
          (cd /tmp/e3-safe-evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-e3-granite-dino-actual-or-failure-no-weights-no-media
          path: /tmp/e3-safe-evidence
          if-no-files-found: error
