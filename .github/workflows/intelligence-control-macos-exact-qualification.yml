name: intelligence.control exact macOS qualification

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/workflows/intelligence-control-macos-exact-qualification.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-exact-macos-qualification
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  freeze:
    name: Freeze clean exact candidate
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out feature head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intelligence-control-product-closure-20260926
          fetch-depth: 0
          persist-credentials: true

      - name: Remove transient workflow and commit clean tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rm .github/workflows/intelligence-control-macos-exact-qualification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(intelligence): freeze clean qualification candidate"
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/intelligence-control-product-closure-20260926

  qualification:
    name: intelligence.control exact macOS (${{ matrix.lane }})
    needs: freeze
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, base-merge]
    env:
      SOURCE_SHA: ${{ needs.freeze.outputs.sha }}
    steps:
      - name: Check out exact committed candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current main base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git rev-parse refs/remotes/origin/main^{commit})"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Construct deterministic merge candidate
        id: synthetic
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ steps.base.outputs.sha }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: 1022
          author-name: Hepta Intelligence CI
          author-email: hepta-intelligence-ci@users.noreply.github.com
          message: intelligence.control exact macOS synthetic merge

      - name: Bind exact candidate identity
        env:
          TESTED_SHA: ${{ steps.synthetic.outputs.sha || env.SOURCE_SHA }}
          MERGE_SHA: ${{ steps.synthetic.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.lane }}" = base-merge ]; then
            test -n "$MERGE_SHA"
            test "$TESTED_SHA" = "$MERGE_SHA"
          else
            test -z "$MERGE_SHA"
            test "$TESTED_SHA" = "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'TESTED_SHA=%s\n' "$TESTED_SHA" >> "$GITHUB_ENV"

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Verify generated stable truth
        run: |
          set -euo pipefail
          python3 scripts/hepta-intelligence-control-status.py --check-tracked
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Check formatting
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/fmt.json"
          -- cargo fmt --all -- --check

      - name: Test canonical intelligence package
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/intelligence-tests.json"
          -- cargo test --locked -p codex-hepta-intelligence --lib

      - name: Test Agentd default product profile
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-default-tests.json"
          -- cargo test --locked -p codex-hepta-agentd --lib

      - name: Test explicitly classified qualification-only learning surface
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-qualification-tests.json"
          -- cargo test --locked -p codex-hepta-agentd --lib
          --features qualification-legacy-learning-write

      - name: Compile all Agentd targets
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/agentd-all-targets.json"
          -- cargo check --locked -p codex-hepta-agentd --all-targets

      - name: Strict lint intelligence product packages
        working-directory: codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/intelligence-target
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/intelligence-command-records/clippy.json"
          -- cargo clippy --locked -p codex-hepta-intelligence
          -p codex-hepta-agentd --all-targets -- -D warnings

      - name: Generate exact executed truth
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intelligence-exact-status/${{ matrix.lane }}"
          python3 scripts/hepta-intelligence-control-status.py \
            --source-head "$TESTED_SHA" \
            --execution-status passed \
            --lane "${{ matrix.lane }}" \
            --output-dir "$output"
          python3 - "$output" "$TESTED_SHA" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          for name in ("IMPLEMENTATION_MAP.json", "TEST_TRACEABILITY.json"):
              value = json.loads((root / name).read_text())
              assert value["sourceIdentity"]["commit"] == expected
              assert value["sourceIdentity"]["executionStatus"] == "passed"
          PY
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Retain exact qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intelligence-control-exact-macos-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/intelligence-command-records/*
            ${{ runner.temp }}/intelligence-exact-status/${{ matrix.lane }}/*
          if-no-files-found: error
          retention-days: 30
