name: Learning plasticity verifier remediation

on:
  push:
    branches:
      - feat/learning-plasticity-product-closure-20260928
    paths:
      - .github/workflows/learning-plasticity-verifier-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    name: Repair exact-blob provenance validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch verifier and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path("scripts/hepta-implementation-maps.py")
          text = verifier.read_text(encoding="utf-8")

          signature_old = "def checked_identity(value, candidate: dict[str, str]) -> dict[str, str]:"
          signature_new = """def checked_identity(
              value, candidate: dict[str, str], *, require_ancestor: bool = True
          ) -> dict[str, str]:"""
          if text.count(signature_old) != 1:
              raise SystemExit("checked_identity signature drift")
          text = text.replace(signature_old, signature_new, 1)

          ancestry_old = '    git("merge-base", "--is-ancestor", commit, candidate["commit"])\n'
          ancestry_new = '''    if require_ancestor:
              git("merge-base", "--is-ancestor", commit, candidate["commit"])
          '''
          if text.count(ancestry_old) != 1:
              raise SystemExit("checked_identity ancestry call drift")
          text = text.replace(ancestry_old, ancestry_new, 1)

          dispatch_old = '''    source = checked_identity(row.get("sourceBase"), candidate)
              mapping_mode = row.get("mappingSourceIdentityMode", "path_only")
              if mapping_mode not in {"path_only", "exact_blob"}:
                  raise ValueError(f"unknown mapping source identity mode: {mapping_mode}")
          '''
          dispatch_new = '''    mapping_mode = row.get("mappingSourceIdentityMode", "path_only")
              if mapping_mode not in {"path_only", "exact_blob"}:
                  raise ValueError(f"unknown mapping source identity mode: {mapping_mode}")
              source = checked_identity(
                  row.get("sourceBase"),
                  candidate,
                  require_ancestor=mapping_mode != "exact_blob",
              )
          '''
          if text.count(dispatch_old) != 1:
              raise SystemExit("verify_source_identity dispatch drift")
          text = text.replace(dispatch_old, dispatch_new, 1)
          verifier.write_text(text, encoding="utf-8")

          regression = Path("scripts/test_hepta_exact_blob_provenance.py")
          regression.write_text(
              '''from __future__ import annotations

          import importlib.util
          import sys
          import unittest
          from pathlib import Path
          from unittest.mock import call, patch

          SCRIPTS = Path(__file__).resolve().parent
          if str(SCRIPTS) not in sys.path:
              sys.path.insert(0, str(SCRIPTS))
          SPEC = importlib.util.spec_from_file_location(
              "hepta_implementation_maps_exact_blob_test",
              SCRIPTS / "hepta-implementation-maps.py",
          )
          if SPEC is None or SPEC.loader is None:
              raise RuntimeError("cannot load implementation-map verifier")
          MAPS = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MAPS)


          class ExactBlobProvenanceTests(unittest.TestCase):
              def test_checked_identity_can_validate_detached_provenance(self) -> None:
                  commit = "1" * 40
                  tree = "2" * 40
                  candidate = {"commit": "3" * 40, "tree": "4" * 40}

                  def fake_git(*args: str, **_kwargs: object) -> str:
                      if args == ("cat-file", "-t", commit):
                          return "commit"
                      if args == ("rev-parse", f"{commit}^{{tree}}"):
                          return tree
                      if args and args[0] == "merge-base":
                          raise AssertionError("detached provenance must not require ancestry")
                      raise AssertionError(f"unexpected git call: {args!r}")

                  with patch.object(MAPS, "git", side_effect=fake_git):
                      self.assertEqual(
                          MAPS.checked_identity(
                              {"commit": commit, "tree": tree},
                              candidate,
                              require_ancestor=False,
                          ),
                          {"commit": commit, "tree": tree},
                      )

              def test_path_only_identity_still_requires_ancestry(self) -> None:
                  commit = "1" * 40
                  tree = "2" * 40
                  candidate = {"commit": "3" * 40, "tree": "4" * 40}
                  calls: list[tuple[str, ...]] = []

                  def fake_git(*args: str, **_kwargs: object) -> str:
                      calls.append(args)
                      if args == ("cat-file", "-t", commit):
                          return "commit"
                      if args == ("rev-parse", f"{commit}^{{tree}}"):
                          return tree
                      if args == (
                          "merge-base",
                          "--is-ancestor",
                          commit,
                          candidate["commit"],
                      ):
                          return ""
                      raise AssertionError(f"unexpected git call: {args!r}")

                  with patch.object(MAPS, "git", side_effect=fake_git):
                      MAPS.checked_identity({"commit": commit, "tree": tree}, candidate)
                  self.assertIn(
                      ("merge-base", "--is-ancestor", commit, candidate["commit"]),
                      calls,
                  )

              def test_exact_blob_dispatch_marks_only_source_base_detached(self) -> None:
                  source = {"commit": "1" * 40, "tree": "2" * 40}
                  candidate = {"commit": "3" * 40, "tree": "4" * 40}
                  row = {
                      "sourceIdentityPolicy": "candidate_or_exact_observation_v1",
                      "mappingSourceIdentityMode": "exact_blob",
                      "sourceBase": source,
                      "observedAtHead": candidate,
                      "observedSourcePaths": ["dummy-source"],
                      "operations": [],
                  }

                  with (
                      patch.object(
                          MAPS,
                          "checked_identity",
                          side_effect=[source, candidate],
                      ) as checked,
                      patch.object(MAPS, "evidence_paths", return_value=[]),
                      patch.object(MAPS, "checked_source_path") as checked_path,
                      patch.object(MAPS, "require_tracked_paths"),
                  ):
                      checked_path.return_value.exists.return_value = True
                      MAPS.verify_source_identity(
                          row,
                          [],
                          candidate,
                          check_checkout=False,
                      )

                  checked.assert_has_calls(
                      [
                          call(source, candidate, require_ancestor=False),
                          call(candidate, candidate),
                      ]
                  )


          if __name__ == "__main__":
              unittest.main()
          ''',
              encoding="utf-8",
          )
          PY

      - name: Verify remediation against the full documentation gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_hepta_exact_blob_provenance.py
          python3 -m unittest discover -v -s scripts -p 'test_hepta_*.py'
          python3 scripts/hepta-docs.py verify
          git diff --check

      - name: Commit repaired verifier to the active convergence branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/learning-plasticity-verifier-remediation.yml
          git add scripts/hepta-implementation-maps.py scripts/test_hepta_exact_blob_provenance.py
          git commit -m "fix(docs): accept exact-blob integration provenance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
