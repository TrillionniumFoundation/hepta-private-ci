name: Hepta memory retrieval A-E one-shot formatter

on:
  push:
    branches:
      - work/memory-retrieval-ae-convergence-20260928
    paths:
      - .github/workflows/hepta-memory-retrieval-ae-format.yml

permissions:
  contents: write

concurrency:
  group: memory-retrieval-ae-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: contains(github.event.head_commit.message, '[retrieval-ae-format-v1]')
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify one-shot scope and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "TrillionniumFoundation/hepta-private-ci"
          test "${GITHUB_REF_NAME}" = "work/memory-retrieval-ae-convergence-20260928"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          case "$(git log -1 --pretty=%B)" in
            *'[retrieval-ae-format-v1]'*) ;;
            *) echo 'missing one-shot format marker' >&2; exit 1 ;;
          esac

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Apply canonical workspace formatting
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all

      - name: Prove formatter output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain --untracked-files=all)"
          (cd codex-rs && cargo +1.95.0 fmt --all -- --check)
          git add codex-rs
          test -n "$(git diff --cached --name-only)"

      - name: Commit after remote-head compare-and-swap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory.retrieval): apply pinned Rust formatting'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
