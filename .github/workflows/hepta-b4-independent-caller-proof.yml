name: Hepta B4 independent caller proof (exact source)

on:
  pull_request:
    paths:
      - "qa/b4-no-bypass/**"
      - "CALLERS.toml"
      - "scripts/verify_hepta_callers.py"
      - "scripts/hepta_typed_callers.py"
      - "codex-rs/hepta-neuron/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - ".github/workflows/hepta-b4-independent-caller-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-b4-independent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: Verify BOTH independent privileged caller inventories
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Python runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Assert exact SHA and current caller proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 scripts/verify_hepta_callers.py self-test
          python3 scripts/verify_hepta_callers.py verify
      - name: Execute independent B4 no-bypass closed-world regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qa/b4-no-bypass -p 'test_*.py' -v
      - name: Require unmodified checkout
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
