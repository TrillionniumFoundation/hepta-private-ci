name: HCSN finite current-state retained arithmetic
on:
  pull_request:
    paths:
      - 'qualification/hcsn_currentstate/**'
      - 'scripts/verify_hcsn_currentstate_retained.py'
      - '.github/workflows/hcsn-currentstate-retained.yml'
permissions:
  contents: read
jobs:
  retained-currentstate-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retained current-state evidence only
        run: python scripts/verify_hcsn_currentstate_retained.py
      - name: Check clean executing source
        run: git diff --exit-code
