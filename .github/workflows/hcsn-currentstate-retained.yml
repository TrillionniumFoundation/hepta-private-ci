name: HCSN finite current-state qualification
on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate/**"
      - "scripts/verify_hcsn_currentstate_retained.py"
      - ".github/workflows/hcsn-currentstate-retained.yml"
permissions:
  contents: read
jobs:
  retained-currentstate-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify retained current-state evidence only
        run: python scripts/verify_hcsn_currentstate_retained.py
      - name: Check clean executing source
        run: git diff --exit-code
  differentiable-currentstate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install the bounded CPU study dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Record the tested source and runtime
        run: |
          mkdir -p "$RUNNER_TEMP/currentstate"
          git rev-parse HEAD > "$RUNNER_TEMP/currentstate/SOURCE_HEAD.txt"
          python -m pip freeze > "$RUNNER_TEMP/currentstate/RUNTIME.txt"
      - name: Verify event-time reset snapshots and gradients
        run: |
          python - > "$RUNNER_TEMP/currentstate/RESET_SNAPSHOT_STDOUT.txt" \
            2> "$RUNNER_TEMP/currentstate/RESET_SNAPSHOT_STDERR.txt" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import unittest
          import torch

          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "qualification.hcsn_currentstate.test_reset_snapshot"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          paths = ("differentiable.py", "test_reset_snapshot.py")
          source = Path("qualification/hcsn_currentstate")
          print(json.dumps({"tests_run": result.testsRun, "passed": result.wasSuccessful(),
                            "source_sha256": {name: hashlib.sha256((source / name).read_bytes()).hexdigest()
                                              for name in paths}}, sort_keys=True))
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 2 else 1)
          PY
      - name: Verify complete state, gradients and independent-target learning
        run: |
          python -m qualification.hcsn_currentstate.study_differentiable \
            --output "$RUNNER_TEMP/currentstate/STUDY.json" \
            > "$RUNNER_TEMP/currentstate/STDOUT.txt" \
            2> "$RUNNER_TEMP/currentstate/STDERR.txt"
      - name: Check clean executing source
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differentiable-currentstate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/currentstate
          if-no-files-found: error
