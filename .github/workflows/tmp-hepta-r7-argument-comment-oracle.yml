name: Temporary r7 argument-comment oracle repair

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/tmp-hepta-r7-argument-comment-oracle.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: tmp-hepta-r7-argument-comment-oracle
  cancel-in-progress: false

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Repair canonical oracle, clean temporary controls, and dispatch r7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: TrillionniumFoundation/hepta-private-ci
          CONTROLLER_REF: ops/hepta-global-gap-closure-controller-20260910-r1
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${CONTROLLER_REF}"
          python3 scripts/tmp-hepta-r7-argument-comment-oracle.py
          python3 -m py_compile scripts/hepta-global-finalizer-r7.py
          rm scripts/tmp-hepta-r7-argument-comment-oracle.py
          rm .github/workflows/tmp-hepta-r7-argument-comment-oracle.yml
          rm -f .github/workflows/tmp-hepta-r7-dispatch.yml
          git config user.name 'Hepta Blocker Remediator'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit --signoff -m 'fix(hepta): accept canonical compact argument comments in r7'
          git fetch --no-tags origin "${CONTROLLER_REF}"
          git rebase "origin/${CONTROLLER_REF}"
          git push origin "HEAD:refs/heads/${CONTROLLER_REF}"
          expected="$(git rev-parse HEAD)"
          observed="$(git ls-remote origin "refs/heads/${CONTROLLER_REF}" | cut -f1)"
          test "${observed}" = "${expected}"
          gh workflow run hepta-global-finalizer-r7.yml \
            --repo "${REPOSITORY}" \
            --ref "${CONTROLLER_REF}" \
            -f target_branch=integration/hepta-all-gap-closure-20260910-r7 \
            -f shard_count=8
