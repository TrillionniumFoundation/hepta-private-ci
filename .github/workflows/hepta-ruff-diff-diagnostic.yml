name: Hepta Ruff exact diff diagnostic (read-only)

on:
  pull_request:
    paths:
      - ".github/workflows/hepta-ruff-diff-diagnostic.yml"
      - "scripts/**"
      - "codex-rs/hepta-ndu/**"

permissions:
  contents: read

concurrency:
  group: hepta-ruff-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Read-only Ruff discrepancy evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Record pinned Ruff differences without modifying repository
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          git diff --check
          uv run --frozen --project scripts ruff --version
          uv run --frozen --project scripts ruff format --diff scripts .github
      - name: Verify checkout unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
