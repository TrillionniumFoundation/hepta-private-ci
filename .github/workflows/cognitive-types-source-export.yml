name: cognitive-types-source-export

on:
  push:
    branches: ['codex/cognitive-types-full-closure-20260927']
    paths: ['.github/workflows/cognitive-types-source-export.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-types-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export source objects, not qualification claims
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/cognitive-source"
          git rev-parse HEAD > "$RUNNER_TEMP/cognitive-source/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/cognitive-source/source-tree.txt"
          # Keep one complete immutable archive so authorized development can
          # patch the exact remote tree without a write-capable CI workflow.
          git archive --format=tar HEAD > "$RUNNER_TEMP/cognitive-source/source.tar"
          git bundle create "$RUNNER_TEMP/cognitive-source/source.bundle" HEAD refs/remotes/origin/main refs/remotes/origin/codex/cognitive-types-production-hardening-20260926
          cd "$RUNNER_TEMP/cognitive-source"
          shasum -a 256 source.tar source.bundle > SHA256SUMS
      - name: Upload immutable source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-types-source-${{ github.sha }}
          path: ${{ runner.temp }}/cognitive-source
          if-no-files-found: error
          retention-days: 7
