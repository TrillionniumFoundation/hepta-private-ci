name: cognitive-types-source-export
run-name: cognitive-types-source-export @ ${{ github.sha }}

on:
  push:
    branches: ['codex/cognitive-types-full-closure-20260927']
    paths:
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/hepta-cognitive-types/**'
      - 'codex-rs/hepta-cognitive-read/**'
      - 'codex-rs/hepta-cognitive-store/**'
      - 'codex-rs/hepta-memory-retrieval/**'
      - 'codex-rs/hepta-compact-engine/**'
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/hepta-memory/**'
      - 'codex-rs/hepta-authbus/**'
      - 'codex-rs/state/**'
      - 'codex-rs/hepta-agentd/src/intelligence_product*.rs'
      - 'codex-rs/hepta-agentd/tests/cognitive_store_product_writer.rs'
      - 'docs/modules/cognitive.types/**'
      - 'docs/hnmf/**'
      - 'qualification/cognitive-types-v1/**'
      - 'qualification/cognitive-types-v2/**'
      - 'qualification/cognitive-types-mutation/**'
      - 'scripts/hepta-hnmf.py'
      - 'scripts/cognitive_types_mutants.py'
      - '.github/workflows/cognitive-types-source-export.yml'
      - '.github/workflows/cognitive-types-qualification.yml'
      - '.github/workflows/hnmf-qualification.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/hepta-cognitive-types/**'
      - 'codex-rs/hepta-cognitive-read/**'
      - 'codex-rs/hepta-cognitive-store/**'
      - 'codex-rs/hepta-memory-retrieval/**'
      - 'codex-rs/hepta-compact-engine/**'
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/hepta-memory/**'
      - 'codex-rs/hepta-authbus/**'
      - 'codex-rs/state/**'
      - 'codex-rs/hepta-agentd/src/intelligence_product*.rs'
      - 'codex-rs/hepta-agentd/tests/cognitive_store_product_writer.rs'
      - 'docs/modules/cognitive.types/**'
      - 'docs/hnmf/**'
      - 'qualification/cognitive-types-v1/**'
      - 'qualification/cognitive-types-v2/**'
      - 'qualification/cognitive-types-mutation/**'
      - 'scripts/hepta-hnmf.py'
      - 'scripts/cognitive_types_mutants.py'
      - '.github/workflows/cognitive-types-source-export.yml'
      - '.github/workflows/cognitive-types-qualification.yml'
      - '.github/workflows/hnmf-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only the latest branch candidate needs an exported source bundle. Every
# surviving artifact is still bound to its exact SHA and tree below; superseded
# intermediate pushes are cancelled rather than competing with qualification.
concurrency:
  group: cognitive-types-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Export immutable source objects
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/cognitive-source"
          mkdir -p "$export_dir"
          git rev-parse HEAD > "$export_dir/source-sha.txt"
          git rev-parse HEAD^{tree} > "$export_dir/source-tree.txt"
          git archive --format=tar HEAD > "$export_dir/source.tar"
          git bundle create "$export_dir/source.bundle" HEAD
          (
            cd "$export_dir"
            sha256sum source.tar source.bundle > SHA256SUMS
          )

      - name: Upload immutable source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-types-source-${{ github.sha }}
          path: ${{ runner.temp }}/cognitive-source
          if-no-files-found: error
          retention-days: 14
