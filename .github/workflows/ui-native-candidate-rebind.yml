name: ui.native candidate rebind

on:
  workflow_dispatch:
  push:
    branches:
      - work/ui-native-full-closure-20260927

permissions:
  contents: write

concurrency:
  group: ui-native-candidate-rebind
  cancel-in-progress: false

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/ui-native-full-closure-20260927

      - name: Format native Rust source
        run: cargo fmt --manifest-path apps/hepta-native/Cargo.toml --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- apps/hepta-native; then
            git add apps/hepta-native
            git commit -m "style(ui.native): format closure candidate"
          fi

      - name: Rebind ui.native implementation map
        run: python3 scripts/hepta-implementation-maps.py migrate --module ui.native

      - name: Verify generated map at clean candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/modules/ui.native/IMPLEMENTATION_MAP.json; then
            echo "implementation map already current"
          else
            git add docs/modules/ui.native/IMPLEMENTATION_MAP.json
            git commit -m "docs(ui.native): rebind implementation map"
          fi
          python3 scripts/hepta-implementation-maps.py verify --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})"

      - name: Push generated commits
        run: git push origin HEAD:work/ui-native-full-closure-20260927
