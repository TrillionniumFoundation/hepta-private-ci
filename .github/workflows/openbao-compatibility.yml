name: OpenBao compatibility qualification

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbao-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: ${{ github.ref_name != 'research/hcsn-n256-firststep-dense-oracle-dispatch-bridge-20261120-c06d' }}
    name: Verify OpenBao replacement integrity and qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate compatibility state without blocking ordinary source merge
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/verify_openbao_compatibility.py --report-only

      - name: Run explicit fail-closed replacement qualification
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/verify_openbao_compatibility.py

  hcsn-n256-one-shot:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'research/hcsn-n256-firststep-dense-oracle-dispatch-bridge-20261120-c06d' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UNIQUE_EXECUTION_KEY: hcsn-n256-firststep-dense-oracle-hosted-20261118-c06d-001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.3
      - name: Install exact binary numerical runtime
        run: python -m pip install --only-binary=:all: -r qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/requirements.txt
      - name: Verify dispatch bridge and original frozen source
        run: |
          python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_dispatch_bridge.verify_source
          python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_registered_bridge.verify_source
          python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.verify_source
      - name: Run original source controls
        run: |
          python -m unittest qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.test_launcher
          python -O -m unittest qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.test_launcher
      - name: Execute the original unique key once
        run: python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.launcher
      - name: Preserve SUCCESS or RED originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-firststep-dense-oracle-hosted-001-dispatch-bridge
          path: qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 30
