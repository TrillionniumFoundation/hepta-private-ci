name: OpenBao compatibility qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-bao-adapter/**"
      - "codex-rs/hepta-contracts/src/final_use*.rs"
      - "codex-rs/hepta-contracts/FINAL_USE*.md"
      - "codex-rs/hepta-agentd/**"
      - "scripts/verify_openbao_compatibility.py"
      - ".github/workflows/openbao-compatibility.yml"
  push:
    branches:
      - main
    paths:
      - "codex-rs/hepta-bao-adapter/**"
      - "codex-rs/hepta-contracts/src/final_use*.rs"
      - "codex-rs/hepta-contracts/FINAL_USE*.md"
      - "codex-rs/hepta-agentd/**"
      - "scripts/verify_openbao_compatibility.py"
      - ".github/workflows/openbao-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbao-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Verify OpenBao replacement integrity and qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate compatibility state without blocking ordinary source merge
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/verify_openbao_compatibility.py --report-only

      - name: Run explicit fail-closed replacement qualification
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/verify_openbao_compatibility.py
