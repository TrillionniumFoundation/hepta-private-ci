name: OpenBao compatibility qualification

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbao-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Verify OpenBao replacement integrity and qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate compatibility state without blocking ordinary source merge
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/verify_openbao_compatibility.py --report-only

      - name: Run explicit fail-closed replacement qualification
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/verify_openbao_compatibility.py
