name: compact.engine direct source materialization

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: compact-engine-direct-materialization
  cancel-in-progress: false

jobs:
  materialize:
    name: Verify and commit ordinary compact.engine source
    if: >-
      github.event.action == 'reopened' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/compact-engine-current-main-convergence-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      MATERIALIZE_PARENT: 257d1f72500d44072dd9265092601916d9817195
      TRANSPORT_PARENT: 2e2a847a04d7e450b3b627601680984ff48d1ca0
      TARGET_BRANCH: fix/compact-engine-current-main-convergence-20260925
      PATCH_SHA256: 3610e3e56f865c1047d99b0c2a891751571ded7e7d0eeb0ab95387415314107d
      COORDINATOR_BLOB: d0d9cb9a0cf5bb6d4fa01a44327f40d23cee5721
      DURABLE_BLOB: 1c245c6da5065b354602191251e32be1fb216b99
      LIB_BLOB: 0a77ea031a4d6b2e1aeaca9bdc56386324bf1208
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 3
          persist-credentials: true

      - name: Verify exact trigger and transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$MATERIALIZE_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/compact-engine-materialize-direct.yml"
          test -d .github/compact-engine-materialize
          test -f .github/workflows/compact-engine-durable-normalize-once.yml
          test -f .github/workflows/compact-engine-qualification.yml

      - name: Reconstruct exact bounded patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compact-engine-materialize-evidence"
          cat .github/compact-engine-materialize/patch-* | base64 --decode > "$RUNNER_TEMP/compact-engine.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/compact-engine.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/compact-engine.patch"
          git apply "$RUNNER_TEMP/compact-engine.patch"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/coordinator.rs)" = "$COORDINATOR_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/durable.rs)" = "$DURABLE_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/lib.rs)" = "$LIB_BLOB"
          test ! -e codex-rs/hepta-compact-engine/src/durable_facade.rs
          git diff --check

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy

      - name: Format and locked build
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/format.log"
          cargo check --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/check.log"

      - name: Native tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/test.log"

      - name: Strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/clippy.log"

      - name: Commit verified ordinary source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object codex-rs/hepta-compact-engine/src/coordinator.rs)" = "$COORDINATOR_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/durable.rs)" = "$DURABLE_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/lib.rs)" = "$LIB_BLOB"
          git checkout "$TRANSPORT_PARENT" -- .github/workflows/compact-engine-qualification.yml
          rm -rf .github/compact-engine-materialize
          rm -f .github/workflows/compact-engine-durable-normalize-once.yml
          rm -f .github/workflows/compact-engine-materialize-direct.yml
          git add -A
          git diff --cached --check
          git config user.name 'compact.engine direct materializer'
          git config user.email 'compact-engine-materializer@invalid.example'
          git commit -m 'refactor(compact.engine): converge durable transaction owner'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-engine-direct-materialize-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-engine-materialize-evidence/
          if-no-files-found: warn
          retention-days: 7
