name: hcsn-currentstate-n256-uniformization-provider-intent

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_uniformization_provider_intent/**"
      - ".github/workflows/hcsn-currentstate-n256-uniformization-provider-intent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled source fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_uniformization_provider_intent.test_provider -v
      - name: Optimized source fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_uniformization_provider_intent.test_provider -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_uniformization_provider_intent/*.py
      - name: Verify exact frozen source and parents
        run: python3 -m qualification.hcsn_currentstate_n256_uniformization_provider_intent.verify_source
