name: Hepta objective admission qualification

on:
  # Automatic pull-request and main-branch fan-out is owned by the two
  # aggregate checks. Deep qualifications remain reusable and manually runnable.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hepta-objective-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Validate exact-source and target-host recorders
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "${SOURCE_SHA}" \
            --expected-tree "${SOURCE_TREE}"
          python3 scripts/hepta-objective-target-measure.py --self-test

      - name: Objective and product-composition tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-objective -- --nocapture
          cargo test --locked -p codex-hepta-learning-ledger run_start -- --nocapture
          cargo test --locked -p codex-hepta-intelligence objective_run -- --nocapture
          cargo test --locked -p codex-hepta-agentd objective_runtime -- --nocapture

      - name: Strict objective and product-composition lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p codex-hepta-objective \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-intelligence \
            -p codex-hepta-agentd \
            --all-targets -- -D warnings

      - name: Formatting and clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-objective \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-intelligence \
            --package codex-hepta-agentd -- --check
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
