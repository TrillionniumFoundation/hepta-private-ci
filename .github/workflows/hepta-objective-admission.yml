name: Hepta objective admission qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - codex-rs/hepta-objective/**
      - codex-rs/hepta-intelligence/src/objective_product*.rs
      - codex-rs/hepta-intelligence/src/lib.rs
      - codex-rs/hepta-intelligence/Cargo.toml
      - codex-rs/hepta-types/**
      - docs/modules/objective.compiler/**
      - docs/readiness/OBJECTIVE_COMPILER_EXECUTION.md
      - qualification/module-execution-dossiers/detail/objective.compiler.md
      - .github/workflows/hepta-objective-admission.yml

permissions:
  contents: read

concurrency:
  group: hepta-objective-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Objective and product caller tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-objective -- --nocapture
          cargo test --locked -p codex-hepta-intelligence objective_product -- --nocapture

      - name: Strict objective and product caller lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-objective -p codex-hepta-intelligence --all-targets -- -D warnings

      - name: Formatting and clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-objective --package codex-hepta-intelligence -- --check
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
