name: Temporary Hepta branch-content snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hepta-branch-snapshot.yml

permissions:
  contents: read

concurrency:
  group: hepta-branch-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.event.pull_request.number == 541 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source and full branch history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Export verified Git objects and branch tips
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          output="$RUNNER_TEMP/hepta-branch-snapshot"
          mkdir -p "$output"
          git for-each-ref --format='%(refname) %(objectname) %(symref)' \
            refs/remotes/origin/ > "$output/branch-tips.txt"
          git rev-parse HEAD HEAD^{tree} > "$output/source-identity.txt"
          git bundle create "$output/repository.bundle" --all
          git bundle verify "$output/repository.bundle" \
            > "$output/bundle-verification.txt" 2>&1
          git fsck --connectivity-only --no-dangling
          (cd "$output" && sha256sum repository.bundle branch-tips.txt \
            source-identity.txt > SHA256SUMS)

      - name: Retain reconciliation snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-branch-snapshot-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-branch-snapshot/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
