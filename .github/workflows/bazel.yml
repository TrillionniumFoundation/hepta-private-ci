name: Bazel

# Note this workflow was originally derived from:
# https://github.com/cerisier/toolchains_llvm_bootstrapped/blob/main/.github/workflows/ci.yaml

on:
  push:
    branches:
      - dot/windows-permission-queue-controls-20261006
  workflow_call:
    inputs:
      reusable-call:
        description: Preserve ordinary qualification when invoked by a caller workflow
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      qualification-group:
        description: Explicit scoped diagnostic; full preserves ordinary qualification
        type: choice
        required: true
        default: full
        options:
          - full
          - linux-supervisor
          - windows-platform

permissions:
  contents: read

concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}${{ github.event_name == 'push' && github.ref == 'refs/heads/dot/windows-permission-queue-controls-20261006' && inputs.reusable-call != true && '::diagnostic-permission-queue-controls-push' || '' }}${{ inputs.qualification-group != '' && inputs.qualification-group != 'full' && format('::diagnostic-{0}', inputs.qualification-group) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    if: ${{ (inputs.qualification-group == '' || inputs.qualification-group == 'full') && !(github.event_name == 'push' && github.ref == 'refs/heads/dot/windows-permission-queue-controls-20261006' && inputs.reusable-call != true) }}
    # PRs use the sharded Windows cross-compiled test jobs below. Post-merge
    # pushes to main also run the native Windows test job for broader Windows
    # signal without putting PR latency back on the critical path. When
    # Code-mode unit tests run on every Bazel target. When authenticated RBE
    # is available, the Windows-cross shards exercise the source-built V8 path.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

          # Linux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # 2026-02-27 Bazel tests have been flaky on arm in CI.
          # Disable until we can investigate and stabilize them.
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-musl
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: Check rusty_v8 MODULE.bazel checksums
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 .github/scripts/rusty_v8_bazel.py check-module-bazel
          just test-github-scripts

      - name: Check MODULE.bazel.lock is up to date
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: ./scripts/check-module-bazel-lock.sh

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_wrapper_args=(
            --print-failed-action-summary
            --print-failed-test-logs
          )
          bazel_test_args=(
            test
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
          )
          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows-shard:
    if: ${{ (inputs.qualification-group == '' || inputs.qualification-group == 'full') && !(github.event_name == 'push' && github.ref == 'refs/heads/dot/windows-permission-queue-controls-20261006' && inputs.reusable-call != true) }}
    # Split the native Windows Bazel test leg across separate Windows hosts.
    # Build actions and host-loaded proc macros use the same MSVC ABI as the
    # test binaries, avoiding cross-ABI native archive linkage.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    runs-on: windows-latest
    name: Bazel test on windows-latest for x86_64-pc-windows-msvc shard ${{ matrix.shard }}/4
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test BuildBuddy Bazel wrapper
        if: matrix.shard == 1
        shell: pwsh
        run: python -m unittest discover -s .github/scripts -p 'test_run_bazel*.py'

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          # Reuse the former monolithic Windows test cache for restores. Do
          # not save it from every shard below; duplicate uploads would sit on
          # the PR-blocking critical path after the useful test work is done.
          cache-scope: bazel-test

      - name: Smoke test the native MSVC header parser
        if: matrix.shard == 1
        shell: pwsh
        run: python .github/scripts/llvm_header_parser_smoke.py --bazel-msvc

      - name: bazel test shard
        env:
          BAZEL_TEST_SHARD: ${{ matrix.shard }}
          BAZEL_TEST_SHARD_COUNT: 4
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          bazel_test_query='tests(//...) except tests(//third_party/v8:all) except attr(tags, "manual", tests(//...))'
          mapfile -t bazel_targets < <(
            ./.github/scripts/run-bazel-query-ci.sh --output=label -- "${bazel_test_query}" \
              | LC_ALL=C sort
          )

          selected_targets=()
          for bazel_target in "${bazel_targets[@]}"; do
            target_bucket="$(
              printf '%s\n' "${bazel_target}" \
                | cksum \
                | awk -v shard_count="${BAZEL_TEST_SHARD_COUNT}" '{ print ($1 % shard_count) + 1 }'
            )"
            if [[ "${target_bucket}" == "${BAZEL_TEST_SHARD}" ]]; then
              selected_targets+=("${bazel_target}")
            fi
          done

          if [[ ${#selected_targets[@]} -eq 0 ]]; then
            echo "No Bazel test targets selected for Windows shard ${BAZEL_TEST_SHARD}/${BAZEL_TEST_SHARD_COUNT}." >&2
            exit 1
          fi

          echo "Selected ${#selected_targets[@]} of ${#bazel_targets[@]} Bazel test targets for Windows shard ${BAZEL_TEST_SHARD}/${BAZEL_TEST_SHARD_COUNT}."

          bazel_test_args=(
            test
            --platforms=//:windows_x86_64_msvc
            --skip_incompatible_explicit_targets
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_test_shard=${BAZEL_TEST_SHARD}
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${selected_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-x86_64-pc-windows-msvc-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows:
    timeout-minutes: 30
    # Preserve the existing required-check surface while the real work happens
    # in the sharded Windows jobs above.
    if: ${{ always() && (inputs.qualification-group == '' || inputs.qualification-group == 'full') && !(github.event_name == 'push' && github.ref == 'refs/heads/dot/windows-permission-queue-controls-20261006' && inputs.reusable-call != true) }}
    needs: test-windows-shard
    runs-on: ubuntu-24.04
    name: Bazel test on windows-latest for x86_64-pc-windows-msvc

    steps:
      - name: Confirm Windows Bazel test shards passed
        shell: bash
        run: |
          if [[ "${{ needs.test-windows-shard.result }}" != "success" ]]; then
            echo "Windows Bazel test shards finished with result: ${{ needs.test-windows-shard.result }}" >&2
            exit 1
          fi

  test-windows-native-main:
    # Native Windows Bazel tests are slower and frequently approach the
    # 30-minute PR budget. Run this only for post-merge commits to main and give
    # it a larger timeout.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (inputs.qualification-group == '' || inputs.qualification-group == 'full') }}
    timeout-minutes: 40
    runs-on: windows-latest
    name: Bazel test on windows-latest for x86_64-pc-windows-msvc (native main)
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-${{ github.job }}

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_test_args=(
            test
            --platforms=//:windows_x86_64_msvc
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_native_main=true
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-windows-native-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  clippy:
    if: ${{ (inputs.qualification-group == '' || inputs.qualification-group == 'full') && !(github.event_name == 'push' && github.ref == 'refs/heads/dot/windows-permission-queue-controls-20261006' && inputs.reusable-call != true) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Linux lint coverage on x64 and add the arm64 macOS path that
          # the Bazel test job already exercises. Add Windows gnullvm as well
          # so PRs get Bazel-native lint signal on the same Windows toolchain
          # that the Bazel test job uses.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runs_on || matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: bazel build --config=clippy lint targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_clippy_args=(
            --config=clippy
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=clippy
          )
          bazel_wrapper_args=()
          bazel_target_list_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Keep host-loaded proc macros and native libraries on one Windows
            # ABI while preserving the complete Bazel clippy target set.
            bazel_wrapper_args+=(--windows-msvc-host-platform)
            bazel_clippy_args+=(--platforms=//:windows_x86_64_msvc)
          fi

          bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh "${bazel_target_list_args[@]}")"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          # Preserve each selected label exactly; do not record environment or credentials.
          if (( ${#bazel_targets[@]} > 0 )); then
            printf '%s\0' "${bazel_targets[@]}" > "$RUNNER_TEMP/bazel-execution-logs/clippy-requested-targets.nul" ||
              printf '%s\n' '::warning::Could not retain the Clippy target label inventory' >&2
          else
            : > "$RUNNER_TEMP/bazel-execution-logs/clippy-requested-targets.nul" ||
              printf '%s\n' '::warning::Could not retain the empty Clippy target label inventory' >&2
          fi

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # The query is unconfigured: these manual helpers are explicitly
            # GNU-only in defs.bzl or Unix-only in the Agentd BUILD file.
            # Native counterparts remain covered by the wildcard and manual
            # roster. Keep unexpected incompatibilities fatal in Bazel.
            native_bazel_targets=()
            for target in "${bazel_targets[@]}"; do
              case "$target" in
                *-windows-cross-bin|//codex-rs/hepta-agentd:hepta-agentd-cognitive-product-qualification-test-bin)
                  printf 'Native MSVC excludes incompatible helper: %s\n' "$target"
                  ;;
                *) native_bazel_targets+=("$target") ;;
              esac
            done
            bazel_targets=("${native_bazel_targets[@]}")
          fi

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            "${bazel_wrapper_args[@]}" \
            -- \
            build \
            "${bazel_clippy_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-clippy-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify-release-build:
    if: ${{ (inputs.qualification-group == '' || inputs.qualification-group == 'full') && !(github.event_name == 'push' && github.ref == 'refs/heads/dot/windows-permission-queue-controls-20261006' && inputs.reusable-call != true) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runs_on || matrix.os }}
    name: Verify release build on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: bazel build verify-release-build targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          # This job exists to compile Rust code behind
          # `cfg(not(debug_assertions))` so PR CI catches failures that would
          # otherwise show up only in a release build. We do not need the full
          # optimizer and debug-info work that normally comes with a release
          # build to get that signal, so keep Bazel in `fastbuild` and disable
          # Rust debug assertions explicitly.
          bazel_wrapper_args=()
          bazel_build_args=(
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Release-mode compile coverage must use one coherent native ABI
            # for target crates, proc macros, SQLite, and cryptographic code.
            bazel_wrapper_args+=(--windows-msvc-host-platform)
            bazel_build_args+=(--platforms=//:windows_x86_64_msvc)
          fi

          bazel_target_lines="$(bash ./scripts/list-bazel-release-targets.sh)"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            build \
            "${bazel_build_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Verify Bazel builds bwrap
        if: runner.os == 'Linux'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            --print-failed-action-summary \
            -- \
            build \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_job=verify-bwrap \
            -- \
            //codex-rs/bwrap:bwrap

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-verify-release-build-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  fixed-linux-supervisor:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification-group == 'linux-supervisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    env:
      SOURCE_SHA: ${{ github.sha }}
      TESTED_SHA: ${{ github.sha }}
      HEPTA_CI_LANE: source-head
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Anchor diagnostic budget before checkout
        run: python3 -c 'import time; print(f"HEPTA_PILOT_JOB_STARTED={time.monotonic()}")' >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact manual source
        run: python3 scripts/hepta_ci_candidate.py --source "$SOURCE_SHA" --tested "$TESTED_SHA" --lane source-head
      - name: Prepare bounded measurement without cache restore or upload
        run: python3 scripts/hepta_bazel_cache_pilot.py prepare --directory "$RUNNER_TEMP/hepta-supervisor-measure"
      - name: Prepare existing pinned Bazel environment
        timeout-minutes: 8
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: bazel-test
      - name: Run only Supervisor projection with fresh tests
        timeout-minutes: 48
        run: python3 scripts/hepta_bazel_cache_pilot.py run --directory "$RUNNER_TEMP/hepta-supervisor-measure"
      - name: Verify selected native target actually executed
        run: python3 scripts/hepta_fixed_bazel.py verify-linux --directory "$RUNNER_TEMP/hepta-supervisor-measure"
      - name: Retain source-bound results and bounded diagnostics
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-linux-supervisor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hepta-supervisor-measure/pilot-state.json
            ${{ runner.temp }}/hepta-supervisor-measure/native.json*
            ${{ runner.temp }}/hepta-supervisor-measure/cache-readiness.json
            ${{ runner.temp }}/hepta-supervisor-measure/selected-targets.json
            ${{ runner.temp }}/hepta-supervisor-measure/diagnostics/**
          if-no-files-found: error

  fixed-windows-platform:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.qualification-group == 'windows-platform') || (github.event_name == 'push' && github.ref == 'refs/heads/dot/windows-permission-queue-controls-20261006' && inputs.reusable-call != true) }}
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.sha }}
      TESTED_SHA: ${{ github.sha }}
      HEPTA_CI_LANE: source-head
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Anchor diagnostic budget before checkout
        run: python -c 'import time; print(f"HEPTA_PILOT_JOB_STARTED={time.monotonic()}")' >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact manual source
        run: python scripts/hepta_ci_candidate.py --source "$SOURCE_SHA" --tested "$TESTED_SHA" --lane source-head
      - name: Prepare existing pinned native Windows environment
        timeout-minutes: 8
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test
      - name: Smoke test native MSVC header parser
        timeout-minutes: 3
        run: python .github/scripts/llvm_header_parser_smoke.py --bazel-msvc
      - name: Compute remaining deletion diagnostic step budget
        id: delete-budget
        run: python scripts/hepta_fixed_bazel.py budget --github-output "$GITHUB_OUTPUT"
      - name: Run fixed deletion diagnostic native targets
        timeout-minutes: ${{ fromJSON(steps.delete-budget.outputs.minutes) }}
        run: |
          export HEPTA_BAZEL_BASH="$(cygpath -w "$BASH")"
          python scripts/hepta_fixed_bazel.py windows --group windows-delete-diagnostic --directory "$RUNNER_TEMP/hepta-fixed-windows"
      - name: Retain deletion diagnostic receipt before Queue compilation
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-windows-delete-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hepta-fixed-windows/windows-delete-diagnostic.json
            ${{ runner.temp }}/hepta-fixed-windows/windows-delete-diagnostic.log
            ${{ runner.temp }}/hepta-fixed-windows/windows-delete-diagnostic.bep-tail.jsonl
          if-no-files-found: error
      - name: Compute remaining Queue diagnostic step budget
        id: queue-budget
        if: always() && !cancelled() && steps.delete-budget.outcome == 'success'
        run: python scripts/hepta_fixed_bazel.py budget --github-output "$GITHUB_OUTPUT"
      - name: Run fixed Queue diagnostic native targets
        if: always() && !cancelled() && steps.queue-budget.outcome == 'success'
        timeout-minutes: ${{ fromJSON(steps.queue-budget.outputs.minutes) }}
        run: |
          export HEPTA_BAZEL_BASH="$(cygpath -w "$BASH")"
          python scripts/hepta_fixed_bazel.py windows --group windows-queue-diagnostic --directory "$RUNNER_TEMP/hepta-fixed-windows"
      - name: Retain Queue diagnostic receipt
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-windows-queue-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hepta-fixed-windows/windows-queue-diagnostic.json
            ${{ runner.temp }}/hepta-fixed-windows/windows-queue-diagnostic.log
            ${{ runner.temp }}/hepta-fixed-windows/windows-queue-diagnostic.bep-tail.jsonl
          if-no-files-found: error

  reject-unknown-diagnostic:
    if: inputs.qualification-group != '' && inputs.qualification-group != 'full' && inputs.qualification-group != 'linux-supervisor' && inputs.qualification-group != 'windows-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo 'Unknown explicit qualification group' >&2; exit 1
