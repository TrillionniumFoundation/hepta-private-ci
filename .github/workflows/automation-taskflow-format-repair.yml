name: Automation TaskFlow format repair

on:
  push:
    branches:
      - work/automation-taskflow-full-closure-2026-09-27
    paths:
      - ".github/workflows/automation-taskflow-format-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-taskflow-format-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Apply exact workspace rustfmt
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/automation-taskflow-full-closure-2026-09-27
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt

      - name: Format exact workspace
        shell: bash
        run: |
          set -euo pipefail
          (
            cd codex-rs
            cargo fmt --all
            cargo fmt --all -- --check
          )
          git diff --check

      - name: Commit formatting and remove helper
        shell: bash
        env:
          TARGET_BRANCH: work/automation-taskflow-full-closure-2026-09-27
        run: |
          set -euo pipefail
          git config user.name "hepta-automation-ci"
          git config user.email "hepta-automation-ci@users.noreply.github.com"
          git add codex-rs
          git rm .github/workflows/automation-taskflow-format-repair.yml
          git commit -m "style(automation): apply exact workspace rustfmt"
          git push origin "HEAD:${TARGET_BRANCH}"
