name: control.runtime one-shot qualification fix macOS

on:
  push:
    branches:
      - codex/control-runtime-convergence-v1
    paths:
      - .github/workflows/control-runtime-one-shot-fix-macos.yml

permissions:
  contents: write

concurrency:
  group: control-runtime-one-shot-fix-macos
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/control-runtime-convergence-v1
          fetch-depth: 0
      - name: Apply reviewed qualification fixes and remove temporary workflows
        shell: bash
        env:
          EXPECTED_SOURCE: 5ab1b91aac484b856571e00ee8c865ebb4e318e7
          PATCH_SHA256: 15da68d7e473bb47fdd7350046e880e42916cacc5c05dd584d7fa177582d1945
          PATCH_B64: 
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_SOURCE" HEAD
          git diff --exit-code "$EXPECTED_SOURCE" -- \
            codex-rs/hepta-control-plane/src/organ_fanout_recovery.rs \
            codex-rs/hepta-control-plane/src/planner_journal.rs \
            codex-rs/hepta-control-plane/src/planner_journal_core.rs \
            codex-rs/hepta-control-plane/src/planner_store.rs \
            codex-rs/hepta-control-plane/src/planner_store_core.rs
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          compressed = base64.b64decode(os.environ['PATCH_B64'], validate=True)
          patch = gzip.decompress(compressed)
          observed = hashlib.sha256(patch).hexdigest()
          expected = os.environ['PATCH_SHA256']
          if observed != expected:
              raise SystemExit(f'patch digest mismatch: {observed} != {expected}')
          Path(os.environ['RUNNER_TEMP'], 'control-runtime.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/control-runtime.patch"
          git apply "$RUNNER_TEMP/control-runtime.patch"
          rm -f \
            .github/workflows/control-runtime-one-shot-fix.yml \
            .github/workflows/control-runtime-one-shot-fix-macos.yml
          python3 scripts/control_runtime_validate_state.py --output "$RUNNER_TEMP/control-runtime-state.json"
          git diff --check
          git config user.name "Control Runtime Qualification Bot"
          git config user.email "control-runtime-qualification@users.noreply.github.com"
          git add -A
          git commit -m "fix(control.runtime): close exact qualification blockers"
          git push origin HEAD:codex/control-runtime-convergence-v1
