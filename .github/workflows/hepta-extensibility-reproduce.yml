name: Hepta offline remediation reproduction

on:
  push:
    branches: [fix/long-term-extensibility-20260913]
    paths: [.github/workflows/hepta-extensibility-reproduce.yml]

permissions:
  contents: read

jobs:
  offline-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export only tracked history and the pinned public toolchain
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/offline-reproduction"
          git bundle create "$RUNNER_TEMP/offline-reproduction/source.bundle" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/offline-reproduction/identity.txt"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          toolchain=$(rustup run 1.95.0 rustc --print sysroot)
          rustup run 1.95.0 rustc -vV > "$RUNNER_TEMP/offline-reproduction/rustc.txt"
          tar -C "$toolchain" -czf "$RUNNER_TEMP/offline-reproduction/toolchain.tar.gz" bin lib
          mkdir -p "$RUNNER_TEMP/vendor-probe/src"
          printf 'fn main() {}\n' > "$RUNNER_TEMP/vendor-probe/src/main.rs"
          cat > "$RUNNER_TEMP/vendor-probe/Cargo.toml" <<'TOML'
          [package]
          name = "hepta-offline-dependency-probe"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [dependencies]
          sha2 = "=0.10.9"
          pretty_assertions = "=1.4.1"
          ed25519-dalek = "=2.2.0"
          tempfile = "=3.27.0"
          serde = { version = "=1.0.228", features = ["derive"] }
          serde_json = "=1.0.149"
          thiserror = "=2.0.18"
          TOML
          rustup run 1.95.0 cargo vendor --manifest-path "$RUNNER_TEMP/vendor-probe/Cargo.toml" "$RUNNER_TEMP/vendor-probe/vendor" > "$RUNNER_TEMP/vendor-probe/vendor-config.toml"
          tar -C "$RUNNER_TEMP/vendor-probe" -czf "$RUNNER_TEMP/offline-reproduction/vendor.tar.gz" Cargo.toml Cargo.lock vendor vendor-config.toml
          (cd "$RUNNER_TEMP/offline-reproduction" && sha256sum source.bundle toolchain.tar.gz vendor.tar.gz > SHA256SUMS)
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-offline-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/offline-reproduction
          if-no-files-found: error
          retention-days: 1
