name: Hepta offline remediation reproduction

on:
  push:
    branches: [work/hepta-integrated-blocker-closure-20260913]
    paths: [.github/workflows/hepta-extensibility-reproduce.yml]

permissions:
  contents: read

concurrency:
  group: hepta-offline-reproduction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked parallel-remediation delta only
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          output="$RUNNER_TEMP/offline-reproduction"
          mkdir -p "$output"
          git update-ref refs/heads/offline-548 59aa95ef26a97909207cb0f36edf018fefe372a3
          git update-ref refs/heads/offline-549 97423d9f96c1f8d4c3f7974c6b2e228d9836a23e
          git update-ref refs/heads/offline-550 2981f062545743211967268f85bae5a05e56decd
          git -c pack.threads=2 bundle create "$output/source.bundle" HEAD \
            refs/heads/offline-548 refs/heads/offline-549 refs/heads/offline-550 \
            ^b79f29dd1a361c40f98eef90569a8e71cc76f1c6
          git rev-parse HEAD HEAD^{tree} > "$output/identity.txt"
          git bundle list-heads "$output/source.bundle" > "$output/heads.txt"
          (cd "$output" && sha256sum source.bundle > SHA256SUMS)
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-offline-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/offline-reproduction
          if-no-files-found: error
          retention-days: 1
