name: Hepta offline source reproduction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hepta-extensibility-reproduce.yml

permissions:
  contents: read

concurrency:
  group: hepta-offline-reproduction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export a self-contained exact-source bundle
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          output="$RUNNER_TEMP/offline-reproduction"
          mkdir -p "$output"
          # No historical prerequisite, repair branch, mutable ref or credentials.
          # This is source transport, not a test or qualification receipt.
          git -c pack.threads=2 bundle create "$output/source.bundle" HEAD
          git bundle verify "$output/source.bundle"
          git rev-parse HEAD HEAD^{tree} > "$output/identity.txt"
          git bundle list-heads "$output/source.bundle" > "$output/heads.txt"
          (cd "$output" && sha256sum source.bundle identity.txt heads.txt > SHA256SUMS)
          git diff --check
          git diff --quiet
          git diff --cached --quiet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-offline-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/offline-reproduction
          if-no-files-found: error
          retention-days: 2
