name: control.runtime immutable candidate qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'codex-rs/hepta-control-plane/**'
      - 'codex-rs/hepta-agentd/**'
      - 'codex-rs/hepta-ndu/**'
      - 'codex-rs/hepta-memory/**'
      - 'codex-rs/hepta-operations/**'
      - 'docs/modules/control.runtime/**'
      - 'docs/readiness/CONTROL_RUNTIME*'
      - 'scripts/control_runtime_*'
      - '.github/workflows/control-runtime-candidate.yml'
      - '.github/workflows/control-runtime-crash-recovery.yml'
      - '.github/actions/hepta-synthetic-merge/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-runtime-immutable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  source-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          evidence="$RUNNER_TEMP/control-runtime-source"
          mkdir -p "$evidence"
          git archive --format=tar.gz HEAD > "$evidence/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$evidence/identity.txt"
          sha256sum "$evidence/source.tar.gz" > "$evidence/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-runtime-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/control-runtime-source/*
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: Runtime qualification (${{ matrix.os }}, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        lane: [source-head, base-merge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HEPTA_CI_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable base SHA for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "origin/${{ github.event.repository.default_branch }}")"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
      - uses: ./.github/actions/hepta-synthetic-merge
        if: matrix.lane == 'base-merge'
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number || 0 }}
          author-name: Control Runtime Qualification
          author-email: control-runtime-qualification@users.noreply.github.com
          message: Immutable control.runtime qualification
      - name: Record immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          tested_sha="$(git rev-parse HEAD)"
          if [[ "$HEPTA_CI_LANE" == source-head ]]; then
            test "$tested_sha" = "$SOURCE_SHA"
          fi
          echo "TESTED_SHA=$tested_sha" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/control-runtime-target" >> "$GITHUB_ENV"
          evidence="$RUNNER_TEMP/control-runtime-records"
          mkdir -p "$evidence"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          record = {
              'source_commit': os.environ['SOURCE_SHA'],
              'source_tree': git('rev-parse', os.environ['SOURCE_SHA'] + '^{tree}'),
              'base_commit': os.environ['BASE_SHA'],
              'tested_commit': git('rev-parse', 'HEAD'),
              'tested_tree': git('rev-parse', 'HEAD^{tree}'),
              'parents': git('show', '-s', '--format=%P', 'HEAD').split(),
              'lane': os.environ['HEPTA_CI_LANE'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'],
              'runner_os': os.environ['RUNNER_OS'],
              'runner_arch': os.environ['RUNNER_ARCH'],
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
          }
          Path(os.environ['RUNNER_TEMP'], 'control-runtime-records', 'identity.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Validate canonical module state
        id: state
        continue-on-error: true
        run: >-
          python3 scripts/control_runtime_validate_state.py
          --output "$RUNNER_TEMP/control-runtime-records/state.json"
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev
      - name: Resolve verified V8 artifacts
        id: v8
        continue-on-error: true
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Verify exact workspace lockfile
        id: lock
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/control-runtime-records"
          # A committed Cargo.lock is a reproducibility input, not a request to
          # upgrade every compatible transitive dependency. `--locked` proves
          # the manifests and exact lock agree without rewriting reviewed pins.
          cargo metadata --locked --format-version 1 --no-deps \
            > "$evidence/cargo-metadata.json"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum Cargo.lock > "$evidence/Cargo.lock.sha256"
          else
            shasum -a 256 Cargo.lock > "$evidence/Cargo.lock.sha256"
          fi
          printf '%s\n' clean > "$evidence/lockfile-status.txt"
          printf 'status=clean\n' >> "$GITHUB_OUTPUT"
      - name: Formatting
        id: fmt
        continue-on-error: true
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/control-runtime-records/fmt.json" --
          cargo fmt -p codex-hepta-control-plane -p codex-hepta-agentd -p codex-hepta-ndu -- --check
      - name: Package regression suite
        id: tests
        if: '!cancelled()'
        continue-on-error: true
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/control-runtime-records/tests.json" --
          cargo test --locked
          -p codex-hepta-control-plane -p codex-hepta-agentd -p codex-hepta-ndu
          --features codex-hepta-control-plane/qualification-failpoints
      - name: All-target compilation
        id: check
        if: '!cancelled()'
        continue-on-error: true
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/control-runtime-records/check.json" --
          cargo check --locked --all-targets
          -p codex-hepta-control-plane -p codex-hepta-agentd -p codex-hepta-ndu
          --features codex-hepta-control-plane/qualification-failpoints
      # Lint the declared runtime packages; all-target compilation above still
      # checks their complete dependency graph. Other workspace owners retain
      # their repository-wide lint gates.
      - name: Strict lint for runtime packages
        id: lint
        if: '!cancelled()'
        continue-on-error: true
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py
          --output "$RUNNER_TEMP/control-runtime-records/clippy.json" --
          cargo clippy --locked --all-targets --no-deps
          -p codex-hepta-control-plane -p codex-hepta-agentd -p codex-hepta-ndu
          --features codex-hepta-control-plane/qualification-failpoints -- -D warnings
      - name: Require every independent check and unchanged tracked source
        if: always()
        env:
          STATE_RESULT: ${{ steps.state.outcome }}
          V8_RESULT: ${{ steps.v8.outcome }}
          LOCK_RESULT: ${{ steps.lock.outcome }}
          LOCK_STATUS: ${{ steps.lock.outputs.status }}
          FMT_RESULT: ${{ steps.fmt.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          CHECK_RESULT: ${{ steps.check.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          if ! git diff --exit-code || ! git diff --cached --exit-code; then
            git status --short
            git diff --stat
            git diff --name-only
            exit 1
          fi
          test "$STATE_RESULT" = success
          test "$V8_RESULT" = success
          test "$LOCK_RESULT" = success
          test "$LOCK_STATUS" = clean
          test "$FMT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$LINT_RESULT" = success
      - name: Preserve successes, failures, logs, lock diagnostics, and candidate identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-runtime-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/control-runtime-records/*
          if-no-files-found: error
          retention-days: 30
