name: Objective compiler remediation materializer

on:
  push:
    branches:
      - work/objective-compiler-final-convergence-20260930
    paths:
      - .github/scripts/objective_remediation_materializer.py
      - .github/workflows/hepta-objective-remediation-materializer.yml

permissions:
  contents: write

concurrency:
  group: objective-remediation-materializer-macos
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact objective remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/objective_remediation_materializer.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-objective
          git diff --check
      - name: Commit and push materialized tree
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(objective): restore verifiable convergence"
          git push origin HEAD:refs/heads/work/objective-compiler-final-convergence-20260930
