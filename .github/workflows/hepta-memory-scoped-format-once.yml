name: MemoryCell one-shot AST-equivalent scoped format
on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - .github/workflows/hepta-memory-scoped-format-once.yml
permissions:
  contents: write
jobs:
  scoped-format:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/memory-cell-evidence-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: ./.github/actions/setup-ci
      - name: Format only the nine source files identified by actual failing job
        env:
          BASE: 78fdb0cf8537e3a84fc6e0a849707559c80881e8
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-scoped-format
          python3 -m pip install uv==0.8.22
          cat > /tmp/hepta-scoped-format/paths.txt <<'PATHS'
          scripts/memory_cell/locomo_frozen_retrieval.py
          scripts/memory_cell/locomo_ninearm_source_replay.py
          scripts/memory_cell/stem_oct12_reader_capacity_triage.py
          scripts/memory_cell/stem_train_heldout_bridge.py
          scripts/memory_cell/test_locomo_frozen_retrieval.py
          scripts/memory_cell/test_locomo_ninearm_source_replay.py
          scripts/memory_cell/test_stem_blind_review_workflow.py
          scripts/memory_cell/test_stem_oct12_reader_capacity_triage.py
          scripts/memory_cell/test_stem_train_heldout_bridge.py
          PATHS
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          files = Path('/tmp/hepta-scoped-format/paths.txt').read_text().splitlines()
          assert len(files) == len(set(files)) == 9
          before = {f: ast.dump(ast.parse(Path(f).read_text(encoding='utf-8'))) for f in files}
          Path('/tmp/hepta-scoped-format/ast-before.json').write_text(json.dumps(before, sort_keys=True))
          PY
          mapfile -t paths < /tmp/hepta-scoped-format/paths.txt
          uv run --frozen --project scripts ruff format "${paths[@]}"
          python3 - <<'PY'
          import ast, json, subprocess
          from pathlib import Path
          previous = json.loads(Path('/tmp/hepta-scoped-format/ast-before.json').read_text())
          for name, old in previous.items():
              if ast.dump(ast.parse(Path(name).read_text(encoding='utf-8'))) != old:
                  raise ValueError('formatter modified Python AST: ' + name)
          PY
          git rm -- .github/workflows/hepta-memory-scoped-format-once.yml
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          expected = set(Path('/tmp/hepta-scoped-format/paths.txt').read_text().splitlines())
          expected.add('.github/workflows/hepta-memory-scoped-format-once.yml')
          changed = set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          if not changed or not changed <= expected:
              raise ValueError('out-of-scope formatter change: '+str(sorted(changed-expected)))
          Path('/tmp/hepta-scoped-format/changed.txt').write_text('\n'.join(sorted(changed))+'\n')
          PY
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --check --base "$BASE" 2>&1 | tee /tmp/hepta-scoped-format/format.log
          python3 -m unittest discover -s scripts/memory_cell -p 'test_source_write_effects.py' -v 2>&1 | tee /tmp/hepta-scoped-format/tests.log
          git add -- "${paths[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory-cell): fix nine scoped Ruff formatting violations without AST changes'
          git show --format=fuller --stat HEAD | tee /tmp/hepta-scoped-format/candidate-commit.txt
          git push --porcelain origin HEAD:refs/heads/codex/memory-cell-evidence-20261008
          git rev-parse HEAD | tee /tmp/hepta-scoped-format/pushed-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-scoped-format-observation
          path: /tmp/hepta-scoped-format
          if-no-files-found: warn
