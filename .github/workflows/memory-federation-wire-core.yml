name: memory federation wire protocol core

on:
  push:
    branches:
      - feat/memory-federation-wire-protocol-core-20260930
    paths:
      - codex-rs/hepta-memory-federation-wire/**
      - docs/modules/memory.federation/WIRE_CORE_LAYER.md
      - .github/workflows/memory-federation-wire-core.yml
  pull_request:
    paths:
      - codex-rs/hepta-memory-federation-wire/**
      - docs/modules/memory.federation/WIRE_CORE_LAYER.md
      - .github/workflows/memory-federation-wire-core.yml

permissions:
  contents: read

jobs:
  protocol-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify protocol core
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/hepta-memory-federation-wire/Cargo.toml -- --check
          cargo test --manifest-path codex-rs/hepta-memory-federation-wire/Cargo.toml --lib
          cargo test --manifest-path codex-rs/hepta-memory-federation-wire/Cargo.toml --doc
          cargo clippy --manifest-path codex-rs/hepta-memory-federation-wire/Cargo.toml --all-targets -- -D warnings
