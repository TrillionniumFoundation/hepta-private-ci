name: AuthBus one-shot time-floor authoring

on:
  push:
    branches:
      - auth-authbus-boundary-convergence-20260928
    paths:
      - "codex-rs/hepta-evidence/migrations/0013_authbus_time_floor.sql"
      - "codex-rs/hepta-evidence/src/authbus_time.rs"
      - "codex-rs/hepta-evidence/src/authbus_time_schema.rs"
      - "docs/modules/auth.authbus/TIME_AUTHORITY.md"
      - ".github/workflows/authbus-time-floor-authoring.yml"

permissions:
  contents: write

concurrency:
  group: authbus-time-floor-authoring-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  author-time-floor:
    name: Route AuthBus clocks through Evidence floor
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout triggering branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Route every AuthBus time decision through the durable floor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          def replace_count(path: str, old: str, new: str, count: int) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != count:
                  raise SystemExit(
                      f"expected {count} matches in {path}, found {text.count(old)}: {old!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "codex-rs/hepta-evidence/src/lib.rs",
              "mod authbus_store;\n#[cfg(test)]",
              "mod authbus_store;\nmod authbus_time;\n#[cfg(test)]",
          )
          replace_once(
              "codex-rs/hepta-evidence/src/lib.rs",
              "pub use authbus_store::AuthBusAdmissionError;\n",
              "pub use authbus_store::AuthBusAdmissionError;\npub use authbus_time::AuthBusTimeFloor;\n",
          )
          replace_once(
              "codex-rs/hepta-evidence/src/schema_validation.rs",
              "#[path = \"authbus_recovery_schema.rs\"]\nmod authbus_recovery_schema;\n",
              "#[path = \"authbus_recovery_schema.rs\"]\nmod authbus_recovery_schema;\n#[path = \"authbus_time_schema.rs\"]\nmod authbus_time_schema;\n",
          )
          replace_once(
              "codex-rs/hepta-evidence/src/schema_validation.rs",
              "        .chain(authbus_recovery_schema::REQUIRED_SCHEMA_OBJECTS)\n",
              "        .chain(authbus_recovery_schema::REQUIRED_SCHEMA_OBJECTS)\n        .chain(authbus_time_schema::REQUIRED_SCHEMA_OBJECTS)\n",
          )

          replace_once(
              "codex-rs/hepta-evidence/src/authbus_store.rs",
              "use crate::schema_validation::classify_sqlx_error;\nuse crate::store::now_millis;\n",
              "use crate::authbus_time::authbus_now;\nuse crate::schema_validation::classify_sqlx_error;\n",
          )
          replace_once(
              "codex-rs/hepta-evidence/src/authbus_store.rs",
              "        let now = u64::try_from(now_millis()?)\n",
              "        let now = u64::try_from(authbus_now(&mut transaction).await?)\n",
          )

          replace_once(
              "codex-rs/hepta-evidence/src/authbus_outbox.rs",
              "use crate::schema_validation::classify_sqlx_error;\nuse crate::store::now_millis;\n",
              "use crate::authbus_time::authbus_now;\nuse crate::schema_validation::classify_sqlx_error;\n",
          )
          replace_count(
              "codex-rs/hepta-evidence/src/authbus_outbox.rs",
              "let now = now_millis()?;",
              "let now = authbus_now(&mut tx).await?;",
              3,
          )

          replace_once(
              "codex-rs/hepta-evidence/src/authbus_outbox_worker.rs",
              "use crate::schema_validation::classify_sqlx_error;\nuse crate::store::now_millis;\n",
              "use crate::authbus_time::authbus_now;\nuse crate::schema_validation::classify_sqlx_error;\n",
          )
          replace_once(
              "codex-rs/hepta-evidence/src/authbus_outbox_worker.rs",
              "    let now = now_millis()?;\n",
              "    let now = authbus_now(&mut tx).await?;\n",
          )

          replace_once(
              "codex-rs/hepta-evidence/src/authbus_recovery.rs",
              "use crate::schema_validation::classify_sqlx_error;\nuse crate::store::now_millis;\n",
              "use crate::authbus_time::authbus_now;\nuse crate::schema_validation::classify_sqlx_error;\n",
          )
          replace_count(
              "codex-rs/hepta-evidence/src/authbus_recovery.rs",
              ".bind(now_millis()?)",
              ".bind(authbus_now(&mut tx).await?)",
              4,
          )

          replace_once(
              "codex-rs/hepta-evidence/src/authbus_operations.rs",
              "use crate::schema_validation::classify_sqlx_error;\nuse crate::store::now_millis;\n",
              "use crate::schema_validation::classify_sqlx_error;\n",
          )
          replace_once(
              "codex-rs/hepta-evidence/src/authbus_operations.rs",
              "        let observed_at_ms = now_millis()?;\n",
              "        let observed_at_ms = i64::try_from(self.authbus_monotonic_now_ms().await?)\n            .map_err(|_| EvidenceError::Unavailable(\"AuthBus time floor exceeds i64\".into()))?;\n",
          )

          replace_once(
              "codex-rs/hepta-agentd/src/authbus_ingress.rs",
              "    let now = now_ms()?;\n    if request.expires_at_ms <= now",
              "    let now = host\n        .evidence\n        .authbus_monotonic_now_ms()\n        .await\n        .map_err(|error| invalid(&error.to_string()))?;\n    if request.expires_at_ms <= now",
          )
          replace_once(
              "codex-rs/hepta-agentd/src/authbus_ingress.rs",
              "            now_ms()?,\n        )\n        .map_err(|error| invalid(&error.to_string()))?;\n",
              "            host.evidence\n                .authbus_monotonic_now_ms()\n                .await\n                .map_err(|error| invalid(&error.to_string()))?,\n        )\n        .map_err(|error| invalid(&error.to_string()))?;\n",
          )

          replace_once(
              "codex-rs/hepta-agentd/src/authbus_dispatch.rs",
              "use crate::authbus_ingress::now_ms;\n",
              "",
          )
          replace_count(
              "codex-rs/hepta-agentd/src/authbus_dispatch.rs",
              "            now_ms()?,\n",
              "            host.evidence\n                .authbus_monotonic_now_ms()\n                .await\n                .map_err(|error| invalid(&error.to_string()))?,\n",
              2,
          )
          PY

          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-evidence \
            -p codex-hepta-agentd

          test "$(grep -RIl 'store::now_millis' \
            codex-rs/hepta-evidence/src/authbus_*.rs | sort)" = \
            "codex-rs/hepta-evidence/src/authbus_time.rs"

      - name: Compile and test exact affected owners
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo test -p codex-hepta-evidence --all-targets
          cargo check -p codex-hepta-agentd --all-targets
          cargo check -p codex-hepta-authbus --all-targets --all-features
          cargo check -p codex-hepta-operations --all-targets
          cargo check -p codex-hepta-bao-adapter --all-targets
          cd ..
          python3 - <<'PY'
          import subprocess

          expected = {
              "codex-rs/Cargo.lock",
              "codex-rs/hepta-evidence/src/lib.rs",
              "codex-rs/hepta-evidence/src/schema_validation.rs",
              "codex-rs/hepta-evidence/src/authbus_store.rs",
              "codex-rs/hepta-evidence/src/authbus_outbox.rs",
              "codex-rs/hepta-evidence/src/authbus_outbox_worker.rs",
              "codex-rs/hepta-evidence/src/authbus_recovery.rs",
              "codex-rs/hepta-evidence/src/authbus_operations.rs",
              "codex-rs/hepta-agentd/src/authbus_ingress.rs",
              "codex-rs/hepta-agentd/src/authbus_dispatch.rs",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          required = expected - {"codex-rs/Cargo.lock"}
          if not required.issubset(changed) or not changed.issubset(expected):
              raise SystemExit(f"unexpected time-floor authoring changes: {sorted(changed)}")
          PY

      - name: Commit only for the still-current branch head
        shell: bash
        env:
          TARGET_BRANCH: auth-authbus-boundary-convergence-20260928
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if test "$remote_head" != "$GITHUB_SHA"; then
            echo "A newer candidate exists; its run owns time-floor authoring."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock \
            codex-rs/hepta-evidence/src/lib.rs \
            codex-rs/hepta-evidence/src/schema_validation.rs \
            codex-rs/hepta-evidence/src/authbus_store.rs \
            codex-rs/hepta-evidence/src/authbus_outbox.rs \
            codex-rs/hepta-evidence/src/authbus_outbox_worker.rs \
            codex-rs/hepta-evidence/src/authbus_recovery.rs \
            codex-rs/hepta-evidence/src/authbus_operations.rs \
            codex-rs/hepta-agentd/src/authbus_ingress.rs \
            codex-rs/hepta-agentd/src/authbus_dispatch.rs
          git commit -m "authbus: unify Evidence and Agentd time authority"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
