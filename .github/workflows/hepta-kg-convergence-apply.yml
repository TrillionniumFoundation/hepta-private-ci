name: Apply knowledge.graph convergence phase one

on:
  push:
    branches: [work/product-convergence-20260923]
    paths:
      - ".github/workflows/hepta-kg-convergence-apply.yml"

permissions:
  contents: write

concurrency:
  group: hepta-kg-convergence-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Materialize and apply exact transformations
        shell: bash
        env:
          APPLY_PAYLOAD: ""
        run: |
          set -euo pipefail
          printf '%s' "$APPLY_PAYLOAD" | base64 -d | gzip -d > scripts/hepta-kg-convergence-apply.py
          chmod 0755 scripts/hepta-kg-convergence-apply.py
          python3 scripts/hepta-kg-convergence-apply.py
          rm scripts/hepta-kg-convergence-apply.py

      - name: Refresh lockfile and format
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p codex-hepta-kg
          cargo fmt --package codex-hepta-kg
          cargo fmt --package codex-hepta-kg -- --check

      - name: Test and lint kernel
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-kg -- --nocapture
          cargo clippy --locked -p codex-hepta-kg --all-targets --no-deps -- -D warnings

      - name: Validate documentation and maps
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-technical-closure.py verify
          python3 scripts/hepta-implementation-maps.py verify

      - name: Commit phase one
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Hepta KG Convergence Bot"
          git config user.email "hepta-kg-convergence@users.noreply.github.com"
          git add codex-rs/hepta-kg/Cargo.toml codex-rs/Cargo.lock \
            codex-rs/hepta-kg/src/generation.rs \
            codex-rs/hepta-kg/src/generation_convergence_tests.rs \
            codex-rs/hepta-kg/src/lib.rs \
            .github/workflows/hepta-knowledge-graph-qualification.yml \
            docs/modules/knowledge.graph/TECHNICAL.md \
            qualification/module-execution-dossiers/detail/knowledge.graph.md
          git commit -s -m "knowledge.graph: bound indexed generation queries"
          git push origin HEAD:work/product-convergence-20260923
