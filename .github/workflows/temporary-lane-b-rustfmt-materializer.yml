name: Temporary Lane B rustfmt materializer

on:
  push:
    branches:
      - ops/lane-b-rustfmt-materialize-20260910

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact temporary source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Materialize the one permitted rustfmt delta
        shell: bash
        env:
          TARGET_BRANCH: ops/lane-b-rustfmt-materialize-20260910
          TARGET_FILE: codex-rs/hepta-infer-core/src/bin/hepta-infer-control.rs
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          mapfile -t changed < <(git diff --name-only)
          printf 'rustfmt changed: %s\n' "${changed[*]:-none}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET_FILE"
          git diff --check
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git config user.name "Hepta Rustfmt Materializer"
          git config user.email "hepta-rustfmt@users.noreply.github.com"
          git add -- "$TARGET_FILE"
          git commit -m "style(lane-b): materialize repository-pinned rustfmt output"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
