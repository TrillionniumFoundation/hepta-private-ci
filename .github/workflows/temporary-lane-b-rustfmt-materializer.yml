fn chain_digest(previous: &str, encoded: &str) -> String {
    let mut bytes = Vec::with_capacity(32 + previous.len() + encoded.len());
    bytes.extend_from_slice(b"hepta.inference.control.journal.v1");
    bytes.extend_from_slice(previous.as_bytes());
    bytes.extend_from_slice(encoded.as_bytes());
    Digest32::of_bytes(&bytes).to_string()
}

fn encode_journal_line(previous: &str, encoded: &str, current: &str) -> String {
    format!("{previous}|{encoded}|{current}")
}

fn decode_journal_line(line: &str) -> Result<(String, String, String), Error> {
    if line.len() < 130 || !line.is_char_boundary(65) {
        return Err(Error::CorruptJournal("line envelope"));
    }
    let bytes = line.as_bytes();
    if bytes.get(64) != Some(&b'|') {
        return Err(Error::CorruptJournal("line predecessor separator"));
    }
    let suffix_separator = line.len().checked_sub(65).ok_or(Error::CorruptJournal("line"))?;
    if bytes.get(suffix_separator) != Some(&b'|') {
        return Err(Error::CorruptJournal("line digest separator"));
    }
    let previous = &line[..64];
    let encoded = &line[65..suffix_separator];
    let current = &line[suffix_separator + 1..];
    validate_digest(previous, "journal predecessor")?;
    validate_digest(current, "journal digest")?;
    Ok((previous.to_string(), encoded.to_string(), current.to_string()))
}

