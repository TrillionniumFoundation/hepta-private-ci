name: Temporary Lane B hardening materializer

on:
  pull_request:
    branches:
      - ops/lane-b-rustfmt-materialize-20260910
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ops/lane-b-hardening-staging-20260910
      EXPECTED_STAGING_SHA: 6175b374d70a0d442abb5266f471a0b7f87cbf70
    steps:
      - name: Check out exact hardening staging source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_STAGING_SHA"
          git checkout -B "$TARGET_BRANCH" "$EXPECTED_STAGING_SHA"
          test -z "$(git status --porcelain)"

      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

