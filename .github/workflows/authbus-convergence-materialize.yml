name: AuthBus convergence materialization

on:
  push:
    branches: [auth-authbus-convergence-20260928]
    paths: [.github/workflows/authbus-convergence-materialize.yml]

permissions:
  contents: write

concurrency:
  group: authbus-convergence-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-authbus-convergence-20260928
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Materialize sealed authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize-authbus-hardening.py
          cargo fmt --all --manifest-path codex-rs/Cargo.toml
          python3 scripts/check-authbus-closed-world.py --check

      - name: Install read-only exact-head validation
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/authbus-convergence-validate.yml <<'YAML'
          name: AuthBus convergence validation

          on:
            push:
              branches: [auth-authbus-convergence-20260928]
              paths:
                - .github/workflows/authbus-convergence-validate.yml
                - codex-rs/**
                - docs/modules/auth.authbus/**
                - docs/lane-a-foundation/auth.authbus/**
                - scripts/check-authbus-closed-world.py

          permissions:
            contents: write

          concurrency:
            group: authbus-convergence-validate-${{ github.ref }}
            cancel-in-progress: true

          env:
            CARGO_TERM_COLOR: always
            RUST_BACKTRACE: 1

          jobs:
            validate:
              runs-on: macos-latest
              timeout-minutes: 180
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.sha }}
                    fetch-depth: 0
                    persist-credentials: true

                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy

                - uses: Swatinem/rust-cache@v2
                  with:
                    workspaces: codex-rs

                - name: Exact-head source, failure and integration validation
                  shell: bash
                  run: |
                    set +e
                    bash -euo pipefail <<'CHECK' 2>&1 | tee "$RUNNER_TEMP/authbus-validation.log"
                    cargo fmt --all --manifest-path codex-rs/Cargo.toml -- --check
                    python3 scripts/check-authbus-closed-world.py --check
                    cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus --all-targets
                    cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-authbus-p1-3-qualification --all-targets
                    cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-evidence --all-targets
                    cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --test kernel_evidence_product
                    cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-bao-adapter --all-targets
                    cargo clippy --manifest-path codex-rs/Cargo.toml \
                      -p codex-hepta-authbus \
                      -p codex-hepta-authbus-p1-3-qualification \
                      -p codex-hepta-evidence \
                      -p codex-hepta-agentd \
                      -p codex-hepta-bao-adapter \
                      --all-targets --all-features -- -D warnings
                    git diff --exit-code
                    CHECK
                    status=${PIPESTATUS[0]}
                    exit "$status"

                - name: Publish bounded failure diagnostics
                  if: failure()
                  shell: bash
                  env:
                    SOURCE_SHA: ${{ github.sha }}
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  run: |
                    set -euo pipefail
                    cp "$RUNNER_TEMP/authbus-validation.log" /tmp/authbus-validation.log
                    git config user.name "hepta-authbus-validation-bot"
                    git config user.email "hepta-authbus-validation-bot@users.noreply.github.com"
                    git checkout --orphan auth-authbus-convergence-diagnostics-20260928
                    git rm -rf .
                    mkdir -p diagnostics
                    cp /tmp/authbus-validation.log diagnostics/authbus-validation.log
                    printf '# AuthBus validation diagnostics\n\nSource commit: `%s`\n\nRun: %s\n' "$SOURCE_SHA" "$RUN_URL" > README.md
                    git add README.md diagnostics/authbus-validation.log
                    git commit -m "ci(authbus): publish validation diagnostics for $SOURCE_SHA"
                    git push --force origin HEAD:auth-authbus-convergence-diagnostics-20260928
          YAML

          rm -f \
            .github/workflows/authbus-convergence-materialize.yml \
            .github/workflows/authbus-final-hardening-apply.yml \
            .github/workflows/authbus-trust-boundary-migrate.yml \
            scripts/finalize-authbus-hardening.py \
            scripts/migrate-authbus-sealed-callers.py

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "hepta-authbus-convergence-bot"
          git config user.email "hepta-authbus-convergence-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(authbus): materialize sealed authority boundary"
          git push origin HEAD:auth-authbus-convergence-20260928
