name: Hepta retrieval authorized native preparation

on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]

permissions:
  contents: read

concurrency:
  group: retrieval-native-preparation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    name: Retrieval native formatting (not qualification)
    if: contains(github.event.head_commit.message, '[retrieval-native-format-v1]')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install the repository pinned native formatter
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Test development-helper guards and format scoped source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.tests.test_hepta_memory_retrieval_native_format
          python3 scripts/hepta_memory_retrieval_native_format.py \
            --base f6c9a39beb8aaff3840b3d28931a2d53a49c3cc5 \
            --head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/retrieval-native-preparation"
      - name: Commit only scoped native formatting and a separate exact source observation
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: work/memory-retrieval-hardening-20260927
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git ls-remote --heads origin "$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add -- codex-rs/hepta-agentd/src codex-rs/hepta-memory/src codex-rs/hepta-memory-retrieval/src
            git commit -m 'style(memory.retrieval): apply pinned native formatting to authorized candidate'
          fi
          python3 - <<'PY'
          import importlib.util, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('retrieval_refresh', root / 'scripts/hepta_memory_retrieval_refresh_map.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          docs = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', head, '--', 'docs/modules/memory.retrieval'], text=True).splitlines()
          module.INPUTS = tuple(module.INPUTS) + tuple(path for path in docs if path != module.MAP)
          before = json.loads((root / module.MAP).read_text())
          mapping = module.refresh(root, head)
          assert mapping['sourceBase'] == before['sourceBase']
          for field in ('productionImplementation', 'productExecutionProved', 'independentAcceptance', 'activation', 'release'):
              assert mapping['claimBoundary'][field] is False
          (root / module.MAP).write_text(json.dumps(mapping, indent=2) + '\n')
          PY
          git add -- docs/modules/memory.retrieval/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(memory.retrieval): observe exact formatted source without advancing claims'
          fi
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote --heads origin "$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/retrieval-native-preparation/identity.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/retrieval-native-preparation/source.tar.gz"
          shasum -a 256 "$RUNNER_TEMP/retrieval-native-preparation/source.tar.gz" > "$RUNNER_TEMP/retrieval-native-preparation/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-native-preparation/
          retention-days: 7
          if-no-files-found: error

  native:
    name: Retrieval native candidate (${{ matrix.candidate }})
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        candidate: [source-head, base-merge]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and current main
        env:
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          echo "SOURCE_SHA=$EXPECTED_HEAD" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_ENV"
          echo "HEPTA_CI_LANE=${{ matrix.candidate }}" >> "$GITHUB_ENV"
      - name: Construct ordered-parent merge candidate
        if: matrix.candidate == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: '1067'
          author-name: Hepta retrieval qualification
          author-email: hepta-qualification@example.invalid
          message: Retrieval native ordered-parent qualification
      - name: Bind actual tested checkout
        run: echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest
      - name: Install pinned Rust and native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libxcb1-dev libx11-dev libxkbcommon-dev libzstd-dev
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --component rust-src
      - name: Prepare existing V8 build inputs
        run: python3 scripts/hepta_ci_v8.py
      - name: Exact candidate package tests
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/retrieval-native-tests/package.json" --minimum-tests 10 --timeout-seconds 5400 --
          just test --locked -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-learning-ledger
      - name: Strict all-target Clippy
        if: '!cancelled()'
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/retrieval-native-tests/clippy.json" --timeout-seconds 3600 --
          cargo clippy --locked -p codex-hepta-memory-retrieval -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-learning-ledger --all-targets -- -D warnings
      - name: Repository formatting
        if: '!cancelled()'
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/retrieval-native-tests/format.json" --
          just fmt-check
      - name: Preserve clean candidate and lock files
        if: '!cancelled()'
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-${{ matrix.candidate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-native-tests/
          retention-days: 30
          if-no-files-found: error
