name: NDU one-shot runner repair
on:
  push:
    branches: [codex/utility-ndu-production-hardening-20260926]
    paths: [.github/workflows/hepta-ndu-runner-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      OUT: /tmp/ndu-runner-repair-${{ github.run_id }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Apply bounded runner fix and prove exact source closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import subprocess
          runner=Path('scripts/hepta-ndu-qualification.py')
          text=runner.read_text()
          old='        "--no-fail-fast",\n'
          assert text.count(old)==1
          runner.write_text(text.replace(old,''))
          integrity=Path('scripts/hepta_ndu_map_integrity.py')
          text=integrity.read_text()
          assert text.count('INPUTS = (\n')==1
          integrity.write_text(text.replace('INPUTS = (\n','INPUTS = (\n    "justfile",\n'))
          tests=Path('scripts/test_hepta_ndu_qualification.py')
          text=tests.read_text()
          marker='    def test_valid_measurement_and_honest_performance_failure(self):\n'
          body=[
              'command = runner.test("codex-hepta-ndu")',
              'self.assertEqual(command[:2], ["just", "test"])',
              'self.assertNotIn("--no-fail-fast", command)',
              'self.assertIn("--locked", command)',
              'self.assertEqual(command[command.index("--no-tests") + 1], "fail")',
              'self.assertEqual(command[command.index("--retries") + 1], "0")',
              'recipe = (runner.ROOT / "justfile").read_text()',
              'self.assertIn("cargo nextest run --no-fail-fast", recipe)',
          ]
          addition='    def test_just_recipe_owns_fail_fast_and_runner_keeps_strict_filters(self):\n'
          addition+=''.join('        '+line+'\n' for line in body)+'\n'
          assert text.count(marker)==1
          updated=text.replace(marker,addition+marker)
          ast.parse(updated)
          tests.write_text(updated)
          paths=[str(runner),str(integrity),str(tests)]
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['python3',str(integrity),'--rebind-index'],check=True)
          subprocess.run(['git','add','docs/modules/utility.ndu/IMPLEMENTATION_MAP.json'],check=True)
          PY
          python3 scripts/test_hepta_ndu_qualification.py 2>&1 | tee "$OUT/receipt-tests.log"
          python3 scripts/test_hepta_ndu_map_integrity.py 2>&1 | tee "$OUT/integrity-tests.log"
          git diff --cached --check
          git diff --cached --binary > "$OUT/applied.patch"
          git -c user.name=hepta-ndu-repair -c user.email=qualification@invalid commit -m 'fix(ndu): delegate fail-fast policy to just and bind its executable recipe'
          git rev-parse HEAD HEAD^{tree} > "$OUT/identity.txt"
          python3 scripts/hepta-ndu-implementation-map-closed-world.py --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})" | tee "$OUT/closed-world.json"
      - name: Publish source objects on the same branch without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$HEADER" push https://github.com/TrillionniumFoundation/hepta-private-ci.git HEAD:refs/heads/codex/utility-ndu-production-hardening-20260926
      - name: Retain exact repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-runner-repair-${{ github.sha }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
