name: Prompt offline build inputs
on:
  push:
    branches: ['work/prompt-optimizer-hardening-20260927']
    paths: ['.github/workflows/hepta-prompt-offline-build.yml']
permissions:
  contents: read
concurrency:
  group: prompt-offline-inputs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Fetch exact target dependencies
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Retain public dependency sources and pinned test tools only
        id: inputs
        working-directory: codex-rs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prompt-offline-inputs"
          mkdir -p "$out/toolchain" "$out/parts"
          git rev-parse HEAD HEAD^{tree} > "$out/identity.txt"
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          printf '%s\n' "$channel-x86_64-unknown-linux-gnu" > "$out/toolchain.txt"
          for component in rustc cargo rust-std rustfmt clippy; do
            name="$component-$channel-x86_64-unknown-linux-gnu.tar.xz"
            curl --fail --location --proto '=https' --tlsv1.2 "https://static.rust-lang.org/dist/$name" -o "$out/toolchain/$name"
            curl --fail --location --proto '=https' --tlsv1.2 "https://static.rust-lang.org/dist/$name.sha256" -o "$out/toolchain/$name.sha256"
            (cd "$out/toolchain" && sha256sum --check "$name.sha256")
          done
          curl --fail --location --proto '=https' --tlsv1.2 https://get.nexte.st/0.9.103/linux -o "$out/nextest.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/casey/just/releases/download/1.51.0/just-1.51.0-x86_64-unknown-linux-musl.tar.gz -o "$out/just.tar.gz"
          # Never archive CARGO_HOME wholesale: it may contain credentials.
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          paths=()
          for path in registry/src registry/cache registry/index git/db git/checkouts; do
            if test -d "$cargo_home/$path"; then paths+=("$path"); fi
          done
          test "${#paths[@]}" -gt 0
          tar -C "$cargo_home" -czf "$out/dependencies.tar.gz" "${paths[@]}"
          split --bytes=180M "$out/dependencies.tar.gz" "$out/parts/dependencies-"
          test ! -f "$out/parts/dependencies-ad"
          for suffix in ab ac; do
            if test -f "$out/parts/dependencies-$suffix"; then echo "$suffix=true" >> "$GITHUB_OUTPUT"; fi
          done
          (cd "$out" && sha256sum ./*.tar.gz toolchain/*.tar.xz parts/* > checksums.txt)
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-offline-tools-${{ github.sha }}
          path: |
            ${{ runner.temp }}/prompt-offline-inputs/toolchain
            ${{ runner.temp }}/prompt-offline-inputs/toolchain.txt
            ${{ runner.temp }}/prompt-offline-inputs/identity.txt
            ${{ runner.temp }}/prompt-offline-inputs/checksums.txt
            ${{ runner.temp }}/prompt-offline-inputs/just.tar.gz
            ${{ runner.temp }}/prompt-offline-inputs/nextest.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-offline-dependencies-aa-${{ github.sha }}
          path: ${{ runner.temp }}/prompt-offline-inputs/parts/dependencies-aa
          if-no-files-found: error
          retention-days: 1
      - if: steps.inputs.outputs.ab == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-offline-dependencies-ab-${{ github.sha }}
          path: ${{ runner.temp }}/prompt-offline-inputs/parts/dependencies-ab
          if-no-files-found: error
          retention-days: 1
      - if: steps.inputs.outputs.ac == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-offline-dependencies-ac-${{ github.sha }}
          path: ${{ runner.temp }}/prompt-offline-inputs/parts/dependencies-ac
          if-no-files-found: error
          retention-days: 1
