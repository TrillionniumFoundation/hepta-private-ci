name: AuthBus correctness convergence executor

on:
  push:
    branches:
      - work/authbus-correctness-20260925
    paths:
      - .github/workflows/authbus-convergence-run.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authbus-correctness-convergence
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: work/authbus-correctness-20260925

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Apply deterministic AuthBus convergence patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/authbus-convergence-apply.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def replace_once(')
          end = text.index('\n\ndef append_once', start)
          helper = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              candidates = [(old, new)]
              for width in (4, 8, 12):
                  prefix = " " * width
                  candidates.append((
                      "\\n".join(prefix + line if line else line for line in old.splitlines()),
                      "\\n".join(prefix + line if line else line for line in new.splitlines()),
                  ))
              matches = [(before, after) for before, after in candidates if text.count(before) == 1]
              if len(matches) != 1:
                  counts = [text.count(before) for before, _ in candidates]
                  raise SystemExit(
                      f"{path}: expected one exact or indented replacement; counts={counts}: {old[:80]!r}"
                  )
              before, after = matches[0]
              write(path, text.replace(before, after, 1))
          '''
          path.write_text(text[:start] + helper + text[end:], encoding='utf-8')
          PY
          python3 .github/authbus-convergence-apply.py
          git checkout -- .github/authbus-convergence-apply.py
          git diff --check

      - name: Locked all-target compilation
        working-directory: codex-rs
        run: >-
          cargo check --locked
          -p codex-hepta-authbus
          -p codex-hepta-evidence
          -p codex-hepta-bao-adapter
          -p codex-hepta-agentd
          --all-targets

      - name: AuthBus owner and product regression tests
        working-directory: codex-rs
        run: >-
          just test --locked
          -p codex-hepta-authbus
          -p codex-hepta-evidence
          -p codex-hepta-bao-adapter
          -p codex-hepta-agentd

      - name: Apply repository lint fixes
        shell: bash
        run: |
          set -euo pipefail
          just fix --locked -p codex-hepta-authbus
          just fix --locked -p codex-hepta-evidence
          just fmt
          git checkout -- .github/authbus-convergence-apply.py
          git diff --check

      - name: Strict changed-surface lint
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-authbus
          -p codex-hepta-evidence
          -p codex-hepta-bao-adapter
          -p codex-hepta-agentd
          --all-targets -- -D warnings

      - name: Commit source and documentation candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-authbus-convergence[bot]'
          git config user.email 'hepta-authbus-convergence[bot]@users.noreply.github.com'
          git add \
            codex-rs/hepta-authbus \
            codex-rs/hepta-evidence/src/authbus_outbox_tests.rs \
            codex-rs/Cargo.lock \
            docs/modules/auth.authbus/TECHNICAL.md \
            docs/lane-a-foundation/auth.authbus/CURRENT_IMPLEMENTATION.md \
            qualification/module-execution-dossiers/detail/auth.authbus.md
          git reset -- docs/modules/auth.authbus/IMPLEMENTATION_MAP.json
          git commit -m 'fix(authbus): close settlement and checkpoint races'
          git add docs/modules/auth.authbus/IMPLEMENTATION_MAP.json
          git commit -m 'docs(authbus): map persistent owner and product callers'
          test -z "$(git status --porcelain)"

      - name: Rebind and verify implementation map
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module auth.authbus
          if ! git diff --quiet -- docs/modules/auth.authbus/IMPLEMENTATION_MAP.json; then
            git add docs/modules/auth.authbus/IMPLEMENTATION_MAP.json
            git commit -m 'docs(authbus): bind implementation map to candidate'
          fi
          test -z "$(git status --porcelain)"
          python3 scripts/hepta-implementation-maps.py verify

      - name: Record exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          git log --oneline -5

      - name: Push verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:work/authbus-correctness-20260925
