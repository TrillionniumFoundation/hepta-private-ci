name: PoN exact regression delivery
on:
  push:
    branches: [fix/agentd-pon-executable-object-20261008]
    paths: [.github/workflows/pon-exact-regression-delivery.yml]
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/fix/agentd-pon-executable-object-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
      - name: Format only inherited effect sources; leave CI policy untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d8f82a8d68f4902492924a1600935ec8e46503e4
          test "$(git hash-object .github/workflows/hepta-architecture-convergence.yml)" = e8b67d007047ae9cb38f7248dae40b9eae739034
          cd codex-rs
          rustfmt --edition 2024 --config skip_children=true hepta-agent-protocol/src/lib.rs hepta-agentd/src/lib.rs hepta-agentd/src/state_control.rs hepta-automation/src/authorized_effect.rs hepta-automation/src/effect_dispatch_ledger.rs hepta-contracts/src/provider_effect.rs
          cargo fmt -- --config imports_granularity=Item --check
          cd ..
          rm .github/workflows/pon-exact-regression-delivery.yml
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'.github/workflows/pon-exact-regression-delivery.yml','codex-rs/hepta-agent-protocol/src/lib.rs','codex-rs/hepta-agentd/src/lib.rs','codex-rs/hepta-agentd/src/state_control.rs','codex-rs/hepta-automation/src/authorized_effect.rs','codex-rs/hepta-automation/src/effect_dispatch_ledger.rs','codex-rs/hepta-contracts/src/provider_effect.rs'}
          assert paths <= allowed,paths-allowed
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pon-exact-regression-delivery.yml codex-rs/hepta-agent-protocol/src/lib.rs codex-rs/hepta-agentd/src/lib.rs codex-rs/hepta-agentd/src/state_control.rs codex-rs/hepta-automation/src/authorized_effect.rs codex-rs/hepta-automation/src/effect_dispatch_ledger.rs codex-rs/hepta-contracts/src/provider_effect.rs
          git commit -s -m 'style(agentd): format inherited effect sources; retain unchanged architecture workflow'
          git push origin HEAD:refs/heads/fix/agentd-pon-executable-object-20261008
          git rev-parse HEAD HEAD^{tree}
