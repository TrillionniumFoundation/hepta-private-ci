name: MemoryCell source-only write and fresh task reads
on:
  push:
    branches:
      - "codex/memory-cell-evidence-20261008"
    paths:
      - "scripts/memory_cell/experience_*.py"
      - "scripts/memory_cell/test_experience_*.py"
      - "scripts/memory_cell/source_completion_loss.py"
      - "scripts/memory_cell/source_pretrained_projection_receipt.py"
      - "scripts/memory_cell/source_loss_admission.py"
      - "scripts/memory_cell/source_write_schedule.py"
      - "scripts/memory_cell/source_write_coverage.py"
      - "scripts/memory_cell/source_composition_curriculum.py"
      - "scripts/memory_cell/source_recall_probe.py"
      - "scripts/memory_cell/source_recall_likelihood.py"
      - "scripts/memory_cell/source_confusion_probe.py"
      - "scripts/memory_cell/source_candidate_kway.py"
      - "scripts/memory_cell/source_binding_specificity.py"
      - "scripts/memory_cell/test_source_binding_specificity.py"
      - "scripts/memory_cell/test_source_margin_sparse_admission.py"
      - "scripts/memory_cell/test_source_candidate_kway.py"
      - "scripts/memory_cell/source_decode_factorial.py"
      - "scripts/memory_cell/test_source_decode_factorial.py"
      - "scripts/memory_cell/test_source_confusion_probe.py"
      - "scripts/memory_cell/test_source_completion*.py"
      - "scripts/memory_cell/test_source_write_execution_gate.py"
      - "scripts/memory_cell/test_source_write_coverage.py"
      - "scripts/memory_cell/test_source_composition_curriculum.py"
      - "scripts/memory_cell/test_source_recall*.py"
      - ".github/workflows/hepta-memory-write-experiment.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # GitHub replaces an older pending run in the same group even when
  # cancel-in-progress is false. Bind this expensive source-before-task
  # experiment to its exact generating SHA; no unrelated push may displace it.
  group: memory-source-write-1452-${{ github.sha }}
  cancel-in-progress: false
jobs:
  repository-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Required repository formatting
        env:
          BASE: 78fdb0cf8537e3a84fc6e0a849707559c80881e8
        run: |
          set -euo pipefail
          python3 -m venv /tmp/source-write-format
          /tmp/source-write-format/bin/pip install uv==0.8.22
          export PATH="/tmp/source-write-format/bin:$PATH"
          git fetch --no-tags --depth=1 origin "$BASE"
          set +e
          just fmt --check --base "$BASE" > /tmp/source-write-format.log 2>&1
          status=$?
          set -e
          cat /tmp/source-write-format.log
          if [ "$status" -ne 0 ]; then
            just fmt --base "$BASE"
            git diff -- scripts/memory_cell/experience_policy.py scripts/memory_cell/experience_write_trial.py scripts/memory_cell/test_experience_policy.py scripts/memory_cell/source_write_effects.py scripts/memory_cell/test_source_write_effects.py > /tmp/source-write-format.diff
          fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-source-write-format
          path: /tmp/source-write-format.*
          if-no-files-found: error
  # The PR-wide formatting gate is retained above. A formatting failure in an
  # unrelated research file must not censor a source-only model experiment.
  # Scoped source validation and the full locked regression suite remain required.
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Verify exact source-write syntax, registered protocol and scoped formatting
        run: |
          set -euo pipefail
          python3 -m pip install uv==0.8.22 PyYAML==6.0.3
          uv run --frozen --project scripts ruff format --check \
            scripts/memory_cell/source_completion_loss.py \
            scripts/memory_cell/source_candidate_kway.py \
            scripts/memory_cell/source_binding_specificity.py \
            scripts/memory_cell/test_source_binding_specificity.py \
            scripts/memory_cell/test_source_candidate_kway.py \
            scripts/memory_cell/source_decode_factorial.py \
            scripts/memory_cell/test_source_decode_factorial.py \
            scripts/memory_cell/source_write_effects.py \
            scripts/memory_cell/test_source_completion_hf.py \
            scripts/memory_cell/test_source_write_execution_gate.py
          python3 -m compileall -q scripts/memory_cell
          python3 -m unittest discover -s scripts/memory_cell -p 'test_source_write_execution_gate.py' -v
          python3 -m unittest discover -s scripts/memory_cell -p 'test_source_workflow_gates.py' -v
          python3 -m unittest discover -s scripts/memory_cell -p 'test_source_candidate_kway.py' -v
          python3 -m unittest discover -s scripts/memory_cell -p 'test_source_binding_specificity.py' -v
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
  write-and-read:
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: scripts/memory_cell
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HEPTA_MEMORY_TESTED_COMMIT: ${{ github.sha }}
      PLAN_SHA: 9840a25487af444914dca24c818d98ff798ebc1610ea8dfdd827187c31ad1897
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the immutable controlled source corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/experience-result
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11669174727/zip > /tmp/experience-input.zip
          python3 - <<'PY'
          import hashlib, stat, zipfile
          from pathlib import Path, PurePosixPath
          data = Path('/tmp/experience-input.zip').read_bytes()
          assert len(data) < 64 * 1024 * 1024
          assert hashlib.sha256(data).hexdigest() == '23e9d44b8d2dbe756c7c33031e18853c83326458a37925d4d368881145bf142b'
          root = Path('/tmp/experience-input')
          root.mkdir()
          with zipfile.ZipFile('/tmp/experience-input.zip') as z:
              assert len(z.infolist()) <= 512
              assert sum(i.file_size for i in z.infolist()) <= 64 * 1024 * 1024
              seen = set()
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert '\\' not in item.filename and not stat.S_ISLNK(item.external_attr >> 16)
                  if item.is_dir():
                      continue
                  assert str(p) not in seen
                  seen.add(str(p))
                  out = root / p
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(z.read(item))
          PY
      - name: Lock dependencies, verify source inventory and run all regressions
        run: |
          set -euo pipefail
          python3 -m venv /tmp/experience-python
          /tmp/experience-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/experience-python/bin/pip install -r /tmp/experience-input/environment.txt
          /tmp/experience-python/bin/pip freeze > /tmp/experience-result/environment.txt
          diff -u /tmp/experience-input/environment.txt /tmp/experience-result/environment.txt
          /tmp/experience-python/bin/python - <<'PY'
          from pathlib import Path
          from reader_reference_receipt import archive
          archive(Path('/tmp/experience-input.zip'), '23e9d44b8d2dbe756c7c33031e18853c83326458a37925d4d368881145bf142b')
          PY
          # A failed unrelated evaluation test must remain a failed required gate,
          # but must not erase a source-only research run that can still be diagnosed.
          # Both focused source suites MUST succeed before any pretrained model work.
          /tmp/experience-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_source_*.py' -v 2>&1 | tee /tmp/experience-result/source-regressions.log
          /tmp/experience-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_experience_*.py' -v 2>&1 | tee /tmp/experience-result/experience-regressions.log
          set +e
          /tmp/experience-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/experience-result/tests.log
          full_suite_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$full_suite_rc" > /tmp/experience-result/full-regression-exit-code.txt
          if [ "$full_suite_rc" -ne 0 ]; then
            echo '::warning::Inherited full regression failed; results remain research-only and this job will be marked failed after evidence export.'
          fi
      - name: Stage the existing research reader without changing its identity
        run: |
          set -euo pipefail
          /tmp/experience-python/bin/python scripts/memory_cell/reader_reference.py stage qwen-3b /tmp/experience-model
          cp /tmp/experience-model/stage.json /tmp/experience-model/inventory.json /tmp/experience-model/publisher.json /tmp/experience-result/
      - name: Prove source-only Qwen2.5-3B full versus sparse loss before writing
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/experience-result/parity-resource.txt /tmp/experience-python/bin/python scripts/memory_cell/source_pretrained_projection_receipt.py /tmp/experience-input/observations/sources.json /tmp/experience-model /tmp/experience-result/source-loss-parity.json --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --stage-sha "$(sha256sum /tmp/experience-model/stage.json | cut -d ' ' -f1)" --source-commit "$HEPTA_MEMORY_TESTED_COMMIT" 2>&1 | tee /tmp/experience-result/source-loss-parity.log
      - name: Write observed source facts with no test-plan argument
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/experience-result/write-resource.txt /tmp/experience-python/bin/python scripts/memory_cell/experience_write_trial.py write /tmp/experience-input/observations/sources.json /tmp/experience-model /tmp/experience-result/snapshot --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --stage-sha "$(sha256sum /tmp/experience-model/stage.json | cut -d ' ' -f1)" --loss-backend supervised_positions --parity-receipt /tmp/experience-result/source-loss-parity.json --parity-sha "$(sha256sum /tmp/experience-result/source-loss-parity.json | cut -d ' ' -f1)" 2>&1 | tee /tmp/experience-result/write.log
          sha256sum /tmp/experience-result/snapshot/READY.json > /tmp/experience-result/snapshot-pin.txt
      - name: Train a small read policy only from the declared calibration sources
        run: |
          set -euo pipefail
          /tmp/experience-python/bin/python - <<'PY'
          import json
          from pathlib import Path
          from event_experience import SEED
          from native import digest
          Path('/tmp/experience-result/policy-scopes.json').write_text(json.dumps([
              'controlled_' + digest((SEED, i))[:8] for i in range(8)
          ]))
          PY
          BASE_ID=$(/tmp/experience-python/bin/python -c "import json; print(json.load(open('/tmp/experience-result/snapshot/READY.json'))['base_identity'])")
          /tmp/experience-python/bin/python scripts/memory_cell/experience_policy.py /tmp/experience-input/observations/sources.json /tmp/experience-result/policy-scopes.json /tmp/experience-result/read-policy.json --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --scopes-sha "$(sha256sum /tmp/experience-result/policy-scopes.json | cut -d ' ' -f1)" --reader-identity "$BASE_ID"
      - name: New process reloads both committed modules before task exposure
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/experience-result/read-resource.txt /tmp/experience-python/bin/python scripts/memory_cell/experience_write_trial.py read /tmp/experience-input/plan /tmp/experience-input/observations /tmp/experience-model /tmp/experience-result/snapshot /tmp/experience-result/tasks --plan-sha "$PLAN_SHA" --stage-sha "$(sha256sum /tmp/experience-model/stage.json | cut -d ' ' -f1)" --ready-sha "$(cut -d ' ' -f1 /tmp/experience-result/snapshot-pin.txt)" --policy /tmp/experience-result/read-policy.json --policy-sha "$(sha256sum /tmp/experience-result/read-policy.json | cut -d ' ' -f1)" 2>&1 | tee /tmp/experience-result/read.log
      - name: Recompute seven-arm knowledge and policy effects from original answers
        run: |
          set -euo pipefail
          /tmp/experience-python/bin/python scripts/memory_cell/source_write_effects.py /tmp/experience-input/plan /tmp/experience-input/observations /tmp/experience-result --plan-sha "$PLAN_SHA" --ready-sha "$(cut -d ' ' -f1 /tmp/experience-result/snapshot-pin.txt)" --source-commit "$HEPTA_MEMORY_TESTED_COMMIT" 2>&1 | tee /tmp/experience-result/effects.log
      # Research-only diagnostics receive sources and a committed adapter, not the
      # evaluation plan, answers or labels. Put the full seven-arm task census
      # first so an expensive optional probe cannot consume its execution budget.
      # All five diagnostic outcomes remain hard failures at the final gate.
      - name: Diagnose closed-set source-value association with a FULL original lexicon
        id: kway
        continue-on-error: true
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/experience-result/kway-resource.txt /tmp/experience-python/bin/python scripts/memory_cell/source_candidate_kway.py /tmp/experience-input/observations/sources.json /tmp/experience-model /tmp/experience-result/snapshot /tmp/experience-result/source-kway --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --stage-sha "$(sha256sum /tmp/experience-model/stage.json | cut -d ' ' -f1)" --ready-sha "$(cut -d ' ' -f1 /tmp/experience-result/snapshot-pin.txt)" --source-commit "$HEPTA_MEMORY_TESTED_COMMIT" --maximum-questions 2 2>&1 | tee /tmp/experience-result/kway.log
      - name: Diagnose source-only recall without task inputs after core read
        id: recall
        continue-on-error: true
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /tmp/experience-python/bin/python scripts/memory_cell/source_recall_probe.py /tmp/experience-input/observations/sources.json /tmp/experience-model /tmp/experience-result/snapshot /tmp/experience-result/source-recall --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --stage-sha "$(sha256sum /tmp/experience-model/stage.json | cut -d ' ' -f1)" --ready-sha "$(cut -d ' ' -f1 /tmp/experience-result/snapshot-pin.txt)" --source-commit "$HEPTA_MEMORY_TESTED_COMMIT" 2>&1 | tee /tmp/experience-result/source-recall.log
      - name: Attribute source-only recall to decoder search versus adapter
        id: decode
        continue-on-error: true
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/experience-result/decode-resource.txt /tmp/experience-python/bin/python scripts/memory_cell/source_decode_factorial.py /tmp/experience-input/observations/sources.json /tmp/experience-model /tmp/experience-result/snapshot /tmp/experience-result/decode-factorial --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --stage-sha "$(sha256sum /tmp/experience-model/stage.json | cut -d ' ' -f1)" --ready-sha "$(cut -d ' ' -f1 /tmp/experience-result/snapshot-pin.txt)" --source-commit "$HEPTA_MEMORY_TESTED_COMMIT" --question-mode paraphrase --maximum 8 2>&1 | tee /tmp/experience-result/decode.log
      - name: Source-only teacher-forced likelihood, two wordings and no evidence
        id: likelihood
        continue-on-error: true
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/experience-result/likelihood-resource.txt /tmp/experience-python/bin/python scripts/memory_cell/source_recall_likelihood.py /tmp/experience-input/observations/sources.json /tmp/experience-model /tmp/experience-result/snapshot /tmp/experience-result/source-likelihood --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --stage-sha "$(sha256sum /tmp/experience-model/stage.json | cut -d ' ' -f1)" --ready-sha "$(cut -d ' ' -f1 /tmp/experience-result/snapshot-pin.txt)" --source-commit "$HEPTA_MEMORY_TESTED_COMMIT" --maximum 8 2>&1 | tee /tmp/experience-result/likelihood.log
      - name: Distinguish source association from generic value memorization
        id: confusion
        continue-on-error: true
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/experience-result/confusion-resource.txt /tmp/experience-python/bin/python scripts/memory_cell/source_confusion_probe.py /tmp/experience-input/observations/sources.json /tmp/experience-model /tmp/experience-result/snapshot /tmp/experience-result/source-confusion --source-sha 35756b456f75718cc422d8678ec7ae97790ca36ced625501d24884698fddab24 --stage-sha "$(sha256sum /tmp/experience-model/stage.json | cut -d ' ' -f1)" --ready-sha "$(cut -d ' ' -f1 /tmp/experience-result/snapshot-pin.txt)" --source-commit "$HEPTA_MEMORY_TESTED_COMMIT" --maximum 2 2>&1 | tee /tmp/experience-result/confusion.log
      - name: Persist optional diagnostic outcomes before preserving original evidence
        if: always()
        env:
          HEPTA_DIAG_KWAY: ${{ steps.kway.outcome }}
          HEPTA_DIAG_RECALL: ${{ steps.recall.outcome }}
          HEPTA_DIAG_DECODE: ${{ steps.decode.outcome }}
          HEPTA_DIAG_LIKELIHOOD: ${{ steps.likelihood.outcome }}
          HEPTA_DIAG_CONFUSION: ${{ steps.confusion.outcome }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/experience-result
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          source_sha = os.environ.get('GITHUB_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', source_sha):
              raise SystemExit('missing exact runner commit identity')
          names = ('KWAY', 'RECALL', 'DECODE', 'LIKELIHOOD', 'CONFUSION')
          allowed = ('success', 'failure', 'cancelled', 'skipped', '')
          outcomes = {name.lower(): os.environ.get('HEPTA_DIAG_' + name, '') for name in names}
          if any(value not in allowed for value in outcomes.values()):
              raise SystemExit('unexpected GitHub diagnostic step outcome')
          document = dict(schema='hepta.source-write.diagnostic-outcomes.v1', generating_commit=source_sha, outcomes={name: (value or 'not_run') for name, value in outcomes.items()})
          with (Path('/tmp/experience-result') / 'diagnostic-outcomes.json').open('x', encoding='utf-8') as target:
              json.dump(document, target, sort_keys=True, allow_nan=False, indent=2)
              target.write('\n')
          print(json.dumps(document, sort_keys=True))
          PY
      - name: Preserve original responses, exact source, costs and failed runs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/experience-result/source
          cp scripts/memory_cell/experience_*.py scripts/memory_cell/test_experience_*.py scripts/memory_cell/source_write_effects.py scripts/memory_cell/test_source_write*.py scripts/memory_cell/source_recall_probe.py scripts/memory_cell/test_source_recall_probe.py scripts/memory_cell/source_recall_likelihood.py scripts/memory_cell/test_source_recall_likelihood.py scripts/memory_cell/source_confusion_probe.py scripts/memory_cell/test_source_confusion_probe.py scripts/memory_cell/source_loss_admission.py scripts/memory_cell/test_source_loss_admission.py scripts/memory_cell/test_source_margin_sparse_admission.py scripts/memory_cell/source_pretrained_projection_receipt.py /tmp/experience-result/source/
          cp scripts/memory_cell/source_decode_factorial.py scripts/memory_cell/test_source_decode_factorial.py scripts/memory_cell/source_candidate_kway.py scripts/memory_cell/test_source_candidate_kway.py /tmp/experience-result/source/
          git rev-parse HEAD > /tmp/experience-result/tested-commit.txt
          # Base and research-derived model weights are not redistributed.
          find /tmp/experience-result -name '*.safetensors' -delete
          (cd /tmp/experience-result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-source-only-write
          path: /tmp/experience-result
          if-no-files-found: error

      - name: Enforce full regression and every optional diagnostic after artifact preservation
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/experience-result')
          failures = []
          full = root / 'full-regression-exit-code.txt'
          if full.is_symlink() or not full.is_file() or full.read_text().strip() != '0':
              failures.append('the original complete Python regression suite was not green')
          path = root / 'diagnostic-outcomes.json'
          if path.is_symlink() or not path.is_file() or path.stat().st_size > 4096:
              failures.append('missing/invalid mandatory diagnostic outcome receipt')
          else:
              def no_dupes(pairs):
                  item = {}
                  for key, value in pairs:
                      if key in item:
                          raise ValueError('duplicate diagnostic outcome field')
                      item[key] = value
                  return item
              try:
                  document = json.loads(path.read_text(), object_pairs_hook=no_dupes)
                  expected = ('kway', 'recall', 'decode', 'likelihood', 'confusion')
                  if document.get('schema') != 'hepta.source-write.diagnostic-outcomes.v1' or document.get('generating_commit') != os.environ.get('GITHUB_SHA') or set(document.get('outcomes', {})) != set(expected):
                      raise ValueError('diagnostic receipt source/census mismatch')
                  failures += [f'{name}: {document["outcomes"][name]}' for name in expected if document['outcomes'][name] != 'success']
              except (ValueError, TypeError, KeyError) as error:
                  failures.append(f'invalid diagnostic outcome receipt: {error}')
          for failure in failures:
              print(f'::error::{failure}', flush=True)
          if failures:
              raise SystemExit(1)
          print('original full regressions and all five diagnostics passed; this is not model-quality qualification')
          PY
