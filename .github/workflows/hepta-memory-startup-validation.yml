name: MemoryCell trusted startup validation
on:
  pull_request:
    paths:
      - "codex-rs/hepta-agentd/**"
      - ".github/workflows/hepta-memory-startup-validation.yml"
permissions:
  contents: read
concurrency:
  group: memory-cell-startup-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  build-test-children:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest
      - name: Prepare native dependencies for the two child processes
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake protobuf-compiler libssl-dev libcap-dev pkg-config bubblewrap
          python3 scripts/hepta_ci_v8.py
      - name: Build and record both child executables from the checked-out source
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked -p codex-cli --bin codex -p codex-hepta-infer-worker-host --bin hepta-joint-propose
          children="$RUNNER_TEMP/startup-test-children"
          mkdir -p "$children"
          git rev-parse HEAD > "$children/source.txt"
          for name in codex hepta-joint-propose; do
            install -m 755 "$CARGO_TARGET_DIR/debug/$name" "$children/$name"
          done
          cargo nextest --version > "$children/nextest-version.txt"
          cargo nextest archive --locked -p codex-hepta-agentd --lib --archive-file "$children/agentd-lib.tar.zst"
          NEXTEST_PROFILE=local cargo nextest list --locked -p codex-hepta-agentd --lib --message-format json > "$children/source-list.json"
          (cd "$children" && sha256sum codex hepta-joint-propose agentd-lib.tar.zst source-list.json nextest-version.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-test-children
          path: ${{ runner.temp }}/startup-test-children
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  startup-and-owner-regressions:
    needs: build-test-children
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: startup-test-children
          path: ${{ runner.temp }}/startup-test-children
      - name: Bind the verified child processes for the original Agentd suite
        run: |
          set -euo pipefail
          children="$RUNNER_TEMP/startup-test-children"
          test "$(cat "$children/source.txt")" = "$(git rev-parse HEAD)"
          (cd "$children" && sha256sum --check SHA256SUMS)
          mkdir -p /tmp/memory-startup-validation
          cp "$children/SHA256SUMS" /tmp/memory-startup-validation/child-binaries.sha256
          for name in codex hepta-joint-propose; do
            chmod 755 "$children/$name"
            echo "CARGO_BIN_EXE_$name=$children/$name" >> "$GITHUB_ENV"
          done
          # The POSIX recipe shell drops environment names containing a hyphen.
          echo "CARGO_BIN_EXE_hepta_joint_propose=$children/hepta-joint-propose" >> "$GITHUB_ENV"
      - name: Match the archived Agentd roster against the original Cargo target
        working-directory: codex-rs
        env:
          NEXTEST_PROFILE: local
        run: |
          set -euo pipefail
          children="$RUNNER_TEMP/startup-test-children"
          sh -cu 'test -x "$CARGO_BIN_EXE_codex" && test -x "$CARGO_BIN_EXE_hepta_joint_propose"'
          cargo nextest --version | cmp - "$children/nextest-version.txt"
          cargo nextest list --archive-file "$children/agentd-lib.tar.zst" --workspace-remap "$PWD" --message-format json > "$children/restored-list.json"
          python3 - "$children" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          def original_roster(filename):
              data = json.loads((root / filename).read_text())
              suites = list(data["rust-suites"].values())
              if len(suites) != 1 or suites[0]["kind"] != "lib" or suites[0]["package-name"] != "codex-hepta-agentd":
                  raise SystemExit("expected exactly the original Agentd libtest")
              suite = suites[0]
              if suite["status"] != "listed" or not suite["testcases"]:
                  raise SystemExit("missing original libtest roster")
              return suite["binary-id"], {name: (case["ignored"], case["filter-match"]) for name, case in suite["testcases"].items()}

          source = original_roster("source-list.json")
          if source != original_roster("restored-list.json"):
              raise SystemExit("restored test names, selection or ignores differ from the original target")
          cases = source[1].values()
          selected = sum(match["status"] == "matches" for _, match in cases)
          ignored = sum(is_ignored for is_ignored, _ in cases)
          print(f"Matched {len(source[1])} original cases, {selected} selected and {ignored} ignored")
          PYTHON
          cp "$children/source-list.json" "$children/restored-list.json" /tmp/memory-startup-validation/
      - name: Test startup fences and unopened service factory
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-startup-validation
          git rev-parse HEAD > /tmp/memory-startup-validation/tested-commit.txt
          cd codex-rs
          just test --archive-file "$RUNNER_TEMP/startup-test-children/agentd-lib.tar.zst" --workspace-remap "$PWD" memory_bootstrap::tests 2>&1 | tee /tmp/memory-startup-validation/bootstrap.log
          just test --archive-file "$RUNNER_TEMP/startup-test-children/agentd-lib.tar.zst" --workspace-remap "$PWD" service::fleet::startup::tests 2>&1 | tee /tmp/memory-startup-validation/readiness.log
      - name: Test existing serving cancellation, generation retirement and fleet owners
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          cd codex-rs
          just test --archive-file "$RUNNER_TEMP/startup-test-children/agentd-lib.tar.zst" --workspace-remap "$PWD" memory_serving_process::tests 2>&1 | tee /tmp/memory-startup-validation/process.log
          just test --archive-file "$RUNNER_TEMP/startup-test-children/agentd-lib.tar.zst" --workspace-remap "$PWD" shared_memory_training::selected::service::fleet::tests 2>&1 | tee /tmp/memory-startup-validation/fleet.log
      - name: Run the entire affected Agentd unit suite without weakening filters
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-startup-validation
          cd codex-rs
          just test --archive-file "$RUNNER_TEMP/startup-test-children/agentd-lib.tar.zst" --workspace-remap "$PWD" 2>&1 | tee /tmp/memory-startup-validation/all-agentd-unit-tests.log
      - name: Retain exact source and test evidence, never a production signature
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-startup-validation
          git rev-parse HEAD > /tmp/memory-startup-validation/tested-commit.txt
          printf '%s\n' 'Tests exercise compiled startup and owner boundaries, not a deployed production rollout or independent acceptance.' > /tmp/memory-startup-validation/SCOPE.txt
          (cd /tmp/memory-startup-validation && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-startup-validation
          path: /tmp/memory-startup-validation
          if-no-files-found: error
