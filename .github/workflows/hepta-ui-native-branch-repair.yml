name: ui.native one-shot current-main repair

on:
  push:
    branches: [work/ui-native-current-source-20260925]
    paths: [.github/workflows/hepta-ui-native-branch-repair.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ui-native-one-shot-repair
  cancel-in-progress: false

env:
  BRANCH: work/ui-native-current-source-20260925
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  repair:
    name: merge current main and freeze candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      candidate: ${{ steps.result.outputs.candidate }}
      base: ${{ steps.result.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/ui-native-current-source-20260925
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without overwriting other module truth
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Codex'
          git config user.email 'chatgpt-codex@users.noreply.github.com'
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/$BRANCH:refs/remotes/origin/$BRANCH
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/$BRANCH)"
          base=$(git rev-parse refs/remotes/origin/main)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git show HEAD:qualification/module-execution-dossiers/DETAILS.json > /tmp/ui-native-details-head.json
          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main
          merge_rc=$?
          set -e
          unmerged=$(git diff --name-only --diff-filter=U | sort)
          expected=$(printf '%s\n' \
            docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json \
            docs/modules/cognitive.read/IMPLEMENTATION_MAP.json \
            docs/modules/utility.ndu/IMPLEMENTATION_MAP.json \
            qualification/module-execution-dossiers/DETAILS.json | sort)
          if test "$merge_rc" -ne 0; then
            test "$unmerged" = "$expected"
          else
            test -z "$unmerged"
          fi
          for path in \
            docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json \
            docs/modules/cognitive.read/IMPLEMENTATION_MAP.json \
            docs/modules/utility.ndu/IMPLEMENTATION_MAP.json; do
            git checkout --theirs -- "$path"
          done
          git checkout --theirs -- qualification/module-execution-dossiers/DETAILS.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          destination = Path('qualification/module-execution-dossiers/DETAILS.json')
          current_main = json.loads(destination.read_text(encoding='utf-8'))
          old_candidate = json.loads(Path('/tmp/ui-native-details-head.json').read_text(encoding='utf-8'))

          def is_native(row):
              return row.get('module') == 'ui.native' or row.get('path') == 'qualification/module-execution-dossiers/detail/ui.native.md'

          native = [row for row in old_candidate['rows'] if is_native(row)]
          if len(native) != 1:
              raise SystemExit('candidate dossier must contain exactly one ui.native row')
          replaced = 0
          for index, row in enumerate(current_main['rows']):
              if is_native(row):
                  current_main['rows'][index] = native[0]
                  replaced += 1
          if replaced != 1:
              raise SystemExit('current-main dossier must contain exactly one ui.native row')
          destination.write_text(
              json.dumps(current_main, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          git add \
            docs/modules/automation.taskflow/IMPLEMENTATION_MAP.json \
            docs/modules/cognitive.read/IMPLEMENTATION_MAP.json \
            docs/modules/utility.ndu/IMPLEMENTATION_MAP.json \
            qualification/module-execution-dossiers/DETAILS.json
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -s -m 'merge(main): rebase ui.native convergence on current source' \
            -m 'Preserve current-main module truth while retaining only the canonical ui.native dossier row from the convergence candidate.'
      - name: Make source identity platform-stable and document current integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tool = Path('apps/hepta-native/tools/prepare_current_source.py')
          text = tool.read_text(encoding='utf-8')
          old = '''def git(*args):
              return subprocess.check_output(["git", *args], cwd=ROOT, text=True).strip()


          def require_branch():
          '''
          new = '''def git(*args):
              return subprocess.check_output(["git", *args], cwd=ROOT, text=True).strip()


          def committed_blob(path):
              relative = path.relative_to(ROOT).as_posix()
              try:
                  return subprocess.check_output(
                      ["git", "show", f"HEAD:{relative}"], cwd=ROOT
                  )
              except subprocess.CalledProcessError as error:
                  raise RuntimeError(
                      f"native source identity requires committed path: {relative}"
                  ) from error


          def require_branch():
          '''
          if old not in text:
              raise SystemExit('prepare_current_source git helper anchor changed')
          text = text.replace(old, new, 1)
          old = (
              "    observed = {\n"
              "        p.relative_to(ROOT).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()\n"
              "        for p in sorted(names)\n"
              "    }\n"
          )
          new = (
              "    observed = {\n"
              "        p.relative_to(ROOT).as_posix(): hashlib.sha256(committed_blob(p)).hexdigest()\n"
              "        for p in sorted(names)\n"
              "    }\n"
          )
          if old not in text:
              raise SystemExit('prepare_current_source fingerprint anchor changed')
          text = text.replace(old, new, 1)
          old = (
              "    changes[relative] = (\n"
              "        json.dumps(data, separators=(\",\", \":\"), ensure_ascii=False) + \"\\n\"\n"
              "    )\n"
          )
          new = "    changes[relative] = json.dumps(data, indent=2, ensure_ascii=False) + \"\\n\"\n"
          if old not in text:
              raise SystemExit('prepare_current_source dossier formatting anchor changed')
          text = text.replace(old, new, 1)
          old = '''                    "baselineCommit": BASE,
                              "historicalSourceCommit": "3198549d80d6c59887b82e2c50018ab818217c53",
          '''
          new = '''                    "baselineCommit": BASE,
                              "baselineRole": "initial_convergence_ancestor",
                              "historicalSourceCommit": "3198549d80d6c59887b82e2c50018ab818217c53",
          '''
          if old not in text:
              raise SystemExit('prepare_current_source baseline anchor changed')
          tool.write_text(text.replace(old, new, 1), encoding='utf-8')

          guide = Path('apps/hepta-native/DEVELOPMENT.md')
          text = guide.read_text(encoding='utf-8')
          old = '''The single convergence candidate is
          `work/ui-native-current-source-20260925`, based on main
          `7ddbfac88525196e7a4b31387ceae194958275f5`. The Rust application was recovered
          from PR #830 source commit `3198549d80d6c59887b82e2c50018ab818217c53`, then
          reviewed against the current owner contracts. A merged historical branch is not
          implementation delivery; the files, locks, maps, tests and qualification
          receipts for the present candidate are the delivery identity.
          '''
          new = '''The single convergence candidate is
          `work/ui-native-current-source-20260925`. It descends from the initial
          convergence ancestor `7ddbfac88525196e7a4b31387ceae194958275f5` and is merged
          with current `main`; every qualification run records the exact current-main base
          rather than treating the initial ancestor as the active integration base. The
          Rust application was recovered from PR #830 source commit
          `3198549d80d6c59887b82e2c50018ab818217c53`, then reviewed against the current
          owner contracts. A merged historical branch is not implementation delivery;
          the files, locks, maps, tests and qualification receipts for the present
          candidate are the delivery identity.
          '''
          if old not in text:
              raise SystemExit('DEVELOPMENT candidate identity anchor changed')
          guide.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile apps/hepta-native/tools/prepare_current_source.py
          git diff --check
          git add apps/hepta-native/tools/prepare_current_source.py apps/hepta-native/DEVELOPMENT.md
          git commit -s -m 'fix(ui.native): stabilize source identity across platforms' \
            -m 'Hash committed Git blobs instead of platform-normalized checkout bytes, preserve dossier review formatting, and distinguish the lineage ancestor from the live integration base.'
      - name: Freeze exact source fingerprints and ui.native metadata
        run: |
          set -euo pipefail
          python3 apps/hepta-native/tools/prepare_current_source.py --prepare
          python3 apps/hepta-native/tools/prepare_current_source.py --write-fingerprints
          python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          git add \
            apps/hepta-native/CURRENT_SOURCE.json \
            docs/modules/ui.native/IMPLEMENTATION_MAP.json \
            docs/modules/SOURCE_BINDINGS.json \
            docs/modules/MODULE_DOCS.json \
            qualification/module-execution-dossiers/DETAILS.json \
            qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          git diff --cached --check
          git commit -s -m 'docs(ui.native): freeze current merged source identity'
          python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add \
              docs/modules/ui.native/IMPLEMENTATION_MAP.json \
              docs/modules/SOURCE_BINDINGS.json \
              docs/modules/MODULE_DOCS.json \
              qualification/module-execution-dossiers/DETAILS.json \
              qualification/module-execution-dossiers/NATIVE_BINDINGS.json
            git diff --cached --check
            git commit -s -m 'docs(mapping): observe committed ui.native source metadata'
          fi
      - name: Rebind non-ancestor provenance and exact shared source objects
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          identity = {'commit': head, 'tree': tree}
          changed = []
          for path in sorted(Path('docs/modules').glob('*/IMPLEMENTATION_MAP.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              dirty = False
              for field in ('sourceBase', 'observedAtHead'):
                  value = data.get(field)
                  if not isinstance(value, dict) or not isinstance(value.get('commit'), str):
                      continue
                  result = subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', value['commit'], head],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if result.returncode != 0:
                      data[field] = dict(identity)
                      dirty = True
              if dirty:
                  path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
                  changed.append(str(path))
          print(json.dumps({'normalizedNonAncestorMaps': changed}, indent=2))
          PY
          if ! git diff --quiet; then
            git diff --check
            git add docs/modules/*/IMPLEMENTATION_MAP.json
            git commit -s -m 'docs(mapping): normalize non-ancestor source anchors'
          fi
          for round in 1 2 3; do
            python3 scripts/hepta-implementation-maps.py migrate
            if git diff --quiet && git diff --cached --quiet; then
              break
            fi
            git diff --check
            git add docs/modules/*/IMPLEMENTATION_MAP.json
            git commit -s -m "docs(mapping): rebind shared native source objects round ${round}"
          done
          test -z "$(git status --porcelain)"
      - name: Verify frozen candidate before publishing
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          python3 apps/hepta-native/tools/prepare_current_source.py --prepare
          python3 apps/hepta-native/tools/prepare_current_source.py
          python3 scripts/test_hepta_module_registry.py
          python3 scripts/hepta-implementation-maps.py verify --require-current-source
          cargo +1.95.0 metadata --manifest-path apps/hepta-native/Cargo.toml --locked --format-version 1 >/dev/null
          cargo +1.95.0 metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 >/dev/null
          python3 apps/hepta-native/tools/package_unsigned.py --self-test
          test -z "$(git status --porcelain)"
      - name: Remove one-shot workflow and push canonical branch
        id: result
        run: |
          set -euo pipefail
          base=${{ steps.merge.outputs.base }}
          git rm .github/workflows/hepta-ui-native-branch-repair.yml
          git commit -s -m 'ci(ui.native): retire one-shot current-main repair workflow'
          python3 apps/hepta-native/tools/prepare_current_source.py
          python3 scripts/hepta-implementation-maps.py verify --require-current-source
          candidate=$(git rev-parse HEAD)
          git push origin HEAD:$BRANCH
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  qualify:
    needs: repair
    name: repaired-${{ matrix.os }}-${{ matrix.source }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        source: [head, merge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: apps/hepta-native/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.repair.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind repaired exact head or deterministic merge
        env:
          CANDIDATE: ${{ needs.repair.outputs.candidate }}
          BASE: ${{ needs.repair.outputs.base }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          if test "$SOURCE" = merge; then
            tree=$(git merge-tree --write-tree "$BASE" "$CANDIDATE")
            export GIT_AUTHOR_NAME=native-qualification
            export GIT_AUTHOR_EMAIL=native-qualification@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z
            export GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            merge=$(printf '%s\n' 'deterministic repaired ui.native qualification merge' |
              git commit-tree "$tree" -p "$BASE" -p "$CANDIDATE")
            git checkout --detach "$merge"
          fi
          python3 apps/hepta-native/tools/prepare_current_source.py
          test -z "$(git status --porcelain)"
          mkdir -p native-evidence
          {
            printf 'candidate=%s\n' "$CANDIDATE"
            printf 'base=%s\n' "$BASE"
            printf 'source=%s\n' "$SOURCE"
            printf 'checkout=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
          } > native-evidence/source.txt
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libssl-dev desktop-file-utils
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify, build and test repaired product
        run: |
          set -euo pipefail
          cargo +1.95.0 metadata --manifest-path apps/hepta-native/Cargo.toml --locked --format-version 1 >/dev/null
          cargo +1.95.0 metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 >/dev/null
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --check
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-native-gateway -p codex-hepta-contracts \
            -p codex-hepta-private-state -- --check
          cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml \
            --locked --all-targets --all-features -- -D warnings
          cargo +1.95.0 clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-native-gateway -p codex-hepta-contracts \
            -p codex-hepta-private-state --all-targets --all-features --no-deps -- -D warnings
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml --locked --all-targets
          cargo +1.95.0 test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-native-gateway -p codex-hepta-contracts \
            -p codex-hepta-private-state --all-targets --all-features
          cargo +1.95.0 build --manifest-path apps/hepta-native/Cargo.toml --locked --release --bins
      - name: Run release fault profile and package smoke
        run: |
          set -euo pipefail
          binary=apps/hepta-native/target/release/hepta-native
          if test "$RUNNER_OS" = Windows; then binary="${binary}.exe"; fi
          "$binary" --self-test > native-evidence/self-test.json
          "$binary" --qualification-e2e > native-evidence/faults.json
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            macOS) platform=macos ;;
            Windows) platform=windows ;;
            *) exit 2 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) architecture=x86_64 ;;
            ARM64) architecture=aarch64 ;;
            *) architecture=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]') ;;
          esac
          python3 apps/hepta-native/tools/package_unsigned.py \
            --platform "$platform" --architecture "$architecture" \
            --release-dir apps/hepta-native/target/release \
            --out-dir native-package > native-evidence/package-output.json
          case "$RUNNER_OS" in
            Linux) packaged='native-package/extracted/HeptaNative.AppDir/usr/bin/hepta-native' ;;
            macOS) packaged='native-package/extracted/Hepta Native.app/Contents/MacOS/hepta-native' ;;
            Windows) packaged='native-package/extracted/HeptaNative/hepta-native.exe' ;;
          esac
          "$packaged" --self-test > native-evidence/packaged-self-test.json
          "$packaged" --qualification-e2e > native-evidence/packaged-faults.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-native-repaired-${{ matrix.os }}-${{ matrix.source }}-${{ needs.repair.outputs.candidate }}
          path: |
            native-evidence/
            native-package/*.zip
          if-no-files-found: warn
          retention-days: 14
