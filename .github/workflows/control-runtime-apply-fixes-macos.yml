name: control.runtime one-shot exact fixes macOS

on:
  push:
    branches:
      - codex/control-runtime-convergence-v1
    paths:
      - .github/workflows/control-runtime-apply-fixes-macos.yml

permissions:
  contents: write

concurrency:
  group: control-runtime-one-shot-fixes-macos
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Extract and apply the exact asserted patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/control-runtime-apply-fixes.yml').read_text()
          opening = "          python3 - <<'PY'\n"
          closing = "\n          PY\n"
          start = source.index(opening) + len(opening)
          end = source.index(closing, start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/control-runtime-exact-fix.py').write_text(script)
          PYEXTRACT
          python3 /tmp/control-runtime-exact-fix.py
      - name: Canonical formatting and fast-forward publication
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-control-plane
          cd ..
          rm .github/workflows/control-runtime-apply-fixes.yml
          rm .github/workflows/control-runtime-apply-fixes-macos.yml
          git diff --check
          git config user.name "control-runtime-fix-bot"
          git config user.email "control-runtime-fix-bot@users.noreply.github.com"
          git add codex-rs/hepta-control-plane/src/planner_journal_core.rs \
                  codex-rs/hepta-control-plane/src/planner_journal.rs \
                  codex-rs/hepta-control-plane/src/planner_journal_tests.rs \
                  codex-rs/hepta-control-plane/src/planner_store_core.rs \
                  codex-rs/hepta-control-plane/src/planner_store.rs \
                  codex-rs/hepta-control-plane/src/organ_fanout_recovery.rs \
                  .github/workflows/control-runtime-apply-fixes.yml \
                  .github/workflows/control-runtime-apply-fixes-macos.yml
          git commit -m "fix(control-runtime): close journal and strict lint gaps"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Dispatch marker: apply the exact source patch on the branch head.
