name: cognitive-types-entrypoint-evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'codex-rs/hepta-types/**'
      - 'codex-rs/hepta-cognitive-types/**'
      - 'codex-rs/hepta-cognitive-read/**'
      - 'codex-rs/hepta-cognitive-store/**'
      - 'codex-rs/hepta-memory-retrieval/**'
      - 'codex-rs/hepta-compact-engine/**'
      - 'codex-rs/hepta-intelligence/**'
      - 'codex-rs/Cargo.*'
      - 'qualification/cognitive-types-v1/entrypoint_evidence.py'
      - 'qualification/cognitive-types-v1/test_entrypoint_evidence.py'
      - 'qualification/cognitive-types-v1/depth_evidence.py'
      - 'qualification/cognitive-types-v1/run_qualification.py'
      - 'docs/modules/cognitive.types/**'
      - '.github/workflows/cognitive-types-entrypoint-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-types-entrypoint-evidence-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_BACKTRACE: '1'

jobs:
  resolve:
    name: Resolve immutable entrypoint candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.identity.outputs.source }}
      base: ${{ steps.identity.outputs.base }}
    steps:
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: identity
        name: Bind one source and current base before fanout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          git check-ref-format "refs/heads/$BASE_REF"
          git fetch --no-tags origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE_SHA=$(git rev-parse "refs/remotes/origin/$BASE_REF^{commit}")
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Execute adversarial entrypoint-evidence regressions
        run: >-
          python3 -m unittest discover
          -s qualification/cognitive-types-v1
          -p 'test_entrypoint_evidence.py'

  entrypoints:
    name: entrypoint (${{ matrix.consumer }}, ${{ matrix.candidate }})
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","synthetic-merge"]' || '["exact-head"]') }}
        consumer:
          - cognitive.read
          - cognitive.store
          - memory.retrieval
          - compact.engine
          - intelligence.control
    steps:
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.source }}

      - name: Prepare the exact deterministic candidate
        id: identity
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: >-
          python3 qualification/cognitive-types-v1/depth_evidence.py prepare
          --source '${{ needs.resolve.outputs.source }}'
          --base '${{ needs.resolve.outputs.base }}'
          --kind '${{ matrix.candidate }}'
          --output "$RUNNER_TEMP/cognitive-types-entrypoint/candidate.json"

      - name: Select the reviewed normal-entrypoint module
        id: select
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.consumer }}" in
            cognitive.read)
              package=codex-hepta-cognitive-read
              test_filter='authoritative::tests'
              ;;
            cognitive.store)
              package=codex-hepta-cognitive-store
              test_filter='v2::product_tests'
              ;;
            memory.retrieval)
              package=codex-hepta-memory-retrieval
              test_filter='generation_bound::tests'
              ;;
            compact.engine)
              package=codex-hepta-compact-engine
              test_filter='qualified::tests'
              ;;
            intelligence.control)
              package=codex-hepta-intelligence
              test_filter='canonical::tests'
              ;;
            *)
              echo "unregistered consumer" >&2
              exit 2
              ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "test_filter=$test_filter" >> "$GITHUB_OUTPUT"

      - name: Record the selected Rust toolchain
        id: toolchain
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cognitive-types-entrypoint"
          {
            rustc --version --verbose
            cargo --version --verbose
          } > "$RUNNER_TEMP/cognitive-types-entrypoint/toolchain.log" 2>&1

      - name: Discover and execute a non-empty reviewed entrypoint
        id: execute
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        continue-on-error: true
        env:
          PACKAGE: ${{ steps.select.outputs.package }}
          TEST_FILTER: ${{ steps.select.outputs.test_filter }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cognitive-types-entrypoint-target
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/cognitive-types-entrypoint"
          mkdir -p "$evidence"

          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p "$PACKAGE" "$TEST_FILTER" -- --list \
            > "$evidence/list.log" 2>&1
          list_exit=$?

          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p "$PACKAGE" "$TEST_FILTER" -- --nocapture \
            > "$evidence/tests.log" 2>&1
          test_exit=$?

          python3 qualification/cognitive-types-v1/entrypoint_evidence.py record \
            --candidate "$evidence/candidate.json" \
            --consumer '${{ matrix.consumer }}' \
            --list-log "$evidence/list.log" \
            --tests-log "$evidence/tests.log" \
            --list-exit "$list_exit" \
            --test-exit "$test_exit" \
            --output "$evidence/results.json"
          record_exit=$?

          if [ "$list_exit" -ne 0 ] || [ "$test_exit" -ne 0 ] || [ "$record_exit" -ne 0 ]; then
            echo "::group::entrypoint listing tail"
            tail -n 200 "$evidence/list.log" || true
            echo "::endgroup::"
            echo "::group::entrypoint test tail"
            tail -n 200 "$evidence/tests.log" || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Verify that entrypoint execution did not mutate source
        id: clean
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cognitive-types-entrypoint"
          git status --porcelain=v1 --untracked-files=all \
            > "$RUNNER_TEMP/cognitive-types-entrypoint/source-status.txt"
          test ! -s "$RUNNER_TEMP/cognitive-types-entrypoint/source-status.txt"

      - name: Seal complete entrypoint evidence
        id: seal
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 qualification/cognitive-types-v1/entrypoint_evidence.py seal
          --directory "$RUNNER_TEMP/cognitive-types-entrypoint"
          --source '${{ needs.resolve.outputs.source }}'
          --base '${{ needs.resolve.outputs.base }}'
          --kind '${{ matrix.candidate }}'
          --consumer '${{ matrix.consumer }}'
          --run-id '${{ github.run_id }}'
          --run-attempt '${{ github.run_attempt }}'

      - name: Require execution, cleanliness, and sealed evidence
        if: ${{ always() }}
        env:
          IDENTITY_RESULT: ${{ steps.identity.outcome }}
          SELECT_RESULT: ${{ steps.select.outcome }}
          TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
          EXECUTION_RESULT: ${{ steps.execute.outcome }}
          CLEAN_RESULT: ${{ steps.clean.outcome }}
          SEAL_RESULT: ${{ steps.seal.outcome }}
        run: |
          set -euo pipefail
          test "$IDENTITY_RESULT" = success
          test "$SELECT_RESULT" = success
          test "$TOOLCHAIN_RESULT" = success
          test "$EXECUTION_RESULT" = success
          test "$CLEAN_RESULT" = success
          test "$SEAL_RESULT" = success

      - name: Preserve entrypoint evidence, including refusals
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-types-entrypoint-${{ matrix.consumer }}-${{ matrix.candidate }}-${{ needs.resolve.outputs.source }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cognitive-types-entrypoint
          if-no-files-found: error
          retention-days: 30

  entrypoint-evidence-required:
    name: Cognitive types entrypoint evidence required
    if: ${{ always() }}
    needs: [resolve, entrypoints]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: checkout
        if: ${{ needs.resolve.result == 'success' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.source }}

      - name: Download only this attempt's fixed-candidate entrypoint artifacts
        id: download
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cognitive-types-entrypoint-*-${{ needs.resolve.outputs.source }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cognitive-types-entrypoint-matrix
          merge-multiple: false

      - name: Verify exact artifact set, identities, test inventories, and bytes
        id: evidence
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: >-
          python3 qualification/cognitive-types-v1/entrypoint_evidence.py verify
          --evidence "$RUNNER_TEMP/cognitive-types-entrypoint-matrix"
          --source '${{ needs.resolve.outputs.source }}'
          --base '${{ needs.resolve.outputs.base }}'
          --event '${{ github.event_name }}'
          --run-id '${{ github.run_id }}'
          --run-attempt '${{ github.run_attempt }}'
          --output "$RUNNER_TEMP/cognitive-types-entrypoint-verified/matrix.json"

      - name: Require execution success and independently verified evidence
        if: ${{ always() }}
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          ENTRYPOINT_RESULT: ${{ needs.entrypoints.result }}
          EVIDENCE_RESULT: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          test "$RESOLVE_RESULT" = success
          test "$ENTRYPOINT_RESULT" = success
          test "$EVIDENCE_RESULT" = success

      - name: Preserve the aggregate decision, including refusals
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-types-entrypoint-verified-${{ needs.resolve.outputs.source }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cognitive-types-entrypoint-verified
          if-no-files-found: error
          retention-days: 30
