name: runtime.fleet retired source-repair workflow

# Source repairs belong in ordinary reviewed commits. This workflow deliberately
# has no push/PR trigger, checkout, source mutation, credentials, or write grant.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject retired source-repair entry point
        run: |
          echo 'This source-writing workflow is retired.' >&2
          echo 'Commit repairs normally and run runtime.fleet focused qualification on the exact SHA.' >&2
          exit 1
