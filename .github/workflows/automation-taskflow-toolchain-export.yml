name: Automation TaskFlow toolchain export

on:
  push:
    branches:
      - ops/automation-taskflow-source-snapshot-20260928

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Package exact sysroot
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          test -x "$sysroot/bin/cargo"
          test -x "$sysroot/bin/rustc"
          test -x "$sysroot/bin/rustfmt"
          test -x "$sysroot/bin/clippy-driver"
          printf '%s\n' "$sysroot" > "$RUNNER_TEMP/rust-sysroot-origin.txt"
          rustc --version --verbose > "$RUNNER_TEMP/rustc-version.txt"
          tar -C "$(dirname "$sysroot")" -czf "$RUNNER_TEMP/rust-1.95.0-sysroot.tar.gz" "$(basename "$sysroot")"
          sha256sum "$RUNNER_TEMP/rust-1.95.0-sysroot.tar.gz" > "$RUNNER_TEMP/rust-1.95.0-sysroot.tar.gz.sha256"

      - name: Retain pinned toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-1.95.0-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/rust-1.95.0-sysroot.tar.gz
            ${{ runner.temp }}/rust-1.95.0-sysroot.tar.gz.sha256
            ${{ runner.temp }}/rust-sysroot-origin.txt
            ${{ runner.temp }}/rustc-version.txt
          if-no-files-found: error
          retention-days: 1
