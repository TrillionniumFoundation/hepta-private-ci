name: Inference control qualification

on:
  pull_request:
    paths:
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - docs/modules/inference.control/**
      - qualification/module-execution-dossiers/detail/inference.control.md
      - scripts/hepta-inference-control-status.py
      - .github/workflows/inference-control-qualification.yml
      - .github/actions/hepta-synthetic-merge/action.yml
  push:
    branches:
      - main
    paths:
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - docs/modules/inference.control/**
      - qualification/module-execution-dossiers/detail/inference.control.md
      - scripts/hepta-inference-control-status.py
      - .github/workflows/inference-control-qualification.yml
      - .github/actions/hepta-synthetic-merge/action.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-control-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  RUST_BACKTRACE: "1"
  CARGO_BUILD_JOBS: "2"

jobs:
  core:
    name: ${{ matrix.lane }} / ARM64 core safety suite
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct deterministic synthetic merge
        if: matrix.lane == 'merge-candidate'
        id: merge
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta inference control CI
          author-email: hepta-inference-control-ci@users.noreply.github.com
          message: Synthetic inference.control merge
      - name: Bind exact candidate
        id: candidate
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          candidate="$SOURCE_SHA"
          if [ "$LANE" = merge-candidate ]; then
            test -n "$MERGE_SHA"
            candidate="$MERGE_SHA"
            expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          fi
          test "$(git rev-parse HEAD)" = "$candidate"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          git diff --check
      - name: Verify workspace graph
        run: python3 scripts/hepta_workspace.py
      - name: Verify formatting
        working-directory: codex-rs
        run: cargo fmt --manifest-path Cargo.toml --package codex-hepta-infer-core -- --check
      - name: Compile every core target
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-infer-core --all-targets
      - name: Run durable control and contract tests
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-core --lib
      - name: Enforce strict core lint
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-infer-core --all-targets -- -D warnings
      - name: Write exact-candidate evidence
        if: always()
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p receipts
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          lock = pathlib.Path('codex-rs/Cargo.lock').read_bytes()
          payload = {
              'schema': 'hepta.inference-control-qualification.v1',
              'sourceSha': os.environ['SOURCE_SHA'],
              'baseSha': os.environ['BASE_SHA'],
              'lane': os.environ['LANE'],
              'candidateSha': os.environ.get('CANDIDATE_SHA', ''),
              'candidateTree': os.environ.get('CANDIDATE_TREE', ''),
              'cargoLockSha256': hashlib.sha256(lock).hexdigest(),
              'commands': [
                  'cargo fmt --manifest-path Cargo.toml --package codex-hepta-infer-core -- --check',
                  'cargo check --locked -p codex-hepta-infer-core --all-targets',
                  'cargo test --locked -p codex-hepta-infer-core --lib',
                  'cargo clippy --locked -p codex-hepta-infer-core --all-targets -- -D warnings',
              ],
              'result': os.environ['JOB_STATUS'],
              'runUrl': os.environ['RUN_URL'],
          }
          pathlib.Path(f"receipts/inference-control-{os.environ['LANE']}.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Upload exact-candidate evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: inference-control-${{ matrix.lane }}-qualification
          path: receipts/inference-control-${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Require unchanged exact candidate
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  result:
    name: Inference control qualification result
    if: ${{ always() }}
    needs: [core]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require every exact-candidate lane
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_NEEDS: '["core"]'
        run: python3 .github/scripts/check_ci_results.py
