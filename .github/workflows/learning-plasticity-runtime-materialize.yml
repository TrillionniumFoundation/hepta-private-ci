# Direct review push triggers the registered one-shot materializer.
name: One-shot learning plasticity runtime materializer

on:
  push:
    branches:
      - feat/learning-plasticity-product-closure-20260928
    paths:
      - "scripts/.learning_plasticity_runtime_materializer.part*"
      - ".github/workflows/learning-plasticity-runtime-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-plasticity-runtime-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize, verify, and publish runtime closure
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and authenticate authoring payload
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.learning_plasticity_runtime_materializer.part{00..05} \
            > scripts/materialize_learning_plasticity_runtime_closure.py
          echo "6e81ba8d9a316a3d94d98f23927f68f538f6fda6692a79cd8ebee779779cd010  scripts/materialize_learning_plasticity_runtime_closure.py" \
            | sha256sum --check --strict
          python3 -m py_compile scripts/materialize_learning_plasticity_runtime_closure.py

      - name: Materialize exact source and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_learning_plasticity_runtime_closure.py
          cat <<'SUMS' | sha256sum --check --strict
          8bb9e10d29181dc0eaa97a1f805eba13e3aead92b1217bf7d59c063efd13f29b  codex-rs/hepta-agentd/src/plasticity_runtime.rs
          d3f591894eb9570f91ee03b98cc0b81b8373aad892c988f4cccfa496af514970  docs/modules/learning.plasticity/RUNTIME_RESOURCE_RECOVERY.md
          eac4db744a4d95990e824d9c46bac386b3aebdc8aa79f23aac392809acb96685  scripts/qualify_learning_plasticity.py
          SUMS
          python3 -m py_compile scripts/qualify_learning_plasticity.py
          python3 scripts/test_learning_plasticity_grammar_contract.py

      - name: Format authored Rust source
        working-directory: codex-rs
        run: cargo fmt --manifest-path Cargo.toml --package codex-hepta-agentd

      - name: Compile all Agentd targets
        working-directory: codex-rs
        run: cargo check --locked --all-targets -p codex-hepta-agentd

      - name: Exercise aggregate quota and exact cache regressions
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd --lib \
            plasticity_aggregate_quota_spans_parameter_and_topology_work \
            -- --test-threads=1
          cargo test --locked -p codex-hepta-agentd --lib \
            plasticity_static_cache_is_exact_and_bounded \
            -- --test-threads=1
          cargo test --locked -p codex-hepta-agentd --lib \
            agentd_lifetime_owner_submits_restarts_and_reconciles_idempotently \
            -- --test-threads=1

      - name: Publish authored candidate and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/materialize_learning_plasticity_runtime_closure.py
          git rm scripts/.learning_plasticity_runtime_materializer.part{00..05}
          git rm .github/workflows/learning-plasticity-runtime-materialize.yml
          git add \
            codex-rs/hepta-agentd/src/plasticity_runtime.rs \
            docs/modules/learning.plasticity/RUNTIME_RESOURCE_RECOVERY.md \
            docs/modules/learning.plasticity/DEVELOPER_QUICKSTART.md \
            scripts/qualify_learning_plasticity.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(plasticity): bound aggregate runtime resources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
