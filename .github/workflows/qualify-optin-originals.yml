name: Reopen and preserve the original MCP-to-Circuit archive
on:
  push:
    branches: [research/optin-cell-integrated-readout-20261123]
    paths:
      [
        "qualification/optin-circuit-integration-20261123/read_originals.py",
        ".github/workflows/qualify-optin-originals.yml",
      ]
permissions:
  contents: read
  actions: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: qualification/optin-circuit-integration-20261123
      - name: Download the registered original and read it independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/14826800458/zip > "$RUNNER_TEMP/original.zip"
          python3 qualification/optin-circuit-integration-20261123/read_originals.py "$RUNNER_TEMP/original.zip"
