name: hepta-P2-equal-Head-granite (research DENY_ALL)

on:
  pull_request:
    paths:
      - "qualification/stem-cell-v1/p2_real_cell_split.py"
      - "qualification/stem-cell-v1/p2_real_cell_split_review.py"
      - "qualification/stem-cell-v1/test_p2_real_cell_split.py"
      - "qualification/stem-cell-v1/p2_train_sparse_equal_compute.py"
      - "qualification/stem-cell-v1/p2_train_sparse_equal_compute_review.py"
      - "qualification/stem-cell-v1/test_p2_train_sparse_equal_compute.py"
      - "qualification/stem-cell-v1/p2_backward_cost_profiler.py"
      - "qualification/stem-cell-v1/p2_backward_cost_profile_review.py"
      - "qualification/stem-cell-v1/test_p2_backward_cost_profiler.py"
      - "qualification/stem-cell-v1/p2_counterbalanced_cpu_training.py"
      - "qualification/stem-cell-v1/p2_counterbalanced_cpu_training_review.py"
      - "qualification/stem-cell-v1/test_p2_counterbalanced_cpu_training.py"
      - "qualification/stem-cell-v1/P2_COUNTERBALANCED_CPU_COST_REPLAY.md"
      - "qualification/stem-cell-v1/P2_LOCAL_COUNTERBALANCED_3SEED_20261015.json"
      - "qualification/stem-cell-v1/P2_COUNTERBALANCED_SOURCE_TEST_COUNTS_20261015.json"
      - "qualification/stem-cell-v1/P2_BACKWARD_OPERATOR_COST_PROVENANCE_20261015.md"
      - "qualification/stem-cell-v1/P2_LOCAL_BACKWARD_OPERATOR_3SEED_20261015.json"
      - "qualification/stem-cell-v1/P2_TRAINED_TOP1_EQUAL_FORWARD_WORK.md"
      - "qualification/stem-cell-v1/P2_LOCAL_TRAINED_TOP1_TOY_20261015.json"
      - "qualification/stem-cell-v1/p2_postfit_sparse_top1.py"
      - "qualification/stem-cell-v1/p2_postfit_sparse_review.py"
      - "qualification/stem-cell-v1/test_p2_postfit_sparse_top1.py"
      - "qualification/stem-cell-v1/P2_POSTFIT_PHYSICAL_TOP1.md"
      - "qualification/stem-cell-v1/P2_LOCAL_POSTFIT_SPARSE_TOY_20261015.json"
      - "qualification/stem-cell-v1/P2_EQUAL_HEAD_REAL_GRANITE.md"
      - "qualification/stem-cell-v1/P2_LOCAL_TOY_REPLAY_20261015.json"
      - ".github/workflows/hepta-p2-equal-head-real-granite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equal-budget-source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned local CPU math libraries only
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Run real Torch toy / independent numpy / tamper controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p2"
          git rev-parse HEAD > "$RUNNER_TEMP/p2/source-head.txt"
          git hash-object qualification/stem-cell-v1/{p2_real_cell_split,p2_real_cell_split_review,test_p2_real_cell_split}.py \
            > "$RUNNER_TEMP/p2/source-blobs.txt"
          python -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_real_cell_split.py -v 2>&1 | tee "$RUNNER_TEMP/p2/source-tests.log"
          python -O -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_real_cell_split.py -v 2>&1 | tee "$RUNNER_TEMP/p2/optimized-tests.log"
          python -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_postfit_sparse_top1.py -v 2>&1 | tee "$RUNNER_TEMP/p2/postfit-source-tests.log"
          python -O -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_postfit_sparse_top1.py -v 2>&1 | tee "$RUNNER_TEMP/p2/postfit-optimized-tests.log"
          python -m compileall -q qualification/stem-cell-v1/p2_postfit_sparse_top1.py \
            qualification/stem-cell-v1/p2_postfit_sparse_review.py \
            qualification/stem-cell-v1/test_p2_postfit_sparse_top1.py
          python -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_train_sparse_equal_compute.py -v 2>&1 | tee "$RUNNER_TEMP/p2/trained-top1-source-tests.log"
          python -O -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_train_sparse_equal_compute.py -v 2>&1 | tee "$RUNNER_TEMP/p2/trained-top1-optimized-tests.log"
          python -m compileall -q qualification/stem-cell-v1/p2_train_sparse_equal_compute.py \
            qualification/stem-cell-v1/p2_train_sparse_equal_compute_review.py \
            qualification/stem-cell-v1/test_p2_train_sparse_equal_compute.py
          python -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_backward_cost_profiler.py -v 2>&1 | tee "$RUNNER_TEMP/p2/backward-operator-source-tests.log"
          python -O -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_backward_cost_profiler.py -v 2>&1 | tee "$RUNNER_TEMP/p2/backward-operator-optimized-tests.log"
          python -m compileall -q qualification/stem-cell-v1/p2_backward_cost_profiler.py \
            qualification/stem-cell-v1/p2_backward_cost_profile_review.py \
            qualification/stem-cell-v1/test_p2_backward_cost_profiler.py
          python -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_counterbalanced_cpu_training.py -v 2>&1 | tee "$RUNNER_TEMP/p2/counterbalanced-source-tests.log"
          python -O -m unittest discover -s qualification/stem-cell-v1 \
            -p test_p2_counterbalanced_cpu_training.py -v 2>&1 | tee "$RUNNER_TEMP/p2/counterbalanced-optimized-tests.log"
          python -m compileall -q qualification/stem-cell-v1/p2_counterbalanced_cpu_training.py \
            qualification/stem-cell-v1/p2_counterbalanced_cpu_training_review.py \
            qualification/stem-cell-v1/test_p2_counterbalanced_cpu_training.py
          python -m compileall -q qualification/stem-cell-v1/p2_real_cell_split.py \
            qualification/stem-cell-v1/p2_real_cell_split_review.py \
            qualification/stem-cell-v1/test_p2_real_cell_split.py
      - name: Check toy receipt is byte-bound to original tested source and cannot claim efficacy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('qualification/stem-cell-v1')
          receipt=json.loads((root/'P2_LOCAL_TOY_REPLAY_20261015.json').read_text())
          assert receipt['schema']=='hepta.p2.synthetic-equal-parameter-local-evidence.v1'
          assert receipt['status']=='SYNTHETIC_NOT_PRETRAINED'
          assert receipt['authority']=='DENY_ALL' and receipt['production_promotion_permitted'] is False
          assert receipt['model_winner_selected'] is False and receipt['n_trials']==3
          for name,expected in receipt['source_git_blob_sha1'].items():
              assert name in {'p2_real_cell_split.py','p2_real_cell_split_review.py','test_p2_real_cell_split.py'}
              real=subprocess.check_output(['git','hash-object',str(root/name)],text=True).strip()
              assert real==expected,(name,'historical toy source digest drift')
          print('source-bound synthetic-only receipt; not independent model efficacy')
          PY
      - name: Bind complete synthetic-only negative and positive observations to original tested source bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('qualification/stem-cell-v1')
          doc=json.loads((root/'P2_LOCAL_TRAINED_TOP1_TOY_20261015.json').read_text())
          compact=lambda d:json.dumps(d,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
          digest=hashlib.sha256(compact({k:v for k,v in doc.items() if k!='receipt_sha256'})).hexdigest()
          if (doc.get('schema')!='hepta.p2.trained-one-active-synthetic-three-seed-receipt.v1'
              or doc.get('receipt_sha256')!=digest or doc.get('total_seeds')!=3
              or doc.get('seed_census')!=[41,47,53] or doc.get('pretrained_stem_model_loaded') is not False
              or doc.get('model_winner_selected') is not False
              or doc.get('production_promotion_permitted') is not False
              or doc.get('authority')!='DENY_ALL'):
              raise ValueError('historical mechanism receipt is altered or falsely authorized')
          for name,expected in doc['source_git_blob_sha1'].items():
              if name not in {'p2_train_sparse_equal_compute.py','p2_train_sparse_equal_compute_review.py',
                               'test_p2_train_sparse_equal_compute.py','P2_TRAINED_TOP1_EQUAL_FORWARD_WORK.md'}:
                  raise ValueError('unexpected source-bound file')
              observed=subprocess.check_output(['git','hash-object',str(root/name)],text=True).strip()
              if observed!=expected:raise ValueError('original local experiment source bytes drifted '+name)
          print('Three synthetic seed reports are byte-bound and deny model selection; not hosted pretrained efficacy')
          PYCODE
      - name: Bind the three synthetic CPU operator observations to the exact tested source (not model efficacy)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('qualification/stem-cell-v1')
          report=json.loads((root/'P2_LOCAL_BACKWARD_OPERATOR_3SEED_20261015.json').read_text())
          compact=lambda x:json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
          if (report.get('schema')!='hepta.p2.cpu-backward-cost-three-seed-mechanism-receipt.v1'
              or report.get('seed_census')!=[41,47,53]
              or report.get('public_pretrained_weight_executed') is not False
              or report.get('partial_flops_not_complete_backward_or_total_cost') is not True
              or report.get('production_promotion_permitted') is not False
              or report.get('authority')!='DENY_ALL'
              or hashlib.sha256(compact({k:v for k,v in report.items() if k!='receipt_sha256'})).hexdigest()!=report.get('receipt_sha256')):
              raise ValueError('historical synthetic operator results changed or overclaim real efficacy')
          expected={'p2_backward_cost_profiler.py','p2_backward_cost_profile_review.py',
                    'test_p2_backward_cost_profiler.py','P2_BACKWARD_OPERATOR_COST_PROVENANCE_20261015.md'}
          if set(report.get('source_git_blob_sha1',{})) != expected:
              raise ValueError('unregistered benchmark source/hash inventory')
          for name,prior in report['source_git_blob_sha1'].items():
              observed=subprocess.check_output(['git','hash-object',str(root/name)],text=True).strip()
              if observed!=prior:raise ValueError('original 3-seed profiler code changed '+name)
          print('historical synthetic-only operator work retains exact source SHA; not real model qualification')
          PYCODE
      - name: Verify three synthetic balanced CPU trials are not rewritten into pretrained/latency proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('qualification/stem-cell-v1')
          receipt=json.loads((root/'P2_LOCAL_COUNTERBALANCED_3SEED_20261015.json').read_text())
          canonical=lambda x:json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
          if (receipt.get('schema')!='hepta.p2.counterbalanced-cpu-three-seed-synthetic.v1'
              or receipt.get('authority')!='DENY_ALL' or receipt.get('production_authorized') is not False
              or receipt.get('real_pretrained_encoder_loaded') is not False
              or receipt.get('future_quality_established') is not False
              or receipt.get('seeds')!=[41,47,53]
              or receipt.get('cpu_wall_not_full_worker_cost') is not True
              or receipt.get('repetitions_are_not_independent_episodes') is not True
              or receipt.get('receipt_sha256')!=hashlib.sha256(canonical({k:v for k,v in receipt.items() if k!='receipt_sha256'})).hexdigest()):
              raise ValueError('false historical physical CPU effectiveness assertion')
          expected={'p2_counterbalanced_cpu_training.py','p2_counterbalanced_cpu_training_review.py',
                    'test_p2_counterbalanced_cpu_training.py','P2_COUNTERBALANCED_CPU_COST_REPLAY.md'}
          if set(receipt.get('source_git_blob_sha1',{}))!=expected:
              raise ValueError('unregistered original measured source inventory')
          for name,sha in receipt['source_git_blob_sha1'].items():
              if subprocess.check_output(['git','hash-object',str(root/name)],text=True).strip()!=sha:
                  raise ValueError('original local CPU source bytes drifted: '+name)
          counts=json.loads((root/'P2_COUNTERBALANCED_SOURCE_TEST_COUNTS_20261015.json').read_text())
          expected_counts={'new_counterbalanced':31,'new_backward':31,'trained_top1':32,
                           'postfit_top1':22,'original_p2':24,'granite_p1':27,
                           'shared_p1':33,'reader_p0':59}
          if (counts.get('schema')!='hepta.p2.counterbalanced-cpu-local-regression-census.v1'
              or counts.get('authority')!='DENY_ALL' or counts.get('production_authorized') is not False
              or counts.get('source_only_not_pretrained') is not True
              or counts.get('original_combined_attempt_timed_out') is not True
              or counts.get('partial_combined_attempt_counted_as_pass') is not False
              or counts.get('normal_counts')!=expected_counts
              or counts.get('optimized_counts')!=expected_counts
              or counts.get('distinct_test_count_per_mode')!=259):
              raise ValueError('incomplete/optimistic original local test counts')
          print('historical local fake-Stem paired CPU observations source bound; not pretrained')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-equal-head-source-only-deny-all
          if-no-files-found: warn
          path: ${{ runner.temp }}/p2/

  pinned-real-granite-equal-parameter-study:
    needs: equal-budget-source-regressions
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: pinned-compact
          ref: e05f939f65fb76f6bdbf7470eef7e63b77284dcd
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: pinned-e1
          ref: 09bb40d8bf3a058a34607179d4e0fbdf11a41277
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: pinned-public-source
          ref: f8d168a7689eb3624d97c44751791badd069e521
          persist-credentials: false
      - name: Verify exact reviewed source commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-compact rev-parse HEAD)" = e05f939f65fb76f6bdbf7470eef7e63b77284dcd
          test "$(git -C pinned-e1 rev-parse HEAD)" = 09bb40d8bf3a058a34607179d4e0fbdf11a41277
          test "$(git -C pinned-public-source rev-parse HEAD)" = f8d168a7689eb3624d97c44751791badd069e521
          git diff --check
          mkdir -p "$RUNNER_TEMP/p2"
          git rev-parse HEAD > "$RUNNER_TEMP/p2/real-job-source-head.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original frozen-Encoder owners' CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/p2-venv"
          PY="$RUNNER_TEMP/p2-venv/bin/python"
          "$PY" -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.10.0' 'torchvision==0.25.0' 'torchcodec==0.10.0'
          "$PY" -m pip install --only-binary=:all: \
            'numpy==2.2.6' 'transformers==5.19.0' 'sentence-transformers==6.1.0' \
            'huggingface-hub==1.33.0' 'safetensors==0.8.0' 'packaging==25.0' \
            'pyarrow==21.0.0' 'pillow==11.3.0'
          "$PY" -m pip check
          "$PY" -m pip freeze > "$RUNNER_TEMP/p2/locked-dependencies.txt"
      - name: Independently re-acquire source-owner original AG News bytes
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$RUNNER_TEMP/p2"
          "$RUNNER_TEMP/p2-venv/bin/python" - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'pinned-public-source/qualification/neuron-dynamic-learning')
          from public_agnews_source import download_checked
          from public_agnews_panel import prepare,canonical,sha
          root=Path(os.environ['ROOT'])
          for role in ('train','calibration_test'):
              download_checked(role,root/(role+'.parquet'))
          panel,receipt=prepare(root/'train.parquet',root/'calibration_test.parquet')
          (root/'panel.json').write_bytes(canonical(panel))
          assert receipt['panel_digest']==sha(canonical(panel))
          assert sha(canonical(panel))=='2f7a013648e16b60c74614b0fcf1496aa06475f7285f215adddaa51fe29e01a4'
          assert panel['cross_sectional_not_future'] is True
          PY
          "$RUNNER_TEMP/p2-venv/bin/python" \
            qualification/stem-cell-v1/p1_real_granite_cohort.py prepare \
            --original-panel "$ROOT/panel.json" --e1-source pinned-e1 \
            --output-dir "$ROOT/material"
      - name: Pin complete safe Granite97 checkpoint and published LFS hashes
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/p2-venv/bin/python" - <<'PY'
          import hashlib
          from pathlib import Path
          from huggingface_hub import HfApi,snapshot_download
          model='ibm-granite/granite-embedding-97m-multilingual-r2'
          rev='835ad14087e140460703cf0fae09f97d469d65c2'
          info=HfApi().model_info(repo_id=model,revision=rev,files_metadata=True)
          assert info.sha==rev
          snap=Path(snapshot_download(repo_id=model,revision=rev,
                          allow_patterns=['*.json','*.safetensors','*.txt','*.model']))
          found={p.relative_to(snap).as_posix():p for p in snap.rglob('*') if p.is_file()}
          for key in ('model.safetensors','config.json','tokenizer.json'):
              assert key in found,('pinned source missing',key)
          assert not any(name.endswith(('.bin','.pt','.pkl','.pickle','.py','.so')) for name in found)
          for item in info.siblings:
              if item.rfilename not in found: continue
              expected=item.lfs.get('sha256') if isinstance(item.lfs,dict) else getattr(item.lfs,'sha256',None)
              if expected:
                  assert hashlib.sha256(found[item.rfilename].read_bytes()).hexdigest()==expected,item.rfilename
          PY
      - name: Run four physical matched Head learning arms under one genuine frozen Granite97 Stem
        shell: bash
        run: |
          set -euo pipefail
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          PY="$RUNNER_TEMP/p2-venv/bin/python"
          ROOT="$RUNNER_TEMP/p2"
          "$PY" qualification/stem-cell-v1/p2_real_cell_split.py \
            --train-material "$ROOT/material/train.json" \
            --blind-material "$ROOT/material/blind.json" \
            --compact-source pinned-compact \
            --output "$ROOT/predictions-unscored.json" \
            2>&1 | tee "$ROOT/physical-run.log"
      - name: Physically run Top-1 selected original trained Head only before opening any test label
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/p2"
          "$RUNNER_TEMP/p2-venv/bin/python" \
            qualification/stem-cell-v1/p2_postfit_sparse_top1.py \
            --p2-report "$ROOT/predictions-unscored.json" \
            --output "$ROOT/postfit-sparse-unscored.json" --repetitions 100
      - name: Actually TRAIN matched one-active Head, fixed and adaptive physical Top-1 from new supervised gradients
        shell: bash
        run: |
          set -euo pipefail
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          ROOT="$RUNNER_TEMP/p2"
          "$RUNNER_TEMP/p2-venv/bin/python" \
            qualification/stem-cell-v1/p2_train_sparse_equal_compute.py \
            --train-material "$ROOT/material/train.json" \
            --blind-material "$ROOT/material/blind.json" \
            --compact-source pinned-compact \
            --original-p2-report "$ROOT/predictions-unscored.json" \
            --output "$ROOT/trained-top1-unscored.json" \
            2>&1 | tee "$ROOT/trained-top1-physical.log"
      - name: Re-encode pinned pretrained Granite97 and PHYSICALLY re-profile original 40-step backward operators before label access
        shell: bash
        run: |
          set -euo pipefail
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          ROOT="$RUNNER_TEMP/p2"
          "$RUNNER_TEMP/p2-venv/bin/python" \
            qualification/stem-cell-v1/p2_backward_cost_profiler.py \
            --train-material "$ROOT/material/train.json" \
            --blind-material "$ROOT/material/blind.json" \
            --compact-source pinned-compact \
            --original-p2-report "$ROOT/predictions-unscored.json" \
            --original-trained-top1-report "$ROOT/trained-top1-unscored.json" \
            --output "$ROOT/backward-operator-profile-unscored.json" \
            2>&1 | tee "$ROOT/backward-operator-physical.log"
      - name: Re-encode the same real Granite97 and run counterbalanced UNPROFILED CPU 40-step re-trainings before label opening
        shell: bash
        run: |
          set -euo pipefail
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          ROOT="$RUNNER_TEMP/p2"
          "$RUNNER_TEMP/p2-venv/bin/python" \
            qualification/stem-cell-v1/p2_counterbalanced_cpu_training.py \
            --train-material "$ROOT/material/train.json" \
            --blind-material "$ROOT/material/blind.json" \
            --compact-source pinned-compact \
            --original-p2-report "$ROOT/predictions-unscored.json" \
            --original-trained-top1-report "$ROOT/trained-top1-unscored.json" \
            --rounds 8 --crossover-seed 20261015 \
            --output "$ROOT/counterbalanced-cpu-unscored.json" \
            2>&1 | tee "$ROOT/counterbalanced-cpu-physical.log"
      - name: Only AFTER sealed model predictions, open original source owner labels and replay NumPy weights
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/p2"
          "$RUNNER_TEMP/p2-venv/bin/python" \
            qualification/stem-cell-v1/p2_real_cell_split_review.py \
            --original-panel "$ROOT/panel.json" \
