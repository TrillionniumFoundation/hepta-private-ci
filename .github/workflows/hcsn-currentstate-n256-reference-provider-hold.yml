name: hcsn-currentstate-n256-reference-provider-hold

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_reference_provider_hold/**"
      - ".github/workflows/hcsn-currentstate-n256-reference-provider-hold.yml"

permissions:
  contents: read

jobs:
  truthful-source-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run small stdlib source fixtures
        run: |
          python -m unittest qualification.hcsn_currentstate_n256_reference_provider_hold.test_static
          python -O -m unittest qualification.hcsn_currentstate_n256_reference_provider_hold.test_static
      - name: Verify exact shared-kernel blocker and fail-closed source
        run: python -m qualification.hcsn_currentstate_n256_reference_provider_hold.static_inspector
