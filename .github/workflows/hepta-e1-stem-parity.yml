name: Hepta E1 three Stem fairness gate
on:
  pull_request:
    paths:
      - "experiments/shared_stem_cell/e1_three_stem_consistency.py"
      - "experiments/shared_stem_cell/test_e1_three_stem_consistency.py"
      - "experiments/shared_stem_cell/E1_THREE_STEM_PARITY.md"
      - ".github/workflows/hepta-e1-stem-parity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e1-fairness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict source and synthetic E1 anti-leakage checks
        run: |
          set -euo pipefail
          python -m py_compile experiments/shared_stem_cell/e1_three_stem_consistency.py
          python -m unittest discover -s experiments/shared_stem_cell -p 'test_e1_three_stem_consistency.py' -v
