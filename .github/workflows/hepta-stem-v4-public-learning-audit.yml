name: Hepta Stem V4 independent real public Cell learning audit (DENY_ALL)

on:
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/banking77_independent_v4.py'
      - 'qualification/stem-cell-v1/test_banking77_independent_v4.py'
      - 'qualification/stem-cell-v1/STEM_V4_PUBLIC_LEARNING_AUDIT.md'
      - '.github/workflows/hepta-stem-v4-public-learning-audit.yml'

permissions:
  contents: read

jobs:
  offline-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact-HEAD source-only tests (archive-optional case is not physical evidence)
        working-directory: qualification/stem-cell-v1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          python -m unittest -v test_banking77_independent_v4
          python -O -m unittest -v test_banking77_independent_v4
          python -m py_compile banking77_independent_v4.py test_banking77_independent_v4.py

  independent-original-source-and-score:
    needs: offline-source-tests
    # Original physical test data access is for same-repository controlled research PRs.
    # Do not let an untrusted fork request download originals or execute unreviewed code.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/stem-multimodal-source-bound-v1-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch exact existing real-model artifact and pinned original publisher CSVs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          mkdir -p "$RUNNER_TEMP/stem-v4"
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11877613315/zip \
            > "$RUNNER_TEMP/stem-v4/original.zip"
          python - <<'PY'
          import hashlib,os
          import urllib.request
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"stem-v4"
          data=(root/"original.zip").read_bytes()
          expected="fd89f174057d98bd2d4f03447d5d5dd9372723e70128ccdf2dcbe73f67a0a03a"
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit("original pretrained Actions artifact archive drift")
          revision="57ec275d8078af65b7731c2a98be812d844a6d6b"
          reference={"train":"b06e26ac675513959a63135f11b94ea7786ed02da65db93a5650d8838cbc664b",
                     "test":"d12d6e3bc4c3103966ae786dc435913c0c563dfa328f5a3646d0e62cfeeb474d"}
          for split in ("train","test"):
              url="https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/"+revision+"/banking_data/"+split+".csv"
              req=urllib.request.Request(url,headers={"User-Agent":"hepta-original-data-review-v4"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  if response.geturl()!=url:
                      raise SystemExit("unexpected publisher source redirect")
                  raw=response.read(2_000_001)
              if not 0<len(raw)<=2_000_000 or hashlib.sha256(raw).hexdigest()!=reference[split]:
                  raise SystemExit("original publisher dataset bytes mismatch")
              with (root/(split+".csv")).open("xb") as dest:
                  dest.write(raw)
          print("Original public dataset byte hashes and archived model result ZIP pinned; labels kept private in job")
          PY
      - name: Independent source-first 32-row adjudication and complete original model seal audit
        shell: bash
        run: |
          set -euo pipefail
          python qualification/stem-cell-v1/banking77_independent_v4.py \
            --archive "$RUNNER_TEMP/stem-v4/original.zip" \
            --train "$RUNNER_TEMP/stem-v4/train.csv" \
            --test "$RUNNER_TEMP/stem-v4/test.csv" \
            --output "$RUNNER_TEMP/stem-v4/independent-audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"stem-v4/independent-audit.json").read_text())
          assert r["source_bytes_independently_verified"] is True
          assert r["qualification"]=="HOLD_NO_GO" and r["authority"]=="DENY_ALL"
          assert r["model_selected"] is False and r["production_authorized"] is False
          assert r["arms"]["dense16"]["scores"]["after"]["correct"]==23
          assert r["arms"]["sparse16_top2"]["scores"]["after"]["correct"]==17
          assert r["dense_vs_sparse_after"]["discordant"]==14
          print(json.dumps({"schema":r["schema"],"original_source_verified":True,
             "dense_correct":23,"sparse_correct":17,
             "paired_p":r["dense_vs_sparse_after"]["exact_two_sided_p"],
             "source_disjoint_future_efficacy_established":False,
             "authority":"DENY_ALL"},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hepta-stem-v4-public-original-independent-audit-denyall
          path: ${{ runner.temp }}/stem-v4/independent-audit.json
          retention-days: 7
          if-no-files-found: error
