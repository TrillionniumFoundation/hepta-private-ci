name: MemoryCell stage-1 real reader capability
on:
  pull_request:
    paths:
      - ".github/workflows/hepta-memory-stage1-real-readers.yml"
      - "scripts/memory_cell/factorial_evidence_gate.py"
      - "scripts/memory_cell/factorial_transcript_integrity.py"
      - "scripts/memory_cell/FACTORIAL_TRANSCRIPT_LAB.md"
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-stage1-real-reader-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reader:
    if: >-
      github.event.pull_request.number == 2607 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/memory-four-stage-premise-integrity-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tier: [smol-135m, smol-1.7b]
    env:
      PYTHONPATH: scripts/memory_cell
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-audited-source-inputs
          run-id: 38043602289
          github-token: ${{ github.token }}
          path: /tmp/stage1-inputs
      - name: Verify exact head and pinned original development inputs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage1-receipt
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD > /tmp/stage1-receipt/tested-commit.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from reader_reference import PINS
          for name, expected in PINS.items():
              file = Path('/tmp/stage1-inputs') / (name + '.json')
              if file.is_symlink() or not file.is_file():
                  raise ValueError('missing pinned development source ' + name)
              if hashlib.sha256(file.read_bytes()).hexdigest() != expected:
                  raise ValueError('historical development source changed ' + name)
          PY
      - name: Install pinned CPU inference environment
        run: |
          set -euo pipefail
          python3 -m venv /tmp/stage1-python
          /tmp/stage1-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/stage1-python/bin/pip install -r /tmp/stage1-inputs/environment.txt
          /tmp/stage1-python/bin/pip freeze > /tmp/stage1-receipt/python-lock.txt
      - name: Stage exact public model revision with publisher file verification
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/stage1-receipt/staging-resource.txt /tmp/stage1-python/bin/python scripts/memory_cell/reader_reference.py stage '${{ matrix.tier }}' /tmp/stage1-model
          cp /tmp/stage1-model/stage.json /tmp/stage1-model/publisher.json /tmp/stage1-model/inventory.json /tmp/stage1-receipt/
          sha256sum /tmp/stage1-model/stage.json > /tmp/stage1-receipt/stage-pin.txt
      - name: Execute actual no-training reader capability conditions
        env:
          HEPTA_MEMORY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/stage1-receipt/inference-resource.txt /tmp/stage1-python/bin/python scripts/memory_cell/reader_reference.py run /tmp/stage1-inputs /tmp/stage1-model /tmp/stage1-receipt/run --stage-sha "$(cut -d ' ' -f1 /tmp/stage1-receipt/stage-pin.txt)" 2>&1 | tee /tmp/stage1-receipt/inference.log
          cat /tmp/stage1-receipt/run/reference-report.json
      - name: Retain exact raw outputs, resources and failure modes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage1-receipt
          git rev-parse HEAD > /tmp/stage1-receipt/tested-commit.txt
          printf '%s\n' 'Previously exposed development tasks. Reader capacity is not a MemoryCell gain. No independent semantic or production acceptance.' > /tmp/stage1-receipt/scope.txt
          (cd /tmp/stage1-receipt && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-stage1-real-${{ matrix.tier }}
          path: /tmp/stage1-receipt
          if-no-files-found: error

  paired-capacity:
    needs: reader
    if: >-
      always() && !cancelled() &&
      needs.reader.result == 'success' &&
      github.event.pull_request.number == 2607
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: memory-stage1-real-*
          path: /tmp/stage1-paired
      - name: Compare original answers with matched actual source bytes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage1-comparison
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/stage1-paired')
          names = ('smol-135m', 'smol-1.7b')
          by_tier = {}
          for tier in names:
              directory = root / ('memory-stage1-real-' + tier)
              declared = {}
              for line in (directory / 'SHA256SUMS').read_text().splitlines():
                  digest, relative = line.split(maxsplit=1)
                  relative = relative.removeprefix('./')
                  if relative in declared:
                      raise ValueError('duplicate result file')
                  file = (directory / relative).resolve()
                  if not file.is_relative_to(directory.resolve()) or not file.is_file():
                      raise ValueError('unsafe result file')
                  if hashlib.sha256(file.read_bytes()).hexdigest() != digest:
                      raise ValueError('original result bytes changed')
                  declared[relative] = digest
              actual = {
                  p.relative_to(directory).as_posix()
                  for p in directory.rglob('*') if p.is_file() and p.name != 'SHA256SUMS'
              }
              if actual != set(declared):
                  raise ValueError('incomplete original result manifest')
              if (directory / 'tested-commit.txt').read_text().strip() != __import__('os').environ['EXPECTED_HEAD']:
                  raise ValueError('different code source')
              records = json.loads((directory / 'run/diagnostic/execution/scored-answers.json').read_text())
              keys = [(r['question_id'], r['arm']) for r in records]
              if len(keys) != len(set(keys)) or not keys:
                  raise ValueError('duplicate or empty reader answer census')
              by_tier[tier] = {key: r for key, r in zip(keys, records)}
          first, second = (by_tier[name] for name in names)
          if set(first) != set(second):
              raise ValueError('not a paired question/condition population')
          rows = []
          revisions = [set(), set()]
          for key in sorted(first):
              a, b = first[key], second[key]
              if a['status'] != 'succeeded' or b['status'] != 'succeeded':
                  raise ValueError('failed original generation cannot become a successful pair')
              r1, r2 = a['receipt'], b['receipt']
              revisions[0].add(r1['reader_identity'])
              revisions[1].add(r2['reader_identity'])
              if r1['delivered_evidence'] != r2['delivered_evidence']:
                  raise ValueError('reader capacity comparison changed delivered source bytes')
              rows.append({
                  'question_id': key[0], 'condition': key[1],
                  'frozen_diagnostic_f1': a['f1'],
                  'reference_diagnostic_f1': b['f1'],
                  'diagnostic_delta': b['f1'] - a['f1'],
                  'delivered_evidence_sha256': hashlib.sha256(json.dumps(r1['delivered_evidence'], sort_keys=True, ensure_ascii=False).encode()).hexdigest(),
                  'frozen_original_answer_sha256': hashlib.sha256(a['answer'].encode()).hexdigest(),
                  'reference_original_answer_sha256': hashlib.sha256(b['answer'].encode()).hexdigest(),
              })
          if any(len(s) != 1 for s in revisions) or revisions[0] == revisions[1]:
              raise ValueError('reference did not use a distinct pinned model revision')
          report = {
              'schema': 'hepta.memory.stage1.paired-real-reader.v1',
              'tested_commit': __import__('os').environ['EXPECTED_HEAD'],
              'original_development_questions': len({r['question_id'] for r in rows}),
              'paired_attempts': len(rows),
              'reader_models': {names[i]: next(iter(s)) for i, s in enumerate(revisions)},
              'diagnostic_mean_delta': sum(r['diagnostic_delta'] for r in rows) / len(rows),
              'rows': rows,
              'new_independent_source_families_authenticated': 0,
              'semantic_sufficiency_independently_established': False,
              'reader_capacity_is_memory_gain': False,
              'production_accepted': False,
          }
          target = Path('/tmp/stage1-comparison/paired-report.json')
          target.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          print(json.dumps({k: v for k, v in report.items() if k != 'rows'}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-stage1-real-paired-capacity
          path: /tmp/stage1-comparison
          if-no-files-found: warn
