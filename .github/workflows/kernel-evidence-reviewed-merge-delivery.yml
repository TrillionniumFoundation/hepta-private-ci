name: Kernel evidence reviewed merge delivery

on:
  push:
    branches: [work/kernel-evidence-ad-integration-20260928]

permissions:
  contents: write

jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[kernel-evidence-reviewed-merge]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Publish only the locally reviewed exact source tree
        shell: bash
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=71bdd2dd526007e334b168eff3a6355730f7570f
          followup=a4b0d8f1b87390d79b363f3432bef16810884579
          branch=work/kernel-evidence-ad-integration-20260928
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD)" = .github/workflows/kernel-evidence-reviewed-merge-delivery.yml
          git checkout --detach "$base"
          set +e
          git merge-tree --write-tree HEAD "$followup" > "$RUNNER_TEMP/reviewed-merge.txt"
          rc=$?
          set -e
          test "$rc" -eq 1
          tree="$(head -n 1 "$RUNNER_TEMP/reviewed-merge.txt")"
          test "$tree" = 74ae81e5b5c3ffe7f1dcc66466299f462c1e4c34
          git read-tree --reset -u "$tree"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          expected = {
              'qualification.rs': 'ed2b7dc30ebbc1b69bcbfa16a5c22daa931ca5bb',
              'qualification_provenance.rs': 'b78b62e5e78714ac16368395848f519c536da1ad',
              'qualification_provenance_tests.rs': 'fdea52a2abef888f89ecd8e8e3a385ead206597d',
          }
          for name, expected_blob in expected.items():
              path = Path('codex-rs/hepta-evidence/src') / name
              text, count = re.subn(
                  r'^<<<<<<< HEAD\n(.*?)^=======\n.*?^>>>>>>> [^\n]+\n',
                  r'\1', path.read_text(), flags=re.S | re.M,
              )
              if count != 1:
                  raise SystemExit(f'{name}: unexpected conflict inventory {count}')
              data = text.encode()
              blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              if blob != expected_blob:
                  raise SystemExit(f'{name}: reviewed resolution hash mismatch {blob}')
              path.write_bytes(data)
          workflow = Path('.github/workflows/kernel-evidence-ad-integration.yml')
          text = workflow.read_text()
          if text.count('          set -uo pipefail\n') != 1:
              raise SystemExit('diagnostic shell does not match reviewed base')
          workflow.write_text(text.replace('          set -uo pipefail\n', '          set -uo pipefail\n          set +e\n'))
          PY
          git add -- codex-rs/hepta-evidence/src/qualification.rs codex-rs/hepta-evidence/src/qualification_provenance.rs codex-rs/hepta-evidence/src/qualification_provenance_tests.rs .github/workflows/kernel-evidence-ad-integration.yml
          result_tree="$(git write-tree)"
          echo "Reviewed result tree: $result_tree"
          test "$result_tree" = ca8d587a8e0ebda810067e26ca04db740f879afa
          git diff --cached --check -- codex-rs/hepta-evidence codex-rs/hepta-agentd codex-rs/hepta-agent-protocol .github/workflows/kernel-evidence-ad-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message='fix(kernel.evidence): integrate reviewed trust, provenance, paging and publication repairs [kernel-evidence-closure] [kernel-evidence-status-sync]'
          commit="$(printf '%s\n\nSource delivery only. Exact reviewed tree; no qualification or external acceptance claim.\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>\n' "$message" | git commit-tree "$result_tree" -p "$EXPECTED_PARENT" -p "$followup")"
          remote="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote" = "$EXPECTED_PARENT"
          git push origin "$commit:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$commit"
          {
            echo '## Reviewed source delivered (not qualification)'
            echo "Commit: $commit"
            echo "Tree: $result_tree"
            echo 'Both source branches retained; no force push; main unchanged.'
            echo 'This one-shot transport workflow is absent from the delivered tree.'
          } >> "$GITHUB_STEP_SUMMARY"
