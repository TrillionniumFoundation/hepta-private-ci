name: single-main-maintenance
on:
  push:
    branches: [integration/single-main-20260922]
    paths: [.github/workflows/single-main-maintenance.yml]
permissions:
  contents: read
concurrency:
  group: single-main-maintenance
  cancel-in-progress: false
jobs:
  compiler-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Preserve only the public compiler distribution for offline integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compiler-tools"
          sysroot="$(rustc +1.95.0 --print sysroot)"
          rustc +1.95.0 --version --verbose > "$RUNNER_TEMP/compiler-tools/version.txt"
          tar -C "$sysroot" -czf "$RUNNER_TEMP/compiler-tools/rust-1.95.0-linux.tar.gz" bin lib libexec
          sha256sum "$RUNNER_TEMP/compiler-tools/rust-1.95.0-linux.tar.gz" > "$RUNNER_TEMP/compiler-tools/compiler.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: single-main-compiler-${{ github.run_id }}
          path: ${{ runner.temp }}/compiler-tools/
          compression-level: 0
          retention-days: 3
  focused-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a8f71be5d5eccd39090e054dc441e3e5f2a842a6
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest
      - name: Execute tests and strict Clippy against the unmodified exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foundation-rust'
          out.mkdir()
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert sha == 'a8f71be5d5eccd39090e054dc441e3e5f2a842a6'
          assert tree == '121cb9e5050c8d36e6130d178a38828b6d59bf57'
          packages = ['codex-hepta-operations', 'codex-hepta-wire', 'codex-hepta-context-compiler', 'codex-hepta-codex-adapter', 'codex-hepta-automation']
          selection = [value for package in packages for value in ['-p', package]]
          commands = [('focused-tests', ['just', 'test', *selection]), ('strict-clippy', ['cargo', 'clippy', '--manifest-path', 'codex-rs/Cargo.toml', '--tests', *selection, '--', '-D', 'warnings'])]
          results = []
          for name, command in commands:
              with (out / (name + '.log')).open('w') as log:
                  process = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, text=True)
              results.append({'name': name, 'command': command, 'exitCode': process.returncode})
              print(name, process.returncode)
          with (out / 'candidate-mutation.patch').open('w') as patch:
              subprocess.run(['git', 'diff', '--binary'], stdout=patch, text=True, check=True)
          clean = not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          receipt = {'candidateSha': sha, 'candidateTree': tree, 'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'results': results, 'worktreeRemainedClean': clean, 'allListedCommandsPassed': clean and all(r['exitCode'] == 0 for r in results), 'wholeRepositoryQualified': False, 'productQualified': False, 'remoteRefsMutated': False}
          (out / 'rust-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          raise SystemExit(0 if receipt['allListedCommandsPassed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-main-foundation-rust-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-rust/
          retention-days: 30
