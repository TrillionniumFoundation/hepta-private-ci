name: MemoryCell LoCoMo reader quality-cost no-promotion
on:
  push:
    branches: ["codex/memory-cell-evidence-20261008"]
    paths:
      - "scripts/memory_cell/locomo_reader_value_gate.py"
      - "scripts/memory_cell/test_locomo_reader_value_gate.py"
      - ".github/workflows/hepta-memory-locomo-reader-value.yml"
permissions:
  contents: read
concurrency:
  group: memorycell-locomo-reader-value-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-only-interpretation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts/memory_cell
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test fail-closed paired answer-quality and actual-token-cost receipts
        run: |
          set -euo pipefail
          mkdir -p /tmp/locomo-reader-value
          git rev-parse HEAD > /tmp/locomo-reader-value/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/locomo-reader-value/tested-tree.txt
          python3 -m compileall -q scripts/memory_cell/locomo_reader_value_gate.py scripts/memory_cell/test_locomo_reader_value_gate.py
          python3 -m unittest discover -s scripts/memory_cell -p 'test_locomo_reader_value_gate.py' -v 2>&1 | tee /tmp/locomo-reader-value/tests.log
      - name: Retain exact tested sources and all failure logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/locomo-reader-value/source
          cp scripts/memory_cell/locomo_reader_value_gate.py scripts/memory_cell/test_locomo_reader_value_gate.py /tmp/locomo-reader-value/source/
          cp .github/workflows/hepta-memory-locomo-reader-value.yml /tmp/locomo-reader-value/source/
          (cd /tmp/locomo-reader-value && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: locomo-reader-quality-cost-interpretation
          path: /tmp/locomo-reader-value
          if-no-files-found: error
