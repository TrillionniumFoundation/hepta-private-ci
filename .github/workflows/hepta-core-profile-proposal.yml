name: Selected Core qualification after the verified Ubuntu profile

on:
  pull_request:
    branches: [research/ndu-core-profile-checks-20261107]
    paths:
      - .github/scripts/hepta_bwrap_profile_contract.py
      - .github/scripts/hepta_bwrap_share_mode.py
      - .github/scripts/hepta_bwrap_share_checks.py
      - .github/scripts/apparmor-profiles_4.0.1really4.0.1-0ubuntu0.24.04.9_all.deb
      - .github/scripts/hepta-bwrap-profile-dependencies.json
      - .github/scripts/hepta_bwrap_profile_checks.py
      - .github/scripts/hepta_bwrap_profile.py
      - .github/scripts/hepta_bwrap_profile_evidence.py
      - .github/scripts/hepta_core_selected_guard.py
      - .github/scripts/hepta-core-selected-spec.json
      - .github/scripts/hepta_core_selected_contract.py
      - .github/scripts/hepta_core_selected_evidence.py
      - .github/scripts/hepta_core_selected.py
      - .github/scripts/hepta-core-selected-report.toml
      - .github/workflows/hepta-core-profile-proposal.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bwrap-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out the exact diagnostic proposal
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.10"

      - name: Bind the unchanged parent source and native host
        id: preflight
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/hepta_bwrap_profile.py preflight

      - name: Bind unchanged product source and native runner
        id: core_preflight
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/hepta_core_selected.py preflight

      - name: Install the original Rust toolchain
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: rustfmt

      - name: Install the original just and nextest versions
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install the original Linux sandbox prerequisites
        id: prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev bubblewrap
          fi
          command -v bwrap
          bwrap --version
          pkg-config --modversion libcap
          dpkg-query -W -f='${binary:Package}\t${Version}\n' build-essential pkg-config libcap-dev bubblewrap

      - name: Check the original scanner after setup
        id: ready
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
          PROBE_PRIVATE_DIR: ${{ steps.preflight.outputs.private_dir }}
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/hepta_bwrap_profile.py ready

      - name: Require scanner readiness after tool setup and before native execution
        id: core_ready
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
          PROBE_PRIVATE_DIR: ${{ steps.core_preflight.outputs.private_dir }}
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/hepta_core_selected.py ready

      - name: Verify official profile setup between two fixed namespace probes
        id: probe
        timeout-minutes: 20
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
          PROBE_PRIVATE_DIR: ${{ steps.preflight.outputs.private_dir }}
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/hepta_bwrap_profile.py probe

      - name: Gate the exact captured originals with the unchanged scanner
        id: collect
        if: always() && steps.preflight.outcome == 'success'
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
          PROBE_PRIVATE_DIR: ${{ steps.preflight.outputs.private_dir }}
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/hepta_bwrap_profile.py collect

      - name: Upload only original bytes accepted by the scanner
        id: upload
        if: always() && steps.collect.outcome == 'success' && steps.collect.outputs.safe_for_upload == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bwrap-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect.outputs.public_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Require complete prerequisite evidence before Core execution
        id: profile_gate
        if: always()
        env:
          PREFLIGHT_RESULT: ${{ steps.preflight.outcome }}
          PREREQUISITES_RESULT: ${{ steps.prerequisites.outcome }}
          READINESS_RESULT: ${{ steps.ready.outcome }}
          PROBE_RESULT: ${{ steps.probe.outcome }}
          COLLECTION_RESULT: ${{ steps.collect.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          EVIDENCE_RESULT: ${{ steps.collect.outputs.mechanism_evidence_complete }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$PREREQUISITES_RESULT" = success
          test "$READINESS_RESULT" = success
          test "$PROBE_RESULT" = success
          test "$COLLECTION_RESULT" = success
          test "$UPLOAD_RESULT" = success
          test "$EVIDENCE_RESULT" = true

      - name: Build and list seven exact cases, then run them through just
        id: core_native
        if: steps.profile_gate.outcome == 'success' && steps.core_ready.outcome == 'success'
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
          PROBE_PRIVATE_DIR: ${{ steps.core_preflight.outputs.private_dir }}
        run: python -B .github/scripts/hepta_core_selected.py run

      - name: Validate and gate the complete original evidence
        id: core_collect
        if: always() && steps.core_preflight.outcome == 'success'
        env:
          PROBE_RUNNER_CLASS: ${{ runner.environment }}
          PROBE_RUNNER_OS: ${{ runner.os }}
          PROBE_RUNNER_ARCH: ${{ runner.arch }}
          PROBE_PRIVATE_DIR: ${{ steps.core_preflight.outputs.private_dir }}
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/hepta_core_selected.py collect

      - name: Upload the gated source and native evidence
        id: core_upload
        if: always() && steps.core_collect.outcome == 'success' && steps.core_collect.outputs.safe_for_upload == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-selected-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.core_collect.outputs.public_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Require native execution and complete accepted evidence
        if: always()
        env:
          PROFILE_GATE_RESULT: ${{ steps.profile_gate.outcome }}
          PREFLIGHT_RESULT: ${{ steps.core_preflight.outcome }}
          PREREQUISITES_RESULT: ${{ steps.prerequisites.outcome }}
          READINESS_RESULT: ${{ steps.core_ready.outcome }}
          NATIVE_RESULT: ${{ steps.core_native.outcome }}
          COLLECTION_RESULT: ${{ steps.core_collect.outcome }}
          UPLOAD_RESULT: ${{ steps.core_upload.outcome }}
          VALIDATED_RESULT: ${{ steps.core_collect.outputs.validated }}
        run: |
          test "$PROFILE_GATE_RESULT" = success
          test "$PREFLIGHT_RESULT" = success
          test "$PREREQUISITES_RESULT" = success
          test "$READINESS_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$COLLECTION_RESULT" = success
          test "$UPLOAD_RESULT" = success
          test "$VALIDATED_RESULT" = true
