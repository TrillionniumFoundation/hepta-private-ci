name: Temporary learning artifacts source export

on:
  push:
    branches:
      - temp/learning-artifacts-source-export-20260925

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact work baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e89ee42be187464b08fbf352c0a1ff1be5b79fd8
          persist-credentials: false
          fetch-depth: 0

      - name: Export source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e89ee42be187464b08fbf352c0a1ff1be5b79fd8"
          tar --exclude=.git -czf "$RUNNER_TEMP/hepta-source-e89ee42.tar.gz" .
          sha256sum "$RUNNER_TEMP/hepta-source-e89ee42.tar.gz" > "$RUNNER_TEMP/hepta-source-e89ee42.tar.gz.sha256"

      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temp-hepta-source-e89ee42
          path: |
            ${{ runner.temp }}/hepta-source-e89ee42.tar.gz
            ${{ runner.temp }}/hepta-source-e89ee42.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
