name: runtime.fleet immutable candidate qualification
on:
  pull_request:
    paths:
      - 'codex-rs/hepta-fleet/**'
      - 'codex-rs/hepta-supervisor/**'
      - 'codex-rs/Cargo.lock'
      - 'codex-rs/Cargo.toml'
      - 'scripts/runtime_fleet_*.py'
      - 'scripts/test_runtime_fleet*.py'
      - 'docs/modules/runtime.fleet/**'
      - '.github/workflows/runtime-fleet-candidate.yml'
permissions:
  contents: read
concurrency:
  group: fleet-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'codex/runtime-fleet-durable-owner-v1-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [exact-source, synthetic-merge]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      LANE: ${{ matrix.lane }}
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct fixed candidate without source changes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          if [ "$LANE" = synthetic-merge ]; then
            export GIT_AUTHOR_NAME='Fleet qualification'
            export GIT_AUTHOR_EMAIL='fleet-qualification@invalid.example'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            git -c user.name="$GIT_AUTHOR_NAME" -c user.email="$GIT_AUTHOR_EMAIL" merge --no-ff --no-commit "$BASE_SHA"
            TREE=$(git write-tree)
            COMMIT=$(printf '%s\n' 'runtime.fleet deterministic source/base qualification' | git commit-tree "$TREE" -p "$SOURCE_SHA" -p "$BASE_SHA")
            git checkout --detach "$COMMIT"
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install repository-pinned Rust toolchain
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Execute every required command and produce exact-tree receipt
        run: python3 scripts/runtime_fleet_qualify.py --source "$SOURCE_SHA" --base "$BASE_SHA" --lane "$LANE" --output "$RUNNER_TEMP/fleet-$LANE"
      - name: Upload receipt, command logs and digest manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-${{ github.event.pull_request.head.sha }}-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet-${{ matrix.lane }}
          if-no-files-found: error
