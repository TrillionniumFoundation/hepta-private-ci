name: NDU Python format probe
on:
  pull_request:
    branches:
      - fix/ndu-fast-feedback-discovery-import-20261107-gpt6
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Apply the repository-pinned formatter to the exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          uv run --frozen --project scripts ruff --version
          uv run --frozen --project scripts ruff format scripts .github
          git diff --check
          python - <<'PY'
          import base64, json, os, subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only", "-z"]).split(b"\0")
          files = {}
          for raw in paths:
              if not raw:
                  continue
              path = os.fsdecode(raw)
              if not (path.startswith("scripts/") or path.startswith(".github/")):
                  raise SystemExit("unexpected formatter path: " + path)
              with open(path, "rb") as stream:
                  files[path] = base64.b64encode(stream.read()).decode("ascii")
          payload = {"head": os.environ["EXPECTED_HEAD_SHA"], "files": files}
          print("BEGIN_FORMAT_PAYLOAD")
          print(json.dumps(payload, sort_keys=True, separators=(",", ":")))
          print("END_FORMAT_PAYLOAD")
          PY
