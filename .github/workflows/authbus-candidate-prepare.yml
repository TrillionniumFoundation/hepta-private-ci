name: AuthBus scoped source preparation and qualification

on:
  push:
    branches: [codex/authbus-final-hardening-20260928]
    paths:
      - .github/workflows/authbus-candidate-prepare.yml
      - scripts/prepare-authbus-candidate.py
      - scripts/authbus-preflight-repair.py
      - scripts/finalize-authbus-candidate.py
      - docs/modules/auth.authbus/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authbus-scoped-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/authbus-final-hardening-20260928'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source: ${{ steps.publish.outputs.source }}
      base: ${{ steps.publish.outputs.base }}
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply audited source changes
        run: |
          set -euo pipefail
          python3 scripts/prepare-authbus-candidate.py
      - name: Install pinned formatter
        run: |
          set -euo pipefail
          TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Format tracked and newly created scoped sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          roots = ('codex-rs/hepta-authbus/', 'codex-rs/hepta-authbus-p1-3-qualification/')
          exact = {'codex-rs/hepta-evidence/src/lib.rs', 'codex-rs/hepta-evidence/src/qualification_tests.rs', 'codex-rs/hepta-agentd/tests/kernel_evidence_product.rs', 'codex-rs/hepta-agentd/src/evidence_trust.rs', 'codex-rs/hepta-bao-adapter/src/https_consumer_tests.rs'}
          prefixes = ('codex-rs/hepta-evidence/src/authbus_', 'codex-rs/hepta-agentd/src/authbus_', 'codex-rs/hepta-bao-adapter/src/https_consumer')
          names = subprocess.check_output(['git', 'ls-files', '--cached', '--others', '--exclude-standard', '-z', '--', 'codex-rs']).decode().split('\0')
          for path in sorted(set(names)):
              if path.endswith('.rs') and pathlib.Path(path).is_file() and (path.startswith(roots + prefixes) or path in exact):
                  subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', str(pathlib.Path(path).resolve())], cwd='codex-rs', check=True)
          PY
          python3 scripts/check-authbus-closed-world.py --write
          python3 scripts/check-authbus-closed-world.py --check
          python3 scripts/generate-authbus-implementation-map.py --write
          python3 scripts/generate-authbus-implementation-map.py --check
          python3 scripts/test-authbus-exact-head-evidence.py
          python3 scripts/test-authbus-operations.py
      - name: Push complete scoped source without rebase or force
        id: publish
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          allowed = ('codex-rs/hepta-authbus/', 'codex-rs/hepta-authbus-p1-3-qualification/', 'codex-rs/hepta-evidence/src/authbus_', 'codex-rs/hepta-agentd/src/authbus_', 'codex-rs/hepta-bao-adapter/src/https_consumer', 'docs/modules/auth.authbus/')
          exact = {'codex-rs/Cargo.lock', 'codex-rs/hepta-evidence/src/lib.rs', 'codex-rs/hepta-evidence/src/qualification_tests.rs', 'codex-rs/hepta-agentd/tests/kernel_evidence_product.rs', 'codex-rs/hepta-agentd/src/evidence_trust.rs', 'scripts/authbus-exact-head-evidence.py', 'scripts/test-authbus-exact-head-evidence.py', 'scripts/check-authbus-closed-world.py', 'scripts/generate-authbus-implementation-map.py'}
          def names(*args):
              return {p for p in subprocess.check_output(['git', *args, '-z']).decode().split('\0') if p}
          paths = sorted(names('diff', '--name-only') | names('diff', '--cached', '--name-only') | names('ls-files', '--others', '--exclude-standard'))
          bad = [p for p in paths if (p not in exact and not p.startswith(allowed)) or pathlib.Path(p).is_symlink()]
          if bad:
              raise SystemExit('Refusing out-of-scope or symbolic-link changes: '+repr(bad))
          if paths:
              subprocess.run(['git', 'add', '--all', '--', *paths], check=True)
          PY
          git config user.name 'hepta-authbus-remediation-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -s -m 'fix(authbus): materialize complete sealed authority source and native contracts'
          fi
          test -z "$(git status --porcelain)"
          REMOTE=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF"
          git fetch --no-tags origin main
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
      - name: Retain source, patch and identity on every outcome
        if: always()
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/authbus-prepared"
          mkdir -p "$DEST"
          git diff "$GITHUB_SHA" --binary > "$DEST/prepared.patch"
          git rev-parse HEAD > "$DEST/head.txt"
          git status --porcelain=v1 > "$DEST/status.txt"
          git ls-files --cached --others --exclude-standard -z -- codex-rs scripts docs/modules/auth.authbus .github/workflows > "$DEST/source-paths.nul"
          python3 - "$DEST" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tarfile
          dest = pathlib.Path(sys.argv[1])
          paths = sorted(set(p for p in (dest/'source-paths.nul').read_bytes().split(b'\0') if p))
          manifest = {'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'input_sha': os.environ['GITHUB_SHA'], 'checkout_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'clean_tree': not subprocess.check_output(['git','status','--porcelain']), 'files': {}}
          with tarfile.open(dest/'candidate-source.tar.gz', 'w:gz') as bundle:
              for raw in paths:
                  path = pathlib.Path(os.fsdecode(raw))
                  if not path.is_file() or path.is_symlink():
                      continue
                  manifest['files'][str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()
                  bundle.add(path, arcname=str(path), recursive=False)
          manifest['bundle_sha256'] = hashlib.sha256((dest/'candidate-source.tar.gz').read_bytes()).hexdigest()
          (dest/'source-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authbus-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/authbus-prepared
          if-no-files-found: error
          retention-days: 14

  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [source-head, synthetic-merge]
    env:
      PYTHONDONTWRITEBYTECODE: 1
      SOURCE: ${{ needs.prepare.outputs.source }}
      BASE: ${{ needs.prepare.outputs.base }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble the exact candidate using the common frozen base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git cat-file -e "$BASE^{commit}"
          git config user.name 'authbus-qualification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$MODE" = 'synthetic-merge' ]; then
            git checkout --detach "$BASE"
            git merge --no-ff --no-commit "$SOURCE"
            TREE=$(git write-tree)
            COMMIT=$(printf 'AuthBus fixed source/base qualification\n' | git commit-tree "$TREE" -p "$BASE" -p "$SOURCE")
            git reset --hard "$COMMIT"
          fi
      - name: Install pinned native toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: authbus-cargo-dependencies-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Execute all exact-candidate native gates
        run: |
          python3 scripts/authbus-exact-head-evidence.py \
            --output "$RUNNER_TEMP/authbus-evidence/receipt.json" \
            --mode "$MODE" --source-head "$SOURCE" --base-sha "$BASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authbus-native-${{ matrix.mode }}-${{ needs.prepare.outputs.source }}
          path: ${{ runner.temp }}/authbus-evidence
          if-no-files-found: error

  qualified:
    if: always()
    needs: [prepare, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require preparation and both actual native candidates to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$NATIVE_RESULT" = success
