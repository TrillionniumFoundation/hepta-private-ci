name: HIA Windows original Matrix cipher targets

on:
  push:
    branches:
      - codex/hia-matrix-cipher-codegen-20261127-2ac5
    paths:
      - codex-rs/Cargo.toml
      - MODULE.bazel
      - MODULE.bazel.lock
      - .github/workflows/hia-windows-matrix-cipher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-matrix-cipher:
    name: Two complete original Windows Matrix cipher targets
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test
      - name: Run every original SDK unit and storage upgrade test
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --platforms=//:windows_x86_64_msvc \
            --nocache_test_results \
            --test_verbose_timeout_warnings \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            //codex-rs/hepta-matrix-sdk:hepta-matrix-sdk-unit-tests \
            //codex-rs/hepta-matrix-sdk:hepta-matrix-sdk-storage_upgrade-test 2>&1 | tee "$RUNNER_TEMP/windows-matrix-cipher.log"
          if grep -Eq 'FLAKY|test result: FAILED|Attempt #([2-9][0-9]*|1[0-9]+)' "$RUNNER_TEMP/windows-matrix-cipher.log"; then
            echo "::error::Original target had a failed or retried attempt."
            exit 1
          fi
          grep -Eq '^//codex-rs/hepta-matrix-sdk:hepta-matrix-sdk-unit-tests[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-matrix-cipher.log"
          grep -Eq '^//codex-rs/hepta-matrix-sdk:hepta-matrix-sdk-storage_upgrade-test[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-matrix-cipher.log"
          echo "Two original Windows Matrix targets: PASS, retries=0, flaky=0; full matrix remains independent."
      - name: Preserve original execution evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-original-matrix-cipher-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bazel-execution-logs
            ${{ runner.temp }}/windows-matrix-cipher.log
          if-no-files-found: error
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
