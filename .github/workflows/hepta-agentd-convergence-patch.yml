name: Apply runtime.agentd lifecycle convergence patch

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/hepta-agentd-convergence-patch.yml

permissions:
  contents: write

concurrency:
  group: hepta-agentd-convergence-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply deterministic lifecycle and qualification fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def block(*lines: str) -> str:
              return "\n".join(lines) + "\n"

          def replace_one(path: str, label: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              print(f"{label}: matches={count}")
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          lane = "codex-rs/hepta-agentd/src/lane_b_runtime.rs"
          replace_one(
              lane,
              "cancel prelude",
              block(
                  "        require_revision(record, expected_revision)?;",
                  "        let expired = expire_record(record, now_ms)?;",
                  "        if expired {",
                  "            let disposition = match record.phase {",
                  "                RunPhase::Cancelled => CancellationDisposition::AlreadyTerminal,",
                  "                RunPhase::Cancelling => CancellationDisposition::CancellingAfterDispatch,",
                  "                _ => return Err(AgentRunError::InvalidTransition),",
                  "            };",
                  "            return Ok((disposition, receipt(record, /*idempotent*/ false)));",
                  "        }",
              ),
              block(
                  "        let prior_ack_revision = expected_revision",
                  "            .checked_add(1)",
                  "            .is_some_and(|revision| revision == record.revision);",
                  "        if prior_ack_revision",
                  "            && matches!(",
                  "                record.phase,",
                  "                RunPhase::Cancelled | RunPhase::Cancelling | RunPhase::Indeterminate",
                  "            )",
                  "        {",
                  "            if record.cancel_reason.as_deref() != Some(reason) {",
                  "                return Err(AgentRunError::Conflict);",
                  "            }",
                  "            let expired = expire_record(record, now_ms)?;",
                  "            let disposition = match record.phase {",
                  "                RunPhase::Cancelled => CancellationDisposition::AlreadyTerminal,",
                  "                RunPhase::Cancelling | RunPhase::Indeterminate => {",
                  "                    CancellationDisposition::CancellingAfterDispatch",
                  "                }",
                  "                _ => return Err(AgentRunError::InvalidTransition),",
                  "            };",
                  "            return Ok((disposition, receipt(record, /*idempotent*/ !expired)));",
                  "        }",
                  "        require_revision(record, expected_revision)?;",
                  "        if matches!(record.phase, RunPhase::Cancelling | RunPhase::Indeterminate)",
                  "            && record.cancel_reason.as_deref() != Some(reason)",
                  "        {",
                  "            return Err(AgentRunError::Conflict);",
                  "        }",
                  "        let expired = expire_record(record, now_ms)?;",
                  "        if expired {",
                  "            let disposition = match record.phase {",
                  "                RunPhase::Cancelled => CancellationDisposition::AlreadyTerminal,",
                  "                RunPhase::Cancelling | RunPhase::Indeterminate => {",
                  "                    CancellationDisposition::CancellingAfterDispatch",
                  "                }",
                  "                _ => return Err(AgentRunError::InvalidTransition),",
                  "            };",
                  "            return Ok((disposition, receipt(record, /*idempotent*/ false)));",
                  "        }",
              ),
          )
          replace_one(
              lane,
              "indeterminate replay",
              block(
                  "            RunPhase::Indeterminate => return Err(AgentRunError::TerminalObservationRequired),",
              ),
              block(
                  "            RunPhase::Indeterminate => {",
                  "                return Ok((",
                  "                    CancellationDisposition::CancellingAfterDispatch,",
                  "                    receipt(record, /*idempotent*/ true),",
                  "                ));",
                  "            }",
              ),
          )

          tests = "codex-rs/hepta-agentd/src/lane_b_runtime_tests.rs"
          marker = block(
              "#[test]",
              "fn operation_identity_is_idempotent_only_for_equal_semantics() {",
          )
          regression = block(
              "#[test]",
              "fn cancellation_ack_loss_replays_current_receipt_without_hidden_mutation() {",
              "    let mut before = AgentRunCoordinator::compose_runtime(composition()).expect(\"compose\");",
              "    before.start_run(100, snapshot()).expect(\"admit\");",
              "    let cancelled = before",
              "        .cancel_run(200, \"run.1\", 1, \"operator_request\")",
              "        .expect(\"cancel before dispatch\");",
              "    let replayed = before",
              "        .cancel_run(201, \"run.1\", 1, \"operator_request\")",
              "        .expect(\"replay lost pre-dispatch acknowledgement\");",
              "    assert_eq!(replayed.0, CancellationDisposition::AlreadyTerminal);",
              "    assert!(replayed.1.idempotent);",
              "    assert_eq!(replayed.1.revision, cancelled.1.revision);",
              "    assert_eq!(replayed.1.phase, RunPhase::Cancelled);",
              "",
              "    let mut after = AgentRunCoordinator::compose_runtime(composition()).expect(\"compose\");",
              "    after.start_run(100, snapshot()).expect(\"admit\");",
              "    after.attach_context(200, 1, attachment()).expect(\"attach\");",
              "    after.mark_dispatched(300, \"run.1\", 2).expect(\"dispatch\");",
              "    let cancelling = after",
              "        .cancel_run(400, \"run.1\", 3, \"operator_request\")",
              "        .expect(\"cancel after dispatch\");",
              "    let replayed = after",
              "        .cancel_run(450, \"run.1\", 3, \"operator_request\")",
              "        .expect(\"replay lost post-dispatch acknowledgement\");",
              "    assert!(replayed.1.idempotent);",
              "    assert_eq!(replayed.1.revision, cancelling.1.revision);",
              "    assert_eq!(replayed.1.phase, RunPhase::Cancelling);",
              "",
              "    let timed_out = after",
              "        .cancel_run(3_400, \"run.1\", 4, \"operator_request\")",
              "        .expect(\"advance cancellation acknowledgement timeout\");",
              "    assert_eq!(timed_out.0, CancellationDisposition::CancellingAfterDispatch);",
              "    assert!(!timed_out.1.idempotent);",
              "    assert_eq!(timed_out.1.phase, RunPhase::Indeterminate);",
              "    assert_eq!(timed_out.1.revision, 5);",
              "    assert_eq!(timed_out.1.cancel_ack_deadline_ms, None);",
              "",
              "    let replayed = after",
              "        .cancel_run(3_401, \"run.1\", 4, \"operator_request\")",
              "        .expect(\"replay lost timeout acknowledgement\");",
              "    assert!(replayed.1.idempotent);",
              "    assert_eq!(replayed.1.phase, RunPhase::Indeterminate);",
              "    assert_eq!(replayed.1.revision, 5);",
              "    assert_eq!(",
              "        after.cancel_run(3_402, \"run.1\", 5, \"different_reason\"),",
              "        Err(AgentRunError::Conflict)",
              "    );",
              "}",
              "",
          )
          replace_one(tests, "cancellation regression", marker, regression + marker)

          native_tests = "codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs"
          replace_one(
              native_tests,
              "physical turn-start source assertion",
              block(
                  "    let turn_start = source",
                  "        .find(\"client.request_typed::<TurnStartResponse>(ClientRequest::TurnStart\")",
                  "        .expect(\"physical turn start\");",
              ),
              block(
                  "    let turn_start = source",
                  "        .find(\"send_authorized_turn_start(&mut client, entered_use, turn_params)\")",
                  "        .expect(\"physical turn start\");",
              ),
          )

          support = "codex-rs/hepta-agentd/src/test_support.rs"
          replace_one(
              support,
              "test App Server executable",
              block(
                  "        let app_server_task = tokio::spawn(run_app_server(",
                  "            identity.clone(),",
                  "            Arg0DispatchPaths::default(),",
                  "            CognitiveRuntime::Available(Arc::clone(&store)),",
              ),
              block(
                  "        let arg0_paths = Arg0DispatchPaths {",
                  "            codex_self_exe: Some(std::env::current_exe()?),",
                  "            ..Arg0DispatchPaths::default()",
                  "        };",
                  "        let app_server_task = tokio::spawn(run_app_server(",
                  "            identity.clone(),",
                  "            arg0_paths,",
                  "            CognitiveRuntime::Available(Arc::clone(&store)),",
              ),
          )
          PY

      - name: Format and test exact lifecycle boundaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-agentd --package codex-hepta-infer-worker-host -- --check
          cargo test --locked -p codex-hepta-agentd --lib \
            lane_b_runtime::tests::cancellation_ack_loss_replays_current_receipt_without_hidden_mutation \
            -- --exact --nocapture
          cargo test --locked -p codex-hepta-infer-worker-host --lib \
            native_app_server::tests::cognitive_final_use_revalidation_follows_durable_dispatch_and_precedes_turn_start \
            -- --exact --nocapture
          cargo test --locked -p codex-hepta-infer-worker-host --lib \
            native_app_server::tests::real_agentd_worker_accepts_fresh_context_and_rejects_final_use_tombstone \
            -- --exact --nocapture
          cargo clippy --locked -p codex-hepta-agentd -p codex-hepta-infer-worker-host \
            --no-deps --all-targets -- -D warnings

      - name: Commit tested patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-agentd-convergence-patch.yml
          git diff --check
          git config user.name "Hepta Agentd CI"
          git config user.email "hepta-agentd-ci@users.noreply.github.com"
          git add \
            codex-rs/hepta-agentd/src/lane_b_runtime.rs \
            codex-rs/hepta-agentd/src/lane_b_runtime_tests.rs \
            codex-rs/hepta-agentd/src/test_support.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs \
            .github/workflows/hepta-agentd-convergence-patch.yml
          git commit -m "runtime.agentd: close cancellation and process qualification gaps"
          git fetch origin work/product-convergence-20260923
          git rebase origin/work/product-convergence-20260923
          git push origin HEAD:work/product-convergence-20260923
