name: Hepta global blocker convergence controller r2

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/hepta-global-gap-closure-controller-r2.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: hepta-global-gap-closure-controller-r2
  cancel-in-progress: false

jobs:
  converge-r2:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HEPTA_CONVERGENCE_TARGET: integration/hepta-global-gap-closure-20260910-r2
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out exact controller source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Select the newest admissible convergence base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          for ref in \
            origin/ops/hepta-final-convergence-review-anchor-20260909 \
            origin/codex/hepta-native-source-closed-world-20260909 \
            origin/integration/vnext-main-20260811
          do
            if git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null; then
              echo "HEPTA_CONVERGENCE_BASE=${ref}" >> "${GITHUB_ENV}"
              exit 0
            fi
          done
          echo 'no admissible convergence base exists' >&2
          exit 1

      - name: Harden the exact convergence executor
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/hepta-global-gap-closure.py "${RUNNER_TEMP}/hepta-global-gap-closure-r2.py"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('${{ runner.temp }}/hepta-global-gap-closure-r2.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def write_json(path: Path, value: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          '''
          replacement = anchor + '''\n\ndef extract_json_object(output: str) -> dict[str, Any]:
              decoder = json.JSONDecoder()
              for index, character in enumerate(output):
                  if character != "{":
                      continue
                  try:
                      value, _ = decoder.raw_decode(output[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, dict):
                      return value
              raise json.JSONDecodeError("no JSON object in command output", output, 0)
          '''
          if anchor not in text:
              raise SystemExit('write_json anchor drifted')
          text = text.replace(anchor, replacement, 1)
          text = text.replace('return json.loads(result.output), result', 'return extract_json_object(result.output), result')
          text = text.replace('metadata = json.loads(metadata_result.output)', 'metadata = extract_json_object(metadata_result.output)')
          old = '''    package_receipts = run_package_gates(packages)

              repository_passed = (
          '''
          new = '''    package_receipts = run_package_gates(packages)
              if not all_receipts_pass(package_receipts):
                  repair_receipts: list[dict[str, Any]] = []
                  for package in packages:
                      repair = run(
                          (
                              "cargo", "clippy", "--fix", "--allow-dirty", "--allow-staged",
                              "--manifest-path", "codex-rs/Cargo.toml", "--locked", "-p", package,
                              "--all-targets", "--no-deps", "--", "-D", "warnings",
                          ),
                          check=False,
                          timeout=5400,
                      )
                      repair_receipts.append({"package": package, **repair.receipt()})
                  run(("cargo", "fmt", "--manifest-path", "codex-rs/Cargo.toml", "--all"), check=False)
                  repair_native_binding_hashes()
                  commit_if_dirty("fix: apply deterministic convergence lint repairs")
                  verifier_receipts = run_repository_verifiers()
                  package_receipts = run_package_gates(packages)
              else:
                  repair_receipts = []

              repository_passed = (
          '''
          if old not in text:
              raise SystemExit('package gate anchor drifted')
          text = text.replace(old, new, 1)
          text = text.replace('"packageGateReceipts": package_receipts,', '"mechanicalRepairReceipts": repair_receipts,\n        "packageGateReceipts": package_receipts,')
          old_receipt = '''    receipt_commit = commit_if_dirty(
                  "docs: bind global convergence validation and external-gate handoff"
              )
              status["receiptCommit"] = receipt_commit
              write_json(OUT / "STATUS.json", status)
              # Amend only the receipt commit so STATUS binds its exact final identity.
              git("add", str((OUT / "STATUS.json").relative_to(ROOT)))
              git("commit", "--amend", "--no-edit")
              final_commit = git_text("rev-parse", "HEAD")
          '''
          new_receipt = '''    status["validatedSourceCommit"] = source_commit
              write_json(OUT / "STATUS.json", status)
              final_commit = commit_if_dirty(
                  "docs: bind global convergence validation and external-gate handoff"
              )
          '''
          if old_receipt not in text:
              raise SystemExit('receipt anchor drifted')
          text = text.replace(old_receipt, new_receipt, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile "${RUNNER_TEMP}/hepta-global-gap-closure-r2.py"

      - name: Materialize, repair and qualify the r2 candidate
        id: converge
        shell: bash
        run: |
          set +e
          python3 "${RUNNER_TEMP}/hepta-global-gap-closure-r2.py"
          rc=$?
          set -e
          echo "return_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit "${rc}"

      - name: Upload convergence receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-global-gap-closure-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/global-gap-closure
          if-no-files-found: warn
          retention-days: 7
