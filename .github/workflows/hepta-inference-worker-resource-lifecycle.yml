name: Inference worker resource lifecycle qualification

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/apply_inference_worker_resource_lifecycle_20260925.py
      - .github/workflows/hepta-inference-worker-resource-lifecycle.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Apply resource lifecycle repair
        run: python3 scripts/apply_inference_worker_resource_lifecycle_20260925.py

      - name: Format worker package
        working-directory: codex-rs
        run: |
          cargo fmt -p codex-hepta-infer-worker-host
          cargo fmt -p codex-hepta-infer-worker-host -- --check

      - name: Run worker resource lifecycle regressions
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-worker-host --lib model_worker::tests:: -- --nocapture

      - name: Check generated patch
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git diff -- codex-rs/hepta-infer-worker-host/src/model_worker.rs codex-rs/hepta-infer-worker-host/src/model_worker_tests.rs)"
