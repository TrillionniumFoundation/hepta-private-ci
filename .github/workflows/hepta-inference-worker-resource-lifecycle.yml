name: Inference worker resource lifecycle qualification

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/apply_inference_worker_resource_lifecycle_20260925.py
      - .github/workflows/hepta-inference-worker-resource-lifecycle.yml

permissions:
  contents: read

concurrency:
  group: inference-worker-resource-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply resource lifecycle repair
        run: python3 scripts/apply_inference_worker_resource_lifecycle_20260925.py

      - name: Format worker package
        working-directory: codex-rs
        run: |
          cargo fmt -p codex-hepta-infer-worker-host
          cargo fmt -p codex-hepta-infer-worker-host -- --check

      - name: Run worker library regressions
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-infer-worker-host --lib model_worker::tests:: -- --nocapture

      - name: Run strict worker lint
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-infer-worker-host --lib --tests -- -D warnings

      - name: Capture exact tested source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/inference-worker-resource-lifecycle"
          mkdir -p "$out/codex-rs/hepta-infer-worker-host/src"
          cp codex-rs/hepta-infer-worker-host/src/model_worker.rs "$out/codex-rs/hepta-infer-worker-host/src/"
          cp codex-rs/hepta-infer-worker-host/src/model_worker_tests.rs "$out/codex-rs/hepta-infer-worker-host/src/"
          git diff --binary -- codex-rs/hepta-infer-worker-host/src/model_worker.rs codex-rs/hepta-infer-worker-host/src/model_worker_tests.rs > "$out/tested.patch"
          git rev-parse HEAD HEAD^{tree} > "$out/source.txt"
          git diff --check

      - name: Upload exact tested source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inference-worker-resource-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/inference-worker-resource-lifecycle/
          retention-days: 7
          if-no-files-found: error
