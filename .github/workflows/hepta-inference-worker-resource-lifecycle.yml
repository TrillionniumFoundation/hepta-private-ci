name: Inference worker resource lifecycle qualification

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/apply_inference_worker_resource_lifecycle_20260925.py
      - .github/workflows/hepta-inference-worker-resource-lifecycle.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Apply resource lifecycle repair
        run: python3 scripts/apply_inference_worker_resource_lifecycle_20260925.py

      - name: Check generated patch
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git diff -- codex-rs/hepta-infer-worker-host/src/model_worker.rs codex-rs/hepta-infer-worker-host/src/model_worker_tests.rs)"
