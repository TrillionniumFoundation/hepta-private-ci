name: Hepta Global Ruff P0 Source Gate

on:
  pull_request:
    paths:
      - '.github/scripts/test_run_bazel_ci.py'
      - '.github/workflows/hepta-global-ruff-p0.yml'
      - 'scripts/pyproject.toml'
      - 'scripts/uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-ruff-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Enforce exact global repository Python formatting
        run: uv run --frozen --project scripts ruff format --check scripts .github
