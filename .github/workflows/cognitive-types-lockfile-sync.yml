name: cognitive-types-lockfile-sync

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: cognitive-types-lockfile-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/cognitive-types-production-hardening-20260926'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out writable branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Resolve and commit only the workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 >/dev/null
          if git diff --quiet -- codex-rs/Cargo.lock; then
            echo 'Cargo.lock already synchronized'
          else
            git diff --check -- codex-rs/Cargo.lock
          fi
          rm -f .github/workflows/cognitive-types-lockfile-sync.yml
          unexpected="$(git status --short | grep -vE '^( M|M | D|D ) (codex-rs/Cargo.lock|.github/workflows/cognitive-types-lockfile-sync.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'unexpected files changed during lockfile synchronization:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name 'hepta-ci'
          git config user.email 'hepta-ci@users.noreply.github.com'
          git add codex-rs/Cargo.lock .github/workflows/cognitive-types-lockfile-sync.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(cognitive.types): synchronize Cargo.lock'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
