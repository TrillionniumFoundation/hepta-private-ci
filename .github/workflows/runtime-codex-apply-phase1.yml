name: Apply runtime.codex phase-1 closure

on:
  push:
    branches:
      - codex/runtime-codex-production-closure-v1
    paths:
      - .github/workflows/runtime-codex-apply-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply, format, and commit phase-1 closure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/runtime-codex-production-closure-v1
          fetch-depth: 1

      - name: Install locked Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Decode and apply atomic source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/runtime-codex-phase1.patch.gz.b64" <<'PATCH_B64'

PATCH_B64
          base64 --decode "$RUNNER_TEMP/runtime-codex-phase1.patch.gz.b64" \
            | gzip --decompress > "$RUNNER_TEMP/runtime-codex-phase1.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/runtime-codex-phase1.patch"

      - name: Format exact source changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git add -A
          git diff --cached --check

      - name: Commit the atomic closure change
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime-codex-apply-phase1.yml
          git config user.name "runtime-codex-closure-bot"
          git config user.email "runtime-codex-closure-bot@users.noreply.github.com"
          git commit -m "runtime.codex: bind exact pre-effect compensation across owners"
          git push origin HEAD:codex/runtime-codex-production-closure-v1
