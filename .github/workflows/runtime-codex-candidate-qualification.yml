name: runtime.codex candidate qualification

on:
  push:
    branches:
      - codex/runtime-codex-final-candidate-*
    paths:
      - codex-rs/hepta-agent-protocol/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-codex-adapter/**
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - codex-rs/core/src/tools/spec_plan.rs
      - docs/modules/runtime.codex/**
      - qualification/runtime-codex/**
      - scripts/runtime-codex-candidate-qualification.sh
      - scripts/runtime-codex-qualification.py
      - .github/workflows/runtime-codex-candidate-qualification.yml
      - .github/workflows/runtime-codex-qualification.yml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: runtime-codex-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUNTIME_CODEX_BASE_REF: main

jobs:
  exact-head:
    name: runtime.codex candidate exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Qualify exact candidate
        run: bash scripts/runtime-codex-candidate-qualification.sh exact-head
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-codex-candidate-exact-head-${{ github.run_id }}
          path: qualification/runtime-codex/
          if-no-files-found: error
          retention-days: 30
      - name: Attest exact-head receipt
        if: always()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: qualification/runtime-codex/receipt/runtime-codex-qualification-receipt.json

  synthetic-merge:
    name: runtime.codex candidate synthetic-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Qualify deterministic current-main merge
        run: bash scripts/runtime-codex-candidate-qualification.sh synthetic-merge
      - name: Upload synthetic-merge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-codex-candidate-synthetic-merge-${{ github.run_id }}
          path: qualification/runtime-codex/
          if-no-files-found: error
          retention-days: 30
      - name: Attest synthetic-merge receipt
        if: always()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: qualification/runtime-codex/receipt/runtime-codex-qualification-receipt.json

  required:
    name: runtime.codex candidate required
    if: always()
    needs:
      - exact-head
      - synthetic-merge
    runs-on: ubuntu-24.04
    steps:
      - name: Verify candidate jobs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.exact-head.result }}" = success
          test "${{ needs.synthetic-merge.result }}" = success
