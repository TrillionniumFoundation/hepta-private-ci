name: AuthBus target-host qualification

on:
  push:
    branches:
      - auth-authbus-boundary-convergence-20260928
    paths:
      - .github/workflows/authbus-target-host-qualification.yml

permissions:
  contents: write

concurrency:
  group: authbus-target-host-authoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-format:
    name: Materialize AuthBus canonical format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path codex-rs/Cargo.toml
          git add -- codex-rs/hepta-authbus
          if git diff --cached --quiet; then
            echo 'AuthBus source is already formatted.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'style(auth.authbus): apply canonical formatting'
          git push origin HEAD:${{ github.ref_name }}
