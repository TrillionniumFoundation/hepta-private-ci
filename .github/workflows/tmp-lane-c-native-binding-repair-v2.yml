name: tmp-lane-c-native-binding-repair-v2

on:
  push:
    branches:
      - codex/lane-c-full-gap-closure-20260910
    paths:
      - .github/workflows/tmp-lane-c-native-binding-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Recompute, commit, validate and publish exact bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          path = root / "qualification/module-execution-dossiers/NATIVE_BINDINGS.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          observations = data.get("observations")
          if not isinstance(observations, list) or len(observations) != 40:
              raise SystemExit("native-binding closed world is not exactly 40 observations")

          seen: set[str] = set()
          changed = 0
          for row in observations:
              module = row.get("module")
              source_path = row.get("path")
              if not isinstance(module, str) or module in seen:
                  raise SystemExit(f"invalid or duplicate module: {module!r}")
              seen.add(module)
              if not isinstance(source_path, str):
                  raise SystemExit(f"missing source path for {module}")
              source = root / source_path
              if not source.is_file():
                  raise SystemExit(f"missing bound source for {module}: {source_path}")
              payload = source.read_bytes()
              actual = hashlib.sha1(
                  f"blob {len(payload)}\0".encode("ascii") + payload,
                  usedforsecurity=False,
              ).hexdigest()
              if row.get("blobSha") != actual:
                  row["blobSha"] = actual
                  changed += 1

          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"changedBindings": changed, "modules": len(seen)}, sort_keys=True))
          PY

          rm -f \
            .github/workflows/tmp-lane-c-native-binding-repair.yml \
            .github/workflows/tmp-lane-c-native-binding-repair-v2.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/module-execution-dossiers/NATIVE_BINDINGS.json \
            .github/workflows/tmp-lane-c-native-binding-repair.yml \
            .github/workflows/tmp-lane-c-native-binding-repair-v2.yml
          git diff --cached --check
          git commit -m 'chore(lane-c): refresh exact native source bindings'
          test -z "$(git status --porcelain)"

          python3 qualification/module-execution-dossiers/implementation_contracts.py verify-repository
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          python3 scripts/hepta-implementation-dossiers.py generate-status --check
          python3 scripts/hepta-implementation-dossiers.py verify
          git diff --check
          test -z "$(git status --porcelain)"

          git push origin "HEAD:${GITHUB_REF_NAME}"
