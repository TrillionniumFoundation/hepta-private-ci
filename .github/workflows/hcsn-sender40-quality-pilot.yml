name: HCSN sender40 single CPU pilot 20261127

"on":
  push:
    branches: [research/hcsn-sender40-pilot-20261127]
    paths:
      - qualification/hcsn_sender40_pilot_20261127/**
      - .github/workflows/hcsn-sender40-quality-pilot.yml

permissions:
  contents: read

concurrency:
  group: hcsn-sender40-pilot-20261127-once
  cancel-in-progress: false

jobs:
  frozen-pilot:
    if: github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            qualification/hcsn_sender40_pilot_20261127
            .github/workflows/hcsn-sender40-quality-pilot.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.3'
      - name: Verify one bounded public-only source commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          base = 'cf5aa0c954e92fbecd3a53494ccefaa37a2bb7d0'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != base:
              raise SystemExit('This one-shot lane requires exactly the reviewed public base parent.')
          changes = subprocess.check_output(['git', 'diff', '--name-status', base, 'HEAD'], text=True).splitlines()
          names = ['PROTOCOL.json', 'README.md', 'public_inputs.json', 'prepare_public.py', 'static_support.py',
                   'model_adapter.py', 'candidates.py', 'pilot.py', 'supervise.py', 'offline_controls.py']
          allowed = {'qualification/hcsn_sender40_pilot_20261127/' + name for name in names}
          allowed.add('.github/workflows/hcsn-sender40-quality-pilot.yml')
          if len(changes) != 11 or {line.split('\t')[-1] for line in changes} != allowed:
              raise SystemExit('The frozen publication has exactly eleven new code/protocol files.')
          for line in changes:
              status, path = line.split('\t')
              if status != 'A' or not (path.startswith('qualification/hcsn_sender40_pilot_20261127/') or path == '.github/workflows/hcsn-sender40-quality-pilot.yml'):
                  raise SystemExit('Publication changes are outside the reviewed new directory/workflow.')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hcsn-sender40-public-output'
          output.mkdir(exist_ok=False)
          (output / 'PUBLICATION.json').write_text(json.dumps(dict(base=base, head=os.environ['GITHUB_SHA'], changes=changes,
              run_id=os.environ['GITHUB_RUN_ID'], run_number=os.environ['GITHUB_RUN_NUMBER'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              public_inputs_only=True, workflow_dispatch=False), indent=2) + '\n')
          PY
      - name: Install fixed CPU wheels in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          export PILOT_SETUP_START=$(date +%s)
          python -m venv "$RUNNER_TEMP/hcsn-sender40-venv"
          PYTHON="$RUNNER_TEMP/hcsn-sender40-venv/bin/python"
          "$PYTHON" -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --timeout 30 --retries 0 torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
          "$PYTHON" -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --timeout 30 --retries 0 numpy==2.3.5 scipy==1.17.0
          "$PYTHON" - <<'PY'
          import importlib.metadata, json, os, pathlib, subprocess, sys, time
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hcsn-sender40-public-output'
          packages = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze', '--all'], text=True)
          (out / 'packages.txt').write_text(packages)
          (out / 'SETUP.json').write_text(json.dumps(dict(wall_seconds=time.time()-int(os.environ['PILOT_SETUP_START']),
              python=sys.version, versions={x:importlib.metadata.version(x) for x in ('torch','numpy','scipy')},
              binary_wheels_only=True, transitive_wheels_hash_locked=False, model_calls=0), indent=2) + '\n')
          PY
      - name: Run only synthetic controls and fetch pinned public inputs
        shell: bash
        run: |
          set -euo pipefail
          PILOT=qualification/hcsn_sender40_pilot_20261127
          PYTHON="$RUNNER_TEMP/hcsn-sender40-venv/bin/python"
          "$PYTHON" "$PILOT/offline_controls.py" "$RUNNER_TEMP/hcsn-sender40-public-output/OFFLINE_CONTROLS.json"
          "$PYTHON" "$PILOT/prepare_public.py" "$RUNNER_TEMP/hcsn-sender40-public-prepared" "$RUNNER_TEMP/hcsn-sender40-public-output/PREPARATION_RESULT.json"
          cp "$RUNNER_TEMP/hcsn-sender40-public-prepared/PREPARED.json" "$RUNNER_TEMP/hcsn-sender40-public-output/PREPARED.json"
      - name: Execute one dedicated resource-bounded CPU pilot
        shell: bash
        run: |
          set -euo pipefail
          PYTHON="$RUNNER_TEMP/hcsn-sender40-venv/bin/python"
          sudo -n systemd-run --wait --pipe --collect --unit="hcsn-sender40-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property="User=$(id -un)" --property="Group=$(id -gn)" --property="WorkingDirectory=$GITHUB_WORKSPACE" \
            --property=MemoryMax=1073741824 --property=CPUQuota=100% --property=TasksMax=64 \
            --property=RuntimeMaxSec=330 --property=KillMode=control-group \
            --setenv=OMP_NUM_THREADS=1 --setenv=OPENBLAS_NUM_THREADS=1 --setenv=MKL_NUM_THREADS=1 \
            --setenv=NUMEXPR_NUM_THREADS=1 --setenv=CUDA_VISIBLE_DEVICES= --setenv=PYTHONDONTWRITEBYTECODE=1 \
            --setenv=PYTHONUNBUFFERED=1 --setenv="LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            "$PYTHON" "$GITHUB_WORKSPACE/qualification/hcsn_sender40_pilot_20261127/supervise.py" \
            "$RUNNER_TEMP/hcsn-sender40-public-prepared" "$RUNNER_TEMP/hcsn-sender40-public-output/supervised"
      - name: Preserve the complete failed or completed attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-sender40-public-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcsn-sender40-public-output
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
