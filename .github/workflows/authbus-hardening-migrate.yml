name: AuthBus hardening migration (one-shot)

on:
  push:
    branches:
      - auth-authbus-hardening-20260927
    paths:
      - .github/workflows/authbus-hardening-migrate.yml

permissions:
  contents: write

concurrency:
  group: authbus-hardening-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: auth-authbus-hardening-20260927

      - name: Apply exact sealed-registration migration
        run: python3 scripts/authbus_apply_hardening_migrations.py

      - name: Format Rust workspace
        run: cargo fmt --all --manifest-path codex-rs/Cargo.toml

      - name: Verify closed-world source inventory
        run: python3 scripts/authbus_apply_hardening_migrations.py --verify-only || test $? -eq 1
        if: ${{ false }}

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "authbus-hardening-bot"
          git config user.email "authbus-hardening-bot@users.noreply.github.com"
          git add codex-rs scripts/authbus_apply_hardening_migrations.py
          test -n "$(git status --porcelain)"
          git commit -m "finish sealed AuthBus fixture migration"
          git push origin HEAD:auth-authbus-hardening-20260927
