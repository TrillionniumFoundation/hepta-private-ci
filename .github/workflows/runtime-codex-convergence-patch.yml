name: Apply runtime.codex convergence patch

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/runtime-codex-convergence-patch.yml

permissions:
  contents: write

concurrency:
  group: runtime-codex-convergence-patch
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Materialize bounded runtime.codex changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/runtime_codex_convergence_patch.py

      - name: Verify source truth and canonical paths
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-b-path-guard.py self-test
          python3 scripts/hepta-lane-b-path-guard.py verify
          python3 scripts/hepta-lane-b-truth.py self-test
          python3 -m unittest scripts/test_hepta_lane_b_truth.py scripts/test_hepta_lane_b_path_guard.py
          python3 scripts/hepta-lane-b-truth.py verify
          python3 scripts/hepta-implementation-maps.py verify
          git diff --check

      - name: Format focused Rust owners
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host \
            --package codex-hepta-agentd
          cargo fmt --all -- --check

      - name: Run durable owner regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-infer-core --lib -- --nocapture
          cargo test --locked -p codex-hepta-infer-worker-host --lib -- --nocapture

      - name: Run real Agentd App Server fault matrix
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd \
            --test runtime_codex_product_e2e -- --nocapture

      - name: Run focused strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-worker-host \
            -p codex-hepta-agentd \
            --all-targets --no-deps -- -D warnings

      - name: Commit qualified patch and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/runtime_codex_convergence_patch.py
          rm .github/workflows/runtime-codex-convergence-patch.yml
          git diff --check
          git config user.name "Hepta runtime.codex CI"
          git config user.email "hepta-runtime-codex-ci@users.noreply.github.com"
          git add \
            codex-rs/hepta-infer-core/src/native_control.rs \
            codex-rs/hepta-infer-core/src/native_control_tests.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server.rs \
            codex-rs/hepta-infer-worker-host/src/native_run_control_tests.rs \
            codex-rs/hepta-agentd/tests/runtime_codex_product_e2e.rs \
            docs/modules/runtime.codex/FAULT_MATRIX.md \
            docs/modules/runtime.codex/IMPLEMENTATION_MAP.json \
            docs/modules/runtime.codex/TECHNICAL.md \
            qualification/module-execution-dossiers/detail/runtime.codex.md \
            scripts/runtime_codex_convergence_patch.py \
            .github/workflows/runtime-codex-convergence-patch.yml
          git commit -s -m "runtime.codex: preserve boundary decisions across recovery"
          git fetch origin work/product-convergence-20260923
          git rebase origin/work/product-convergence-20260923
          git push origin HEAD:work/product-convergence-20260923
