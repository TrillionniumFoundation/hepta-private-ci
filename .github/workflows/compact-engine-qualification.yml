name: compact.engine focused qualification

on:
  push:
    branches: [fix/compact-engine-current-main-convergence-20260925]
    paths:
      - "codex-rs/hepta-compact-engine/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "**/rust-toolchain*"
      - "docs/modules/compact.engine/**"
      - "qualification/module-execution-dossiers/detail/compact.engine.md"
      - ".github/workflows/compact-engine-qualification.yml"
  pull_request:
    paths:
      - "codex-rs/hepta-compact-engine/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/hepta-memory/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "**/rust-toolchain*"
      - "docs/modules/compact.engine/**"
      - "qualification/module-execution-dossiers/detail/compact.engine.md"
      - ".github/workflows/compact-engine-qualification.yml"

permissions:
  contents: write

concurrency:
  group: compact-engine-qualification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REQUESTED_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  source-snapshot:
    name: Retain exact source (not acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Archive tracked source without credentials or worktree mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/compact-source"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/compact-source/source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/compact-source/source-tree.txt"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/compact-source/source-sha.txt"
          (cd "$RUNNER_TEMP/compact-source" && sha256sum source.tar.gz source-tree.txt > SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-engine-source-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-source/
          retention-days: 7
          if-no-files-found: error

  qualify:
    name: compact.engine ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [exact-head, synthetic-merge]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      QUALIFICATION_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and deterministic base merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          BASE_SHA="${REQUESTED_BASE_SHA:-$(git rev-parse refs/remotes/origin/main)}"
          mkdir -p "$RUNNER_TEMP/compact-evidence"
          if [ "$QUALIFICATION_MODE" = synthetic-merge ]; then
            TREE_SHA="$(git merge-tree --write-tree "$SOURCE_SHA" "$BASE_SHA")"
            export GIT_AUTHOR_NAME='compact.engine qualification'
            export GIT_AUTHOR_EMAIL='compact-engine-qualification@invalid.example'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            MERGE_SHA="$(printf 'compact.engine deterministic qualification\n' | git commit-tree "$TREE_SHA" -p "$SOURCE_SHA" -p "$BASE_SHA")"
            git checkout --detach "$MERGE_SHA"
          fi
          printf 'source=%s\nbase=%s\nchecked=%s\ntree=%s\nmode=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$QUALIFICATION_MODE" \
            > "$RUNNER_TEMP/compact-evidence/identity.txt"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Check locked build
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets 2>&1 | tee "$RUNNER_TEMP/compact-evidence/check.log"
      - name: Install repository test runners
        run: cargo install --locked just cargo-nextest
      - name: Run repository test entrypoint
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-compact-engine -p codex-hepta-agentd 2>&1 | tee "$RUNNER_TEMP/compact-evidence/test.log"
      - name: Strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/compact-evidence/clippy.log"
      - name: Format and source cleanliness
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/compact-evidence/format.log"
          git diff --exit-code
      - name: Retain dependency sources for offline diagnosis (not qualification)
        if: always() && matrix.mode == 'exact-head'
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$RUNNER_TEMP/compact-dependencies"
          paths=()
          for path in registry/src registry/cache registry/index git/db git/checkouts; do
            if [ -d "$cargo_home/$path" ]; then paths+=("$path"); fi
          done
          test "${#paths[@]}" -gt 0
          # Only resolver/source caches: never Cargo credentials, configuration,
          # the checkout .git directory, environment, signing keys or binaries.
          tar -czf "$RUNNER_TEMP/compact-dependencies/cargo-cache.tar.gz" \
            -C "$cargo_home" "${paths[@]}"
          printf 'source=%s\nmode=%s\nnotQualification=true\n' \
            "$SOURCE_SHA" "$QUALIFICATION_MODE" \
            > "$RUNNER_TEMP/compact-dependencies/identity.txt"
          (cd "$RUNNER_TEMP/compact-dependencies" && sha256sum cargo-cache.tar.gz > SHA256SUMS)
      - name: Upload dependency diagnostic cache
        if: always() && matrix.mode == 'exact-head'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-engine-dependencies-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-dependencies/
          if-no-files-found: warn
          retention-days: 1
      - name: Retain evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-engine-${{ matrix.mode }}-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-evidence/
          if-no-files-found: error
          retention-days: 14

  qualification-result:
    name: compact.engine qualification result
    if: always()
    needs: [source-snapshot, qualify]
    runs-on: ubuntu-24.04
    steps:
      - name: Require terminal success for every qualification mode
        env:
          SOURCE_RESULT: ${{ needs.source-snapshot.result }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
        run: test "$SOURCE_RESULT" = success && test "$QUALIFY_RESULT" = success


  materialize-durable-owner:
    name: Materialize tested durable owner source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MATERIALIZE_PARENT: 2e2a847a04d7e450b3b627601680984ff48d1ca0
      PATCH_SHA256: 3610e3e56f865c1047d99b0c2a891751571ded7e7d0eeb0ab95387415314107d
      COORDINATOR_BLOB: d0d9cb9a0cf5bb6d4fa01a44327f40d23cee5721
      DURABLE_BLOB: 1c245c6da5065b354602191251e32be1fb216b99
      LIB_BLOB: 0a77ea031a4d6b2e1aeaca9bdc56386324bf1208
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact materialization trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$MATERIALIZE_PARENT"
          test "$(git rev-list --count HEAD^..HEAD)" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/compact-engine-qualification.yml"
          test -f .github/workflows/compact-engine-durable-normalize-once.yml
          test -d .github/compact-engine-materialize
      - name: Reconstruct and verify bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compact-engine-materialize-evidence"
          cat .github/compact-engine-materialize/patch-* | base64 --decode > "$RUNNER_TEMP/compact-engine.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/compact-engine.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/compact-engine.patch"
          git apply "$RUNNER_TEMP/compact-engine.patch"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/coordinator.rs)" = "$COORDINATOR_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/durable.rs)" = "$DURABLE_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/lib.rs)" = "$LIB_BLOB"
          test ! -e codex-rs/hepta-compact-engine/src/durable_facade.rs
          git diff --check
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Exact source format and build
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/format.log"
          cargo check --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/check.log"
      - name: Exact source tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/test.log"
      - name: Exact source strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/clippy.log"
      - name: Commit tested source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object codex-rs/hepta-compact-engine/src/coordinator.rs)" = "$COORDINATOR_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/durable.rs)" = "$DURABLE_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/lib.rs)" = "$LIB_BLOB"
          git checkout "$MATERIALIZE_PARENT" -- .github/workflows/compact-engine-qualification.yml
          rm -rf .github/compact-engine-materialize
          rm -f .github/workflows/compact-engine-durable-normalize-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'compact.engine materializer'
          git config user.email 'compact-engine-materializer@invalid.example'
          git commit -m 'refactor(compact.engine): converge durable transaction owner'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Retain materialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-engine-materialize-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-engine-materialize-evidence/
          if-no-files-found: warn
          retention-days: 7

  developer-toolchain:
    # Development aid only: no source mutation and no write credential.
    name: Retain pinned developer tools (not qualification)
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(compact.engine): retain developer toolchain')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Archive tool binaries and sysroot, never credentials
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          mkdir -p "$RUNNER_TEMP/compact-tools"
          rustc --version --verbose > "$RUNNER_TEMP/compact-tools/versions.txt"
          rustfmt --version >> "$RUNNER_TEMP/compact-tools/versions.txt"
          tar --exclude='lib/rustlib/src' -czf "$RUNNER_TEMP/compact-tools/toolchain.tar.gz" -C "$toolchain" bin lib
          (cd "$RUNNER_TEMP/compact-tools" && sha256sum toolchain.tar.gz > SHA256SUMS)
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-engine-developer-tools-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/compact-tools/
          retention-days: 1
          if-no-files-found: error
