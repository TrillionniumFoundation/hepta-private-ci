name: compact.engine focused qualification

on:
  push:
    branches:
      - fix/compact-engine-current-main-convergence-20260925
    paths:
      - "codex-rs/hepta-compact-engine/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "codex-rs/rust-toolchain"
      - "codex-rs/rust-toolchain.toml"
      - ".github/workflows/compact-engine-qualification.yml"
  pull_request:
    paths:
      - "codex-rs/hepta-compact-engine/**"
      - "codex-rs/hepta-cognitive-types/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "codex-rs/rust-toolchain"
      - "codex-rs/rust-toolchain.toml"
      - ".github/workflows/compact-engine-qualification.yml"

permissions:
  contents: read

concurrency:
  group: compact-engine-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-head:
    name: compact.engine exact source head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Verify exact source identity and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Check all targets
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-compact-engine --all-targets
      - name: Test compact.engine
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-compact-engine --all-targets
      - name: Strict Clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-compact-engine --all-targets -- -D warnings
      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all -- --check

  synthetic-merge:
    name: compact.engine deterministic base merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct deterministic merge candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "refs/remotes/origin/${BASE_REF}^{commit}")"
          git -c user.name='compact.engine qualification' \
              -c user.email='compact-engine-qualification@invalid.example' \
              merge --no-ff --no-edit "$BASE_SHA"
          git diff --quiet
          git diff --cached --quiet
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Check merge candidate
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-compact-engine --all-targets
      - name: Test merge candidate
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-compact-engine --all-targets
      - name: Strict Clippy merge candidate
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-compact-engine --all-targets -- -D warnings
      - name: Format merge candidate
        working-directory: codex-rs
        run: cargo fmt --all -- --check
