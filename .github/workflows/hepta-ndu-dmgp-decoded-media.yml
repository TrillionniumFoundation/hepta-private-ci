name: Hepta NDU-DMGP original media decode audit

on:
  pull_request:
    paths:
      - "qualification/ndu-dmgp-shadow/decoded_media_audit.py"
      - "qualification/ndu-dmgp-shadow/test_decoded_media_audit.py"
      - "qualification/ndu-dmgp-shadow/signed_media_bridge.py"
      - "qualification/ndu-dmgp-shadow/test_signed_media_bridge.py"
      - "qualification/ndu-dmgp-shadow/test_media_type_admission.py"
      - "qualification/ndu-dmgp-shadow/run_codec_acceptance.py"
      - "qualification/ndu-dmgp-shadow/test_codec_acceptance.py"
      - ".github/workflows/hepta-ndu-dmgp-decoded-media.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-media-structural-audit:
    # Install codecs explicitly; image selection alone does not prove availability.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install FFmpeg from the runner's official Ubuntu package sources
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Assert exact submitted commit and real media decoder tools
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          echo "verified-source-head=$SOURCE_HEAD"
          python3 --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Compile read-only media audit and adversarial tests
        run: python3 -m compileall -q qualification/ndu-dmgp-shadow
      - name: Test mandatory acceptance gate failure modes
        run: python3 -m unittest discover -s qualification/ndu-dmgp-shadow -p 'test_codec_acceptance.py' -v
      - name: Actually decode text, PNG, PCM WAV and MP4; forbid skipped acceptance
        run: python3 qualification/ndu-dmgp-shadow/run_codec_acceptance.py
      - name: Full signed and media regression suite with installed codecs
        run: python3 -m unittest discover -s qualification/ndu-dmgp-shadow -p 'test_*.py' -v
      - name: Do not promote decoded fixture test to model/authority evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('qualification/ndu-dmgp-shadow/MANIFEST.json').read_text())
          for key in ('real_model_execution', 'independent_real_outcomes', 'hardware_efficiency_qualified',
                      'six_scientific_blockers_production_closed', 'future_snapshot_selection_authorized'):
              assert manifest[key] is False, key
          print('SHADOW_ONLY; real codec fixtures != real neural decoding / semantic truth / energy / FBSDE')
          PY
