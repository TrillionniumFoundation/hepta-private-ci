name: Hepta NDU-DMGP original media decode audit

on:
  pull_request:
    paths:
      - "qualification/ndu-dmgp-shadow/decoded_media_audit.py"
      - "qualification/ndu-dmgp-shadow/test_decoded_media_audit.py"
      - "qualification/ndu-dmgp-shadow/signed_media_bridge.py"
      - "qualification/ndu-dmgp-shadow/test_signed_media_bridge.py"
      - "qualification/ndu-dmgp-shadow/test_media_type_admission.py"
      - ".github/workflows/hepta-ndu-dmgp-decoded-media.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-media-structural-audit:
    # Full hosted image exposes real ffmpeg. No model / GPU / signed truth claims.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact submitted commit and real media decoder tools
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          echo "verified-source-head=$SOURCE_HEAD"
          python3 --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Compile read-only media audit and adversarial tests
        run: python3 -m py_compile qualification/ndu-dmgp-shadow/decoded_media_audit.py qualification/ndu-dmgp-shadow/test_decoded_media_audit.py qualification/ndu-dmgp-shadow/signed_media_bridge.py qualification/ndu-dmgp-shadow/test_signed_media_bridge.py qualification/ndu-dmgp-shadow/test_media_type_admission.py
      - name: Actually decode text, PNG, PCM WAV and MP4; enforce negative evidence
        run: python3 -m unittest discover -s qualification/ndu-dmgp-shadow -p 'test_*media*.py' -v
      - name: Do not promote decoded fixture test to model/authority evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('qualification/ndu-dmgp-shadow/MANIFEST.json').read_text())
          for key in ('real_model_execution', 'independent_real_outcomes', 'hardware_efficiency_qualified',
                      'six_scientific_blockers_production_closed', 'future_snapshot_selection_authorized'):
              assert manifest[key] is False, key
          print('SHADOW_ONLY; real codec fixtures != real neural decoding / semantic truth / energy / FBSDE')
          PY
