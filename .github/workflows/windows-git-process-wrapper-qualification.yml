name: Windows Git Process Tree Qualification

on:
  pull_request:
    paths:
      - "codex-rs/git-utils/src/git_process_tests.rs"
      - ".github/workflows/windows-git-process-wrapper-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-tree-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-24.04"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install exactly pinned Rust 1.96 compiler and components
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Install pinned Python for repository test recipes
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Install pinned just and nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Verify complete Rust source formatting
        if: runner.os != 'Windows'
        shell: bash
        run: cargo +1.96.0 fmt --all -- --check
      # Full-workspace rustfmt exceeds Windows' command-line length limit.
      # Ubuntu checks the workspace; Windows also checks the exercised crate.
      - name: Verify native Git-utils source formatting
        if: runner.os == 'Windows'
        shell: bash
        run: cargo +1.96.0 fmt -p codex-git-utils -- --check
      - name: Actual Windows and Unix Git wrapper child lifetime tests
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.96.0"
        run: just test --locked -p codex-git-utils --lib --success-output immediate --failure-output immediate --no-tests=fail --retries 0 'git_process::tests::'
      - name: Strict native crate Clippy
        shell: bash
        run: cargo +1.96.0 clippy --locked -p codex-git-utils --all-targets -- -D warnings
