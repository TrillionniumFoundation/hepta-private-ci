name: Prompt registry immutable source evidence
on:
  push:
    branches: [codex/prompt-registry-delivery-consistency-20260928]
    paths:
      - .github/workflows/prompt-registry-source-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive only the checked-in tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/prompt-source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/prompt-source/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/prompt-source/identity.txt"
          sha256sum "$RUNNER_TEMP/prompt-source/source.tar.gz" > "$RUNNER_TEMP/prompt-source/archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-immutable-source-${{ github.sha }}
          path: ${{ runner.temp }}/prompt-source/
          if-no-files-found: error
          retention-days: 7
