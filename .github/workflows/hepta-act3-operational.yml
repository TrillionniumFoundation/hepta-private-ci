name: ACT3 controlled operational contracts

on:
  push:
    branches: [codex/act3-operational-contract-20261112]

permissions:
  contents: read

concurrency:
  group: act3-operational-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Bind exact source and runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act3-operational"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/act3-operational/source.txt"
          python3 -m venv "$RUNNER_TEMP/act3-venv"
          "$RUNNER_TEMP/act3-venv/bin/pip" install numpy==2.3.5
          "$RUNNER_TEMP/act3-venv/bin/pip" freeze > "$RUNNER_TEMP/act3-operational/packages.txt"
          "$RUNNER_TEMP/act3-venv/bin/python" --version > "$RUNNER_TEMP/act3-operational/python.txt"
      - name: Require behavioral tests and complete original policy panel
        run: |
          set -euo pipefail
          for suite in test_skill_lifecycle.py test_operational_metrics.py test_qualify_operational.py test_file_family.py test_async_owner_wait.py test_durable_lifecycle.py; do
            "$RUNNER_TEMP/act3-venv/bin/python" -m unittest discover -s scripts/act2_learning -p "$suite" -v > "$RUNNER_TEMP/act3-operational/$suite.log" 2>&1
          done
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/test_durable_async_owner.py --evidence "$RUNNER_TEMP/act3-operational/joint-async-recovery" -v > "$RUNNER_TEMP/act3-operational/joint-async-recovery.log" 2>&1
          PYTHONPATH=scripts/act2_learning "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/test_gru_async_continuation.py --evidence "$RUNNER_TEMP/act3-operational/gru-async-recovery" -v > "$RUNNER_TEMP/act3-operational/gru-async-recovery.log" 2>&1
          "$RUNNER_TEMP/act3-venv/bin/python" scripts/act2_learning/qualify_operational.py --archive qualification/act2-learning-20261110/run2 --output "$RUNNER_TEMP/act3-operational/panel" > "$RUNNER_TEMP/act3-operational/panel.log" 2>&1
          just fmt --base 154a90afbabeeff9eafa48f58d598a87fbef0bef --check > "$RUNNER_TEMP/act3-operational/format.log" 2>&1
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/act3-operational/source-after.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: act3-operational-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/act3-operational
          if-no-files-found: error
          retention-days: 30
