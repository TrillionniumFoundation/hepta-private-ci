name: cognitive-types-semantic-fix

on:
  push:
    branches:
      - codex/cognitive-types-full-closure-20260927
    paths:
      - .github/workflows/cognitive-types-semantic-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/cognitive-types-full-closure-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Reconcile canonical consumer and Shared Experience exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('codex-rs/hepta-cognitive-types/src/lib.rs')
          text = lib.read_text()
          if 'pub mod consumer;\n' not in text:
              marker = 'pub mod consumer_adapters;\n'
              if marker not in text:
                  raise SystemExit('lib.rs consumer_adapters marker missing')
              text = text.replace(marker, 'pub mod consumer;\n' + marker, 1)
          if 'pub mod shared_experience;\n' not in text:
              marker = 'pub mod lane_c;\n'
              if marker not in text:
                  raise SystemExit('lib.rs lane_c marker missing')
              text = text.replace(marker, marker + 'pub mod shared_experience;\n', 1)
          if '\nmod consumer_tests;\n' not in text:
              marker = '#[cfg(test)]\n#[path = "hardening_tests.rs"]\nmod hardening_tests;\n'
              if marker not in text:
                  raise SystemExit('lib.rs hardening test marker missing')
              additions = (
                  '#[cfg(test)]\nmod consumer_tests;\n\n'
                  '#[cfg(test)]\nmod shared_experience_tests;\n\n'
              )
              text = text.replace(marker, additions + marker, 1)
          lib.write_text(text)

          wire = Path('codex-rs/hepta-cognitive-types/src/wire.rs')
          text = wire.read_text()
          imports = (
              'use crate::shared_experience::SharedExperiencePublicationV2;\n'
              'use crate::shared_experience::SharedExperienceRevocationReceiptV2;\n'
              'use crate::shared_experience::SharedExperienceSnapshotV2;\n'
              'use crate::shared_experience::SharedExperienceUseReceiptV2;\n'
          )
          if 'use crate::shared_experience::SharedExperiencePublicationV2;' not in text:
              marker = 'use crate::hnmf_learning::TopologyProposalV1;\n'
              if marker not in text:
                  raise SystemExit('wire.rs topology import marker missing')
              text = text.replace(marker, marker + imports, 1)

          shared_impls = '''impl_contract!(
              SharedExperiencePublicationV2,
              "SharedExperiencePublicationV2",
              "hepta.shared-experience.publication.v2",
              262_144,
              SharedExperiencePublicationV2::validate
          );
          impl_contract!(
              SharedExperienceSnapshotV2,
              "SharedExperienceSnapshotV2",
              "hepta.shared-experience.snapshot.v2",
              1_048_576,
              SharedExperienceSnapshotV2::validate
          );
          impl_contract!(
              SharedExperienceUseReceiptV2,
              "SharedExperienceUseReceiptV2",
              "hepta.shared-experience.use-receipt.v2",
              65_536,
              SharedExperienceUseReceiptV2::validate
          );
          impl_contract!(
              SharedExperienceRevocationReceiptV2,
              "SharedExperienceRevocationReceiptV2",
              "hepta.shared-experience.revocation-receipt.v2",
              1_048_576,
              SharedExperienceRevocationReceiptV2::validate
          );
          '''
          if 'impl_contract!(\n    SharedExperiencePublicationV2,' not in text:
              marker = '''impl_contract!(
              ForgetPropagationReceiptV1,
              "ForgetPropagationReceiptV1",
              "hepta.hnmf.forget-propagation-receipt.v1",
              65_536,
              ForgetPropagationReceiptV1::validate
          );
          '''
              if marker not in text:
                  raise SystemExit('wire.rs forget receipt registration marker missing')
              text = text.replace(marker, marker + shared_impls, 1)
          wire.write_text(text)
          PY

          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Verify cognitive.types package
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml -p codex-hepta-cognitive-types --all-targets
          cargo clippy --manifest-path codex-rs/Cargo.toml -p codex-hepta-cognitive-types --all-targets -- -D warnings
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-cognitive-types

      - name: Commit verified semantic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cognitive-types-semantic-fix.yml
          git add codex-rs/hepta-cognitive-types/src/lib.rs \
                  codex-rs/hepta-cognitive-types/src/wire.rs
          git commit -m 'fix(cognitive.types): expose canonical consumers and shared-experience wire contracts'
          git push origin HEAD:codex/cognitive-types-full-closure-20260927
