name: Cognitive store deterministic patch application

on:
  push:
    branches:
      - codex/cognitive-store-full-convergence-20260927
    paths:
      - '.github/workflows/cognitive-store-apply-only.yml'

concurrency:
  group: cognitive-store-deterministic-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/cognitive-store-full-convergence-20260927
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize checkout and apply repairs
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git reset --hard HEAD
          python3 scripts/cognitive_store_one_shot_repair.py apply
          python3 scripts/cognitive_store_one_shot_followup.py
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-cognitive-store \
            --package codex-hepta-memory \
            --package codex-hepta-agentd
      - name: Remove transient repair machinery
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/cognitive-store-apply-only.yml \
            .github/workflows/cognitive-store-one-shot-repair.yml \
            .github/workflows/cognitive-store-lock-repair.yml \
            scripts/cognitive_store_one_shot_repair.py \
            scripts/cognitive_store_one_shot_followup.py
          git add -A
      - name: Bind exact implementation objects
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('docs/modules/cognitive.store/IMPLEMENTATION_MAP.json')
          row = json.loads(path.read_text(encoding='utf-8'))
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          for entry in row['sourceObjects']:
              entry['object'] = subprocess.check_output(
                  ['git', 'rev-parse', f"{tree}:{entry['path']}"], text=True
              ).strip()
          path.write_text(json.dumps(row, indent=2, sort_keys=False) + '\n', encoding='utf-8')
          PY
          git add docs/modules/cognitive.store/IMPLEMENTATION_MAP.json
      - name: Verify and push exact candidate
        run: |
          set -euo pipefail
          git diff --cached --check
          python3 scripts/cognitive_store_architecture.py
          git config user.name 'Hepta Cognitive Store CI'
          git config user.email 'hepta-cognitive-ci@users.noreply.github.com'
          git commit -m 'fix(cognitive-store): close authority boundary and qualification blockers'
          python3 scripts/cognitive_store_map_verify.py \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse HEAD^{tree})"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          git push origin HEAD:codex/cognitive-store-full-convergence-20260927
