name: Hepta Agentd process qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-agent-protocol/**
      - codex-rs/hepta-cognitive-read/**
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - codex-rs/hepta-fleet/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-supervisor/**
      - codex-rs/hepta-memory/**
      - codex-rs/hepta-plasticity/**
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-learning-artifacts/**
      - codex-rs/hepta-learning-ledger/**
      - codex-rs/hepta-ndu/**
      - codex-rs/hepta-neuron/**
      - codex-rs/hepta-runtime/**
      - codex-rs/app-server/**
      - codex-rs/app-server-client/**
      - codex-rs/app-server-transport/**
      - codex-rs/uds/**
      - .github/scripts/check_ci_results.py
      - scripts/test_hepta_agentd_ci.py
      - scripts/hepta_ci_candidate.py
      - scripts/hepta_workspace.py
      - scripts/test_hepta_workspace.py
      - .github/workflows/hepta-gap-agentd-process.yml

permissions:
  contents: write

concurrency:
  group: hepta-agentd-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  convergence-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 990
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Select only the arm commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git show -s --format=%s HEAD)" = "ci(agentd): arm tested lifecycle patch" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply cancellation and process-fixture corrections
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def block(*lines: str) -> str:
              return "\n".join(lines) + "\n"

          def replace_one(path: str, label: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              print(f"{label}: matches={count}")
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          lane = "codex-rs/hepta-agentd/src/lane_b_runtime.rs"
          replace_one(
              lane,
              "cancel prelude",
              block(
                  "        require_revision(record, expected_revision)?;",
                  "        let expired = expire_record(record, now_ms)?;",
                  "        if expired {",
                  "            let disposition = match record.phase {",
                  "                RunPhase::Cancelled => CancellationDisposition::AlreadyTerminal,",
                  "                RunPhase::Cancelling => CancellationDisposition::CancellingAfterDispatch,",
                  "                _ => return Err(AgentRunError::InvalidTransition),",
                  "            };",
                  "            return Ok((disposition, receipt(record, /*idempotent*/ false)));",
                  "        }",
              ),
              block(
                  "        let prior_ack_revision = expected_revision",
                  "            .checked_add(1)",
                  "            .is_some_and(|revision| revision == record.revision);",
                  "        if prior_ack_revision",
                  "            && matches!(",
                  "                record.phase,",
                  "                RunPhase::Cancelled | RunPhase::Cancelling | RunPhase::Indeterminate",
                  "            )",
                  "        {",
                  "            if record.cancel_reason.as_deref() != Some(reason) {",
                  "                return Err(AgentRunError::Conflict);",
                  "            }",
                  "            let expired = expire_record(record, now_ms)?;",
                  "            let disposition = match record.phase {",
                  "                RunPhase::Cancelled => CancellationDisposition::AlreadyTerminal,",
                  "                RunPhase::Cancelling | RunPhase::Indeterminate => {",
                  "                    CancellationDisposition::CancellingAfterDispatch",
                  "                }",
                  "                _ => return Err(AgentRunError::InvalidTransition),",
                  "            };",
                  "            return Ok((disposition, receipt(record, /*idempotent*/ !expired)));",
                  "        }",
                  "        require_revision(record, expected_revision)?;",
                  "        if matches!(record.phase, RunPhase::Cancelling | RunPhase::Indeterminate)",
                  "            && record.cancel_reason.as_deref() != Some(reason)",
                  "        {",
                  "            return Err(AgentRunError::Conflict);",
                  "        }",
                  "        let expired = expire_record(record, now_ms)?;",
                  "        if expired {",
                  "            let disposition = match record.phase {",
                  "                RunPhase::Cancelled => CancellationDisposition::AlreadyTerminal,",
                  "                RunPhase::Cancelling | RunPhase::Indeterminate => {",
                  "                    CancellationDisposition::CancellingAfterDispatch",
                  "                }",
                  "                _ => return Err(AgentRunError::InvalidTransition),",
                  "            };",
                  "            return Ok((disposition, receipt(record, /*idempotent*/ false)));",
                  "        }",
              ),
          )
          replace_one(
              lane,
              "indeterminate replay",
              block(
                  "            RunPhase::Indeterminate => return Err(AgentRunError::TerminalObservationRequired),",
              ),
              block(
                  "            RunPhase::Indeterminate => {",
                  "                return Ok((",
                  "                    CancellationDisposition::CancellingAfterDispatch,",
                  "                    receipt(record, /*idempotent*/ true),",
                  "                ));",
                  "            }",
              ),
          )

          tests = "codex-rs/hepta-agentd/src/lane_b_runtime_tests.rs"
          marker = block("#[test]", "fn operation_identity_is_idempotent_only_for_equal_semantics() {")
          regression = block(
              "#[test]",
              "fn cancellation_ack_loss_replays_current_receipt_without_hidden_mutation() {",
              "    let mut before = AgentRunCoordinator::compose_runtime(composition()).expect(\"compose\");",
              "    before.start_run(100, snapshot()).expect(\"admit\");",
              "    let cancelled = before.cancel_run(200, \"run.1\", 1, \"operator_request\").expect(\"cancel\");",
              "    let replayed = before.cancel_run(201, \"run.1\", 1, \"operator_request\").expect(\"replay\");",
              "    assert_eq!(replayed.0, CancellationDisposition::AlreadyTerminal);",
              "    assert!(replayed.1.idempotent);",
              "    assert_eq!(replayed.1.revision, cancelled.1.revision);",
              "",
              "    let mut after = AgentRunCoordinator::compose_runtime(composition()).expect(\"compose\");",
              "    after.start_run(100, snapshot()).expect(\"admit\");",
              "    after.attach_context(200, 1, attachment()).expect(\"attach\");",
              "    after.mark_dispatched(300, \"run.1\", 2).expect(\"dispatch\");",
              "    let cancelling = after.cancel_run(400, \"run.1\", 3, \"operator_request\").expect(\"cancel\");",
              "    let replayed = after.cancel_run(450, \"run.1\", 3, \"operator_request\").expect(\"replay\");",
              "    assert!(replayed.1.idempotent);",
              "    assert_eq!(replayed.1.revision, cancelling.1.revision);",
              "    assert_eq!(replayed.1.phase, RunPhase::Cancelling);",
              "",
              "    let timed_out = after.cancel_run(3_400, \"run.1\", 4, \"operator_request\").expect(\"timeout\");",
              "    assert_eq!(timed_out.0, CancellationDisposition::CancellingAfterDispatch);",
              "    assert!(!timed_out.1.idempotent);",
              "    assert_eq!(timed_out.1.phase, RunPhase::Indeterminate);",
              "    assert_eq!(timed_out.1.revision, 5);",
              "    let replayed = after.cancel_run(3_401, \"run.1\", 4, \"operator_request\").expect(\"replay timeout\");",
              "    assert!(replayed.1.idempotent);",
              "    assert_eq!(replayed.1.phase, RunPhase::Indeterminate);",
              "    assert_eq!(after.cancel_run(3_402, \"run.1\", 5, \"different_reason\"), Err(AgentRunError::Conflict));",
              "}",
              "",
          )
          replace_one(tests, "cancellation regression", marker, regression + marker)

          native_tests = "codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs"
          replace_one(
              native_tests,
              "physical turn-start assertion",
              block(
                  "    let turn_start = source",
                  "        .find(\"client.request_typed::<TurnStartResponse>(ClientRequest::TurnStart\")",
                  "        .expect(\"physical turn start\");",
              ),
              block(
                  "    let turn_start = source",
                  "        .find(\"send_authorized_turn_start(&mut client, entered_use, turn_params)\")",
                  "        .expect(\"physical turn start\");",
              ),
          )

          support = "codex-rs/hepta-agentd/src/test_support.rs"
          replace_one(
              support,
              "test App Server executable",
              block(
                  "        let app_server_task = tokio::spawn(run_app_server(",
                  "            identity.clone(),",
                  "            Arg0DispatchPaths::default(),",
                  "            CognitiveRuntime::Available(Arc::clone(&store)),",
              ),
              block(
                  "        let arg0_paths = Arg0DispatchPaths {",
                  "            codex_self_exe: Some(std::env::current_exe()?),",
                  "            ..Arg0DispatchPaths::default()",
                  "        };",
                  "        let app_server_task = tokio::spawn(run_app_server(",
                  "            identity.clone(),",
                  "            arg0_paths,",
                  "            CognitiveRuntime::Available(Arc::clone(&store)),",
              ),
          )
          PY
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.guard.outputs.run == 'true'
        with:
          tool: nextest@0.9.103
      - name: Test exact corrected boundaries
        if: steps.guard.outputs.run == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-agentd --package codex-hepta-infer-worker-host -- --check
          cargo test --locked -p codex-hepta-agentd --lib lane_b_runtime::tests::cancellation_ack_loss_replays_current_receipt_without_hidden_mutation -- --exact --nocapture
          cargo test --locked -p codex-hepta-infer-worker-host --lib native_app_server::tests::cognitive_final_use_revalidation_follows_durable_dispatch_and_precedes_turn_start -- --exact --nocapture
          cargo test --locked -p codex-hepta-infer-worker-host --lib native_app_server::tests::real_agentd_worker_accepts_fresh_context_and_rejects_final_use_tombstone -- --exact --nocapture
          cargo clippy --locked -p codex-hepta-agentd -p codex-hepta-infer-worker-host --no-deps --all-targets -- -D warnings
      - name: Publish tested correction and restore qualification workflow
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/hepta-gap-agentd-process.yml > .github/workflows/hepta-gap-agentd-process.yml
          rm -f .github/workflows/hepta-agentd-convergence-patch.yml
          git diff --check
          git config user.name "Hepta Agentd CI"
          git config user.email "hepta-agentd-ci@users.noreply.github.com"
          git add codex-rs/hepta-agentd/src/lane_b_runtime.rs \
            codex-rs/hepta-agentd/src/lane_b_runtime_tests.rs \
            codex-rs/hepta-agentd/src/test_support.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs \
            .github/workflows/hepta-gap-agentd-process.yml \
            .github/workflows/hepta-agentd-convergence-patch.yml
          git commit -m "runtime.agentd: close cancellation and process qualification gaps"
          git fetch origin work/product-convergence-20260923
          git rebase origin/work/product-convergence-20260923
          git push origin HEAD:work/product-convergence-20260923

  derived-projections:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source ownership and generated projections
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify
          python3 -m unittest -v scripts.tests.test_hepta_ci_candidate
          python3 -m unittest discover -v -s scripts -p 'test_hepta_agentd_ci.py'

  owner-formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check owner formatting without mutation
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-agent-protocol --package codex-hepta-cognitive-read \
            --package codex-hepta-agentd --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host --package codex-hepta-fleet \
            --package codex-hepta-control-plane --package codex-hepta-automation \
            --package codex-hepta-supervisor -- --check

  catalog-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Exercise typed catalog and admission without daemon setup
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked --manifest-path Cargo.toml --lib \
            -p codex-hepta-fleet -p codex-hepta-control-plane \
            -p codex-hepta-agent-protocol --test-threads=2

  process-qualification:
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
        os: ${{ fromJSON('["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EXPECTED_SHA: ${{ matrix.lane == 'merge-candidate' && github.sha || github.event.pull_request.head.sha || github.sha }}
      RUST_BACKTRACE: "1"
      CARGO_BUILD_JOBS: "2"
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate and select tree-equivalent native execution
        id: execution
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          args=(--source "$SOURCE_SHA" --tested "$EXPECTED_SHA")
          if [ "$LANE" = merge-candidate ]; then
            expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
            args+=(--base "$BASE_SHA" --lane base-merge)
          else
            args+=(--lane source-head)
          fi
          python3 scripts/hepta_ci_candidate.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Check manifest graph before native setup
        if: steps.execution.outputs.run_native == 'true'
        run: python3 scripts/hepta_workspace.py
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.execution.outputs.run_native == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified sandboxed V8 artifacts
        if: steps.execution.outputs.run_native == 'true'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Exercise owner and lifecycle libraries
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked --lib -p codex-hepta-agentd -p codex-hepta-cognitive-read \
            -p codex-hepta-infer-core -p codex-hepta-infer-worker-host \
            -p codex-hepta-supervisor --test-threads=1
      - name: Exercise actual optional retirement and durable destination recovery
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd --test optional_module_restart \
            --test runtime_shutdown_outcomes --test-threads=1
          just test --locked -p codex-hepta-automation --test retirement_recovery \
            --test operation_timer_fence --test-threads=1
          just test --locked -p codex-hepta-memory --lib destination_recovery_binding --test-threads=1
      - name: Exercise named plasticity and live cutover paths
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd --lib \
            plasticity_runtime::lifetime_tests::agentd_lifetime_owner_submits_restarts_and_reconciles_idempotently --test-threads=1
          just test --locked -p codex-hepta-runtime \
            authenticated_canary_forces_live_fault_then_rolls_forward_to_reconciled_predecessor_semantics --test-threads=1
      - name: Exercise writer admission and real daemon process suites
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd --features qualification-cognitive-write \
            --lib runtime::tests::qualification_ --test-threads=1
          just test --locked -p codex-hepta-agentd --features qualification-cognitive-write \
            --test cognitive_product_e2e --test plasticity_process_e2e \
            --test runtime_codex_product_e2e --test supervised_two_agents \
            --test supervisord_product_e2e --test queue_capacity_product --test-threads=1
      - name: Strict owner lint
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-agentd --no-deps --all-targets --features qualification-cognitive-write -- -D warnings
      - name: Check unchanged candidate after execution
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  qualification-result:
    if: ${{ always() }}
    needs: [derived-projections, owner-formatting, catalog-admission, process-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require every applicable lane to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_NEEDS: '["derived-projections","owner-formatting","catalog-admission","process-qualification"]'
        run: python3 .github/scripts/check_ci_results.py
