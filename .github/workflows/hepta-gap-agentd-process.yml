name: Hepta Agentd process qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-fleet/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-supervisor/**
      - codex-rs/hepta-memory/**
      - codex-rs/app-server/**
      - codex-rs/app-server-client/**
      - codex-rs/app-server-transport/**
      - codex-rs/uds/**
      - docs/modules/MODULES.json
      - scripts/hepta_workspace.py
      - scripts/test_hepta_workspace.py
      - .github/workflows/hepta-gap-agentd-process.yml

permissions:
  contents: read

concurrency:
  group: hepta-agentd-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-admission:
    name: Runtime catalog admission (${{ matrix.candidate }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.candidate == 'source-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact catalog candidate
        env:
          EXPECTED_SHA: ${{ matrix.candidate == 'source-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree}
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-fleet -- --check
      - name: Reject unknown state and conflicting writers before host compilation
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-fleet --lib module_catalog
      - name: Verify source remained unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code

  process-qualification:
    # The small registry gate fails before paying for V8 and full host builds.
    # It does not replace the native process, recovery, or lint suites below.
    needs: catalog-admission
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: "1"
      RUST_LOG: "info"
      # macOS hosted runners expose a deeply nested TMPDIR. Agentd's real
      # process fixtures use pathname AF_UNIX sockets, whose Darwin limit is
      # 103 bytes, so bind test-owned temporary state below the canonical
      # short private root rather than weakening the production layout.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Fail fast on manifest and formatting errors
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_workspace.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-agentd --package codex-hepta-fleet --package codex-hepta-control-plane --package codex-hepta-automation -- --check

      - name: Install repository test entry point
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Resolve verified sandboxed V8 artifacts before Rust execution
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Exercise local fences, reconciliation and organ lifecycle
        working-directory: codex-rs
        run: just test --locked --lib -p codex-hepta-fleet -p codex-hepta-control-plane -p codex-hepta-agentd

      - name: Exercise durable retirement and reconciliation
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-automation --test retirement_recovery

      - name: Execute local writer qualification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            runtime::tests::qualification_ -- --nocapture --test-threads=1

      - name: Execute real Agentd/App Server process suite
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            --test cognitive_product_e2e -- --nocapture --test-threads=1

      - name: Strict Agentd lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # Keep the selected package at -D warnings. --no-deps prevents this
          # package gate from failing on stale lint expectations in unrelated
          # dependency crates, which remain covered by their owning gates.
          cargo clippy --locked -p codex-hepta-agentd --no-deps \
            --all-targets --features qualification-cognitive-write -- -D warnings

      - name: Clean source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
