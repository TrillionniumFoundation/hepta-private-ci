name: Hepta Agentd process qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - CALLERS.toml
      - codex-rs/**
      - scripts/**
      - .github/scripts/**
      - .github/workflows/**
      - docs/modules/runtime.agentd/**
      - docs/modules/runtime.supervisor/**
      - qualification/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-agentd-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  derived-projections:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source ownership generated projections and trust boundary
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/hepta_agentd_trust_boundary.py
          python3 -m unittest -v scripts.tests.test_hepta_ci_candidate
          python3 -m unittest discover -v -s scripts -p 'test_hepta_agentd_*.py'
          python3 -m unittest discover -v -s scripts/qualification -p 'test_agentd_exact_head.py'

  owner-formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check owner formatting without mutation
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-agent-protocol --package codex-hepta-cognitive-read \
            --package codex-hepta-agentd --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host --package codex-hepta-fleet \
            --package codex-hepta-control-plane --package codex-hepta-automation \
            --package codex-hepta-supervisor -- --check

  catalog-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Exercise typed catalog and admission without daemon setup
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked --retries 0 --no-fail-fast --manifest-path Cargo.toml --lib \
            -p codex-hepta-fleet -p codex-hepta-control-plane \
            -p codex-hepta-agent-protocol --test-threads=2

  process-qualification:
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
        os: ${{ fromJSON('["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EXPECTED_SHA: ${{ matrix.lane == 'merge-candidate' && github.sha || github.event.pull_request.head.sha || github.sha }}
      HEPTA_CI_LANE: ${{ matrix.lane }}
      RUST_BACKTRACE: "1"
      CARGO_BUILD_JOBS: "2"
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate and require native execution on every lane
        id: execution
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          args=(--source "$SOURCE_SHA" --tested "$EXPECTED_SHA")
          if [ "$LANE" = merge-candidate ]; then
            expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
            args+=(--base "$BASE_SHA" --lane base-merge)
          else
            args+=(--lane source-head)
          fi
          python3 scripts/hepta_ci_candidate.py "${args[@]}" --require-native --github-output "$GITHUB_OUTPUT"
      - name: Check manifest graph before native setup
        if: steps.execution.outputs.run_native == 'true'
        run: python3 scripts/hepta_workspace.py
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.execution.outputs.run_native == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified sandboxed V8 artifacts
        if: steps.execution.outputs.run_native == 'true'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Build exact core Agentd and App Server for native owner qualification
        id: native_build
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p codex-app-server --bin codex-app-server
          cargo build --locked -p codex-hepta-agentd --bin codex-hepta-agentd --no-default-features
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          cargo metadata --locked --all-features --filter-platform "$host" --format-version=1 > "$RUNNER_TEMP/hepta-nextest-metadata.json"
          target="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_directory"])' "$RUNNER_TEMP/hepta-nextest-metadata.json")"
          test -x "$target/debug/codex-app-server"
          test -x "$target/debug/codex-hepta-agentd"
          printf 'HEPTA_TEST_CODEX_EXE=%s/debug/codex-app-server\n' "$target" >> "$GITHUB_ENV"
          printf 'HEPTA_AGENTD_QUAL_TARGET=%s\n' "$target" >> "$GITHUB_ENV"
      - name: Capture exact native fixture digest before execution
        id: fixture_identity
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: python3 scripts/hepta_agentd_receipt.py capture --directory "$RUNNER_TEMP/agentd-receipts" --binary "$HEPTA_TEST_CODEX_EXE"
      - name: Exercise owner and lifecycle libraries
        id: owner_libraries
        if: ${{ !cancelled() && steps.fixture_identity.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --no-fail-fast --lib -p codex-hepta-agentd -p codex-hepta-cognitive-read \
            -p codex-hepta-infer-core -p codex-hepta-infer-worker-host \
            -p codex-hepta-supervisor --test-threads=1
      - name: Exercise actual optional retirement
        id: optional_retirement
        if: ${{ !cancelled() && steps.fixture_identity.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --no-fail-fast -p codex-hepta-agentd --test optional_module_restart \
            --test runtime_shutdown_outcomes --test-threads=1
      - name: Exercise automation retirement and timer fencing
        id: automation_retirement
        if: ${{ !cancelled() && steps.fixture_identity.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --no-fail-fast -p codex-hepta-automation --test retirement_recovery \
            --test operation_timer_fence --test-threads=1
      - name: Exercise durable memory destination recovery
        id: memory_recovery
        if: ${{ !cancelled() && steps.fixture_identity.outcome == 'success' }}
        working-directory: codex-rs
        run: just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --no-fail-fast -p codex-hepta-memory --lib destination_recovery_binding --test-threads=1
      - name: Exercise named plasticity owner
        id: plasticity
        if: ${{ !cancelled() && steps.fixture_identity.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --no-fail-fast -p codex-hepta-agentd --lib \
            agentd_lifetime_owner_submits_restarts_and_reconciles_idempotently --test-threads=1
      - name: Exercise authenticated live runtime cutover
        id: runtime_cutover
        if: ${{ !cancelled() && steps.fixture_identity.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --no-fail-fast -p codex-hepta-runtime \
            authenticated_canary_forces_live_fault_then_rolls_forward_to_reconciled_predecessor_semantics --test-threads=1
      - name: Exercise writer admission
        id: writer_admission
        if: ${{ !cancelled() && steps.fixture_identity.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --no-fail-fast -p codex-hepta-agentd --features qualification-cognitive-write \
            --lib runtime::tests::qualification_ --test-threads=1
      - name: Exercise real daemon process suites
        id: daemon_e2e
        if: ${{ !cancelled() && steps.fixture_identity.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --no-fail-fast -p codex-hepta-agentd --features qualification-cognitive-write \
            --test cognitive_product_e2e --test plasticity_process_e2e \
            --test runtime_codex_product_e2e --test supervised_two_agents \
            --test supervisord_product_e2e --test queue_capacity_product --test-threads=1
      - name: Strict core and writer-profile owner lint independently of fixture success
        id: strict_lint
        if: ${{ !cancelled() && steps.execution.outputs.run_native == 'true' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-agentd --no-deps --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p codex-hepta-agentd --no-deps --all-targets --features qualification-cognitive-write -- -D warnings
      - name: Build exact qualified Agentd artifact
        id: qualified_build
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked -p codex-hepta-agentd --bin codex-hepta-agentd --features qualification-cognitive-write
          test -x "$HEPTA_AGENTD_QUAL_TARGET/debug/codex-hepta-agentd"
          test -x "$HEPTA_AGENTD_QUAL_TARGET/debug/codex-app-server"
      - name: Freeze exact source and binary qualification receipt
        id: qualification_receipt
        if: ${{ !cancelled() && steps.qualified_build.outcome == 'success' }}
        env:
          LANE: ${{ matrix.lane }}
          HOST_PLATFORM: ${{ matrix.os }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/runtime-agentd-qualification"
          python3 scripts/hepta_agentd_qualification_receipt.py \
            --out "$output" \
            --expected-sha "$EXPECTED_SHA" \
            --lane "$LANE" \
            --host-platform "$HOST_PLATFORM" \
            --artifact "codex-hepta-agentd=$HEPTA_AGENTD_QUAL_TARGET/debug/codex-hepta-agentd" \
            --artifact "codex-app-server=$HEPTA_AGENTD_QUAL_TARGET/debug/codex-app-server"
      - name: Check unchanged candidate after execution
        id: unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Reject missing skipped failed or changed qualification evidence
        if: always()
        env:
          AGENTD_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/hepta_agentd_receipt.py finish --directory "$RUNNER_TEMP/agentd-receipts" --binary "${HEPTA_TEST_CODEX_EXE:-/nonexistent}"
      - name: Retain exact identity binary digests and qualification outcomes on failure too
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: agentd-${{ matrix.os }}-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agentd-receipts/
            ${{ runner.temp }}/runtime-agentd-qualification/
          if-no-files-found: error
          retention-days: 30

  qualification-result:
    if: ${{ always() }}
    needs: [derived-projections, owner-formatting, catalog-admission, process-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require every applicable lane to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_NEEDS: '["derived-projections","owner-formatting","catalog-admission","process-qualification"]'
        run: python3 .github/scripts/check_ci_results.py
