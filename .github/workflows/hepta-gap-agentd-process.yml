name: Hepta Agentd process qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - CALLERS.toml
      - codex-rs/Cargo.lock
      - codex-rs/Cargo.toml
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-agent-protocol/**
      - codex-rs/hepta-cognitive-read/**
      - codex-rs/hepta-infer-core/**
      - codex-rs/hepta-infer-worker-host/**
      - codex-rs/hepta-fleet/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-supervisor/**
      - codex-rs/hepta-memory/**
      - codex-rs/hepta-plasticity/**
      - codex-rs/hepta-intelligence/**
      - codex-rs/hepta-learning-artifacts/**
      - codex-rs/hepta-learning-ledger/**
      - codex-rs/hepta-ndu/**
      - codex-rs/hepta-neuron/**
      - codex-rs/hepta-runtime/**
      - codex-rs/app-server/**
      - codex-rs/app-server-client/**
      - codex-rs/app-server-transport/**
      - codex-rs/uds/**
      - docs/modules/runtime.agentd/**
      - docs/modules/runtime.supervisor/**
      - qualification/module-execution-dossiers/detail/runtime.agentd.md
      - qualification/module-execution-dossiers/detail/runtime.supervisor.md
      - .github/scripts/check_ci_results.py
      - .github/scripts/verify_cargo_workspace_manifests.py
      - scripts/hepta-implementation-maps.py
      - scripts/hepta-module-docs.py
      - scripts/hepta-supervisor-validation.py
      - scripts/hepta_agentd_qualification_receipt.py
      - scripts/test_hepta_agentd_qualification_receipt.py
      - scripts/hepta_module_registry.py
      - scripts/test_hepta_agentd_ci.py
      - scripts/hepta_ci_candidate.py
      - scripts/hepta_ci_v8.py
      - scripts/hepta_workspace.py
      - scripts/test_hepta_workspace.py
      - .github/workflows/hepta-gap-agentd-process.yml
      - .github/workflows/runtime-supervisor-qualification.yml

permissions:
  contents: read

concurrency:
  group: hepta-agentd-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  derived-projections:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source ownership and generated projections
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-derived --check
          python3 scripts/hepta_module_registry.py --strict
          python3 scripts/hepta-implementation-maps.py verify
          python3 -m unittest -v scripts.tests.test_hepta_ci_candidate
          python3 -m unittest discover -v -s scripts -p 'test_hepta_agentd_ci.py'
          PYTHONPATH=scripts python3 -m unittest -v test_hepta_agentd_qualification_receipt

  owner-formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check owner formatting without mutation
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-agent-protocol --package codex-hepta-cognitive-read \
            --package codex-hepta-agentd --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host --package codex-hepta-fleet \
            --package codex-hepta-control-plane --package codex-hepta-automation \
            --package codex-hepta-supervisor -- --check

  catalog-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Exercise typed catalog and admission without daemon setup
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --locked --retries 0 --manifest-path Cargo.toml --lib \
            -p codex-hepta-fleet -p codex-hepta-control-plane \
            -p codex-hepta-agent-protocol --test-threads=2

  process-qualification:
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
        os: ${{ fromJSON('["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EXPECTED_SHA: ${{ matrix.lane == 'merge-candidate' && github.sha || github.event.pull_request.head.sha || github.sha }}
      RUST_BACKTRACE: "1"
      CARGO_BUILD_JOBS: "2"
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate and select tree-equivalent native execution
        id: execution
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          args=(--source "$SOURCE_SHA" --tested "$EXPECTED_SHA")
          if [ "$LANE" = merge-candidate ]; then
            expected_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
            args+=(--base "$BASE_SHA" --lane base-merge)
          else
            args+=(--lane source-head)
          fi
          python3 scripts/hepta_ci_candidate.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Check manifest graph before native setup
        if: steps.execution.outputs.run_native == 'true'
        run: python3 scripts/hepta_workspace.py
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.execution.outputs.run_native == 'true'
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve verified sandboxed V8 artifacts
        if: steps.execution.outputs.run_native == 'true'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Build exact core Agentd and App Server for native owner qualification
        id: native_build
        if: steps.execution.outputs.run_native == 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p codex-app-server --bin codex-app-server
          cargo build --locked -p codex-hepta-agentd --bin codex-hepta-agentd --no-default-features
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          cargo metadata --locked --all-features --filter-platform "$host" --format-version=1 > "$RUNNER_TEMP/hepta-nextest-metadata.json"
          target="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_directory"])' "$RUNNER_TEMP/hepta-nextest-metadata.json")"
          test -x "$target/debug/codex-app-server"
          test -x "$target/debug/codex-hepta-agentd"
          printf 'HEPTA_TEST_CODEX_EXE=%s/debug/codex-app-server\n' "$target" >> "$GITHUB_ENV"
          printf 'HEPTA_AGENTD_QUAL_TARGET=%s\n' "$target" >> "$GITHUB_ENV"
      - name: Exercise owner and lifecycle libraries
        if: ${{ !cancelled() && steps.execution.outputs.run_native == 'true' && steps.native_build.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 --lib -p codex-hepta-agentd -p codex-hepta-cognitive-read \
            -p codex-hepta-infer-core -p codex-hepta-infer-worker-host \
            -p codex-hepta-supervisor --test-threads=1
      - name: Exercise actual optional retirement and durable destination recovery
        if: ${{ !cancelled() && steps.execution.outputs.run_native == 'true' && steps.native_build.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd --test optional_module_restart \
            --test runtime_shutdown_outcomes --test-threads=1
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-automation --test retirement_recovery \
            --test operation_timer_fence --test-threads=1
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-memory --lib destination_recovery_binding --test-threads=1
      - name: Exercise named plasticity and live cutover paths
        if: ${{ !cancelled() && steps.execution.outputs.run_native == 'true' && steps.native_build.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd --lib \
            agentd_lifetime_owner_submits_restarts_and_reconciles_idempotently --test-threads=1
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-runtime \
            authenticated_canary_forces_live_fault_then_rolls_forward_to_reconciled_predecessor_semantics --test-threads=1
      - name: Exercise writer admission and real daemon process suites
        if: ${{ !cancelled() && steps.execution.outputs.run_native == 'true' && steps.native_build.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd --features qualification-cognitive-write \
            --lib runtime::tests::qualification_ --test-threads=1
          just test --cargo-metadata "$RUNNER_TEMP/hepta-nextest-metadata.json" --locked --retries 0 -p codex-hepta-agentd --features qualification-cognitive-write \
            --test cognitive_product_e2e --test plasticity_process_e2e \
            --test runtime_codex_product_e2e --test supervised_two_agents \
            --test supervisord_product_e2e --test queue_capacity_product --test-threads=1
      - name: Strict core and writer-profile owner lint
        if: ${{ !cancelled() && steps.execution.outputs.run_native == 'true' && steps.native_build.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-agentd --no-deps --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p codex-hepta-agentd --no-deps --all-targets --features qualification-cognitive-write -- -D warnings
      - name: Build exact qualified Agentd artifact
        id: qualified_build
        if: steps.execution.outputs.run_native == 'true' && steps.native_build.outcome == 'success'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked -p codex-hepta-agentd --bin codex-hepta-agentd --features qualification-cognitive-write
          test -x "$HEPTA_AGENTD_QUAL_TARGET/debug/codex-hepta-agentd"
          test -x "$HEPTA_AGENTD_QUAL_TARGET/debug/codex-app-server"
      - name: Freeze exact source and binary qualification receipt
        id: qualification_receipt
        if: steps.qualified_build.outcome == 'success'
        env:
          LANE: ${{ matrix.lane }}
          HOST_PLATFORM: ${{ matrix.os }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/runtime-agentd-qualification"
          python3 scripts/hepta_agentd_qualification_receipt.py \
            --out "$output" \
            --expected-sha "$EXPECTED_SHA" \
            --lane "$LANE" \
            --host-platform "$HOST_PLATFORM" \
            --artifact "codex-hepta-agentd=$HEPTA_AGENTD_QUAL_TARGET/debug/codex-hepta-agentd" \
            --artifact "codex-app-server=$HEPTA_AGENTD_QUAL_TARGET/debug/codex-app-server"
      - name: Retain exact Agentd qualification artifacts
        if: steps.qualification_receipt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-agentd-${{ matrix.os }}-${{ matrix.lane }}-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/runtime-agentd-qualification
          if-no-files-found: error
          retention-days: 30
      - name: Check unchanged candidate after execution
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  qualification-result:
    if: ${{ always() }}
    needs: [derived-projections, owner-formatting, catalog-admission, process-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require every applicable lane to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_NEEDS: '["derived-projections","owner-formatting","catalog-admission","process-qualification"]'
        run: python3 .github/scripts/check_ci_results.py
