name: Hepta Agentd process qualification

on:
  push:
    branches:
      - main
      # Keep exact source execution available while the existing convergence
      # PR has no GitHub prospective merge. This never substitutes for merge CI.
      - work/architecture-scalability-convergence-20260918
  pull_request:
    paths:
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-fleet/**
      - codex-rs/hepta-control-plane/**
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-operations/**
      - codex-rs/hepta-supervisor/**
      - codex-rs/hepta-memory/**
      - codex-rs/app-server/**
      - codex-rs/app-server-client/**
      - codex-rs/app-server-transport/**
      - codex-rs/uds/**
      - docs/modules/MODULES.json
      - scripts/hepta_workspace.py
      - scripts/test_hepta_workspace.py
      - .github/workflows/hepta-gap-agentd-process.yml

permissions:
  contents: read

concurrency:
  group: hepta-agentd-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-admission:
    name: Runtime catalog admission (${{ matrix.candidate }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","merge-candidate"]' || '["source-head"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.candidate == 'source-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact catalog and lifecycle candidate
        env:
          EXPECTED_SHA: ${{ matrix.candidate == 'source-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree}
      - name: Check owner formatting before compilation
        run: cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-fleet --package codex-hepta-control-plane -- --check
      - name: Execute catalog and component lifecycle regressions
        id: native
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-fleet -p codex-hepta-control-plane --lib
      - name: Retain offline lock-resolution diagnostics without testing modified source
        if: failure() && steps.native.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-lock-diagnostics"
          trap 'git restore --source=HEAD --worktree -- codex-rs/Cargo.lock' EXIT
          set +e
          cargo generate-lockfile --offline --manifest-path codex-rs/Cargo.toml >"$RUNNER_TEMP/hepta-lock-diagnostics/resolver.log" 2>&1
          resolver_status=$?
          set -e
          printf 'offline_resolution_exit=%s\n' "$resolver_status"
          cat "$RUNNER_TEMP/hepta-lock-diagnostics/resolver.log"
          git diff -- codex-rs/Cargo.lock >"$RUNNER_TEMP/hepta-lock-diagnostics/Cargo.lock.patch"
          cat "$RUNNER_TEMP/hepta-lock-diagnostics/Cargo.lock.patch"
          if [ "$resolver_status" -eq 0 ]; then
            cp codex-rs/Cargo.lock "$RUNNER_TEMP/hepta-lock-diagnostics/Cargo.lock.proposed"
          fi
          # The native step remains failed. These bytes are only a repair
          # proposal and are never compiled, tested, selected or pushed here.
      - name: Retain failed-resolution evidence
        if: failure() && steps.native.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-lock-diagnostic-${{ matrix.candidate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-lock-diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Verify source remained unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code

  process-qualification:
    # Small owner checks fail before V8 and full host builds. These do not
    # replace the process, recovery, writer, retirement or lint suites below.
    needs: catalog-admission
    strategy:
      fail-fast: false
      matrix:
        # The additional convergence push checks Linux source only. Existing
        # PR merge and main checks retain both platforms rather than duplicating
        # the complete matrix for the same source notification.
        os: ${{ fromJSON(github.event_name == 'push' && github.ref != 'refs/heads/main' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: "1"
      RUST_LOG: "info"
      # Darwin pathname AF_UNIX sockets require a short test-owned temp root.
      # This does not weaken the production layout or its permission checks.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD HEAD^{tree}

      - name: Fail fast on manifest and formatting errors
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta_workspace.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-agentd --package codex-hepta-fleet --package codex-hepta-control-plane --package codex-hepta-automation -- --check

      - name: Install repository test entry point
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Resolve verified sandboxed V8 artifacts before Rust execution
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Exercise local fences, reconciliation and organ lifecycle
        working-directory: codex-rs
        run: just test --locked --lib -p codex-hepta-fleet -p codex-hepta-control-plane -p codex-hepta-agentd

      - name: Exercise real optional-service restart and shutdown outcomes
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # --lib above does not discover integration targets. These use real
          # OS processes and the existing SQLite owner, not catalog counters.
          cargo test --locked -p codex-hepta-agentd \
            --test optional_module_restart --test runtime_shutdown_outcomes \
            -- --nocapture --test-threads=1

      - name: Exercise durable retirement and stale-writer rejection
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-automation --test retirement_recovery --test operation_timer_fence

      - name: Exercise destination recovery identity and payload binding
        working-directory: codex-rs
        run: just test --locked -p codex-hepta-operations --test destination_recovery_binding

      - name: Execute local writer qualification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            runtime::tests::qualification_ -- --nocapture --test-threads=1

      - name: Execute real Agentd/App Server process suite
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            --test cognitive_product_e2e -- --nocapture --test-threads=1

      - name: Strict Agentd lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # Other dependency crates retain their own lint gates.
          cargo clippy --locked -p codex-hepta-agentd --no-deps \
            --all-targets --features qualification-cognitive-write -- -D warnings

      - name: Clean source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
