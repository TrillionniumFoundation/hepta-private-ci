name: Preserve learning.eval recorded runner API

on:
  push:
    branches:
      - fix/learning-eval-full-convergence-20260926

permissions:
  contents: write

concurrency:
  group: learning-eval-api-followup
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: fix/learning-eval-full-convergence-20260926
      - name: Preserve compiler-enforced public facade
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/hepta-intelligence-eval/src/lib.rs')
          text = path.read_text()
          replacements = {
              '#[cfg(feature = "trusted-inprocess-eval")]\npub use product_runner::ProductMetricSourceContractV1;\n#[cfg(not(feature = "trusted-inprocess-eval"))]\npub(crate) use product_runner::ProductMetricSourceContractV1;\n': 'pub use product_runner::ProductMetricSourceContractV1;\n',
              '#[cfg(feature = "trusted-inprocess-eval")]\npub use recorded_runner::RecordedProductEvaluationRunnerV1;\n#[cfg(not(feature = "trusted-inprocess-eval"))]\npub(crate) use recorded_runner::RecordedProductEvaluationRunnerV1;\n': 'pub use recorded_runner::RecordedProductEvaluationRunnerV1;\n',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
          if changed:
              path.write_text(text)
              Path('.github/workflows/learning-eval-api-followup.yml').unlink()
              Path('/tmp/learning-eval-followup-changed').write_text('yes')
          PY
          if [[ -f /tmp/learning-eval-followup-changed ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --check
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit corrected facade
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-ci"
          git config user.email "hepta-ci@users.noreply.github.com"
          git add codex-rs/hepta-intelligence-eval/src/lib.rs .github/workflows/learning-eval-api-followup.yml
          git commit -m "Preserve learning.eval recorded runner public facade"
          git push origin HEAD:fix/learning-eval-full-convergence-20260926
