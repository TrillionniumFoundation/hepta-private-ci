name: Hepta Lane E holdout semantic binding repair

on:
  push:
    branches:
      - codex/hepta-lane-e-gap-closure-20260910
    paths:
      - .github/workflows/hepta-lane-e-holdout-binding-fix.yml

permissions:
  contents: write

concurrency:
  group: hepta-lane-e-holdout-binding-fix
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Apply reviewed semantic repair
        shell: bash
        env:
          PATCH_PROGRAM_ZLIB_B64: >-
            
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import zlib

          program = zlib.decompress(
              base64.b64decode(os.environ["PATCH_PROGRAM_ZLIB_B64"])
          ).decode("utf-8")
          exec(compile(program, "hepta-lane-e-holdout-binding-fix.py", "exec"))
          PY
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification
          git diff --check

      - name: Verify semantic repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          cd codex-rs
          cargo check --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets
          cargo test --locked \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            -- --nocapture
          cargo clippy --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets -- -D warnings

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-lane-e-holdout-binding-fix.yml
          git add -A
          git diff --cached --check
          git config user.name hepta-lane-e-bot
          git config user.email hepta-lane-e-bot@users.noreply.github.com
          git commit -m 'fix(lane-e): bind holdout use to frozen plan semantics'
          git push origin HEAD:codex/hepta-lane-e-gap-closure-20260910
