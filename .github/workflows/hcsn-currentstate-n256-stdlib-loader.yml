name: hcsn-currentstate-n256-stdlib-loader

on:
  pull_request:
    paths:
      - ".github/workflows/hcsn-currentstate-n256-stdlib-loader.yml"
      - "qualification/hcsn_currentstate_n256_stdlib_loader/**"
      - "qualification/hcsn_n256_new_export/evidence/attempt001/N256_STATE.json"
      - "qualification/hcsn_n256_new_export/evidence/attempt001/N256_PHASE.json"
      - "qualification/hcsn_n256_new_export/evidence/attempt001/N256_STATE.npz.b64"

permissions:
  contents: read

jobs:
  source-and-authentic-input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assertions-enabled authentic N256 loader fixtures
        run: python3 -m unittest qualification.hcsn_currentstate_n256_stdlib_loader.test_loader
      - name: Optimized-mode authentic N256 loader fixtures
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_stdlib_loader.test_loader
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_stdlib_loader/*.py
      - name: Verify frozen source and fail-closed gates
        run: python3 qualification/hcsn_currentstate_n256_stdlib_loader/verify_source.py
