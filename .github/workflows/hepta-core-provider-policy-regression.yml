name: Hepta Core Provider Terminal Policy Regression

on:
  push:
    branches:
      - fix/core-provider-policy-test-context-20261012
  pull_request:
    paths:
      - codex-rs/core/src/client_provider_policy_tests.rs
      - codex-rs/core/src/client.rs
      - .github/workflows/hepta-core-provider-policy-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-provider-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Rust 1.95 formatter and Clippy
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Verify exact Rust formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Execute real provider terminal-policy and streaming acknowledgement tests
        run: cargo +1.95.0 test --locked -p codex-core --lib client_provider_policy_tests -- --nocapture
      - name: Strict core library and test lint
        run: cargo +1.95.0 clippy --locked -p codex-core --lib --tests -- -D warnings
