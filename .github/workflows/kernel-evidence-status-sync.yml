name: Kernel evidence canonical status sync

on:
  push:
    branches:
      - fix/kernel-evidence-production-closure

permissions:
  contents: write

concurrency:
  group: kernel-evidence-status-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: ${{ !contains(github.event.head_commit.message, '[kernel-evidence-status-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/kernel-evidence-production-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate and verify canonical projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kernel_evidence_status.py sync
          python3 scripts/kernel_evidence_status.py verify
          git diff --check

      - name: Commit deterministic projections
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/modules/kernel.evidence/TECHNICAL.md \
            docs/lane-a-foundation/kernel.evidence/CURRENT_IMPLEMENTATION.md \
            qualification/kernel-evidence/TRACEABILITY.md \
            qualification/module-execution-dossiers/detail/kernel.evidence.md \
            qualification/kernel-evidence/RELEASE_DASHBOARD.md
          if git diff --cached --quiet; then
            echo "Canonical projections already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(kernel.evidence): regenerate canonical status [kernel-evidence-status-sync]"
          git push origin HEAD:fix/kernel-evidence-production-closure
