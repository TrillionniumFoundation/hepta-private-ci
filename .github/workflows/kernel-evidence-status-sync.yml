name: Kernel evidence canonical status sync

on:
  push:
    branches:
      - fix/kernel-evidence-production-closure
      - codex/kernel-evidence-full-convergence-20260929

permissions:
  contents: write

concurrency:
  group: kernel-evidence-status-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: ${{ !contains(github.event.head_commit.message, '[kernel-evidence-status-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact triggering branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind writable synchronization target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = branch
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            fix/kernel-evidence-production-closure|codex/kernel-evidence-full-convergence-20260929) ;;
            *) echo "refusing unexpected status-sync branch: $GITHUB_REF_NAME" >&2; exit 2 ;;
          esac
          test -z "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Regenerate canonical projections and derived indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kernel_evidence_status.py sync
          python3 scripts/kernel_evidence_status.py verify
          python3 scripts/hepta-module-docs.py refresh-indexes
          git diff --check

      - name: Commit deterministic projection state
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/modules/MODULE_DOCS.json \
            qualification/module-execution-dossiers/DETAILS.json \
            docs/modules/kernel.evidence/TECHNICAL.md \
            docs/lane-a-foundation/kernel.evidence/CURRENT_IMPLEMENTATION.md \
            qualification/kernel-evidence/TRACEABILITY.md \
            qualification/module-execution-dossiers/detail/kernel.evidence.md \
            qualification/kernel-evidence/RELEASE_DASHBOARD.md
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          if ! git diff --cached --quiet; then
            git commit -m "docs(kernel.evidence): regenerate canonical status [kernel-evidence-status-sync]"
          fi
          test -z "$(git status --porcelain)"

      - name: Rebind map on the clean projection commit and verify closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate --module kernel.evidence
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/kernel_evidence_status.py verify
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
          python3 scripts/verify_lane_a_foundation.py verify
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', '-z'], text=True
          ).split('\0')))
          expected = {'docs/modules/kernel.evidence/IMPLEMENTATION_MAP.json'}
          if changed not in (set(), expected):
              raise SystemExit(
                  f'implementation-map migration changed {sorted(changed)}, expected only {sorted(expected)}'
              )
          PY
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit map, reverify final tree, and push atomically
        shell: bash
        run: |
          set -euo pipefail
          git add docs/modules/kernel.evidence/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(kernel.evidence): bind converged implementation map [kernel-evidence-status-sync]"
          fi
          test -z "$(git status --porcelain)"
          python3 scripts/hepta-implementation-maps.py verify
          python3 scripts/kernel_evidence_status.py verify
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
          python3 scripts/verify_lane_a_foundation.py verify
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse "$GITHUB_SHA")" = "$(git rev-parse FETCH_HEAD)"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
