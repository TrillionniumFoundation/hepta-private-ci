name: Matrix real Synapse qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/hepta-matrix-protocol/**"
      - "codex-rs/hepta-matrix-sdk/**"
      - "codex-rs/hepta-matrix-store/**"
      - "codex-rs/hepta-matrixd/**"
      - ".github/workflows/hepta-matrix-real-synapse.yml"

permissions:
  contents: read

concurrency:
  group: matrix-real-synapse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-synapse:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/matrix-candidate-sha"
      - name: Run hermetic real Synapse qualification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matrix-real-synapse"
          codex-rs/hepta-matrixd/tests/fixtures/run-hermetic-synapse.sh \
            --source-root "$GITHUB_WORKSPACE" \
            --source-mode exact \
            --artifacts-dir "$RUNNER_TEMP/matrix-real-synapse"
      - name: Bind qualification receipt to exact candidate
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/matrix-candidate-sha")" = "$EXPECTED_SHA"
          find "$RUNNER_TEMP/matrix-real-synapse" -type f -maxdepth 2 -print -exec sha256sum {} \;
