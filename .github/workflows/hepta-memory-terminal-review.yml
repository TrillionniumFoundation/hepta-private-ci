name: MemoryCell native terminal recovery review
on:
  pull_request:
    paths:
      - '.github/workflows/hepta-memory-terminal-review.yml'
permissions:
  contents: read
jobs:
  native-terminal:
    if: github.event.pull_request.number == 1452 && github.head_ref == 'codex/memory-cell-evidence-20261008' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest
      - name: Prepare bounded native recovery candidate; never update main or PR head
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-terminal-review
          git fetch --no-tags --depth=1 origin 9a39f5bb2b353d0c678bf45cad65d8115882c5b8
          git diff --exit-code 9a39f5bb2b353d0c678bf45cad65d8115882c5b8 HEAD -- codex-rs/hepta-infer-worker-host
          python3 - <<'PY'
          from pathlib import Path
          p = Path('codex-rs/hepta-infer-worker-host/src/native_app_server.rs')
          s = p.read_text()
          old = '''                    output.status = NativeRunStatus::Indeterminate;
                              output.boundary_status = NativeBoundaryStatus::Indeterminate;'''.replace('                              ', '                    ')
          assert s.count(old) == 1
          s = s.replace(old, '''                    // Preserve the authenticated physical terminal observation. Missing
                              // content denies success; it does not make that observed event
                              // disappear or violate the durable terminal/status invariant.
                              output.boundary_status = NativeBoundaryStatus::Quarantined;'''.replace('                              ', '                    '))
          needle = '''                .ok_or_else(|| "turn/completed did not produce terminal receipt".to_string())?;
                      let physical_boundary'''
          assert s.count(needle) == 1
          replacement = '''                .ok_or_else(|| "turn/completed did not produce terminal receipt".to_string())?;
                      // App Server may deliver the last assistant message in the verified
                      // terminal summary without any AgentMessageDelta (for example a
                      // provider output_item.done-only stream). Consume only this exact
                      // authenticated turn, after transport/correlation verification.
                      let terminal_message = if receipt.status == AdapterStatus::Succeeded
                          && output.output.trim().is_empty()
                      {
                          let mut message = String::new();
                          for item in &completed.turn.items {
                              if let ThreadItem::AgentMessage { text, .. } = item {
                                  if text.len() > MAX_OUTPUT_BYTES.saturating_sub(message.len()) {
                                      return Err("terminal summary exceeds output byte budget".to_string());
                                  }
                                  message.push_str(text);
                              }
                          }
                          Some(message)
                      } else {
                          None
                      };
                      let physical_boundary'''
          s = s.replace(needle, replacement)
          needle = '''            output.terminal_observed = true;
                      downgrade_for_owner_loss(output);'''
          assert s.count(needle) == 1
          s = s.replace(needle, '''            if let Some(message) = terminal_message {
                          output.output = message;
                      }
                      output.terminal_observed = true;
                      downgrade_for_owner_loss(output);''')
          s = s.replace('&& output.output.is_empty()', '&& output.output.trim().is_empty()')
          p.write_text(s)
          p = Path('codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs')
          s = p.read_text()
          assert 'terminal_summary_recovers_missing_delta_without_a_second_turn' not in s
          s += '''
          #[test]
          fn terminal_summary_recovers_missing_delta_without_a_second_turn() {
              let mut output = output();
              let mut event = terminal("thread-a", "turn-a", TurnStatus::Completed);
              if let ServerNotification::TurnCompleted(ref mut notification) = event {
                  notification.turn.items_view = TurnItemsView::Summary;
                  notification.turn.items.push(ThreadItem::AgentMessage {
                      id: "message-final".to_string(),
                      text: "verified complete answer".to_string(),
                      phase: None,
                      memory_citation: None,
                      delivery: None,
                  });
              }
              assert!(observe_for_test(&mut output, event.clone()).unwrap());
              assert_eq!(output.output, "verified complete answer");
              assert_eq!(output.status, NativeRunStatus::Completed);
              assert!(output.terminal_observed);
              assert_eq!(output.owner_authority, NativeOwnerAuthority::Unverified);
              assert!(!output.succeeded());
              // A duplicate summary must not concatenate the same answer again.
              let before = output.clone();
              assert!(observe_for_test(&mut output, event).unwrap());
              assert_eq!(output, before);
          }

          #[test]
          fn terminal_summary_rejects_oversize_and_foreign_transport_before_mutation() {
              let mut event = terminal("thread-a", "turn-a", TurnStatus::Completed);
              if let ServerNotification::TurnCompleted(ref mut notification) = event {
                  notification.turn.items.push(ThreadItem::AgentMessage {
                      id: "message-final".to_string(),
                      text: "x".repeat(MAX_OUTPUT_BYTES + 1),
                      phase: None,
                      memory_citation: None,
                      delivery: None,
                  });
              }
              let mut output = output();
              let before = output.clone();
              assert!(observe_for_test(&mut output, event.clone()).is_err());
              assert_eq!(output, before);
              let foreign = RemoteAppServerObservedEvent::from_test_event(
                  AppServerEvent::ServerNotification(Box::new(event)),
                  8,
                  Some("test-app-server".to_string()),
                  Some("/home/agent".to_string()),
              );
              assert!(observe_event(&mut output, &foreign, &binding()).is_err());
              assert_eq!(output, before);
          }

          #[test]
          fn terminal_summary_does_not_duplicate_streamed_content_or_restore_lost_authority() {
              let mut output = output();
              output.output = "already streamed".to_string();
              output.owner_authority = NativeOwnerAuthority::Lost { reason: "revoked".to_string() };
              let mut event = terminal("thread-a", "turn-a", TurnStatus::Completed);
              if let ServerNotification::TurnCompleted(ref mut notification) = event {
                  notification.turn.items.push(ThreadItem::AgentMessage {
                      id: "message-final".to_string(),
                      text: "last message summary".to_string(),
                      phase: None,
                      memory_citation: None,
                      delivery: None,
                  });
              }
              assert!(observe_for_test(&mut output, event).unwrap());
              assert_eq!(output.output, "already streamed");
              assert_eq!(output.status, NativeRunStatus::Completed);
              assert_eq!(output.boundary_status, NativeBoundaryStatus::Quarantined);
              assert!(output.terminal_observed);
              assert!(!output.succeeded());
          }
          '''
          p.write_text(s)
          PY
          python3 -m pip install uv==0.8.22
          just fmt --base 9a39f5bb2b353d0c678bf45cad65d8115882c5b8
          git add codex-rs/hepta-infer-worker-host/src/native_app_server.rs codex-rs/hepta-infer-worker-host/src/native_app_server_tests.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(inference): consume authenticated terminal summaries without losing terminal truth'
          git rev-parse HEAD > /tmp/native-terminal-review/tested-commit.txt
          git diff 9a39f5bb2b353d0c678bf45cad65d8115882c5b8 HEAD --binary -- codex-rs/hepta-infer-worker-host > /tmp/native-terminal-review/implementation.patch
          git archive --format=tar.gz HEAD codex-rs/hepta-infer-worker-host/src > /tmp/native-terminal-review/sources.tar.gz
          git push origin "HEAD:refs/heads/codex/memory-terminal-${GITHUB_RUN_ID}"
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Run actual native owner regression and terminal-summary negative tests
        run: |
          set -euo pipefail
          just test -p codex-hepta-infer-worker-host 2>&1 | tee /tmp/native-terminal-review/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-native-terminal-review
          path: /tmp/native-terminal-review
          if-no-files-found: error
