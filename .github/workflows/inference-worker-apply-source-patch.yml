name: Apply inference worker source hardening

on:
  push:
    branches:
      - codex/inference-worker-hardening-v1
    paths:
      - scripts/apply_inference_worker_hardening.py
      - .github/workflows/inference-worker-apply-source-patch.yml

permissions:
  contents: write

concurrency:
  group: inference-worker-source-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/inference-worker-hardening-v1
          fetch-depth: 0
      - name: Apply exact predecessor-bound edits
        run: python3 scripts/apply_inference_worker_hardening.py
      - name: Format affected Rust owners
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml \
            --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host
      - name: Verify patch scope
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
      - name: Commit exact patch
        env:
          BRANCH: codex/inference-worker-hardening-v1
        run: |
          set -euo pipefail
          git config user.name "Hepta inference worker CI"
          git config user.email "hepta-inference-worker-ci@users.noreply.github.com"
          git add \
            codex-rs/hepta-infer-core/src/native_control.rs \
            codex-rs/hepta-infer-worker-host/src/lib.rs \
            codex-rs/hepta-infer-worker-host/src/native_app_server.rs \
            codex-rs/hepta-infer-worker-host/src/native_run_control.rs \
            codex-rs/hepta-infer-worker-host/src/bin/hepta-infer-worker.rs \
            codex-rs/hepta-infer-worker-host/src/experimental_local
          git commit -m "inference.worker: integrate recovery policy and durable projections"
          git push origin "HEAD:${BRANCH}"
