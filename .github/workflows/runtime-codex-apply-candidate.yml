name: runtime.codex apply reviewed candidate

on:
  push:
    branches: [fix/runtime-codex-owner-recovery-20260928]
    paths:
      - .github/workflows/runtime-codex-apply-candidate.yml
      - qualification/runtime-codex-remediation/input.patch.*.b64

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/fix/runtime-codex-owner-recovery-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and apply only the reviewed bounded patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = '40edf6b03b29aa085a5efef9ce7b9a3b02c07b80'
          test "$(git ls-remote origin refs/heads/fix/runtime-codex-owner-recovery-20260928 | cut -f1)" = "$EXPECTED_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root=pathlib.Path('qualification/runtime-codex-remediation')
          encoded=b''.join((root/f'input.patch.{n}.b64').read_bytes() for n in (1,2,3))
          assert len(encoded)==39560
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==139343
          assert hashlib.sha256(patch).hexdigest()=='e25ef4eab900953fa647aff0d735cf7b8ec4f3466a431207d1575dc9626572e1'
          p=pathlib.Path('/tmp/runtime-codex-reviewed.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          PY
          git add -N codex-rs/hepta-agent-protocol codex-rs/hepta-agentd codex-rs/hepta-infer-core codex-rs/hepta-infer-worker-host
      - name: Format the actual changed native modules
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed=('codex-rs/hepta-agent-protocol/','codex-rs/hepta-agentd/','codex-rs/hepta-infer-core/','codex-rs/hepta-infer-worker-host/')
          assert paths and all(p.startswith(allowed) for p in paths)
          for path in paths:
              if path.endswith('.rs'):
                  subprocess.run(['rustup','run','1.95.0','rustfmt','--edition','2024','--config-path','codex-rs/rustfmt.toml',path],check=True)
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p.startswith(allowed) for p in paths)
          PY
          git diff --check
      - name: Publish only to the existing remediation branch
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/runtime-codex-owner-recovery-20260928 | cut -f1)" = "$EXPECTED_HEAD"
          git add codex-rs/hepta-agent-protocol codex-rs/hepta-agentd codex-rs/hepta-infer-core codex-rs/hepta-infer-worker-host
          git -c user.name='runtime.codex remediation' -c user.email='runtime-codex@users.noreply.github.com' commit -m 'runtime.codex: persist owner effect arbitration and abort outbox'
          git push origin HEAD:refs/heads/fix/runtime-codex-owner-recovery-20260928
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/runtime-codex-applied"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/runtime-codex-applied/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-codex-applied/head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/runtime-codex-applied/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-codex-applied-source
          path: ${{ runner.temp }}/runtime-codex-applied/*
          if-no-files-found: error
          retention-days: 14
  native-core:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.apply.outputs.candidate }}
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Execute actual native journal tests
        working-directory: codex-rs
        run: python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/runtime-codex-core/tests.json" -- just test --locked -p codex-hepta-infer-core --no-tests=fail
      - name: Strict native journal lint
        if: always()
        working-directory: codex-rs
        run: python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/runtime-codex-core/clippy.json" -- cargo clippy --locked -p codex-hepta-infer-core --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-codex-core-native-records
          path: ${{ runner.temp }}/runtime-codex-core/*
          if-no-files-found: error
          retention-days: 30
  native-product:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source-head, synthetic-merge]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      SOURCE_SHA: ${{ needs.apply.outputs.candidate }}
      BASE_SHA: a126987b84737dbc2ee2592442a314117bddb4a2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind deterministic candidate
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LANE" == synthetic-merge ]]; then
            tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
            export GIT_AUTHOR_NAME='runtime.codex qualification' GIT_COMMITTER_NAME='runtime.codex qualification'
            export GIT_AUTHOR_EMAIL='qualification@invalid.example' GIT_COMMITTER_EMAIL='qualification@invalid.example'
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' GIT_COMMITTER_DATE='2000-01-01T00:00:00Z'
            candidate="$(printf 'runtime.codex deterministic candidate\n' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            git checkout --detach "$candidate"
          fi
          mkdir -p "$RUNNER_TEMP/runtime-codex-product"
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-codex-product/head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/runtime-codex-product/tree.txt"
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev bubblewrap
      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Execute owner crash, adapter, host and product suites
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/runtime-codex-product/tests.json" --
          just test --locked -p codex-hepta-agentd -p codex-hepta-infer-worker-host -p codex-hepta-codex-adapter -p codex-hepta-agent-protocol --no-tests=fail
          -E 'package(codex-hepta-infer-worker-host) or package(codex-hepta-codex-adapter) or package(codex-hepta-agent-protocol) or test(codex_effect) or binary(runtime_codex_product_e2e)'
      - name: Strict focused lint
        if: always()
        working-directory: codex-rs
        run: >-
          python3 ../scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/runtime-codex-product/clippy.json" --
          cargo clippy --locked -p codex-hepta-agentd -p codex-hepta-infer-worker-host -p codex-hepta-codex-adapter -p codex-hepta-agent-protocol --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-codex-product-${{ matrix.lane }}
          path: ${{ runner.temp }}/runtime-codex-product/*
          if-no-files-found: error
          retention-days: 30
