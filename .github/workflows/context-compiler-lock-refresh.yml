name: context.compiler lock refresh

on:
  push:
    branches:
      - "codex/context-compiler-provider-closure-final-20260927"
    paths:
      - "codex-rs/**"
      - ".github/workflows/context-compiler-lock-refresh.yml"

permissions:
  contents: read

concurrency:
  group: context-compiler-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Generate lockfile from candidate manifests
        working-directory: codex-rs
        run: cargo metadata --format-version 1 > /dev/null

      - name: Verify generated lockfile resolves the focused crate
        id: focused-check
        continue-on-error: true
        working-directory: codex-rs
        run: cargo check -p codex-hepta-context-compiler --tests

      - name: Record deterministic lockfile diff
        run: git diff --check -- codex-rs/Cargo.lock

      - name: Package exact candidate workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude='*/target' \
            --exclude='context-compiler-candidate.tar.gz' \
            -czf context-compiler-candidate.tar.gz .

      - name: Upload generated lockfile and exact workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-compiler-generated-candidate
          path: |
            codex-rs/Cargo.lock
            context-compiler-candidate.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Enforce focused compilation result
        if: always()
        shell: bash
        run: test "${{ steps.focused-check.outcome }}" = success
