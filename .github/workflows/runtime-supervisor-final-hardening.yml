name: runtime.supervisor final hardening

on:
  push:
    branches:
      - codex/runtime-supervisor-final-hardening-20260928
  pull_request:
    paths:
      - codex-rs/hepta-supervisor/**
      - codex-rs/hepta-daemon/**
      - docs/modules/runtime.supervisor/**
      - .github/workflows/runtime-supervisor-final-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-supervisor-final-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    name: Materialize and gate final hardening
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect patch payload
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/runtime-supervisor-final-hardening.py; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Rust toolchain
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"

      - name: Apply source and documentation patch
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/runtime-supervisor-final-hardening.py
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

      - name: Run exact materialized gates
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime-supervisor-logs
          run_gate() {
            local name="$1"; shift
            echo "::group::$name"
            if "$@" >".runtime-supervisor-logs/${name}.log" 2>&1; then
              tail -n 80 ".runtime-supervisor-logs/${name}.log" || true
            else
              status=$?
              echo "gate failed: $name (exit $status)"
              tail -n 240 ".runtime-supervisor-logs/${name}.log" || true
              echo "::endgroup::"
              exit "$status"
            fi
            echo "::endgroup::"
          }
          run_gate fmt cargo fmt --manifest-path codex-rs/Cargo.toml --all --check
          run_gate supervisor-default cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor
          run_gate supervisor-qualification cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --features qualification
          run_gate supervisor-production-authority cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --features production-authority
          run_gate supervisor-all-features cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --all-features
          run_gate daemon cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-daemon
          run_gate clippy cargo clippy --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --all-targets --all-features -- -D warnings

      - name: Commit only after gates pass
        if: steps.patch.outputs.present == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runtime-supervisor-final-hardening.py
          git diff --check
          git config user.name 'openai-runtime-supervisor'
          git config user.email 'runtime-supervisor@users.noreply.github.com'
          git add \
            codex-rs/hepta-supervisor/src \
            docs/modules/runtime.supervisor \
            .github/workflows/runtime-supervisor-final-hardening.yml \
            .github/runtime-supervisor-final-hardening.py
          git commit -m 'feat(runtime.supervisor): close recovery diagnostics and evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  exact-head-linux:
    needs: materialize
    name: Exact head Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Detect committed candidate
        id: exact
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/runtime-supervisor-final-hardening.py; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Rust toolchain
        if: steps.exact.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"
      - name: Run exact-head Linux matrix
        if: steps.exact.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --all --check
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --features qualification
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --features production-authority
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --all-features
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-daemon
          cargo clippy --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --all-targets --all-features -- -D warnings
          test -z "$(git status --porcelain)"

  exact-head-macos:
    needs: materialize
    name: Exact head macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Detect committed candidate
        id: exact
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/runtime-supervisor-final-hardening.py; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Rust toolchain
        if: steps.exact.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"
      - name: Run exact-head macOS host matrix
        if: steps.exact.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --all --check
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --all-features
          cargo clippy --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --all-targets --all-features -- -D warnings
          test -z "$(git status --porcelain)"
