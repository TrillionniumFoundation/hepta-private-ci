name: learning.artifacts convergence materializer

on:
  push:
    branches:
      - work/learning-artifacts-convergence-20260929

permissions:
  contents: write

concurrency:
  group: learning-artifacts-convergence-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[learning-artifacts-materialized]')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact convergence branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: work/learning-artifacts-convergence-20260929
          persist-credentials: true

      - name: Update delivery model without advancing external claims
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          map_path = Path('docs/modules/learning.artifacts/IMPLEMENTATION_MAP.json')
          mapping = json.loads(map_path.read_text(encoding='utf-8'))
          if mapping.get('module') != 'learning.artifacts':
              raise SystemExit('unexpected implementation map')

          operations = {row['operation']: row for row in mapping['operations']}

          def bind(name, symbol, path, tests, state='source_implemented'):
              operations[name] = {
                  'operation': name,
                  'nativeSymbol': symbol,
                  'sourcePath': path,
                  'state': state,
                  'authority': 'none',
                  'tests': tests,
                  'sourcePathExists': True,
                  'designOperation': name,
                  'mappingClass': 'owner_native',
                  'delegatedCallees': [],
                  'sourceBlob': '0' * 40,
              }

          bind(
              'canonical_publication_request_identity',
              'RequestIdentityVerifier::verify',
              'codex-rs/hepta-learning-artifacts/src/owner/request_identity.rs',
              ['codex-rs/hepta-learning-artifacts/src/owner_service_tests.rs::named_owner_service_publishes_retries_and_reopens_from_current_head'],
              'product_writer_service_composed',
          )
          bind(
              'durable_withdrawal_floor',
              'LearningArtifactOwnerService::install_withdrawal_frontier',
              'codex-rs/hepta-learning-artifacts/src/owner/durable_withdrawals.rs',
              [],
              'product_writer_service_composed_native_qualification_pending',
          )
          bind(
              'durable_shutdown_reconciliation',
              'DurableInstrumentedLearningArtifactReferenceHostV1::open',
              'codex-rs/hepta-learning-artifacts/src/owner/durable_host.rs',
              [],
              'product_writer_service_composed_native_qualification_pending',
          )
          bind(
              'actionable_failure_taxonomy',
              'LearningArtifactOwnerServiceError::failure_class',
              'codex-rs/hepta-learning-artifacts/src/owner/operational.rs',
              ['codex-rs/hepta-learning-artifacts/src/owner_operational_tests.rs::failure_classes_expose_distinct_operator_actions'],
              'product_observability_composed',
          )
          bind(
              'actionable_owner_metrics',
              'InstrumentedLearningArtifactReferenceHostV1::operational_metrics',
              'codex-rs/hepta-learning-artifacts/src/owner/operational.rs',
              [
                  'codex-rs/hepta-learning-artifacts/src/owner_operational_tests.rs::operational_metrics_leave_unowned_retention_unknown',
                  'codex-rs/hepta-learning-artifacts/src/owner_operational_tests.rs::retention_observation_is_digest_bound_and_explicit',
              ],
              'product_observability_composed',
          )
          bind(
              'artifact_owner_stage_measurement',
              'measure_stage',
              'codex-rs/hepta-learning-artifacts/src/owner/measurement.rs',
              ['codex-rs/hepta-learning-artifacts/src/owner_operational_tests.rs::stage_measurement_preserves_failed_outcomes'],
              'source_implemented_target_host_baseline_pending',
          )

          mapping['operations'] = list(operations.values())
          mapping['productCallerState'] = 'explicit_read_and_durable_instrumented_writer_host_composed'
          mapping['productionWriterState'] = 'single_fenced_owner_with_durable_shutdown_and_withdrawal_floor_qualification_pending'
          mapping['currentNativeState'] = (
              'immutable registry/storage, canonical full-request identity, scoped durable withdrawal floor, '
              'ordered crash-recoverable publication, signed CURRENT, one fenced owner service, authenticated '
              'reference host, crash-reconciled durable drain, actionable failure classes and bounded stage '
              'measurements are source composed; exact-head/base-merge native qualification, target-host '
              'power-loss evidence, external retention observations and independent acceptance remain separate'
          )
          mapping['repositoryControlledGaps'] = [
              'Execute every native gate on the exact unified candidate and deterministic actual-base merge.',
              'Bind all newly added durable-host and withdrawal-floor scenarios to executed test identities.',
              'Retain target-host stage distributions before approving cache, index or catalog changes.',
          ]
          mapping['externalEvidenceGates'] = [
              'independent semantic review',
              'target-host filesystem, process-crash and physical power-loss qualification',
              'production key/frontier/retention-owner provisioning and independent operator acceptance',
              'canary, promotion and release',
          ]
          boundary = mapping.setdefault('claimBoundary', {})
          boundary.update({
              'productionImplementation': False,
              'productExecutionProved': False,
              'independentAcceptance': False,
              'activation': False,
              'release': False,
          })

          callers = mapping.setdefault('productCallers', [])
          caller = {
              'sourcePath': 'codex-rs/hepta-learning-artifacts/src/owner/durable_host.rs',
              'nativeSymbol': 'DurableInstrumentedLearningArtifactReferenceHostV1',
          }
          if caller not in callers:
              callers.append(caller)

          map_path.write_text(json.dumps(mapping, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          source = os.environ['SOURCE_COMMIT']
          index = f'''# learning.artifacts delivery index

This index separates source presence, execution, native qualification and main integration. It grants no activation, selection, promotion or release authority.

| Capability | Source candidate | Implementation entry | Executed test/evidence entry | Latest result at materialization | Remaining limit |
| --- | --- | --- | --- | --- | --- |
| Complete publication request identity | `{source}` | `owner/request_identity.rs`; `LearningArtifactOwnerService::publish` | `named_owner_service_publishes_retries_and_reopens_from_current_head` | Source written; current exact-head run requested, no historical pass inherited | Exact-head and actual-base receipts must pass on the final map-bound SHA |
| Durable withdrawal floor | `{source}` | `owner/durable_withdrawals.rs`; `install_withdrawal_frontier` | `acknowledged_frontier_survives_reopen_and_rejects_old_startup_input`; uncertainty and kill-boundary suites | Source written; native execution pending final candidate | External independently durable anti-rollback frontier remains a deployment obligation |
| Durable drain and restart reconciliation | `{source}` | `owner/durable_control.rs`; `owner/durable_host.rs` | `durable_stop_survives_sigkill`; truncation and failed-persistence tests | Source written; native execution pending final candidate | SIGKILL is not physical power-loss evidence; no online clear/resume API |
| Stable failure/retry taxonomy | `{source}` | `owner/operational.rs` | `failure_classes_expose_distinct_operator_actions` | Named Rust test added; native execution pending | Product callers must consume dispositions rather than flattening them to retry |
| Actionable operational metrics | `{source}` | `InstrumentedLearningArtifactReferenceHostV1` | unknown-retention and digest-bound observation tests | Named Rust tests added; native execution pending | Pin/physical-erasure values remain `null` until supplied by their owning system |
| Stage performance measurement | `{source}` | `owner/measurement.rs` | `stage_measurement_preserves_failed_outcomes` | Measurement APIs and named test added; target-host baseline absent | No cache/index/catalog optimization is approved without retained host distributions |
| Authenticated reference host, backup and request journal | inherited into `{source}` | `owner/publication_coordination.rs`; `owner/transaction.rs`; `owner/reconciliation.rs` | full package discovery/JUnit and exact-candidate workflow | Source converged; final exact-head/base-merge outcome pending | Non-loopback transport, key custody and independent acceptance are external |

## State dimensions

- **Code written:** yes for the rows above on the source candidate shown.
- **Executed on final candidate:** pending until the materialized SHA completes current workflows.
- **Native-qualified:** false until all exact-head and actual-base lanes pass with complete JUnit identity matching.
- **Integrated into `main`:** false.
- **Production activation / independent acceptance / release:** false and not self-issued by this index.
'''
          Path('docs/modules/learning.artifacts/DELIVERY_INDEX.md').write_text(index, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and seal the prospective tree
        run: |
          rm .github/workflows/learning-artifacts-convergence-materialize.yml
          git add -A
          tree="$(git write-tree)"
          python3 scripts/hepta_artifact_source_binding.py \
            --tree "$tree" \
            --include docs/modules/learning.artifacts/DELIVERY_INDEX.md \
            --include codex-rs/hepta-learning-artifacts/REFERENCE_HOST_PROTOCOL.md \
            --include .github/workflows/hepta-learning-artifacts-qualification.yml \
            --include scripts/hepta_artifact_receipt_guard.py \
            --include scripts/hepta_artifact_source_binding.py \
            --write
          git add docs/modules/learning.artifacts/IMPLEMENTATION_MAP.json
          python3 scripts/hepta_artifact_source_binding.py --tree "$(git write-tree)"

      - name: Commit exact source bindings
        run: |
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs(learning.artifacts): bind delivery index and exact source [learning-artifacts-materialized]'
          git push origin HEAD:work/learning-artifacts-convergence-20260929
