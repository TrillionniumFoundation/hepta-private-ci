name: Materialize verified secrets.heptabao SQLite owner

on:
  push:
    branches: [codex/secrets-heptabao-final-hardening-20260928]
    paths:
      - ".hepta-materialize/secrets-sqlite-v1/**"
      - ".github/workflows/hepta-secrets-sqlite-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-sqlite-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Verify, qualify and commit ordinary source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/secrets-sqlite-materialize"
          mkdir -p "$evidence"
          shopt -s nullglob
          parts=(.hepta-materialize/secrets-sqlite-v1/part-*)
          test "${#parts[@]}" -eq 4
          cat "${parts[@]}" > "$evidence/payload.b64"
          test "$(wc -c < "$evidence/payload.b64")" -eq 33172
          echo "bad562383bcc637b744af039411ee328277c83a6c641b525ef5885b3b20d3e75  $evidence/payload.b64" | sha256sum -c -
          base64 -d "$evidence/payload.b64" > "$evidence/payload.tar.gz"
          echo "8b623fa2e5057223ee944507b7a5ed646a47f4adc8cc227983bfcd6f56a58ad7  $evidence/payload.tar.gz" | sha256sum -c -
          tar -tzf "$evidence/payload.tar.gz" | sed 's#^\./##' | grep -vE '(^$|/$)' | LC_ALL=C sort > "$evidence/actual-paths"
          printf '%s\n' \
            codex-rs/hepta-bao-adapter/Cargo.toml \
            codex-rs/hepta-bao-adapter/migrations/0001_bao_owner_v1.sql \
            codex-rs/hepta-bao-adapter/src/consumption_lifecycle.rs \
            codex-rs/hepta-bao-adapter/src/lib.rs \
            codex-rs/hepta-bao-adapter/src/sqlite_owner.rs \
            codex-rs/hepta-bao-adapter/src/sqlite_owner_tests.rs \
            > "$evidence/expected-paths"
          diff -u "$evidence/expected-paths" "$evidence/actual-paths"
          tar -xzf "$evidence/payload.tar.gz"

          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
          cargo check -p codex-hepta-bao-adapter --all-targets 2>&1 | tee "$evidence/check.log"
          cargo check --locked -p codex-hepta-bao-adapter --all-targets
          cargo test --locked -p codex-hepta-bao-adapter --all-targets -- --test-threads=2 2>&1 | tee "$evidence/adapter-tests.log"
          cargo test --locked -p codex-state-sqlite --all-targets -- --test-threads=2 2>&1 | tee "$evidence/sqlite-tests.log"
          cargo test --locked -p codex-hepta-authbus operation_lookup -- --test-threads=2 2>&1 | tee "$evidence/authbus-recovery.log"
          cargo clippy --locked -p codex-hepta-bao-adapter --all-targets -- -D warnings 2>&1 | tee "$evidence/clippy.log"
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite -- --check
          cd ..

          python3 - <<'PY'
          import subprocess
          allowed = {
              "codex-rs/Cargo.lock",
              "codex-rs/hepta-authbus/src/host.rs",
              "codex-rs/hepta-authbus/src/operation_lookup.rs",
              "codex-rs/hepta-authbus/src/operation_lookup_tests.rs",
              "codex-rs/hepta-authbus/src/quota_store.rs",
              "codex-rs/hepta-authbus/src/recovery.rs",
              "codex-rs/hepta-bao-adapter/Cargo.toml",
              "codex-rs/hepta-bao-adapter/migrations/0001_bao_owner_v1.sql",
              "codex-rs/hepta-bao-adapter/src/consumption_lifecycle.rs",
              "codex-rs/hepta-bao-adapter/src/lib.rs",
              "codex-rs/hepta-bao-adapter/src/sqlite_owner.rs",
              "codex-rs/hepta-bao-adapter/src/sqlite_owner_tests.rs",
          }
          status = subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True)
          changed = {line[3:] for line in status.splitlines() if line}
          if changed - allowed:
              raise SystemExit(f"unexpected paths: {sorted(changed - allowed)}")
          if "codex-rs/Cargo.lock" not in changed:
              raise SystemExit("Cargo.lock was not updated")
          PY
          git diff --check
          git diff --stat | tee "$evidence/final.stat"
          git rm -r .hepta-materialize/secrets-sqlite-v1 .github/workflows/hepta-secrets-sqlite-materialize.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta source materializer"
          git config user.email "hepta-source-materializer@users.noreply.github.com"
          git commit -m "secrets: add transactional SQLite owner candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-sqlite-materialize-${{ github.sha }}
          path: ${{ runner.temp }}/secrets-sqlite-materialize
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
