name: Apply prompt registry exact-head remediation

on:
  push:
    branches: [codex/prompt-registry-remediation-20260927]
    paths:
      - ".github/workflows/prompt-registry-remediation-apply.yml"

permissions:
  contents: write

concurrency:
  group: prompt-registry-remediation-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind branch and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/prompt-registry-remediation-20260927"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --quiet
          git diff --cached --quiet

      - name: Install pinned Rust formatter and linter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Preserve provenance without weakening current-source verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/hepta-implementation-maps.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "def checked_identity(value, candidate: dict[str, str]) -> dict[str, str]:\n",
                  "def checked_identity(\n"
                  "    value, candidate: dict[str, str], *, require_ancestor: bool = True\n"
                  ") -> dict[str, str]:\n",
              ),
              (
                  "    git(\"merge-base\", \"--is-ancestor\", commit, candidate[\"commit\"])\n"
                  "    return {\"commit\": commit, \"tree\": tree}\n",
                  "    if require_ancestor:\n"
                  "        git(\"merge-base\", \"--is-ancestor\", commit, candidate[\"commit\"])\n"
                  "    return {\"commit\": commit, \"tree\": tree}\n",
              ),
              (
                  "    source = checked_identity(row.get(\"sourceBase\"), candidate)\n"
                  "    mapping_mode = row.get(\"mappingSourceIdentityMode\", \"path_only\")\n"
                  "    if mapping_mode not in {\"path_only\", \"exact_blob\"}:\n",
                  "    mapping_mode = row.get(\"mappingSourceIdentityMode\", \"path_only\")\n"
                  "    if mapping_mode not in {\"path_only\", \"exact_blob\"}:\n",
              ),
              (
                  "        raise ValueError(f\"unknown mapping source identity mode: {mapping_mode}\")\n"
                  "    paths = evidence_paths(row, roots)\n",
                  "        raise ValueError(f\"unknown mapping source identity mode: {mapping_mode}\")\n"
                  "    source = checked_identity(\n"
                  "        row.get(\"sourceBase\"),\n"
                  "        candidate,\n"
                  "        require_ancestor=mapping_mode != \"exact_blob\",\n"
                  "    )\n"
                  "    paths = evidence_paths(row, roots)\n",
              ),
              (
                  "        anchor = checked_identity(row.get(\"sourceBase\"), source_base)\n"
                  "        mapping_mode = row.get(\"mappingSourceIdentityMode\", \"path_only\")\n",
                  "        mapping_mode = row.get(\"mappingSourceIdentityMode\", \"path_only\")\n"
                  "        anchor = checked_identity(\n"
                  "            row.get(\"sourceBase\"),\n"
                  "            source_base,\n"
                  "            require_ancestor=mapping_mode != \"exact_blob\",\n"
                  "        )\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one verifier replacement, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          compile(text, str(path), "exec")
          PY

      - name: Format Rust sources with the pinned repository toolchain
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --config imports_granularity=Item
          cargo fmt --all -- --config imports_granularity=Item --check
          cd ..
          git diff --check

      - name: Commit source normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/hepta-implementation-maps.py codex-rs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "prompt.registry: normalize source and provenance verification"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Refresh exact prompt registry implementation map
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 scripts/hepta-implementation-maps.py migrate --module prompt.registry
          git diff --check
          git add docs/modules/prompt.registry/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(prompt.registry): refresh exact-head implementation map"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          python3 scripts/hepta-implementation-maps.py verify --expected-sha "$(git rev-parse HEAD)"
          python3 scripts/hepta-technical-receipts.py verify
          python3 scripts/hepta-implementation-dossiers.py verify

      - name: Run focused registry, optimizer, and product-host tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-prompt-registry --all-targets -- --nocapture --test-threads=1
          cargo test --locked -p codex-hepta-prompt-optimizer --all-targets -- --nocapture --test-threads=1
          cargo test --locked -p codex-hepta-agentd --lib prompt_ -- --nocapture --test-threads=1

      - name: Run strict focused Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-prompt-registry --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p codex-hepta-prompt-optimizer --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p codex-hepta-agentd --all-targets --no-deps -- -D warnings

      - name: Verify final source and documents
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 scripts/hepta-implementation-maps.py verify --expected-sha "$(git rev-parse HEAD)"
          python3 scripts/hepta-docs.py verify
          git diff --check
