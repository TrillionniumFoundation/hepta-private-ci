name: cognitive-types-fuzz-campaigns

on:
  push:
    branches:
      - codex/cognitive-types-full-closure-20260927
    paths:
      - '.github/workflows/cognitive-types-fuzz-campaigns.yml'

permissions:
  contents: read

jobs:
  verifier:
    name: fuzz evidence verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test corpus and receipt tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -B -m unittest -v qualification/cognitive-types-v1/test_fuzz_campaigns.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
