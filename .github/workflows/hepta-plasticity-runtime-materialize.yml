name: Apply learning plasticity runtime convergence

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/hepta-plasticity-runtime-materialize.yml
      - scripts/apply_learning_plasticity_runtime_20260925.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-plasticity-runtime-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/product-convergence-20260923
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - name: Apply exact-source patch and freeze candidate
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/work/product-convergence-20260923
          mkdir -p "$RUNNER_TEMP/plasticity-runtime-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/plasticity-runtime-evidence/base-sha.txt"
          python3 scripts/apply_learning_plasticity_runtime_20260925.py
          rm scripts/apply_learning_plasticity_runtime_20260925.py
          rm .github/workflows/hepta-plasticity-runtime-materialize.yml
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-plasticity \
            --package codex-hepta-agentd
          python3 - <<'PY'
          import subprocess
          allowed = {
              'codex-rs/hepta-plasticity/src/topology_registry.rs',
              'codex-rs/hepta-plasticity/src/lib_tests.rs',
              'codex-rs/hepta-agentd/src/plasticity_runtime.rs',
              'codex-rs/hepta-agentd/src/plasticity_learning_producer.rs',
              'codex-rs/hepta-agentd/src/plasticity_runtime_lifetime_tests.rs',
              'codex-rs/hepta-agentd/src/state.rs',
              'scripts/apply_learning_plasticity_runtime_20260925.py',
              '.github/workflows/hepta-plasticity-runtime-materialize.yml',
          }
          paths = [line[3:] for line in subprocess.check_output(
              ['git', 'status', '--porcelain'], text=True
          ).splitlines()]
          unexpected = set(paths) - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changed paths: {sorted(unexpected)}')
          PY
          git diff --check
          git config user.name 'Hepta Plasticity CI'
          git config user.email 'hepta-plasticity-ci@users.noreply.github.com'
          git add -A
          git commit \
            -m 'fix(plasticity): fence processing time and runtime authority' \
            -m 'Remove caller-supplied admission time, enforce monotonic host processing time, and add linearizable immutable-package invalidation through durable append and anchor acknowledgement. Clear strict module Clippy blockers without changing production semantics.' \
            -m 'No selection, topology application, activation, production qualification or release claim.' \
            -m 'Signed-off-by: Hepta Plasticity CI <hepta-plasticity-ci@users.noreply.github.com>'
          git rev-parse HEAD | tee "$RUNNER_TEMP/plasticity-runtime-evidence/candidate-sha.txt"
          git show --format=fuller --binary HEAD > "$RUNNER_TEMP/plasticity-runtime-evidence/candidate.patch"
      - name: Compile all affected targets
        id: check
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-hepta-plasticity \
            -p codex-hepta-agentd \
            --all-targets 2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/check.log"
      - name: Strict all-target Clippy
        id: clippy
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked \
            -p codex-hepta-plasticity \
            -p codex-hepta-agentd \
            --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/clippy.log"
      - name: Native plasticity tests
        id: native_tests
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-plasticity 2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/native-tests.log"
      - name: Named Agentd owner regressions
        id: owner_tests
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd plasticity_runtime 2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/owner-tests.log"
      - name: Real process bootstrap regression
        id: process_test
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          just test --locked -p codex-hepta-agentd --test plasticity_process_e2e 2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/process-test.log"
      - name: Publish without replacing concurrent work
        id: publish
        if: ${{ success() && steps.check.outcome == 'success' && steps.clippy.outcome == 'success' && steps.native_tests.outcome == 'success' && steps.owner_tests.outcome == 'success' && steps.process_test.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/product-convergence-20260923
          if ! git merge-base --is-ancestor origin/work/product-convergence-20260923 HEAD; then
            git rebase origin/work/product-convergence-20260923
            git rev-parse HEAD | tee "$RUNNER_TEMP/plasticity-runtime-evidence/rebased-sha.txt"
            cargo fmt --manifest-path codex-rs/Cargo.toml \
              --package codex-hepta-plasticity \
              --package codex-hepta-agentd -- --check
            cargo check --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-plasticity -p codex-hepta-agentd --all-targets \
              2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/rebased-check.log"
            cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
              -p codex-hepta-plasticity -p codex-hepta-agentd --all-targets -- -D warnings \
              2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/rebased-clippy.log"
            just test --locked -p codex-hepta-plasticity \
              2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/rebased-native-tests.log"
            just test --locked -p codex-hepta-agentd plasticity_runtime \
              2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/rebased-owner-tests.log"
            just test --locked -p codex-hepta-agentd --test plasticity_process_e2e \
              2>&1 | tee "$RUNNER_TEMP/plasticity-runtime-evidence/rebased-process-test.log"
          fi
          git diff --check
          test -z "$(git status --porcelain)"
          git show --format=fuller --binary HEAD > "$RUNNER_TEMP/plasticity-runtime-evidence/published.patch"
          git push origin HEAD:work/product-convergence-20260923
          git rev-parse HEAD | tee "$RUNNER_TEMP/plasticity-runtime-evidence/published-sha.txt"
      - name: Retain command results and candidate patch
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plasticity-runtime-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/plasticity-runtime-evidence/
          if-no-files-found: warn
          retention-days: 14
