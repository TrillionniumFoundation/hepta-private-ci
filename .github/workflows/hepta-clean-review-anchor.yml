name: Hepta clean temporary review anchor

on:
  push:
    branches:
      - ops/hepta-final-convergence-controller-20260909-r1

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEMP_REF: refs/heads/ops/hepta-final-convergence-review-anchor-20260909
      EXPECTED_SHA: 05981ed1adfb931a87a47b0606f1cedaa69f123b
    steps:
      - name: Delete only the exact temporary ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          ref = os.environ['TEMP_REF']
          expected = os.environ['EXPECTED_SHA']
          encoded = urllib.parse.quote(ref.removeprefix('refs/'), safe='/')
          url = f'https://api.github.com/repos/{repo}/git/ref/{encoded}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hepta-exact-ref-cleaner-v1',
          }
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  current = json.load(response)['object']['sha']
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print('temporary ref already absent')
                  raise SystemExit(0)
              raise
          if current != expected:
              raise SystemExit(f'temporary ref moved: expected={expected} current={current}')
          request = urllib.request.Request(url, method='DELETE', headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'unexpected delete status {response.status}')
          print(f'deleted {ref}@{expected}')
          PY
