name: hcsn-currentstate-n256-firststep-resource-snapshot

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_firststep_resource_snapshot/**"
      - ".github/workflows/hcsn-currentstate-n256-firststep-resource-snapshot.yml"

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen observation source
        run: python3 qualification/hcsn_currentstate_n256_firststep_resource_snapshot/verify_source.py

      - name: Verify retry request and preserved RED
        run: python3 qualification/hcsn_currentstate_n256_firststep_resource_snapshot/verify_retry_v2.py
      - name: Run five small stdlib controls
        run: python3 -m unittest qualification.hcsn_currentstate_n256_firststep_resource_snapshot.test_source -v
      - name: Run optimized controls
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_firststep_resource_snapshot.test_source -v
      - name: Compile source without executing observation
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_firststep_resource_snapshot/*.py
