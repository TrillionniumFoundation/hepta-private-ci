name: Memory retrieval explicit evidence migration

on:
  push:
    branches: [work/memory-retrieval-semantic-product-convergence-20260926]
    paths:
      - .github/workflows/hepta-memory-retrieval-explicit-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    if: github.ref == 'refs/heads/work/memory-retrieval-semantic-product-convergence-20260926'
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize exact-object native migration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 scripts/apply_memory_retrieval_explicit_evidence.py
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          (cd codex-rs && cargo +1.95.0 fmt -p codex-hepta-memory-retrieval -p codex-hepta-memory)
          git diff --check
      - name: Publish exact generated Rust without overriding another writer
        id: source
        env:
          BRANCH: work/memory-retrieval-semantic-product-convergence-20260926
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          roots = ('codex-rs/hepta-memory-retrieval/', 'codex-rs/hepta-memory/')
          if not paths or any(not p.startswith(roots) for p in paths):
              raise SystemExit('out-of-scope or empty native migration')
          PY
          git config user.name 'Hepta retrieval source qualification'
          git config user.email 'qualification@example.invalid'
          git add -- codex-rs/hepta-memory-retrieval codex-rs/hepta-memory
          git commit -m 'fix(memory.retrieval): carry explicit owner proposition stances through native receipts'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/evidence-migration"
          git show --format=fuller --binary HEAD > "$RUNNER_TEMP/evidence-migration/source.patch"
          printf 'source=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/evidence-migration/identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-evidence-migration-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-migration/
          retention-days: 90
          if-no-files-found: warn

  native:
    needs: materialize
    strategy:
      fail-fast: false
      matrix:
        scope: [retrieval, owner, agentd]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      RUSTUP_TOOLCHAIN: 1.95.0
      SOURCE: ${{ needs.materialize.outputs.source }}
      SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.materialize.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Bind clean exact source and toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p "$RUNNER_TEMP/retrieval-evidence"
          python3 scripts/capture_memory_retrieval_source.py --source-sha "$SOURCE" --source-tree "$(git rev-parse HEAD^{tree})" --output "$RUNNER_TEMP/retrieval-evidence/source.json"
      - name: Execute native tests
        id: tests
        run: |
          set -euo pipefail
          case "$SCOPE" in
            retrieval) just test --locked -p codex-hepta-memory-retrieval --lib ;;
            owner) just test --locked -p codex-hepta-memory --lib -E 'test(cognitive_retrieval)' ;;
            agentd) just test --locked -p codex-hepta-agentd --lib -E 'test(cognitive_retrieval_context) | test(cognitive_context_hnmf)' ;;
          esac 2>&1 | tee "$RUNNER_TEMP/retrieval-evidence/tests.log"
      - name: Strict all-target Clippy
        id: clippy
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          case "$SCOPE" in retrieval) package=codex-hepta-memory-retrieval;; owner) package=codex-hepta-memory;; agentd) package=codex-hepta-agentd;; esac
          (cd codex-rs && cargo clippy --locked -p "$package" --all-targets -- -D warnings) 2>&1 | tee "$RUNNER_TEMP/retrieval-evidence/clippy.log"
      - name: Verify formatting and immutable source
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          (cd codex-rs && cargo fmt -p codex-hepta-memory-retrieval -p codex-hepta-memory -- --check)
          python3 scripts/capture_memory_retrieval_source.py --source-sha "$SOURCE" --source-tree "$(git rev-parse HEAD^{tree})" --verify "$RUNNER_TEMP/retrieval-evidence/source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-explicit-native-${{ matrix.scope }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-evidence/
          retention-days: 90
          if-no-files-found: error

  qualification-result:
    if: always()
    needs: [materialize, native]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require non-skipped native success
        env:
          MATERIALIZE_RESULT: ${{ needs.materialize.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$MATERIALIZE_RESULT" = success
          test "$NATIVE_RESULT" = success
