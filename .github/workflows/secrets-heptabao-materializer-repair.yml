name: Repair and materialize secrets.heptabao review object

on:
  push:
    branches:
      - codex/secrets-heptabao-production-qualified-20260930
    paths:
      - .github/workflows/secrets-heptabao-materializer-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-materializer-repair
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact development input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Materialize ordinary source commit
        shell: bash
        env:
          INPUT_SHA: ${{ github.sha }}
          TARGET_BRANCH: codex/secrets-heptabao-production-qualified-20260930
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$INPUT_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/close_secrets_heptabao_candidate.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if re.search(
                      r"BaoProductHostError::(?:OutcomePending|TerminalFailure)"
                      r"\\((?!Box::new\\()",
                      text,
                  ):'''
          new = '''        if re.search(
                      r"BaoProductHostError::(?:OutcomePending|TerminalFailure)"
                      r"\\((?!Box(?:::new\\(|<))",
                      text,
                  ):'''
          if old not in text:
              raise SystemExit("candidate materializer validation anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          python3 scripts/close_secrets_heptabao_candidate.py
          python3 scripts/generate_secrets_heptabao_module.py --write
          python3 scripts/generate_secrets_heptabao_module.py
          python3 codex-rs/hepta-bao-adapter/qa/validate_build_contract.py
          (
            cd codex-rs
            cargo metadata --locked --format-version 1 --no-deps >/dev/null
            cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
          )
          python3 scripts/generate_secrets_heptabao_module.py
          git diff --check

          rm .github/workflows/secrets-heptabao-materializer-repair.yml

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = (
              ".github/workflows/secrets-heptabao-materializer-repair.yml",
              "codex-rs/hepta-bao-adapter/",
              "codex-rs/hepta-authbus/",
              "codex-rs/state/sqlite/",
              "docs/modules/secrets.heptabao/",
              "docs/lane-a-foundation/secrets.heptabao/",
              "docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json",
              "scripts/close_secrets_heptabao_candidate.py",
              "scripts/generate_secrets_heptabao_module.py",
          )
          paths = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          ).splitlines()
          if not paths:
              raise SystemExit("materializer produced no review-object changes")
          unexpected = []
          for row in paths:
              name = row[3:]
              if " -> " in name:
                  name = name.split(" -> ", 1)[1]
              if not any(name == prefix or name.startswith(prefix) for prefix in allowed):
                  unexpected.append(name)
          if unexpected:
              raise SystemExit("unexpected materialized paths: " + ", ".join(unexpected))
          PY

          git config user.name "Hepta source materializer"
          git config user.email "hepta-source-materializer@users.noreply.github.com"
          git add -A
          git commit -m "fix(secrets): materialize immutable review source"
          git push origin "HEAD:$TARGET_BRANCH"

          echo "Materialized review object: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
