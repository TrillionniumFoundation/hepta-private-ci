name: Hepta Neuron shared feature batch native (qualification only)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/app-server-client/**"
      - "codex-rs/app-server-protocol/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/hepta-codex-adapter/**"
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/utils/absolute-path/**"
      - "codex-rs/core/tests/common/**"
      - "scripts/check_neuron_qualification_triggers.py"
      - "scripts/tests/test_neuron_qualification_triggers.py"
      # Changes to the direct inference contract and build inputs must never
      # inherit an old exact-SHA native qualification check.
      - "codex-rs/hepta-types/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/rust-toolchain.toml"
      - "codex-rs/.cargo/**"
      - "codex-rs/clippy.toml"
      - "codex-rs/rustfmt.toml"
      - "codex-rs/cli/Cargo.toml"
      - "codex-rs/cli/src/main.rs"
      - "codex-rs/cli/src/codex.rs"
      - "codex-rs/cli/src/doctor.rs"
      - "codex-rs/core/src/environment_selection.rs"
      - "codex-rs/cli/src/hepta.rs"
      - "codex-rs/hepta-agentd/Cargo.toml"
      - "codex-rs/hepta-agentd/src/prompt_runtime.rs"
      - "codex-rs/hepta-agentd/src/prompt_runtime_tests.rs"
      - "codex-rs/hepta-agentd/src/runtime.rs"
      - "codex-rs/hepta-agentd/src/control.rs"
      - "codex-rs/hepta-matrixd/src/control.rs"
      - "codex-rs/uds/src/**"
      - "codex-rs/hepta-agentd/src/runtime_tests.rs"
      - "codex-rs/hepta-agentd/src/state.rs"
      - "codex-rs/hepta-agentd/src/state_isolation_tests.rs"
      - "codex-rs/hepta-contracts/src/final_use_store.rs"
      - "codex-rs/hepta-contracts/src/final_use_store_windows.rs"
      - "codex-rs/hepta-contracts/src/final_use.rs"
      - "codex-rs/hepta-contracts/Cargo.toml"
      - "codex-rs/hepta-bao-adapter/**"
      - "codex-rs/hepta-prompt-registry/**"
      - "codex-rs/utils/path-utils/**"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-agentd/src/test_support.rs"
      - "codex-rs/hepta-contracts/src/authority_lease.rs"
      - "codex-rs/hepta-contracts/src/authority_lease_windows.rs"
      - "codex-rs/git-utils/src/git_process_tests.rs"
      - "codex-rs/git-utils/src/git_process.rs"
      - "codex-rs/hepta-supervisor/tests/restart_budget_recovery.rs"
      - "codex-rs/hepta-supervisor/src/restart_budget.rs"
      - "codex-rs/hepta-supervisor/src/tick.rs"
      - "codex-rs/ext/hepta-memory/src/cognitive/federation.rs"
      - "codex-rs/hepta-memory/src/cognitive_schema_tests.rs"
      - "codex-rs/hepta-memory/src/cognitive_store.rs"
      - "codex-rs/hepta-memory/src/cognitive_store_tests.rs"
      - "codex-rs/hepta-automation/src/migration_convergence_tests.rs"
      - "codex-rs/hepta-automation/src/store.rs"
      - "codex-rs/hepta-intelligence/src/evaluated_shadow_tests.rs"
      - "codex-rs/hepta-intelligence/src/evaluated_shadow.rs"
      - "codex-rs/hepta-intelligence/src/evaluated_shadow_segment_tests.rs"
      - "codex-rs/hepta-memory/src/production_writer.rs"
      - "codex-rs/hepta-intelligence/src/outcome_credit_v2.rs"
      - "codex-rs/hepta-intelligence/src/evaluated_shadow_test_support.rs"
      - "codex-rs/hepta-learning-ledger/src/**"
      - "codex-rs/state/**"
      - "codex-rs/exec-server/src/local_file_system.rs"
      - "codex-rs/hepta-memory/src/cognitive_store_recovery_tests.rs"
      - ".github/workflows/hepta-neuron-shared-feature-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuron-shared-feature-batch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  sqlite-owner-shim-regression:
    name: SQLite owner shim tests and disallowed-method lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact candidate and immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Verify isolated schema and historical migration tests
        shell: bash
        run: |
          set -euo pipefail
          # The source file is included as cognitive_store::schema_tests, NOT
          # cognitive_schema_tests. A stale Cargo substring selects zero tests
          # and incorrectly exits 0; discovery is therefore mandatory.
          schema_test="cognitive_store::schema_tests::compiled_migrations_match_schema_oracle_and_weakened_trigger_is_rejected"
          schema_list="$(cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory --lib -- --list)"
          grep -Fx "${schema_test}: test" <<< "$schema_list"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory --lib "$schema_test" -- --exact
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-automation --lib migration_convergence_tests::
      - name: Prove canonical SQLite method restrictions
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory -p codex-hepta-automation --all-targets -- -D clippy::disallowed_methods -D clippy::correctness
      - name: Verify no source mutations
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code

  windows-ledger-durability:
    name: Native Windows evaluated-shadow and Outcome Credit durable-ledger regressions
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove Windows qualification candidate identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ github.event.pull_request.head.sha || github.sha }}") { throw "SHA changed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove reviewed Windows private-state ACL, reparse, and hardlink invariants
        shell: pwsh
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-utils-path --lib private_state_windows:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-prompt-registry --lib durable::windows::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-contracts --lib final_use::store::windows::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-contracts --lib authority_lease::windows::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib prompt_runtime::tests::named_agentd_pipeline_stages_exact_registry_bytes_for_app_server_host -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib runtime::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove Windows vanished UDS rendezvous is idempotent
        shell: pwsh
        run: |
          $listed = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-uds --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($listed -match '^lib_tests::absent_rendezvous_is_not_stale_socket_path: test$')) {
            throw "Windows vanished-rendezvous test must be discoverable"
          }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-uds --lib lib_tests::absent_rendezvous_is_not_stale_socket_path -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guard Windows Agentd exclusive control rendezvous
        shell: pwsh
        run: |
          $listed = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($listed -match '^control::tests::preflight_rejects_live_control_listener: test$')) {
            throw "Windows live-owner test must exist; filtered zero-test pass is invalid"
          }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib control::tests::preflight_rejects_live_control_listener -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove Windows Matrixd rejects unauthenticated UDS peers
        shell: pwsh
        run: |
          $listed = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-matrixd --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($listed -match '^control::tests::windows_control_socket_refuses_unverified_peer_identity: test$')) {
            throw "Windows Matrixd fail-closed peer test must be discoverable"
          }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-matrixd --lib control::tests::windows_control_socket_refuses_unverified_peer_identity -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual Windows durable parent handles and append/recovery
        shell: pwsh
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence --lib evaluated_shadow::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-intelligence --lib outcome_credit_v2::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove BAO secret lease registry Windows fsync and restart recovery
        shell: pwsh
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-bao-adapter --lib lease_lifecycle::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove Windows process-tree cleanup and durable supervisor restart budget
        shell: pwsh
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-git-utils --lib git_process::tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-supervisor --test restart_budget_recovery -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove Windows federated final-use invalidation before physical provider send
        shell: pwsh
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory-extension --lib cognitive::federation::tests::revoke_removes_prepared_federated_context_from_next_physical_send -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reopen actual Windows SQLite schema and historical migration databases
        shell: pwsh
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-automation --lib migration_convergence_tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Refuse Cargo's success-on-zero-matching-tests behavior.
          $schemaTest = "cognitive_store::schema_tests::compiled_migrations_match_schema_oracle_and_weakened_trigger_is_rejected"
          $schemaList = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($schemaList -contains "$($schemaTest): test")) {
            throw "Required Windows Cognitive Schema Rust test is not discoverable"
          }
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory --lib $schemaTest -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce canonical SQLite owner API on Windows tests
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-memory -p codex-hepta-automation --all-targets -- -D clippy::disallowed_methods -D clippy::correctness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact source was not changed by conformance tests
        if: always()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-qualification:
    name: Scope-fenced feature cache and true batch seam (no promotion)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove exact tested candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          cd codex-rs
          rustc --version --verbose
          cargo --version
      - name: Fail closed on unqualified direct Rust inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_neuron_qualification_triggers.py' -v
          python3 scripts/check_neuron_qualification_triggers.py
      - name: Prove CLI recursion attributes live on actual crate roots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1",
              "--manifest-path", "codex-rs/Cargo.toml",
          ]))
          packages = [package for package in metadata["packages"] if package["name"] == "codex-cli"]
          if len(packages) != 1:
              raise SystemExit("expected exactly one codex-cli package in cargo metadata")
          binaries = {
              target["name"]: Path(target["src_path"]).name
              for target in packages[0]["targets"] if "bin" in target["kind"]
          }
          expected = {
              "codex": "codex.rs",
              "codex-cli": "codex.rs",
              "hepta": "hepta.rs",
              "logs_client": "logs_client.rs",
          }
          if binaries != expected:
              raise SystemExit(f"unexpected implicit or wrongly rooted CLI binary: {binaries!r}")
          root = Path("codex-rs/cli/src")
          shared = (root / "main.rs").read_text(encoding="utf-8")
          if any(line.lstrip().startswith("#![") for line in shared.splitlines()):
              raise SystemExit("included main.rs contains a forbidden crate-level inner attribute")
          for name in ("codex", "hepta"):
              source = (root / f"{name}.rs").read_text(encoding="utf-8")
              if (not source.startswith('#![recursion_limit = "256"]') or
                      'include!("main.rs");' not in source):
                  raise SystemExit(f"{name} must own the crate-level recursion limit")
          print("CLI recursion attr owned only by native Rust binary crate roots")
          PY
      - name: Locked all-target compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets
      - name: Build real Codex executable for Agentd E2E
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-cli --bin codex
          test -x codex-rs/target/debug/codex
      - name: Run original and V2 owner regression tests
        shell: bash
        env:
          HEPTA_TEST_CODEX_EXECUTABLE: ${{ github.workspace }}/codex-rs/target/debug/codex
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core --lib
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-worker-host --lib
      - name: Prove Unix missing-path normalization and UDS regressions
        shell: bash
        run: |
          set -euo pipefail
          uds_tests="$(cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-uds --lib -- --list)"
          grep -Fx "lib_tests::absent_rendezvous_is_not_stale_socket_path: test" <<< "$uds_tests"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-uds --lib
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-uds --all-targets -- -D clippy::correctness
      - name: Assert Linux socket regressions exist before filtered Cargo tests
        shell: bash
        run: |
          set -euo pipefail
          agentd_tests="$(cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib -- --list)"
          for test in \
            preflight_rejects_live_control_listener \
            preflight_preserves_unrelated_regular_file \
            preflight_reclaims_only_stale_socket_and_permits_exclusive_rebind; do
            grep -Fx "control::tests::$test: test" <<< "$agentd_tests"
          done
          matrixd_tests="$(cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-matrixd --lib -- --list)"
          for test in \
            control_socket_preflight_preserves_existing_regular_files \
            control_socket_preflight_does_not_steal_live_listener \
            control_socket_preflight_retired_server_cannot_unlink_successor; do
            grep -Fx "control::tests::$test: test" <<< "$matrixd_tests"
          done
      - name: Exercise real Agentd and Matrixd UDS preflight regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-agentd --lib control::tests:: -- --test-threads=1
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-matrixd --lib control::tests::control_socket_preflight_ -- --test-threads=1
      - name: Strict owner safety lint
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets -- -D clippy::correctness -D clippy::await_holding_lock -D clippy::await_holding_invalid_type
      - name: Check formatting on selected owner crates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-infer-core --package codex-hepta-infer-worker-host --package codex-hepta-agentd --package codex-hepta-matrixd --package codex-uds --package codex-hepta-contracts --package codex-hepta-bao-adapter -- --check
      - name: Verify no test checkout mutation
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
