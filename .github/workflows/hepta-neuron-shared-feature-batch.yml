# Focused validation for the isolated V2 Neuron source tree.
# Never grants production/final-use authority or asserts a physical Encoder.
# Separate repository blocking-ci still owns global and cross-platform gates.
name: Hepta Neuron shared feature batch native (qualification only)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - ".github/workflows/hepta-neuron-shared-feature-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuron-shared-feature-batch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  native-qualification:
    name: Exact-SHA shared feature and batched Head owners (no promotion)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind the exact candidate and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          rustc --version --verbose
          cargo --version
      - name: Locked all-target compilation of actual native owner crates
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets
      - name: Run all original and V2 owner library regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-core --lib
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-worker-host --lib
      - name: Strict owner safety lint
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-infer-core -p codex-hepta-infer-worker-host --all-targets -- \
            -D clippy::correctness -D clippy::await_holding_lock \
            -D clippy::await_holding_invalid_type
      - name: Check selected owner source formatting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-infer-core \
            --package codex-hepta-infer-worker-host -- --check
      - name: Prove checked source was not modified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
