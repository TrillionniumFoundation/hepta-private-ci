name: intelligence.control remote patch apply macOS independent

on:
  push:
    branches:
      - codex/intelligence-control-remote-apply-20260930-1
    paths:
      - .github/workflows/remote-apply-intelligence-1219-macos-independent.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-remote-apply-1219-macos
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET_BRANCH: codex/intelligence-control-production-closure-20260929
      EXPECTED_TARGET_SHA: 11588c5b1fc7d9a6a93a457e59513f4a39c32384
    steps:
      - name: Check out immutable patch payload
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: payload
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and apply reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, os
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'payload' / '.github' / 'remote-apply'
          parts = sorted(root.glob('intelligence-closure.patch.gz.b64.part-*'))
          assert len(parts) == 8, parts
          full = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts)))
          assert hashlib.sha256(full).hexdigest() == '65814a0ccadd48b882f95b672bd6e798413f12a6ca2f75fc5af8fe48bbb548ca'
          delta = gzip.decompress(base64.b64decode((root / 'intelligence-barrier.patch.gz.b64').read_text()))
          assert hashlib.sha256(delta).hexdigest() == 'bd4f83b475e36c20153bdb09ae27264f19cba80615a8f2f72da4b3d80837e063'
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'intelligence-closure.patch').write_bytes(full)
          (temp / 'intelligence-barrier.patch').write_bytes(delta)
          PY
          cd "$GITHUB_WORKSPACE/target"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"
          git apply --binary --check "$RUNNER_TEMP/intelligence-closure.patch"
          git apply --binary --index "$RUNNER_TEMP/intelligence-closure.patch"
          git apply --binary --check "$RUNNER_TEMP/intelligence-barrier.patch"
          git apply --binary --index "$RUNNER_TEMP/intelligence-barrier.patch"
          git diff --cached --check

      - name: Install pinned Rust formatter and normalize source
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$version" --profile minimal --component rustfmt
          (cd codex-rs && cargo fmt --all)
          git add -A
          git diff --cached --check

      - name: Validate source declarations and evidence contracts
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-intelligence-*.py
          python3 scripts/hepta-intelligence-control-status.py --check-tracked
          python3 scripts/hepta-intelligence-control-status-tests.py
          python3 scripts/hepta-intelligence-acceptance.py --check
          python3 scripts/hepta-intelligence-review-partitions.py --check
          ruby -e 'require "yaml"; Dir[".github/workflows/hepta-intelligence-*.yml"].sort.each { |path| YAML.load_file(path) }'
          python3 - <<'PY'
          from pathlib import Path
          import json
          for path in [
              Path('docs/modules/intelligence.control/IMPLEMENTATION_MAP.json'),
              Path('docs/modules/intelligence.control/TEST_TRACEABILITY.json'),
              Path('docs/modules/intelligence.control/REVIEW_PARTITIONS.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
          PY
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

      - name: Commit and push the exact closure candidate
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git commit -m "fix(intelligence.control): close runtime and readiness gaps"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
