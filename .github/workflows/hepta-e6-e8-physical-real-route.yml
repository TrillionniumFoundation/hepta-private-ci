name: Hepta E6-E8 shared Stem physical and real archive route (DENY_ALL)
on:
  pull_request:
    paths:
      - 'qualification/shared-stem-system2-architecture/**'
      - '.github/workflows/hepta-e6-e8-physical-real-route.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  e6-head-and-e8-global:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: qualification/shared-stem-system2-architecture
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OUTPUT: /tmp/hepta-e6-e8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin bounded numerical dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Seal exact source for independent hosted execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT"
          git rev-parse HEAD | tee "$OUTPUT/source-head.txt"
          python --version | tee "$OUTPUT/python-version.txt"
          python -m pip freeze > "$OUTPUT/dependencies.txt"
          sha256sum qualification/shared-stem-system2-architecture/*.py > "$OUTPUT/research-source-sha256.txt"
      - name: Run fail-closed E0/E6/E7/E8 contracts normally and with -O
        shell: bash
        run: |
          set -euo pipefail
          python -W error::ResourceWarning -m unittest discover \
            -s qualification/shared-stem-system2-architecture -p 'test_*.py' -v \
            > "$OUTPUT/tests-normal.log" 2>&1 || { tail -100 "$OUTPUT/tests-normal.log"; exit 1; }
          python -O -W error::ResourceWarning -m unittest discover \
            -s qualification/shared-stem-system2-architecture -p 'test_*.py' -v \
            > "$OUTPUT/tests-optimized.log" 2>&1 || { tail -100 "$OUTPUT/tests-optimized.log"; exit 1; }
          tail -8 "$OUTPUT/tests-normal.log"
          tail -8 "$OUTPUT/tests-optimized.log"
      - name: Mandatory independent original #1923 two-sided global oracle parity
        shell: bash
        run: |
          set -euo pipefail
          python qualification/shared-stem-system2-architecture/e8_parent_parity.py \
            | tee "$OUTPUT/e8-parent-independent-oracle-parity.json"
      - name: Physically execute 64/256/1024/4096 Head banks, equal output two reuse arms
        shell: bash
        run: |
          set -euo pipefail
          for n in 64 256 1024 4096; do
            python qualification/shared-stem-system2-architecture/e6_physical.py \
              --cells "$n" --source-groups 8 --trials 12 \
              --output "$OUTPUT/head-$n.json" | tee "$OUTPUT/head-$n-stdout.json"
          done
      - name: Independent source-and-meter recomputation across 4 physical scales
        shell: bash
        run: |
          set -euo pipefail
          python qualification/shared-stem-system2-architecture/e6_independent_review.py \
            --inputs "$OUTPUT/head-64.json" "$OUTPUT/head-256.json" \
                     "$OUTPUT/head-1024.json" "$OUTPUT/head-4096.json" \
            --output "$OUTPUT/e6-independent-review.json"
          sha256sum "$OUTPUT"/*.json > "$OUTPUT/e6-research-artifact-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-e6-e8-physical-head-math-${{ github.run_id }}
          path: /tmp/hepta-e6-e8/
          retention-days: 14
          if-no-files-found: warn

  e7-real-model-paired-original-label-score:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: qualification/shared-stem-system2-architecture
      OUTPUT: /tmp/hepta-e7-original-real
      PHYSICAL: /tmp/hepta-e7-original-physical-11908591037.zip
      HISTORICAL: /tmp/hepta-e7-original-labels-11886761368.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Freeze source and preregistered fixed-threshold arm set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT"
          git rev-parse HEAD | tee "$OUTPUT/source-head.txt"
          sha256sum qualification/shared-stem-system2-architecture/e7*.py > "$OUTPUT/source-sha256.txt"
      - name: Download only physical pretrained prediction archive; no historical truth present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11908591037/zip' \
            -o "$PHYSICAL"
          echo "d8e2af397d7ea862245fae0337588ab491dd70e8a8a9a42879e4a7f2d4be3afa  $PHYSICAL" | sha256sum -c -
          sha256sum "$PHYSICAL" > "$OUTPUT/physical-external-source-sha256.txt"
          test ! -e "$HISTORICAL"
      - name: Seal five fixed policies from original real model probabilities BEFORE fetching labels
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$HISTORICAL"
          python qualification/shared-stem-system2-architecture/e7_route_seal.py \
            --physical "$PHYSICAL" --output "$OUTPUT/real-prelabel-route-seal.json" \
            | tee "$OUTPUT/prelabel-seal-stdout.json"
          sha256sum "$OUTPUT/real-prelabel-route-seal.json" > "$OUTPUT/prelabel-seal-sha256.txt"
      - name: Download separately pinned original labels only AFTER immutable route seal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT/prelabel-seal-sha256.txt"
          curl --fail --location --retry 2 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11886761368/zip' \
            -o "$HISTORICAL"
          echo "e5d945c655112139fce51b989023abd5111c9e7ab28d9bd4e8a771b86dd95f9d  $HISTORICAL" | sha256sum -c -
          sha256sum "$HISTORICAL" > "$OUTPUT/independent-original-label-sha256.txt"
      - name: Independent per-case numeric replay against ORIGINAL source labels and ORIGINAL physical reports
        shell: bash
        run: |
          set -euo pipefail
          SEAL_SHA=$(cut -d' ' -f1 "$OUTPUT/prelabel-seal-sha256.txt")
          python qualification/shared-stem-system2-architecture/e7_independent_score.py \
            --historical "$HISTORICAL" --physical "$PHYSICAL" \
            --seal-file "$OUTPUT/real-prelabel-route-seal.json" --seal-sha256 "$SEAL_SHA" \
            --output "$OUTPUT/real-routed-retrospective-score.json" \
            | tee "$OUTPUT/score-stdout.json"
          sha256sum "$OUTPUT/real-routed-retrospective-score.json" > "$OUTPUT/original-score-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-e7-real-prelabel-original-score-${{ github.run_id }}
          path: /tmp/hepta-e7-original-real/
          retention-days: 14
          if-no-files-found: warn
