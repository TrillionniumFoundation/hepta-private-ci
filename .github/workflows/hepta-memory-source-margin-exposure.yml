name: MemoryCell source-margin exposure replay
on:
  push:
    branches:
      - "codex/memory-cell-evidence-20261008"
    paths:
      - "scripts/memory_cell/source_probe_exposure.py"
      - "scripts/memory_cell/test_source_probe_exposure.py"
      - ".github/workflows/hepta-memory-source-margin-exposure.yml"
permissions:
  contents: read
  actions: read
jobs:
  source-margin-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Check exact proposed Python formatting
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-margin-validation
          python3 -m pip install uv==0.8.22
          set +e
          uv run --frozen --project scripts ruff format --check \
            scripts/memory_cell/source_probe_exposure.py \
            scripts/memory_cell/test_source_probe_exposure.py > /tmp/source-margin-validation/format.log 2>&1
          status=$?
          set -e
          cat /tmp/source-margin-validation/format.log
          if [ "$status" -ne 0 ]; then
            uv run --frozen --project scripts ruff format --diff \
              scripts/memory_cell/source_probe_exposure.py \
              scripts/memory_cell/test_source_probe_exposure.py > /tmp/source-margin-validation/format.diff || true
            cat /tmp/source-margin-validation/format.diff
          fi
          exit "$status"
      - name: Install unchanged registered model test environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-margin-validation
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11669174727/zip > /tmp/source-margin-validation/input.zip
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          path = Path("/tmp/source-margin-validation/input.zip")
          raw = path.read_bytes()
          assert len(raw) < 64 * 1024 * 1024
          assert hashlib.sha256(raw).hexdigest() == "23e9d44b8d2dbe756c7c33031e18853c83326458a37925d4d368881145bf142b"
          with ZipFile(path) as archive:
              requirements = archive.read("environment.txt")
              assert len(requirements) < 65536
              Path("/tmp/source-margin-validation/environment-pinned.txt").write_bytes(requirements)
          PY
          python3 -m venv /tmp/source-margin-python
          /tmp/source-margin-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/source-margin-python/bin/pip install -r /tmp/source-margin-validation/environment-pinned.txt
          /tmp/source-margin-python/bin/pip freeze > /tmp/source-margin-validation/environment.txt
          diff -u /tmp/source-margin-validation/environment-pinned.txt /tmp/source-margin-validation/environment.txt
      - name: Run tiny real Qwen2 PEFT source writing and provenance regressions
        run: |
          set -euo pipefail
          /tmp/source-margin-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_source_probe_exposure.py' -v 2>&1 | tee /tmp/source-margin-validation/replay.log
          /tmp/source-margin-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_source_binding_writer.py' -v 2>&1 | tee /tmp/source-margin-validation/binding.log
          /tmp/source-margin-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_source_recall_likelihood.py' -v 2>&1 | tee /tmp/source-margin-validation/likelihood.log
          /tmp/source-margin-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_source_confusion_probe.py' -v 2>&1 | tee /tmp/source-margin-validation/confusion.log
      - name: Preserve exact source and failure trace
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-margin-validation/source
          cp scripts/memory_cell/source_probe_exposure.py scripts/memory_cell/test_source_probe_exposure.py /tmp/source-margin-validation/source/
          git rev-parse HEAD > /tmp/source-margin-validation/tested-commit.txt
          rm -f /tmp/source-margin-validation/input.zip
          (cd /tmp/source-margin-validation && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-source-margin-exposure
          path: /tmp/source-margin-validation
          if-no-files-found: error
