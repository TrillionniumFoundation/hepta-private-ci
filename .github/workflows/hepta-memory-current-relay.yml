name: Hepta memory current evidence acknowledgment before withdrawal

on:
  push:
    branches: [codex/memory-current-relay-20261025]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: memory-current-relay-${{ github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  source-owner:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Verify source and install registered CPU runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --only-binary=:all: -r scripts/memory_cell/requirements.txt 'cryptography==50.0.2'
          python -m pip check
          python -B scripts/memory_cell/prepare_parametric.py --output "$RUNNER_TEMP/base-a" --download
      - name: Qualify control-plane and live source composition at this source SHA
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts/memory_cell_distributed:$PWD/scripts/memory_cell_network:$PWD/scripts/memory_cell_service:$PWD/scripts/memory_cell:$PWD/scripts/memory_cell_system"
          python -B -m unittest discover -s scripts/memory_cell_distributed -p relay_current_tests.py -v
          python -B -m unittest discover -s scripts/memory_cell_distributed -p test_relay_contract.py -v
      - name: Train source-local cell, read controls and fence former placement
        run: |
          set -euo pipefail
          python -B scripts/memory_cell_distributed/relay_trial.py source-prepare --root "$RUNNER_TEMP/source-evidence" --model "$RUNNER_TEMP/base-a" --secret-file "$RUNNER_TEMP/relay-secrets/source.key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-multihost-offer-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence/out-offer/offer.json
          if-no-files-found: error
          retention-days: 14
      - name: Serve exact granted evidence while source is current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B scripts/memory_cell_distributed/relay_current.py source-evidence --root "$RUNNER_TEMP/source-evidence" --model "$RUNNER_TEMP/base-a" --secret-file "$RUNNER_TEMP/relay-secrets/source.key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-multihost-current-evidence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence/out-current-evidence/current-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Observe exact target acknowledgment while current, then actually revoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B scripts/memory_cell_distributed/relay_current.py source-ack-withdraw --root "$RUNNER_TEMP/source-evidence" --model "$RUNNER_TEMP/base-a" --secret-file "$RUNNER_TEMP/relay-secrets/source.key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-multihost-withdrawal-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence/out-withdrawal/withdrawal.json
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate frozen mechanism gates and preserve negative recall results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B scripts/memory_cell_distributed/relay_current.py evaluate --root "$RUNNER_TEMP/source-evidence" --model "$RUNNER_TEMP/base-a"
      - name: Retain source-side evidence and raw failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-multihost-source-evidence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify checkout remained unchanged
        if: always()
        run: git diff --exit-code

  target-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install independent base and registered runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --only-binary=:all: -r scripts/memory_cell/requirements.txt 'cryptography==50.0.2'
          python -m pip check
          python -B scripts/memory_cell/prepare_parametric.py --output "$RUNNER_TEMP/base-b" --download
      - name: Import exact checkpoint and read in a fresh decoder process
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B scripts/memory_cell_distributed/relay_trial.py target-read --root "$RUNNER_TEMP/target-evidence" --model "$RUNNER_TEMP/base-b"
          python -B scripts/memory_cell_distributed/relay_current.py target-ready --root "$RUNNER_TEMP/target-evidence" --model "$RUNNER_TEMP/base-b" --secret-file "$RUNNER_TEMP/relay-secrets/target.key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-multihost-ready-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/target-evidence/out-current-ready/ready.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify current evidence and acknowledge exact signed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B scripts/memory_cell_distributed/relay_current.py target-ack --root "$RUNNER_TEMP/target-evidence" --model "$RUNNER_TEMP/base-b" --secret-file "$RUNNER_TEMP/relay-secrets/target.key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-multihost-current-ack-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/target-evidence/out-current-ack/current-ack.json
          if-no-files-found: error
          retention-days: 14
      - name: Observe withdrawal without entering model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B scripts/memory_cell_distributed/relay_current.py target-withdraw --root "$RUNNER_TEMP/target-evidence" --model "$RUNNER_TEMP/base-b"
      - name: Fresh owner rejects old signed source cut after restart
        run: |
          set -euo pipefail
          python -B scripts/memory_cell_distributed/relay_current.py target-finish --root "$RUNNER_TEMP/target-evidence" --model "$RUNNER_TEMP/base-b"
          python -B scripts/memory_cell_distributed/relay_evaluate.py --root "$RUNNER_TEMP/target-evidence" --model "$RUNNER_TEMP/base-b" --inventory-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-multihost-finished-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/target-evidence/out-current-finished/finished.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain target evidence and raw failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-multihost-target-evidence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/target-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify checkout remained unchanged
        if: always()
        run: git diff --exit-code
