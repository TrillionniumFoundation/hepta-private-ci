name: control.runtime one-shot qualification fix

on:
  push:
    branches:
      - codex/control-runtime-convergence-v1
    paths:
      - .github/workflows/control-runtime-one-shot-fix.yml

permissions:
  contents: write

concurrency:
  group: control-runtime-one-shot-fix
  cancel-in-progress: false

