name: platform.wire isolated source proposal 20260928
on:
  push:
    branches: [work/platform-wire-source-authoring-20260928]
    paths:
      - 'ops/platform_wire_source_repair_20260928.py'
      - '.github/workflows/platform-wire-source-authoring-20260928.yml'
permissions:
  contents: write
concurrency:
  group: platform-wire-isolated-source-authoring-20260928
  cancel-in-progress: false
jobs:
  author:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref_name == 'work/platform-wire-source-authoring-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVIEWED_SOURCE: df550741c58081c3271ce2b2dce92e95d1bfb4d4
      PROPOSAL_REF: work/platform-wire-source-result-20260928
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout authoring instructions only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Install exact source formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Author ordinary source proposal from fixed parent
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin "$REVIEWED_SOURCE"
          proposal="$RUNNER_TEMP/platform-wire-source-proposal"
          git worktree add --detach "$proposal" "$REVIEWED_SOURCE"
          python3 "$GITHUB_WORKSPACE/ops/platform_wire_source_repair_20260928.py" "$proposal"
          cd "$proposal"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          git diff --exit-code
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed = ('codex-rs/hepta-wire/', 'docs/modules/platform.wire/', 'docs/lane-a-foundation/platform.wire/')
          exact = {
              'codex-rs/Cargo.lock', '.github/workflows/lane-a-foundation.yml',
              '.github/workflows/platform-wire-fuzz.yml',
              'qualification/module-execution-dossiers/detail/platform.wire.md',
          }
          assert paths, 'empty source proposal'
          assert all(p.startswith(allowed) or p in exact for p in paths), paths
          assert not any('source_authoring' in p or 'source_repair_20260928' in p for p in paths)
          PY
          git diff --cached --stat
          git config user.name 'Platform Wire Source Author'
          git config user.email 'platform-wire-source@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'fix(platform.wire): preserve bounded feed progress and authenticate session context' '' 'Materialize lossless resumable feeds, role-bound session identity profile 2, transcript-registry coherence, MAC-before-semantic validation, lock and generated-path repairs, and explicit nonclaims. Source proposal only; no qualification or acceptance is asserted.' | git commit-tree "$tree" -p "$REVIEWED_SOURCE")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "proposal=$proposal" >> "$GITHUB_OUTPUT"
      - name: Export proposal ref only
        shell: bash
        env:
          PROPOSAL_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          test "$PROPOSAL_REF" = 'work/platform-wire-source-result-20260928'
          test "$(git rev-parse "$PROPOSAL_COMMIT^")" = "$REVIEWED_SOURCE"
          git push origin "$PROPOSAL_COMMIT:refs/heads/$PROPOSAL_REF"
          {
            echo '## Ordinary source proposal; not qualification'
            echo "Parent: $REVIEWED_SOURCE"
            echo "Commit: $PROPOSAL_COMMIT"
            echo "Tree: ${{ steps.source.outputs.tree }}"
            echo "Ref: $PROPOSAL_REF"
            echo 'The candidate branch was not modified. Promotion requires explicit review and a separate ref update.'
          } >> "$GITHUB_STEP_SUMMARY"
