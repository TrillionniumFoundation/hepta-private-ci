name: Prompt registry full closeout author

on:
  push:
    branches: [ops/prompt-registry-full-closeout-author-20260929]
    paths:
      - .github/scripts/prompt_registry_full_closeout_phase1.py
      - .github/workflows/prompt-registry-full-closeout-author.yml

permissions:
  contents: write

concurrency:
  group: prompt-registry-full-closeout-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: codex/prompt-registry-full-closeout-20260929
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install product compiler prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config
      - name: Apply exact phase-one source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b6cdf7d069a84592c610d57f2685096bb1cf0859"
          python3 <(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/prompt_registry_full_closeout_phase1.py?ref=${GITHUB_SHA}")
          git diff --check
          if grep -n 'nonce: \[' \
            codex-rs/hepta-agentd/src/prompt_final_use_tests.rs \
            codex-rs/hepta-agentd/src/prompt_runtime_tests.rs \
            codex-rs/hepta-prompt-registry/tests/durable_relations_v4.rs; then
            echo 'hard-coded test nonce remains' >&2
            exit 1
          fi
      - name: Format changed Rust source
        working-directory: codex-rs
        run: >-
          cargo fmt
          --package codex-hepta-intelligence
          --package codex-hepta-agentd
          --package codex-hepta-prompt-registry
          --package codex-hepta-prompt-extension
      - name: Validate Python source and evidence harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'scripts/hepta-prompt-registry-map.py',
              'scripts/hepta-prompt-registry-status.py',
              'scripts/hepta-prompt-registry-qualify.py',
              'scripts/hepta-prompt-registry-aggregate.py',
              'scripts/hepta-prompt-registry-harness-tests.py',
              'scripts/hepta-prompt-registry-accept.py',
          ]:
              source = Path(name).read_text(encoding='utf-8')
              compile(source, name, 'exec')
          PY
          python3 scripts/hepta-prompt-registry-harness-tests.py
      - name: Resolve checksum-verified product inputs
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Prove the previous product lint blocker is closed
        working-directory: codex-rs
        run: >-
          cargo clippy --locked
          -p codex-hepta-prompt-optimizer
          -p codex-hepta-agentd
          -p codex-hepta-intelligence
          -p codex-hepta-prompt-extension
          --all-targets --no-deps -- -D warnings
      - name: Execute changed intelligence and prompt regressions
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-intelligence -- --test-threads=1
          cargo test --locked -p codex-hepta-agentd prompt_ -- --test-threads=1
          cargo test --locked -p codex-hepta-prompt-registry --test durable_relations_v4 -- --test-threads=1
      - name: Commit and publish source changes
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          git add -A
          git commit -m 'prompt.registry: close product qualification and evidence identity'
          source=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          git push origin "HEAD:$TARGET_BRANCH"
          echo "sha=$source" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Generate source-bound implementation map and status
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          python3 scripts/hepta-prompt-registry-map.py --write
          python3 scripts/hepta-prompt-registry-map.py --check
          python3 scripts/hepta-prompt-registry-status.py --check
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            docs/modules/prompt.registry/IMPLEMENTATION_MAP.json \
            docs/modules/prompt.registry/QUALIFICATION_STATUS.md | sort)
          test "$changed" = "$expected"
      - name: Commit and publish generated truth
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/modules/prompt.registry/IMPLEMENTATION_MAP.json \
            docs/modules/prompt.registry/QUALIFICATION_STATUS.md
          git diff --cached --check
          git commit -m 'docs(prompt.registry): regenerate exact source truth'
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'delivery_sha=%s\ndelivery_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee "$RUNNER_TEMP/prompt-registry-delivery.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-registry-full-closeout-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prompt-registry-delivery.txt
          if-no-files-found: error
          retention-days: 30
