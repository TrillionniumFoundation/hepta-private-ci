name: R21 blocker diagnostics

on:
  push:
    branches:
      - ops/r21-blocker-diagnostic-20260911-r1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r21-blocker-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  R21_BASE_SHA: 04f60466394a024c218ce66b1b32d1c42c462985
  R21_SOURCE_SHA: a87697760c183ce0378e3115c50f0388f5cbda73
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact diagnostic child
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$R21_SOURCE_SHA"
          test "$(git diff --name-only "$R21_SOURCE_SHA" HEAD)" = ".github/workflows/r21-blocker-diagnostic.yml"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: ./.github/actions/setup-ci

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6.11.0
        with:
          version: "0.11.3"

      - name: Install Rust diagnostics toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt

      - name: Capture repository blocker evidence
        shell: bash
        run: |
          set -uo pipefail
          reports="$RUNNER_TEMP/r21-diagnostics"
          mkdir -p "$reports"
          printf '%s\n' "$R21_SOURCE_SHA" > "$reports/source-sha.txt"
          printf '%s\n' "$(git rev-parse "$R21_SOURCE_SHA^{tree}")" > "$reports/source-tree.txt"

          set +e
          python3 scripts/check_blob_size.py \
            --base "$R21_BASE_SHA" \
            --head "$R21_SOURCE_SHA" \
            --max-bytes 512000 \
            --allowlist .github/blob-size-allowlist.txt \
            >"$reports/blob-size.log" 2>&1
          printf '%s\n' "$?" > "$reports/blob-size.exit"

          python3 scripts/format.py --check >"$reports/format-check.log" 2>&1
          printf '%s\n' "$?" > "$reports/format-check.exit"

          python3 scripts/format.py >"$reports/format-apply.log" 2>&1
          printf '%s\n' "$?" > "$reports/format-apply.exit"
          git diff --binary "$R21_SOURCE_SHA" -- . \
            ':(exclude).github/workflows/r21-blocker-diagnostic.yml' \
            > "$reports/format.patch"
          git diff --name-status "$R21_SOURCE_SHA" -- . \
            ':(exclude).github/workflows/r21-blocker-diagnostic.yml' \
            > "$reports/format-paths.txt"
          git reset --hard HEAD >/dev/null
          git clean -fd >/dev/null

          (
            cd codex-rs
            cargo check -p codex-hepta-control-plane --all-targets --locked --message-format=short
          ) >"$reports/control-plane-check.log" 2>&1
          printf '%s\n' "$?" > "$reports/control-plane-check.exit"

          (
            cd codex-rs
            cargo clippy -p codex-hepta-cognitive-store --all-targets --locked --message-format=short -- -D warnings
          ) >"$reports/cognitive-store-clippy.log" 2>&1
          printf '%s\n' "$?" > "$reports/cognitive-store-clippy.exit"

          (
            cd codex-rs
            cargo test -p codex-hepta-control-plane -p codex-hepta-cognitive-store --locked
          ) >"$reports/target-tests.log" 2>&1
          printf '%s\n' "$?" > "$reports/target-tests.exit"

          tar -czf "$reports/source-slice.tgz" \
            codex-rs/Cargo.toml codex-rs/Cargo.lock \
            codex-rs/hepta-types codex-rs/hepta-cognitive-types \
            codex-rs/hepta-cognitive-store codex-rs/hepta-control-plane \
            scripts/check_blob_size.py scripts/format.py \
            .github/blob-size-allowlist.txt
          set -e

      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r21-blocker-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/r21-diagnostics
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Preserve diagnostic-only status
        shell: bash
        run: |
          echo "Diagnostic carrier only; no source claim or authority transition." >&2
          exit 1
