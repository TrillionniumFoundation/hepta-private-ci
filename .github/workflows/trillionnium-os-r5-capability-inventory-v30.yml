name: Trillionnium OS G1 candidate inventory cancellation sentinel v30

on:
  push:
    branches:
      - ops/trillionnium-os-runner-probe-20260906
    paths:
      - .github/workflows/trillionnium-os-r5-capability-inventory-v30.yml

permissions: {}

# This exact group supersedes and cancels the earlier queued self-hosted
# inventory. Candidate-controlled workflow source must never execute on a
# persistent target runner, even for read-only discovery.
concurrency:
  group: trillionnium-os-g1-capability-inventory-v30
  cancel-in-progress: true

jobs:
  cancel-and-record:
    name: Cancel superseded candidate-controlled target inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Retain the fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/hepta-private-ci
          test "$GITHUB_REF" = refs/heads/ops/trillionnium-os-runner-probe-20260906
          printf '%s\n' \
            'result=CANDIDATE_SELF_HOSTED_INVENTORY_CANCELLED' \
            'candidate_checkout_performed=false' \
            'candidate_code_executed_on_target=false' \
            'target_runner_allocation_authorized=false' \
            'evidence_claimed=false' \
            'promotion_authorized=false' \
            'public_release=false'
