name: hcsn-currentstate-n256-execution-freeze-protocol

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_execution_freeze_protocol/**"
      - ".github/workflows/hcsn-currentstate-n256-execution-freeze-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcsn-n256-execution-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-execution-freeze-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled protocol tests
        run: python3 -m unittest qualification.hcsn_currentstate_n256_execution_freeze_protocol.test_execution_freeze -v
      - name: Optimized protocol tests
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_execution_freeze_protocol.test_execution_freeze -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_execution_freeze_protocol/*.py
      - name: Verify exact frozen source and HOLD
        run: python3 -m qualification.hcsn_currentstate_n256_execution_freeze_protocol.verify_source

  one-shot-warm1-dense-oracle:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/hcsn-n256-firststep-dense-oracle-registered-bridge-20261120-c06d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UNIQUE_EXECUTION_KEY: hcsn-n256-firststep-dense-oracle-hosted-20261118-c06d-001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.3
      - name: Install exact binary numerical runtime
        run: python -m pip install --only-binary=:all: -r qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/requirements.txt
      - name: Verify registered bridge and original source
        run: |
          python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_registered_bridge.verify_source
          python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.verify_source
      - name: Run source controls
        run: |
          python -m unittest qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.test_launcher
          python -O -m unittest qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.test_launcher
      - name: Execute the original unique key once
        run: python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.launcher
      - name: Preserve SUCCESS or RED originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-firststep-dense-oracle-hosted-001-registered-bridge
          path: qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 30
