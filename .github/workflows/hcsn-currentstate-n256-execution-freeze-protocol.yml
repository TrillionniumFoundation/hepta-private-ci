name: hcsn-currentstate-n256-execution-freeze-protocol

on:
  pull_request:
    paths:
      - "qualification/hcsn_currentstate_n256_execution_freeze_protocol/**"
      - ".github/workflows/hcsn-currentstate-n256-execution-freeze-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-execution-freeze-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assertions-enabled protocol tests
        run: python3 -m unittest qualification.hcsn_currentstate_n256_execution_freeze_protocol.test_execution_freeze -v
      - name: Optimized protocol tests
        run: python3 -O -m unittest qualification.hcsn_currentstate_n256_execution_freeze_protocol.test_execution_freeze -v
      - name: Compile source
        run: python3 -m py_compile qualification/hcsn_currentstate_n256_execution_freeze_protocol/*.py
      - name: Verify exact frozen source and HOLD
        run: python3 -m qualification.hcsn_currentstate_n256_execution_freeze_protocol.verify_source
