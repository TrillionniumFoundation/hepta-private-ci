name: Hepta knowledge.graph stage-one product repair

on:
  push:
    branches:
      - work/kg-abc-evidence-hardening-20260928
    paths:
      - .github/workflows/hepta-kg-stage1-product-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-kg-stage1-product-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/kg.patch.gz.b64" <<'PATCH'
          
          PATCH
          base64 -d "$RUNNER_TEMP/kg.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/kg.patch"
          git apply --index "$RUNNER_TEMP/kg.patch"
          git diff --cached --check

      - name: Prepare native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev pkg-config protobuf-compiler
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustc --version
          cargo --version
          protoc --version

      - name: Format and verify repaired source
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          cd codex-rs
          cargo fmt --package codex-hepta-kg --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer --package codex-hepta-memory \
            --package codex-hepta-agentd
          cargo fmt --package codex-hepta-kg --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer --package codex-hepta-memory \
            --package codex-hepta-agentd -- --check
          cargo test -p codex-hepta-kg -p codex-hepta-prompt-optimizer --no-fail-fast
          cargo test -p codex-hepta-memory --lib --no-run
          cargo test -p codex-hepta-memory --test kg_delivery_consistency --no-run
          cargo clippy -p codex-hepta-kg --all-targets -- -D warnings
          cd ..
          python3 scripts/hepta_kg_legacy_guard.py
          python3 -m unittest discover -s scripts -p 'test_hepta_kg_*.py' -v
          git diff --check

      - name: Restore workflow topology and push verified commit
        shell: bash
        run: |
          set -euo pipefail
          git show 73dd14589b8bc9b5a381f9641e6fb7210e5c0373:.github/workflows/hepta-knowledge-graph-qualification.yml \
            > .github/workflows/hepta-knowledge-graph-qualification.yml
          git show 73dd14589b8bc9b5a381f9641e6fb7210e5c0373:.github/workflows/hepta-kg-map-rebind-once.yml \
            > .github/workflows/hepta-kg-map-rebind-once.yml
          git rm -f \
            .github/workflows/hepta-kg-source-export-temporary.yml \
            .github/workflows/hepta-kg-source-export-macos-temporary.yml \
            .github/workflows/hepta-kg-repair-temporary.yml \
            .github/workflows/hepta-kg-stage1-product-repair.yml
          git diff --check
          git config user.name 'hepta-kg-stage1-repair'
          git config user.email 'hepta-kg-stage1-repair@users.noreply.github.com'
          git add -A
          git commit -s -m 'fix(knowledge.graph): close product query resource boundaries'
          git push origin HEAD:work/kg-abc-evidence-hardening-20260928
