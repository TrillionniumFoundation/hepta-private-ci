name: MemoryCell published necessity and conditional learning
on:
  pull_request:
    paths:
      - "scripts/memory_cell/necessity_*.py"
      - "scripts/memory_cell/reviewed_bundle.py"
      - "scripts/memory_cell/test_necessity_*.py"
      - ".github/workflows/hepta-memory-necessity.yml"
      - "codex-rs/hepta-intelligence-eval/MEMORY_CELL_NECESSITY.md"
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-necessity-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  data-and-tests:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-external-span-e2e
          run-id: 37919555733
          github-token: ${{ github.token }}
          path: /tmp/reference-environment
      - name: Execute all regressions in the existing locked environment
        run: |
          set -euo pipefail
          mkdir -p /tmp/necessity-validation
          python3 -m venv /tmp/necessity-python
          /tmp/necessity-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/necessity-python/bin/pip install -r /tmp/reference-environment/environment.txt
          /tmp/necessity-python/bin/pip freeze > /tmp/necessity-validation/environment.txt
          diff -u /tmp/reference-environment/environment.txt /tmp/necessity-validation/environment.txt
          /tmp/necessity-python/bin/python -m unittest discover -s scripts/memory_cell -p 'test_*.py' -v 2>&1 | tee /tmp/necessity-validation/tests.log
      - name: Acquire original human votes and original question options before model work
        run: |
          set -euo pipefail
          /tmp/necessity-python/bin/python scripts/memory_cell/necessity_data.py /tmp/necessity-data --source-commit "$(git rev-parse HEAD)" --mode diagnostic 2>&1 | tee /tmp/necessity-validation/acquisition.log
          /tmp/necessity-python/bin/python scripts/memory_cell/necessity_bridge.py /tmp/necessity-data /tmp/necessity-data/bridge 2>&1 | tee /tmp/necessity-validation/review-bridge.log
          cp /tmp/necessity-validation/environment.txt /tmp/necessity-data/
      - name: Preserve the complete census including unavailable or failed acquisition
        if: always()
        run: |
          mkdir -p /tmp/necessity-validation/source
          cp scripts/memory_cell/necessity_*.py scripts/memory_cell/test_necessity_*.py scripts/memory_cell/reviewed_bundle.py /tmp/necessity-validation/source/
          git rev-parse HEAD > /tmp/necessity-validation/tested-commit.txt
          if test -d /tmp/necessity-data; then
            (cd /tmp/necessity-data && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          fi
          (cd /tmp/necessity-validation && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-necessity-validation
          path: /tmp/necessity-validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-necessity-data
          path: /tmp/necessity-data
          if-no-files-found: warn
  frozen-reader:
    needs: data-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONPATH: scripts/memory_cell
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-necessity-data
          path: /tmp/necessity-data
      - name: Verify original public corpus and stage immutable frozen reader
        run: |
          set -euo pipefail
          (cd /tmp/necessity-data && sha256sum -c SHA256SUMS)
          (cd /tmp/necessity-data/bridge && python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          rows = json.loads(Path("READY.json").read_text())
          for path, expected in rows["files"].items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != expected:
                  raise ValueError("reviewed bridge output hash changed")
          assert rows["independently_reviewed_minimal_sets"] == 0
          PY
          )
          python3 -m venv /tmp/necessity-reader-python
          /tmp/necessity-reader-python/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/necessity-reader-python/bin/pip install -r /tmp/necessity-data/environment.txt
          mkdir -p /tmp/necessity-reader-result
          /tmp/necessity-reader-python/bin/pip freeze > /tmp/necessity-reader-result/environment.txt
          diff -u /tmp/necessity-data/environment.txt /tmp/necessity-reader-result/environment.txt
          /tmp/necessity-reader-python/bin/python scripts/memory_cell/bundle_assets.py stage 135M /tmp/necessity-model
          cp /tmp/necessity-model/inventory.json /tmp/necessity-reader-result/
      - name: Actual frozen reader on publisher-vote projections and unchanged controls
        env:
          HEPTA_MEMORY_TESTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          PLAN=/tmp/necessity-data/bridge/capability-plan.json
          LABELS=/tmp/necessity-data/labels.json
          PLAN_SHA=$(sha256sum "$PLAN" | cut -d " " -f 1)
          LABEL_SHA=$(python3 -c 'import json; print(json.load(open("/tmp/necessity-data/READY.json"))["labels_sha256"])')
          /usr/bin/time -v -o /tmp/necessity-reader-result/resources.txt /tmp/necessity-reader-python/bin/python scripts/memory_cell/bundle_trial.py run "$PLAN" "$LABELS" /tmp/necessity-model/reader /tmp/necessity-model/inventory.json /tmp/necessity-reader-result/execution --plan-sha "$PLAN_SHA" --labels-sha "$LABEL_SHA" 2>&1 | tee /tmp/necessity-reader-result/run.log
      - name: Retain full raw answers, all statuses and exact code identities
        if: always()
        run: |
          mkdir -p /tmp/necessity-reader-result/source
          cp scripts/memory_cell/necessity_*.py scripts/memory_cell/reviewed_bundle.py scripts/memory_cell/bundle_trial.py /tmp/necessity-reader-result/source/
          git rev-parse HEAD > /tmp/necessity-reader-result/tested-commit.txt
          (cd /tmp/necessity-reader-result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-necessity-frozen-reader-135M
          path: /tmp/necessity-reader-result
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Repository formatting, with diagnostics retained
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install uv==0.8.22
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --check --base "$BASE" 2>&1 | tee /tmp/necessity-format.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-necessity-format
          path: /tmp/necessity-format.log
          if-no-files-found: warn
