name: Hepta original Core cached build and full four native
'on':
  push:
    branches:
    - test/hepta-normal-core-cache-consumer-20261103
permissions:
  contents: read
  actions: read
concurrency:
  group: hepta-pinned-core-cache-consumer-20261103
  cancel-in-progress: false
jobs:
  core-cache-consumer:
    name: Core original full four after own cached build (${{ matrix.source_kind }}, ${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source_kind:
        - head
        - prospective-merge
        platform:
        - gnu
        - musl
    env:
      EXPECTED_HEAD: 103e4bcb3a6fbce57943a0c7c339d1d48808ce69
      EXPECTED_BASE: 3a81000aae08c658276958d678874aca4db5eedd
      EXPECTED_MERGE: 68c36639d609033334785b347273899f5abab500
      EXPECTED_TREE: 73d6f50dd52b5e30b536758335dbc82385f63ab3
      SOURCE_KIND: ${{ matrix.source_kind }}
      CACHE_PLATFORM: ${{ matrix.platform }}
      BAZEL_PLATFORM: ${{ matrix.platform == 'gnu' && '//:local_linux' || '@rules_rs//rs/platforms:x86_64-unknown-linux-musl'
        }}
    steps:
    - name: Reserve the original 60-minute job for restore, own build, full-four native and evidence
      id: clock
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/normal-bazel"
        python3 - <<'PYCLOCK'
        import json, os, time
        from pathlib import Path
        started = time.time()
        record = {'job_started_epoch': started, 'internal_deadline_epoch': started + 59 * 60,
            'job_timeout_minutes': 60, 'maximum_own_build_phase_seconds': 36 * 60,
            'post_build_reserve_seconds': 24 * 60, 'original_native_timeout_seconds': 900,
            'original_internal_deadlines_seconds': [10, 30], 'expected_native_entries': 4}
        (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/job-clock.json').write_text(json.dumps(record, indent=2) + '\n')
        with Path(os.environ['GITHUB_ENV']).open('a') as stream:
            stream.write('CORE_JOB_DEADLINE_EPOCH=' + str(record['internal_deadline_epoch']) + '\n')
        PYCLOCK
    - name: Fetch the exact harness and its bounded ancestry
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        fetch-depth: 32
        persist-credentials: false
    - name: Check out the exact tested source with bounded history
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ matrix.source_kind == 'head' && env.EXPECTED_HEAD || env.EXPECTED_MERGE }}
        fetch-depth: 32
        persist-credentials: false
    - name: Bind the harness and the exact tested source before execution
      id: source
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/normal-bazel"
        python3 - <<'PYSOURCE'
        import hashlib, json, os, re, subprocess
        from pathlib import Path
        def git(*args):
            return subprocess.check_output(['git', '--no-replace-objects', *args]).decode().strip()
        for key in ['EXPECTED_HEAD', 'EXPECTED_BASE', 'EXPECTED_MERGE', 'EXPECTED_TREE']:
            assert re.fullmatch(r'[0-9a-f]{40}', os.environ[key]), 'bind every immutable source identity before publication'
        assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
        tested = git('rev-parse', 'HEAD')
        expected = os.environ['EXPECTED_HEAD'] if os.environ['SOURCE_KIND'] == 'head' else os.environ['EXPECTED_MERGE']
        assert tested == expected
        assert git('rev-parse', 'HEAD^{tree}') == os.environ['EXPECTED_TREE']
        if os.environ['SOURCE_KIND'] == 'prospective-merge':
            assert git('show', '-s', '--format=%P', 'HEAD').split() == [os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD']]
            assert git('merge-tree', '--write-tree', os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD']) == os.environ['EXPECTED_TREE']
        harness = os.environ['GITHUB_SHA']
        required_objects = {'harness': harness, 'candidate': os.environ['EXPECTED_HEAD'],
            'base': os.environ['EXPECTED_BASE'], 'tested': tested,
            'cache_producer_source': '32401b2aff9b3cd976ccb10d928595c3b9d3568d',
            'dependency_declaration': 'dc69725d957c79d8737eb5fbedfe6f213252317a'}
        for label, revision in required_objects.items():
            assert git('cat-file', '-t', revision) == 'commit', 'bounded checkout omitted required object: ' + label
        assert git('rev-parse', '32401b2aff9b3cd976ccb10d928595c3b9d3568d^{tree}') == '7d7b390d6e00f7acbd50893bd8b488538272f01f'
        assert git('merge-base', '32401b2aff9b3cd976ccb10d928595c3b9d3568d', os.environ['EXPECTED_HEAD']) == '32401b2aff9b3cd976ccb10d928595c3b9d3568d'
        merge_base = git('merge-base', os.environ['EXPECTED_BASE'], os.environ['EXPECTED_HEAD'])
        assert merge_base == os.environ['EXPECTED_BASE'], 'expected base must remain the common ancestor in each bounded checkout'
        workflow = '.github/workflows/hepta-pinned-core-cache-consumer.yml'
        assert os.environ['GITHUB_EVENT_NAME'] == 'push'
        assert os.environ['GITHUB_REF'] == 'refs/heads/test/hepta-normal-core-cache-consumer-20261103'
        assert os.environ['GITHUB_REPOSITORY'] == 'TrillionniumFoundation/hepta-private-ci'
        assert git('show', '-s', '--format=%P', harness) == os.environ['EXPECTED_HEAD']
        assert git('diff-tree', '--no-commit-id', '--name-status', '-r', harness) == 'A\t' + workflow
        source = subprocess.check_output(['git', 'show', harness + ':' + workflow])
        assert git('status', '--porcelain', '--untracked-files=normal') == ''
        subprocess.run(['git', 'diff', '--exit-code', 'dc69725d957c79d8737eb5fbedfe6f213252317a', tested,
            '--', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion'], check=True)
        record = {'schema': 'hepta-core-cache-consumer-source-v1', 'tested_commit': tested,
            'tested_tree': os.environ['EXPECTED_TREE'], 'source_kind': os.environ['SOURCE_KIND'],
            'candidate': os.environ['EXPECTED_HEAD'], 'base': os.environ['EXPECTED_BASE'],
            'prospective_merge': os.environ['EXPECTED_MERGE'], 'harness_commit': harness,
            'workflow_sha256': hashlib.sha256(source).hexdigest(), 'bazel_platform': os.environ['BAZEL_PLATFORM'],
            'checkout_fetch_depth': 32, 'required_git_objects': required_objects,
            'observed_merge_base': merge_base, 'is_shallow_repository': git('rev-parse', '--is-shallow-repository'),
            'scope': 'Verified compile-cache input, then this source complete Core build, then original full four native entries only'}
        (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/source-before.json').write_text(json.dumps(record, indent=2) + '\n')
        print(json.dumps(record))
        PYSOURCE
    - name: Prepare the existing Bazel toolchain and repository cache
      id: prepare
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ matrix.platform == 'gnu' && 'x86_64-unknown-linux-gnu' || 'x86_64-unknown-linux-musl' }}
        cache-scope: bazel-core-cache-consumer
    - name: Import the already verified fixed dependency artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: '13245890316'
        run-id: '41664243615'
        repository: TrillionniumFoundation/hepta-private-ci
        github-token: ${{ github.token }}
        merge-multiple: true
        digest-mismatch: error
        path: ${{ runner.temp }}/normal-bazel-distdir
    - name: Recheck the fixed metadata and complete dependency bytes
      id: dependency
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYDEPENDENCY'
        import base64, hashlib, json, os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'
        assert sorted(path.name for path in root.iterdir()) == ['source.json', 'transfer.json', 'v5.1.0.tar.gz']
        metadata = (root / 'source.json').read_bytes()
        assert hashlib.sha256(metadata).hexdigest() == '7d88fc6db323947a11d1638fe95185e9c733c337a1d1e7b50cdcf487e29ce56e'
        source = json.loads(metadata)
        assert 'https://github.com/aws/aws-lc/archive/refs/tags/v5.1.0.tar.gz' in [source.get('url')] + source.get('urls', [])
        expected = 'a6bf6adfc5f9bba559d28554b7d3581b15f2813f03bc9f2ae19f0d915e97dadf'
        assert source['integrity'].startswith('sha256-')
        assert base64.b64decode(source['integrity'][7:], validate=True).hex() == expected
        archive = root / 'v5.1.0.tar.gz'
        assert archive.stat().st_size == 145542555
        with archive.open('rb') as stream:
            actual = hashlib.file_digest(stream, 'sha256').hexdigest()
        assert actual == expected
        transfer = json.loads((root / 'transfer.json').read_text())
        assert transfer['workflow_commit'] == '4a78bf9314197ef5a8ea97f67134fdac6795589f'
        assert transfer['workflow_run_id'] == '41664243615'
        assert transfer['declaration_source_commit'] == 'dc69725d957c79d8737eb5fbedfe6f213252317a'
        assert transfer['verified'] is True and transfer['source_sha256'] == expected and transfer['source_bytes'] == 145542555
        report = {'artifact_id': 13245890316, 'sha256': actual, 'bytes': archive.stat().st_size,
            'fixed_metadata_sha256': hashlib.sha256(metadata).hexdigest(), 'verified': True}
        (Path(os.environ['RUNNER_TEMP']) / 'normal-bazel/dependency-import.json').write_text(json.dumps(report, indent=2) + '\n')
        print(json.dumps(report))
        PYDEPENDENCY
        test "$(cat .bazelversion)" = '9.3.0'
        bazel --version | tee "$RUNNER_TEMP/normal-bazel/bazel-version.txt"
        test "$(cat "$RUNNER_TEMP/normal-bazel/bazel-version.txt")" = 'bazel 9.3.0'
    - name: Write the reviewed consumer outside the tested source
      id: scripts
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/normal-bazel/consumer_common.py" <<'PYCONSUMER0'
        """Shared helpers for a bounded, source-bound Core cache consumer."""
        import hashlib
        import json
        import os
        import re
        import signal
        import stat
        import subprocess
        import time
        from pathlib import Path, PurePosixPath

        TARGET = '//codex-rs/core:core-responses_headers-test'
        BUILD_MAX_SECONDS = 36 * 60
        AFTER_BUILD_RESERVE_SECONDS = 24 * 60
        NATIVE_PHASE_SECONDS = 18 * 60
        MAX_FILES = 200000
        MAX_RAW_BYTES = 32 * 1024**3
        MAX_ARCHIVE_BYTES = 8 * 1024**3
        RESERVE_BYTES = 512 * 1024**2
        INPUT_FILES = ('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'defs.bzl',
            'codex-rs/Cargo.toml', 'codex-rs/Cargo.lock', 'codex-rs/core/BUILD.bazel',
            'codex-rs/code-mode-host/BUILD.bazel')

        def paths():
            temp = Path(os.environ['RUNNER_TEMP']).resolve()
            root = temp / 'normal-bazel'
            return {'root': root, 'evidence': root / 'cache_consumer',
                'quarantine': temp / 'core-consumer-quarantine',
                'cache': temp / 'normal-core-consumer-cache',
                'pending_cache': temp / 'normal-core-consumer-cache.pending',
                'output_base': temp / 'normal-core-consumer-output-base'}

        def pins():
            value = read_json(paths()['root'] / 'consumer-pins.json')
            assert value['schema'] == 'hepta-core-cache-consumer-pins-v1'
            assert 'UNBOUND' not in json.dumps(value), 'every source and artifact pin must be reviewed and bound before publication'
            assert value['original_target'] == TARGET and value['original_timeout_seconds'] == 900
            assert len(value['original_names']) == len(set(value['original_names'])) == 4
            return value

        def read_json(path):
            return json.loads(Path(path).read_text())

        def write_json(path, value):
            path = Path(path)
            temporary = path.with_name(path.name + '.tmp')
            with temporary.open('x') as stream:
                json.dump(value, stream, indent=2)
                stream.write('\n')
            os.replace(temporary, path)

        def sha256_file(path):
            with Path(path).open('rb') as stream:
                return hashlib.file_digest(stream, 'sha256').hexdigest()

        def identity(path):
            path = Path(path)
            info = path.lstat()
            assert stat.S_ISREG(info.st_mode) and not path.is_symlink()
            return {'path': str(path), 'bytes': info.st_size, 'sha256': sha256_file(path)}

        def check_bytes(data, expected):
            assert len(data) == expected['bytes']
            assert hashlib.sha256(data).hexdigest() == expected['sha256']

        def safe_path(name, cache=False):
            p = PurePosixPath(name)
            return (bool(name) and not p.is_absolute() and p.as_posix() == name
                and all(part not in ('', '.', '..') for part in name.split('/'))
                and '\\' not in name and len(name) <= 1024
                and all(32 <= ord(c) < 127 for c in name)
                and (not cache or (len(p.parts) >= 2 and p.parts[0] in ('ac', 'cas'))))

        def seconds_left():
            return float(os.environ['CORE_JOB_DEADLINE_EPOCH']) - time.time()

        def stop_group(process, deadline):
            for sig, grace in ((signal.SIGINT, 30), (signal.SIGTERM, 10), (signal.SIGKILL, 5)):
                if process.poll() is not None:
                    break
                try:
                    os.killpg(process.pid, sig)
                except ProcessLookupError:
                    pass
                try:
                    process.wait(timeout=max(0.01, min(grace, deadline - time.monotonic())))
                except subprocess.TimeoutExpired:
                    pass
            return process.poll()

        def run_logged(command, prefix, timeout):
            """One invocation, no retry; logs remain even on timeout or reader failure."""
            assert timeout > 50
            process = None
            result = {'command': command, 'exit_code': None, 'deadline_expired': False}
            begun = time.monotonic()
            try:
                with Path(str(prefix) + '.log').open('xb') as log:
                    process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                    try:
                        result['exit_code'] = process.wait(timeout=timeout - 45)
                    except subprocess.TimeoutExpired:
                        result['deadline_expired'] = True
                        result['exit_code'] = stop_group(process, begun + timeout)
            finally:
                if process is not None and process.poll() is None:
                    result['exit_code'] = stop_group(process, time.monotonic() + 45)
                    result['deadline_expired'] = True
                result['wall_seconds'] = time.monotonic() - begun
                write_json(Path(str(prefix) + '-process.json'), result)
            return result

        def git(*args):
            return subprocess.check_output(['git', '--no-replace-objects', *args])

        def source_snapshot(label):
            p, binding = paths(), pins()
            expected = binding['consumer']['head'] if os.environ['SOURCE_KIND'] == 'head' else binding['consumer']['merge']
            actual = git('rev-parse', 'HEAD').decode().strip()
            tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
            status = git('status', '--porcelain', '--untracked-files=normal').decode()
            record = {'tested_commit': actual, 'tested_tree': tree, 'source_kind': os.environ['SOURCE_KIND'],
                'expected_commit': expected, 'status': status, 'inputs': [], 'core_invariants': []}
            for name in INPUT_FILES:
                row = identity(name); row['path'] = name; record['inputs'].append(row)
            for name, expected_file in binding['core_invariants'].items():
                data = Path(name).read_bytes()
                check_bytes(data, expected_file)
                record['core_invariants'].append({'path': name, **expected_file})
            write_json(p['evidence'] / ('source-' + label + '.json'), record)
            assert actual == expected and tree == binding['consumer']['tree'] and status == ''
            assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
            assert os.environ['BAZEL_PLATFORM'] == binding['platforms'][os.environ['CACHE_PLATFORM']]['bazel_platform']
            return record

        def common_bazel_options():
            p = paths()
            # Bazel 9.3 BuildCommand admits TestOptions; cquery inherits TestCommand.
            # Keep the exact test configuration for build, cquery and test.
            return ['--jobs=2', '--cache_test_results=no', '--test_output=all', '--flaky_test_attempts=1',
                '--disk_cache=' + str(p['cache']),
                '--distdir=' + str(Path(os.environ['RUNNER_TEMP']) / 'normal-bazel-distdir'),
                '--platforms=' + os.environ['BAZEL_PLATFORM'], '--test_arg=--nocapture']

        def bazel(command):
            return ['bazel', '--output_base=' + str(paths()['output_base']), command, *common_bazel_options()]

        def read_events(path):
            with Path(path).open('rb') as stream:
                return [json.loads(line) for line in stream if line.strip()]

        def check_build_finished(events, command):
            starts = [e for e in events if 'started' in e]
            finished = [e for e in events if 'buildFinished' in e.get('id', {})]
            assert len(starts) == len(finished) == 1
            assert starts[0]['started']['command'] == command
            assert starts[0]['started']['buildToolVersion'] == '9.3.0'
            end = finished[0]['finished']
            assert end.get('overallSuccess') is True
            assert end['exitCode']['name'] == 'SUCCESS' and end['exitCode'].get('code', 0) == 0
            completions = [e for e in events if e.get('id', {}).get('targetCompleted', {}).get('label') == TARGET]
            assert len(completions) == 1
            completed = completions[0]
            assert completed['completed'].get('success') is True
            cfg = completed['id']['targetCompleted']['configuration']
            configs = [e for e in events if e.get('id', {}).get('configuration') == cfg]
            assert len(configs) == 1
            options = [e for e in events if 'optionsParsed' in e]
            assert len(options) == 1
            return {'start': starts[0], 'finished': finished[0], 'completion': completed,
                'configuration': configs[0], 'options': options[0]}

        def query_elf(directory, prefix):
            cmd = [*bazel('cquery'), '--output=files', TARGET]
            result = run_logged(cmd, directory / prefix, min(105, int(seconds_left()) - 150))
            assert result['exit_code'] == 0 and not result['deadline_expired']
            found = []
            # cquery stdout shares this log with stderr; only existing regular ELF paths count.
            for line in (directory / (prefix + '.log')).read_text().splitlines():
                candidate = Path(line)
                if len(line) > 4096:
                    continue
                try:
                    exists = candidate.is_file()
                except OSError:
                    continue
                if exists:
                    with candidate.open('rb') as stream:
                        is_elf = stream.read(4) == b'\x7fELF'
                    if is_elf:
                        assert candidate.resolve().is_relative_to(paths()['output_base'].resolve())
                        found.append(identity(candidate.resolve()))
            assert len(found) == 1, 'one original Core test ELF is required'
            write_json(directory / (prefix + '-identity.json'), found[0])
            return found[0]
        PYCONSUMER0
        cat > "$RUNNER_TEMP/normal-bazel/fetch_producer.py" <<'PYCONSUMER1'
        """Read one pinned producer and exact artifacts; never forward API auth to storage."""
        import base64
        import hashlib
        import json
        import os
        import re
        import shutil
        import sys
        import time
        import urllib.error
        import urllib.parse
        import urllib.request
        from pathlib import Path
        from consumer_common import paths, pins, write_json, identity, seconds_left, RESERVE_BYTES

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, fp, code, msg, headers, newurl):
                return None

        def main():
            p = paths(); p['evidence'].mkdir(mode=0o700, exist_ok=True)
            receipt = {'schema': 'hepta-core-producer-download-v1', 'result': 'FAIL', 'native_admission': False}
            try:
                binding = pins(); producer = binding['producer']; lane = binding['platforms'][os.environ['CACHE_PLATFORM']]
                assert producer['repository'] == os.environ['GITHUB_REPOSITORY'] == 'TrillionniumFoundation/hepta-private-ci'
                root = 'https://api.github.com/repos/' + producer['repository']
                token = os.environ['GH_TOKEN']
                opener = urllib.request.build_opener(NoRedirect())
                headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'hepta-pinned-core-cache-consumer'}
                deadline = time.monotonic() + min(8 * 60, int(seconds_left()) - 31 * 60)
                assert deadline > time.monotonic()
                def api(path):
                    assert path.startswith('/') and not path.startswith('//')
                    assert time.monotonic() < deadline
                    try:
                        with opener.open(urllib.request.Request(root + path, headers=headers), timeout=30) as response:
                            data = response.read(4 * 1024**2 + 1)
                            assert len(data) <= 4 * 1024**2
                            return json.loads(data)
                    except urllib.error.HTTPError as error:
                        raise RuntimeError('GitHub API rejected the pinned read with HTTP ' + str(error.code)) from None
                run = api('/actions/runs/' + str(producer['run_id']))
                job = api('/actions/jobs/' + str(lane['job_id']))
                assert run['id'] == producer['run_id'] and run['run_attempt'] == producer['run_attempt'] == 1
                assert run['head_sha'] == producer['harness'] and run['head_branch'] == producer['branch']
                assert run['event'] == 'push' and run['status'] == 'completed'
                assert run['repository']['full_name'] == producer['repository']
                assert run['path'] == producer['workflow_path']
                assert job['id'] == lane['job_id'] and job['run_id'] == producer['run_id'] and job['run_attempt'] == 1
                assert job['head_sha'] == producer['harness'] and job['name'] == lane['job_name']
                assert job['status'] == 'completed'
                # A failed producer with independently verified partial data remains failed.
                receipt.update({'producer_run': run, 'producer_job': job, 'producer_conclusion_preserved': run['conclusion']})
                commit = api('/git/commits/' + producer['harness'])
                assert [v['sha'] for v in commit['parents']] == [producer['head']]
                diff = api('/compare/' + producer['head'] + '...' + producer['harness'])
                assert diff['ahead_by'] == 1 and diff['behind_by'] == 0 and len(diff['files']) == 1
                assert diff['files'][0]['filename'] == producer['workflow_path'] and diff['files'][0]['status'] == 'added'
                workflow = api('/contents/' + producer['workflow_path'] + '?ref=' + producer['harness'])
                assert workflow['encoding'] == 'base64'
                workflow_bytes = base64.b64decode(workflow['content'])
                assert hashlib.sha256(workflow_bytes).hexdigest() == producer['workflow_sha256']
                receipt['producer_workflow'] = {'bytes': len(workflow_bytes), 'sha256': producer['workflow_sha256'], 'git_blob': workflow['sha']}
                artifacts = {}
                for kind in ('before_evidence', 'final_evidence', 'cache'):
                    expected = lane[kind]
                    assert isinstance(expected['id'], int) and isinstance(expected['bytes'], int) and expected['bytes'] > 0
                    assert re.fullmatch(r'[0-9a-f]{64}', expected['sha256'])
                    actual = api('/actions/artifacts/' + str(expected['id']))
                    assert actual['id'] == expected['id'] and actual['name'] == expected['name']
                    assert actual['expired'] is False and actual['size_in_bytes'] == expected['bytes']
                    assert actual['digest'] == 'sha256:' + expected['sha256']
                    wr = actual['workflow_run']
                    assert wr['id'] == producer['run_id'] and wr['head_sha'] == producer['harness'] and wr['head_branch'] == producer['branch']
                    assert wr['repository_id'] == wr['head_repository_id'] == run['repository']['id']
                    artifacts[kind] = actual
                receipt['artifacts'] = artifacts
                p['quarantine'].mkdir(mode=0o700)
                assert lane['final_evidence']['bytes'] <= 64 * 1024**2
                assert lane['cache']['bytes'] <= 9 * 1024**3
                assert shutil.disk_usage(p['quarantine']).free > lane['cache']['bytes'] + lane['final_evidence']['bytes'] + RESERVE_BYTES
                downloads = {}
                for kind in ('final_evidence', 'cache'):
                    expected = lane[kind]
                    request = urllib.request.Request(root + '/actions/artifacts/' + str(expected['id']) + '/zip', headers=headers)
                    try:
                        opener.open(request, timeout=30)
