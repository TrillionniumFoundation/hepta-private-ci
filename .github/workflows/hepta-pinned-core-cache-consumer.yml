    - name: Bind the exact producer run and download exact artifact bytes
      id: fetch
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.dependency.outcome
        == 'success' && steps.scripts.outcome == 'success' }}
      timeout-minutes: 9
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/fetch_producer.py"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Verify producer evidence and every member before installing ac/cas only
      id: restore
      if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
      timeout-minutes: 11
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/verify_install_cache.py"
    - name: Preserve source and cache verification receipts before the consumer build
      id: small_evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      timeout-minutes: 2
      with:
        name: core-consumer-before-build-${{ matrix.source_kind }}-${{ matrix.platform }}-${{ env.EXPECTED_HEAD }}
        path: ${{ runner.temp }}/normal-bazel/
        if-no-files-found: error
        retention-days: 30
    - name: Complete the original Core target build on this exact consumer source
      id: build
      if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.small_evidence.outcome == 'success' }}
      timeout-minutes: 37
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/consumer_build.py"
    - name: Run original full Core four only after this consumer complete build
      id: native
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      timeout-minutes: 19
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/consumer_native.py"
    - name: Stop only this consumer isolated Bazel server after every outcome
      id: shutdown
      if: ${{ always() && steps.scripts.outcome == 'success' }}
      timeout-minutes: 2
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/normal-bazel/consumer_shutdown.py"
    - name: Retain the exact source state after every outcome
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/normal-bazel"
        git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/normal-bazel/source-after.txt"
        git status --porcelain --untracked-files=normal > "$RUNNER_TEMP/normal-bazel/source-after-status.txt"
        expected="$EXPECTED_HEAD"
        if [ "$SOURCE_KIND" = prospective-merge ]; then expected="$EXPECTED_MERGE"; fi
        test "$(git rev-parse HEAD)" = "$expected"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        test ! -s "$RUNNER_TEMP/normal-bazel/source-after-status.txt"
      id: source_after
      timeout-minutes: 1
    - name: Retain original source, cache, build, native and shutdown evidence after every outcome
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      timeout-minutes: 2
      with:
        name: core-consumer-result-${{ matrix.source_kind }}-${{ matrix.platform }}-${{ env.EXPECTED_HEAD }}
        path: ${{ runner.temp }}/normal-bazel/
        if-no-files-found: error
        retention-days: 30
