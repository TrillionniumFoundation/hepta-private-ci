            assert result.get('executionInfo', {}).get('cachedRemotely', False) is False
            assert summary.get('totalNumCached', 0) == 0
            completion = check_build_finished(events, 'test')
            completed = completion['completion']['completed']
            assert completion['completion']['id']['targetCompleted']['configuration'] == build_configuration
            assert int(completed['testTimeoutSeconds']) == 900 and completed['testTimeout'] == '900s'
            text = text.replace('\r', '')
            names = re.findall(r'^test ([A-Za-z_][A-Za-z0-9_:]*) \.\.\.', text, re.M)
            counts = re.findall(r'^running (\d+) tests?$', text, re.M)
            summaries = re.findall(r'^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;', text, re.M)
            assert counts == ['4'] and len(names) == len(set(names)) == 4
            assert sorted(names) == sorted(expected)
            assert len(summaries) == 1 and summaries[0] == ('ok', '4', '0', '0', '0', '0')
            assert not re.search(r'\bskipping test\b', text, re.I), 'original guard returned before assertions'
            verdict.update({'test_result_id': result_id, 'test_result': result, 'test_summary': all_summaries[0],
                'completion': completion, 'observed_names': names, 'native_summaries': summaries,
                'passed': 4, 'failed': 0, 'ignored': 0, 'measured': 0, 'filtered': 0,
                'uncached': True, 'attempts': 1, 'original_timeout_seconds': 900})
            return verdict

        def main():
            p = paths(); directory = p['root'] / 'core_headers'; directory.mkdir(mode=0o700)
            record = {'schema': 'hepta-core-original-full-four-v1', 'result': 'FAIL',
                'target': TARGET, 'expected_count': 4, 'native_started': False, 'original_budgets_unchanged': True}
            try:
                binding = pins()
                build = read_json(p['root'] / 'core_consumer_build/build-result.json')
                assert build['result'] == 'PASS_CONSUMER_OWN_BUILD' and build['consumer_build_complete'] is True and build['native_admission'] is True
                assert build['output_base'] == str(p['output_base']) and build['cache'] == str(p['cache'])
                before = source_snapshot('before-native')
                assert before == build['source_before']
                assert 'CODEX_SANDBOX_NETWORK_DISABLED' not in os.environ, 'do not enter a network-skipping test environment'
                assert identity(build['elf']['path']) == build['elf']
                assert seconds_left() >= NATIVE_PHASE_SECONDS + 5 * 60, 'reserve the complete original 900-second native action plus reader/shutdown/evidence'
                cmd = [*bazel('test'), '--build_event_json_file=' + str(directory / 'build-events.jsonl'), TARGET]
                record.update({'command': cmd, 'consumer_own_build_receipt': identity(p['root'] / 'core_consumer_build/build-result.json'),
                    'source_before': before, 'elf_before': build['elf'], 'expected_names': binding['original_names'],
                    'native_phase_wall_limit_seconds': NATIVE_PHASE_SECONDS})
                write_json(directory / 'command.json', record)
                record['native_started'] = True
                process = run_logged(cmd, directory / 'bazel-test', NATIVE_PHASE_SECONDS)
                record['bazel_process'] = process
                # This file is the Bazel client exit, retained under the established evidence name.
                (directory / 'native.exit').write_text(str(process['exit_code']) + '\n')
                events = read_events(directory / 'build-events.jsonl')
                result_events = [e for e in events if e.get('id', {}).get('testResult', {}).get('label') == TARGET]
                record['raw_test_results'] = result_events
                if len(result_events) == 1:
                    locations = [v['uri'] for v in result_events[0]['testResult'].get('testActionOutput', []) if v.get('name') == 'test.log']
                    assert len(locations) == 1
                    url = urllib.parse.urlsplit(locations[0])
                    assert url.scheme == 'file' and url.netloc in ('', 'localhost')
                    log = Path(urllib.parse.unquote(url.path)).resolve()
                    assert log.is_relative_to(p['output_base'].resolve()) and log.is_file() and log.stat().st_size <= 16 * 1024**2
                    shutil.copyfile(log, directory / 'original-test.log')
                record['elf_after'] = identity(build['elf']['path'])
                write_json(directory / 'binary-identities.json', {'before': build['elf'], 'after': record['elf_after']})
                assert record['elf_after'] == build['elf']
                assert source_snapshot('after-native') == before
                assert process['exit_code'] == 0 and not process['deadline_expired']
                text = (directory / 'original-test.log').read_text()
                record.update(verify_native(events, text, binding['original_names'], build['configured_target']['configuration']))
                record.update({'result': 'PASS', 'native_log': identity(directory / 'original-test.log'),
                    'bep_identity': identity(directory / 'build-events.jsonl')})
            except Exception as error:
                record['result'] = 'FAIL'
                record['error'] = type(error).__name__ + ': ' + str(error)
            finally:
                write_json(directory / 'result.json', record)
                print(json.dumps({k: record.get(k) for k in ('result', 'native_started', 'passed', 'failed', 'error')}))
            return 0 if record['result'] == 'PASS' else 1

        if __name__ == '__main__':
            sys.exit(main())
