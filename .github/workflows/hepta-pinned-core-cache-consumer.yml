        from consumer_common import paths, read_json, write_json, run_logged

        def main():
            p = paths(); p['evidence'].mkdir(mode=0o700, exist_ok=True)
            record = {'schema': 'hepta-core-consumer-shutdown-v1', 'result': 'FAIL'}
            try:
                if not p['output_base'].exists():
                    record['result'] = 'NO_CONSUMER_SERVER_STARTED'
                else:
                    intent = read_json(p['root'] / 'core_consumer_build/command.json')
                    assert intent['output_base'] == str(p['output_base']) and intent['cache'] == str(p['cache'])
                    assert p['output_base'].is_dir() and not p['output_base'].is_symlink()
                    command = ['bazel', '--output_base=' + str(p['output_base']), 'shutdown']
                    process = run_logged(command, p['evidence'] / 'shutdown', 105)
                    record['process'] = process
                    assert process['exit_code'] == 0 and not process['deadline_expired']
                    record['result'] = 'PASS_SHUTDOWN'
            except Exception as error:
                record['result'] = 'FAIL'
                record['error'] = type(error).__name__ + ': ' + str(error)
            finally:
                write_json(p['evidence'] / 'shutdown-result.json', record)
                print(json.dumps(record))
            return 0 if record['result'] in ('NO_CONSUMER_SERVER_STARTED', 'PASS_SHUTDOWN') else 1

        if __name__ == '__main__':
            sys.exit(main())
