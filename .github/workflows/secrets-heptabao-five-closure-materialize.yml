name: Qualify and land secrets.heptabao five-closure

on:
  push:
    branches:
      - codex/secrets-heptabao-five-closure-20260930
    paths:
      - .ci/secrets-heptabao-final-closure.part*
      - .github/workflows/secrets-heptabao-five-closure-materialize.yml

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-five-closure-materialize
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  qualify-and-land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 120
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Reassemble and verify final source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/secrets-heptabao-final-closure.part* \
            > "${RUNNER_TEMP}/secrets-heptabao-final-closure.patch.gz.b64"
          echo "72003eae4b5eccd186e7fe5aa605b5d065a86b580b92f1b7c017819f394efdd2  ${RUNNER_TEMP}/secrets-heptabao-final-closure.patch.gz.b64" \
            | sha256sum --check --strict
          base64 --decode "${RUNNER_TEMP}/secrets-heptabao-final-closure.patch.gz.b64" \
            | gzip -dc > "${RUNNER_TEMP}/secrets-heptabao-final-closure.patch"
          echo "e9ddcd1e936dfb795dfb5005d2dd3e88df8aac7c6264cd407360fa77967b5b73  ${RUNNER_TEMP}/secrets-heptabao-final-closure.patch" \
            | sha256sum --check --strict
          git apply --check --whitespace=error-all \
            "${RUNNER_TEMP}/secrets-heptabao-final-closure.patch"
          git apply --index --whitespace=error-all \
            "${RUNNER_TEMP}/secrets-heptabao-final-closure.patch"
          git diff --cached --check

      - name: Verify canonical manifest and projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_secrets_heptabao_module.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json"),
              *sorted(Path("docs/modules/secrets.heptabao").glob("*.json")),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"validated {len(paths)} canonical JSON documents")
          PY
          git diff --cached --check

      - name: Run exact native and recovery qualification
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/secrets-heptabao-five-closure-native.log"
          : > "${log}"
          run_logged() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "${label}" | tee -a "${log}"
            printf 'command:' | tee -a "${log}"
            printf ' %q' "$@" | tee -a "${log}"
            printf '\n' | tee -a "${log}"
            set +e
            "$@" 2>&1 | tee -a "${log}"
            status=${PIPESTATUS[0]}
            set -e
            printf '===== %s exit %s =====\n' "${label}" "${status}" | tee -a "${log}"
            return "${status}"
          }
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            rustc --version --verbose
            cargo --version --verbose
            uname -a
            sha256sum codex-rs/Cargo.lock
          } 2>&1 | tee -a "${log}"

          pushd codex-rs >/dev/null
          run_logged fmt cargo fmt \
            -p codex-hepta-bao-adapter \
            -p codex-hepta-authbus \
            -p codex-state-sqlite \
            -- --check
          run_logged check cargo check --locked \
            -p codex-hepta-bao-adapter \
            --all-targets
          run_logged test cargo test --locked \
            -p codex-hepta-bao-adapter \
            -p codex-state-sqlite \
            --all-targets \
            -- --test-threads=2
          run_logged authbus-schema cargo test --locked \
            -p codex-hepta-authbus \
            authority_schema \
            -- --test-threads=2
          run_logged clippy cargo clippy --locked \
            -p codex-hepta-bao-adapter \
            -p codex-state-sqlite \
            --all-targets \
            -- -D warnings
          popd >/dev/null

          run_logged python-qa python3 -m unittest discover \
            -s codex-rs/hepta-bao-adapter/qa \
            -p 'test_*.py'

      - name: Capture exact candidate diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short --untracked-files=all \
            > "${RUNNER_TEMP}/secrets-heptabao-five-closure-status.txt"
          git diff --cached --name-status \
            > "${RUNNER_TEMP}/secrets-heptabao-five-closure-files.txt"
          git diff --cached --binary \
            > "${RUNNER_TEMP}/secrets-heptabao-five-closure-qualified.patch"
          cp "${RUNNER_TEMP}/secrets-heptabao-final-closure.patch" \
            "${RUNNER_TEMP}/secrets-heptabao-five-closure-input.patch"
          sha256sum \
            "${RUNNER_TEMP}/secrets-heptabao-five-closure-qualified.patch" \
            "${RUNNER_TEMP}/secrets-heptabao-five-closure-input.patch" \
            > "${RUNNER_TEMP}/secrets-heptabao-five-closure-digests.txt"

      - name: Retain exact candidate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-five-closure-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/secrets-heptabao-five-closure-native.log
            ${{ runner.temp }}/secrets-heptabao-five-closure-status.txt
            ${{ runner.temp }}/secrets-heptabao-five-closure-files.txt
            ${{ runner.temp }}/secrets-heptabao-five-closure-qualified.patch
            ${{ runner.temp }}/secrets-heptabao-five-closure-input.patch
            ${{ runner.temp }}/secrets-heptabao-five-closure-digests.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Commit qualified canonical source
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .ci/secrets-heptabao-five-closure-core.patch.gz.b64 \
            .ci/secrets-heptabao-final-closure.part00 \
            .ci/secrets-heptabao-final-closure.part01 \
            .ci/secrets-heptabao-final-closure.part02 \
            .ci/secrets-heptabao-final-closure.part03 \
            .ci/secrets-heptabao-final-closure.part04 \
            .ci/secrets-heptabao-final-closure.part05 \
            .github/workflows/secrets-heptabao-five-closure-materialize.yml \
            .github/workflows/secrets-heptabao-five-closure-export.yml \
            .github/workflows/secrets-heptabao-manifest-materialize.yml
          git add -A
          git diff --cached --check
          python3 scripts/generate_secrets_heptabao_module.py
          git diff --exit-code -- \
            docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json \
            docs/modules/secrets.heptabao/IMPLEMENTATION_MAP.json \
            docs/modules/secrets.heptabao/CAPABILITY_MATRIX.json \
            docs/modules/secrets.heptabao/NONCLAIMS.json \
            docs/modules/secrets.heptabao/SOURCE_ANCHORS.json
          git config user.name "Hepta secrets five-closure bot"
          git config user.email "hepta-secrets-five-closure@users.noreply.github.com"
          git commit -m "secrets: close durable owner, recovery, metrics, and evidence gaps"
          git push origin HEAD:codex/secrets-heptabao-five-closure-20260930
