name: Materialize secrets.heptabao five-closure core

on:
  push:
    branches:
      - codex/secrets-heptabao-five-closure-20260930
    paths:
      - .ci/secrets-heptabao-five-closure-core.patch.gz.b64
      - .github/workflows/secrets-heptabao-five-closure-materialize.yml

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-five-closure-materialize
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/secrets-heptabao-five-closure-20260930
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .ci/secrets-heptabao-five-closure-core.patch.gz.b64 \
            | gzip -dc > /tmp/secrets-heptabao-five-closure-core.patch
          echo "2cfd3f2feab041efe454adee554d0d456a188f17b835dd8b4527d48c5b0a5323  /tmp/secrets-heptabao-five-closure-core.patch" \
            | sha256sum --check --strict
          git apply --check --whitespace=error-all \
            /tmp/secrets-heptabao-five-closure-core.patch
          git apply --index --whitespace=error-all \
            /tmp/secrets-heptabao-five-closure-core.patch
          git diff --cached --check

      - name: Format adapter
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-bao-adapter

      - name: Check all adapter targets
        working-directory: codex-rs
        run: cargo check --locked -p codex-hepta-bao-adapter --all-targets

      - name: Test all adapter targets
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-bao-adapter --all-targets -- --test-threads=2

      - name: Strict Clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-bao-adapter --all-targets -- -D warnings

      - name: Commit qualified source
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .ci/secrets-heptabao-five-closure-core.patch.gz.b64 \
            .github/workflows/secrets-heptabao-five-closure-materialize.yml \
            .github/workflows/secrets-heptabao-five-closure-export.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta secrets five-closure bot"
          git config user.email "hepta-secrets-five-closure@users.noreply.github.com"
          git commit -m "secrets: bound recovery budgets, leases, and sensitive evidence"
          git push origin HEAD:codex/secrets-heptabao-five-closure-20260930
