name: Materialize secrets.heptabao five-closure core

on:
  push:
    branches:
      - codex/secrets-heptabao-five-closure-20260930
    paths:
      - .ci/secrets-heptabao-five-closure-core.patch.gz.b64
      - .github/workflows/secrets-heptabao-five-closure-materialize.yml

permissions:
  contents: write

concurrency:
  group: secrets-heptabao-five-closure-materialize
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/secrets-heptabao-five-closure-20260930
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .ci/secrets-heptabao-five-closure-core.patch.gz.b64 \
            | gzip -dc > /tmp/secrets-heptabao-five-closure-core.patch
          echo "2cfd3f2feab041efe454adee554d0d456a188f17b835dd8b4527d48c5b0a5323  /tmp/secrets-heptabao-five-closure-core.patch" \
            | sha256sum --check --strict
          git apply --check --whitespace=error-all \
            /tmp/secrets-heptabao-five-closure-core.patch
          git apply --index --whitespace=error-all \
            /tmp/secrets-heptabao-five-closure-core.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-bao-adapter/src/lease_lifecycle.rs")
          source = path.read_text(encoding="utf-8")
          old = """pub use consumption::{
              BaoConsumptionOperationV1, BaoConsumptionPhaseV1, BaoConsumptionRecoveryActionV1,
              BaoConsumptionStateV1, BaoSecretReceipt, BaoSecretTelemetryV1,
          };"""
          new = """pub use consumption::{
              BaoConsumptionOperationV1, BaoConsumptionPhaseV1, BaoConsumptionRecoveryActionV1,
              BaoConsumptionStateV1, BaoSecretReceipt, BaoSecretTelemetryV1,
              BaoSensitiveMetadataPolicyV1,
          };"""
          if old not in source:
              raise SystemExit("expected lease-lifecycle re-export block not found")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git add codex-rs/hepta-bao-adapter/src/lease_lifecycle.rs
          git diff --cached --check

      - name: Format and compile exact candidate
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/secrets-heptabao-five-closure-compile.log"
          : > "${log}"
          run_logged() {
            printf '\n===== %q' "$1" | tee -a "${log}"
            shift
            printf ' %q' "$@" | tee -a "${log}"
            printf ' =====\n' | tee -a "${log}"
            set +e
            "$@" 2>&1 | tee -a "${log}"
            status=${PIPESTATUS[0]}
            set -e
            printf '===== exit %s =====\n' "${status}" | tee -a "${log}"
            return "${status}"
          }
          {
            rustc --version --verbose
            cargo --version --verbose
            uname -a
          } 2>&1 | tee -a "${log}"
          run_logged fmt cargo fmt -p codex-hepta-bao-adapter
          run_logged check cargo check --locked -p codex-hepta-bao-adapter --all-targets
          run_logged test cargo test --locked -p codex-hepta-bao-adapter --all-targets -- --test-threads=2
          run_logged clippy cargo clippy --locked -p codex-hepta-bao-adapter --all-targets -- -D warnings

      - name: Capture materialized diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short > "${RUNNER_TEMP}/secrets-heptabao-five-closure-status.txt"
          git diff --cached --name-status > "${RUNNER_TEMP}/secrets-heptabao-five-closure-files.txt"
          git diff --cached --binary > "${RUNNER_TEMP}/secrets-heptabao-five-closure-materialized.patch"
          cp /tmp/secrets-heptabao-five-closure-core.patch \
            "${RUNNER_TEMP}/secrets-heptabao-five-closure-core.patch"
          sha256sum \
            "${RUNNER_TEMP}/secrets-heptabao-five-closure-materialized.patch" \
            "${RUNNER_TEMP}/secrets-heptabao-five-closure-core.patch" \
            > "${RUNNER_TEMP}/secrets-heptabao-five-closure-digests.txt"

      - name: Retain materialized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-heptabao-five-closure-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/secrets-heptabao-five-closure-compile.log
            ${{ runner.temp }}/secrets-heptabao-five-closure-status.txt
            ${{ runner.temp }}/secrets-heptabao-five-closure-files.txt
            ${{ runner.temp }}/secrets-heptabao-five-closure-materialized.patch
            ${{ runner.temp }}/secrets-heptabao-five-closure-core.patch
            ${{ runner.temp }}/secrets-heptabao-five-closure-digests.txt
          if-no-files-found: error
          retention-days: 7

      - name: Commit qualified source
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .ci/secrets-heptabao-five-closure-core.patch.gz.b64 \
            .github/workflows/secrets-heptabao-five-closure-materialize.yml \
            .github/workflows/secrets-heptabao-five-closure-export.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta secrets five-closure bot"
          git config user.email "hepta-secrets-five-closure@users.noreply.github.com"
          git commit -m "secrets: bound recovery budgets, leases, and sensitive evidence"
          git push origin HEAD:codex/secrets-heptabao-five-closure-20260930
