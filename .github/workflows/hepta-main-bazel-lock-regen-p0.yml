name: Main-source Bazel lock regeneration (evidence, isolated)
on:
  push:
    branches:
      - codex/main-bazel-lock-regen-p0-20261018
    paths:
      - .github/workflows/hepta-main-bazel-lock-regen-p0.yml

permissions:
  contents: write

concurrency:
  group: hepta-main-lock-regeneration-p0
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout one pinned original main candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify original main and the single workflow change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "f8c9419df6ddeb36ff8b522a50219981fb8d9345"
          test "$(git diff --name-only f8c9419df6ddeb36ff8b522a50219981fb8d9345 HEAD)" = ".github/workflows/hepta-main-bazel-lock-regen-p0.yml"
      - name: Prepare pinned Bazel toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: hepta-main-lock-regeneration-p0
      - name: Regenerate and verify actual Bazel resolver lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          df -h .
          bazel mod deps --lockfile_mode=update
          python3 -m json.tool MODULE.bazel.lock >/dev/null
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != ["MODULE.bazel.lock"]:
              raise SystemExit(f"Unexpected touched files: {changed}")
          PY
          ./scripts/check-module-bazel-lock.sh
          git diff --binary -- MODULE.bazel.lock > "$RUNNER_TEMP/MODULE.bazel.lock.patch"
          test -s "$RUNNER_TEMP/MODULE.bazel.lock.patch"
          sha256sum MODULE.bazel.lock | tee "$RUNNER_TEMP/module-lock-sha256.txt"
          cp MODULE.bazel.lock "$RUNNER_TEMP/MODULE.bazel.lock"
      - name: Retain generated lock and patch for source review
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-main-bazel-lock-generated-p0
          path: |
            ${{ runner.temp }}/MODULE.bazel.lock
            ${{ runner.temp }}/MODULE.bazel.lock.patch
            ${{ runner.temp }}/module-lock-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated lock ONLY to the isolated research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "codex/main-bazel-lock-regen-p0-20261018"
          git config user.name 'hepta-bazel-lock-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MODULE.bazel.lock
          git commit -m 'build(bazel): retain verified current-main Bazel lock from pinned resolver'
          git push origin "HEAD:refs/heads/codex/main-bazel-lock-regen-p0-20261018"
