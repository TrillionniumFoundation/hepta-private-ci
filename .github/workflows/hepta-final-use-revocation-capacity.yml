name: Hepta Final-use revocation capacity qualification

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-contracts/src/final_use.rs'
      - 'codex-rs/hepta-contracts/src/final_use_tests.rs'
      - 'qualification/final-use-revocation-capacity-20261015.md'
      - '.github/workflows/hepta-final-use-revocation-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-final-use-revocation-capacity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capacity:
    name: Original Final-use strict capacity (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check source, original owner, or exact prospective base merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor 78fdb0cf8537e3a84fc6e0a849707559c80881e8 HEAD
          if [ '${{ matrix.lane }}' = base-merge ]; then
            test -n "$BASE_SHA"
            tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
            export GIT_AUTHOR_NAME=hepta-qualification GIT_COMMITTER_NAME=hepta-qualification
            export GIT_AUTHOR_EMAIL=qualification@invalid GIT_COMMITTER_EMAIL=qualification@invalid
            export GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z
            merge="$(printf '%s\n' 'Final-use capacity qualification only' | git commit-tree "$tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
            test "$(git show -s --format=%P "$merge")" = "$BASE_SHA $SOURCE_SHA"
            git checkout --detach "$merge"
            test "$(git rev-parse HEAD^{tree})" = "$tree"
          fi
          printf 'source=%s base=%s tested=%s tree=%s\n' "$SOURCE_SHA" "$BASE_SHA" \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          git diff --quiet
          git diff --cached --quiet

      - name: Original lockfile integrity
        run: |
          set -euo pipefail
          python3 scripts/verify_cargo_lock.py

      - name: Original Final-use owner Rustfmt, locked tests and strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo fmt -p codex-hepta-contracts -- --check
          cargo check --locked -p codex-hepta-contracts --all-targets
          cargo test --locked -p codex-hepta-contracts --lib final_use::tests::revocation_capacity_snapshot_matches_the_enforced_final_use_limit
          cargo test --locked -p codex-hepta-contracts --lib final_use
          cargo clippy --locked -p codex-hepta-contracts --all-targets -- -D warnings

      - name: Exact original source after native verification
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet
          git diff --cached --quiet
