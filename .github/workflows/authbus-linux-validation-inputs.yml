name: AuthBus pinned Linux validation inputs
on:
  push:
    branches: [auth-authbus-hardening-20260927]
    paths: [.github/workflows/authbus-linux-validation-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Fetch locked dependencies and Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --manifest-path codex-rs/Cargo.toml --locked --target x86_64-unknown-linux-gnu
          rustup toolchain install 1.95.0-x86_64-unknown-linux-gnu --profile minimal --component rustfmt --component clippy --force-non-host
      - name: Export only public toolchain and dependency caches
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$HOME/.rustup/toolchains" -czf "$RUNNER_TEMP/authbus-linux-toolchain.tar.gz" 1.95.0-x86_64-unknown-linux-gnu
          cd "$HOME/.cargo"
          paths=()
          for path in registry/cache registry/src registry/index git/db git/checkouts; do
            if test -d "$path"; then paths+=("$path"); fi
          done
          tar -czf "$RUNNER_TEMP/authbus-cargo-cache.tar.gz" "${paths[@]}"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 codex-rs/Cargo.lock > "$RUNNER_TEMP/authbus-inputs-manifest.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/authbus-inputs-manifest.txt"
          shasum -a 256 "$RUNNER_TEMP/authbus-linux-toolchain.tar.gz" "$RUNNER_TEMP/authbus-cargo-cache.tar.gz" >> "$RUNNER_TEMP/authbus-inputs-manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: authbus-linux-validation-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/authbus-linux-toolchain.tar.gz
            ${{ runner.temp }}/authbus-cargo-cache.tar.gz
            ${{ runner.temp }}/authbus-inputs-manifest.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
