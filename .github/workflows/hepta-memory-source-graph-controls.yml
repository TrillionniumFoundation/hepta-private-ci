name: Hepta Memory A/C/D original-source controls (historical shadow)
on:
  pull_request:
    paths:
      - 'qa/stem-bakeoff/memory_source_graph_controls.mjs'
      - 'qa/stem-bakeoff/test_memory_source_graph_controls.mjs'
      - 'qa/stem-bakeoff/evidence/20261023-source-only-ACD/**'
      - 'docs/learning/MEMORY_SOURCE_GRAPH_CONTROLS_20261023.md'
      - '.github/workflows/hepta-memory-source-graph-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hepta-memory-source-graph-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  actual-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact triggering commit and JS tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --version
          node --check qa/stem-bakeoff/memory_source_graph_controls.mjs
          node --check qa/stem-bakeoff/test_memory_source_graph_controls.mjs
          node qa/stem-bakeoff/test_memory_source_graph_controls.mjs
          git diff --check
      - name: Fetch original pinned LoCoMo from public source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/locomo-probe"
          curl --fail --location --retry 3 --max-time 240 \
            'https://raw.githubusercontent.com/snap-research/locomo/3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376/data/locomo10.json' \
            --output "$RUNNER_TEMP/locomo-probe/locomo10.json"
          echo '79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4  '"$RUNNER_TEMP/locomo-probe/locomo10.json" | sha256sum --check
      - name: Run actual A/C/D original-source retrieval and deterministic result audit
        run: |
          set -euo pipefail
          node qa/stem-bakeoff/memory_source_graph_controls.mjs \
            "$RUNNER_TEMP/locomo-probe/locomo10.json" \
            "$RUNNER_TEMP/locomo-probe/predictions.json" \
            "$RUNNER_TEMP/locomo-probe/report.json"
          node - <<'NODE'
          const fs=require('fs');
          const observed=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/locomo-probe/report.json'));
          const frozen=JSON.parse(fs.readFileSync('qa/stem-bakeoff/evidence/20261023-source-only-ACD/report.json'));
          const ids=['A','C','D'];
          for(const id of ids){
            if(observed.results[id].planned_questions!==1331 || observed.results[id].scorable!==1022) throw Error('census '+id);
            if(JSON.stringify(observed.results[id])!==JSON.stringify(frozen.results[id]))throw Error('source or algorithm drift '+id);
          }
          if(JSON.stringify(observed.descriptive_contrasts)!==JSON.stringify(frozen.descriptive_contrasts))throw Error('paired contrast drift');
          if(observed.all_arms_A_to_I_complete!==false || observed.whole_answer_scored!==false ||
             observed.authority!=='SHADOW_ONLY/DENY_ALL/HOLD_NO_GO')throw Error('invalid qualification claim');
          NODE
      - name: Upload actual row-level predictions for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-memory-source-acd-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/locomo-probe/predictions.json
            ${{ runner.temp }}/locomo-probe/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm code and frozen evidence unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code
