name: Final single-main convergence V3

on:
  push:
    branches:
      - ops/final-main-convergence-v3-20260908
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: final-main-convergence-v3
  cancel-in-progress: false

jobs:
  converge-promote-clean:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'seal every branch into one tested main lineage')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out final convergence controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ops/final-main-convergence-v3-20260908
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Configure repository CI prerequisites
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Execute tested promotion and single-main cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          HEPTA_ADMIN_TOKEN: ${{ secrets.HEPTA_ADMIN_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: bash .github/scripts/finalize_single_main_v3.sh

      - name: Upload final convergence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-single-main-v3-${{ github.sha }}
          path: |
            convergence/
            ${{ runner.temp }}/final-single-main-evidence/
          if-no-files-found: warn
          retention-days: 90
