name: Hepta E2 real Beans three-archive provisional audit (DENY_ALL)
on:
  push:
    branches:
      - research/e2-beans-real-negative-evidence-20261015
permissions:
  contents: read
jobs:
  independent-three-archive-contract:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded independent SVD dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Verify fail-closed three-archive control under normal and optimized Python
        shell: bash
        env:
          PYTHONPATH: experiments/shared_stem_cell
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/shared_stem_cell -p 'test_e2_beans_three_archive_observation.py' -v
          python -O -m unittest discover -s experiments/shared_stem_cell -p 'test_e2_beans_three_archive_observation.py' -v
          python -m compileall -q experiments/shared_stem_cell/e2_beans_three_archive_observation.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('qualification/e2-original-beans/ACTUAL_THREE_ARCHIVE_PRELIMINARY_20261015.json')
          v=json.loads(p.read_text())
          assert v['four_original_archives_full_audit_passed'] is False
          assert v['fourth_original_independent_geometry_zip_received'] is False
          assert v['production_accepted'] is False
          assert v['stem_selected'] is False
          assert v['authority'] == 'DENY_ALL'
          assert v['correct']['fitted'] == v['correct']['vision_ridge'] == v['correct']['vision_prototype'] == 20
          assert v['fitted_bridge_equals_vision_ridge_prediction_labels'] == 24
          PY
