name: Hepta Neuron one-time Prettier audit export

on:
  pull_request:
    paths:
      - ".github/workflows/hepta-neuron-prettier-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatter-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read exact experimental source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Report exact Prettier 3.5.3 transformation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package prettier@3.5.3 prettier --write .github/workflows/hepta-neuron-matched-cpu.yml
          echo "=== BEGIN MATCHED CPU YAML FORMAT PATCH ==="
          git diff -- .github/workflows/hepta-neuron-matched-cpu.yml
          echo "=== END MATCHED CPU YAML FORMAT PATCH ==="
