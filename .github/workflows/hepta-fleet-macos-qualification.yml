name: hepta Fleet immutable publication

on:
  pull_request:
    paths:
      - .github/workflows/hepta-fleet-macos-qualification.yml
      - codex-rs/hepta-fleet/**
      - qualification/fleet-macos-permissions/**

permissions:
  contents: read

concurrency:
  group: hepta-fleet-filesystem-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native:
    if: github.head_ref == 'fix/private-ci-fleet-macos-20261103'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
      - name: Install the original compiler for an operation comparison
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.151
      - name: Observe actual operations and run the original complete Fleet suite
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fleet-target
        run: python3 qualification/fleet-macos-permissions/run_qualification.py --output "$RUNNER_TEMP/fleet-qualification"
      - name: Retain actual observations including original failures
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fleet-${{ matrix.runner }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/fleet-qualification
          if-no-files-found: error
          retention-days: 7
