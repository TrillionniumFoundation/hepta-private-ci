name: Publish knowledge.graph convergence from single hosted lane

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hepta-kg-convergence-rog.yml'
      - 'scripts/hepta-kg-g14-docs-finalize.py'

permissions:
  contents: write

concurrency:
  group: hepta-kg-convergence-managed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  CANDIDATE_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  apply:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source and publisher identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          case "$RUNNER_ARCH" in
            X64|ARM64) ;;
            *) printf 'unexpected publisher architecture: %s\n' "$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          EVIDENCE_DIR="$RUNNER_TEMP/kg-convergence-managed"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          git archive --format=tar.gz --output="$EVIDENCE_DIR/input-source.tar.gz" HEAD
          printf '%s\n' "$SOURCE_SHA" > "$EVIDENCE_DIR/input-sha.txt"
          printf '%s\n' "$RUNNER_NAME" > "$EVIDENCE_DIR/runner-name.txt"
          printf '%s\n' "$RUNNER_OS" > "$EVIDENCE_DIR/runner-os.txt"
          printf '%s\n' "$RUNNER_ARCH" > "$EVIDENCE_DIR/runner-arch.txt"
          uname -a | tee "$EVIDENCE_DIR/host.log"
          python3 scripts/test_hepta_kg_convergence_finalize.py -v 2>&1 \
            | tee "$EVIDENCE_DIR/finalizer-tests.log"

      - name: Materialize fail-closed source transformations and G14 docs
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            hepta-kg-convergence-apply-phase1 \
            hepta-kg-convergence-finalize \
            hepta-kg-durable-writer-finalize \
            hepta-kg-retrieval-finalize \
            hepta-kg-scale-benchmark-finalize \
            hepta-kg-g14-docs-finalize; do
            python3 "scripts/$script.py" 2>&1 | tee "$EVIDENCE_DIR/$script.log"
          done
          git diff --check

      - name: Format, lock and compile exact candidate
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$EVIDENCE_DIR/input-Cargo.lock"
          cargo fmt --package codex-hepta-kg --package codex-hepta-memory
          cargo fmt --package codex-hepta-kg --package codex-hepta-memory -- --check
          cargo check -p codex-hepta-kg -p codex-hepta-memory 2>&1 \
            | tee "$EVIDENCE_DIR/cargo-check.log"
          python3 - "$EVIDENCE_DIR/input-Cargo.lock" Cargo.lock <<'PYLOCK'
          import pathlib
          import sys
          import tomllib

          before = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())
          after = tomllib.loads(pathlib.Path(sys.argv[2]).read_text())

          def remove_kg(lock):
              packages = lock["package"]
              kg = [package for package in packages if package["name"] == "codex-hepta-kg"]
              if len(kg) != 1:
                  raise SystemExit("expected one KG lock entry")
              lock["package"] = [
                  package for package in packages if package["name"] != "codex-hepta-kg"
              ]
              return kg[0]

          old, new = remove_kg(before), remove_kg(after)
          old_dependencies = set(old.pop("dependencies", []))
          new_dependencies = set(new.pop("dependencies", []))
          added = new_dependencies - old_dependencies
          if before != after:
              raise SystemExit("refusing an unrelated Cargo.lock update")
          if (
              old != new
              or old_dependencies - new_dependencies
              or any(dependency.split()[0] != "sha2" for dependency in added)
          ):
              raise SystemExit("unexpected KG dependency drift")
          PYLOCK
          cargo check --locked -p codex-hepta-kg -p codex-hepta-memory 2>&1 \
            | tee "$EVIDENCE_DIR/cargo-check-locked.log"

      - name: Run kernel, owner, retrieval and strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          capture() {
            label="$1"; shift
            "$@" 2>&1 | tee "$EVIDENCE_DIR/$label.log"
            status=${PIPESTATUS[0]}
            printf '%s %s\n' "$label" "$status" >> "$EVIDENCE_DIR/command-status.txt"
            return "$status"
          }
          failed=0
          capture kernel-tests cargo test --locked -p codex-hepta-kg -- --nocapture || failed=1
          capture owner-tests cargo test --locked -p codex-hepta-memory --lib cognitive_kg -- --nocapture || failed=1
          capture retrieval-tests cargo test --locked -p codex-hepta-memory --lib cognitive_retrieval -- --nocapture || failed=1
          capture strict-clippy cargo clippy --locked -p codex-hepta-kg -p codex-hepta-memory --all-targets --no-deps -- -D warnings || failed=1
          exit "$failed"

      - name: Commit and bind the tested source locally
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py refresh-indexes
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/test_hepta_knowledge_graph_target_measure.py
          git diff --check
          git config user.name 'Hepta KG Convergence Bot'
          git config user.email 'hepta-kg-convergence@users.noreply.github.com'
          git rm \
            scripts/hepta-kg-convergence-apply-phase1.py \
            scripts/hepta-kg-convergence-finalize.py \
            scripts/hepta-kg-durable-writer-finalize.py \
            scripts/hepta-kg-retrieval-finalize.py \
            scripts/hepta-kg-scale-benchmark-finalize.py \
            scripts/hepta-kg-g14-docs-finalize.py \
            scripts/test_hepta_kg_convergence_finalize.py \
            .github/workflows/hepta-kg-convergence-apply.yml \
            .github/workflows/hepta-kg-convergence-rog.yml
          if test -f .github/workflows/hepta-kg-source-diagnostic.yml; then
            git rm .github/workflows/hepta-kg-source-diagnostic.yml
          fi
          git add -A
          git commit -s -m 'knowledge.graph: materialize bounded indexed generation pipeline'
          python3 scripts/hepta-implementation-maps.py migrate --module knowledge.graph
          git add docs/modules/knowledge.graph/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -s -m 'docs(knowledge.graph): bind materialized source identity'
          fi
          test -z "$(git status --porcelain)"
          SHA="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          python3 scripts/hepta-implementation-maps.py verify \
            --module knowledge.graph \
            --expected-sha "$SHA" \
            --expected-tree "$TREE"
          printf 'sha=%s\ntree=%s\n' "$SHA" "$TREE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SHA" > "$EVIDENCE_DIR/candidate-sha.txt"
          printf '%s\n' "$TREE" > "$EVIDENCE_DIR/candidate-tree.txt"
          git bundle create "$EVIDENCE_DIR/candidate.bundle" HEAD

      - name: Execute canonical-cardinality high-fanout benchmark
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p codex-hepta-kg \
            canonical_cardinality_high_fanout_benchmark_receipt -- --ignored --nocapture \
            2>&1 | tee "$EVIDENCE_DIR/kernel-benchmark-raw.log"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys
          directory = pathlib.Path(sys.argv[1])
          raw = (directory / 'kernel-benchmark-raw.log').read_text(encoding='utf-8')
          prefix = 'HEPTA_KNOWLEDGE_GRAPH_KERNEL_BENCHMARK='
          lines = [line.split(prefix, 1)[1].strip() for line in raw.splitlines() if prefix in line]
          if len(lines) != 1:
              raise SystemExit('expected one executed kernel benchmark receipt')
          receipt = json.loads(lines[0])
          expected = {'nodes': 4096, 'edges': 32768, 'returnedEdges': 128, 'omittedEdges': 32640}
          for key, value in expected.items():
              if receipt.get(key) != value:
                  raise SystemExit(f'kernel benchmark mismatch: {key}')
          receipt['sourceSha'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt['sourceTree'] = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          receipt['rawLogSha256'] = hashlib.sha256(raw.encode()).hexdigest()
          receipt['runnerName'] = os.environ['RUNNER_NAME']
          receipt['runnerOs'] = os.environ['RUNNER_OS']
          receipt['runnerArch'] = os.environ['RUNNER_ARCH']
          receipt['hostClass'] = 'github-hosted-pre-main-assembly-nonqualifying'
          (directory / 'kernel-benchmark.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Retain benchmark JSON, raw logs and candidate bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-graph-publisher-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kg-convergence-managed
          if-no-files-found: error
          retention-days: 90

      - name: Publish only unchanged-source tested candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin "$CANDIDATE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git push origin "HEAD:$CANDIDATE_BRANCH"
