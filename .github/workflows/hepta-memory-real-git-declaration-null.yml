name: MemoryCell original Git declaration content-null (no Reader)
on:
  push:
    branches:
      - codex/memory-declaration-content-null-20261015
    paths:
      - scripts/memory_cell/real_git_declaration_null.py
      - scripts/memory_cell/test_real_git_declaration_null.py
      - scripts/memory_cell/data/real-git-declaration-null-original-v3-v4-20261015.json
      - .github/workflows/hepta-memory-real-git-declaration-null.yml
permissions:
  contents: read
  actions: read
jobs:
  source-only-declaration-null:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts/memory_cell
      GH_TOKEN: ${{ github.token }}
      MEMORY_REAL_SOURCE_ZIP: /tmp/memory-git-decl-null/original.zip
      MEMORY_REOPEN_ZIP: /tmp/memory-git-decl-null/reopen.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact branch head and no model installation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Download immutable Git originals and separate binary re-open
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-git-decl-null
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11778273351/zip' \
            -o "$MEMORY_REAL_SOURCE_ZIP"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11779107585/zip' \
            -o "$MEMORY_REOPEN_ZIP"
          echo "a4c7b9868461c11558546bd582796255cbca682c938a1704d62cd93a556406b4  $MEMORY_REAL_SOURCE_ZIP" | sha256sum --check
          echo "59dee0a84099f6fb101dbfd5420c569f10c44a2d8a7b67c984e381edf4db9d36  $MEMORY_REOPEN_ZIP" | sha256sum --check
      - name: Original-source and tamper regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/memory_cell/real_git_declaration_null.py scripts/memory_cell/test_real_git_declaration_null.py
          python3 -m unittest discover -s scripts/memory_cell -p 'test_real_git_declaration_null.py' -v
      - name: Independently recompute full original-source baseline
        run: |
          set -euo pipefail
          mkdir -p /tmp/memory-git-decl-null/results
          python3 scripts/memory_cell/real_git_declaration_null.py \
            --source-zip "$MEMORY_REAL_SOURCE_ZIP" \
            --reopen-zip "$MEMORY_REOPEN_ZIP" \
            --output /tmp/memory-git-decl-null/results/declaration-null.json
          echo 'dcb07251773e5203319d462e56d9077c130d1540a1fa08c3a946ebf3e868c3ae  /tmp/memory-git-decl-null/results/declaration-null.json' | sha256sum --check
          cmp /tmp/memory-git-decl-null/results/declaration-null.json \
            scripts/memory_cell/data/real-git-declaration-null-original-v3-v4-20261015.json
          git rev-parse HEAD > /tmp/memory-git-decl-null/results/tested-commit.txt
          (cd /tmp/memory-git-decl-null/results && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-git-declaration-syntax-null
          path: /tmp/memory-git-decl-null/results
          if-no-files-found: warn
