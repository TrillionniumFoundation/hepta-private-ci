name: Hepta Lane E repository closure

on:
  push:
    branches:
      - codex/hepta-lane-e-gap-closure-20260910
    paths:
      - .github/workflows/hepta-lane-e-repository-closure.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hepta-lane-e-repository-closure
  cancel-in-progress: false

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Apply bounded source repairs and remove one-shot machinery
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --fix --locked --allow-dirty --allow-staged \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets -- -D warnings
          cargo fmt \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification
          cd ..
          rm -f \
            .github/workflows/hepta-lane-e-autofix.yml \
            .github/workflows/hepta-lane-e-final-lint-fix.yml \
            .github/workflows/hepta-lane-e-materialize-generated.yml \
            .github/workflows/hepta-lane-e-terminal-autofix.yml \
            .github/workflows/hepta-lane-e-repository-closure.yml

      - name: Verify complete repository-controlled Lane E closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-lane-e-closure.py self-test
          python3 scripts/hepta-lane-e-closure.py verify
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -- --nocapture
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-shadow-qualification \
            lane_e_causal_candidate_chain_is_digest_bound_and_deny_all \
            -- --nocapture --test-threads=1
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-learning-ledger \
            -p codex-hepta-learning-artifacts \
            -p codex-hepta-bellman-operator \
            -p codex-hepta-intelligence-eval \
            -p codex-hepta-shadow-qualification \
            --all-targets -- -D warnings
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-shadow-qualification \
            -- --check
          git diff --check

      - name: Emit bounded repository closure receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/lane-e
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "hepta.lane-e.repository-closure-receipt.v1",
              "schemaVersion": 1,
              "lane": "LANE-E-LEARNING",
              "inputHead": os.environ["GITHUB_SHA"],
              "repositoryControlledGaps": "closed",
              "closedWorldVerifier": "passed",
              "lockedAllTargetCompilation": "passed",
              "ownerRegressionSuites": "passed",
              "crossCrateCausalClosure": "passed",
              "strictClippyWarnings": 0,
              "rustfmt": "passed",
              "authorityDelta": "none",
              "externalEvidenceBoundary": "RDY-EXT receipts remain independently issued and are not synthesized by this workflow",
          }
          Path("qualification/lane-e/REPOSITORY_CLOSURE_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m json.tool qualification/lane-e/REPOSITORY_CLOSURE_RECEIPT.json >/dev/null

      - name: Commit verified final candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              codex-rs/Cargo.lock|\
              codex-rs/hepta-learning-ledger/*|\
              codex-rs/hepta-learning-artifacts/*|\
              codex-rs/hepta-bellman-operator/*|\
              codex-rs/hepta-intelligence-eval/*|\
              codex-rs/hepta-shadow-qualification/*|\
              qualification/lane-e/REPOSITORY_CLOSURE_RECEIPT.json|\
              .github/workflows/hepta-lane-e-autofix.yml|\
              .github/workflows/hepta-lane-e-final-lint-fix.yml|\
              .github/workflows/hepta-lane-e-materialize-generated.yml|\
              .github/workflows/hepta-lane-e-terminal-autofix.yml|\
              .github/workflows/hepta-lane-e-repository-closure.yml) ;;
              *) echo "unexpected closure path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check
          git config user.name hepta-lane-e-bot
          git config user.email hepta-lane-e-bot@users.noreply.github.com
          git commit -m 'chore(lane-e): seal repository-controlled closure'
          git push origin HEAD:codex/hepta-lane-e-gap-closure-20260910
