name: Matched direct and backprop encoder readout
on:
  push:
    branches: [research/frozen-encoder-matched-edit-20261123]
    paths: ['qualification/cell-e3-encoder-transfer-20261123/matched-edit/compare.py', '.github/workflows/hepta-matched-encoder-readout.yml']
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            qualification/cell-e3-encoder-transfer-20261123
            qualification/cell-e3-native-answer-transfer-20261123
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          python -m pip install --disable-pip-version-check numpy==2.3.5 transformers==4.57.3 requests tokenizers==0.22.2
      - name: Acquire verified pretrained encoder
        working-directory: qualification/cell-e3-encoder-transfer-20261123
        run: python assets.py "$RUNNER_TEMP/encoder"
      - name: Reproduce the previous design matrix and measure both solvers
        working-directory: qualification/cell-e3-encoder-transfer-20261123
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python matched-edit/compare.py "$RUNNER_TEMP/encoder"
          sha256sum "$RUNNER_TEMP/matched-encoder.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matched-encoder-evidence
          path: ${{ runner.temp }}/matched-encoder.json
          if-no-files-found: error
