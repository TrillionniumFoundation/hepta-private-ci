name: Prompt Registry Convergence Step 1

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - scripts/prompt_registry_convergence_step1.py
      - .github/workflows/prompt-registry-convergence-step1.yml

permissions:
  contents: write

concurrency:
  group: prompt-registry-convergence-step1
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Converge, qualify and fast-forward the current candidate
        env:
          TARGET_BRANCH: work/product-convergence-20260923
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "convergence attempt ${attempt}"
            git fetch origin "${TARGET_BRANCH}"
            tested_parent="$(git rev-parse "origin/${TARGET_BRANCH}")"
            git reset --hard "${tested_parent}"

            if [[ ! -f scripts/prompt_registry_convergence_step1.py ]]; then
              echo "one-shot materializer already removed by a successful run"
              exit 0
            fi
            python3 scripts/prompt_registry_convergence_step1.py
            rm -f scripts/prompt_registry_convergence_step1.py
            rm -f .github/workflows/prompt-registry-convergence-step1.yml

            pushd codex-rs
            cargo fmt -p codex-hepta-prompt-registry
            cargo fmt -p codex-hepta-prompt-registry -- --check
            just test --locked -p codex-hepta-prompt-registry --retries 0
            cargo check --locked -p codex-hepta-prompt-registry --all-targets
            cargo clippy --locked -p codex-hepta-prompt-registry --all-targets -- -D warnings
            popd
            git diff --check

            git fetch origin "${TARGET_BRANCH}"
            current_remote="$(git rev-parse "origin/${TARGET_BRANCH}")"
            if [[ "${current_remote}" != "${tested_parent}" ]]; then
              echo "candidate advanced from ${tested_parent} to ${current_remote}; retesting the new head"
              continue
            fi

            git config user.name "ProfHepta"
            git config user.email "102159240+ProfHepta@users.noreply.github.com"
            git add -A
            git commit -s -m "fix(prompt.registry): preserve profile and retry invariants"
            git push origin "HEAD:${TARGET_BRANCH}"
            exit 0
          done
          echo "candidate did not stabilize within bounded convergence attempts" >&2
          exit 75
