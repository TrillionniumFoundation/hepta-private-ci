name: Hepta learning.eval trusted PR reporter

# This workflow is evaluated from the default branch. It never checks out or
# executes candidate source. Candidate artifacts are treated as untrusted data
# and must pass a strict allowlisted artifact inventory, duplicate-key, schema,
# digest, complete producer-job, Git-object, producer-workflow and qualification-
# control-plane byte-identity, and current-PR validation.
on:
  workflow_run:
    workflows:
      - Hepta learning.eval convergence
      - Hepta learning.eval exact trees
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: learning-eval-trusted-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    name: report-validated-evidence
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: context
        name: Resolve trusted workflow-run context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const pulls = Array.isArray(run.pull_requests) ? run.pull_requests : [];
            if (pulls.length !== 1) {
              core.setFailed(`expected exactly one pull request, found ${pulls.length}`);
              return;
            }
            let marker;
            let prefix;
            let summary;
            if (run.name === 'Hepta learning.eval convergence') {
              marker = 'source';
              prefix = 'learning-eval-aggregate';
              summary = 'qualification-summary.json';
            } else if (run.name === 'Hepta learning.eval exact trees') {
              marker = 'exact';
              prefix = 'learning-eval-exact-summary';
              summary = 'exact-summary.json';
            } else {
              core.setFailed(`unapproved producer workflow: ${run.name}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(run.head_sha)) {
              core.setFailed('producer head SHA is not a full lowercase commit SHA');
              return;
            }
            core.setOutput('marker', marker);
            core.setOutput('summary', summary);
            core.setOutput('pull_request', String(pulls[0].number));
            core.setOutput(
              'artifact',
              `${prefix}-${run.head_sha}-${run.id}-${run.run_attempt}`,
            );

      - name: Checkout trusted reporter from the default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Self-test trusted reporting control plane
        run: python3 scripts/test_hepta_learning_eval_trusted_report.py -v

      - name: Download untrusted evidence as data only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.context.outputs.artifact }}
          path: .hepta-trusted-report/artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Strictly validate evidence and update the current Draft PR only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/hepta-learning-eval-trusted-entry.py \
            --artifact-root .hepta-trusted-report/artifact \
            --summary-name '${{ steps.context.outputs.summary }}' \
            --marker '${{ steps.context.outputs.marker }}' \
            --repository '${{ github.repository }}' \
            --run-id '${{ github.event.workflow_run.id }}' \
            --run-attempt '${{ github.event.workflow_run.run_attempt }}' \
            --source-sha '${{ github.event.workflow_run.head_sha }}' \
            --pull-request '${{ steps.context.outputs.pull_request }}'
