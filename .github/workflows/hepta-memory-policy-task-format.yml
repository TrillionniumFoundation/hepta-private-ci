name: MemoryCell isolated policy-task formatter
on:
  pull_request:
    paths:
      - '.github/workflows/hepta-memory-policy-task-format.yml'
permissions:
  contents: read
jobs:
  format-candidate:
    if: github.event.pull_request.number == 1452 && github.head_ref == 'codex/memory-cell-evidence-20261008' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-ci
      - name: Format a separate review candidate without changing the PR ref
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/policy-format
          /tmp/policy-format/bin/pip install uv==0.8.22
          export PATH="/tmp/policy-format/bin:$PATH"
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          names = ['policy_read_audit.py', 'test_policy_read_audit.py', 'event_reader_experiment.py']
          before = {str(Path('scripts/memory_cell', n)): ast.dump(ast.parse(Path('scripts/memory_cell', n).read_text())) for n in names}
          Path('/tmp/policy-ast.json').write_text(json.dumps(before))
          PY
          git fetch --no-tags --depth=1 origin "$BASE"
          just fmt --base "$BASE"
          python3 - <<'PY'
          import ast, json, subprocess
          from pathlib import Path
          before = json.loads(Path('/tmp/policy-ast.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) <= set(before), 'out-of-scope formatter mutation'
          for name, value in before.items():
              assert ast.dump(ast.parse(Path(name).read_text())) == value, 'executable AST changed'
          if changed:
              subprocess.run(['git', 'add', '--', *changed], check=True)
          PY
          git rm .github/workflows/hepta-memory-policy-task-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(memory-cell): format policy task sources and remove temporary formatter'
          git push origin "HEAD:refs/heads/codex/memory-policy-task-format-${GITHUB_RUN_ID}"
          echo "REVIEW_CANDIDATE_SHA=$(git rev-parse HEAD)"
