name: MemoryCell pinned 40+72 citation-chain disposition
on:
  pull_request:
    paths:
      - "scripts/memory_cell/disjoint_chain_disposition.py"
      - "scripts/memory_cell/test_disjoint_chain_disposition.py"
      - ".github/workflows/hepta-memory-disjoint-chain-disposition.yml"
  push:
    branches:
      - codex/memory-cell-four-stage-gate-20261014
    paths:
      - "scripts/memory_cell/disjoint_chain_disposition.py"
      - "scripts/memory_cell/test_disjoint_chain_disposition.py"
      - ".github/workflows/hepta-memory-disjoint-chain-disposition.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-disjoint-chain-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
jobs:
  original-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Negative controls before opening actual model results
        env:
          PYTHONPATH: scripts/memory_cell
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/memory_cell/disjoint_chain_disposition.py scripts/memory_cell/test_disjoint_chain_disposition.py
          python3 -m unittest discover -s scripts/memory_cell -p "test_disjoint_chain_disposition.py" -v
      - name: Locked Ruff formatting gate (no waiver)
        run: |
          set -euo pipefail
          python3 -m pip install uv==0.8.22
          uv run --frozen --project scripts ruff format --check scripts/memory_cell/disjoint_chain_disposition.py scripts/memory_cell/test_disjoint_chain_disposition.py
      - name: Preserve exact formatter repair on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/disjoint-format
          if command -v uv >/dev/null 2>&1; then
            uv run --frozen --project scripts ruff format --diff scripts/memory_cell/disjoint_chain_disposition.py scripts/memory_cell/test_disjoint_chain_disposition.py > /tmp/disjoint-format/ruff.patch || true
            uv run --frozen --project scripts ruff format scripts/memory_cell/disjoint_chain_disposition.py scripts/memory_cell/test_disjoint_chain_disposition.py
            printf 'DISJOINT_FMT_SOURCE='
            base64 -w0 scripts/memory_cell/disjoint_chain_disposition.py
            printf '\nDISJOINT_FMT_TEST='
            base64 -w0 scripts/memory_cell/test_disjoint_chain_disposition.py
            printf '\n'
          fi
          git rev-parse HEAD > /tmp/disjoint-format/source-commit.txt
          (cd /tmp/disjoint-format && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: disjoint-chain-scoped-ruff-repair
          path: /tmp/disjoint-format
          if-no-files-found: warn
      - name: Retrieve only already generated immutable model and audit ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11871334405/zip > /tmp/disjoint-release.zip
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11872308065/zip > /tmp/disjoint-replay.zip
      - name: Verify original ZIPs and reconstruct read-only citation gaps
        run: |
          set -euo pipefail
          mkdir -p /tmp/disjoint-adjudication
          python3 scripts/memory_cell/disjoint_chain_disposition.py /tmp/disjoint-release.zip /tmp/disjoint-replay.zip --output /tmp/disjoint-adjudication/result.json
          sha256sum /tmp/disjoint-release.zip /tmp/disjoint-replay.zip > /tmp/disjoint-adjudication/original-zip-sha256.txt
          git rev-parse HEAD > /tmp/disjoint-adjudication/auditor-commit.txt
          printf '%s\n' "bc76ac57ba972bf105c71ddd997cd215cec5df2e" > /tmp/disjoint-adjudication/original-model-source-commit.txt
          (cd /tmp/disjoint-adjudication && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-disjoint-40x72-original-citation-disposition
          path: /tmp/disjoint-adjudication
          if-no-files-found: error
