name: ARM64 exact Stem source-only and offline-adversarial tests
on:
  push:
    branches: [ci/gha-stem-portable-arm-20261016]
    paths: [.github/workflows/gha-stem-arm-portable.yml]

permissions:
  contents: read

# These are the immutable parent PR source tests, not physical model production.
# The 75-minute original pretrained physical check stays x64 and fail-closed.
jobs:
  stem-source-only:
    name: Stem V1 exact source-only tests on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a6e0ba8573299faea5d59ee28bd4b5689f59727
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only adversarial tests
        working-directory: qualification/stem-cell-v1
        run: |
          python -m unittest -v test_multimodal_stem_v1
          python -O -m unittest -v test_multimodal_stem_v1
          python -m py_compile multimodal_stem_v1.py test_multimodal_stem_v1.py
      - name: Verify no source-only authorization
        working-directory: qualification/stem-cell-v1
        run: |
          python - <<'PY'
          from multimodal_stem_v1 import audit_split
          r=audit_split([0]*200,[1]*200,[1]*200,0)
          assert r["authority"]=="DENY_ALL"
          assert r["split_authorized"] is False
          assert r["quality_attested"] is False
          PY
  stem-v2-offline-adversarial:
    name: Stem V2 exact source-only offline adversarial tests on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a6e0ba8573299faea5d59ee28bd4b5689f59727
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact-source byte-bound V1 and V2 tests
        working-directory: qualification/stem-cell-v1
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m unittest -v test_multimodal_stem_v1 test_granite97_feature_bridge_v2 test_granite97_two_cell_shadow_v2
          python -O -m unittest -v test_multimodal_stem_v1 test_granite97_feature_bridge_v2 test_granite97_two_cell_shadow_v2
          python -m py_compile multimodal_stem_v1.py granite97_feature_bridge_v2.py \
            granite97_two_cell_shadow_v2.py test_multimodal_stem_v1.py \
            test_granite97_feature_bridge_v2.py test_granite97_two_cell_shadow_v2.py
