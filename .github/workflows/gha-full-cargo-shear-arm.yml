name: Exact Full CI Cargo shear on ARM64
on:
  push:
    branches: [ci/gha-full-cargo-shear-arm-20261016]
    paths: [.github/workflows/gha-full-cargo-shear-arm.yml]
permissions:
  contents: read
# Original full rust-ci-full.yml cargo_shear steps and tool pin, runner-only change.
jobs:
  cargo_shear:
    timeout-minutes: 30
    name: cargo shear
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --locked

