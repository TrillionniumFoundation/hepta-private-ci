name: Hepta NDU terminal covariance research

on:
  pull_request:
    paths:
      - qa/ndu-terminal-portfolio/**
      - .github/workflows/hepta-ndu-terminal-risk.yml
  push:
    paths:
      - qa/ndu-terminal-portfolio/**
      - .github/workflows/hepta-ndu-terminal-risk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndu-terminal-risk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency
        run: "python -m pip install --no-cache-dir --only-binary=:all: numpy==2.2.6"
      - name: Execute fail-closed covariance contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s qa/ndu-terminal-portfolio -p 'test_*.py' -v
      - name: Record non-authorizing evidence boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          These are synthetic schema/numerical regressions for a shadow-only research estimator.
          No real Cell rollout or blind holdout is executed by this workflow.
          This job never authorizes production promotion, device effects, or topology evolution.
          EOF
