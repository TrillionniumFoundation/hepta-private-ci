name: Hepta NDU terminal covariance research

on:
  pull_request:
    paths:
      - "qa/ndu-terminal-portfolio/**"
      - ".github/workflows/hepta-ndu-terminal-risk.yml"
  push:
    paths:
      - "qa/ndu-terminal-portfolio/**"
      - ".github/workflows/hepta-ndu-terminal-risk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndu-terminal-risk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contracts:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency
        run: "python -m pip install --no-cache-dir --only-binary=:all: numpy==2.2.6"
      - name: Execute fail-closed covariance contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s qa/ndu-terminal-portfolio -p 'test_*.py' -v
      - name: Require unchanged source checkout
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Record non-authorizing evidence boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          These are synthetic schema/numerical regressions for a shadow-only research estimator.
          No real Cell rollout or blind holdout is executed by this workflow.
          This job never authorizes production promotion, device effects, or topology evolution.
          EOF
