name: ui.native remediation branch formatter

on:
  push:
    branches: [work/ui-native-acceptance-repair-20260927, work/ui-native-closure-20260927]
    paths:
      - apps/hepta-native/**/*.rs
      - codex-rs/hepta-native-gateway/**/*.rs
      - codex-rs/hepta-contracts/**/*.rs
      - codex-rs/hepta-private-state/**/*.rs
      - .github/workflows/hepta-ui-native-remediation-format.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-native-format-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal:
    name: exact-source Rust formatting proposal (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable input and install pinned formatter
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Produce a scoped patch, never mutate a live branch
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-native-gateway -p codex-hepta-contracts -p codex-hepta-private-state
          mkdir -p native-format-proposal
          git diff --binary --exit-code > native-format-proposal/format.patch || test "$?" = 1
          git rev-parse HEAD HEAD^{tree} > native-format-proposal/source.txt
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, subprocess
          roots = ('apps/hepta-native/', 'codex-rs/hepta-native-gateway/',
                   'codex-rs/hepta-contracts/', 'codex-rs/hepta-private-state/')
          names = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          if any(p and (not p.startswith(roots) or not p.endswith('.rs')) for p in names):
              raise SystemExit('formatter changed an unapproved path')
          patch = pathlib.Path('native-format-proposal/format.patch')
          report = {'schema': 'hepta.ui.native.format-proposal.v1',
                    'sourceSha': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                    'patchSha256': hashlib.sha256(patch.read_bytes()).hexdigest(),
                    'changesRequired': bool(patch.stat().st_size),
                    'qualificationPassed': False, 'releaseAuthorized': False}
          patch.with_name('proposal.json').write_text(json.dumps(report, indent=2) + '\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-native-format-proposal-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: native-format-proposal
          if-no-files-found: error
          retention-days: 7
