name: kernel.evidence one-shot Lane-A truth sync

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: kernel-evidence-lane-a-sync-once
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/kernel-evidence-production-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/kernel-evidence-production-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize Lane-A truth order and remove this task
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          target = Path("docs/lane-a-foundation/MODULE_TRUTH_MATRIX.json")
          payload = json.loads(target.read_text(encoding="utf-8"))
          order = [
              "platform.types",
              "platform.wire",
              "kernel.authority",
              "kernel.operations",
              "kernel.evidence",
              "auth.authbus",
              "secrets.heptabao",
          ]
          by_name = {row["module"]: row for row in payload["modules"]}
          if set(by_name) != set(order):
              raise SystemExit("Lane-A module inventory drifted")
          payload["modules"] = [by_name[name] for name in order]
          target.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          rm -f .github/workflows/kernel-evidence-native-hotfix-once.yml
          git diff --check
          git config user.name "kernel-evidence-closure"
          git config user.email "kernel-evidence-closure@users.noreply.github.com"
          git add -A
          git commit -m "docs(kernel.evidence): synchronize Lane-A truth order [kernel-evidence-closure]"
          git push origin HEAD:fix/kernel-evidence-production-closure
