name: control.runtime one-shot convergence finalizer

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/control-runtime-apply-rustfmt.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: control-runtime-finalizer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: codex/control-runtime-convergence-v1
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  finalize:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.ref == 'codex/control-runtime-convergence-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Acquire exact target-branch lease
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          fi
          checked_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test -n "$remote_head"
          test "$checked_head" = "$remote_head"
          echo "CHECKED_HEAD=$checked_head" >> "$GITHUB_ENV"

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev

      - name: Close the canonical mapping and recovery-workflow gap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import textwrap
          from pathlib import Path

          map_path = Path("docs/modules/control.runtime/IMPLEMENTATION_MAP.json")
          implementation = json.loads(map_path.read_text(encoding="utf-8"))
          operations = implementation.get("operations")
          if not isinstance(operations, list):
              raise SystemExit("implementation map operations must be a list")

          pending_operation = {
              "operation": "PlannerStoreV1::pending_dispatches_page",
              "nativeSymbol": "codex_hepta_control_plane::PlannerStoreV1::pending_dispatches_page",
              "sourcePath": "codex-rs/hepta-control-plane/src/planner_execution_pending.rs",
              "inputs": [
                  "optional claim-sequence cursor",
                  "bounded page limit",
              ],
              "outputs": [
                  "round-robin DENY_ALL unresolved dispatch evidence",
              ],
              "state": "source_candidate_boundary_uncomposed",
              "authority": "deny_all",
              "nonClaim": "inventory is not redispatch authority and no product recovery controller is composed",
              "tests": [
                  {
                      "path": "codex-rs/hepta-control-plane/src/planner_execution_pending.rs",
                      "symbol": "pending_dispatch_inventory_is_bounded_and_round_robin",
                  },
                  {
                      "path": "codex-rs/hepta-control-plane/src/planner_execution_pending.rs",
                      "symbol": "pending_dispatch_inventory_excludes_conclusive_and_keeps_indeterminate",
                  },
                  {
                      "path": "codex-rs/hepta-control-plane/src/planner_execution_pending.rs",
                      "symbol": "pending_dispatch_inventory_rejects_invalid_bounds_and_poisoned_state",
                  },
                  {
                      "path": "codex-rs/hepta-control-plane/tests/planner_store_process_recovery.rs",
                      "symbol": "synced_frame_survives_abort_without_drop_or_in_memory_publish",
                  },
              ],
              "designOperation": "bounded_pending_dispatch_inventory",
              "mappingClass": "owner_boundary",
              "delegatedCallees": [
                  "PlannerStoreV1 records",
                  "canonical dispatch-claim and terminal-receipt codecs",
              ],
              "sourcePathExists": True,
          }
          fanout_recovery_operation = {
              "operation": "OrganFanoutReceiptV1::continuation",
              "nativeSymbol": "codex_hepta_control_plane::OrganFanoutReceiptV1::continuation",
              "sourcePath": "codex-rs/hepta-control-plane/src/organ_fanout_recovery.rs",
              "inputs": [
                  "complete per-target fanout receipt",
                  "independently retained canonical evidence digest",
              ],
              "outputs": [
                  "DENY_ALL cursor for only the first incomplete route",
                  "fail-closed rejection for drift, contradictory boundaries or incomplete delivered evidence",
              ],
              "state": "source_candidate_boundary_uncomposed",
              "authority": "deny_all",
              "nonClaim": "the cursor is not retry authority and does not provide downstream idempotency, scheduling or backpressure",
              "tests": [
                  {
                      "path": "codex-rs/hepta-control-plane/tests/organ_fanout_receipts.rs",
                      "symbol": "failed_fanout_preserves_the_exact_successful_prefix_digest",
                  },
              ],
              "designOperation": "organ_fanout_fail_closed_continuation",
              "mappingClass": "owner_boundary",
              "delegatedCallees": [
                  "OrganFanoutReceiptV1::evidence_digest",
                  "canonical per-delivery and delivered-prefix identity digests",
              ],
              "sourcePathExists": True,
          }

          replacement_names = {
              pending_operation["operation"],
              fanout_recovery_operation["operation"],
          }
          operations[:] = [
              operation
              for operation in operations
              if operation.get("operation") not in replacement_names
          ]
          organ_index = next(
              (
                  index
                  for index, operation in enumerate(operations)
                  if operation.get("operation") == "OrganHostV1::dispatch_once_with_receipt"
              ),
              len(operations),
          )
          operations.insert(organ_index, pending_operation)
          organ_index = next(
              index
              for index, operation in enumerate(operations)
              if operation.get("operation") == "OrganHostV1::dispatch_once_with_receipt"
          )
          operations.insert(organ_index + 1, fanout_recovery_operation)

          owner_types = implementation.get("ownerLocalTypes")
          if not isinstance(owner_types, list):
              raise SystemExit("implementation map ownerLocalTypes must be a list")
          for name in (
              "PlannerPendingDispatchV1",
              "PlannerPendingDispatchPageV1",
              "OrganFanoutContinuationV1",
          ):
              if name not in owner_types:
                  owner_types.append(name)

          completion = implementation.get("completion")
          if not isinstance(completion, dict):
              raise SystemExit("implementation map completion must be an object")
          completion["pendingDispatchInventory"] = "source_candidate_boundary_uncomposed"
          completion["organFanoutRecoveryCursor"] = "source_candidate_boundary_uncomposed"

          gaps = implementation.get("repositoryControlledGaps")
          if not isinstance(gaps, list):
              raise SystemExit("repositoryControlledGaps must be a list")
          fanout_gap = (
              "Compose the DENY_ALL fanout continuation through a bounded product retry owner "
              "with downstream idempotency and backpressure; never reinterpret the cursor as replay authority."
          )
          if fanout_gap not in gaps:
              gaps.append(fanout_gap)

          map_path.write_text(
              json.dumps(implementation, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          validator_path = Path("scripts/control_runtime_validate_state.py")
          validator = validator_path.read_text(encoding="utf-8")
          insertions = (
              (
                  '    "reconcile_planner_request_v1",\n',
                  '    "PlannerStoreV1::pending_dispatches_page",\n',
              ),
              (
                  '    "OrganHostV1::dispatch_once_with_receipt",\n',
                  '    "OrganFanoutReceiptV1::continuation",\n',
              ),
          )
          for anchor, addition in insertions:
              if addition not in validator:
                  if anchor not in validator:
                      raise SystemExit(f"validator insertion anchor is missing: {anchor!r}")
                  validator = validator.replace(anchor, anchor + addition, 1)
          validator_path.write_text(validator, encoding="utf-8")

          workflow = textwrap.dedent(
              """\
              name: control.runtime crash and recovery regression

              on:
                pull_request:
                  branches: [main]
                  paths:
                    - 'codex-rs/hepta-control-plane/**'
                    - 'docs/modules/control.runtime/**'
                    - 'docs/readiness/CONTROL_RUNTIME_*.md'
                    - 'scripts/control_runtime_validate_state.py'
                    - '.github/workflows/control-runtime-crash-recovery.yml'
                workflow_dispatch:

              permissions:
                contents: read

              concurrency:
                group: control-runtime-crash-recovery-__GROUP_EXPRESSION__
                cancel-in-progress: true

              env:
                CARGO_INCREMENTAL: '0'
                CARGO_BUILD_JOBS: '2'
                CARGO_PROFILE_TEST_DEBUG: '0'
                CARGO_PROFILE_DEV_DEBUG: '0'

              jobs:
                source-and-process-recovery:
                  strategy:
                    fail-fast: false
                    matrix:
                      os: [ubuntu-24.04, macos-14]
                  runs-on: __MATRIX_OS_EXPRESSION__
                  timeout-minutes: 75
                  steps:
                    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
                      with:
                        ref: __CHECKOUT_REF_EXPRESSION__
                        fetch-depth: 1
                        persist-credentials: false

                    - name: Record immutable candidate identity
                      shell: bash
                      run: |
                        set -euo pipefail
                        evidence="$RUNNER_TEMP/control-runtime-recovery-evidence"
                        mkdir -p "$evidence"
                        git rev-parse HEAD > "$evidence/commit.txt"
                        git rev-parse HEAD^{tree} > "$evidence/tree.txt"
                        rustc --version > "$evidence/rustc.txt"
                        cargo --version > "$evidence/cargo.txt"
                        printf '%s\n' "$RUNNER_OS" > "$evidence/runner-os.txt"
                        printf '%s\n' "$RUNNER_ARCH" > "$evidence/runner-arch.txt"

                    - name: Install Linux native prerequisites
                      if: runner.os == 'Linux'
                      run: |
                        sudo apt-get update
                        sudo apt-get install -y build-essential pkg-config libcap-dev

                    - name: Canonical state validation
                      run: python3 scripts/control_runtime_validate_state.py --output "$RUNNER_TEMP/control-runtime-recovery-evidence/state.json"

                    - name: Formatting
                      working-directory: codex-rs
                      run: cargo fmt -p codex-hepta-control-plane -- --check

                    - name: Full control-plane regression suite
                      working-directory: codex-rs
                      run: cargo test --locked -p codex-hepta-control-plane

                    - name: Abnormal process and restore regressions
                      working-directory: codex-rs
                      run: cargo test --locked -p codex-hepta-control-plane --test planner_store_process_recovery -- --nocapture

                    - name: Durable execution hardening regressions
                      working-directory: codex-rs
                      run: cargo test --locked -p codex-hepta-control-plane --test planner_durable_hardening -- --nocapture

                    - name: Fanout evidence and continuation regressions
                      working-directory: codex-rs
                      run: cargo test --locked -p codex-hepta-control-plane --test organ_fanout_receipts -- --nocapture

                    - name: All-target compilation
                      working-directory: codex-rs
                      run: cargo check --locked --all-targets -p codex-hepta-control-plane

                    - name: Strict lint
                      working-directory: codex-rs
                      run: cargo clippy --locked --all-targets -p codex-hepta-control-plane -- -D warnings

                    - name: Preserve exact recovery evidence
                      if: always()
                      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                      with:
                        name: control-runtime-recovery-__ARTIFACT_SHA_EXPRESSION__-__MATRIX_NAME_EXPRESSION__
                        path: __ARTIFACT_PATH_EXPRESSION__
                        if-no-files-found: error
                        retention-days: 30
              """
          )
          expression_open = "$" + "{{"
          workflow = (
              workflow.replace(
                  "__GROUP_EXPRESSION__",
                  expression_open + " github.event.pull_request.number || github.ref }}",
              )
              .replace(
                  "__MATRIX_OS_EXPRESSION__",
                  expression_open + " matrix.os }}",
              )
              .replace(
                  "__CHECKOUT_REF_EXPRESSION__",
                  expression_open + " github.event.pull_request.head.sha || github.sha }}",
              )
              .replace(
                  "__ARTIFACT_SHA_EXPRESSION__",
                  expression_open + " github.event.pull_request.head.sha || github.sha }}",
              )
              .replace(
                  "__MATRIX_NAME_EXPRESSION__",
                  expression_open + " matrix.os }}",
              )
              .replace(
                  "__ARTIFACT_PATH_EXPRESSION__",
                  expression_open + " runner.temp }}/control-runtime-recovery-evidence",
              )
          )
          Path(".github/workflows/control-runtime-crash-recovery.yml").write_text(
              workflow,
              encoding="utf-8",
          )
          Path(".github/workflows/control-runtime-apply-rustfmt.yml").unlink()
          PY

      - name: Canonical formatting
        working-directory: codex-rs
        run: |
          cargo fmt -p codex-hepta-control-plane
          cargo fmt -p codex-hepta-control-plane -- --check

      - name: Refresh mapped Git object identities
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          export INDEX_TREE="$(git write-tree)"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path("docs/modules/control.runtime/IMPLEMENTATION_MAP.json")
          implementation = json.loads(path.read_text(encoding="utf-8"))
          source_objects = implementation.get("sourceObjects")
          if not isinstance(source_objects, list):
              raise SystemExit("sourceObjects must be a list")
          tree = os.environ["INDEX_TREE"]
          for source_object in source_objects:
              source_path = source_object.get("path")
              if not isinstance(source_path, str) or not source_path:
                  raise SystemExit("source object path must be non-empty")
              source_object["object"] = subprocess.check_output(
                  ["git", "rev-parse", f"{tree}:{source_path}"],
                  text=True,
              ).strip()
          path.write_text(
              json.dumps(implementation, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git add docs/modules/control.runtime/IMPLEMENTATION_MAP.json
          git diff --cached --check

      - name: Validate exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/control_runtime_validate_state.py --output "$RUNNER_TEMP/control-runtime-state.json"
          cd codex-rs
          cargo fmt -p codex-hepta-control-plane -- --check
          cargo test --locked -p codex-hepta-control-plane
          cargo check --locked --all-targets -p codex-hepta-control-plane
          cargo clippy --locked --all-targets -p codex-hepta-control-plane -- -D warnings

      - name: Commit and push only the verified fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/control-runtime-apply-rustfmt.yml
          git diff --exit-code
          git diff --cached --check
          remote_head="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$CHECKED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "feat(control.runtime): close recovery evidence mapping"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
