name: Codex intelligence hardening applicator

on:
  push:
    branches:
      - codex/intelligence-control-final-hardening-20260930
    paths:
      - .codex/intelligence-hardening.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact staging branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: codex/intelligence-control-final-hardening-20260930
      - name: Apply reviewed hardening patch and remove staging material
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .codex/intelligence-hardening.patch.xz.b64 \
            | xz --decompress \
            > "$RUNNER_TEMP/intelligence-hardening.patch"
          git apply --index "$RUNNER_TEMP/intelligence-hardening.patch"
          git rm -r .codex
          git rm .github/workflows/codex-intelligence-hardening-apply.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git commit -m "intelligence.control: harden authority and exact dispatch binding"
          git push origin HEAD:codex/intelligence-control-final-hardening-20260930
