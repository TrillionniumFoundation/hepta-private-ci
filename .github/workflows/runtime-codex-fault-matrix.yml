name: runtime.codex fault-matrix static closure

on:
  pull_request:
    branches: [main]
    paths:
      - docs/modules/runtime.codex/**
      - scripts/check-runtime-codex-fault-matrix.py
      - .github/workflows/runtime-codex-fault-matrix.yml
  push:
    branches: [main]
    paths:
      - docs/modules/runtime.codex/**
      - scripts/check-runtime-codex-fault-matrix.py
      - .github/workflows/runtime-codex-fault-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-codex-fault-matrix-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: fault-matrix static closure exact-head
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          {
            echo '### runtime.codex fault-matrix static closure — exact head'
            echo
            echo "- source SHA: \`$actual\`"
            echo "- source tree: \`$tree\`"
            echo '- scope: schema and closed-world matrix validation only'
            echo '- crash/process/fault-injection qualification: not asserted by this job'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Python helper
        run: python3 -m py_compile scripts/check-runtime-codex-fault-matrix.py

      - name: Validate closed-world matrix schema
        run: python3 scripts/check-runtime-codex-fault-matrix.py

      - name: Prove read-only exact-head execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain=v1)"

  deterministic-merge:
    name: fault-matrix static closure deterministic-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Construct exact dual-parent deterministic merge
        id: merge
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"

          merge_tree="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
          test -n "$merge_tree"
          export GIT_AUTHOR_NAME='runtime.codex deterministic merge'
          export GIT_AUTHOR_EMAIL='runtime-codex-merge@invalid'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          merge_sha="$(printf '%s\n' 'runtime.codex deterministic qualification merge' | \
            git commit-tree "$merge_tree" -p "$BASE_SHA" -p "$SOURCE_SHA")"
          git checkout --detach "$merge_sha"

          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$merge_tree"
          test -z "$(git status --porcelain=v1)"

          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "merge_tree=$merge_tree" >> "$GITHUB_OUTPUT"
          {
            echo '### runtime.codex fault-matrix static closure — deterministic merge'
            echo
            echo "- base parent: \`$BASE_SHA\`"
            echo "- source parent: \`$SOURCE_SHA\`"
            echo "- merge SHA: \`$merge_sha\`"
            echo "- merge tree: \`$merge_tree\`"
            echo '- scope: schema and closed-world matrix validation only'
            echo '- crash/process/fault-injection qualification: not asserted by this job'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate closed-world matrix schema
        run: python3 scripts/check-runtime-codex-fault-matrix.py

      - name: Prove read-only merge execution
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          MERGE_TREE: ${{ steps.merge.outputs.merge_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$MERGE_TREE"
          test "$(git rev-parse HEAD^1)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain=v1)"

  required:
    name: runtime.codex fault-matrix static closure required
    if: always()
    needs: [exact-head, deterministic-merge]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required static-closure jobs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.exact-head.result }}" = success
          if test "${{ github.event_name }}" = pull_request; then
            test "${{ needs.deterministic-merge.result }}" = success
          else
            test "${{ needs.deterministic-merge.result }}" = skipped
          fi
