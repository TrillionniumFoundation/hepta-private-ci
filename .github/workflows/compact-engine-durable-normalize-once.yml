name: compact.engine durable owner materialization (one-shot)

on:
  push:
    branches: [fix/compact-engine-current-main-convergence-20260925]
    paths:
      - ".github/workflows/compact-engine-durable-normalize-once.yml"
      - ".github/compact-engine-materialize/**"
      - ".github/compact-engine-stage-bc.patch"

permissions:
  contents: write

env:
  SOURCE_PARENT: 4420a12a0258187032d1d64ab1402f7484291ef8
  PATCH_SHA256: 3610e3e56f865c1047d99b0c2a891751571ded7e7d0eeb0ab95387415314107d
  COORDINATOR_BLOB: d0d9cb9a0cf5bb6d4fa01a44327f40d23cee5721
  DURABLE_BLOB: 1c245c6da5065b354602191251e32be1fb216b99
  LIB_BLOB: 0a77ea031a4d6b2e1aeaca9bdc56386324bf1208

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact transport commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          test "$(git rev-list --count HEAD^..HEAD)" = 1
          cat > "$RUNNER_TEMP/expected-transport-paths" <<'EOF'
          .github/compact-engine-materialize/patch-aa
          .github/compact-engine-materialize/patch-ab
          .github/compact-engine-materialize/patch-ac
          .github/compact-engine-materialize/patch-ad
          .github/compact-engine-materialize/patch-ae-aa
          .github/compact-engine-materialize/patch-ae-ab
          .github/compact-engine-materialize/patch-ae-ac
          .github/compact-engine-materialize/patch-af-aa
          .github/compact-engine-materialize/patch-af-ab
          .github/compact-engine-materialize/patch-af-ac
          .github/compact-engine-stage-bc.patch
          .github/workflows/compact-engine-durable-normalize-once.yml
          EOF
          sort -o "$RUNNER_TEMP/expected-transport-paths" "$RUNNER_TEMP/expected-transport-paths"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/actual-transport-paths"
          diff -u "$RUNNER_TEMP/expected-transport-paths" "$RUNNER_TEMP/actual-transport-paths"

      - name: Reconstruct and verify bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/compact-engine-materialize/patch-* | base64 --decode > "$RUNNER_TEMP/compact-engine.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/compact-engine.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/compact-engine.patch"
          git apply "$RUNNER_TEMP/compact-engine.patch"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/coordinator.rs)" = "$COORDINATOR_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/durable.rs)" = "$DURABLE_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/lib.rs)" = "$LIB_BLOB"
          test ! -e codex-rs/hepta-compact-engine/src/durable_facade.rs
          cat > "$RUNNER_TEMP/expected-source-paths" <<'EOF'
          codex-rs/hepta-compact-engine/src/coordinator.rs
          codex-rs/hepta-compact-engine/src/durable.rs
          codex-rs/hepta-compact-engine/src/durable_facade.rs
          codex-rs/hepta-compact-engine/src/lib.rs
          EOF
          sort -o "$RUNNER_TEMP/expected-source-paths" "$RUNNER_TEMP/expected-source-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-source-paths"
          diff -u "$RUNNER_TEMP/expected-source-paths" "$RUNNER_TEMP/actual-source-paths"
          git diff --check

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy

      - name: Exact source format and build
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compact-engine-materialize-evidence"
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/format.log"
          cargo check --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/check.log"

      - name: Exact source tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/test.log"

      - name: Exact source strict lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-compact-engine -p codex-hepta-agentd --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/compact-engine-materialize-evidence/clippy.log"

      - name: Commit tested source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object codex-rs/hepta-compact-engine/src/coordinator.rs)" = "$COORDINATOR_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/durable.rs)" = "$DURABLE_BLOB"
          test "$(git hash-object codex-rs/hepta-compact-engine/src/lib.rs)" = "$LIB_BLOB"
          rm -rf .github/compact-engine-materialize
          rm -f .github/workflows/compact-engine-durable-normalize-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'compact.engine materializer'
          git config user.email 'compact-engine-materializer@invalid.example'
          git commit -m 'refactor(compact.engine): converge durable transaction owner'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Retain failed-or-successful materialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-engine-materialize-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-engine-materialize-evidence/
          if-no-files-found: warn
          retention-days: 7
