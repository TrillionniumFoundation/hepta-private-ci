name: Apply secrets.heptabao remediation patch

on:
  push:
    branches:
      - codex/secrets-heptabao-convergence
    paths:
      - ".hepta-bootstrap/secrets-phase12.ready"
      - ".hepta-bootstrap/secrets-phase12.part-*"
      - ".github/workflows/hepta-bootstrap-apply-secrets-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-bootstrap-secrets-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply exact remediation patch
        shell: bash
        run: |
          set -euo pipefail
          marker=.hepta-bootstrap/secrets-phase12.ready
          test -f "$marker"
          shopt -s nullglob
          parts=(.hepta-bootstrap/secrets-phase12.part-*)
          test "${#parts[@]}" -eq 8
          bundle="$RUNNER_TEMP/secrets-phase12.patch.gz.b64"
          patch="$RUNNER_TEMP/secrets-phase12.patch"
          cat "${parts[@]}" > "$bundle"
          test "$(sha256sum "$bundle" | awk '{print $1}')" = \
            "62634e29f4a6a989c8eaf5c37369c0be29419c181a06eda6852b860e14a7deb1"
          base64 --decode "$bundle" | gzip --decompress > "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = \
            "8e3a245f76a0bfbac3976da16efa080b73ed17f58a9cd47a43e8d57534eb4590"
          git merge-base --is-ancestor \
            1e4a741457f8ae5d8b404c7d41cb5bd3ef57c139 HEAD
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo "Exact remediation is already present; only bootstrap cleanup remains."
          else
            echo "Exact remediation patch does not apply cleanly and is not already present." >&2
            exit 1
          fi

      - name: Format and execute scoped native qualification
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-bao-adapter -p codex-hepta-authbus -p codex-state-sqlite
          cargo test --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- --test-threads=2
          cargo clippy --locked -p codex-hepta-bao-adapter -p codex-state-sqlite --all-targets -- -D warnings
          cargo test --locked -p codex-hepta-authbus authority_schema -- --test-threads=2

      - name: Commit the qualified remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .hepta-bootstrap/secrets-phase12.ready \
            .hepta-bootstrap/secrets-phase12.part-* \
            .hepta-bootstrap/secrets-phase12.patch.gz.b64
          rm -f .github/workflows/hepta-bootstrap-apply-secrets-remediation.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta remediation bot"
          git config user.email "hepta-remediation@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No tracked remediation changes remain."
            exit 0
          fi
          git commit -m "secrets: close consumption recovery and canonicalize docs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
