                  for support in edge.supports {
                      let (memory_id, revision) = if let Some(index) = compact_supports.as_ref() {
          ''',
              '''            if !generations
                  .compact_edge_support_indexes
                  .contains_key(&cache_key)
              {
                  let index = load_compact_edge_support_index_tx(
                      transaction,
                      &seed.projection_scope,
                      seed.generation,
                  )
                  .await?;
                  generations
                      .compact_edge_support_indexes
                      .insert(cache_key.clone(), index);
              }
              let compact_supports = generations
                  .compact_edge_support_indexes
                  .get(&cache_key)
                  .and_then(Option::as_ref);
              for edge in query_result.edges {
                  for support in edge.supports {
                      let (memory_id, revision) = if let Some(index) = compact_supports {
          ''',
          )

          tests = Path("codex-rs/hepta-kg/src/generation_tests.rs")
          tests.write_text(
              tests.read_text()
              + '''

          #[test]
          fn direct_validation_rejects_duplicate_support_identity() {
              let mut graph = build_complete_generation(
                  generation(1),
                  input(vec![node("a", "a")], Vec::new()),
              )
              .unwrap_or_else(|error| panic!("valid graph: {error}"));
              let mut duplicate = graph.nodes[0].supports[0].clone();
              duplicate.source_fact_digest = digest("different-fact-same-support-identity");
              graph.nodes[0].supports.push(duplicate);
              graph.nodes[0].supports.sort();
              graph.generation_digest = compute_generation_digest(&graph);
              assert_eq!(
                  graph.validate(),
                  Err(KnowledgeGenerationErrorV2::DuplicateSupport)
              );
          }

          #[test]
          fn sealed_validated_generation_reuses_validation_without_semantic_drift() {
              let graph = build_complete_generation(
                  generation(1),
                  input(
                      vec![node("a", "a"), node("b", "b")],
                      vec![edge("a", "b", KnowledgeRelationKindV2::Causes, "edge-ab")],
                  ),
              )
              .unwrap_or_else(|error| panic!("valid graph: {error}"));
              let query = KnowledgeRelationQueryV2 {
                  query_id: id("query:validated-cache"),
                  generation_digest: graph.generation_digest,
                  seed_node_ids: vec![id("node:a")],
                  relation_kinds: vec![KnowledgeRelationKindV2::Causes],
                  valid_at_unix_seconds: None,
                  maximum_edges: 8,
              };
              let (ordinary, ordinary_work) = query_relations_with_work(&graph, query.clone())
                  .unwrap_or_else(|error| panic!("ordinary query: {error}"));
              let validated = ValidatedKnowledgeGenerationV2::new(graph.clone())
                  .unwrap_or_else(|error| panic!("validated generation: {error}"));
              let (cached, cached_work) =
                  query_relations_validated_with_work(&validated, query)
                      .unwrap_or_else(|error| panic!("cached query: {error}"));

              assert_eq!(ordinary, cached);
              assert!(ordinary_work.validated_nodes > 0);
              assert_eq!(cached_work.validated_nodes, 0);
              assert_eq!(cached_work.validated_edges, 0);
              assert_eq!(cached_work.validated_supports, 0);
              assert_eq!(
                  ordinary_work.relation_edges_scanned,
                  cached_work.relation_edges_scanned
              );

              let mut tampered = graph;
              tampered.generation_digest = digest("tampered-generation");
              assert_eq!(
                  ValidatedKnowledgeGenerationV2::new(tampered),
                  Err(KnowledgeGenerationErrorV2::DigestMismatch("generation"))
              );
          }
          '''
          )

          observation_tests = "codex-rs/hepta-memory/src/cognitive_retrieval_observation_tests.rs"
          replace(
              observation_tests,
              '''        assert_eq!(
                  generations.len(),
                  1,
                  "all channels reuse one exact generation"
              );
          ''',
              '''        assert_eq!(
                  generations.len(),
                  1,
                  "all channels reuse one exact generation"
              );
              assert_eq!(
                  generations.support_index_count(),
                  1,
                  "all channels reuse one exact compact support index"
              );
          ''',
          )
          PY

      - name: Format and test focused changes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev pkg-config
          cd codex-rs
          cargo fmt --package codex-hepta-kg --package codex-hepta-memory
          cargo test --locked -p codex-hepta-kg -- --nocapture
          cargo test --locked -p codex-hepta-memory --lib \
            cognitive_retrieval_observation_tests::typed_kg_relations_feed_only_their_declared_retrieval_channels \
            -- --exact --nocapture --test-threads=1
          cargo clippy --locked -p codex-hepta-kg -p codex-hepta-memory \
            --all-targets --no-deps -- -D warnings

      - name: Commit focused convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta KG Convergence Bot"
          git config user.email "hepta-kg-convergence@users.noreply.github.com"
          rm .github/workflows/hepta-kg-finalize-query-cache.yml
          git diff --check
          git add -A
          git commit -s -m "knowledge.graph: cache validated retrieval generations"
          git push origin HEAD:work/knowledge-graph-final-convergence-20260927
