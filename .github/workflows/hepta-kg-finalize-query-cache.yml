                      &self.nodes,
                      &self.edges,
                  )?;
                  if self.authority.grants_any() {
                      return Err(KnowledgeGenerationErrorV2::AuthorityGranted);
                  }
                  if self.generation_digest != compute_generation_digest(self) {
                      return Err(KnowledgeGenerationErrorV2::DigestMismatch("generation"));
                  }
                  Ok(())
              }
          }

          /// Owning proof that one immutable generation passed the complete V2
          /// structural, authority and digest validation. The private field keeps
          /// callers from manufacturing the proof around mutable or unchecked data.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct ValidatedKnowledgeGenerationV2 {
              generation: KnowledgeGenerationV2,
          }

          impl ValidatedKnowledgeGenerationV2 {
              pub fn new(
                  generation: KnowledgeGenerationV2,
              ) -> Result<Self, KnowledgeGenerationErrorV2> {
                  generation.validate()?;
                  Ok(Self { generation })
              }

              pub fn generation(&self) -> &KnowledgeGenerationV2 {
                  &self.generation
              }
          }
          ''',
