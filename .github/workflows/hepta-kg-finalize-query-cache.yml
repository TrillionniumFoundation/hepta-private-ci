          lib = "codex-rs/hepta-kg/src/lib.rs"
          replace(
              lib,
              '''pub use generation::KnowledgeSupportV2;
          pub use generation::MAX_KNOWLEDGE_EDGES_V2;
          ''',
              '''pub use generation::KnowledgeSupportV2;
          pub use generation::ValidatedKnowledgeGenerationV2;
          pub use generation::MAX_KNOWLEDGE_EDGES_V2;
          ''',
          )
          replace(
              lib,
              '''pub use generation::query_relations;
          pub use generation::query_relations_with_work;
          ''',
              '''pub use generation::query_relations;
          pub use generation::query_relations_validated;
          pub use generation::query_relations_validated_with_work;
          pub use generation::query_relations_with_work;
          ''',
          )

          retrieval = "codex-rs/hepta-memory/src/cognitive_retrieval.rs"
          replace(
              retrieval,
              '''use codex_hepta_kg::KnowledgeGenerationV2;
          use codex_hepta_kg::KnowledgeRelationQueryV2;
          use codex_hepta_kg::query_relations;
          ''',
              '''use codex_hepta_kg::KnowledgeRelationQueryV2;
          use codex_hepta_kg::ValidatedKnowledgeGenerationV2;
          use codex_hepta_kg::query_relations_validated;
          ''',
          )
          replace(
              retrieval,
              '''// Scratch space for one SQLite read transaction, never shared across requests.
          // Each selected scope/generation is materialized once across relation channels.
          type RetrievalGenerations = BTreeMap<(String, i64), KnowledgeGenerationV2>;
          ''',
              '''// Scratch space for one SQLite read transaction, never shared across requests.
          // Each selected scope/generation is reconstructed and fully validated once, and its
          // compact support index is loaded at most once across all relation channels.
          type CompactEdgeSupportIndex = BTreeMap<String, (String, i64)>;

          #[derive(Default)]
          struct RetrievalGenerations {
              generations: BTreeMap<(String, i64), ValidatedKnowledgeGenerationV2>,
              compact_edge_support_indexes:
                  BTreeMap<(String, i64), Option<CompactEdgeSupportIndex>>,
          }

          impl RetrievalGenerations {
              fn new() -> Self {
                  Self::default()
              }

              #[cfg(test)]
              fn len(&self) -> usize {
                  self.generations.len()
              }

              #[cfg(test)]
              fn support_index_count(&self) -> usize {
                  self.compact_edge_support_indexes.len()
              }
          }
          ''',
          )
          replace(
              retrieval,
              '''            let generation =
                  match generations.entry((seed.projection_scope.clone(), seed.generation)) {
                      std::collections::btree_map::Entry::Vacant(entry) => entry.insert(
                          load_canonical_generation_tx(
                              transaction,
                              &seed.projection_scope,
                              seed.generation,
                          )
                          .await?,
                      ),
                      std::collections::btree_map::Entry::Occupied(entry) => entry.into_mut(),
                  };
              if generation.generation_digest.to_string() != generation_sha256.as_str() {
          ''',
              '''            let cache_key = (seed.projection_scope.clone(), seed.generation);
              if !generations.generations.contains_key(&cache_key) {
                  let loaded = load_canonical_generation_tx(
                      transaction,
                      &seed.projection_scope,
                      seed.generation,
                  )
                  .await?;
                  let validated = ValidatedKnowledgeGenerationV2::new(loaded).map_err(|error| {
                      CognitiveStoreError::Corrupt(format!(
                          "persisted KG generation failed canonical V2 validation: {error}"
                      ))
                  })?;
                  generations.generations.insert(cache_key.clone(), validated);
              }
              let validated_generation = generations
                  .generations
                  .get(&cache_key)
                  .expect("KG generation inserted before retrieval");
              let generation = validated_generation.generation();
              if generation.generation_digest.to_string() != generation_sha256.as_str() {
          ''',
          )
          replace(
              retrieval,
              '''            let query_result = query_relations(
                  generation,
          ''',
              '''            let query_result = query_relations_validated(
                  validated_generation,
          ''',
          )
          replace(
              retrieval,
              '''            let compact_supports = load_compact_edge_support_index_tx(
                  transaction,
                  &seed.projection_scope,
                  seed.generation,
              )
              .await?;
