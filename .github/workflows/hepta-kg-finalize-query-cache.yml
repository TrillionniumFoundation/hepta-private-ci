name: Finalize knowledge.graph query cache

on:
  push:
    branches: [work/knowledge-graph-final-convergence-20260927]
    paths:
      - ".github/workflows/hepta-kg-finalize-query-cache.yml"

permissions:
  contents: write

concurrency:
  group: hepta-kg-finalize-query-cache
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch sealed validation and per-request caches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new))

          generation = "codex-rs/hepta-kg/src/generation.rs"
          replace(
              generation,
              '''impl KnowledgeGenerationV2 {
              pub fn validate(&self) -> Result<(), KnowledgeGenerationErrorV2> {
                  validate_generation_fields(
                      self.source_snapshot_digest,
                      self.generation_vector_digest,
                      self.graph_profile_digest,
                      &self.nodes,
                      &self.edges,
                  )?;
                  if self.authority.grants_any() {
                      return Err(KnowledgeGenerationErrorV2::AuthorityGranted);
                  }
                  if self.generation_digest != compute_generation_digest(self) {
                      return Err(KnowledgeGenerationErrorV2::DigestMismatch("generation"));
                  }
                  Ok(())
              }
          }
          ''',
              '''impl KnowledgeGenerationV2 {
              pub fn validate(&self) -> Result<(), KnowledgeGenerationErrorV2> {
                  validate_generation_fields(
                      self.source_snapshot_digest,
