name: MemoryCell isolated premise-citation formatter
on:
  push:
    branches:
      - "codex/memory-cell-evidence-20261008"
    paths:
      - ".github/workflows/hepta-memory-citation-format-candidate.yml"
permissions:
  contents: read
jobs:
  ast-identical-review-candidate:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/codex/memory-cell-evidence-20261008'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Print exact AST-identical formatted source for review; never push
        run: |
          set -euo pipefail
          python3 -m pip install --user uv==0.8.22
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import ast, json
          names = ['scripts/memory_cell/event_citation_prompt_trial.py', 'scripts/memory_cell/test_event_citation_prompt_trial.py']
          Path('/tmp/premise-asts.json').write_text(json.dumps({n: ast.dump(ast.parse(Path(n).read_text())) for n in names}))
          PY
          uv run --frozen --project scripts ruff format \
            scripts/memory_cell/event_citation_prompt_trial.py \
            scripts/memory_cell/test_event_citation_prompt_trial.py
          python3 - <<'PY'
          from pathlib import Path
          import ast, json, subprocess
          originals = json.loads(Path('/tmp/premise-asts.json').read_text())
          changes = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changes == set(originals), changes
          for path, before in originals.items():
              source = Path(path).read_text()
              assert ast.dump(ast.parse(source)) == before, path
              for i in range(0, len(source), 1200):
                  print('HEPTA_FORMATTED_CHUNK=' + json.dumps(dict(path=path, index=i // 1200, data=source[i:i+1200]), ensure_ascii=True), flush=True)
              print('HEPTA_FORMATTED_DONE=' + json.dumps(dict(path=path, characters=len(source), chunks=(len(source)+1199)//1200)), flush=True)
          PY
          git diff --check
