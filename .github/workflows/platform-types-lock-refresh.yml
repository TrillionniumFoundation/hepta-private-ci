name: platform.types lock verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/platform-types-lock-refresh.yml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/**/Cargo.toml"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-wire/**"
      - "codex-rs/hepta-ndu/**"
      - "docs/lane-a-foundation/platform.types/**"
      - "docs/modules/platform.types/**"
      - "qualification/module-execution-dossiers/detail/platform.types.md"
      - "scripts/platform_types_*.py"
      - "scripts/run_platform_types_*.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-types-lock-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_TYPES_MSRV: "1.96.0"

jobs:
  verify:
    name: Verify exact platform.types Cargo lock
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical source and authoritative lock
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE: ${{ runner.temp }}/platform-types-lock-verify
        run: |
          set -euo pipefail
          repo_root="$(git rev-parse --show-toplevel)"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          exec > >(tee "$EVIDENCE/run.log") 2>&1

          test "$(git -C "$repo_root" rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -e "$repo_root/scripts/platform_types_api_compat_fixup.py"
          test ! -e "$repo_root/scripts/platform_types_bootstrap_fixup.py"

          rustup toolchain install "$PLATFORM_TYPES_MSRV" --profile minimal \
            --component rustfmt
          cargo "+$PLATFORM_TYPES_MSRV" --version | tee "$EVIDENCE/cargo-version.txt"
          rustc "+$PLATFORM_TYPES_MSRV" --version --verbose \
            | tee "$EVIDENCE/rustc-version.txt"

          cargo "+$PLATFORM_TYPES_MSRV" fmt --check \
            --manifest-path "$repo_root/codex-rs/Cargo.toml" \
            --package codex-hepta-types \
            --package codex-hepta-wire \
            --package codex-hepta-ndu
          python3 "$repo_root/scripts/platform_types_public_api.py"
          cargo "+$PLATFORM_TYPES_MSRV" metadata \
            --manifest-path "$repo_root/codex-rs/Cargo.toml" \
            --locked --no-deps > "$EVIDENCE/metadata.json"
          cargo "+$PLATFORM_TYPES_MSRV" check \
            --manifest-path "$repo_root/codex-rs/Cargo.toml" \
            --locked \
            -p codex-hepta-types -p codex-hepta-wire -p codex-hepta-ndu \
            --all-targets
          cargo "+$PLATFORM_TYPES_MSRV" test \
            --manifest-path "$repo_root/codex-rs/Cargo.toml" \
            --locked \
            -p codex-hepta-types -p codex-hepta-wire -p codex-hepta-ndu \
            --all-targets

          git -C "$repo_root" diff --check
          test -z "$(git -C "$repo_root" status --porcelain --untracked-files=normal)"

          {
            printf 'candidate_sha=%s\n' "$(git -C "$repo_root" rev-parse HEAD)"
            printf 'candidate_tree=%s\n' "$(git -C "$repo_root" rev-parse HEAD^{tree})"
            printf 'cargo_lock_blob=%s\n' "$(git -C "$repo_root" rev-parse HEAD:codex-rs/Cargo.lock)"
            printf 'cargo_lock_sha256=%s\n' "$(sha256sum "$repo_root/codex-rs/Cargo.lock" | cut -d' ' -f1)"
            printf 'status=passed\n'
          } | tee "$EVIDENCE/receipt.env"

      - name: Preserve lock-verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-types-lock-verify-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/platform-types-lock-verify/
            codex-rs/Cargo.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
