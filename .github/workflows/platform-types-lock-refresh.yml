name: platform.types lock refresh bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/platform-types-lock-refresh.yml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/**/Cargo.toml"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-wire/**"
      - "docs/lane-a-foundation/platform.types/**"
      - "docs/modules/platform.types/**"
      - "qualification/module-execution-dossiers/detail/platform.types.md"
      - "scripts/platform_types_*.py"
      - "scripts/run_platform_types_*.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-types-lock-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_TYPES_MSRV: "1.95.0"

jobs:
  refresh:
    name: Refresh exact platform.types Cargo lock
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Converge compatibility source and authoritative lock
        id: refresh
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          repo_root="$(git rev-parse --show-toplevel)"
          evidence="$repo_root/.hepta-evidence/platform-types-lock-refresh"
          mkdir -p "$evidence"
          exec > >(tee "$evidence/run.log") 2>&1

          rustup toolchain install "$PLATFORM_TYPES_MSRV" --profile minimal \
            --component rustfmt
          cargo "+$PLATFORM_TYPES_MSRV" --version | tee "$evidence/cargo-version.txt"
          rustc "+$PLATFORM_TYPES_MSRV" --version --verbose | tee "$evidence/rustc-version.txt"

          if [[ -f "$repo_root/scripts/platform_types_api_compat_fixup.py" ]]; then
            python3 "$repo_root/scripts/platform_types_api_compat_fixup.py"
            git -C "$repo_root" rm -- scripts/platform_types_api_compat_fixup.py
          fi

          cargo "+$PLATFORM_TYPES_MSRV" fmt \
            --manifest-path "$repo_root/codex-rs/Cargo.toml" \
            --package codex-hepta-types --package codex-hepta-ndu -- --check

          cargo "+$PLATFORM_TYPES_MSRV" generate-lockfile \
            --manifest-path "$repo_root/codex-rs/Cargo.toml"

          unexpected="$(
            git -C "$repo_root" status --porcelain --untracked-files=no |
              cut -c4- |
              grep -Ev '^(codex-rs/Cargo\.lock|codex-rs/hepta-types/src/numeric_conversion\.rs|codex-rs/hepta-types/src/numeric_registry_v2\.rs|codex-rs/hepta-types/src/numeric_conversion_tests\.rs|codex-rs/hepta-ndu/src/numeric_admission\.rs|scripts/platform_types_api_compat_fixup\.py)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            printf 'compatibility/lock convergence changed unexpected tracked paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git -C "$repo_root" diff --check
          python3 "$repo_root/scripts/platform_types_public_api.py"
          cargo "+$PLATFORM_TYPES_MSRV" metadata \
            --manifest-path "$repo_root/codex-rs/Cargo.toml" \
            --locked --no-deps > "$evidence/metadata.json"
          cargo "+$PLATFORM_TYPES_MSRV" check \
            -p codex-hepta-types -p codex-hepta-wire -p codex-hepta-ndu \
            --manifest-path "$repo_root/codex-rs/Cargo.toml" \
            --locked
          cargo "+$PLATFORM_TYPES_MSRV" test \
            -p codex-hepta-types -p codex-hepta-wire -p codex-hepta-ndu \
            --manifest-path "$repo_root/codex-rs/Cargo.toml" \
            --locked

          git -C "$repo_root" diff --stat -- \
            codex-rs/Cargo.lock \
            codex-rs/hepta-types/src/numeric_conversion.rs \
            codex-rs/hepta-types/src/numeric_registry_v2.rs \
            codex-rs/hepta-types/src/numeric_conversion_tests.rs \
            codex-rs/hepta-ndu/src/numeric_admission.rs \
            scripts/platform_types_api_compat_fixup.py \
            | tee "$evidence/diff-stat.txt"
          sha256sum \
            "$repo_root/codex-rs/Cargo.lock" \
            "$repo_root/codex-rs/hepta-types/src/numeric_conversion.rs" \
            "$repo_root/codex-rs/hepta-types/src/numeric_registry_v2.rs" \
            "$repo_root/codex-rs/hepta-ndu/src/numeric_admission.rs" \
            | tee "$evidence/candidate-files.sha256"

          if git -C "$repo_root" diff --quiet --exit-code; then
            echo "numeric API compatibility and Cargo.lock are already canonical"
            exit 0
          fi

          git -C "$repo_root" config user.name "Hepta platform.types compatibility bot"
          git -C "$repo_root" config user.email "hepta-platform-types-ci@users.noreply.github.com"
          git -C "$repo_root" add -A -- \
            codex-rs/Cargo.lock \
            codex-rs/hepta-types/src/numeric_conversion.rs \
            codex-rs/hepta-types/src/numeric_registry_v2.rs \
            codex-rs/hepta-types/src/numeric_conversion_tests.rs \
            codex-rs/hepta-ndu/src/numeric_admission.rs \
            scripts/platform_types_api_compat_fixup.py
          git -C "$repo_root" commit -m "fix(platform.types): preserve numeric V1 source compatibility"
          git -C "$repo_root" push origin "HEAD:${HEAD_REF}"

      - name: Preserve compatibility/lock diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-types-lock-refresh-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .hepta-evidence/platform-types-lock-refresh/
            codex-rs/Cargo.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
