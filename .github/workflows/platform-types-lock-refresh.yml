name: platform.types lock refresh bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/platform-types-lock-refresh.yml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/hepta-types/Cargo.toml"

permissions:
  contents: write

concurrency:
  group: platform-types-lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh exact platform.types lock edge
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "Hepta platform.types lock bot"
          git config user.email "hepta-platform-types-ci@users.noreply.github.com"

          (
            cd codex-rs
            cargo check -p codex-hepta-types --tests
          )

          unexpected="$(git status --porcelain --untracked-files=no | awk '{print $2}' | grep -v '^codex-rs/Cargo.lock$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'lock refresh changed unexpected tracked paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          if git diff --quiet -- codex-rs/Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi

          git add codex-rs/Cargo.lock
          git commit -m "platform.types: refresh Cargo lock for qualification"
          git push origin "HEAD:${HEAD_REF}"
