name: Hepta private CI HeptaBao V2.4 final integration

on:
  push:
    branches:
      - ops/heptabao-v24-integration-r1-20260909

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hepta-private-ci-heptabao-v24-integration-r1
  cancel-in-progress: false

env:
  HEPTABAO_REPOSITORY: TrillionniumFoundation/HeptaBao
  HEPTABAO_BRANCH: codex/openbao-replacement-v2.4-final-clean-candidate-r3-20260909
  HEPTABAO_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  OUTPUT_BRANCH: codex/heptabao-v24-final-integration-20260909

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout integration controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for exact qualified HeptaBao branch
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/heptabao-v24-parent-integration"
          mkdir -p "$out"
          deadline=$((SECONDS + 18000))
          while [ "$SECONDS" -lt "$deadline" ]; do
            row="$(git ls-remote "https://github.com/$HEPTABAO_REPOSITORY.git" "refs/heads/$HEPTABAO_BRANCH" || true)"
            if [ -n "$row" ]; then
              heptabao_sha="${row%%$'\t'*}"
              printf 'HEPTABAO_SHA=%s\n' "$heptabao_sha" >> "$GITHUB_ENV"
              printf 'repository=%s\nbranch=%s\nsha=%s\n' "$HEPTABAO_REPOSITORY" "$HEPTABAO_BRANCH" "$heptabao_sha" > "$out/remote-binding.txt"
              exit 0
            fi
            sleep 60
          done
          echo 'qualified HeptaBao branch did not materialize' >&2
          exit 1

      - name: Verify HeptaBao clean lineage and tree
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/heptabao-v24-parent-integration"
          repo="$RUNNER_TEMP/HeptaBao"
          git init "$repo"
          git -C "$repo" remote add origin "https://github.com/$HEPTABAO_REPOSITORY.git"
          git -C "$repo" fetch --no-tags --depth=2 origin "$HEPTABAO_SHA"
          test "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$HEPTABAO_SHA"
          parents="$(git -C "$repo" show -s --format=%P "$HEPTABAO_SHA")"
          test "$(printf '%s\n' "$parents" | wc -w)" -eq 1
          test "$parents" = "$HEPTABAO_PARENT"
          tree="$(git -C "$repo" rev-parse "$HEPTABAO_SHA^{tree}")"
          git -C "$repo" ls-tree -r --name-only "$HEPTABAO_SHA" > "$out/heptabao-tree-paths.txt"
          if grep -E '(^|/)(v24-.*(materializer|orchestrator|republisher|qualifier|opener|cleanup|convergence)\.ya?ml|payload/|part-[0-9]+$)' "$out/heptabao-tree-paths.txt"; then
            echo 'HeptaBao final tree contains controller transport or payload' >&2
            exit 1
          fi
          printf 'parent=%s\ntree=%s\n' "$parents" "$tree" >> "$out/remote-binding.txt"
          printf 'HEPTABAO_TREE=%s\n' "$tree" >> "$GITHUB_ENV"

      - name: Create authoritative integration binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import subprocess

          repository=os.environ['HEPTABAO_REPOSITORY']
          branch=os.environ['HEPTABAO_BRANCH']
          sha=os.environ['HEPTABAO_SHA']
          tree=os.environ['HEPTABAO_TREE']
          parent=os.environ['HEPTABAO_PARENT']
          binding={
              'schema':'hepta.external-component-binding.v1',
              'component':'secrets.heptabao',
              'repository':repository,
              'branch':branch,
              'commit':sha,
              'tree':tree,
              'single_parent':parent,
              'integration_mode':'https_runtime_candidate',
              'runtime_authority':False,
              'release_authority':False,
              'production_authority':False,
              'compatibility_claim':False,
              'migration_authority':False,
              'required_independent_gates':[
                  'legal-license-approval',
                  'independent-product-security-review',
                  'production-kms-hsm-and-signer-custody',
                  'independent-openbao-oracle-admission',
                  'destructive-multiplatform-multinode-qualification',
                  'operations-and-incident-response-readiness',
                  'independent-reproduction',
              ],
          }
          destination=Path('integrations/heptabao/HEPTABAO_V2_4_BINDING.json')
          destination.parent.mkdir(parents=True,exist_ok=True)
          destination.write_text(json.dumps(binding,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          candidates=[]
          for name in tracked:
              path=Path(name)
              lowered=name.lower()
              if any(part in lowered for part in ('archive','historical','evidence','vendor','.github/workflows')):
                  continue
              if path.suffix.lower() not in {'.json','.yaml','.yml','.toml'}:
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except (OSError,UnicodeDecodeError):
                  continue
              if repository in text or ('heptabao' in lowered and re.search(r'\b[0-9a-f]{40}\b',text)):
                  candidates.append(name)
          report=Path('integrations/heptabao/LIVE_BINDING_SCAN.txt')
          report.write_text('\n'.join(candidates)+'\n',encoding='utf-8')
          if len(candidates)>1:
              raise SystemExit(f'ambiguous live HeptaBao binding files: {candidates}')
          if len(candidates)==1:
              path=Path(candidates[0])
              if path == destination:
                  pass
              elif path.suffix.lower()=='.json':
                  document=json.loads(path.read_text(encoding='utf-8'))
                  def update(value):
                      if isinstance(value,dict):
                          repo_value=value.get('repository') or value.get('repo') or value.get('repository_full_name')
                          if repo_value==repository:
                              for key in ('commit','sha','revision','source_commit'):
                                  if key in value:
                                      value[key]=sha
                              for key in ('tree','source_tree'):
                                  if key in value:
                                      value[key]=tree
                              for key in ('branch','ref','source_ref'):
                                  if key in value:
                                      value[key]=branch
                              for key in ('runtime_authority','release_authority','production_authority','compatibility_claim','migration_authority'):
                                  if key in value:
                                      value[key]=False
                          for child in value.values(): update(child)
                      elif isinstance(value,list):
                          for child in value: update(child)
                  update(document)
                  path.write_text(json.dumps(document,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              else:
                  raise SystemExit(f'live non-JSON binding requires explicit migration: {path}')

          docs=Path('docs/integrations/HEPTABAO_V2_4_FINAL_BINDING.md')
          docs.parent.mkdir(parents=True,exist_ok=True)
          docs.write_text(f'''# HeptaBao V2.4 integration binding

- Repository: `{repository}`
- Branch: `{branch}`
- Commit: `{sha}`
- Tree: `{tree}`
- Single parent: `{parent}`

The integration repository binds an exact source-only HeptaBao candidate. Exact-head and prospective-main-merge qualification in the component repository are not inherited as parent-repository runtime or production authority. Parent-level consumer smoke, deployment review, legal approval, independent security review, independent compatibility evidence, key custody and operations qualification remain required.
''',encoding='utf-8')
          PY

      - name: Remove controller and run available integration validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/heptabao-v24-final-integration.yml
          out="$RUNNER_TEMP/heptabao-v24-parent-integration"
          python -m json.tool integrations/heptabao/HEPTABAO_V2_4_BINDING.json > /dev/null
          git diff --check 2>&1 | tee "$out/diff-check.log"
          if [ -f MODULES.json ]; then python -m json.tool MODULES.json > /dev/null; fi
          if [ -f scripts/validate_repository.py ]; then python scripts/validate_repository.py 2>&1 | tee "$out/repository-validator.log"; fi
          if [ -f scripts/validate_repository_v2.py ]; then python scripts/validate_repository_v2.py 2>&1 | tee "$out/repository-validator-v2.log"; fi
          if [ -d tests ]; then
            timeout --signal=TERM --kill-after=20s 1800s python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee "$out/python-tests.log"
          fi

      - name: Publish integration candidate and open one draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hepta Private CI HeptaBao Integrator'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git commit -m 'chore(integration): bind qualified HeptaBao V2.4 clean candidate'
          candidate_sha="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "$candidate_sha:refs/heads/$OUTPUT_BRANCH"
          owner="${GITHUB_REPOSITORY%%/*}"
          existing="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=${owner}:${OUTPUT_BRANCH}&base=integration/hepta-w0-internal-closure-20260908&per_page=100" --jq '.[0].number // empty' || true)"
          if [ -z "$existing" ]; then
            cat > "$RUNNER_TEMP/body.md" <<EOF
          ## Exact HeptaBao component binding

          - component repository: \`$HEPTABAO_REPOSITORY\`
          - component branch: \`$HEPTABAO_BRANCH\`
          - component commit: \`$HEPTABAO_SHA\`
          - component tree: \`$HEPTABAO_TREE\`
          - component parent: \`$HEPTABAO_PARENT\`

          This parent-repository draft does not inherit component approvals or authority. Runtime consumer smoke, deployment configuration, legal and independent security review, compatibility admission, production key custody, destructive qualification and operations evidence remain explicit parent-level gates.
          EOF
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --base integration/hepta-w0-internal-closure-20260908 \
              --head "$OUTPUT_BRANCH" \
              --title 'chore(integration): bind qualified HeptaBao V2.4 candidate' \
              --body-file "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/heptabao-v24-parent-integration/pr-url.txt"
          fi

      - name: Upload bounded parent integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v24-parent-integration
          path: ${{ runner.temp }}/heptabao-v24-parent-integration/
          if-no-files-found: warn
          retention-days: 21
