name: Materialize authorized artifact remediation
on:
  push:
    branches: [codex/learning-artifacts-remediation-20260927]
    paths:
      - scripts/hepta_artifacts_apply_remediation.py
      - .github/workflows/hepta-artifacts-remediation-once.yml
permissions:
  contents: write
concurrency:
  group: learning-artifacts-one-time-materialization
  cancel-in-progress: false
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/learning-artifacts-remediation-20260927
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply preimage-checked source corrections
        run: python3 scripts/hepta_artifacts_apply_remediation.py
      - name: Format changed owner sources
        run: rustfmt --edition 2024 codex-rs/hepta-learning-artifacts/src/owner_service.rs codex-rs/hepta-learning-artifacts/src/owner_host.rs
      - name: Refresh exact source objects without changing sourceBase provenance
        run: |
          git add -- codex-rs/hepta-learning-artifacts
          python3 scripts/hepta_artifacts_apply_remediation.py refresh-map
          git diff --cached --check
      - name: Publish source candidate only to authorized branch
        env:
          EXPECTED_REF: refs/heads/codex/learning-artifacts-remediation-20260927
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          git -c user.name='Artifact remediation agent' -c user.email='artifact-remediation@users.noreply.github.com' commit -m 'fix(learning.artifacts): bind terminal retries and retain recovery fences'
          git push origin HEAD:refs/heads/codex/learning-artifacts-remediation-20260927
