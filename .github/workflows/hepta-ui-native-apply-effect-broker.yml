name: ui.native one-shot effect-broker remediation

on:
  workflow_dispatch:
  push:
    branches: [work/ui-native-remediation-20260927]
    paths:
      - .github/workflows/hepta-ui-native-apply-effect-broker.yml

permissions:
  contents: write

concurrency:
  group: ui-native-one-shot-effect-broker-macos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: ${{ github.workspace }}/apps/hepta-native/target
  REMEDIATION_BRANCH: work/ui-native-remediation-20260927
  PATCH_PATH: .github/remediation/ui-native-effect-broker.patch.gz.b64

jobs:
  apply-and-verify:
    name: apply, verify, bind and push audited source
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.REMEDIATION_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bind the one-shot input to this workflow run
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git ls-files --error-unmatch "$PATCH_PATH"
          git diff --exit-code -- "$PATCH_PATH"
      - name: Decode, validate and identify the audited patch
        id: patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import gzip
          import hashlib
          import os
          import struct
          import zlib
          from pathlib import Path

          def recover_crc_only_gzip(compressed: bytes) -> tuple[bytes, int, int]:
              if len(compressed) < 18:
                  raise SystemExit("effect-broker gzip member is too short")
              if compressed[:3] != b"\x1f\x8b\x08":
                  raise SystemExit("effect-broker transport is not a deflate gzip member")
              if compressed[3] != 0:
                  raise SystemExit(
                      "CRC recovery refuses gzip members with optional headers or multiple members"
                  )

              stored_crc, stored_isize = struct.unpack("<II", compressed[-8:])
              inflater = zlib.decompressobj(-zlib.MAX_WBITS)
              patch = inflater.decompress(compressed[10:-8]) + inflater.flush()
              if not inflater.eof:
                  raise SystemExit("effect-broker deflate stream did not terminate cleanly")
              if inflater.unused_data or inflater.unconsumed_tail:
                  raise SystemExit(
                      "effect-broker deflate stream has trailing or unconsumed data"
                  )

              actual_crc = binascii.crc32(patch) & 0xFFFFFFFF
              actual_isize = len(patch) & 0xFFFFFFFF
              if stored_isize != actual_isize:
                  raise SystemExit(
                      "effect-broker gzip ISIZE mismatch: "
                      f"stored=0x{stored_isize:08x}, actual=0x{actual_isize:08x}"
                  )
              if stored_crc == actual_crc:
                  raise SystemExit(
                      "gzip.decompress failed even though the recovered CRC already matches"
                  )

              repaired = compressed[:-8] + struct.pack("<II", actual_crc, actual_isize)
              if gzip.decompress(repaired) != patch:
                  raise SystemExit("standard gzip verification rejected the repaired member")
              return patch, stored_crc, actual_crc

          source = Path(os.environ["PATCH_PATH"])
          raw = source.read_bytes()
          encoded = b"".join(raw.split())
          standard = frozenset(
              b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
          )
          urlsafe = frozenset(
              b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_="
          )
          actual = frozenset(encoded)
          if actual <= standard:
              dialect = "standard"
              compressed = base64.b64decode(encoded, validate=True)
          elif actual <= urlsafe:
              dialect = "urlsafe"
              compressed = base64.b64decode(
                  encoded, altchars=b"-_", validate=True
              )
          else:
              invalid = [
                  (index, value)
                  for index, value in enumerate(encoded)
                  if value not in standard and value not in urlsafe
              ]
              details = ", ".join(
                  f"offset={index}:0x{value:02x}" for index, value in invalid[:32]
              )
              raise SystemExit(
                  "effect-broker transport contains bytes outside both strict base64 alphabets: "
                  + details
              )

          recovery = "none"
          try:
              patch = gzip.decompress(compressed)
          except gzip.BadGzipFile as exc:
              if "CRC check failed" not in str(exc):
                  raise
              patch, stored_crc, actual_crc = recover_crc_only_gzip(compressed)
              recovery = (
                  f"crc-only:stored=0x{stored_crc:08x},actual=0x{actual_crc:08x}"
              )

          if not patch:
              raise SystemExit("decoded effect-broker patch is empty")
          if not patch.startswith(b"diff --git "):
              raise SystemExit("decoded effect-broker payload is not a git patch")
          try:
              patch.decode("utf-8")
          except UnicodeDecodeError as exc:
              raise SystemExit("decoded effect-broker patch is not UTF-8") from exc

          target = Path("/tmp/ui-native-effect-broker.patch")
          target.write_bytes(patch)
          digest = hashlib.sha256(patch).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write(f"sha256={digest}\n")
              handle.write(f"dialect={dialect}\n")
              handle.write(f"recovery={recovery}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write("### Commit-bound effect-broker patch\n\n")
              handle.write(
                  f"Workflow input commit: `{os.environ['GITHUB_SHA']}`\n\n"
              )
              handle.write(f"Transport dialect: `{dialect}`\n\n")
              handle.write(f"Transport recovery: `{recovery}`\n\n")
              handle.write(f"Decoded patch SHA-256: `{digest}`\n")
          PY
      - name: Check and apply the audited patch
        run: |
          set -euo pipefail
          git apply --check --3way /tmp/ui-native-effect-broker.patch
          git apply --3way --index /tmp/ui-native-effect-broker.patch
      - name: Apply the audited single-site Clippy correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/hepta-native/src/platform.rs")
          old = "digest.as_slice() == &expected"
          new = "digest.as_slice() == expected"
          source = path.read_text(encoding="utf-8")
          matches = source.count(old)
          if matches != 1:
              raise SystemExit(
                  f"expected exactly one audited Clippy correction site in {path}, found {matches}"
              )
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git add -- apps/hepta-native/src/platform.rs
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Format the materialized source
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-native-gateway \
            -p codex-hepta-contracts \
            -p codex-hepta-private-state
          cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml -- --check
          python3 -m py_compile apps/hepta-native/tools/prepare_current_source.py
          git add -- apps/hepta-native
      - name: Clippy with warnings denied
        run: |
          set -euo pipefail
          cargo +1.95.0 clippy --manifest-path apps/hepta-native/Cargo.toml \
            --locked --all-targets --all-features -- -D warnings
      - name: Full app and owner-integration tests
        run: |
          set -euo pipefail
          cargo +1.95.0 test --manifest-path apps/hepta-native/Cargo.toml \
            --locked --all-targets
          cargo +1.95.0 test \
            --manifest-path tests/owner_integration/Cargo.toml \
            --locked --test ui_native_surface
      - name: Release binaries
        run: |
          set -euo pipefail
          cargo +1.95.0 build --manifest-path apps/hepta-native/Cargo.toml \
            --locked --release --bins
      - name: Commit the verified source boundary
        id: source
        run: |
          set -euo pipefail
          git config user.name ui-native-remediation
          git config user.email ui-native-remediation@users.noreply.github.com
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m 'feat(ui.native): persist operation-bound platform effect receipts'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Regenerate exact source and implementation identities
        env:
          HEPTA_UI_NATIVE_WRITE_BRANCH: ${{ env.REMEDIATION_BRANCH }}
        run: |
          set -euo pipefail
          python3 apps/hepta-native/tools/prepare_current_source.py --write-fingerprints
          python3 apps/hepta-native/tools/prepare_current_source.py --sync-metadata
          git add -- \
            apps/hepta-native/CURRENT_SOURCE.json \
            docs/modules/ui.native/IMPLEMENTATION_MAP.json \
            docs/modules/SOURCE_BINDINGS.json \
            docs/modules/MODULE_DOCS.json \
            qualification/module-execution-dossiers/DETAILS.json \
            qualification/module-execution-dossiers/NATIVE_BINDINGS.json
          git diff --cached --check
          git commit -m 'docs(ui.native): bind effect broker to exact source identity'
      - name: Verify regenerated identities and registries
        run: |
          set -euo pipefail
          python3 apps/hepta-native/tools/prepare_current_source.py
          python3 scripts/test_hepta_module_registry.py
          python3 -m unittest discover -s scripts -p test_hepta_ui_native_evidence.py -v
      - name: Remove the one-shot transport without changing verified source
        run: |
          set -euo pipefail
          git rm -- "$PATCH_PATH" .github/workflows/hepta-ui-native-apply-effect-broker.yml
          git commit -m 'chore(ui.native): retire one-shot effect-broker applicator'
      - name: Push only after all repository-controlled checks passed
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$REMEDIATION_BRANCH"
          {
            echo '### ui.native effect-broker remediation'
            echo
            echo "Source commit: \`${{ steps.source.outputs.sha }}\`"
            echo "Published head: \`$(git rev-parse HEAD)\`"
            echo "Patch SHA-256: \`${{ steps.patch.outputs.sha256 }}\`"
            echo "Transport recovery: \`${{ steps.patch.outputs.recovery }}\`"
            echo
            echo 'This run proves macOS source construction and native tests; it is not the six-subject release qualification receipt.'
          } >> "$GITHUB_STEP_SUMMARY"
