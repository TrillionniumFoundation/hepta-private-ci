name: Codex intelligence-control exact rewrite

on:
  workflow_dispatch:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - .github/intelligence-control-rewrite-trigger

permissions:
  contents: write

concurrency:
  group: codex-intelligence-control-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intelligence-control-product-closure-20260926
          fetch-depth: 0
          persist-credentials: true

      - name: Apply asserted narrow rewrites
        run: |
          set -euo pipefail
          python3 scripts/codex-intelligence-control-rewrite.py
          python3 scripts/codex-intelligence-observability-rewrite.py
          python3 scripts/codex-intelligence-learning-reconcile-rewrite.py
          python3 scripts/codex-intelligence-status-rewrite.py
          python3 scripts/hepta-intelligence-control-status.py --write-tracked

      - name: Format the Rust candidate
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          allowed='^(codex-rs/hepta-agentd/src/(config|intelligence_[^/]+|lane_b_bound|lane_b_runtime|lib|objective_runtime|runtime|state|state_control)\.rs|codex-rs/hepta-intelligence/src/(canonical_invariants|lib)\.rs|docs/modules/intelligence\.control/(IMPLEMENTATION_MAP|TEST_TRACEABILITY)\.json|docs/modules/intelligence\.control/TECHNICAL\.md|qualification/module-execution-dossiers/detail/intelligence\.control\.md|scripts/hepta-intelligence-control-status\.py)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected rewrite paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          python3 scripts/hepta-intelligence-control-status.py --check-tracked

      - name: Commit exact rewrite
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(intelligence): apply exact product closure rewrites'
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
