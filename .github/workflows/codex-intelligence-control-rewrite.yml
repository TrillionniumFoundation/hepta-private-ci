name: Codex intelligence-control exact rewrite

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926

permissions:
  contents: write

concurrency:
  group: codex-intelligence-control-rewrite
  cancel-in-progress: true

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intelligence-control-product-closure-20260926
          fetch-depth: 0
          persist-credentials: true

      - name: Apply asserted narrow rewrites
        run: python3 scripts/codex-intelligence-control-rewrite.py

      - name: Verify patch shape
        run: |
          git diff --check
          git diff --exit-code --stat -- . ':!codex-rs/hepta-agentd/src/intelligence_product_tests.rs' ':!codex-rs/hepta-agentd/src/state.rs' ':!codex-rs/hepta-agentd/src/objective_runtime.rs' ':!codex-rs/hepta-agentd/src/lane_b_runtime.rs'

      - name: Commit exact rewrite
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/hepta-agentd/src/intelligence_product_tests.rs \
                  codex-rs/hepta-agentd/src/state.rs \
                  codex-rs/hepta-agentd/src/objective_runtime.rs \
                  codex-rs/hepta-agentd/src/lane_b_runtime.rs
          git commit -m 'feat(intelligence): apply exact lifecycle identity rewrites'
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
