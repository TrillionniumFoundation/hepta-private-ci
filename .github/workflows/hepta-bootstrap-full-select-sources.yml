name: Bootstrap full SELECT retrieval sources
on:
  push:
    branches: ["research/five-causal-experiments-20261013"]
    paths: [".github/workflows/hepta-bootstrap-full-select-sources.yml"]
permissions:
  contents: write
jobs:
  materialize-tested-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/five-causal-experiments-20261013
          persist-credentials: true
      - name: Decode exact locally tested sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          payloads = {
            "scripts/memory_cell/full_select_retrieval.py": "",
            "scripts/memory_cell/full_select_retrieval_trial.py": "",
            "scripts/memory_cell/test_full_select_retrieval.py": "",
          }
          expected = {
            "scripts/memory_cell/full_select_retrieval.py": "2d5c4b14eff9fa02092c283356f24d098268667cfb8d5df3c4c2608efa4e1969",
            "scripts/memory_cell/full_select_retrieval_trial.py": "6af7cbf9c4ef701edf8f1d6491fbc51e3c565c2b799067f2d868f338942d52da",
            "scripts/memory_cell/test_full_select_retrieval.py": "b257c50cb7f87b7e60088c6df7181cda80aa2f6c93bc29f13ca17d353c7b8ac4",
          }
          for name, encoded in payloads.items():
              raw = gzip.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(raw).hexdigest() == expected[name]
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
          PY
      - name: Commit exact sources and remove bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-bootstrap-full-select-sources.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/memory_cell/full_select_retrieval.py scripts/memory_cell/full_select_retrieval_trial.py scripts/memory_cell/test_full_select_retrieval.py .github/workflows/hepta-bootstrap-full-select-sources.yml
          git commit -m "research: add full SELECT frozen-feature retrieval implementation"
          git push origin HEAD:research/five-causal-experiments-20261013
