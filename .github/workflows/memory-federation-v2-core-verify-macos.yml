          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
              '''fn federation_source_binding(
              thread_id: &str,
              turn_id: &str,
              workspace: &Path,
              query_sha256: &Sha256Digest,
              bindings: &[FederatedMemoryRevalidationBinding],
