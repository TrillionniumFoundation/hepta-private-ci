name: memory federation v2 apply verify macos

on:
  push:
    branches:
      - fix/memory-federation-v2-hardening
    paths:
      - .github/workflows/memory-federation-v2-core-verify-macos.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/memory-federation-v2-hardening

      - name: Apply product composition and final hardening patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(
                      f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}"
                  )
              p.write_text(text.replace(old, new, count))

          # ---- Canonical V2 result validation ----
          replace(
              "codex-rs/hepta-memory-federation/src/v2.rs",
              '''        validate_unique_items(&self.items)?;
          if self.authority.grants_any() {
          ''',
              '''        validate_unique_items(&self.items)?;
          if let Some(digest) = self.remote_response_digest {
              ensure_digest("remote_response", digest)?;
          }
          if let Some(digest) = self.authority_observation_digest {
              ensure_digest("authority_observation", digest)?;
          }
          if self.authority.grants_any() {
          ''',
          )

          # ---- Product runtime: one total budget and unique attempt nonce ----
          replace(
              "codex-rs/hepta-memory/src/cognitive_runtime.rs",
              '''use std::sync::Arc;
          use std::sync::Mutex;
          use std::time::Duration;
          use std::time::Instant;
          ''',
              '''use std::sync::Arc;
          use std::sync::Mutex;
          use std::sync::atomic::AtomicU64;
          use std::sync::atomic::Ordering;
          use std::time::Duration;
          use std::time::Instant;
          use std::time::SystemTime;
          use std::time::UNIX_EPOCH;
          ''',
          )
          replace(
              "codex-rs/hepta-memory/src/cognitive_runtime.rs",
              '''const PRODUCT_FEDERATION_TOTAL_BUDGET: Duration = Duration::from_secs(2);
          const MAX_PRODUCT_FEDERATION_OWNER_LAYOUTS: usize = 128;
          const PRODUCT_FEDERATION_PURPOSE: &[u8] = b"hepta.cognitive.federated-recall.product.v2";
          ''',
              '''const PRODUCT_FEDERATION_TOTAL_BUDGET: Duration = Duration::from_secs(2);
          const MAX_PRODUCT_FEDERATION_OWNER_LAYOUTS: usize = 128;
          const PRODUCT_FEDERATION_PURPOSE: &[u8] = b"hepta.cognitive.federated-recall.product.v2";
          static PRODUCT_FEDERATION_ATTEMPT_SEQUENCE: AtomicU64 = AtomicU64::new(1);
          ''',
          )
          replace(
              "codex-rs/hepta-memory/src/cognitive_runtime.rs",
              '''    let discovery = async {
          ''',
              '''    let logical_start_ms = seconds_to_ms(request.now_unix_seconds())?;
          let started_at = Instant::now();
          let global_deadline_ms = logical_start_ms
              .checked_add(
                  u64::try_from(PRODUCT_FEDERATION_TOTAL_BUDGET.as_millis()).unwrap_or(u64::MAX),
              )
              .ok_or_else(|| CognitiveStoreError::Invalid("federation deadline overflow".to_string()))?;

          let discovery = async {
          ''',
          )
          replace(
              "codex-rs/hepta-memory/src/cognitive_runtime.rs",
              '''    let query_sha256 = Sha256Digest::for_bytes(request.query().as_bytes());
          let logical_start_ms = seconds_to_ms(request.now_unix_seconds())?;
          let started_at = Instant::now();
          let global_deadline_ms = logical_start_ms
              .checked_add(
                  u64::try_from(PRODUCT_FEDERATION_TOTAL_BUDGET.as_millis()).unwrap_or(u64::MAX),
              )
              .ok_or_else(|| CognitiveStoreError::Invalid("federation deadline overflow".to_string()))?;
          ''',
              '''    let query_sha256 = Sha256Digest::for_bytes(request.query().as_bytes());
          ''',
          )
          replace(
              "codex-rs/hepta-memory/src/cognitive_runtime.rs",
              '''    let nonce_digest = domain_digest32(
              b"hepta.memory-federation.product-nonce.v2",
              &[
                  query_digest.as_array(),
                  capability.id().as_str().as_bytes(),
                  &logical_start_ms.to_be_bytes(),
              ],
          );
          ''',
              '''    let attempt_sequence = PRODUCT_FEDERATION_ATTEMPT_SEQUENCE
              .fetch_update(Ordering::Relaxed, Ordering::Relaxed, |value| value.checked_add(1))
              .map_err(|_| {
                  CognitiveStoreError::Unavailable(
                      "memory federation attempt sequence exhausted".to_string(),
                  )
              })?;
          let wall_clock_nanos = SystemTime::now()
              .duration_since(UNIX_EPOCH)
              .map(|duration| duration.as_nanos())
              .unwrap_or(0);
          let process_id = u64::from(std::process::id());
          let nonce_digest = domain_digest32(
              b"hepta.memory-federation.product-nonce.v2",
              &[
                  query_digest.as_array(),
                  capability.id().as_str().as_bytes(),
                  &logical_start_ms.to_be_bytes(),
                  &attempt_sequence.to_be_bytes(),
                  &wall_clock_nanos.to_be_bytes(),
                  &process_id.to_be_bytes(),
              ],
          );
          ''',
          )

          # ---- Agentd product host uses V2 runtime composition ----
          replace(
              "codex-rs/hepta-agentd/src/runtime.rs",
              '''use std::time::SystemTime;
          use std::time::UNIX_EPOCH;
          ''',
              '',
          )
          replace(
              "codex-rs/hepta-agentd/src/runtime.rs",
              'use codex_hepta_memory::FederatedRecallSet;\n',
              '',
          )
          replace(
              "codex-rs/hepta-agentd/src/runtime.rs",
              '''    state.refresh_generation()?;
          let now = SystemTime::now()
              .duration_since(UNIX_EPOCH)
              .map_err(|error| AgentdError::Protocol(error.to_string()))?
              .as_secs();
          let now = i64::try_from(now)
              .map_err(|_| AgentdError::Protocol("system clock overflow".to_string()))?;
          let federation =
              FederatedRecallSet::discover(state.identity().agent_id.clone(), owner_layouts, now).await;
          // Discovery reads other owner stores and can outlive a lifecycle update.
          // Fence once more before the read-only set reaches App Server.
          state.refresh_generation()?;
          Ok(runtime.with_federation(federation))
          ''',
              '''    state.refresh_generation()?;
          let runtime = runtime.with_federation_sources(
              state.identity().agent_id.clone(),
              owner_layouts,
          );
          // Physical federation reads rediscover current grants. Fence the fleet
          // generation on both sides of composition without freezing a reader set.
          state.refresh_generation()?;
          Ok(runtime)
          ''',
          )

          # ---- Memory extension backend: canonical V2 in product, legacy only for compatibility ----
          replace(
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs",
