          PY

      - name: Format touched Rust crates
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-memory-extension -p codex-hepta-agentd -p codex-app-server

      - name: Test canonical federation contract
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory-federation --lib

      - name: Test memory product adapter
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory --lib cognitive_runtime_tests

      - name: Test existing federation owner suite
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory --lib cognitive_federation_tests

      - name: Test product memory extension federation
        working-directory: codex-rs
        run: cargo test -p codex-hepta-memory-extension --lib cognitive::federation

      - name: Check Agentd and App Server composition
        working-directory: codex-rs
        run: cargo check -p codex-hepta-agentd -p codex-app-server

      - name: Verify diff whitespace
        run: git diff --check

      - name: Commit verified product composition
        shell: bash
        run: |
          rm -f .github/workflows/memory-federation-v2-branch-hardening.yml
          rm -f .github/workflows/memory-federation-v2-core-verify-macos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "memory.federation: compose hardened v2 product path"
          git push origin HEAD:fix/memory-federation-v2-hardening

# retrigger: canonical v2 product-path verification
