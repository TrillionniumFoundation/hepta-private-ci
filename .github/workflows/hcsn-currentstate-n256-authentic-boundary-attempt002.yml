name: hcsn-currentstate-n256-authentic-boundary-attempt002
on:
  push:
    branches:
      - research/hcsn-n256-authentic-boundary-attempt002-20261121-c06d
permissions:
  contents: read
jobs:
  attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      UNIQUE_EXECUTION_KEY: hcsn-n256-authentic-boundary-hosted-20261121-c06d-002
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.3
      - name: Verify frozen source before runtime installation
        run: |
          python -m qualification.hcsn_currentstate_n256_authentic_boundary_attempt002.verify_source
          python -m unittest qualification.hcsn_currentstate_n256_authentic_boundary_attempt002.test_source -v
          python -O -m unittest qualification.hcsn_currentstate_n256_authentic_boundary_attempt002.test_source -v
      - name: Install frozen binary runtime
        run: >-
          python -m pip install --only-binary=:all:
          -r qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/requirements.txt
      - name: Execute once and retain its exit status
        run: |
          set +e
          python -m qualification.hcsn_currentstate_n256_authentic_boundary_attempt002.run
          status=$?
          printf '%s\n' "$status" > qualification/hcsn_currentstate_n256_authentic_boundary_attempt002/RUN_OUTPUT/EXECUTION_EXIT_STATUS
          exit 0
      - name: Independently audit the full denominator
        if: always()
        run: python -m qualification.hcsn_currentstate_n256_authentic_boundary_attempt002.audit
      - name: Publish immutable terminal
        if: always()
        run: python -m qualification.hcsn_currentstate_n256_authentic_boundary_attempt002.terminal
      - name: Upload complete raw attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-authentic-boundary-attempt002
          path: qualification/hcsn_currentstate_n256_authentic_boundary_attempt002/RUN_OUTPUT
          retention-days: 30
      - name: Enforce the frozen zero-mismatch gate
        if: always()
        run: python -m qualification.hcsn_currentstate_n256_authentic_boundary_attempt002.terminal --enforce
