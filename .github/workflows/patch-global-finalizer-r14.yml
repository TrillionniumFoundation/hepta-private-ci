name: patch-global-finalizer-r14

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/patch-global-finalizer-r14.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: patch-global-finalizer-r14
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: c9fd340c45340c733481eadc403f7e7f267425b3
      TARGET_BRANCH: ops/hepta-global-gap-closure-controller-20260910-r1
      FINALIZER: scripts/hepta-global-finalizer-r7.py
      PATCH_SCRIPT: scripts/patch-global-finalizer-r14.py
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact one-shot patch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable patch preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD:.github/workflows/patch-global-finalizer-r14.yml)" = "$(git hash-object .github/workflows/patch-global-finalizer-r14.yml)"
          test "$(git rev-parse HEAD:${PATCH_SCRIPT})" = "$(git hash-object "${PATCH_SCRIPT}")"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"

      - name: Apply and validate semantic convergence repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "${PATCH_SCRIPT}"
          python3 -m py_compile "${FINALIZER}" "${PATCH_SCRIPT}"
          grep -Fq 'LANE_G_PRIOR_OWNER_CONFLICTS = frozenset(' "${FINALIZER}"
          grep -Fq 'autoResolvedLaneGPriorOwnerOnly' "${FINALIZER}"
          grep -Fq 'lane_g_artifact_repair = repair_lane_g_shared_artifacts()' "${FINALIZER}"
          grep -Fq 'path == ".github/workflows/lane-f-bootstrap.yml"' "${FINALIZER}"
          grep -Fq 'def dependency_cycle_path(' "${FINALIZER}"
          git diff --check

      - name: Publish exact patched controller and dispatch r7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-global-finalizer-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-global-finalizer-r13.yml
          git rm scripts/patch-global-finalizer-r13.py
          git rm .github/workflows/patch-global-finalizer-r14.yml
          git rm "${PATCH_SCRIPT}"
          git add "${FINALIZER}"
          git diff --cached --check
          git commit --signoff -m 'fix(hepta): regenerate Lane G shared execution dossiers'
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          gh workflow run hepta-global-finalizer-r7.yml --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
