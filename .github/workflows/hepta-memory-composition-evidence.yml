name: MemoryCell publisher composition evidence
on:
  pull_request:
    paths:
      - 'scripts/memory_cell/composition_*.py'
      - 'scripts/memory_cell/test_composition_evidence.py'
      - 'scripts/memory_cell/test_composition_policy.py'
      - '.github/workflows/hepta-memory-composition-evidence.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-composition-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  publisher-data:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts/memory_cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate data boundaries and acquire exact publisher archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/composition-validation
          python3 -m unittest discover -s scripts/memory_cell -p test_composition_evidence.py -v 2>&1 | tee /tmp/composition-validation/tests.log
          python3 scripts/memory_cell/composition_evidence.py /tmp/composition-data --source-commit "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/composition-data')
          plan = json.loads((root / 'plan.json').read_text())
          print(json.dumps({'source': plan['source_commit'], 'counts': plan['frozen_counts'], 'cases': len(plan['cases'])}))
          for case in plan['cases']:
              if case['phase'] == 'capability':
                  print(json.dumps({'question': case['question'], 'evidence': case['conditions']['publisher_pair']['delivered_evidence']}, ensure_ascii=False))
          PY
      - name: Retain failures and exact source
        if: always()
        run: |
          mkdir -p /tmp/composition-validation/source
          cp scripts/memory_cell/composition_*.py /tmp/composition-validation/source/
          git rev-parse HEAD > /tmp/composition-validation/tested-commit.txt
          if test -d /tmp/composition-data; then
            (cd /tmp/composition-data && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-composition-validation
          path: /tmp/composition-validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-composition-publisher-data
          path: /tmp/composition-data
          if-no-files-found: error
