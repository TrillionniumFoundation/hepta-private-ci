name: Hepta AuthBus Outbox capacity conformance (research gate)

on:
  pull_request:
    paths:
      - "codex-rs/hepta-evidence/src/authbus_outbox*.rs"
      - ".github/workflows/hepta-authbus-outbox-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-outbox-capacity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capacity:
    name: Real SQLite outbox boundaries on ${{ matrix.os }} (no promotion)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR source without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove tested SHA and formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-evidence -- --check
      - name: Exercise actual global capacity versus per-issuer active quota
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-evidence --lib \
            authbus_outbox_tests::bounded_capacity_prunes_only_terminal_history_and_keeps_replay_consumed \
            -- --exact --test-threads=1
      - name: Verify single issuer cannot monopolize all active rows across epochs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-evidence --lib \
            authbus_outbox_tests::one_issuer_cannot_exhaust_the_global_active_outbox_across_epochs \
            -- --exact --test-threads=1
      - name: Verify no qualification mutation
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code

# Fixture data deliberately injects synthetic SQL rows only for quota testing.
# This is not a production-issuer signature, independent NDU, or a deployment grant.
