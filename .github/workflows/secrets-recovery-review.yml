name: Secrets recovery review

on:
  push:
    branches: [codex/secrets-heptabao-recovery-hardening-20260927]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-recovery-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export the exact tracked review source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/secrets-review
          git archive --format=tar.gz HEAD > /tmp/secrets-review/source.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/secrets-review/identity.txt
          sha256sum /tmp/secrets-review/source.tar.gz > /tmp/secrets-review/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-review-source-${{ github.sha }}
          path: /tmp/secrets-review/
          if-no-files-found: error
          retention-days: 7
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Execute exact-source checks
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 codex-rs/hepta-bao-adapter/qa/qualify.py --expected-sha "$EXPECTED_SHA" --candidate-role source-head --output .hepta-evidence/secrets-recovery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secrets-review-native-${{ github.sha }}
          path: .hepta-evidence/secrets-recovery
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
