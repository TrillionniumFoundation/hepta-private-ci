name: channel.matrix reviewed recovery source

on:
  push:
    branches: [codex/channel-matrix-full-closure-20260927]
    paths:
      - '.github/channel-matrix-runtime-source/**'
      - '.github/workflows/channel-matrix-runtime-author.yml'

permissions:
  contents: write

concurrency:
  group: matrix-reviewed-recovery-authoring-${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  reviewed-tree:
    if: >-
      github.repository == 'TrillionniumFoundation/hepta-private-ci' &&
      github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact reviewed preimages and apply bounded source
        run: python3 .github/channel-matrix-runtime-source/author.py apply
      - name: Format Matrix-owned Rust source before creating the candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-matrix-sdk --package codex-hepta-matrix-store --package codex-hepta-matrixd
          rustc +1.95.0 --version > "$RUNNER_TEMP/matrix-runtime-authoring/toolchain.txt"
      - name: Execute Python SQLite and evidence regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_channel_matrix*.py' -v 2>&1 | tee "$RUNNER_TEMP/matrix-runtime-authoring/python-tests.log"
          python3 scripts/channel_matrix_migrations.py --check
      - name: Create reviewed Git tree without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/channel-matrix-runtime-source/author.py tree
      - name: Retain source authoring results, never native qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matrix-recovery-reviewed-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/matrix-runtime-authoring/
          if-no-files-found: error
          retention-days: 14
