name: Source-authorized Circuit router qualification
on:
  push:
    branches: [research/paired-consumer-router-source-20261123]
    paths:
      - '.github/workflows/paired-router-source.yml'
      - 'qualification/paired-router-source-20261123/*.py'
      - 'scripts/cell_experiments/paired_router_source.py'
      - 'scripts/cell_experiments/paired_source_gate.py'
      - 'scripts/cell_experiments/paired_source_dispatch.py'
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install the Cell integrity CPU numerical profile
        run: |
          python -m venv "$RUNNER_TEMP/consumer-env"
          "$RUNNER_TEMP/consumer-env/bin/pip" install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
          "$RUNNER_TEMP/consumer-env/bin/pip" install --only-binary=:all: numpy==2.3.5 transformers==4.57.3 peft==0.18.0 tokenizers==0.22.2 accelerate==1.16.0 safetensors==0.7.0 huggingface-hub==0.36.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 751e3df8819ef975fea5eb8a7395aba543ee98f1
          path: fixture-inputs
          sparse-checkout: qualification/paired-consumer-circuit-20261123
          persist-credentials: false
      - name: Replay router-only fit and original cold readback
        run: |
          "$RUNNER_TEMP/consumer-env/bin/python" qualification/paired-router-source-20261123/qualify.py fixture-inputs/qualification/paired-consumer-circuit-20261123/CONSUMER_CIRCUIT_ORIGINALS.zip "$RUNNER_TEMP/router-originals"
          old=fixture-inputs/qualification/paired-consumer-circuit-20261123
          here=qualification/paired-router-source-20261123
          "$RUNNER_TEMP/consumer-env/bin/python" "$here/verify_fixed.py" "$old/CONSUMER_CIRCUIT_ORIGINALS.zip" "$old/verify.py" "$here/ROUTER_SOURCE_ORIGINALS.zip"
          "$RUNNER_TEMP/consumer-env/bin/python" "$here/control.py" "$old/CONSUMER_CIRCUIT_ORIGINALS.zip" "$RUNNER_TEMP/router-originals" "$RUNNER_TEMP/old-control"
          "$RUNNER_TEMP/consumer-env/bin/python" -m unittest cell_experiments.test_paired_source_dispatch cell_experiments.test_paired_source_dispatch_intake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: router-source-originals
          path: |
            ${{ runner.temp }}/ROUTER_SOURCE_ORIGINALS.zip
            ${{ runner.temp }}/ROUTER_CONTROL.zip
            ${{ runner.temp }}/old-control/CONTROL.json
          if-no-files-found: error
          retention-days: 30
