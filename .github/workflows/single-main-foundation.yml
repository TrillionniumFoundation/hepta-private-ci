name: single-main-foundation
on:
  push:
    branches: [integration/single-main-20260922]
    paths: [.github/workflows/single-main-foundation.yml]
permissions:
  contents: read
concurrency:
  group: single-main-foundation
  cancel-in-progress: false
env:
  CANDIDATE_SHA: a8f71be5d5eccd39090e054dc441e3e5f2a842a6
  CANDIDATE_TREE: 121cb9e5050c8d36e6130d178a38828b6d59bf57
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import authenticated bundle and publish only a temporary candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.run(['git', *args], text=True, capture_output=True, check=True).stdout.strip()
          git('fetch', '--no-tags', 'origin', '+refs/heads/*:refs/remotes/origin/*')
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/bebbd180d9bcdd722d9b45e86006add0488adccf'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              obj = json.load(response)
          assert obj['sha'] == 'bebbd180d9bcdd722d9b45e86006add0488adccf' and obj['encoding'] == 'base64'
          data = base64.b64decode(obj['content'])
          assert hashlib.sha256(data).hexdigest() == '77f94454e0225efc64685cb0296d2c4f77bda3d530d57cfb27ae9991e195510b'
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foundation.bundle'
          bundle.write_bytes(data)
          git('bundle', 'verify', str(bundle))
          git('fetch', str(bundle), 'refs/heads/consolidation-work:refs/heads/verified-foundation')
          candidate = os.environ['CANDIDATE_SHA']
          assert git('rev-parse', 'verified-foundation') == candidate
          assert git('rev-parse', candidate + '^{tree}') == os.environ['CANDIDATE_TREE']
          for sha in ['a74246c4d7657d4c6b09fc50c41f1d715ace5e0e', 'c9a335297271563a623cc9763df87e327abb7e79', 'c0c81f8f3cddac3c433ccf7ccd65cf4cf3210894', '809de22a3ad9abef7ea34c0534dda992838d23b4', '716b44b6531c6f07f3534bbd07200080c2d7a67b']:
              git('merge-base', '--is-ancestor', sha, candidate)
          env = os.environ.copy()
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git', 'push', '--porcelain', 'origin', candidate + ':refs/heads/integration/single-main-foundation-20260922'], env=env, check=True)
          print('STAGED_EXACT_CANDIDATE', candidate, os.environ['CANDIDATE_TREE'])
          print('Main was not moved; no branch was deleted; qualification remains pending.')
          PY
  source-and-format:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a8f71be5d5eccd39090e054dc441e3e5f2a842a6
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Execute source regressions and check Rust formatting without weakening either gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foundation-source'
          out.mkdir()
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['CANDIDATE_SHA']
          assert git('rev-parse', 'HEAD^{tree}') == os.environ['CANDIDATE_TREE']
          commands = [
              ('workspace-structure', ['python3', 'scripts/hepta_workspace.py']),
              ('workspace-regressions', ['python3', '-m', 'unittest', 'discover', '-v', '-s', 'scripts', '-p', 'test_hepta_workspace.py']),
              ('source-regressions', ['python3', '-m', 'unittest', 'discover', '-v', '-s', 'scripts', '-p', 'test_hepta_implementation*.py']),
              ('exact-source-maps', ['python3', 'scripts/hepta-implementation-maps.py', 'verify', '--require-current-source']),
              ('rustfmt', ['cargo', 'fmt', '--manifest-path', 'codex-rs/Cargo.toml', '--', '--config', 'imports_granularity=Item', '--check']),
              ('cargo-metadata', ['cargo', 'metadata', '--manifest-path', 'codex-rs/Cargo.toml', '--no-deps', '--format-version', '1'])
          ]
          results = []
          for name, command in commands:
              with (out / (name + '.log')).open('w') as log:
                  p = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, text=True)
              results.append({'name': name, 'command': command, 'exitCode': p.returncode})
              print(name, p.returncode)
          assert not git('status', '--porcelain'), 'qualification modified candidate'
          if next(x for x in results if x['name'] == 'rustfmt')['exitCode']:
              subprocess.run(['cargo', 'fmt', '--manifest-path', 'codex-rs/Cargo.toml', '--', '--config', 'imports_granularity=Item'], check=True)
              with (out / 'proposed-rustfmt.patch').open('w') as patch:
                  subprocess.run(['git', 'diff', '--binary'], stdout=patch, text=True, check=True)
              (out / 'proposed-rustfmt-paths.txt').write_text(git('diff', '--name-only') + '\n')
          receipt = {'candidateSha': os.environ['CANDIDATE_SHA'], 'candidateTree': os.environ['CANDIDATE_TREE'], 'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'results': results, 'allListedCommandsPassed': all(x['exitCode'] == 0 for x in results), 'productQualificationClaim': False, 'mainChanged': False}
          (out / 'source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          raise SystemExit(0 if receipt['allListedCommandsPassed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-main-foundation-source-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-source/
          retention-days: 30
  focused-rust:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a8f71be5d5eccd39090e054dc441e3e5f2a842a6
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest
      - name: Execute real focused tests and strict Clippy on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foundation-rust'
          out.mkdir()
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['CANDIDATE_SHA']
          packages = ['codex-hepta-operations', 'codex-hepta-wire', 'codex-hepta-context-compiler', 'codex-hepta-codex-adapter', 'codex-hepta-automation']
          selection = [item for package in packages for item in ['-p', package]]
          commands = [('focused-tests', ['just', 'test', *selection]), ('strict-clippy', ['cargo', 'clippy', '--manifest-path', 'codex-rs/Cargo.toml', '--tests', *selection, '--', '-D', 'warnings'])]
          results = []
          for name, command in commands:
              with (out / (name + '.log')).open('w') as log:
                  p = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, text=True)
              results.append({'name': name, 'command': command, 'exitCode': p.returncode})
              print(name, p.returncode)
          with (out / 'candidate-mutation.patch').open('w') as patch:
              subprocess.run(['git', 'diff', '--binary'], stdout=patch, text=True, check=True)
          clean = not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          receipt = {'candidateSha': os.environ['CANDIDATE_SHA'], 'candidateTree': os.environ['CANDIDATE_TREE'], 'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'results': results, 'worktreeRemainedClean': clean, 'allListedCommandsPassed': clean and all(x['exitCode'] == 0 for x in results), 'wholeRepositoryQualificationClaim': False, 'productQualificationClaim': False}
          (out / 'rust-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          raise SystemExit(0 if receipt['allListedCommandsPassed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-main-foundation-rust-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-rust/
          retention-days: 30
