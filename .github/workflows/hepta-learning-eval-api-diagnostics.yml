name: Hepta learning.eval API diagnostics

on:
  push:
    branches:
      - fix/learning-eval-full-convergence-20260926

permissions:
  contents: read

concurrency:
  group: hepta-learning-eval-api-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Diagnose compiler-enforced API surface
        shell: bash
        run: |
          set +e
          mkdir -p .hepta-evidence/learning-eval
          bash scripts/hepta-learning-eval-api-surface.sh \
            > >(tee .hepta-evidence/learning-eval/api-surface.stdout.log) \
            2> >(tee .hepta-evidence/learning-eval/api-surface.stderr.log >&2)
          status=$?
          if [ "${status}" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          log = Path('.hepta-evidence/learning-eval/api-surface.stderr.log')
          text = log.read_text(errors='replace')[-12000:] if log.exists() else 'no stderr captured'
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=learning.eval API surface::{text}')
          PY
          fi
          exit "${status}"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-eval-api-diagnostics-${{ github.sha }}
          path: .hepta-evidence/learning-eval/api-surface.*.log
          if-no-files-found: error
          retention-days: 7
