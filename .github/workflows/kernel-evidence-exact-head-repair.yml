name: Kernel evidence exact-head native repair

on:
  push:
    branches: [fix/kernel-evidence-production-closure]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernel-evidence-exact-head-native-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[kernel-evidence-native-repair]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.sha }}
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Check out immutable repair source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up repository CI prerequisites
        uses: ./.github/actions/setup-ci
      - name: Install pinned Python tooling
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install pinned nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.103
      - name: Apply source repairs and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          (cd codex-rs && cargo fmt -- --config imports_granularity=Item)
          base64 --decode <<'REPAIR' | gzip --decompress > "$RUNNER_TEMP/kernel-evidence-repair.py"
