          uv run --frozen --project scripts ruff format scripts
          git diff --check
      - name: Verify repaired exact source before publication
        shell: bash
        run: |
          set -euo pipefail
          just fmt-check
          just test --locked -p codex-hepta-evidence
          just test --locked -p codex-hepta-agentd --lib \
            --test kernel_evidence_product \
            --test kernel_evidence_profile \
            --test kernel_evidence_paging_product \
            --test kernel_evidence_publication_cli
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-evidence --doc
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-evidence -p codex-hepta-agentd \
            --all-targets --no-deps -- -D warnings
          cargo build --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-agentd --bin codex-hepta-agentd
          python3 scripts/verify_lane_a_foundation.py verify
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-implementation-maps.py verify
          git diff --check
      - name: Commit verified source and remove one-shot repair workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rm .github/workflows/kernel-evidence-exact-head-repair.yml
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name "kernel-evidence repair bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(kernel.evidence): close exact-head native regressions [kernel-evidence-native-repair]"
          git push origin HEAD:fix/kernel-evidence-production-closure
