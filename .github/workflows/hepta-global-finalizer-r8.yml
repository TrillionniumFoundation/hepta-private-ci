name: Hepta deterministic repair replay r8

on:
  push:
    branches:
      - ops/hepta-global-gap-closure-controller-20260910-r1
    paths:
      - .github/workflows/hepta-global-finalizer-r8.yml
      - scripts/hepta-global-finalizer-r7.py
      - scripts/hepta-global-finalizer-r8.py
      - scripts/hepta-global-finalizer-r8-fixed.py
  workflow_dispatch:
    inputs:
      target_branch:
        description: Dedicated repaired candidate branch
        required: false
        default: integration/hepta-all-gap-closure-20260910-r8
      shard_count:
        description: Parallel package shards
        required: false
        default: '8'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: hepta-global-finalizer-r8
  cancel-in-progress: false

env:
  HEPTA_FINAL_TARGET: ${{ inputs.target_branch || 'integration/hepta-all-gap-closure-20260910-r8' }}
  HEPTA_R8_SHARDS: ${{ inputs.shard_count || '8' }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  bootstrap:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind and syntax-check executors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD HEAD^{tree}
          python3 -m py_compile \
            scripts/hepta-global-finalizer-r7.py \
            scripts/hepta-global-finalizer-r8.py \
            scripts/hepta-global-finalizer-r8-fixed.py
          mkdir -p "${RUNNER_TEMP}/hepta-r8-executor"
          cp scripts/hepta-global-finalizer-r7.py \
            scripts/hepta-global-finalizer-r8.py \
            scripts/hepta-global-finalizer-r8-fixed.py \
            "${RUNNER_TEMP}/hepta-r8-executor/"

      - name: Upload exact executor bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-r8-executor-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-r8-executor
          if-no-files-found: error
          retention-days: 1

  prepare:
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      candidate_branch: ${{ steps.prepare.outputs.candidate_branch }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      package_count: ${{ steps.prepare.outputs.package_count }}
      prepared: ${{ steps.prepare.outputs.prepared }}
    steps:
      - name: Check out controller with complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-r8-executor-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-r8-executor

      - name: Repair and materialize exact candidate
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/hepta-r8-executor/hepta-global-finalizer-r8-fixed.py" \
            prepare --shards "${HEPTA_R8_SHARDS}"

      - name: Upload prepare receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-r8-receipt-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/global-gap-closure-final-r8/PREPARE.json
          if-no-files-found: warn
          retention-days: 14

  repository-gate:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.prepared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact repaired source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-r8-executor-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-r8-executor

      - name: Execute closed-world and document gates
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/hepta-r8-executor/hepta-global-finalizer-r8-fixed.py" \
            repository-gate \
            --expected-sha "${{ needs.prepare.outputs.candidate_sha }}"

      - name: Upload repository receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-r8-receipt-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/global-gap-closure-final-r8/REPOSITORY_GATE.json
          if-no-files-found: warn
          retention-days: 14

  package-gates:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.prepared == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact repaired source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-r8-executor-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-r8-executor

      - name: Test and lint repaired package shard ${{ matrix.shard }}
        shell: bash
        env:
          HEPTA_PACKAGES_JSON: ${{ matrix.packages_json }}
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/hepta-r8-executor/hepta-global-finalizer-r8-fixed.py" \
            package-gate \
            --expected-sha "${{ needs.prepare.outputs.candidate_sha }}" \
            --shard "${{ matrix.shard }}" \
            --packages-json "${HEPTA_PACKAGES_JSON}"

      - name: Upload package receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-r8-receipt-package-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/global-gap-closure-final-r8/PACKAGE_GATE_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

  finalize:
    needs:
      - prepare
      - repository-gate
      - package-gates
    if: always() && needs.prepare.outputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      internal_passed: ${{ steps.finalize.outputs.internal_passed }}
      receipt_commit: ${{ steps.finalize.outputs.receipt_commit }}
    steps:
      - name: Check out exact qualified repaired source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact executor bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hepta-r8-executor-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-r8-executor

      - name: Download all qualification receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hepta-r8-receipt-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-r8-receipts
          merge-multiple: true

      - name: Bind repaired source and receipts
        id: finalize
        shell: bash
        run: |
          set +e
          python3 "${RUNNER_TEMP}/hepta-r8-executor/hepta-global-finalizer-r8-fixed.py" \
            finalize \
            --expected-sha "${{ needs.prepare.outputs.candidate_sha }}" \
            --artifact-root "${RUNNER_TEMP}/hepta-r8-receipts" \
            --expected-shards "${HEPTA_R8_SHARDS}" \
            --prepare-result "${{ needs.prepare.result }}" \
            --repository-result "${{ needs.repository-gate.result }}" \
            --package-result "${{ needs.package-gates.result }}"
          rc=$?
          set -e
          exit "${rc}"

      - name: Upload final bound receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-r8-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification/global-gap-closure-final-r8
          if-no-files-found: warn
          retention-days: 30

      - name: Create or locate draft repaired-candidate PR
        if: steps.finalize.outputs.internal_passed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ops/hepta-final-convergence-review-anchor-20260909
          HEAD_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
          QUALIFIED_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          RECEIPT_SHA: ${{ steps.finalize.outputs.receipt_commit }}
        run: |
          set -euo pipefail
          existing="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --head "${HEAD_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "draft PR already exists: #${existing}"
            exit 0
          fi
          body="${RUNNER_TEMP}/hepta-r8-pr.md"
          cat > "${body}" <<EOF
          ## Exact repaired source

          - source commit: \`${QUALIFIED_SHA}\`
          - receipt commit: \`${RECEIPT_SHA}\`
          - scope: all canonical \`codex-hepta-*\` workspace packages
          - deterministic repairs: workspace dependencies, lock state, rustfmt, Cargo fix, Clippy fix, native blob identities
          - immutable gates: repository closed world plus parallel package tests and strict Clippy

          ## Receipts

          Review \`qualification/global-gap-closure-final-r8/STATUS.json\`, \`REPORT.md\`, \`EXTERNAL_GATE_HANDOFF.json\`, and every bound shard receipt.

          ## Authority ceiling

          This draft does not self-issue independent semantic approval, runtime/model identity, future-time validity, target-host/hardware qualification, remote-owner consent, operator acceptance, production canary, selection, promotion, release, model/provider dispatch, or a second production writer.
          EOF
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --base "${BASE_BRANCH}" \
            --head "${HEAD_BRANCH}" \
            --title "fix(hepta): deterministic all-package convergence r8" \
            --body-file "${body}"
