name: Apply auth.authbus correctness convergence

on:
  push:
    branches:
      - work/product-convergence-20260923
    paths:
      - .github/workflows/hepta-authbus-convergence-patch.yml

permissions:
  contents: write

concurrency:
  group: hepta-authbus-convergence-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply owner-bound settlement and checkpoint fixes
