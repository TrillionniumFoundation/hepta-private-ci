          }
          ''')

          # Preserve the exact signed-outbox crash window as a first-class regression.
          path = Path("codex-rs/hepta-evidence/src/authbus_recovery_tests.rs")
          text = path.read_text()
          marker = "#[tokio::test]\nasync fn altered_replay_checkpoint_schema_is_rejected_before_recovery()"
          extra = r'''#[tokio::test]
          async fn externally_published_pending_checkpoint_promotes_after_reopen() {
              let temp = TempDir::new().unwrap();
              let settings = config(&temp);
              let store = HeptaEvidenceStore::open(&settings).await.unwrap();
              let initial = initialize(&store, 1).await;
              let (_, issuer, message) = fixture(1);
              admit(&store, &issuer, &message).await.unwrap();
              let published = store
                  .pending_authbus_restore_checkpoint()
                  .await
                  .unwrap()
                  .expect("pending checkpoint");
              assert_eq!(published.generation, initial.generation + 1);
              store.pool.close().await;

              let reopened = HeptaEvidenceStore::open(&settings).await.unwrap();
              assert_eq!(
                  reopened
                      .reconcile_authbus_restore_checkpoint(published)
                      .await
                      .expect("promote published checkpoint"),
                  None
              );
              assert_eq!(reopened.authbus_restore_checkpoint().await.unwrap(), Some(published));
              assert_eq!(reopened.pending_authbus_restore_checkpoint().await.unwrap(), None);
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit("recovery test insertion marker drifted")
          path.write_text(text.replace(marker, extra + marker))
          PY

          rg -n 'settle\(&issuer|settle\(issuer' codex-rs --glob '*.rs' && {
            echo 'stale caller-supplied settlement issuer remains' >&2
            exit 1
          } || true

      - name: Format and validate AuthBus closure
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p codex-hepta-authbus --all-targets -- --nocapture
          cargo test --locked -p codex-hepta-evidence --lib authbus -- --nocapture
          cargo test --locked -p codex-hepta-bao-adapter --all-targets -- --nocapture
          cargo test --locked -p codex-hepta-authbus-p1-3-qualification --all-targets -- --nocapture
          cargo clippy --locked -p codex-hepta-authbus -p codex-hepta-evidence -p codex-hepta-bao-adapter --all-targets --no-deps -- -D warnings

      - name: Commit verified convergence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-authbus-convergence-patch.yml
          git diff --check
          git config user.name "Hepta AuthBus CI"
          git config user.email "hepta-authbus-ci@users.noreply.github.com"
          git add \
            codex-rs/hepta-authbus \
            codex-rs/hepta-evidence/src/authbus_recovery_tests.rs \
            codex-rs/hepta-bao-adapter/src/https_consumer.rs \
            .github/workflows/hepta-authbus-convergence-patch.yml
          git commit -m "auth.authbus: close settlement and checkpoint races"
          git fetch origin work/product-convergence-20260923
          git rebase origin/work/product-convergence-20260923
          git push origin HEAD:work/product-convergence-20260923
