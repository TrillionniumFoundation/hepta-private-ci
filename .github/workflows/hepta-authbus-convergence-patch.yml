              if self.claims.issuer_id != issuer.issuer_id || self.claims.key_epoch != issuer.key_epoch {
                  return Err(AuthBusAuthorityError::SettlementIssuerMismatch);
              }
""",
              """        issuer: &IssuerRecord,
              reservation_id: &StableId,
