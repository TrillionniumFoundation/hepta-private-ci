          INSERT INTO authbus_dispatch_boundary
              (reservation_id, dispatched_at_ms, dispatch_digest)
          SELECT reservation_id, updated_at_ms, dispatch_digest
          FROM authbus_quota_reservation
          WHERE dispatch_digest IS NOT NULL;

          CREATE TRIGGER authbus_dispatch_boundary_immutable
          BEFORE UPDATE ON authbus_dispatch_boundary
          BEGIN
              SELECT RAISE(ABORT, 'AuthBus dispatch boundary is immutable');
          END;

          CREATE TRIGGER authbus_dirty_dispatch_insert
          AFTER INSERT ON authbus_dispatch_boundary
