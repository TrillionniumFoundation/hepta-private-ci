          CREATE TABLE authbus_dispatch_boundary (
              reservation_id TEXT PRIMARY KEY
                  REFERENCES authbus_quota_reservation(reservation_id) ON DELETE CASCADE,
              dispatched_at_ms BLOB NOT NULL CHECK (length(dispatched_at_ms) = 8),
              dispatch_digest BLOB NOT NULL CHECK (length(dispatch_digest) = 32)
