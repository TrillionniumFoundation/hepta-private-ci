name: secrets.heptabao phase 2-4 staging qualification

on:
  push:
    branches:
      - codex/secrets-heptabao-phase234-staging
    paths:
      - "codex-rs/hepta-bao-adapter/qa/**"
      - "docs/modules/secrets.heptabao/**"
      - "scripts/generate_secrets_heptabao_module.py"
      - ".github/workflows/lane-a-foundation.yml"
      - ".github/workflows/secrets-heptabao-phase234-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-heptabao-phase234-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact staging candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify receipt control plane and canonical projections
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            codex-rs/hepta-bao-adapter/qa/qualify.py \
            codex-rs/hepta-bao-adapter/qa/pair_receipts.py
          python3 -m unittest codex-rs/hepta-bao-adapter/qa/test_qualification.py
          python3 scripts/generate_secrets_heptabao_module.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
