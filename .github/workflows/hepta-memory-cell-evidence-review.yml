name: MemoryCell complete native evidence review
on:
  pull_request:
    paths:
      - 'scripts/memory_cell/benchmark_review.py'
      - 'scripts/memory_cell/test_benchmark_review.py'
      - 'scripts/memory_cell/native_citation.py'
      - 'scripts/memory_cell/test_native_citation.py'
      - '.github/workflows/hepta-memory-cell-evidence-review.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-cell-evidence-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  completed-locomo-census:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test collector and native citation binding without model dependencies
        env:
          PYTHONPATH: scripts/memory_cell
        run: python3 -m unittest test_benchmark_review test_native_citation test_citation_audit -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: memory-native-preregistered-plans
          run-id: 37862780268
          github-token: ${{ github.token }}
          path: /tmp/preregistered
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-record-locomo-*
          run-id: 37862780268
          github-token: ${{ github.token }}
          path: /tmp/completed-shards
      - name: Verify exact historical plan, report hashes and source identity
        env:
          PYTHONPATH: scripts/memory_cell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          plan = Path('/tmp/preregistered/locomo.json')
          expected = '37119d722864d57cfbef8910c908140a9d52c67ae3e3d5c5da60fd9679a32617'
          if hashlib.sha256(plan.read_bytes()).hexdigest() != expected:
              raise ValueError('pre-run plan identity differs from independently pinned artifact')
          paths = sorted(Path('/tmp/completed-shards').rglob('report.json'))
          if len(paths) != 20:
              raise ValueError('all twenty historical LoCoMo shards are required')
          for report in paths:
              commit = (report.parent / 'tested-commit.txt').read_text().strip()
              if commit != '4e996a707a7717152ab36cccaed901c4bd8248a2':
                  raise ValueError('historical generation source drift')
              recorded = [line.split()[0] for line in (report.parent / 'SHA256SUMS').read_text().splitlines()
                          if line.endswith('  /tmp/native-record/report.json')]
              if recorded != [hashlib.sha256(report.read_bytes()).hexdigest()]:
                  raise ValueError('retained report hash mismatch')
          PY
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/snap-research/locomo/3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376/data/locomo10.json \
            -o /tmp/pinned-locomo.json
      - name: Export every original answer and missing audit, never synthesize adjudication
        env:
          PYTHONPATH: scripts/memory_cell
          VALIDATOR_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/memory_cell/benchmark_review.py \
            /tmp/preregistered/locomo.json /tmp/completed-shards /tmp/native-evidence-review \
            --validator-commit "$VALIDATOR_COMMIT" --benchmark-json /tmp/pinned-locomo.json \
            2>&1 | tee /tmp/native-evidence-review.log
          cat /tmp/native-evidence-review/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-cell-complete-locomo-review
          path: |
            /tmp/native-evidence-review
            /tmp/native-evidence-review.log
          if-no-files-found: warn
