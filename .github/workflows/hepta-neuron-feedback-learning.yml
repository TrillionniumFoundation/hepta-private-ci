name: Hepta verified local feedback learning

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "qualification/neuron-stem/fbsde_tracking_feedback*.py"
      - "qualification/neuron-stem/fbsde_depth*.py"
      - "qualification/neuron-stem/test_fbsde_depth.py"
      - "qualification/neuron-stem/test_fbsde_tracking_feedback.py"
      - "qualification/neuron-stem/fbsde_study.py"
      - ".github/workflows/hepta-neuron-feedback-learning.yml"

permissions:
  contents: read

jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [head, merge]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.source == 'head' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact source and CPU runtime
        run: |
          git rev-parse HEAD > source.txt
          git archive --format=tar.gz HEAD qualification/neuron-stem > source.tar.gz
          python3 -m venv /tmp/feedback-venv
          /tmp/feedback-venv/bin/pip install numpy==2.2.6
          /tmp/feedback-venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0+cpu
          /tmp/feedback-venv/bin/pip freeze > environment.txt
      - name: Preserve source regressions and execute new actual tensor contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=qualification/neuron-stem
          /tmp/feedback-venv/bin/python -m unittest discover -s qualification/neuron-stem -p 'test_*.py' -v 2>&1 | tee source-tests.log
          /tmp/feedback-venv/bin/python -m unittest fbsde_tracking_feedback_tensor_checks -v 2>&1 | tee tensor-tests.log
      - name: Build the unchanged source then run separate feedback candidates
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=qualification/neuron-stem
          /tmp/feedback-venv/bin/python qualification/neuron-stem/fbsde_study.py --profile input_tied_challenge_v1 --output base-study 2>&1 | tee base-study.log
          /tmp/feedback-venv/bin/python qualification/neuron-stem/fbsde_study.py --profile verified_feedback_learning_v1 --evidence-dir base-study --output feedback-study 2>&1 | tee feedback-study.log
          git diff --exit-code
      - name: Learn computation depth without reusing test scores
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=qualification/neuron-stem
          /tmp/feedback-venv/bin/python -m unittest fbsde_depth_tensor_checks -v 2>&1 | tee depth-tensor-tests.log
          /tmp/feedback-venv/bin/python qualification/neuron-stem/fbsde_study.py --profile learned_depth_allocation_v1 --evidence-dir base-study --output depth-study 2>&1 | tee depth-study.log
          git diff --exit-code
      - name: Preserve original outputs and failures, never grant promotion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feedback-learning-${{ matrix.source }}-${{ github.run_id }}
          path: |
            source.txt
            source.tar.gz
            environment.txt
            source-tests.log
            tensor-tests.log
            base-study.log
            feedback-study.log
            base-study/
            feedback-study/
            feedback-test-evidence/
            depth-tensor-tests.log
            depth-study.log
            depth-study/
          if-no-files-found: error
          retention-days: 30
