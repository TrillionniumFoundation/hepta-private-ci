name: Neuron runtime owner bootstrap

on:
  push:
    branches:
      - work/neuron-runtime-recovery-20260925
    paths:
      - scripts/apply_neuron_runtime_owner_closure_20260925.py
      - .github/workflows/neuron-runtime-owner-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: neuron-runtime-owner-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[neuron-owner-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: work/neuron-runtime-recovery-20260925
      - name: Verify clean exact bootstrap identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git rev-parse HEAD^)" = "a126987b84737dbc2ee2592442a314117bddb4a2"
      - name: Apply reviewed owner durability closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_neuron_runtime_owner_closure_20260925.py
      - name: Format exact Rust workspace
        working-directory: codex-rs
        run: cargo fmt --all
      - name: Reject whitespace errors
        run: git diff --check
      - name: Test neuron owner
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-neuron --lib
      - name: Test typed intelligence caller
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-intelligence --lib
      - name: Strict neuron lint
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-neuron --all-targets -- -D warnings
      - name: Commit exact reviewed result
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_neuron_runtime_owner_closure_20260925.py
          rm .github/workflows/neuron-runtime-owner-bootstrap.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name "Hepta Neuron CI"
          git config user.email "hepta-neuron-ci@users.noreply.github.com"
          git commit -m "fix(neuron): persist exact owner results and recovery [neuron-owner-applied]"
          git push origin HEAD:work/neuron-runtime-recovery-20260925
