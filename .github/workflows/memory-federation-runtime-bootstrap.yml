name: memory federation runtime closure bootstrap

on:
  push:
    branches:
      - feat/memory-federation-production-closure-20260926
    paths:
      - ".github/workflows/memory-federation-runtime-bootstrap.yml"
      - "scripts/apply_memory_federation_runtime_closure.py"
      - "scripts/postprocess_memory_federation_runtime_closure.py"

permissions:
  contents: write

concurrency:
  group: memory-federation-runtime-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    # Architecture-neutral source generation only. Rust formatting, compilation,
    # tests, and qualification remain in the exact-head and synthetic-merge lanes.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/memory-federation-production-closure-20260926
          fetch-depth: 1
          persist-credentials: true

      - name: Normalize closure generator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_memory_federation_runtime_closure.py")
          text = path.read_text(encoding="utf-8")
          regex_needle = "    updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE | re.DOTALL)"
          regex_replacement = r'''    pattern = pattern.replace("\\\\", "\\")
              updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE | re.DOTALL)'''
          if text.count(regex_needle) != 1:
              raise SystemExit("unexpected replace_re helper shape")
          text = text.replace(regex_needle, regex_replacement)

          lane_count = "    expected=2,\n"
          if text.count(lane_count) != 2:
              raise SystemExit("unexpected expected=2 cardinality")
          head, tail = text.rsplit(lane_count, 1)
          text = head + "    expected=1,\n" + tail
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile \
            scripts/apply_memory_federation_runtime_closure.py \
            scripts/postprocess_memory_federation_runtime_closure.py

      - name: Generate hardened runtime source
        run: |
          set -euo pipefail
          python3 scripts/apply_memory_federation_runtime_closure.py
          python3 scripts/postprocess_memory_federation_runtime_closure.py

      - name: Validate generated source shape
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/memory_federation_attestation.py
          python3 - <<'PY'
          from pathlib import Path

          required = {
              "codex-rs/hepta-memory-federation/src/legacy_v1.rs": "#![allow(deprecated)]",
              "codex-rs/hepta-memory/src/cognitive_runtime.rs": "buffer_unordered(host_profile.attempt_concurrency())",
              "codex-rs/hepta-memory/src/cognitive_runtime_identity.rs": "host_profile: left_host_profile",
              "codex-rs/hepta-agentd/src/runtime.rs": "HEPTA_MEMORY_FEDERATION_TOTAL_BUDGET_MS",
              "codex-rs/ext/hepta-memory/src/cognitive/federation.rs": "partial_peers",
          }
          for name, marker in required.items():
              text = Path(name).read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"generated source missing {marker!r} in {name}")
          PY
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit source closure
        run: |
          set -euo pipefail
          git config user.name "Hepta Memory Federation Automation"
          git config user.email "hepta-memory-federation@users.noreply.github.com"
          git rm .github/workflows/memory-federation-runtime-bootstrap.yml
          git rm -f scripts/apply_memory_federation_runtime_closure.py
          git rm -f scripts/postprocess_memory_federation_runtime_closure.py
          git rm -f qualification/memory-federation/BOOTSTRAP_FAILURE.md || true
          git add -A
          git commit -m "memory.federation: bound product concurrency and V1 surface

          - bind validated target-host limits into V2 runtime identity
          - stream owner discovery, peer attempts, and capability revalidation with independent bounds
          - preserve partial retrieval while keeping final-use all-current
          - separate partial peer coverage from known item truncation
          - move V1 receipt compatibility behind an opt-in feature

          Signed-off-by: Hepta Memory Federation Automation <hepta-memory-federation@users.noreply.github.com>"

      - name: Rebind implementation maps
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin feat/memory-federation-production-closure-20260926
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

          python3 scripts/hepta-implementation-maps.py migrate \
            --module memory.federation \
            --module kernel.operations \
            --module runtime.supervisor \
            --module runtime.agentd \
            --module cognitive.store \
            --module cognitive.read \
            --module memory.retrieval \
            --module knowledge.graph \
            --module automation.taskflow

          git diff --check
          git add docs/modules/*/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(memory-federation): rebind shared runtime consumers

            Rebind only modules whose implementation maps consume the Agentd or Memory source changed by this closure. Preserve execution, independent acceptance, activation, and release claims until their own qualification gates pass.

            Signed-off-by: Hepta Memory Federation Automation <hepta-memory-federation@users.noreply.github.com>"
          fi
          python3 scripts/hepta-implementation-maps.py verify
          test -z "$(git status --porcelain)"

      - name: Push generated commits
        run: git push origin HEAD:feat/memory-federation-production-closure-20260926
