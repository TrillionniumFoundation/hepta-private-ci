name: memory federation runtime closure bootstrap

on:
  push:
    branches:
      - feat/memory-federation-production-closure-20260926
    paths:
      - ".github/workflows/memory-federation-runtime-bootstrap.yml"
      - "scripts/apply_memory_federation_runtime_closure.py"

permissions:
  contents: write

concurrency:
  group: memory-federation-runtime-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    # This job only rewrites source, formats it, and regenerates implementation
    # metadata. It does not provide product qualification evidence.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/memory-federation-production-closure-20260926
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize and apply runtime closure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_memory_federation_runtime_closure.py")
          text = path.read_text(encoding="utf-8")
          needle = "    updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE | re.DOTALL)"
          replacement = r'''    pattern = pattern.replace("\\\\", "\\")
              updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE | re.DOTALL)'''
          if text.count(needle) != 1:
              raise SystemExit("unexpected replace_re helper shape")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
          python3 -m py_compile scripts/apply_memory_federation_runtime_closure.py
          python3 scripts/apply_memory_federation_runtime_closure.py

      - name: Harden generated semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          legacy = Path("codex-rs/hepta-memory-federation/src/legacy_v1.rs")
          legacy_text = legacy.read_text(encoding="utf-8")
          if "#![allow(deprecated)]" not in legacy_text:
              head, tail = legacy_text.split("\n\n", 1)
              legacy.write_text(head + "\n\n#![allow(deprecated)]\n\n" + tail, encoding="utf-8")

          runtime = Path("codex-rs/hepta-memory/src/cognitive_runtime.rs")
          text = runtime.read_text(encoding="utf-8")
          unconditional = (
              "    aggregate.partial_peers = aggregate\n"
              "        .partial_peers\n"
              "        .saturating_add(attempt.partial_peers);\n"
          )
          valid_branch = (
              "    if validity == FederatedValidityV2::Valid {\n"
              "        aggregate.completed_peers = aggregate\n"
          )
          valid_replacement = (
              "    if validity == FederatedValidityV2::Valid {\n"
              "        aggregate.partial_peers = aggregate\n"
              "            .partial_peers\n"
              "            .saturating_add(attempt.partial_peers);\n"
              "        aggregate.completed_peers = aggregate\n"
          )
          if text.count(unconditional) != 1 or text.count(valid_branch) != 1:
              raise SystemExit("unexpected generated partial-peer aggregation shape")
          text = text.replace(unconditional, "", 1).replace(valid_branch, valid_replacement, 1)
          runtime.write_text(text, encoding="utf-8")

          tests = Path("codex-rs/hepta-memory/src/cognitive_runtime_identity_tests.rs")
          text = tests.read_text(encoding="utf-8")
          marker = "fn federation_host_profile_rejects_zero_and_architecture_widening()"
          if marker not in text:
              text += r'''

          #[test]
          fn federation_host_profile_rejects_zero_and_architecture_widening() {
              use std::time::Duration;

              assert!(MemoryFederationHostProfile::try_new(Duration::ZERO, 1, 1, 1, 1, 1).is_err());
              assert!(MemoryFederationHostProfile::try_new(
                  crate::MAX_PRODUCT_FEDERATION_TOTAL_BUDGET + Duration::from_millis(1),
                  1, 1, 1, 1, 1,
              ).is_err());
              assert!(MemoryFederationHostProfile::try_new(
                  Duration::from_millis(1),
                  crate::MAX_PRODUCT_FEDERATION_OWNER_LAYOUTS + 1,
                  1, 1, 1, 1,
              ).is_err());
              assert!(MemoryFederationHostProfile::try_new(
                  Duration::from_millis(1), 1, 1, 2, 1, 1,
              ).is_err());

              let constrained = MemoryFederationHostProfile::try_new(
                  Duration::from_millis(250), 4, 2, 2, 2, 2,
              ).expect("bounded profile");
              assert_eq!(constrained.total_budget(), Duration::from_millis(250));
              assert_eq!(constrained.max_owner_candidates(), 4);
              assert_eq!(constrained.max_admitted_peers(), 2);
          }
          '''
              tests.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate generated source
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -p codex-hepta-memory-federation -p codex-hepta-memory -p codex-hepta-agentd -p codex-hepta-memory-extension
          cd ..
          python3 -m py_compile scripts/memory_federation_attestation.py
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit source and rebind implementation map
        run: |
          set -euo pipefail
          git config user.name "Hepta Memory Federation Automation"
          git config user.email "hepta-memory-federation@users.noreply.github.com"
          git rm .github/workflows/memory-federation-runtime-bootstrap.yml
          git rm scripts/apply_memory_federation_runtime_closure.py
          git rm -f qualification/memory-federation/BOOTSTRAP_FAILURE.md || true
          git add -A
          git commit -m "memory.federation: bound product concurrency and V1 surface

          - bind validated target-host limits into V2 runtime identity
          - stream owner discovery, peer attempts, and capability revalidation with independent bounds
          - preserve partial retrieval while keeping final-use all-current
          - separate partial peer coverage from known item truncation
          - move V1 receipt compatibility behind an opt-in feature

          Signed-off-by: Hepta Memory Federation Automation <hepta-memory-federation@users.noreply.github.com>"

          python3 scripts/hepta-implementation-maps.py migrate --module memory.federation
          git diff --check
          git add docs/modules/memory.federation/IMPLEMENTATION_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(memory.federation): rebind runtime closure source

            Preserve execution, independent acceptance, activation, and release claims as false until exact-head and deterministic-merge receipts pass.

            Signed-off-by: Hepta Memory Federation Automation <hepta-memory-federation@users.noreply.github.com>"
          fi
          python3 scripts/hepta-implementation-maps.py verify
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/memory-federation-production-closure-20260926
