name: NDU pinned review snapshot

on:
  push:
    branches: [codex/utility-ndu-production-hardening-20260926]
    paths: [.github/workflows/hepta-ndu-review-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 9c275f6a1de1ed3b826e1c921398ceda3b123ac1
          persist-credentials: false
          fetch-depth: 1
      - name: Export only tracked pinned source, never credentials or runtime state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9c275f6a1de1ed3b826e1c921398ceda3b123ac1
          OUT="$RUNNER_TEMP/ndu-review-source"
          mkdir -p "$OUT"
          git rev-parse HEAD HEAD^{tree} > "$OUT/identity.txt"
          git ls-tree -r HEAD > "$OUT/source-objects.txt"
          git archive --format=tar.gz HEAD > "$OUT/source.tar.gz"
          (cd "$OUT" && sha256sum source.tar.gz source-objects.txt identity.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-review-source-9c275f6a1de1ed3b826e1c921398ceda3b123ac1
          path: ${{ runner.temp }}/ndu-review-source
          if-no-files-found: error
          retention-days: 7
