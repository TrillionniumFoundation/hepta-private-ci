name: Codex HIA original Windows core fixture

on:
  push:
    branches:
      - codex/hia-core-fixture-terminalization-20261127-2ac5
      - codex/hia-native-integration-20261127-2ac5
    paths:
      - codex-rs/core/**
      - .github/workflows/codex-hia-windows-core-fixture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-core-fixture:
    name: Original Windows core unit tests
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-test
      - name: Run the complete original core unit suite
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            --remote-download-toplevel \
            -- \
            test \
            --platforms=//:windows_x86_64_msvc \
            --nocache_test_results \
            --test_verbose_timeout_warnings \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            //codex-rs/core:core-unit-tests 2>&1 | tee "$RUNNER_TEMP/windows-core-original.log"
          if grep -Eq 'FLAKY|test result: FAILED|Attempt #([2-9][0-9]*|1[0-9]+)' "$RUNNER_TEMP/windows-core-original.log"; then
            echo "::error::Original core suite had a failed or retried attempt."
            exit 1
          fi
          grep -Eq '^//codex-rs/core:core-unit-tests[[:space:]]+PASSED in ' "$RUNNER_TEMP/windows-core-original.log"
          echo "Original core suite: PASS, retries=0, flaky=0"
      - name: Preserve Bazel execution evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-core-original-tests
          path: |
            ${{ runner.temp }}/bazel-execution-logs
            ${{ runner.temp }}/windows-core-original.log
          if-no-files-found: warn
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
