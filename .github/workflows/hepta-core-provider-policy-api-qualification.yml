name: Hepta Core Provider Policy API Conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codex-rs/core/src/client_provider_policy_tests.rs'
      - 'codex-rs/core/src/client.rs'
      - 'codex-rs/hepta-intelligence/src/evaluated_shadow_tests.rs'
      - 'codex-rs/hepta-intelligence/src/evaluated_shadow_segment_tests.rs'
      - '.github/workflows/hepta-core-provider-policy-api-qualification.yml'

permissions:
  contents: read

jobs:
  provider-terminal-policy:
    name: Provider policy terminal tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install exact CI Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Verify canonical Rust formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Compile and execute real terminal acknowledgement tests
        run: cargo +1.95.0 test --locked -p codex-core --lib client_provider_policy_tests -- --nocapture

  windows-durable-ledger:
    name: Windows authenticated Ledger rotation/replay
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install exact CI Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Verify canonical Rust formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Exercise real locked ledger and authenticated shadow tests on Windows
        run: |
          cargo +1.95.0 test --locked -p codex-hepta-intelligence --lib 'evaluated_shadow::tests::' -- --nocapture
