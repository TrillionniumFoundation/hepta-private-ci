name: Hepta Lane G sandbox hardening

on:
  pull_request:
    paths:
      - tools/hepta-engineering-control/**
      - docs/modules/control.engineering/**
      - .github/workflows/hepta-lane-g-engineering.yml
      - .github/workflows/hepta-lane-g-sandbox-hardening.yml
  push:
    branches:
      - codex/lane-g-final-sandbox-v3-20260910
      - integration/lane-g-final-single-parent-v3-20260910
    paths:
      - tools/hepta-engineering-control/**
      - docs/modules/control.engineering/**
      - .github/workflows/hepta-lane-g-engineering.yml
      - .github/workflows/hepta-lane-g-sandbox-hardening.yml

permissions:
  contents: read

concurrency:
  group: lane-g-sandbox-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-fixture-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head and direct-parent topology
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${EXPECTED}"
          git rev-parse HEAD HEAD^{tree}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            read -r HEAD_SHA PARENT EXTRA <<EOF
          $(git rev-list --parents -n 1 HEAD)
          EOF
            test "${HEAD_SHA}" = "${EXPECTED}"
            test "${PARENT}" = "${{ github.event.pull_request.base.sha }}"
            test -z "${EXTRA:-}"
          fi

      - name: Execute portable archive and fixture regressions
        working-directory: tools/hepta-engineering-control
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/lane-g-pycache
        run: |
          set -euo pipefail
          python -m py_compile \
            control_engineering_v2/candidate.py \
            test_candidate_sandbox_hardening.py
          python -m unittest -v \
            test_candidate_sandbox_hardening.CandidateSandboxFixture

      - name: Verify source remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  strong-linux-isolation:
    strategy:
      fail-fast: false
      matrix:
        mode: [exact-head, ordered-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ matrix.mode == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || (github.event.pull_request.merge_commit_sha || github.sha) }}

      - name: Bind exact head or ordered merge
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = "exact-head" ]; then
            EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
            test "$(git rev-parse HEAD)" = "${EXPECTED}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              read -r HEAD_SHA PARENT EXTRA <<EOF
          $(git rev-list --parents -n 1 HEAD)
          EOF
              test "${HEAD_SHA}" = "${EXPECTED}"
              test "${PARENT}" = "${{ github.event.pull_request.base.sha }}"
              test -z "${EXTRA:-}"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            EXPECTED="${{ github.event.pull_request.merge_commit_sha }}"
            test -n "${EXPECTED}"
            test "$(git rev-parse HEAD)" = "${EXPECTED}"
            read -r MERGE_SHA FIRST SECOND EXTRA <<EOF
          $(git rev-list --parents -n 1 HEAD)
          EOF
            test "${MERGE_SHA}" = "${EXPECTED}"
            test "${FIRST}" = "${{ github.event.pull_request.base.sha }}"
            test "${SECOND}" = "${{ github.event.pull_request.head.sha }}"
            test -z "${EXTRA:-}"
          fi
          git rev-parse HEAD HEAD^{tree}

      - name: Admit strong Linux sandbox adapter
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
          bwrap --version
          bwrap \
            --die-with-parent \
            --new-session \
            --unshare-all \
            --ro-bind /usr /usr \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --dir /workspace \
            --chdir /workspace \
            -- /usr/bin/true

      - name: Execute strong isolation regressions
        working-directory: tools/hepta-engineering-control
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/lane-g-pycache
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_candidate_sandbox_hardening.CandidateSandboxStrongIsolation

      - name: Verify source remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
