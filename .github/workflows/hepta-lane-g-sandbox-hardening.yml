name: Hepta Lane G sandbox hardening

on:
  pull_request:
    paths:
      - tools/hepta-engineering-control/**
      - docs/modules/control.engineering/**
      - .github/workflows/hepta-lane-g-engineering.yml
      - .github/workflows/hepta-lane-g-sandbox-hardening.yml
      - tools/hepta-engineering-control/lane_g_materialize_ordered_merge.sh
  push:
    branches:
      - codex/lane-g-final-sandbox-v4-20260910
    paths:
      - tools/hepta-engineering-control/**
      - docs/modules/control.engineering/**
      - .github/workflows/hepta-lane-g-engineering.yml
      - .github/workflows/hepta-lane-g-sandbox-hardening.yml
      - tools/hepta-engineering-control/lane_g_materialize_ordered_merge.sh

permissions:
  contents: read

concurrency:
  group: lane-g-sandbox-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-fixture-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head and direct-parent topology
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${EXPECTED}"
          git rev-parse HEAD HEAD^{tree}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            read -r HEAD_SHA PARENT EXTRA <<< "$(git rev-list --parents -n 1 HEAD)"
            test "${HEAD_SHA}" = "${EXPECTED}"
            test "${PARENT}" = "${{ github.event.pull_request.base.sha }}"
            test -z "${EXTRA:-}"
          fi

      - name: Compile hardened Lane G candidate boundary
        working-directory: tools/hepta-engineering-control
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/lane-g-pycache
        run: |
          set -euo pipefail
          python -m py_compile \
            control_engineering_v2/candidate.py \
            test_candidate_sandbox_hardening.py

      - name: Execute portable exact-tree and fixture regressions
        working-directory: tools/hepta-engineering-control
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/lane-g-pycache
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_candidate_sandbox_hardening.CandidateSandboxFixture

      - name: Verify source remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  strong-linux-exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head and direct-parent topology
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${EXPECTED}"
          git rev-parse HEAD HEAD^{tree}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            read -r HEAD_SHA PARENT EXTRA <<< "$(git rev-list --parents -n 1 HEAD)"
            test "${HEAD_SHA}" = "${EXPECTED}"
            test "${PARENT}" = "${{ github.event.pull_request.base.sha }}"
            test -z "${EXTRA:-}"
          fi

      - name: Install the declared Linux isolation adapter
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
          command -v bwrap
          bwrap --version

      - name: Execute strong admission and escape regressions
        working-directory: tools/hepta-engineering-control
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/lane-g-pycache
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_candidate_sandbox_hardening.CandidateSandboxStrongIsolation

      - name: Verify source remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  # github.event.pull_request.merge_commit_sha is deliberately not trusted;
  # this job constructs and verifies its own ordered merge object.
  strong-linux-ordered-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout immutable head for deterministic merge construction
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Construct and bind ordered prospective merge
        shell: bash
        run: |
          set -euo pipefail
          tools/hepta-engineering-control/lane_g_materialize_ordered_merge.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Install the declared Linux isolation adapter
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
          command -v bwrap
          bwrap --version

      - name: Execute strong admission and escape regressions
        working-directory: tools/hepta-engineering-control
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/lane-g-pycache
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_candidate_sandbox_hardening.CandidateSandboxStrongIsolation

      - name: Verify merge subject remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
