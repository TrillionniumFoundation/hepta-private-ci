name: Hepta E12 learned continuation field synthetic research (DENY_ALL)
on:
  pull_request:
    paths:
      - 'qualification/shared-stem-system2-architecture/e12_continuation_*.py'
      - 'qualification/shared-stem-system2-architecture/test_e12_continuation_*.py'
      - 'qualification/shared-stem-system2-architecture/E12_LEARNED_CONTINUATION_FIELD_20261016.md'
      - '.github/workflows/hepta-e12-learned-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source_profile: [source_head, synthetic_merge]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: qualification/shared-stem-system2-architecture
      ROOT: qualification/shared-stem-system2-architecture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_profile == 'source_head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact HEAD, source and mathematical originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/e12-continuation-train
          git rev-parse HEAD > /tmp/e12-continuation-train/source-head.txt
          if [[ '${{ matrix.source_profile }}' == 'source_head' && '${{ github.event_name }}' == 'pull_request' ]]; then
            test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          fi
          for f in e12_nonlinear_cert.py e12_independent_audit.py e12_local_cell_solver.py e12_continuation_field.py e12_continuation_study.py; do
            test -s "$ROOT/$f"
          done
          sha256sum "$ROOT"/e12_*.py "$ROOT"/test_e12_*.py > /tmp/e12-continuation-train/exact-source-hashes.txt
      - name: Execute original E12 plus full Cell and new learned field adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -W error::ResourceWarning -m unittest discover -s "$ROOT" -p 'test_e12_*.py' -v > /tmp/e12-continuation-train/normal.log 2>&1 || { cat /tmp/e12-continuation-train/normal.log; exit 1; }
          tail -10 /tmp/e12-continuation-train/normal.log
          grep -Eq '^Ran ([8-9][0-9]|[1-9][0-9][0-9]) tests' /tmp/e12-continuation-train/normal.log
      - name: Re-run complete named suite in optimized mode with assertions disabled
        shell: bash
        run: |
          set -euo pipefail
          python -O -W error::ResourceWarning -m unittest discover -s "$ROOT" -p 'test_e12_*.py' -v > /tmp/e12-continuation-train/optimized.log 2>&1 || { cat /tmp/e12-continuation-train/optimized.log; exit 1; }
          tail -10 /tmp/e12-continuation-train/optimized.log
          grep -Eq '^Ran ([8-9][0-9]|[1-9][0-9][0-9]) tests' /tmp/e12-continuation-train/optimized.log
      - name: Fit three actual train-only controls, never opening held solution labels
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/e12_continuation_study.py" train --output /tmp/e12-continuation-train/train.json | tee /tmp/e12-continuation-train/producer.log
          sha256sum /tmp/e12-continuation-train/train.json > /tmp/e12-continuation-train/train.sha256
      - name: Preserve original train-only source receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e12-continuation-train-${{ matrix.source_profile }}
          path: /tmp/e12-continuation-train/
          retention-days: 14
          if-no-files-found: warn
  blind-proposer:
    needs: train-source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source_profile: [source_head, synthetic_merge]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: qualification/shared-stem-system2-architecture
      ROOT: qualification/shared-stem-system2-architecture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_profile == 'source_head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: e12-continuation-train-${{ matrix.source_profile }}
          path: /tmp/e12-continuation-train
      - name: Bind frozen source and emit original held-case model-free starts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat /tmp/e12-continuation-train/source-head.txt)"
          cd /tmp/e12-continuation-train
          sha256sum --check train.sha256
          mkdir -p /tmp/e12-continuation-blind
          cp source-head.txt /tmp/e12-continuation-blind/source-head.txt
          TRAIN_SHA="$(cut -d' ' -f1 train.sha256)"
          cd "$GITHUB_WORKSPACE"
          python "$ROOT/e12_continuation_study.py" blind --train /tmp/e12-continuation-train/train.json --train-sha256 "$TRAIN_SHA" --output /tmp/e12-continuation-blind/blind.json | tee /tmp/e12-continuation-blind/proposer.log
          sha256sum /tmp/e12-continuation-blind/blind.json > /tmp/e12-continuation-blind/blind.sha256
      - name: Publish label-blind sealed numerical predictions only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e12-continuation-blind-${{ matrix.source_profile }}
          path: /tmp/e12-continuation-blind/
          retention-days: 14
          if-no-files-found: warn
  independent-score:
    needs: blind-proposer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source_profile: [source_head, synthetic_merge]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: qualification/shared-stem-system2-architecture
      ROOT: qualification/shared-stem-system2-architecture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_profile == 'source_head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: e12-continuation-train-${{ matrix.source_profile }}
          path: /tmp/e12-continuation-train
      - uses: actions/download-artifact@v4
        with:
          name: e12-continuation-blind-${{ matrix.source_profile }}
          path: /tmp/e12-continuation-blind
      - name: Independently reopen ALL source and train/blind SHA before held solutions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/e12-continuation-score
          test "$(git rev-parse HEAD)" = "$(cat /tmp/e12-continuation-train/source-head.txt)"
          test "$(git rev-parse HEAD)" = "$(cat /tmp/e12-continuation-blind/source-head.txt)"
          (cd /tmp/e12-continuation-train && sha256sum --check train.sha256)
          (cd /tmp/e12-continuation-blind && sha256sum --check blind.sha256)
          TRAIN_SHA="$(cut -d' ' -f1 /tmp/e12-continuation-train/train.sha256)"
          BLIND_SHA="$(cut -d' ' -f1 /tmp/e12-continuation-blind/blind.sha256)"
          python "$ROOT/e12_continuation_study.py" score --train /tmp/e12-continuation-train/train.json --train-sha256 "$TRAIN_SHA" --blind /tmp/e12-continuation-blind/blind.json --blind-sha256 "$BLIND_SHA" --output /tmp/e12-continuation-score/independent.json | tee /tmp/e12-continuation-score/reviewer.log
          sha256sum /tmp/e12-continuation-score/independent.json > /tmp/e12-continuation-score/reviewer.sha256
          python - <<'PY'
          import json
          doc=json.load(open('/tmp/e12-continuation-score/independent.json',encoding='utf-8'))
          if not (doc['all_e12_discrete_global_certificates_replayed'] is True and
                  doc['cases_per_arm']==60 and
                  doc['cost_adjusted_online_reasoning_gain_qualified'] is False and
                  doc['production_accepted'] is False and
                  doc['authority']=='DENY_ALL'):
              raise SystemExit('scientific/control admission false')
          for name, item in doc['summary'].items():
              print(name, 'cell_updates',item['cell_updates'],
                    'inclusive_cpu_ns',item['inclusive_cpu_ns'],
                    'whole_panel_cpu_ns',item['one_panel_training_plus_inference_cpu_ns'])
          PY
      - name: Preserve evidence and failures, never authorize selection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e12-continuation-score-${{ matrix.source_profile }}
          path: /tmp/e12-continuation-score/
          retention-days: 14
          if-no-files-found: warn
