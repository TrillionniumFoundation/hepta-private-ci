name: Kernel authority one-shot repair

on:
  push:
    branches:
      - work/kernel-authority-convergence-20260925
    paths:
      - '.github/workflows/kernel-authority-one-shot-repair.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-authority-one-shot-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: work/kernel-authority-convergence-20260925
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned formatting toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Repair runtime, recovery fixtures and closed-world inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> tuple[Path, str]:
              file = Path(path)
              return file, file.read_text(encoding='utf-8')

          def write_if_changed(file: Path, before: str, after: str) -> None:
              if after != before:
                  file.write_text(after, encoding='utf-8')

          # Production trust evidence validation: use the canonical slice helper
          # rather than two clippy-rejected manual membership scans.
          file, text = read('codex-rs/hepta-contracts/src/authority_trust.rs')
          old = 'digests.iter().any(|digest| *digest == [0; 32])'
          count = text.count(old)
          if count:
              if count != 2:
                  raise SystemExit(f'unexpected zero-digest validation count: {count}')
              updated = text.replace(old, 'digests.contains(&[0; 32])')
          else:
              updated = text
              if updated.count('digests.contains(&[0; 32])') < 2:
                  raise SystemExit('production trust digest validation has an unexpected shape')
          write_if_changed(file, text, updated)

          # The key ring is moved into the production owner and is not reused.
          file, text = read('codex-rs/hepta-contracts/src/authority_trust_tests.rs')
          old = '''        issuer_keys.clone(),
                  &verified_head,'''
          new = '''        issuer_keys,
                  &verified_head,'''
          if old in text:
              updated = text.replace(old, new, 1)
          elif new in text:
              updated = text
          else:
              raise SystemExit('issuer key-ring ownership test has an unexpected shape')
          write_if_changed(file, text, updated)

          # Recovery may finish an already-durable pending transition, but it
          # must never manufacture a committed head from an arbitrary restored
          # snapshot merely because the caller presents the current head.
          file, text = read('codex-rs/hepta-contracts/src/final_use.rs')
          old_comment = '''    /// Recover existing state only after exact external-frontier verification.
              /// The authenticated `head` may complete a frontier-first pending or commit
              /// transition, but it can never move the trusted frontier itself.'''
          new_comment = '''    /// Recover existing state only after exact external-frontier verification.
              /// The authenticated `head` may complete only a transition represented by
              /// the durable pending marker or its exact trusted frontier. It cannot
              /// manufacture a committed head from an arbitrary restored snapshot and it
              /// can never move the trusted frontier itself.'''
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)
          elif new_comment not in text:
              raise SystemExit('final-use recovery contract comment has an unexpected shape')

          unsafe_commit_synthesis = '''
              if head_advances(&state.head, authenticated_head) {
                  let mut committed = state.clone();
                  if authenticated_head.authority_epoch > committed.head.authority_epoch {
                      committed.used_nonces.clear();
                  }
                  committed.head = authenticated_head.clone();
                  committed.pending_revocations = None;
                  if frontier_for_state(&committed) == trusted {
                      store.persist(&committed)?;
                      *state = committed;
                      return Ok(());
                  }
              }
          '''
          if unsafe_commit_synthesis in text:
              text = text.replace(unsafe_commit_synthesis, '\n', 1)
          elif 'committed.head = authenticated_head.clone();' in text:
              raise SystemExit('unrecognized restored-snapshot commit synthesis remains')
          write_if_changed(file, file.read_text(encoding='utf-8'), text)

          # A v1 migration fixture must remove every post-v1 object in reverse
          # dependency order. The timer drain trigger references the v2 outcome
          # table and therefore has to be removed before that table is dropped.
          file, text = read('codex-rs/hepta-automation/tests/automation.rs')
          anchor = '''    let mut rewind = pool.begin().await.expect("begin legacy schema rewind");
              sqlx::query("DROP INDEX automation_dispatch_outcome_state_idx")'''
          replacement = '''    let mut rewind = pool.begin().await.expect("begin legacy schema rewind");
              sqlx::query("DROP TRIGGER IF EXISTS automation_timer_lifecycle_drain")
                  .execute(&mut *rewind)
                  .await
                  .expect("drop timer lifecycle drain trigger");
              sqlx::query("DROP INDEX automation_dispatch_outcome_state_idx")'''
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif 'drop timer lifecycle drain trigger' not in text:
              raise SystemExit('automation v1 rewind prelude has an unexpected shape')

          anchor = '''        "DROP TRIGGER IF EXISTS automation_runs_schedule_revision_no_update",
                  "DROP TRIGGER IF EXISTS automation_task_default_policy",'''
          replacement = '''        "DROP TRIGGER IF EXISTS automation_runs_schedule_revision_no_update",
                  "DROP TABLE IF EXISTS automation_timer_lifecycle",
                  "DROP TRIGGER IF EXISTS automation_task_default_policy",'''
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif '"DROP TABLE IF EXISTS automation_timer_lifecycle"' not in text:
              raise SystemExit('automation v1 rewind object list has an unexpected shape')
          write_if_changed(file, file.read_text(encoding='utf-8'), text)

          # The recovery pilot deliberately asks the descriptor-bound recovery
          # path to establish immutable identities. Make the fixture satisfy the
          # production profile before closing the original owner.
          file, text = read('codex-rs/hepta-agentd/tests/cognitive_store_product_writer.rs')
          import_anchor = 'use std::fs;\nuse std::sync::Arc;'
          import_replacement = 'use std::fs;\nuse std::os::unix::fs::PermissionsExt;\nuse std::sync::Arc;'
          if import_anchor in text:
              text = text.replace(import_anchor, import_replacement, 1)
          elif 'use std::os::unix::fs::PermissionsExt;' not in text:
              raise SystemExit('agentd recovery test imports have an unexpected shape')

          anchor = '''    let store = DurableCognitiveStore::open(&config.identity().layout).await?;
              let expected = store.recovery_anchor().await?;
              drop(store);'''
          replacement = '''    let store = DurableCognitiveStore::open(&config.identity().layout).await?;
              let expected = store.recovery_anchor().await?;
              let database_path = store.path().to_path_buf();
              let cognitive_root = config.identity().layout.cognitive_root().to_path_buf();
              drop(store);
              fs::set_permissions(&cognitive_root, fs::Permissions::from_mode(0o700))?;
              fs::set_permissions(&database_path, fs::Permissions::from_mode(0o600))?;
              for suffix in ["-wal", "-shm", "-journal"] {
                  let mut sidecar = database_path.as_os_str().to_os_string();
                  sidecar.push(suffix);
                  let sidecar = std::path::PathBuf::from(sidecar);
                  if sidecar.exists() {
                      fs::set_permissions(sidecar, fs::Permissions::from_mode(0o600))?;
                  }
              }'''
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif 'let database_path = store.path().to_path_buf();' not in text:
              raise SystemExit('agentd recovery fixture has an unexpected shape')
          write_if_changed(file, file.read_text(encoding='utf-8'), text)

          # The production dispatch binder is the sole expected internal caller
          # of raw lease verification. Record the exact closed-world callsite.
          file, text = read('CALLERS.toml')
          old = '''[[boundary]]
              id = "authority_lease_verify_use"
              symbol = "AuthorityLeaseVerifier::verify_use"
              call_pattern = '\\.\\s*verify_use\\s*\\('
              caller_type_marker = "AuthorityLeaseVerifier"
              definition_path = "codex-rs/hepta-contracts/src/authority_lease.rs"
              definition_markers = ["pub struct AuthorityLeaseVerifier", "pub fn verify_use(", "LeaseVerifiedUseToken"]
              product_callers = []
              caller_markers = []'''
          new = '''[[boundary]]
              id = "authority_lease_verify_use"
              symbol = "AuthorityLeaseVerifier::verify_use"
              call_pattern = '\\.\\s*verify_use\\s*\\('
              caller_type_marker = "AuthorityLeaseVerifier"
              definition_path = "codex-rs/hepta-contracts/src/authority_lease.rs"
              definition_markers = ["pub struct AuthorityLeaseVerifier", "pub fn verify_use(", "LeaseVerifiedUseToken"]
              product_callers = ["codex-rs/hepta-contracts/src/authority_trust.rs"]
              caller_markers = ["AuthorityLeaseVerifier", "self.verify_use(", "AuthorityDispatchBinding"]'''
          if old in text:
              updated = text.replace(old, new, 1)
          elif new in text:
              updated = text
          else:
              raise SystemExit('authority_lease_verify_use inventory has an unexpected shape')
          write_if_changed(file, text, updated)
          PY
          (
            cd codex-rs
            cargo +1.95.0 fmt --all
          )
          git diff --check

      - name: Commit and push exact source repair
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kernel-authority-repair[bot]'
          git config user.email 'kernel-authority-repair[bot]@users.noreply.github.com'
          git add \
            CALLERS.toml \
            codex-rs/hepta-contracts \
            codex-rs/hepta-automation/tests/automation.rs \
            codex-rs/hepta-agentd/tests/cognitive_store_product_writer.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(kernel-authority): close recovery and qualification gaps'
            git push origin HEAD:work/kernel-authority-convergence-20260925
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Rebind source observations and regenerate canonical status
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-implementation-maps.py migrate \
            --module automation.taskflow \
            --module cognitive.read \
            --module control.engineering \
            --module intelligence.control \
            --module kernel.authority \
            --module kernel.operations \
            --module knowledge.graph \
            --module learning.artifacts \
            --module learning.ledger \
            --module learning.operator \
            --module learning.plasticity \
            --module memory.federation \
            --module memory.retrieval \
            --module objective.compiler \
            --module platform.types \
            --module prompt.registry \
            --module runtime.agentd \
            --module runtime.fleet \
            --module runtime.supervisor \
            --module utility.ndu
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('qualification/kernel-authority/status_manifest.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          value['sourceAnchor'] = {
              'commit': os.environ['SOURCE_COMMIT'],
              'tree': os.environ['SOURCE_TREE'],
          }
          path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python3 scripts/kernel_authority_status.py write
          python3 scripts/hepta-implementation-maps.py sync-plasticity-status
          rm .github/workflows/kernel-authority-one-shot-repair.yml
          git diff --check

      - name: Commit projections at the immutable source anchor
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'projection repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'docs(kernel-authority): regenerate candidate-bound truth'

      - name: Verify governance and the three previously failing regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kernel_authority_status.py check
          python3 qualification/kernel-authority/generate_status.py --check
          python3 scripts/verify_hepta_callers.py
          python3 scripts/hepta-implementation-maps.py verify \
            --expected-sha "$(git rev-parse HEAD)" \
            --expected-tree "$(git rev-parse 'HEAD^{tree}')"
          git diff --check
          test -z "$(git status --porcelain)"
          (
            cd codex-rs
            cargo +1.95.0 fmt --all -- --check
            cargo +1.95.0 test --package codex-hepta-contracts --locked
            cargo +1.95.0 clippy --package codex-hepta-contracts --all-targets --locked -- -D warnings
            cargo +1.95.0 test --package codex-hepta-automation --test automation --locked \
              v1_store_migrates_atomically_to_dispatch_outcome_schema -- --exact
            cargo +1.95.0 test --package codex-hepta-agentd --test cognitive_store_product_writer --locked \
              agentd_product_host_recovers_exact_cut_into_fenced_writer_generation -- --exact
          )

      - name: Push repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:work/kernel-authority-convergence-20260925

      - name: Dispatch candidate-bound qualification workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in \
            rust-ci.yml \
            kernel-authority-convergence.yml \
            kernel-authority-production-closure.yml \
            kernel-authority-status.yml
          do
            response="$(mktemp)"
            code="$(curl --silent --show-error --location \
              --output "$response" --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --data '{"ref":"work/kernel-authority-convergence-20260925"}')"
            if [ "$code" != '204' ]; then
              echo "workflow dispatch failed for ${workflow}: HTTP ${code}" >&2
              cat "$response" >&2
              exit 1
            fi
          done
