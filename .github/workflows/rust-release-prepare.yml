name: rust-release-prepare
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    timeout-minutes: 30
    # Prevent scheduled runs on forks (no secrets, wastes Actions minutes)
    if: vars.ENABLE_UPSTREAM_AUTOMATION == 'true' && github.repository == 'TrillionniumFoundation/hepta-private-ci'
    environment:
      name: rust-release-prepare
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Update models.json
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          client_version="99.99.99"
          terminal_info="github-actions"
          user_agent="codex_cli_rs/99.99.99 (Linux $(uname -r); $(uname -m)) ${terminal_info}"
          base_url="${OPENAI_BASE_URL:-https://chatgpt.com/backend-api/codex}"

          headers=(
            -H "Authorization: Bearer ${OPENAI_API_KEY}"
            -H "User-Agent: ${user_agent}"
          )

          url="${base_url%/}/models?client_version=${client_version}"
          curl --http1.1 --fail --show-error --location "${headers[@]}" "${url}" | jq '.' > codex-rs/models-manager/models.json

      - name: Export models change for review
        id: export
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["GITHUB_WORKSPACE"])
          relative = "codex-rs/models-manager/models.json"

          def git(*args):
              return subprocess.check_output(["git", "--no-replace-objects", *args], cwd=root)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def git_blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          before = git("show", "HEAD:" + relative)
          after = (root / relative).read_bytes()
          json.loads(after)
          changed_paths = git("diff", "--name-only", "--no-ext-diff", "--no-textconv").decode().splitlines()
          assert set(changed_paths) <= {relative}, changed_paths
          changed = before != after
          patch = git("diff", "--binary", "--no-ext-diff", "--no-textconv", "HEAD", "--", relative)
          assert bool(patch) == changed
          if changed:
              output = Path(os.environ["RUNNER_TEMP"]) / "models-json-review"
              output.mkdir(exist_ok=False)
              (output / "models.json").write_bytes(after)
              (output / "models-json.patch").write_bytes(patch)
              receipt = {
                  "schema": 1,
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "checked_out_commit": git("rev-parse", "HEAD").decode().strip(),
                  "checked_out_tree": git("rev-parse", "HEAD^{tree}").decode().strip(),
                  "workflow_sha": os.environ.get("GITHUB_WORKFLOW_SHA"),
                  "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
                  "event_name": os.environ["GITHUB_EVENT_NAME"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "path": relative,
                  "before_git_blob": git_blob(before),
                  "after_git_blob": git_blob(after),
                  "before_sha256": sha256(before),
                  "after_sha256": sha256(after),
                  "patch_sha256": sha256(patch),
                  "scope": "models-metadata-change-for-review",
                  "branch_write_performed": False,
                  "pull_request_created": False,
                  "native_tests_run": False,
                  "production_qualification": False,
              }
              (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
              print("Exported the models metadata change for review.")
          else:
              print("No models metadata change.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("changed=" + str(changed).lower() + "\n")
          PY

      - name: Upload models review artifact
        if: steps.export.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: models-json-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/models-json-review
          if-no-files-found: error
          retention-days: 7
