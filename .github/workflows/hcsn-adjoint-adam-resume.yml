name: HCSN four-amplitude Adam restoration
on:
  pull_request:
    paths:
      - qualification/hcsn_adjoint_adam_resume/**
      - qualification/hcsn_adjoint_torch/torch_flow.py
      - qualification/hcsn_initial_adjoint/solver.py
      - qualification/hcsn_joint_dde/model.py
      - qualification/hcsn_boundary_audit/refractory_transport.py
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - qualification/hcsn_graded/model.py
      - qualification/hcsn_graded/spatial.py
      - .github/workflows/hcsn-adjoint-adam-resume.yml
permissions:
  contents: read
jobs:
  adam-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Bind exact independently frozen protocol source
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          package=Path('qualification/hcsn_adjoint_adam_resume')
          request=json.loads((package/'REQUEST.json').read_text())
          inventory=json.loads((package/'SOURCE.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['CANDIDATE_COMMIT']
          hashes={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in request['source_paths']}
          assert hashes==inventory['source_sha256']
          source=dict(source_commit=head,request_identity=request['identity'],source_sha256=hashes,prefrozen_inventory_sha256=hashlib.sha256((package/'SOURCE.json').read_bytes()).hexdigest())
          Path(os.environ['RUNNER_TEMP'],'adam-resume-source.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          print(json.dumps(source,sort_keys=True))
          PY
      - name: Execute one bounded fresh-process protocol and retain total process cost
        run: |
          python - <<'PY'
          import json, os, resource, subprocess, sys, time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'adam-resume'
          root.mkdir()
          command=[sys.executable,'-B','-m','qualification.hcsn_adjoint_adam_resume.native_probe','--source',str(Path(os.environ['RUNNER_TEMP'])/'adam-resume-source.json'),'--baseline','qualification/hcsn_initial_vjp/evidence/NUMPY001-ORIGINALS.tar.gz','--output',str(root/'protocol')]
          wall,cpu=time.perf_counter(),time.process_time()
          before=resource.getrusage(resource.RUSAGE_CHILDREN)
          with (root/'controller.stdout').open('wb') as stdout,(root/'controller.stderr').open('wb') as stderr:
              result=subprocess.run(command,stdout=stdout,stderr=stderr)
          after=resource.getrusage(resource.RUSAGE_CHILDREN)
          cost=dict(source_commit=os.environ['CANDIDATE_COMMIT'],exit_code=result.returncode,full_child_tree_wall_seconds=time.perf_counter()-wall,full_child_tree_cpu_seconds=(after.ru_utime+after.ru_stime)-(before.ru_utime+before.ru_stime),wrapper_cpu_seconds=time.process_time()-cpu,reported_child_tree_max_rss_kib=after.ru_maxrss,includes_imports_and_all_fresh_actors=True,maximum_adam_updates=9,maximum_forwards=13,maximum_adjoints=13)
          (root/'WRAPPER-COST.json').write_text(json.dumps(cost,indent=2,sort_keys=True)+'\n')
          print((root/'controller.stdout').read_text())
          print((root/'controller.stderr').read_text(),file=sys.stderr)
          print(json.dumps(cost,sort_keys=True))
          raise SystemExit(result.returncode)
          PY
      - run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: four-amplitude-adam-resume-originals
          path: |
            ${{ runner.temp }}/adam-resume
            ${{ runner.temp }}/adam-resume-source.json
          if-no-files-found: error
