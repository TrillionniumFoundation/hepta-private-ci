name: Hepta memory retrieval native core kit
on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
    paths: [.github/workflows/hepta-memory-retrieval-native-kit.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: memory-retrieval-native-kit-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  core:
    runs-on: ubuntu-slim
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Bind immutable input and run actual core package tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retrieval-kit"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -p HEAD > "$RUNNER_TEMP/retrieval-kit/commit.txt"
          rustc -Vv > "$RUNNER_TEMP/retrieval-kit/rustc.txt"
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/retrieval-kit/core-tests.json" --minimum-tests 1 --timeout-seconds 1500 -- just test --locked -p codex-hepta-memory-retrieval -p codex-hepta-learning-ledger
      - name: Preserve reusable native tools and downloaded dependency sources
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/retrieval-kit"
          mkdir -p "$kit"
          toolchain="$(rustup which --toolchain 1.95.0 rustc)"
          toolchain="$(dirname "$(dirname "$toolchain")")"
          tar -C "$toolchain" -czf "$kit/toolchain.tar.gz" bin lib
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          paths=()
          for entry in registry git; do
            if test -d "$cargo_home/$entry"; then paths+=("$entry"); fi
          done
          if test "${#paths[@]}" -gt 0; then
            tar -C "$cargo_home" -czf "$kit/dependency-sources.tar.gz" "${paths[@]}"
          fi
          mkdir -p "$kit/test-tools"
          cp "$(command -v just)" "$(command -v cargo-nextest)" "$kit/test-tools/"
          (cd "$kit"; sha256sum *.tar.gz test-tools/* > SHA256SUMS)
          printf '%s\n' 'Tools and dependency bytes only. Tests apply solely to commit.txt; no target-host or independent acceptance claim.' > "$kit/CLAIM_BOUNDARY.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retrieval-native-kit-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-kit/
          retention-days: 7
          if-no-files-found: error
