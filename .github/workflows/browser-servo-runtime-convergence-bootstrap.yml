name: Browser Servo runtime convergence bootstrap

on:
  push:
    branches:
      - codex/browser-servo-convergence-20260925
    paths:
      - tools/apply_browser_servo_runtime_convergence.py
      - .github/workflows/browser-servo-runtime-convergence-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: browser-servo-runtime-convergence-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/browser-servo-convergence-20260925
          fetch-depth: 0
      - name: Apply convergence transform
        run: python3 tools/apply_browser_servo_runtime_convergence.py
      - name: Verify JavaScript syntax
        run: |
          node --check apps/hepta-browser/src/journal.js
          node --check apps/hepta-browser/src/runtime-host.js
          node --check apps/hepta-browser/src/worker-driver.js
      - name: Run Browser source regressions
        run: node --test apps/hepta-browser/test/*.test.js
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Commit verified runtime convergence
        run: |
          git rm tools/apply_browser_servo_runtime_convergence.py
          git rm .github/workflows/browser-servo-runtime-convergence-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/hepta-browser
          git commit -m "browser.servo: converge durable runtime and physical leases [skip ci]"
          git push origin HEAD:codex/browser-servo-convergence-20260925
