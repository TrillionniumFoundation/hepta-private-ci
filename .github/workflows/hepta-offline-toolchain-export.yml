name: Hepta offline build inputs (diagnostic only)
on:
  push:
    branches: [work/hepta-blocker-closure-20260915]
    paths: [.github/workflows/hepta-offline-toolchain-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve pinned Bazel inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bazel-inputs/bin" "$RUNNER_TEMP/bazel-inputs/cache"
          version="$(cat .bazelversion)"
          curl --fail --location --retry 3 "https://github.com/bazelbuild/bazel/releases/download/${version}/bazel-${version}-linux-x86_64" -o "$RUNNER_TEMP/bazel-inputs/bin/bazel"
          curl --fail --location --retry 3 "https://github.com/bazelbuild/bazel/releases/download/${version}/bazel-${version}-linux-x86_64.sha256" -o "$RUNNER_TEMP/bazel-inputs/bin/bazel.sha256"
          expected="$(cut -d ' ' -f1 "$RUNNER_TEMP/bazel-inputs/bin/bazel.sha256")"
          echo "$expected  $RUNNER_TEMP/bazel-inputs/bin/bazel" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bazel-inputs/bin/bazel"
          "$RUNNER_TEMP/bazel-inputs/bin/bazel" --batch mod deps --lockfile_mode=update --repository_cache="$RUNNER_TEMP/bazel-inputs/cache" 2>&1 | tee "$RUNNER_TEMP/bazel-inputs/resolver.log"
      - name: Package public resolver artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/bazel-inputs/identity.txt"
          cp MODULE.bazel.lock "$RUNNER_TEMP/bazel-inputs/baseline.MODULE.bazel.lock"
          tar -C "$RUNNER_TEMP/bazel-inputs" -czf "$RUNNER_TEMP/bazel-tools.tar.gz" bin identity.txt baseline.MODULE.bazel.lock resolver.log
          tar -C "$RUNNER_TEMP/bazel-inputs" -czf "$RUNNER_TEMP/bazel-cache.tar.gz" cache
          split -b 240M -d "$RUNNER_TEMP/bazel-cache.tar.gz" "$RUNNER_TEMP/bazel-cache-part-"
          cd "$RUNNER_TEMP"
          sha256sum bazel-tools.tar.gz bazel-cache.tar.gz bazel-cache-part-* > bazel-SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-bazel-tools
          path: |
            ${{ runner.temp }}/bazel-tools.tar.gz
            ${{ runner.temp }}/bazel-SHA256SUMS
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-bazel-cache-00
          path: ${{ runner.temp }}/bazel-cache-part-00
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-bazel-cache-01
          path: ${{ runner.temp }}/bazel-cache-part-01
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-bazel-cache-02
          path: ${{ runner.temp }}/bazel-cache-part-02
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
