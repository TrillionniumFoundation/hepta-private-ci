name: Hepta offline build inputs (diagnostic only)
on:
  push:
    branches: [work/hepta-blocker-closure-20260915]
    paths: [.github/workflows/hepta-offline-toolchain-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Fetch exact formatter inputs and compatible test runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tool-export/bin"
          cp "$(command -v uv)" "$RUNNER_TEMP/tool-export/bin/uv"
          uv sync --frozen --project sdk/python --only-group format
          uv sync --frozen --project scripts --only-group format
          curl --fail --location --retry 3 'https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.144/cargo-nextest-0.9.144-x86_64-unknown-linux-gnu.tar.gz' -o "$RUNNER_TEMP/nextest.tar.gz"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/tool-export/bin"
          "$RUNNER_TEMP/tool-export/bin/cargo-nextest" nextest --version
          uv --version
          tar -C "$(uv cache dir)" -czf "$RUNNER_TEMP/tool-export/uv-cache.tar.gz" .
          tar -C "$RUNNER_TEMP/tool-export" -czf "$RUNNER_TEMP/offline-format-inputs.tar.gz" bin uv-cache.tar.gz
          sha256sum "$RUNNER_TEMP/offline-format-inputs.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: hepta-offline-format-inputs
          path: ${{ runner.temp }}/offline-format-inputs.tar.gz
          retention-days: 3
          compression-level: 0
