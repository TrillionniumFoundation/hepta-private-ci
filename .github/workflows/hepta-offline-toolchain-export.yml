name: Hepta offline build inputs (diagnostic only)
on:
  push:
    branches: [work/hepta-blocker-closure-20260915]
    paths: [.github/workflows/hepta-offline-toolchain-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the signed-distribution sandbox prerequisite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sandbox-inputs"
          cd "$RUNNER_TEMP/sandbox-inputs"
          apt-cache show --no-all-versions bubblewrap > apt-package-identity.txt
          apt-get download bubblewrap
          deb="$(find . -maxdepth 1 -name 'bubblewrap_*.deb' -print -quit)"
          expected="$(sed -n 's/^SHA256: //p' apt-package-identity.txt | head -1)"
          test -n "$expected"
          echo "$expected  $deb" | sha256sum --check
          dpkg-deb --extract "$deb" extracted
          mkdir bin
          cp extracted/usr/bin/bwrap bin/bwrap
          bin/bwrap --version > binary-version.txt
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD HEAD^{tree} > source-identity.txt
          sha256sum "$deb" bin/bwrap apt-package-identity.txt binary-version.txt source-identity.txt > SHA256SUMS
          rm -rf extracted
      - uses: actions/upload-artifact@v4
        with:
          name: hepta-native-sandbox-prerequisite
          path: ${{ runner.temp }}/sandbox-inputs
          retention-days: 3
          compression-level: 0
