name: hepta-publication-retry-check
on:
  push:
    branches: [dev/hepta-publication-retry-check-20261007]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: a48b99ec46995f70f50c173c9ab358d603c6d115
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact existing owner without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned native test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publication-observations"
          printf 'CARGO_HOME=%s/hepta-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/hepta-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --component rust-src
          export CARGO_HOME="$RUNNER_TEMP/hepta-cargo"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/hepta-tool-target"
          rustup run 1.96.0 cargo install --locked just --version 1.51.0 --root "$RUNNER_TEMP/hepta-tools"
          rustup run 1.96.0 cargo install --locked cargo-nextest --version 0.9.103 --root "$RUNNER_TEMP/hepta-tools"
          echo "$RUNNER_TEMP/hepta-tools/bin" >> "$GITHUB_PATH"
          rustup run 1.96.0 rustc -Vv > "$RUNNER_TEMP/publication-observations/rustc.txt"
      - name: Actual owner regression and exact tested delivery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time

          repo = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'publication-observations'
          relative = 'codex-rs/hepta-learning-artifacts/src/owner_service.rs'
          path = repo / relative
          base = os.environ['SOURCE_SHA']
          branch = 'fix/artifact-publication-retry-binding-20261007'
          result = {'schema': 'hepta-publication-retry-native-v1', 'base': base,
                    'passed': False, 'delivered': False, 'ordinary_hepta_pon_entry': False,
                    'model_benefit': False, 'production_activation': False, 'commands': []}
          def save():
              (out / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def identity():
              assert not git('status', '--porcelain'), 'source changed during execution'
              return {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}')}
          def replace_once(text, old, new):
              assert text.count(old) == 1, 'exact source splice differs'
              return text.replace(old, new, 1)
          def command(label, args, cwd):
              before = identity()
              started = time.monotonic_ns()
              with (out / (label + '.log')).open('wb') as stream:
                  process = subprocess.run(args, cwd=cwd, stdout=stream, stderr=subprocess.STDOUT)
              after = identity()
              assert before == after
              record = {'label': label, 'argv': args, 'exit_code': process.returncode,
                        'wall_ns': time.monotonic_ns() - started, 'source_before': before,
                        'source_after': after}
              result['commands'].append(record)
              save()
              return process.returncode, (out / (label + '.log')).read_text(errors='replace')
          def commit(message):
              assert set(git('diff', '--name-only').splitlines()) == {relative}
              subprocess.run(['git', 'diff', '--check'], check=True)
              subprocess.run(['git', 'add', '--', relative], check=True)
              subprocess.run(['git', '-c', 'user.name=OpenAI', '-c', 'user.email=noreply@openai.com',
                              'commit', '-m', message], check=True)
              return identity()
          save()
          assert identity()['commit'] == base
          original = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest() == '1427589355efa2ea3ac12cc076d0e9a028b29f0b'
          (out / 'owner-service-before.rs').write_bytes(original)
          subprocess.run(['git', 'switch', '-c', branch], check=True)
          text = original.decode()
          old = '        let retry = service.publish(request.clone()).fixture("terminal retry");\n'
          regression = '''        let mut changed_payload = request.clone();
                  changed_payload.payload[0] ^= 1;
                  let mut truncated = request.clone();
                  truncated.payload.truncate(truncated.payload.len() - 1);
                  let mut extended = request.clone();
                  extended.payload.push(0);
                  let mut changed_manifest = request.clone();
                  changed_manifest.admission.validated_manifest.manifest.training_code_digest =
                      digest("changed-code-with-retained-admission-digest");
                  let mut changed_admission_time = request.clone();
                  changed_admission_time.admission.admitted_at += 1;
                  let before_conflicts = service.registry().snapshot().head_digest;
                  for changed in [changed_payload, truncated, extended, changed_manifest, changed_admission_time] {
                      assert!(matches!(service.publish(changed), Err(LearningArtifactOwnerServiceError::RequestMismatch)),
                          "same publication operation must refuse changed request bytes");
                      assert_eq!(service.registry().snapshot().head_digest, before_conflicts);
                      assert!(service.recovery_required().is_none());
                  }
          '''
          # The embedded block has workflow indentation, normalized before insertion.
          lines = regression.splitlines()
          regression = '\n'.join([lines[0]] + [line[10:] if line.startswith('          ') else line for line in lines[1:]]) + '\n'
          text = replace_once(text, old, regression + old)
          text = replace_once(text, '        let current = request.signed_current_head;\n',
                              '        let current = request.signed_current_head.clone();\n')
          text = replace_once(text, '        let reopened = LearningArtifactOwnerService::open(',
                              '        let mut reopened = LearningArtifactOwnerService::open(')
          marker = '        assert!(reopened.recovery_required().is_none());\n'
          cold = '''        let mut changed_after_reopen = request.clone();
                  changed_after_reopen.payload[0] ^= 1;
                  assert!(matches!(reopened.publish(changed_after_reopen), Err(LearningArtifactOwnerServiceError::RequestMismatch)),
                      "cold retry must bind the original publication bytes");
                  assert_eq!(reopened.publish(request.clone()).fixture("cold exact retry"), receipt);
                  let mut historical = request.clone();
                  historical.now = 2_000;
                  assert_eq!(reopened.publish(historical).fixture("historical receipt after manifest expiry"), receipt);
          '''
          lines = cold.splitlines()
          cold = '\n'.join([lines[0]] + [line[10:] if line.startswith('          ') else line for line in lines[1:]]) + '\n'
          text = replace_once(text, marker, marker + cold)
          path.write_text(text)
          # Format the changed file with the repository's fixed formatter; no unrelated files are rewritten here.
          subprocess.run(['rustup', 'run', '1.96.0', 'rustfmt', '--edition', '2024', str(path)], check=True)
          result['red_source'] = commit('test(artifacts): bind completed publication retries to actual request bytes\n\nKeep the existing actual publication/reopen test and add changed payload, extent, manifest and admission-time controls plus exact cold and expired historical receipt replay. This test-only predecessor is expected to fail on the old owner; it is not a production release.')
          test = ['just', 'test', '-p', 'codex-hepta-learning-artifacts', '--locked',
                  '-E', 'test(=owner_service::tests::named_owner_service_publishes_retries_and_reopens_from_current_head)', '--status-level', 'pass']
          code, log = command('red-owner-retry', test, repo / 'codex-rs')
          assert code != 0 and 'same publication operation must refuse changed request bytes' in log, 'old implementation did not reproduce the requested failure'
          result['red_reproduced'] = True
          text = path.read_text()
          old = '    Ok(())\n}\n\nfn rebuild_transaction('
          guard = '''    // Revalidate the immutable admission at its original time and head.
              // An acknowledged replay observes an old fact, not new publication
              // authority: a later expiry or withdrawal must not erase that receipt.
              crate::verify_artifact_admission_v3(
                  &request.admission,
                  checkpoint.withdrawal_head_digest,
                  request.admission.admitted_at,
              )
              .map_err(|_| LearningArtifactOwnerServiceError::RequestMismatch)?;
              let manifest = &request.admission.validated_manifest.manifest;
              if u64::try_from(request.payload.len()).ok() != Some(manifest.encoded_size_bytes)
                  || Digest32::of_bytes(&request.payload) != manifest.bytes_digest
              {
                  return Err(LearningArtifactOwnerServiceError::RequestMismatch);
              }
              Ok(())
          }

          fn rebuild_transaction('''
          lines = guard.splitlines()
          guard = '\n'.join([lines[0]] + [line[10:] if line.startswith('          ') else line for line in lines[1:]])
          text = replace_once(text, old, guard)
          path.write_text(text)
          subprocess.run(['just', 'fmt'], cwd=repo / 'codex-rs', check=True)
          (out / 'full-formatter.diff').write_bytes(subprocess.check_output(['git', 'diff']))
          # Restore only unrelated mechanical formatter output from this clean,
          # pinned checkout; no preexisting user edits or tests are discarded.
          unrelated = [p for p in git('diff', '--name-only').splitlines() if p != relative]
          if unrelated:
              subprocess.run(['git', 'restore', '--', *unrelated], check=True)
          result['formatter_unrelated_paths_restored'] = unrelated
          result['candidate'] = commit('fix(artifacts): verify historical admission and payload before replaying publication checkpoints\n\nBind immutable admission fields and actual payload length/digest even when the original operation is already acknowledged. Use the original admission time/head solely for historical integrity; normal incomplete publication still rechecks current withdrawal and expiry before continuing. Return RequestMismatch without overwriting or revoking the old receipt. Preserve the existing owner, journal, schema, authority posture and every original test. No new export grant, PoN adapter, trainer, registry or production activation.')
          code, log = command('green-owner-crate', ['just', 'test', '-p', 'codex-hepta-learning-artifacts', '--locked', '--status-level', 'pass'], repo / 'codex-rs')
          assert code == 0 and 'named_owner_service_publishes_retries_and_reopens_from_current_head' in log, 'full owner tests did not execute successfully'
          code, log = command('scoped-clippy', ['cargo', 'clippy', '--locked', '-p', 'codex-hepta-learning-artifacts', '--all-targets', '--', '-D', 'warnings'], repo / 'codex-rs')
          assert code == 0
          code, log = command('scoped-format', ['cargo', 'fmt', '-p', 'codex-hepta-learning-artifacts', '--', '--check'], repo / 'codex-rs')
          assert code == 0
          assert set(git('diff', '--name-only', base, 'HEAD').splitlines()) == {relative}
          result['candidate_after'] = identity()
          assert result['candidate'] == result['candidate_after']
          (out / 'product.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary', base, 'HEAD']))
          (out / 'owner-service-after.rs').write_bytes(path.read_bytes())
          binaries = []
          for binary in (Path(os.environ['CARGO_TARGET_DIR']) / 'debug/deps').glob('codex_hepta_learning_artifacts-*'):
              if binary.is_file() and os.access(binary, os.X_OK):
                  binaries.append({'name': binary.name, 'sha256': hashlib.sha256(binary.read_bytes()).hexdigest()})
          result['test_binaries'] = binaries
          assert binaries
          result['passed'] = True
          save()
          token = os.environ['GH_TOKEN']
          auth = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          os.environ.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                            GIT_CONFIG_VALUE_0=auth, GIT_TERMINAL_PROMPT='0')
          ref = 'refs/heads/' + branch
          assert not git('ls-remote', '--heads', 'origin', ref), 'refuse to overwrite a concurrently created product branch'
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + ref], check=True)
          assert git('ls-remote', '--heads', 'origin', ref).split()[0] == result['candidate']['commit']
          result['delivered'] = True
          result['branch'] = branch
          save()
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Preserve real failures and exact-source observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-publication-retry-native
          path: ${{ runner.temp }}/publication-observations/
          if-no-files-found: error
          retention-days: 30
