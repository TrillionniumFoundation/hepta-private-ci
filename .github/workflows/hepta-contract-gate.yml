name: Hepta contract gate

on:
  push:
    branches:
      - research/hcsn-n256-firststep-dense-oracle-dispatch-bridge-20261120-c06d
    paths:
      - .github/workflows/hepta-contract-gate.yml
      - qualification/hcsn_currentstate_n256_firststep_dense_oracle_dispatch_bridge/**
  workflow_call:
    inputs:
      profile:
        type: string
        default: qualification
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [qualification, development]
        default: qualification

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.ref_name != 'research/hcsn-n256-firststep-dense-oracle-dispatch-bridge-20261120-c06d' }}
    name: Validate canonical branch and contract metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate branch policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/branch-policy.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('docs/branch-policy.json').read_text())
          assert policy['defaultBranch'] == 'main'
          assert 'main' in policy['protectedBranches']
          stale = tuple(policy.get('deprecatedPatterns', ()))
          offenders = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              if path.name == 'hepta-contract-gate.yml':
                  continue
              text = path.read_text()
              for token in stale:
                  if token in text:
                      offenders.append(f'{path}: {token}')
          if offenders:
              raise SystemExit('deprecated branch trigger(s):\n' + '\n'.join(offenders))
          PY
      - name: Validate canonical contract and readiness documents
        env:
          VERIFICATION_PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          git diff --quiet
          git diff --cached --quiet
          if [ "$VERIFICATION_PROFILE" = qualification ]; then
            python3 scripts/hepta-technical-receipts.py verify
            python3 scripts/hepta-implementation-dossiers.py verify
          fi
          # Includes module, algorithm, readiness, CNS and HNMF checks.
          # Historical source evidence is revalidated only by qualification.
          python3 scripts/hepta-docs.py verify --profile "$VERIFICATION_PROFILE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

  hcsn-n256-one-shot:
    if: ${{ github.event_name == 'push' && github.ref_name == 'research/hcsn-n256-firststep-dense-oracle-dispatch-bridge-20261120-c06d' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UNIQUE_EXECUTION_KEY: hcsn-n256-firststep-dense-oracle-hosted-20261118-c06d-001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.3
      - name: Install exact binary numerical runtime
        run: python -m pip install --only-binary=:all: -r qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/requirements.txt
      - name: Verify dispatch bridge and original frozen source
        run: |
          python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_dispatch_bridge.verify_source
          python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_registered_bridge.verify_source
          python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.verify_source
      - name: Run original source controls
        run: |
          python -m unittest qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.test_launcher
          python -O -m unittest qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.test_launcher
      - name: Execute the original unique key once
        run: python -m qualification.hcsn_currentstate_n256_firststep_dense_oracle_hosted.launcher
      - name: Preserve SUCCESS or RED originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hcsn-n256-firststep-dense-oracle-hosted-001-dispatch-bridge
          path: qualification/hcsn_currentstate_n256_firststep_dense_oracle_hosted/RUN_OUTPUT
          if-no-files-found: error
          retention-days: 30
