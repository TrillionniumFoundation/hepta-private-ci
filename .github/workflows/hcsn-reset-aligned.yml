name: HCSN reset-aligned physical and law gradients

on:
  pull_request:
    paths:
      - qualification/hcsn_reset_aligned/**
      - qualification/hcsn_joint_dde/model.py
      - qualification/hcsn_joint_dde/graded.py
      - qualification/hcsn_boundary_audit/spatial_generator.py
      - qualification/hcsn_boundary_audit/refractory_transport.py
      - .github/workflows/hcsn-reset-aligned.yml

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical runtime
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run exact source checks and synthetic fit
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python -c 'import sys,numpy,scipy,torch; print(sys.version,numpy.__version__,scipy.__version__,torch.__version__)'
          python -B -m unittest qualification.hcsn_reset_aligned.test_model qualification.hcsn_reset_aligned.test_torch -v
          git diff --exit-code
