name: cognitive-types-remediation-pocket4
run-name: cognitive-types-remediation-pocket4 @ ${{ github.sha }}

on:
  push:
    branches: ['codex/cognitive-types-full-closure-20260927']
    paths:
      - '.github/workflows/cognitive-types-apply-pocket4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-types-remediation-pocket4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-and-format:
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 45
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = 'pocket4'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy

      - name: Export exact source and rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/cognitive-types-remediation-pocket4"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          git rev-parse HEAD^{tree} > "$evidence/source-tree.txt"
          git archive --format=tar HEAD codex-rs .github docs qualification scripts > "$evidence/source.tar"
          packages=(
            codex-hepta-cognitive-types
            codex-hepta-cognitive-read
            codex-hepta-cognitive-store
            codex-hepta-context-compiler
            codex-hepta-intelligence
            codex-hepta-memory-retrieval
            codex-hepta-compact-engine
            codex-hepta-memory
            codex-hepta-authbus
            codex-hepta-agentd
          )
          for package in "${packages[@]}"; do
            cargo fmt --manifest-path codex-rs/Cargo.toml --package "$package"
          done
          git diff --binary --no-ext-diff > "$evidence/rustfmt.patch"
          git diff --check > "$evidence/rustfmt-diff-check.log" 2>&1
          git status --short > "$evidence/worktree-status.txt"
          (
            cd "$evidence"
            sha256sum source.tar rustfmt.patch rustfmt-diff-check.log worktree-status.txt > SHA256SUMS
          )

      - name: Upload immutable remediation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-types-remediation-pocket4-${{ github.sha }}
          path: ${{ runner.temp }}/cognitive-types-remediation-pocket4
          if-no-files-found: error
          retention-days: 14
