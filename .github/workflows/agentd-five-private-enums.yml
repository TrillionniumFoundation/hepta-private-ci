name: Five private Agentd enum layouts with original normal and UID0 owner tests
on:
  push:
    branches: ["diagnostic/agentd-five-private-enums-v2-20261123"]
permissions:
  contents: read
env:
  BASE: d1ab8c895dbdceda956f7765da36e07a71c7f760
  CANDIDATE: 391b379f5225d28db21580f1df526a31f761dd2a
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 4
          persist-credentials: false
      - run: bash .github/scripts/agentd-enum-prepare.sh
      - run: python3 scripts/hepta_ci_toolchain.py --github-env "$GITHUB_ENV"
      - name: Exact corrected strict gate versus verified previous fixed baseline
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/enum-strict-target"
          python3 - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          path=Path('.github/scripts/agentd-enum-original-strict.zip')
          assert hashlib.sha256(path.read_bytes()).hexdigest()=='d882de6cb6ed659b17aa9877b1a38d36b4a9ec542b638af562c3373db58b7bc3'
          evidence=Path(os.environ['RUNNER_TEMP'])/'enum-evidence'
          with zipfile.ZipFile(path) as z:
              assert z.read('identity-base.txt').decode().strip()==os.environ['BASE']
              assert z.read('fixtures-base.txt')==(evidence/'fixtures-base.txt').read_bytes()
              for name in ['strict-base.log','strict-base.exit']:
                  (evidence/name).write_bytes(z.read(name))
          (evidence/'baseline-origin.txt').write_text('Unchanged original baseline from run 45131004390, artifact 14798057945.\n')
          PY
          for arm in candidate; do
            cd "$RUNNER_TEMP/enum-$arm"
            set +e
            cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-bellman-operator -p codex-hepta-agentd -p codex-hepta-shadow-qualification --all-targets -- -D warnings > "$RUNNER_TEMP/enum-evidence/strict-$arm.log" 2>&1
            code=$?
            set -e
            echo "$code" > "$RUNNER_TEMP/enum-evidence/strict-$arm.exit"
            tail -3 "$RUNNER_TEMP/enum-evidence/strict-$arm.log"
          done
          python3 "$RUNNER_TEMP/enum-driver.py" strict
      - if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: strict-enum-pair-${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/enum-evidence
  owner_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: bazel
      deployment: false
    env:
      CODEX_BAZEL_LINUX_TARGET_PLATFORM: "@rules_rs//rs/platforms:x86_64-unknown-linux-musl"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-musl
          cache-scope: bazel-test
      - run: bash .github/scripts/agentd-enum-prepare.sh
      - name: Build both original Agentd libtests and run exact normal and UID0 owner cases
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          for arm in base candidate; do
            cd "$RUNNER_TEMP/enum-$arm"
            ./.github/scripts/run-bazel-ci.sh --remote-download-toplevel --print-failed-action-summary -- build --show_result=1 --color=no --curses=no -- //codex-rs/hepta-agentd:hepta-agentd-unit-tests-bin |& tee "$RUNNER_TEMP/enum-evidence/build-$arm.log"
            binary=$(sed -nE 's/^  (bazel-bin\/[^ ]+)$/\1/p' "$RUNNER_TEMP/enum-evidence/build-$arm.log" | tail -1)
            test -x "$binary"
            cp -L "$binary" "$RUNNER_TEMP/agentd-enum-$arm"
            sha256sum "$RUNNER_TEMP/agentd-enum-$arm" > "$RUNNER_TEMP/enum-evidence/binary-$arm.txt"
            bash "$GITHUB_WORKSPACE/.github/scripts/agentd-enum-uid0.sh" "$arm"
          done
          if cmp -s "$RUNNER_TEMP/agentd-enum-base" "$RUNNER_TEMP/agentd-enum-candidate"; then exit 1; fi
          python3 "$RUNNER_TEMP/enum-driver.py" native
      - if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: native-enum-pair-${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/enum-evidence
