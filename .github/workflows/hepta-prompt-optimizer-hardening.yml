name: Hepta prompt optimizer hardening

on:
  pull_request:
    paths:
      - 'codex-rs/hepta-prompt-optimizer/**'
      - 'codex-rs/hepta-prompt-registry/**'
      - 'codex-rs/hepta-intelligence/src/prompt*'
      - 'codex-rs/hepta-agentd/src/prompt*'
      - 'docs/modules/prompt.optimizer/**'
      - 'scripts/hepta_prompt_optimizer*'
      - '.github/workflows/hepta-prompt-optimizer-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-optimizer-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  native:
    name: Prompt optimizer (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["source-head","base-merge"]' || '["source-head"]') }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct deterministic merge candidate
        id: merge
        if: matrix.lane == 'base-merge'
        uses: ./.github/actions/hepta-synthetic-merge
        with:
          base-sha: ${{ env.BASE_SHA }}
          source-sha: ${{ env.SOURCE_SHA }}
          pr-number: ${{ github.event.pull_request.number }}
          author-name: Hepta Docs CI
          author-email: hepta-docs-ci@users.noreply.github.com
          message: Synthetic merge
      - name: Record tested Git identity
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          test "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.sha || env.SOURCE_SHA }}"
          git diff --check
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev libssl-dev pkg-config
      - name: Install repository test runner
        id: runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Optimizer all-target compilation
        id: compile
        working-directory: codex-rs
        run: cargo check --locked --all-targets -p codex-hepta-prompt-optimizer
      - name: Optimizer library regressions
        if: always() && steps.runner.outcome == 'success'
        working-directory: codex-rs
        run: just test --locked --lib -p codex-hepta-prompt-optimizer
      - name: Product consumer compilation
        if: always() && steps.compile.outcome == 'success'
        working-directory: codex-rs
        run: cargo check --locked --all-targets -p codex-hepta-intelligence -p codex-hepta-agentd
      - name: Intelligence prompt integration regressions
        if: always() && steps.compile.outcome == 'success'
        working-directory: codex-rs
        run: just test --locked --lib -p codex-hepta-intelligence -E 'test(prompt_)'
      - name: Agentd prompt runtime regressions
        if: always() && steps.compile.outcome == 'success'
        working-directory: codex-rs
        run: just test --locked --lib -p codex-hepta-agentd -E 'test(prompt_runtime)'
      - name: Optimizer strict lint
        if: always() && steps.compile.outcome == 'success'
        working-directory: codex-rs
        run: cargo clippy --locked --all-targets -p codex-hepta-prompt-optimizer -- -D warnings
      - name: Retain source formatting diagnostics
        if: always() && steps.runner.outcome == 'success'
        working-directory: codex-rs
        run: cargo fmt --all -- --check
