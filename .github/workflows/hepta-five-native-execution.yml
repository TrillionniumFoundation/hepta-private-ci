name: Hepta five native backends and pinned historical model execution
on:
  push:
    branches: ["research/five-causal-experiments-20261013"]
    paths:
      - "scripts/memory_cell/five_causal_native.py"
      - "scripts/memory_cell/five_native_historical_smoke.py"
      - "scripts/memory_cell/test_five_causal_native.py"
      - "scripts/memory_cell/test_five_encoder_snapshot.py"
      - "scripts/memory_cell/five_reader_*.py"
      - "scripts/memory_cell/test_five_reader*.py"
      - "scripts/memory_cell/five_archived_torch_reference.py"
      - "scripts/memory_cell/five_group_search.py"
      - "scripts/memory_cell/test_five_group*.py"
      - "experiments/shared_stem_cell/execution.py"
      - ".github/workflows/hepta-five-native-execution.yml"
  pull_request:
    paths:
      - "scripts/memory_cell/five_causal_native.py"
      - "scripts/memory_cell/five_native_historical_smoke.py"
      - "scripts/memory_cell/test_five_causal_native.py"
      - "scripts/memory_cell/test_five_encoder_snapshot.py"
      - "scripts/memory_cell/five_reader_*.py"
      - "scripts/memory_cell/test_five_reader*.py"
      - "scripts/memory_cell/five_archived_torch_reference.py"
      - "scripts/memory_cell/five_group_search.py"
      - "scripts/memory_cell/test_five_group*.py"
      - "experiments/shared_stem_cell/execution.py"
      - ".github/workflows/hepta-five-native-execution.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: five-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-protocol-and-historical-diagnostic:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned offline worker libraries
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-five-native/source
          python3 -m venv /tmp/hepta-five-native-venv
          /tmp/hepta-five-native-venv/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu > /tmp/hepta-five-native/install-torch.log 2>&1
          /tmp/hepta-five-native-venv/bin/pip install -r scripts/memory_cell/requirements.txt packaging==25.0 cryptography==46.0.4 psutil==7.0.0 regex==2024.11.6 Jinja2==3.1.6 > /tmp/hepta-five-native/install-worker.log 2>&1
          /tmp/hepta-five-native-venv/bin/pip check | tee /tmp/hepta-five-native/pip-check.log
          /tmp/hepta-five-native-venv/bin/pip freeze > /tmp/hepta-five-native/environment.txt
          PYTHONPATH=scripts/memory_cell /tmp/hepta-five-native-venv/bin/python -c 'import five_causal_native, five_reader_response_learning, five_reader_response_trial, five_reader_adapter, five_reader_adapter_trial, five_archived_torch_reference, five_reader_evidence_pairs, five_reader_evidence_pair_trial; print("NATIVE_IMPORT_PREFLIGHT_OK")' | tee /tmp/hepta-five-native/import-preflight.log
      - name: Run every focused suite and require all before model execution
        run: |
          set -euo pipefail
          P=/tmp/hepta-five-native-venv/bin/python
          failed=0
          patterns=('test_full_cell_matrix.py' 'test_five_causal_experiments.py' 'test_five_causal_native.py' 'test_five_group*.py' 'test_five_reader_response.py' 'test_five_reader_adapter*.py' 'test_five_encoder_snapshot.py' 'test_five_reader_evidence_pairs.py')
          logs=(matrix-tests five-contract-tests native-tests group-tests response-tests adapter-tests encoder-snapshot-tests evidence-pair-tests)
          for i in "${!patterns[@]}"; do
            if "$P" -m unittest discover -s scripts/memory_cell -p "${patterns[$i]}" -v 2>&1 | tee "/tmp/hepta-five-native/${logs[$i]}.log"; then
              printf '%s\tpassed\n' "${patterns[$i]}" >> /tmp/hepta-five-native/suite-status.tsv
            else
              failed=1
              printf '%s\tfailed\n' "${patterns[$i]}" >> /tmp/hepta-five-native/suite-status.tsv
            fi
          done
          if ! "$P" -m py_compile scripts/memory_cell/five_causal_native.py scripts/memory_cell/five_native_historical_smoke.py scripts/memory_cell/test_five_causal_native.py scripts/memory_cell/five_reader_*.py scripts/memory_cell/test_five_reader*.py scripts/memory_cell/five_group_search.py scripts/memory_cell/test_five_group_batching.py scripts/memory_cell/test_five_encoder_snapshot.py experiments/shared_stem_cell/execution.py; then
            failed=1
          fi
          test "$failed" -eq 0
      - name: Retrieve already-produced original model material without new model downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip > /tmp/original-model-material.zip
          printf '%s  %s\n' 07b357cbb3362f4afa4dc1872ab7e28e8a46daaf338f2636fed8d40fbcee76af /tmp/original-model-material.zip | sha256sum -c -
      - name: Fit response-only candidate and target-shuffle control, then seal source-disjoint readout
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/hepta-five-native/response-process-resources.txt /tmp/hepta-five-native-venv/bin/python scripts/memory_cell/five_reader_response_trial.py /tmp/original-model-material.zip --work /tmp/reader-response-materials --output /tmp/hepta-five-native/response-learning 2>&1 | tee /tmp/hepta-five-native/response-execution.log
      - name: Reload saved response candidates through the existing native owner
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/hepta-five-native/adapter-replay-resources.txt /tmp/hepta-five-native-venv/bin/python scripts/memory_cell/five_reader_adapter_trial.py --root /tmp --reader-relative reader-response-materials/staged/clean/reader --study-relative hepta-five-native/response-learning --output /tmp/hepta-five-native/adapter-replay 2>&1 | tee /tmp/hepta-five-native/adapter-replay.log
          /tmp/hepta-five-native-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          for name in ('response-learning', 'adapter-replay'):
              report=json.loads((Path('/tmp/hepta-five-native')/name/'report.json').read_bytes())
              print(name, json.dumps(report, sort_keys=True))
          PY
      - name: Run actual frozen Reader and Head optimizer on explicitly historical data
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/hepta-five-native/process-resources.txt /tmp/hepta-five-native-venv/bin/python scripts/memory_cell/five_native_historical_smoke.py /tmp/original-model-material.zip /tmp/hepta-five-native/output 2>&1 | tee /tmp/hepta-five-native/native-execution.log
      - name: Diagnose and train conditional preferences on train and select only
        run: |
          set -euo pipefail
          /usr/bin/time -v -o /tmp/hepta-five-native/evidence-pair-process-resources.txt /tmp/hepta-five-native-venv/bin/python scripts/memory_cell/five_reader_evidence_pair_trial.py --staged /tmp/reader-response-materials/staged --prior-study /tmp/hepta-five-native/response-learning --output /tmp/hepta-five-native/evidence-pair-development 2>&1 | tee /tmp/hepta-five-native/evidence-pair-execution.log
          /tmp/hepta-five-native-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/hepta-five-native/evidence-pair-development/report.json').read_bytes())
          print('EVIDENCE_PAIR_RESULT', json.dumps(r, sort_keys=True))
          PY
      - name: Retain exact generating source and all failures, never pretrained weights
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/hepta-five-native/source
          git rev-parse HEAD > /tmp/hepta-five-native/source/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/hepta-five-native/source/tested-tree.txt
          cp scripts/memory_cell/five_causal_native.py scripts/memory_cell/five_native_historical_smoke.py scripts/memory_cell/test_five_causal_native.py scripts/memory_cell/test_five_encoder_snapshot.py scripts/memory_cell/five_reader_*.py scripts/memory_cell/test_five_reader*.py scripts/memory_cell/five_archived_torch_reference.py scripts/memory_cell/five_group_search.py scripts/memory_cell/test_five_group*.py experiments/shared_stem_cell/execution.py .github/workflows/hepta-five-native-execution.yml /tmp/hepta-five-native/source/
          (cd /tmp/hepta-five-native && find . -path './output/staged' -prune -o -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hepta-five-native-historical-not-confirmation
          path: |
            /tmp/hepta-five-native
            !/tmp/hepta-five-native/output/staged
          if-no-files-found: error
