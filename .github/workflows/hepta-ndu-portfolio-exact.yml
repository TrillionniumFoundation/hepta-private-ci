name: Hepta NDU portfolio exact-head native regression

on:
  pull_request:
    paths:
      # Native regressions depend on the direct Rust crates, lockfile, and
      # compiler/format configuration, not just three portfolio source files.
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/rust-toolchain.toml"
      - "codex-rs/.cargo/**"
      - ".cargo/**"
      - "codex-rs/rustfmt.toml"
      - "rustfmt.toml"
      # P0/P5 contract changes must re-qualify the exact integrated P3 Rust
      # source rather than reusing older native results on another Git SHA.
      - "qa/meta-network-scale/check_cell_codex_boundary.py"
      - "qa/meta-network-scale/test_cell_codex_boundary.py"
      - "qa/meta-network-scale/scale_matrix.py"
      - "qa/meta-network-scale/test_scale_matrix.py"
      - ".github/workflows/hepta-cell-codex-boundary.yml"
      - ".github/workflows/hepta-p5-scale-evidence-exact.yml"
      - "scripts/test_hepta_ndu_portfolio_ci.py"
      - ".github/workflows/hepta-ndu-portfolio-exact.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hepta-ndu-portfolio-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-native-ndu:
    name: NDU portfolio native on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check

      - name: Install repository-pinned Rust compiler and format tools
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt

      - name: Check native NDU formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-ndu -- --check

      - name: Execute every NDU Rust unit test with locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-ndu --lib -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/hepta-ndu-portfolio-test.log"
          # A successful command executing no tests is not a native receipt.
          grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed;' \
            "$RUNNER_TEMP/hepta-ndu-portfolio-test.log"

      - name: Enforce native NDU correctness lints
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path codex-rs/Cargo.toml \
            --all-targets -p codex-hepta-ndu -- -D clippy::correctness
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain exact native NDU regression log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-portfolio-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-ndu-portfolio-test.log
          if-no-files-found: ignore
          retention-days: 14
