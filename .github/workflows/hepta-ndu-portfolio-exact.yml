name: Hepta NDU portfolio exact-source qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-ndu/**"
      - "codex-rs/hepta-types/**"
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/hepta-ndu-portfolio-exact.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hepta-ndu-portfolio-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-source:
    name: NDU objective, risk and replay (non-authorizing)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout exact NDU source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust 1.95 toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy,rustfmt
      - name: Assert exact source and immutable workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(rustc --version | cut -d' ' -f2)" = "1.95.0"
          # Resolve the full locked graph; --no-deps misses stale transitive lock entries.
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Check unchanged NDU Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-ndu -- --check
      - name: Run every NDU crate unit test (not just portfolio smoke tests)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked --lib -p codex-hepta-ndu -- --test-threads=1
      - name: Strict NDU correctness Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-ndu --all-targets -- -D clippy::correctness -D clippy::await_holding_lock -D clippy::await_holding_invalid_type
      - name: Require no test or resolver mutated source
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
