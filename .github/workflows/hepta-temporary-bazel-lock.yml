name: hepta temporary dependency lock candidates

on:
  pull_request:
    paths:
      - .github/workflows/hepta-temporary-bazel-lock.yml

permissions:
  contents: read

concurrency:
  group: hepta-temporary-bazel-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate exact dependency lock candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: temporary-lock-candidate

      - name: Generate exact MODULE.bazel.lock candidate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/hepta-lock-candidate"
          just bazel-lock-update > "${RUNNER_TEMP}/hepta-lock-candidate/bazel-lock-update.log" 2>&1
          status=$?
          printf '%s\n' "${status}" > "${RUNNER_TEMP}/hepta-lock-candidate/bazel-lock-update.exit"
          if [[ -f MODULE.bazel.lock ]]; then
            cp MODULE.bazel.lock "${RUNNER_TEMP}/hepta-lock-candidate/MODULE.bazel.lock"
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"

      - name: Generate exact codex-rs/Cargo.lock candidate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/hepta-lock-candidate"
          (
            cd codex-rs
            cargo generate-lockfile
          ) > "${RUNNER_TEMP}/hepta-lock-candidate/cargo-lock-update.log" 2>&1
          status=$?
          printf '%s\n' "${status}" > "${RUNNER_TEMP}/hepta-lock-candidate/cargo-lock-update.exit"
          if [[ -f codex-rs/Cargo.lock ]]; then
            cp codex-rs/Cargo.lock "${RUNNER_TEMP}/hepta-lock-candidate/Cargo.lock"
          fi

      - name: Retain exact lock candidates
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-temporary-dependency-locks-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-lock-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
