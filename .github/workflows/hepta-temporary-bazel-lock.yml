name: hepta temporary Bazel lock candidate

on:
  pull_request:
    paths:
      - .github/workflows/hepta-temporary-bazel-lock.yml
      - codex-rs/Cargo.lock
      - MODULE.bazel
      - MODULE.bazel.lock

permissions:
  contents: read

concurrency:
  group: hepta-temporary-bazel-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: temporary-lock-candidate
      - name: Generate exact MODULE.bazel.lock candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hepta-lock-candidate"
          just bazel-lock-update > "${RUNNER_TEMP}/hepta-lock-candidate/bazel-lock-update.log" 2>&1
          cp MODULE.bazel.lock "${RUNNER_TEMP}/hepta-lock-candidate/MODULE.bazel.lock"
      - name: Retain exact lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-temporary-bazel-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-lock-candidate
          if-no-files-found: error
          retention-days: 2
