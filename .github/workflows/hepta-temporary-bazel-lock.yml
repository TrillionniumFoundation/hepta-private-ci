name: hepta temporary Bazel lock candidate

on:
  pull_request:
    paths:
      - .github/workflows/hepta-temporary-bazel-lock.yml
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/third_party/zip-9.0.0/**
      - MODULE.bazel
      - MODULE.bazel.lock

permissions:
  contents: read

concurrency:
  group: hepta-temporary-bazel-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.head_ref == 'fix/private-ci-zip-feature-isolation-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: temporary-lock-candidate
      - name: Generate exact MODULE.bazel.lock candidate
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/hepta-lock-candidate"
          mkdir -p "${output}"
          git rev-parse HEAD > "${output}/source-commit.txt"
          sha256sum codex-rs/Cargo.toml codex-rs/Cargo.lock > "${output}/source-inputs.sha256"
          just bazel-lock-update > "${output}/bazel-lock-update.log" 2>&1
          cp MODULE.bazel.lock "${output}/MODULE.bazel.lock"
          ./scripts/check-module-bazel-lock.sh > "${output}/bazel-lock-check.log" 2>&1
          ./.github/scripts/run_bazel_with_buildbuddy.py query 'deps(@crates//:zip, 4)' --output=build > "${output}/zip-generated-target.bazel" 2> "${output}/zip-generated-target.log"
          test -s "${output}/zip-generated-target.bazel"
      - name: Retain exact lock candidate and diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-temporary-bazel-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hepta-lock-candidate
          if-no-files-found: error
          retention-days: 2
