name: Hepta Windows federated final-use regression

on:
  pull_request:
    paths:
      - "codex-rs/ext/hepta-memory/src/cognitive/federation.rs"
      - "codex-rs/hepta-memory/src/cognitive_schema_tests.rs"
      - "codex-rs/utils/pty/src/win/conpty.rs"
      - "codex-rs/utils/pty/src/win/procthreadattr.rs"
      - ".github/workflows/hepta-windows-federation-revoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-federation-revoke:
    name: Exact federated final-use on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git config --global core.longpaths true
          exit $LASTEXITCODE
      - name: Checkout immutable pull-request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact HEAD
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install Linux D-Bus development headers for real native compilation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: "1.96.0"
      - name: Execute real federation and migrated-schema regressions
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-memory-extension \
            revoke_removes_prepared_federated_context_from_next_physical_send \
            -- --nocapture --test-threads=1 2>&1 | tee "$log"
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-memory --lib \
            cognitive_store::schema_tests::compiled_migrations_match_schema_oracle_and_weakened_trigger_is_rejected \
            -- --exact --nocapture --test-threads=1 2>&1 | tee -a "$log"
          # Fail closed if either selector matched no test.
          test "$(grep -Ec 'test result: ok\. 1 passed; 0 failed;' "$log")" -eq 2
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
