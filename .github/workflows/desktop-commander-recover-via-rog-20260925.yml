name: Temporary Desktop Commander recovery via ROG

on:
  push:
    branches:
      - ops/desktop-commander-recover-via-rog-20260925

permissions:
  actions: write

jobs:
  recover-via-rog:
    name: Restore desktop connector through ROG SSH
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 10
    steps:
      - name: Reinstall and relaunch on qian-qi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = rog

          remote_script=$(cat <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = qian-qi
          npm install --prefix "$HOME/.npm-global" @wonderwhy-er/desktop-commander@0.2.51
          dc_bin="$HOME/.npm-global/node_modules/.bin/desktop-commander"
          test -x "$dc_bin"
          mkdir -p "$HOME/.desktop-commander-device"
          log="$HOME/.desktop-commander-device/recovery-20260925.log"
          pkill -TERM -f 'desktop-commander.*remote|dist/index.js.*remote' 2>/dev/null || true
          sleep 3
          env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS setsid -f "$dc_bin" remote >"$log" 2>&1
          sleep 15
          pgrep -af 'desktop-commander.*remote|dist/index.js.*remote' >/dev/null || {
            tail -n 100 "$log" || true
            exit 1
          }
          REMOTE
          )

          candidates=(
            p4-desktop
            qian-qi@p4-desktop
            192.168.0.4
            qian-qi@192.168.0.4
            qian-qi
            desktop
            qian-qi.local
            qian-qi@qian-qi
            qian-qi@desktop
          )
          if command -v tailscale >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1; then
            while IFS= read -r host; do
              [ -n "$host" ] && candidates+=("$host")
            done < <(tailscale status --json 2>/dev/null | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              raise SystemExit(0)
          for peer in data.get("Peer", {}).values():
              hostname = (peer.get("HostName") or "").lower()
              dns = (peer.get("DNSName") or "").lower()
              if "qian-qi" not in hostname and "qian-qi" not in dns:
                  continue
              if dns:
                  print("qian-qi@" + dns.rstrip("."))
              for ip in peer.get("TailscaleIPs", []):
                  print("qian-qi@" + ip)
          ')
          fi

          target=""
          for candidate in "${candidates[@]}"; do
            host_name=$(ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new "$candidate" hostname 2>/dev/null || true)
            if [ "$host_name" = qian-qi ]; then
              target="$candidate"
              break
            fi
          done
          test -n "$target"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$target" 'bash -s' <<<"$remote_script"

          for run_id in 36109602681 36110169120; do
            code=$(curl -sS -o "/tmp/cancel-$run_id.txt" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel")
            case "$code" in
              202|409) ;;
              *) cat "/tmp/cancel-$run_id.txt" || true ;;
            esac
          done
