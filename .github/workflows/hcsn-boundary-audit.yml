name: HCSN boundary audit checks

on:
  pull_request:
    paths:
      - qualification/hcsn_boundary_audit/**
      - qualification/hcsn_budget_baselines/**
      - .github/workflows/hcsn-boundary-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcsn-boundary-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.5.4 mpmath==1.3.0
          python -m pip install --disable-pip-version-check "torch==2.8.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Test audit admission and state budget controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          roots = ("qualification/hcsn_boundary_audit", "qualification/hcsn_budget_baselines")
          modules = sorted(str(p.with_suffix("")).replace("/", ".")
                           for root in roots for p in Path(root).glob("test_*.py"))
          if not modules:
              raise SystemExit("No audit tests were discovered")
          subprocess.run([sys.executable, "-m", "unittest", *modules, "-v"], check=True)
          PY
      - name: Install formatter entrypoint
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0
      - name: Apply repository formatting after tests
        working-directory: codex-rs
        run: |
          just fmt --base a83b2ecda37b0e18b05e7fedcaee0a63037c464f
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
