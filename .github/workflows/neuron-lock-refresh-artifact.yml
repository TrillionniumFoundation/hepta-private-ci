name: Neuron lock refresh artifact

on:
  push:
    branches:
      - codex/neuron-runtime-durable-closure-v1
    paths:
      - '.github/workflows/neuron-lock-refresh-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuron-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the existing lock graph without accepting source changes
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p codex-hepta-infer-worker-host --all-targets || true
          test -s Cargo.lock
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock"
          git diff -- Cargo.lock > "$RUNNER_TEMP/Cargo.lock.patch"
          test -s "$RUNNER_TEMP/Cargo.lock.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-lock-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Cargo.lock
            ${{ runner.temp }}/Cargo.lock.patch
          if-no-files-found: error
          retention-days: 3
