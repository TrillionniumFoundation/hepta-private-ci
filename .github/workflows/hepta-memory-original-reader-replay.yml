name: MemoryCell original reader-format source replay
on:
  pull_request:
    paths:
      - "scripts/memory_cell/historical_reader_format_source.py"
      - "scripts/memory_cell/test_historical_reader_format_source.py"
      - "scripts/memory_cell/frozen_source/reader_format_20261015_prompt.py.txt"
      - "scripts/memory_cell/frozen_source/reader_format_20261015_smol.py.txt"
      - "scripts/memory_cell/reconstruct_prompt_representation_raw.py"
      - "scripts/memory_cell/verify_prompt_representation_trial.py"
      - ".github/workflows/hepta-memory-original-reader-replay.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-original-reader-replay-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false
jobs:
  original-64-journal-source-proof:
    if: github.event.pull_request.number == 1452 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: scripts/memory_cell
      GH_TOKEN: ${{ github.token }}
      TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Pinned original source/snapshot tests, no inference
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reader-format-replay"
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
          python -m venv "$RUNNER_TEMP/reader-replay-venv"
          source "$RUNNER_TEMP/reader-replay-venv/bin/activate"
          python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir safetensors==0.6.2 Jinja2==3.1.6 regex==2026.9.29 packaging==25.0 numpy==1.26.4
          python -m pip freeze > "$RUNNER_TEMP/reader-format-replay/environment.txt"
          python -m unittest discover -s scripts/memory_cell \
            -p 'test_historical_reader_format_source.py' -v \
            2>&1 | tee "$RUNNER_TEMP/reader-format-replay/tests.log"
          sha256sum \
            scripts/memory_cell/frozen_source/reader_format_20261015_prompt.py.txt \
            scripts/memory_cell/frozen_source/reader_format_20261015_smol.py.txt \
            scripts/memory_cell/historical_reader_format_source.py \
            scripts/memory_cell/reconstruct_prompt_representation_raw.py \
            scripts/memory_cell/verify_prompt_representation_trial.py \
            > "$RUNNER_TEMP/reader-format-replay/source-SHA256SUMS"
          git rev-parse HEAD > "$RUNNER_TEMP/reader-format-replay/tested-head.txt"
      - name: Recover SHA-pinned ORIGINAL old model and event inputs
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11586991191/zip \
            > "$RUNNER_TEMP/original-smol.zip"
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11827287296/zip \
            > "$RUNNER_TEMP/original-events.zip"
          source "$RUNNER_TEMP/reader-replay-venv/bin/activate"
          python scripts/memory_cell/hf_original_parity.py stage \
            "$RUNNER_TEMP/original-smol.zip" "$RUNNER_TEMP/original-reader" \
            > "$RUNNER_TEMP/reader-format-replay/model-source-pins.json"
      - name: Reconstruct exact 64-call original journal from old code and sealed delta
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/reader-replay-venv/bin/activate"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from historical_reader_format_source import locked_reader_format
          from reconstruct_prompt_representation_raw import reconstruct, EXPECTED_DELTA_SHA256, EXPECTED_SHA256
          temp=Path(os.environ['RUNNER_TEMP'])
          original=locked_reader_format()
          assert len(original[2])==2
          recovered=reconstruct(
              temp/'original-events.zip',
              temp/'original-reader',
              Path('scripts/memory_cell/data/reader-format-64-20261015.tokens.xz.b64'),
              temp/'historical-original-64.jsonl',
              expected_delta_sha=EXPECTED_DELTA_SHA256,
          )
          assert recovered['reconstructed_original_rows']==64
          assert recovered['exact_original_journal_sha256']==EXPECTED_SHA256
          # Never publish the raw original question/answer journal from this job.
          report=dict(
              schema='hepta.memory.historical-64-source-provenance.v1',
              exact_tested_head=os.environ['TESTED_HEAD'],
              generating_source_pins=original[2],
              exact_old_raw_journal_sha256=EXPECTED_SHA256,
              originally_recorded_model_calls=64,
              new_model_calls=0,
              raw_questions_uploaded=False,
              reviewer_human_independent=False,
              production_accepted=False,
          )
          (temp/'reader-format-replay'/'receipt.json').write_text(
              json.dumps(report, indent=2)+'\n'
          )
          (temp/'historical-original-64.jsonl').unlink()
          PY
      - name: Retain sanitized source-bound proof even on failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reader-format-replay"
          rm -f "$RUNNER_TEMP/historical-original-64.jsonl"
          (cd "$RUNNER_TEMP/reader-format-replay" && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-original-64-historical-source-proof
          path: ${{ runner.temp }}/reader-format-replay
          if-no-files-found: error
