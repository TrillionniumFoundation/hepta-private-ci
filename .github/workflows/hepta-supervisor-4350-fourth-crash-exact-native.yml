name: "Hepta #4350 fourth-crash RestartBudgetExhausted exact native"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/hepta-supervisor-4350-fourth-crash-exact-native.yml"

permissions:
  contents: read

jobs:
  restart-budget-fourth-crash:
    name: "Exact #4350 fourth-crash on ${{ matrix.os }}"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/4350-supervisor-fourth-crash-exact-native-20261030'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      SOURCE_SHA: "2bcc4b6dd95fc4d3a3f8fdc88d42a4a55ef90a84"
      TEST_BLOB: "74953ac14440de0967faf58920fef8d907c8063e"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout immutable isolated candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "Reject any drift from #4350 source, test, or dependency locks"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "HEAD:codex-rs/hepta-supervisor/tests/restart_budget.rs")" = "$TEST_BLOB"
          for path in codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/hepta-supervisor/Cargo.toml MODULE.bazel MODULE.bazel.lock; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_SHA:$path")"
          done
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = ".github/workflows/hepta-supervisor-4350-fourth-crash-exact-native.yml"
          git diff --check "$SOURCE_SHA" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"

      - name: "Execute #4350 fourth-crash fail-closed contract"
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          cargo test --locked --manifest-path codex-rs/Cargo.toml \
            -p codex-hepta-supervisor --test restart_budget \
            unexpected_agent_crashes_back_off_and_stop_after_three_restarts \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed;' "$log"
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
