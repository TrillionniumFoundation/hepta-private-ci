name: runtime.fleet branch formatter

on:
  push:
    branches:
      - runtime-fleet/durable-owner-v1
    paths:
      - ".github/workflows/runtime-fleet-branch-formatter.yml"
      - "scripts/runtime_fleet_apply_admission_patch.py"
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"

permissions:
  contents: write

concurrency:
  group: runtime-fleet-branch-formatter
  cancel-in-progress: true

jobs:
  format-and-wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: runtime-fleet/durable-owner-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact daemon migration
        run: python3 scripts/runtime_fleet_apply_admission_patch.py

      - name: Format runtime.fleet source only
        working-directory: codex-rs
        run: cargo fmt --package codex-hepta-fleet --package codex-hepta-supervisor

      - name: Remove one-shot migration machinery
        run: |
          rm scripts/runtime_fleet_apply_admission_patch.py
          rm .github/workflows/runtime-fleet-branch-formatter.yml

      - name: Commit formatter and admission wiring
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --porcelain)"
          if test -z "$changed"; then
            echo "No migration changes"
            exit 0
          fi
          while IFS= read -r row; do
            path="${row:3}"
            case "$path" in
              codex-rs/hepta-fleet/*|codex-rs/hepta-supervisor/*|scripts/runtime_fleet_apply_admission_patch.py|.github/workflows/runtime-fleet-branch-formatter.yml)
                ;;
              *)
                echo "Unexpected formatter path: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          git config user.name "runtime.fleet migration"
          git config user.email "runtime-fleet-migration@users.noreply.github.com"
          git add -A -- \
            codex-rs/hepta-fleet \
            codex-rs/hepta-supervisor \
            scripts/runtime_fleet_apply_admission_patch.py \
            .github/workflows/runtime-fleet-branch-formatter.yml
          git commit -m "runtime.fleet: gate process effects at final use"
          git push origin HEAD:runtime-fleet/durable-owner-v1
