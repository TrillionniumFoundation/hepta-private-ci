name: MemoryCell real-project source-only pre-review cut
on:
  push:
    branches:
      - codex/memory-cell-evidence-20261008
    paths:
      - scripts/memory_cell/project_pr_source_precommit.py
      - scripts/memory_cell/test_project_pr_source_precommit.py
      - scripts/memory_cell/data/real-project-pr-source-cut-20261012.json
      - codex-rs/hepta-intelligence-eval/MEMORY_CELL_REAL_PROJECT_COHORT_20261012.md
      - .github/workflows/hepta-memory-real-project-source-cut.yml
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Source-only immutable-cut and contamination regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/memory_cell -p 'test_project_pr_source_precommit.py' -v
          python3 -m py_compile scripts/memory_cell/project_pr_source_precommit.py
      - name: Verify exact external Git metadata cut and emit unsigned reviewer questions
        run: |
          set -euo pipefail
          mkdir -p /tmp/project-pr-worklist
          python3 scripts/memory_cell/project_pr_source_precommit.py \
            scripts/memory_cell/data/real-project-pr-source-cut-20261012.json \
            --source-sha256 ef2a46ce037db4a91affddd2498eb8e089771ae5734bc13c56cb8a97b840a463 \
            --worklist /tmp/project-pr-worklist/unsigned-questions.json \
            | tee /tmp/project-pr-worklist/admission.json
          git rev-parse HEAD > /tmp/project-pr-worklist/source-commit.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/project-pr-worklist/admission.json').read_text())
          q=json.loads(Path('/tmp/project-pr-worklist/unsigned-questions.json').read_text())
          assert v['source_prs'] == 8 and v['families'] == 4
          assert v['partition_pr_counts'] == {'train': 2, 'selection': 2, 'evaluation': 4}
          assert v['model_calls'] == 0 and v['production_accepted'] is False
          assert len(q['cases']) == 16 and q['independent_semantic_review'] is False
          assert all(x['reviewer_verdict'] == 'unreviewed' and x['gold_answer_unavailable'] for x in q['cases'])
          PY
          (cd /tmp/project-pr-worklist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memorycell-real-project-unsigned-pre-review
          path: /tmp/project-pr-worklist
          if-no-files-found: error
