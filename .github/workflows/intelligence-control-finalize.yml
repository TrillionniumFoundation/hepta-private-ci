name: intelligence.control finalization

on:
  push:
    branches:
      - codex/intelligence-control-product-closure-20260926
    paths:
      - scripts/intelligence-control-finalize.py
      - .github/workflows/intelligence-control-finalize.yml

permissions:
  contents: write

concurrency:
  group: intelligence-control-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/intelligence-control-product-closure-20260926
          fetch-depth: 0
          persist-credentials: true

      - name: Validate one-shot patch syntax
        run: python3 -m py_compile scripts/intelligence-control-finalize.py

      - name: Apply daemon learning closure and refresh truth
        run: python3 scripts/intelligence-control-finalize.py

      - name: Commit exact generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          test -n "$(git status --porcelain)"
          git commit -m "feat(intelligence): compose daemon learning reconciliation"
          git push origin HEAD:codex/intelligence-control-product-closure-20260926
