name: automation-taskflow-focused

on:
  pull_request:
    paths:
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-operations/**
      - codex-rs/hepta-types/**
      - codex-rs/Cargo.lock
      - CALLERS.toml
      - docs/modules/automation.taskflow/**
      - qualification/module-execution-dossiers/detail/automation.taskflow.md
      - .github/workflows/automation-taskflow-focused.yml
  push:
    branches:
      - main
      - work/automation-taskflow-durable-causal-chain
    paths:
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-operations/**
      - codex-rs/hepta-types/**
      - codex-rs/Cargo.lock
      - CALLERS.toml
      - docs/modules/automation.taskflow/**
      - qualification/module-execution-dossiers/detail/automation.taskflow.md
      - .github/workflows/automation-taskflow-focused.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Rustfmt changed automation owners
        run: cargo fmt -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd -- --check
      - name: Check automation, operations and Agentd
        run: cargo check -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd
      - name: Verify privileged caller closure
        run: python3 ../scripts/verify_hepta_callers.py verify --root ..
      - name: Test kernel operation contract
        run: cargo test -p codex-hepta-operations
      - name: Test durable automation causal chain
        run: cargo test -p codex-hepta-automation --test durable_causal_chain
      - name: Test automation package
        run: cargo test -p codex-hepta-automation
      - name: Test automation qualification profile
        run: cargo test -p codex-hepta-automation --features taskflow-structural-qualification
      - name: Test Agentd library
        run: cargo test -p codex-hepta-agentd --lib
