name: automation-taskflow-focused

on:
  pull_request:
    paths:
      - CALLERS.toml
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-agent-protocol/**
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-operations/**
      - codex-rs/hepta-types/**
      - codex-rs/app-server-client/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - docs/modules/automation.taskflow/**
      - docs/readiness/LANE_B_*.md
      - qualification/module-execution-dossiers/detail/automation.taskflow.md
      - qualification/lane-b/LANE_B_NATIVE_CLOSURE.md
      - scripts/*automation*taskflow*.py
      - scripts/test_automation_recovery_sweeps.py
      - scripts/hepta_ci_exec.py
      - scripts/hepta_ci_v8.py
      - justfile
      - .github/workflows/automation-taskflow-*.yml
      - .github/workflows/blocking-ci.yml
  push:
    branches: [main]
    paths:
      - CALLERS.toml
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-agent-protocol/**
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-operations/**
      - codex-rs/hepta-types/**
      - codex-rs/app-server-client/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml
      - docs/modules/automation.taskflow/**
      - docs/readiness/LANE_B_*.md
      - qualification/module-execution-dossiers/detail/automation.taskflow.md
      - qualification/lane-b/LANE_B_NATIVE_CLOSURE.md
      - scripts/*automation*taskflow*.py
      - scripts/test_automation_recovery_sweeps.py
      - scripts/hepta_ci_exec.py
      - scripts/hepta_ci_v8.py
      - justfile
      - .github/workflows/automation-taskflow-*.yml
      - .github/workflows/blocking-ci.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A reusable invocation must not cancel the standalone or blocking caller.
concurrency:
  group: automation-taskflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEPTA_CI_LANE: source-head
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source_export:
    name: Export exact TaskFlow source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Package reviewed source inputs
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/automation-taskflow-source"
          mkdir -p "$export_dir"
          git archive --format=tar.gz \
            --output="$export_dir/exact-taskflow-source.tar.gz" \
            "$SOURCE_SHA" -- \
            codex-rs/hepta-automation/src/durable_neural_circuit.rs \
            codex-rs/hepta-automation/src/durable_neural_circuit_recovery.rs \
            codex-rs/hepta-automation/src/taskflow.rs \
            codex-rs/hepta-automation/src/taskflow_bounded.rs \
            codex-rs/hepta-automation/tests/durable_neural_circuit.rs \
            codex-rs/hepta-automation/tests/durable_neural_circuit_recovery.rs \
            codex-rs/hepta-automation/tests/taskflow.rs \
            codex-rs/hepta-automation/migrations/0022_durable_neural_circuit.sql \
            docs/modules/automation.taskflow \
            scripts/automation_taskflow_contract.py \
            scripts/automation_taskflow_truthful_finalize_20260929.py \
            scripts/automation_taskflow_layered_contract_20260929.py \
            scripts/automation_taskflow_source_last_mile_20260929.py.gz.b64 \
            .github/workflows/automation-taskflow-focused.yml \
            .github/workflows/automation-taskflow-selected-host.yml
          sha256sum "$export_dir/exact-taskflow-source.tar.gz" > "$export_dir/SHA256SUMS"
          printf '%s\n' "$SOURCE_SHA" > "$export_dir/COMMIT"
      - name: Retain exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-taskflow-source-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/automation-taskflow-source/
          if-no-files-found: error
          retention-days: 1

  focused:
    name: TaskFlow exact-source qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt

      - name: Install repository test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Prepare native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap libcap-dev pkg-config

      - name: Resolve verified V8 prerequisites
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      # Executes schema/document verification, test_verify_automation_taskflow_acceptance.py,
      # cargo fmt --check, locked compile, cargo clippy -D warnings, default and
      # structural tests, native recovery regressions, product and Bazel gates.
      # The contract remains required; its failure no longer hides native diagnostics.
      - name: Run real commands and retain their individual outcomes
        run: python3 scripts/automation_taskflow_commands.py --output-dir "$RUNNER_TEMP/automation-taskflow-records"

      - name: Produce read-only failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          records="$RUNNER_TEMP/automation-taskflow-records"
          mkdir -p "$records"
          git archive --format=tar.gz --output="$records/exact-taskflow-source.tar.gz" "$TESTED_SHA" -- \
            .github/workflows/automation-taskflow-focused.yml \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            codex-rs/rust-toolchain.toml \
            codex-rs/hepta-automation \
            codex-rs/hepta-agentd/src/automation.rs \
            codex-rs/hepta-agentd/src/automation_effect_host.rs \
            codex-rs/hepta-agentd/src/automation_recovery.rs \
            codex-rs/hepta-agentd/src/automation_recovery_review_tests.rs \
            codex-rs/hepta-agentd/src/state_control.rs \
            docs/modules/automation.taskflow \
            scripts/automation_taskflow_commands.py \
            scripts/automation_taskflow_contract.py

          format_root="$RUNNER_TEMP/automation-taskflow-format-worktree"
          cleanup() {
            git worktree remove --force "$format_root" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          rm -rf "$format_root"
          git worktree add --detach "$format_root" "$TESTED_SHA"
          (
            cd "$format_root/codex-rs"
            cargo fmt -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd
          )
          git -C "$format_root" diff --binary > "$records/rustfmt.patch"
          cleanup
          trap - EXIT

      - name: Verify qualification did not mutate source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retain exact command records and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-taskflow-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automation-taskflow-records/
          if-no-files-found: error
          retention-days: 30
