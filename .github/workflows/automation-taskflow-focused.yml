name: automation-taskflow-focused

on:
  push:
    branches:
      - main
    paths:
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-operations/**
      - codex-rs/hepta-types/**
      - codex-rs/agent-protocol/**
      - codex-rs/hepta-agent-protocol/**
      - codex-rs/model-provider/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - justfile
      - scripts/run-nextest.py
      - .github/workflows/automation-taskflow-focused.yml
  pull_request:
    paths:
      - codex-rs/hepta-automation/**
      - codex-rs/hepta-agentd/**
      - codex-rs/hepta-contracts/**
      - codex-rs/hepta-operations/**
      - codex-rs/hepta-types/**
      - codex-rs/agent-protocol/**
      - codex-rs/hepta-agent-protocol/**
      - codex-rs/model-provider/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - justfile
      - scripts/run-nextest.py
      - .github/workflows/automation-taskflow-focused.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Rustfmt changed automation owners
        run: cargo fmt -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd -p codex-model-provider -- --check
      - name: Check automation, operations and Agentd
        run: cargo check --locked -p codex-hepta-operations -p codex-hepta-automation -p codex-hepta-agentd -p codex-model-provider
      - name: Test kernel operation contract
        run: just test --locked -p codex-hepta-operations
      - name: Test automation package
        run: just test --locked -p codex-hepta-automation
      - name: Test automation qualification profile
        run: just test --locked -p codex-hepta-automation --features taskflow-structural-qualification
      - name: Test provider-effect adapter
        run: just test --locked -p codex-model-provider --lib
      - name: Test Agentd library
        run: just test --locked -p codex-hepta-agentd --lib
