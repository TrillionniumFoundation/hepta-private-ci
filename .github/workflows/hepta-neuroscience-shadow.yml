name: Hepta neuroscience shadow qualification

on:
  pull_request:
    paths:
      - "qualification/neuroscience-20261110/**"
      - ".github/workflows/hepta-neuroscience-shadow.yml"
  push:
    branches: [main]
    paths:
      - "qualification/neuroscience-20261110/**"
      - ".github/workflows/hepta-neuroscience-shadow.yml"

permissions:
  contents: read

jobs:
  shadow-mechanisms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate research-only mechanism gates
        run: python3 -m unittest discover -v -s qualification/neuroscience-20261110 -p 'test_*.py'
