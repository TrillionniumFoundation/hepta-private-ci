name: Hepta retrieval exact transport repair
on:
  push:
    branches: [work/memory-retrieval-hardening-20260927]
permissions:
  contents: read
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[retrieval-payload-repair-v1]')
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Repair only the pinned transport bytes without changing the patch pin
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: work/memory-retrieval-hardening-20260927
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TrillionniumFoundation/hepta-private-ci'
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git ls-remote --heads origin "$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          python3 scripts/hepta_memory_retrieval_repair_transport.py
          python3 scripts/hepta_memory_retrieval_apply_increment.py \
            --payload scripts/patches/memory_retrieval_runtime_v1.json \
            --sha256 3f8b5962fcc66093f58eedc790ac7cf4178d48931c844872929717ab849f061c \
            --extract "$RUNNER_TEMP/reviewed-runtime.patch"
          git add -- scripts/patches/memory_retrieval_runtime_v1.json
          test "$(git diff --cached --name-only)" = 'scripts/patches/memory_retrieval_runtime_v1.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(memory.retrieval): restore exact reviewed patch transport bytes; preserve original source pin'
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote --heads origin "$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
