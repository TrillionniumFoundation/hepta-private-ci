name: Memory retrieval provider and modes bootstrap

on:
  push:
    branches:
      - work/memory-retrieval-provider-modes-20260927
    paths:
      - scripts/apply_memory_retrieval_provider_modes.py
      - .github/workflows/memory-retrieval-provider-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: memory-retrieval-provider-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout exact provider branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: work/memory-retrieval-provider-modes-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Apply provider and mode composition
        run: python3 scripts/apply_memory_retrieval_provider_modes.py

      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Agentd tests
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-agentd

      - name: Strict Agentd Clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-agentd --all-targets -- -D warnings

      - name: Commit verified provider and modes
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_memory_retrieval_provider_modes.py
          rm .github/workflows/memory-retrieval-provider-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name "Hepta qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(memory.retrieval): compose leased provider and rollout modes"
          git push origin HEAD:work/memory-retrieval-provider-modes-20260927
