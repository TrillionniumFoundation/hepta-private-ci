name: bootstrap-runtime-codex-hardening

on:
  push:
    branches:
      - codex/runtime-codex-hardening-20260927
    paths:
      - scripts/bootstrap_runtime_codex_hardening.py
      - .github/workflows/bootstrap-runtime-codex-hardening.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bootstrap-runtime-codex-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout exact hardening branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/runtime-codex-hardening-20260927
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy

      - name: Install focused test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Expose DotSlash for integration tests
        run: sudo install -m 0755 "$(command -v dotslash)" /usr/local/bin/dotslash

      - name: Apply exact pre-effect compensation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/bootstrap_runtime_codex_hardening.py')
          value = path.read_text()
          value = value.replace(
              '"use codex_hepta_infer_core::durable_control::native::NativeOwnerAuthority;\\n",',
              '"pub use codex_hepta_infer_core::durable_control::native::NativeOwnerAuthority;\\n",',
          )
          value = value.replace(
              '"use codex_hepta_infer_core::durable_control::native::NativeOwnerAuthority;\\nuse codex_hepta_infer_core',
              '"pub use codex_hepta_infer_core::durable_control::native::NativeOwnerAuthority;\\nuse codex_hepta_infer_core',
          )
          value = value.replace(
              '\n    6,\n)\n# Two branches use a temporary `stopped` result',
              '\n    7,\n)\n# Two branches use a temporary `stopped` result',
          )
          value = value.replace(
              'codex_authority_witness_sha256: Some(\\"f\\".repeat(64)),',
              'codex_authority_witness_sha256: Some(\\"1\\".repeat(64)),',
              1,
          )
          path.write_text(value)
          PY
          python3 scripts/bootstrap_runtime_codex_hardening.py
          python3 - <<'PY'
          from pathlib import Path

          # Historical native-v1 events did not carry a proof opening. Keep
          # those records readable, but never upgrade them into a new exact
          # cross-owner proof.
          path = Path('codex-rs/hepta-infer-core/src/native_control.rs')
          value = path.read_text()
          value = value.replace(
              '        proof: NativePreEffectAbortProof,\n    },\n    Observe {',
              '        #[serde(default)]\n        proof: Option<NativePreEffectAbortProof>,\n    },\n    Observe {',
              1,
          )
          value = value.replace(
              '                proof: proof.clone(),\n            },',
              '                proof: Some(proof.clone()),\n            },',
              1,
          )
          old = '''                validate_pre_effect_abort_proof(record, &proof)?;
                record.pre_dispatch_stop = Some(reason);
                record.pre_effect_abort_proof = Some(proof);
                record.state = NativeReservationState::Released;'''
          new = '''                if let Some(proof) = proof {
                    validate_pre_effect_abort_proof(record, &proof)?;
                    record.pre_effect_abort_proof = Some(proof);
                }
                record.pre_dispatch_stop = Some(reason);
                record.state = NativeReservationState::Released;'''
          if value.count(old) != 1:
              raise SystemExit('legacy abort compatibility anchor mismatch')
          path.write_text(value.replace(old, new, 1))

          # Cover the legacy test dispatch whose authority witness is absent.
          path = Path('codex-rs/hepta-infer-worker-host/src/native_run_control_tests.rs')
          value = path.read_text()
          old = '''                codex_authority_witness_sha256: None,
            },'''
          new = '''                codex_authority_witness_sha256: None,
                pre_effect_abort_commitment_sha256: None,
            },'''
          if value.count(old) != 1:
              raise SystemExit('native dispatch fixture anchor mismatch')
          path.write_text(value.replace(old, new, 1))

          # Give the proof digest a named lifetime and make the comparison
          # straightforward for strict Clippy.
          path = Path('codex-rs/hepta-infer-worker-host/src/native_app_server.rs')
          value = path.read_text()
          old = ''') -> bool {
    receipt.phase == AgentRunPhase::Cancelled'''
          new = ''') -> bool {
    let proof_sha256 = proof.proof_sha256();
    receipt.phase == AgentRunPhase::Cancelled'''
          if value.count(old) != 1:
              raise SystemExit('Agentd abort receipt helper anchor mismatch')
          value = value.replace(old, new, 1)
          value = value.replace(
              '== Some(proof.proof_sha256().as_str())',
              '== Some(proof_sha256.as_str())',
              1,
          )
          path.write_text(value)
          PY
          cargo fmt --all
          git diff --check

      - name: Resolve verified V8 artifacts
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py

      - name: Test durable proof owner
        run: cargo test -p codex-hepta-infer-core

      - name: Test Agentd wire contract
        run: cargo test -p codex-hepta-agent-protocol

      - name: Test Agentd exact owner transition
        run: cargo test -p codex-hepta-agentd lane_b_runtime

      - name: Test runtime.codex product caller
        run: cargo test -p codex-hepta-infer-worker-host

      - name: Strict focused lint
        run: >-
          cargo clippy -p codex-hepta-infer-core -p codex-hepta-agent-protocol
          -p codex-hepta-agentd -p codex-hepta-infer-worker-host --tests -- -D warnings

      - name: Publish verified source commit
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/bootstrap_runtime_codex_hardening.py
          git rm .github/workflows/bootstrap-runtime-codex-hardening.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "runtime.codex: close exact pre-effect owner compensation"
          git push origin HEAD:codex/runtime-codex-hardening-20260927
