name: NDU bounded formatter and source evidence
on:
  push:
    branches: [codex/utility-ndu-production-hardening-20260926]
    paths: [".github/workflows/ndu-format-fix.yml"]
permissions:
  contents: write
concurrency:
  group: ndu-one-shot-rustfmt
  cancel-in-progress: true
jobs:
  repair-and-export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TARGET_BRANCH: codex/utility-ndu-production-hardening-20260926
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Apply bounded review patch and bind staged evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          git apply --check --index .github/ndu-review-repair.patch
          git apply --index .github/ndu-review-repair.patch
          (
            cd codex-rs
            rustfmt --edition 2024 --config-path rustfmt.toml \
              hepta-control-plane/tests/runtime_retirement_dependencies.rs \
              hepta-agentd/src/plasticity_learning_producer.rs \
              hepta-agentd/src/ndu_control.rs hepta-agentd/src/ndu_owner_tests.rs
          )
          git add -- codex-rs/hepta-control-plane/tests/runtime_retirement_dependencies.rs \
            codex-rs/hepta-agentd/src/plasticity_learning_producer.rs \
            codex-rs/hepta-agentd/src/ndu_control.rs codex-rs/hepta-agentd/src/ndu_owner_tests.rs
          mkdir -p "$RUNNER_TEMP/ndu-source-inspection"
          python3 scripts/test_hepta_ndu_qualification.py 2>&1 | tee "$RUNNER_TEMP/ndu-source-inspection/qualification-tests.log"
          python3 scripts/test_hepta_ndu_map_integrity.py 2>&1 | tee "$RUNNER_TEMP/ndu-source-inspection/integrity-tests.log"
          python3 - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          import subprocess
          primary_path = Path('docs/modules/utility.ndu/IMPLEMENTATION_MAP.json')
          primary = json.loads(primary_path.read_text())
          paths = [entry['path'] for entry in primary['sourceObjects']]
          if not paths or len(set(paths)) != len(paths):
              raise SystemExit('empty or duplicate source inventory')
          required = {
              'codex-rs/hepta-agentd/src/ndu_control.rs',
              'codex-rs/hepta-agentd/src/ndu_owner_tests.rs',
              'docs/modules/utility.ndu/IMPLEMENTATION_MAP_EXTENSIONS.json',
              'scripts/hepta-ndu-qualification.py',
              'scripts/test_hepta_ndu_qualification.py',
              '.github/workflows/hepta-ndu-recursion.yml',
          }
          if not required <= set(paths):
              raise SystemExit(f'missing reviewed evidence: {sorted(required-set(paths))}')
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          rebound = []
          for name in sorted(paths):
              path = PurePosixPath(name)
              if path.is_absolute() or path.as_posix() != name or '..' in path.parts or name == str(primary_path):
                  raise SystemExit(f'unsafe or self-referential path: {name}')
              oid = subprocess.check_output(['git', 'rev-parse', f'{tree}:{name}'], text=True).strip()
              if subprocess.check_output(['git', 'cat-file', '-t', oid], text=True).strip() not in {'blob', 'tree'}:
                  raise SystemExit(f'invalid evidence object: {name}')
              rebound.append({'path': name, 'object': oid})
          primary['sourceObjects'] = rebound
          primary_path.write_text(json.dumps(primary, indent=2) + '\n')
          print(f'Rebound unchanged {len(rebound)}-path inventory to staged tree {tree}')
          PY
          git add -- docs/modules/utility.ndu/IMPLEMENTATION_MAP.json
          python3 - <<'PY'
          import subprocess
          allowed = {
              'codex-rs/hepta-control-plane/tests/runtime_retirement_dependencies.rs',
              'codex-rs/hepta-agentd/src/plasticity_learning_producer.rs',
              'codex-rs/hepta-agentd/src/ndu_control.rs',
              'codex-rs/hepta-agentd/src/ndu_owner_tests.rs',
              'docs/modules/utility.ndu/IMPLEMENTATION_MAP.json',
              'docs/modules/utility.ndu/IMPLEMENTATION_MAP_EXTENSIONS.json',
              'docs/modules/utility.ndu/OPERATOR_RUNBOOK.md',
              'scripts/hepta-ndu-qualification.py',
              'scripts/test_hepta_ndu_qualification.py',
              '.github/workflows/hepta-ndu-recursion.yml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')) - {''}
          if not changed <= allowed:
              raise SystemExit(f'unexpected changes: {sorted(changed - allowed)}')
          if subprocess.check_output(['git', 'diff', '--name-only']):
              raise SystemExit('unstaged changes outside bounded repair')
          PY
          git diff --cached --check
          git config user.name hepta-qualification
          git config user.email qualification@invalid
          git commit -m 'fix(ndu): revalidate physical admission deadlines and qualify artifact lifecycle'
          python3 scripts/hepta-ndu-implementation-map-closed-world.py \
            --expected-sha "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse HEAD^{tree})" \
            | tee "$RUNNER_TEMP/ndu-source-inspection/closed-world.json"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Retain source snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ndu-source-inspection"
          mkdir -p "$out"
          git archive --format=tar.gz -o "$out/source.tar.gz" HEAD \
            codex-rs/hepta-ndu codex-rs/hepta-agentd codex-rs/hepta-agent-protocol \
            codex-rs/hepta-contracts codex-rs/hepta-control-plane \
            codex-rs/hepta-intelligence codex-rs/hepta-intelligence-eval \
            codex-rs/hepta-learning-artifacts codex-rs/hepta-learning-ledger \
            codex-rs/hepta-types codex-rs/Cargo.toml codex-rs/Cargo.lock \
            codex-rs/rust-toolchain.toml codex-rs/rustfmt.toml \
            docs/modules docs/readiness/NDU_SYSTEM_EXECUTION.md docs/learning/NDU_FBSDE_SPEC.md \
            scripts justfile .github/workflows/hepta-ndu-recursion.yml
          git rev-parse HEAD HEAD^{tree} > "$out/source-identity.txt"
          git status --porcelain > "$out/checkout-status.txt"
          sha256sum "$out/source.tar.gz" > "$out/source.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ndu-source-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/ndu-source-inspection
          if-no-files-found: error
          retention-days: 7
