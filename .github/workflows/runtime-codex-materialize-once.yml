name: runtime.codex materialize once

on:
  push:
    branches:
      - codex/runtime-codex-full-closure-20260929-r2
    paths:
      - .github/workflows/runtime-codex-materialize-once.yml
      - scripts/runtime-codex-process-crash-migration.py
      - scripts/runtime-codex-terminal-outbox-migration.py
      - scripts/runtime-codex-final-closure.py

permissions:
  contents: write

concurrency:
  group: runtime-codex-materialize-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Materialize the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          python3 scripts/runtime-codex-maintainer.py
          python3 scripts/runtime-codex-maintainer-followup.py
          python3 scripts/runtime-codex-durability-migration.py
          python3 scripts/runtime-codex-durability-fixup.py
          python3 scripts/runtime-codex-quarantine-migration.py
          python3 scripts/runtime-codex-deadline-migration.py
          python3 scripts/runtime-codex-cleanup-migration.py
          python3 scripts/runtime-codex-storage-fixup.py
          echo '--- generated process-crash migration identity ---'
          wc -l scripts/runtime-codex-process-crash-migration.py
          grep -n -E 'current-lease guarded run|def patch_native_execution|unguarded =|guarded_with_existing_lease' scripts/runtime-codex-process-crash-migration.py || true
          nl -ba scripts/runtime-codex-process-crash-migration.py | sed -n '430,525p'
          echo '--- generator diff ---'
          git diff -- scripts/runtime-codex-process-crash-migration.py
          exit 42
      - name: Commit exactly the materialized source
        if: ${{ success() }}
        shell: bash
        env:
          BRANCH: codex/runtime-codex-full-closure-20260929-r2
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime-codex-materialize-once.yml
          git config user.name 'runtime.codex exact-head materializer'
          git config user.email 'runtime-codex-materializer@invalid'
          git add -A
          git commit -m 'fix(runtime.codex): materialize durable convergence candidate'
          git push \
            --force-with-lease="refs/heads/${BRANCH}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${BRANCH}"
