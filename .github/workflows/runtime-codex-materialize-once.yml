name: runtime.codex materialize once

on:
  push:
    branches:
      - codex/runtime-codex-final-convergence-20260929-r3
    paths:
      - .github/workflows/runtime-codex-materialize-once.yml
      - scripts/runtime-codex-maintainer.py
      - scripts/runtime-codex-maintainer-followup.py
      - scripts/runtime-codex-durability-migration.py
      - scripts/runtime-codex-durability-fixup.py
      - scripts/runtime-codex-quarantine-migration.py
      - scripts/runtime-codex-deadline-migration.py
      - scripts/runtime-codex-cleanup-migration.py
      - scripts/runtime-codex-storage-fixup.py
      - scripts/runtime-codex-terminal-outbox-migration.py
      - scripts/runtime-codex-product-executor-migration.py
      - scripts/runtime-codex-product-executor-hardening.py
      - scripts/runtime-codex-structured-sequence-migration.py
      - scripts/runtime-codex-process-crash-migration.py
      - scripts/runtime-codex-qualification-fixup.py
      - scripts/runtime-codex-final-closure.py
      - scripts/runtime-codex-finalize-map.py
      - scripts/runtime-codex-finalize-map-followup.py

permissions:
  contents: write

concurrency:
  group: runtime-codex-materialize-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Materialize the exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          scripts=(
            scripts/runtime-codex-maintainer.py
            scripts/runtime-codex-maintainer-followup.py
            scripts/runtime-codex-durability-migration.py
            scripts/runtime-codex-durability-fixup.py
            scripts/runtime-codex-quarantine-migration.py
            scripts/runtime-codex-deadline-migration.py
            scripts/runtime-codex-cleanup-migration.py
            scripts/runtime-codex-storage-fixup.py
            scripts/runtime-codex-terminal-outbox-migration.py
            scripts/runtime-codex-product-executor-migration.py
            scripts/runtime-codex-product-executor-hardening.py
            scripts/runtime-codex-structured-sequence-migration.py
            scripts/runtime-codex-process-crash-migration.py
            scripts/runtime-codex-qualification-fixup.py
            scripts/runtime-codex-final-closure.py
          )
          python3 -m py_compile "${scripts[@]}" \
            scripts/runtime-codex-finalize-map.py \
            scripts/runtime-codex-finalize-map-followup.py
          for script in "${scripts[@]}"; do
            echo "materialize: ${script}"
            python3 "$script"
          done
          (
            cd codex-rs
            cargo fmt --all
          )
          git diff --check
          git status --short
      - name: Commit immutable source and map-only projection
        shell: bash
        env:
          WORK_BRANCH: codex/runtime-codex-final-convergence-20260929-r3
          TARGET_BRANCH: codex/runtime-codex-full-convergence-20260929
          TARGET_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'runtime.codex exact-head materializer'
          git config user.email 'runtime-codex-materializer@invalid'

          git rm .github/workflows/runtime-codex-materialize-once.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(runtime.codex): materialize durable convergence source'

          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          RUNTIME_CODEX_SOURCE_COMMIT="$source_commit" \
          RUNTIME_CODEX_SOURCE_TREE="$source_tree" \
            python3 scripts/runtime-codex-finalize-map.py
          RUNTIME_CODEX_SOURCE_COMMIT="$source_commit" \
          RUNTIME_CODEX_SOURCE_TREE="$source_tree" \
            python3 scripts/runtime-codex-finalize-map-followup.py
          git diff --check
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'docs(runtime.codex): bind immutable convergence source'
          fi

          git push \
            --force-with-lease="refs/heads/${WORK_BRANCH}:${GITHUB_SHA}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${TARGET_EXPECTED_SHA}" \
            origin \
            "HEAD:refs/heads/${WORK_BRANCH}" \
            "HEAD:refs/heads/${TARGET_BRANCH}"
