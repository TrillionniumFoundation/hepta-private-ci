name: setup-rusty-v8
description: Restore or download and verify Codex-built rusty_v8 artifacts.
inputs:
  target:
    description: Rust target triple with Codex-built V8 release artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve pinned rusty_v8 artifact identity
      id: identity
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        version="$(python3 "${GITHUB_WORKSPACE}/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
        profile="ptrcomp_sandbox_release"
        release_tag="rusty-v8-v${version}"
        base_url="https://github.com/openai/codex/releases/download/${release_tag}"
        binding_dir="${RUNNER_TOOL_CACHE}/runtime-codex-rusty-v8/${version}/${TARGET}"
        if [[ "$TARGET" == *-pc-windows-msvc ]]; then
          archive_name="rusty_v8_${profile}_${TARGET}.lib.gz"
        else
          archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
        fi
        binding_name="src_binding_${profile}_${TARGET}.rs"
        checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
        {
          echo "version=$version"
          echo "release_tag=$release_tag"
          echo "base_url=$base_url"
          echo "binding_dir=$binding_dir"
          echo "archive_name=$archive_name"
          echo "binding_name=$binding_name"
          echo "checksums_name=$checksums_name"
        } >> "$GITHUB_OUTPUT"

    - name: Restore verified rusty_v8 artifact cache
      id: cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.identity.outputs.binding_dir }}
        key: runtime-codex-rusty-v8-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.identity.outputs.version }}

    - name: Fetch if absent and verify exact artifact set
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        BASE_URL: ${{ steps.identity.outputs.base_url }}
        BINDING_DIR: ${{ steps.identity.outputs.binding_dir }}
        ARCHIVE_NAME: ${{ steps.identity.outputs.archive_name }}
        BINDING_NAME: ${{ steps.identity.outputs.binding_name }}
        CHECKSUMS_NAME: ${{ steps.identity.outputs.checksums_name }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        archive_path="${BINDING_DIR}/${ARCHIVE_NAME}"
        binding_path="${BINDING_DIR}/${BINDING_NAME}"
        checksums_path="${BINDING_DIR}/${CHECKSUMS_NAME}"
        mkdir -p "$BINDING_DIR"

        verify() {
          test -s "$archive_path"
          test -s "$binding_path"
          test -s "$checksums_path"
          test "$(wc -l < "$checksums_path")" -eq 2
          actual_names="$(tr -d '\r' < "$checksums_path" | awk '{name=$2; sub(/^\\*/, "", name); print name}' | LC_ALL=C sort)"
          expected_names="$(printf '%s\n%s\n' "$ARCHIVE_NAME" "$BINDING_NAME" | LC_ALL=C sort)"
          test "$actual_names" = "$expected_names"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$BINDING_DIR" && tr -d '\r' < "$CHECKSUMS_NAME" | sha256sum -c -)
          else
            (cd "$BINDING_DIR" && tr -d '\r' < "$CHECKSUMS_NAME" | shasum -a 256 -c -)
          fi
        }

        fetch_atomic() {
          local name="$1"
          local destination="${BINDING_DIR}/${name}"
          local temporary="${destination}.download-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -f "$temporary"
          curl --fail --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            "${BASE_URL}/${name}" -o "$temporary"
          test -s "$temporary"
          mv -f "$temporary" "$destination"
        }

        if ! verify >/dev/null 2>&1; then
          rm -f "$archive_path" "$binding_path" "$checksums_path"
          fetch_atomic "$ARCHIVE_NAME"
          fetch_atomic "$BINDING_NAME"
          fetch_atomic "$CHECKSUMS_NAME"
          verify
          source=release-download
        else
          source=verified-cache
        fi

        echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "$GITHUB_ENV"
        echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "$GITHUB_ENV"
        {
          echo '### rusty_v8 qualification input'
          echo
          echo "- target: \`$TARGET\`"
          echo "- source: \`$source\`"
          echo "- cache hit reported: \`${CACHE_HIT:-false}\`"
          echo "- checksum manifest: \`$CHECKSUMS_NAME\`"
          echo '- artifact and generated binding both passed the release checksum manifest'
        } >> "$GITHUB_STEP_SUMMARY"
