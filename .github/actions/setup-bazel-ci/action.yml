name: setup-bazel-ci
description: Prepare a Bazel CI runner with shared caches.
inputs:
  target:
    description: Target triple used for cache namespacing.
    required: true
outputs:
  repository-cache-path:
    description: Filesystem path used for the Bazel repository cache.
    value: ${{ steps.configure_bazel_repository_cache.outputs.repository-cache-path }}

runs:
  using: composite
  steps:
    - id: setup_ci
      uses: ./.github/actions/setup-ci

    # Isolated macOS x86_64 bootstrap: setup-bazel 0.19.0 could not resolve
    # the existing v1.28.1 Bazelisk asset (run 39788351726, job 119938624103).
    # Do not substitute an unpinned binary, lower the Bazel gate, or skip tests.
    - name: Install SHA-pinned macOS Intel Bazelisk 1.28.1
      if: runner.os == 'macOS' && runner.arch == 'X64'
      shell: bash
      env:
        PINNED_SHA256: 023225736cea5dc88f2b0807d5b1af4eb0f69a4ed45e3994b2c18c263bc80e48
      run: |
        set -euo pipefail
        pin_dir="${RUNNER_TEMP}/hepta-bazelisk-pinned"
        mkdir -p "$pin_dir"
        url="https://github.com/bazelbuild/bazelisk/releases/download/v1.28.1/bazelisk-darwin-amd64"
        curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 --proto "=https" --proto-redir "=https" "$url" --output "$pin_dir/bazel.tmp"
        printf '%s  %s\n' "$PINNED_SHA256" "$pin_dir/bazel.tmp" | shasum -a 256 -c -
        mv "$pin_dir/bazel.tmp" "$pin_dir/bazel"
        chmod 755 "$pin_dir/bazel"
        ln -s "$pin_dir/bazel" "$pin_dir/bazelisk"
        printf '%s\n' "$pin_dir" >> "$GITHUB_PATH"

    - name: Set up Bazel (macOS Intel verified pin)
      if: runner.os == 'macOS' && runner.arch == 'X64'
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        # A verified pinned launcher is already first on PATH. Passing a
        # version here would trigger the failing secondary resolution step.
        output-base: ${{ steps.setup_ci.outputs.bazel-output-base }}

    - name: Set up Bazel (other platforms)
      if: runner.os != 'macOS' || runner.arch != 'X64'
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      # Preserve existing pinned download, especially on Windows where the
      # standalone runner Bazel might ignore the repository .bazelversion.
      with:
        bazelisk-version: 1.28.1
        # Preserve explicit output-base relocation for all other platforms.
        output-base: ${{ steps.setup_ci.outputs.bazel-output-base }}

    - name: Configure Bazel repository cache
      id: configure_bazel_repository_cache
      shell: pwsh
      run: |
        "repository-cache-path=$env:BAZEL_REPOSITORY_CACHE" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Expose MSVC SDK environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Bazel exec-side Rust build scripts do not reliably inherit the MSVC developer
        # shell on GitHub-hosted Windows runners, so discover the latest VS install and
        # ask `VsDevCmd.bat` to materialize the x64/x64 compiler + SDK environment.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          throw "vswhere.exe not found"
        }

        $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
        if (-not $installPath) {
          throw "Could not locate a Visual Studio installation with VC tools"
        }

        $vsDevCmd = Join-Path $installPath 'Common7\Tools\VsDevCmd.bat'
        if (-not (Test-Path $vsDevCmd)) {
          throw "VsDevCmd.bat not found at $vsDevCmd"
        }

        # Keep the export surface explicit: these are the paths and SDK roots that the
        # MSVC toolchain probes need later when Bazel runs Windows exec-platform build
        # scripts such as `aws-lc-sys`.
        $varsToExport = @(
          'INCLUDE',
          'LIB',
          'LIBPATH',
          'PATH',
          'UCRTVersion',
          'UniversalCRTSdkDir',
          'VCINSTALLDIR',
          'VCToolsInstallDir',
          'WindowsLibPath',
          'WindowsSdkBinPath',
          'WindowsSdkDir',
          'WindowsSDKLibVersion',
          'WindowsSDKVersion'
        )
        $requiredVars = @(
          'INCLUDE',
          'LIB',
          'LIBPATH',
          'UniversalCRTSdkDir',
          'VCToolsInstallDir',
          'WindowsSdkDir'
        )

        # `VsDevCmd.bat` is a batch file, so invoke it under `cmd.exe`, suppress its
        # banner, then dump the resulting environment with `set`. Re-export only the
        # approved keys into `GITHUB_ENV` so later steps inherit the same MSVC context.
        # Windows environment names are case-insensitive, but Git Bash variable lookup
        # is not. Normalize every accepted key to the canonical spelling above before
        # handing it to the shell wrapper.
        $envLines = & cmd.exe /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $vsDevCmd)
        if ($LASTEXITCODE -ne 0) {
          throw "VsDevCmd.bat failed with exit code $LASTEXITCODE"
        }

        # PowerShell hashtable keys are case-insensitive, matching Windows
        # environment semantics while retaining the canonical key chosen above.
        $exportedValues = @{}
        foreach ($line in $envLines) {
          if ($line -notmatch '^(.*?)=(.*)$') {
            continue
          }

          $inputName = $matches[1]
          $value = $matches[2]
          $canonicalName = $varsToExport |
            Where-Object { $_ -ieq $inputName } |
            Select-Object -First 1
          if ($null -eq $canonicalName) {
            continue
          }

          if ($exportedValues.ContainsKey($canonicalName) -and
              $exportedValues[$canonicalName] -cne $value) {
            throw "VsDevCmd.bat returned conflicting values for $canonicalName"
          }
          $exportedValues[$canonicalName] = $value
        }

        $missingVars = @(
          $requiredVars | Where-Object {
            -not $exportedValues.ContainsKey($_) -or
            [string]::IsNullOrWhiteSpace($exportedValues[$_])
          }
        )
        if ($missingVars.Count -ne 0) {
          throw "VsDevCmd.bat did not provide required variables: $($missingVars -join ', ')"
        }

        foreach ($canonicalName in $varsToExport) {
          if ($exportedValues.ContainsKey($canonicalName)) {
            "$canonicalName=$($exportedValues[$canonicalName])" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }

    - name: Compute cache-stable Windows Bazel PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/compute-bazel-windows-path.ps1
