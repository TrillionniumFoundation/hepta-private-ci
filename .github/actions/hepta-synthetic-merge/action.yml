name: hepta-synthetic-merge
description: Construct a deterministic two-parent merge candidate from checked-out source
inputs:
  base-sha:
    description: Base commit SHA
    required: true
  source-sha:
    description: Pull request source commit SHA
    required: true
  pr-number:
    description: Pull request number used in the deterministic commit message
    required: true
  author-name:
    description: Synthetic commit author and committer name
    required: true
  author-email:
    description: Synthetic commit author and committer email
    required: true
  message:
    description: Synthetic commit message prefix
    required: true
outputs:
  sha:
    description: Synthetic merge commit SHA
    value: ${{ steps.merge.outputs.sha }}
  tree:
    description: Synthetic merge tree SHA
    value: ${{ steps.merge.outputs.tree }}
runs:
  using: composite
  steps:
    - name: Construct deterministic merge candidate
      id: merge
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        PR_NUMBER: ${{ inputs.pr-number }}
        AUTHOR_NAME: ${{ inputs.author-name }}
        AUTHOR_EMAIL: ${{ inputs.author-email }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        test -n "$BASE_SHA"
        test -n "$SOURCE_SHA"
        test -n "$PR_NUMBER"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        git cat-file -e "$BASE_SHA^{commit}"
        git cat-file -e "$SOURCE_SHA^{commit}"
        TREE="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_SHA")"
        [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
        export GIT_AUTHOR_NAME="$AUTHOR_NAME"
        export GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"
        export GIT_COMMITTER_NAME="$AUTHOR_NAME"
        export GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL"
        export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
        export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
        SHA="$(printf '%s for PR %s\n' "$MESSAGE" "$PR_NUMBER" | git commit-tree "$TREE" -p "$BASE_SHA" -p "$SOURCE_SHA")"
        [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
        git checkout --detach "$SHA"
        test "$(git rev-parse HEAD)" = "$SHA"
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        test "$(git rev-list --parents -n 1 HEAD)" = "$SHA $BASE_SHA $SOURCE_SHA"
        printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
        printf 'tree=%s\n' "$TREE" >> "$GITHUB_OUTPUT"
