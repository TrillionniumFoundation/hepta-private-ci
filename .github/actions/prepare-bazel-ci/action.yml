name: prepare-bazel-ci
description: Prepare a Bazel CI job with shared setup, repository cache restore, and execution logs.
inputs:
  target:
    description: Target triple used for setup and cache namespacing.
    required: true
  cache-scope:
    description: Logical namespace used to keep concurrent Bazel jobs from reserving the same repository cache key.
    required: true
  local-disk-cache:
    description: Restore a compiled-action cache for a job without BuildBuddy credentials.
    default: "false"
  disk-cache-scope:
    description: Optional action-cache namespace, including the shard when jobs share a repository cache.
    default: ""
outputs:
  disk-cache-path:
    description: Filesystem path used for the local Bazel action cache.
    value: ${{ steps.setup_bazel.outputs.disk-cache-path }}
  disk-cache-key:
    description: Source-specific Actions cache key for compiled actions.
    value: ${{ steps.cache_bazel_disk_key.outputs.disk-cache-key }}
  disk-cache-hit:
    description: Whether the compiled-action cache restore found the current source key.
    value: ${{ steps.cache_bazel_disk_restore.outputs.cache-hit }}
  repository-cache-path:
    description: Filesystem path used for the Bazel repository cache.
    value: ${{ steps.setup_bazel.outputs.repository-cache-path }}
  repository-cache-key:
    description: Primary actions/cache key for the Bazel repository cache.
    value: ${{ steps.cache_bazel_repository_key.outputs.repository-cache-key }}
  repository-cache-hit:
    description: Whether the Bazel repository cache restore found an exact key match.
    value: ${{ steps.cache_bazel_repository_restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Bazel CI
      id: setup_bazel
      uses: ./.github/actions/setup-bazel-ci
      with:
        target: ${{ inputs.target }}

    - name: Configure local Bazel action cache
      id: cache_bazel_disk_key
      if: inputs.local-disk-cache == 'true'
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.disk-cache-scope || inputs.cache-scope }}
        TARGET: ${{ inputs.target }}
        BAZEL_VERSION_HASH: ${{ hashFiles('.bazelversion') }}
        CACHE_HASH: ${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'codex-rs/Cargo.lock', '**/BUILD.bazel', '**/BUILD') }}
        DISK_CACHE_PATH: ${{ steps.setup_bazel.outputs.disk-cache-path }}
      run: |
        set -euo pipefail
        namespace="bazel-disk-v1-${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_SCOPE}-${TARGET}-${BAZEL_VERSION_HASH}"
        # A source generation can restore its predecessors and then save newly
        # compiled actions. Bazel's action digests validate restored outputs.
        echo "disk-cache-key=${namespace}-${CACHE_HASH}-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
        echo "disk-cache-graph-prefix=${namespace}-${CACHE_HASH}-" >> "${GITHUB_OUTPUT}"
        echo "disk-cache-restore-prefix=${namespace}-" >> "${GITHUB_OUTPUT}"
        echo "BAZEL_LOCAL_DISK_CACHE=${DISK_CACHE_PATH}" >> "${GITHUB_ENV}"

    - name: Restore local Bazel action cache
      id: cache_bazel_disk_restore
      if: inputs.local-disk-cache == 'true'
      continue-on-error: true
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.setup_bazel.outputs.disk-cache-path }}
        key: ${{ steps.cache_bazel_disk_key.outputs.disk-cache-key }}
        restore-keys: |
          ${{ steps.cache_bazel_disk_key.outputs.disk-cache-graph-prefix }}
          ${{ steps.cache_bazel_disk_key.outputs.disk-cache-restore-prefix }}

    - name: Configure fail-closed release lockdown root
      if: github.job == 'verify-release-build'
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          mkdir_root="$(cygpath -u "${RUNNER_TEMP}")/hepta-lockdown-root"
          lockdown_root="$(cygpath -m "${RUNNER_TEMP}")/hepta-lockdown-root"
        else
          mkdir_root="${RUNNER_TEMP}/hepta-lockdown-root"
          lockdown_root="${mkdir_root}"
        fi
        rm -rf "${mkdir_root}"
        mkdir -p "${mkdir_root}"
        chmod 700 "${mkdir_root}" || true
        printf 'HEPTA_LOCKDOWN_ROOT=%s\n' "${lockdown_root}" >> "${GITHUB_ENV}"

    - name: Compute bazel repository cache key
      id: cache_bazel_repository_key
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        TARGET: ${{ inputs.target }}
        CACHE_HASH: ${{ hashFiles('MODULE.bazel', 'codex-rs/Cargo.lock', 'codex-rs/Cargo.toml') }}
      run: |
        echo "repository-cache-key=bazel-cache-${CACHE_SCOPE}-${TARGET}-${CACHE_HASH}" >> "${GITHUB_OUTPUT}"
        echo "repository-cache-restore-key=bazel-cache-${CACHE_SCOPE}-${TARGET}-" >> "${GITHUB_OUTPUT}"

    # Restore the Bazel repository cache explicitly so external dependencies
    # do not need to be re-downloaded on every CI run. Keep restore failures
    # non-fatal so transient cache-service errors degrade to a cold build
    # instead of failing the job.
    - name: Restore bazel repository cache
      id: cache_bazel_repository_restore
      continue-on-error: true
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.setup_bazel.outputs.repository-cache-path }}
        key: ${{ steps.cache_bazel_repository_key.outputs.repository-cache-key }}
        restore-keys: |
          ${{ steps.cache_bazel_repository_key.outputs.repository-cache-restore-key }}

    - name: Set up Bazel execution logs
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/bazel-execution-logs"
        echo "CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR=${RUNNER_TEMP}/bazel-execution-logs" >> "${GITHUB_ENV}"
