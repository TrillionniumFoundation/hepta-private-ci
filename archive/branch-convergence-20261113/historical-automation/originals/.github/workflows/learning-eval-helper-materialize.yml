name: learning.eval isolated materializer

on:
  push:
    branches:
      - scratch/learning-eval-archive-ref-20260927
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-eval-isolated-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: fix/learning-eval-production-closure-20260927

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Materialize deterministic migrations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/apply-learning-eval-p0.py
          python scripts/apply-learning-eval-p1-p2.py
          python scripts/apply-learning-eval-closure-fixes.py
          python -m py_compile scripts/apply-learning-eval-p0.py scripts/apply-learning-eval-p1-p2.py scripts/apply-learning-eval-closure-fixes.py scripts/hepta-learning-eval-status.py scripts/hepta-learning-eval-evidence.py scripts/hepta-lane-e-closure.py
          python -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['docs/modules/learning.eval/IMPLEMENTATION_MAP.json','docs/modules/learning.eval/CURRENT_STATUS.json','docs/modules/learning.eval/TARGET_HOST_EVIDENCE_SCHEMA.json']]"
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-intelligence-eval --package codex-hepta-intelligence --package codex-hepta-agentd
          python scripts/hepta-learning-eval-status.py verify

      - name: Commit materialized implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add .github/workflows/hepta-lane-e-gap-closure.yml codex-rs/hepta-intelligence-eval codex-rs/hepta-agentd/src/intelligence_evaluation.rs codex-rs/hepta-intelligence/src/plasticity_product.rs docs/modules/learning.eval qualification/fixtures/learning-eval-private-api qualification/module-execution-dossiers/detail/learning.eval.md scripts/hepta-lane-e-closure.py scripts/hepta-learning-eval-evidence.py scripts/hepta-learning-eval-private-api.sh scripts/hepta-learning-eval-status.py
          git diff --cached --check
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -eq 0) { exit 0 }
          git config user.name hepta-learning-eval-ci
          git config user.email hepta-learning-eval-ci@users.noreply.github.com
          git commit -m "learning.eval: materialize production closure"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git pull --rebase origin fix/learning-eval-production-closure-20260927
            if ($LASTEXITCODE -ne 0) { throw "rebase failed on attempt $attempt" }
            git push origin HEAD:fix/learning-eval-production-closure-20260927
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (5 * $attempt)
          }
          throw 'failed to push materialized learning.eval closure after three attempts'
