[package]
name = "hepta-control-ui"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["http"]
http = ["dep:reqwest", "dep:zeroize"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
zeroize = { version = "1.8", optional = true }
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.27"
pretty_assertions = "1"
