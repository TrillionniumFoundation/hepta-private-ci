[publicSurfacePolicy]
typedContractsOnly = true
denyUnknownCriticalFields = true
rawModelOrSecretPayloadExportAllowed = false

[[rootBindings]]
path = "codex-rs/hepta-ndu"
mode = "exclusive"

[[cargoPackages]]
path = "codex-rs/hepta-ndu"
compileLayer = 1
ciGroups = ["learning", "objective"]
