name: Hepta Equal-Size Stem P0 source and observer gates (DENY_ALL)
'on':
  pull_request:
    paths:
      - 'qualification/stem-replacement-p0/**'
      - '.github/workflows/hepta-stem-equal-size-p0.yml'
  push:
    branches:
      - 'research/ettin400-equal-size-p0-20261016'
    paths:
      - 'qualification/stem-replacement-p0/**'
      - '.github/workflows/hepta-stem-equal-size-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stem-equal-size-p0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact source compilation and 50 synthetic/adversarial gates (normal)
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python -m py_compile gate.py test_gate.py preflight.py test_preflight.py
          python -m unittest -q test_gate test_preflight
      - name: Optimized Python cannot bypass fail-closed gates
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python -O -m unittest -q test_gate test_preflight
      - name: Review-only production isolation
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python - <<'PY'
          import gate
          assert gate.AUTHORITY == 'DENY_ALL'
          assert len(gate.MODELS) == 4
          for value in gate.MODELS.values():
              assert len(value[1]) == 40
          assert not any(hasattr(gate, s) for s in ('load_model','select_model','promote_model'))
          print('source_only=true production_authorized=false genuine_model_score=false')
          PY
  hub-metadata-only:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin only the metadata API dependency
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'huggingface_hub==0.36.0'
          python -m pip check
      - name: Pin real Hub commit and full tensor/LFS metadata (NO weight download)
        run: |
          set -euo pipefail
          cd qualification/stem-replacement-p0
          python preflight.py --out "$RUNNER_TEMP/metadata-only.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'metadata-only.json').read_text())
          assert r['disposition']=='HOLD_NO_GO'
          assert r['all_original_weights_downloaded'] is False
          assert len(r['models'])==4
          print('metadata_only=true four_sources=true original_weights_downloaded=false')
          PY
