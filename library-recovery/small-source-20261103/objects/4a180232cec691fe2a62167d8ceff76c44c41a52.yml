name: Hepta Stem V33 fold-disjoint original Cell Head OOF (DENY_ALL)

on:
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/v33_fold_disjoint_training.py'
      - 'qualification/stem-cell-v1/v33_independent_numpy_review.py'
      - 'qualification/stem-cell-v1/test_v33_fold_disjoint_training.py'
      - 'qualification/stem-cell-v1/test_v33_original_replay.py'
      - 'qualification/stem-cell-v1/STEM_V33_FOLD_DISJOINT_PROTOCOL.md'
      - 'qualification/stem-cell-v1/STEM_V33_FOLD_ONLY_NO_GO.json'
      - '.github/workflows/hepta-stem-v33-fold-disjoint.yml'
  push:
    branches:
      - research/stem-v33-fold-disjoint-preprocess-20261017
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stem-v33-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact PyTorch NumPy and safetensors CPU research environment
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'numpy==2.3.5' 'safetensors==0.7.0'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Validate verified parent owner and no-fold-leak mechanism
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git hash-object qualification/stem-cell-v1/v32_original_cell_learning.py)" = ae642d3a22949b026814610d5685502cfdd1ae22
          python -m py_compile qualification/stem-cell-v1/v33_fold_disjoint_training.py qualification/stem-cell-v1/v33_independent_numpy_review.py qualification/stem-cell-v1/test_v33_fold_disjoint_training.py qualification/stem-cell-v1/test_v33_original_replay.py
          cd qualification/stem-cell-v1
          python -m unittest -q test_v33_fold_disjoint_training
          python -O -m unittest -q test_v33_fold_disjoint_training

  physical-original-fold-disjoint:
    if: github.event_name == 'push' && github.ref_name == 'research/stem-v33-fold-disjoint-preprocess-20261017' && github.repository == 'TrillionniumFoundation/hepta-private-ci'
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact CPU original-training environment
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'numpy==2.3.5' 'safetensors==0.7.0'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip check
      - name: Reacquire original publisher mmBERT feature archive, authenticated only at Github
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          status="$(curl --fail --silent --show-error --retry 2 --proto '=https' --max-redirs 0 \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            --dump-header "$RUNNER_TEMP/v33-headers" --output /dev/null --write-out '%{http_code}' \
            'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/actions/artifacts/11890616195/zip')"
          test "$status" = '302'
          location="$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' "$RUNNER_TEMP/v33-headers" | tr -d '\r')"
          case "$location" in https://*) ;; *) echo 'Refusing non-HTTPS signed artifact' >&2; exit 1 ;; esac
          # Never forward GH_TOKEN to the external signed artifact destination.
          curl --fail --location --silent --show-error --retry 2 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/original-mmb.zip" "$location"
          unset location
          echo '0f3c8c2ceb22b61cabb8a08ca06d2fb0a9a7f4681e9f1af45138cf7979a0e1c7  '"$RUNNER_TEMP/original-mmb.zip" | sha256sum -c -
      - name: Retain only original TRAIN frozen features with V32 unchanged data admission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python qualification/stem-cell-v1/v32_original_cell_learning.py stage \
            --archive "$RUNNER_TEMP/original-mmb.zip" --out "$RUNNER_TEMP/v33-original-stage"
          echo '69bdb09bb235c9cf490da400e239c5d9fabe8e13327cb255721090ea47d2e096  '"$RUNNER_TEMP/v33-original-stage/train-source.json" | sha256sum -c -
          echo '2530b62d48b593cebeeb783c3ee754f8229b924558340dd09fb7160c6d1e3cc3  '"$RUNNER_TEMP/v33-original-stage/train-features.safetensors" | sha256sum -c -
          rm -f "$RUNNER_TEMP/original-mmb.zip"
          test ! -e "$RUNNER_TEMP/original-mmb.zip"
      - name: Execute 1440 genuine original-feature SGD/AdamW updates + independent NumPy audit
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          HEPTA_V33_STAGE: ${{ runner.temp }}/v33-original-stage
          HEPTA_V33_PUBLIC: ${{ runner.temp }}/v33-original-public-A.json
          HEPTA_V33_PRIVATE: ${{ runner.temp }}/v33-original-private-A.json
        run: |
          set -euo pipefail
          umask 077
          cd qualification/stem-cell-v1
          python v33_fold_disjoint_training.py --source "$HEPTA_V33_STAGE" \
            --output "$HEPTA_V33_PUBLIC" --private "$HEPTA_V33_PRIVATE"
          python v33_independent_numpy_review.py --source "$HEPTA_V33_STAGE" \
            --public "$HEPTA_V33_PUBLIC" --private "$HEPTA_V33_PRIVATE" \
            --output "$RUNNER_TEMP/v33-review-A.json"
          python -m unittest -q test_v33_original_replay
          python -O v33_fold_disjoint_training.py --source "$HEPTA_V33_STAGE" \
            --output "$RUNNER_TEMP/v33-original-public-B.json" \
            --private "$RUNNER_TEMP/v33-original-private-B.json"
          python -O v33_independent_numpy_review.py --source "$HEPTA_V33_STAGE" \
            --public "$RUNNER_TEMP/v33-original-public-B.json" \
            --private "$RUNNER_TEMP/v33-original-private-B.json" \
            --output "$RUNNER_TEMP/v33-review-B.json"
          HEPTA_V33_PUBLIC="$RUNNER_TEMP/v33-original-public-B.json" \
            HEPTA_V33_PRIVATE="$RUNNER_TEMP/v33-original-private-B.json" \
            python -O -m unittest -q test_v33_original_replay
          cmp "$RUNNER_TEMP/v33-review-A.json" "$RUNNER_TEMP/v33-review-B.json"
          cmp "$RUNNER_TEMP/v33-review-A.json" STEM_V33_FOLD_ONLY_NO_GO.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((path/'v33-original-private-A.json').read_text())
          b=json.loads((path/'v33-original-private-B.json').read_text())
          assert len(a['records'])==len(b['records'])==12
          for x,y in zip(a['records'],b['records']):
              for k in ('seed','fold','normalizer_sha256','fitted_case_ids','held_case_ids',
                        'weights_sha256','logits_sha256'):
                  assert x[k]==y[k],f'Original Head nonreproducible: {k}'
          original=json.loads((path/'v33-review-A.json').read_text())
          assert original['checkpoint_count']==48
          assert original['source_bound_model_prediction_count']==60
          assert original['physical_head_optimizer_updates_paid']==1440
          assert original['normalized_withheld_groups_used'] is False
          assert original['independent_source_time_windows']==0
          assert original['production_authorized'] is False
          print('Independent genuine original 48-fold-Head NumPy replay; HOLD/DENY_ALL')
          PY
      - name: Upload sanitized independent original OOF only, never private case, model or original bytes
        uses: actions/upload-artifact@v4
        with:
          name: stem-v33-fold-normalizer-original-NO_GO-${{ github.sha }}
          path: ${{ runner.temp }}/v33-review-A.json
          retention-days: 7
          if-no-files-found: error
