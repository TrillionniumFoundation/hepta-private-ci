name: hepta-stem-v26-original-physical-pixel-intervention-DENY_ALL

on:
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/v26_*.py'
      - 'qualification/stem-cell-v1/test_v26_*.py'
      - 'qualification/stem-cell-v1/STEM_V26_*'
      - '.github/workflows/hepta-stem-v26-original-pixel-lesion.yml'
  push:
    branches:
      - research/stem-v26-physical-vision-lesions-20261016
    paths:
      - 'qualification/stem-cell-v1/v26_*.py'
      - 'qualification/stem-cell-v1/test_v26_*.py'
      - 'qualification/stem-cell-v1/STEM_V26_*'
      - '.github/workflows/hepta-stem-v26-original-pixel-lesion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stem-v26-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  negative-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout precisely event head (no write credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute actual source-level fail-closed contracts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install Pillow==11.3.0
          python -m pip check
          cd qualification/stem-cell-v1
          python -m py_compile v26_real_pixel_lesion.py v26_original_pixel_review.py test_v26_original_pixel_lesion.py
          python -m unittest -v test_v26_original_pixel_lesion.SourceOnly 2>&1 | tee "$RUNNER_TEMP/v26-source-tests.txt"
          grep -F 'Ran 22 tests' "$RUNNER_TEMP/v26-source-tests.txt"
          grep -x 'OK' "$RUNNER_TEMP/v26-source-tests.txt"
          python -O -m unittest -v test_v26_original_pixel_lesion.SourceOnly 2>&1 | tee "$RUNNER_TEMP/v26-source-tests-opt.txt"
          grep -F 'Ran 22 tests' "$RUNNER_TEMP/v26-source-tests-opt.txt"
          grep -x 'OK' "$RUNNER_TEMP/v26-source-tests-opt.txt"
          # No original image/held-label materials in a PR source-only job.
          test ! -e /tmp/hepta-v26-public-source/private_labels/test_labels.jsonl

  authentic-model-pixel-interventions:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.event_name != 'pull_request'
    needs: negative-source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HEPTA_V26_ORIGINAL_ZIP: /tmp/hepta-v26-original-e3-sha11945106672.zip
      HEPTA_V26_ORIGINAL_SOURCES: /tmp/hepta-v26-public-source/inputs/sources.jsonl
      HEPTA_V26_ORIGINAL_FIT_LABELS: /tmp/hepta-v26-public-source/inputs/fit_labels.jsonl
      HEPTA_V26_ORIGINAL_LABELS: /tmp/hepta-v26-public-source/private_labels/test_labels.jsonl
      HEPTA_V26_IMAGES: /tmp/hepta-v26-public-source/images
    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact original E3 archive, without publisher labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11945106672/zip" > "$HEPTA_V26_ORIGINAL_ZIP"
          echo "7807b82d6c747b0b13666b330145e3801a8c8a0aadeee3f2ff7ab5f5c8c00a30  $HEPTA_V26_ORIGINAL_ZIP" | sha256sum -c -
      - name: Read-only immutable original E3 model/ScienceQA source checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/hepta-private-ci
          ref: b8b2f10fe38506972301e77e3836729a90200673
          path: exact-old-e3-model
          persist-credentials: false
      - name: Verify all four exact source files, reject substituted model code
        run: |
          set -euo pipefail
          old=exact-old-e3-model/experiments/shared_stem_cell
          test "$(git -C exact-old-e3-model rev-parse HEAD)" = 'b8b2f10fe38506972301e77e3836729a90200673'
          test "$(git hash-object "$old/e3_scienceqa_stage.py")" = '3ca8f55ed6b7143729258e4a1e53693614460950'
          test "$(git hash-object "$old/e3_scienceqa_contract.py")" = 'bd6d95ff957c3855b71a8778d7c13f61ff4d6a7a'
          test "$(git hash-object "$old/e3_granite_dino_real.py")" = 'b99c99d8e13a4d1899a0597d7733753fb3ce092a'
          test "$(git hash-object "$old/execution.py")" = '733da82a4bbbde1b256dfd1dbe4c05832dcd4856'
      - name: Install exact original E3 CPU pretrained runtime (no randomized fallback)
        run: |
          set -euo pipefail
          python -m venv /tmp/hepta-v26-venv
          /tmp/hepta-v26-venv/bin/pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/hepta-v26-venv/bin/pip install numpy==1.26.4 transformers==4.57.1 safetensors==0.6.2 \
            huggingface-hub==0.35.3 tokenizers==0.22.1 datasets==3.6.0 \
            pyarrow==19.0.1 Pillow==11.3.0 psutil==7.0.0 packaging==25.0
          /tmp/hepta-v26-venv/bin/pip check
          /tmp/hepta-v26-venv/bin/pip freeze > "$RUNNER_TEMP/v26-original-runtime-versions-private.txt"
          /tmp/hepta-v26-venv/bin/python -c 'from transformers import AutoImageProcessor, Dinov2Model; from datasets import load_dataset; from huggingface_hub import HfApi; print("PINNED_ORIGINAL_E3_PRETRAINED_CPU_APIS_READY")'
      - name: Recreate exact original 192 source identities and TEST label seals
        run: |
          set -euo pipefail
          /tmp/hepta-v26-venv/bin/python exact-old-e3-model/experiments/shared_stem_cell/e3_scienceqa_stage.py --output /tmp/hepta-v26-public-source
          echo "a561916c7d56b6677c5511c329a49bbeec94879f019d29f159ff59be83359202  $HEPTA_V26_ORIGINAL_SOURCES" | sha256sum -c -
          echo "e8506bc65f96501b6b2fa4e4ae04c094c2b6b17b353de528a051136569e2849e  $HEPTA_V26_ORIGINAL_FIT_LABELS" | sha256sum -c -
          echo "b15cb81cbce3ff500ec58bb7da59c92801170bbce3b7995d689342505161f6d3  $HEPTA_V26_ORIGINAL_LABELS" | sha256sum -c -
      - name: Original authenticated E3 ZIP and hardened source test suite
        env:
          PYTHONPATH: qualification/stem-cell-v1:exact-old-e3-model/experiments/shared_stem_cell
        run: |
          set -euo pipefail
          cd qualification/stem-cell-v1
          HEPTA_V26_ORIGINAL_ZIP="$HEPTA_V26_ORIGINAL_ZIP" /tmp/hepta-v26-venv/bin/python -m unittest -q test_v26_original_pixel_lesion
          HEPTA_V26_ORIGINAL_ZIP="$HEPTA_V26_ORIGINAL_ZIP" /tmp/hepta-v26-venv/bin/python -O -m unittest -q test_v26_original_pixel_lesion
      - name: Original real Granite97 and DINOv2 forwards, seal conditional BEFORE all-test image input
        env:
          PYTHONPATH: qualification/stem-cell-v1:exact-old-e3-model/experiments/shared_stem_cell
        run: |
          set -euo pipefail
          /tmp/hepta-v26-venv/bin/python qualification/stem-cell-v1/v26_real_pixel_lesion.py \
            --archive "$HEPTA_V26_ORIGINAL_ZIP" \
            --source "$HEPTA_V26_ORIGINAL_SOURCES" \
            --fit-labels "$HEPTA_V26_ORIGINAL_FIT_LABELS" \
            --images "$HEPTA_V26_IMAGES" --output "$RUNNER_TEMP/v26-private-physical"
          test -s "$RUNNER_TEMP/v26-private-physical/sealed-conditional-before-full-images.json"
          test -s "$RUNNER_TEMP/v26-private-physical/sealed-interventions-before-labels.json"
      - name: Separate original publisher TEST label review AFTER frozen predictions
        env:
          PYTHONPATH: qualification/stem-cell-v1:exact-old-e3-model/experiments/shared_stem_cell
        run: |
          set -euo pipefail
          /tmp/hepta-v26-venv/bin/python qualification/stem-cell-v1/v26_original_pixel_review.py \
            --archive "$HEPTA_V26_ORIGINAL_ZIP" --source "$HEPTA_V26_ORIGINAL_SOURCES" \
            --held-labels "$HEPTA_V26_ORIGINAL_LABELS" \
            --images "$HEPTA_V26_IMAGES" \
            --model-output "$RUNNER_TEMP/v26-private-physical" \
            --output "$RUNNER_TEMP/v26-sanitized-original-pixel-review.json"
          /tmp/hepta-v26-venv/bin/python - <<'PY'
          import os,json
          from pathlib import Path
          a=json.loads((Path(os.environ['RUNNER_TEMP'])/'v26-sanitized-original-pixel-review.json').read_text())
          assert a['original_publisher_labels_reopened_after_seal'] is True
          assert a['real_pixel_interventions_executed'] is True
          assert a['production_authorized'] is False and a['scientific_promotion_authorized'] is False
          assert a['authority_posture'] == 'DENY_ALL'
          assert a['precommitted_selected_test_images'] == 21
          print('HISTORICAL_PIXEL_EVIDENCE_VERIFIED_RESEARCH_DENY_ALL')
          PY
      - name: Upload only independently rescored numerical history, not image/text/label/weights
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-v26-real-original-pixel-lesion-sanitized-${{ github.sha }}
          path: ${{ runner.temp }}/v26-sanitized-original-pixel-review.json
          if-no-files-found: error
