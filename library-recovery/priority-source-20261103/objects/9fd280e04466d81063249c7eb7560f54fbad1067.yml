# Fixed source-head diagnostic only; never main/base-merge qualification.
name: taskflow-pending-cap source diagnostic
on:
  push:
    branches: [dot/taskflow-pending-cap-diagnostic-20261006]
permissions:
  contents: read
concurrency:
  group: taskflow-pending-cap-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dot/taskflow-pending-cap-diagnostic-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.sha }}
      TESTED_SHA: ${{ github.sha }}
      HEPTA_CI_LANE: source-head
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Bound setup and both test commands together
        shell: bash
        run: |
          echo "NATIVE_DEADLINE=$(( $(date +%s) + 3000 ))" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/taskflow-pending-cap-target" >> "$GITHUB_ENV"
      - timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify clean exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$RUNNER_TEMP/taskflow-pending-cap-records"
      - name: Install pinned native prerequisites
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev pkg-config
          rustup toolchain install 1.96.0 --profile minimal
      - timeout-minutes: 5
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Resolve existing verified V8 inputs
        timeout-minutes: 10
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: scripts
        run: python3 scripts/hepta_ci_v8.py
      - name: Test actual-worker pending capacity
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(( NATIVE_DEADLINE - $(date +%s) ))
          test "$remaining" -ge 30
          budget=$(( remaining < 2700 ? remaining : 2700 ))
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/taskflow-pending-cap-records/pending.json" --minimum-tests 3 --timeout-seconds "$budget" -- just test --locked -p codex-app-server-client --lib -E 'test(remote::pending_capacity_tests)'
      - name: Retain pending receipt before the second command
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taskflow-pending-cap-first-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taskflow-pending-cap-records/pending.json*
          if-no-files-found: error
          retention-days: 7
      - name: Test existing owned-client lifetime in same lib build
        if: ${{ !cancelled() && steps.pending.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(( NATIVE_DEADLINE - $(date +%s) ))
          test "$remaining" -ge 30
          budget=$(( remaining < 2700 ? remaining : 2700 ))
          python3 scripts/hepta_ci_exec.py --output "$RUNNER_TEMP/taskflow-pending-cap-records/lifetime.json" --minimum-tests 3 --timeout-seconds "$budget" -- just test --locked -p codex-app-server-client --lib -E 'test(remote::shutdown_lifetime_tests)'
      - name: Verify source remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Retain diagnostic receipts only
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taskflow-pending-cap-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taskflow-pending-cap-records/
          if-no-files-found: error
          retention-days: 7
