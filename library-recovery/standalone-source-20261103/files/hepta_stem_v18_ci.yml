name: hepta-stem-v18-grounded-utility-source-only

on:
  pull_request:
    paths:
      - 'qualification/stem-cell-v1/v14_reader_sufficiency_gate.py'
      - 'qualification/stem-cell-v1/test_v14_reader_sufficiency_gate.py'
      - 'qualification/stem-cell-v1/v15_system2_split_shadow.py'
      - 'qualification/stem-cell-v1/v16_reader_system2_bridge.py'
      - 'qualification/stem-cell-v1/v18_grounded_utility.py'
      - 'qualification/stem-cell-v1/test_v18_grounded_utility.py'
      - 'qualification/stem-cell-v1/STEM_V18_GROUNDED_SYSTEM2.md'
      - '.github/workflows/hepta-stem-v18-grounded-utility.yml'
  push:
    branches:
      - 'research/stem-v18-grounded-utility-20261016'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v18-original-grounding-and-system2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source identity and syntax
        run: |
          git rev-parse HEAD
          python -m py_compile qualification/stem-cell-v1/{v14_reader_sufficiency_gate,test_v14_reader_sufficiency_gate,v15_system2_split_shadow,test_v15_system2_split_shadow,v16_reader_system2_bridge,test_v16_reader_system2_bridge,v18_grounded_utility,test_v18_grounded_utility}.py
      - name: Source-only original V14.1 and V15/V16/V18 regressions
        run: |
          export PYTHONPATH=qualification/stem-cell-v1
          for pattern in test_v14_reader_sufficiency_gate.py test_v15_system2_split_shadow.py test_v16_reader_system2_bridge.py test_v18_grounded_utility.py; do
            python -m unittest discover -s qualification/stem-cell-v1 -p "$pattern" -v
            python -O -m unittest discover -s qualification/stem-cell-v1 -p "$pattern" -v
          done
          git diff --exit-code
